---
#include /includes/catalog-icon-vmware.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml

# The agnosticd config to use
env_type: sandbox
cloud_provider: vmc

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# What we use in this environment to get the packages we need
repo_method: satellite

remote_user: cloud-user
ansible_user: cloud-user

__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: VMware Cloud Public Cloud Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: OPEN_Cloud_Sandbox_VMWARE
      Provider: RHPDS
    parameters:
    - name: vmc_vcenter_student_ip
      description: Your external IP  to provide VCenter Access
      formLabel: Your External IP
      required: true
      openAPIV3Schema:
        type: string

  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 999h
    maximum: 999h
  secrets:
  - namespace: gpte
    name: satellite-rhel86-ha
  - namespace: gpte
    name: gpte-vmc
  - namespace: gpte
    name: gpte-ipa-vc
