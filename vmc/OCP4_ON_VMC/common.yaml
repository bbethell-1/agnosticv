---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-vmware.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/open-environment-annotation.yaml

platform: RHPDS

env_type: ocp4-cluster

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

repo_method: satellite

software_to_deploy: openshift4

# VMC specific vars
# output_dir also needs to be passed in by RHPDS or destroy has a bug
cloud_provider: vmc
remote_user: cloud-user
ansible_user: cloud-user

# OpenShift 4 (ocp4-cluster) specific vars
cluster_dns_zone: dynamic.opentlc.com
ocp4_base_domain: dynamic.opentlc.com

# Authentication
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 50
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
# After the role is updated this can be enabled
lets_encrypt_production: false

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
# - ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

agnosticv_meta:
  deploy_with: babylon
  # ansible_additional_args: -vvv
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e49d6400-22dc-44b4-b88a-2a160b81724d
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  aws_sandboxed: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift on VMware Cloud
    category: Workshops
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp410
    - vmware
    - vsphere
    - vmc
    labels:
      #OpenShift_Version: "4.9"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters: []
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel86-ha
  - namespace: gpte
    name: gpte-vmc
