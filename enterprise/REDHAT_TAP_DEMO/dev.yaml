---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
    scm_type: git

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_gitops_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_repo: https://github.com/treddy08/agnosticg.git
ocp4_workload_gitops_gitlab_import_repos:
- name: rhdh
  repo:
  - name: trusted-application-pipeline-templates
    url: https://github.com/redhat-gpte-devopsautomation/trusted-application-pipeline-templates.git
- name: summit-lab
  repo:
  - name: backstage-workshop
    url: https://github.com/treddy08/backstage-workshop.git
- name: gitops
  repo:
  - name: janus-idp-gitops
    url: https://github.com/treddy08/janus-idp-gitops.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_trusted_application_pipeline
# -------------------------------------------------------------------
ocp4_workload_trusted_application_pipeline_janus_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_trusted_application_pipeline_bootstrap
# -------------------------------------------------------------------
ocp4_workload_trusted_application_pipeline_bootstrap_janus_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/treddy08/rhtap-demo.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_trusted_profile_analyzer
# -------------------------------------------------------------------
ocp4_workload_trusted_profile_analyzer_namespace: trusted-profile-analyzer
ocp4_workload_trusted_profile_analyzer_minio_root_password: "{{ common_password }}"
ocp4_workload_trusted_profile_analyzer_keycloak_admin_password: "{{ common_password }}"
ocp4_workload_trusted_profile_analyzer_postgres_password: "{{ common_password }}"
ocp4_workload_trusted_profile_analyzer_postgres_tpa_password: "{{ common_password }}"
ocp4_workload_trusted_profile_analyzer_walker_client_secret: 5460cc91-4e20-4edd-881c-b15b169f8a79
ocp4_workload_trusted_profile_analyzer_testing_user_client_secret: 5460cc91-4e20-4edd-881c-b15b169f8a79
ocp4_workload_trusted_profile_analyzer_testing_manager_client_secret: 5460cc91-4e20-4edd-881c-b15b169f8a79
ocp4_workload_trusted_profile_analyzer_guac_password: "{{ common_password }}"
ocp4_workload_trusted_profile_analyzer_keycloak_realm_admin_password: "{{ common_password }}"
ocp4_workload_trusted_profile_analyzer_install_repo_name: trustification
ocp4_workload_trusted_profile_analyzer_install_repo_branch: v1.0.1
ocp4_workload_trusted_profile_analyzer_install_repo_url: https://github.com/trustification/trustification.git
