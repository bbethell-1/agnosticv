---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

gpu_instance_type: g6.16xlarge

ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    autoscale: true
    total_replicas: "{{ (num_users | int / 4) | round(0, 'ceil') | int }}"
    total_replicas_min: "{{ (num_users | int / 4) | round(0, 'ceil') | int }}"
    total_replicas_max: "{{ (num_users | int / 4) | round(0, 'ceil') | int + 1 }}"
    role: worker-gpu
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule
    instance_type: "{{ gpu_instance_type }}"

__meta__:
  sandbox_api:
    reservation: pgpu
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    workshopUiDisabled: false
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 5
          minimum: 5
          maximum: 20
  deployer:
    scm_ref: rh-tap-7.1
    scm_type: git
