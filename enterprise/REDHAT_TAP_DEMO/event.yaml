---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

num_users: 20

userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "rhdh_url": "https://backstage-backstage.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "rhdh_user": "user{{i}}",
    "rhdh_user_password": "{{ common_password }}",
    "gitlab_url": "https://gitlab-gitlab.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "gitlab_user": "user{{i}}",
    "gitlab_user_password": "{{ common_password }}",
    "devspaces_url": "https://devspaces.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "devspaces_user": "user{{i}}",
    "devspaces_user_password": "{{ common_password }}",
    "openshift_console_url": "https://console-openshift-console.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "openshift_admin_user": "admin",
    "openshift_admin_password": "{{ common_password }}",
    "openshift_api_url": "https://api.cluster-{{ guid }}{{ subdomain_base_suffix }}:6443",
    "argocd_url": "https://argocd-server-janus-argocd.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "argocd_user": "admin",
    "argocd_user_password": "{{ common_password }}",
    "tpa_console_url": "https://console-trusted-profile-analyzer.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "tpa_username": "admin",
    "tpa_password": "{{ common_password }}",
    "quay_console_url": "https://console-trusted-profile-analyzer.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "quay_admin_username": "quayadmin",
    "quay_admin_password": "{{ common_password }}",
    "quay_admin_token": "REDACTED",
    "acs_route": "https://central-stackrox.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "acs_portal_username": "admin",
    "acs_portal_password": "{{ common_password }}",
    "bastion_public_hostname": "bastion.{{ guid }}{{ subdomain_base_suffix }}",
    "bastion_ssh_user_name": "lab-user",
    "bastion_ssh_password": "{{ common_password }}"
    },
  {% endfor %}
  }

agnosticd_passthrough_user_data: |
  {{ {}
   | combine( {
     "users": userdata })
  }}

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: rh-tap-2.7-hotfix
    scm_type: git
