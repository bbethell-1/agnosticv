ocp4_workload_showroom_content_only: true

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  sandboxed: false
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: A86F5EFA-D127-463B-9E2B-D761122B4466
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Trusted Application Pipeline
    category: Demos
    keywords:
    - Janus
    - project-janus
    - developer-hub
    - gitops
    - openshift
    - backstage
    - tap
    - trusted-application-pipeline
    - tas
    - tssc
    - trusted
    - sigstore
    parameters:
    - name: rhdh_version
      description: Version of Developer Hub
      formGroup: Features
      formLabel: Developer Hub Version
      required: false
      openAPIV3Schema:
        type: string
        default: stable
        enum:
        - stable
        - latest
      annotation: demo.redhat.com/rhdh-version
      variable: rhdh_version
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '91'
  lifespan:
    default: 5d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 5d
    maximum: 999h
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhods-git-secret
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
