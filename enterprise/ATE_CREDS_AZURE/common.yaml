---
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/enterprise-premium-sla.yaml

platform: RHPDS

env_type: ent-demo-ate-azure-sandbox

agnosticd_open_environment: True

cloud_provider: azure

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    # infra_workloads: infra_workloads
    # aro_compute_count: worker_instance_count


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 3ee24f24-6c17-4674-903b-87052a14b4fb
  anarchy:
    namespace: babylon-anarchy-enterprise
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ATE Azure Creds
    category: Demos
    parameters: []
    keywords:
    - ent-demo-ate
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '90'
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-ate-demo-beta
    - rhpds-devs
  secrets:
  - name: azure_gpte
    namespace: gpte
