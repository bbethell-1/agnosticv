---
#include /includes/parameters/azure-region.yaml
#

platform: RHPDS

env_type: ent-demo-ate-azure-sandbox

agnosticd_open_environment: True

cloud_provider: azure

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    username: student_name
    # infra_workloads: infra_workloads
    # aro_compute_count: worker_instance_count


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ATE Azure Creds
    category: Demos
    keywords:
    - ent-demo-ate
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-ate-demo-beta
  secrets:
  - name: azure_gpte
    namespace: gpte
