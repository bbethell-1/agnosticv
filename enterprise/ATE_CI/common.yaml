---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO Manage Hybrid Cloud
# --- DEMO: Manage Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

cloud_provider: none
env_type: ent-demo-ate-binder
# get ssh key to add host if we need bastion access
# really should add proper ssh keys BEFORE deployment

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: Automate the Enterprise Early Access
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHPDS
    parameters: []
    #parameters:
    #  - name: aws_region
    #    required: true
    #    resourceIndexes:
    #      - 0
    #    formHideCondition: true == true
    #    openAPIV3Schema:
    #      type: string
    #     default: us-east-2
    #      enum:
    #        - us-east-2
  # Components to include in template and catalog item

  components:
    - name: ate-creds-aws
      display_name: Automate the Enterprise Creds AWS
      item: enterprise/ATE_CREDS_AWS
      propagate_provision_data:
        - var: ate_creds_aws_data

    - name: ate-creds-azure
      display_name: Automate the Enterprise Creds Azure
      item: enterprise/ATE_CREDS_AZURE
      propagate_provision_data:
        - var: ate_creds_azure_data

    - name: ate-base
      display_name: Automate the Enterprise Base
      item: enterprise/ATE_BASE
      propagate_provision_data:
        - var: ate_base_data

  access_control:
    allow_groups:
      - babylon-admins
      - babylon-devs
      - rhpds-ate-demo-beta
      - rhpds-devs

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
    virtualenv: ansible2.9-python3.6-2021-11-30

  secrets:
    - name: ent-demo-ate
      namespace: gpte
