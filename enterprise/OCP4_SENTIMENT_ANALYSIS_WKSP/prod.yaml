---

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type_family: m5a
master_instance_type_size: >-
  {{ '2xlarge' if worker_instance_count|int <= 20
  else '4xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"
master_storage_type: io1
master_storage_size: 250
worker_instance_type: "m6a.8xlarge"
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max\
  \ }}"
worker_storage_type: "gp3"
worker_storage_size: 250

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    #scm_url: https://github.com/btison/agnosticd.git
    scm_ref: sentiment-analysis-0.2
  catalog:
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 50
