---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/enterprise-premium-sla.yaml

# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO Automate the Hybrid Cloud
# --- DEMO: Automate the Hybrid Cloud
# -------------------------------------------------------------------

# Email template and description update 2022-10-03 02

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

cloud_provider: none
env_type: binder-sp-athc

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: Automate the Hybrid Cloud
    namespace: babylon-catalog-{{ stage | default('?') }}
    category: Demos
    keywords:
      - automate-the-hybrid-cloud
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Provider: RHDP
      Sales_Play: Automate_the_Hybrid_Cloud
      Featured_Score: '90'
    parameters: []

  components:

    - name: ate_base
      display_name: Automate the Enterprise Base
      item: enterprise/ATE_BASE
      propagate_provision_data:
        - var: ate_base_data

    - name: ate_creds_aws
      display_name: Automate the Enterprise Creds AWS
      item: enterprise/ATE_CREDS_AWS
      propagate_provision_data:
        - var: ate_creds_aws_data

    - name: ate_creds_azure
      display_name: Automate the Enterprise Creds Azure
      item: enterprise/ATE_CREDS_AZURE
      propagate_provision_data:
        - var: ate_creds_azure_data
# Disable actions on chained config that are handled by base.

  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
    virtualenv: ansible2.9-python3.6-2021-11-30

  secrets:
    - name: ent-demo-ate
      namespace: gpte
    - name: gpte-vmc
      namespace: gpte
