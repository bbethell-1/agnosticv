---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml
#include /includes/enterprise-premium-sla.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: convert-to-rhel
software_to_deploy: none
install_student_user: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/convert-to-rhel-bookbag.git
#ocp4_workload_bookbag_setup_git_version: main
#ocp4_workload_bookbag_setup_project: "rhel-bookbag-{{ guid }}"
#ocp4_workload_bookbag_user_image_namespace: "rhel-bookbag-{{ guid }}"
#ocp4_workload_bookbag_user_project: "rhel-bookbag-{{ guid }}"
#ocp4_workload_bookbag_user_userinfo_enable: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: aa0910ab-8431-44e8-9488-24d0d4d1df7e
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-devopsautomation/convert-to-rhel-bookbag
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Convert to RHEL
    category: Demos
    labels:
      Base_Component: 'True'
      Product_Family: Red_Hat_Enterprise_Linux
      Product: Red_Hat_Enterprise_Linux
      Provider: RHDP
      SLA: Enterprise_Premium
      Sales_Play: Standardize_on_Linux
      Featured_Score: '80'
    keywords:
      - Convert
      - RHEL
      - CENTOS
      - salesplay
      - SalesPlay
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
    - name: gpte
      namespace: gpte
