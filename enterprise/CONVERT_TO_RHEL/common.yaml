---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml
#include /includes/enterprise-premium-sla.yaml
#Change for new description
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: convert-to-rhel
software_to_deploy: none
install_student_user: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
ocp4_workload_bookbag_console_deploy: false
ocp4_workload_bookbag_namespace: "{{ guid }}"
ocp4_workload_bookbag_name: "rhel"
ocp4_workload_bookbag_git_url: https://github.com/redhat-gpte-devopsautomation/convert-to-rhel-bookbag.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
## Added custom email template
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: aa0910ab-8431-44e8-9488-24d0d4d1df7e
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: false
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Convert to RHEL
    category: Demos
    labels:
      Base_Component: 'True'
      Product_Family: Red_Hat_Enterprise_Linux
      Product: Red_Hat_Enterprise_Linux
      Provider: RHDP
      SLA: Enterprise_Premium
      Sales_Play: Standardize_on_Linux
      Featured_Score: '80'
    keywords:
      - Convert
      - RHEL
      - CENTOS
      - salesplay
      - SalesPlay
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: gpte
      namespace: gpte
