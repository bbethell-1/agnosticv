---
#include /enterprise/includes/enterprise-premium-sla.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel81.yaml

# -------------------------------------------------------------------
# --- Catalog Item: DevSecOps Validated Framework - Parallel
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"
num_users: 5
aws_region: us-east-2

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 3
worker_instance_type: m5.4xlarge

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: dev-admin
# --- student_password not set -> generate random password
student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: ansible.utils
    version: 2.7.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_authentication             # all segments
- ocp4_workload_rhacs_secured_cluster

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_06_06
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_controller_app_sync: 15s

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs_secured_cluster
# -------------------------------------------------------------------
ocp4_workload_rhacs_secured_cluster_install_operator_channel: "rhacs-3.73"

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  sandboxed: false
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3fcb0960-42f2-4404-9aca-d6a3f3df653d
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Securing The Software Supply Chain Prod Cluster
    category: Demos
    keywords:
    - Multi-cluster-DevSecOps
    - Securing-The-Software-Supply-Chain
    - devsecops
    - gitops
    - openshift
    - Observability
    - prod
    parameters: []
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  access_control:
    allow_groups:
    - rhpds-devs
  secrets:
  - name: rhods-git-secret
    namespace: gpte

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
