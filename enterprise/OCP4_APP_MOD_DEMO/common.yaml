---
#include /includes/catalog-icon-cloud-native.yaml
#include /enterprise/includes/parameters/purpose.yaml
#include /includes/parameters/aws-3regions.yaml
#include /enterprise/includes/parameters/salesforce-id.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /enterprise/includes/terms-of-service.yaml
#include /enterprise/includes/aws-sandbox-meta.yaml
#include /enterprise/includes/enterprise-premium-sla.yaml
#include /enterprise/includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
#include /enterprise/includes/ee-multicloud.yaml
# -------------------------------------------------------------------
# --- Catalog Item: Modernize Existing Applications
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.4xlarge
master_instance_count: 1
worker_instance_type: m6a.4xlarge
worker_instance_count: 1
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_machinesets
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_kubevirt
- ocp4_workload_app_mod_demo
- ocp4_workload_mta6
- ocp4_workload_mtv

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.12_2023_04_03

# -------------------------------------------------------------------
# Common Admin Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
# Add a MachineSet for AWS Bare Metal instances
ocp4_workload_machinesets_machineset_groups:
- name: metal
  role: metal
  instance_type: c5.metal
  autoscale: false
  total_replicas: 1
  total_replicas_min: 1
  total_replicas_max: 1
  machineConfigPool:
    setup: true
    maxPodsPerNode: 250
  taints:
  - key: metal
    value: "true"
    effect: NoSchedule

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable

ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kubevirt_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_kubevirt_workload_tolerations:
- key: metal
  operator: Exists

# -------------------------------------------------------------------
# ocp4_workload_app_mod_demo
# -------------------------------------------------------------------
ocp4_workload_app_mod_demo_legacy_namespace: appmod-rehost
ocp4_workload_app_mod_demo_modern_namespace: appmod-modern

ocp4_workload_app_mod_demo_image_postgresql: registry.redhat.io/rhel8/postgresql-13:1-91.1669834637

# -------------------------------------------------------------------
# ocp4_workload_mta6
# -------------------------------------------------------------------
ocp4_workload_mta6_namespace_base: openshift-mta

ocp4_workload_mta6_channel: stable-v6.0
ocp4_workload_mta6_starting_csv: mta-operator.v6.0.2
ocp4_workload_mta6_catalogsource_setup: true
ocp4_workload_mta6_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_mta6_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Needs to install rhsso separately, because installation via mta operator restults in
# non-deterministic behaviour on the installPlan csv name.
ocp4_workload_mta6_rhsso_channel: stable
ocp4_workload_mta6_rhsso_starting_csv: rhsso-operator.7.6.2-opr-001

ocp4_workload_mta6_rwx_supported: false
ocp4_workload_mta6_rwx_storage_class: ""
ocp4_workload_mta6_rwo_storage_class: ""

ocp4_workload_mta6_seed: true
ocp4_workload_mta6_seed_image: quay.io/gpte-devops-automation/tackle2-setup
ocp4_workload_mta6_seed_tag: "v2.1.3"

# -------------------------------------------------------------------
# ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.3

ocp4_workload_mtv_use_catalog_snapshot: true
ocp4_workload_mtv_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_mtv_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: dd5428ee-ea9f-4f02-8e9f-8ccd735525c1
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Modernize Existing Applications
    category: Demos
    keywords: []
    labels:
      Base_Component: 'True'
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Sales_Play: Modernize_Existing_Apps
      Featured_Score: '80'
    parameters: []
  runtime:
    default: 8h
    maximum: 48h
  secrets:
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - name: output-dir-s3
    namespace: gpte

