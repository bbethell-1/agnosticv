---
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/enterprise-premium-sla.yaml
#include /enterprise/includes/ansible_control_plane/current_controller.yaml

platform: RHPDS

env_type: ent-demo-ate-vmc-sandbox

agnosticd_open_environment: True

cloud_provider: vmc

# User that is allowed for CICD (must be a gmail.com account)
open_env_vmc_cicd_user: jenkins.sfo01@gmail.com

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    # infra_workloads: infra_workloads
    # aro_compute_count: worker_instance_count


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: da1da2f5-62f5-482b-8e0d-dfcb1deec6b7
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ATE VMware Creds
    category: Demos
    parameters: []
    keywords:
    - ent-demo-ate
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '90'
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-ate-demo-beta
    - rhpds-devs
  secrets:
  - namespace: gpte
    name: satellite-rhel86-ha
  - namespace: gpte
    name: gpte-vmc
  - namespace: gpte
    name: gpte-ipa-vc
