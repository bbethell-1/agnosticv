ocp4_workload_redhat_developer_hub_minio_namespace: ic-shared-minio
ocp4_workload_redhat_developer_hub_minio_username: minio
ocp4_workload_redhat_developer_hub_minio_password: "{{ common_password }}"
ocp4_workload_redhat_developer_hub_minio_bucket_name: backstage-bucket

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
orchestrator_enabled: false # Disable installation of orchestrator through bootstrap
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_enabled: "{{ orchestrator_enabled }}"

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: d9547730-723f-4409-b833-fa2d960b9f07
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Developer Hub Demo (AWS)
    category: Demos
    keywords:
      - Janus
      - project-janus
      - developer-hub
      - gitops
      - openshift
      - backstage
    parameters:
      - name: rhdh_version
        description: Version of Developer Hub
        formGroup: Developer Hub
        formLabel: Developer Hub Version
        required: false
        openAPIV3Schema:
          type: string
          default: stable
          enum:
            - stable
            - latest
        annotation: demo.redhat.com/rhdh-version
        variable: rhdh_version
