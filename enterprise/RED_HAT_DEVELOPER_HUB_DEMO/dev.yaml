---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
    scm_type: git

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_gitops_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_repo: https://github.com/treddy08/agnosticg.git
ocp4_workload_gitops_gitlab_import_repos:
  - name: rhdh
    repo:
      - name: software-templates
        url: https://github.com/treddy08/software-templates.git
  - name: summit-lab
    repo:
      - name: backstage-workshop
        url: https://github.com/treddy08/backstage-workshop.git
  - name: gitops
    repo:
      - name: janus-idp-gitops
        url: https://github.com/redhat-gpte-devopsautomation/janus-idp-gitops.git

# -------------------------------------------------------------------
# Remove
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_rhacm
  - ocp4_workload_minio
  - ocp4_workload_redhat_developer_hub_bootstrap
  - ocp4_workload_pipelines
  - ocp4_workload_gitops_gitlab
  - ocp4_workload_redhat_developer_hub

ocp4_workload_minio_project: ic-shared-minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: true
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: "{{ common_password }}"
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-05-28T17-19-04Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
  - backstage-bucket
ocp4_workload_minio_bucket_multi_user: false

ocp4_workload_redhat_developer_hub_minio_namespace: ic-shared-minio
ocp4_workload_redhat_developer_hub_minio_username: minio
ocp4_workload_redhat_developer_hub_minio_password: "{{ common_password }}"
ocp4_workload_redhat_developer_hub_minio_bucket_name: backstage-bucket

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_janus_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git
