---
#include /includes/aws-sandbox-meta.yaml
#include /includes/enterprise-premium-sla.yaml
#include /enterprise/includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ent-demo-ate-aws-sandbox

cloud_provider: ec2

aws_region: us-east-2

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    region: aws_region

sandbox_user_info_messages_enable: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 70e727b3-7588-47a1-85b4-720c2bbac5e5
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ATE AWS Creds
    category: Demos
    keywords:
    - ent-demo-ate
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '90'
    parameters: []
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-ate-demo-beta
    - rhpds-devs
