---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /includes/enterprise-premium-sla.yaml
#include /enterprise/includes/aws-sandbox-meta.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml

#Change for new description
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: containerize-app-demo
software_to_deploy: none
install_student_user: true
# bastion_instance_image: RHEL9GOLD-latest
bastion_instance_image: RHEL90GOLD
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

common_packages_el9:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - skopeo
  - buildah
  - tree
  - jq
  - libffi-devel
  - python-devel
  - systemd-container

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_dnf_packages:
  - git
  - podman
  - python-devel
  - systemd-container
  - unzip

showroom_git_repo: https://github.com/rhpds/containerize_your_app_showroom.git

showroom_tab_services:
  - tty1

showroom_tab_tty1_username: devops

showroom_ttys_enable_tmux: false

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - devops

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c8a7b94f-4041-46de-b2b5-2a8e50f928f7
  owners:
    maintainer:
      - name: WIlson Harris
        email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Containerize Your Application
    category: Demos
    labels:
      Base_Component: 'True'
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Sales_Play: Standardize_on_Linux
      Featured_Score: '61'
    keywords:
      - Containers
      - Buildah
      - SalesPlay
      - salesplay
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
