---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/enterprise-premium-sla.yaml
#Change for new description
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: containerize-app-demo
software_to_deploy: none
install_student_user: true
# bastion_instance_image: RHEL9GOLD-latest
bastion_instance_image: RHEL90GOLD
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
#ocp4_workload_bookbag_auth_username: "{{ ansible_service_account_user_name }}"
#ocp4_workload_bookbag_auth_password: "{{ student_password }}"
ocp4_workload_bookbag_console_deploy: false
ocp4_workload_bookbag_namespace: "{{ guid }}"
ocp4_workload_bookbag_name: "containerize"
ocp4_workload_bookbag_git_url: https://github.com/redhat-gpte-devopsautomation/containerize-app-demo-bookbag.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
## Added custom email template
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: false
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Containerize Your Application
    category: Demos
    labels:
      Base_Component: 'True'
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Sales_Play: Standardize_on_Linux
      Featured_Score: '80'
    keywords:
      - Containers
      - Buildah
      - SalesPlay
      - salesplay
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  secrets:
    - name: gpte
      namespace: gpte
    - name: satellite-rhel90-ha
      namespace: gpte
