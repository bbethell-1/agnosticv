cloud_provider: none
env_type: test-empty-config
# get ssh key to add host if we need bastion access
# really should add proper ssh keys BEFORE deployment

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: The Hybrid Cloud Demo (Beta) - Parallel
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHPDS
    parameters:
      - name: aws_region
        required: true
        resourceIndexes:
          - 0
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

  # Components to include in template and catalog item
  components:
    - name: aws-hub-a
      display_name: OCH AWS RHACM Hub A
      item: enterprise/OCH_OCP4_ACM_HUB
      propagate_provision_data:
        - var: aws_hub_provision_data

