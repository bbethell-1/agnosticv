---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
# -------------------------------------------------------------------
# --- Catalog: Development
# -------------------------------------------------------------------

cloud_provider: none
env_type: hybrid-cloud-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte

  catalog:
    display_name: The Open Hybrid Cloud Demo (Beta) - Parallel
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHPDS
    parameters:
      - name: aws_region
        required: true
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

  # Components to include in template and catalog item
  components:
    - name: aws-hub-a
      display_name: OHC AWS RHACM Hub A
      item: enterprise/OHC_OCP4_ACM_HUB
      propagate_provision_data:
        - var: aws_hub_provision_data
    - name: aws-dev-a
      display_name: OHC AWS Dev Cluster A
      item: enterprise/OHC_OCP4_CLUSTER
      propagate_provision_data:
        - var: aws_dev_a_provision_data
    - name: azure-dev-a
      display_name: OHC Azure Dev Cluster A
      item: enterprise/OHC_AZURE_OCP4_CLUSTER
      propagate_provision_data:
        - var: azure_dev_a_provision_data

  access_control:
    allow_groups:
      - babylon-admins
      - babylon-devs
      - rhpds-hybrid-cloud-demo-beta

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
      # deploy: null
