# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO Manage Hybrid Cloud
# --- DEMO: Manage Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

cloud_provider: none
env_type: hybrid-cloud-binder
# get ssh key to add host if we need bastion access
# really should add proper ssh keys BEFORE deployment

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte

  catalog:
    display_name: The Hybrid Cloud Demo (Beta) - Parallel
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHPDS
    parameters:
      - name: aws_region
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

      - name: agnosticd_open_environment
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: false
          enum:
            - false

      - name: num_users
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: 1
          enum:
            - 1

      - name: ocp4_fips_enable
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: false
          enum:
            - false

  # Components to include in template and catalog item
  components:
    - name: aws-hub-a
      display_name: AWS RHACM Hub A
      item: sandboxes-gpte/OCP4_ACM_HUB_RHPDS
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_aws_a_ca_cert
        - name: openshift_api_url
          var: openshift_aws_a_api_url
        - name: openshift_cluster_admin_token
          var: openshift_aws_a_token
        - name: openshift_console_url
          var: openshift_aws_a_console_url
            #    - name: aws-dev-a
            #      display_name: AWS OpenShift Dev A
            #        # item: sandboxes-gpte/SANDBOX_OCP49
            #      item: sandboxes-gpte/OCP410_WORKSHOP_RHPDS
            #      propagate_provision_data:
            #        - name: openshift_api_ca_cert
            #          var: openshift_aws_a_ca_cert
            #        - name: openshift_api_url
            #          var: openshift_aws_a_api_url
            #        - name: openshift_cluster_admin_token
            #          var: openshift_aws_a_token
            #        - name: openshift_console_url
            #          var: openshift_aws_a_console_url
            #    - name: azure-sandbox-a
            #      display_name: Azure OpenShift Dev A
            #      item: azure-gpte/OCP4_ON_AZURE_IAAS
            #      propagate_provision_data:
            #        - name: openshift_api_ca_cert
            #          var: openshift_azure_a_ca_cert
            #        - name: openshift_api_url
            #          var: openshift_azure_a_api_url
            #        - name: openshift_cluster_admin_token
            #          var: openshift_azure_a_token
            #        - name: openshift_console_url
            #          var: openshift_azure_a_console_url

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
      # deploy: null
