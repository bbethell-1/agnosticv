---
# touch for email: 2023-01-09 Mon 01:04:51 PM
#include /enterprise/includes/catalog-icon-red-hat-standard-logo.yaml
#include /enterprise/includes/terms-of-service.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /enterprise/includes/enterprise-premium-sla.yaml
#include /enterprise/includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
#include /enterprise/includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: hybrid-cloud-binder

### Enable Bigdemo and AI/ML roles
hybrid_cloud_binder_setup_coolstore: true

### current defaults for OHC deployment
hybrid_cloud_binder_bookbag_deploy: false
hybrid_cloud_binder_import_clusters_enable: true
hybrid_cloud_binder_install_secured_cluster: true
hybrid_cloud_binder_setup_rhacs_secured_cluster: true

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    workshopUiDisabled: true
    display_name: The Open Hybrid Cloud Demo
    category: Demos
    keywords:
    - open-hybrid-cloud-demo
    labels:
      Base_Component: 'True'
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Use_Case: The_Open_Hybrid_Cloud
      Featured_Score: '90'
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws_hub_a
    display_name: OHC AWS RHACM Hub A
    item: enterprise/OHC_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_dev_a
    display_name: OHC AWS Dev Cluster A
    item: enterprise/OHC_OCP4_CLUSTER
    propagate_provision_data:
    - var: aws_dev_a_provision_data
  - name: azure_dev_a
    display_name: OHC Azure Dev Cluster A
    item: enterprise/OHC_AZURE_OCP4_CLUSTER
    propagate_provision_data:
    - var: azure_dev_a_provision_data
  - name: vmc_upi
    display_name: OHC VMware CLI Install
    item: enterprise/OHC_OCP4_UPI_ON_VMC
    propagate_provision_data:
    - var: vmc_upi_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
