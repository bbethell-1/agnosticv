---
# touch for email: 2022-10-03 Mon 04:01:20 PM
#include /includes/catalog-icon-red-hat-standard-logo.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: hybrid-cloud-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: The Open Hybrid Cloud Demo
    category: Demos
    keywords:
    - open-hybrid-cloud-demo
    labels:
#     Product:
      Product_Family: Red_Hat_Cloud
      Provider: Portfolio_Product_Marketing
      Use_Case: The_Open_Hybrid_Cloud
      Support_Type: Enterprise_Premium
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws_hub_a
    display_name: OHC AWS RHACM Hub A
    item: enterprise/OHC_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_dev_a
    display_name: OHC AWS Dev Cluster A
    item: enterprise/OHC_OCP4_CLUSTER
    propagate_provision_data:
    - var: aws_dev_a_provision_data
  - name: azure_dev_a
    display_name: OHC Azure Dev Cluster A
    item: enterprise/OHC_AZURE_OCP4_CLUSTER
    propagate_provision_data:
    - var: azure_dev_a_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
