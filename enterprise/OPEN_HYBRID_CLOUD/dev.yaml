---
purpose: development

#To test coolstore app desecops pipeline

hybrid_cloud_binder_setup_coolstore: true

__meta__:
  deployer:
    scm_ref: development
    scm_url: https://github.com/redhat-cop/agnosticd.git
    virtualenv: hybrid_cloud_aws_azure-ansible2.9-python3.6-2022-07-06
  # Components to include in template and catalog item
  components:
  - name: aws_hub_a
    display_name: OHC AWS RHACM Hub A
    item: enterprise/OHC_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_dev_a
    display_name: OHC AWS Dev Cluster A
    item: enterprise/OHC_OCP4_CLUSTER
    propagate_provision_data:
    - var: aws_dev_a_provision_data
  - name: azure_dev_a
    display_name: OHC Azure Dev Cluster A
    item: enterprise/OHC_AZURE_OCP4_CLUSTER
    propagate_provision_data:
    - var: azure_dev_a_provision_data
