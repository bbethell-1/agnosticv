---
purpose: development

deploy_automationcontroller_installer_url: https://gpte-public.s3.amazonaws.com/aap2/ansible-automation-platform-setup-bundle-2.3-1.2.tar.gz

default_instance_image: RHEL86GOLD
bastion_instance_image: RHEL86GOLD
automation_controller_instance_image: RHEL86GOLD
automation_database_instance_image: RHEL86GOLD
automation_hub_instance_image: RHEL86GOLD

satellite_url: demosat-ha.infra.demo.redhat.com
set_repositories_satellite_url: "{{ satellite_url }}"
set_repositories_satellite_hostname: "{{ satellite_url }}"

satellite_org: Red_Hat_RHDP_Labs
set_repositories_satellite_org: "{{ satellite_org }}"

set_repositories_satellite_ha: true

satellite_activationkey: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          63613463366438633933323033313334633333323831663462376565613337626330646565313733
          3065643130663336663730623137366536336634616333610a623032383331363065356531623737
          31353131323962646232363730633663663264663731626331643061376262363531616133373065
          3831383965333335350a653664663364346539316466613531393461643134303239626133333533
          61303331373063666462376136643064616331336132326439353263613933376337306564343263
          6262383762366434313937336631303635306165643235626663
# This must match activation key content view

set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

update_packages: false
repo_method: satellite

#
# Instances to deploy
#

instances:

  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - BookbagSG

  - name: aap-controller
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ automation_controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ automation_controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "automationcontroller"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50) }}"
    security_groups:
      - BastionSG
      - WebSG
      - HostSG

  - name: aap-hub
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ automation_hub_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ automation_hub_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "automationhub"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - WebSG
      - HostSG

  - name: aap-database
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: true
    floating_ip: false
    image: "{{ automation_database_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ automation_database_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "automationcontroller_database"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - HostSG

security_groups:

  - name: WebSG
    rules:
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress


  - name: BookbagSG
    rules:

      - name: BookbagMain
        description: "Bookbag main port"
        from_port: 8080
        to_port: 8080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

__meta__:
  deployer:
    scm_ref: ate-base-1.9.0-hotfix
    # scm_ref: ate-0.0.7 preserved for easy rollback of last minute changes! tok@redhat.com
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
