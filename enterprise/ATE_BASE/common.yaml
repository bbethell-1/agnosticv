---
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ent-demo-ate-base
cloud_provider: ec2

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    region: aws_region

sandbox_user_info_messages_enable: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.11-python3.8-2021-09-27
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ATE AWS Base
    category: Demos
    keywords:
    - ent-demo-ate
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    parameters: []
  secrets:
  - name: ent-demo-ate
    namespace: gpte
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-ate-demo-beta
    - rhpds-devs
