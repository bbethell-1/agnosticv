# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 35f4ebfd-36a6-45b1-99ce-95e81d80cfe7
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    workshopUiDisabled: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OHC AWS Dev Clusters
    category: Demos
    keywords:
    - open-hybrid-cloud-demo
    parameters: []
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '90'
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:pr-6896
      pull: missing
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: rhods-git-secret
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
