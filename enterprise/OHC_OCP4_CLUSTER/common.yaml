---
#include /includes/aws-sandbox-meta.yaml
#include /includes/enterprise-premium-sla.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud - Parallel
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"
num_users: 5
aws_region: us-east-2

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 3
worker_instance_type: m5.4xlarge

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: dev-admin
# --- student_password not set -> generate random password
student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: ansible.utils
    version: 2.7.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_authentication             # all segments
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_sonarqube
- ocp4_workload_codeserver
- ocp4_workload_gitops_aap
- automation-controller-config
- ocp4_workload_mta6
- ocp4_workload_rhods_olm
- edge_nodes_info
- ocp4_workload_rhacs_secured_cluster
- ocp4_workload_amq_streams            # appsvc demo
- ocp4_workload_ohc_demo_app_services  # appsvc demo
  #- ocp4_workload_object_detection_ai_ml_setup

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_lpe_automation_controller
# -------------------------------------------------------------------
automation_controller_project: "ac-{{ guid }}"
#automation_controller_admin_secret: "ac-{{ guid }}-secret"
#automation_controller_admin_password: "{{ common_password }}"
automation_controller_upload_manifest: true
automationcontroller_manifest_url: https://gpte-public.s3.amazonaws.com/aap2-subscription/manifest_31_10_2022.zip

# -------------------------------------------------------------------
# Workload: automation-controller-config
# -------------------------------------------------------------------
ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"
ssh_publickey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path_pub) }}"
account_user_access_key: "{{ aws_access_key_id }}"
account_user_secret_access_key: "{{ aws_secret_access_key }}"

automation_controller_users:
- name: dev-admin
  password: "{{ common_password }}"
  superuser: true

automation_controller_credentials:
- name: hmi_nodes
  description: hmi nodes
  credential_type: Machine
  username: ec2-user
  ssh_key_data: "{{ ssh_privatekey }}"
- name: aws_credentials
  description: aws_credentials
  credential_type: "Amazon Web Services"
  username: "{{ account_user_access_key }}"
  password: "{{ account_user_secret_access_key }}"

automation_controller_projects:
- name: "edge-hmi-demo"
  description: "Edge HMI Demo"
  scm_type: git
  scm_url: https://github.com/redhat-gpte-devopsautomation/edge-hmi-demo.git

automation_controller_inventories:
- name: "hmi-dynamic-inventory"
  description: "HMI host inventory"
- name: hmi-smart-inventory
  description: HMI smart
  kind: smart
  host_filter: groups__name__icontains=tag_AnsibleGroup_hmi_nodes

automation_controller_inventory_sources:
- name: "aws_source"
  description: "aws dynamic inventory"
  inventory: "hmi-dynamic-inventory"
  credential: "aws_credentials"
  source: ec2
  source_vars:
    keyed_groups:
    - prefix: tag
      key: tags

automation_controller_jobtemplates:
- name: "1. Create HMI VM with survey for hostname"
  description: "Create HMI VM with survey for hostname"
  inventory: "Demo Inventory"
  project: edge-hmi-demo
  playbook: "ansible/provision_host_playbook.yml"
  credentials:
  - "aws_credentials"
  survey_enabled: true
  survey_spec:
    name: HMI survey
    description: HMI node survey
    spec:
    - type: text
      question_name: "Enter AWS Region"
      question_description: "Aws Region for HMI nodes"
      variable: aws_region
      required: false
      default: "us-east-2"
    - type: textarea
      question_name: "Enter HMI Nodes Hostname"
      question_description: "Aws Region for HMI nodes"
      variable: hmi_nodes
      required: false
      default: node1
- name: "2. Configure Podman to run Inductive Automation Ignition"
  description: "Configure Podman to run Inductive Automation Ignition"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/podman_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
  survey_enabled: true
  survey_spec:
    name: Podman survey
    description: Podman survey
    spec:
    - type: text
      question_name: "Enter Quay Username"
      question_description: "Quay username for podman"
      variable: podman_username
      required: false
    - type: password
      question_name: "Enter Quay Password"
      question_description: "Quay password for podman"
      variable: podman_password
      required: false
- name: "3. Deploy Kiosk Mode to HMI Devices"
  description: "Deploy Kiosk Mode to HMI Devices"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/kiosk_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
  survey_enabled: true
  survey_spec:
    name: Kiosk survey
    description: Kiosk survey
    spec:
    - type: text
      question_name: "Enter RHSM Username"
      question_description: "RHSM Username"
      variable: rhsm_username
      required: false
    - type: password
      question_name: "Enter RHSM Password"
      question_description: "RHSM password"
      variable: rhsm_password
      required: false
- name: "4. OS Hardening"
  description: "OS Hardening"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/hardening_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
- name: "5. Validate Security on HMI Devices(scheduled to report to Splunk)"
  description: "Validate Security on HMI Devices(scheduled to report to Splunk)"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/security_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
automation_controller_job_workflow_templates: true


