---
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.10"
#ocp4_installer_root_url: "http://admin.na.shared.opentlc.com/pub/openshift-v4/aarch64/clients"

# ocp4_installer_use_dev_preview: true
# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates

satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: ocp-on-rhel
set_repositories_satellite_activationkey: ocp-on-rhel
satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_hostname: labsat-ha.opentlc.com
set_repositories_satellite_ha: true
use_content_view: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 1
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false

# --- Student Workloads (YAML List)
student_workloads: []

# as a workshop, it needs a number of users
cloud_provider: ec2
key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"
num_users: 1
aws_region: us-east-2
# agnosticd_open_environment: false
# ocp4_fips_enable: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    region: aws_region
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OHC AWS Dev Clusters
    category: Demos
    keywords:
    - hybrid-cloud-demo
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    parameters:
    - name: aws_region
      description: AWS Region to Provision Environment.
      formLabel: Region
      required: true
      formHideCondition: true == true
      openAPIV3Schema:
        type: string
        default: us-east-2
        enum:
        - us-east-2
    - name: sandbox_user_info_messages_enable
      description: Allow chain configs to control sandbox_user_info_messages_enable
      required: true
      formHideCondition: true == true
      openAPIV3Schema:
        type: boolean
        default: true
        enum:
        - true
        - false
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-hybrid-cloud-demo-beta
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: satellite-ocp-rhel
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
