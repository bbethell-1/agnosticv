---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

infra_workloads:
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_authentication             # all segments
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_codeserver
- ocp4_workload_gitops_aap
- automation-controller-config
- ocp4_workload_mta
- ocp4_workload_mta_tackle
- ocp4_workload_rhods_olm
- edge_nodes_info
- ocp4_workload_rhacs_secured_cluster
- ocp4_workload_sonarqube
- ocp4_workload_amq_streams
- ocp4_workload_ohc_demo_app_services

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# ocp4_workload_amq_streams
# -------------------------------------------------------------------
ocp4_workload_amq_streams_channel: stable

ocp4_workload_amq_streams_use_catalog_snapshot: true
ocp4_workload_amq_streams_catalogsource_name: redhat-operators-snapshot-amq-streams
ocp4_workload_amq_streams_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_amq_streams_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# ocp4_workload_ohc_demo_app_services
# -------------------------------------------------------------------

ocp4_workload_ohc_demo_app_services_application_repo: https://github.com/globex-recommendation/globex-recommendation-helm.git
ocp4_workload_ohc_demo_app_services_application_repo_tag: ohc-demo-ocp-4.10
ocp4_workload_ohc_demo_app_services_application_repo_path: globex

# -------------------------------------------------------------------
# Just for test
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_user_base: dev-user
ocp4_workload_authentication_htpasswd_user_count: 1

# -------------------------------------------------------------------
# Workload: automation-controller-config (new variables)
# -------------------------------------------------------------------
automation_controller_users:
- name: dev-admin
  password: "{{ common_password }}"
  superuser: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
    scm_type: git
