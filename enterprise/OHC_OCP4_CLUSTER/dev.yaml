---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

infra_workloads:
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_authentication             # all segments
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_codeserver
- ocp4_workload_gitops_aap
- automation-controller-config
- ocp4_workload_mta
- ocp4_workload_mta_tackle
- ocp4_workload_rhods_olm
- ocp4_workload_sonarqube
- edge_nodes_info
- ocp4_workload_rhacs_secured_cluster
- ocp4_workload_ama_demo_app_services_shared

# -------------------------------------------------------------------
# Just for test
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_user_base: dev-user
ocp4_workload_authentication_htpasswd_user_count: 1

# -------------------------------------------------------------------
# ocp4_workload_ama_demo_app_services_shared
# -------------------------------------------------------------------
ocp4_workload_ama_demo_app_services_shared_lab_setup: true
ocp4_workload_ama_demo_app_services_shared_bookbag: false

ocp4_workload_ama_demo_app_services_shared_user_count: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_ama_demo_app_services_shared_user_prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

ocp4_workload_ama_demo_app_services_shared_namespace_prefix: globex-

# -------------------------------------------------------------------
# Workload: automation-controller-config (new variables)
# -------------------------------------------------------------------
automation_controller_users:
- name: dev-admin
  password: "{{ common_password }}"
  superuser: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
    scm_type: git
