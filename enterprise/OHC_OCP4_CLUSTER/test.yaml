# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    git_tag_prefix: open-hybrid-cloud
    type: agnosticd
