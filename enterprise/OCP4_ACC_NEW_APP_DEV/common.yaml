---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/enterprise-premium-sla.yaml
#include /includes/aws-sandbox-meta.yaml

# -------------------------------------------------------------------
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: OpenShift 4 Accelerate New App Development
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest
master_instance_type: m5a.2xlarge
master_instance_count: 3
worker_instance_type: m5a.2xlarge
worker_instance_count: 3

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

student_workloads: []

# -------------------------------------------------------------------
# Bastion customization
# -------------------------------------------------------------------

# Open up port 80 and 443 for VSCode Server
# Open ports for Quarkus applications
# Overwrite default Security Group BastionSG
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPSPublic
    description: "HTTPS public for VSCode Server"
    from_port: 8443
    to_port: 8443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: SuperHeroes
    description: "Ports for SuperHeroes applications"
    from_port: 8082
    to_port: 8085
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_quarkus_super_heroes_demo
- ocp4_workload_vscode_bastion

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_remove_kubeadmin: true

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_08_29

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.6
ocp4_workload_openshift_gitops_setup_cluster_admin: true

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_08_29

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v1.3.0

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.17.1"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
ocp4_workload_gitea_operator_gitea_volume_storage_class: gp3-csi
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel8/postgresql-13
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
ocp4_workload_gitea_operator_postgresql_volume_storage_class: gp3-csi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: "{{ student_name }}"
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/quarkusio/quarkus-super-heroes.git
  name: quarkus-super-heroes
  private: false
- repo: https://github.com/redhat-gpte-devopsautomation/quarkus-super-heroes.git
  name: quarkus-super-heroes-deploy
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_quarkus_super_heroes_demo
# -------------------------------------------------------------------
ocp4_workload_quarkus_super_heroes_demo_user_name: "{{ student_name }}"
ocp4_workload_quarkus_super_heroes_demo_user_group: users

ocp4_workload_quarkus_super_heroes_demo_release_tag: rhbq-2.7
ocp4_workload_quarkus_super_heroes_demo_java_versions: []
ocp4_workload_quarkus_super_heroes_demo_clone_repo_gitea_user: "{{ student_name }}"
ocp4_workload_quarkus_super_heroes_demo_clone_repo_gitea_password: openshift
ocp4_workload_quarkus_super_heroes_demo_deploy_cicd: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_bastion_vscode
# -------------------------------------------------------------------
ocp4_workload_vscode_bastion_user_name: "{{ ocp4_workload_quarkus_super_heroes_demo_user_name }}"
ocp4_workload_vscode_bastion_user_group: users

ocp4_workload_vscode_bastion_vscode_package_version: 4.7.0
ocp4_workload_vscode_bastion_vscode_password: "openshift"
ocp4_workload_vscode_bastion_vscode_repo_directories:
- "/home/{{ ocp4_workload_vscode_bastion_user_name }}/quarkus-super-heroes"
ocp4_workload_vscode_bastion_workspace_name: QuarkusSuperHeroes
ocp4_workload_vscode_bastion_custom_system_service: true
ocp4_workload_vscode_bastion_install_chrome: true
ocp4_workload_vscode_bastion_extensions:
- auchenberg.vscode-browser-preview-0.7.2.vsix

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Sales_Play: Accelerate_New_App_Dev
      Featured_Score: '80'
    display_name: Accelerate New App Development
    category: Demos
    multiuser: true
    parameters: []
  runtime:
    default: 8h
    maximum: 48h
  secrets:
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: rhev_dev_credentials
  - namespace: gpte
    name: output-dir-s3

