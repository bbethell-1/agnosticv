---
__meta__:
  catalog:
    parameters:
    - name: user_count
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 100
      validation: >-
        user_count == 1 ||
        user_is_admin ||
        user_groups.enterprise/includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
