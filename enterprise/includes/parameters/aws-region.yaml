---
__meta__:
  catalog:
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
            - ap-southeast-1
            - eu-central-1
            - eu-west-1
            - eu-west-3
        validation: >-
          aws_region == 'ap-southeast-1' ||
          aws_region == 'eu-west-1' ||
          aws_region == 'eu-west-3' ||
          Error('There is currently an issue with certain services (S3) with AWS globally. As a workaround please try other regions "ap-southeast-1", "eu-west-1", or "eu-west-3"')
