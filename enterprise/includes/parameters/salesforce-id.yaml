---
__meta__:
  catalog:
    parameters:
      - name: salesforce_id
        description: Salesforce Number, Campaign ID, CDH, or Project ID.
        formLabel: Salesforce ID
        annotation: pfe.redhat.com/salesforce-id
        openAPIV3Schema:
          type: string
        formRequireCondition: >-
          typeof purpose === 'string' &&
          purpose.startsWith("Customer Activity - ")
        validation: >-
          check_salesforce_id(salesforce_id) ||
          Error('Valid Salesforce ID required for all Customer Facing Events')
