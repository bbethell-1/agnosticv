---
#Required to provide Sandbox Credentials to Users when Ordering an Open Environment
sandbox_enable_ui: true
sandbox_user_info_data_enable: true

agnosticv_meta:
  params_to_variables:
    agnosticd_open_environment: agnosticd_open_environment

__meta__:
  catalog:
    parameters:
      - name: open_environment
        description: >-
          Charge back cloud costs to your cost center, allow full control of auto-stop and auto-destroy,
          and provider cloud infrastructure credentials.
        formGroup: Features
        formLabel: Enable OPEN Environment
        openAPIV3Schema:
          default: false
          type: boolean
        annotation: demo.redhat.com/open-environment
        variable: agnosticd_open_environment
