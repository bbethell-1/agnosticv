# This is a basic configuration to connect an environment to satellite for RHEL packages
# Author: ahshah
# Danger, this activation key has the "rhel 8.6 rhel 9.1 and ansible 2.3"  when the rhel-8.6-rhel-9.1-ansible-2.3 CV is updated.
# This CV can be updated at any time. Only use it if you are sure the latest RHEL works for your content.

satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: "{{ satellite_url }}"
set_repositories_satellite_hostname: "{{ satellite_url }}"

satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: "{{ satellite_org }}"

set_repositories_satellite_ha: true

