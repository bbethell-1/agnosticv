__meta__:
  catalog:
    terms_of_service: |-
      <p>
      Please pay close attention to the information provided in this page.<br/>
      This environment deploy on Equinix Metal - Bare Metal, which may have a certain limit of infrastructure along with high costs<br/>
      So you might get failure to provision due to their cloud infrastructure limit<br/>
      Please try to use default region(any) if you want to provision on best available region.
      You can use <a href="https://metal.equinix.com/developers/capacity-dashboard/">Equinix capacity dashboard</a> with server type filter s3.xlarge.x86 to know available region to order against desired region by considering risk of failure.<br/>
      We strongly suggest that you reach out to the RHDP team for any service that require more than one user - <a href="https://red.ht/rhpds-help">Help</a> <br/>
      After you order your environment, you can manage it by logging into this system and select Services.<br/>
      The ordered environment will cease to run unless you extend the Auto-Stop in Services.<br/>
      The ordered environment will cease to exist at the Auto-Destroy date and time.<br>
      </p>
