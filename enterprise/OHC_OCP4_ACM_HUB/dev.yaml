---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacm
- ocp4_workload_rhacm_appsubs
- ocp4_workload_rhacm_cloud_credentials

# -------------------------------------------------------------------
# role: ocp4_workload_rhacm_cloud_credentials
# -------------------------------------------------------------------
set_aws_acm_secret: True
aws_acm_secret_name: "aws-cluster-credentials"
ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"
ssh_publickey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path_pub) }}"
account_user_access_key: "{{ aws_access_key_id }}"
account_user_secret_access_key: "{{ aws_secret_access_key }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
    scm_type: git
