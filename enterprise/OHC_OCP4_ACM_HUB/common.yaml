---
#include /includes/aws-sandbox-meta.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
# update_packages: false

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"
num_users: 5
aws_region: us-east-2

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Bastion and Student Info
# -------------------------------------------------------------------

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: dev-admin

# student_password not set -> generate random password
student_password: "{{ common_password }}"

# Student is allowed to sudo and switch to root
student_sudo: true

# Student Workloads (YAML List)
student_workloads: []

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# OpenShift Instance Types
# -------------------------------------------------------------------

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 2

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx            # Prakhar, what does this support?
    version: 21.1.0
  - name: azure.azcollection # Needed for azure creds loading
    version: 1.12.0
  - name: azure.rm           # Needed for azure creds loading
    version: 0.0.6

infra_workloads:
- ocp4_workload_rosa_cli
- ocp4_workload_eksctl
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacm
- ocp4_workload_rhacs
- ocp4_workload_vscode_bastion
- ocp4_workload_rhacm_appsubs             #What is this use for?

# -------------------------------------------------------------------
# ocp4_workload_rosa_cli
# -------------------------------------------------------------------
rosa_token: "{{ gpte_rosa_token }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------

ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.9_2022_07_11"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.5.1"
ocp4_workload_rhacm_acm_channel: "release-2.5"
ocp4_workload_rhacm_acm_release: "release-2.5"

# -------------------------------------------------------------------
# ocp4_workload_acm_cloud_credentials
# -------------------------------------------------------------------
set_azr_acm_secret: true
az_root_dns_zone: "{{ guid }}.{{ hostvars.localhost.azure_root_dns_zone }}"
az_resource_group_name: "openenv-{{ guid }}"
az_service_principal:
  clientId: "{{ hostvars.localhost.azapp.applications[0].app_id }}"
  clientSecret: "{{ hostvars.localhost.azpass }}"
  subscriptionId: "{{ hostvars.localhost.assignedsubscription.subscriptions[0].subscription_id }}"
  tenantId: "{{ azure_tenant }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-3.69"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v3.69.1"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: "v4.10_2022_04_04"

# -------------------------------------------------------------------
# Workload: ocp4_workload_vscode_bastion
# -------------------------------------------------------------------
ocp4_workload_vscode_bastion_vscode_package_version: "4.4.0"
ocp4_workload_vscode_bastion_vscode_password: "{{ common_password }}"
ocp4_workload_vscode_bastion_vscode_repo_directories:
- "{{ ocp4_workload_vscode_bastion_home_directory }}/inventory"
- "{{ ocp4_workload_vscode_bastion_home_directory }}/catalog"
- "{{ ocp4_workload_vscode_bastion_home_directory }}/gateway"
- "{{ ocp4_workload_vscode_bastion_home_directory }}/gitops"
- "{{ ocp4_workload_vscode_bastion_home_directory }}/arc-model"
ocp4_workload_vscode_bastion_install_chrome: true
ocp4_workload_vscode_bastion_extensions:
- auchenberg.vscode-browser-preview-0.7.2.vsix

# -------------------------------------------------------------------
# AgnosticV Metadata
# -------------------------------------------------------------------
# Set VirtualEnv to run this config in
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    region: aws_region

sandbox_user_info_messages_enable: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    # virtualenv: ansible2.9-python3.6-2021-11-30
    # we need azure support to get creds in RHACM
    virtualenv: hybrid_cloud_aws_azure-ansible2.9-python3.6-2022-07-06
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OHC OCP4 ACM Hub
    category: Demos
    keywords:
    - open-hybrid-cloud-demo
    labels:
      Product: Red_Hat_Advanced_Cluster_Management_for_Kubernetes
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    parameters: []
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-hybrid-cloud-demo-beta
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel81
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: azure_redhat0
    namespace: gpte
  - name: gpte-sandbox
    namespace: gpte
    var: aws_sandbox_manager
  - name: rhods-git-secret
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: rosa-token
    namespace: gpte
  - name: temp-epic-demo-rosa-aws-key
    namespace: gpte
