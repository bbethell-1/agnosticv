---
#include /includes/aws-sandbox-meta.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
# update_packages: false

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"
num_users: 5
aws_region: us-east-2

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Bastion and Student Info
# -------------------------------------------------------------------

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: dev-admin

# student_password not set -> generate random password
student_password: "{{ common_password }}"

# Student is allowed to sudo and switch to root
student_sudo: true

# Student Workloads (YAML List)
student_workloads: []

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# OpenShift Instance Types
# -------------------------------------------------------------------

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 2

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: azure.azcollection
    version: 1.12.0
  - name: azure.rm
    version: 0.0.6

infra_workloads:
- ocp4_workload_rosa_cli
- ocp4_workload_eksctl
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacm
- ocp4_workload_aws_info                   # DONE - use Open Env?
- ocp4_workload_rhacs
- ocp4_workload_lpe_automation_controller
- automation-controller-config
- ocp4_workload_vscode_bastion

# -------------------------------------------------------------------
# ocp4_workload_rosa_cli
# -------------------------------------------------------------------
rosa_token: "{{ gpte_rosa_token }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------

ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.9_2022_07_11"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.5.1"
ocp4_workload_rhacm_acm_channel: "release-2.5"
ocp4_workload_rhacm_acm_release: "release-2.5"

# -------------------------------------------------------------------
# ocp4_workload_acm_cloud_credentials
# -------------------------------------------------------------------
set_azr_acm_secret: true
az_root_dns_zone: "{{ guid }}.{{ hostvars.localhost.azure_root_dns_zone }}"
az_resource_group_name: "openenv-{{ guid }}"
az_service_principal:
  clientId: "{{ hostvars.localhost.azapp.applications[0].app_id }}"
  clientSecret: "{{ hostvars.localhost.azpass }}"
  subscriptionId: "{{ hostvars.localhost.assignedsubscription.subscriptions[0].subscription_id }}"
  tenantId: "{{ azure_tenant }}"

# -------------------------------------------------------------------
# automation-controller-config
# -------------------------------------------------------------------
automation_controller_credentials:
- name: hmi_nodes
  description: hmi nodes
  credential_type: Machine
  username: ec2-user
  ssh_key_data: "{{ ssh_privatekey }}"
- name: aws_credentials
  description: aws_credentials
  credential_type: "Amazon Web Services"
  username: "{{ account_user_access_key }}"
  password: "{{ account_user_secret_access_key }}"

automation_controller_projects:
- name: "edge-hmi-demo"
  description: "Edge HMI Demo"
  scm_type: git
  scm_url: https://github.com/linuxnerds/edge-hmi-demo.git

automation_controller_inventories:
- name: "hmi-dynamic-inventory"
  description: "HMI host inventory"
- name: hmi-smart-inventory
  description: HMI smart
  kind: smart
  host_filter: groups__name__icontains=tag_AnsibleGroup_hmi_nodes

automation_controller_inventory_sources:
- name: "aws_source"
  description: "aws dynamic inventory"
  inventory: "hmi-dynamic-inventory"
  credential: "aws_credentials"
  source: ec2
  source_vars:
    keyed_groups:
    - prefix: tag
      key: tags

automation_controller_jobtemplates:
- name: "1. Create HMI VM with survey for hostname"
  description: "Create HMI VM with survey for hostname"
  inventory: "Demo Inventory"
  project: edge-hmi-demo
  playbook: "ansible/provision_host_playbook.yml"
  credentials:
  - "aws_credentials"
  survey_enabled: true
  survey_spec:
    name: HMI survey
    description: HMI node survey
    spec:
    - type: text
      question_name: "Enter AWS Region"
      question_description: "Aws Region for HMI nodes"
      variable: aws_region
      required: false
      default: "us-east-2"
    - type: textarea
      question_name: "Enter HMI Nodes Hostname"
      question_description: "Aws Region for HMI nodes"
      variable: hmi_nodes
      required: false
      default: node1
- name: "2. Configure Podman to run Inductive Automation Ignition"
  description: "Configure Podman to run Inductive Automation Ignition"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/podman_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
  survey_enabled: true
  survey_spec:
    name: Podman survey
    description: Podman survey
    spec:
    - type: text
      question_name: "Enter Quay Username"
      question_description: "Quay username for podman"
      variable: podman_username
      required: false
    - type: password
      question_name: "Enter Quay Password"
      question_description: "Quay password for podman"
      variable: podman_password
      required: false
- name: "3. Deploy Kiosk Mode to HMI Devices"
  description: "Deploy Kiosk Mode to HMI Devices"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/kiosk_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
  survey_enabled: true
  survey_spec:
    name: Kiosk survey
    description: Kiosk survey
    spec:
    - type: text
      question_name: "Enter RHSM Username"
      question_description: "RHSM Username"
      variable: rhsm_username
      required: false
    - type: password
      question_name: "Enter RHSM Password"
      question_description: "RHSM password"
      variable: rhsm_password
      required: false
- name: "4. OS Hardening"
  description: "OS Hardening"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/hardening_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
- name: "5. Validate Security on HMI Devices(scheduled to report to Splunk)"
  description: "Validate Security on HMI Devices(scheduled to report to Splunk)"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/security_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
automation_controller_job_workflow_templates: true

# -------------------------------------------------------------------
# AgnosticV Metadata
# -------------------------------------------------------------------
# Set VirtualEnv to run this config in
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    region: aws_region

sandbox_user_info_messages_enable: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    # virtualenv: ansible2.9-python3.6-2021-11-30
    # we need azure support to get creds in RHACM
    virtualenv: hybrid_cloud_aws_azure-ansible2.9-python3.6-2022-07-06
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OHC OCP4 ACM Hub
    category: Demos
    keywords:
    - open-hybrid-cloud-demo
    labels:
      Product: Red_Hat_Advanced_Cluster_Management_for_Kubernetes
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    parameters: []
  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-hybrid-cloud-demo-beta
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel81
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: azure_redhat0
    namespace: gpte
  - name: gpte-sandbox
    namespace: gpte
    var: aws_sandbox_manager
  - name: rhods-git-secret
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: rosa-token
    namespace: gpte
  - name: temp-epic-demo-rosa-aws-key
    namespace: gpte
