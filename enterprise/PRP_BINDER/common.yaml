---
#include /enterprise/includes/catalog-icon-red-hat-standard-logo.yaml
#include /enterprise/includes/terms-of-service.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /enterprise/includes/enterprise-premium-sla.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
# -------------------------------------------------------------------
# --- Catalog Item: The Power of the Red Hat Platform: GitOps Binder
# -------------------------------------------------------------------

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: prp-binder

project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# GitOps Bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/newgoliath/bootstrap
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: ""

# Helm values to override in the ArgoCD bootstrap application.
ocp4_workload_gitops_bootstrap_helm_values: []

ocp4_workload_gitops_bootstrap_ocp_login_enable: true # adds a kubeconfig to PWD
ocp4_workload_gitops_bootstrap_ocp_api_url: "{{ prp_ocp_argo.openshift_api_server_url }}"
ocp4_workload_gitops_bootstrap_ocp_api_username: "{{ prp_ocp_argo.openshift_cluster_admin_username }}"
ocp4_workload_gitops_bootstrap_ocp_api_password: "{{ prp_ocp_argo.openshift_cluster_admin_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    workshopUiDisabled: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: The Power of the Red Hat Platform
    category: Demos
    keywords:
    - openshift
    parameters: []
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  # Components to include in template and catalog item
  components:
  - name: prp_ocp_argo
    display_name: PRP OCP Argo
    item: enterprise/PRP_OCP_ARGO
    propagate_provision_data:
    - var: prp_ocp_argo

# Disable actions on chained config that are handled by base.
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:pr-6746
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
