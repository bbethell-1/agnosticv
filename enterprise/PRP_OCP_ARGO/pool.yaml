---
apiVersion: poolboy.gpte.redhat.com/v1
kind: ResourcePool
metadata:
  finalizers:
    - poolboy.gpte.redhat.com
  name: enterprise.prp-ocp-argo.dev
  namespace: poolboy
spec:
  lifespan:
    maximum: >-
      {% if resource_claim.annotations['demo.redhat.com/open-environment'] |
      default(false) | bool %}365d{% else %}10d{% endif %}
    relativeMaximum: >-
      {% if resource_claim.annotations['demo.redhat.com/open-environment'] |
      default(false) | bool %}365d{% else %}2d{% endif %}
  minAvailable: 2
  resources:
    - name: prp_ocp_argo
      provider:
        apiVersion: poolboy.gpte.redhat.com/v1
        kind: ResourceProvider
        name: enterprise.prp-ocp-argo.dev
        namespace: poolboy
      template:
        spec:
          vars:
            default_desired_state: stopped
