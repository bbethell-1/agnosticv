# touch for email: 2022-09-07 Wed 09:12:34 AM
#include /includes/catalog-icon-red-hat-standard-logo.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud (Beta)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: summit-hybrid-cloud-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: Summit Open Hybrid Cloud Demo
    category: Demos
    keywords:
    - summit-open-hybrid-cloud-demo
    - summit
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS

  # Components to include in template and catalog item
  components:
  - name: aws_hub_a
    display_name: OHC AWS RHACM Hub A
    item: enterprise/SUMMIT_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_dev_a
    display_name: Summit AWS Dev Cluster A
    item: enterprise/SUMMIT_OCP4_CLUSTER
    propagate_provision_data:
    - var: aws_dev_a_provision_data
  - name: azure_dev_a
    display_name: OHC Azure Dev Cluster A
    item: enterprise/SUMMIT_AZURE_OCP4_CLUSTER
    propagate_provision_data:
    - var: azure_dev_a_provision_data

  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-hybrid-cloud-demo-beta

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
