#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Catalog Item: APAC 2022 SUMMIT Open Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: summit-hybrid-cloud-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: APAC 2022 Summit Open Hybrid Cloud Demo
    category: Demos
    keywords:
    - summit-open-hybrid-cloud-demo
    - summit
    - apac
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS

  # Components to include in template and catalog item
  components:
  - name: aws_hub_a
    display_name: APAC 2022 Summit OCP4 ACM Hub
    item: enterprise/SUMMIT_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_dev_a
    display_name: APAC 2022 Summit AWS Dev A Clusters
    item: enterprise/SUMMIT_OCP4_CLUSTER
    propagate_provision_data:
    - var: aws_dev_a_provision_data
  - name: aws_dc_a
    display_name: APAC 2022 Summit DC Clusters
    item: enterprise/SUMMIT_OCP4_CLUSTER_DC
    propagate_provision_data:
    - var: aws_dc_a_provision_data
  - name: aws_prod_a
    display_name: APAC 2022 Summit AWS Prod Clusters
    item: enterprise/SUMMIT_OCP4_CLUSTER_PROD
    propagate_provision_data:
    - var: aws_prod_a_provision_data

  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs
    - rhpds-aot-demo-gods

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
