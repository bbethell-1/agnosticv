---
#include /includes/access-restriction-aap-product-demos.yaml

# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

# ------------------------
# Config values
# ------------------------
apd_bootstrap_scm_branch: jce/aap-config
controller_postinstall_repo_ref: jce/apd-org

# tag should match ocp version in ocp4_installer_version
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2025_06_16

# ------------------------
# AAP2.5 Dispatcher Role
# ------------------------

aap_configuration_dispatcher_roles:
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_settings, var: controller_settings, tags: controller_settings}
  - {role: eda_decision_environments, var: eda_decision_environments, tags: eda_decision_environments}
  - {role: controller_credential_types, var: controller_credential_types, tags: controller_credential_types}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_templates}
  - {role: controller_job_launch, var: controller_launch_jobs, tags: controller_job_launch}

# TODO remove once AAPRFE-1898 is complete
controller_credential_types:
  - name: Product Demos Bootstrap Credential
    description: Custom credential type for bootstrapping Ansible Product Demos
    inputs:
      fields:
        - id: host
          type: string
          label: Red Hat Ansible Automation Platform URL
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
        - id: oauth_token
          type: string
          label: OAuth Token
          secret: true
        - id: verify_ssl
          type: boolean
          label: Verify SSL
      required:
        - host
    injectors:
      env:
        TOWER_HOST: "{{ '!unsafe \"{{host}}\"' }}"
        TOWER_USERNAME: "{{ '!unsafe \"{{username}}\"' }}"
        TOWER_PASSWORD: "{{ '!unsafe \"{{password}}\"' }}"
        TOWER_VERIFY_SSL: "{{ '!unsafe \"{{verify_ssl}}\"' }}"
        TOWER_OAUTH_TOKEN: "{{ '!unsafe \"{{oauth_token}}\"' }}"
        CONTROLLER_HOST: "{{ !unsafe '\"{{host}}\"' }}"
        CONTROLLER_USERNAME: "{{ '!unsafe \"{{username}}\"' }}"
        CONTROLLER_PASSWORD: "{{ '!unsafe \"{{password}}\"' }}"
        CONTROLLER_VERIFY_SSL: "{{ '!unsafe \"{{verify_ssl}}\"' }}"
        CONTROLLER_OAUTH_TOKEN: "{{ '!unsafe \"{{oauth_token}}\"' }}"
        GATEWAY_HOSTNAME: "{{ '!unsafe \"{{host}}\"' }}"
        GATEWAY_USERNAME: "{{ '!unsafe \"{{username}}\"' }}"
        GATEWAY_PASSWORD: "{{ '!unsafe \"{{password}}\"' }}"
        GATEWAY_VERIFY_SSL: "{{ '!unsafe \"{{verify_ssl}}\"' }}"
        GATEWAY_OAUTH_TOKEN: "{{ '!unsafe \"{{oauth_token}}\"' }}"

controller_credentials:
  - name: Demo Credential
    credential_type: Machine
    update_secrets: true
    inputs:
      username: admin
      ssh_key_data: "{{ ssh_privatekey }}"
      password: "{{ common_password }}"

  - name: Controller Credential
    credential_type: Red Hat Ansible Automation Platform
    organization: Default
    inputs:
      host: "{{ ansible_automation_platform_configuration_host }}"
      username: "{{ ansible_automation_platform_configuration_username }}"
      password: "{{ ansible_automation_platform_configuration_password }}"

  - name: OpenShift Credential
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

  - name: AWS
    credential_type: Amazon Web Services
    organization: Default
    update_secrets: false
    inputs:
      username: "{{ aws_access_key_id }}"
      password: "{{ aws_secret_access_key }}"

  # TODO remove once AAPRFE-1898 is complete
  - name: Product Demos Bootstrap Credential
    description: Credential for Product Demos bootstrap
    credential_type: Product Demos Bootstrap Credential
    organization: Default
    update_secrets: false
    inputs:
      host: "{{ ansible_automation_platform_configuration_host }}"
      username: "{{ ansible_automation_platform_configuration_username }}"
      password: "{{ ansible_automation_platform_configuration_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    #scm_url: https://github.com/l3acon/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: always
