purpose: development
apd_bootstrap_scm_branch: jce/aap-config
controller_postinstall_repo_ref: jce/apd-org
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2025_06_16
aap_configuration_dispatcher_roles:
- role: gateway_settings
  var: gateway_settings
  tags: gateway_settings
- role: controller_settings
  var: controller_settings
  tags: controller_settings
- role: eda_decision_environments
  var: eda_decision_environments
  tags: eda_decision_environments
- role: controller_credential_types
  var: controller_credential_types
  tags: controller_credential_types
- role: controller_credentials
  var: controller_credentials
  tags: controller_credentials
- role: controller_projects
  var: controller_projects
  tags: controller_projects
- role: controller_job_templates
  var: controller_templates
  tags: controller_templates
- role: controller_job_launch
  var: controller_launch_jobs
  tags: controller_job_launch
controller_credentials:
- name: Demo Credential
  credential_type: Machine
  update_secrets: true
  inputs:
    username: admin
    ssh_key_data: '{{ ssh_privatekey }}'
    password: '{{ common_password }}'
- name: Controller Credential
  credential_type: Red Hat Ansible Automation Platform
  organization: Default
  inputs:
    host: '{{ ansible_automation_platform_configuration_host }}'
    username: '{{ ansible_automation_platform_configuration_username }}'
    password: '{{ ansible_automation_platform_configuration_password }}'
- name: OpenShift Credential
  description: Credentials for OpenShift
  organization: Default
  credential_type: OpenShift or Kubernetes API Bearer Token
  inputs:
    host: '{{ openshift_api_url }}'
    verify_ssl: true
    bearer_token: '{{ openshift_bearer_token }}'
- name: AWS
  credential_type: Amazon Web Services
  organization: Default
  update_secrets: false
  inputs:
    username: '{{ aws_access_key_id }}'
    password: '{{ aws_secret_access_key }}'
- name: Product Demos Bootstrap Credential
  description: Credential for Product Demos bootstrap
  credential_type: Product Demos Bootstrap Credential
  organization: Default
  update_secrets: false
  inputs:
    host: '{{ ansible_automation_platform_configuration_host }}'
    username: '{{ ansible_automation_platform_configuration_username }}'
    password: '{{ ansible_automation_platform_configuration_password }}'
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: 'yes'
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: always
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
