---
# #include /includes/access-restriction-aap-product-demos.yaml

# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

# --------------------
# common.yml overrides
# --------------------
apd_bootstrap_scm_branch: jce/aap-config

aap_configuration_dispatcher_roles:
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_settings, var: controller_settings, tags: controller_settings}
  - {role: eda_decision_environments, var: eda_decision_environments, tags: eda_decision_environments}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_templates}
  - {role: controller_job_launch, var: controller_launch_jobs, tags: controller_job_launch}

controller_execution_environments:
  - name: Product Demos EE
    image: quay.io/ansible-product-demos/apd-ee-25:latest

controller_projects:
  - name: APD | Ansible Product Demos Bootstrap
    organization: Default
    scm_type: git
    scm_url: https://github.com/ansible/product-demos-bootstrap.git
    scm_branch: "{{ apd_bootstrap_scm_branch }}"
    wait: true

controller_templates:
  - name: APD | Bootstrap Ansible Product Demos
    job_type: run
    inventory: Demo Inventory
    project: APD | Ansible Product Demos Bootstrap
    execution_environment: Product Demos EE
    playbook: install_product_demos.yml
    credentials: Controller Credential
    extra_vars:
      apd_ee_image_version: '25'
      aap_postinstall_repo_ref: jce/apd-org

controller_launch_jobs:
  - name: APD | Bootstrap Ansible Product Demos
    wait: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:2.1.0
      pull: always
