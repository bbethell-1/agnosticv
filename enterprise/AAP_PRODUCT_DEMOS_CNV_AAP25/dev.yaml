---
# #include /includes/access-restriction-aap-product-demos.yaml

# --------------------
# common.yml overrides
# --------------------

# TODO enable once a newer version of infra.aap_configuration is available
#gateway_role_user_assignments:
#  - user: apd-admin
#    role_definition: Organization Admin
#    object_ids:
#      - Ansible Product Demos (APD)

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.6
      pull: always

  sandboxes:
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Ansible Product Demos"
    category: Demos
    multiuser: false
    keywords:
      - ansible
      - apd
      - aap
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Automation
      Featured_Score: '81'
    parameters:
      - name: ocp4_workload_ansible_automation_platform_operator_channel
        formLabel: AAP Version
        openAPIV3Schema:
          default: "stable-2.6"
          type: string
          enum:
            - "stable-2.5"
            - "stable-2.6"
            - "stable-2.7"
      - name: azure_open_environment_type
        formLabel: Azure
        formGroup: Open Environments
        openAPIV3Schema:
          default: false
          type: boolean
      - name: ibm_open_environment_type
        formLabel: IBM
        formGroup: Open Environments
        openAPIV3Schema:
          default: false
          type: boolean
