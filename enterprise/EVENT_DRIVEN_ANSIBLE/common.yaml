---
#include /includes/catalog-icon-aap.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/parameters/ocp4-fips-enable.yaml

#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2
student_name: lab-user
student_password: "{{ common_password }}"
aws_region: us-east-2

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift variable
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL92GOLD-latest
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2024_07_15
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: set-repository
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# List of OpenShift Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_ansible_automation_platform_25
  - ocp4_workload_gitea_operator
  - ocp4_workload_cert_utils_operator
  - automation_platform_bastion
  - ansible_automation_platform_configuration
  - vscode-server

student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_starting_csv: gitea-operator.v2.1.0
ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.20.1"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: dev-admin
ocp4_workload_gitea_operator_admin_email: dev-admin@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: "{{ student_name }}"
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/redhat-gpte-devopsautomation/demo-event-driven-ansible.git
    name: event-driven-ansible
    private: false
  - repo: https://github.com/redhat-gpte-devopsautomation/eda-rulebooks.git
    name: eda-rulebooks
    private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader

# -------------------------------------------------------------------
# Workload: ansible_automation_platform_configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "{{ aap_controller_web_url }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "{{ aap_controller_admin_password }}"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: true
ansible_automation_platform_configuration_generate_ocp_token: true

controller_dependency_check: false

# --------------------------------------
# EDA vars
# --------------------------------------
eda_decision_environment_name: "AAP2.5 - OCP4 Custom Decision"
eda_decision_environment_image: "quay.io/mitsharm/eda/de-for-ocp-aap-25:latest"
eda_gitea_repo_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ student_name }}/eda-rulebooks.git"
controller_gitea_repo_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ student_name }}/event-driven-ansible.git"

# --------------------------------------
# infra aap configuration
# --------------------------------------
aap_configuration_dispatcher_roles: >
  {{ gateway_configuration_dispatcher_roles
    + controller_configuration_dispatcher_roles
    + eda_configuration_dispatcher_roles
  }}


# ----------------
# Gateway
# ----------------
aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

gateway_configuration_dispatcher_roles:
  - role: gateway_settings
    var: gateway_settings
    tags: gateway_settings

gateway_settings:
  SESSION_COOKIE_AGE: 9000

# ----------------
# Controller
# ----------------
controller_configuration_dispatcher_roles:
  - role: controller_credentials
    var: controller_credentials
    tags: controller_credentials
  - role: controller_projects
    var: controller_projects
    tags: controller_projects
  - role: controller_job_templates
    var: controller_templates
    tags: controller_job_templates

controller_credentials:
  - name: OpenShift Credentials
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

controller_configuration_projects_async_retries: 90

controller_projects:
  - name: event-driven-ansible
    organization: Default
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    scm_type: git
    scm_url: "{{ controller_gitea_repo_url }}"

controller_templates:
  - name: create-volume-snapshot
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/create-volume-snapshot.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
  - name: patch-route-with-cert
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/patch-route-with-cert.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
  - name: set-resource-quota-on-namespace
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/set-resource-quota-on-namespace.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

# ----------------
# EDA
# ----------------
eda_configuration_dispatcher_roles:
  - role: eda_credentials
    var: eda_credentials
    tags: eda_credentials
  - role: eda_decision_environments
    var: eda_decision_environments
    tags: eda_decision_environments
  - role: eda_projects
    var: eda_projects
    tags: eda_projects
  - role: eda_rulebook_activations
    var: eda_rulebook_activations
    tags: eda_rulebook_activations

eda_credentials:
  - name: "RH AAP Credential"
    description: "Red Hat Ansible Automation Platform Credential"
    organization: Default
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ ansible_automation_platform_configuration_host }}/api/controller/"
      password: "{{ ansible_automation_platform_configuration_password }}"
      username: "{{ ansible_automation_platform_configuration_username }}"
      verify_ssl: false

eda_decision_environments:
  - name: "{{ eda_decision_environment_name }}"
    description: "Decision Environment for OpenShift"
    organization: Default
    image_url: "{{ eda_decision_environment_image }}"

eda_projects:
  - name: "OpenShift Event Rulebooks"
    description: "Event-driven Ansible rulebooks"
    organization: Default
    url: "{{ eda_gitea_repo_url }}"
    tls_validation: false

eda_rulebook_activations:
  - name: "Patch Route With Cert"
    description: "Patch OpenShift Routes"
    organization: Default
    project: "OpenShift Event Rulebooks"
    rulebook: "patch_route.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: false
    eda_credentials: "RH AAP Credential"
    state: present
  - name: "Set Resource Quota On Namespace"
    description: "Set Resource Quota on OpenShift namespace"
    organization: Default
    project: "OpenShift Event Rulebooks"
    rulebook: "resource_quota.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    eda_credentials: "RH AAP Credential"
    enabled: false
    state: present
  - name: "Create Volume Snapshot"
    description: "Create PVC volume snapshot"
    organization: Default
    project: "OpenShift Event Rulebooks"
    rulebook: "volume_snapshot.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    eda_credentials: "RH AAP Credential"
    enabled: false
    state: present

# -------------------------------------------------------------------
# Workload: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: true
vscode_use_automationcontroller_nginx: false
vscode_server_ansible_become: true
vscode_user_workspace_path: "/home/{{ student_name }}"
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_hostname: bastion.{{ guid }}.{{ sandbox_zone }}
vscode_ansible_python_interpreter: /usr/libexec/platform-python
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.kube": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true },
  "security.workspace.trust.enabled": false

vscode_user_workspace_repos:
  - repo: "{{ controller_gitea_repo_url }}"
    name: demo
    branch: main
  - repo: "{{ eda_gitea_repo_url }}"
    name: eda-rulebooks
    branch: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
sandbox_user_info_messages_enable: true

__meta__:
  asset_uuid: 003a0cfc-0501-4ccf-8f13-0448ed4c6080
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com
    sme:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com
  anarchy:
    namespace: babylon-anarchy-0
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Event-driven Ansible with OpenShift Demo
    category: Demos
    keywords:
      - eda
      - ansible
      - openshift
      - ocp
    labels:
      Base_Component: 'True'
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
      SLA: Featured
      Featured_Score: '81'
    parameters:
      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.4xlarge
          enum:
            - m6a.4xlarge
            - m6a.2xlarge
    reportingLabels:
      primaryBU: Automation
      secondaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: missing
