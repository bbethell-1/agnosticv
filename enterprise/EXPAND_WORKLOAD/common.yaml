---
#include /includes/catalog-icon-rhel.yaml
#include /enterprise/includes/parameters/salesforce-id.yaml
#include /enterprise/includes/parameters/purpose.yaml
#include /enterprise/includes/terms-of-service.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /enterprise/includes/aws-sandbox-meta.yaml
#include /enterprise/includes/parameters/aws-region.yaml
#include /enterprise/includes/enterprise-premium-sla.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: expanding-workload-rhel
software_to_deploy: none
install_student_user: true
bastion_instance_image: RHEL90GOLD

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
ocp4_workload_bookbag_auth_username: "{{ ansible_service_account_user_name }}"
ocp4_workload_bookbag_auth_password: "{{ student_password }}"
ocp4_workload_bookbag_console_deploy: false
ocp4_workload_bookbag_namespace: "{{ guid }}"
ocp4_workload_bookbag_name: "containerize"
ocp4_workload_bookbag_git_url: https://github.com/redhat-gpte-devopsautomation/containerize-app-demo-bookbag.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Expanding Your Workload To The Cloud
    category: Demos
    labels:
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      SLA: Enterprise_Premium
      #Use_Case:
      Sales_Play: Standardize_on_Linux
      Featured_Score: '80'
    keywords:
      - Containers
      - image-builder
      - SalesPlay
      - salesplay
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  secrets:
    - name: gpte
      namespace: gpte
    - name: satellite-rhel90-ha
      namespace: gpte
