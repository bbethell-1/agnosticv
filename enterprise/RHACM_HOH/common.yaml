# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: rhacm_hoh_binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: RHACM Hub of Hubs
    category: Demos
    keywords:
    - hypershift
    labels:
      Product: Red_Hat_Advanced_Cluster_Management_for_Kubernetes
      Product_Family: Red_Hat_Cloud
      Provider: Portfolio_Product_Marketing
      Support_Type: Enterprise_Premium
      Featured_Score: '90'
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: rhacm_hub_primary
    display_name: RHACM HOH Primary
    item: enterprise/RHACM_HOH_PRIMARY
    propagate_provision_data:
    - var: rhacm_hoh_primary_provision_data
  - name: rhacm_hub_secondary
    display_name: RHACM HOH Secondary
    item: enterprise/RHACM_HOH_PRIMARY
    propagate_provision_data:
    - var: rhacm_hoh_secondary_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
