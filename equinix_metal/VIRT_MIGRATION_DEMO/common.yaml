configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "aap-aap.apps.{{ guid }}.{{ cluster_dns_zone }}"
  controller_username: admin
  controller_password: "{{ common_password }}"
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
- role: credential_types
  var: controller_credential_types
  tags: credential_types
- role: credentials
  var: controller_credentials
  tags: credentials
- role: execution_environments
  var: controller_execution_environments
  tags: execution_environments
- role: projects
  var: controller_projects
  tags: projects
- role: inventories
  var: controller_inventories
  tags: inventories
- role: inventory_sources
  var: controller_inventory_sources
  tags: inventory_sources
- role: job_templates
  var: controller_templates
  tags: templates

controller_projects:
- name: "{{ project_name }}"
  organization: "{{ organization }}"
  scm_branch: "{{ scm_branch }}"
  scm_clean: 'false'
  scm_delete_on_update: 'false'
  scm_type: "{{ scm_type }}"
  scm_update_on_launch: 'true'
  scm_url: "{{ scm_url }}"

# controller_credential_types:
#   - name: "kubeconfig"
#     inputs:
#       fields:
#       - type: string
#         id: kube_config
#         label: kubeconfig
#         secret: true
#         multiline: true
#     injectors:
#       env:
#         K8S_AUTH_KUBECONFIG: !unsafe "{{ tower.filename.kubeconfig }}"
#       file:
#         template.kubeconfig: !unsafe "{{ kube_config }}"

controller_credentials:
- name: "Linux VMs SSH Access"
  credential_type: Machine
  organization: Default
  inputs:
    username: "{{ linux_vm_username }}"
    ssh_key_data: "{{ linux_vm_ssh_key }}"

- name: "kubeconfig"
  credential_type: "kubeconfig"
  organization: "Default"
  inputs:
    kube_config: "{{ kubeconfig }}"

- name: "VMware Credentials"
  credential_type: "VMware vCenter"
  organization: Default
  inputs:
    host: "{{ vmware_host }}"
    username: "{{ vmware_username }}"
    password: "{{ vmware_password }}"

controller_execution_environments:
- name: "AWX EE"
  image: "{{ awx_ee_image }}"
  pull: missing

controller_inventories:
- name: "OpenShift Virtualization Inventory"
  organization: "{{ organization }}"

controller_inventory_sources:
- name: OpenShift Virtualization Source
  source: scm
  source_project: "{{ project_name }}"
  source_path: inventory.kubevirt.yml
  inventory: OpenShift Virtualization Inventory
  credential: "kubeconfig"
  execution_environment: "AWX EE"
  organization: "{{ organization }}"
  overwrite: true
  update_on_launch: true
  update_cache_timeout: 0
  wait: true

controller_templates:
- name: 04 Configure Lamp Stack Linux VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ linux_vm_playbook }}"
  limit: namespace_linuxvm
  credentials: "Linux VMs SSH Access"
  survey: {}
  extra_vars: {}

- name: 02 Provision Linux VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ linux_provision_vm_playbook }}"
  credentials: "kubeconfig"
  survey: {}
  extra_vars:
    ssh_public_key: "{{ ssh_public_key }}"
    vm_password: "{{ linux_vm_password }}"

- name: 05 Configure DevOps Users on Linux VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ linux_configure_vm_playbook }}"
  limit: namespace_linuxvm
  credentials: "Linux VMs SSH Access"
  survey: {}
  extra_vars: {}

- name: 01 Migrate VMware VMs to OpenShift Virtualization
  job_type: run
  organization: "{{ organization }}"
  inventory: Demo Inventory
  project: "{{ project_name }}"
  playbook: "{{ migration_playbook }}"
  credentials:
  - "kubeconfig"
  - "VMware Credentials"
  survey_enabled: true
  survey: "{{ aap_job_template_basic_survey }}"
  extra_vars:
    vmware_host: "{{ vmware_host }}"

- name: 03 Add Repositories to RHEL VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ repo_playbook }}"
  credentials: "Linux VMs SSH Access"
  limit: namespace_linuxvm
  survey_enabled: true
  survey: "{{ aap_job_template_repo_survey }}"
  extra_vars: {}

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/virt-migration-demo
ocp4_workload_showroom_content_git_repo_ref: v1.0.0
ocp4_workload_showroom_content_antora_playbook: demo-site.yml

