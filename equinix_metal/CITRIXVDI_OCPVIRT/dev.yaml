---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/parameters/equinix-region.yaml
purpose: development
env_type: citrixvdi-ocpvirt
ocp4_aio_ocp_version: 4.13.4
aio_import_url: "http://s3.us-east.cloud-object-storage.appdomain.cloud/roadshowocpvirt"
build_lab: true
bookbag_git_repo: https://github.com/agonzalezrh/citrix_vdi_ocp_virt

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    #virtualenv: equinix_metal-ansible2.9-python3.6-2021-07-02
    scm_ref: citrixvdiocpvirt
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: dynamic-dns
    - namespace: gpte
      name: gpte-vdi
