---
#include /includes/ansible_control_plane/current_controller.yaml
purpose: development
env_type: ocpv-nextgen
ocp4_aio_ocp_version: 4.13.4
aio_import_url: "http://s3.us-east.cloud-object-storage.appdomain.cloud/roadshowocpvirt"
build_lab: false
bookbag_git_repo: https://github.com/agonzalezrh/ocp4-nextgen-instructions
equinix_metal_facility: dc10

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    #virtualenv: equinix_metal-ansible2.9-python3.6-2021-07-02
    scm_ref: ocp4-nextgen
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:hotfix-eqx-2024-04-02.2
      pull: missing
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: dynamic-dns
