---
#include /includes/catalog-icon-equinix.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service-equinix.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/equinix-region.yaml
#include /includes/parameters/equinix-hypervisor-type.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml

platform: RHPDS
env_type: just-a-bunch-of-nodes
hypervisor_os: rocky_8
hypervisor_count: 1

# Don't configure repos as this is a Rocky Linux
repo_method: none
install_common: false

# Do install env key
install_student_user: true
student_name: lab-user

# Open Environment
agnosticd_open_environment: True

# Meta variables
agnosticv_meta:
  deploy_with: babylon
  secrets:
    - equinix-metal-gpte
    - dynamic-dns

infra_workloads:
  - ocp4_workload_telco_hypershift_lab

__meta__:
  anarchy:
    namespace: babylon-anarchy-equinix-metal
  deployer:
    virtualenv: equinix_metal-ansible2.9-python3.6-2022-08-11

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Hosted Control Planes for Telcos
    category: Workshops
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - virtualization
      - baremetal
      - aio
      - equinix
      - cnv
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      Provider: RHDP
    parameters: []
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: dynamic-dns

  runtime:
    default: 999d
    maximum: 999d
