---
cloud_provider: equinix_metal

# Increase wait seconds
equinix_metal_provisioning_wait_seconds: 500

cloud_tags:
  env_type: "{{ env_type }}"
  guid: "{{ guid }}"
  uuid: "{{ uuid }}"
  platform: "{{ platform | d('unknown') }}"

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  babylon:
    # This file lives in ~/secrets on the deploy host
    kubeconfig: babylon-prod.kubeconfig
