---
#include /includes/ansible_control_plane/current_controller.yaml

purpose: production

# Extra packages to install
common_extra_packages:
- tmux

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  -----------------------------------------------------------------------------
  Welcome to the Hosted Control Plane Clusters on OpenShift Virtualization Lab!
  -----------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ------------------------------------------------------------------------------

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"


ocp4_workload_showroom_content_git_repo_ref: showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom_hcp_kubevirt.git

ocp4_workload_showroom_deployment_type: helm
#ocp4_workload_showroom_deployment_type: argocd

ocp4_workload_showroom_content_only: false
#ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.0.1"
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-equinix-metal
  catalog:
    display_name: Hosted Control Plane Clusters on OpenShift Virtualization
    category: Red_Hat_One
  deployer:
    scm_ref: hcp-ocpv
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
