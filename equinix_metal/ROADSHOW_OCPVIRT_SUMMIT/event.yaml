    scm_ref: ocpvirtroadshowsummit
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: dynamic-dns
    - namespace: gpte
      name: gpte-vmc
    - namespace: gpte
      name: gpte-ipa-vc
