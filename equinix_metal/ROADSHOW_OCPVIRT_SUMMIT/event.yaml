---
#include /includes/parameters/event-lifetime-runtime.yaml
purpose: event
env_type: roadshow-ocpvirt
ocp4_aio_ocp_version: 4.13.4
aio_import_url: "http://s3.us-east.cloud-object-storage.appdomain.cloud/roadshowocpvirt"
build_lab: false
bookbag_git_repo: https://github.com/rhpds/roadshow_ocpvirt_instructions
bookbag_git_version: summit
equinix_metal_facility: dc10

##########################
# Babylon meta variables #
##########################
__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    #virtualenv: equinix_metal-ansible2.9-python3.6-2021-07-02
    scm_ref: ocpvirtroadshow
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: dynamic-dns
    - namespace: gpte
      name: gpte-vmc
    - namespace: gpte
      name: gpte-ipa-vc
