---
#include /includes/catalog-icon-equinix.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service-equinix.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/equinix-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
platform: RHPDS
env_type: equinix-baremetal-node
hypervisor_type: m3.large.x86
hypervisor_os: rhel_8
hypervisor_count: 1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_5gran_deployments_lab

pull_secret: "{{ ocp4_pull_secret }}"

set_env_authorized_key: false

# Don't configure repos as this is a RHEL Linux
repo_method: none
install_common: false
install_bastion: false

# Do install env key
install_student_user: true
student_name: lab-user

# Open Environment
agnosticd_open_environment: True

# Meta variables
agnosticv_meta:
  deploy_with: babylon
  secrets:
    - equinix-metal-gpte
    - dynamic-dns

__meta__:
  asset_uuid: 71fae99a-84d8-4b31-926b-341a0f8cff90
  anarchy:
    namespace: babylon-anarchy-equinix-metal
  deployer:
    virtualenv: equinix_metal-ansible2.9-python3.6-2021-07-02
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: 5G RAN Deployment on OpenShift
    category: Workshops
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - workshop
      - openshift
      - ran
      - equinix
      - 5g
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      Provider: RHDP
    parameters: []
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: dynamic-dns
    - namespace: gpte
      name: ocp4-token

  lifespan:
    default: 12h
    maximum: 24h
    relativeMaximum: 24h
  runtime:
    default: 12h
    maximum: 24h
