---
purpose: development

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    scm_ref: equinix-babylon

  access_control:
    allow_groups:
      - babylon-admins
      - babylon-devs
  catalog:
    display_name: OpenShift all-in-one on baremetal (Equinix Metal)
    namespace: babylon-catalog-dev

    description: >-
      This config is meant to deploy either a full OpenShift cluster using the BareMetal IPI or several Single Node Openshift Clusters using the BareMetal IPI / In-Place install. It also provides options to install several products on top of the deployed cluster(s), including ACM, ACS and CNV.
