---
#include /includes/parameters/showroom-ocp-defaults.yaml

purpose: development
env_type: roadshow-ocpvirt
ocp4_aio_ocp_version: 4.15.14

# ------------------------------------------------------
# Infra Workloads to deploy
# ------------------------------------------------------
infra_workloads:
- ocp4_workload_showroom

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_git_repo: https://github.com/RedHatGov/roadshow_ocpvirt_instructions-bootcamp-edition

ocp4_workload_showroom_content_only: false
#ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true


##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    scm_ref: judd-add-workloads
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:hotfix-eqx-2024-04-02.2
      pull: missing
  catalog:
    parameters:
    - name: preinstall_operators
      description: Preinstall Operators (OCP-V, MTV, nmstate)
      formLabel: Preinstall operators
      openAPIV3Schema:
        type: boolean
        default: true
    - name: ocp4_workload_showroom_content_git_repo_ref
      description: Showroom git repo branch (main, eds-edits, etc.)
      formLabel: Showroom git repo branch
      openAPIV3Schema:
        type: string
        default: 'main'
