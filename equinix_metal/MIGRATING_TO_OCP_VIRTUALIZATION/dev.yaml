---
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
equinix_metal_facility: dc10
purpose: development
env_type: migrating-to-ocpvirt
ocp4_aio_ocp_version: 4.13.6
aio_import_url: "http://s3.us-east.cloud-object-storage.appdomain.cloud/mig2ocpvirt/413"
build_lab: false
hypervisor_os: rhel_8

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: dynamic-dns
    - namespace: gpte
      name: rhev_dev_credentials
