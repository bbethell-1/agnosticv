---
#include /includes/parameters/event-selector.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/access-restriction-RH1-devs.yaml
#include /includes/ansible_control_plane/event_controller.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event
ocp4_aio_ocp_version: 4.14.6
install_operators: True
ocp4_aio_deploy_cnv: "{{ install_operators }}"
# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"


ocp4_workload_showroom_content_git_repo_ref: showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom_migrating_to_ocpvirt.git

ocp4_workload_showroom_deployment_type: helm
#ocp4_workload_showroom_deployment_type: argocd

ocp4_workload_showroom_content_only: false
#ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.0.0"
##########################
# Babylon meta variables #
##########################
__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-devs-rh1
  catalog:
    display_name: Migrating to OpenShift Virtualization
    category: Red_Hat_One
  deployer:
    scm_ref: mig2ocpvirt-rh1
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
