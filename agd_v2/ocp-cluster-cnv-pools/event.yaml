---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/event_controller.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml
#include /includes/access-restriction-admins-only.yaml

# -------------------------------------------------------------------
# Tag for standard collections and deployer scm_ref.
# cloud_provider_openshift_cnv uses its own versioning (1.x.x)
# so cloud_provider_version is overridden explicitly.
# -------------------------------------------------------------------
tag: ocp-cnv-pool-1.2.0
cloud_provider_version: "1.2.0"

__meta__:
  deployer:
    scm_ref: ocp-cnv-pool-1.2.0
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      events: "yes"
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2000Gi
      requests.memory: 2000Gi
