---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/access-restriction-admins-only.yaml

# -------------------------------------------------------------------
# Tag for standard collections and deployer scm_ref.
# cloud_provider_openshift_cnv uses its own versioning (1.x.x)
# so cloud_provider_version is overridden explicitly.
# -------------------------------------------------------------------
tag: ocp-cnv-pool-1.2.4
cloud_provider_version: "1.2.0"

__meta__:
  deployer:
    scm_ref: ocp-cnv-pool-1.2.4
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv09
        virt: "yes"
      quota:
        requests.storage: "2500Gi"
        limits.cpu: '999'
        requests.cpu: '999'
        limits.memory: 2500Gi
        requests.memory: 2500Gi
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
