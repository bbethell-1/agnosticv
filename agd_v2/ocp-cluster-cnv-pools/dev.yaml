---
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    annotations:
      namespace_userdefinednetwork: "true"
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2000Gi
      requests.memory: 2000Gi
  deployer:
    scm_url: https://github.com/agonzalezrh/agnosticd-v2
    scm_ref: main
