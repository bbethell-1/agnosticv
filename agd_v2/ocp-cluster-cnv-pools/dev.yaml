---
# -------------------------------------------------------------------
# Reduce NooBaa resource requests for compact cluster
# Defaults: core/db/endpoint=3000m, backing-store=800m
# Actual usage: core=149m, db=57+35m, endpoint=17m, backing-store=1-6m
# -------------------------------------------------------------------

# NooBaa core, DB, and endpoint (all use the same variable)
ocp4_workload_external_odf_noobaa_custom_resources: true
ocp4_workload_external_odf_noobaa_cpu_requests: "250m"
ocp4_workload_external_odf_noobaa_cpu_limits: "1"
ocp4_workload_external_odf_noobaa_memory_requests: "1Gi"
ocp4_workload_external_odf_noobaa_memory_limits: "2Gi"

# NooBaa backing store agents (3 pods)
ocp4_workload_external_odf_backingstore_cpu_requests: "100m"
ocp4_workload_external_odf_backingstore_cpu_limits: "500m"
ocp4_workload_external_odf_backingstore_memory_requests: "256Mi"
ocp4_workload_external_odf_backingstore_memory_limits: "1Gi"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
