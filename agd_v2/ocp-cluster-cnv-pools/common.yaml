---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: Red Hat OpenShift Container Platform
#                   Cluster (CNV Pools)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml


#include /includes/parameters/purpose.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/ocp4_workload_ols_api_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: openshift-cluster

# Required to scale up the cluster
openshift_cnv_set_sandbox_provision_data: true

# Default cluster size for sandbox validation (overridden by catalog parameter)
cluster_size: "{{ cluster_size | default('sno') }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main

  # AI Workloads (for OpenShift Lightspeed)
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: main

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
# Version from parameter
# host_ocp4_installer_version: "4.19"
host_ocp4_deploy_installation_method: openshift_assisted

# Save kubeadmin password in user data - only necessary if
# no authentication is set up for the cluster
host_ocp4_installer_set_user_data_kubeadmin_password: true

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 8900

# -------------------------------------------------------------------
# Cluster sizing based on selected size (sno/multinode)
# -------------------------------------------------------------------
# SNO: 1 control plane node only
# Multinode: 3 control plane (compact)
control_plane_instance_count: "{{ 1 if cluster_size == 'sno' else 3 }}"
worker_instance_count: 0

# Control plane configuration
ai_control_plane_cores: "{{ '32' if cluster_size == 'sno' else '16' }}"
ai_control_plane_memory: "{{ '128Gi' if cluster_size == 'sno' else '64Gi' }}"

# Worker node configuration (only for multinode)
# ai_workers_cores: ""
# ai_workers_memory: ""

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_cert_manager
- "{{ 'agnosticd.ai_workloads.ocp4_workload_ols' if ols_enable | default(true) | bool else '' }}"

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: >-
  {{
    {
      '4.18': 'stable-4.18',
      '4.19': 'stable-4.18',
      '4.20.0': 'stable-4.20',
      '4.20': 'stable-4.20'
    }.get(host_ocp4_installer_version, 'stable-' + host_ocp4_installer_version)
  }}
ocp4_workload_external_odf_operator_automatic_install_plan_approval: true
ocp4_workload_external_odf_operator_starting_csv: ""
ocp4_workload_external_odf_operator_use_catalog_snapshot: false
ocp4_workload_external_odf_operator_catalog_source_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_external_odf_operator_catalog_source_tag: "v4.18_2025_10_23"
ocp4_workload_external_odf_backingstore_custom_resources: true
ocp4_workload_external_odf_backingstore_cpu_limits: 1000m
ocp4_workload_external_odf_backingstore_cpu_requests: 800m
ocp4_workload_external_odf_backingstore_memory_limits: 4000Mi
ocp4_workload_external_odf_backingstore_memory_requests: 800Mi
ocp4_workload_external_odf_backingstore_storage_requests: 50Gi
ocp4_workload_external_odf_noobaa_custom_resources: true
ocp4_workload_external_odf_noobaa_memory_limits: 4Gi
ocp4_workload_external_odf_noobaa_memory_requests: 4Gi
ocp4_workload_external_odf_noobaa_cpu_limits: 3
ocp4_workload_external_odf_noobaa_cpu_requests: 3

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_cloud_provider: aws

# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:
ocp4_workload_cert_manager_aws_region: us-east-2
ocp4_workload_cert_manager_aws_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_aws_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols (OpenShift Lightspeed)
# -------------------------------------------------------------------
# Enabled by default (ols_enable: true)
# Use Azure AI as the backend for OpenShift Lightspeed
ocp4_workload_ai_platform: azure

# Automatically create and manage Azure AI tokens
ocp4_workload_ols_get_token: true

# Disable RAG (Retrieval-Augmented Generation) for pool clusters
ocp4_workload_ols_enable_rag: false

# Do not create broken pod - not needed in pool clusters
ocp4_workload_ols_create_broken_pod: false

# ===================================================================
# Workloads to remove on destroy
# ===================================================================
remove_workloads: >-
  {{
    ['agnosticd.ai_workloads.ocp4_workload_ols'] if ols_enable | default(true) | bool else []
  }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8b761fe8-1f21-4fad-8589-32c9dbaaac42
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    - name: Alberto Gonzalez Rodriguez
      email: josegonz@redhat.com
  anarchy:
    namespace: babylon-anarchy-2
  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenShift Container Platform Cluster (CNV Pools)
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '71'
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: cluster_size
      description: >-
        Cluster size configuration that determines the number of control plane and worker nodes.
      formLabel: Cluster Size
      openAPIV3Schema:
        type: string
        default: sno
        enum:
        - sno
        - multinode
    - name: host_ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.18'
        - '4.19'
        - '4.20.0' #locking down version for RH1
        - '4.20'
      annotation: demo.redhat.com/ocp-version
      variable: host_ocp4_installer_version
    - name: ols_enable
      description: Enable OpenShift Lightspeed (OLS with RAG disabled for pool clusters)
      formLabel: Enable OpenShift Lightspeed
      required: false
      openAPIV3Schema:
        type: boolean
        default: true
      annotation: demo.redhat.com/ols-enable
      variable: ols_enable
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2000Gi
      requests.memory: 2000Gi
