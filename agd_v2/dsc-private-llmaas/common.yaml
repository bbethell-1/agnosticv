# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: namespace

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Roles to deploy to a shared cluster
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: main
  # Core workloads (for Showroom)
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Workloads to deploy on the cluster (YAML List)
workloads:
- agnosticd.namespaced_workloads.ns_private_lmaas
- agnosticd.core_workloads.ocp4_workload_showroom

