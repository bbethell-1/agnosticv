# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 25b96fda-3372-4b47-8a5c-964ee5b04267
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
  anarchy:
    namespace: babylon-anarchy-7
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Private LLMaaS (Dedicated Shared Cluster) - AgdV2
    category: Workshops
    keywords:
    - openshift
    - openshift ai
    - maas
    labels:
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
      Provider: RHDP
    multiuser: false
    reportingLabels:
      primaryBU: Artificial_Intelligence
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: pllm
    cloud_selector:
      cloud: cnv-dedicated-shared
      demo: private-llm
      purpose: prod
      keycloak: "yes"
    quota:
      requests.storage: 100Gi
      limits.cpu: "10"
      requests.cpu: "10"
      limits.memory: 20Gi
      requests.memory: 20Gi
