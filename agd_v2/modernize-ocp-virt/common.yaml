---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Accelerating Infrastructure Modernization with OpenShift Virtualization
#                   Cluster (CNV)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/ocp4_workload_ols_api_token.yaml

#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: 1.1.0
config: openshift-cluster

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: 1.3.0
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: ocp-cluster-cnv-1.0.0
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.3.7

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 2Gi

control_plane_instance_count: 3
worker_instance_count: "{{ 3 if num_users | int <= 3 else [(num_users | int / 2) | round(0, 'ceil') | int, 3] | max }}"

ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
bastion_setup_student_user: true

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.20.3"
host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true

cluster_name: "cluster-{{ guid }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_authentication_rhsso
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_servicemesh3
- agnosticd.core_workloads.ocp4_workload_kiali
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# ===================================================================
# Variables for specific workloads
# ===================================================================
ocp4_workload_admin_username: admin
ocp4_workload_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2025_12_09

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: stable-4.20
ocp4_workload_external_odf_operator_use_catalog_snapshot: true
ocp4_workload_external_odf_operator_catalog_source_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_external_odf_operator_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication_rhsso
# -------------------------------------------------------------------
ocp4_workload_authentication_rhsso_channel: stable
ocp4_workload_authentication_rhsso_use_catalog_source: true
ocp4_workload_authentication_rhsso_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_authentication_rhsso_admin_username: "{{ ocp4_workload_admin_username }}"
ocp4_workload_authentication_rhsso_admin_password: "{{ ocp4_workload_admin_password }}"
ocp4_workload_authentication_rhsso_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_rhsso_user_name_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_rhsso_user_password: "{{ ocp4_workload_user_password }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.18
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: true
ocp4_workload_openshift_virtualization_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_servicemesh3
# -------------------------------------------------------------------
ocp4_workload_servicemesh3_channel: stable
ocp4_workload_servicemesh3_use_catalog_snapshot: true
ocp4_workload_servicemesh3_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_servicemesh3_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_servicemesh3_istio_version: v1.26.4

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_kiali
# -------------------------------------------------------------------
ocp4_workload_kiali_channel: stable
ocp4_workload_kiali_use_catalog_snapshot: true
ocp4_workload_kiali_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kiali_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.ai_workloads.ocp4_workload_ols
# -------------------------------------------------------------------
# Create a child app and SP for this lab environment
# It is removed when the environment is destroyed
ocp4_workload_ols_get_token: true
ocp4_workload_ai_platform: azure

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
gitops_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/modernize-ocp-virt-gitops
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ ocp4_workload_user_count }}"
    base: "{{ ocp4_workload_user_base }}"
  workspace:
    git:
      revision: "{{ gitops_repo_revision }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_showroom_ocp_integration
# -------------------------------------------------------------------
ocp4_workload_showroom_ocp_integration_openshift_api_url: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
ocp4_workload_showroom_ocp_integration_openshift_api_token: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_token') }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
showroom_repo_revision: v1.0.0
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/modernize-ocp-virt-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.0.2
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2025-07-29

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8c7d5b38-0d34-4dc9-a814-fc520b1e92f4
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Accelerating Infrastructure Modernization with OpenShift Virtualization (CNV)"
    category: Brand_Events
    keywords:
    - service mesh
    - gitops
    - rh1-2026
    - lb8685
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
      Platform: OpenShift
      TDP1: Virtualization
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 20
    workshopLabUiRedirect: true
    workshop_user_mode: multi
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      limits.cpu: "256"
      limits.memory: "2048Gi"
      requests.memory: "1024Gi"
      requests.storage: "2000Gi"
      # Following settings required when num_users is 60 with 30 worker nodes.
      # pods: "40"
      # limits.cpu: "640"
      # limits.memory: "2048Gi"
      # requests.memory: "2048Gi"
      # requests.storage: "5000Gi"
  sandbox_api:
    actions:
      destroy:
        # Allow the ocp4_workload_ols remove_workload to run
        catch_all: false
