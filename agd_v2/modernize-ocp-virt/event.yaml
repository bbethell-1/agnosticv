---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: ocpv09
      virt: "yes"
    quota:
      limits.cpu: "256"
      limits.memory: "2048Gi"
      requests.memory: "1024Gi"
      requests.storage: "2000Gi"
      # Following settings required when num_users is 60 with 30 worker nodes.
      # pods: "40"
      # limits.cpu: "640"
      # limits.memory: "2048Gi"
      # requests.memory: "2048Gi"
      # requests.storage: "5000Gi"
