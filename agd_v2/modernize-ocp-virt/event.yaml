---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/event_controller.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      events: "true"
      virt: "yes"
    quota:
      limits.cpu: "256"
      limits.memory: "2048Gi"
      requests.memory: "1024Gi"
      requests.storage: "2000Gi"
      # Following settings required when num_users is 60 with 30 worker nodes.
      # pods: "40"
      # limits.cpu: "640"
      # limits.memory: "2048Gi"
      # requests.memory: "2048Gi"
      # requests.storage: "5000Gi"
