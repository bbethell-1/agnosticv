---
# -------------------------------------------------------------------
# --- Catalog Item: Infoscale Demo - MultiSNO Base Config
# -------------------------------------------------------------------

# The workshop is a TWO SNO environemnt.
#
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
tag: main

cloud_provider: openshift_cnv
# github.com/rhpds/cloud_provider_openshift_cnv -- pinned via cloud_provider_version in prod.yaml
# (uses its own 1.x.x versioning, not the ocp-cnv-pool-x.x.x scheme)
cloud_provider_version: "{{ tag }}"
config: openshift-cluster

# Required to scale up the cluster, but we don't do this for infoscale lab
# openshift_cnv_set_sandbox_provision_data: true

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "main"

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
# Version from parameter
host_ocp4_installer_version: "4.21.3"
host_ocp4_deploy_installation_method: openshift_assisted

# Save kubeadmin password in user data - only necessary if
# no authentication is set up for the cluster
host_ocp4_installer_set_user_data_kubeadmin_password: true

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 8900

# -------------------------------------------------------------------
# Cluster sizing
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true

worker_instance_count: "0"

# Control plane configuration
control_plane_instance_count: "1"
ai_control_plane_cores: "18"
ai_control_plane_memory: "48Gi"

ai_network_prefix_length: 16
ai_extra_sno_clusters: # make this an option
- name: dr
  ai_network_prefix: "10.10.20"
  # add resources and disk options here
  # if nothing present, will inherit from primary
  # ai_network_prefix_length: 16
  # ai_extra_sno_clusters:
  # - name: cluster2
  #   ai_network_prefix: "10.10.20"
  #   ai_control_plane_cores: "12"
  #   ai_control_plane_memory: "32Gi"

ai_control_plane_extra_disks:
- metadata:
    name: "first-extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "50Gi"
- metadata:
    name: "second-diskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "50Gi"
- metadata:
    name: "third-diskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "50Gi"
- metadata:
    name: "fourth-diskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "50Gi"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_cert_manager

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_cloud_provider: aws

# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:
ocp4_workload_cert_manager_aws_region: us-east-2
ocp4_workload_cert_manager_aws_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_aws_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 26989e91-e567-4e40-bf57-0c122905c854
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Alberto Gonzalez Rodriguez
      email: josegonz@redhat.com
  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Infoscale Demo: MultiSNO Base Config"
    category: Workshops
    keywords: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms

    parameters: []

  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      # purpose: prod
      name: ocpv09
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2000Gi
      requests.memory: 2000Gi
