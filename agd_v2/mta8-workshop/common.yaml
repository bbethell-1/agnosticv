---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: MTA 8 Workshop
# --- Validation enabled by default
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/litemaas-master_api.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
# Only scale for more than 3 users
openshift_cnv_scale_cluster: "{{ (num_users | int) > 3 }}"
# One additional worker for each 5 users (only when scaling is enabled)
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 1] | max if (num_users | int) > 3 else 0 }}"
ai_workers_cores: 16
ai_workers_memory: 32Gi

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.3.2"

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # RHPDS MTA Workloads
  - name: https://github.com/rhpds/mta_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.1

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_devspaces
- rhpds.mta_workloads.ocp4_workload_mta8
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
- qwen36-35b-a3b
- llama-scout-17b

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"

ocp4_workload_authentication_num_users: "{{ (num_users | default('2')) | int }}"
ocp4_workload_authentication_user_basename: user
ocp4_workload_authentication_user_password: "{{ common_user_password }}"

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.6
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.21
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[email,groups]'

# Application Controller
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

# Sync every 30 seconds to reduce wait times between updates
ocp4_workload_openshift_gitops_controller_app_sync: 30s

# Allow invidual users to see only their own Applications in the System ArgoCD console
ocp4_workload_openshift_gitops_per_user_access: true
ocp4_workload_openshift_gitops_user_count: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_openshift_gitops_user_base: "{{ ocp4_workload_authentication_user_basename }}"
ocp4_workload_openshift_gitops_user_project_prefix: "appproject-"
ocp4_workload_openshift_gitops_user_cluster_resource_whitelist:
- group: ""
  kind: Namespace

# Do not use a catalog snapshot - rely on the channel version
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.3.2
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.26.4"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
# ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
# ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: mtaadmin
ocp4_workload_gitea_operator_admin_email: mtaadmin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password}}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_user_basename }}%d"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true

ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/rh-mad-workshop/modern-app-dev.git
  name: modern-app-dev
  branch: mta-lab
  private: false
- repo: https://github.com/rhpds/mca-devspaces.git
  name: mca-devspaces
  branch: main
  private: false
- repo: https://github.com/rhpds/mca-coolstore.git
  name: mca-coolstore
  branch: main
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable

# -------------------------------------------------------------------
# ocp4_workload_devspaces
# -------------------------------------------------------------------
ocp4_workload_devspaces_catalogsource_setup: false
ocp4_workload_devspaces_channel: stable
ocp4_workload_devspaces_namespace: openshift-devspaces

ocp4_workload_devspaces_user_base: "{{ ocp4_workload_authentication_user_basename }}"
ocp4_workload_devspaces_user_count: "{{ ocp4_workload_authentication_num_users | int }}"

ocp4_workload_devspaces_setup_devworkspaces: true

ocp4_workload_devspaces_devworkspace_project: migration-project

ocp4_workload_devspaces_devworkspace_name: workspace
ocp4_workload_devspaces_devworkspace_namespace_base: devworkspace-
ocp4_workload_devspaces_devworkspace_devfile: >-
  http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest

# Repo to be cloned into the devworkspace
ocp4_workload_devspaces_devworkspace_git_repo_base: http://gitea.gitea.svc:3000
ocp4_workload_devspaces_devworkspace_git_repo_name: modern-app-dev
ocp4_workload_devspaces_devworkspace_git_revision: main

ocp4_workload_devspaces_devworkspace_components:
- name: tooling
  container:
    image: registry.redhat.io/devspaces/udi-base-rhel10:latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_mta8
# -------------------------------------------------------------------
ocp4_workload_mta8_channel: stable-v8.1
ocp4_workload_mta8_catalogsource_setup: false

ocp4_workload_mta8_rwx_supported: false
ocp4_workload_mta8_rwx_storage_class: ocs-external-storagecluster-ceph-rbd
ocp4_workload_mta8_rwo_storage_class: ocs-external-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# Per User configuration
ocp4_workload_mta8_num_users: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_mta8_user_base: "{{ ocp4_workload_authentication_user_basename }}"

ocp4_workload_mta8_user_namespace_base: mta

ocp4_workload_mta8_seed: true
ocp4_workload_mta8_seed_image: quay.io/gpte-devops-automation/tackle2-setup
ocp4_workload_mta8_seed_tag: release-0.4-mta7
ocp4_workload_mta8_seed_pull_policy: IfNotPresent

# ocp4_workload_mta_user_litemaas_url: "{{ lookup('agnosticd_user_data', 'litellm_api_base_url') }}"
# ocp4_workload_mta_user_litemaas_keys: "{{ lookup('agnosticd_user_data', 'litellm_virtual_keys') }}"
# ocp4_workload_mta_user_litemaas_models: "{{ lookup('agnosticd_user_data', 'litellm_available_models') }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/mta8-workshop
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: default-site.yml

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: cd74a516-6d80-4f44-a04a-9a59c9f18b1b
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    - name: Shaaf Syed
      email: sshaaf@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-08-05
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "MTA 8 Workshop"
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Artificial_Intelligence
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 40
    workshopLabUiRedirect: true
    workshop_user_mode: multi

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.22"
      ocp4_fips_enable: false
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # Needed for scaling cluster with workers
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
