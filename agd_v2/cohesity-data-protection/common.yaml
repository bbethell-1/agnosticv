# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/cohesity-data-protection-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.1.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0c63771e-1ad9-42a4-ace6-b2fc8fbeef55
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: George James
      email: gjames@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Cohesity Data Protection for OpenShift Virtualization"
    category: Labs
    multiuser: false
    keywords:
    - cohesity
    - virtualization
    - backup
    - data-protection
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_OpenShift
    reportingLabels:
      primaryBU: Red_Hat_OpenShift

  # -----------------------------------------------------------------
  # Components / Cluster Pool
  # -----------------------------------------------------------------
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "4.21"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
