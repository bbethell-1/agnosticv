---
#include /includes/agd-v2-mapping.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/sandbox-api.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/access-restriction-rh1-2026-devs.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Introduction to Ansible Automation Platform Self-Service Automation Portal
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: false
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# num_users is a catalog parameter - users select this during deployment
# Provided by: /includes/parameters/num-users-salesforce.yaml
# Default: 1, Range: 1-100 (>1 requires SalesforceID)

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

worker_instance_count: 0

ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_09_22

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.controller
      version: 4.5.0
    - name: ansible.utils
      version: 2.7.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.8
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.aap_self_service_portal.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
  - rhpds.aap_self_service_portal.ocp4_workload_aap_multiinstance
  - rhpds.aap_self_service_portal.self_service

# -------------------------------------------------------------------
# Workload: agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: rhpds.aap_self_service_portal.ocp4_workload_aap_multiinstance
# -------------------------------------------------------------------
# AAP version
ocp4_workload_aap_multiinstance_version: "2.6"

# Component toggles
ocp4_workload_aap_multiinstance_enable_controller: true
ocp4_workload_aap_multiinstance_enable_eda: true
ocp4_workload_aap_multiinstance_enable_hub: false
ocp4_workload_aap_multiinstance_enable_lightspeed: false

# Authentication - use common_password for all AAP admin passwords
ocp4_workload_aap_multiinstance_admin_password: "{{ common_password }}"

# User access
ocp4_workload_aap_multiinstance_grant_user_access: true
ocp4_workload_aap_multiinstance_user_role: admin

# Manifest injection
ocp4_workload_aap_multiinstance_inject_manifest: true
ocp4_workload_aap_multiinstance_manifest:
  url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

# Resource limits (reduced for workshop environment)
ocp4_workload_aap_multiinstance_controller_web_resource_requirements:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

ocp4_workload_aap_multiinstance_controller_task_resource_requirements:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

ocp4_workload_aap_multiinstance_eda_resource_requirements:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# EDA cluster permissions (enable if needed for Kubernetes event sources)
ocp4_workload_aap_multiinstance_eda_create_rolebinding: false

# -------------------------------------------------------------------
# Workload: rhpds.aap_self_service_portal.self_service
# -------------------------------------------------------------------
# AAP Controller connection (will be set per user based on their AAP instance)
controller_host: "{{ aap_controller_url }}"
controller_username: "{{ aap_admin_username }}"
controller_password: "{{ aap_admin_password }}"
controller_verify_ssl: false

# OpenShift namespace for self-service portal
openshift_namespace: "{{ aap_namespace }}-ssap"

# Self-service portal configuration
aap_ssl_verify: false
aap_oauth_client_name: "Self Service Portal"
aap_organization: "Default"
helm_chart_version: "2.0.3"

# GitHub/GitLab tokens (optional - for SCM integration)
# github_token: ""
# gitlab_token: ""

# -------------------------------------------------------------------
# Metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8d276cf9-e016-40d0-b83a-b976914cf90f
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools/prod
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.18"
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
  catalog:
