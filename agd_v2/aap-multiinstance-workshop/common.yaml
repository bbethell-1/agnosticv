# -------------------------------------------------------------------
# --- Catalog Item: Introduction to Ansible Automation Platform Self-Service Automation Portal
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: true
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# num_users is a catalog parameter - users select this during deployment
# Provided by: /includes/parameters/num-users-salesforce.yaml
# Default: 1, Range: 1-100 (>1 requires SalesforceID)

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

# Worker nodes calculation based on num_users
# Per user AAP deployment includes: Controller (web+task), EDA, PostgreSQL, Redis, migrations
# Actual resource usage per user: ~2 CPU + 6Gi memory (including all operator-managed pods)
# Worker capacity: 32 CPU + 128Gi memory
# Scaling: More aggressive for larger deployments to improve parallel AAP operator reconciliation
# 1-10 users = 2 workers, 11-20 users = 3 workers, 21-30 users = 5 workers, 31-40 users = 6 workers
# 41-50 users = 7 workers, 51-60 users = 9 workers
worker_instance_count: "{{ [2, ((num_users | int / 7.0) | round(0, 'ceil') | int) + 1] | max }}"

ai_workers_cores: 32
ai_workers_memory: 128Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_09_22

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.controller
      version: 4.5.0
    - name: ansible.utils
      version: 2.7.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.8
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.aap_self_service_portal.git
      type: git
      version: main
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.3.9

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication_keycloak
  - rhpds.aap_self_service_portal.ocp4_workload_aap_multiinstance
  - rhpds.aap_self_service_portal.self_service
  - rhpds.aap_self_service_portal.aap_selfservice_custom
  - agnosticd.showroom.ocp4_workload_showroom_ocp_integration
  - agnosticd.showroom.ocp4_workload_showroom
  - rhpds.aap_self_service_portal.ocp4_workload_aap_multiinstance_validation

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication_keycloak
# ===================================================================
# Red Hat Build of Keycloak (RHBK) - User Authentication
# Creates Keycloak instance and manages user accounts

# Operator configuration
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Admin user
ocp4_workload_authentication_keycloak_admin_create: true
ocp4_workload_authentication_keycloak_admin_username: admin
ocp4_workload_authentication_keycloak_admin_password: "{{ common_password }}"

# Student users
ocp4_workload_authentication_keycloak_num_users: "{{ num_users }}"
ocp4_workload_authentication_keycloak_user_username_base: user
ocp4_workload_authentication_keycloak_user_password: "{{ common_password }}"
ocp4_workload_authentication_keycloak_remove_kubeadmin: true

# ===================================================================
# Workload: rhpds.aap_self_service_portal.ocp4_workload_aap_multiinstance
# ===================================================================
# Ansible Automation Platform - Multi-Instance Deployment
# Deploys AAP instances per user with Controller, EDA, and optional components

# AAP version and components
ocp4_workload_aap_multiinstance_version: "2.6"
ocp4_workload_aap_multiinstance_enable_controller: true
ocp4_workload_aap_multiinstance_enable_eda: true
ocp4_workload_aap_multiinstance_enable_hub: false
ocp4_workload_aap_multiinstance_enable_lightspeed: false

# AAP admin credentials
ocp4_workload_aap_multiinstance_admin_password: "{{ common_password }}"

# User access and permissions
ocp4_workload_aap_multiinstance_grant_user_access: true
ocp4_workload_aap_multiinstance_user_role: admin

# License manifest
ocp4_workload_aap_multiinstance_inject_manifest: true
ocp4_workload_aap_multiinstance_manifest:
  url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

# Resource limits - Controller Web
ocp4_workload_aap_multiinstance_controller_web_resource_requirements:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Resource limits - Controller Task
ocp4_workload_aap_multiinstance_controller_task_resource_requirements:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Resource limits - EDA Controller
ocp4_workload_aap_multiinstance_eda_resource_requirements:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# EDA cluster permissions
ocp4_workload_aap_multiinstance_eda_create_rolebinding: false

# ===================================================================
# Workload: rhpds.aap_self_service_portal.self_service
# ===================================================================
# Self-Service Automation Portal
# Deploys portal interface for AAP job templates and workflows

# AAP connection (set dynamically per user)
controller_host: "{{ aap_controller_url }}"
controller_username: "{{ aap_admin_username }}"
controller_password: "{{ aap_admin_password }}"
controller_verify_ssl: false

# Portal deployment
openshift_namespace: "{{ aap_namespace }}-ssap"
helm_chart_version: "2.1.0"

# OAuth configuration
aap_ssl_verify: false
aap_oauth_client_name: "Self Service Portal"
aap_organization: "Default"

