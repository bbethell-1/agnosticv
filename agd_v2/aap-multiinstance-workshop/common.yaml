      - aap
      - automation
      - workshop
      - lb1652
      - self-service
    labels:
      Provider: RHDP
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Ansible
  owners:
    maintainer:
      - email: rshah@redhat.com
        name: Ritesh Shah
      - email: mitsharm@redhat.com
        name: Mitesh Sharma
    sme:
      - email: hmourad@redhat.com
        name: Hicham Mourad
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
