---
#include /enterprise/includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/enterprise-premium-sla.yaml
#include /includes/secrets/rhods_git.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/sandbox-api.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Red Hat Developer Hub Demo
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: true
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"
num_users: 1

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

worker_instance_count: 3

ai_workers_cores: 32
ai_workers_memory: 128Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_09_22

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.19"
host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: ansible.utils
      version: 2.7.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.8
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ads.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication_rhsso
  - rhpds.ads.ocp4_workload_kubernetes_image_puller
  - agnosticd.core_workloads.ocp4_workload_rhacm
  - agnosticd.core_workloads.ocp4_workload_quay_operator
  - agnosticd.core_workloads.ocp4_workload_serverless
  - rhpds.ads.ocp4_workload_serverless_logic
  - rhpds.ads.ocp4_workload_redhat_developer_hub_bootstrap
  - agnosticd.core_workloads.ocp4_workload_pipelines
  - rhpds.ads.ocp4_workload_gitops_gitlab
  - rhpds.ads.ocp4_workload_redhat_developer_hub

# -------------------------------------------------------------------
# Workload: ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable-1.36
ocp4_workload_serverless_automatic_install_plan_approval: true
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_serverless_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_serverless_install_eventing: false
ocp4_workload_serverless_install_serving: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_serverless_logic
# -------------------------------------------------------------------
ocp4_workload_serverless_logic_channel: alpha
ocp4_workload_serverless_logic_automatic_install_plan_approval: true
ocp4_workload_serverless_logic_use_catalog_snapshot: true
ocp4_workload_serverless_logic_namespace: openshift-serverless-logic
ocp4_workload_serverless_logic_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_serverless_logic_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_kubernetes_image_puller
# -------------------------------------------------------------------
ocp4_workload_kubernetes_image_puller_node_selector: '{"node-role.kubernetes.io/worker": ""}'
ocp4_workload_kubernetes_image_puller_images:
  - quay.io/devfile/universal-developer-image:ubi8-277c10c
ocp4_workload_kubernetes_image_puller_instance_namespace: default

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_rhsso
# -------------------------------------------------------------------
ocp4_workload_authentication_rhsso_namespace: rhsso
ocp4_workload_authentication_rhsso_target_namespaces: ["rhsso"]
ocp4_workload_authentication_rhsso_channel: stable
ocp4_workload_authentication_rhsso_starting_csv: rhsso-operator.7.6.11-opr-004
ocp4_workload_authentication_rhsso_automatic_install_plan_approval: false
ocp4_workload_authentication_rhsso_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_rhsso_admin_create: true
ocp4_workload_authentication_rhsso_admin_username: admin
ocp4_workload_authentication_rhsso_admin_password: "{{ common_password }}"
ocp4_workload_authentication_rhsso_remove_kubeadmin: false

ocp4_workload_authentication_rhsso_user_count: "{{ num_users }}"
ocp4_workload_authentication_rhsso_user_name: user1
ocp4_workload_authentication_rhsso_user_password: "{{ common_password }}"

ocp4_workload_authentication_rhsso_env_type: "{{ env_type }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
master_instance_count: 3
ocp4_workload_rhacm_acm_channel: "release-2.14"
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhacm_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -----------------------------------
# Quay Operator
# -----------------------------------
ocp4_workload_quay_operator_namespace: quay-registry
ocp4_workload_quay_operator_catalogsource_namespace: quay-registry
ocp4_workload_quay_operator_channel: stable-3.15
ocp4_workload_quay_operator_starting_csv: ""
ocp4_workload_quay_operator_automatic_install_plan_approval: true
ocp4_workload_quay_operator_use_catalog_snapshot: true
ocp4_workload_quay_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_quay_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.16
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# GitLab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_type: argocd
ocp4_workload_gitops_gitlab_config_email_display_name: Janus Admin
ocp4_workload_gitops_gitlab_config_email_reply_to: "noreply@redhat.com"
ocp4_workload_gitops_gitlab_config_smtp_enabled: "false"
ocp4_workload_gitops_gitlab_config_smtp_domain: "example.com"
ocp4_workload_gitops_gitlab_config_smtp_port: "587"
ocp4_workload_gitops_gitlab_config_smtp_user: "gitlab"
ocp4_workload_gitops_gitlab_config_smtp_password: "gitlab"
ocp4_workload_gitops_gitlab_config_ssh_port: "22"
ocp4_workload_gitops_gitlab_config_rootPassword: "{{ common_password }}"
ocp4_workload_gitops_gitlab_config_https: "true"
ocp4_workload_gitops_gitlab_config_root_email: "root@demo.redhat.com"
ocp4_workload_gitops_gitlab_config_keybase_db: "0123456789"
ocp4_workload_gitops_gitlab_config_keybase_otp: "0123456789"
ocp4_workload_gitops_gitlab_config_keybase_secret: "0123456789"

ocp4_workload_gitops_gitlab_db_user_name: gitlab
ocp4_workload_gitops_gitlab_db_password: passw0rd
ocp4_workload_gitops_gitlab_db_name: gitlab_production

ocp4_workload_gitops_gitlab_gitops_repo: https://github.com/redhat-gpte-devopsautomation/agnosticg.git

ocp4_workload_gitops_gitlab_import_repos:
  - name: rhdh
    repo:
      - name: developer-hub-software-templates
        url: https://github.com/rhpds/developer-hub-software-templates.git
  - name: summit-lab
    repo:
      - name: backstage-workshop
        url: https://github.com/redhat-gpte-devopsautomation/backstage-workshop.git
  - name: gitops
    repo:
      - name: janus-idp-gitops
        url: https://github.com/rhpds/developer-hub-idp-gitops.git
  - name: rhdh-entities
    repo:
      - name: rhdh-demo-entities
        url: https://github.com/redhat-gpe/rhdh-demo-entities.git

ocp4_workload_gitops_gitlab_users_count: "{{ num_users | default(1) }}"
ocp4_workload_gitops_gitlab_users_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_gitlab_root_user: root
ocp4_workload_redhat_developer_hub_gitlab_root_user_email: root@demo.redhat.com
ocp4_workload_redhat_developer_hub_gitlab_root_password: "{{ ocp4_workload_gitops_gitlab_config_rootPassword }}"
ocp4_workload_redhat_developer_hub_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
ocp4_workload_redhat_developer_hub_janus_bootstrap_repo_target_revision: main
ocp4_workload_redhat_developer_hub_admin_user: admin
ocp4_workload_redhat_developer_hub_admin_password: "{{ common_password }}"
ocp4_workload_redhat_developer_hub_gitlab_template_locations:
  - group: rhdh
    project: developer-hub-software-templates
    branch: main
    file: showcase-templates.yaml
    rules:
      allow: Template
    templates:
      - scaffolder-templates/quarkus-web-template/template.yaml
  - group: rhdh
    project: developer-hub-software-templates
    branch: main
    file: org.yaml
    rules:
      allow: Group, User
    templates: []
  - group: summit-lab
    project: backstage-workshop
    branch: master
    file: showcase-templates.yaml
    rules:
      allow: Template
    templates:
      - scaffolder-templates/poi-map/template.yaml
      - scaffolder-templates/poi-gateway/template.yaml
      - scaffolder-templates/poi-backend/template.yaml
  - group: rhdh-entities
    project: rhdh-demo-entities
    branch: main
    file: locations.yaml
    rules:
      allow: Domain, Component, System, API, Resource, Location
    templates:
      - resources/developer-hub.yaml
      - resources/gitlab.yaml
      - resources/janus-gitops.yaml
      - resources/openshift-devspaces.yaml
      - resources/openshift-gitops.yaml
      - resources/quay.yaml
      - systems/openshift-dev-cluster.yaml

ocp4_workload_redhat_developer_hub_users_count: "{{ num_users | default(1) }}"
ocp4_workload_redhat_developer_hub_users_password: "{{ common_password }}"

ocp4_workload_redhat_developer_hub_backstage_helm_chart_repo: https://charts.openshift.io
ocp4_workload_redhat_developer_hub_backstage_helm_chart: redhat-developer-hub
ocp4_workload_redhat_developer_hub_backstage_helm_chart_version: 1.7.1
ocp4_workload_redhat_developer_hub_backstage_image_registry: quay.io
ocp4_workload_redhat_developer_hub_backstage_image_repository: rhdh/rhdh-hub-rhel9
ocp4_workload_redhat_developer_hub_backstage_image_tag: "{{ '1.7' if rhdh_version == 'latest' else '1.7-154' }}"

