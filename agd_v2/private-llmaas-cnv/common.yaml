# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 10B38B97-1719-4FD8-9E37-B752CDFB2F25
  owners:
    maintainer:
      - name: Ritesh Shah
        email: rshah@redhat.com
      - name: Taylor Smith
        email: tsmith@redhat.com
    instructions:
      - name: Ritesh Shah
        email: rshah@redhat.com
      - name: Taylor Smith
        email: tsmith@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  # Components to include in template and catalog item
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools/prod
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.18"
      # Propagate agnosticd_user_info data set by this component to variables.
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url

  # Disable actions on chained config that are handled by base.
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    workshopUiDisabled: false
    display_name: "Private LLM as a Service - A Practical Introduction with OpenShift AI - on CNV"
    category: Workshops
    keywords:
      - openshift
      - agentic
      - ai
      - llamastack
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 5
          minimum: 5
          maximum: 60
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Red_Hat_AI_BU
  tower:
    timeout: 21600
