---
# Add Gitea and ArgoCD tabs to Showroom sidebar.
# Terminal and OpenShift Console tabs from common.yaml are replaced by
# this full override — all 4 tabs must be listed here.
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  - name: Gitea
    url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
  - name: ArgoCD
    url: "https://argocd-server-{{ ocp4_workload_tenant_keycloak_username }}-gitops.apps.{{ openshift_cluster_ingress_domain }}"

# Apply argocd managed-by as a LABEL (not annotation) on all tenant namespaces.
# The GitOps operator watches for this label to update the ArgoCD cluster secret's
# namespaces field and create the RBAC roles that allow the student ArgoCD instance
# to manage resources in those namespaces (required for Lab 3 GitOps).
ocp4_workload_tenant_namespace_default_metadata:
  labels:
    argocd.argoproj.io/managed-by: "{{ ocp4_workload_tenant_keycloak_username }}-gitops"

# -------------------------------------------------------------------
# Babylon meta variables (dev overrides)
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
