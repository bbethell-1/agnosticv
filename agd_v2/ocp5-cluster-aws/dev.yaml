---
# --------------------------------------------------------------------
# AgnosticV includes
# --------------------------------------------------------------------

# -------------------------------------------------------------------
# Collections for this DEV environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # OCP5 Early Access automation (provides rhdp.workshop.ocp5_ea)
  - name: https://github.com/rhpds/ocp5-ea-automation
    type: git
    version: dev
  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main
  # Showroom Collection
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "v1.5.2"

# -------------------------------------------------------------------
# Workload: ocp5_ea
# -------------------------------------------------------------------
# Override gitops repo branch to dev for testing
ocp5_ea_gitops_repo_tag: dev

# Allow provisioning to complete in DEV, even if argo has errors to allow debugging
ocp5_ea_wait_for_apps_ignore_errors: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
# Override showroom repo to use dev branch for testing
ocp4_workload_showroom_content_git_repo_ref: dev
ocp4_workload_showroom_enable_dev_mode: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
    - rhpds-devs-ocp5-ea
  deployer:
    scm_ref: main
