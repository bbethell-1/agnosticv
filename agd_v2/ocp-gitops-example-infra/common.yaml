---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift GitOps Sample (CNV) - INFRA
# -------------------------------------------------------------------
# This is a sample environment to get you started with OpenShift GitOps
# Example of:
# - using the openshift_gitops workload
# - using the gitops_bootstrap workload
# - addressing a gitops bootstrap repo
# - providing helm values to the gitops bootstrap repo to:
#   - deploy a sample operator (webterminal) from the ocp-cluster-addons gitops repo

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/sandbox-api.yaml

# Required by host_ocp4_assisted_scale
# #include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
  - default:
      api_url: "{{ sandbox_user.sandbox_openshift_api_url }}" # was openshift_api_url
      api_token: "{{ sandbox_user.cluster_admin_agnosticd_sa_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: "{{ lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits') }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
# accept defaults

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_resource_tracking_method: annotation
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: "[name,groups]"
# ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
# ocp4_workload_openshift_gitops_kustomize_plugin_env:
# - name: MY_VAR
#   value: myValue

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ci-template-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-infra"
ocp4_workload_gitops_bootstrap_repo_path: "infra/bootstrap"

ocp4_workload_gitops_bootstrap_helm_values:
  # For reference: The `deployer` variables are defined by the gitops_boostrap workload
  # deployer:
  #   domain: "{{ lookup('agnosticd_user_data', 'openshift_cluster_ingress_domain') }}"
  #   apiUrl: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
  webterminal:
    #startingCSV: webterminal.v1.13.0
    git:
      repoURL: https://github.com/rhpds/ocp-cluster-addons.git
      targetRevision: v1.5.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: df6448ba-5cc3-4d69-884f-c9e0a7bdcb82
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: workshop
      cloud_selector:
        cloud: cnv-dedicated-shared
        demo: gitops-example
        virt: "yes"
      var: sandbox_user
      quota:
        requests.storage: 100Gi
        limits.cpu: "10"
        requests.cpu: "10"
        limits.memory: 20Gi
        requests.memory: 20Gi

  # replace component with OCPSandbox
  # components:
  #   - name: openshift
  #     display_name: OpenShift Cluster
  #     item: agd_v2/ocp-cluster-cnv-pools/prod
  #     parameter_values:
  #       cluster_size: "{{ control_plane_size }}"
  #       host_ocp4_installer_version: "{{ ocp4_installer_version }}"
  #       ocp4_fips_enable: false
  #     propagate_provision_data:
  #       - name: openshift_api_url
  #         var: openshift_api_url
  #       - name: openshift_cluster_admin_token
  #         var: openshift_api_key
  #       # Required by host_ocp4_assisted_scale
  #       - name: openshift_cluster_admin_token
  #         var: openshift_cluster_admin_token
  #       - name: sandbox_openshift_api_url
  #         var: sandbox_openshift_api_url
  #       - name: sandbox_openshift_api_key
  #         var: sandbox_openshift_api_key
  #       - name: sandbox_openshift_namespace
  #         var: sandbox_openshift_namespace

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      OpenShift GitOps Example - INFRA
    category: Open_Environments
    keywords:
      - openshift
      - gitops
      - argocd
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Featured_Score: "71"
    parameters: []
