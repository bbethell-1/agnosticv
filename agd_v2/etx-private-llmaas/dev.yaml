---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# Pin Cloud Provider Collection version
cloud_provider_version: 1.0.0

# ===================================================================
# Additional collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: 1.0.0
  # AI OpenShift Workloads
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: 1.0.0

ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/etx-llmaas-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  threeScale:
    repoURL: https://github.com/rhpds/ocp-cluster-addons
    targetRevision: v1.3.0
    channel: threescale-2.15
    startingCSV: 3scale-operator.v0.12.3
  llmaas:
    repoURL: https://github.com/rhpds/etx-llmaas-gitops

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
