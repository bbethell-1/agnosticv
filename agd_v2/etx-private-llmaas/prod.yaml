---
#include /includes/access-restriction-etx.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: prod

# Pin Cloud Provider Collection version
cloud_provider_version: 1.0.0

# ===================================================================
# Additional collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: 1.0.0
  # AI OpenShift Workloads
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: 1.0.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: etx-private-llmaas-event-1.0.1
  runtime:
    default: 8h
    maximum: 4d
  lifespan:
    default: 4d
    maximum: 5d
    relativeMaximum: 4d
