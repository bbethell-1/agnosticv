---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: Red Hat OpenShift Container Platform
#  Cluster (AWS) - AgdV2
# -------------------------------------------------------------------

# --------------------------------------------------------------------
# AgnosticV includes
# --------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-3.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/ocp4_workload_ols_api_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: main
config: openshift-cluster

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main
  # AI Workloads (for OpenShift Lightspeed)
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: main

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
# OpenShift version set from parameter. Map old variable to new variable.
# host_ocp4_installer_version: "4.19"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
bastion_setup_student_user: true
bastion_student_user_name: lab-user
bastion_student_suer_sudo: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
bastion_instance_image: RHEL96GOLD-latest

worker_instance_count: "{{ 0 if cluster_size == 'sno' else worker_instance_count_param }}"
worker_storage_type: gp3

control_plane_instance_count: "{{ 1 if cluster_size == 'sno' else 3 }}"
control_plane_instance_type_family: m5

control_plane_instance_type_size: >-
  {{ '8xlarge' if cluster_size == 'sno'
  else '2xlarge' if worker_instance_count | int <= 10
  else '4xlarge' if worker_instance_count | int <= 20
  }}
control_plane_instance_type: "{{ control_plane_instance_type_family }}.{{ control_plane_instance_type_size }}"
control_plane_storage_type: >-
  {{ 'io1' if worker_instance_count | int >= 10
  else 'gp3' }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Workloads to deploy on the cluster (YAML List)
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_keycloak
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.ai_workloads.ocp4_workload_ols

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication_keycloak
# ===================================================================
# Red Hat Build of Keycloak (RHBK) - User Authentication
# Creates Keycloak instance and manages user accounts

# Operator configuration
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

ocp4_workload_authentication_keycloak_admin_create: true
ocp4_workload_authentication_keycloak_admin_username: admin
ocp4_workload_authentication_keycloak_admin_password: ''
ocp4_workload_authentication_keycloak_remove_kubeadmin: true

ocp4_workload_authentication_keycloak_num_users: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_keycloak_user_username_base: user
ocp4_workload_authentication_keycloak_user_password: ''

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"
ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols (OpenShift Lightspeed)
# -------------------------------------------------------------------
# Use Azure AI as the backend for OpenShift Lightspeed
ocp4_workload_ai_platform: azure

# Automatically create and manage Azure AI tokens
ocp4_workload_ols_get_token: true

# ===================================================================
# Workloads to remove on destroy
# ===================================================================
remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 2a80b893-3380-46db-aeff-44e70f0a6b1f
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenShift Container Platform Cluster (AWS) - AgdV2
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '71'
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: cluster_size
      description: >-
        Cluster size configuration that determines the number of control plane and worker nodes.
      formLabel: Cluster Size
      openAPIV3Schema:
        type: string
        default: 'sno'
        enum:
        - 'sno'
        - 'multinode'
    - name: host_ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.16'
        - '4.18'
        - '4.19'
        - '4.20'
      annotation: demo.redhat.com/ocp-version
      variable: host_ocp4_installer_version
    - name: worker_instance_count_param
      description: OpenShift Worker count
      formLabel: OpenShift Worker count
      formHideCondition: cluster_size != 'multinode'
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 10
    - name: worker_instance_type
      description: OpenShift Worker instance type
      formLabel: OpenShift Worker instance type
      formHideCondition: cluster_size != 'multinode'
      openAPIV3Schema:
        type: string
        default: 'm5a.2xlarge'
        enum:
        - 'm5a.2xlarge'
        - 'm5a.4xlarge'
        - 'm5a.8xlarge'
    - name: create_multi_user
      description: Create multiple users on cluster?
      formLabel: Create multiple users on cluster
      openAPIV3Schema:
        type: boolean
        default: false
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      formHideCondition: create_multi_user == false
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 50
