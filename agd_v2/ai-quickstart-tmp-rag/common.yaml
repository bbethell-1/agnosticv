---
# -------------------------------------------------------------------
# --- Catalog Item: Quickstart - RAG All-in-One (tmp)
# --- RAG QuickStart for OpenShift AI
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/access-restriction-quickstarts-ai.yaml

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

config: openshift-workloads
cloud_provider: none
openshift_cnv_scale_cluster: false
num_users: 0

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:

  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: gitops-bootstrap-userinfo

  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: "{{ tag }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:

- agnosticd.core_workloads.ocp4_workload_authentication_keycloak
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.ai_workloads.ocp4_workload_openshift_ai

# ===================================================================
# Workload: ocp4_workload_authentication_keycloak
# ===================================================================
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

ocp4_workload_authentication_keycloak_admin_create: true
ocp4_workload_authentication_keycloak_admin_username: admin
ocp4_workload_authentication_keycloak_admin_password: "{{ common_password }}"
ocp4_workload_authentication_keycloak_remove_kubeadmin: true

ocp4_workload_authentication_keycloak_num_users: "{{ num_users | int }}"
ocp4_workload_authentication_keycloak_user_username_base: user
ocp4_workload_authentication_keycloak_user_password: "{{ common_password }}"

# ===================================================================
# Workload: ocp4_workload_openshift_gitops
# ===================================================================
ocp4_workload_openshift_gitops_channel: latest
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resource_tracking_method: annotation

# ===================================================================
# Workload: agnosticd.ai_workloads.ocp4_workload_openshift_ai
# ===================================================================

ocp4_workload_openshift_ai_channel: fast-3.x
ocp4_workload_openshift_ai_use_catalog_snapshot: false
ocp4_workload_openshift_ai_deploy_dsc: true
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed
ocp4_workload_openshift_ai_kserve: Removed
ocp4_workload_openshift_ai_ray: Removed
ocp4_workload_openshift_ai_trustyai: Removed
ocp4_workload_openshift_ai_trainingoperator: Removed
ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_codeflare: Removed
ocp4_workload_openshift_ai_feastoperator: Removed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 6c5ba74e-9f8c-4bc3-88ce-03041276aa73
  owners:
    maintainer:
    - name: Tony Kay
      email: ankay@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  catalog:
    display_name: "AI Quickstart RAG All-in-One (tmp)"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - openshift
    - quickstart
    - ai
    labels:
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []

  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '4.20'
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
