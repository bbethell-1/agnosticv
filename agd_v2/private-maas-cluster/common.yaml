---
# -------------------------------------------------------------------
# --- Catalog Item: Private Model as a Service - Cluster
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-5-ocp-multi.yaml

#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none

clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Tags
# -------------------------------------------------------------------
tag: main

# ===================================================================
# Additional collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    # AWS Cloud Provider
    # Only used with openshift_aws_scale_cluster
    - name: https://github.com/rhpds/cloud_provider_aws.git
      type: git
      version: "{{ tag }}"
    # Core OpenShift Workloads
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    # Showroom workloads
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.7.2

# ===================================================================
# Autoscaling cluster
# ===================================================================
openshift_aws_scale_cluster: true

worker_instance_type: m6a.4xlarge
worker_instance_count: 12

# -------------------------------------------------------------------
# List of workloads to be deployed
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_machinesets
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_ocp_console_embed

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: true
gpu_instance_type_big: g6e.2xlarge

ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu-big
    role: worker-gpu
    instance_type: "{{ gpu_instance_type_big }}"
    autoscale: false # Workaround for core_workloads bug - min=max=replicas means no actual scaling
    total_replicas: "1"
    total_replicas_min: "1"
    total_replicas_max: "1"
    root_volume_size: "250"
    taints:
      - key: nvidia.com/gpu
        value: l40-gpu
        effect: NoSchedule

# ===================================================================
# Workload: ocp4_workload_authentication_keycloak
# ===================================================================
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.6
ocp4_workload_authentication_admin_username: admin

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.21
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_resource_tracking_method: annotation

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_username }}, role:admin
  g, user1, role:admin

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/private-maas-automation
ocp4_workload_gitops_bootstrap_repo_revision: "{{ tag }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap"

ocp4_workload_gitops_bootstrap_helm_values:
  bootstrap:
    targetRevision: "{{ ocp4_workload_gitops_bootstrap_repo_revision }}"
  slackMcpSecret:
    # @owner: UNKNOWN
    # @purpose: Slack bot token for private MaaS MCP/bootstrap integration
    # @impact: MEDIUM - grants Slack bot API access for lab automation
    # @expiration: UNKNOWN
    # @rotation: Rotate in Slack app settings and re-vault this value
    # @source: Slack app credentials for private-maas automation
    # @exposure: Injected into OpenShift Secret via GitOps bootstrap helm values
    slackBotToken: !vault |
      $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
      62363230306465333938333130666363303938343561363165376135356236353133323932386161
      3233666266323737353762656564376239316238383830610a346537616639363636646637323134
      34373632323631653537653438663266303739343936646261666363363431366431316133376564
      6235313061656463630a663634383261306466326638633237623933306465333036656631326662
      39383434396236376261666161393036663764646238663661356437636238633961326166303034
      32356133616136396638363663323366336465366532303039353064316239633362616661636466
      646133316634366263373039356332303666
  rocketchat:
    # @owner: UNKNOWN
    # @purpose: Rocket.Chat admin password for private MaaS cluster bootstrap
    # @impact: MEDIUM - admin access to lab Rocket.Chat instance
    # @expiration: never
    # @rotation: Update vaulted value and reprovision/bootstrap cluster
    # @source: Generated and vaulted during catalog setup
    # @exposure: Injected into OpenShift Secret via GitOps bootstrap helm values
    adminPassword: !vault |
      $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
      38633136363330663133363137313665323865353037313664333536313336313963653635663431
      3134653361623662366632653232346534623433623434350a323064376363623231643434383933
      61653236613764383065663533336531376139316132306130653461313861313330396538356632
      3831316230316564350a653137373735333133313439643732376466323166623565383033656432
      6537

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 64214f83-d519-47e3-a564-29e651752aa2

  owners:
    maintainer:
      - name: Ritesh Shah
        email: rshah@redhat.com
      - name: Taylor Smith
        email: tsmith@redhat.com
    instructions:
      - name: Ritesh Shah
        email: rshah@redhat.com
      - name: Taylor Smith
        email: tsmith@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    reportingLabels:
      primaryBU: Artificial_Intelligence
    display_name: "Private Model as a Service (Cluster)"
    category: Labs
    keywords:
      - openshift ai
      - maas
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
    # This item only provisions shared infrastructure.
    # It would not be appropriate to order a workshop of this item.
    workshopUiDisabled: false

  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-aws-pools
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.22"
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_api_key
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace

  sandbox_host:
    annotations:
      cloud: aws-dedicated-shared
      lab: private-maas
    max_cpu_usage_percentage: 90
    max_memory_usage_percentage: 85
    max_placements: 20

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-09-15
  sandbox_api:
    reservation: pgpu
