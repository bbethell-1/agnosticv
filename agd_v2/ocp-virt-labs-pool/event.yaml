---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
##include /includes/secrets/dynamic-dns.yaml
##include /includes/secrets/acme-bifrost.yaml

ai_control_plane_cores: "{{ '16' if cluster_size == 'sno' else '16' }}"
ai_control_plane_memory: "{{ '64Gi' if cluster_size == 'sno' else '64Gi' }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: event-summit-2026-1.0.0
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing

  # Sandbox lists overwrite common.yaml; retain DNS and SSL allocations.
  # Hard-pin Summit/event pool deploys to ocpv09.
  sandboxes:
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv09
        virt: "yes"
