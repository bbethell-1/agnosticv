# -------------------------------------------------------------------
# Workload: ocp5_ea
# -------------------------------------------------------------------
ocp5_ea_gitops_repo_tag: "{{ tag }}"
# This is set specificlly for Agnetic OLS to work in early OCP5
ocp5_ea_llm_api_provider: rhoai_vllm
ocp5_ea_llm_api_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
ocp5_ea_llm_api_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
# ocp5_ea_llm_api_model: claude-sonnet-5-5-a46b
ocp5_ea_llm_api_model: "{{ maas_sandbox.credentials[0].available_models[0] }}"
ocp5_ea_wait_for_apps_ignore_errors: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp5-first-look-lab
ocp4_workload_showroom_content_git_repo_ref: "{{ tag }}"
ocp4_workload_showroom_content_antora_playbook: site.yml
ocp4_workload_showroom_antora_image: quay.io/rhpds/antora:v1.3.0

# Enable Wetty terminal and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# -------------------------------------------------------------------
# Babylon meta
# -------------------------------------------------------------------
__meta__:
  asset_uuid: eb46c743-c12e-406e-bf08-f20424c395ab
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-09-15
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 5 First Look (CNV)
    category: Labs
    keywords:
    - ocp5
    - openshift-5
    - agentic
    - mcp
    - lightspeed
    - early-access
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Container_Management
      TDP2: Application_Platform
    workshopUiDisabled: true
    multiuser: false
    reportingLabels:
      primaryBU: Hybrid_Platforms

  components:
  - name: openshift_base
    display_name: OpenShift Container Platform 5 Cluster (CNV Pools)
    item: agd-v2/ocp5-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: openshift_cluster_ingress_domain
      var: openshift_cluster_ingress_domain
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  sandboxes:
  - kind: MaaSSandbox
    cloud_selector:
      purpose: production
    # models: "claude-sonnet-5-5-a46b"
    models: "claude-sonnet-4-6"
    var: maas_sandbox
