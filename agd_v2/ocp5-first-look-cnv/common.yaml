---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift 5 First Look (CNV)
# -------------------------------------------------------------------
# Regular users should order from published/ocp5-first-look-lab
# This CI is the base component — do not order directly.

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp5_workload_ols.yaml

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
tag: main

config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

num_users: 0

# Do not scale the cluster — 3 control-plane nodes only
openshift_cnv_scale_cluster: false

common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

# ===================================================================
# Collections
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/ocp5-first-look-lab.git#automation/ansible
    type: git
    version: "{{ tag }}"
  # Showroom Collection
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "v1.8.0"

# ===================================================================
# Workloads
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- ocp5_first_look_lab.automation.ocp5_ea
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# ===================================================================
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_multiuser: false
ocp4_workload_authentication_keycloak_channel: stable-v26.6
ocp4_workload_authentication_keycloak_default_realm: keycloak

# Temporarily pin 4.22 Snapshots until everything is in the 5.0 catalogs
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_authentication_keycloak_catalogsource_tag: v4.22_2026_08_03

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_enabled_nested_kvm: true

ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

