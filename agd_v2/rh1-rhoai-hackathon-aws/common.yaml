---
# -------------------------------------------------------------------
# --- Catalog Item: RH1 OpenShift AI Hackathon (AWS)
#
# -------------------------------------------------------------------

# --------------------------------------------------------------------
# AgnosticV includes
# --------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-3.yaml

#include /includes/secrets/ocp4_workload_ols_api_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # AWS Cloud Provider
  # Only used with openshift_aws_scale_cluster
  - name: https://github.com/agnosticd/cloud_provider_aws.git
    type: git
    version: main
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main
  # AI Workloads (for OpenShift Lightspeed)
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: main
  # Custom workloads
  - name: https://github.com/rhpds/rhpds.openshift_ai.git
    type: git
    version: main

# ===================================================================
# Autoscaling cluster
# ===================================================================
openshift_aws_scale_cluster: false
worker_instance_count: 0
# Set by parameter
# worker_instance_type: "m5a.4xlarge"

# ===================================================================
# OpenShift Version
# ===================================================================
# OpenShift version set from parameter
# host_ocp4_installer_version: "4.19"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_keycloak
- agnosticd.core_workloads.ocp4_workload_machinesets
- agnosticd.core_workloads.ocp4_workload_nfd
- agnosticd.ai_workloads.ocp4_workload_nvidia_gpu_operator
- agnosticd.core_workloads.ocp4_workload_authorino
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
# - rhpds.openshift_ai.ocp4_workload_openshift_ai_model_deployment

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication_keycloak
# ===================================================================
# Red Hat Build of Keycloak (RHBK) - User Authentication
# Creates Keycloak instance and manages user accounts

# Operator configuration
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

ocp4_workload_authentication_keycloak_admin_create: true
ocp4_workload_authentication_keycloak_admin_username: admin
ocp4_workload_authentication_keycloak_admin_password: ''
ocp4_workload_authentication_keycloak_remove_kubeadmin: true

ocp4_workload_authentication_keycloak_num_users: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_keycloak_user_username_base: user
ocp4_workload_authentication_keycloak_user_password: ''

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: false
gpu_instance_type: g6.4xlarge

ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu
  role: worker-gpu
  instance_type: "{{ gpu_instance_type }}"
  autoscale: false
  total_replicas: "1"
  total_replicas_min: "1"
  total_replicas_max: "1"
  root_volume_size: "250"
  taints:
  - key: nvidia.com/gpu
    value: true
    effect: NoSchedule

# -------------------------------------------------------------------
# ocp4_workload_nvidia_gpu_setup
# -------------------------------------------------------------------
ocp4_workload_nvidia_gpu_operator_channel: v25.3
ocp4_workload_nvidia_gpu_operator_use_catalog_snapshot: false
ocp4_workload_nvidia_gpu_operator_create_dashboard: true
ocp4_workload_nvidia_gpu_operator_wait_for_cluster_policy: false
ocp4_workload_nvidia_gpu_operator_ignore_csv_error: true

# -------------------------------------------------------------------
# ocp4_workload_authorino
# -------------------------------------------------------------------
ocp4_workload_authorino_operator_channel: stable

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: latest

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: fast-3.x

# DSC Configuration
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed

ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_modelregistry_namespace: rhoai-model-registries
ocp4_workload_openshift_ai_modelregistry_config:
  managementState: "{{ ocp4_workload_openshift_ai_modelregistry }}"
  registriesNamespace: "{{ ocp4_workload_openshift_ai_modelregistry_namespace }}"

ocp4_workload_openshift_ai_ray: Managed
ocp4_workload_openshift_ai_trustyai: Managed
ocp4_workload_openshift_ai_trainingoperator: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_feastoperator: Managed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed

# -------------------------------------------------------------------
# rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_dashboard_config_settings:
  disableTracking: false
  disableModelRegistry: false
  disableModelCatalog: false
  disableKServeMetrics: false
  genAiStudio: true
  modelAsService: true
  disableLMEval: false

ocp4_workload_openshift_ai_dashboard_config_notebook_controller:
  enabled: true
  pvcSize: 20Gi

ocp4_workload_openshift_ai_hardware_profile_gpu_identifiers:
- defaultCount: '1'
  displayName: CPU
  identifier: cpu
  maxCount: '8'
  minCount: 1
  resourceType: CPU
- defaultCount: 12Gi
  displayName: Memory
  identifier: memory
  maxCount: 16Gi
  minCount: 1Gi
  resourceType: Memory
- defaultCount: 1
  displayName: GPU
  identifier: nvidia.com/gpu
  maxCount: 4
  minCount: 1
  resourceType: Accelerator

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 46d42631-5071-4a55-a67c-14818560a789
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing

  components:
  - name: openshift_base
    display_name: OpenShift Container Platform Cluster (AWS-Pools)
    item: agd-v2/ocp-cluster-aws-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
      agnosticd_open_environment: false
      aws_region: us-east-2
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat One OpenShift AI Hackathon
    workshopLabUiRedirect: true
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    # - name: worker_instance_count_param
    #   description: OpenShift Worker count
    #   formLabel: OpenShift Worker count
    #   formHideCondition: cluster_size != 'multinode'
    #   openAPIV3Schema:
    #     type: integer
    #     default: 2
    #     minimum: 2
    #     maximum: 10
    # - name: worker_instance_type
    #   description: OpenShift Worker instance type
    #   formLabel: OpenShift Worker instance type
    #   formHideCondition: cluster_size != 'multinode'
    #   openAPIV3Schema:
    #     type: string
    #     default: 'm5a.2xlarge'
    #     enum:
    #     - 'm5a.2xlarge'
    #     - 'm5a.4xlarge'
    #     - 'm5a.8xlarge'
    # - name: create_multi_user
    #   description: Create multiple users on cluster?
    #   formLabel: Create multiple users on cluster
    #   openAPIV3Schema:
    #     type: boolean
    #     default: false
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      # formHideCondition: create_multi_user == false
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 60
