---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: Former Summit 2026 - LB1912:
#                   Multi-Site Disaster Recovery for
#                   Healthcare Systems with InfoScale
#                   & OpenShift Virtualization Cluster
# -------------------------------------------------------------------

# Users have cluster-admin on both SNOs.
# Special requirements for Infoscale:
#    1) local disk only
#    2) No ODF
#    3) Same LAN for DR replication
#
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
tag: main

cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"
num_users: 0

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "v1.6.9"

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "main"

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/demo_workloads.git
    type: git
    version: "main"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- rhpds.demo_workloads.ocp4_workload_gitops_add_cluster
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom

common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}

# ===================================================================
# Variables for specific workloads
# ===================================================================

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# ===================================================================
ocp4_workload_authentication_provider: htpasswd
ocp4_workload_authentication_multiuser: false
ocp4_workload_authentication_admin_password: "{{ common_admin_password | default('') }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/infoscale-automation.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: cluster/infra/bootstrap
ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra

ocp4_workload_gitops_bootstrap_application_health_retries: 200 # 200 * 10 seconds = 33 minutes
ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: 0
  workspace: ""
  allNodeNames: "{{ ocp4_workload_gitops_add_cluster_all_node_names | default('') }}"
  htpasswdAuth:
    enabled: true
    adminPassword: "{{ common_admin_password | default('') }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/infoscale-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_enable_dev_mode: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3ed88f01-bc73-45e1-8576-130ac35c7378
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    - name: Alberto Gonzalez Rodriguez
      email: josegonz@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Multi-Site Disaster Recovery for Healthcare Systems with InfoScale & OpenShift Virtualization"
    category: Brand_Events
    keywords:
    - lb1912
    - summit-2026
    - openstack
    - infoscale
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Virtualization
    workshopLabUiRedirect: true
    workshop_user_mode: none
    workshopUiDisabled: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []

  components:
  - name: infoscale_base
    display_name: InfoScale MultiSNO Clusters
    item: agd-v2/ocp-infoscale-multisno-base
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
