---

# ArgoCD without ApplicationSet Controller does not make sense.
# Especially when you want to use apps-of-apps pattern.
ocp4_workload_openshift_gitops_applicationset_controller_update: true


# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: ocp-field-asset-cnv-1.0.3
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "main"
  # LiteMaaS Virtual Keys (optional - for AI/LLM demos)
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: 1.0.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
