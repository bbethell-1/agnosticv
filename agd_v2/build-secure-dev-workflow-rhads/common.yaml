# -------------------------------------------------------------------
# --- Catalog Item: Build Secure, Streamlined Developer Workflows with Red Hat Advanced Developer Suite
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: false
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"
num_users: 1

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

worker_instance_count: 0

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.20.0"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
# ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_09_22

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: ansible.utils
      version: 2.7.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.8
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.build_secured_dev_workflows.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - rhpds.build_secured_dev_workflows.bootstrap
  - agnosticd.core_workloads.ocp4_workload_authentication_keycloak
  - rhpds.ads.ocp4_workload_kubernetes_image_puller
  - agnosticd.core_workloads.ocp4_workload_quay_operator
  - agnosticd.core_workloads.ocp4_workload_pipelines
  - agnosticd.core_workloads.ocp4_workload_rhacs
  - rhpds.build_secured_dev_workflows.openshift_gitops
  - rhpds.ads.ocp4_workload_gitops_gitlab
  - rhpds.ads.ocp4_workload_openshift_devspaces
  - rhpds.build_secured_dev_workflows.trusted_profile_analyzer
  - rhpds.build_secured_dev_workflows.trusted_artifact_signer
  - rhpds.build_secured_dev_workflows.developer_hub

# -------------------------------------------------------------------
# Workload: rhpds.build_secured_dev_workflows.openshift_gitops
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_openshfit_gitops_helm_cli_version: v3.18.4
rhpds_build_secured_dev_workflows_openshfit_gitops_infra_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git
rhpds_build_secured_dev_workflows_openshfit_gitops_infra_bootstrap_repo_revision: main
rhpds_build_secured_dev_workflows_openshfit_gitops_argocd_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: rhpds.build_secured_dev_workflows.developer_hub
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_developer_hub_quay_namespace: quay-enterprise
rhpds_build_secured_dev_workflows_developer_hub_gitlab_namespace: gitlab
rhpds_build_secured_dev_workflows_developer_hub_namespace: backstage
rhpds_build_secured_dev_workflows_developer_hub_argocd_namespace: janus-argocd
rhpds_build_secured_dev_workflows_developer_hub_keycloak_namespace: tssc-keycloak
rhpds_build_secured_dev_workflows_developer_hub_devspaces_namespace: openshift-devspaces
rhpds_build_secured_dev_workflows_developer_hub_tpa_namespace: tssc-tpa

rhpds_build_secured_dev_workflows_developer_hub_keycloak_client_id: developer-hub
rhpds_build_secured_dev_workflows_developer_hub_keycloak_client_secret: "{{ common_password }}"
rhpds_build_secured_dev_workflows_developer_hub_authentication_realm: sso

rhpds_build_secured_dev_workflows_developer_hub_quay_registry: quay.io
rhpds_build_secured_dev_workflows_developer_hub_quay_image: rhdh/rhdh-hub-rhel9
rhpds_build_secured_dev_workflows_developer_hub_quay_image_tag: "1.7"

rhpds_build_secured_dev_workflows_developer_hub_catalog_locations:
  - repository: build_secured_dev_workflows_idp_configuration
    revision: main
    group: rhdh
    file:
      - all-locations.yaml

rhpds_build_secured_dev_workflows_developer_hub_templating_files:
  - repository: build_secured_dev_workflows_idp_configuration
    revision: main
    group: rhdh
    file:
      - component-rhpds.yaml
  - repository: build_secured_dev_workflows_idp_gitops
    revision: main
    group: gitops
    file:
      - charts/backstage/backstage-values.yaml

rhpds_build_secured_dev_workflows_developer_hub_helm_chart_repo: https://charts.openshift.io
rhpds_build_secured_dev_workflows_developer_hub_helm_chart: redhat-developer-hub
rhpds_build_secured_dev_workflows_developer_hub_helm_chart_version: 1.7.1

rhpds_build_secured_dev_workflows_developer_hub_gitlab_user_base_name: user

rhpds_build_secured_dev_workflows_developer_hub_tpa_client_id: cli
rhpds_build_secured_dev_workflows_developer_hub_tpa_client_secret: "{{ common_password }}"
rhpds_build_secured_dev_workflows_developer_hub_tpa_cli_realm: tpa

rhpds_build_secured_dev_workflows_developer_hub_rhacs_namespace: stackrox
rhpds_build_secured_dev_workflows_developer_hub_rhacs_admin_user: admin
rhpds_build_secured_dev_workflows_developer_hub_rhacs_admin_password: "{{ common_password }}"

rhpds_build_secured_dev_workflows_developer_hub_argocd_user: admin
rhpds_build_secured_dev_workflows_developer_hub_argocd_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.7"
ocp4_workload_rhacs_install_operator_starting_csv: ""
ocp4_workload_rhacs_automatic_install_plan_approval: true
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_enable_route_certs: false

# -------------------------------------------------------------------
# rhpds.build_secured_dev_workflows.trusted_profile_analyzer
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_namespace: tssc-tpa
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_channel: stable-v1.0
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_automatic_install_plan_approval: true
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_starting_csv: ""
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_use_catalog_source: true
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_catalogsource_tag: v4.19_2025_10_23
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_namespace: keycloak
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_realm: tpa
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_admin_username: "tpa-admin"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_admin_password: "{{ common_password }}"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_cli_client_id: "cli"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_cli_client_secret: "{{ common_password }}"

# -------------------------------------------------------------------
# rhpds.build_secured_dev_workflows.trusted_artifact_signer
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_trusted_artifact_signer_namespace: tssc-tas
rhpds_build_secured_dev_workflows_trusted_artifact_signer_channel: stable-v1.3
rhpds_build_secured_dev_workflows_trusted_artifact_signer_automatic_install_plan_approval: true
rhpds_build_secured_dev_workflows_trusted_artifact_signer_starting_csv: ""
rhpds_build_secured_dev_workflows_trusted_artifact_signer_use_catalog_source: true
rhpds_build_secured_dev_workflows_trusted_artifact_signer_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
rhpds_build_secured_dev_workflows_trusted_artifact_signer_catalogsource_tag: v4.19_2025_10_23
rhpds_build_secured_dev_workflows_trusted_artifact_signer_chains_realm: tas-chains
rhpds_build_secured_dev_workflows_trusted_artifact_signer_sso_realm: sso
rhpds_build_secured_dev_workflows_trusted_artifact_signer_client_id: trusted_artifact_signer

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication_keycloak
# -------------------------------------------------------------------
ocp4_workload_authentication_keycloak_namespace: tssc-keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_automatic_install_plan_approval: true
ocp4_workload_authentication_keycloak_admin_create: true
ocp4_workload_authentication_keycloak_use_catalog_source: false
ocp4_workload_authentication_keycloak_num_users: 1
ocp4_workload_authentication_keycloak_admin_username: admin
ocp4_workload_authentication_keycloak_admin_password: "{{ common_password }}"
ocp4_workload_authentication_keycloak_user_username_base: user
ocp4_workload_authentication_keycloak_user_password: "{{ common_password }}"
ocp4_workload_authentication_keycloak_remove_kubeadmin: false
ocp4_workload_authentication_keycloak_openshift_client_secret: "{{ common_password }}"

# ------------------------------------------------
# ocp4_workload_openshift_devspaces
# ------------------------------------------------
ocp4_workload_openshift_devspaces_catalogsource_setup: false
ocp4_workload_openshift_devspaces_channel: stable
ocp4_workload_openshift_devspaces_automatic_install_plan_approval: true
ocp4_workload_openshift_devspaces_startingcsv: ""
ocp4_workload_openshift_devspaces_namespace: openshift-devspaces

# -------------------------------------------------------------------
# ocp4_workload_kubernetes_image_puller
# -------------------------------------------------------------------
ocp4_workload_kubernetes_image_puller_node_selector: '{"node-role.kubernetes.io/worker": ""}'
ocp4_workload_kubernetes_image_puller_images:
  - quay.io/redhat-gpte/jenkins-inbound-agent:jdk21
  - maven:3.8.5-openjdk-17
  - docker.io/sonarsource/sonar-scanner-cli:10.0
  - quay.io/redhat-appstudio/syft:v0.94.0
  - registry.access.redhat.com/ubi9/python-311:9.5
  - quay.io/redhat-user-workloads/rhtap-integration-tenant/yq-container/yq:5f8db9e69e824d7859b61f97596c4f3f839d6c9e
  - quay.io/redhat-appstudio/buildah:v1.31.0@sha256:34f12c7b72ec2c28f1ded0c494b428df4791c909f1f174dd21b8ed6a57cf5ddb
  - registry.access.redhat.com/ubi8/ubi-minimal
  - quay.io/redhat-appstudio/appstudio-utils:5bd7d6cb0b17f9f2eab043a8ad16ba3d90551bc2@sha256:8c7fcf86af40c71aeb58e4279625c8308af5144e2f6b8e28b0ec7e795260e5f7
  - alpine/helm:3.11.1
  - registry.redhat.io/rhtas/gitsign-rhel9:1.1.0
  - registry.redhat.io/rhtas/cosign-rhel9:1.1.0
  - quay.io/devfile/universal-developer-image:ubi8-277c10c
ocp4_workload_kubernetes_image_puller_instance_namespace: default

# -----------------------------------
# Quay Operator
# -----------------------------------
ocp4_workload_quay_operator_namespace: quay-registry
ocp4_workload_quay_operator_catalogsource_namespace: quay-registry
ocp4_workload_quay_operator_channel: stable-3.15
ocp4_workload_quay_operator_starting_csv: ""
ocp4_workload_quay_operator_automatic_install_plan_approval: true
ocp4_workload_quay_operator_use_catalog_snapshot: false
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.16
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_automatic_install_plan_approval: true

# -------------------------------------------------------------------
# GitLab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_type: argocd
ocp4_workload_gitops_gitlab_config_email_display_name: Janus Admin
ocp4_workload_gitops_gitlab_config_email_reply_to: "noreply@redhat.com"
ocp4_workload_gitops_gitlab_config_smtp_enabled: "false"
ocp4_workload_gitops_gitlab_config_smtp_domain: "example.com"
