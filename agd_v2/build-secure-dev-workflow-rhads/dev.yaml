---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: ansible.utils
      version: 2.7.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.8
    - name: https://github.com/treddy08/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.build_secured_dev_workflows.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_keycloak
  - rhpds.ads.ocp4_workload_kubernetes_image_puller
  - agnosticd.core_workloads.ocp4_workload_quay_operator
  - agnosticd.core_workloads.ocp4_workload_pipelines
  - rhpds.build_secured_dev_workflows.openshift_gitops
  - rhpds.ads.ocp4_workload_gitops_gitlab
  - rhpds.ads.ocp4_workload_jenkins
  - rhpds.ads.ocp4_workload_openshift_devspaces

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_keycloak
# -------------------------------------------------------------------
ocp4_workload_keycloak_namespace: tssc-keycloak
ocp4_workload_keycloak_channel: stable-v26.2
ocp4_workload_keycloak_automatic_install_plan_approval: true
ocp4_workload_keycloak_admin_create: true
ocp4_workload_keycloak_use_catalog_source: false
ocp4_workload_keycloak_num_users: 1
ocp4_workload_keycloak_admin_username: admin
ocp4_workload_keycloak_admin_password: "{{ common_password }}"
ocp4_workload_keycloak_user_username_base: user
ocp4_workload_keycloak_user_password: "{{ common_password }}"
ocp4_workload_keycloak_remove_kubeadmin: false

__meta__:
  deployer:
    scm_ref: main
    scm_type: git
