# -------------------------------------------------------------------
# Workload: ocp5_ea
# -------------------------------------------------------------------
ocp5_ea_gitops_repo_tag: main

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp5-ea-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml
ocp4_workload_showroom_antora_image: quay.io/rhpds/antora:v1.3.0

# Enable Wetty terminal and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 288a8176-a7fe-4857-b618-b397cbc6db18
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    - name: Nate Stephany
      email: nstephan@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Container Platform 5 Cluster (Early Access Program)
    category: Workshops
    keywords:
    - workshop
    - openshift5
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
    workshopUiDisabled: true

    parameters:
    - name: ocp5_ea_llm_api_key
      description: >-
        The API key for the LLM API
      formLabel: LLM API Key (Required)
      openAPIV3Schema:
        type: string
        minLength: 1
      required: true
