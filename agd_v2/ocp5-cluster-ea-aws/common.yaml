---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift 5 Early Access Cluster (AWS) - AgdV2
# -------------------------------------------------------------------

# --------------------------------------------------------------------
# AgnosticV includes
# --------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-3.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: main
config: openshift-cluster

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # OCP5 Early Access automation (provides rhdp.workshop.ocp5_ea)
  - name: https://github.com/rhpds/ocp5-ea-automation
    type: git
    version: main
  # Showroom Collection
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "v1.5.2"

# -------------------------------------------------------------------
# Bastion VM Settings
# -------------------------------------------------------------------
bastion_setup_student_user: true
bastion_student_user_name: lab-user

host_common_packages_update_all: false

bastion_instance_image: RHEL-10-GOLD-latest

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# OpenShift Settings
# -------------------------------------------------------------------
host_ocp4_installer_use_dev_preview: true
host_ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/amd64/clients/ocp-dev-preview/candidate-5.0/openshift-install-linux.tar.gz
host_ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/amd64/clients/ocp-dev-preview/candidate-5.0/openshift-client-linux-amd64-rhel9.tar.gz

host_ocp4_installer_info_set_user_data_kubeadmin_password: true
openshift_cluster_admin_service_account_enable: true

# Resolve cluster admin token from user_data for workloads
openshift_cluster_admin_token: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_token') | default('') }}"
openshift_api_key: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Cluster sizing
# -------------------------------------------------------------------
control_plane_instance_count: 3
control_plane_instance_type: m6a.2xlarge
control_plane_storage_type: gp3

worker_instance_count: 3
worker_instance_type: m6a.4xlarge

# -------------------------------------------------------------------
# Common Password (used by OCP5 EA workloads)
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Workloads to deploy on the cluster (YAML List)
workloads:
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- rhdp.workshop.ocp5_ea
- agnosticd.showroom.ocp4_workload_showroom


# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1

ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: false

ocp4_workload_cert_manager_use_catalog_snapshot: false
# ocp4_workload_cert_manager_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
# ocp4_workload_cert_manager_catalog_snapshot_image_tag: v4.22_2026_08_03

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.6

# Temporarily pin 4.22 Snapshots until everything is in the 5.0 catalogs
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_authentication_keycloak_catalogsource_tag: v4.22_2026_08_03

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_enabled_nested_kvm: true

ocp4_workload_openshift_virtualization_use_catalog_snapshot: false
# ocp4_workload_openshift_virtualization_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
# ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: v4.22_2026_08_03

