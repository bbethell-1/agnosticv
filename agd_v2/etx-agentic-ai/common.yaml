---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: ETX AI Super Lab 2 (Agentic AI)
#                   Cluster (CNV) - AgdV2
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-service-mesh.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/num-users-salesforce.yaml

#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: openshift-cluster

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.3
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main
  # AI OpenShift Workloads
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: main

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 2Gi

master_instance_count: 3
worker_instance_count: "{{ 3 if num_users | int <= 3 else [(num_users | int / 2) | round(0, 'ceil') | int, 3] | max }}"

ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

ai_workers_cores: 16
ai_workers_memory: 32Gi

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
bastion_setup_student_user: true

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.20.0"
host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true

cluster_name: "cluster-{{ guid }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_authentication_rhsso
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.core_workloads.ocp4_workload_servicemesh2
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.core_workloads.ocp4_workload_showroom

# ===================================================================
# Variables for specific workloads
# ===================================================================
ocp4_workload_admin_username: admin
ocp4_workload_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
# FIXME pipelines and openshift_ai when new tag is available
ocp4_workload_catalogsource_tag: v4.20_2025_10_23

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: stable-4.19

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication_rhsso
# -------------------------------------------------------------------
ocp4_workload_authentication_rhsso_channel: stable
ocp4_workload_authentication_rhsso_use_catalog_source: true
ocp4_workload_authentication_rhsso_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_authentication_rhsso_admin_username: "{{ ocp4_workload_admin_username }}"
ocp4_workload_authentication_rhsso_admin_password: "{{ ocp4_workload_admin_password }}"
ocp4_workload_authentication_rhsso_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_rhsso_user_name_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_rhsso_user_password: "{{ ocp4_workload_user_password }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.17
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_cloud_provider: aws
ocp4_workload_cert_manager_aws_region: us-east-2
ocp4_workload_cert_manager_aws_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_aws_hostedzoneid: "{{ route53_aws_zone_id }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resource_health:
- check: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Always Healthy - See https://github.com/argoproj/argo-cd/pull/24284"
    return hs
  group: opentelemetry.io
  kind: OpenTelemetryCollector

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_pipelines
# -------------------------------------------------------------------
# FIXME catalog snapshot has up to version 1.17 only
ocp4_workload_pipelines_channel: pipelines-1.17
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_serverless_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_servicemesh2
# -------------------------------------------------------------------
ocp4_workload_servicemesh2_servicemesh_channel: stable
ocp4_workload_servicemesh2_catalogsource_setup: true
ocp4_workload_servicemesh2_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_servicemesh2_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_servicemesh2_es: false
ocp4_workload_servicemesh2_jaeger: false
ocp4_workload_servicemesh2_kiali: false

# -------------------------------------------------------------------
# agnosticd.ai_workloads.ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable-2.22
# FIXME openshift_ai not available in snapshot yet
ocp4_workload_openshift_ai_use_catalog_snapshot: false
# ocp4_workload_openshift_ai_use_catalog_snapshot: true
# ocp4_workload_openshift_ai_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
# ocp4_workload_openshift_ai_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_ai_kserve: Managed

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/etx-agentic-ai-gitops
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ ocp4_workload_user_count }}"
    base: "{{ ocp4_workload_user_base }}"
