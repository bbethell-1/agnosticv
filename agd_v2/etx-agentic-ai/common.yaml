# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/etx-agentic-ai-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2025-07-29

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 2eb46adb-24b6-4846-912e-37f0584a1c1e
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      # Use older EE temporarily until showroom is fixed
      # image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB8739: ETX AI Super Lab 2 (Agentic AI)
    category: Brand_Events
    keywords:
    - workshop
    - openshift
    - openshiftai
    - gitops
    - rh12026
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '71'
      Brand_Event: Red_Hat_One_2026
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
