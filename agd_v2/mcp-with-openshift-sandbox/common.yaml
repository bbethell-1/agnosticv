---
# -------------------------------------------------------------------
# --- Catalog Item: MCP with OpenShift (Sandbox / Namespace)
# --- USER PROVISIONER -- per-user resources on shared cluster
# --- Single-user deployment on a shared pre-provisioned cluster
# --- Tenant roles pattern (platform/infra/tenant) -- Summit 2026
# ---
# --- Cluster provisioning (Keycloak, Gitea, Pipelines, ArgoCD,
# --- ToolHive, monitoring, CloudNativePG) is handled separately
# --- by the cluster provisioner playbook:
# ---   rhpds.ocpsandbox_mcp_with_openshift/tests/e2e/cluster-provision.yml
# ---
# --- This file is the only AgV config needed. No extra files required
# --- beyond common.yaml, dev.yaml, and description.adoc.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/litemaas-master_api.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# cloud_provider: none -- no cloud account needed, we use pre-provisioned
# OCP clusters from the sandbox pool.
# config: namespace -- uses AgnosticD's namespace config which:
#   - Runs workloads on provision (software.yml)
#   - Runs workloads in REVERSE order on destroy (destroy_env.yml)
#   - Sets K8S_AUTH_* env vars for kubernetes.core modules
#   - Does NOT need remove_workloads (unlike openshift-workloads config)
# ===================================================================
cloud_provider: none
config: namespace
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Tenant roles (keycloak_user, namespace, gitea)
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: tenant-roles

  # GitOps bootstrap (drives all ArgoCD apps via app-of-apps)
  # Using gitops-bootstrap-userinfo branch: userinfo ConfigMap + finalizer + remove_workload
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: gitops-bootstrap-userinfo

  # LiteLLM Virtual Keys
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.0.0"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.5.1

# ===================================================================
# List of workloads to be deployed
#
# Order matters:
#   1. tenant_keycloak_user  -- Create RHBK user
#   2. tenant_namespace      -- Create all per-user namespaces
#   3. tenant_gitea          -- Per-user Gitea instance + user + repo migration
#   4. litellm               -- LiteMaaS key
#   5. gitops_bootstrap      -- Bootstrap ArgoCD app-of-apps (drives all tenant apps)
#   6. console_embed         -- OpenShift console iframe integration
#   7. showroom              -- Lab instructions UI
#
# NOTE: gitops_bootstrap replaces tenant_argocd_user + mcp_user.
# ArgoCD manages all tenant applications via tenant/bootstrap/ in GitOps repo.
# GitOps repo restructure needed -- align with Judd's pattern.
# ===================================================================
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom

# remove_workloads runs in the ORDER listed (explicit destroy control).
remove_workloads:
- agnosticd.showroom.ocp4_workload_showroom
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Common -- sandbox API provides cluster endpoint and primary namespace.
# All user/namespace creation is handled by Ansible roles (scheduler only).
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
#
# ocp4_workload_tenant_keycloak_username is the single username for
# this lab. All other tenant roles reference it. Override here only
# if you need per-role usernames.
#
# Namespace format:  {suffix}-{ocp4_workload_tenant_keycloak_username}
#   librechat-mcpuser-guid, mcp-gitea-mcpuser-guid, etc.
#
# Reference in GitOps/Ansible roles:
#   ocp4_workload_tenant_namespace_prefix: "{{ ocp4_workload_tenant_keycloak_username }}"
#   ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
#   ocp4_workload_tenant_argocd_user_username: "{{ ocp4_workload_tenant_keycloak_username }}"
#   ocp4_workload_tenant_gitea_username: "{{ ocp4_workload_tenant_keycloak_username }}"
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "mcpuser-{{ guid }}"
# Single password for all tenant resources -- deterministic from guid
common_password: "Mcp{{ (guid | hash('sha256'))[:8] }}!"

# Password -- deterministic from GUID, satisfies complexity requirements:
# uppercase + lowercase + digit + special = Mcp{8 hex chars}!
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"  # all tenant resources use this

# -------------------------------------------------------------------
# Tenant namespaces -- created by ocp4_workload_tenant_namespace.
# Format: {suffix}-{prefix}  e.g. librechat-mcpuser-guid
# Each namespace gets its own quota — heavier services get more resources.
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_prefix: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"

# Using Style A — per-namespace quota (different limits per namespace)
ocp4_workload_tenant_namespace_namespaces:
- suffix: agent
  quota:
    limits.cpu: "2"
    requests.cpu: "2"
    limits.memory: 4Gi
    requests.memory: 4Gi
    requests.storage: 10Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }
- suffix: librechat
  quota:
    limits.cpu: "4"          # LibreChat + MongoDB + Meilisearch need more
    requests.cpu: "4"
    limits.memory: 6Gi
    requests.memory: 6Gi
    requests.storage: 30Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }
- suffix: mcp-gitea
  quota:
    limits.cpu: "1"          # lightweight MCP proxy
    requests.cpu: "1"
    limits.memory: 2Gi
    requests.memory: 2Gi
    requests.storage: 5Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }
- suffix: mcp-openshift
  quota:
    limits.cpu: "1"
    requests.cpu: "1"
    limits.memory: 2Gi
    requests.memory: 2Gi
    requests.storage: 5Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }
- suffix: gitea
  quota:
    limits.cpu: "2"
    requests.cpu: "2"
    limits.memory: 4Gi
    requests.memory: 4Gi
    requests.storage: 30Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }
- suffix: showroom
  quota:
    limits.cpu: "1"
    requests.cpu: "1"
    limits.memory: 2Gi
    requests.memory: 2Gi
    requests.storage: 5Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
#
# Deploys a per-tenant ArgoCD bootstrap Application pointing to the
# tenant/ directory in the GitOps repo. ArgoCD manages all tenant
# apps from there (app-of-apps pattern).
#
# TODO: GitOps repo needs tenant/bootstrap/ with Application YAMLs.
# Align with Judd's pattern before enabling.
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_repo_path: "tenant/bootstrap"
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_application_project: tenants
# How namespace targeting works in GitOps:
# The bootstrap Helm chart constructs namespace names as {suffix}-{tenant.username}
# e.g. librechat-mcpuser-drw4x, mcp-gitea-mcpuser-drw4x, etc.
# The ocp4_workload_tenant_namespace role above creates namespaces with the same formula.
# Both use the same username — that is the entire contract.
# ArgoCD uses CreateNamespace=false so it deploys into the pre-created namespaces.
# You never specify namespace names explicitly — they are derived from username.
ocp4_workload_gitops_bootstrap_helm_values:
  tenant:
    username: "{{ ocp4_workload_tenant_keycloak_username }}"
    password: "{{ common_password }}"
  litemaas:
    url: "{{ litellm_api_endpoint | default('') }}/v1"
    key: "{{ litellm_virtual_key | default('') }}"
    models: "{{ litellm_available_models | default([]) | join(',') }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_gitea
# -------------------------------------------------------------------
ocp4_workload_tenant_gitea_namespace: "gitea-{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_gitea_admin_password: "{{ common_password }}"
ocp4_workload_tenant_gitea_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_gitea_password: "{{ common_password }}"
ocp4_workload_tenant_gitea_repositories:
- name: mcp
  repo: https://github.com/rhpds/ocpsandbox-mcp-with-openshift-gitops
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
#
# Creates a LiteMaaS virtual key with access to the specified models.
# The key and endpoint are exported as facts (litellm_virtual_key,
# litellm_api_endpoint, litellm_available_models) and consumed by
# the MCP role below for LibreChat and Agent configuration.
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
- qwen3-14b
- llama-scout-17b
ocp4_workload_litellm_virtual_keys_multi_user: false
ocp4_workload_litellm_virtual_keys_user_count: 1
ocp4_workload_litellm_virtual_keys_verify_ssl: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ocp_console_embed + ocp4_workload_showroom
#
# openshift_cluster_ingress_domain is discovered by the MCP role
# (runs before showroom) via cluster ingress config lookup and
# exported as a fact.
#
# The MCP role also writes ~/.kube/config so that these downstream
# roles (which use kubernetes.core without explicit host:/api_key:)
# can authenticate to the cluster.
#
# Additionally, config: namespace sets K8S_AUTH_* env vars via
# apply.environment on include_role (PR #117 in agnosticd-v2).
# -------------------------------------------------------------------
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"
# openshift_cluster_ingress_domain is set by ocp4_workload_tenant_keycloak_user via cluster discovery
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/lb1726-mcp-showroom
ocp4_workload_showroom_content_git_repo_ref: sandbox-login-instructions
ocp4_workload_showroom_terminal_type: ""
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: OpenShift Console
    url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
  - name: LibreChat
    url: 'https://librechat-{{ ocp4_workload_tenant_keycloak_username }}-librechat.{{ openshift_cluster_ingress_domain }}'
  - name: Gitea
    url: 'https://gitea-{{ ocp4_workload_tenant_keycloak_username }}-gitea.{{ openshift_cluster_ingress_domain }}'

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: 8030d69b-c145-48fa-a8a9-219ffa0f780e
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    - name: Tony Kay
      email: ankay@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "MCP with OpenShift (Sandbox)"
    category: Workshops
    keywords:
    - mcp
    - openshift
    - ai
    - sovereign
    - sre
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: false
    workshopLabUiRedirect: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Artificial_Intelligence

  # -----------------------------------------------------------------
  # Sandbox API behavior
  # -----------------------------------------------------------------
  sandbox_api:
    actions:
      destroy: {}

  # -----------------------------------------------------------------
  # Sandbox namespace requests
  #
  # Single primary sandbox entry -- the tenant_namespace role
  # creates all per-user namespaces (librechat, mcp-gitea,
  # mcp-openshift, gitea, showroom) labeled for ArgoCD discovery.
  #
  # HOW IT WORKS:
  #   - The primary entry (alias: cluster) selects which cluster
  #     from the pool to use via cloud_selector.
  #   - It also triggers Keycloak user creation (keycloak: "yes").
  #   - All per-user namespaces are created by ocp4_workload_tenant_namespace
  #     in the format: {suffix}-{ocp4_workload_tenant_keycloak_username}
  # -----------------------------------------------------------------
  sandboxes:

  # Primary sandbox -- selects the cluster and creates Keycloak user.
  - kind: OcpSandbox
    alias: cluster
    namespace_suffix: user
    cloud_selector:
      cloud: cnv-dedicated-shared
      demo: mcp-with-openshift
      purpose: prod
    quota:
      limits.cpu: "2"
      requests.cpu: "2"
      limits.memory: 4Gi
      requests.memory: 4Gi
      requests.storage: 10Gi
    limit_range:
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
