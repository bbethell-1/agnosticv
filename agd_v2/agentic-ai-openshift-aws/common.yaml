---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Agentic AI with Llama Stack and 3rd party Frameworks
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking
#include /includes/parameters/litellm_metadata.yaml

#include /includes/sandbox-api.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_aws_scale_cluster: true
worker_instance_type: "m5a.4xlarge"
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:

  # AWS Cloud Provider
  # Only used with openshift_aws_scale_cluster
  - name: https://github.com/rhpds/cloud_provider_aws.git
    type: git
    version: "{{ tag }}"

  # Assisted Installer Collection
  # Only used with openshift_cnv_scale_cluster
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # Custom AI workloads
  # - name: https://github.com/rhpds/rhpds.openshift_ai.git
  #   type: git
  #   version: main

  # RHPDS MCP Workloads
  - name: https://github.com/rhpds/mcp_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.3.7 # picking up mermaid and other fixes, was v1.3.5 before (and main)

  # Showroom AI
  - name: https://github.com/jamesfalkner/showroom-ai-assistant-collection.git
    type: git
    version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# - agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.showroom_ai_assistant.ocp4_workload_showroom_ai_assistant

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:10] }}"
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:16] }}"

# -------------------------------------------------------------------
# MaaSSandbox
# -------------------------------------------------------------------
litellm_api_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
litellm_virtual_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
litellm_available_models: "{{  maas_sandbox.credentials[0].available_models }}"
litellm_available_models_list: "{{ maas_sandbox.credentials[0].available_models | join(', ') }}"
litellm_key_duration: ""
litellm_virtual_keys: "{{ maas_sandbox.credentials | map(attribute='virtual_key') | list }}"
userdata: >-
  {
  {% for i in range(0,num_users) %}
  "user{{i+1}}": {
     litellm_api_endpoint: "{{ maas_sandbox.credentials[i].api_endpoint  }}",
     litellm_api_base_url: "{{ maas_sandbox.credentials[i].api_endpoint  }}/v1",
     litellm_virtual_key: "{{ maas_sandbox.credentials[i].virtual_key }}",
     litellm_user{{i+1}}_virtual_key: "{{ maas_sandbox.credentials[i].virtual_key }}",
     litellm_key_alias: "{{ maas_sandbox.credentials[i].key_alias }}",
     litellm_key_id: "{{  maas_sandbox.credentials[i].key_id }}",
     litellm_user_email: "user{{ i }}@example.com",
     litellm_available_models: "{{  maas_sandbox.credentials[i].available_models }}",
     litellm_available_models_list: "{{ maas_sandbox.credentials[i].available_models | join(', ') }}",
     litellm_key_duration: ""
    },
  {% endfor %}
  }
litellm_passthrough_user_data:
  litellm_api_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
  litellm_virtual_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
  litellm_available_models: "{{  maas_sandbox.credentials[0].available_models }}"
  litellm_available_models_list: "{{ maas_sandbox.credentials[0].available_models | join(', ') }}"
  litellm_virtual_keys: "{{ maas_sandbox.credentials | map(attribute='virtual_key') | list }}"
  litellm_key_duration: ""

agnosticd_passthrough_user_data: |
  {{ litellm_passthrough_user_data
   | combine( {
     "users": userdata | from_yaml })
  }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password}}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: false
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('2')) | int }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

ocp4_workload_authentication_admin_user: admin
# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_repositories_list:
- name: mcp
  repo: https://github.com/burrsutter/fantaco-redhat-one-2026
  private: false

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.2"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
# ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
# ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: mcpadmin
ocp4_workload_gitea_operator_admin_email: mcpadmin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password}}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_htpasswd_user_base }}%d"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.20
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi

ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/agentic-ai-openshift-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users | default(1) }}"

  guid: "{{ guid }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-agentic-ai-llamastack
ocp4_workload_showroom_content_git_repo_ref: main

# Adding terminals. Links are configured in ui-config.yaml in the showroom repo.

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/juliaaano/openshift-showroom-terminal-ocp:2025-12-02

ocp4_workload_showroom_passthrough_user_data: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e0ffc45b-d7b0-4b86-a669-3aada227319d
  anarchy:
    namespace: babylon-anarchy-6
  owners:
    maintainer:
    - name: Tony Kay
      email: ankay@redhat.com
    sme:
    - name: Burr Sutter
      email: bsutter@redhat.com
    - name: Natale Vinto
      email: nvinto@redhat.com
  sandbox_api:
    actions:
      destroy:
        catch_all: false # Allow remove_workloads to run before sandbox is destroyed

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Agentic AI with Llama Stack and 3rd party Frameworks (AWS)"
    workshopLabUiRedirect: true
    category: Brand_Events
    keywords:
    - lb1688
    - rh1-2026
    - openshift ai
    - mcp
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
      Platform: AI
      TDP1: AI_Platform
    multiuser: true
    reportingLabels:
      primaryBU: Artificial_Intelligence
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 22
    workshop_user_mode: multi
  sandboxes:
  - kind: MaaSSandbox
    cloud_selector:
      purpose: production
    virtual_key_count: "{{ job_vars.num_users }}"
    models: "llama-scout-17b,Llama-Guard-3-1B,nomic-embed-text-v1-5,qwen3-14b,granite-4-0-h-tiny"
    var: maas_sandbox
  components:
  - name: openshift_aws
    display_name: OpenShift Container Platform Cluster (AWS Pools)
    item: agd-v2/ocp-cluster-aws-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
      agnosticd_open_environment: false
      aws_region: us-east-2
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
