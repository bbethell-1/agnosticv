---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-ai.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml

# -------------------------------------------------------------------
# --- Catalog Item: AI501 - GenAIOps Enablement with Red Hat AI Enterprise
# -------------------------------------------------------------------

# Repository Tag for all agnosticd-v2 collections
tag: main

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: main
config: openshift-cluster

num_users: "{{ num_users_param }}"

common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL96GOLD-latest
bastion_setup_student_user: true
bastion_student_user_name: lab-user

host_ocp4_installer_info_set_user_data_kubeadmin_password: true
openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

# -------------------------------------------------------------------
# Control Plane
# -------------------------------------------------------------------
control_plane_instance_type: m6i.4xlarge
control_plane_instance_count: 3

# -------------------------------------------------------------------
# Workers (base cluster workers, count scales with num_users)
# -------------------------------------------------------------------
worker_instance_type: m6i.8xlarge
worker_instance_count: "{{ [(num_users | int / 3.0) | round(0, 'ceil') | int, 3] | max }}"
worker_storage_type: gp3
worker_storage_size: 500

aws_region: us-east-2
# Region is hardcoded to us-east-2 below (no catalog Region parameter).
# GPU capacity for stop/start is unreliable in eu-west-1 / ap-southeast-1.
# GPTEINFRA-18013
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI OpenShift Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # AI501 GenAIOps Enablement Workloads
  - name: https://github.com/rhpds/ai501-genaiops-automation.git
    type: git
    version: v1.0.0

# ===================================================================
# Workloads
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_machinesets
- agnosticd.core_workloads.ocp4_workload_nfd
- agnosticd.ai_workloads.ocp4_workload_nvidia_gpu_operator
- workshop.aai501.ocp4_workload_ai501

# ===================================================================
# Workload Variables
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# v1 counterpart: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# No htpasswd users provisioned here - the AI501 workload manages its own user setup
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: htpasswd
# this will force the users to be user1-n, even if there is only 1 user provisioned
# otherwise, it would be just "user"
ocp4_workload_authentication_multiuser: true
ocp4_workload_authentication_num_users: "{{ num_users }}"
ocp4_workload_authentication_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# v1 counterpart: ocp4_workload_machinesets (same role, same vars)
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: false

ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu
  autoscale: true
  total_replicas: 1
  total_replicas_min: 1
  total_replicas_max: 3
  role: worker-gpu
  taints:
  - key: nvidia.com/gpu
    value: g4dn
    effect: NoSchedule
  instance_type: g4dn.2xlarge
- name: worker-gpu-g5
  autoscale: true
  total_replicas: 2
  total_replicas_min: 2
  total_replicas_max: 3
  role: worker-gpu
  taints:
  - key: nvidia.com/gpu
    value: g5
    effect: NoSchedule
  instance_type: g5.2xlarge

# -------------------------------------------------------------------
# Workload: ocp4_workload_nfd
# v1 counterpart: part of ocp4_workload_nvidia_gpu_setup
# Uses role defaults - no overrides needed
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_nvidia_gpu_operator
# v1 counterpart: part of ocp4_workload_nvidia_gpu_setup
# -------------------------------------------------------------------
ocp4_workload_nvidia_gpu_operator_channel: stable
ocp4_workload_nvidia_gpu_operator_wait_for_cluster_policy: false
ocp4_workload_nvidia_gpu_operator_ignore_csv_error: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ai501
# -------------------------------------------------------------------
ocp4_workload_ai501_num_users: "{{ num_users }}"
ocp4_workload_ai501_user_password: "{{ common_password }}"
ocp4_workload_ai501_deploy_lab_repo_version: main

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5f57a128-9f7f-4adf-9f5c-ad2cf40af9ad
  owners:
    maintainer:
    - name: Cansu Kavili Oernek
      email: ckavili@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "AI501: GenAIOps Enablement with Red Hat AI Enterprise"
    workshopUiDisabled: false
    category: Workshops
    multiuser: true
    workshop_user_mode: multi
    keywords:
    - ai
    - genaiops
    - aiops
    - mlops
    labels:
      Provider: AI_BU_Customer_Adoption_and_Innovation_Team
      Platform: AI
      TDP1: AI_Platform
    reportingLabels:
      primaryBU: Artificial_Intelligence
    num_users_parameter: num_users_param
    parameters:
    - name: num_users_param
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 30
