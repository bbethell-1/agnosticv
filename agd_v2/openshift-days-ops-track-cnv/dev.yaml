---
# -------------------------------------------------------------------
# Development overrides
# -------------------------------------------------------------------
# Use main branch for development testing
tag: main

# Showroom content repo - use main for dev
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Remove Quay from base workloads (confirmed not needed for workshop)
# -------------------------------------------------------------------
_base_workloads:
# Phase 1: Foundation & Authentication
- agnosticd.core_workloads.ocp4_workload_authentication
# Phase 2: Workshop Infrastructure
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom
- openshift_days.ops_track.ocp4_workload_days_ops_track
- agnosticd.core_workloads.ocp4_workload_web_terminal
- openshift_days.ops_track.ocp4_workload_kubernetes_image_puller
# Phase 3: CI/CD
- agnosticd.core_workloads.ocp4_workload_pipelines

# -------------------------------------------------------------------
# Disable modules not applicable to CNV clusters
# -------------------------------------------------------------------
module_enable_backup: false
module_enable_waf: false

# -------------------------------------------------------------------
# Reduce ACM Multicluster Observability replicas and CPU requests
# -------------------------------------------------------------------
ocp4_workload_acm_multicluster_observability_compact_resources: true

# -------------------------------------------------------------------
# Reduce NooBaa resources at workload deploy time
# -------------------------------------------------------------------
workshop_reduce_noobaa_resources: true

# -------------------------------------------------------------------
# Reduce Prometheus retention from 15d to 2d (~4 GiB memory savings)
# -------------------------------------------------------------------
workshop_reduce_prometheus_retention: true

# -------------------------------------------------------------------
# Pin sovereign_cloud collection to known good version
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.5.4
  - name: git+https://github.com/rhpds/openshift-days-roadshow-automation.git#/ops_track
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: ede8c9b6
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# OLS cleanup - delete OLSConfig so students create it in the lab
# -------------------------------------------------------------------
_ols_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols
- openshift_days.ops_track.ocp4_workload_ols_cleanup

# -------------------------------------------------------------------
# Pin floating operators to catalog snapshot for reproducible installs.
# Without this, operators on 'stable'/'fast' channels can auto-upgrade
# between deployments, breaking the workshop if a new version changes
# defaults or introduces bugs.
#
# Snapshot: v4.20_2026_03_16 (latest weekly snapshot)
# Operators not in the snapshot (RHDH, Image Puller) are pinned by
# startingCSV instead.
# -------------------------------------------------------------------
ocp4_workload_catalogsource_tag: v4.20_2026_03_16

# Pin to snapshot (these are in the redhat-operators snapshot)
# Each role uses its OWN tag variable — the shared ocp4_workload_catalogsource_tag
# is NOT picked up by upstream roles. Must set per-role tags explicitly.
ocp4_workload_openshift_virtualization_use_catalog_snapshot: true
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: v4.20_2026_03_16
ocp4_workload_metallb_use_catalog_snapshot: true
ocp4_workload_metallb_catalog_snapshot_image_tag: v4.20_2026_03_16
ocp4_workload_web_terminal_use_catalog_snapshot: true
ocp4_workload_web_terminal_catalogsource_setup: true
ocp4_workload_web_terminal_catalog_snapshot_image_tag: v4.20_2026_03_16
# OLS uses a different catalog image by default (quay.io/openshift-lightspeed/...)
# Override to use our shared snapshot image instead
ocp4_workload_ols_use_catalog_snapshot: true
ocp4_workload_ols_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_ols_catalog_snapshot_image_tag: v4.20_2026_03_16
ocp4_workload_ols_catalogsource_name: redhat-operators-snapshot-lightspeed

# RHDH is not in the snapshot — pin by startingCSV + Manual approval
# startingCSV ensures OLM installs v1.9.1, Manual approval prevents
# OLM from auto-upgrading to a newer version in the fast channel.
ocp4_days_workload_rhdh_starting_csv: "rhdh-operator.v1.9.1"
ocp4_days_workload_rhdh_automatic_install_plan_approval: false

# -------------------------------------------------------------------
# RHACS iframe fix — patch Central route passthrough → reencrypt
# so the IngressController can strip X-Frame-Options and Showroom
# can embed the RHACS console tab in an iframe.
# -------------------------------------------------------------------
_security_workloads:
- agnosticd.core_workloads.ocp4_workload_rhacs
- openshift_days.ops_track.ocp4_workload_rhacs_console_embed
- openshift_days.ops_track.ocp4_days_workload_compliance_operator

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
