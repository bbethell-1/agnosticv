---
# -------------------------------------------------------------------
# Development overrides
# -------------------------------------------------------------------
# Use main branch for development testing
tag: main

# Showroom content repo - use main for dev
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# RHACS - resource overrides for compact cluster
# Reduces total from ~15 cores to ~4 cores
# -------------------------------------------------------------------
ocp4_workload_rhacs_central_resources_update: true
ocp4_workload_rhacs_central_requests_cpu: "500m"
ocp4_workload_rhacs_central_requests_memory: "2Gi"
ocp4_workload_rhacs_central_limits_cpu: "2"
ocp4_workload_rhacs_central_limits_memory: "4Gi"
ocp4_workload_rhacs_central_db_resources_update: true
ocp4_workload_rhacs_central_db_requests_cpu: "500m"
ocp4_workload_rhacs_central_db_requests_memory: "2Gi"
ocp4_workload_rhacs_central_db_limits_cpu: "2"
ocp4_workload_rhacs_central_db_limits_memory: "4Gi"
ocp4_workload_rhacs_scanner_resources_update: true
ocp4_workload_rhacs_scanner_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_requests_memory: "512Mi"
ocp4_workload_rhacs_scanner_limits_cpu: "1"
ocp4_workload_rhacs_scanner_limits_memory: "2Gi"
ocp4_workload_rhacs_scanner_v4_resources_update: true
ocp4_workload_rhacs_scanner_v4_indexer_replicas: 1
ocp4_workload_rhacs_scanner_v4_indexer_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_v4_indexer_requests_memory: "512Mi"
ocp4_workload_rhacs_scanner_v4_indexer_limits_cpu: "1"
ocp4_workload_rhacs_scanner_v4_indexer_limits_memory: "2Gi"
ocp4_workload_rhacs_scanner_v4_matcher_replicas: 1
ocp4_workload_rhacs_scanner_v4_matcher_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_v4_matcher_requests_memory: "512Mi"
ocp4_workload_rhacs_scanner_v4_matcher_limits_cpu: "1"
ocp4_workload_rhacs_scanner_v4_matcher_limits_memory: "2Gi"
ocp4_workload_rhacs_scanner_v4_db_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_v4_db_requests_memory: "1Gi"
ocp4_workload_rhacs_scanner_v4_db_limits_cpu: "1"
ocp4_workload_rhacs_scanner_v4_db_limits_memory: "2Gi"
ocp4_workload_rhacs_sensor_resources_update: true
ocp4_workload_rhacs_sensor_requests_cpu: "500m"
ocp4_workload_rhacs_sensor_requests_memory: "1Gi"
ocp4_workload_rhacs_sensor_limits_cpu: "2"
ocp4_workload_rhacs_sensor_limits_memory: "4Gi"

# -------------------------------------------------------------------
# Quay - resource overrides for compact cluster
# Reduces replicas and resource requests
# -------------------------------------------------------------------
ocp4_workload_quay_operator_registry_quay_resources_update: true
ocp4_workload_quay_operator_registry_quay_replicas: 1
ocp4_workload_quay_operator_registry_quay_requests_cpu: "1000m"
ocp4_workload_quay_operator_registry_quay_requests_memory: "2Gi"
ocp4_workload_quay_operator_registry_quay_limits_cpu: "2"
ocp4_workload_quay_operator_registry_quay_limits_memory: "4Gi"
ocp4_workload_quay_operator_registry_clair_resources_update: true
ocp4_workload_quay_operator_registry_clair_replicas: 1
ocp4_workload_quay_operator_registry_clair_requests_cpu: "500m"
ocp4_workload_quay_operator_registry_clair_requests_memory: "1Gi"
ocp4_workload_quay_operator_registry_clair_limits_cpu: "1"
ocp4_workload_quay_operator_registry_clair_limits_memory: "2Gi"
ocp4_workload_quay_operator_registry_enable_clairpostgres: true
ocp4_workload_quay_operator_registry_startup_probe_update: true
ocp4_workload_quay_operator_registry_startup_probe_failure_threshold: 30

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
