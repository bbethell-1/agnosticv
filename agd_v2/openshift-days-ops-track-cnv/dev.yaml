---
# -------------------------------------------------------------------
# Development overrides for OCP 4.22 testing
# All workload config is in common.yaml. This file only overrides
# branch references and version pins for dev testing.
# -------------------------------------------------------------------

# Use dev branch for development testing
tag: dev

# Showroom content repo - use dev for testing
ocp4_workload_showroom_content_git_repo_ref: dev
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# Override requirements_content to drop #/ops_track fragment
# The dev branch of the automation repo has galaxy.yml at root
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12
  - name: https://github.com/rhpds/openshift-days-roadshow-automation.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# Version overrides (from catalog snapshot v4.22_2026_07_27)
# -------------------------------------------------------------------
ocp4_workload_catalogsource_tag: "v4.22_2026_07_27"
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: "v4.22_2026_07_27"
ocp4_workload_metallb_catalog_snapshot_image_tag: "v4.22_2026_07_27"
ocp4_workload_web_terminal_catalog_snapshot_image_tag: "v4.22_2026_07_27"
ocp4_workload_ols_catalog_snapshot_image_tag: "v4.22_2026_07_27"
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.11"
ocp4_workload_openshift_gitops_channel: "gitops-1.21"
ocp4_workload_pipelines_channel: "pipelines-1.23"
ocp4_workload_rhacm_acm_channel: "release-2.17"
ocp4_days_workload_rhdh_starting_csv: "rhdh-operator.v1.9.7"
ocp4_workload_prepare_hcp_gitops_operator_channel: "gitops-1.21"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main

  components:
  - name: openshift-base
    display_name: OpenShift Cluster (CNV)
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.22"
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
