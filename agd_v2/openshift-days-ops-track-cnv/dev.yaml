# -------------------------------------------------------------------
# Version overrides (from catalog snapshot v4.22_2026_08_31)
# -------------------------------------------------------------------
ocp4_workload_catalogsource_tag: "v4.22_2026_08_31"
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: "v4.22_2026_08_31"
ocp4_workload_openshift_virtualization_boot_sources_shapshot: false
ocp4_workload_metallb_catalog_snapshot_image_tag: "v4.22_2026_08_31"
ocp4_workload_web_terminal_catalog_snapshot_image_tag: "v4.22_2026_08_31"
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.11"
ocp4_workload_openshift_gitops_channel: "gitops-1.21"
