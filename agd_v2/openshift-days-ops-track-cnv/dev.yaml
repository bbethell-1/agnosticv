---
# -------------------------------------------------------------------
# Development overrides for OCP 5.0 testing
# All workload config is in common.yaml. This file only overrides
# branch references and version pins for dev testing.
# -------------------------------------------------------------------

# Use dev branch for development testing
tag: dev

# Showroom content repo - now served from the deliver-openshift-ops-day
# monorepo instead of the standalone openshift-days-ops-showroom repo
# (matches rh1-2027/lb1543-ocp-ops-day-cnv pattern).
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/deliver-openshift-ops-day.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# Override requirements_content: automation roles now come from the
# deliver-openshift-ops-day monorepo instead of the standalone
# openshift-days-roadshow-automation repo. showroom collection (the
# generic deploy mechanism, not this workshop's content) is unchanged.
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12
  - name: https://github.com/rhpds/deliver-openshift-ops-day.git#/automation/ansible
    type: git
    version: main
  # Pinned to ede8c9b6 - main branch removed ManagedClusterSet and policy tasks
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: ede8c9b6
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: main

# -------------------------------------------------------------------
