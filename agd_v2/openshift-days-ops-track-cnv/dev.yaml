---
# -------------------------------------------------------------------
# Development overrides
# -------------------------------------------------------------------
# Use main branch for development testing
tag: main

# Showroom content repo - use main for dev
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Fix Quay resource overrides
# common.yaml sets wrong variable names (_requests_cpu vs _cpu_request)
# and is missing the master toggle (quay_overrides)
# -------------------------------------------------------------------
ocp4_workload_quay_operator_registry_quay_overrides: true
ocp4_workload_quay_operator_registry_quay_overrides_resources: true
ocp4_workload_quay_operator_registry_quay_overrides_env: false
ocp4_workload_quay_operator_registry_quay_cpu_request: "250m"
ocp4_workload_quay_operator_registry_quay_memory_request: "1Gi"
ocp4_workload_quay_operator_registry_quay_cpu_limit: "1"
ocp4_workload_quay_operator_registry_quay_memory_limit: "4Gi"

# -------------------------------------------------------------------
# Reduce ACM Multicluster Observability replicas and CPU requests
# Default MCO deploys 2-3 replicas per Thanos component (~3100m total)
# but actual usage is ~135m. Compact mode reduces all to 1 replica
# with lower requests. All components remain functional (no HA only).
# Set to false to revert to MCO operator defaults.
# Requires: rhpds/openshift-days-roadshow-automation PR #2
# -------------------------------------------------------------------
ocp4_workload_acm_multicluster_observability_compact_resources: true

# -------------------------------------------------------------------
# Reduce NooBaa resources at workload deploy time
# Patches NooBaa/BackingStore CRs on existing pool clusters that were
# built before the pool-level fix (ocp-cluster-cnv-pools/dev.yaml).
# Saves ~4350m CPU requests. Runs early (before Quay, RHACS, etc.).
# Requires: rhpds/openshift-days-roadshow-automation PR #2
# -------------------------------------------------------------------
workshop_reduce_noobaa_resources: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
