---
# -------------------------------------------------------------------
# Development overrides
# -------------------------------------------------------------------
# Use main branch for development testing
tag: main

# Showroom content repo - use main for dev
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Remove Quay from base workloads (confirmed not needed for workshop)
# -------------------------------------------------------------------
_base_workloads:
# Phase 1: Foundation & Authentication
- agnosticd.core_workloads.ocp4_workload_authentication
# Phase 2: Workshop Infrastructure
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom
- openshift_days.ops_track.ocp4_workload_days_ops_track
- agnosticd.core_workloads.ocp4_workload_web_terminal
- openshift_days.ops_track.ocp4_workload_kubernetes_image_puller
# Phase 3: CI/CD
- agnosticd.core_workloads.ocp4_workload_pipelines

# -------------------------------------------------------------------
# Disable modules not applicable to CNV clusters
# -------------------------------------------------------------------
module_enable_backup: false
module_enable_waf: false

# -------------------------------------------------------------------
# Reduce ACM Multicluster Observability replicas and CPU requests
# -------------------------------------------------------------------
ocp4_workload_acm_multicluster_observability_compact_resources: true

# -------------------------------------------------------------------
# Reduce NooBaa resources at workload deploy time
# -------------------------------------------------------------------
workshop_reduce_noobaa_resources: true

# -------------------------------------------------------------------
# Reduce Prometheus retention from 15d to 2d (~4 GiB memory savings)
# -------------------------------------------------------------------
workshop_reduce_prometheus_retention: true

# -------------------------------------------------------------------
# OLS cleanup - delete OLSConfig so students create it in the lab
# -------------------------------------------------------------------
_ols_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols
- openshift_days.ops_track.ocp4_workload_ols_cleanup

# -------------------------------------------------------------------
# RHACS iframe fix — patch Central route passthrough → reencrypt
# so the IngressController can strip X-Frame-Options and Showroom
# can embed the RHACS console tab in an iframe.
# -------------------------------------------------------------------
_security_workloads:
- agnosticd.core_workloads.ocp4_workload_rhacs
- openshift_days.ops_track.ocp4_workload_rhacs_console_embed
- openshift_days.ops_track.ocp4_days_workload_compliance_operator

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
