    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Building Self-contained Appliances with Red Hat Image Mode (bootc) & MicroShift
    category: Workshops
    keywords:
      - workshop
      - rhel
      - rhel9
      - lb1353
      - bootc
      - image mode
      - microshift
      - edge
