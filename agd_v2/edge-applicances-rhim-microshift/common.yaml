  asset_uuid: 878BC126-15A9-4EF1-A72C-9579F6B7FCF5
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com
    sme:
      - name: Arthur de Oliveira
        email: aoliveira@redhat.com
      - name: Hrushabh Sirsulwar
        email: hsirsulwa@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      pull: missing
