---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Building Self-contained Appliances with Red Hat Image Mode & MicroShift
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml
#include /includes/catalog-icon-rhel.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/demosat-edge-rhim-microshift.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# Subdomain configuration
subdomain: "{{ sandbox_openshift_apps_domain }}"
showroom_host: "{{ bastion_public_hostname }}"

# Bastion public hostname (dynamically built from inventory)
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}.{{ subdomain }}"

# Common password (auto-generated from GUID)
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# User configuration
ansible_user: cloud-user
remote_user: cloud-user

# -------------------------------------------------------------------
# Instance Images
# -------------------------------------------------------------------
default_instance_image: rhel-9.4
bastion_instance_image: rhel-9.6
registry_instance_image: rhel-9.6

# -------------------------------------------------------------------
# Instances to deploy
# -------------------------------------------------------------------
instances:
  - name: "{{ bastion_hostname | default('bastion') }}"
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: false
    floating_ip: false
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    memory: 16G
    cores: 8
    image_size: 200Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-http
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
  - name: registry
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: false
    floating_ip: false
    image: "{{ registry_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "nodes,registries"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: registry
        ports:
          - port: 5000
            protocol: TCP
            targetPort: 5000
            name: registry-http

# -------------------------------------------------
# Set up Bastion
# -------------------------------------------------
install_bastion: true
bastion_setup_student_user: true
bastion_student_user_name: lab-user
bastion_student_user_password: "{{ common_password }}"
openshift_cnv_route_remove_x_frame_options_header: true
# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: "{{ bastion_student_user_name }}"
student_password: "{{ bastion_student_user_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ bastion_student_user_password }}"
control_user_private_group: "{{ omit }}"
control_user_ssh_config: ./files/ssh_config.j2

# Disable control_user's user_data reporting (bastion role handles it)
control_user_enable_user_data: false

# -------------------------------------------------
# Call role host_satellite_repositories
# -------------------------------------------------
install_satellite_repositories: true

# These vars are needed and need to come from secrets:
# host_satellite_repositories_hostname:
# host_satellite_repositories_ha:
# host_satellite_repositories_org:
# host_satellite_repositories_activationkey:

# If satellite registration fails, ensure subscription-manager is configured
# This should be handled by the secrets include above

# -------------------------------------------------
# Call role host_common_packages
# -------------------------------------------------
# Common packages installed on ALL hosts (python3, git, vim-enhanced, wget, etc.)
install_common_packages: false  # Will call per-group in workloads

# Run a full dnf update on the hosts
host_common_packages_update_all: false

# Extra packages set dynamically based on group membership
host_common_packages_extra: >-
  {{
    ['python3-pip', 'podman', 'podman-docker', 'buildah', 'skopeo', 'git', 'vim', 'qemu-kvm', 'libvirt', 'virt-install', 'virt-manager', 'python3-libvirt', 'make', 'jq', 'cockpit']
    if 'bastions' in group_names else
    ['podman', 'skopeo']
    if 'registries' in group_names else
    []
  }}

# -------------------------------------------------
# Asset Injector - SSH config for bastion user
# -------------------------------------------------
bastion_asset_injector_assets:
  - description: Create SSH config for lab-user to easily SSH to nodes
    type: blockinfile
    path: /home/{{ bastion_student_user_name }}/.ssh/config
    owner: "{{ bastion_student_user_name }}"
    group: "{{ bastion_student_user_name }}"
    mode: "0600"
    block: |
      # SSH config for easy access to nodes
      Host registry
          User {{ ansible_user }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
    marker: "# {mark} ANSIBLE MANAGED - SSH CONFIG"
    create: true
    state: present
  - description: Allow insecure access to registry
    type: blockinfile
    path: /etc/containers/registries.conf.d/insecure-registry.conf
    owner: "root"
    group: "root"
    mode: "0644"
    block: |
      [[registry]]
      location = "registry:5000"
      insecure = true
    marker: "# {mark} ANSIBLE MANAGED - INSECURE REGISTRY"
    create: true
    state: present

asset_injector_assets: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names else
    []
  }}

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.edge_rhim_microshift
      type: git
      version: main
    - name: https://github.com/rhpds/showroom
      type: git
      version: main

# -------------------------------------------------------------------
# AgnosticV User Data to be displayed
# -------------------------------------------------------------------
agnosticv_importdata:
  openshift_cnv_ssh_address: "{{ openshift_cnv_ssh_address }}"
  bastion_public_hostname: "{{ bastion_public_hostname }}"
  bastion_url: "https://{{ bastion_public_hostname }}"
  bastion_ssh_user_name: "{{ bastion_student_user_name }}"
  bastion_ssh_password: "{{ bastion_student_user_password }}"
  registry_hostname: "registry"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - host_satellite_repositories
    - host_common_packages

software_workloads:
  bastions:
    - agnosticd.cloud_vm_workloads.control_user
    - bastion
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  nodes:
    - agnosticd.cloud_vm_workloads.control_user

post_software_workloads:
  bastions:
    - agnosticd.cloud_vm_workloads.asset_injector
    - rhpds.edge_rhim_microshift.registry
    - rhpds.edge_rhim_microshift.bastion

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions:
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/edge-applicances-rhim-microshift-showroom.git
showroom_git_ref: main
# Setting TLS provider to none and tls_termination for bastion route to edge
showroom_tls_provider: none

showroom_tab_services:
  - "single_terminal"
showroom_ttys_enable_tmux: true

showroom_ssh_method: password

showroom_ssh_host: "host.containers.internal"
showroom_ssh_username: "{{ bastion_student_user_name }}"
showroom_ssh_password: "{{ common_password }}"
showroom_ssh_port: 22

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 878BC126-15A9-4EF1-A72C-9579F6B7FCF5
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com
    sme:
      - name: Arthur de Oliveira
        email: aoliveira@redhat.com
      - name: Hrushabh Sirsulwar
        email: hsirsulwa@redhat.com
  anarchy:
    namespace: babylon-anarchy-5
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Building & Managing Self-contained Edge Appliances with Red Hat Image Mode and MicroShift (CNV)"
    category: Brand_Events
    workshopLabUiRedirect: true
    reportingLabels:
      primaryBU: RHEL
    keywords:
      - bootc
      - lb1353
      - rh1-2026
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
