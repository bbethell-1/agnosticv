---
# -------------------------------------------------------------------
# --- Catalog Item: Red Hat OpenShift Container Platform 5
#                   Cluster (CNV)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# Keep disabled for now until we validate that it works
# #include /includes/secrets/ocp4_workload_ols_api_token.yaml

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
tag: main

config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

num_users: "{{ 0 if not (create_multi_user | default(false)) else num_users_param | default(1) }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # AI Workloads (for OpenShift Lightspeed)
  # - name: https://github.com/rhpds/ai_workloads.git
  #   type: git
  #   version: "{{ tag }}"

# ===================================================================
# Autoscaling cluster
# ===================================================================
openshift_cnv_scale_cluster: "{{ false if cluster_size == 'sno' else true }}"
worker_instance_count: "{{ 0 if cluster_size == 'sno' else worker_instance_count_param }}"
ai_workers_cores: "{{ ai_workers_cores }}"
ai_workers_memory: "{{ ai_workers_memory }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
# Currently OLS is disabled, leaving this for reference when the role
# is updated to support OCP5
# workloads: >-
#   {{
#     ['agnosticd.core_workloads.ocp4_workload_authentication'] +
#     (
#       ['agnosticd.ai_workloads.ocp4_workload_ols']
#       if (enable_ols | default(false) | bool)
#       else []
#     )
  # }}
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# ===================================================================
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_multiuser: true
ocp4_workload_authentication_keycloak_channel: stable-v26.6

# Temporarily pin 4.22 Snapshots until everything is in the 5.0 catalogs
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_authentication_keycloak_catalogsource_tag: v4.22_2026_08_03

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols (OpenShift Lightspeed)
# -------------------------------------------------------------------
# Use Azure AI as the backend for OpenShift Lightspeed
ocp4_workload_ai_platform: azure
# Automatically create and manage Azure AI tokens
ocp4_workload_ols_get_token: true
# Grant lightspeed-operator-query-access to non-admin users
ocp4_workload_ols_auth_provider: keycloak
ocp4_workload_ols_keycloak_namespace: keycloak
ocp4_workload_ols_keycloak_realm: sso
ocp4_workload_ols_admin_username: admin

# ===================================================================
# Workloads to remove on destroy
# ===================================================================
# Currently OLS is disabled, leaving this for reference when the role
# is updated to support OCP5
# remove_workloads: >-
#   {{
#     (
#       ['agnosticd.ai_workloads.ocp4_workload_ols']
#       if (enable_ols | default(false) | bool)
#       else []
#     )
#   }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4ae3e2f2-87ab-4015-9d20-78b0bfc52c78
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Container Platform 5 Cluster (CNV)
    category: Open_Environments
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    workshopUiDisabled: true
    multiuser: false
    workshop_user_mode: multi
    reportingLabels:
      primaryBU: Hybrid_Platforms
    num_users_parameter: num_users_param
    parameters:
    - name: cluster_size
      description: Single Node or Full Cluster
      formLabel: cluster_size
      required: true
      openAPIV3Schema:
        type: string
        default: 'sno'
        enum:
        - 'sno'
        - 'multinode'
      components:
      - name: all

    # - name: host_ocp4_installer_version
    #   description: OpenShift version to install
    #   formLabel: OpenShift Version
    #   required: false
    #   openAPIV3Schema:
    #     type: string
    #     default: 'latest'
    #     enum:
    #     - 'latest'
    #   annotation: demo.redhat.com/ocp-version
    #   variable: host_ocp4_installer_version
    #   components:
    #   - name: openshift_base

    - name: worker_instance_count_param
      description: OpenShift Worker count
      formLabel: OpenShift Worker count
      formHideCondition: >-
        cluster_size != 'multinode'
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 10
      components:
      - name: current

    - name: ai_workers_memory
      description: OpenShift Worker memory
      formLabel: OpenShift Worker memory
      formHideCondition: >-
        cluster_size != 'multinode'
      openAPIV3Schema:
        type: string
        default: 8Gi
        enum:
        - '8Gi'
        - '16Gi'
        - '32Gi'
        - '64Gi'
        - '128Gi'
        minimum: 8Gi
        maximum: 128Gi
      components:
      - name: current

    - name: ai_workers_cores
      description: OpenShift Worker CPU
      formLabel: OpenShift Worker CPU
      formHideCondition: >-
        cluster_size != 'multinode'
      openAPIV3Schema:
        type: integer
        default: 4
        enum:
        - 4
        - 8
        - 16
        - 32
        - 64
      components:
      - name: current

    - name: create_multi_user
      description: >-
        Optionally create multiple users on the cluster
      formLabel: Create users on cluster?
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: current

    - name: num_users_param
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      formHideCondition: create_multi_user == false
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 50
      components:
      - name: current

    # - name: enable_ols
    #   description: >-
    #     Optionally enable OpenShift Lightspeed
    #   formLabel: Enable OpenShift Lightspeed?
    #   openAPIV3Schema:
    #     default: false
    #     type: boolean
    #   components:
    #   - name: current

  components:
  - name: openshift_base
    display_name: OpenShift Container Platform 5 Cluster (CNV Pools)
    item: agd-v2/ocp5-cluster-cnv-pools
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace

  sandbox_api:
    actions:
      destroy:
        # Allow the ocp4_workload_ols remove_workload to run
        catch_all: false
