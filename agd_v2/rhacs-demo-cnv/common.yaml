---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.

#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Red Hat Advanced Cluster Security Demo (CNV)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/ocp4_workload_ols_api_token.yaml
# Satellite credentials to subscribe the RHEL VM in the lab.
#include /includes/secrets/demosat-smt-lb1161-wolfgang.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

num_users: 0

# ===================================================================
# End Mandatory Variables
# ===================================================================

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 3
worker_only: true
worker_drain_control_plane: false
ai_workers_cores: 16
ai_workers_memory: 32Gi

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # Demo Workloads
  - name: https://github.com/rhpds/demo_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.9

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_metallb
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_rhacs
- agnosticd.core_workloads.ocp4_workload_rhacm
- agnosticd.core_workloads.ocp4_workload_quay_operator
- agnosticd.ai_workloads.ocp4_workload_ols
- rhpds.demo_workloads.ocp4_workload_rhacs_demo
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: "{{ num_users }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_ipaddresspool_name: ip-addresspool
ocp4_workload_metallb_ipaddresspool_addresses:
- "10.10.10.200-10.10.10.210"

# Configure L2Advertisement
ocp4_workload_metallb_enable_l2advertisement: true
ocp4_workload_metallb_l2advertisement_ipaddresspool:
- ip-addresspool
ocp4_workload_metallb_l2advertisement_interface:
- br-ex

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_username }}, role:admin

ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.21
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: rhacs-4.10
ocp4_workload_rhacs_install_operator_namespace: rhacs-operator
ocp4_workload_rhacs_central_admin_password: "{{ common_admin_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_central_enable_console_plugin: true
ocp4_workload_rhacs_collector_config_enable: true
ocp4_workload_rhacs_enable_route_certs: true
ocp4_workload_rhacs_enable_vm_scanning: true
ocp4_workload_rhacs_install_roxctl: true
ocp4_workload_rhacs_enable_reencrypt_route: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.16
# Required for Catalog Items that will deploy hosted clusters to the local-cluster
# Enable Wildcards to allow access to HCP Hosted Clusters console, etc.
ocp4_workload_rhacm_enable_wildcards: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_quay_operator
# -------------------------------------------------------------------
ocp4_workload_quay_operator_channel: stable-3.17
ocp4_workload_quay_operator_registry_namespace: quay
ocp4_workload_quay_operator_registry_admin_password: "{{ common_admin_password }}"
ocp4_workload_quay_operator_registry_hostname: quay
ocp4_workload_quay_operator_registry_quay_overrides: true
ocp4_workload_quay_operator_registry_quay_overrides_env: true
ocp4_workload_quay_operator_registry_quay_overrides_resources: true

# -------------------------------------------------------------------
# Workload: agnosticd.ai_workloads.ocp4_workload_ols
# -------------------------------------------------------------------
# Create a child app and SP for this lab environment
# It is removed when the environment is destroyed
ocp4_workload_ols_get_token: true
ocp4_workload_ai_platform: azure

# -------------------------------------------------------------------
# Workload: rhpds.demo_workloads.ocp4_workload_demo_workloads
# -------------------------------------------------------------------
ocp4_workload_rhacs_demo_vm_name: rhel-webserver
ocp4_workload_rhacs_demo_vm_namespace: rhel-webserver
ocp4_workload_rhacs_demo_vm_datasource_name: rhel10
ocp4_workload_rhacs_demo_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_rhacs_demo_vm_user: rhel
ocp4_workload_rhacs_demo_vm_password: "{{ common_admin_password }}"
ocp4_workload_rhacs_demo_vm_ssh_pwauth: true
ocp4_workload_rhacs_demo_vm_disksize: 30Gi
ocp4_workload_rhacs_demo_vm_cpu_cores: 1
ocp4_workload_rhacs_demo_vm_cpu_sockets: 1
ocp4_workload_rhacs_demo_vm_cpu_threads: 1
ocp4_workload_rhacs_demo_vm_memory_guest: 2Gi
ocp4_workload_rhacs_demo_vm_init_script_url: https://raw.githubusercontent.com/rhpds/rhacs-demo/refs/heads/main/scripts/init-vm.sh
ocp4_workload_rhacs_demo_vm_satellite_url: "{{ set_repositories_satellite_url }}"
ocp4_workload_rhacs_demo_vm_satellite_org: "{{ set_repositories_satellite_org }}"
ocp4_workload_rhacs_demo_vm_satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/rhacs-demo
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_content_antora_playbook: default-site.yml

# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0d93666c-bf4b-43e1-9604-11c42b6d4adb

  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Michael Foster
      email: mfoster@redhat.com
    instructions:
    - name: Michael Foster
      email: mfoster@redhat.com

  catalog:
    display_name: "Red Hat Advanced Cluster Security Demo (CNV)"
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
    keywords:
    - rhacm
    - rhacs
    labels:
      Provider: RHDP

      Platform: OpenShift
      TDP1: Container_Management
      TDP2: Application_Platform
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-01
      pull: missing

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "4.20"
      ocp4_fips_enable: false
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # Needed for scaling cluster with workers
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
