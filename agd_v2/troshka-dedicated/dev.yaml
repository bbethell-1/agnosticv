---
requirements_content:
  collections:
    - name: https://github.com/agnosticd/namespaced_workloads.git
      type: git
      version: troshka-dev

# sandboxes list is overwrite-merged: stage files must restate the full entry
# (including quota) when overriding purpose.
__meta__:
  sandboxes:
    - kind: OcpSandbox
      alias: cluster
      namespace_suffix: troshka
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
        keycloak: "yes"
      quota:
        # Sized for max host (64 vCPU / 256Gi / 500Gi data + 50Gi root) plus
        # KubeVirt memory overhead (~100%) and Troshka stack (postgres, S4, backend, etc.).
        limits.cpu: "128"
        requests.cpu: "128"
        limits.memory: "768Gi"
        requests.memory: "768Gi"
        requests.storage: "3Ti"
