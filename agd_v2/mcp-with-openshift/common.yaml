---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Taking MCP Servers to Production on OpenShift
# --- Validation enabled by default
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking

#include /includes/secrets/ocp4_ai_offline_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
# Only scale for more than 3 users
openshift_cnv_scale_cluster: "{{ (num_users | int) > 3 }}"
ai_workers_cores: 16
ai_workers_memory: 32Gi
# One additional worker for each 5 users (only when scaling is enabled)
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 1] | max if (num_users | int) > 3 else 0 }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.0.0"

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # RHPDS MCP Workloads
  - name: https://github.com/rhpds/mcp_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.3.9

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.ai_workloads.ocp4_workload_toolhive
- rhpds.mcp_workloads.ocp4_workload_mcp_user
- agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_showroom
- rhpds.mcp_workloads.ocp4_workload_mcp_with_openshift_validation

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:10] }}"
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:16] }}"

# - deepseek-r1-distill-qwen-14b

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password}}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: false
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('2')) | int }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_repositories_list:
- name: mcp
  repo: https://github.com/rhpds/mcp-gitops
  private: false

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.4"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
# ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
# ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: mcpadmin
ocp4_workload_gitea_operator_admin_email: mcpadmin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password}}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_htpasswd_user_base }}%d"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.21

# Do not use a catalog snapshot - rely on the channel version
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_htpasswd_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[email,groups]'

# Application Controller
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

# Sync every 30 seconds to reduce wait times between updates
ocp4_workload_openshift_gitops_controller_app_sync: 30s

# Allow invidual users to see only their own Applications in the System ArgoCD console
ocp4_workload_openshift_gitops_per_user_access: true
ocp4_workload_openshift_gitops_user_count: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_openshift_gitops_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_openshift_gitops_user_project_prefix: "appproject-"
ocp4_workload_openshift_gitops_user_cluster_resource_whitelist:
- group: ""
  kind: Namespace
- group: rbac.authorization.k8s.io
  kind: ClusterRole
- group: rbac.authorization.k8s.io
  kind: ClusterRoleBinding

# Do not use a catalog snapshot - rely on the channel version
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_toolhive
# -------------------------------------------------------------------

# As of 2026/02/02
ocp4_workload_toolhive_helm_chart_crds: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds:0.0.106
ocp4_workload_toolhive_helm_chart_operator: oci://ghcr.io/stacklok/toolhive/toolhive-operator:0.5.28

ocp4_workload_toolhive_operator_image: ghcr.io/stacklok/toolhive/operator:v0.8.2-ubi
ocp4_workload_toolhive_runner_image: ghcr.io/stacklok/toolhive/proxyrunner:v0.8.2-ubi
ocp4_workload_toolhive_registry_api_image: ghcr.io/stacklok/thv-registry-api:v0.5.0-ubi

# -------------------------------------------------------------------
# Workload: ocp4_workload_mcp_user
# -------------------------------------------------------------------
ocp4_workload_mcp_user_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_mcp_user_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_mcp_user_app_project_prefix: "appproject-"

ocp4_workload_mcp_user_metrics_enable: true

ocp4_workload_mcp_user_openshift_image: quay.io/containers/kubernetes_mcp_server:v0.0.57
ocp4_workload_mcp_user_gitea_image: quay.io/rhpds/gitea-mcp-server:latest

ocp4_workload_mcp_user_gitea_external_url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
ocp4_workload_mcp_user_gitea_user_password: "{{ common_user_password }}"

ocp4_workload_mcp_user_librechat_password: "{{ common_user_password }}"
ocp4_workload_mcp_user_litemaas_url: "{{ litellm_api_base_url }}"
ocp4_workload_mcp_user_litemaas_keys: "{{ litellm_virtual_keys }}"
ocp4_workload_mcp_user_litemaas_models: "{{ litellm_available_models }}"
ocp4_workload_mcp_user_librechat_repo_tag: v0.8.2

# Model to configure for the agent
ocp4_workload_mcp_user_agent_model_name: "openai/qwen3-14b"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/lb1726-mcp-showroom
ocp4_workload_showroom_content_git_repo_ref: main
# Default antora playbook is default-site.yml, override here if needed
# ocp4_workload_showroom_content_antora_playbook: site.yml

# No terminals. Links are configured in ui-config.yaml in the showroom repo.
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_mcp_with_openshift_validation
# -------------------------------------------------------------------
ocp4_workload_mcp_with_openshift_validation_enabled: true
ocp4_workload_mcp_with_openshift_validation_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_mcp_with_openshift_validation_user_prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

litellm_api_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
litellm_virtual_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
litellm_available_models: "{{  maas_sandbox.credentials[0].available_models }}"
litellm_available_models_list: "{{ maas_sandbox.credentials[0].available_models | join(', ') }}"
litellm_key_duration: ""
litellm_virtual_keys: "{{ maas_sandbox.credentials | map(attribute='virtual_key') | list }}"
userdata: >-
  {
  {% for i in range(0,num_users) %}
  "user{{i+1}}": {
     litellm_api_endpoint: "{{ maas_sandbox.credentials[i].api_endpoint  }}",
     litellm_api_base_url: "{{ maas_sandbox.credentials[i].api_endpoint  }}/v1",
     litellm_virtual_key: "{{ maas_sandbox.credentials[i].virtual_key }}",
     litellm_key_alias: "{{ maas_sandbox.credentials[i].key_alias }}",
     litellm_key_id: "{{  maas_sandbox.credentials[i].key_id }}",
     litellm_user_email: "user{{ i }}@example.com",
     litellm_available_models: "{{  maas_sandbox.credentials[i].available_models }}",
     litellm_available_models_list: "{{ maas_sandbox.credentials[i].available_models | join(', ') }}",
     litellm_key_duration: ""
    },
  {% endfor %}
  }
litellm_passthrough_user_data:
  litellm_api_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
  litellm_virtual_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
  litellm_available_models: "{{  maas_sandbox.credentials[0].available_models }}"
  litellm_available_models_list: "{{ maas_sandbox.credentials[0].available_models | join(', ') }}"
  litellm_virtual_keys: "{{ maas_sandbox.credentials | map(attribute='virtual_key') | list }}"
  litellm_key_duration: ""

agnosticd_passthrough_user_data: |
  {{ litellm_passthrough_user_data
   | combine( {
     "users": userdata | from_yaml })
  }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
  - kind: MaaSSandbox
    cloud_selector:
      purpose: production
    virtual_key_count: "{{ job_vars.num_users }}"
    models: "qwen3-14b,llama-scout-17b"
    var: maas_sandbox
  asset_uuid: 6bad7495-f02e-4a71-9bed-5b232a12d5b5
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    - name: Tony Kay
      email: ankay@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Taking MCP Servers to Production on OpenShift AI with the Red Hat MCP Registry (CNV)"
    category: Brand_Events
    keywords:
    - sovereign
    - sre
    - rh1-2026
    - lb1726
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
      Platform: AI
      TDP1: AI_Platform
      TDP2: Application_Platform
    multiuser: true
    reportingLabels:
      primaryBU: Artificial_Intelligence
      secondaryBU: Hybrid_Platforms
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 40
    workshopLabUiRedirect: true
    workshop_user_mode: multi

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "4.20"
      ocp4_fips_enable: false
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # Needed for scaling cluster with workers
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
