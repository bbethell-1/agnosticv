---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI Workloads
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # RHPDS MCP Workloads
  - name: https://github.com/rhpds/mcp_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.3.4

workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.ai_workloads.ocp4_workload_toolhive
- rhpds.mcp_workloads.ocp4_workload_mcp_user
- agnosticd.showroom.ocp4_workload_showroom

# For development, we don't need to scale the cluster - stick with 3-node compact cluster
openshift_cnv_scale_cluster: false
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 1] | max }}"

# Current latest version (2025/12/04)
ocp4_workload_toolhive_helm_chart_crds: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds:0.0.74
ocp4_workload_toolhive_helm_chart_operator: oci://ghcr.io/stacklok/toolhive/toolhive-operator:0.5.8
# ocp4_workload_toolhive_operator_image: ghcr.io/stacklok/toolhive/operator:latest-ubi
# ocp4_workload_toolhive_runner_image: ghcr.io/stacklok/toolhive/proxyrunner:latest-ubi
# ocp4_workload_toolhive_registry_api_image: ghcr.io/stacklok/thv-registry-api:latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/lb1726-mcp-showroom
ocp4_workload_showroom_content_git_repo_ref: main
# Default antora playbook is default-site.yml, override here if needed
# ocp4_workload_showroom_content_antora_playbook: site.yml
# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main

  catalog:
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 3
