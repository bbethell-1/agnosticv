---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
# For development, we don't need to scale the cluster - stick with 3-node compact cluster
openshift_cnv_scale_cluster: false
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 1] | max }}"

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_app_sync: 30s
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_htpasswd_admin_user }}, role:admin

# -------------------------------------------------------------------
# ocp4_workload_toolhive
# -------------------------------------------------------------------
# Current latest version (2025/12/09)
ocp4_workload_toolhive_helm_chart_crds: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds:0.0.77
ocp4_workload_toolhive_helm_chart_operator: oci://ghcr.io/stacklok/toolhive/toolhive-operator:0.5.9
ocp4_workload_toolhive_operator_image: ghcr.io/stacklok/toolhive/operator:latest-ubi
ocp4_workload_toolhive_runner_image: ghcr.io/stacklok/toolhive/proxyrunner:latest-ubi
ocp4_workload_toolhive_registry_api_image: ghcr.io/stacklok/thv-registry-api:latest

ocp4_workload_mcp_user_metrics_enable: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main

  catalog:
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 3
