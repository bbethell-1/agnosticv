---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
ai_workers_cores: 16
ai_workers_memory: 64Gi
worker_instance_count: "{{[(num_users | int / 3) | round(0, 'ceil') | int, 3] | max }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI Workloads
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # RHPDS MCP Workloads
  - name: https://github.com/rhpds/mcp_workloads.git
    type: git
    version: "{{ tag }}"

host_ocp4_installer_set_user_data_kubeadmin_password: false

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.ai_workloads.ocp4_workload_toolhive
- rhpds.mcp_workloads.ocp4_workload_mcp_user

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_gitea_operator_gitea_image_tag: "1.25.2"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.20
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_toolhive
# -------------------------------------------------------------------
ocp4_workload_toolhive_helm_chart_crds: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds:0.0.63
ocp4_workload_toolhive_helm_chart_operator: oci://ghcr.io/stacklok/toolhive/toolhive-operator:0.5.3
# ocp4_workload_toolhive_helm_chart_crds: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds:0.0.56
# ocp4_workload_toolhive_helm_chart_operator: oci://ghcr.io/stacklok/toolhive/toolhive-operator:0.5.1

ocp4_workload_toolhive_operator_image: ghcr.io/stacklok/toolhive/operator:latest-ubi
# ocp4_workload_toolhive_operator_image: ghcr.io/stacklok/toolhive/operator:v0.6.7-ubi
# ocp4_workload_toolhive_operator_image: ghcr.io/stacklok/toolhive/operator:v0.3.8
ocp4_workload_toolhive_runner_image: ghcr.io/stacklok/toolhive/proxyrunner:latest-ubi
# ocp4_workload_toolhive_runner_image: ghcr.io/stacklok/toolhive/proxyrunner:v0.6.7-ubi
# ocp4_workload_toolhive_runner_image: ghcr.io/stacklok/toolhive/proxyrunner:v0.3.8
ocp4_workload_toolhive_registry_api_image: ghcr.io/stacklok/thv-registry-api:latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_mcp_user
# -------------------------------------------------------------------
ocp4_workload_mcp_gitea_external_url: "https://gitea.{{ openshift_cluster_ingress_domain }}"

ocp4_workload_mcp_user: user1
ocp4_workload_mcp_gitea_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  catalog:
    multiuser: true
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 40
  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # Needed for scaling cluster with workers
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
