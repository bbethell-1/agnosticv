---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift GitOps Sample (CNV) TENANT
# -------------------------------------------------------------------
# This is a sample environment to get you started with OpenShift GitOps
# Example of:
# - using OCPSandbox to find the proper cluster
# - using the gitops_bootstrap workload
# - targetting a gitops bootstrap repo path with application_name: 'bootstrap-tenant'
# - providing helm values to the gitops bootstrap repo to:
#   - deploy multiple OAuthAccount users
#   - create workspaces (namespaces)
#     for them by coordinating use of "{{ num_users }}" in the
#     authentication worklaod and the gitops_bootstrap workload.
#   - deploy a sample app (loadtester) as a Deployment

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/sandbox-api.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
  - default:
      api_url: "{{ sandbox_user.sandbox_openshift_api_url }}" # was openshift_api_url
      api_token: "{{ sandbox_user.cluster_admin_agnosticd_sa_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    # Required by host_ocp4_assisted_scale
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ci-template-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_repo_path: "tenant/bootstrap"
ocp4_workload_gitops_bootstrap_application_project: tenants

ocp4_workload_gitops_bootstrap_helm_values:
  # For reference: The `deployer` variables are defined by the gitops_boostrap workload
  # deployer:
  #   domain: "{{ lookup('agnosticd_user_data', 'openshift_cluster_ingress_domain') }}"
  #   apiUrl: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
  tenant:
    name: "{{ guid }}"
    user:
      prefix: user
      count: "{{ user_count }}"
      names: []
      password: openshift

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 04c6ae0b-1da0-4960-be36-5ea74315397b
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: workshop
      cloud_selector:
        cloud: cnv-dedicated-shared
        demo: gitops-example
      var: sandbox_user
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
  # put OCPSandbox configuration here
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      OpenShift GitOps Example - TENANT
    category: Open_Environments
    keywords:
      - openshift
      - gitops
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Featured_Score: "71"
    parameters:
      - name: user_count
        description: >-
          Number of users to provision within this tenant.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 50
