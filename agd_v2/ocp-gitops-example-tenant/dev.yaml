---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main
    # - name: https://github.com/rhpds/showroom.git
    #   type: git
    #   version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  # - agnosticd.showroom.ocp4_workload_showroom_ocp_integration
  # - agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_showroom_ocp_integration
# -------------------------------------------------------------------
ocp4_workload_showroom_ocp_integration_openshift_api_url: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
ocp4_workload_showroom_ocp_integration_openshift_api_token: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_token') }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp4-cnv-gitops-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "^2.0.0"
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
