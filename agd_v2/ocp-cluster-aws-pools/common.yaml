---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift Container Platform Cluster (AWS) - AgdV2
# -------------------------------------------------------------------

# ---------------------------------------------------------------------
# AgnosticV includes
# --------------------------------------------------------------------
#include /includes/access-restriction-admins-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/host_ocp4_installer_fips_enable.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-3.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
tag: main

cloud_provider: aws
cloud_provider_version: "{{ tag }}"
config: openshift-cluster

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# Bastion VM Settings
# -------------------------------------------------------------------
bastion_setup_student_user: true
bastion_student_user_name: lab-user

host_common_packages_update_all: false

bastion_instance_image: RHEL96GOLD-latest

# -------------------------------------------------------------------
# OpenShift Settings
# -------------------------------------------------------------------
# OpenShift version set from parameter. Map old variable to new variable.
# host_ocp4_installer_version: "4.19"
host_ocp4_installer_info_set_user_data_kubeadmin_password: true
openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

# -------------------------------------------------------------------
# Cluster sizing based on selected size (sno/multinode)
# -------------------------------------------------------------------
# SNO: 1 control plane node only
# Multinode: 3 control plane (compact)
control_plane_instance_count: "{{ 1 if cluster_size == 'sno' else 3 }}"
worker_instance_count: 0

# Control plane configuration
control_plane_instance_type_family: m5a
#TODO Make this more flexible for sizes of non-sno clusters
control_plane_instance_type: "{{ 'm6a.8xlarge' if cluster_size == 'sno' else 'm6a.4xlarge' }}"
control_plane_storage_type: "{{ 'io1' if cluster_size == 'sno' else 'gp3' }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Workloads to deploy on the cluster (YAML List)
workloads:
- agnosticd.core_workloads.ocp4_workload_cert_manager

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1

ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: fb78d710-3ef4-41aa-8d84-f30ea0c88c6a
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Container Platform Cluster (AWS-Pools)
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Container_Management
      TDP2: Application_Platform
    multiuser: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: cluster_size
      description: >-
        Cluster size configuration that determines the number of control plane and worker nodes.
      formLabel: Cluster Size
      openAPIV3Schema:
        type: string
        default: 'sno'
        enum:
        - 'sno'
        - 'multinode'

    - name: host_ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.21'
        enum:
        - '4.18'
        - '4.20'
        - '4.21'
        - '4.22'
      annotation: demo.redhat.com/ocp-version
      variable: host_ocp4_installer_version
    workshopUiDisabled: true
