---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: Red Hat OpenShift Container Platform
#                   Cluster (CNV Pools)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
# Regular users should never be able to order this directly
#include /includes/access-restriction-admins-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml

#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: openshift-cluster

# Required to scale up the cluster
openshift_cnv_set_sandbox_provision_data: true

# Default cluster size for sandbox validation (overridden by catalog parameter)
cluster_size: "{{ cluster_size | default('sno') }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    # Assisted Installer Collection
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9

    # Core OpenShift Workloads
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user
host_common_packages_extra:
  - podman

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
# Version from parameter
# host_ocp4_installer_version: "4.19"
host_ocp4_deploy_installation_method: openshift_assisted

# Save kubeadmin password in user data - only necessary if
# no authentication is set up for the cluster
host_ocp4_installer_set_user_data_kubeadmin_password: true

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 1500

ai_machineconfigs:
  - apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: worker
      name: 99-openshift-machineconfig-worker-psi-karg
    spec:
      kernelArguments:
        - psi=1
  - apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: master
      name: 99-openshift-machineconfig-master-psi-karg
    spec:
      kernelArguments:
        - psi=1

# -------------------------------------------------------------------
# Cluster sizing based on selected size (sno/multinode)
# -------------------------------------------------------------------
# SNO: 1 control plane node only
# Multinode: 3 control plane (compact)
control_plane_instance_count: "{{ 1 if cluster_size == 'sno' else 3 }}"
worker_instance_count: 0

# Control plane configuration
ai_control_plane_cores: "{{ '32' if cluster_size == 'sno' else '16' }}"
ai_control_plane_memory: "{{ '128Gi' if cluster_size == 'sno' else '64Gi' }}"

# Worker node configuration (only for multinode)
# ai_workers_cores: ""
# ai_workers_memory: ""

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_external_odf
  - agnosticd.core_workloads.ocp4_workload_cert_manager

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: >-
  {{
    {
      '4.18': 'stable-4.18',
      '4.19': 'stable-4.18',
      '4.20': 'stable-4.20',
      '4.21': 'stable-4.21'
    }.get(host_ocp4_installer_version, 'stable-' + host_ocp4_installer_version)
  }}

ocp4_workload_external_odf_operator_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 7aba3d69-44b9-4b60-ab08-3ef175c3ebea
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
  anarchy:
    namespace: babylon-anarchy-2
  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Red Hat OpenShift Container Platform Cluster (CNV Virt Labs Pools - ocpv01)"
    category: Workshops
    keywords:
      - workshop
      - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
      - name: cluster_size
        description: >-
          Cluster size configuration that determines the number of control plane and worker nodes.
        formLabel: Cluster Size
        openAPIV3Schema:
          type: string
          default: sno
          enum:
            - sno
            - multinode
      - name: host_ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: "4.21"
          enum:
            - "4.18"
            - "4.19"
            - "4.20"
            - "4.21"
        annotation: demo.redhat.com/ocp-version
        variable: host_ocp4_installer_version
  sandboxes:
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv01
        virt: "yes"
      quota:
        pods: "100"
        requests.storage: "20000Gi"
        limits.cpu: "999"
        requests.cpu: "999"
        limits.memory: 3000Gi
        requests.memory: 3000Gi
