---
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: main
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.1

# -------------------------------------------------------------------
# Workload: ocp4_workload_osac
# -------------------------------------------------------------------
ocp4_workload_osac_ui_image_tag: main
ocp4_workload_osac_cli_version: v0.0.89

ocp4_workload_osac_lvms_enabled: "{{ deploy_lvms | bool }}"
# Disks to use for LVMS deviceSelector. Empty = use all available disks.
ocp4_workload_osac_lvms_disks:
- /dev/vdb
- /dev/vdc

_ai_workers_extra_disks:
- metadata:
    name: sdb-INSTANCENAME
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: 2048Gi
- metadata:
    name: sdc-INSTANCENAME
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: 2048Gi

# Don't deploy extra disks if LVMS is not enabled
ai_workers_extra_disks: "{{ _ai_workers_extra_disks if deploy_lvms | bool else [] }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: deploy_lvms
      description: >-
        Deploy the LVM Storage Operator and use it for OSAC.
      formLabel: Deploy LVM Storage Operator
      openAPIV3Schema:
        type: boolean
        default: true
