---
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: main
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.2

_ai_workers_extra_disks:
- metadata:
    name: sdb-INSTANCENAME
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: 2048Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_osac
# -------------------------------------------------------------------
ocp4_workload_osac_cli_release_url: https://github.com/osac-project/osac/releases/download
ocp4_workload_osac_cli_version: v0.0.93
ocp4_workload_osac_repo_version: "osac/v0.0.9-nightly.20260831.8596caf.58.1"

# OSAC UI image tag (empty = use version from the repo)
ocp4_workload_osac_ui_image_tag: ""
# ocp4_workload_osac_ui_image_tag: main

ocp4_workload_osac_lvms_enabled: true
# Disks to use for LVMS deviceSelector. Empty = use all available disks.
ocp4_workload_osac_lvms_disks:
- /dev/vdb

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
