---
# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: Open Sovereign AI cloud
# -------------------------------------------------------------------
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
# github.com/rhpds/cloud_provider_openshift_cnv -- pinned via cloud_provider_version in prod.yaml
# (uses its own 1.x.x versioning, not the ocp-cnv-pool-x.x.x scheme)
cloud_provider_version: "{{ tag }}"
config: openshift-cluster

# Default cluster size for sandbox validation (overridden by catalog parameter)
cluster_size: "{{ cluster_size | default('sno') }}"

# Set num_users
num_users: 1

# ===================================================================
# End Mandatory Variables
# ===================================================================

control_plane_instance_count: 3

# Control plane configuration
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

worker_instance_count: 5

ai_workers_cores: 64
ai_workers_sockets: 2
ai_workers_memory: 128Gi
ai_workers_root_disk_size: 512Gi
ai_workers_extra_disks:
- metadata:
    name: "sdb"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "2048Gi"
- metadata:
    name: "sdc"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "2048Gi"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # Sovereign Cloud Workloads
  # - name: https://github.com/rhpds/sovereign_cloud.git
  #   type: git
  #   version: "{{ tag }}"
  # Showroom
  # - name: https://github.com/rhpds/showroom.git
  #   type: git
  #   version: v1.6.11

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_installer_version: "4.20"
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 8900

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}

# These need to be set in the pooled base catalog item
# ai_service_network_cidr: "172.231.0.0/16"
# ai_cluster_network_cidr: "10.232.0.0/14"
# ai_network_mtu: 8900

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_metallb
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_rhacm

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: >-
  {{
    {
      '4.20': 'stable-4.20',
      '4.21': 'stable-4.21',
      '4.22': 'stable-4.21'
    }.get(host_ocp4_installer_version, 'stable-' + host_ocp4_installer_version)
  }}
ocp4_workload_external_odf_backingstore_custom_resources: true
ocp4_workload_external_odf_operator_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_cloud_provider: aws

# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:
ocp4_workload_cert_manager_aws_region: us-east-2
ocp4_workload_cert_manager_aws_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_aws_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.6
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false
ocp4_workload_openshift_virtualization_install_virtctl: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_ipaddresspool_name: ip-addresspool
ocp4_workload_metallb_ipaddresspool_addresses:
- "10.10.10.200-10.10.10.210"

# Configure L2Advertisement
ocp4_workload_metallb_enable_l2advertisement: true
ocp4_workload_metallb_l2advertisement_ipaddresspool:
- ip-addresspool
ocp4_workload_metallb_l2advertisement_interface:
- br-ex

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[email,groups]'

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.17
# Required for Catalog Items that will deploy hosted clusters to the local-cluster
# Enable Wildcards to allow access to HCP Hosted Clusters console, etc.
ocp4_workload_rhacm_enable_wildcards: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e0d621a7-2f81-406e-a9f7-8416a0e1591f

  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Souvik Das
      email: souvdas@redhat.com
    instructions:
    - name: Souvik Das
      email: souvdas@redhat.com

  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    display_name: "Open Sovereign AI cloud"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    reportingLabels:
      primaryBU: Hybrid_Platforms
    keywords:
    - osac
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false

  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      # purpose: prod
      name: ocpv01
      virt: "yes"
    quota:
      requests.storage: "14000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2500Gi
      requests.memory: 2500Gi

# We need the following:
# Control Plane:
#   3x16 cores, 32Gi memory, 100Gi root disk
#   =: 48 cores, 96Gi memory
# Worker:
#   5x64 cores, 128Gi memory
#   5x512Gi root disk
#   5x2048Gi extra disk
#   =: 320 cores, 640Gi memory
#   Root Disk: 5x512Gi=2560Gi
#   Extra Disk: 5x2048Gi=10240Gi
#   All Disks: 2560Gi+10240Gi=12800Gi
#   Safety for Control Plane Disks: 3x256Gi=768Gi
#   Total Storage: 12800Gi+768Gi=13568Gi
