---
# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: Open Sovereign AI cloud
# -------------------------------------------------------------------
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
# github.com/rhpds/cloud_provider_openshift_cnv -- pinned via cloud_provider_version in prod.yaml
# (uses its own 1.x.x versioning, not the ocp-cnv-pool-x.x.x scheme)
cloud_provider_version: "{{ tag }}"
config: openshift-cluster

# Set num_users
num_users: 1

# ===================================================================
# End Mandatory Variables
# ===================================================================

control_plane_instance_count: 3

# Control plane configuration
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

worker_instance_count: "{{ num_workers | int }}"

ai_workers_cores: 64
ai_workers_sockets: 2
ai_workers_memory: 128Gi
ai_workers_root_disk_size: 512Gi
ai_workers_extra_disks:
- metadata:
    name: "sdb"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "2048Gi"
- metadata:
    name: "sdc"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "2048Gi"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # - name: https://github.com/rhpds/sovereign_cloud.git
  #   type: git
  #   version: "{{ tag }}"

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_installer_version: "4.22"
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 8900

networks:
- name: cluster

ai_install_use_network: "cluster{{ guid }}"
bastion_extra_networks:
- "cluster"

bastion_userdata: |
  #cloud-config
  write_files:
    - path: /etc/sysctl.d/99-ip-forwarding.conf
      content: |
        net.ipv4.ip_forward=1

    - path: /etc/nftables/ruleset.nft
      content: |
        table inet nat {
          chain postrouting {
            type nat hook postrouting priority 100; policy accept;
            oifname "eth0" masquerade
          }
        }

        table inet filter {
          chain forward {
            type filter hook forward priority 0; policy drop;
            iifname "eth1" oifname "eth0" accept
            iifname "eth0" oifname "eth1" ct state related,established accept
          }
        }

    - path: /etc/systemd/system/nftables-restore.service
      content: |
        [Unit]
        Description=Restore nftables rules
        After=network.target

        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c 'while [ ! -x /usr/sbin/nft ]; do sleep 2; done; /usr/sbin/nft -f /etc/nftables/ruleset.nft'
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target

  runcmd:
    - sysctl --system
    - systemctl daemon-reload
    - systemctl enable --now nftables-restore.service

bastion_networkdata: |
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: yes
      eth1:
        dhcp4: no
        addresses:
          - 10.10.10.1/24

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}

# These need to be set in the pooled base catalog item
# ai_service_network_cidr: "172.231.0.0/16"
# ai_cluster_network_cidr: "10.232.0.0/14"
# ai_network_mtu: 8900

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_cert_manager
# - rhpds.sovereign_cloud.ocp4_workload_osac

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: >-
  {{
    {
      '4.20': 'stable-4.20',
      '4.21': 'stable-4.21',
      '4.22': 'stable-4.22'
    }.get(host_ocp4_installer_version, 'stable-' + host_ocp4_installer_version)
  }}
ocp4_workload_external_odf_backingstore_custom_resources: true
ocp4_workload_external_odf_operator_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_osac
# -------------------------------------------------------------------
ocp4_workload_osac_namespace: osac-demo
ocp4_workload_osac_installer_repo: https://github.com/osac-project/osac-installer.git
ocp4_workload_osac_installer_version: main
ocp4_workload_osac_helm_mirror: https://mirror.openshift.com/pub/openshift-v4/clients
ocp4_workload_osac_openshift_version: "4.22"
ocp4_workload_osac_rhcos_version: "9.8.20260428-0"
ocp4_workload_osac_operator_image: ghcr.io/osac-project/osac-operator:latest
ocp4_workload_osac_fulfillment_service_image: ghcr.io/osac-project/fulfillment-service:latest
ocp4_workload_osac_envoy_image: ghcr.io/osac-project/envoy:v1.33.0
ocp4_workload_osac_ui_image: ghcr.io/osac-project/osac-ui:latest
ocp4_workload_osac_aap_bootstrap_image: ghcr.io/osac-project/osac-aap:latest
ocp4_workload_osac_cluster_versions:
- version: "4.20.0"
  image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"
- version: "4.22.0"
  image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
  default: true
# From vaulted secret
# ocp4_workload_osac_aap_license: ""

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e0d621a7-2f81-406e-a9f7-8416a0e1591f

  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Souvik Das
      email: souvdas@redhat.com
    instructions:
    - name: Souvik Das
      email: souvdas@redhat.com

  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    display_name: "Open Sovereign AI cloud"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    reportingLabels:
      primaryBU: Hybrid_Platforms
    keywords:
    - osac
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none
    parameters:
    - name: num_workers
      description: >-
        Number of worker nodes to provision within the environment.
      formLabel: Number of Worker Nodes
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 5

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false

  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      # purpose: prod
      name: ocpv01
      virt: "yes"
    quota:
      requests.storage: "14000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2500Gi
      requests.memory: 2500Gi

# We need the following:
# Control Plane:
#   3x16 cores, 32Gi memory, 100Gi root disk
#   =: 48 cores, 96Gi memory
# Worker:
#   5x64 cores, 128Gi memory
#   5x512Gi root disk
#   5x2048Gi extra disk
#   =: 320 cores, 640Gi memory
#   Root Disk: 5x512Gi=2560Gi
#   Extra Disk: 5x2048Gi=10240Gi
#   All Disks: 2560Gi+10240Gi=12800Gi
#   Safety for Control Plane Disks: 3x256Gi=768Gi
#   Total Storage: 12800Gi+768Gi=13568Gi
