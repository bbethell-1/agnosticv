---
# -------------------------------------------------------------------
# --- Catalog Item: Red Hat cloud extensions
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
# Restrict base CI to RHDP devs only
# Order via published CI: published/rh-cloud-extensions
#include /includes/access-restriction-devs-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: "{{ tag }}"
config: openshift-cluster
# ===================================================================
# End Mandatory Variables
# ===================================================================

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: "{{ tag }}"
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.2

# -------------------------------------------------------------------
# Common Passwords
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Network settings
# -------------------------------------------------------------------
networks:
- name: cluster
- name: untagged

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# Make sure the VMs have podman and virsh installed
host_common_packages_extra:
- podman
- libvirt-client

bastion_extra_networks:
- cluster

bastion_userdata: |
  #cloud-config
  write_files:
    - path: /etc/sysctl.d/99-ip-forwarding.conf
      content: |
        net.ipv4.ip_forward=1

    - path: /etc/nftables/ruleset.nft
      content: |
        table inet nat {
          chain postrouting {
            type nat hook postrouting priority 100; policy accept;
            oifname "eth0" masquerade
          }
        }

        table inet filter {
          chain forward {
            type filter hook forward priority 0; policy drop;
            iifname "eth1" oifname "eth0" accept
            iifname "eth0" oifname "eth1" ct state related,established accept
          }
        }

    - path: /etc/systemd/system/nftables-restore.service
      content: |
        [Unit]
        Description=Restore nftables rules
        After=network.target

        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c 'while [ ! -x /usr/sbin/nft ]; do sleep 2; done; /usr/sbin/nft -f /etc/nftables/ruleset.nft'
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target

  runcmd:
    - sysctl --system
    - systemctl daemon-reload
    - systemctl enable --now nftables-restore.service

bastion_networkdata: |
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: yes
      eth1:
        dhcp4: no
        addresses:
          - 10.10.10.1/24

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
host_ocp4_deploy_installation_method: openshift_assisted
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_installer_version: "4.22"

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"

ai_install_use_network: "cluster{{ guid }}"

ai_attach_workers_networks:
- untagged

# -------------------------------------------------------------------
# Cluster sizing
# -------------------------------------------------------------------

# Resource requirements (max 5 workers):
#
# CPU (cores x sockets = vCPUs per pod):
#   Bastion:       1x  2 cores x 1 socket  =    2 vCPUs
#   Control Plane: 3x 16 cores x 1 socket  =   48 vCPUs
#   Workers:       5x 64 cores x 2 sockets =  640 vCPUs
#   Total CPU:                                 690 vCPUs
#
# Memory (guest + ~2x KubeVirt pod overhead):
#   Bastion:       1x   2Gi guest ~    4Gi pod
#   Control Plane: 3x  32Gi guest ~  198Gi pod
#   Workers:       5x 128Gi guest ~ 1293Gi pod (~258Gi each)
#   Total Memory:                  ~ 1495Gi
#
# Storage:
#   Bastion:          1x  30Gi                =   30Gi
#   Control Plane:    3x 256Gi (root+cdrom)   =  768Gi
#   Workers root:     5x 512Gi               = 2560Gi
#   Workers extra:    5x1024Gi               = 5120Gi
#   Workers cdroms:   5x   1Gi               =    5Gi
#   Installation ISO:    ~  1Gi               =    1Gi
#   Total Storage:                            ~ 8484Gi

# Control plane configuration
control_plane_instance_count: 3
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

# Worker node configuration
worker_instance_count: "{{ num_workers | int }}"

ai_workers_cores: 64
ai_workers_sockets: 2
ai_workers_memory: 128Gi
ai_workers_root_disk_size: 512Gi

ai_workers_extra_disks:
- metadata:
    name: sdb-INSTANCENAME
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: 1024Gi

# Wait for workers to be ready. Necessary for big worker nodes with big Datavolumes
# 40 retries at 15 seconds went down to 0 before succeeding. Adding margin of error.
ai_workers_wait_retries: 50
ai_workers_wait_delay: 15

# ===================================================================
# Workloads
# ===================================================================
workloads: >-
  {{
    [
      'agnosticd.core_workloads.ocp4_workload_external_odf',
      'agnosticd.core_workloads.ocp4_workload_cert_manager',
      'agnosticd.core_workloads.ocp4_workload_authentication',
      'agnosticd.core_workloads.ocp4_workload_nmstate'
    ] +
    (
      [
        'rhpds.sovereign_cloud.ocp4_workload_osac',
        'agnosticd.showroom.ocp4_workload_ocp_console_embed',
        'agnosticd.showroom.ocp4_workload_showroom'
      ]
      if deploy_osac | default(false) | bool
      else []
    )
  }}

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: stable-4.22
ocp4_workload_external_odf_backingstore_custom_resources: true
ocp4_workload_external_odf_operator_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: htpasswd
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_nmstate
# -------------------------------------------------------------------
ocp4_workload_nmstate_channel: stable
ocp4_workload_nmstate_configure_nncp: true
ocp4_workload_nmstate_nncp_bridge_name: br-untagged
ocp4_workload_nmstate_nncp_interface_name: enp3s0
ocp4_workload_nmstate_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_osac
# -------------------------------------------------------------------ocp4_workload_osac_cli_version: v0.0.90
ocp4_workload_osac_helm_mirror: https://mirror.openshift.com/pub/openshift-v4/clients
ocp4_workload_osac_helm_version: "3.21.2"

# Releases are specified in dev.yaml and prod.yaml
ocp4_workload_osac_repo: https://github.com/osac-project/osac.git
ocp4_workload_osac_installer_directory: osac/osac-installer

# OSAC namespace
ocp4_workload_osac_namespace: osac
# Profile to use. Available profiles: dev, vmaas-ci, bmaas-ci, caas-ci, full-ci
ocp4_workload_osac_installer_profile: full-ci
# BMF (Bare Metal Fulfillment) operator - requires a real bare-metal backend (BCM or Metal3)
ocp4_workload_osac_bmf_enabled: false

# OSAC UI image tag (empty = use version from the repo)
ocp4_workload_osac_ui_image_tag: ""

# Set passwords to be able to run more than once (otherwise they will be generated again)
ocp4_workload_osac_admin_user: osac-admin
ocp4_workload_osac_admin_password: "{{ common_admin_password }}"
ocp4_workload_osac_user_password: "{{ common_user_password }}"

ocp4_workload_osac_lvms_enabled: true
# Disks to use for LVMS deviceSelector. Empty = use all available disks.
ocp4_workload_osac_lvms_disks:
- /dev/vdb

# AAP license. Expires 2026-12-31
# ================================================
# To get a new license file:
# Step 1: Create a Subscription Allocation
# - Go to https://access.redhat.com/management/subscription_allocations
# - Click "Create New subscription allocation"
# - Name: Give it a descriptive name (e.g., osac-aap-lab)
# - Type: Select one from the list (e.g. "Satellite 6.14" is known to work)
# - Click Create
# Step 2: Add Entitlements
# - Open your newly created allocation
# - Go to the "Subscriptions" tab
# - Click "Add Subscriptions"
# - Find "Red Hat Ansible Automation Platform" in the list
# - Add the desired quantity (1 is enough for a lab)
# Step 3: Export and Download the Manifest
# - Go to https://console.redhat.com/subscriptions/manifests
# - Search for your allocation name (e.g., osac-aap-lab), click on it
# - Click "Export manifest", then download the ZIP file
# Step 4: Replace the osac-aap-license.zip file in the S3 bucket (below) with the new one

# Log into AWS Infra Prod Account
# Go to S3 Bucket rhdp-private
# Upload the license.zip file
# Get the URL for the file: https://rhdp-private.s3.us-east-1.amazonaws.com/osac-aap-license.zip
# Go to IAM -> IAM Users
# Create a new user "s3-osac-aap-license" (current user is called s3-osac-app-licence)
# Select "Attach Policies directly"
# Create policy "s3-osac-aap-license" with the following JSON:

# {
#     "Version": "2012-10-17",
#     "Statement": [
#         {
#             "Sid": "VisualEditor0",
#             "Effect": "Allow",
#             "Action": "s3:GetObject",
#             "Resource": "arn:aws:s3:::rhdp-private/osac-aap-license.zip"
#         },
#         {
#             "Sid": "VisualEditor1",
#             "Effect": "Allow",
#             "Action": "s3:ListBucket",
#             "Resource": "arn:aws:s3:::rhdp-private"
#         }
#     ]
# }

# Back at the IAM User Create an Access Key (Use case: Other)
# Vault the credentials and put them here
ocp4_workload_osac_aap_license_s3_url: https://rhdp-private.s3.us-east-1.amazonaws.com/osac-aap-license.zip
# @owner: Wolfgang Kulhanek <wkulhane@redhat.com>
# @purpose: AWS Access Key ID for OSAC AAP license
# @impact: HIGH
# @expiration: NEVER
# @rotation: NEVER
# @source: Red Hat
# @exposure: UNKNOWN
ocp4_workload_osac_aap_license_s3_access_key_id: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          30643539613532643266653338636566346463623934356361373436663164396533303735343533
          3966396534653337313264303533333763363130393736340a376230383236316432353834643164
