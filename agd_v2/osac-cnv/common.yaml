# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-osac
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_content_antora_playbook: site.yml

# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e0d621a7-2f81-406e-a9f7-8416a0e1591f

  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Souvik Das
      email: souvdas@redhat.com
    instructions:
    - name: Souvik Das
      email: souvdas@redhat.com

  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    display_name: "Red Hat Cloud Extensions"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    reportingLabels:
      primaryBU: Hybrid_Platforms
    keywords:
    - osac
    - cloud-extensions
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Application_Platform
      TDP2: AI_Platform
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none
    parameters:
    - name: deploy_osac
      description: >-
        Deploy the Red Hat Cloud Extensions stack on top of this cluster (adds approximately 30 minutes to provisioning time)
      formLabel: Deploy Red Hat Cloud Extensions
      openAPIV3Schema:
        type: boolean
        default: true
    - name: num_workers
      description: >-
        Number of worker nodes to provision within the environment.
      formLabel: Number of Worker Nodes
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 5

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-09-15
      pull: missing

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false

  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: dyn.redhatworkshops.io
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      # purpose: prod
      name: ocpv01
      virt: "yes"
    quota:
      requests.storage: 9500Gi
      limits.cpu: "800"
      requests.cpu: "800"
      limits.memory: 1800Gi
      requests.memory: 1800Gi
