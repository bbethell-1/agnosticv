# -------------------------------------------------------------------
# ocp4_workload_openshift_ai_model_as_a_service
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_model_as_a_service_helm_repo: https://github.com/rhpds/model-as-a-service.git
ocp4_workload_openshift_ai_model_as_a_service_helm_repo_target_revision: main
ocp4_workload_openshift_ai_model_as_a_service_username_base: "{{ ocp4_workload_user_base}}"
ocp4_workload_openshift_ai_model_as_a_service_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_openshift_ai_model_as_a_service_api_users:
- count: 1
  username_prefix: api-admin-
  tier: tier-enterprise-users
- count: 1
  username_prefix: api-user-
  tier: tier-free-users
ocp4_workload_openshift_ai_model_as_a_service_models:
- apiVersion: serving.kserve.io/v1alpha1
  kind: LLMInferenceService
  metadata:
    annotations:
      alpha.maas.opendatahub.io/tiers: '[]'
      openshift.io/display-name: granite-3dot2-8b-instruct
      argocd.argoproj.io/sync-wave: "2"
    labels:
      opendatahub.io/dashboard: 'true'
    name: granite-3dot2-8b-instruct
    namespace: llm
  spec:
    model:
      name: granite-3dot2-8b-instruct
      uri: 'oci://quay.io/redhat-ai-services/modelcar-catalog:granite-3.2-8b-instruct'
    replicas: 1
    router:
      gateway:
        refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
      route: {}
    template:
      containers:
      - resources:
          limits:
            cpu: '2'
            memory: 16Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: '1'
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        name: main
        command:
        - python
        - '-m'
        - vllm.entrypoints.openai.api_server
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_ATTENTION_BACKEND
          value: XFORMERS
        - name: VLLM_USE_V1
          value: '0'
        - name: VLLM_PORT
          value: '8000'
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        image: 'quay.io/modh/vllm:rhoai-2.23-cuda'
        args:
        - '--served-model-name={{ "{{.Name}}" }}'
        - '--model=/mnt/models'
        - '--enable-auto-tool-choice'
        - '--tool-call-parser'
        - granite
        - '--chat-template'
        - /app/data/template/tool_chat_template_granite.jinja
        - '--max-model-len'
        - '120000'
        - '--enable-ssl-refresh'
        - '--ssl-certfile'
        - /var/run/kserve/tls/tls.crt
        - '--ssl-keyfile'
        - /var/run/kserve/tls/tls.key
      nodeSelector:
        nvidia.com/gpu.present: 'true'
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: l40-gpu
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
- apiVersion: serving.kserve.io/v1alpha1
  kind: LLMInferenceService
  metadata:
    name: llama-guard-3-1b
    namespace: llm
    annotations:
      openshift.io/display-name: llama-guard-3-1b
      alpha.maas.opendatahub.io/tiers: '[]'
      argocd.argoproj.io/sync-wave: "2"
    labels:
      opendatahub.io/dashboard: 'true'
  spec:
    model:
      name: llama-guard-3-1b
      uri: 'oci://quay.io/rh-aiservices-bu/llama-guard-3-1b-modelcar:2.0.0'
    replicas: 1
    router:
      route: { }
      # Connect to MaaS-enabled gateway
      gateway:
        refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    template:
      # Ensure the pod is scheduled on GPU nodes
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: "Equal"
        value: "l4-gpu"
      containers:
      - name: main
        resources:
          limits:
            cpu: '12'
            memory: 64Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '1'
            memory: '1Gi'
            nvidia.com/gpu: '1'

