---

# -------------------------------------------------------------------
# --- OpenShift GitOps with OpenShift Virtualization Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-virtualization.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# Required by host_ocp4_assisted_scale
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# CNV Worker Nodes
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 3
ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_assisted_installer: v0.0.9
tag_showroom: v1.6.12
gitops_repo_revision: v1.0.0
showroom_repo_revision: v1.0.0

# -------------------------------------------------------------------
# Additional Collections & roles to be installed
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Required by host_ocp4_assisted_scale
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: "{{ tag_assisted_installer }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_04_13

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_keycloak_default_realm: sso

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: true
ocp4_workload_openshift_virtualization_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.3.2

ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.26.4"
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest

ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: user1
ocp4_workload_gitea_operator_admin_user: "{{ common_admin_username }}"
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password }}"

ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/rhpds/ocp-virt-gitops-apps.git
  name: ocp-virt-gitops-apps
  private: false

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp-virt-gitops
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-infra
ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: 0
  gitea:
    org: user1

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-virt-gitops-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.1.4
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f7f0aa5d-8b66-4fc2-9384-8e1ed7dddded
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    - name: Luiz Chiaretto
      email: lchiaret@redhat.com
    instructions:
    - name: Luiz Chiaretto
      email: lchiaret@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "OpenShift GitOps with OpenShift Virtualization Workshop"
    category: Demos
    keywords:
    - virtualization
    - gitops
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms

  # -----------------------------------------------------------------
  # Components / Cluster Pool
  # -----------------------------------------------------------------
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.21"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    # Required by host_ocp4_assisted_scale
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
