---
#include /includes/catalog-icon-openshift.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# Agnosticdv2 variables
env_type: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key}}"


# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main


# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_rhacm
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: 1
ocp4_workload_user_base: user
ocp4_workload_multi_user: false
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:12] }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_07_01

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_enable_user_info_data: true
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_use_catalog_snapshot: false
#ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
#ocp4_workload_rhacm_catalog_source_tag: "v4.11_2023_02_27"
#ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.7"
ocp4_workload_rhacm_acm_channel: "release-2.14"
ocp4_workload_rhacm_acm_release: "release-2.14"
#Need to set ACM installation type
master_instance_count: 1


# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp4-getting-started-showroom
ocp4_workload_showroom_content_git_repo_ref: v1.0.1
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2025-07-29

__meta__:
  asset_uuid: f8a37d32-7cdc-48da-9133-b088c881cfa8
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    instructions:
    - name: Jimmy Alverez
      email: jalverez@redhat.com
    - name: Luiz Bernardo Levenhagen Alarcon da Fonseca
      email: llevenha@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  catalog:
    display_name: "Advanced Cluster Management for Kubernetes Demo(CNV Pools AgdV2)"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - workshop
    - ocp
    - openshift
    - acm
    - rhacm
    labels:
      Featured_Score: '71'
      Product: Red_Hat_Advanced_Cluster_Management_for_Kubernetes
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.19'
        enum:
        - '4.19'
      # Parameter for openshift cluster
      components:
      - name: openshift

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      ocp4_installer_version: 4.19
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
  - name: aws
    display_name: AWS Open Environment
    item: sandboxes-gpte/SANDBOX_OPEN
    parameter_values:
      aws_region: us-east-2
    propagate_provision_data:
    - var: aws_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
