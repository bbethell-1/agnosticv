---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.3.6

# Required for Catalog Items that will deploy hosted clusters to the local-cluster
# Enable Wildcards to allow access to HCP Hosted Clusters console, etc.
ocp4_workload_rhacm_enable_wildcards: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-16
