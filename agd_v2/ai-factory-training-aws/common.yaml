---
# This item is restricted to devs only.
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-6.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# --- Catalog Item: AI Factory Training (AWS)
# -------------------------------------------------------------------

tag: main

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: 1.0.0
config: openshift-cluster

num_users: 1

# ===================================================================
# Additional collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # AI OpenShift Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"
  # OpenShift AI Custom workloads
  - name: https://github.com/rhpds/rhpds.openshift-ai.git
    type: git
    version: "{{ tag }}"
  # AI Factory Training Automation
  - name: https://github.com/rhpds/ai-factory-training-automation.git
    type: git
    version: main

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
control_plane_instance_type: m6a.4xlarge
control_plane_instance_count: 1
control_plane_storage_size: 500
control_plane_storage_type: gp3

worker_instance_type: m6a.4xlarge
worker_instance_count: 2
worker_storage_type: gp3
worker_storage_size: 500

bastion_instance_type: t3a.small
bastion_instance_image: RHEL96GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
bastion_setup_student_user: true

# -------------------------------------------------------------------
# List of workloads to be deployed
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_machinesets
- agnosticd.core_workloads.ocp4_workload_nfd
- agnosticd.ai_workloads.ocp4_workload_nvidia_gpu_operator
- agnosticd.core_workloads.ocp4_workload_authorino
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
- rhpds.ai_factory_training_automation.ocp4_workload_ai_factory_bootstrap

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"
ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_cloud_provider: aws
ocp4_workload_cert_manager_acme_bifrost_webhook_image: "quay.io/rhpds/acme-bifrost-webhook:v0.2.27"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
# Generate admin
ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: ""
# Generate user
ocp4_workload_authentication_num_users: 1
ocp4_workload_authentication_user_basename: user
ocp4_workload_authentication_user_password: ""

ocp4_workload_authentication_keycloak_openshift_client_secret: ""
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_nfd
# -------------------------------------------------------------------
ocp4_workload_nfd_operator_channel: stable

# -------------------------------------------------------------------
# ocp4_workload_nvidia_gpu_operator
# -------------------------------------------------------------------
ocp4_workload_nvidia_gpu_operator_channel: v25.3
ocp4_workload_nvidia_gpu_operator_use_catalog_snapshot: false
ocp4_workload_nvidia_gpu_operator_create_dashboard: true
ocp4_workload_nvidia_gpu_operator_wait_for_cluster_policy: false
ocp4_workload_nvidia_gpu_operator_ignore_csv_error: true

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: false

ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu
  role: worker-gpu
  instance_type: "{{ gpu_instance_type }}"
  autoscale: false
  total_replicas: "1"
  total_replicas_min: "1"
  total_replicas_max: "1"
  root_volume_size: "500"
  taints:
  - key: nvidia.com/gpu
    value: "true"
    effect: NoSchedule

# -------------------------------------------------------------------
# ocp4_workload_authorino
# -------------------------------------------------------------------
ocp4_workload_authorino_operator_channel: stable

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: latest

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable-3.4
ocp4_workload_openshift_ai_automatic_install_plan_approval: false

# DSC Configuration
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed

ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_modelregistry_namespace: rhoai-model-registries
ocp4_workload_openshift_ai_modelregistry_config:
  managementState: "{{ ocp4_workload_openshift_ai_modelregistry }}"
  registriesNamespace: "{{ ocp4_workload_openshift_ai_modelregistry_namespace }}"

ocp4_workload_openshift_ai_ray: Managed
ocp4_workload_openshift_ai_trustyai: Managed
ocp4_workload_openshift_ai_trainer: Managed
ocp4_workload_openshift_ai_trainingoperator: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_feastoperator: Managed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed

ocp4_workload_openshift_ai_jobset_channel: stable-v1.0
ocp4_workload_openshift_ai_jobset_automatic_install_plan_approval: true

# -------------------------------------------------------------------
# rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_dashboard_config_settings:
  disableTracking: false
  disableModelRegistry: false
  disableModelCatalog: false
  disableKServeMetrics: false
  genAiStudio: true
  modelAsService: true
  disableLMEval: false

ocp4_workload_openshift_ai_dashboard_config_notebook_controller:
  enabled: true
  pvcSize: 20Gi

ocp4_workload_openshift_ai_hardware_profile_gpu_identifiers:
- defaultCount: 500m
  displayName: CPU
  identifier: cpu
  maxCount: 4
  minCount: 100m
  resourceType: CPU
- defaultCount: 8Gi
  displayName: Memory
  identifier: memory
  maxCount: 12Gi
  minCount: 1Gi
  resourceType: Memory
- defaultCount: 1
  displayName: GPU
  identifier: nvidia.com/gpu
  maxCount: 1
  minCount: 1
  resourceType: Accelerator

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
    - rhpds-devs-ptl
  asset_uuid: 7c8a9f3e-5d2b-4a1c-8e6f-9b3c7d4e5a2f
  sandboxes:
  - kind: AwsSandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
    actions:
      start:
        disable: false
      stop:
        disable: true

  sandbox_api:
    reservation: pgpu
    actions:
      start:
        enable: true
      stop:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "AI Factory Training with GPU (AWS)"
    category: Labs
    multiuser: false
    workshopLabUiRedirect: true
    keywords:
    - rhoai
    - llm
    - ai factory
    - training
    - ptl
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
    reportingLabels:
      primaryBU: Artificial_Intelligence
    parameters:
    - name: gpu_instance_type
      description: Choose GPU instance type for training workloads
      formLabel: GPU Instance Type
      required: true
      openAPIV3Schema:
        type: string
        default: g6.2xlarge
        enum:
        - g6.2xlarge
        - g6.4xlarge
        - g6.8xlarge

  owners:
    maintainer:
    - name: Tyrell Reddy
      email: treddy@redhat.com
