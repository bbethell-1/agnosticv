---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift GitOps Blank Environment (CNV)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# Required by host_ocp4_assisted_scale
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Required by host_ocp4_assisted_scale
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: 1.2.1

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: "{{ true if control_plane_size == 'multinode' else false }}"
worker_instance_count: "{{ worker_node_count }}"
ai_workers_cores: 8
ai_workers_memory: 16Gi

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: "{{ lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits') }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
# not yet available in ocp 4.21
# ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_htpasswd_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
# ocp4_workload_openshift_gitops_kustomize_plugin_env:
# - name: MY_VAR
#   value: myValue

ocp4_workload_openshift_gitops_resource_tracking_method: annotation

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-cnv-gitops
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.4
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: v1.5.0
  threeScale: ''
  devspaces:
    startingCSV: devspacesoperator.v3.25.0
  rhoai:
    startingCSV: rhods-operator.2.25.1
    datasciencecluster:
      components:
        dashboard:
          managementState: Managed
        feastoperator:
          managementState: Removed
        kserve:
          managementState: Managed
          defaultDeploymentMode: RawDeployment
          rawDeploymentServiceConfig: Headed
          serving:
            managementState: Removed
            name: knative-serving
        kueue:
          defaultClusterQueueName: default
          defaultLocalQueueName: default
          managementState: Removed
        llamastackoperator:
          managementState: Managed
        modelregistry:
          managementState: Removed
        ray:
          managementState: Removed
        trainingoperator:
          managementState: Removed
        trustyai:
          managementState: Removed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: rhsso-operator.7.6.12-opr-006
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: web-terminal.v1.15.0
  compliance:
    startingCSV: compliance-operator.v1.8.2

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3153ac48-f909-4090-af4e-3b1bcb024963
  owners:
    maintainer:
    - name: Juliano Mohr
      email: jboeselm@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: "{{ control_plane_size }}"
      host_ocp4_installer_version: "{{ ocp4_installer_version}}"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    # Required by host_ocp4_assisted_scale
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      OpenShift GitOps Blank Environment
    category: Open_Environments
    multiuser: true
    keywords:
    - openshift
    - gitops
    - argocd
    - single-node
    - sno
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Featured_Score: '71'
    parameters:
    - name: user_count
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 50
    - name: control_plane_size
      description: OpenShift control plane size
      formLabel: Control Plane Size
      openAPIV3Schema:
        type: string
        default: 'sno'
        enum:
        - 'sno'
        - 'multinode'
    - name: worker_node_count
      description: OpenShift worker node count
      formLabel: Worker Node Count
      formHideCondition: >-
        control_plane_size != 'multinode'
      openAPIV3Schema:
        type: integer
        default: 3
        minimum: 3
        maximum: 10
    - name: ocp4_installer_version
      description: OpenShift version to install
      formLabel: OpenShift Version
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.20'
        - '4.21'
