---
# -------------------------------------------------------------------
# --- Catalog Item: OpenShift GitOps Blank Environment
#                   Cluster (CNV) - AgdV2
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: 1.1.0
config: openshift-cluster

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: 1.1.0

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi

control_plane_instance_count: "{{ control_plane_count }}"
worker_instance_count: "{{ 0 if control_plane_count | int == 1 else [(num_users | int / 3) | round(0, 'ceil') | int, 2] | max }}"

ai_control_plane_cores: "{{ control_plane_cores }}"
ai_control_plane_memory: "{{ control_plane_memory }}"

ai_workers_cores: 8
ai_workers_memory: 16Gi

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "{{ ocp4_installer_version }}"
host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true

cluster_name: "cluster-{{ guid }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: user

common_admin_password: "{{ lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits') }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: "stable-{{ ocp4_installer_version }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.18
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_cloud_provider: aws
ocp4_workload_cert_manager_aws_region: us-east-2
ocp4_workload_cert_manager_aws_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_aws_hostedzoneid: "{{ route53_aws_zone_id }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_htpasswd_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
# ocp4_workload_openshift_gitops_kustomize_plugin_env:
# - name: MY_VAR
#   value: myValue

ocp4_workload_openshift_gitops_resource_tracking_method: annotation

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-cnv-gitops
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.4
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: v1.5.0
  threeScale: ''
  devspaces:
    startingCSV: devspacesoperator.v3.24.1
  rhoai:
    startingCSV: rhods-operator.2.25.0
    datasciencecluster:
      components:
        aipipelines:
          argoWorkflowsControllers:
            managementState: Removed
          managementState: Removed
        dashboard:
          managementState: Managed
        feastoperator:
          managementState: Removed
        kserve:
          managementState: Managed
          defaultDeploymentMode: RawDeployment
          rawDeploymentServiceConfig: Headed
          serving:
            managementState: Removed
            name: knative-serving
        kueue:
          defaultClusterQueueName: default
          defaultLocalQueueName: default
          managementState: Removed
        llamastackoperator:
          managementState: Managed
        modelregistry:
          managementState: Removed
        ray:
          managementState: Removed
        trainingoperator:
          managementState: Removed
        trustyai:
          managementState: Removed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: rhsso-operator.7.6.12-opr-005
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: web-terminal.v1.15.0
  compliance:
    startingCSV: compliance-operator.v1.8.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3153ac48-f909-4090-af4e-3b1bcb024963
  owners:
    maintainer:
    - name: Juliano Mohr
      email: jboeselm@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      OpenShift GitOps Blank Environment
    category: Open_Environments
    multiuser: true
    keywords:
    - openshift
    - gitops
    - argocd
    - single-node
    - sno
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Featured_Score: '71'
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 25
    - name: control_plane_count
      description: OpenShift control plane node count
      formLabel: Control Plane Count
      required: false
      openAPIV3Schema:
        type: integer
        default: 1
        maximum: 3
        enum:
        - 1
        - 3
    - name: control_plane_cores
      description: OpenShift control plane nodes cores
      formLabel: Control Plane Cores
      openAPIV3Schema:
        type: integer
        default: 24
        enum:
        - 16
        - 24
        - 32
    - name: control_plane_memory
      description: OpenShift control plane nodes memory
      formLabel: Control Plane Memory
      openAPIV3Schema:
        type: string
        default: 64Gi
        enum:
        - 32Gi
        - 64Gi
        - 128Gi
    - name: ocp4_installer_version
      description: OpenShift version to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.19'
        - '4.20'
      annotation: demo.redhat.com/ocp-version
      variable: ocp4_installer_version
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
