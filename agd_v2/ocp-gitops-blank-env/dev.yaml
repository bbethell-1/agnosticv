---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

cloud_provider_version: main

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: main
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main
  # Showroom
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-cnv-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: main
  threeScale: ''
  devspaces:
    startingCSV: ""
  rhoai:
    channel: fast-3.x
    startingCSV: ""
    datasciencecluster:
      apiVersion: datasciencecluster.opendatahub.io/v2
      components:
        aipipelines:
          argoWorkflowsControllers:
            managementState: Removed
          managementState: Removed
        dashboard:
          managementState: Managed
        feastoperator:
          managementState: Removed
        kserve:
          managementState: Managed
        kueue:
          managementState: Removed
        llamastackoperator:
          managementState: Managed
        modelregistry:
          managementState: Removed
        ray:
          managementState: Removed
        trainingoperator:
          managementState: Removed
        trustyai:
          managementState: Removed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: ""
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: ""
  compliance:
    startingCSV: ""

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_showroom_ocp_integration
# -------------------------------------------------------------------
ocp4_workload_showroom_ocp_integration_openshift_api_url: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
ocp4_workload_showroom_ocp_integration_openshift_api_token: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_token') }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp4-cnv-gitops-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ ocp_gitops_blank_env_tag }}"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
# ocp4_workload_showroom_deployer_chart_version: 2.0.4
# check if empty string pulls latest
ocp4_workload_showroom_deployer_chart_version: ""
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      # image: quay.io/agnosticd/ee-multicloud:chained-latest
