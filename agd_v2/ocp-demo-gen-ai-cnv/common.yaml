---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: Demo - Generative AI with Red Hat Openshift AI (CNV Pools)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables - AgnosticV2 Pattern
# -------------------------------------------------------------------
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: true

# Tag for pinned collections — override in prod.yaml to lock a release
tag: main

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection for CNV
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # AI Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.0.0"

  # Showroom — v1.6.6 adds runtime_automation_enable/image support
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.6

  # Original Gen AI collection
  - name: https://github.com/rhpds/lb1942.instruct_docling_lab.git
    type: git
    version: "{{ tag }}"

# worker count for Auto-scaling
worker_instance_count: 4
ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Common Password (from original gen_ai)
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ common_password }}"
common_user_password: "{{ common_password }}"
common_admin_username: admin

# User configuration
ocp4_workload_user_base: user
ocp4_workload_user_count: 1
ocp4_workload_multi_user: false

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

# Gen AI secrets are now provided by LiteMaaS via litellm_virtual_keys workload

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_authorino
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.core_workloads.ocp4_workload_servicemesh2
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.core_workloads.ocp4_workload_web_terminal


# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authorino
# -------------------------------------------------------------------
# Using defaults from core_workloads

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
# Using defaults from core_workloads
# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
  g, user1, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_serving: true
ocp4_workload_serverless_install_eventing: true

# -------------------------------------------------------------------
# Workload ocp4_workload_servicemesh2 - Service Mesh v2
# -------------------------------------------------------------------
ocp4_workload_servicemesh2_es: false
ocp4_workload_servicemesh2_jaeger: false
ocp4_workload_servicemesh2_kiali: false


# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_automatic_install_plan_approval: false
ocp4_workload_openshift_ai_channel: fast-3.x
ocp4_workload_openshift_ai_starting_csv: "rhods-operator.3.2.0"
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_aipipelines: Managed
ocp4_workload_openshift_ai_modelmeshserving: Removed

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/llm-rag-deployment.git
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-helm-chart
ocp4_workload_gitops_bootstrap_repo_revision: litemaas-update

ocp4_workload_gitops_bootstrap_helm_values:
  gradioEnv:
    BEARER_TOKEN: "{{ litellm_virtual_key }}"
    INFERENCE_SERVER_URL: "{{ litellm_url }}/v1/completions"
    MODEL_NAME: granite-3-2-8b-instruct
  gradioRagEnv:
    BEARER_TOKEN: "{{ litellm_virtual_key }}"
    INFERENCE_SERVER_URL: "{{ litellm_url }}/v1/completions"
    MODEL_NAME: granite-3-2-8b-instruct
ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-generative-ai-rag.git
ocp4_workload_showroom_content_git_repo_ref: "{{ tag }}"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# -------------------------------------------------
# lb1942.instruct_docling_lab.bootstrap
# -------------------------------------------------
bootstrap_rh_submit_repo: https://github.com/rhpds/elyra_docling_rh_summit
bootstrap_num_users: 1
bootstrap_user_name_base: user

litellm_api_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
litellm_url: "{{ maas_sandbox.credentials[0].api_endpoint }}"
litellm_virtual_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
litellm_available_models: "{{  maas_sandbox.credentials[0].available_models }}"
litellm_available_models_list: "{{ maas_sandbox.credentials[0].available_models | join(', ') }}"
litellm_key_duration: ""

agnosticd_passthrough_user_data:
  litellm_api_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
  litellm_url: "{{ maas_sandbox.credentials[0].api_endpoint }}"
  litellm_virtual_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
  litellm_available_models: "{{  maas_sandbox.credentials[0].available_models }}"
  litellm_available_models_list: "{{ maas_sandbox.credentials[0].available_models | join(', ') }}"
  litellm_key_duration: ""

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
  - kind: MaaSSandbox
    cloud_selector:
      purpose: production
    models: "granite-3-2-8b-instruct"
    var: maas_sandbox
  asset_uuid: d22af282-9f88-4218-a4ee-43f47aacb95c
  owners:
    maintainer:
    - name: Ritesh Shah
      email: rshah@redhat.com
    instructions:
    - name: Ritesh Shah
      email: rshah@redhat.com
  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-virt-labs-pool
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: bastion_ssh_command
      var: bastion_ssh_command

  # Disable actions on chained config that are handled by base.
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Generative AI Demo with Red Hat Openshift AI (CNV Pools)
    category: Demos
    keywords:
    - openshift
    - openshiftai
    - ai
    - generativeai
    - rhoai
    - RAG
    multiuser: false
    labels:
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Artificial_Intelligence
      secondaryBU: Hybrid_Platforms
    parameters: []
