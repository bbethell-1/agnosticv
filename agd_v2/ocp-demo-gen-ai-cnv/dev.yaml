---
# dev environment vars CNV

purpose: development

# Allow users to log in over ssh
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# Common Password
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# Reduce worker count for dev environment
worker_instance_count: 2
ai_workers_cores: 16
ai_workers_memory: 32Gi

# Use a smaller catalog snapshot for dev
ocp4_workload_catalogsource_tag: v4.18_2025_07_25

# Reduce resources for dev
ocp4_workload_openshift_gitops_controller_requests_cpu: 100m
ocp4_workload_openshift_gitops_controller_requests_memory: 1Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "1"
ocp4_workload_openshift_gitops_controller_limits_memory: 2Gi
