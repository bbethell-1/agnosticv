---
# ===================================================================
# OpenShift Getting Started — Combined CI (GPTEINFRA-17014)
#
# COMBINED catalog item for WeAreDevelopers 2026 booth.
# Provisions a shared OCP cluster ONCE, then runs tenant workloads
# per user. A PICKLIST (module: "1" | "2" | "3") selects which
# Getting Started lab each user receives.
#
# HOW IT WORKS:
#   1. Component provisions an OCP cluster from CNV pool
#   2. Cluster workloads run once (Auth, Pipelines, Gitea, GitOps)
#      gitops_bootstrap runs in Phase 0 (tenant_cluster_workloads)
#      with cluster/infra/bootstrap path → creates bootstrap-infra
#   3. Bridge role (ocp4_workload_multi_tenant_loop) loops
#      tenant_workloads for each user (1..num_users)
#   4. Per tenant: keycloak user, namespaces, gitobs bootstrap
#      (tenant path, module-specific helm_values via _module_gitops_helm_values_map),
#      showroom seed, showroom
#
# PICKLIST: `module` drives agnosticd_passthrough_user_data.module,
# gitops_bootstrap helm_values (via dict lookup), namespace_suffixes
# (via dict lookup), and showroom tabs (ArgoCD tab for module 3 only).
# Valid values: "1", "2", "3" (strings)
#
# JIRA: GPTEINFRA-17014
# ===================================================================

# -------------------------------------------------------------------
# This item is restricted to devs only.
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
cloud_provider: none
config: openshift-workloads

clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_api_key }}"

# Default — overridden by dev.yaml (1 for fast dev testing).
# Portal dropdown caps at maximum set by cluster max_placements.
num_users: 1

# Seconds to wait after cluster workloads complete before starting
# tenant provisioning. Gives Keycloak realm and ArgoCD time to settle.
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# In the combined CI the cluster admin token (from component
# propagate_provision_data) is used by every tenant role.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

# ocp4_workload_tenant_keycloak_user
ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ocp4_workload_tenant_namespace
ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# ===================================================================
# Cluster Sizing
# worker_instance_count scales with num_users: 1 worker per 8 users
# (lightweight tenants — datasphere app, gitea, gitops per user).
# Minimum 2 workers for cluster stability.
# ===================================================================
openshift_cnv_scale_cluster: true
worker_instance_count: "{{ [2, (num_users / 8) | round(0, 'ceil') | int] | max }}"
ai_workers_cores: 8
ai_workers_memory: 16Gi

# ===================================================================
# Collections (union of cluster + tenant CIs, deduplicated)
# showroom pinned to v1.6.11
# assisted_installer pinned to v0.0.9 (from cluster CI)
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9

    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/agnosticd/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.11

# ===================================================================
# Cluster-level workloads (run once)
#
# Bridge role (ocp4_workload_multi_tenant_loop) is LAST.
# gitops_bootstrap is in Phase 0 (tenant_cluster_workloads) —
# NOT here — to avoid extra_var precedence collision with tenant-level
# gitops_bootstrap vars.
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_pipelines
  - agnosticd.core_workloads.ocp4_workload_gitea_operator
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Phase 0 — cluster-level gitops_bootstrap, runs ONCE
# ===================================================================
tenant_cluster_workloads:
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

tenant_cluster_workloads_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-getting-started-automation.git
    ocp4_workload_gitops_bootstrap_repo_revision: main
    ocp4_workload_gitops_bootstrap_repo_path: cluster/infra/bootstrap
    ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra
    ocp4_workload_gitops_bootstrap_application_wait: false
    ocp4_workload_gitops_bootstrap_health_retries: 2
    ocp4_workload_gitops_bootstrap_helm_values:
      turn_off_kustomize: true

      defaultStorageclass:
        enabled: true
        git:
          repoURL: https://github.com/rhpds/ocp4-getting-started-automation.git
          targetRevision: main

      platform:
        enabled: true
        git:
          repoURL: https://github.com/rhpds/ocp4-getting-started-automation.git
          targetRevision: main

      platformValues:
        developerPerspective:
          enabled: true
          git:
            repoURL: https://github.com/rhpds/ocp4-getting-started-automation.git
            targetRevision: main
        giteaContentInit:
          enabled: true
          git:
            repoURL: https://github.com/rhpds/ocp4-getting-started-automation.git
            targetRevision: main
        datasphereHelmCatalog:
          enabled: true
          git:
            repoURL: https://github.com/rhpds/ocp4-getting-started-automation.git
            targetRevision: main

# ===================================================================
# Tenant workloads (run per user by bridge role)
# ===================================================================
tenant_workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea_user
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_showroom_user_data_seed
  - agnosticd.showroom.ocp4_workload_showroom

tenant_remove_workloads: []

remove_workloads:
  - agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Module-specific lookup maps
# ===================================================================
_module_gitops_helm_values_map:
  "1":
    tenant:
      name: "{{ guid }}"
      user:
        name: "{{ ocp4_workload_tenant_keycloak_username }}"
    gitea:
      userRepos:
        enabled: true
    labs:
      datasphere:
        enabled: true
        namespace: "{{ ocp4_workload_tenant_keycloak_username }}-datasphere"
      studentArgoCD:
        enabled: false
  "2":
    tenant:
      name: "{{ guid }}"
      user:
        name: "{{ ocp4_workload_tenant_keycloak_username }}"
    gitea:
      userRepos:
        enabled: true
    labs:
      datasphere:
        enabled: true
        namespace: "{{ ocp4_workload_tenant_keycloak_username }}-datasphere"
        api:
          probes:
            enabled: true
          resources:
            enabled: true
          hpa:
            enabled: true
  "3":
    tenant:
      name: "{{ guid }}"
      user:
        name: "{{ ocp4_workload_tenant_keycloak_username }}"
    gitea:
      userRepos:
        enabled: true
    labs:
      datasphere:
        enabled: true
        namespace: "{{ ocp4_workload_tenant_keycloak_username }}-datasphere"
      studentArgoCD:
        enabled: true
        namespace: "{{ ocp4_workload_tenant_keycloak_username }}-gitops"

_module_namespace_suffixes_map:
  "1":
    - suffix: datasphere
    - suffix: lab
    - suffix: lab-helm
  "2":
    - suffix: datasphere
    - suffix: lab
  "3":
    - suffix: datasphere
    - suffix: gitops
      metadata:
        labels:
          argocd.argoproj.io/managed-by: "{{ ocp4_workload_tenant_keycloak_username }}-gitops"

tenant_workload_vars:
  agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace:
    ocp4_workload_tenant_namespace_suffixes: "{{ _module_namespace_suffixes_map[module] }}"

  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-getting-started-automation.git
    ocp4_workload_gitops_bootstrap_repo_revision: main
    ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
    ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
    ocp4_workload_gitops_bootstrap_application_ignore_tracking: true
    ocp4_workload_gitops_bootstrap_helm_values: "{{ _module_gitops_helm_values_map[module] }}"

  agnosticd.showroom.ocp4_workload_showroom:
    _showroom_user: "{{ ocp4_workload_tenant_keycloak_username }}"

# ===================================================================
# Cluster workload variables
# ===================================================================
ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_02_23

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4

ocp4_workload_pipelines_channel: pipelines-1.21
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.3.2

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.26.0"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: "10.1"
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: gitea-admin
ocp4_workload_gitea_operator_admin_email: gitea-admin@redhat.com
ocp4_workload_gitea_operator_admin_password: ""  # auto-generated; readable from Gitea CR status.adminPassword

ocp4_workload_gitea_operator_create_users: false

ocp4_workload_openshift_gitops_channel: latest
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: "[name,groups]"

# ===================================================================
# Tenant workload variables
# ===================================================================
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"

ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "10"
  requests.cpu: "5"
  limits.memory: 10Gi
  requests.memory: 5Gi
  requests.storage: 100Gi
  pods: "50"

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi

ocp4_workload_tenant_gitea_user_namespace: gitea
ocp4_workload_tenant_gitea_user_name: gitea
ocp4_workload_tenant_gitea_user_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_gitea_user_password: "{{ common_password }}"
ocp4_workload_tenant_gitea_user_repositories: []
ocp4_workload_tenant_gitea_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_gitea_user_openshift_api_token: "{{ openshift_api_key }}"

module: "1"

ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"
  module: "{{ module }}"

agnosticd_passthrough_user_data:
  module: "{{ module }}"

ocp4_workload_showroom_passthrough_user_data: false
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/zt-ocp4-getting-started

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11

_module_showroom_ui_config_map:
  "1": |
    type: showroom
    default_width: 40
    persist_url_state: true
    view_switcher:
      enabled: true
      default_mode: split
    tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OpenShift Console
      url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
    - name: Gitea
      url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
  "2": |
    type: showroom
    default_width: 40
    persist_url_state: true
    view_switcher:
      enabled: true
      default_mode: split
    tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OpenShift Console
      url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
    - name: Gitea
      url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
  "3": |
    type: showroom
    default_width: 40
    persist_url_state: true
    view_switcher:
      enabled: true
      default_mode: split
    tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OpenShift Console
      url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
    - name: Gitea
      url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
    - name: ArgoCD
      url: "https://argocd-server-{{ ocp4_workload_tenant_keycloak_username }}-gitops.{{ openshift_cluster_ingress_domain }}"

ocp4_workload_showroom_content_ui_config: "{{ _module_showroom_ui_config_map[module] }}"

tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"
  module: "{{ module }}"

tenant_user_info_msg: >-
  Module {{ module }} Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Babylon Meta Variables
# ===================================================================
__meta__:
  asset_uuid: c7f3a1b2-4d8e-4f9a-b5c6-2e1d0a3f7b8c
  owners:
    maintainer:
      - name: Juliano Mohr
        email: juliano@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
    actions:
      status:
        disable: true
      update:
        disable: true

  catalog:
    display_name: "Getting Started with OpenShift - Combined"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi
    keywords:
      - summit-2026
      - getting-started
      - combined
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Brand_Event: WeAreDevelopers_2026
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
      - name: module
        description: "Which Getting Started module to deploy for all tenants"
        formLabel: "Module"
        openAPIV3Schema:
          type: string
          default: "1"
          enum:
            - "1"
            - "2"
            - "3"
          enumNames:
            - "3 Ways to Deploy the App"
            - "Apps That Never Go Down"
            - "Git Is Your Source of Truth"
      - name: num_users
        description: "Number of tenant users to provision"
        formLabel: "Number of Users"
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 15

  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.21"
        ocp4_fips_enable: false
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_api_key
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace

  tower:
    timeout: 21600
