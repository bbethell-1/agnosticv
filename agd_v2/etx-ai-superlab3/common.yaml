# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable-2.25

ocp4_workload_openshift_ai_starting_csv: rhods-operator.2.25.0
ocp4_workload_openshift_ai_automatic_install_plan_approval: false

ocp4_workload_openshift_ai_use_catalog_snapshot: false
# ocp4_workload_openshift_ai_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_ai_kserve: Managed

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/etx-llm-optimization-and-inference-manifest.git
ocp4_workload_gitops_bootstrap_repo_revision: no-3scale
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  llmaas:
    repoURL: https://github.com/rhpds/etx-llm-optimization-and-inference-manifest
    targetRevision: no-3scale
    path: model-serving
ocp4_workload_gitops_bootstrap_health_retries: 2
ocp4_workload_gitops_bootstrap_health_ignore: true

ocp4_workload_gitops_bootstrap_application_wait: false
ocp4_workload_gitops_bootstrap_application_health_retries: 90
ocp4_workload_gitops_bootstrap_application_health_ignore: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_showroom_ocp_integration
# -------------------------------------------------------------------
ocp4_workload_showroom_ocp_integration_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_showroom_ocp_integration_openshift_api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Safe defaults for missing tokens
# -------------------------------------------------------------------
openshift_cluster_admin_token: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_token') | default('') }}"
openshift_api_key: "{{ openshift_cluster_admin_token }}"

#-------------------------------------------------------------------
#ocp4_workload_showroom
#-------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/etx-llm-optimization-and-inference-showroom
#ocp4_workload_showroom_content_git_repo_ref: v1.1.1
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

