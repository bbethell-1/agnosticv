---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: ETX AI Super Lab 3 (VLLM Inference Optimization & Evaluation)
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-5-ocp-multi.yaml


#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: 1.0.0
config: openshift-cluster

# ===================================================================
# Additional collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # AI OpenShift Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: main
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.3.7
# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
control_plane_instance_type: c6a.4xlarge
control_plane_instance_count: 3

worker_instance_type: m6a.4xlarge
worker_instance_count: 3

bastion_instance_type: t3a.small
bastion_instance_image: RHEL96GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.19.9"
openshift_cluster_admin_service_account_enable: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
bastion_setup_student_user: true

# -------------------------------------------------------------------
# List of workloads to be deployed
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_openshift_data_foundation
- agnosticd.core_workloads.ocp4_workload_machinesets
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_authentication_rhsso
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_minio
- agnosticd.core_workloads.ocp4_workload_nfd
- agnosticd.core_workloads.ocp4_workload_authorino
- agnosticd.core_workloads.ocp4_workload_servicemesh2
- agnosticd.ai_workloads.ocp4_workload_nvidia_gpu_operator
- agnosticd.ai_workloads.ocp4_workload_s3_model_copy_to_minio
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: 1
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_10_23

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.18

ocp4_workload_openshift_data_foundation_catalogsource_setup: false
# ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 1500Gi
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

ocp4_workload_openshift_data_foundation_ceph_storage_system_deploy_timeout: 1500
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1500

ocp4_workload_openshift_data_foundation_tolerations:
- key: nvidia.com/gpu
  effect: NoSchedule
  value: "True"

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: false
gpu_instance_type_small: g6e.2xlarge

ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu-small
  role: worker-gpu
  instance_type: "{{ gpu_instance_type_small }}"
  autoscale: false
  total_replicas: "1"
  total_replicas_min: "1"
  total_replicas_max: "1"
  root_volume_size: "250"
  taints:
  - key: nvidia.com/gpu
    value: true
    effect: NoSchedule

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
# ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"
ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# ocp4_workload_authentication_rhsso
# -------------------------------------------------------------------
ocp4_workload_authentication_rhsso_channel: stable

ocp4_workload_authentication_rhsso_use_catalog_source: false
# ocp4_workload_authentication_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_authentication_rhsso_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_rhsso_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_rhsso_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_rhsso_user_name_base: "{{ ocp4_workload_user_base}}"
ocp4_workload_authentication_rhsso_user_password: "{{ common_user_password }}"
ocp4_workload_rhsso_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable

ocp4_workload_serverless_use_catalog_snapshot: false
# ocp4_workload_serverless_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18

ocp4_workload_pipelines_use_catalog_snapshot: false
# ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.17
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
# ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_update_resources: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_rhsso_admin_username }}, role:admin
  g, user1, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: ic-shared-minio
ocp4_workload_minio_name: minio
ocp4_workload_minio_storage_size: 150Gi
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2025-02-28T09-55-16Z
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: minio123

ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_bucket_name:
- llm-storage

# -------------------------------------------------------------------
# ocp4_workload_nfd
# -------------------------------------------------------------------
ocp4_workload_nfd_operator_channel: stable

ocp4_workload_nfd_use_catalog_snapshot: false
# ocp4_workload_nfd_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_nfd_worker_config:
  core:
    sleepInterval: 60s
  sources:
    pci:
      deviceClassWhitelist:
      - "0200"
      - "03"
      - "12"
      deviceLabelFields:
      - "vendor"

# -------------------------------------------------------------------
# ocp4_workload_authorino
# -------------------------------------------------------------------
ocp4_workload_authorino_operator_channel: stable

ocp4_workload_authorino_operator_use_catalog_snapshot: false
# ocp4_workload_authorino_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_servicemesh2
# -------------------------------------------------------------------
ocp4_workload_servicemesh2_servicemesh_channel: stable

ocp4_workload_servicemesh2_catalogsource_setup: false
# ocp4_workload_servicemesh2_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_servicemesh2_es: false
ocp4_workload_servicemesh2_jaeger: false
ocp4_workload_servicemesh2_kiali: false

# -------------------------------------------------------------------
# ocp4_workload_nvidia_gpu_setup
# -------------------------------------------------------------------
ocp4_workload_nvidia_gpu_operator_channel: v25.10

ocp4_workload_nvidia_gpu_operator_use_catalog_snapshot: false
# ocp4_workload_nvidia_gpu_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_nvidia_gpu_operator_create_dashboard: true
ocp4_workload_nvidia_gpu_operator_wait_for_cluster_policy: false
ocp4_workload_nvidia_gpu_operator_ignore_csv_error: true

# -------------------------------------------------------------------
