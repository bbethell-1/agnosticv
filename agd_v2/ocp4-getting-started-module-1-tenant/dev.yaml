---
tag: main

requirements_content:
  collections:
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.6.8

# Add Gitea tab to Showroom sidebar (Module 1 doesn't use ArgoCD).
# Terminal and OpenShift Console tabs from common.yaml are replaced by
# this full override — all tabs must be listed here.
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  - name: Gitea
    url: "https://gitea.{{ openshift_cluster_ingress_domain }}"

# Module 1 specific namespace configuration
ocp4_workload_tenant_namespace_suffixes:
- suffix: datasphere             # Pre-deployed DataSphere for Section 1
- suffix: lab                    # Workspace for CLI/console exercises
- suffix: lab-helm               # Workspace for Helm exercise

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "10"
  requests.cpu: "5"
  limits.memory: 10Gi
  requests.memory: 5Gi
  requests.storage: 100Gi
  pods: "50"

# -------------------------------------------------------------------
# Babylon meta variables (dev overrides)
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    actions:
      start:
        disable: false
      stop:
        disable: false
      status:
        disable: false
      update:
        disable: false
