---
language: python
python:
  - "3.6"
install:
  - pip install yamllint
  - pip install pyyaml
  - pip install requests
  - curl -o agnosticv -L https://github.com/redhat-cop/agnosticv/releases/download/v0.4.1/agnosticv_linux_amd64
  - chmod +x agnosticv
script:
  - yamllint -c .yamllint .
  - ./.tests/static-tests.sh
