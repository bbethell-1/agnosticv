---
language: python
python:
  - "3.6"
branches:
  only:
    - master
    - /_$/  # put an underscore at the end of the branch name to force building
    - /^v\d+\.\d+\.\d+((a|b|rc)[0-9])?(\.dev[0-9]+)?$/  # we need to whitelist tags or nothing
install:
  - pip install yamllint
  - pip install pyyaml
  - pip install requests
  - curl -o agnosticv -L https://github.com/redhat-cop/agnosticv/releases/download/v0.5.0/agnosticv_linux_amd64
  - chmod +x agnosticv
script:
  - yamllint -c .yamllint .
  - ./.tests/static-tests.sh
