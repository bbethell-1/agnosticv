---
cloud_provider: ec2
key_name: ocp-workshop
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}
subdomain_base_suffix: .openshiftworkshop.com
HostedZoneId: Z1VOE6WJH8CKS3

cloud_tags:
  env_type: "{{ env_type }}"
  guid: "{{ guid }}"
  course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  purpose: "{{ purpose | d('unknown') }}"

agnosticv_meta:
  secrets:
    - openshiftbu

  params_to_variables:
    hostedzoneid: HostedZoneId
    region: aws_region
