---
# -------------------------------------------------------------------
# --- Catalog Item: ROSA
# --- Catalog: OpenShift Workshops
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa
#subdomain_base_suffix: .example.opentlc.com
#HostedZoneId: Z3IHLWJZOU9SRT
subdomain_base_suffix: dev.open.redhat.com
HostedZoneId: Z3RCW7RON7IYJW

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: false

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false
install_ipa_client: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    username: student_name
    nodecount: ''
  secrets:
  # ROSA Token
  - rosa-token
