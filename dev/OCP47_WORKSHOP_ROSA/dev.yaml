# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
# Not set uses calculated defaults from ocp4-cluster config
#master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t3a.medium

# -------------------------------------------------------------------
# Workload Override: ocp4_workload_le_certificates
# -------------------------------------------------------------------
ocp4_workload_le_certificates_install_certificates: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    scm_ref: rosa_dev
    type: agnosticd
