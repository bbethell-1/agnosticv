---
# Platform
platform: SPP

# Config
env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.1.9"

# Repos
osrelease: 4.1.0
repo_version: '4.1'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

# Instance Types
bastion_instance_type: t2.medium
master_instance_count: 3
master_instance_type: m5.xlarge
worker_instance_count: 4
worker_instance_type: m5.4xlarge

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: false
# student_name: lab_user
# student_password: rhte2019

# OCP Authentication
install_idm: htpasswd
admin_user: admin
admin_password: rhte2019
# Users are user1..200
user_count: 200
user_password: rhte2019

# Workloads to deploy on the cluster
# Workload Parameters
lets_encrypt_production: true
_terminal_image: quay.io/gpte-devops-automation/clientvm-terminal:0.33

# Default workloads are a YAML list
default_workloads:
- ocp4-workload-enable-lets-encrypt-certificates
- ocp4-workload-quay-operator
- ocp-workload-terminal

# Infra and Student Workloads are comma separated strings
infra_workloads: ""

# Run Student Workload to give all students cluster-admin permissions
student_workloads: ocp4-workload-rhte-a0007-shared

# Set to true to allow student-workloads with self-provisioner enabled
ignore_self_provisioners: true

# Tags to AWS Instances
cloud_tags:
- owner: wkulhane@redhat.com
  course_name: RHTE 2019 A0007 - Multi-Cluster OpenShift
  platform: "{{ platform | d('unknown') }}"
  purpose: RHTE 2019
  shared: "Yes"

# Idle settings
idle_after_deploy: 26
idle_after_start: 8