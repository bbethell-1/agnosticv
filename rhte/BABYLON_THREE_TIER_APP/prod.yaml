---
env_type:                     three-tier-app
email:                        babylon@example.com
cloud_provider:               ec2
aws_region:                   us-west-2
osrelease:                    3.9.51
key_name: opentlc_admin_backdoor

#####Env Sizing####
bastion_instance_type: "t3.small"
frontend_instance_type: "t3.small"
app_instance_type: "{{frontend_instance_type}}"
appdb_instance_type: "{{frontend_instance_type}}"
frontend_instance_count: 1
app_instance_count: 2
appdb_instance_count: 1
support_instance_count: 1

cloud_tags:
  env_type: "{{ env_type }}"
  guid: "{{ guid }}"
  course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  purpose: RHTE 2019
  shared: false

__meta__:
  deployer:
    scm_type:                 git
    scm_url:                  https://github.com/redhat-cop/agnosticd.git
    scm_ref:                  three-tier-app-prod-1.14 
    scm_tag_prefix:           three-tier-app-prod  # Dynamic lookup of latest tag
    type:                     agnosticd # default agnosticd
    entry_point:              ansible/main.yml
