---
purpose: load-testing

master_instance_count: 3
worker_instance_count: 20

infra_workloads: ocp4-workload-ccnrd

agnosticv_meta:
  agnosticd_git_tag_prefix: rhte-ocp4-shared-prod
  idle_after_deploy: 3
  idle_after_start: 15

__meta__:
  secrets:
    - gpte-rw-aws-creds

  catalog:
    namespace: openshift

    description: >-
      APAC RHTE Shared Cluster for Hands-on Lab S0002:"Advanced Cloud-Native App Development" 

    parameters:
      - name: osrelease
        description: "OCP version"
        value: 4.1.8

    tags:
      - babylon
      - ocp4

  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    scm_ref: rhte-apac
    type: agnosticd

  tower:
    organization: rhte
