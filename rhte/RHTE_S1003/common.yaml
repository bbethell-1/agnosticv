---
platform: SPP
env_type: ocp4-workshop
install_ipa_client: false
repo_method: file
software_to_deploy: none
install_student_user: true
student_password: r3dh4t1!
install_idm: htpasswd
admin_user: opentlc-mgr
install_ocp4: true
ocp4_installer_version: "4.1.8"
key_name: opentlc_admin_backdoor
ignore_self_provisioners: true
remove_self_provisioners: false
_opentlc_production_remove_self_provisioner: false

# osrelease points to the RHEL repos. 4.1.0 regardless of OCP version
osrelease: 4.1.0
cloudformation_retries: 0

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m4.xlarge
master_instance_count: 1
worker_instance_type: m4.4xlarge

# Default workloads are a YAML list. The commented out workloads are the default from env_vars
# Can selectively re-enable if necessary
default_workloads:
  - ocp-workload-terminal
  - ocp4-workload-opentlc-production
  #- ocp4-workload-infra-nodes
  #- ocp4-workload-sleep
  #- ocp4-workload-project-request-template
  #- ocp4-workload-enable-service-broker
  #- ocp4-workload-template-service-broker
  #- ocp4-workload-automation-broker
  #- ocp4-workload-logging
  #- ocp4-workload-nexus-operator
  #- ocp4-workload-enable-lets-encrypt-certificates

agnosticv_meta:
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads

