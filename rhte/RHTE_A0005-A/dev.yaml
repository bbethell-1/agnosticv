---
purpose: development
lets_encrypt_production: false
run_ocp_diagnostics: false
cloudformation_retries: 0
osrelease: 3.11.104

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m5.xlarge
infranode_instance_type: m5.4xlarge
node_instance_type: m5.xlarge
support_instance_type: m4.large  #  <-- was -->  t2.medium
worker_instance_count: 1
_infra_node_replicas: 1
node_instance_count: 1

idle_after_deploy: 4
idle_after_start: 6
