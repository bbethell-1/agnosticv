---
purpose: development

ocp_username: '{{ babylon_username }}'

# --- Use specific variable values for Development
target_host:
  # TODO: change this to the shared cluster
  ansible_host: bastion.shared-ocp4-demo.events.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  #ansible_ssh_private_key_content: "{{ target_host_ssh_private_key_content }}"
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem
  #ansible_ssh_extra_args:

__meta__:
  deployer:
    scm_type: git
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
    scm_tag_prefix: development  # Dynamic lookup of latest tag
    type: agnosticd # default agnosticd
    entry_point: ansible/main.yml
