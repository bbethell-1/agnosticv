---
purpose: development
lets_encrypt_production: false
run_ocp_diagnostics: false
cloudformation_retries: 0
osrelease: 3.11.49
ig_version: 1.3.0 

## I am leaving ig_version as 1.3.0 as I think this is commonly the version
## requested by presenters who do "A day in the life" presentations.
## It may need changing or even picking from CF

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m4.xlarge
infranode_instance_type: m4.4xlarge
node_instance_type: m4.xlarge
support_instance_type: t2.medium

idle_after_deploy: 2
idle_after_start: 8
