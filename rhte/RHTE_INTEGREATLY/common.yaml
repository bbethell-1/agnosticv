---
platform: SPP
env_type: ocp-workshop
key_name: opentlc_admin_backdoor
repo_method: file
software_to_deploy: openshift
install_ipa_client: false
install_idm: htpasswd
install_openshiftapb: true
install_lets_encrypt_certificates: true
lets_encrypt_production: true
ovs_plugin: networkpolicy
enable_workshops_catalog: true
install_student_user: true
student_password: r3dh4t1!
admin_user: opentlc-mgr

remove_self_provisioners: false
ignore_self_provisioners: true

run_ocp_diagnostics: false
cloudformation_retries: 0
osrelease: 3.11.43
ig_version: 1.4.1

## I am leaving ig_version as 1.3.0 as I think this is commonly the version
## requested by presenters who do "A day in the life" presentations.
## It may need changing or even picking from CF

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m4.4xlarge
infranode_instance_type: m4.4xlarge
node_instance_type: m4.4xlarge
support_instance_type: t2.medium

agnosticv_meta:
  secrets:
    - rhte

  params_to_variables:
    nodecount: node_instance_count
    infra_workloads: infra_workloads
    student_workloads: student_workloads
