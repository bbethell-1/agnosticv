---
ocp_workloads:
  - ocp-workload-openshift-applier


output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}

# The following line is commented: use a parameter for now, see common.yml
#ocp_username: "{{: requester_user.metadata.name :}}"

openshift_cluster_content:

  - object: projectrequest
    content:
      - name: Create namespace
        template: https://raw.githubusercontent.com/redhat-cop/openshift-applier/v2.1.1/tests/files/templates/projectrequest.yml
        params_from_vars:
          NAMESPACE: lab-{{ ocp_username }}-{{ guid }}
          NAMESPACE_DESCRIPTION: Sample namespace for student {{ ocp_username }}
          NAMESPACE_DISPLAY_NAME: Sample namespace for student {{ ocp_username }}
        action: "{{ applier_action }}"

  - object: cakephprequest
    content:
      - name: RoleBinding for user access
        template: https://raw.githubusercontent.com/redhat-gpte-devopsautomation/cakephp-ex/master/openshift/multi-project-templates/user-rolebinding.yml
        params_from_vars:
          CLUSTER_ROLE: admin
          NAMESPACE: lab-{{ ocp_username }}-{{ guid }}
          USER: "{{ ocp_username }}"
        action: "{{ applier_action }}"

      - name: Create cake-php mysql
        template: https://raw.githubusercontent.com/redhat-gpte-devopsautomation/cakephp-ex/master/openshift/templates/cakephp-mysql.yml
        params_from_vars:
          NAME: cakephp-mysql-{{ guid }}
        namespace: lab-{{ ocp_username }}-{{ guid }}
        action: "{{ applier_action }}"

target_host:
  # TODO: change this to the shared cluster
  ansible_host: bastion.shared-ocp4-demo.events.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  #ansible_ssh_private_key_content: "{{ target_host_ssh_private_key_content }}"
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem
  #ansible_ssh_extra_args:

silent: false

__meta__:
  deployer:
    scm_type: git
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
    scm_tag_prefix: development  # Dynamic lookup of latest tag
    type: agnosticd # default agnosticd
    entry_point: ansible/main.yml


