---
type: object
properties:
  __meta__:
    type: object
    additionalProperties: false
    properties:
      aws_sandboxed:
        type: boolean

      catalog:
        type: object
        additionalProperties: false
        properties:
          display_name:
            type: string

          description:
            type: string

          namespace:
            type: string

          multiuser:
            type: boolean

          tags:
            type: array
            items:
              type: string

          category:
            type: string

          icon:
            type: string

          labels:
            type: object
            additionalProperties:
              type: string

          keywords:
            type: array
            items:
              type: string

          parameters:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                description:
                  type: string

                formLabel:
                  type: string

                formGroup:
                  type: string

                formDisableCondition:
                  type: string

                name:
                  type: string

                value:
                  type: string

                openAPIV3Schema:
                  type: object

      deployer:
        type: object
        additionalProperties: false
        properties:
          virtualenv:
            type: string

          type:
            type: string
            # Some catalog items only consist of components and do not
            # describe anything to provision.
            nullable: true

          scm_ref:
            type: string

          scm_url:
            type: string

          scm_type:
            type: string
            enum:
              - git

          # See in https://github.com/redhat-gpte-devopsautomation/babylon_anarchy_governor
          git_tag_prefix:
            type: string

          entry_point:
            type: string

          entry_points:
            type: object
            additionalProperties: false
            properties:
              provision:
                type: string

              start:
                type: string

              stop:
                type: string

              destroy:
                type: string

              status:
                type: string

          callback_url_var:
            type: string

          callback_token_var:
            type: string


      parameters:
        type: array
        items:
          type: object
          required:
            - name
          properties:
            name:
              type: string

      secrets:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            namespace:
              type: string
            var:
              type: string

      tower:
        type: object
        additionalProperties: false
        properties:
          organization:
            type: string
            example: gpte

          inventory:
            type: string
            default: default

          run_group:
            type: string
            default: default

          action:
            type: string

      anarchy:
        type: object
        additionalProperties: false
        properties:
          namespace:
            type: string
            example: babylon-anarchy-test

      scheduler:
        type: object
        additionalProperties: false
        properties:
          data:
            type: object
            properties:
              annotations:
                type: object
                additionalProperties:
                  type: string
              uuid:
                type: string
          enable:
            type: boolean
          endpoint:
            type: string
            example: /api/v1/schedule
          url:
            type: string
            example: https://agnostics.apps.open.redhat.com

      components:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            display_name:
              type: string
            item:
              type: string
            name:
              type: string

      # TODO: define bookbag properly
      bookbag:
        type: object

      callback:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
          token:
            type: string

...
