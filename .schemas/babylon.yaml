---
type: object
properties:
  __meta__:
    type: object
    additionalProperties: false
    properties:
      allow_user_groups:
        description: >-
          List of user groups that are allowed to provision the item.
          Ability to view the catalog item is determined by the catalog namespace.
        type: array
        items:
          type: string

      aws_sandboxed:
        type: boolean

      catalog:
        type: object
        additionalProperties: false
        properties:
          display_name:
            type: string

          description:
            type: string

          namespace:
            type: string

          multiuser:
            type: boolean

          tags:
            type: array
            items:
              type: string

          category:
            type: string

          icon:
            type: string

          labels:
            type: object
            additionalProperties:
              type: string

          keywords:
            type: array
            items:
              type: string

          parameters:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                description:
                  type: string

                formLabel:
                  type: string

                formGroup:
                  type: string

                formDisableCondition:
                  type: string

                name:
                  type: string

                value:
                  type: string

                openAPIV3Schema:
                  type: object

          provision_requires_request:
            description: >-
              If set to a true value then environment provisioning will not occur for pooled items until
              a request is created for a pool item. Defaults to true if any requester parameters are
              configured.
            type: boolean

          requester_parameters:
            description: >-
              Parameters that set variables when a service is requseted.
              Presence of any requester parameters will cause provision to require a request.
              Values may be jinja2 template strings that reference requester_user and requester_identity.
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                value:
                  type: string

      deployer:
        type: object
        additionalProperties: false
        properties:
          virtualenv:
            type: string

          type:
            type: string
            # Some catalog items only consist of components and do not
            # describe anything to provision.
            nullable: true

          scm_ref:
            type: string

          scm_url:
            type: string

          scm_type:
            type: string
            enum:
              - git

          # See in https://github.com/redhat-gpte-devopsautomation/babylon_anarchy_governor
          git_tag_prefix:
            type: string

          entry_point:
            type: string

          entry_points:
            type: object
            additionalProperties: false
            properties:
              provision:
                type: string

              start:
                type: string

              stop:
                type: string

              destroy:
                type: string

              status:
                type: string

          callback_url_var:
            type: string

          callback_token_var:
            type: string

      lifespan:
        description: >-
          Lifespan policy to apply to catalog item services.
        type: object
        additionalProperties: false
        properties:
          default:
            description: >-
              Default lifespan in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3d" for 3 days.
            type: string
            pattern: ^[0-9]+[dhms]$
          maximum:
            description: >-
              Maximum lifespan which may be requested for a service relative to its creation.
              Specified in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3d" for 3 days.
            type: string
            pattern: ^[0-9]+[dhms]$
          relativeMaximum:
            description: >-
              Maximum lifespan which may be requested for a service relative to the present date and time.
              Specified in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3d" for 3 days.
            type: string
            pattern: ^[0-9]+[dhms]$

      parameters:
        type: array
        items:
          type: object
          required:
            - name
          properties:
            name:
              type: string

      runtime:
        description: >-
          Configuration for automatic stop and runtime extension.
        type: object
        additionalProperties: false
        properties:
          default:
            description: >-
              Default runtime in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3h" for 3 hours.
            type: string
            pattern: ^[0-9]+[dhms]$
          maximum:
            description: >-
              Maximum runtime in format of whole number followed by time unit: "d", "h", "m", or "s".
              Ex: "3h" for 3 hours.
            type: string
            pattern: ^[0-9]+[dhms]$

      secrets:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            namespace:
              type: string
            var:
              type: string

      tower:
        type: object
        additionalProperties: false
        properties:
          organization:
            type: string
            example: gpte

          inventory:
            type: string
            default: default

          run_group:
            type: string
            default: default

          action:
            type: string

      anarchy:
        type: object
        additionalProperties: false
        properties:
          namespace:
            type: string
            example: babylon-anarchy-test

      scheduler:
        type: object
        additionalProperties: false
        properties:
          data:
            type: object
            properties:
              annotations:
                type: object
                additionalProperties:
                  type: string
              uuid:
                type: string
          enable:
            type: boolean
          endpoint:
            type: string
            example: /api/v1/schedule
          url:
            type: string
            example: https://agnostics.apps.open.redhat.com

      components:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            display_name:
              type: string
            item:
              type: string
            name:
              type: string

      # TODO: define bookbag properly
      bookbag:
        description: >-
          Configuration for how bookbag should be deployed by the babylon lab-ui-manager.
          This should only be used for labs that do not deploy their own lab user interface
          during AgnosticD execution
        type: object
        additionalProperties: false
        properties:
          auth:
            description: >-
              Authentication configuration for bookbag. Default values disable
              authentication.
            type: object
            additionalProperties: false
            properties:
              password:
                description: >-
                  Value for AUTH_USERNAME environment variable in bookbag deployment.
                type: string
                default: ''
              user:
                description: >-
                  Value for AUTH_PASSWORD environment variable in bookbag deployment.
                type: string
                default: '*'
          image:
            description: >-
              Container image used for bookbag deployment. Mutually exclusive with imageBuild.
            type: string
          imageBuild:
            description: >-
              Configuration used to build image for bookbag deployment. Value is used a spec
              for OpenShift BuildConfig.
            type: object
            additionalProperties: false
            properties:
              source:
                type: object
                additionalProperties: false
                properties:
                  contextDir:
                    type: string
                    description: >-
                      contextDir specifies the sub-directory where the source code for the
                      application exists. This allows to have buildable sources in directory
                      other than root of repository.
                  dockerfile:
                    type: string
                    description: >-
                      dockerfile is the raw contents of a Dockerfile which should be built. When
                      this option is specified, the FROM may be modified based on your strategy
                      base image and additional ENV stanzas from your strategy environment will
                      be added after the FROM, but before the rest of your Dockerfile stanzas.
                      The Dockerfile source type may be used with other options like git - in
                      those cases the Git repo will have any innate Dockerfile replaced in the
                      context dir.
                  git:
                    type: object
                    additionalProperties: false
                    properties:
                      ref:
                        description: >-
                          ref is the branch/tag/ref to build.
                        type: string
                      uri:
                        description: >-
                          uri points to the source that will be built. The structure of the
                          source will depend on the type of build to run
                        type: string
                  type:
                    description: >-
                      type of build input to accept
                    type: string
                    enum:
                      - Git
              strategy:
                type: object
                additionalProperties: false
                properties:
                  dockerStrategy:
                    description: >-
                      dockerStrategy holds the parameters to the container image build strategy.
                    type: object
                    additionalProperties: false
                    properties:
                      buildArgs:
                        type: array
                        items:
                          description: >-
                            buildArgs contains build arguments that will be resolved in the Dockerfile.
                          type: object
                          additionalProperties: false
                          required:
                            - name
                            - value
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      dockerfilePath:
                        type: string
                        description: >-
                          dockerfilePath is the path of the Dockerfile that will be used to build the
                          container image, relative to the root of the context (contextDir). Defaults
                          to `Dockerfile` if unset.
                      env:
                        type: array
                        items:
                          description: >-
                            env contains additional environment variables you want to pass into a
                            builder container.
                          type: object
                          additionalProperties: false
                          required:
                            - name
                            - value
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      forcePull:
                        description: >-
                          forcePull describes if the builder should pull the images from registry
                          prior to building.
                        type: boolean
                      from:
                        description: >-
                          from is a reference to an DockerImage which overrides the FROM image in
                          the FROM image in the Dockerfile for the build. If the Dockerfile uses
                           multi-stage builds, this will replace the image in the last FROM
                          directive of the file.
                        type: object
                        additionalProperties: false
                        properties:
                          kind:
                            type: string
                            enum:
                              - DockerImage
                          name:
                            type: string
                            description: >-
                              Docker image reference.
                  sourceStrategy:
                    type: object
                    description: >-
                      sourceStrategy holds the parameters to the Source build strategy.
                    additionalProperties: false
                    properties:
                      env:
                        type: array
                        items:
                          description: >-
                            env contains additional environment variables you want to pass into a
                            builder container.
                          type: object
                          required:
                            - name
                            - value
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      forcePull:
                        description: >-
                          forcePull describes if the builder should pull the images from registry
                          prior to building.
                        type: boolean
                      from:
                        description: >-
                          from is reference to a DockerImage which should be used as the
                          source-to-image builder.
                        type: object
                        additionalProperties: false
                        properties:
                          kind:
                            type: string
                            enum:
                              - DockerImage
                          name:
                            type: string
                            description: >-
                              Docker image reference.
                  type:
                    type: string
                    description: >-
                      strategy defines how to perform a build.
                    enum:
                      - Docker
                      - Source
...
