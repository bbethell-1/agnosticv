---
type: object
x-merge:
  - path: /__meta__/access_control
    strategy: overwrite

  - path: /__meta__/ansible_controllers
    strategy: overwrite

  - path: /__meta__/catalog
    strategy: strategic-merge

  - path: /__meta__/components
    strategy: overwrite

  - path: /__meta__/deployer/execution_environment
    strategy: overwrite

  - path: /__meta__/sandboxes
    strategy: overwrite

properties:
  __meta__:
    type: object
    required:
      - asset_uuid
    additionalProperties: false
    properties:
      access_control:
        description: >-
          Access control settings.
          Access control is exposed through catalog item if configured and is also applied to requests which bypass the catalog by using the API.
        type: object
        additionalProperties: false
        properties:
          allow_groups:
            description: >-
              List of user group names to allow.
              Group names are OpenShift user groups.
              If set then only these groups are allowed to access the item.
              If unset then all groups are allowed.
            type: array
            items:
              type: string
          deny_groups:
            description: >-
              List of user group names to deny.
              Deny overrides allow and view-only.
            type: array
            items:
              type: string
          view_only_groups:
            description: >-
              List of user group names to allow to view catalog items but not order.
              Allow and deny both override view-only.
            type: array
            items:
              type: string

      anarchy:
        type: object
        additionalProperties: false
        properties:
          namespace:
            type: string
            example: babylon-anarchy-test

      ansible_control_plane:
        description: >-
          Options for Ansible control plane
        type: object
        additionalProperties: false
        properties:
          instance_groups:
            type: array
            items:
              type: string
          type:
            description: >-
              Type of the ansible backend.
            type: string
            default: tower
            enum:
              - tower
              - controller
          secret:
            description: >-
              Secret in OCP that contains the connection credentials.
              The name of a Secret object must be a valid DNS subdomain name.
            type: string
            pattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*'

      ansible_controllers:
        description: >-
          List of ansible controllers which should be used for scheduling deployer actions.
        type: array
        items:
          type: object
          required:
            - hostname
          properties:
            hostname:
              type: string

      ansible_controller_select_mode:
        description: >-
          Method to use to select ansible controller.
        type: string
        default: random
        enum:
          - balance
          - first-available
          - random

      controller_scheduler:
        description: >-
          Controller-Scheduler integration settings for intelligent controller
          selection based on real-time Prometheus metrics.
        type: object
        additionalProperties: false
        properties:
          url:
            description: >-
              URL of the controller-scheduler API. Required to activate.
            type: string
            format: uri
          prefer_labels:
            description: >-
              Soft preference — adds a score bonus to controllers matching
              these labels without excluding non-matching ones.
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
          require_labels:
            description: >-
              Hard filter — only controllers matching ALL labels are eligible.
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string

      asset_uuid:
        type: string
        format: uuid
        description: >-
          A universally unique identifier for this component.
        pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"

      aws_sandboxed:
        type: boolean

      catalog:
        type: object
        additionalProperties: false
        properties:
          category:
            type: string
            enum:
              - Demos
              - Labs
              - Open_Environments
              - Workshops
              - Brand_Events
          disable:
            description: >-
              Disable Babylon CatalogItem item and OpenShift Template generation for item.
            type: boolean
            default: false

          display_name:
            description: >-
              Display name for catalog item.
            type: string

          description:
            description: >-
              Description of catalog item.
            type: object
            required:
              - content
              - format
            properties:
              content:
                description: >-
                  Catalog item description content in HTML or AsciiDoc
                type: string
              format:
                description: >-
                  Description content format. May be "asciidoc" or "html".
                type: string
                enum:
                  - asciidoc
                  - html

          email:
            type: object
            properties:
              from:
                type: string

          externalUrl:
            description: >-
              External URL for catalog items that do not provision through Babylon.
            type: string

          supportLink:
            description: >-
              URL to the support channel (e.g. Slack) for the catalog item.
            type: string

          icon:
            description: >-
              Icon configuration.
            type: object
            additionalProperties: false
            properties:
              alt:
                description: >-
                  Alt text value for icon image.
                type: string
              style:
                description: >-
                  CSS overrides for icon image tag.
                type: object
              url:
                description: >-
                  URL for icon image.
                type: string

          keywords:
            type: array
            items:
              type: string

          labels:
            description: >-
              Labels for filtering catalog items.
              These labels appear in the catalog user interface sidebar.
              Labels keys and values must be valid kubernetes labels (https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set).
              For display purposes underscores are translated to spaces.
              A numeric suffix of the form "-0", "-1", etc. to assign multiple values for the same label property.
              For example, "Product-0: OpenShift", "Product-1: Ansible".
              The numeric suffix is hidden from the user catalog filter display.
            type: object
            additionalProperties:
              type: string
              pattern: "^([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$"

          messageTemplates:
            type: object
            additionalProperties: false
            properties:
              info:
                type: object
                additionalProperties: false
                properties:
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - asciidoc
              provisionFailed:
                description: >-
                  Configuration to send notification that provision failed.
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              provisionStarted:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              retirementScheduled:
                description: >-
                  Configuration to send notification that retirement date is approaching when
                  service will be automatically deleted.
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
                  timeIntervalBeforeRetirement:
                    description: >-
                      Configure time interval before automatic delete when to send notification.
                    type: string
              serviceDeleted:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              serviceReady:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              startComplete:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              startFailed:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              stopComplete:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              stopFailed:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              stopScheduled:
                type: object
                additionalProperties: false
                properties:
                  disable:
                    type: boolean
                  emailSubject:
                    type: string
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - jinja2
              user:
                description: >-
                  Message template to present to users of a multi-user service.
                type: object
                additionalProperties: false
                properties:
                  outputFormat:
                    type: string
                    enum:
                      - html
                  template:
                    type: string
                  templateFormat:
                    type: string
                    enum:
                      - asciidoc
          multiuser:
            description: >-
              Boolean flag to indicate if the catalog item provisions infrastructure for a multi-user catalog item.
              If set then a ".user" catalog item will be created in addition to the infra catalog item.
            default: false
            type: boolean

          reportingLabels:
            description: >-
              Reporting-specific labels used to group and filter catalog items for analytics and reporting purposes.
              These labels are not displayed in the Babylon UI but are essential for categorizing and analyzing catalog items.
              The keys and values must adhere to Kubernetes label syntax (https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set).
            type: object
            additionalProperties:
              type: string
              pattern: "^([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$"

          workshopLabUiRedirect:
            description: >-
              Boolean flag to indicate that by default workshops should redirect users to the lab interface URL, if available.
            default: false
            type: boolean

          workshopUiDisabled:
            description: >-
              Boolean flag to indicate if the catalog item shoud not support the ability to enable the Workshop User Interface.
            default: false
            type: boolean

          workshopUiEnabledByDefault:
            description: >-
              Boolean flag to indicate if the Workshop User Interface toggle should be enabled by default in the order form.
            default: false
            type: boolean

          workshopUiMaxInstances:
            description: >-
              Maximum number of instances supported in a single the workshop. 0 means no limit.
            default: 30 #Limit is defined here: https://github.com/redhat-cop/babylon/blob/main/agnosticv-operator/operator/agnosticvcomponent.py#L257
            type: number

          workshop_user_mode:
            description: >-
              Configure how workshop users are handled.
              "multi" - Multiple users may be provisioned and controlled with `num_users` parameter.
              "single" - Workshop provisions with a single user reported with `agnosticd_user_info`.
              "none" - Provision should not report users. If used in a workshop the environment itself is a workshop seat.
            type: string
            enum:
              - multi
              - single
              - none

          namespace:
            description: >-
              Namespace in which to create Babylon CatalogItem and OpenShift Template for infrastructure deployment.
            type: string

          num_users_parameter:
            description: >-
              Parameter name which controls the number of users when workshop_user_mode is "multi".
            default: "num_users"
            type: string

          parameters:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                annotation:
                  description: >-
                    Annotation to set for this form parameter.
                    If annotation is set then by default no deployer job variable is set unless a variable name is specifically configured.
                  type: string
                  pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$

                components:
                  description:
                    Configure to apply parameter to components in a multi-component items.
                    If omitted then parameter only applies to current component.
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        description: >-
                          Name of target component for parameter.
                          Must either be 'all', 'current', or name of component listed in '__meta__.components'
                        type: string

                description:
                  description: >-
                    Description of this parameter for the user to understand its function.
                  type: string

                formLabel:
                  description: >-
                    Form label for this parameter.
                  type: string

                formGroup:
                  description: >-
                    Form group label which should be used to group together parameters.
                    This is useful to group boolean checkboxes under a common heading.
                  type: string

                formDisableCondition:
                  description: >-
                    JavaScript statement used to determine whether a parameter should be disabled on the form.
                    Parameter values may be accessed as variables by parameter name.
                    If a true value is return then the form element for this parameter will appear disabled.
                  type: string

                formHideCondition:
                  description: >-
                    JavaScript statement used to determine whether a parameter should be hidden on the form.
                    Parameter values may be accessed as variables by parameter name.
                    If a true value is return then the form element for this parameter will not appear on the form.
                  type: string

                formRequireCondition:
                  description: >-
                    JavaScript statement used to detrimen when a parameter is required.
                    Parameter values may be accessed as variables by parameter name.
                  type: string

                name:
                  description: >-
                    Parameter name and default value for variable name.
                  type: string
                  pattern: ^[a-zA-Z_][a-z-A-Z_0-9]+$

                openAPIV3Schema:
                  description: >-
                    OpenAPIv3 schema used to validate parameter value.
                  type: object

                required:
                  description: >-
                    Boolean flag to indicate whether the parameter is required.
                  type: boolean

                validation:
                  description: >-
                    JavaScript statement used to validate form parameter value.
                    Parameter values may be accessed as variables by parameter name.
                    The function `check_salesforce_id` is available to validate Salesforce (SFDC) ids.
                    Code may return a javascript Error object with a message to show the user.
                    Example: `user_count * 10 < worker_instance_count || Error("Maximum of ten users per worker instance.")`
                  type: string

                sandboxCloudSelectors:
                  description: sandboxCloudSelectors used to validate the availability of the CI.
                  type: array
                  items:
                    type: object
                    required:
                      - annotation
                      - kind
                    properties:
                      annotation:
                        type: string
                        description: The name of the sandbox property (e.g., virt).
                      kind:
                        type: string
                        description: The type of sandbox environment (e.g., OcpSandbox).

                value:
                  description: >-
                    Default value for parameter.
                    If not specified then openApiV3Schema will be checked for default.
                  type: string

                variable:
                  description: >-
                    Name of variable to set for this parameter to override parameter name.
                    A variable may be explictly set to indicate that a variable should be set even if an annotation is also set for this parameter.
                    If set to null then no variable will be set for this parameter.
                  nullable: true
                  type: string
                  pattern: ^[a-zA-Z_][a-z-A-Z_0-9]+$

          provision_requires_request:
            description: >-
              If set to a true value then environment provisioning will not occur for pooled items until
              a request is created for a pool item. Defaults to true if any requester parameters are
              configured.
            type: boolean

          requester_parameters:
            description: >-
              Parameters that set variables when a service is requseted.
              Presence of any requester parameters will cause provision to require a request.
              Values may be jinja2 template strings that reference requester_user and requester_identity.
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                value:
                  type: string

          tags:
            type: array
            items:
              type: string

          terms_of_service:
            description:
              HTML content for terms of service to appear on the service request form.
            type: string

      components:
        description: >-
          Configuration for multi-component items.
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            display_name:
              description: >-
                Display name to show in interfaces and communications for this component.
              type: string
            item:
              description: >-
                Reference within AgnosticV to another component in the form
                "ACCOUNT/NAME" or "ACCOUNT/NAME/STAGE". If STAGE is not specified
                then it will match the current item.
                For example if current item is defined in "foo/bar/dev.yaml"
                and specifies "foo/base" then this will reference
                "foo/base/dev.yaml". If "foo/base/prod" is used then
                it will reference "foo/base/prod.yaml".
              type: string
            name:
              type: string
            parameter_values:
              description: >-
                Static parameter values for component or use templates to translate parameters values.
              type: object
            propagate_provision_data:
              description: >-
                Configuration to pass values from provision data from component to set variables for subsequent provisions.
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  name:
                    description: >-
                      Name of provision data item to find in component.
                    type: string
                  var:
                    description: >-
                      Variable to set in provision.
                    type: string
            when:
              description: >-
                Condition when component should be included.
                Condition in ansible style "when" condition string which may reference parameters values.
                For example, if this item has a parameter "base_cloud_provider" then this value could be:
                "base_cloud_provider == 'ec2'"
              type: string

      deployer:
        type: object
        additionalProperties: false
        properties:
          actions:
            description: >-
              Action configuration for deployer.
            type: object
            additionalProperties: false
            properties:
              destroy:
                description: >-
                  Configuration for how to destroy a provisioned service.
                type: object
                additionalProperties: false
                properties:
                  ansible_control_plane:
                    description: >-
                      Override ansible control plane properties for destroy.
                    type: object
                    properties:
                      instance_groups:
                        type: array
                        items:
                          type: string
                  disable:
                    description: >-
                      Boolean flag to disable destroy.
                      This should only be set on environments that are automatically cleaned up by some mechanism other than running the deployer.
                    type: boolean
                    default: false
                  entry_point:
                    description: >-
                      Ansible playbook to execute for destroy.
                    default: ansible/destroy.yml
                    type: string
                  extra_vars:
                    description: >-
                      Extra vars vars to pass with destroy execution to distinguish between different actions when the same entry point is used for different actions.
                    type: object
                    default:
                      ACTION: destroy
                  time_estimate:
                    description: >-
                      Time estimate for how long destroy should take.
                      Time format in format examples: "1h", "90m".
                    pattern: ^[0-9]+[hms]$
                    type: string
              provision:
                description: >-
                  Configuration for how to provision a service.
                type: object
                additionalProperties: false
                properties:
                  ansible_control_plane:
                    description: >-
                      Override ansible control plane properties for provision.
                    type: object
                    properties:
                      instance_groups:
                        type: array
                        items:
                          type: string
                  disable:
                    description: >-
                      Boolean flag to disable provision.
                      This should only be set on environments that are automatically created by the sandbox API and do not need a deployer at all.
                    type: boolean
                    default: false
                  entry_point:
                    description: >-
                      Playbook to execute to provision service.
                    default: anisble/main.yml
                    type: string
                  extra_vars:
                    description: >-
                      Extra vars vars to pass with provision execution to distinguish between different actions when the same entry point is used for different actions.
                    type: object
                    default:
                      ACTION: provision
                  time_estimate:
                    description: >-
                      Time estimate for how long provision should take.
                      Time format in format examples: "1h", "90m".
                    pattern: ^[0-9]+[hms]$
                    type: string
              start:
                description: >-
                  Configuration for how to start a provisioned service.
                type: object
                additionalProperties: false
                properties:
                  ansible_control_plane:
                    description: >-
                      Override ansible control plane properties for start.
                    type: object
                    properties:
                      instance_groups:
                        type: array
                        items:
                          type: string
                  disable:
                    description: >-
                      Boolean flag to disable start action.
                    type: boolean
                    default: false
                  entry_point:
                    description: >-
                      Ansible playbook to execute for start.
                    default: ansible/lifecycle_entry_point.yml
                    type: string
                  extra_vars:
                    description: >-
                      Extra vars vars to pass with start execution to distinguish between different actions when the same entry point is used for different actions.
                    default:
                      ACTION: start
                    type: object
                  time_estimate:
                    description: >-
                      Time estimate for how long start should take.
                      Time format in format examples: "1h", "90m".
                    pattern: ^[0-9]+[hms]$
                    type: string
              status:
                description: >-
                  Configuration for how to get status for a provisioned service.
                type: object
                additionalProperties: false
                properties:
                  ansible_control_plane:
                    description: >-
                      Override ansible control plane properties for status.
                    type: object
                    properties:
                      instance_groups:
                        type: array
                        items:
                          type: string
                  disable:
                    description: >-
                      Boolean flag to disable status action.
                    type: boolean
                    default: false
                  entry_point:
                    description: >-
                      Ansible playbook to execute for status.
                    default: ansible/lifecycle_entry_point.yml
                    type: string
                  extra_vars:
                    description: >-
                      Extra vars vars to pass with status execution to distinguish between different actions when the same entry point is used for different actions.
                    default:
                      ACTION: status
                    type: object
                  time_estimate:
                    description: >-
                      Time estimate for how long status should take.
                      Time format in format examples: "1h", "90m".
                    pattern: ^[0-9]+[hms]$
                    type: string
              stop:
                description: >-
                  Configuration for how to stop a provisioned service.
                type: object
                additionalProperties: false
                properties:
                  ansible_control_plane:
                    description: >-
                      Override ansible control plane properties for stop.
                    type: object
                    properties:
                      instance_groups:
                        type: array
                        items:
                          type: string
                  disable:
                    description: >-
                      Boolean flag to disable stop action.
                    type: boolean
                    default: false
                  entry_point:
                    description: >-
                      Ansible playbook to execute for stop.
                    default: ansible/destroy.yml
                    type: string
                  extra_vars:
                    description: >-
                      Extra vars vars to pass with stop execution to distinguish between different actions when the same entry point is used for different actions.
                    default:
                      ACTION: stop
                    type: object
                  time_estimate:
                    description: >-
                      Time estimate for how long stop should take.
                      Time format in format examples: "1h", "90m".
                    pattern: ^[0-9]+[hms]$
                    type: string
              update:
                description: >-
                  Configuration for how to updtae a provisioned service.
                type: object
                additionalProperties: false
                properties:
                  ansible_control_plane:
                    description: >-
                      Override ansible control plane properties for update.
                    type: object
                    properties:
                      instance_groups:
                        type: array
                        items:
                          type: string
                  disable:
                    description: >-
                      Boolean flag to disable update.
                    type: boolean
                    default: false
                  entry_point:
                    description: >-
                      Ansible playbook to execute for update.
                    type: string
                    default: ansible/update.yml
                  extra_vars:
                    description: >-
                      Extra vars vars to pass with update execution to distinguish between different actions when the same entry point is used for different actions.
                    type: object
                    default:
                      ACTION: destroy
                  time_estimate:
                    description: >-
                      Time estimate for how long update should take.
                      Time format in format examples: "1h", "90m".
                    pattern: ^[0-9]+[hms]$
                    type: string

          credentials:
            description: >-
              Credentials which must be pre-defined in the Ansible control plane.
            type: array
            items:
              type: string
          execution_environment:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: >-
                  The name of the Execution Environment to use. The EE must be present in Controller. Mutually exclusive with 'image'.

              image:
                type: string
                description: The URL of the image.
                example: registry.redhat.io/ansible-automation-platform-21/ee-minimal-rhel8:latest

              pull:
                type: string
                description: The pull stragegy for the EE. To be used only with 'image', not 'name'.
                default: missing
                enum:
                  - always
                  - missing
                  - never

              private:
                type: boolean
                description: Whether the registry is private or not. If the registry is private, a credential must exist in AAP2 to access it.
                default: false

          # See in https://github.com/rhpds/babylon_anarchy_governor
          git_tag_prefix:
            type: string

          scm_ref:
            type: string

          scm_ref_var:
            description: If set then this value will be used to set an extra var in the deployer job whose value is the scm_ref or resolved ref from the git tag prefix.
            type: string

          scm_type:
            type: string
            enum:
              - git

          scm_url:
            type: string

          type:
            type: string
            # Some catalog items only consist of components and do not
            # describe anything to provision.
            nullable: true
            enum:
              - agnosticd
              - ansible-workshops

          virtualenv:
            type: string

      lifespan:
        description: >-
          Lifespan policy to apply to catalog item services.
        type: object
        additionalProperties: false
        properties:
          default:
            description: >-
              Default lifespan in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3d" for 3 days.
            type: string
            pattern: ^[0-9]+[dhms]$
          maximum:
            description: >-
              Maximum lifespan which may be requested for a service relative to its creation.
              Specified in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3d" for 3 days.
            type: string
            pattern: ^[0-9]+[dhms]$
          relativeMaximum:
            description: >-
              Maximum lifespan which may be requested for a service relative to the present date and time.
              Specified in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3d" for 3 days.
            type: string
            pattern: ^[0-9]+[dhms]$

      owners:
        description: >-
          Who owns this catalog item.
          Who can be called upon to fix breaking catalog items?
          Who should be notified in case of major catalog item changes?
        type: object
        additionalProperties: false
        required:
          - maintainer
        properties:

          maintainer:
            description: >-
              Mandatory.
              Who are the primary maintainers of this catalog item.
              There can be one or more maintainers. Maintainers must be Red Hat employees.
            type: array
            minItems: 1
            items:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  description: >-
                    email of the maintainer.
                  type: string
                name:
                  description: >-
                    Full name of the maintainer.
                  type: string

          instructions:
            description: >-
              Optional.
              Who is responsible for instructions (Showroom) for this catalog item needs work.
              There can be one or more instruction owners. Instruction owners can be Red Hat employees or external contributors.
            type: array
            minItems: 1
            items:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  description: >-
                    email of the maintainer.
                  type: string
                name:
                  description: >-
                    Full name of the maintainer.
                  type: string

          notes:
            description: >-
              Optional.
              Free form text field to add any other relevant information to this catalog item's
              ownership structure.
            type: string

          ops:
            description: >-
              Optional.
              Who from our Ops team is responsible for this catalog item.
              There can be one or more ops team owners. Ops owners must be Red Hat employees.
            type: array
            minItems: 1
            items:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  description: >-
                    email of the maintainer.
                  type: string
                name:
                  description: >-
                    Full name of the maintainer.
                  type: string

          sme:
            description: >-
              Mandatory.
              Who are the SMEs that can help if this catalog item needs work.
              There can be one or more SMEs. SMEs must be Red Hat employees.
            type: array
            minItems: 1
            items:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  description: >-
                    email of the maintainer.
                  type: string
                name:
                  description: >-
                    Full name of the maintainer.
                  type: string

          stakeholder:
            description: >-
              Optional.
              Who is interested in this catalog item. This can include collaborators from the business unit,
              marketing, engineering or any other individual who should be consulted before making major changes
              to this catalog item.
              There can be one or more stakeholders. Instruction owners can be Red Hat employees or external contributors.
            type: array
            minItems: 1
            items:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  description: >-
                    email of the maintainer.
                  type: string
                name:
                  description: >-
                    Full name of the maintainer.
                  type: string

      require_end_to_end_test:
        description: >-
          Specify if the end-to-end tests must be executed on each PR against the integration cluster.

        type: boolean
        default: false

      runtime:
        description: >-
          Configuration for automatic stop and runtime extension.
        type: object
        additionalProperties: false
        properties:
          default:
            description: >-
              Default runtime in format of whole number followed by time unit: "d", "h", "m", or "s".
              For example, "3h" for 3 hours.
            type: string
            pattern: ^[0-9]+[dhms]$
          maximum:
            description: >-
              Maximum runtime in format of whole number followed by time unit: "d", "h", "m", or "s".
              Ex: "3h" for 3 hours.
            type: string
            pattern: ^[0-9]+[dhms]$

      sandbox_api:
        description: >-
          Sandbox API related configuration.
        type: object
        additionalProperties: false
        properties:
          actions:
            description: Actions configuration for sandbox API
            type: object
            additionalProperties: false
            properties:
              provision:
                type: object
                additionalProperties: false
                properties:
                  enable:
                    type: boolean
                    default: true
                  disable:
                    type: boolean
              destroy:
                type: object
                additionalProperties: false
                properties:
                  enable:
                    type: boolean
                    default: true
                  disable:
                    type: boolean
                  catch_all:
                    type: boolean
                    default: true
                    description: |-
                      Control wether the Sandbox API is enough to cleanup everything. By default, it's true.
                      It means if the deployer fails in AAP, it'll be ignored and the sandbox API will cleanup everything after and the AnarchySubject will be deleted
                      If the Controller job must succeed for a service to be considered delete, turn this to false in agnosticv __meta__.sandbox_api.actions.destroy.catch_all
              start:
                type: object
                additionalProperties: false
                properties:
                  enable:
                    type: boolean
                  disable:
                    type: boolean
              stop:
                type: object
                additionalProperties: false
                properties:
                  enable:
                    type: boolean
                  disable:
                    type: boolean
              status:
                type: object
                additionalProperties: false
                properties:
                  enable:
                    type: boolean
                  disable:
                    type: boolean

          reservation:
            type: string
            pattern: '^[\w\d_-]+$'

      sandbox_host:
        description: >-
          Configuration for catalog item acting as a host for tenant items.
        type: object
        additionalProperties: false
        required:
          - annotations
          - max_placements
        properties:
          annotations:
            description: >-
              Annotations used to onboard provisioned clusters to the sandbox API.
              The annotation `purpose` is required on provision.
            properties:
              cloud:
                description: >-
                  Value specifying which cloud the host cluster is provisioned on.
                type: string
                enum:
                  - aws-dedicated-shared
                  - cnv-dedicated-shared
              lab:
                description: >-
                  Primary selector used by tenant to select the correct host cluster.
                  This value must match the short name of the cluster.
                  For example, `ai-qs-rag-cluster` must specify `ai-qs-rag`.
                type: string
              purpose:
                description: >-
                  Purpose value specified on provision to configure tenant audience.
                  May be one of `dev`, `events`, `partners`, or `prod`.
                type: string
                enum:
                  - dev
                  - events
                  - partners
                  - prod
            required:
              - cloud
              - lab
              - purpose
            additionalProperties:
              type: string
          deployer_admin_sa_token_refresh_interval:
            description: >-
              Configure service account token refresh.
              Defaults to `3h` if unset.
            type: string
            pattern: "^[0-9]+[hm]$"
          deployer_admin_sa_token_target_var:
            description: >-
              Variable to set in tenant deployment.
              Defaults to `openshift_cluster_admin_token` if unspecified.
            type: string
            pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
          deployer_admin_sa_token_ttl:
            description: >-
              Configure service account token refresh.
              Defaults to `6h` if unset.
            type: string
            pattern: "^[0-9]+[hm]$"
          max_placements:
            description: >-
              Maximum number of tenant placements supported by this host.
            type: integer
            minimum: 1
          max_cpu_usage_percentage:
            description: >-
              Maximum CPU utilization on host to allow tenant placement.
            type: integer
            default: 100
            minimum: 1
          max_memory_usage_percentage:
            description: >-
              Maximum memory utilization on host to allow tenant placement.
            default: 90
            type: integer
          quota_required:
            description: >-
              Configure whether tenant sandbox request must include quota.
            type: boolean
            default: false
      sandboxes:
        type: array
        items:
          allOf:
            # Common sandbox properties
            - type: object
              properties:
                annotations:
                  type: object
                  description: >-
                    A dictionary of strings to add to the sandbox accounts as annotations.
                  additionalProperties:
                    type: string
                  example:
                    purpose: "testing"
                cloud_selector:
                  type: object
                  description: >-
                    A dictionary of strings to select the cloud provider using annotations
                  additionalProperties:
                    type: string
                var:
                  type: string
                  description: >-
                    The name of the variable to set in the deployer job for the sandbox account.

            # Properties specific to sandbox kind
            - oneOf:
                # AwsSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - AwsSandbox
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    var:
                      type: string

                # AzureSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - AzureSandbox
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    var:
                      type: string

                # MaaSSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - MaaSSandbox
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    models:
                      type: string
                    virtual_key_count:
                      type: string
                      default: "1"
                    var:
                      type: string

                # DNSSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - DNSSandbox
                    sandbox_suffix:
                      type: string
                      description: >-
                        The suffix to add to the namespace name for the DNSSandbox and future new sandboxes implementations.
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    var:
                      type: string

                # IBMResourceGroupSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - IBMResourceGroupSandbox
                    resourcegroup_suffix:
                      type: string
                      description: >-
                        The suffix to add to the namespace name for the IBMResourceGroupSandbox.
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    var:
                      type: string

                # SSLSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - SSLSandbox
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    var:
                      type: string

                # OcpSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - OcpSandbox
                    limit_range:
                      type: object
                      description: |-
                        LimitRange to be applied to the namespace of the OcpSandbox
                        The way limit range is applied depends on how the target OpenShift shared cluster is configured.
                        By default, if a limit range value is missing, the default limit range of the shared cluster is applied to the namespace.
                      example:
                        spec:
                          default:
                            cpu: "10"
                            memory: "4Gi"
                          defaultRequest:
                            cpu: "1"
                            memory: "2Gi"
                    namespace_suffix:
                      type: string
                      description: >-
                        The suffix to add to the namespace name for the OcpSandbox.
                    quota:
                      type: object
                      description: |-
                        The quota to apply to the OpenShift namespace.
                        Quota to be applied to the namespace of the OcpSandbox
                        The way quota is applied depends on how the target OpenShift shared cluster is configured.
                        By default, if a quota value is missing, the default quota of the shared cluster is applied to the namespace.

                        If the shared cluster is configured with StrictDefaultSandboxQuota, the default sandbox quota should be strictly enforced. If set to true, the default sandbox quota will be enforced as a hard limit. Requested quota not be allowed to exceed the default. By default it's false.

                        If set to false, the default sandbox-quota will be updated
                        to the requested quota even if some values are greater.
                      additionalProperties:
                        type: string
                      example:
                        pods: "10"
                        limits.cpu: "10"
                        limits.memory: "20Gi"
                        requests.cpu: "10"
                        requests.memory: "20Gi"
                        requests.storage: "50Gi"
                        requests.ephemeral-storage: "50Gi"
                        limits.ephemeral-storage: "50Gi"
                        persistentvolumeclaims: "10"
                        services: "10"
                        services.loadbalancers: "10"
                        services.nodeports: "10"
                        secrets: "10"
                        configmaps: "10"
                        replicationcontrollers: "10"
                        resourcequotas: "10"
                    tenant_cluster:
                      type: object
                      description: >-
                        Configuration to reference another component which provides the cluster
                        used by a tenant component.
                      properties:
                        item:
                          type: string
                          description: >-
                            Reference within AgnosticV to the cluster component in the form
                            "ACCOUNT/NAME" or "ACCOUNT/NAME/STAGE". If STAGE is not specified
                            then it will match the tenant.
                            For example if tenant item is defined in "foo/bar-tenant/dev.yaml"
                            and specifies "foo/bar-cluster" then this will reference
                            "foo/bar-cluster/dev.yaml". If "foo/bar-cluster/prod" is used then
                            it will reference "foo/bar-cluster/prod.yaml".

                            If "tenant_cluster" is specified then "cloud_selector" may be omitted
                            as the value from the referenced item's __meta__.sandbox_host.annotations
                            will be applied.
                      required:
                        - item
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    cloud_preference:
                      type: object
                      description: >-
                        A dictionary of strings to prioritize the cloud provider using annotations.
                        Each key-value pair represents a priority rule with an implicit weight. Matching clusters will be prioritized.
                      additionalProperties:
                        type: string
                    var:
                      type: string
                    # Cluster relation properties
                    alias:
                      type: string
                      description: Specifies an alias to be used for the cluster_relation property
                    cluster_condition:
                      type: string
                      description: Use DSL instead relation/reference
                      example: "child('A') && same('D')"
                    no_namespace:
                      type: boolean
                      default: false
                      example: false
                      description: |
                        When set to true, no namespace, service account, RBAC, quota, limit range,
                        keycloak user will be created on the cluster.
                        Only the cluster information (API URL, ingress domain, console URL) and the
                        deployer-admin service account token are returned if any.
                        This is incompatible with `keycloak: yes` in `cloud_selector`.

                # RosaSandbox
                - type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - RosaSandbox
                    # Common properties
                    annotations:
                      type: object
                    cloud_selector:
                      type: object
                    var:
                      type: string
      scheduler:
        type: object
        additionalProperties: false
        properties:
          data:
            type: object
            properties:
              annotations:
                type: object
                additionalProperties:
                  type: string
              uuid:
                type: string
          enable:
            type: boolean
          endpoint:
            type: string
            example: /api/v1/schedule
          url:
            type: string
            example: https://agnostics.apps.open.redhat.com

      secrets:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            namespace:
              type: string
            var:
              type: string

      slack:
        type: object
        additionalProperties: false
        properties:
          support:
            type: string
            description: Slack channel for support (e.g., "#forum-cloudarch-workshop")
            pattern: '^#.*'
        required:
          - support

      tower:
        type: object
        additionalProperties: false
        properties:
          action:
            type: string
          inventory:
            type: string
            default: default
          maximum_job_count:
            type: integer
            minimum: 10
            maximum: 500
          organization:
            type: string
            example: gpte
          run_group:
            type: string
            default: default
          timeout:
            description: >-
              The amount of time (in seconds) to run before the task is canceled in Tower.
            default: 14400

            type: integer

      zerotouchAccess:
        description: >-
          Zerotouch configuration options.
        type: object
        additionalProperties: false
        properties:
          enable:
            description: >-
              Boolean to indicate whether an item should be available in the zerotouch interface on zero.rhdp.net.
            type: boolean
          lifespan:
            description: >-
              Lifespan for item when ordered through zerotouch interface.
              Format is whole number followed by time unit: "d", "h", "m", or "s".
              For example, "90m" for ninety minutes.
            type: string
            pattern: ^[0-9]+[dhms]$
          limits:
            description: >-
              Usage limits when ordered through the zerotouch interface.
              Limits are applied across all items so, for example, if a limit is
              five per twenty-four hour period then the user will be unable to order
              this item if they have had five of any zerotouch items in the last twenty-four
              hour period.
            type: object
            additionalProperties: false
            properties:
              user:
                description: >-
                  Limits to apply based on the SSO user ordering the item.
                  Each unit is a number and a time period.
                  The usage must be under all configured limits to be allowed.
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - count
                    - timePeriod
                  properties:
                    count:
                      type: integer
                    timePeriod:
                      type: string
                      pattern: ^[0-9]+[dhms]$
...
