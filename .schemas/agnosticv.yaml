---
type: object
properties:
  agnosticv_meta:
    type: object
    additionalProperties: false
    properties:

      sandboxed:
        type: boolean

      nuke_sandbox:
        type: boolean

      params_to_variables:
        type: object
        additionalProperties:
          type: string

      secrets:
        type: array
        items:
          type: string

      idle_after:
        type: integer
        format: int32
        minimum: 1

      idle_after_deploy:
        type: integer
        format: int32
        minimum: 1

      idle_after_start:
        type: integer
        format: int32
        minimum: 1

      agnosticd_git_repo:
        type: string

      agnosticd_git_tag_prefix:
        type: string

      agnosticd_git_ref:
        type: string

      babylon:
        type: object
        additionalProperties: false
        properties:
          kubeconfig:
            type: string
          version:
            type: string

      deploy_with:
        type: string
        enum:
          - babylon
          - local

      virtualenv:
        type: string

      ansible_additional_args:
        type: string

      scheduler:
        type: object
        additionalProperties: false
        properties:
          data:
            type: object
            properties:
              annotations:
                type: object
                additionalProperties:
                  type: string
              uuid:
                type: string
          enable:
            type: boolean
          endpoint:
            type: string
            example: /api/v1/schedule
          url:
            type: string
            example: https://agnostics.apps.open.redhat.com
...
