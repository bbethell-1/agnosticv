---
#include /includes/catalog-icon-osc.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-aro-version.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/sandbox-api.yaml
#include /includes/runtime-unlimited.yaml

# ----------------------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Understanding Confidential Containers - Workshop on ARO
# ----------------------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

# ------------------------------------------------------
# Azure Properties
# ------------------------------------------------------

install_aro: true
azure_deploy_bastion: true
aro_install_helm: true

rhel_sku: "9_3"

# Extra packages to install
common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven
  - postgresql
  - httpd-tools
  - skopeo
  - tmux
  - podman

infra_workloads:
  - ocp4_workload_showroom
  - ocp4_workload_coco_on_aro

# CoCo workload configuration
ocp4_workload_coco_on_aro_pull_verity_image: false
ocp4_workload_coco_on_aro_coco_tools_image: "quay.io/openshift_sandboxed_containers/coco-tools:0.5.1"

# Azure Sandbox API
azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"
azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
azure_user_data:
  azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
  azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
  azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"
  azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
  sandbox_name: "{{ azure_sandbox.credentials[0].pool_subscription }}"
  guid: "{{ guid }}"
agnosticd_passthrough_user_data: |
  {{ azure_user_data }}

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Confidential Containers on ARO Workshop!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy: true
showroom_deploy_shared_cluster_enable: false
showroom_git_repo: https://github.com/confidential-devhub/workshop-on-ARO-showroom
showroom_git_ref: main
showroom_tls_provider: letsencrypt

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0e14da90-d0b4-49d6-a8f6-704b0d5c3835
  sandboxes:
    - kind: AzureSandbox
      cloud_selector:
        purpose: production
        location: "{{ job_vars.azure_region }}"
      var: azure_sandbox
  owners:
    maintainer:
      - name: Patrick Rutledge
        email: prutledg@redhat.com
    instructions:
      - name: Emanuele Giuseppe Esposito
        email: eesposito@redhat.com
      - name: Judd Maltin
        email: jmaltin@redhat.com
      - name: Robert Bohne
        email: rbohne@redhat.com
      - name: David Holder
        email: dholder@redhat.com
    sme:
      - name: Patrick Rutledge
        email: prutledg@redhat.com
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    parameters:
      - name: azure_region
        description: Azure Region to Provision Environment
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: westus
          enum:
          # The following regions have support for DC* and enough (100) quota for master/worker nodes:
            - northeurope # snp, tdx
            - eastasia # snp
            - westus # snp
            # - centralus # tdx, but retired
            # - eastus # not enough v5 quota (only v3, v4)
      - name: open_env_azure_install_aro_master_vm_size
        description: Azure Master VM Size
        formLabel: Master VM Size
        required: true
        openAPIV3Schema:
          type: string
          default: Standard_D8s_v5
          enum:
            - Standard_D8s_v5
            # - Standard_D8s_v6
      - name: open_env_azure_install_aro_worker_vm_size
        description: Azure Worker VM Size
        formLabel: Worker VM Size (pick 8 for OAI)
        required: true
        openAPIV3Schema:
          type: string
          default: Standard_D4s_v5
          enum:
            - Standard_D4s_v5
            - Standard_D8s_v5
            # - Standard_D4s_v6
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Understanding Confidential Containers - Workshop on ARO
    category: Labs
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
      SLA: Community
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
