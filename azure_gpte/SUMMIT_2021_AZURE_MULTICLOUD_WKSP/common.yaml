---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Red Hat Summit 2021
# --- Multi-cloud Application Integration
# --- course_id: rhs2021-multi0002
# --- CPBU: appsvc
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

platform: RHPDS

#Which config and what software to use (highest level)

env_type: ocp4-cluster
software_to_deploy: openshift4

bastion_instance_image: RHEL84GOLD-latest

# Azure cloud specific vars
# sp, tenant, sub, password are in the secret below
# azure_region is passed by the UI form
cloud_provider: azure
#az_dnszone_resource_group: gpte-infra
remote_user: azure
ansible_user: azure
# rhel_sku: 7-LVM

# Satellite repo config (these are in secrets):
# set_repositories_satellite_org: Red_Hat_GPTE_Labs
# set_repositories_satellite_activationkey: gpte-rhel8

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# OpenShift 4 (ocp4-cluster) specific vars
windows_vm_count: 0
cluster_dns_zone: azure.opentlc.com
ocp4_base_domain: azure.opentlc.com
basesuffix: .azure.opentlc.com

# RHPDS stuff not part of aro config
# key_name: ocpkey
# cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
install_idm: htpasswd
# admin_user: opentlc-mgr
# admin_password: r3dh4t1!
# run_janitor: false

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
# Disable default agnosticd_user_info for ocp4_workload_authentication
ocp4_workload_authentication_enable_user_info_data: false
ocp4_workload_authentication_enable_user_info_messages: false
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: azure
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_remove_kubeadmin: true

# Machine size and count depend upon the number of users
# Scale workers for 3 users per node with a minimum of 3 nodes
master_instance_count: 3

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4-workload-dil-serverless
  #- ocp4_workload_le_certificates

#aro_compute_count: worker_instance_count

# Workshop Participant User Configuration
# --- Student User on Bastion
install_student_user: false

# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: openshift

# Scale workers for 7 users per node with a minimum of 3 nodes
worker_instance_count: "{{ [( num_users / 7) | round(0, 'ceil') | int, 3] | max }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    region: azure_region
    aro_compute_count: worker_instance_count

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 102dcd24-2003-4c01-8f7f-37cd78009aab
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Multi-Cloud Workshop - Azure
    category: Workshops
    keywords:
      - workshop
      - cloud
      - azure
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: Cloud_Services_BU
      Product_Family: Red_Hat_Cloud
    parameters: []
  owners:
    - email: eshortis@redhat.com
      name: Evan Shortiss
    - email: hguerrer@redhat.com
      name: Hugo Guerrero
    - email: btison@redhat.com
      name: Bernard Tison
  secrets:
    - name: azure_ocp4_gpte
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: gpte
      namespace: gpte
    - name: satellite-rhel8-latest-ha
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
