---
#include /includes/secrets/showroom-shared-cluster1.yaml
#include /includes/parameters/azure-region2.yaml
#include /includes/sandbox-api.yaml

purpose: development
# env_type: test-empty-config
# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
ocp4_workload_showroom_content_git_repo_ref: showroom-dev

cost_center: "542"

agnosticd_passthrough_user_data: |
  {{ {}
   | combine({
      "include_arc_content": true
   } if include_arc_content else {})
  }}

# agnosticd_passthrough_user_data: |
#   {{ {}
#    | combine({
#       "something_for_aad": "foo",
#       "something_else": "bar"
#    } if preconfigure_aad else {})
#    | combine({
#       "something_for_arc": maybe_reference_another_variable
#    } if include_arc_content else {})
#   }}
# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  sandboxes:
  - kind: AzureSandbox
    cloud_selector:
      purpose: production
    var: azure_sandbox
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - description: "WARNING: Works for Internal Red Hat Users ONLY"
      formGroup: Features
      formLabel: Include Arc Content (Works for Internal Red Hat Users ONLY)
      name: include_arc_content
      openAPIV3Schema:
        default: true
        type: boolean
    - name: showroom_deploy_shared_cluster_enable
      description: Disable showroom on azure
      formLabel: Showroom
      required: true
      formHideCondition: true == true
      openAPIV3Schema:
        type: boolean
        default: true
