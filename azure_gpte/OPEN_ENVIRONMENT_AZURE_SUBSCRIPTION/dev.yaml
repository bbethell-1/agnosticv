---
#include /includes/secrets/showroom-shared-410.yaml
#include /includes/parameters/azure-region2.yaml
#include /includes/ee-multicloud-dev.yaml

purpose: development

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
ocp4_workload_showroom_content_git_repo_ref: showroom-dev

agnosticd_passthrough_user_data: |
  {{ {}
   | combine({
      "include_arc_content": true
   } if include_arc_content else {})
  }}

# agnosticd_passthrough_user_data: |
#   {{ {}
#    | combine({
#       "something_for_aad": "foo",
#       "something_else": "bar"
#    } if preconfigure_aad else {})
#    | combine({
#       "something_for_arc": maybe_reference_another_variable
#    } if include_arc_content else {})
#   }}
# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - description: Include Arc Content
      formGroup: Features
      formLabel: Include Arc Content
      name: include_arc_content
      openAPIV3Schema:
        default: true
        type: boolean
