purpose: development
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
ocp4_workload_showroom_content_git_repo_ref: showroom-dev
cost_center: '542'
agnosticd_passthrough_user_data: "{{ {}\n | combine({\n    \"include_arc_content\": true\n } if include_arc_content else {})\n}}\n"
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - description: 'WARNING: Works for Internal Red Hat Users ONLY'
      formGroup: Features
      formLabel: Include Arc Content (Works for Internal Red Hat Users ONLY)
      name: include_arc_content
      openAPIV3Schema:
        default: true
        type: boolean
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
