---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
# -----------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure Subscription Based Blank Open Environment
# -----------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: True

cloud_provider: azure

# Azure pool to use
az_pool_id: "01"

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-04-06
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Azure Subscription Based Blank Open Environment
    category: Open_Environments
    keywords:
    - azure
    - open
    - openenv
    - azureopen
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
  secrets:
  - name: azure_gpte
    namespace: gpte
  lifespan:
    default: 7d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
