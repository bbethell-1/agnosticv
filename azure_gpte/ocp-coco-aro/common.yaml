---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/azure-region2.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/secrets/azure_opentlc.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Confidential Containers on Redhat OCP & MS Azure
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: azure
student_name: lab-user
student_password: "{{ common_password }}"
ocp4_cluster_azure_remove_bastion_credentials: false

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18.30"
ocp4_installer_use_dev_preview: false


# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes


# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
# showroom_deploy: true
# showroom_deploy_shared_cluster_enable: false
# showroom_git_repo: https://github.com/confidential-devhub/workshop-on-ARO-showroom
# showroom_git_ref: main
# showroom_tls_provider: letsencrypt

# -------------------------------------------------------------------
# Student Workloads (YAML List)
# -------------------------------------------------------------------
student_workloads: []

# Workload variables #
num_users: 1
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_multi_user: "{{ true if num_users | int > 1 else false }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2025_10_23

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:16] }}"
common_user_password: openshiftredhat12
common_admin_password: "{{ common_password }}"

# Extra packages to install
common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven
  - postgresql
  - httpd-tools

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
# Show kubeadmin password
ocp4_cluster_show_access_user_info: true
install_ftl: false

# -------------------------------------------------------------------
# Azure cloud specific vars
# -------------------------------------------------------------------

# Enable RHEL Gold Image
rhel_publisher: redhat
rhel_offer: rhel-byos
rhel_sku: rhel-lvm96-gen2
#rhel_sku: rhel-lvm81-gen2
rhel_version: latest
rhel_plan_name: rhel-lvm96-gen2
#rhel_plan_name: rhel-lvm81-gen2
rhel_plan_publisher: redhat
rhel_plan_product: rhel-byos

# OpenShift 4 (ocp4-cluster) specific vars
windows_vm_count: 0
cluster_dns_zone: azure.opentlc.com
ocp4_base_domain: azure.opentlc.com
basesuffix: .azure.opentlc.com
bastion_public_hostname: bastion-{{ guid }}.{{ azure_region }}.cloudapp.azure.com

master_instance_type_family: "Standard"
master_instance_count: 1
master_instance_version: "v5"

worker_instance_count: 0

master_instance_type_size: "D16s"
master_instance_type: "{{ master_instance_type_family }}_{{ master_instance_type_size }}_{{ master_instance_version }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication # all segments
  - ocp4_workload_le_certificates
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom
  - ocp4_workload_web_terminal

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
install_idm: htpasswd

ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: openshift-nfd
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: ""
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""
# ------------------------------------------------
# NVIDIA GPU Operator
# ------------------------------------------------
nvidia_gpu_operator_namespace: nvidia-gpu-operator
nvidia_gpu_operator_channel: stable
nvidia_gpu_operator_automatic_install_plan_approval: true
nvidia_gpu_operator_starting_csv: ""
nvidia_gpu_operator_wait_for_deploy: true
nvidia_gpu_operator_use_catalog_snapshot: false
nvidia_gpu_operator_catalogsource_name: ""
nvidia_gpu_operator_catalog_snapshot_image: ""
nvidia_gpu_operator_catalog_snapshot_image_tag: ""

# -------------------------------------------------------------------
# ocp4_workload_ossm
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_ossm_es: false
ocp4_workload_ossm_jaeger: false
ocp4_workload_ossm_kiali: false

ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: ""

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.20

ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------
azure_user_data:
  sandbox_name: "{{ azure_sandbox.credentials[0].pool_subscription }}"

agnosticd_passthrough_user_data: |
  {{ azure_user_data
   | combine({
      "azure_ai_info_url": azure_ai_info_url
   } if azure_ai_info_url else {})
  }}

ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/confidential-containers-azure-showroom.git #To be updated to the actual repo later
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

 -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/coco-azure-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_health_retries: 2

# Configure Helm values to force using Helm instead of kustomize-envvar plugin
ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: "{{ ocp4_workload_user_base }}"


# -------------------------------------------------------------------
# Workload: ocp4_workload_serverless
# -------------------------------------------------------------------

# ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_eventing: false
ocp4_workload_serverless_install_serving: false
# ocp4_workload_serverless_use_catalog_snapshot: false

