---
purpose: rhpds-prod

install_lets_encrypt_certificates: false

# OpenShift Installer version
ocp4_installer_version: "4.9"

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: infra_workloads
      - name: worker_instance_count
      - name: student_name
  secrets:
    - name: ocp4_token
      namespace: gpte
    - name: azure_ocp4_gpte
      namespace: gpte
    - name: gpte
      namespace: gpte
  deployer:
    git_tag_prefix: ocp4-on-azure-iaas-prod
    virtualenv: azure-ansible-2.9
