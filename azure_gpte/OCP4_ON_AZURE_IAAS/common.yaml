---
#include /includes/catalog-icon-openshift.yaml
# -------------------------------------------------------------------
# --- Catalog: Openshift Demos
# --- Catalog Item: OpenShift 4.7 on Azure Self-Managed
# -------------------------------------------------------------------

platform: RHPDS

env_type: ocp4-cluster
software_to_deploy: openshift4

# Azure cloud specific vars
# sp, tenant, sub, password are in the secret below
# azure_region is passed by the UI form
cloud_provider: azure
#az_dnszone_resource_group: gpte-infra
remote_user: azure
ansible_user: azure
# rhel_sku: 7-LVM

# OpenShift 4 (ocp4-cluster) specific vars
windows_vm_count: 0
cluster_dns_zone: azure.opentlc.com
ocp4_base_domain: azure.opentlc.com
basesuffix: .azure.opentlc.com

# RHPDS stuff not part of aro config
# key_name: ocpkey
# cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
install_idm: htpasswd
# admin_user: opentlc-mgr
# admin_password: r3dh4t1!
# run_janitor: false

# Student Information
install_student_user: true
# Users are user1..200
# user_password: openshift

# Authentication
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 50
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
# lets_encrypt_production: true
install_lets_encrypt_certificates: false

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates

# OpenShift Installer version
ocp4_installer_version: "4.9.11"

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    username: student_name
    #infra_workloads: infra_workloads
    aro_compute_count: worker_instance_count

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 on Azure Self-Managed
    category: Demos
    icon:
      alt: "Cloud Native"
      url: "https://gpte-public.s3.amazonaws.com/babylon-catalog/Cloud_Native.svg"
    keywords:
    - workshop
    - azure
    - ocp
    - ocp49
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_Container_Platform
      ##OpenShift_Version: "4.9"
      Provider: PFE
    parameters:
    - name: student_name
    - name: worker_instance_count
      description: Number of Worker Instances
      openAPIV3Schema:
        default: 2
        type: integer
        minimum: 2
        maximum: 9
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: azure_ocp4_gpte
    namespace: gpte
  - name: gpte
    namespace: gpte
