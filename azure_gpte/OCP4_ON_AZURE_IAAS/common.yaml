---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/parameters/azure-region2.yaml
#include /includes/catalog-icon-azure.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/azure_opentlc.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# --- Catalog: Openshift Demos
# --- Catalog Item: OpenShift 4 on Azure Self-Managed
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.12.12"
ocp4_installer_use_dev_preview: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# Azure cloud specific vars
# -------------------------------------------------------------------

# Enable RHEL Gold Image
rhel_publisher: redhat
rhel_offer: rhel-byos
rhel_sku: rhel-lvm81-gen2
rhel_version: latest
rhel_plan_name: rhel-lvm81-gen2
rhel_plan_publisher: redhat
rhel_plan_product: rhel-byos

# OpenShift 4 (ocp4-cluster) specific vars
windows_vm_count: 0
cluster_dns_zone: azure.opentlc.com
ocp4_base_domain: azure.opentlc.com
basesuffix: .azure.opentlc.com

worker_instance_type: "Standard_D4s_v5"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"

master_instance_type_family: "Standard"
master_instance_version: "v5"

master_instance_type_size: >-
  {{ 'D8s' if worker_instance_count|int <= 10
  else 'D16s' if worker_instance_count|int <= 20
  else 'D64s'
  }}
master_instance_type: "{{ master_instance_type_family }}_{{ master_instance_type_size }}_{{ master_instance_version }}"

common_packages_el9: "{{ common_packages_el8 }}"

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  asset_uuid: 85608a9f-d532-484a-934c-01991e9a399c
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 on Azure Self-Managed
    category: Demos
    keywords:
    - workshop
    - azure
    - ocp
    - ocp412
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
    parameters:
    - name: worker_instance_count
      description: Number of worker nodes
      formLabel: Number of worker nodes
      openAPIV3Schema:
        default: 2
        type: integer
        minimum: 2
        maximum: 9
      validation: >-
        worker_instance_count == 2 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than two requires a valid SalesForceID.')
  secrets:
  - name: satellite-rhel-8-and-9-latest-ha
    namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
