agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    node_count: aro_compute_count
    region: azure_region

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    parameters:
      - name: aro_compute_count
      - name: azure_region
      - name: email
