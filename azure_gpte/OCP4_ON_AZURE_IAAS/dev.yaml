---
purpose: development

# Machine Type for control plane (master) nodes
master_instance_type: Standard_D16s_v3

# Machine Type for worker nodes
worker_instance_type: Standard_D8s_v3

# OpenShift Installer version
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.12.12"

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    region: azure_region

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
