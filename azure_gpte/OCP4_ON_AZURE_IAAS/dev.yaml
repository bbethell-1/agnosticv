---
purpose: development

# OpenShift Installer Version
ocp4_installer_version: "4.9.11"


# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    node_count: aro_compute_count
    region: azure_region

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    parameters:
      - name: aro_compute_count
      - name: azure_region
      - name: email
  secrets:
    - name: azure_gpte
      namespace: gpte
  deployer:
    scm_ref: development
