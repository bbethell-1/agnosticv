---
purpose: rhpds-test

install_lets_encrypt_certificates: false

# OpenShift Installer version
ocp4_installer_version: "4.7.1"

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-on-azure-iaas-test
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
    aro_compute_count: worker_instance_count
    #letsencrypt: install_lets_encrypt_certificates
  secrets:
  - azure_ocp4_gpte
  - ocp4_token
  - gpte

__meta__:
  catalog:
    namespace: gpte
    parameters:
    - name: infra_workloads
    - name: worker_instance_count
    - name: student_name
  deployer:
    virtualenv: azure-ansible-2.9
    git_tag_prefix: ocp4-on-azure-iaas-test
  secrets:
  - namespace: gpte
    name: ocp4_token
  - namespace: gpte
    name: azure_ocp4_gpte
  - namespace: gpte
    name: gpte
