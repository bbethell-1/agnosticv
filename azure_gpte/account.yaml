---
cloud_provider: azure

azure_user_domain: azure.opentlc.com

cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"

agnosticv_meta:
  secrets:
    - azure_gpte
  params_to_variables:
    hostedzoneid: HostedZoneId
    region: azure_region
    platform: platform
    course_id: course_name
    appversion: ig_version
