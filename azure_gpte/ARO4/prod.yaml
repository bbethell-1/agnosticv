---
purpose: rhpds-prod

install_lets_encrypt_certificates: false


# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    node_count: aro_compute_count
    region: azure_region
    user: student_name
# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: aro_compute_count
      - name: azure_region
      - name: email
      - name: student_name
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: rhpds-prod
  deployer:
    scm_ref: oocp-workshop-43-aro-prod-0.8
    virtualenv: ansible2.9-python3.6-2021-01-22
