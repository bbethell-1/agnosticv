---
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    node_count: aro_compute_count
    region: azure_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: aro_compute_count
      - region: azure_region
      - name: email
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: azure_gpte
      namespace: gpte
