---
purpose: rhpds-test


install_lets_encrypt_certificates: false

# OpenShift Installer version
ocp4_installer_version: "4.7.1"


# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: aro_compute_count
      - name: azure_region
      - name: email
      - name: student_name
  secrets:
    - name: gpte
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
    - name: azure_gpte
      namespace: gpte
  deployer:
    scm_ref: ocp-workshop-43-aro-0.9
    virtualenv: ansible2.9-python3.6-2021-01-22 #azure-ansible-2.9
