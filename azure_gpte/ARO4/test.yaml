---
purpose: rhpds-test

install_lets_encrypt_certificates: false

# OpenShift Installer version
ocp4_installer_version: "4.7.1"

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------


agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    node_count: aro_compute_count
    region: azure_region

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: aro_compute_count
      - name: azure_region
      - name: email
      - name: student_name
      - name: admin_user
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: rhpds-test
  deployer:
    git_tag_prefix: ocp-workshop-43-aro-prod
    virtualenv: ansible2.9-python3.6-2021-01-22
