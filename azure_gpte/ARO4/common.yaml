---
# -------------------------------------------------------------------
# --- Catalog: Openshift Demos
# --- Catalog Item: Azure Red Hat OpenShift on Openshift 4
# -------------------------------------------------------------------

platform: RHPDS

#Which config and what software to use (highest level)
env_type: aro
software_to_deploy: none

#Azure cloud specific vars
#sp, tenant, sub, password are in the secret below
#azure_region is passed by the UI form
cloud_provider: azure
remote_user: azure
ansible_user: azure

#Azure Red Hat OpenShift 4 (aro) specific vars
#aro_compute_count is passed by the UI form
aro_version: "4"
aro_admin_group: b61baaf0-da29-4d17-836d-00e205f02aa6
az_function_hostname: rhpdsappreghandler.azurewebsites.net
az_dnszone_resource_group: none

#RHPDS stuff not part of aro config
key_name: ocpkey
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
run_janitor: false

#default_workloads:
#  - ocp4-workload-project-request-template
#  - ocp-workload-terminal
#  - ocp4-workload-enable-lets-encrypt-certificates

agnosticv_meta:
  virtualenv: azure-ansible-2.9-latest
  params_to_variables:
    region: azure_region
    node_count: aro_compute_count
  secrets:
  - azure_gpte
  - ocp4_token

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
    - name: aro_compute_count
    - name: azure_region
    - name: email
    - name: student_name
  secrets:
  - name: azure_gpte
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: agnostics-api-mgr-access
    var: agnostics_mgr_access
  - name: gpte-db
    namespace: gpte
    var: gpte_db
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials
