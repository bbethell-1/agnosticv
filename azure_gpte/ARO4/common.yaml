---
platform: RHPDS

#Which config and what software to use (highest level)
env_type: aro
software_to_deploy: none

#Azure cloud specific vars
#sp, tenant, sub, password are in the secret below
#azure_region is passed by the UI form
cloud_provider: azure
remote_user: azure
ansible_user: azure

#Azure Red Hat OpenShift 4 (aro) specific vars
#aro_compute_count is passed by the UI form
aro_version: "4"
aro_admin_group: b61baaf0-da29-4d17-836d-00e205f02aa6
az_function_hostname: rhpdsappreghandler.azurewebsites.net
az_dnszone_resource_group: none

#RHPDS stuff not part of aro config
key_name: ocpkey
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
run_janitor: false

#default_workloads:
#  - ocp4-workload-project-request-template
#  - ocp-workload-terminal
#  - ocp4-workload-enable-lets-encrypt-certificates

agnosticv_meta:
#  virtualenv: azure-ansible-latest
  params_to_variables:
    azure_region: azure_region
    aro_compute_count: worker_instance_count

  secrets:
    - azure_gpte
#    - ocp4_token
