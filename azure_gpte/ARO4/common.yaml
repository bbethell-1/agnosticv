---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/azure-region.yaml
# -------------------------------------------------------------------
# --- Catalog: Openshift Demos
# --- Catalog Item: Azure Red Hat OpenShift on Openshift 4
# -------------------------------------------------------------------

platform: RHPDS

#Which config and what software to use (highest level)
env_type: aro
software_to_deploy: none

#Azure cloud specific vars
#sp, tenant, sub, password are in the secret below
#azure_region is passed by the UI form
cloud_provider: azure
remote_user: azure
ansible_user: azure

#Azure Red Hat OpenShift 4 (aro) specific vars
#aro_compute_count is passed by the UI form
aro_version: "4"
aro_admin_group: b61baaf0-da29-4d17-836d-00e205f02aa6
az_function_hostname: rhpdsappreghandler.azurewebsites.net
az_dnszone_resource_group: none

#RHPDS stuff not part of aro config
key_name: ocpkey
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
run_janitor: false

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  params_to_variables:
    region: azure_region
    node_count: aro_compute_count
  secrets:
  - azure_gpte
  - ocp4_token
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Azure Red Hat OpenShift on Openshift 4
    category: Demos
    keywords:
    - workshop
    - azure
    - aro
    - aro4
    - ocp49
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_Container_Platform
      ##OpenShift_Version: "4.7"
      Provider: PFE
    parameters:
    - name: email
    - name: student_name
    - name: aro_compute_count
      description: Number of Compute Nodes
      openAPIV3Schema:
        default: 3
        type: integer
        minimum: 1
        maximum: 9
  secrets:
  - name: azure_gpte
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: agnostics-api-mgr-access
    var: agnostics_mgr_access
  - name: gpte-db
    namespace: gpte
    var: gpte_db
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials
