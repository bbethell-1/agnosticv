---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog Item: ARO ILT
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure

agnosticd_open_environment: true

cloud_provider: azure

# User that is allowed for CICD (must be a gmail.com account)
#open_env_azure_cicd_user: jenkins.sfo01@gmail.com

requirements_content:
  collections:
    - name: amazon.aws
      version: 4.0.0
    - name: community.general
      version: 4.8.1
    - name: containers.podman
      version: 1.10.1

# Extra packages to install
common_extra_packages:
  - java-17-openjdk
  - maven

common_packages_el8:
  - at
  - bash-completion
  - vim-enhanced
  - wget
  - bind-utils
  - python3.9
  - python3-devel
  - tree
  - unzip
  - tmux

common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - python3.9
  - python3-devel
  - tree
  - unzip
  - vim-enhanced
  - wget
  - tmux

install_aro: false
azure_bastion_enable: true
update_packages: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/aro-ilt.git
showroom_deploy: true
showroom_tab_services:
  - single_terminal
  - docs_aro

# Azure Active Directory domain
azure_user_domain: azure.opentlc.com

# Dynamic DNS zone in Azure
cluster_dns_zone: azure.opentlc.com

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: AC8A4445-8017-4A27-930B-238AD7B88CCF
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ARO ILT
    category: Labs
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
    parameters: []
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
    - name: azure_gpte
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: ansible2.9-python3.6-2022-07-27
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
