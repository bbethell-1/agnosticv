# -------------------------------------------------------------------
# --- Catalog Item: ARO ILT SUBSCRIPTION BASED
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# Azure pool to use
az_pool_id: "01"
# Azure Active Directory domain
azure_user_domain: azure.opentlc.com

requirements_content:
  collections:
    - name: amazon.aws
      version: 4.0.0
    - name: community.general
      version: 4.8.1
    - name: containers.podman
      version: 1.10.1

# Extra packages to install
#common_extra_packages:
#  - java-17-openjdk
#  - maven

common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - python3.9
  - python3-devel
  - tree
  - unzip
  - vim-enhanced
  - wget
  - tmux
  - git
  - podman
  - python-devel
  - systemd-container
  - unzip

update_packages: true
install_aro: false
azure_deploy_bastion: true

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/aro-ilt.git
showroom_deploy: false
showroom_tab_services:
  - single_terminal
  - docs_aro

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 9F1C8F20-AD97-4929-A752-EF90D5513D27
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ARO ILT - Subscription Based
    category: Labs
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
    parameters: []
  lifespan:
    default: 5d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
    - name: azure_redhat0
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
