---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: aap2-on-azure
agnosticd_open_environment: True
cloud_provider: azure
bastion_instance_image: RHEL84GOLD-latest
cluster_dns_zone: azure.opentlc.com
enable_aap_email: true
az_pool_id: "00"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Bastion and Student Info
# -------------------------------------------------------------------

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# student_password not set -> generate random password
student_password: "{{ common_password }}"

# Student is allowed to sudo and switch to root
student_sudo: true

# Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  secrets:
  - azure_redhat0
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
# bookbag_deploy: true
# bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/hol-aap2-on-azure
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-devopsautomation/hol-aap2-on-azure
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true
    # Image to use for bookbag
    #image: quay.io/org/repo:tag
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-04-06
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Hands on with AAP2 on Azure
    category: Open_Environments
    keywords:
    - azure
    - open
    - openenv
    - azureopen
    - ansible
    - aap
    labels:
      Product_Family: Red_Hat_Automation
      Product: Red_Hat_Ansible_Automation_Platform
      Provider: RHPDS
  secrets:
  - name: azure_redhat0
    namespace: gpte
  - name: bookbag-deployer-shared-na46
    namespace: gpte
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 2d
  runtime:
    default: 9999h
    maximum: 9999h
