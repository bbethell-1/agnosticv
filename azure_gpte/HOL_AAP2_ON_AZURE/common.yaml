---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
#include /includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: aap2-on-azure
agnosticd_open_environment: True
cloud_provider: azure
enable_aap_email: true
az_pool_id: "00"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/hol-aap2-on-azure
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e0bc84d8-4153-472a-9994-2e1c29a92d8c
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-devopsautomation/hol-aap2-on-azure
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true
    # Image to use for bookbag
    #image: quay.io/org/repo:tag
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Hands on with AAP2 on Azure
    category: Open_Environments
    keywords:
    - azure
    - open
    - openenv
    - azureopen
    - ansible
    - aap
    labels:
      Product_Family: Red_Hat_Automation
      Product: Red_Hat_Ansible_Automation_Platform
      Provider: RHDP
  secrets:
  - name: azure_redhat0
    namespace: gpte
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 2d
  runtime:
    default: 9999h
    maximum: 9999h
