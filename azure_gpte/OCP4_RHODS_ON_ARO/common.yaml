---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Base RHODS on ARO (Azure Red Hat OpenShift)
# -------------------------------------------------------------------

platform: RHPDS

env_type: ocp4-rhods-aro-config

agnosticd_open_environment: True

cloud_provider: azure

# Azure Active Directory domain
azure_user_domain: azure.opentlc.com

# Dynamic DNS zone in Azure
cluster_dns_zone: azure.opentlc.com

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

# Enable ARO installation functions
install_aro: true

#ARO master, worker size/count and version
az_aro_version: 4.11.26
worker_vm_size: Standard_D16s_v3
worker_count: 3
master_vm_size: Standard_D8s_v3

# -------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_managed_ocp_httpasswd_create: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
install_common: true
common_packages_el9:
  - python39
  - git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: fc138cb2-55e6-4d4b-8364-8567501a45c6
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Base RHODS on ARO (Azure Red Hat OpenShift)
    category: Workshops
    keywords: []
    labels:
      Product_Family: Red_Hat_Openshift
      Product: Azure_Red_Hat_Openshift
      Provider: RHDP
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 1
          maximum: 20
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
    - name: azure_gpte
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true

    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
      pull: missing
