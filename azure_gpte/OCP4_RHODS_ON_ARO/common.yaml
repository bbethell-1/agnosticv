# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Base RHOAI on ARO
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

# Azure pool to use
az_pool_id: "01"

# Enable ARO installation functions
install_aro: true

# ------------------------------------------------------
# Azure Properties
# ------------------------------------------------------
azure_deploy_bastion: true
aro_install_helm: true

rhel_sku: "9_3"

# Extra packages to install
common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven
  - postgresql
  - httpd-tools

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Azure Red Hat OpenShift Workshop!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy: false
showroom_deploy_shared_cluster_enable: false
showroom_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
showroom_git_ref: showroom

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.14_2024_07_22

# -------------------------------------------------------------------
# Common Admin Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
# - ocp4_workload_le_certificates
#  - ocp4_workload_machinesets
# - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_serverless
  - ocp4_workload_openshift_ai
# - ocp4_workload_gitea_operator
# - ocp4_workload_argocd_bootstrap
  - ocp4_workload_authentication
#  - ocp4_workload_showroom

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

# Remove Workloads when deleting the cluster
remove_workloads_bastion:
#  - ocp4_workload_rad_ai_dev_roadshow


# -------------------------------------------------------------------
# Role: open-env-azure-install-aro
# -------------------------------------------------------------------
open_env_azure_install_aro_master_vm_size: "Standard_D8s_v3"
open_env_azure_install_aro_worker_count: 3
open_env_azure_install_aro_worker_vm_size: "Standard_D4s_v3"
open_env_azure_install_aro_worker_vm_disk_size: 128

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true

# Add a MachineSet for AWS Bare Metal instances
# To add another group of worker nodes - with autoscaling enabled add
# the following:
#
ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    autoscale: true
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 3
    role: worker-gpu
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule
    instance_type: "{{ gpu_instance_type }}"

#------------------------------------------------
# ocp4_workload_nvidia_gpu_setup variables
