---
purpose: test

az_aro_version: '4.18.26'

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_openshift_gitops
  - ocp4_workload_web_terminal
  - ocp4_workload_kubevirt
  - ocp4_workload_mtv
  - ocp4_workload_oadp_gitops
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_nmstate
#  - ocp4_workload_virt_roadshow_vms
  - ocp4_workload_virt_roadshow_vmware
  - ocp4_workload_virt_roadshow_multi_user
  - ocp4_workload_virt_network_config
  - ocp4_workload_showroom

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  deployer:
    git_tag_prefix: aro-virt-roadshow
  access_control:
    allow_groups:
      - rhpds-devs-virt
  catalog:
    parameters:
      - name: azure_region
        description: Azure Region with Sufficient v5 Quota
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: centralus
          enum:
            - centralus
            - canadacentral
      - name: open_env_azure_install_aro_master_vm_size
        description: Azure Master VM Size
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: Standard_D8s_v5
          enum:
            - Standard_D8s_v3
            - Standard_D8s_v5
            - Standard_D8s_v6
      - name: open_env_azure_install_aro_worker_vm_size
        description: Azure Master VM Size
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: Standard_D16s_v5
          enum:
            - Standard_D16s_v3
            - Standard_D16s_v5
            - Standard_D16s_v6
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 1
          maximum: 20
