---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token_icr.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/sandbox-api.yaml

#include /includes/secrets/fvmw-vcenter-access.yaml
# -----------------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: ARO Virt Roadshow
# -----------------------------------------------------------------------------

# This is created by request from the Hybrid Platforms Business Unit. It is as
# close as possible a replication of the CNV-based Experience OpenShift
# Virtualization Roadshow.
#
# NOTE about regions:  Only centralus and canadacentral are have adequate quota
# of instance types v5 with "Boost" to support the ARO Virt installation.

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

# Enable ARO installation functions
azure_deploy_bastion: true
rhel_sku: "9_6"
install_aro: true
az_aro_version: '4.18.26'
aro_install_helm: true

# Azure Sandbox API variables
azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"
azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
azure_user_data:
  azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
  azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
  azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"
  azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
  sandbox_name: "{{ azure_sandbox.credentials[0].pool_subscription }}"
  guid: "{{ guid }}"

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
        Welcome to the Experience OpenShift Virtualization Roadshow with
                            Azure Red Hat OpenShift!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_openshift_gitops
  - ocp4_workload_web_terminal
  - ocp4_workload_kubevirt
  - ocp4_workload_mtv
  - ocp4_workload_oadp_gitops
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_nmstate
  - ocp4_workload_virt_roadshow_vms
  - ocp4_workload_virt_roadshow_fvmw
  - ocp4_workload_virt_roadshow_multi_user
  - ocp4_workload_virt_network_config
  - ocp4_workload_showroom

# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads:
  - ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_03_03
install_ftl: false
ocp4_workload_user_count: "{{ num_users | int }}"
ocp4_workload_user_base: user
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_user_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_aro_upgrade
# -------------------------------------------------------------------
ocp4_workload_aro_upgrade_target_version: "4.18.23"
ocp4_workload_aro_upgrade_channel: "stable-4.18"

# -------------------------------------------------------------------
# Role: open-env-azure-install-aro
# -------------------------------------------------------------------
open_env_azure_install_aro_master_vm_size: "Standard_D8s_v5"
# three compute nodes until num_users > 10, then add 1 for every three users
open_env_azure_install_aro_worker_count: "{{ [((num_users | int * 0.3) | round(0, 'ceil') | int) , 3] | max }}"

open_env_azure_install_aro_worker_vm_size: "Standard_D16s_v5"
open_env_azure_install_aro_worker_vm_disk_size: 128

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count | default('1') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -----------------------------------
# OpenShift Data Foundations Operator
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.18
ocp4_workload_openshift_data_foundation_catalogsource_setup: false
ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_ceph_storage_class_name: managed-csi
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 500Gi
ocp4_workload_openshift_data_foundation_ceph_storage_system_deploy_timeout: 1500
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1500

# Install Ceph Toolbox
ocp4_workload_openshift_data_foundation_install_toolbox: false

# --------------------------------
# Storage Classes
# --------------------------------
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/aro-virt-roadshow-gitops.git
#ocp4_workload_gitops_bootstrap_repo_revision: v1.0.1 <-- This is summit2025 tag
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
  roadshow_vms:
    enableNodeSelector: false
    nodeSelector: "cpu-feature.node.kubevirt.io/vmx-unrestricted-guest: 'true'"
    enableProjectRequestTemplateNodeSelectorAnnotation: false
    nodeSelectorAnnotation: "cpu-feature.node.kubevirt.io/vmx-unrestricted-guest=true"

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.8
# ocp4_workload_mtv_starting_csv: "mtv-operator.v2.8.5"
ocp4_workload_mtv_max_vm_inflight: "{{ [(num_users | int * 3) | int, 40] | min }}"
ocp4_workload_mtv_forklift_controller_container_limits_cpu: "{{ [(num_users | int * 100) | int, 1000] | max }}m"
ocp4_workload_mtv_forklift_controller_container_limits_memory: "{{ [(num_users | int * 400) | int, 2000] | max }}Mi"

# -------------------------------------------------------------------
# ocp4_workload_oadp_gitops
# -------------------------------------------------------------------
ocp4_workload_oadp_gitops_channel: stable-1.4
ocp4_workload_oadp_gitops_use_catalog_snapshot: false

# Multi User
ocp4_workload_oadp_gitops_multi_user: true
ocp4_workload_oadp_gitops_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_oadp_gitops_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_oadp_gitops_namespace_base: oadp
ocp4_workload_oadp_gitops_configure_dpa: true
ocp4_workload_oadp_gitops_storage: odf

# -------------------------------------------------------------------
# ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: true
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"
ocp4_workload_virt_network_config_bridge_type: linux-bridge
ocp4_workload_virt_network_config_bridge_name: br-flat

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_roadshow_fvmw
# -------------------------------------------------------------------
fvmw_hostname: "vcenter.apps.ocpv01.rhdp.net"
ocp4_workload_virt_roadshow_fvmw_datastore: workload_share
ocp4_workload_virt_roadshow_fvmw_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_virt_roadshow_fvmw_enable_mtv: true
ocp4_workload_virt_roadshow_fvmw_enable_cert_validation: false

# User base for OCP Authentication (to assign vCenter users to OCP users in agnosticd_user_info)
ocp4_workload_virt_roadshow_auth_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

# MTV Namespace base to use for multi user.
# For single user the namespace is always `openshift-mtv`
ocp4_workload_virt_roadshow_vmware_mtv_namespace_base: "mtv-{{ ocp4_workload_virt_roadshow_auth_user_base }}"
ocp4_workload_virt_roadshow_vsphere_ignore_pip_check: false

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_multi_user
# -------------------------------------------------------------------
# In the future once bug https://issues.redhat.com/browse/CNV-38284 is in the product
# the namespace will need to change to openshift-cnv
ocp4_workload_virt_roadshow_multi_user_configmap_namespace: openshift-cnv

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/aro-virt-roadshow-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_version: "1.3.4"
ocp4_workload_showroom_content_image: quay.io/rhpds/showroom-content:v1.2
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: "true"
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: feacf747-b6b3-4a3a-ada4-d44e6654573b
  sandboxes:
    - kind: AzureSandbox
      cloud_selector:
        purpose: production
        location: "{{ job_vars.azure_region }}"
      var: azure_sandbox
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
    sme:
      - name: Judd Maltin
        email: jmaltin@redhat.com
    instructions:
      - name: Judd Maltin
        email: jmaltin@redhat.com
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  tower:
    timeout: 21600
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Experience OpenShift Virtualization with Azure Red Hat OpenShift"
    category: Workshops
    multiuser: true
    workshopUiMaxInstances: 4 #allows up to 80 users if not deployed via admins
    keywords: []
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Virtualization
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
      - name: azure_region
        description: Azure Region with Sufficient v5 Quota
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: centralus
          enum:
            - centralus
            - canadacentral
      - name: open_env_azure_install_aro_master_vm_size
        description: Azure Master VM Size
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: Standard_D8s_v5
          enum:
            - Standard_D8s_v3
            - Standard_D8s_v5
      - name: open_env_azure_install_aro_worker_vm_size
        description: Azure Worker VM Size
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: Standard_D16s_v5
          enum:
            - Standard_D16s_v3
            - Standard_D16s_v5
      - name: num_users
        description: >-
          Number of users to provision within the cluster. Contact support for more.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 1
          maximum: 12
