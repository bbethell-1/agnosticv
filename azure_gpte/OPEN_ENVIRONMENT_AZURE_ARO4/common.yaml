---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/preconfigure_aad.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure with ARO Open Environment
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure

agnosticd_open_environment: True

cloud_provider: azure

# Azure Active Directory domain
azure_user_domain: azure.opentlc.com

# Dynamic DNS zone in Azure
cluster_dns_zone: azure.opentlc.com

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

# Enable ARO installation functions
install_aro: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
install_common: true
common_packages_el9:
  - python39
  - git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 5d496883-4078-4873-b10f-0975d05f379f
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Azure with ARO Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
    parameters: []
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
    - name: azure_gpte
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
