---
purpose: development

# ------------------------------------------------------
# Azure Properties
# ------------------------------------------------------
azure_deploy_bastion: true
# Get latest versions using
#   az aro get-versions --location eastus -o table
#az_aro_version: 4.17.27

rhel_sku: "9_6"

showroom_git_repo: https://github.com/rhpds/aro-workshop-showroom.git
showroom_git_ref: main

# Extra packages to install
common_extra_packages:
  - tmux
  - java-17-openjdk-devel
  - tzdata-java
  - maven
  - postgresql
  - httpd-tools

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: judd-azure-subs-helm-binary
  access_control:
    allow_groups:
      - rhpds-devs
      - rhpds-content-mobb
  catalog:
    parameters:
      - description: Include Arc Content
        formGroup: Features
        formLabel: Include Arc Content
        name: include_arc_content
        openAPIV3Schema:
          default: false
          type: boolean
