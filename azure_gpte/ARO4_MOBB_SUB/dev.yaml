purpose: development
azure_deploy_bastion: true
az_aro_version: 4.13.23
aro_install_helm: true
rhel_sku: '9_3'
common_extra_packages:
- java-17-openjdk-devel
- tzdata-java
- maven
- postgresql
- httpd-tools
bastion_remove_insights_motd: true
bastion_custom_motd: "---------------------------------------------------------------------------\n\
  \        Welcome to the Azure Red Hat OpenShift Workshop!\n---------------------------------------------------------------------------\n\
  \nBy continuing to use this service you agree to use this environment\nsolely for\
  \ the purposes of completing the steps in the lab guide.\n\nAny other use is a violation\
  \ of this service and appropriate action\nwill be taken. If you disagree with these\
  \ terms you must disconnect now.\n----------------------------------------------------------------------------"
deploy_bookbag: false
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
ocp4_workload_showroom_content_git_repo_ref: showroom-dev
agnosticd_passthrough_user_data: "{{ {}\n | combine({\n    \"include_arc_content\"\
  : true\n } if include_arc_content else {})\n}}\n"
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - description: Include Arc Content
      formGroup: Features
      formLabel: Include Arc Content
      name: include_arc_content
      openAPIV3Schema:
        default: false
        type: boolean
    - name: scm_ref
      description: AgnosticD SCM Reference (branch/tag/commit)
      formLabel: AgnosticD SCM Reference
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: Git branch, tag, or commit hash for AgnosticD deployment
