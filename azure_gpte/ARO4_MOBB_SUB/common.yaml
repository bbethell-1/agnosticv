---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-region2.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/azure_redhat0.yaml

# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure with ARO Open Environment
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

# Azure pool to use
az_pool_id: "01"

# Enable ARO installation functions
install_aro: true
az_aro_version: 4.11.44

# Extra packages to install
common_extra_packages:
- java-17-openjdk
- maven

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
ocp4_workload_showroom_content_git_repo_ref: showroom

include_arc_content: false

agnosticd_passthrough_user_data: |
  {{ {}
   | combine({
      "include_arc_content": true
   } if include_arc_content else {})
  }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 600d23c0-3ae4-4506-b8e3-c02ec9134f49
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: MOBB ARO Workshop (Subscription Based)
    category: Workshops
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
    parameters:
    - description: Include Arc Content
      formGroup: Features
      formLabel: Include Arc Content
      name: include_arc_content
      openAPIV3Schema:
        default: false
        type: boolean
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
