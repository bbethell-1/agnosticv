---
# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure Blank Open Environment
# -------------------------------------------------------------------

platform: RHPDS

#Which config and what software to use (highest level)
env_type: open-environment-azure
software_to_deploy: none

cloud_provider: azure
remote_user: azure
ansible_user: azure

#RHPDS stuff not part of open-environment-azure config
key_name: ocpkey
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
run_janitor: false

agnosticv_meta:
  params_to_variables:
    region: azure_region
  secrets:
  - azure_gpte

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
  secrets:
  - name: azure_gpte
    namespace: gpte
  - name: agnostics-api-mgr-access
    var: agnostics_mgr_access
  - name: gpte-db
    namespace: gpte
    var: gpte_db
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials
  parameters:
  - name: azure_region
  - name: email
  - name: student_name
