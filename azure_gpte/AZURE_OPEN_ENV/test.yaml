---
purpose: rhpds-test

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    region: azure_region

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: azure_region
      - name: email
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    git_tag_prefix: open-env-azure-test
    virtualenv: azure-ansible-2.9-azure-open-envs
    #virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: azure_gpte
      namespace: gpte
