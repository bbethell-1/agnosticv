---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/preconfigure_aad.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/controller.aap5ao6oghnkg6u4.ansiblecloud.redhat.com.yaml

# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Summit 2023 ARO Booth
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure

agnosticd_open_environment: True

cloud_provider: azure

# Azure Active Directory domain
azure_user_domain: azure.opentlc.com

# Dynamic DNS zone in Azure
cluster_dns_zone: azure.opentlc.com

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

# Enable ARO installation functions
install_aro: true
az_aro_version: 4.11.26

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: false
install_common: true
common_packages_el9:
- python39
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- podman
- skopeo
- buildah
- tree
- jq
- java-17-openjdk
- maven

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-aro-summit2023-booth.git
bookbag_git_version: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: a0777291-e162-4ee1-b42a-ee55488029ed
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Summit 2023 - ARO - Booth Demo
    category: Workshops
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
    parameters: []
  lifespan:
    default: 5d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - name: azure_gpte
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: satellite-rhel-8-and-9-latest-ha
    namespace: gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: ansible2.9-python3.6-2022-07-27
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
