# -------------------------------------------------------------------
# --- Catalog: ARO4_MAD ARO
# --- Catalog Item: Modern App Dev Roadshow - Cloud Architect Track for ARO
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

# Azure pool to use
az_pool_id: "01"

# Enable ARO installation functions
install_aro: true

# Extra packages to install
common_extra_packages:
- java-17-openjdk
- maven

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-aro-mobb.git
bookbag_git_version: 2023.11.29

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: d205f724-6ee4-4656-90ea-30d1aaa170b5
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Modern App Dev Roadshow - Cloud Architect Track for ARO
    category: Workshops
    keywords:
    - aro
    - azure
    - mad
    - subscription
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
    parameters: []
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
