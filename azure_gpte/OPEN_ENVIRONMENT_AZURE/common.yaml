---
# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure Blank Open Environment
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure

cloud_provider: azure

#install_ipa_client: false
#install_ftl: false
#run_janitor: false

agnosticv_meta:
  params_to_variables:
    region: azure_region
  secrets:
  - azure_gpte
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
  secrets:
  - name: azure_gpte
    namespace: gpte
  parameters:
  - name: azure_region
  - name: email
  - name: student_name
  deployer:
    virtualenv: azure_open_envs-ansible2.10-python3.6-2022-01-07
