---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml
# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure Blank Open Environment
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure

cloud_provider: azure

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

agnosticv_meta:
  params_to_variables:
    region: azure_region
  secrets:
  - azure_gpte
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Azure Blank Open Environment
    category: Demos
    keywords:
    - workshop
    - azure
    - open
    - openenv
    - azureopen
    - ocp49
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_Container_Platform
      ##OpenShift_Version: "4.7"
      Provider: PFE
  secrets:
  - name: azure_gpte
    namespace: gpte
