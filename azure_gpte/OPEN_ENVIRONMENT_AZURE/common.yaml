# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: Azure Blank Open Environment
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure

agnosticd_open_environment: True

cloud_provider: azure

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

agnosticv_meta:
  params_to_variables:
    region: azure_region
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 00f5bd41-0f31-4d0f-82a0-8bd1e93033a8
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Azure Blank Open Environment
    category: Open_Environments
    keywords:
    - workshop
    - azure
    - open
    - openenv
    - azureopen
    - ocp49
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      ##OpenShift_Version: "4.7"
      Provider: RHDP
  secrets:
  - name: azure_gpte
    namespace: gpte
  lifespan:
    default: 7d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
      pull: missing
