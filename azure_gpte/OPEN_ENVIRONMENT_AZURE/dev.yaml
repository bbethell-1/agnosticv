---
purpose: development

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    region: azure_region

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: azure_region
      - name: email
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    virtualenv: azure_open_envs-ansible2.10-python3.8-2022-01-07
  secrets:
    - name: azure_gpte
      namespace: gpte
