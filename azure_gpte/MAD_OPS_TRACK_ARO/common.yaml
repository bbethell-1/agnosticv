---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/azure-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/preconfigure_aad.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: OCP4 Getting Started Workshop Powered By ARO
# -------------------------------------------------------------------

platform: RHPDS

env_type: ocp4-workshop-generic-aro

agnosticd_open_environment: True

cloud_provider: azure

# Azure Active Directory domain
azure_user_domain: azure.opentlc.com

# Dynamic DNS zone in Azure
cluster_dns_zone: azure.opentlc.com

# User that is allowed for CICD (must be a gmail.com account)
open_env_azure_cicd_user: jenkins.sfo01@gmail.com

# Enable ARO installation functions
install_aro: true

# Authentication
enable_htpasswd: true
enable_aad: false

# -------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------
aro_admin_user: opentlc-mgr
# When no password specified it is generated
aro_admin_password: r3dh4t1!
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
install_common: true
common_packages_el9:
  - python39
  - git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Modernise the Application - Ops Track Powered-by ARO
    category: Workshops
    keywords: []
    labels:
      Product_Family: Red_Hat_Openshift
      Product: Azure_Red_Hat_Openshift
      Provider: RHDP
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 1
          maximum: 20
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
    - name: azure_gpte
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
