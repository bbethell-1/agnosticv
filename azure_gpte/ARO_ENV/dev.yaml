---
#include /includes/ee-multicloud-dev.yaml

purpose: development

# ------------------------------------------------------
# Azure Properties
# ------------------------------------------------------
azure_deploy_bastion: true
# Get latest versions using
#   az aro get-versions --location eastus -o table
az_aro_version: 4.13.23
aro_install_helm: true

rhel_sku: "9_3"

# Extra packages to install
common_extra_packages:
- java-17-openjdk-devel
- tzdata-java
- maven
- postgresql
- httpd-tools

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Azure Red Hat OpenShift Workshop!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

include_arc_content: false
agnosticd_passthrough_user_data: |
  {{ {}
   | combine({
      "include_arc_content": include_arc_content
   } if include_arc_content else {})
  }}

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - description: Include Arc Content
      formGroup: Features
      formLabel: Include Arc Content
      name: include_arc_content
      openAPIV3Schema:
        default: false
        type: boolean
