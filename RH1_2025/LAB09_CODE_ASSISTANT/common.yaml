---
# -------------------------------------------------------------------
# --- Catalog: Red Hat One 2025
# --- Catalog Item: LAB 09: Coding Assistant
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/ansible_control_plane/event_controller.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/terms-of-service.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
aws_region: us-east-2

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


# ---------------------------------------------------------------------
# Work around the RHELAI12 cloud-user issue, see instance tags
# ---------------------------------------------------------------------

# ansible_user: "{{ undefined() }}"
# remote_user: "{{ undefined() }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: software_workloads
# -------------------------------------------------------------------

software_workloads:
  bastions:

    - vscode-server

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  # TODO: Leave for now but consider removing as redundant? Tony Kay 2024-01-05
  # - description: Make ssh config
  #   type: 'template'
  #   src: ./files/ssh_config.j2
  #   dest: /home/devops/ssh-config
  #   owner: devops
  #   group: users
  #   mode: "u=r,g-rwx,o-rwx"

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

# inventory_groups:
#   - bastions

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/taylorjordanNC/rhone_code_asst_showroom
showroom_user: showroom
showroom_ui: default

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - web1
  - double_tty

showroom_ttys_enable_tmux: false

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_tab_web1_url: "https://{{ showroom_host }}:8443/"
showroom_tab_web1_name: Codeserver

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------

# TODO: 2024-11-21 zerossl hanging
# TODO: now 80 is open via SG retest zerossl

# certbot_cert_manager_provider: letsencrypt
vscode_auth_type: none

vscode_server_install_vscode: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
vscode_user_name: dev
vscode_server_default_extensions: []
vscode_server_extension_urls: []

  # TODO: Tony talk to Taylor re extensions
  #
  # - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  # - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  # - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true
  },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: dev
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# cloud_tags
# -------------------------------------------------------------------

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

default_instance_type: t3a.large
default_instance_image: RHEL95GOLD-latest

code_instance_type: "{{ default_instance_type }}"
code_instance_image: "{{ default_instance_image }}"
code_rootfs_size: 100

rhelai_instance_type: g6e.12xlarge
rhelai_instance_image: RHELAI12
rhelai_rootfs_size: 1024

instances:

  - name: code
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ code_instance_image }}"
    flavor:
      ec2: "{{ code_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
      - key: "ansible_user"
        value: "ec2-user"
      - key: "remote_user"
        value: "ec2-user"
    rootfs_size: "{{ code_rootfs_size | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - ShowroomSG
      - CodeserverSG

  - name: rhelai
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ rhelai_instance_image }}"
    flavor:
      ec2: "{{ rhelai_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhelai"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
      - key: "ansible_user"
        value: "cloud-user"
      - key: "remote_user"
        value: "cloud-user"
    rootfs_size: "{{ rhelai_rootfs_size | default(100) }}"
    security_groups:
      - BastionSG
      - LLMSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:
      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: LLMSG
    rules:
      - name: LLMAPI
        description: "LLM API Port"
        from_port: 8000
        to_port: 8000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: CodeserverSG
    rules:
      - name: Codeserver
        description: "Codeserver Port"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: LEChallange
        description: LEChallange Port
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

