# #include /includes/secrets/vmware-ibm-rs-clusters-access.yaml
#TODO: delete this variable when sandbox-api
vcenter_cluster: vcs-rs-00
ocp4_workload_virt_roadshow_vmware_use_pool: true

rosa_version_base: "openshift-v4.16"

# ocp4_workload_rosa_machinepool_replicas: 8
# best guess on number of metal nodes: 8 users per metal node
ocp4_workload_rosa_machinepool_replicas: "{{ [(num_users | int / 8) | round(0, 'ceil') | int, 2] | max }}"

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_health_retries: 5

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
