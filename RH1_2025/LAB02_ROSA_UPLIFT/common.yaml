# This assumes that the environment will start with users having
# the three VMs in ns windowsnetworking-userN running
# the three VMs in ns windowsmesh-userN stopped
# For the last module, users must STOP their windowsnetworking-userN VMs
# and START their windowsmesh-userN VMs
