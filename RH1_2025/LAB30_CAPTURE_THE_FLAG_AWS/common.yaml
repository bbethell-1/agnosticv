# -------------------------------------------------------------------
# --- Catalog: Red Hat One
# --- Catalog Item:  LAB 30: Capture The Flag - Participant (AWS)
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL92GOLD-latest
server_disk2_size: 2
# ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
# ocp4_workload_catalogsource_tag: v4.16_2024_07_15
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Optional variables
# -------------------------------------------------------------------
master_instance_type_size: 2xlarge

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: rh1_lab30_labuser_ssh
      src: https://github.com/opentraining-labs-customizations/rh1-lab30-ctf-participants-ar.git
      version: 1.0.2
    - name: rh1_lab30_ctf_ocp_config
      src: https://github.com/opentraining-labs-customizations/rh1-lab30-ctf-ocp-ar.git
      version: 1.0.2
    - name: ctf_infra_role
      src: https://github.com/opentraining-labs-customizations/rh1-lab30-ctf-infra-ar.git
      version: 1.0.1

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
student_name: lab-user
student_password: "{{ common_password }}"
openshift_cluster_admin_password: "R3dh4t1!"

# -------------------------------------------------------------------
# AWS Infra
# -------------------------------------------------------------------
bastion_instance_type: "t3a.large"
rootfs_size_bastion: 50

node_instance_image: RHEL92GOLD-latest
node_instance_type: "t3a.large"

# -----------------
# Security Groups
# -----------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

# -----------------
# Instances
# -----------------
instances:
  - name: "bastion"
    #count: "{{ bastion_instance_count}}"
    #unique: "{{ true if clientvm_instance_count | int <= 1 else false }}"
    count: 1
    unique: true
    public_dns: true
    image: "{{ bastion_instance_image }}"
    flavor:
      "ec2": "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "Purpose"
        value: "{{ purpose }}"
      - key: "project"
        value: "{{ project_tag }}"
      - key: "user"
        value: "{{ student_name }}"
    rootfs_size: "{{ bastion_rootfs_size }}"
    security_groups:
      - BastionSG
      - NodeSG

  - name: "server"
    count: 2
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ node_instance_image }}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion }}"
    volumes:
      - device_name: "/dev/xvdb"
        size: "{{ server_disk2_size }}"
        type: gp3
    security_groups:
      - WebSG
      - NodeSG
      - BastionSG

