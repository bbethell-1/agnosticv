---
# #include /includes/ee-multicloud-dev.yaml
#include /includes/access-restriction-sme-tester.yaml
# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/RedHatQuickCourses/rh1-lab30-capture-the-flag.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      #image: quay.io/agnosticd/ee-multicloud:v0.1.0
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: always

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  - rh1_lab30_labuser_ssh
  - ocp4_workload_authentication
  - rh1_lab30_ctf_ocp_config
  #- ocp4_workload_showroom
  - ctf_infra_role
  - ansible_automation_platform_configuration

# --------------------------------------------------------------------------------
# ansible_automation_platform_configuration
# --------------------------------------------------------------------------------
ansible_automation_platform_configuration_host: "https://controller.{{ server_domain_suffix }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "R3dh4t1!"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: false
ansible_automation_platform_configuration_generate_ocp_token: false

controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

# ----------------
# Gateway
# ----------------
aap_configuration_dispatcher_roles:
  - {role: gateway_organizations, var: aap_organizations, tags: gateway_organizations}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: gateway_role_user_assignments, var: gateway_role_user_assignments, tags: gateway_role_user_assignments}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}

lab_base_aap_name: "Table-{{guid}}"
ctf_aap_org_name: "{{lab_base_aap_name}}-org"

aap_organizations:
  - name: "{{lab_base_aap_name}}-org"
    description: Org for CTF people {{lab_base_aap_name}}-org

aap_user_accounts:
  - username: "{{lab_base_aap_name}}-user"
    is_superuser: false
    password: "{{ common_password }}"
    email: "{{lab_base_aap_name}}-user@redhat.com"
    organizations: "{{lab_base_aap_name}}-org"
    first_name: "{{lab_base_aap_name}}"
    last_name: User

gateway_role_user_assignments:
  - role_definition: Organization Admin
    user: "{{ lab_base_aap_name }}-user"
    object_id: >-
      {{ query('ansible.platform.gateway_api', 'organizations',
          query_params={'name': ctf_aap_org_name },
          host=aap_hostname,
          username=aap_username,
          password=aap_password,
          verify_ssl=aap_validate_certs
          ) | map(attribute='id') | join(', ') | int
      }}

controller_inventories:
  - name: "{{lab_base_aap_name}}-inventory"
    description: "Inventory {{lab_base_aap_name}}"
    organization: "{{lab_base_aap_name}}-org"
    prevent_instance_group_fallback: false
    state: present

controller_hosts:
  - name: server1
    inventory: "{{lab_base_aap_name}}-inventory"
    variables:
      ansible_host: "server1.{{guid}}{{ subdomain_base_suffix }}"
  - name: server2
    inventory: "{{lab_base_aap_name}}-inventory"
    variables:
      ansible_host: "server2.{{guid}}{{ subdomain_base_suffix }}"

controller_projects:
  - name: "{{lab_base_aap_name}}-CTF Flags"
    description: CTF Flags repo
    organization: "{{lab_base_aap_name}}-org"
    execution_environment: "Default execution environment"
    scm_type: git
    scm_url: "https://github.com/Red-Hat-CTF/flags"
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    credential: "CTF Git Credential"

controller_templates:
  - name: "{{lab_base_aap_name}} - Ansible 1 - Users and Groups"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: ANSIBLE_Users-and-groups_check.yml
    execution_environment: Default execution environment
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - Ansible 2 - Permissions and Files"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: ANSIBLE_Permissions-and-Files_check.yml
    execution_environment: Default execution environment
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - Ansible 3 - Storage Management"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: ANSIBLE_Storage-Management_check.yml
    execution_environment: Default execution environment
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - Ansible 4 - Scheduling and Network Management"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: ANSIBLE_Scheduling-and-Networking_check.yml
    execution_environment: Default execution environment
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - OCP 1 - Adding Users and Assigning Permissions"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: OCP_users.yaml
    execution_environment: "Custom RHO EE"
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - OCP 2 - Resolving connectivity issues to a website hosted in OpenShift"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: OCP_connectivity.yaml
    execution_environment: "Custom RHO EE"
    credentials:
      - "CTF Host Credential"
    extra_vars:
      cluster_api_url: "{{ lookup('agnosticd_user_data', 'openshift_api_server_url') }}"
      # cluster_api_url: "{{ openshift_api_server_url | default('<Replace with OCP API URL e.g. api.example.opentlc.com:6443>') }}"

  - name: "{{lab_base_aap_name}} - OCP 3 - Deploy MySQL DB and PHP Application"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: OCP_php_mysql.yaml
    execution_environment: "Custom RHO EE"
    credentials:
      - "CTF Host Credential"
    extra_vars:
      cluster_api_url: "{{ lookup('agnosticd_user_data', 'openshift_api_server_url') }}"
      # "{{ openshift_api_server_url | default('<Replace with OCP API URL e.g. api.example.opentlc.com:6443>') }}"

  - name: "{{lab_base_aap_name}} - OCP 4 - Scheduling Issues"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: OCP_scheduling_issues.yaml
    execution_environment: "Custom RHO EE"
    credentials:
      - "CTF Host Credential"
    extra_vars:
      cluster_api_url: "{{ lookup('agnosticd_user_data', 'openshift_api_server_url') }}"
      # cluster_api_url: "{{ openshift_api_server_url | default('<Replace with OCP API URL e.g. api.example.opentlc.com:6443>') }}"

  - name: "{{lab_base_aap_name}} - RHEL_1_funny_file_check"
    job_type: run
