    execution_environment: "Default execution environment"
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - RHEL_6_analyze_logs_check"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: RHEL_6_analyze_logs_check.yaml
    execution_environment: "Default execution environment"
    credentials:
      - "CTF Host Credential"

  - name: "{{lab_base_aap_name}} - RHEL_7_podman_sandbox_check"
    job_type: run
    inventory: "{{lab_base_aap_name}}-inventory"
    project: "{{lab_base_aap_name}}-CTF Flags"
    playbook: RHEL_7_podman_sandbox_check.yaml
    execution_environment: "Default execution environment"
