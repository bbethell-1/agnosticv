---
# -------------------------------------------------------------------
# --- Catalog: Red Hat One 2025
# --- Catalog Item: LAB 15: OpenShift Virtualization Backup and
# ---                       Restore with Veeam Kasten K10 (CNV)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includess
# -------------------------------------------------------------------

#include /includes/catalog-icon-kasten.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/aws-region2.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
# Potentially switch to HCP once stable
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.16"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.4
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"

ai_control_plane_cores: >-
  {{ 16 if worker_instance_count|int <= 10
  else 32 if worker_instance_count|int <= 20
  else 64
  }}
ai_control_plane_memory: >-
  {{ '32Gi' if worker_instance_count|int <= 10
  else '64Gi' if worker_instance_count|int <= 20
  else '128Gi'
  }}

ai_workers_cores: 16
ai_workers_memory: >-
  {{ '32Gi' if num_users|int <= 10
  else '64Gi'
  }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_virt_roadshow_multi_user
- ocp4_workload_kasten_k10
- ocp4_workload_showroom

# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads: []

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.16
ocp4_workload_external_odf_noobaa_custom_resources: true
ocp4_workload_external_odf_noobaa_memory_requests: 8Gi
ocp4_workload_external_odf_noobaa_memory_limits: 8Gi
ocp4_workload_external_odf_noobaa_cpu_requests: 6
ocp4_workload_external_odf_noobaa_cpu_limits: 6

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('2') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_channel: stable-v1.14
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_cloud_provider: ec2
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_multi_user
# -------------------------------------------------------------------
# In the future once bug https://issues.redhat.com/browse/CNV-38284 is in the product
# the namespace will need to change to openshift-cnv
ocp4_workload_virt_roadshow_multi_user_configmap_namespace: default

# -------------------------------------------------------------------
# Workload: ocp4_workload_kasten_k10
# -------------------------------------------------------------------
ocp4_workload_kasten_k10_channel: stable
ocp4_workload_kasten_k10_subscription: k10-kasten-operator-paygo-rhmp

# Pin version of the operator
ocp4_workload_kasten_k10_automatic_install_plan_approval: false
ocp4_workload_kasten_k10_starting_csv: k10-kasten-operator-paygo-rhmp.v7.0.12

# Kasten Deployment Properties
ocp4_workload_kasten_namespace: kasten-io

ocp4_workload_kasten_k10_deploy_k10: true
ocp4_workload_kasten_k10_setup_demo: true

# Annotate storage classes to support block mode
#   k10.kasten.io/sc-supports-block-mode-exports=true
# Set to empty array to not annotate any
ocp4_workload_kasten_k10_storageclasses:
- ocs-external-storagecluster-ceph-rbd

# Annotate volumesnapshotclasses as backup targets
#   k10.kasten.io/is-snapshot-class=true
# Set to empty array to not annotate any
ocp4_workload_kasten_k10_volumesnapshotclasses:
- ocs-external-storagecluster-rbdplugin-snapclass
- ocs-external-storagecluster-cephfsplugin-snapclass

# Common ObjectBucket properties
ocp4_workload_kasten_k10_objectbucket_name: kastenbackups
ocp4_workload_kasten_k10_objectbucket_storage_class: openshift-storage.noobaa.io

# Set up multiple (regular) users for K10
ocp4_workload_kasten_k10_multi_user: true

# Multi User
ocp4_workload_kasten_k10_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_kasten_k10_objectbucket_user_base: user
ocp4_workload_kasten_k10_objectbucket_namespace_base: "backuptarget-{{ ocp4_workload_kasten_k10_objectbucket_user_base }}"

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/rh1_lab15_backup_dr_kasten
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5fe9aba3-c361-42f8-9b8a-17597ff6e536
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-10-28
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  catalog:
    display_name: "LAB 15: OpenShift Virtualization Backup and Restore with Veeam Kasten K10 (CNV)"
    category: Red_Hat_One_2025
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    workshopLabUiRedirect: true
    workshopUiMaxInstances: 3
    keywords:
    - demo
    - openshift
    - ocp
    - ocp416
    - cnv
    - cnvocp
    - ocpcnv
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      assetGroup: Virtualization
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 20
      validation: >-
        num_users <= 2 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than TWO requires a valid SalesForceID')
