# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_multi_user
# -------------------------------------------------------------------
# In the future once bug https://issues.redhat.com/browse/CNV-38284 is in the product
# the namespace will need to change to openshift-cnv
ocp4_workload_virt_roadshow_multi_user_configmap_namespace: default

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/rh1-hcp-lab-2025
ocp4_workload_showroom_content_git_repo_ref: master
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: showroom

