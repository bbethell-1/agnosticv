controller_configuration_dispatcher_roles:
- role: credentials
  var: controller_credentials
  tags: credentials
- role: projects
  var: controller_projects
  tags: projects

controller_credentials:
- name: "Workshop Credential"
  organization: Default
  credential_type: "Machine"
  inputs:
    username: "cloud-user"
    ssh_key_data: "{{ vm_ssh_private_key }}"
  state: present

controller_projects:
- name: "Workshop Project"
  organization: Default
  scm_type: git
  scm_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ocp4_workload_user_base}}1/virt-aap-day2.git"
  scm_branch: "main"
  wait: true

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/redhat-gpte-devopsautomation/virt-aap-day2-gitops
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_path: rhel9-vm

ocp4_workload_gitops_bootstrap_helm_values:
  namespace: vms-aap-day2
  sshPublicKey: 

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpte-devopsautomation/virt-aap-day2-showroom
ocp4_workload_showroom_content_git_repo_ref: v1.0.0
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.2
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f78ad359-10ce-4cb1-9dbc-fecac1a5c7f4
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      # image: quay.io/agnosticd/ee-multicloud:v0.1.2
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.0
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
