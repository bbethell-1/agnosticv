---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.17"

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_user_workspace_revision: main

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_health_retries: 5
ocp4_workload_gitops_bootstrap_repo_revision: main

# --------------------------------------------------------------------
# ansible_automation_platform_configuration
# --------------------------------------------------------------------
aap_configuration_dispatcher_roles:
- role: controller_credential_types
  var: controller_credential_types
  tags: controller_credential_types
- role: controller_credentials
  var: controller_credentials
  tags: controller_credentials
- role: controller_execution_environments
  var: controller_execution_environments
  tags: controller_execution_environments
- role: controller_projects
  var: controller_projects
  tags: controller_projects
- role: controller_inventories
  var: controller_inventories
  tags: controller_inventories
- role: controller_inventory_sources
  var: controller_inventory_sources
  tags: controller_inventory_sources
- role: controller_job_templates
  var: controller_templates
  tags: controller_job_templates

controller_projects:
- name: "Workshop Project"
  organization: Default
  scm_type: git
  scm_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ocp4_workload_user_base}}1/{{common_user_workspace_repo}}.git"
  scm_branch: "{{ common_user_workspace_revision }}"
  scm_update_on_launch: true
  wait: true
- name: "Solution Project"
  organization: Default
  scm_type: git
  scm_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ocp4_workload_user_base}}1/{{common_user_workspace_repo}}.git"
  scm_branch: "{{ common_user_workspace_revision }}"
  scm_update_on_launch: true
  wait: true

controller_execution_environments:
- name: "Day 2 EE"
  image: "quay.io/acme_corp/aap-day2-ee:latest"
  pull: missing
- name: "AWX EE"
  image: "quay.io/ansible/awx-ee:24.3.0"
  pull: missing

controller_inventories:
- name: "OpenShift Virtual Machines"
  organization: Default

controller_inventory_sources:
- name: OpenShift Virtual Machines Source
  source: scm
  source_project: "Solution Project"
  source_path: solutions/inventory.kubevirt.yml
  inventory: OpenShift Virtual Machines
  credential: "OpenShift Credential"
  execution_environment: "AWX EE"
  organization: Default
  overwrite: true
  update_on_launch: true
  update_cache_timeout: 0
  wait: true

controller_templates:
- name: Stop VMs
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/manage_vm_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - OpenShift Credential
  survey: {}
  extra_vars:
    vm_namespace: vms-aap-day2
    task_file: stop_vm.yml
- name: Start VMs
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/manage_vm_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - OpenShift Credential
  survey: {}
  extra_vars:
    vm_namespace: vms-aap-day2
    task_file: start_vm.yml
- name: Restart VMs
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/manage_vm_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - OpenShift Credential
  survey: {}
  extra_vars:
    vm_namespace: vms-aap-day2
    task_file: restart_vm.yml
- name: Patch VMs
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/patch_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - Workshop Credential
  - Vault Credential
  survey: {}
  extra_vars:
    task_file: "update_security_packages.yml"
  become_enabled: true
- name: Hot Plug VMs
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/manage_vm_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - OpenShift Credential
  survey: {}
  extra_vars:
    vm_namespace: vms-aap-day2
    task_file: hot_plug.yml
    instance_type: u1.2xmedium
- name: Snapshot VMs
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/manage_vm_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - OpenShift Credential
  survey: {}
  extra_vars:
    vm_namespace: vms-aap-day2
    task_file: snapshot_vms.yml
    vms_to_snapshot: rhel9-vm1
- name: Restore VM Snapshots
  job_type: run
  organization: Default
  inventory: OpenShift Virtual Machines
  project: "Solution Project"
  playbook: solutions/manage_vm_playbook.yml
  execution_environment: "Day 2 EE"
  credentials:
  - OpenShift Credential
  survey: {}
  extra_vars:
    vm_namespace: vms-aap-day2
    task_file: restore_vm_snapshots.yml
    vm_snapshots: rhel9-vm1-replace

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
