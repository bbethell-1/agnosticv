openshift_cluster_admin_username: "{{ ocp4_workload_authentication_admin_user }}"
openshift_cluster_admin_password: "{{ ocp4_workload_authentication_htpasswd_admin_password }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
