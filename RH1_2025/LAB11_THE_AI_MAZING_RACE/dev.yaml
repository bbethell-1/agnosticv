purpose: development
worker_instance_count: '{{ [(num_users | int / 6) | round(0, ''ceil'') | int, 4] | max }}'
worker_storage_size: 300
ocp4_workload_openshift_ai_channel: stable-2.16
ocp4_workload_openshift_ai_automatic_install_plan_approval: false
ocp4_workload_openshift_ai_starting_csv: rhods-operator.2.16.0
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_trustyai: Managed
ocp4_workload_argocd_bootstrap_repo_list:
- repo: https://github.com/rh-aiservices-bu/ai-mazing-race.git
  branch: main
  bootstrap_path: bootstrap/applicationset/applicationset-bootstrap.yaml
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
