---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region3.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/showroom-shared-cluster1.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/lifetime-standard.yaml

# --------------------------------------------------------------------
# Catalog Item - LAB10 RHEL AI VM - Experiment to production ready Red Hat AI
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Vars needed for RHEL AI Eng AMI (TODO: Remove this need with custom AMI)
# --------------------------------------------------------------------

ansible_user: ec2-user
remote_user: ec2-user

# --------------------------------------------------------------------
# Software Workloads
# --------------------------------------------------------------------

software_workloads:
  bastions:
    - s3_asset_injector

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

post_software_workloads: []

# -------------------------------------------------------------------
# Role: s3_asset_injector (Download LLM tar archive and unarchive)
# -------------------------------------------------------------------

s3_asset_injector_venv_path: /tmp/venv-boto
s3_asset_injector_bucket: rhdp-private
s3_asset_injector_path: /ai-assets/etx/rhel-ai-etx-models.tar
s3_asset_injector_dest: /root/rhel-ai-etx-models.tar
s3_asset_injector_mode: get

s3_asset_injector_aws_access_key: "{{ s3_aws_access_key }}"
s3_asset_injector_aws_secret_key: "{{ s3_aws_secret_key }}"
s3_asset_injector_aws_region: 'us-east-1'

s3_asset_injector_unarchive: true
s3_asset_injector_unarchive_path: /root

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

use_content_view: false
update_packages: false  # Do you want to run a full yum update
bastion_install_basic_packages: false
agd_install_common: false # Immutable OS

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: "{{ undefined() }}"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - name: Ensure files directory exists for assets
    type: file
    path: /etc/ilab
    state: directory

  - name: Ensure files directory exists for assets
    type: file
    path: /etc/ilab/insights-opt-out
    state: touch

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes
    marker: "# {mark} Our custom SSH settings via Ansible"

  - description: Restart sshd to pick up new configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

# TODO: Need AI user role

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: instruct
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
agd_user_create_ansible_service_account: true
config_user_preferred_python: false

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/taylorjordanNC/showroom_rhone_lab10
ocp4_workload_showroom_content_only: true

showroom_deploy_shared_cluster_enable: true

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

bastion_rootfs_size: 1024

# -------------------------------------------------------------------
# AMI Config - tmp for RHEL AI Eng CI
# -------------------------------------------------------------------

aws_ami_region_mapping:
  us-east-2:
    RHELAI10: ami-0be2f5c0ca770a10f
    RHELAI12: ami-0cb37f2a376f6e2c6
    RHELAI13: ami-0321252272036e699  # Really 1.3.1
  us-east-1:
    RHELAI10: ami-01c361feee3767bf8
    RHELAI12: ami-038a07d686ac3f2dc
    RHELAI13: ami-05dc5d703f2600daf
  us-west-1:
    RHELAI13: ami-00963c6bcda96ee28
  us-west-2:
    RHELAI13: ami-02af9afa320f2f523

# bastion_instance_image: RHELAI13

instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: RHELAI13
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(1024)  }}"
    security_groups:
      - BastionSG
      - ParasolSG
      - InstructLabSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:
  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ParasolSG
    rules:
      - name: ParasolHTTP
        description: "Parasol HTTP Port"
        from_port: 8005
        to_port: 8005
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: InstructLabSG
    rules:
      - name: InstructLabAPI
        description: "InstructLab API Port"
        from_port: 8000
        to_port: 8010 # lets open up a few ports for now
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: DB242088-77D0-4442-97AC-9E9D6FA8786C
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LAB 10: RHEL AI VM - Experiment to production ready Red Hat AI"
    category: Red_Hat_One_2025
    keywords:
      - rhel
      - ai
      - instructlab
      - nvidia
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g6e.12xlarge
          enum:
            - g6.xlarge
            - g6.12xlarge
            - g6e.12xlarge
  sandbox_api:
    reservation: pgpu-event
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
