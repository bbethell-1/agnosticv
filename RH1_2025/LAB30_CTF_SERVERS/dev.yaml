---
# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: dev

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/RedHatQuickCourses/rh1-lab20-ansible.git

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

nginx_with_cert_encrypt_mail: opentlc-admin@opentlc.com
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      #image: quay.io/agnosticd/ee-multicloud:v0.1.0
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: always

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set-repositories
    - common
    - ctf_infra_role
  bastions:
    - bastion-lite
    - control-user
    - asset_injector

software_workloads:
  controllers:
    - nginx_with_cert
    - ansible_automation_platform_configuration

# --------------------------------------------------------------------------------
# ansible_automation_platform_configuration
# --------------------------------------------------------------------------------
ansible_automation_platform_configuration_host: "https://controller.{{guid}}{{subdomain_base_suffix}}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "R3dh4t1!"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: false
ansible_automation_platform_configuration_generate_ocp_token: false

controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"


aap_configuration_dispatcher_roles:
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}
  - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}

