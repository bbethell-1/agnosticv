---
# -------------------------------------------------------------------
# --- Catalog: Red Hat One
# --- Catalog Item: LAB 30: Servers for Red Hat One Capture The Flag Event
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/event_controller.yaml
#include /includes/lifetime-standard.yaml

#include /includes/parameters/aws-region2.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop
cloud_provider: ec2

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL94GOLD-latest
bastion_instance_image: RHEL94GOLD-latest
default_instance_type: "t3a.large"

ctfdashboard_instance_type: "m5ad.xlarge"
rootfs_size_ctfdashboard: 100

controller_instance_type: "m5ad.2xlarge"

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebAhttpsSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebControllerPorts
        description: "Open HTTPS Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: ctfSG
    rules:
      - name: ctfPorts
        description: "CTF dashboard Public"
        from_port: 8000
        to_port: 8000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: AuditSG
    rules:
      - name: AuditPortsTCP
        description: "Syslog Public TCP"
        from_port: 514
        to_port: 514
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: AuditPortsUDP
        description: "Syslog Public UDP"
        from_port: 514
        to_port: 514
        protocol: udp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

# -------------------
# Instances
# -------------------
instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    dns_loadbalancer: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: t3a.large
    tags:
      - key: "AnsibleGroup"
        value: "bastions,automationcontroller"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: 50
    volumes:
      - device_name: "/dev/xvdb"
        size: "2"
        type: gp3
    security_groups:
      - WebSG
      - BastionSG
      - NodeSG

  - name: ctfdashboard
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ default_instance_image }}"
    flavor:
      ec2: "{{ ctfdashboard_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "ctfdashboard"
      - key: "ostype"
        value: "linux"
    rootfs_size: 100
    security_groups:
      - WebSG
      - DefaultSG
      - NodeSG
      - ctfSG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image:
      name: "aap2.5-2024-11-06"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: 200
    security_groups:
      - NodeSG
      - WebSG

  - name: "misc"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ default_instance_image }}"
    flavor:
      ec2: "{{ ctfdashboard_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "misc"
      - key: "ostype"
        value: "linux"
    rootfs_size: 100
    security_groups:
      - WebSG
      - DefaultSG
      - NodeSG

  - name: "audit"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ default_instance_image }}"
    flavor:
      ec2: "{{ ctfdashboard_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "audit"
      - key: "ostype"
        value: "linux"
    rootfs_size: 100
    security_groups:
      - WebSG
      - DefaultSG
      - NodeSG
      - AuditSG

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: ctf_infra_role
      src: https://github.com/opentraining-labs-customizations/rh1-lab30-ctf-infra-ar.git
      version: 1.0.1

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set-repositories
    - common
    - ctf_infra_role
  bastions:
    - bastion-lite
    - control-user
    - asset_injector

software_workloads:
  controllers:
    - nginx_with_cert
    - ansible_automation_platform_configuration

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible

# -------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"
# control_user_ssh_config: ./files/rhel_ssh_config.j2

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# nginx_with_cert
# -------------------------------------------------------------------
nginx_with_cert_encrypt_mail: opentlc-admin@opentlc.com
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# ansible_automation_platform_configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "https://controller.{{guid}}{{subdomain_base_suffix}}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "R3dh4t1!"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: false
ansible_automation_platform_configuration_generate_ocp_token: false

controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"


aap_configuration_dispatcher_roles:
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}
  - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}

