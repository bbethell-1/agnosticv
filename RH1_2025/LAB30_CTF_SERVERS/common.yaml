gateway_settings:
  SESSION_COOKIE_AGE: 9000

controller_credentials:
  - name: "CTF Host Credential"
    description: "Machine Credential with become_method for hosts"
    organization: Default
    credential_type: Machine
    inputs:
      username: "lab-user"
      ssh_key_data: "{{ ctf_ssh_private_key }}"
      become_method: sudo

  - name: "CTFd Instance Credential"
    description: "Machine Credential with become_method for hosts"
    organization: Default
    credential_type: Machine
    inputs:
      username: "ec2-user"
      ssh_key_data: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"
      become_method: sudo

  - name: "CTF Git Credential"
    description: "CTF Git repo Credential"
    organization: Default
    credential_type: Source Control
    inputs:
      username: "rhctfgit@gmail.com"
      password: "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"
      # password: "s1DF#%F@SDF#%F@"

controller_inventories:
  - name: "CTFd Instance Server"
    description: "Only the ctfdashboard hostname"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present

  - name: "CTF All Table Host"
    description: "CTF All Table Host"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present

controller_hosts:
  - name: ctfdashboard
    inventory: "CTFd Instance Server"

controller_projects:
  - name: "CTFd Instance Installation"
    description: "Installs CTFd on ctfdashboard"
    organization: "Default"
    scm_type: git
    scm_url: "https://github.com/opentraining-labs-customizations/rh1-lab30-servers-for-ctf"
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'

  - name: "CTF Flags Repo For All Table Host"
    description: "CTF Flags Repo For All Table Host"
    organization: "Default"
    scm_type: git
    scm_url: "https://github.com/Red-Hat-CTF/prep"
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    credential: "CTF Git Credential"

controller_templates:
  - name: CTFd Instance Installation
    job_type: run
    inventory: CTFd Instance Server
    project: CTFd Instance Installation
    playbook: ctfd_provisioning_playbook.yml
    execution_environment: Default execution environment
    credentials:
      - "CTFd Instance Credential"

  - name: CTF Flags Setup For All Table Host
    job_type: run
    inventory: "CTF All Table Host"
    project: CTF Flags Repo For All Table Host
    playbook: main.yml
    execution_environment: Default execution environment
    credentials:
      - "CTF Host Credential"

controller_execution_environments:
  - name: "Custom RHO EE"
    description: "EE for OCP CTF"
    image: quay.io/castawayegr/custom-rho-ee:latest
    pull: "missing"
    state: present

  - name: "Platform EE CTF"
    description: "Platform EE CTF"
    image: quay.io/mknittel/rh-ctf-platform:1.0.1
    pull: "missing"
    state: present

