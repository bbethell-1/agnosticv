---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/access-restriction-sme-tester.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------

ocp4_workload_showroom_content_git_repo: https://github.com/RedHatQuickCourses/rh1-lab30-capture-the-flag
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv06
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
