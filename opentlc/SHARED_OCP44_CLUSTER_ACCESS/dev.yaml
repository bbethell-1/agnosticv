---
# System:       Labs
# Catalog:      OPENTLC OpenShift 4 Labs
# Catalog Item: OPENTLC OpenShift 4.4 Shared Access (DEV Dropdown)

purpose: development
target_host: bastion.dev4.openshift.opentlc.com

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: wdc
        purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: opentlc
    parameters:
      - name: ocp_username
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
    - name: opentlc
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
