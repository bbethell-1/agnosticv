---
# Provision access to the Shared OpenShift Cluster on Labs
# for OpenShift 4 Advanced Application Deployment ILT Homework
# Catalog Details in (dev | prod).yaml
# Tag Prefix: shared-ocp44-app-deploy-homework

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access

# --- Workload parameters
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
- GPTE-APP-DEPLOY-HOMEWORK
ocp4_workload_shared_cluster_access_create_quota: true
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-app-deploy-homework-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "16"
    limits.cpu: "16"
    requests.memory: 20Gi
    limits.memory: 45Gi
    pods: "30"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username

__meta__:
  anarchy:
    namespace: babylon-anarchy-opentlc
  catalog:
    display_name: OpenShift 4.4 Adv. App Deploy Homework
