---
# --- Quay Shared Workload Deployment for Labs
# --- System: labs.opentlc.com
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Quay 3 on OpenShift 4
# --- ELT: Quay Foundations

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_quay_operator
# This workload must be run as ec2-user because it has tasks
# requiring sudo.
ansible_user: ec2-user
ansible_ssh_private_key_file: /home/opentlc-mgr/.ssh/opentlc_admin_backdoor.pem

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- Workload Configuration
ocp4_workload_quay_operator_project: "quay-{{ guid }}"
ocp4_workload_quay_operator_use_catalog_snapshot: true
ocp4_workload_quay_operator_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_quay_operator_catalog_snapshot_image_tag: "v4.4_2020_09_28"

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username
  secrets:
  - quay_token

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4e4fe825-1b5f-43ab-ad6d-0eec34b434a6
  catalog:
    display_name: Quay 3 on OpenShift 4
    namespace: gpte
    parameters: []
  secrets:
  - name: quay_token
    namespace: gpte
