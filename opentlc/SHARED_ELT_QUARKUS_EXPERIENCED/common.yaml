---
# Provision access to the Shared OpenShift Cluster on Labs
# for Quarkus Experienced ELT
# Catalog Details in (dev | prod).yaml
# Tag Prefix: shared-elt-quarkus-experienced

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_quarkus_experienced_elt

# --- Workload parameters
# Parameters below are exactly as the defaults in the role. Only define if defaults don't work

# ocp4_workload_quarkus_experienced_elt_project: "{{ guid }}-quarkus-experienced-lab"
# ocp4_workload_quarkus_experienced_elt_user_groups:
# - OPENTLC-PROJECT-PROVISIONERS
# ocp4_workload_quarkus_experienced_elt_create_quota: true
# ocp4_workload_quarkus_experienced_elt_quota_name: "clusterquota-quarkus-experienced-{{ guid }}"
ocp4_workload_quarkus_experienced_elt_quota:
  hard:
    requests.cpu: "4"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 14Gi
    pods: "12"
    configmaps: "50"
    secrets: "50"
    services: "20"
    persistentvolumeclaims: "2"
    requests.storage: 10Gi

ocp4_workload_quarkus_experienced_elt_limits:
- type: Container
  max:
    cpu: 4
    memory: 4Gi
  default:
    cpu: 500m
    memory: 1.5Gi
  defaultRequest:
    cpu: 250m
    memory: 256Mi
- type: Pod
  max:
    cpu: 4
    memory: 4Gi

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8aa22e2d-240e-4c80-8dab-a582cb15cfc4
