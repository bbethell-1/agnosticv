---
# Provision access to the Bastion of the Shared OpenShift Cluster on Labs
# Catalog Details in (dev | prod).yaml
# Tag Prefix: shared_ocp44_bastion_access

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_bastion_access

# --- Workload parameters

# Generate a password for the user
ocp4_workload_shared_bastion_access_password: ""
ocp4_workload_shared_bastion_access_password_length: 16

# Do not allow sudo for the user
ocp4_workload_shared_bastion_access_allow_sudo: false

# Don't add user to any additional groups since they are also cluster admin
ocp4_workload_shared_bastion_access_user_groups: []
# - OPENTLC-PROJECT-PROVISIONERS

# Allow users to be cluster-admin to deploy Operators
ocp4_workload_shared_bastion_access_user_cluster_roles:
- cluster-admins

# Do not give users a quota
ocp4_workload_shared_bastion_access_create_quota: false
ocp4_workload_shared_bastion_access_quota_name: "clusterquota-shared-bastion-{{ guid }}"
ocp4_workload_shared_bastion_access_quota:
  hard:
    requests.cpu: "16"
    limits.cpu: "16"
    requests.memory: 20Gi
    limits.memory: 45Gi
    pods: "30"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username
