---
# Provision access to the Shared OpenShift Cluster on Labs with CRW access
# Catalog Details in (dev | prod).yaml
# Tag Prefix: shared_ocp44_cluster_access

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access

# --- Workload parameters
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
ocp4_workload_shared_cluster_access_create_quota: true
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-shared-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "16"
    limits.cpu: "16"
    requests.memory: 20Gi
    limits.memory: 45Gi
    pods: "30"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi

# Add CRW access for the user. Access is granted automatically via OAuth login, this will just
# add a message with the CRW route to the provisioning e-mail.
ocp4_workload_shared_cluster_access_enable_crw: true

# Namespace with the CRW installation:
ocp4_workload_shared_cluster_access_crw_namespace: gpte-crw

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 423bef92-cb9f-4331-8d25-3134491d6c32
