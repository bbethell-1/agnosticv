---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/secrets/opentlc-mgr-shared-ocp-410.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: none

# -------------------------------------------------------------------
# Config
# -------------------------------------------------------------------
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access
workload_shared_deployment: true

# -------------------------------------------------------------------
# Workload parameters
# -------------------------------------------------------------------
ocp_username: "{{ requester_username | replace('@', '-') }}"
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
ocp4_workload_shared_cluster_access_create_quota: true
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-shared-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "16"
    limits.cpu: "16"
    requests.memory: 20Gi
    limits.memory: 45Gi
    pods: "30"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    display_name: OpenShift 4.10 Shared Environment
    category: Labs
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp410
    - shared
    - sharedenv
    labels:
      #OpenShift_Version: "4.6"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHPDS
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: ocp_username
  secrets:
  - name: opentlc
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
