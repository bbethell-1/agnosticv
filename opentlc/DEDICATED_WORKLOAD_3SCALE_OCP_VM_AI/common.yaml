---
# Platform
platform: labs

# Config
env_type: ocp-workshop
software_to_deploy: openshift
install_openshiftapb: false
# ignore_self_provisioners: true
install_ipa_client: false
run_ocp_diagnostics: false
key_name: ocpkey
# install_ipa_client and ipa_host_password passed from cloudforms

# subdomain_base_suffix and HostedZoneIdcome arises from the account

# Repos
ig_version: 1.5.2
osrelease: 3.11.154
# osrelease and ig_version passed from cloudforms dialog parameter
repo_method: file

# OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
user_password: openshift

# Default workloads are a YAML list
default_workloads:
  - ocp-workload-3scale-ocp-vm-ai

agnosticv_meta:
  params_to_variables:
    nodecount: node_instance_count
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
  secrets:
    - gpte
    - ocp4_token
