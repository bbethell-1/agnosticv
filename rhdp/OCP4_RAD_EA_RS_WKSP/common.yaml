# -------------------------------------------------------------------
# Workload: ocp4_workload_minio
# -------------------------------------------------------------------
# Latest release is : RELEASE.2023-06-19T19-52-50Z
# Image from : quay.io/minio/minio
ocp4_workload_minio_project: ic-shared-minio
# Port for the LoadBalancer Service
ocp4_workload_minio_port: 9000
ocp4_workload_minio_storage_size: "150Gi"
ocp4_workload_minio_access_key: minio
ocp4_workload_minio_secret_key: minio123
# Use current (2024) Minio image:
#   Setting up Minio is only supported for the new image
