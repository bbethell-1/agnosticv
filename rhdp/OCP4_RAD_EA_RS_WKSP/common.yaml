ocp4_workload_s3_model_copy_to_minio_secret_key: "{{ ocp4_workload_minio_secret_key }}"
ocp4_workload_s3_model_copy_to_minio_bucket: ""
ocp4_workload_s3_model_copy_to_minio_endpoint: "http://minio.{{ ocp4_workload_minio_project }}.svc.cluster.local:9000/"

ocp4_workload_s3_model_copy_to_minio_modern_deployment: "{{ ocp4_workload_minio_modern_deployment }}"
ocp4_workload_s3_model_copy_to_minio_root_user: "{{ ocp4_workload_minio_root_user }}"
ocp4_workload_s3_model_copy_to_minio_root_password: "{{ ocp4_workload_minio_root_password }}"

#s3 access parameters
