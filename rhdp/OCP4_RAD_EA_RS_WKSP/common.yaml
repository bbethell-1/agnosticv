ocp4_workload_minio_root_password: minio123
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
  - backstage-bucket

# -------------------------------------------------------------------
# Workload: ocp4_workload_s3_model_copy_to_minio
# -------------------------------------------------------------------
