---
# -------------------------------------------------------------------
# --- Catalog Item: Showcase
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-ai-rhel-agentic-ai.yaml
#include /includes/secrets/zerossl.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
aws_region: us-east-2 # this is default region but overriden by the aws-region2 parameter include

common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Platform and cloud_tags
# -------------------------------------------------------------------

platform: RHPDS

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# --------------------------------------------------------------------
# Repos and packages set-repositories
# --------------------------------------------------------------------

repo_method: satellite

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - ansible
  - bash-completion
  - bind-utils
  - git
  - podman
  - python3.12
  - python3.12-devel
  - buildah
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: software_workloads
#   - agnosticd.ai.setup_python_env - Pythonvenv and modern 3.12 python
#   - agnosticd.ai.service_vm_jupyter_lab - setus up jupyter as a systemd service and enable/starts it
#   - vscode-server - vscode-server as a courtesy for showroom users who want an editor
# -------------------------------------------------------------------

software_workloads:
  bastions:

    - agnosticd.ai.setup_python_env
    - agnosticd.ai.service_vm_jupyter_lab
    - vscode-server

# -------------------------------------------------------------------
# Workloads: setup_python_env_python_version
# -------------------------------------------------------------------

setup_python_env_python_version: "3.12"
setup_python_env_default_user: "{{ student_name }}"
setup_python_env_create_default_venv: true
setup_python_env_create_default_venv_name: venv

# -------------------------------------------------------------------
# Role: service_vm_jupyter_lab
# -------------------------------------------------------------------

service_vm_jupyter_lab_domain_name: "{{ bastion_instance_name }}.{{ guid}}{{ subdomain_base_suffix }}"
service_vm_jupyter_lab_jupyter_user: "{{ student_name }}"
service_vm_jupyter_lab_jupyter_ssl_dir: "/home/{{ service_vm_jupyter_lab_jupyter_user }}/.jupyter/ssl"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------

vscode_auth_type: none

vscode_server_version: "4.98.2" # NOTE No leading `v` due to braindead url which mixes v and non v semantic versions
vscode_server_rpm_url: >-
  https://github.com/coder/code-server/releases/download/v{{ vscode_server_version }}/code-server-{{
  vscode_server_version }}-amd64.rpm

vscode_server_install_vscode: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
vscode_user_name: "{{ student_name }}"
vscode_server_default_extensions: []
vscode_server_extension_urls: []

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true
  },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Clone lab environment
    type: git
    src: "https://github.com/rhpds/llamastack-lab.git"
    dest: "/home/{{ student_name }}/lab"
    version: 'main'
    owner: "{{ student_name }}"
    group: users
    mode: '0755'

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/showroom_template_default.git
showroom_user: showroom
showroom_ui: zero-touch
showroom_ui_zero_bundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty
  - web1
  - web2
  - web3
  - web4

showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"
showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_tab_web1_url: "https://{{ showroom_host }}:8443/"
showroom_tab_web1_name: Codeserver

showroom_tab_web2_url: "https://{{ showroom_host }}:9443/"
showroom_tab_web2_name: "Jupyter Lab"

showroom_tab_web3_url: "https://llama-stack.readthedocs.io/en/latest/"
showroom_tab_web3_name: "Llamastack Docs"

showroom_tab_web4_url: "https://cats.com/"
showroom_tab_web4_name: "Cats"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: lab-dev
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

bastion_instance_image: RHEL95GOLD-latest
bastion_instance_name: showroom
bastion_instance_type: t3a.medium
bastion_rootfs_size: 50

# -------------------------------------------------------------------
# AMI Config - tmp for RHEL AI Eng CI
# -------------------------------------------------------------------

instances:

  - name: "{{ bastion_instance_name }}"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - ShowroomSG
      - CodeserverSG
      - JupyterSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: CodeserverSG
    rules:

      - name: Codeserver
        description: "Codeserver Port"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: LEChallange
        description: LEChallange Port
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: JupyterSG
    rules:

      - name: Jupyter
        description: "Jupyter Port"
        from_port: 9443
        to_port: 9443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

