---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-gpu.yaml

#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/showroom-shared-cluster1.yaml


# ---------------------------------------------------------------------
# Mandatory Variabless
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Software Workloads
# --------------------------------------------------------------------

software_workloads: []

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

post_software_workloads: []

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

use_content_view: false
update_packages: false  # Do you want to run a full yum update
bastion_install_basic_packages: false
agd_install_common: false # Immutable OS

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: "{{ undefined() }}"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - name: Ensure files directory exists for assets
    type: file
    path: /etc/ilab
    state: directory

  - name: Ensure files directory exists for assets
    type: file
    path: /etc/ilab/insights-opt-out
    state: touch

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes
    marker: "# {mark} Our custom SSH settings via Ansible"

  - description: Restart sshd to pick up new configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

# TODO: Need AI user role

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

# This generic RHEL AI AMI has been wired up for cloud-user to have the models predownloaded.
student_name: cloud-user
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
agd_user_create_ansible_service_account: true
config_user_preferred_python: false

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

bastion_rootfs_size: 1024

# Even though it will just be RHEL AI 1.5 for now, keep this in case
# we need to add more images in the future.
bastion_instance_image_mapping:
  default: RHELAI15-latest
  RHEL AI 1.5: RHELAI15-latest

bastion_instance_image: >-
  {{
    bastion_instance_image_mapping[bastion_instance_image_param | default("default")]
    | default(bastion_instance_image_mapping.default)
  }}

remote_user: cloud-user
ansible_user: cloud-user

instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(1024)  }}"
    security_groups:
      - BastionSG
      - ParasolSG
      - InstructLabSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ParasolSG
    rules:

      - name: ParasolHTTP
        description: "Parasol HTTP Port"
        from_port: 8005
        to_port: 8005
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: InstructLabSG
    rules:

      - name: InstructLabAPI
        description: "InstructLab API Port"
        from_port: 8000
        to_port: 8010 # lets open up a few ports for now
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 1C09AB06-6582-476B-BB49-0DB55FEFA3AE
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "RHEL AI VM"
    category: Labs
    keywords:
      - rhel
      - ai
      - nvidia
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g6.xlarge
          enum:
            - g6.xlarge
            - g6.12xlarge
      - name: bastion_instance_image_param
        description: RHEL AI Version
        formLabel: RHEL AI Version
        openAPIV3Schema:
          type: string
          default: RHEL AI 1.5
          enum:
            - RHEL AI 1.5
    reportingLabels:
      primaryBU: Artificial_Intelligence
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2026-03-10
      pull: missing
