---

# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, test, production, event
# --------------------------------------------------------------------

purpose: development

# --------------------------------------------------------------------
# Software Workloads
# --------------------------------------------------------------------

software_workloads:
  bastions:
    - s3_asset_injector

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/taylorjordanNC/showroom_rhelai_etx
ocp4_workload_showroom_content_only: true

showroom_deploy_shared_cluster_enable: true

##########################
# Babylon meta variables #
##########################

__meta__:
  asset_uuid: 1C09AB06-6582-476B-BB49-0DB55FEFA3AE
  access_control:
    allow_groups:
      - rhpds-devs-instructlab
      - rhpds-devs-ai
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "RHEL AI (GA) VM"
    category: Labs
    keywords:
      - rhel
      - ai
      - instructlab
      - nvidia
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g6.xlarge
          enum:
            - g6.xlarge
            - g6.12xlarge
            - g6e.12xlarge
  sandbox_api:
    reservation: pgpu
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
