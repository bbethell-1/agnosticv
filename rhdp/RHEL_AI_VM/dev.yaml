---
# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development

env_type: base-infra
cloud_provider: ec2
ansible_user: cloud-user
remote_user: cloud-user

software_to_deploy: empty

agnosticd_preserve_user_data: true

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

student_name: instruct
student_password: "{{ common_password }}"

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
agd_user_create_ansible_service_account: true
config_user_preferred_python: false


software_workloads: []

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - name: Ensure files directory exists for assets
    type: file
    path: /etc/ilab
    state: directory

  - name: Ensure files directory exists for assets
    type: file
    path: /etc/ilab/insights-opt-out
    state: touch

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes
    marker: "# {mark} Our custom SSH settings via Ansible"

  - description: Restart sshd to pick up new configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# package stuff
# -------------------------------------------------------------------

use_content_view: false
update_packages: false  # Do you want to run a full yum update

bastion_install_basic_packages: false
agd_install_common: false # Immutable OS

repo_method: "{{ undefined() }}"
# -------------------------------------------------------------------
# security_groups
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: ParasolSG
    rules:

      - name: ParasolHTTP
        description: "Parasol HTTP Port"
        from_port: 8005
        to_port: 8005
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: InstructLabSG
    rules:

      - name: InstructLabAPI
        description: "InstructLab API Port"
        from_port: 8000
        to_port: 8004 # lets open up a few ports for now
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: g6.xlarge # t3a.large
bastion_rootfs_size: 1024

# -------------------------------------------------------------------
# Instructlab Instance Config
# -------------------aws_ami_region_mapping:------------------------------------------------
aws_ami_region_mapping:
  us-east-2:
    RHELAIRC2: ami-0be2f5c0ca770a10f

bastion_instance_image: RHELAIRC2

instances:

  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: RHELAIRC2 # ami-0abcb3d13703a4978   #:"ami-0be2f5c0ca770a10f"  #{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size  }}"
    security_groups:
      - BastionSG
      - ParasolSG
      - ShowroomSG
      - InstructLabSG

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
