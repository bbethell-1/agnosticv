purpose: development
security_groups:
- name: ShowroomSG
  rules:
  - name: ShowroomHTTPS
    description: Primary showroom endpoint - for reverse proxy
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
- name: AISG
  rules:
  - name: AIPORTS
    description: Selection of ports for llm, chatbots etc
    from_port: 8000
    to_port: 8010
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
  - name: AI5901
    description: Selection of ports for llm, chatbots etc
    from_port: 5901
    to_port: 5901
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
showroom_git_repo: https://github.com/taylorjordanNC/showroom_instructlab_summit2024.git
showroom_git_ref: v19-updates-instructlab-classic
showroom_ttys_enable_tmux: true
post_software_workloads:
  bastions:
  - agnosticd.ai.setup_nvidia_cuda
  - agnosticd.ai.setup_instructlab
setup_nvidia_cuda_nvidia_rhel_dnf_packages:
- '@nvidia-driver:latest-dkms'
- cuda-toolkit-12-4
- nvidia-fabric-manager
- libcudnn8
- libcudnn8-devel
- cuda-cccl-12-4
- libnccl-2.22.3-1+cuda12.4
setup_instructlab_llama_cpp_python_version: 0.2.79
setup_instructlab_git_ref: v0.19.3
asset_injector_assets:
- description: Create files directory
  type: directory
  path: '/home/{{ student_name }}/files owner: "{{ student_name }}" group: users mode: ''0755'''
- description: Fetch the old trained LLM
  type: http
  dest: /home/{{ student_name }}/files/ggml-ilab-pretrained-Q4_K_M.gguf
  src: https://gpte-public.s3.amazonaws.com/llms/ggml-ilab-pretrained-Q4_K_M.gguf
  owner: '{{ student_name }}'
  group: users
  mode: u=rw,g=r,o=r
- description: Clone repo with qna.yaml file
  type: git
  src: https://github.com/rhai-code/instructlab_knowledge.git
  dest: /home/{{ student_name }}/files/instructlab_knowledge
  version: main
  owner: '{{ student_name }}'
  group: users
  mode: '0755'
- description: Clone repo with cleanup script
  type: git
  src: https://github.com/rhai-code/workshop_reset_scripts.git
  dest: /home/{{ student_name }}/files/reset
  version: main
  owner: '{{ student_name }}'
  mode: '0755'
- description: Change reset script to executable
  type: command
  cmd: chmod 0755 /home/{{ student_name }}/files/reset/cleanup_and_reset.sh
- description: Remove 50-cloud-init.conf, ssh issue
  type: remove
  path: /etc/ssh/sshd_config.d/50-cloud-init.conf
- description: Remove 50-redhat.conf, ssh issue
  type: remove
  path: /etc/ssh/sshd_config.d/50-redhat.conf
- description: Update sshd_config for password auth
  type: blockinfile
  path: /etc/ssh/sshd_config
  state: present
  marker: '# {mark} Our custom SSH settings via Ansible'
  block: '# Our custom SSH settings via Ansible

    ChallengeResponseAuthentication no

    PasswordAuthentication yes

    UsePAM yes

    '
- description: Restart sshd to pick up new password support configuration
  type: service
  name: sshd
  state: restarted
__meta__:
  deployer:
    scm_ref: summit-connect-instruct-01
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: summit-connect-instruct-01
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
