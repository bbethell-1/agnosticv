---
#include /includes/ee-multicloud-dev.yaml

# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development

security_groups:

  - name: ShowroomSG
    rules:
      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: AISG
    rules:

      - name: AIPORTS
        description: Selection of ports for llm, chatbots etc
        from_port: 8000
        to_port: 8010
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: AI5901
        description: Selection of ports for llm, chatbots etc
        from_port: 5901
        to_port: 5901
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
