---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-instructlab.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/hugging-face-ro-token.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

software_workloads:
  bastions:

    - agnosticd.ai.setup_nvidia_cuda
    - agnosticd.ai.setup_instructlab

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------

setup_nvidia_cuda_nvidia_rhel_dnf_packages:

  - "@nvidia-driver:latest-dkms"
  - cuda-toolkit-12-4
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - cuda-cccl-12-4
  - libnccl-2.22.3-1+cuda12.4.x86_64

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_instructlab
# -------------------------------------------------------------------

setup_instructlab_llama_cpp_python_version: "0.2.79"
setup_instructlab_git_ref: "v0.19.3"

# -------------------------------------------------------------------
# Workloads: showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/showroom_instructlab_summit_connect.git
showroom_git_ref: v19-updates-summit-connect-tag-1.1.0

showroom_user: showroom
showroom_ui: default

showroom_tab_services:
  - double_tty
  - parasol

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_ttys_enable_tmux: true

# TODO: Add a parasol port var

showroom_tab_web1_url: "http://{{ showroom_host }}:8005/v1"
showroom_tab_web1_name: Parasol

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:
  - at
  - ansible
  - bash-completion
  - bind-utils
  - git
  - podman
  - python3.11
  - python3.11-devel
  - python3.11-pip
  - tree
  - vim-enhanced
  - wget
  - zip

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# --------------------------------------------------------------------
# Asset Injection
# --------------------------------------------------------------------

asset_injector_assets:

  - description: Create files directory
    type: directory
    path: >-
      /home/{{ student_name }}/files
      owner: "{{ student_name }}"
      group: users
      mode: '0755'

  - description: Clone repo with qna.yaml file
    type: git
    src: 'https://github.com/rhai-code/backToTheFuture.git'
    dest: '/home/{{ student_name }}/files/backToTheFuture'
    version: 'main'
    owner: "{{ student_name }}"
    group: users
    mode: '0755'

# Replace below with new model when ready in HuggingFace

  - description: LLM fetch summit-connect-merlinite-lab-Q4
    type: http
    dest: >-
      /home/{{ student_name }}/files/summit-connect-merlinite-lab-Q4.gguf
    src: >-
      https://d18h2xbjo1t4w8.cloudfront.net/ai-assets/summit-connect-merlinite-lab-Q4.gguf
    url_username: "{{ s3_rhpds_private_username }}"
    url_password: "{{ s3_rhpds_private_password }}"
    owner: "{{ student_name }}"
    group: users
    mode: u=rw,g=r,o=r

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: instruct
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Cloud Tags
# -------------------------------------------------------------------

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 100
rootfs_size_bastion: 1024
bastion_rootfs_size: 200

bastion_instance_image: RHEL95GOLD-latest

instances:

  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(100)  }}"
    security_groups:
      - BastionSG
      - ParasolSG
      - ShowroomSG
      - InstructLabSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: ParasolSG
    rules:

      - name: ParasolHTTP
        description: "Parasol HTTP Port"
        from_port: 8005
        to_port: 8005
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: InstructLabSG
    rules:

      - name: InstructLabAPI
        description: "InstructLab API Port"
        from_port: 8000
        to_port: 8010 # lets open up a few ports for now
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: DCA7D7C6-AC68-4406-B1B4-1B83E07AF36F
  owners:
    maintainer:
      - name: Tony Kay
        email: tkay@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    reportingLabels:
      primaryBU: Artificial_Intelligence
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Advanced InstructLab Workshop - Train a LLM for the Parasol Insurance Company"
    category: Labs
    keywords:
      - instructlab
      - parasol
      - rhel
      - ai
      - nvidia
      - cuda
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Featured_Score: '91'
    multiuser: false
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
            - us-west-2
            - us-east-1
            - eu-central-1
            - ap-northeast-1
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g6.xlarge
          enum:
            - g6.xlarge
            - g6.4xlarge
            - g6.12xlarge
            - g5.xlarge
            - g5.4xlarge
            - g4dn.xlarge
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
