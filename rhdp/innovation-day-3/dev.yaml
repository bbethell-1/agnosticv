purpose: development
software_workloads:
  bastions:
  - agnosticd.ai.setup_nvidia_cuda
  - agnosticd.ai.setup_python_env
  - agnosticd.ai.service_vm_ollama
  - agnosticd.ai.service_vm_jupyter_lab
  - agnosticd.ai.setup_rhaiis_on_rhel
setup_rhaiis_on_rhel_vllm_model: RedHatAI/granite-3.1-8b-instruct-quantized.w8a8
setup_rhaiis_on_rhel_vllm_container_image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.0.0
setup_rhaiis_on_rhel_hf_token: '{{ huggingface_ro_token }}'
setup_rhaiis_on_rhel_registry_username: '{{ rhaiis_registry_username }}'
setup_rhaiis_on_rhel_registry_password: '{{ rhaiis_registry_password }}'
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
