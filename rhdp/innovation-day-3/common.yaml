---
# -------------------------------------------------------------------
# --- Catalog: Innovation Day 3 2025
# --- Catalog Item: Innovation Day 3
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rh-ai-2025.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-gpu-us.yaml

#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/demosat-ai-rhel-agentic-ai.yaml

# #include /includes/secrets/zerossl.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
aws_region: us-east-2 # this is default region but overriden by the aws-region2 parameter include

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Platform and cloud_tags
# -------------------------------------------------------------------

platform: RHPDS

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# --------------------------------------------------------------------
# Repos and packages set-repositories
# --------------------------------------------------------------------

repo_method: satellite

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - ansible
  - bash-completion
  - bind-utils
  - git
  - podman
  - python3.12
  - python3.12-devel
  - buildah
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: software_workloads
#   - agnosticd.ai.setup_nvidia_cuda - Cuda for ollama and local LLMs on the bastions
#   - agnosticd.ai.setup_python_env - Pythonvenv and modern 3.12 python
#   - agnosticd.ai.service_vm_ollama - setups ollama as a systemd service and enables/starts it
#   - agnosticd.ai.service_vm_jupyter_lab - setus up jupyter as a systemd service and enable/starts it
#   Removed: - vscode-server - vscode-server as a courtesy for showroom users who want an editor
# -------------------------------------------------------------------

software_workloads:
  bastions:

    - agnosticd.ai.setup_nvidia_cuda
    - agnosticd.ai.setup_python_env
    - agnosticd.ai.service_vm_ollama
    - agnosticd.ai.service_vm_jupyter_lab

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------

setup_nvidia_cuda_python_version: '3.12'
setup_nvidia_cuda_cuda_version: '12.8'
setup_nvidia_cuda_cuda_major_version: '12'
setup_nvidia_cuda_cuda_minor_version: '8'

setup_nvidia_cuda_rhel_repos:
  - name: cuda-rhel-x86_64
    description: NVIDIA CUDA Repository
    baseurl: https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64
    enabled: true
    gpgcheck: false
    exclude: "cccl-13*"

setup_nvidia_cuda_nvidia_rhel_dnf_packages:

  - "@nvidia-driver:open-dkms"
  - "cuda-toolkit-{{ setup_nvidia_cuda_cuda_major_version }}-{{ setup_nvidia_cuda_cuda_minor_version }}"
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - "libnccl-2.26.2-1+cuda12.8.x86_64"

# -------------------------------------------------------------------
# Workloads: setup_python_env_python_version
# -------------------------------------------------------------------

setup_python_env_python_version: "3.12"
setup_python_env_default_user: "{{ student_name }}"
setup_python_env_create_default_venv: true
setup_python_env_create_default_venv_name: venv

# -------------------------------------------------------------------
# Workloads: service_vm_ollama_models
# -------------------------------------------------------------------

service_vm_ollama_models:

  - "granite3.3"

# -------------------------------------------------------------------
# Role: service_vm_jupyter_lab
# -------------------------------------------------------------------

service_vm_jupyter_lab_domain_name: "{{ bastion_instance_name }}.{{ guid}}{{ subdomain_base_suffix }}"
service_vm_jupyter_lab_jupyter_user: "{{ student_name }}"
# short term hack :( Fix Monday in the AgD role)
service_vm_lab_juypter_user: "{{ student_name }}"
service_vm_jupyter_lab_jupyter_ssl_dir: "/home/{{ service_vm_lab_juypter_user }}/.jupyter/ssl"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Clone lab environment
    type: git
    src: "https://github.com/rhpds/innovation-day-3-2025-lab.git"
    dest: "/home/{{ student_name }}/lab"
    version: 'main'
    owner: "{{ student_name }}"
    group: users
    mode: '0755'

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/showroom-innovation-day-3-2025.git
showroom_user: showroom
showroom_ui: default

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - web1
  - double_tty

showroom_ttys_enable_tmux: false

showroom_lab_users:
  - "{{ student_name }}"
showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_tab_web1_url: "https://{{ showroom_host }}:9443/"
showroom_tab_web1_name: "JupyterLab"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: dev
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

bastion_instance_image: RHEL95GOLD-latest
bastion_instance_name: dev
bastion_rootfs_size: 200

# -------------------------------------------------------------------
# AMI Config - tmp for RHEL AI Eng CI
# -------------------------------------------------------------------

instances:

  - name: "{{ bastion_instance_name }}"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - ShowroomSG
      - AIServicesSG
      - LLamaStackServicesSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:

      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: LEChallange
        description: LEChallange Port
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: Jupyter
        description: "Jupyter Port"
        from_port: 9443
        to_port: 9443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: AIServicesSG
    rules:

      - name: OllamaPort
        description: "Default Ollama Port if exposed"
        from_port: 11434
        to_port: 11434
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: VLLMPort
        description: "Default VLLM Port if exposed"
        from_port: 8000
        to_port: 8000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BonusPorts
        description: "Extra ports for additional services"
        from_port: 8001
        to_port: 8010
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: Streamlit
        description: "Streamlit default Port"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: LLamaStackServicesSG
    rules:

      - name: LlamaStackUIprod
        description: "React Llamastack rod port"
        from_port: 3000
        to_port: 3000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: LlamaStackUIdev
        description: "React Llamastack dev port"
        from_port: 5000
        to_port: 5000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: LlamaStackServer
        description: "LlamaStackServer default Port"
        from_port: 8321
        to_port: 8321
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
