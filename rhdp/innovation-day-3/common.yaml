    category: Labs
    workshopLabUiRedirect: true
    keywords:
      - rhel
      - ai
      - innovation-day
      - rag
      - langchain
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
            - us-west-2
            - us-east-1
            - eu-central-1
            - ap-northeast-1
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g4dn.xlarge
          enum:
            - g4dn.xlarge
            - g5.xlarge
            - g6.xlarge
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-02-14
      pull: missing
  sandbox_api:
