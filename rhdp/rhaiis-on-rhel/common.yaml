---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rh-ai-2025.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-gpu.yaml

#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/demosat-ai-rhel-agentic-ai.yaml
#include /includes/secrets/hugging-face-ro-token.yaml
#include /includes/secrets/rhaiis-registry.yaml

#include /includes/secrets/zerossl.yaml


# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
aws_region: us-east-2 # this is default region but overriden by the aws-region2 parameter include

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Platform and cloud_tags
# -------------------------------------------------------------------

platform: RHPDS

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# --------------------------------------------------------------------
# Repos and packages set-repositories
# --------------------------------------------------------------------

repo_method: satellite

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - ansible
  - bash-completion
  - bind-utils
  - git
  - podman
  - python3.12
  - python3.12-devel
  - buildah
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: software_workloads
# -------------------------------------------------------------------

software_workloads:
  bastions:

    - agnosticd.ai.setup_nvidia_cuda
    - agnosticd.ai.setup_python_env
    - agnosticd.ai.setup_rhaiis_on_rhel

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------

setup_nvidia_cuda_python_version: '3.12'
setup_nvidia_cuda_cuda_version: '12.8'
setup_nvidia_cuda_cuda_major_version: '12'
setup_nvidia_cuda_cuda_minor_version: '8'
setup_nvidia_cuda_nvidia_rhel_dnf_packages:

# We may be able to cut this down, TODO
  - "@nvidia-driver:open-dkms"
  - "cuda-toolkit-{{ setup_nvidia_cuda_cuda_major_version }}-{{ setup_nvidia_cuda_cuda_minor_version }}"
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - "cuda-cccl-{{ setup_nvidia_cuda_cuda_major_version }}-{{ setup_nvidia_cuda_cuda_minor_version }}"
  - "libnccl-2.26.2-1+cuda12.8.x86_64"        # Make sure you choosle the correct version...
  - nvidia-container-toolkit

# -------------------------------------------------------------------
# Workloads: setup_python_env_python_version
# -------------------------------------------------------------------

setup_python_env_python_version: "3.12"
setup_python_env_default_user: "{{ student_name }}"
setup_python_env_create_default_venv: true
setup_python_env_create_default_venv_name: venv

# -------------------------------------------------------------------
# Workloads: setup_rhaiis_on_rhel
# -------------------------------------------------------------------

setup_rhaiis_on_rhel_vllm_container_image_tag: "3.2.1"
setup_rhaiis_on_rhel_vllm_container_image: >-
  "registry.redhat.io/rhaiis/vllm-cuda-rhel9:{{ setup_rhaiis_on_rhel_vllm_container_image_tag }}"
setup_rhaiis_on_rhel_hf_token: "{{ huggingface_ro_token }}"
setup_rhaiis_on_rhel_registry_username: "{{ rhaiis_registry_username }}"
setup_rhaiis_on_rhel_registry_password: "{{ rhaiis_registry_password }}"
# setup_rhaiis_on_rhel_registry_auth_token: "{{ rhaiis_registry_auth_token }}"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_user: showroom
showroom_ui: default

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty

showroom_ttys_enable_tmux: false

showroom_lab_users:
  - "{{ student_name }}"
showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: dev
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

bastion_instance_image: RHEL95GOLD-latest
bastion_instance_name: rhaiis
bastion_rootfs_size: 200

# -------------------------------------------------------------------
# AMI Config - tmp for RHEL AI Eng CI
# -------------------------------------------------------------------

instances:

  - name: "{{ bastion_instance_name }}"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - ShowroomSG
      - AIServicesSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:

      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: LEChallange
        description: LEChallange Port
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: Jupyter
        description: "Jupyter Port"
        from_port: 9443
        to_port: 9443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: AIServicesSG
    rules:

      - name: VLLMPort
        description: "Default VLLM Port if exposed"
        from_port: 8000
        to_port: 8000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BonusPorts
        description: "Extra ports for additional services"
        from_port: 8001
        to_port: 8010
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: a63be264-b86c-4365-b0ed-fd5b6b166709
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    reportingLabels:
      primaryBU: Artificial_Intelligence
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Base Red Hat AI Inference Server (RHAIIS)"
    category: Demos
    keywords:
      - rhel
      - ai
      - rhaiis
    labels:
      Product: Red_Hat_AI_Inference_Server
      Product_Family: Red_Hat_AI
      Provider: RHDP
    multiuser: false
    parameters:
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g5.xlarge
          enum:
            - g4dn.xlarge
            - g4dn.12xlarge
            - g5.xlarge
            - g6.xlarge
            - g6.12xlarge
            - g6e.xlarge
      - name: showroom_git_repo
        description: Showroom git repo
        formLabel: Showroom git repo
        openAPIV3Schema:
          type: string
          default: 'https://github.com/rhpds/rhaiis-on-rhel-showroom'
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    reservation: pgpu
  owners:
    maintainer:
      - name: Tony Kay
        email: tok@redhat.com
      - name: Ritesh Shah
        email: rshah@redhat.com
    sme:
      - name: Tony Kay
        email: tok@redhat.com
      - name: Ritesh Shah
        email: rshah@redhat.com
    instructions:
      - name: Tony Kay
        email: tok@redhat.com
      - name: Ritesh Shah
        email: rshah@redhat.com
