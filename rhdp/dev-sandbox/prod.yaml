---
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: "{{ job_vars.namespace_suffix | default('dev') }}"
      cloud_selector:
        cloud: cnv-shared
        purpose: prod
        keycloak: 'yes'
        virt: "{{ job_vars.param_selector_virt | default('no') }}"
      quota:
        requests.storage: 100Gi
        limits.cpu: '10'
        requests.cpu: '10'
        limits.memory: 20Gi
        requests.memory: 20Gi
