---
#include /includes/catalog-icon-openshift.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# AgnosticD variables
# -------------------------------------------------------------------
env_type: namespace
cloud_provider: namespace

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 405bab52-1c2a-44e6-b180-f1c69d8a1103

  owners:
    maintainer:
      - name: Guillaume Core
        email: gucore@redhat.com
      - name: Alberto Gonzalez Rodriguez
        email: josegonz@redhat.com
    sme:
      - name: Guillaume Core
        email: gucore@redhat.com
      - name: Alberto Gonzalez Rodriguez
        email: josegonz@redhat.com

  # Do not run agnosticd at all
  deployer:
    actions:
      destroy:
        disable: true
      provision:
        disable: true
      stop:
        disable: true
      start:
        disable: true
      status:
        disable: true
      update:
        disable: true

  # Order from sandbox API.
  # TODO: this should be move as a default in the sandbox-api.yaml include
  sandbox_api:
    actions:
      start:
        enable: true
      stop:
        enable: true
      status:
        enable: true
      provision:
        enable: true
      destroy:
        enable: true

  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: namespace_suffix
        description: Namespace suffix ( sandbox-GUID-SUFFIX )
        formLabel: Namespace suffix
        openAPIV3Schema:
          type: string
          default: 'dev'
      - name: param_selector_virt
        description: Do you need OpenShift Virtualization?
        formLabel: OpenShift Virtualization
        openAPIV3Schema:
          type: string
          default: 'yes'
          enum:
            - 'yes'
            - 'no'
        sandboxCloudSelectors:
          - annotation: virt
            kind: OcpSandbox
    keywords:
      - openshift
      - sandbox
      - blank
    labels:
      Provider: RHDP
      Platform: Open_Environments
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    display_name: OpenShift Developer Namespace
    category: Open_Environments

  anarchy:
    namespace: babylon-anarchy-ocp-wksp
