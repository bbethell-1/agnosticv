#
#   openshift_cnv/ocp-dev-days-rdshw-combined
#
# Tag and scm_ref are set in the component's prod.yaml:
#   openshift_cnv/ocp-dev-days-rdshw-combined/prod.yaml
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 7b873a5a-a55d-4750-8d3d-3217864e8bdf
  owners:
    maintainer:
    - name: Tyrell Reddy
      email: treddy@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "OpenShift Dev Day Roadshow"
    category: Labs
    keywords:
    - dev-days
    - rhdh
    - gitops
    - dev-spaces
    labels:
      Provider: RHDP
      SLA: Featured
      Platform: OpenShift
      TDP1: Application_Platform
    reportingLabels:
      primaryBU: Hybrid_Platforms
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi
    parameters:
    - name: num_users
      description: "Number of tenant users to provision"
      formLabel: "Number of Users"
      openAPIV3Schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 30
      components:
      - name: ocp-dev-days-rdshw-combined

  components:
  - name: ocp-dev-days-rdshw-combined
    display_name: "OpenShift Dev Day Roadshow (Combined)"
    item: openshift_cnv/ocp-dev-days-rdshw-combined

  deployer:
    type: null
