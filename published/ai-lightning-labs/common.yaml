---
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# --- Catalog Item: AI Lightning Labs (Virtual CI)
#
# No changes should be made to this CI other than __meta__.
# All functional changes should go to the component:
#   summit-2026/ai-lightning-labs-combined
#
# JIRA: GPTEINFRA-17014
# -------------------------------------------------------------------

__meta__:
  asset_uuid: c2d3e4f5-6a7b-4c8d-9e0f-1a2b3c4d5e6f
  owners:
    maintainer:
      - name: Mike Hepburn
        email: mhepburn@redhat.com

  catalog:
    display_name: "AI Lightning Labs"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi
    keywords:
      - summit-2026
      - ai-lightning-labs
      - fft
      - wordswarm
      - voice-agents
    labels:
      Provider: RHDP
      Platform: AI
      TDP1: AI_Platform
    reportingLabels:
      primaryBU: Artificial_Intelligence
    parameters:
      - name: showroom_lab
        description: "Which AI Lightning lab to deploy for all tenants"
        formLabel: "Lab"
        openAPIV3Schema:
          type: string
          default: fft
          enum:
            - fft
            - wordswarm
            - voice-agents
          enumNames:
            - "Factory Floor Tycoon: Agentic AI"
            - "Wordswarm"
            - "Pizza Voice Agent"
        components:
          - name: ai-lightning-labs-combined

      - name: num_users
        description: "Number of tenant users to provision on the shared cluster"
        formLabel: "Number of Users"
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 15
        components:
          - name: ai-lightning-labs-combined

  components:
    - name: ai-lightning-labs-combined
      display_name: "AI Lightning Labs (Combined)"
      item: summit-2026/ai-lightning-labs-combined

  deployer:
    type: null
