---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

# -------------------------------------------------------------------
# --- Virtual CI: Field Sourced Content - RHEL Base (CNV)
# --- Base component: agd_v2/rhel-field-asset-cnv
# --- JIRA: RHDPCD-1581
#
# No changes should be made to this CI other than __meta__.
# All functional changes belong in the base component.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0e2fbca7-0236-46ae-ab15-0f0e801a38c2
  owners:
    maintainer:
      - name: Nate Stephany
        email: nstephan@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Field Sourced Content - RHEL Base"
    category: Labs
    keywords: []
    labels:
      Provider: RHDP
      Platform: RHEL
      # TODO: Add TDP label when available.
      # TDP: Server_Cloud_OS
    multiuser: false
    workshopUiDisabled: true
    workshop_user_mode: none
    reportingLabels:
      primaryBU: RHEL
    parameters:
      - name: node_instance_count
        description: Number of RHEL nodes to deploy
        formLabel: Node count
        required: true
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 8
        components:
          - name: rhel-field-asset-cnv

      - name: node_size
        description: Size applied to nodes
        formLabel: Node size
        required: true
        openAPIV3Schema:
          type: string
          default: small
          enum:
            - small
            - medium
            - large
        components:
          - name: rhel-field-asset-cnv

      - name: rhel_version
        description: RHEL major version for bastion and nodes (latest image for that major)
        formLabel: RHEL version
        required: true
        openAPIV3Schema:
          type: string
          default: rhel9
          enum:
            - rhel9
            - rhel10
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_existing_content
        description: Point this environment at an Ansible collection git repo
        formLabel: Existing content repo?
        formGroup: Field content
        openAPIV3Schema:
          type: boolean
          default: false
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_git_repo_url
        description: Git URL of an Ansible collection
        formLabel: Collection git repo
        formGroup: Field content
        formHideCondition: vm_workload_field_content_existing_content == false
        formRequireCondition: vm_workload_field_content_existing_content == true
        openAPIV3Schema:
          type: string
          default: ''
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_git_repo_revision
        description: Branch, tag, or commit
        formLabel: Git revision
        formGroup: Field content
        formHideCondition: vm_workload_field_content_existing_content == false
        formRequireCondition: vm_workload_field_content_existing_content == true
        openAPIV3Schema:
          type: string
          default: main
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_playbook
        description: >-
          Path to the playbook inside the collection (any filename you choose).
          This is what is executed when the environment is deployed.
        formLabel: Playbook entrypoint
        formGroup: Field content
        formHideCondition: vm_workload_field_content_existing_content == false
        formRequireCondition: vm_workload_field_content_existing_content == true
        openAPIV3Schema:
          type: string
          default: playbooks/deploy.yml
        components:
          - name: rhel-field-asset-cnv

      - name: private_content
        description: Repo requires an access token
        formLabel: Private git repo?
        formGroup: Field content
        formHideCondition: vm_workload_field_content_existing_content == false
        openAPIV3Schema:
          type: boolean
          default: false
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_git_repo_key
        description: Access token for a private git repo
        formLabel: Git access token
        formGroup: Field content
        formHideCondition: private_content == false
        formRequireCondition: private_content == true
        openAPIV3Schema:
          type: string
          default: ''
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_enable_bastion_proxy
        description: >-
          Installs Nginx reverse proxy on the bastion, listening on 8080 and 8443.
          Author playbooks can drop config into /etc/nginx/proxy.d/ to route
          traffic to services on workload nodes.
        formLabel: Install proxy on bastion?
        formGroup: Field content
        formHideCondition: vm_workload_field_content_existing_content == false
        openAPIV3Schema:
          type: boolean
          default: false
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_deploy_showroom
        description: Deploy Showroom from the same git repo
        formLabel: Deploy Showroom?
        formGroup: Showroom
        formHideCondition: vm_workload_field_content_existing_content == false
        openAPIV3Schema:
          type: boolean
          default: false
        components:
          - name: rhel-field-asset-cnv

      - name: vm_workload_field_content_showroom_path
        description: >-
          Directory in the collection repo that contains site.yml, ui-config.yml,
          and content/. Leave empty if Showroom lives at the repository root.
        formLabel: Alternative Showroom path
        formGroup: Showroom
        formHideCondition: vm_workload_field_content_deploy_showroom == false
        openAPIV3Schema:
          type: string
          default: ''
        components:
          - name: rhel-field-asset-cnv

  components:
    - name: rhel-field-asset-cnv
      display_name: "Field Sourced Content - RHEL Base (CNV)"
      item: agd_v2/rhel-field-asset-cnv

  deployer:
    type: null
