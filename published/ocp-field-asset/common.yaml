---
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
#
# --- Catalog Item: Field Sourced Content - OpenShift
#
# No changes should be made to this CI, other than __meta__
# All changes to the functional CI should be made to the component(s)
#
# agd_v2/ocp-field-asset-cnv
# agd_v2/ocp-field-asset-aws
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 005c89fa-d734-4834-8c1b-675bed876c97
  owners:
    maintainer:
    - name: Prakhar Srivastava
      email: psrivast@redhat.com
    - name: Nate Stephany
      email: nstephan@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Field Sourced Content - OpenShift Base"
    category: Workshops
    keywords:
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: ocp_cloud_provider
      formLabel: Cloud Provider
      openAPIV3Schema:
        type: string
        default: aws
        enum:
        - cnv
        - aws
      components:
      - name: current

    - name: cluster_size
      description: Single Node or Full Cluster
      formLabel: cluster_size
      required: true
      openAPIV3Schema:
        type: string
        default: 'sno'
        enum:
        - 'sno'
        - 'multinode'
      components:
      - name: all

    - name: host_ocp4_installer_version
      description: OpenShift version to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.22'
        enum:
        - '4.20'
        - '4.21'
        - '4.22'
      annotation: demo.redhat.com/ocp-version
      variable: host_ocp4_installer_version
      components:
      - name: all

    - name: worker_instance_count_param
      description: OpenShift Worker count
      formLabel: OpenShift Worker count
      formHideCondition: >-
        cluster_size != 'multinode'
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 10
      components:
      - name: all

    - name: ai_workers_memory
      description: OpenShift Worker memory
      formLabel: OpenShift Worker memory
      formHideCondition: >-
        cluster_size != 'multinode' || ocp_cloud_provider != 'cnv'
      openAPIV3Schema:
        type: string
        default: 8Gi
        enum:
        - '8Gi'
        - '16Gi'
        - '32Gi'
        - '64Gi'
        - '128Gi'
        minimum: 8Gi
        maximum: 128Gi
      components:
      - name: ocp-field-asset-cnv

    - name: ai_workers_cores
      description: OpenShift Worker CPU
      formLabel: OpenShift Worker CPU
      formHideCondition: >-
        cluster_size != 'multinode' || ocp_cloud_provider != 'cnv'
      openAPIV3Schema:
        type: integer
        default: 4
        enum:
        - 4
        - 8
        - 16
        - 32
        - 64
      components:
      - name: ocp-field-asset-cnv

    - name: worker_instance_type
      description: OpenShift Worker instance type
      formLabel: OpenShift Worker instance type
      formHideCondition: >-
        cluster_size != 'multinode' || ocp_cloud_provider != 'aws'
      openAPIV3Schema:
        type: string
        default: 'm5a.2xlarge'
        enum:
        - 'm5a.2xlarge'
        - 'm5a.4xlarge'
        - 'm5a.8xlarge'
      components:
      - name: ocp-field-asset-aws

    - name: open_environment
      description: >-
        Provides access to AWS account in which OpenShift is deployed. You can use this to deploy additional
        resources in the account. YOUR COST CENTER WILL BE CHARGED FOR THESE RESOURCES.
      formLabel: Enable OPEN Environment?
      formHideCondition: ocp_cloud_provider != 'aws'
      openAPIV3Schema:
        default: false
        type: boolean
      annotation: demo.redhat.com/open-environment
      variable: agnosticd_open_environment
      components:
      - name: ocp-field-asset-aws

    - name: enable_base_virt
      description: >-
        Install OpenShift Virtualization (operator and HyperConverged instance).
        Available on CNV only; AWS instance types in this catalog do not support nested virt.
      formLabel: OpenShift Virtualization
      formGroup: Select Base Workloads
      formHideCondition: ocp_cloud_provider != 'cnv'
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: ocp-field-asset-cnv

    - name: enable_base_rhoai
      description: >-
        Install OpenShift AI 3 (operator and Data Science Cluster).
        CPU-only by default. On AWS, provision GPU instances and install
        the GPU operator yourself if you need GPUs.
      formLabel: OpenShift AI
      formGroup: Select Base Workloads
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    - name: enable_base_aap
      description: >-
        Install Ansible Automation Platform (licensed controller).
        Hub, EDA, and AAP Lightspeed are not included.
      formLabel: Ansible Automation Platform
      formGroup: Select Base Workloads
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    - name: create_multi_user
      description: >-
        Create a configurable number of users on cluster.
      formLabel: Create users on cluster?
      formGroup: Users
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      formGroup: Users
      formHideCondition: create_multi_user == false
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 30
      components:
      - name: all

    - name: existing_gitops
      description: >-
        Do you want to provide an existing GitOps repo to deploy from?
      formLabel: Existing Gitops Repo?
      formGroup: GitOps
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    - name: ocp4_workload_field_content_gitops_repo_url
      description: >-
        The URL to the GitOps repo containing automation
      formLabel: GitOps Repo
      formGroup: GitOps
      formHideCondition: existing_gitops == false
      formRequireCondition: existing_gitops == true
      openAPIV3Schema:
        type: string
        default: ''
      components:
      - name: all

    - name: ocp4_workload_field_content_gitops_repo_revision
      description: >-
        The branch or tag of the repo that you want to use
      formLabel: GitOps Revision
      formGroup: GitOps
      formHideCondition: existing_gitops == false
      formRequireCondition: existing_gitops == true
      openAPIV3Schema:
        type: string
        default: "main"
      components:
      - name: all

    - name: ocp4_workload_field_content_gitops_repo_path
      description: >-
        The path in your GitOps repo that contains the initial application
      formLabel: GitOps Path
      formGroup: GitOps
      formHideCondition: existing_gitops == false
      formRequireCondition: existing_gitops == true
      openAPIV3Schema:
        type: string
        default: ''
      components:
      - name: all

    - name: private_gitops
      description: >-
        Is your GitOps repo private and requires an access token?
      formLabel: Private GitOps repo?
      formGroup: GitOps
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    - name: ocp4_workload_field_content_gitops_repo_key
      description: >-
        Provide an access token for a private Git repo
      formLabel: GitOps access key
      formGroup: GitOps
      formHideCondition: private_gitops == false
      formRequireCondition: private_gitops == true
      openAPIV3Schema:
        type: string
        default: ''
      components:
      - name: all

    # ===================================================================
    # OpenShift Lightspeed (OPTIONAL)
    # ===================================================================
    - name: enable_ols
      description: >-
        Install OpenShift Lightspeed.
      formLabel: OpenShift Lightspeed
      formGroup: OpenShift Lightspeed
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    # ===================================================================
    # LiteMaaS/MaaS Configuration (OPTIONAL - for AI/LLM demos)
    # ===================================================================
    - name: enable_litemaas_keys
      description: >-
        Enable automatic provisioning of LiteMaaS/MaaS API keys for AI/LLM demonstrations.
        Only check this if your GitOps repository deploys AI models (RAG, chatbots, etc.).
        This will create a temporary API key with configurable expiration.
      formLabel: Enable LiteMaaS/MaaS API Keys (for AI/LLM demos)
      formGroup: AI/LLM Configuration
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: all

    - name: litemaas_model
      description: >-
        Select the AI/LLM model to provision API access for.
        Your GitOps deployment can use this model via the auto-generated API key.
      formLabel: LiteMaaS Model
      formGroup: AI/LLM Configuration
      formHideCondition: enable_litemaas_keys == false
      required: false
      openAPIV3Schema:
        type: string
        default: 'llama-scout-17b'
        enum:
        - 'codellama-7b-instruct'
        - 'deepseek-r1-distill-qwen-14b'
        - 'gpt-oss-120b'
        - 'gpt-oss-20b'
        - 'granite-3-2-8b-instruct'
        - 'granite-4-0-h-tiny'
        - 'Llama-Guard-3-1B'
        - 'llama-scout-17b'
        - 'microsoft-phi-4'
        - 'minimax-m2'
        - 'nomic-embed-text-v1-5'
        - 'qwen3-14b'
        - 'qwen3-235b'
      components:
      - name: all

    - name: litemaas_duration
      description: >-
        How long the API key remains valid.
        The key will automatically expire after this period.
      formLabel: API Key Validity Period
      formGroup: AI/LLM Configuration
      formHideCondition: enable_litemaas_keys == false
      required: false
      openAPIV3Schema:
        type: string
        default: '7d'
        enum:
        - '3d'
        - '7d'
        - '10d'
        - '30d'
      components:
      - name: all

  components:
  - name: ocp-field-asset-cnv
    display_name: Field Sourced Content - OpenShift (CNV)
    item: agd_v2/ocp-field-asset-cnv
    when: ocp_cloud_provider | default('') == 'cnv'

  - name: ocp-field-asset-aws
    display_name: Field Sourced Content - OpenShift (AWS)
    item: agd_v2/ocp-field-asset-aws
    when: ocp_cloud_provider | default('') == 'aws'

  deployer:
    type: null
