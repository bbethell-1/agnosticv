# No config required
# See dev.yaml in component CI for details
---

# ArgoCD without ApplicationSet Controller does not make sense.
# Especially when you want to use apps-of-apps pattern.
ocp4_workload_openshift_gitops_applicationset_controller_update: true

__meta__:
  catalog:
    parameters:
    - name: host_ocp4_installer_version
      description: OpenShift version to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.22'
        enum:
        - '4.20'
        - '4.21'
        - '4.22'
      annotation: demo.redhat.com/ocp-version
      variable: host_ocp4_installer_version
      components:
      - name: ocp-field-asset-cnv

  components:
  - name: ocp-field-asset-cnv
    display_name: Field Sourced Content - OpenShift (CNV)
    item: agd_v2/ocp-field-asset-cnv/dev
