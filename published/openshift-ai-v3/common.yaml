# -------------------------------------------------------------------
# --- Catalog Item: Red Hat OpenShift AI 3 ---
#
# No changes should be made to this CI, other than __meta__
# All changes to the functional CI should be made to the component(s)
#
# agd_v2/openshift-ai-v3-aws
# openshift_cnv/openshift-ai-v3-cnv
#
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Any Region Logic implementation as directly include cannot be used
# because published CI uses main CI as component
# -------------------------------------------------------------------
aws_region_from_param_na:
- us-east-1
- us-east-2
- us-west-2
- ca-central-1

aws_region_from_param_emea:
- eu-central-1
- eu-north-1
- eu-west-2
- eu-west-3

aws_region_from_param_apac:
- ap-northeast-1
- ap-northeast-2
- ap-south-1
- ap-southeast-2

agnosticd_aws_capacity_reservation_regions: >-
  {{
  aws_region_from_param_na if aws_region_from_param == 'na' else
  aws_region_from_param_emea if aws_region_from_param == 'emea' else
  aws_region_from_param_apac
  }}

agnosticd_aws_capacity_reservation_enable: true
agnosticd_preserve_user_data: true

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c28ef7e2-31bf-4663-af25-834dd769c4a0
  owners:
    maintainer:
    - name: Tyrell Reddy
      email: treddy@redhat.com

  catalog:
    reportingLabels:
      primaryBU: Artificial_Intelligence
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Red Hat Openshift AI 3"
    category: Demos
    workshopUiDisabled: false
    multiuser: false
    keywords:
    - rhoai
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
    parameters:
    - name: gpu_instance_type
      description: Choose GPU instance type
      formLabel: GPU Instance Type
      required: true
      openAPIV3Schema:
        type: string
        default: g6.8xlarge
        enum:
        - g6.8xlarge
        - g6.12xlarge
        - g6.16xlarge
      components:
      - name: redhat-openshift-ai3-aws
    - name: aws_region_from_param
      description: >-
        AWS Region for G6 instance provisioning.
        Only regions with G6 (NVIDIA L4) availability are listed.
        Regions are: us-east-1, us-east-2, us-west-2, ca-central-1, eu-central-1, eu-north-1, eu-west-2, eu-west-3, ap-northeast-1, ap-northeast-2, ap-south-1, ap-southeast-2
      formLabel: Region
      required: true
      openAPIV3Schema:
        type: string
        default: na
        enum:
        - na
        - emea
        - apac
      components:
      - name: redhat-openshift-ai3-aws
  components:
  - name: redhat-openshift-ai3-aws
    display_name: "Red Hat Openshift AI 3 (AWS)"
    item: agd_v2/openshift-ai-v3-aws

  deployer:
    type: null
