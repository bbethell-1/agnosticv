---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
#

env_type: base-infra
cloud_provider: ec2

# -------------------------------------------------------------------
# Collection Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: ansible.windows
    version: 2.3.0
  - name: chocolatey.chocolatey
    version: 1.5.1

ansible_idm_setup_lab: false

# Installs locally to lab-user ~/.ansible/
galaxy_collections:
- ansible.windows
- microsoft.ad
- "https://gpte-public.s3.amazonaws.com/CI+Assets/Ansible+Windows+Workshop/redhat-rhel_system_roles-1.23.0.tar.gz"
- "https://gpte-public.s3.amazonaws.com/CI+Assets/Ansible+Windows+Workshop/redhat-rhel_idm-1.12.1.tar.gz"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Common Password, pulling from windows-password-generator role
# -------------------------------------------------------------------
# default common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

common_password: "{{ windows_ready_password }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
infra_images_predefined:
  RHEL93GOLD-latest:
    owner: "{{ infra_images_redhat_owner_id }}"
    name: RHEL-9.3.*_HVM-*Access*
    architecture: x86_64
    aws_filters:
      is-public: false

  WIN2019-latest:
    owner: "{{ windows_image_owner }}"
    name: Windows_Server-2019-English-Core-Base-*
    architecture: x86_64
    aws_filters:
      is-public: true

  WIN2022-latest:
    owner: "{{ windows_image_owner }}"
    name: Windows_Server-2022-English-Core-Base-*
    architecture: x86_64
    aws_filters:
      is-public: true

bastion_instance_image: RHEL93GOLD-latest
bastion_instance_type: t3a.medium
node_instance_image: RHEL93GOLD-latest
default_instance_type: t3a.medium
default_rootfs_size: 30
config_user_preferred_python: false
ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"

# Windows server config#
base_infra_windows_enable: true             # Bool from base-infra config to enable windows configuration
windows_server_instance_type: m5.2xlarge
windows_instance_image: WIN2022-latest      # Custom definition in infra_images_predefined:
agnosticd_images_windows: "{{ windows_ami }}"
windows_image_owner: "801119661308"         # "809721187735" for "Windows_Server-2019-English-Core-Base-*" "WIN2019-latest"
infra_images_redhat_owner_id: "309956199498"

install_win_ssh: true
install_student_user: true

# infra_windows_connection_facts_type: ssh

infra_windows_connection_facts_type: custom
infra_windows_connection_facts_ansible_become: false
infra_windows_connection_facts_ansible_connection: ssh
infra_windows_connection_facts_ansible_password: "{{ hostvars['localhost'].windows_ready_password }}"
infra_windows_connection_facts_ansible_host: "{{ public_dns_name }}"
infra_windows_connection_facts_ansible_port: 22
infra_windows_connection_facts_ansible_user: Administrator
infra_windows_connection_facts_cert_validation: ignore
infra_windows_connection_facts_aws_region_final: "{{ hostvars['localhost'].aws_region_final }}"
infra_windows_connection_facts_ansible_shell_type: cmd
infra_windows_connection_facts_ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

student_name: lab-user
student_password: "{{ common_password }}"
student_sudo: true

use_content_view: true
update_packages: true

agd_bastion_packages:
- bash-completion
- bind-utils
- git
- tree
- vim-enhanced
- wget
- zsh

common_packages_el9:
- at
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- python3-pip
- tree
- ansible-core

inventory_groups:
- nodes
- windows
- idm_servers
- bastions

security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: WebSG
  rules:
  - name: HTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: HTTPSPorts
    description: "HTTP Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: HostSG
  rules:
  - name: FromHostSG
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: -1
    from_group: HostSG
    rule_type: Ingress

- name: WinSG
  rules:
  - name: WinSGTCP
    description: "All TCP"
    from_port: 1
    to_port: 65535
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WinSGUdp
    description: "All UDP"
    from_port: 1
    to_port: 65535
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WinSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: ShowroomSG
  rules:
  - name: ShowroomHTTPS
    description: "Primary showroom endpoint - for reverse proxy"
    from_port: 8443
    to_port: 8443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: ShowroomExposed
    description: "Showroom views or exposed services, up to 26 of them"
    from_port: 8500
    to_port: 8525
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

instances:
- name: "{{ bastion_hostname | default('bastion') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions,showroom"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - BastionSG
  - WebSG
  - ShowroomSG

- name: "idmsrv"
  count: 1
  unique: true
  public_dns: false
  image: "{{ node_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "idm_servers"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - HostSG
  - WebSG

- name: "node"
  count: 2
  public_dns: false
  image: "{{ node_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - HostSG

- name: "windows"
  count: 1
  unique: true
  public_dns: true
  image: "{{ windows_instance_image | default('WIN2022-latest') }}"
  flavor:
    ec2: "{{ windows_server_instance_type | default('m5.xlarge') }}"
  networks:
  - default
  servicePort: 22 # WinRM port, ssh default is 22, http 5985, https 5986
  owner: "{{ windows_image_owner }}"
  tags:
  - key: "AnsibleGroup"
    value: "windows"
  - key: "ostype"
    value: "windows"
  security_groups:
  - DefaultSG
  - WinSG
  - HostSG
  UserData: |
    UserData:
            "Fn::Base64":
              "Fn::Join":
                - ""
                - - "<powershell>\n"
                  - "$admin = [adsi]('WinNT://./administrator, user')\n"
                  - "$admin.PSBase.Invoke('SetPassword', '{{ common_password }}')\n"
                  - "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n"
                  - "$scriptPath=((New-Object System.Net.Webclient).DownloadString('https://gpte-public.s3.amazonaws.com/CI+Assets/Ansible+Windows+Workshop/ConfigureRemotingForAnsibleLatestSSH.ps1'))\n"
                  - "Invoke-Command -ScriptBlock ([scriptblock]::Create($scriptPath)) \n"
                  - "</powershell>"
# Script path for winrm connection https://gpte-public.s3.amazonaws.com/CI+Assets/Ansible+Windows+Workshop/ConfigureRemotingForAnsibleLatest.ps1
# -ArgumentList '-GlobalHttpFirewallAccess'
# Script path for ssh connection https://gpte-public.s3.amazonaws.com/CI+Assets/Ansible+Windows+Workshop/ConfigureRemotingForAnsibleLatestSSH.ps1
# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: asset-injector
# -------------------------------------------------------------------

asset_injector_assets:
- description: Identity Management Anisble Directory
  src: https://github.com/mralph-rh/conf24.git
  dest: "/home/{{ student_name }}/conf24"
  type: git
  scm_ref: main
- description: Remove 50-cloud-init.conf, ssh issue
  type: remove
  path: /etc/ssh/sshd_config.d/50-cloud-init.conf

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_infra_workloads:
  localhost:
  - windows-password-generator

post_software_workloads:
  all_omit_local:
  - ansible_idm_setup_lab
  localhost:
  - agnosticv-userdata-import

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_deploy: false
showroom_git_repo: https://github.com/rhpds/Summit_2024_LB1401_Deploying_Red_Hat_Identity_Management.git
showroom_git_ref: main
showroom_var_inject: true
showroom_ssh_method: sshkey
showroom_ssh_username: "{{ student_name }}"
showroom_default_ssh_user: "{{ student_name }}"
showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
showroom_lab_users:
- "{{ student_name }}"
showroom_tab_services:
- single_terminal
showroom_user_password: "{{ common_password }}"
showroom_dnf_packages:
- git
- podman
- python3-devel
- systemd-container
- unzip

idm_server_url: "https://idmsrv.{{ guid }}{{ subdomain_base_suffix }}"
bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"

agnosticv_importdata:
  bastion_hostname: "{{ bastion_hostname }}"
  bastion_public_hostname: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
  socks_ssh_command: "ssh -D 5060 -C -N lab-user@{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
  admin_pass: "{{ common_password }}"
  page-links:
  - url: "https://redhat.com"
    text: "Red Hat"
  - url: "https://www.redhat.com/en/summit"
    text: "Summit"
  - url: "https://github.com/freeipa/ansible-freeipa"
    text: "ansible-freeipa Docs"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 164a32c5-78b6-4e6b-8d0a-6f5f5a857b29
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1401 - Deploying Red Hat Identity Management as a Lazy Sysadmin
    category: Red_Hat_Summit_2024
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: Red_Hat_Demo_Platform
    multiuser: false
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:temporary-pr-7751
      pull: missing
