---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/showroom-shared-410.yaml

# Defend yourself with RHEL security technologies

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security
cloud_provider: ec2
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
#update_packages: true

# admin user for infra workloads
admin_user: admin
user: ignore_user
#student_name: ec2-user

# Email is required for deployment... but really shouldn't be.
email: devops@opentlc.com

software_to_deploy: none

bastion_instance_type: t3a.medium
node_instance_type: t3a.medium

# -------------------------------------------------------------------
# Lab Variables
# -------------------------------------------------------------------

crypto_lab_setup: false
rhel_security_validate: false

# -------------------------------------------------------------------
# Instance Variable
# -------------------------------------------------------------------

bastion_instance_image: RHEL93GOLD-latest
node_instance_image: RHEL93GOLD-latest
#node7_instance_image: RHEL77GOLD-latest
nbde_instance_image: RHEL81NBDE

install_student_user: true
student_name: lab-user
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
student_password: "{{ common_password }}"
student_sudo: true

use_content_view: true

instances:
- name: "bastion"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: false
  image: "{{ bastion_instance_image }}"
  flavor:
    ec2: "{{ bastion_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  volumes:
  - name: '/dev/sda1'
    size: 20
  security_groups:
  - BastionSG
  - OpenEverythingSG

- name: "openscap"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: false
  image: "{{ bastion_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "openscap"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  volumes:
  - name: '/dev/sda1'
    size: 20
  security_groups:
  - BastionSG
  - OpenEverythingSG
  - RemoteDesktopRDPSG
  - RemoteDesktopVNCSG

- name: "aide"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "aide"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "gpg"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "gpg"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "audit"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "audit"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "firewalld"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "firewalld"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "ipsec"
  count: 2
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "ipsec"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenIPSECports
  - OpenEverythingSG

- name: "cryptopolicies"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "cryptopolicies"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "sessionrecording"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "sessionrecording"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "rhel8selinux"
  count: 2
  public_dns: false
  dns_loadbalancer: false
  image: "{{ node_instance_image }}"
  flavor:
    ec2: "{{ node_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "rhel8selinux"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  security_groups:
  - DefaultSG
  - OpenEverythingSG

- name: "nbde"
  count: 3
  # TODO: enable when we have a solution for number of maximum public IP address. Which is 5 currently in AWS
  public_dns: false
  dns_loadbalancer: false
  image: "{{ nbde_instance_image }}"
  flavor:
    ec2: "t2.medium"
    azure: Standard_A2_V2
  security_groups:
  - OpenNBDESG
  tags:
  - key: "AnsibleGroup"
    value: "nbde"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_deploy: true
#showroom_git_repo: https://github.com/rhpds/Summit_2024_LB1389_Discovering_Critical_Security_Features.git
showroom_git_ref: main
showroom_var_inject: true
showroom_ssh_method: sshkey
showroom_ssh_username: "{{ student_name }}"
showroom_default_ssh_user: "{{ student_name }}"
showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
showroom_lab_users:
- "{{ student_name }}"
showroom_tab_services: []

showroom_user_password: "{{ common_password }}"

showroom_deploy_shared_cluster_enable: true

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/Summit_2024_LB1389_Discovering_Critical_Security_Features.git
ocp4_workload_showroom_content_git_ref: main
ocp4_workload_showroom_content_only: false
bastion_public_hostname: >-
  "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"

# Select wetty as the terminal type
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_image: docker.io/wettyoss/wetty:latest

ocp4_workload_showroom_wetty_ssh_bastion_login: true
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 5c89efeb-c889-4689-9b45-b83c19a1006b
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1389 - Discovering Critical Security Features in Red Hat Enterprise Linux
    category: Red_Hat_Summit_2024
    keywords:
    - Demos
    - Defend Yourself
    - RHEL
    - Security
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
    parameters: []
  owners:
  - email: lvrabec@redhat.com
    name: Lukas Vrabec
  - email: mhaicman@redhat.com
    name: Marek Haicman
  secrets:
  - name: guidgrabber-api
    namespace: gpte
  - name: gpte-no-repos
    namespace: gpte
