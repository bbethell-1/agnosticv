---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/parameters/aws-region2.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
#

env_type: base-infra
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------

requirements_content:
  collections:
  - name: community.general
    version: 8.5.0
  - name: community.postgresql
    version: 3.4.0
  roles:
  - name: geerlingguy.postgresql
    version: 3.5.0

# -------------------------------------------------------------------
# Role Variables
# -------------------------------------------------------------------
# pet_name_generator
pet_name_generator_separator: "{{ range(0, 9) | random }}"
pet_name_generator_lookup: "{{ lookup('community.general.random_pet', separator=pet_name_generator_separator) }}"
pet_name_generator_enable: true
pet_name_generator_instances:
- bastion_hostname

# upgrade_packages_specific
update_specific_packages:
- rhc
- rhc-worker-playbook

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
post_software_workloads:
  localhost:
  - agnosticv-userdata-import
  bastions:
  - geerlingguy.postgresql

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: RHEL85GOLD
bastion_instance_type: t3a.medium
install_student_user: true
student_name: lab-user
student_password: "{{ common_password }}"
student_sudo: true
ansible_service_account_user_name: "{{ student_name }}"
config_user_preferred_python: false

use_content_view: true
update_packages: false      # This CI will be wanting out of date packages for insights to pick up and fix

reset_rhsm_conf: True

agd_bastion_packages:
- at
- bash-completion
- bind-utils
- git
- podman
- buildah
- python3-pip
- tmux
- vim-enhanced
- wget
- postgresql-server
- yara
- scap-security-guide
- rhc
- rhc-worker-playbook

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

instances:

- name: "{{ bastion_hostname | default('bastion') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions,showroom"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - BastionSG
  - WebSG
  - ShowroomSG

inventory_groups:
- bastions
# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Babylon userdata
# -------------------------------------------------------------------
bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"

agnosticv_importdata:
  bastion_hostname: "{{ bastion_hostname }}"
  bastion_public_hostname: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/summit_2024_The_ins_and_outs_of_Red_Hat_Insights_LB1222.git
showroom_git_ref: main
showroom_var_inject: true
showroom_ssh_method: sshkey
showroom_ssh_username: "{{ student_name }}"
showroom_default_ssh_user: "{{ student_name }}"
showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
showroom_lab_users:
- "{{ student_name }}"
showroom_tab_services:
- single_terminal

showroom_user_password: "{{ common_password }}"
showroom_dnf_packages:
- git
- podman
- python3-devel
- systemd-container
- unzip
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 81c03f8e-f80e-4167-bad0-d75132f0ea02
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1222 - The Ins and Outs of Red Hat Insights
    category: Red_Hat_Summit_2024
    keywords:
    - rhel
    - insights
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: Red_Hat_Demo_Platform
    multiuser: false
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-lb1222
      pull: missing
