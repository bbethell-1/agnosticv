# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-disconnected

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

workshop_cloudformation_tag: summit-2024

# ansible/roles-infra/infra-aws-open-environment/tasks/main.yaml
agnosticd_open_environment: true
# ansible/roles-infra/infra-aws-open-environment/tasks/print_user_info.yaml
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/naps-product-sa/ocp4-disconnected-workshop.git
ocp4_workload_showroom_content_git_repo_ref: summit-2024
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_novnc_enable: true
ocp4_workload_showroom_deployer_chart_version: "1.1.1"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 133ae43e-78d5-48d8-955e-40eb50e35d07
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1515 - OpenShift Disconnected Workshop - AWS
    category: Red_Hat_Summit_2024
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      Provider: RHDP
    parameters: []
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
