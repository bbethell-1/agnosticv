---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml

#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region2.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: sandbox
agnosticd_open_environment: True
sandbox_user_info_messages_enable: true

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  ansible_additional_args: --skip-tags create_ssh_config
  nuke_sandbox: true

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
#showroom_deploy: true
#showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/showroom-eda-and-chatops.git
#showroom_git_ref: main
#showroom_var_inject: true
#showroom_ssh_method: sshkey
#showroom_ssh_username: "{{ student_name }}"
#showroom_default_ssh_user: "{{ student_name }}"
#showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
#showroom_lab_users:
#  - "{{ student_name }}"
#showroom_tab_services:
#  - single_terminal

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 133ae43e-78d5-48d8-955e-40eb50e35d07
  anarchy:
    namespace: babylon-anarchy-events
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1515 - OpenShift Disconnected Workshop - AWS
    category: Red_Hat_Summit_2024
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      Provider: RHDP
    parameters: []
