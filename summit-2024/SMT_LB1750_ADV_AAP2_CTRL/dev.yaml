---
purpose: development

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: "https://gitlab.com/ansible-labs-crew/showroom-aap-advanced-lab-summit-2024"
showroom_user: showroom
showroom_ui: rh1

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty
  - web1

showroom_ttys_enable_tmux: false

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_tab_web1_url: https://docs.ansible.com
showroom_tab_web1_name: Ansible Docs
__meta__:
  deployer:
    scm_url: https://github.com/ansible-labs-crew/agnosticd.git
    scm_ref: summitfest2024-devel
    scm_type: git
    type: agnosticd
