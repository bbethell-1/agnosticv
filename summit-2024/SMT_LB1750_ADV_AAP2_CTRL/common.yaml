---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-auto-controller-adv.yaml
#include /includes/secrets/showroom-shared-410.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ansible-automation-platform
software_to_deploy: none

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# Lab Guide
# -------------------------------------------------------------------
lab_ui_url: https://ansible-labs-crew.gitlab.io/ansible-controller-advanced

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://gitlab.com/ansible-labs-crew/showroom-aap-advanced-lab-summit-2024
ocp4_workload_showroom_content_git_ref: showroom
ocp4_workload_showroom_content_only: true

showroom_deploy_shared_cluster_enable: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL93GOLD-latest

# number of VMs
tower_instance_count: 2  # aka controllers
exec_instance_count: 0
pgdb_instance_count: 1
pah_instance_count: 1
node_instance_count: 2  # aka managed nodes
worker_instance_count: 0
support_instance_count: 0
tower_expected_instances: 2        # number of instances in the cluster, tower + exec
tower_expected_instance_groups: 2  # number of instance groups in the cluster

subdomain_base_suffix: .example.opentlc.com
root_filesystem_size: 20
key_name: ""
vscode_server_hostname: "bastion.{{ guid }}{{ subdomain_base_suffix }}"
vscode_user_name: lab-user

# Pulled from an OCP secret
tower_license_manifest:
  type: url
  url: "{{ controller_manifest.url }}"

automationcontroller_installer:
  url: "{{ controller_bundle_installer.url }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: ea0c5544-b529-457b-bf89-7a8b70bafa6a
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1750 - Advanced Features of Ansible Automation Controller
    category: Red_Hat_Summit_2024
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    keywords:
      - AAP2
      - Ansible
      - Automation
      - Controller
      - summit2024
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  secrets:
    - namespace: gpte
      name: ansible-tower-advanced-2
