# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: rosa-consolidated

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: t3a.small
bastion_instance_image: RHEL92GOLD-latest

# ------------------------------------------------------
# Bastion user
# ------------------------------------------------------
bastion_user_name: rosa
bastion_user_enable_sudo: true
bastion_user_password: ""
bastion_user_password_length: 16

# ------------------------------------------------------
# ROSA properties
# ------------------------------------------------------
rosa_installer_version: latest
rosa_deploy: true
rosa_deploy_hcp: true
rosa_setup_cluster_admin: true

# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
# rosa_version: latest-upgrade

# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
# rosa_version_base: "openshift-v4.14"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
install_common: true
update_packages: true

common_extra_packages:
- java-11-openjdk-devel
- tzdata-java
- maven

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 589750d4-beba-4df6-bd93-ac14cf83323f
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
    actions:
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1208 - Advanced Cluster Security Cloud Service in Multi-Cloud Env
    category: Red_Hat_Summit_2024
    keywords:
    - mobb
    - workshop
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: rosa_token
      description: To obtain a current ROSA token, please visit https://console.redhat.com/openshift/token
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
  secrets:
  - namespace: gpte
    name: rosa-token
