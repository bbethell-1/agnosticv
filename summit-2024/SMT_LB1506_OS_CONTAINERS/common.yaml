# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# -------------------------------------------------------------------
# --- Catalog: Events
# --- Catalog Item: LB1506 - Unleashing Operating System Containers on Red Hat Enterprise Linux
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-lightspeed
software_to_deploy: none
default_instance_image: RHEL91GOLD-latest
student_name: student
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Config: ansible-lightspeed
# -------------------------------------------------------------------
ansible_lightspeed_setup_demo_repo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
software_workloads_for_bastion:
  - novnc
  - ms_vscode_server
  - rhel-graphical

# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------
novnc_proxy_port: 443

# -------------------------------------------------------------------
# Workloads: ms_vscode_server
# -------------------------------------------------------------------
ms_vscode_server_enable_autostart: true

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------
install_rhel_graphical: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

# showroom_git_repo: "https://github.com/smgglrs/rh-summit-2024-lb1506-showroom/"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f4b31a5c-e860-4298-928d-f474f623d47a
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1506 Unleashing Operating System Containers on Red Hat Enterprise Linux
    category: Red_Hat_Summit_2024
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - baremetal
      - equinix
      - containers
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      Provider: RHDP
    parameters: []
  secrets:
    - namespace: gpte
      name: satellite-rhel-8-and-9-latest-ha
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
