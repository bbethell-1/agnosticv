---
#include /includes/catalog-icon-equinix.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service-equinix.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/equinix-region.yaml
#include /includes/parameters/equinix-hypervisor-type.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog: Events
# --- Catalog Item: LB1506 - Unleashing Operating System Containers on Red Hat Enterprise Linux
# -------------------------------------------------------------------
platform: RHPDS
env_type: just-a-bunch-of-nodes
cloud_provider: equinix_metal
hypervisor_os: rhel_8
hypervisor_count: 1

# Don't configure repos as this is a RHEL8 Linux
repo_method: none
install_common: false

# Do install env key
install_student_user: true
student_name: lab-user

# Open Environment
agnosticd_open_environment: True

common_packages:
  - at
  - bash-completion
  - buildah
  - git
  - podman
  - python
  - tmux
  - unzip
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

# software_workloads_for_bastion:
#   - novnc
#   - rhel-graphical

  # TODO: do we want this (add as package too) - podman_desktop

# -------------------------------------------------
# noVNC variables
# -------------------------------------------------

novnc_version: 1.4.0
install_rhel_graphical: true
novnc_proxy_port: 8443


# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

# showroom_git_repo: "https://github.com/smgglrs/rh-summit-2024-lb1506-showroom/"
showroom_user: showroom
showroom_ui: default

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty

showroom_ttys_enable_tmux: false

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

__meta__:
  asset_uuid: f4b31a5c-e860-4298-928d-f474f623d47a
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1506 Unleashing Operating System Containers on Red Hat Enterprise Linux
    category: Red_Hat_Summit_2024
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - baremetal
      - equinix
      - containers
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      Provider: RHDP
    parameters: []
  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
