# -------------------------------------------------------------------
# --- Catalog Item: Cloud-Native Integration with Red Hat build of Apache Camel
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

#-------------------------------------------------------------------
# Instance configuration
#-------------------------------------------------------------------
master_instance_type: m6a.2xlarge
master_instance_count: 3
master_storage_type: gp3
master_storage_size: 250
worker_instance_type: m6a.4xlarge
worker_instance_count: 4
worker_storage_type: gp3
worker_storage_size: 250

agnosticd_aws_capacity_reservation_enable: true
agnosticd_aws_capacity_reservation_single_zone: true

#-------------------------------------------------------------------
#OpenShift Installer Version
#-------------------------------------------------------------------
ocp4_installer_version: "4.14"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Other variables
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL93GOLD-latest
bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ----------------------------------------------------------------------------
   Welcome to Cloud-Native Integration with Red Hat build of Apache Camel
  ----------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp4_workload_devspaces
- ocp4_workload_gitea_operator
- ocp4_workload_showroom

# TODO:
  #kafka
  #ocp4_workload_summit_2024_cloud_native_camel
  #
  #single shared kafka cluser
  #OCP 4.14
  #showroom repo - NO TERMINAL

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: "{{ (guid[:5] | reverse | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.14
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_devspaces
# -------------------------------------------------------------------
ocp4_workload_devspaces_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_devspaces_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_devspaces_startingcsv: devspacesoperator.v3.11.0
ocp4_workload_devspaces_devworkspace: false

# -----------------------------------------------------------------
# gitea
# -----------------------------------------------------------------
ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_password: openshift
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: "https://github.com/FIXME/FIXME.git"
  name: "FIXME"
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom_template_summit_2024.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_deployer_chart_version: 1.0.5

ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: showroom

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b4ce36a9-5a12-4960-9303-3bf4649be420
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1115 - Cloud-Native Integration with Red Hat build of Apache Camel
    category: Red_Hat_Summit_2024
    keywords: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Apache_Camel
      Product_Family: Red_Hat
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
