---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------

requirements_content:
  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: infra.eda_configuration
      version: 1.1.0
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------

infra_workloads:

  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_eda_controller
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - ocp-workload-etherpad
  - automation_platform_loader
  - automation_platform_bastion
  - eda_controller_config
  - ocp4_workload_showroom
  - ansible-eda-config


# - infra.hub_configuration.rulebook_activation

# -------------------------------------------------------------------
# Legacy variables
# -------------------------------------------------------------------
etherpad_project: labs
etherpad_text: Welcome to Event Driven Ansible and Dynatrace escape room!

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/ikke-t/showroom_rheda-dynatrace
ocp4_workload_showroom_content_git_ref: summit2024
ocp4_workload_showroom_content_only: true

# showroom_deploy_shared_cluster_enable: true

eda_configuration_dispatcher_roles:

  - {role: user, var: eda_users, tags: user}
  - {role: rulebook_activation, var: eda_rulebook_activations, tags: rulebook_activation}

eda_users:

  - username: user1
    first_name: Read
    last_name: Only
    email: jdoe@example.com
    password: "{{ common_password }}"
    update_secrets: false
    roles:
      - Viewer

# Test list of rulebooks
# eda_controller_config_rulebook_activations:

eda_rulebook_activations:

  - name: Add route for EDA webhook service
    description: Adds missing route for EDA webhook service
    project: OpenShift Event Rulebooks
    rulebook: publish_eda_webhook_route.yml
    decision_environment: de-for-ocp
    restart_policy: on-failure
    enabled: false
    extra_vars:
      cluster_apps_domain: "{{ openshift_cluster_ingress_domain }}"
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    validate_certs: false

  - name: Listen to Dynatrace events
    description: Listen to Dynatrace events
    project: OpenShift Event Rulebooks
    rulebook: dynatrace_event.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false
    extra_vars:
      dt_token: 'dt0c01.OCYBYYM7L56IFJ7APTWJHCQ3.4ADX4OWKQLU4BJIQQHQ3SFEGPMCPWDG7WDOHCLPFZ6AXKMPFLN46EAGAZUNIRTLC'
      dt_url: https://bnk46244.live.dynatrace.com
      et_url: "http://4.180.122.137:8091/"
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    validate_certs: false

  - name: Listen to webhook for EasyTravel
    description: Listen to webhook for EasyTravel actions
    project: OpenShift Event Rulebooks
    rulebook: webhook_easytravel.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false
    extra_vars:
      et_url: "http://4.180.122.137:8091/"
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    validate_certs: false

  - name: Patch Route With Cert
    description: Patch OpenShift Routes
    project: OpenShift Event Rulebooks
    rulebook: patch_route.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    validate_certs: false

  - name: Set Resource Quota On Namespace
    description: Set Resource Quota on OpenShift namespace
    project: OpenShift Event Rulebooks
    rulebook: resource_quota.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    validate_certs: false

  - name: Create Volume Snapshot
    description: Create PVC volume snapshot
    project: OpenShift Event Rulebooks
    rulebook: volume_snapshot.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    validate_certs: false


controller_templates:

  - name: easytravel-fix
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-fix.yml
    ask_variables_on_launch: true
    credentials:
