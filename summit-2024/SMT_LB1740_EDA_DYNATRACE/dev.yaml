---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------

requirements_content:

  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4

  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: infra.eda_configuration
      version: 1.1.0
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------

infra_workloads:

  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_eda_controller
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - ocp-workload-etherpad
  - automation_platform_loader
  - automation_platform_bastion
  - ocp4_workload_showroom
  - ansible-eda-config

# -------------------------------------------------------------------
# Legacy variables
# -------------------------------------------------------------------

etherpad_project: labs
etherpad_text: Welcome to Event Driven Ansible and Dynatrace escape room!

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/ikke-t/showroom_rheda-dynatrace
ocp4_workload_showroom_content_git_ref: summit2024
ocp4_workload_showroom_content_only: true

# showroom_deploy_shared_cluster_enable: true

# -------------------------------------------------------------------
# Role: ansible-eda-config
# -------------------------------------------------------------------

eda_host: "https://eda-controller-aap.apps.cluster-{{ guid }}.{{ guid }}{{ subdomain_base_suffix}}"
eda_username: admin
eda_password: "{{ common_password }}"
eda_validate_certs: false


# -------------------------------------------------------------------
# Role: ansible-eda-config # Dispatcher
# -------------------------------------------------------------------

eda_configuration_dispatcher_roles:

  - role: user
    var: eda_users
    tags: user

  - role: user_token
    var: eda_user_tokens
    tags: user_token

  - role: project
    var: eda_projects
    tags: project

  - role: project_sync
    var: eda_projects
    tags: project_sync

  - role: decision_environment
    var: eda_decision_environments
    tags: decision_environment

  - role: rulebook_activation
    var: eda_rulebook_activations
    tags: rulebook_activation

# -------------------------------------------------------------------
# Role: ansible-eda-config # eda_user_tokens
# -------------------------------------------------------------------

eda_user_tokens:

  - name: aap
    description: AAP2 Controller Auth token
    token: "{{ r_aap2_token.ansible_facts.controller_token.token }}"

