---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------

infra_workloads:

  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_eda_controller
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - ocp-workload-etherpad
  - automation_platform_loader
  - automation_platform_bastion
  - eda_controller_config
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Legacy variables
# -------------------------------------------------------------------
etherpad_project: labs
etherpad_text: Welcome to Event Driven Ansible and Dynatrace escape room!

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/ikke-t/showroom_rheda-dynatrace
ocp4_workload_showroom_content_git_ref: summit2024
ocp4_workload_showroom_content_only: true

# showroom_deploy_shared_cluster_enable: true

# Test list of rulebooks
eda_controller_config_rulebook_activations:
  - name: Add route for EDA webhook service
    description: Adds missing route for EDA webhook service
    project: OpenShift Event Rulebooks
    rulebook: publish_eda_webhook_route.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: false
    # TODO: Add the apps_cluster_url
    # unfortunately agnosticD doesn't support this yet
    # it would require using redhat_cop.infra.eda_configuration.rulebook_activation
    # extra_vars:
    #   cluster_apps_domain: '{ apps_cluster_url_whatever_variable_here}'
  - name: Listen to Dynatrace events
    description: Listen to Dynatrace events
    project: OpenShift Event Rulebooks
    rulebook: dynatrace_event.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false
    # TODO: Add the dynatrace token and url, and easytravel url
    # unfortunately agnosticD doesn't support this yet
    # it would require using redhat_cop.infra.eda_configuration.rulebook_activation
    # extra_vars:
    #   dt_token: 'dt0c01.OCYxxxyyyzzz...'
    #   dt_url: https://xxxyyy.live.dynatrace.com
    #   et_url: "http://ip_here:8091/"
  - name: Listen to webhook for EasyTravel
    description: Listen to webhook for EasyTravel actions
    project: OpenShift Event Rulebooks
    rulebook: webhook_easytravel.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false
    # TODO: Add the easytravel url
    # unfortunately agnosticD doesn't support this yet
    # it would require using redhat_cop.infra.eda_configuration.rulebook_activation
    # extra_vars:
    #   et_url: "http://ip_here:8091/"
  - name: Patch Route With Cert
    description: Patch OpenShift Routes
    project: OpenShift Event Rulebooks
    rulebook: patch_route.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
  - name: Set Resource Quota On Namespace
    description: Set Resource Quota on OpenShift namespace
    project: OpenShift Event Rulebooks
    rulebook: resource_quota.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
  - name: Create Volume Snapshot
    description: Create PVC volume snapshot
    project: OpenShift Event Rulebooks
    rulebook: volume_snapshot.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true

controller_templates:
  - name: easytravel-fix
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-fix.yml
    ask_variables_on_launch: true
    credentials:
    survey: {}
  - name: easytravel-break
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-break.yml
    ask_variables_on_launch: true
    credentials:
    survey: {}
  - name: publish-eda-rb-route
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/publish-eda-rb-route.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
  # TODO: Add dynatrace lab setup here for adding the token and url for rulebook activation
  - name: create-volume-snapshot
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/create-volume-snapshot.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
  - name: patch-route-with-cert
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/patch-route-with-cert.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
  - name: set-resource-quota-on-namespace
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/set-resource-quota-on-namespace.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

