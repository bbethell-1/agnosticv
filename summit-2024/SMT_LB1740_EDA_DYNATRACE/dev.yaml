# -------------------------------------------------------------------
# Role: ansible-eda-config # eda_projects
# -------------------------------------------------------------------

eda_projects:

  - name: "OpenShift Event Rulebooks"
    description: "Event-driven Ansible rulebooks"
    url: "https://github.com/ikke-t/eda-rulebooks.git"

eda_configuration_project_async_retries: 100

# -------------------------------------------------------------------
# Role: ansible-eda-config # eda_decision_environments
# -------------------------------------------------------------------

eda_decision_environments:

  - name: "de-for-ocp"
    description: "Decision Environment for OpenShift"
    image_url: "quay.io/mitsharm/eda/de-for-ocp"

  - name: de-for-dynatrace
    description: Decision Environment for Dynatrace
    image_url: quay.io/ikke/de-dynatrace:1.1.4620c3f

# -------------------------------------------------------------------
# Role: ansible-eda-config # eda_rulebook_activations:
# -------------------------------------------------------------------

eda_rulebook_activations:

  - name: Add route for EDA webhook service
    description: Adds missing route for EDA webhook service
    project: OpenShift Event Rulebooks
    rulebook: publish_eda_webhook_route.yml
    decision_environment: de-for-ocp
    restart_policy: on_failure
    awx_token: aap
    enabled: true
    extra_vars:
      cluster_apps_domain: "{{ openshift_cluster_ingress_domain }}"
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    eda_validate_certs: false

  - name: Listen to Dynatrace events
    description: Listen to Dynatrace events
    project: OpenShift Event Rulebooks
    rulebook: dynatrace_event.yml
    decision_environment: de-for-dynatrace
    restart_policy: on_failure
    awx_token: aap
    enabled: true
    extra_vars:
      dt_token: 'dt0c01.OCYBYYM7L56IFJ7APTWJHCQ3.4ADX4OWKQLU4BJIQQHQ3SFEGPMCPWDG7WDOHCLPFZ6AXKMPFLN46EAGAZUNIRTLC'
      dt_url: https://bnk46244.live.dynatrace.com
      et_url: http://4.180.122.137:8091/
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    eda_validate_certs: false

  - name: Listen to webhook for EasyTravel
    description: Listen to webhook for EasyTravel actions
    project: OpenShift Event Rulebooks
    rulebook: webhook_easytravel.yml
    decision_environment: de-for-dynatrace
    restart_policy: on_failure
    awx_token: aap
    enabled: true
    extra_vars:
      et_url: http://4.180.122.137:8091/
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    eda_validate_certs: false

  - name: Patch Route With Cert
    description: Patch OpenShift Routes
    project: OpenShift Event Rulebooks
    rulebook: patch_route.yml
    decision_environment: de-for-ocp
    restart_policy: on_failure
    awx_token: aap
    enabled: true
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    eda_validate_certs: false

  - name: Set Resource Quota On Namespace
    description: Set Resource Quota on OpenShift namespace
    project: OpenShift Event Rulebooks
    rulebook: resource_quota.yml
    decision_environment: de-for-ocp
    restart_policy: on_failure
    awx_token: aap
    enabled: true
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    eda_validate_certs: false

  - name: Create Volume Snapshot
    description: Create PVC volume snapshot
    project: OpenShift Event Rulebooks
    rulebook: volume_snapshot.yml
    decision_environment: de-for-ocp
    restart_policy: on_failure
    awx_token: aap
    enabled: true
    eda_host: "{{ eda_controller_web_url }}"
    eda_username: admin
    eda_password: "{{ common_password }}"
    eda_validate_certs: false

# -------------------------------------------------------------------
# Role: automation_platform_loader # controller_templates:
# -------------------------------------------------------------------

controller_templates:

  - name: easytravel-fix
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-fix.yml
    ask_variables_on_launch: true
    credentials:
    survey: {}

  - name: easytravel-break
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-break.yml
    ask_variables_on_launch: true
    credentials:
    survey: {}

  - name: publish-eda-rb-route
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/publish-eda-rb-route.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: create-volume-snapshot
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/create-volume-snapshot.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: patch-route-with-cert
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/patch-route-with-cert.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: set-resource-quota-on-namespace
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/set-resource-quota-on-namespace.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
