---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------

infra_workloads:

  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_eda_controller
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - ocp-workload-etherpad
  - automation_platform_loader
  - automation_platform_bastion
  - eda_controller_config
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Legacy variables
# -------------------------------------------------------------------
etherpad_project: labs
etherpad_text: Welcome to Event Driven Ansible and Dynatrace escape room!

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/ikke-t/showroom_rheda-dynatrace
ocp4_workload_showroom_content_git_ref: summit2024
ocp4_workload_showroom_content_only: true

# showroom_deploy_shared_cluster_enable: true

# Test list of rulebooks
eda_controller_config_rulebook_activations:
  # TODO: Add the dynatrace token and url, and enable
  - name: Listen to Dynatrace events
    description: Listen to Dynatrace events
    project: OpenShift Event Rulebooks
    rulebook: dynatrace_event.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false
  - name: Listen to webhook for EasyTravel
    description: Listen to webhook for EasyTravel actions
    project: OpenShift Event Rulebooks
    rulebook: webhook_easytravel.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false
  - name: Patch Route With Cert
    description: Patch OpenShift Routes
    project: OpenShift Event Rulebooks
    rulebook: patch_route.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
  - name: Set Resource Quota On Namespace
    description: Set Resource Quota on OpenShift namespace
    project: OpenShift Event Rulebooks
    rulebook: resource_quota.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
  - name: Create Volume Snapshot
    description: Create PVC volume snapshot
    project: OpenShift Event Rulebooks
    rulebook: volume_snapshot.yml
    decision_env: de-for-ocp
    restart_policy: on-failure
    enabled: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
