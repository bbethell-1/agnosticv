---
#include /includes/catalog-icon-aap.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/parameters/aws-region2.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2
student_name: lab-user
student_password: "{{ common_password }}"
aws_region: us-east-2

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL86GOLD-latest

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------

infra_workloads:

  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_eda_controller
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - ocp-workload-etherpad
  - automation_platform_loader
  - automation_platform_bastion
  - eda_controller_config

# -------------------------------------------------------------------
# OpenShift variable
# -------------------------------------------------------------------
student_workloads: []
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Legacy variables
# -------------------------------------------------------------------
etherpad_project: labs

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates

install_lets_encrypt_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------

ocp4_workload_ansible_automation_platform_subscription_channel: "stable-2.4"

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------

ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
  inject: true

# -------------------------------------------------------------------
# Workload: automation_platform_loader
# -------------------------------------------------------------------

openshift_admin_user: kubeadmin
automation_platform_loader_generate_ocp_token: true

controller_configuration_dispatcher_roles:
  - role: credentials
    var: controller_credentials
    tags: credentials
  - role: projects
    var: controller_projects
    tags: projects
  - role: job_templates
    var: controller_templates
    tags: job_templates

controller_credentials:
  # TODO: Can we add dynatrace url and token here?
  # Which kinda secret would work? Perhaps openshift, as it has url and token?
  - name: OpenShift Credentials
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

controller_configuration_projects_async_retries: 90

controller_projects:
  - name: event-driven-ansible
    organization: Default
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    scm_type: git
    scm_url: "https://github.com/ikke-t/demo-event-driven-ansible.git"

controller_templates:

  - name: easytravel-fix
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-fix.yml
    ask_variables_on_launch: true
    credentials:
    survey: {}

  - name: easytravel-break
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/easytravel-break.yml
    ask_variables_on_launch: true
    credentials:
    survey: {}
  # TODO: Add dynatrace lab setup here for adding the token and url for rulebook activation

  - name: create-volume-snapshot
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/create-volume-snapshot.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: patch-route-with-cert
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/patch-route-with-cert.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: set-resource-quota-on-namespace
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible
    playbook: automation_controller/set-resource-quota-on-namespace.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

# -------------------------------------------------------------------
# Workload: ocp4_workload_eda_controller
# -------------------------------------------------------------------

ocp4_workload_eda_controller_aap_controller_url: "{{ aap_controller_web_url }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager_operator
# -------------------------------------------------------------------

ocp4_workload_cert_manager_operator_channel: stable-v1

# ocp4_workload_cert_manager_operator_channel_csv: cert-manager-operator.v1.10.3

# -------------------------------------------------------------------
# Workload: eda_pods_on_bastion
# -------------------------------------------------------------------

eda_pods_on_bastion_ac_token: "{{ r_aap2_token.ansible_facts.controller_token.token }}"
eda_pods_on_bastion_ac_web_url: "https://{{ automation_controller_hostname }}"

# -------------------------------------------------------------------
# Workload: eda_controller_config
# -------------------------------------------------------------------
eda_controller_config_url: "{{ eda_controller_web_url }}"
eda_controller_config_username: "admin"
eda_controller_config_password: "{{ common_password }}"

eda_controller_config_awx_tokens:
  - name: aap
    token: "{{ r_aap2_token.ansible_facts.controller_token.token }}"

eda_controller_config_decision_envs:
  - name: "de-for-ocp"
    description: "Decision Environment for OpenShift"
    image_url: "quay.io/mitsharm/eda/de-for-ocp"
  - name: de-for-dynatrace
    description: Decision Environment for Dynatrace
    image_url: quay.io/ikke/de-dynatrace:1.1.4620c3f

eda_controller_config_projects:

  - name: "OpenShift Event Rulebooks"
    description: "Event-driven Ansible rulebooks"
    repo_url: "https://github.com/ikke-t/eda-rulebooks.git"

eda_controller_config_rulebook_activations:
  # TODO: Add the dynatrace token and url, and enable
  - name: Listen to Dynatrace events
    description: Listen to Dynatrace events
    project: OpenShift Event Rulebooks
    rulebook: dynatrace_event.yml
    decision_env: de-for-dynatrace
    restart_policy: on-failure
    enabled: false

  - name: "Patch Route With Cert"
    description: "Patch OpenShift Routes"
    project: "OpenShift Event Rulebooks"
    rulebook: "patch_route.yml"
    decision_env: "de-for-ocp"
    restart_policy: "on-failure"
    enabled: true

  - name: "Set Resource Quota On Namespace"
    description: "Set Resource Quota on OpenShift namespace"
    project: "OpenShift Event Rulebooks"
    rulebook: "resource_quota.yml"
    decision_env: "de-for-ocp"
    restart_policy: "on-failure"
    enabled: true

  - name: "Create Volume Snapshot"
    description: "Create PVC volume snapshot"
    project: "OpenShift Event Rulebooks"
    rulebook: "volume_snapshot.yml"
    decision_env: "de-for-ocp"
    restart_policy: "on-failure"
    enabled: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 72bf3068-89d4-4384-ad3f-a9b5fc8a07d4
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1740 Escape Room - Event Driven Ansible and Dynatrace
    category: Red_Hat_Summit_2024
    keywords:
      - eda
      - dynatrace
      - ansible
      - openshift
      - ocp
      - summit
    labels:
      Base_Component: 'True'
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters:
      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.2xlarge
          enum:
            - m6a.4xlarge
            - m6a.2xlarge
  secrets:
    - namespace: gpte
      name: satellite-rhel86-ha

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
