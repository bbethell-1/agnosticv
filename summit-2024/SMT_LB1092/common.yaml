---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml

#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/aws-region2.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

#include /includes/secrets/demosat-rhel-9-lab.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2
student_name: lab-user
student_password: "{{ common_password }}"
aws_region: us-east-2

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.13.9"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 2
bastion_instance_image: RHEL92GOLD-latest

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_gitea_operator
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_codeserver
  - ocp4_workload_sentiment_analysis_pattern
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_eda_controller
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - ocp4_workload_rocket_chat
  - automation_platform_loader
  - automation_platform_bastion
  - eda_controller_config

# -------------------------------------------------------------------
# OpenShift variable
# -------------------------------------------------------------------
student_workloads: []
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.1

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.20.1"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: dev-admin
ocp4_workload_gitea_operator_admin_email: dev-admin@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: "{{ student_name }}"
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/redhat-gpte-devopsautomation/event-driven-ansible-and-chatops.git
    name: event-driven-ansible-and-chatops
    private: false

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.11
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "v4.12_2023_07_03"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.12_2023_02_20

# -------------------------------------------------------------------
# Workload: ocp4_workload_codeserver
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_codeserver_name: codeserver
ocp4_workload_codeserver_workspace_name: ide
ocp4_workload_codeserver_password: "{{ common_password }}"
ocp4_workload_codeserver_pvc_size: 3Gi
ocp4_workload_codeserver_gitea_name: gitea
ocp4_workload_codeserver_gitea_namespace: gitea
ocp4_workload_codeserver_extensions:
  - filename: auchenberg.vscode-browser-preview-0.7.2.vsix
    url: https://gpte-public.s3.amazonaws.com/vscode-plugins/auchenberg.vscode-browser-preview-0.7.2.vsix

ocp4_workload_codeserver_multi_user_install: false
ocp4_workload_codeserver_multi_user_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_codeserver_multi_user_username_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_codeserver_multi_user_namespace_base: codeserver

# Repositories to set up in codeserver
ocp4_workload_codeserver_repos_user: "{{ student_name }}"
ocp4_workload_codeserver_repos_password: "{{ common_password }}"
ocp4_workload_codeserver_repos:
  - name: event-driven-ansible-and-chatops
    account: "{{ student_name }}"
    branch: main

# Codeserver image tags
ocp4_workload_codeserver_image_tag: v4.8.3-java11
ocp4_workload_codeserver_init_image_tag: v4.8.3

# -------------------------------------------------------------------
# Workload: ocp4_workload_sentiment_analysis_pattern
# -------------------------------------------------------------------
ocp4_workload_sentiment_analysis_pattern_grafana_username: admin
ocp4_workload_sentiment_analysis_pattern_grafana_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_subscription_channel: "stable-2.4"
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
  inject: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rocket_chat
# -------------------------------------------------------------------
ocp4_workload_rocket_chat_password: "{{ common_password }}"
ocp4_workload_rocket_chat_user_vars:
  - user: pm_clothing
    password: "{{ common_password }}"
    roomName: clothing
    msg: Welcome to clothing Channel
  - user: pm_utensils
    password: "{{ common_password }}"
    roomName: utensils
    msg: Welcome to Utensils Channel

# -------------------------------------------------------------------
# Workload: automation_platform_loader
# -------------------------------------------------------------------
openshift_admin_user: kubeadmin
automation_platform_loader_generate_ocp_token: true

controller_configuration_dispatcher_roles:
  - role: credentials
    var: controller_credentials
    tags: credentials
  - role: projects
    var: controller_projects
    tags: projects
  - role: job_templates
    var: controller_templates
    tags: job_templates

controller_credentials:
  - name: OpenShift Credentials
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"
  - name: "Demo Credential"
    credential_type: "Machine"
    state: absent

controller_configuration_projects_async_retries: 90

controller_projects:
  - name: event-driven-ansible-and-chatops
    organization: Default
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    scm_type: git
    scm_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ student_name }}/event-driven-ansible-and-chatops.git"
  - name: "Demo Project"
    organization: Default
    state: absent

controller_templates:
  - name: "Demo Job Template"
    organization: Default
    state: absent
  - name: push-critical-feedback
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible-and-chatops
    playbook: playbooks/push-critical-feedback.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    extra_vars:
      rocketchat_url: "{{ _rocketchat_url }}"
      rocketchat_auth_token: "{{ _rocketchat_authToken.0 }}"
      rocketchat_user_id: "{{ _rocketchat_userId.0 }}"

  - name: push-favourable-feedback
    job_type: run
    inventory: Demo Inventory
    project: event-driven-ansible-and-chatops
    playbook: playbooks/push-favourable-feedback.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    extra_vars:
      rocketchat_url: "{{ _rocketchat_url }}"
      rocketchat_auth_token: "{{ _rocketchat_authToken.0 }}"
      rocketchat_user_id: "{{ _rocketchat_userId.0 }}"

  # - name: chatops-action
  #   job_type: run
  #   inventory: Demo Inventory
  #   project: event-driven-ansible-and-chatops
  #   playbook: playbooks/chatops-action.yml
  #   ask_variables_on_launch: true
  #   credentials:
  #     - OpenShift Credentials
  #   extra_vars:
  #     rocketchat_url: "{{ _rocketchat_url }}"
  #     rocketchat_auth_token: "{{ _rocketchat_authToken.0 }}"
  #     rocketchat_user_id: "{{ _rocketchat_userId.0 }}"
  #     eda_chatops_retail_db_host: globex-db.globex.svc.cluster.local
  #     eda_chatops_retail_db_username: globex
  #     eda_chatops_retail_db_password: globex
  #     eda_chatops_retail_db_name: globex

# -------------------------------------------------------------------
# Workload: ocp4_workload_eda_controller
# -------------------------------------------------------------------
ocp4_workload_eda_controller_aap_controller_url: "{{ aap_controller_web_url }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager_operator
# -------------------------------------------------------------------
ocp4_workload_cert_manager_operator_channel: stable-v1

# -------------------------------------------------------------------
# Workload: eda_controller_config
# -------------------------------------------------------------------
eda_controller_config_url: "{{ eda_controller_web_url }}"
eda_controller_config_username: "admin"
eda_controller_config_password: "{{ common_password }}"

eda_controller_config_awx_tokens:
  - name: aap
    token: "{{ r_aap2_token.ansible_facts.controller_token.token }}"

eda_controller_config_decision_envs:
  - name: "de-kafka-scram"
    description: "Decision Environment for OpenShift"
    image_url: "quay.io/rshah/ansible-rulebook-kafka-scram-aio"

eda_controller_config_projects:
  - name: "AI Based Smart Retail"
    description: "Event-driven Ansible rulebooks"
    repo_url: "{{_ocp4_workload_gitea_operator_gitea_route}}/{{ student_name }}/event-driven-ansible-and-chatops.git"

eda_controller_config_rulebook_activations:
  - name: "push-critical-feedback"
    description: "Push Critical Feedback"
    project: "AI Based Smart Retail"
    rulebook: "push-critical-feedback.yml"
    decision_env: "de-kafka-scram"
    restart_policy: "on-failure"
    enabled: true
  - name: "push-favourable-feedback"
    description: "Push Favourable Feedback"
    project: "AI Based Smart Retail"
    rulebook: "push-favourable-feedback.yml"
    decision_env: "de-kafka-scram"
    restart_policy: "on-failure"
    enabled: true
  # - name: "rocketchat-trigger"
  #   description: "Rocketchat Trigger"
  #   project: "AI Based Smart Retail"
  #   rulebook: "rocketchat-trigger.yml"
  #   decision_env: "de-kafka-scram"
  #   restart_policy: "on-failure"
  #   enabled: true

# -------------------------------------------------------------------
# Workload: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_user_workspace_path: "/home/{{ student_name }}/demo"
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_hostname: bastion.{{ guid }}.{{ sandbox_zone }}
vscode_ansible_python_interpreter: /usr/libexec/platform-python
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/showroom-eda-and-chatops.git
showroom_git_ref: main
showroom_var_inject: true
showroom_ssh_method: sshkey
showroom_ssh_username: "{{ student_name }}"
showroom_default_ssh_user: "{{ student_name }}"
showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_tab_services: []

sandbox_user_info_messages_enable: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: EDB60DD2-6E8C-4EA1-A671-B810ACD97FBC
  catalog:
    multiuser: false
    display_name: >-
      LB1092 - Harnessing Event-Driven Ansible within the Red Hat Ansible Automation Platform
    category: Red_Hat_Summit_2024
    keywords: []
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters:
      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.2xlarge
          enum:
            - m6a.4xlarge
            - m6a.2xlarge
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
