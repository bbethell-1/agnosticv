# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-scholars/inner-outer-loop-tutorial
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_deployer_chart_version: 1.0.7

ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: showroom

# -------------------------------------------------------------------
# Babylon userdata
# -------------------------------------------------------------------
userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "rhdh_url": "https://backstage-backstage.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "rhdh_user": "user{{i}}",
    "rhdh_user_password": "{{ common_password }}",
    "gitlab_url": "https://gitlab-gitlab.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "gitlab_user": "user{{i}}",
    "gitlab_user_password": "{{ common_password }}",
    "usernum": "{{i}}",
    "cluster_id": ".apps.cluster-{{guid}}{{ subdomain_base_suffix }}",
    "console_url": "https://console-openshift-console.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "devspaces_url": "https://devspaces.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "devspaces_user": "user{{i}}",
    "devspaces_user_password": "{{ common_password }}"
    },
  {% endfor %}
  }

agnosticd_passthrough_user_data: |
  {{ {}
   | combine( {
     "users": userdata })
  }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b9522957-d0ed-452a-a70c-cc853e5c3318
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB2267 - OpenShift Inner and Outer Loop Development Workshop
    category: Red_Hat_Summit_2024
    keywords:
    - workshop
    - openshift
    workshopUiDisabled: true
    labels:
      Provider: Hybrid_Cloud_Experience
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 50
  runtime:
    default: 8h
    maximum: 48h
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2-rc
      pull: missing
