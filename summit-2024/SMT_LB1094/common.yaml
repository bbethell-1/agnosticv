# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: odf-dr-binder

migration_key_path: "{{ ansible_ssh_private_key_file | default('') }}"
__meta__:
  asset_uuid: E58B400F-2680-4F0F-96A7-A182E308D14F
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: always
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1094 - Achieve business continuity with Red Hat OpenShift Container Platform
    category: Red_Hat_Summit_2024
    keywords: []
    labels:
      Base_Component: 'True'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h

  # Binder components
  components:
  - name: aws-hub
    display_name: LB1094-A - Achieve business continuity with Red Hat OpenShift Container Platform
    item: summit-2024/LB1094-A
    propagate_provision_data:
    - var: aws_hub_a_provision_data
  - name: aws-primary
    display_name: LB1094-B - Achieve business continuity with Red Hat OpenShift Container Platform
    item: summit-2024/LB1094-B
    propagate_provision_data:
    - var: aws_primary_a_provision_data
  - name: aws-secondary
    display_name: LB1094-C - Achieve business continuity with Red Hat OpenShift Container Platform
    item: summit-2024/LB1094-C
    propagate_provision_data:
    - var: aws_secondary_a_provision_data
