---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
#
env_type: base-infra
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: RHEL93GOLD-latest
node_instance_image: RHEL93GOLD-latest
node_instance_type: t3a.medium

install_student_user: true
student_name: lab-user
student_password: "{{ common_password }}"
student_sudo: true
ansible_service_account_user_name: "{{ student_name }}"

use_content_view: true
update_packages: true      # Do you want to run a full yum update
config_user_preferred_python: false

agd_bastion_packages:
- bash-completion
- bind-utils
- git
- tree
- vim-enhanced
- wget
- zsh

common_packages_el9:
- at
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- python3-pip
- tree
- podman
- buildah
- ansible-core

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

inventory_groups:
- bastions
- nodes

instances:
- name: "{{ bastion_hostname | default('bastion') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions,showroom"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - BastionSG
  - WebSG
  - ShowroomSG

- name: "node"
  count: 1
  public_dns: false
  image: "{{ node_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size | default('30') }}"
  security_groups:
  - DefaultSG
  - HostSG

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/summit_2024_RHELevant_Security_Practices_Lab_LB1964.git
showroom_git_ref: main
showroom_var_inject: true
showroom_ssh_method: sshkey
showroom_ssh_username: "{{ student_name }}"
showroom_default_ssh_user: "{{ student_name }}"
showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
showroom_lab_users:
- "{{ student_name }}"
showroom_tab_services:
- single_terminal
- web1

showroom_tab_web1_url: "https://{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}:9090"
showroom_tab_web1_name: Web Console

showroom_user_password: "{{ common_password }}"
showroom_dnf_packages:
- git
- podman
- python3-devel
- systemd-container
- unzip
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: b900df23-5c4b-4515-a364-9d164ed667a9
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: LB1964 - RHELevant Security Practices Lab
    category: Red_Hat_Summit_2024
    keywords:
    - rhel
    - rhel9
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: Red_Hat_Demo_Platform
    multiuser: false
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
