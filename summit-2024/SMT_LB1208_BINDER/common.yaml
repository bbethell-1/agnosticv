# -------------------------------------------------------------------
# Export userinfo variables to showroon
# -------------------------------------------------------------------
export_rosa_vars_to_showroom:
  - rosa_console_user_name
  - rosa_console_password
  - rosa_console_url
  - rosa_api_url
  - rosa_admin_user
  - rosa_admin_password

export_eks_vars_to_showroom:
  - aws_web_console_url
  - aws_web_console_user_name
  - aws_web_console_password
  - aws_cloud9_url
  - aws_account_id

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: acs-wksp-binder

__meta__:
  asset_uuid: 774B98BD-5734-4967-A37C-27825A99A5FC
  deployer:
    actions:
      destroy:
        disable: true
      status:
        disable: true
      update:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: always
  catalog:
