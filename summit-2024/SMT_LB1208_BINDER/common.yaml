common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# --- Student user
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
# showroom_git_repo: https://github.com/burrsutter/rhtap-demo.git
showroom_git_repo: https://github.com/augustrh/showroom
showroom_git_ref: main

showroom_user_password: "{{ tap_rosa_provision_data.ssh_password }}"
showroom_ssh_host: "{{ tap_rosa_provision_data.targethost }}"
showroom_host: "{{ tap_rosa_provision_data.targethost }}"
showroom_ssh_method: sshkey
showroom_ssh_username: rosa
showroom_default_ssh_user: rosa
showroom_lab_users:
  - rosa

