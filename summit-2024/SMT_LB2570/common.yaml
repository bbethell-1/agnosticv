  enabled: true
  state: present
  variables:
    ansible_host: "{{ groups['centos_nodes'][1] }}"
- name: "{{ groups['centos_nodes'][2] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
  variables:
    ansible_host: "{{ groups['centos_nodes'][2] }}"
- name: "{{ groups['bastions'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
- name: "{{ groups['satellites'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present


controller_groups:
- name: rhel
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['nodes'][0] }}"
  - "{{ groups['nodes'][1] }}"
  - "{{ groups['nodes'][2] }}"
- name: rhel7
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['nodes'][0] }}"
  - "{{ groups['nodes'][1] }}"
  - "{{ groups['nodes'][2] }}"
