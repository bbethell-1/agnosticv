# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop
student_name: student
cloud_provider: ec2
ansible_service_account_user_name: "{{ student_name }}"
# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role Variables
# -------------------------------------------------------------------
# pet_name_generator
pet_name_generator_separator: "{{ '7788'[ansible_loop.index0] }}"
pet_name_generator_lookup: "{{ lookup('community.general.random_pet', separator=pet_name_generator_separator) }}"
pet_name_generator_enable: true
pet_name_generator_instances:
- node1_instance_name
- node2_instance_name
- node3_instance_name
- node4_instance_name

# -------------------------------------------------------------------
# Instance Variable
# -------------------------------------------------------------------
bastion_instance_type: m5.8xlarge
bastion_instance_image: RHEL92GOLD-latest

common_packages_el9:
- at
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- python3-pip
- tree

security_groups:
- name: BastionSG
  rules:
  - name: BastionSSHPorts
    description: "Bastion ssh"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: WebSG
  rules:
  - name: WebHTTPSPorts
    description: "HTTPS Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WebHTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WebCockpitPorts
    description: "Cockpit HTTP Public"
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: PetAppSG
  rules:
  - name: PetAppPorts
    description: "Pet App HTTP Public"
    from_port: 8080
    to_port: 8080
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: NodeSG
  rules:
  - name: FromNodeSGtcp
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: tcp
    from_group: NodeSG
    rule_type: Ingress

  - name: FromNodeSGudp
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: udp
    from_group: NodeSG
    rule_type: Ingress

- name: ShowroomSG
  rules:
  - name: ShowroomHTTPS
    description: "Primary showroom endpoint - for reverse proxy"
    from_port: 8443
    to_port: 8443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: ShowroomExposed
    description: "Showroom views or exposed services, up to 26 of them"
    from_port: 8500
    to_port: 8525
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

instances:
- name: "{{ bastion_instance_name | default('ansible-1') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - BastionSG
  - WebSG
  - DefaultSG
  - NodeSG
  - ShowroomSG

- name: "{{ node1_instance_name | default('node1') }}"
  count: 1
  unique: true
  public_dns: false
  image:
    name: "ansible-bu-minimal-rhel-7.9-hvm-std01.x86_64-gp2"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "hostgroup"
    value: "rhel7_hosts"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - NodeSG
  - PetAppSG

- name: "{{ node2_instance_name | default('node2') }}"
  count: 1
  unique: true
  public_dns: false
  image:
    name: "ansible-bu-minimal-rhel-7.9-hvm-std01.x86_64-gp2"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "hostgroup"
    value: "rhel7_hosts"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - NodeSG
  - PetAppSG

- name: "{{ node3_instance_name | default('node3') }}"
  count: 1
  unique: true
  public_dns: false
  image:
    name: "ansible-bu-minimal-rhel-8.8-hvm-std01.x86_64-gp2"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "hostgroup"
    value: "rhel8_hosts"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - NodeSG
  - PetAppSG

- name: "{{ node4_instance_name | default('node4') }}"
  count: 1
  unique: true
  public_dns: false
  image:
    name: "ansible-bu-minimal-rhel-8.8-hvm-std01.x86_64-gp2"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "hostgroup"
    value: "rhel8_hosts"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
