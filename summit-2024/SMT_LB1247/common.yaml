# -------------------------------------------------------------------
# Role: ansible_bu_aws_access_policy
# -------------------------------------------------------------------
ec2_instance_common_tags: &common_tags
  ansible-workshops: "true"
  Workshop: "{{ guid }}"
  Workshop_type: "{{ workshop_type }}"
  Student: "ansible-1"
  Students: 1
  Info: "AWS_USERNAME that provisioned this"
  Linklight: "This was provisioned through the linklight provisioner"
  username: "ec2-user"
  operating_system: rhel

ansible_bu_aws_access_policy_ec2_instances_tags:
- name: ansible-1
  iamprofile: false
  tags:
    Workshop_ansible: "ansible-1"
    short_name: "ansible-1"
    <<: *common_tags
- name: "{{ node1_instance_name | default('node1') }}"
  iamprofile: true
  tags:
    Index: 1
    AnsibleGroup: "nodes"
    hostgroup: "rhel7_hosts"
    color: "#d48a00"
    Workshop_node1: "{{ guid }}-node1"
    short_name: "{{ node1_instance_name | default('node1') }}"
    os_major_version: 7
    guid: "{{ guid }}"
    <<: *common_tags
- name: "{{ node2_instance_name | default('node2') }}"
  iamprofile: true
  tags:
    Index: 2
    AnsibleGroup: "nodes"
    hostgroup: "rhel7_hosts"
    color: "#0039d4"
    Workshop_node2: "{{ guid }}-node2"
    short_name: "{{ node2_instance_name | default('node2') }}"
    os_major_version: 7
    guid: "{{ guid }}"
    <<: *common_tags
- name: "{{ node3_instance_name | default('node3') }}"
  iamprofile: true
  tags:
    Index: 3
    AnsibleGroup: "nodes"
    hostgroup: "rhel8_hosts"
    color: "#bf00d4"
    Workshop_node3: "{{ guid }}-node3"
    short_name: "{{ node3_instance_name | default('node3') }}"
    os_major_version: 8
    guid: "{{ guid }}"
    <<: *common_tags
- name: "{{ node4_instance_name | default('node4') }}"
  iamprofile: true
  tags:
    Index: 4
    AnsibleGroup: "nodes"
    hostgroup: "rhel8_hosts"
    color: "#67d300"
    Workshop_node4: "{{ guid }}-node4"
    short_name: "{{ node4_instance_name | default('node4') }}"
    os_major_version: 8
    guid: "{{ guid }}"
