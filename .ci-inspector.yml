---
thresholds:
  severity: warning
  max_vcpus: 242
  max_memory_gb: 960
  max_instances: 15
  max_cost_per_hour: 25.00
  max_storage_gb: 2000

  clouds:
    CNV:
      max_vcpus: 370
      max_memory_gb: 1024
    AWS:
      max_vcpus: 256
      max_memory_gb: 1024
      max_cost_per_hour: 30.00

  flagged_instance_types:
    - pattern: "p3.*"
      severity: warning
      message: "GPU instance — confirm this is intentional"
    - pattern: "g6*"
      severity: warning
      message: "GPU instance (g6 family) — confirm this is intentional"
    - pattern: "*.metal"
      severity: warning
      message: "Bare metal instance — confirm this is intentional"
    - pattern: "*.12xlarge"
      severity: warning
      message: "Very large instance (12xlarge) — confirm this is intentional"

ignore:
  - "includes/**"
  - "EXAMPLE_ACCOUNT/**"
