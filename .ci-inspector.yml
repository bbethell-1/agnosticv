---
thresholds:
  max_vcpus: 128
  max_memory_gb: 512
  max_instances: 20
  max_cost_per_hour: 25.00
  max_storage_gb: 2000

  clouds:
    CNV:
      max_vcpus: 256

  flagged_instance_types:
    - pattern: "p3.*"
      severity: warning
      message: "GPU instance — confirm this is intentional"
    - pattern: "*.metal"
      severity: warning
      message: "Bare metal instance — confirm this is intentional"

ignore:
  - "includes/**"
  - "EXAMPLE_ACCOUNT/**"
