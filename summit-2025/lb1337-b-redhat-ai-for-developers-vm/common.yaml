# -------------------------------------------------------------------
# --- System: RHDP
# --- Catalog: Demos
# --- Catalog Item: LB1337 : RAD Roadshow for AI Developers - VM
# -------------------------------------------------------------------

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2

# common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

software_workloads:
  bastions:
    - novnc
    - rhel-graphical
    - podman_desktop
    - rad_setup_nvidia_cuda
    - rad_setup_instructlab

setup_instructlab_git_ref: v0.19.3
# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------

novnc_proxy_port: 443

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------

install_rhel_graphical: true


use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - podman
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: instruct
student_password: "openshift"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 100
rootfs_size_bastion: 1024

bastion_instance_image: RHEL94GOLD-latest

instances:

  - name: rad-vm
    # count: "{{ num_users }}"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,radvms"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - NOvncSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: NOvncSG
    rules:

      - name: ClientNOVNCPort
        description: "Client NOVNC Public"
        from_port: 6080
        to_port: 6080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotChallangePort
        description: "Lets encrypt talks to 80"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotTLSPort
        description: "TLS"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

