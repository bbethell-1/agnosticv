# nvidia_gpu_operator_use_catalog_snapshot: true
# nvidia_gpu_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
# nvidia_gpu_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: ic-shared-minio
ocp4_workload_minio_port: 9000
ocp4_workload_minio_storage_size: "150Gi"
ocp4_workload_minio_expose_route: false
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2025-02-28T09-55-16Z
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: minio123
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
  - llmaas-storage

