---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

ocp4_installer_version: "4.18"

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/lb1755-mtv-showroom.git
ocp4_workload_showroom_content_git_repo_ref: lb1755-mtv-summit2025-network
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.3

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_cloud_provider: ec2
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
  catalog:
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 100
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
        limits.cpu: "512"
        requests.cpu: "512"
          # 390529548295
        limits.memory: "2000Gi"
        requests.memory: "2000Gi"
