---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_external_odf
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap
- ocp4_workload_lb2221_aqua
- ocp4_workload_showroom

ocp4_workload_lb2221_aqua_reporef: 1.0.1

ai_control_plane_cores: >-
  {{ 16 if worker_instance_count|int <= 10
  else 32 if worker_instance_count|int <= 20
  else 64
  }}
ai_control_plane_memory: >-
  {{ '32Gi' if worker_instance_count|int <= 10
  else '64Gi' if worker_instance_count|int <= 20
  else '128Gi'
  }}

# per user: 2cpu and 8gi ram
worker_instance_count: "{{ [(num_users | int / 7) | round(0, 'ceil') | int, 2] | max }}"
ai_workers_cores: 16
ai_workers_memory: >-
  {{ '32Gi' if num_users|int <= 4
  else '64Gi'
  }}


# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lb2221-aqua-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

# 3scale requires RWX storage, so disable it for now.
ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: v1.2.2
  rhoai:
    startingCSV: rhods-operator.2.16.0
    datasciencecluster:
      components:
        dashboard:
          managementState: Managed
        datasciencepipelines:
          managementState: Managed
        kserve:
          managementState: Managed
        kueue:
          managementState: Managed
        modelmeshserving:
          managementState: Managed
        modelregistry:
          managementState: Managed
        ray:
          managementState: Managed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: rhsso-operator.7.6.9-opr-002
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: web-terminal.v1.12.1

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: judd-lb2221-aqua-workload
