# -------------------------------------------------------------------
#  Catalog Item "LB2221: Smart Aquaculture edge-to-cloud developer workshop"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3

ai_control_plane_cores: >-
  {{ 16 if worker_instance_count|int <= 10
  else 32
  }}

ai_control_plane_memory: >-
  {{ '32Gi' if worker_instance_count|int <= 10
  else '64Gi'
  }}

# COMPUTE:  lab requires: per user: 2cpu and at least 8gi ram
# 7 * 8 = 56Gi
# if num_users <= 7 use 32 cores, 64 ram, and 2 workers
# if num_users > 7 the provision 10 users per worker node:
#      64 cores, 128 ram, and num_users / 10
worker_instance_count: >-
  {{ 2 if num_users|int <= 7
     else [(num_users | int / 10) | round(0, 'ceil') | int, 2] | max
  }}

# [(num_users | int / 7) | round(0, 'ceil') | int, 2] | max }}"
ai_workers_cores: 64
ai_workers_memory: >-
  {{ '64Gi' if num_users|int <= 7
     else '128Gi'
  }}

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_external_odf
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap
- ocp4_workload_lb2221_aqua
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: user

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_04_07

common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"

# -------------------------------------------------------------------
# ocp4_workload_lb2221_aqua
# -------------------------------------------------------------------
ocp4_workload_lb2221_aqua_reporef: 1.3.2

# -------------------------------------------------------------------
# ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
# ocp4_workload_openshift_gitops_kustomize_plugin_env:
# - name: MY_VAR
#   value: myValue

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# Customize resource health check behavior (resourceHealthChecks).
ocp4_workload_openshift_gitops_resource_health:
- group: operators.coreos.com
  kind: Subscription
  check: |
    health_status = {}
    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        numDegraded = 0
        numPending = 0
        msg = ""
        for i, condition in pairs(obj.status.conditions) do
          msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
          if condition.type == "InstallPlanPending" and condition.status == "True" then
            numPending = numPending + 1
          elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
            numDegraded = numDegraded + 1
          elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed" or condition.type == "ResolutionFailed") and condition.status == "True" then
            numDegraded = numDegraded + 1
          end
        end
      end
      if numDegraded == 0 and numPending == 0 then
        health_status.status = "Healthy"
        health_status.message = msg
        return health_status
      elseif numPending > 0 and numDegraded == 0 and obj.spec.installPlanApproval == "Manual" then
        health_status.status = "Healthy"
        health_status.message = "An install plan for a subscription is pending installation but install plan approval is set to manual so considering this as healthy: " .. msg
        return health_status
      elseif numPending > 0 and numDegraded == 0 then
        health_status.status = "Progressing"
        health_status.message = "An install plan for a subscription is pending installation"
        return health_status
      else
        health_status.status = "Degraded"
        health_status.message = msg
        return health_status
      end
    end
    return health_status

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lb2221-aqua-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.10
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

