# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6F387EE4-3F15-4DDB-A5C1-182776E56CEE
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1136: The Definitive Red Hat Enterprise Linux 10 Hands-On Lab"
    category: Red_Hat_Summit_2025
    keywords:
      - rhel
      - rhel10
      - lb1136
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv07
        purpose: prod
        virt: "yes"
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
