---
#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
rhel_instance_image: rhel-10.0
rootfs_size_rhel: 50Gi
node_name: node
pv_size_node: 4Gi

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
    routes:
      - name: bastion-https
        host: bastion
        service: bastion
        targetPort: 443
        tls: true

  - name: "{{ node_name }}"
    count: 2
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: node-https
    routes:
      - name: node-https
        host: node
        service: node
        targetPort: 443
        tls: true
    disks:
      - metadata:
          name: "{{ node_name }}{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}1"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}2"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}3"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

  - name: "node3"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
    services:
      - name: nodehttp
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-http
      - name: node
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: node-https
      - name: cockpit
        ports:
          - port: 9090
            protocol: TCP
            targetPort: 9090
            name: cockpit-https
    routes:
      - name: node-http
        host: node3
        service: nodehttp
        targetPort: 80
        tls: false

      - name: node-https
        host: node
        service: node
        targetPort: 443
        tls: true

      - name: cockpit-https
        host: node3
        service: cockpit
        targetPort: 9090
        tls: true
    disks:
      - metadata:
          name: "node3{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node3{{ guid }}1"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node3{{ guid }}2"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node3{{ guid }}3"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

  - name: "leapp"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: leapp
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: leapp-https
    routes:
      - name: leapp-https
        host: leapp
        service: leapp
        targetPort: 443
        tls: true


###Showroom Development
showroom_git_ref: development
