---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-lab.yaml

# -------------------------------------------------------------------
# --- Catalog Item: LB1344 : How can you bring in your own knowledge to OpenShift Lightspeed and ‘complete’ your RAG pipeline?
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: ec2

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18"
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL91GOLD-latest
gpu_instance_type: g5.2xlarge

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true
aws_region: us-east-2

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
# ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# Workload variables #
num_users: 1
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_multi_user: "{{ true if num_users | int > 1 else false }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_02_24

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: community.okd
      version: 2.3.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_authentication # all segments
  - ocp4_workload_ols
#  - ocp4_workload_machinesets
#  - ocp4_workload_nvidia_gpu_setup
#  - ocp4_workload_pipelines
#  - ocp4_workload_openshift_gitops
  - ocp4_workload_expose_registry
  - ocp4_workload_web_terminal
  - ocp4_workload_showroom
#  - ocp4_workload_argocd_bootstrap

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols
# -------------------------------------------------------------------
ocp4_workload_ols_channel: alpha

# --------------------------------
# Operator Catalog Snapshot Settings
# --------------------------------
# See https://github.com/redhat-cop/agnosticd/blob/development/docs/Operator_Catalog_Snapshots.adoc
# for instructions on how to set up catalog snapshot images

# Use a catalog snapshot
ocp4_workload_ols_use_catalog_snapshot: true

# Catalog Source Name when using a catalog snapshot. This should be unique
# in the cluster to avoid clashes
ocp4_workload_ols_catalogsource_name: lightspeed-operator-catalog
ocp4_workload_ols_catalogsource_namespace: openshift-marketplace

# Catalog snapshot image
ocp4_workload_ols_catalog_snapshot_image: docker.io/raptorsun/lightspeed-catalog

# Catalog snapshot image tag
ocp4_workload_ols_catalog_snapshot_image_tag: "0.33.1"

###ocp4_workload_expose_registry###
ocp_username: "system:admin"

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true

# Add a MachineSet for AWS Bare Metal instances
# To add another group of worker nodes - with autoscaling enabled add
# the following:
#
ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    autoscale: true
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 3
    role: worker-gpu
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule
    instance_type: "{{ gpu_instance_type }}"

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: openshift-nfd
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: "nfd.4.15.0-202406211306"
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""

# ------------------------------------------------
# NVIDIA GPU Operator
# ------------------------------------------------
nvidia_gpu_operator_namespace: nvidia-gpu-operator
nvidia_gpu_operator_channel: v24.3
nvidia_gpu_operator_automatic_install_plan_approval: true
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v24.3.0
nvidia_gpu_operator_wait_for_deploy: true
nvidia_gpu_operator_use_catalog_snapshot: false
nvidia_gpu_operator_catalogsource_name: ""
nvidia_gpu_operator_catalog_snapshot_image: ""
nvidia_gpu_operator_catalog_snapshot_image_tag: ""

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.15

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.12

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# ocp4_workload_argocd_bootstrap variables
ocp4_workload_argocd_bootstrap_repo_list:
  - repo: https://github.com/ritzshah/llm-rag-deployment.git
    branch: main
    bootstrap_path: bootstrap/applicationset/applicationset-bootstrap.yaml
  - repo: https://github.com/ritzshah/llm-rag-deployment.git
    branch: main
    bootstrap_path: bootstrap-rag/applicationset/applicationset-bootstrap.yaml

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/lb1344-showroom-openshift-lightspeed-and-rag-pipeline.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.3
#ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true
# -------------------------------------------------------------------
# Agnosticd Passthrough Userdata
# -------------------------------------------------------------------
userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "admin_user": "admin",
    "admin_password": "{{ common_admin_password }}"
    },
  {% endfor %}
  }

agnosticd_passthrough_user_data: |
  {{ {}
   | combine( {
     "users": userdata })
  }}

# --- Student Workloads (YAML List)
student_workloads: []

host_ocp4_installer_set_user_data_kubeadmin_password: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 16879713-11D0-4B5E-BA4C-FF118FE02059
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1344: How can you bring in your own knowledge to OpenShift Lightspeed and complete your RAG pipeline?"
    category: Red_Hat_Summit_2025
    workshopUiDisabled: true
    multiuser: false
    keywords:
      - openshift
      - ocp
      - lightspeed
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m5a.8xlarge
          enum:
            - m5a.8xlarge
            - m5a.12xlarge

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
