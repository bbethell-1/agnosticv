  asset_uuid: 16879713-11D0-4B5E-BA4C-FF118FE02059
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1344: How can you bring in your own knowledge to OpenShift Lightspeed and complete your RAG pipeline?"
    category: Red_Hat_Summit_2025
    multiuser: false
    keywords:
      - openshift
      - ocp
      - lightspeed
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m5a.12xlarge
          enum:
            - m5a.8xlarge
            - m5a.12xlarge

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
