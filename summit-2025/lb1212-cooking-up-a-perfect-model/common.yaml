---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/hugging-face-ro-token.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

software_workloads:
  bastions:
    - novnc
    - rhel-graphical
    - podman_desktop
    - vscode-server
    - agnosticd.ai.setup_nvidia_cuda
    - agnosticd.ai.setup_instructlab
    - lb1212.instruct_lab.bastion_role

# -------------------------------------------------------------------
# Workloads: rhel_firewalld
# -------------------------------------------------------------------
rhel_firewalld_open_ports:
  - 6443/tcp
  - 8443/tcp
  - 8000/tcp
  - 8001/tcp
  - 8002/tcp
  - 8003/tcp
  - 8004/tcp
  - 8005/tcp
  - 8006/tcp
  - 8007/tcp
  - 8008/tcp
  - 8009/tcp
  - 8010/tcp

# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------

novnc_proxy_port: 6443

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------

install_rhel_graphical: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/lb1212.instruct_lab.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads: showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/showroom-lb1212-cooking-up-a-perfect-model.git
showroom_git_ref: main
showroom_user: showroom
showroom_ui: default

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_parasol_image: quay.io/redhat-gpte/lb1212-airlines-app-olama
showroom_parasol_image_tag: '1.0'
showroom_parasol_tab_title: Parasol Airlines

showroom_tab_services:
  - double_tty
  - web2
  - parasol

showroom_ttys_enable_tmux: true

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

# TODO: Add a parasol port var

showroom_tab_web1_url: "http://{{ showroom_host }}:8005/v1"
showroom_tab_web1_name: Parasol Airlines

showroom_tab_web2_url: "https://{{ showroom_host }}:8443"
showroom_tab_web2_name: Developer Environment

# -------------------------------------------------------------------
# Role: bastion_role
# -------------------------------------------------------------------
bastion_role_student_name: "{{ student_name }}"
bastion_role_huggingface_ro_token: "{{ huggingface_ro_token }}"
bastion_role_model_download_list:
  - repository: instructlab/granite-7b-lab-GGUF
    filename: granite-7b-lab-Q4_K_M.gguf
  - repository: instructlab/merlinite-7b-lab-GGUF
    filename: merlinite-7b-lab-Q4_K_M.gguf
  - repository: cedricclyburn/404-airlines-qa
    filename: 404-airlines-qa.gguf

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------

vscode_auth_type: none

vscode_server_version: "4.95.3" #NOTE No leading `v` due to braindead url which mixes v and non v semantic versions
vscode_server_rpm_url: >-
  https://github.com/coder/code-server/releases/download/v{{ vscode_server_version }}/code-server-{{ vscode_server_version }}-amd64.rpm

vscode_server_install_vscode: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
vscode_server_default_extensions: []
vscode_server_extension_urls: []
vscode_user_name: "{{ student_name }}"
vscode_user_workspace_path: /home/{{ student_name }}/.local/share/instructlab/taxonomy

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true
  },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------

setup_nvidia_cuda_nvidia_rhel_dnf_packages:
  - "@nvidia-driver:latest-dkms"
  - cuda-toolkit-12-4
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - cuda-cccl-12-4
  - libnccl-2.22.3-1+cuda12.4.x86_64

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:
  - at
  - ansible
  - bash-completion
  - bind-utils
  - git
  - podman
  - python3.11
  - python3.11-devel
  - python3.11-pip
  - tree
  - vim-enhanced
  - wget
  - zip

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_instructlab
# -------------------------------------------------------------------
setup_instructlab_summit2024_mode: true

setup_instructlab_llama_cpp_python_version: "0.2.79"
setup_instructlab_git_ref: "v0.19.3"

setup_instructlab_user: "{{ student_name }}"

setup_instructlab_cuda_home: "/usr/local/cuda-12.4"
setup_instructlab_cuda_lib_path: "/usr/local/cuda-12.4/lib64:/usr/local/cuda-12.4/extras/CUPTI/lib64"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Create files directory
    type: directory
    path: >-
      /home/{{ student_name }}/files
      owner: "{{ student_name }}"
      group: users
      mode: '0755'

  - description: Clone repo with qna.yaml file
    type: git
    src: 'https://github.com/rhai-code/backToTheFuture.git'
    dest: '/home/{{ student_name }}/files/backToTheFuture'
    version: 'main'
    owner: "{{ student_name }}"
    group: users
    mode: '0755'

# Replace below with new model when ready in HuggingFace

  - description: LLM fetch summit-connect-merlinite-lab-Q4
    type: http
    dest: >-
      /home/{{ student_name }}/files/summit-connect-merlinite-lab-Q4.gguf
    src: >-
      https://d18h2xbjo1t4w8.cloudfront.net/ai-assets/summit-connect-merlinite-lab-Q4.gguf
    url_username: "{{ s3_rhpds_private_username }}"
    url_password: "{{ s3_rhpds_private_password }}"
    owner: "{{ student_name }}"
    group: users
    mode: u=rw,g=r,o=r

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: developer
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 100
rootfs_size_bastion: 1024
bastion_rootfs_size: 200

bastion_instance_image: RHEL94GOLD-latest

instances:
  - name: desktop
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - RhelSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: RhelSG
    rules:
      - name: ClientNOVNCPort
        description: "Client NOVNC Public"
        from_port: 6080
        to_port: 6080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotChallangePort
        description: "Lets encrypt talks to 80"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotTLSPort
        description: "TLS"
        from_port: 6443
        to_port: 6443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: Codeserver
        description: "Codeserver Port"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ParasolHTTP
        description: "Parasol HTTP Port"
        from_port: 8005
        to_port: 8005
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: InstructLabAPI
        description: "InstructLab API Port"
        from_port: 8000
        to_port: 8010 # lets open up a few ports for now
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 78A46718-3EC3-48BD-B16A-240B2FB80F37
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB1212: Cooking Up A Perfect Model - The Recipe for Success with InstructLab & RHEL AI
    category: Red_Hat_Summit_2025
    workshopLabUiRedirect: true
    keywords:
      - summit
      - summit_2025
      - summit2025
      - lb1212
      - lab1212
    labels:
      Product: Red_Hat_Enterprise_Linux_AI
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
            - us-west-2
            - us-east-1
            - eu-central-1
            - ap-northeast-1
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g6.xlarge
          enum:
            - g6.xlarge
            - g6.4xlarge
            - g6.12xlarge
            - g5.xlarge
            - g5.4xlarge
            - g4dn.xlarge
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
      pull: missing
  sandbox_api:
    reservation: pgpu-event
  owners:
    maintainer:
      - email: cclyburn@redhat.com
        name: Cedric Clyburn
      - email: lkerriso@redhat.com
        name: Legare Kerrison
    sme:
      - email: cclyburn@redhat.com
        name: Cedric Clyburn
      - email: lkerriso@redhat.com
        name: Legare Kerrison
      - email: treddy@redhat.com
        name: Tyrell Reddy
