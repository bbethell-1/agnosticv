---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# TODO: Move to common all variables

worker_instance_count: 3
ai_workers_cores: 32
ai_workers_memory: 32Gi

# No users -> admin showroom
ocp4_workload_authentication_htpasswd_user_count: 0

# nfs-server Configuration
nfsserver_instance_image: rhel-8.2
nfsserver_cores: 4
nfsserver_memory: 4G
nfsserver_rootfs_size: 30Gi

compute_instance_image: rhel-9.4
compute_cores: 16
compute_memory: 16G
compute_rootfs_size: 100Gi

compute_adoption_instance_image: rhel-9.2

ai_attach_workers_networks:
  - ctlplane
  - internalapi
  - storage
  - tenant
  - external

networks:
  - name: ctlplane
  - name: internalapi
  - name: storage
  - name: tenant
  - name: external


instances:
  - name: bastion
    count: 1
    unique: true
    alt_name: bastion
    memory: "{{ bastion_memory }}"
    cores: "{{ bastion_cores }}"
    image_size: "{{ bastion_rootfs_size }}"
    image: "{{ bastion_instance_image }}"
    metadata:
      - AnsibleGroup: "bastions"
      - function: bastion
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default

  - name: compute01
    count: 1
    unique: true
    memory: "{{ compute_memory }}"
    cores: "{{ compute_cores }}"
    image_size: "{{ compute_rootfs_size }}"
    image: "{{ compute_instance_image }}"
    metadata:
      - AnsibleGroup: "isolated"
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default
      - ctlplane
      - internalapi
      - storage
      - tenant
      - external

  - name: compute02
    count: 1
    unique: true
    memory: "{{ compute_memory }}"
    cores: "{{ compute_cores }}"
    image_size: "{{ compute_rootfs_size }}"
    image: "{{ compute_adoption_instance_image }}"
    metadata:
      - AnsibleGroup: "isolated"
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default
      - ctlplane
      - internalapi
      - storage
      - tenant
      - external

  - name: compute03
    count: 1
    unique: true
    memory: "{{ compute_memory }}"
    cores: "{{ compute_cores }}"
    image_size: "{{ compute_rootfs_size }}"
    image: "{{ compute_adoption_instance_image }}"
    metadata:
      - AnsibleGroup: "isolated"
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default
      - ctlplane
      - internalapi
      - storage
      - tenant
      - external

  - name: nfsserver
    count: 1
    unique: true
    memory: "{{ nfsserver_memory }}"
    cores: "{{ nfsserver_cores }}"
    image_size: "{{ nfsserver_rootfs_size }}"
    image: "{{ nfsserver_instance_image }}"
    metadata:
      - AnsibleGroup: "isolated"
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default
      - storage

  - name: allinone
    count: 1
    unique: true
    memory: "{{ compute_memory }}"
    cores: "{{ compute_cores }}"
    image_size: "{{ compute_rootfs_size }}"
    image: "{{ compute_adoption_instance_image }}"
    metadata:
      - AnsibleGroup: "isolated"
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default
      - ctlplane
      - internalapi
      - storage
      - tenant
      - external

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
