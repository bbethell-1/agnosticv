# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.16"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: false

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3
worker_instance_count: 0
ai_workers_cores: 32
ai_workers_memory: 32Gi

# ai_control_plane_cores: 8
# Minimum control plane memory is 16Gi, anything below fails
# ai_control_plane_memory: 16Gi
# Try a compact cluster with just 3 bigger control plane
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi
ai_extra_networks:
- ctlplane
- internalapi
- storage
- tenant
- external

# nfs-server Configuration
nfsserver_instance_image: rhel-8.2
nfsserver_cores: 4
nfsserver_memory: 4G
nfsserver_rootfs_size: 30Gi

compute_instance_image: rhel-9.4
compute_cores: 16
compute_memory: 16G
compute_rootfs_size: 100Gi

compute_adoption_instance_image: rhel-9.2

networks:
- name: ctlplane
- name: internalapi
- name: storage
- name: tenant
- name: external

ai_attach_masters_networks:
- ctlplane
- internalapi
- storage
- tenant
- external

instances:
- name: bastion
