  tags:
  - key: "AnsibleGroup"
    value: "isolated"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ guid }}"
  networks:
  - default
  - ctlplane
  - internalapi
  - storage
  - tenant
  - external

- name: compute03
  count: 1
  unique: true
  memory: "{{ compute_memory }}"
  cores: "{{ compute_cores }}"
  image_size: "{{ compute_rootfs_size }}"
  image: "{{ compute_adoption_instance_image }}"
  metadata:
  - AnsibleGroup: "isolated"
  - user: "{{ student_name }}"
  - project: "{{ project_tag }}"
  - ostype: linux
  - Purpose: "{{ purpose }}"
  tags:
  - key: "AnsibleGroup"
    value: "isolated"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ guid }}"
  networks:
