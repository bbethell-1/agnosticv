# -------------------------------------------------------------------
# --- Catalog Item: TAP Workshop
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# --- Student user
# -------------------------------------------------------------------
student_name: lab-user

# ------------------------------------------------------
# Workload: ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-lb2255-jumpstarter.git
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Export userinfo variables to showroon
# -------------------------------------------------------------------
export_ocp_cluster_vars_to_showroom:
- rhdh_id_provider
- rhdh_url
- rhdh_user
- rhdh_user_password
- bastion_public_hostname
- bastion_ssh_user_name
- bastion_ssh_password
- devspaces_url
- devspaces_user
- devspaces_user_password
- gitlab_user
- gitlab_user_password
- openshift_cluster_ingress_domain

export_rhel_arm_vars_to_showroom:
- bastion_public_hostname
- bastion_ssh_user_name
- bastion_ssh_password

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: multi
env_type: lb2255-binder

__meta__:
  asset_uuid: A312DB0E-5043-4DA9-8371-8BEAE04C39EF
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB2255: Project Jumpstarter - An open source framework for cloud-native hardware-in-the-loop (HIL) testing in Automotive DevSecOps
    category: Red_Hat_Summit_2025
    keywords:
    - summit
    - summit_2025
    - summit2025
    - lb2255
    - lab2255
    labels:
      Product: Red_Hat_Trusted_Application_Pipeline
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: always
  owners:
    maintainer:
    - email: mkuehl@redhat.com
      name: Michael Kuehl
    - email: majopela@redhat.com
      name: Miguel Angel Ago
    sme:
    - email: mkuehl@redhat.com
      name: Michael Kuehl
    - email: majopela@redhat.com
      name: Miguel Angel Ago
  # -------------------------------------------------------------------
  # Components to include in template and catalog item
  # -------------------------------------------------------------------
  components:
  - name: lb2255_ocp_cluster
    display_name: "LB2255: Project Jumpstarter - OCP"
    item: summit-2025/lb2255-jumpstarter-ocp
    propagate_provision_data:
    - var: lb2255_ocp_cluster_data

  - name: lb2255_rhel_arm
    display_name: "LB2255: Project Jumpstarter - RHEL ARM"
