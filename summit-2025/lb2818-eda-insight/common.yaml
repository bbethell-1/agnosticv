---
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml

#include /includes/aws-sandbox-meta.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/parameters/ocp4-fips-enable.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/parameters/aws-6regions.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2
student_name: lab-user
student_password: "{{ common_password }}"
aws_region: us-east-2

# -------------------------------------------------------------------
# OpenShift variable
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2024_07_15
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
bastion_instance_image: RHEL92GOLD-latest
bastion_instance_type: "t3a.large"
rootfs_size_bastion: 50

node_instance_image: RHEL92GOLD-latest
node_instance_type: "t3a.large"

# ------------------
# AWS SECURITY GROUPS
# ------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ContHTTPPorts
        description: "HTTP Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromBastionTCP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: BastionSG
        rule_type: Ingress

      - name: FromBastionUDP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: BastionSG
        rule_type: Ingress

# ------------------
# AWS INSTANCES
# ------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion }}"
    security_groups:
      - BastionSG
      - NodeSG
      - WebSG

  - name: "node"
    count: 1
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ node_instance_image }}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion }}"
    security_groups:
      - WebSG
      - NodeSG
      - BastionSG

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: set-repository
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4
    - name: additional_nodes_config_injector
      src: https://github.com/redhat-gpte-devopsautomation/additional_nodes_config_injector.git
      version: main
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# List of OpenShift Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform_25
  - ocp4_workload_gitea_operator
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - automation_platform_bastion
  - additional_nodes_config_injector
  - set_host_public_fqdn
  - ocp4_workload_showroom
  - ansible_automation_platform_configuration
  - vscode-server

student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
