# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-us.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: rosa-consolidated

# Temporary create an open environment so that NetApp can examine what they need
agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL95GOLD-latest

# -------------------------------------------------------------------
# ROSA specific
# -------------------------------------------------------------------
rosa_cluster_name: "dr-{{ guid }}"
rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

rosa_version: default
rosa_version_base: "openshift-v4.16"

rosa_machine_cidr: "10.10.0.0/16"

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_rosa_fsx
- ocp4_workload_kubevirt

# -------------------------------------------------------------------
# ocp4_workload_rosa_fsx
# -------------------------------------------------------------------
ocp4_workload_rosa_fsx_deploy_fsx: false

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false

ocp4_workload_kubevirt_enabled_nested_kvm: true
ocp4_workload_kubevirt_deploy_hyperconverged: true

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/showroom-summit2025-lb2739-trident
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
- "{{ bastion_user_name }}"

