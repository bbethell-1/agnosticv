# -------------------------------------------------------------------
# --- Catalog Item: LAB2 4: Delivering the Developer Experience Roadshow - Platform Engineer
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"
num_users: 1

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL94GOLD-latest

key_name: opentlc_admin_backdoor
region: us-east-2
aws_region: us-east-2

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2024_07_15

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
master_instance_type: m6a.8xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: dev-admin
# --- student_password not set -> generate random password
student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_platform_engineering_workshop
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_channel: stable-v1.14
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.16

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_remove_kubeadmin: false
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_deployer_chart_version: 1.1.0
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-lb1288-pe-ocp-rhdh.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true
ocp4_workload_showroom_namespace: showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_platform_engineering_workshop
# -------------------------------------------------------------------
# Temporary tag for using RHDH 1.5.x for Summit Lab and testing, without breaking regular catalog
ocp4_workload_platform_engineering_workshop_rhdh_helm_repo_tag: rhdh-1.5
ocp4_workload_platform_engineering_workshop_gitlab_gitops_repo_tag: 1.5.1-updates

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  sandboxed: false
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6A965787-5AF7-4F6D-873D-E3F08C9C084D
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1288: Platform Engineering with Red Hat OpenShift and Red Hat Developer Hub"
    category: Red_Hat_Summit_2025
    multiuser: false
    keywords:
    - summit
    - summit_2025
    - summit2025
    - lb1288
    - lab1288
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
    actions:
      stop:
        disable: true
      start:
        disable: true
  # Auto stop instances using the sandbox API
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  owners:
    maintainer:
    - email: btison@redhat.com
      name: Bernard Tison
    - email: jaya@redhat.com
      name: Jaya Baskaran
    sme:
    - email: btison@redhat.com
      name: Bernard Tison
    - email: jaya@redhat.com
      name: Jaya Baskaran
