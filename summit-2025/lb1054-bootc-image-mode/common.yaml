---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/gcp-region.yaml
#include /includes/parameters/student-email.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/gpte-gcp.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/parameters/enable-lets-encrypt.yaml

# -------------------------------------------------------------------
# --- Catalog: Red Hat Summit 2025
# --- Catalog Item: "LB1054: Unleashing The Power of Image Mode for RHEL"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
env_type: multi-cloud-base-infra
cloud_provider: gcp

# -------------------------------------------------------------------
# GCP Variables
# -------------------------------------------------------------------
project_name: "{{ project_tag }}"
gcp_project_id: "{{ project_tag }}"
gcp_credentials_file: '{{ output_dir }}/gcp_credentials_file_{{ guid }}.json'
gcp_zone: "{{ gcp_region }}-b"
ansible_user: gcpuser
remote_user: gcpuser
dns_delegation: false
dns_bastion: true
cluster_dns_zone: "{{ guid }}.gcp.redhatworkshops.io"
gcp_region: us-east1
# subdomain_base: "{{ guid }}.{{ cluster_dns_zone }}"
subdomain_base: "{{ cluster_dns_zone }}"

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: rhel-9

# default_instance_type: n2-standard-4
bastion_instance_type: c2-standard-8
node_instance_type: n2-standard-2

bastion_rootfs_size: 200
node_rootfs_size: 50
disk_type: pd-ssd

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: allow-ssh
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"

  - name: allow-http
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"

  - name: allow-https
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"

# -------------------
# Instances
# -------------------
instances:
  - name: "bastion"
    image:
      project: rhel-cloud
      family: rhel-9
    flavor:
      gcp: "{{ bastion_instance_type }}"
    tags:
      - key: "ansiblegroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ bastion_rootfs_size | default(default_rootfs_size) }}"
    nested_virtualization: true
    security_groups:
      - allow-ssh
      - allow-http
      - allow-https

  - name: "node"
    image:
      project: rhel-cloud
      family: rhel-9
    flavor:
      gcp: "{{ node_instance_type }}"
    tags:
      - key: "ansiblegroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ node_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - allow-ssh
      - allow-http
      - allow-https

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/lb1054.bootc.git
      type: git
      version: main

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_infra_workloads:
  localhost:
    - open-env-gcp-add-user-to-project
    - infra-gcp-credentials-file
    - infra-gcp-install-sdk

post_infra_workloads:
  localhost:
    - infra-gcp-ssh-key

pre_software_workloads:
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user

software_workloads:
  bastions:
    - asset_injector
    - lb1054.bootc.pod
  nodes:
    - lb1054.bootc.registry

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom
    - lb1054.bootc.config
    - lb1054.bootc.rhn_repository

# ----------------------
# Destroy Workloads
# ----------------------
pre_destroy_workloads:
  localhost:
    - infra-gcp-credentials-file
    - infra-gcp-install-sdk

post_destroy_workloads:
  localhost:
    - open-env-gcp-remove-project

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - git
  - jq
  - libvirt
  - lorax
  - make
  - nano
  - qemu-kvm
  - guestfs-tools
  - podman
  - python
  - skopeo
  - tmux
  - unzip
  - vim-enhanced
  - virt-install
  - wget
  - libvirt-nss

# -------------------------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# Role: asset_injector_assets
# -------------------------------------------------------------------
asset_injector_assets:
  - description: "Add {{ student_name }} user to group libvirt"
    type: user
    name: "{{ student_name }}"
    state: present
    groups: libvirt

  - description: Fix Setr cap_setuid+ep on newuidmap for podman issue
    type: capability
    path: /usr/bin/newuidmap
    capability: cap_setuid+ep
    state: present

  - description: Fix Setr cap_setgid+ep on newgidmap for podman issue
    type: capability
    path: /usr/bin/newgidmap
    capability: cap_setgid+ep
    state: present

  - description: Enable and start libvirtd
    type: service
    name: libvirtd
    state: started
    enabled: true

  - description: Update /etc/nsswitch.conf
    type: lineinfile
    path: /etc/nsswitch.conf
    regexp: '^hosts: .*$'
    line: 'hosts: files libvirt libvirt_guest dns myhostname'

# -------------------------------------------------------------------
# Collection: lb1054.bootc
# -------------------------------------------------------------------
# ------------------------
# lb1054.bootc.pod
# ------------------------
lb1054_bootc_pod_username: "{{ student_name }}"
lb1054_bootc_pod_auth_token: >-
  

# ------------------------
# lb1054.bootc.registry
# ------------------------
certbot_cert_manager_provider: letsencrypt
# lb1054_bootc_registry_hostname: "node.{{guid}}.{{ cluster_dns_zone }}"
lb1054_bootc_registry_hostname: "node.{{ cluster_dns_zone }}"

# ------------------------
# lb1054.bootc.config
# ------------------------
lb1054_bootc_config_example_repo: https://github.com/nzwulfin/rh-summit-2024-lb1506.git
lb1054_bootc_config_example_repo_dest_path: /home/lab-user/rh-summit-2024-lb1506

# ------------------------
# lb1054.bootc.rhn_repository
# ------------------------
lb1054_bootc_rhn_repository_unsubscribe: true
lb1054_bootc_rhn_repository_subscribe: true
lb1054_bootc_rhn_repository_subscribe_org_id: 12451665
lb1054_bootc_rhn_repository_subscribe_activation_key: lb1054-key

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  # registry_hostname: "node.{{guid}}.{{ cluster_dns_zone }}"
  registry_hostname: "node.{{ cluster_dns_zone }}"
  guid: "{{ guid }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/showroom-lb1054-rhel-image-mode.git"
showroom_user: showroom
showroom_ui: default

# showroom_host: "bastion.{{guid}}.{{ cluster_dns_zone }}"
showroom_host: "bastion.{{ cluster_dns_zone }}"
showroom_ssh_host: "{{ showroom_host }}"
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_tab_services:
  - single_terminal

showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_username: "{{ student_name }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6E720F65-C03F-45C3-981C-485480DCA49F
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1054: Unleashing The Power of Image Mode for RHEL"
    workshopLabUiRedirect: true
    category: Red_Hat_Summit_2025
    keywords:
      - rhel
      - rhel9
      - lb1054
      - bootc
      - image mode
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
      pull: missing
