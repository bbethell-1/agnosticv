---
# -------------------------------------------------------------------
# --- Catalog: Red Hat Summit 2025
# --- Catalog Item: "LB1054: Unleashing the power of image mode for RHEL"
# -------------------------------------------------------------------
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/openshift-ocpv-configs.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: base-infra
cloud_provider: openshift_cnv
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

#ssh_privatekey: "{{ lookup('file', hostvars.localhost.ssh_provision_key_path) }}"
#ssh_publickey: "{{ hostvars.localhost.ssh_provision_pubkey_content }}"
#bastion_student_show_user_info: true
#create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# software_workloads_for_bastion
# -------------------------------------------------------------------

software_workloads_for_bastion:

  - asset_injector

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

  - description: "Add {{ student_name }} user to group libvirt"
    type: user
    name: "{{ student_name }}"
    state: present
    groups: libvirt

  - description: Fix Setr cap_setuid+ep on newuidmap for podman issue
    type: capability
    path: /usr/bin/newuidmap
    capability: cap_setuid+ep
    state: present

  - description: Fix Setr cap_setgid+ep on newgidmap for podman issue
    type: capability
    path: /usr/bin/newgidmap
    capability: cap_setgid+ep
    state: present

  - description: Enable and start libvirtd
    type: service
    name: libvirtd
    state: started
    enabled: true

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

hypervisor_instance_image: rhel-9.4
rootfs_size_rhel: 200Gi

instances:
  - name: "hypervisor"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ hypervisor_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    services:
      - name: hypervisor
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: hypervisor-https
    routes:
      - name: hypervisor-https
        host: hypervisor
        service: hypervisor
        targetPort: 443
        tls: true

# -------------------------------------------------------------------
# Workloads: showroom
# -------------------------------------------------------------------

#showroom_git_repo: "https://github.com/rhpds/showroom-lb1054-rhel-image-mode.git"
showroom_user: showroom
showroom_ui: default

showroom_tab_services:
#  - web1
  - tty1

showroom_tab_tty1_username: "{{ student_name }}"
showroom_showroom_default_ssh_user: "{{ student_name }}"
showroom_ttys_enable_tmux: false
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

#showroom_tab_web1_url: "https://{{ showroom_host }}:8443/"
#showroom_tab_web1_name: Codeserver

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
install_common: true
agd_install_bastion_base: false

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: lab-user
student_password: "{{ common_password }}"

common_packages_el9:
  - at
  - bash-completion
  - git
  - jq
  - libvirt
  - lorax
  - make
  - nano
  - qemu-kvm
  - guestfs-tools
  - podman
  - python
  - skopeo
  - tmux
  - unzip
  - vim-enhanced
  - virt-install
  - wget

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6E720F65-C03F-45C3-981C-485480DCA49F
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1054: Unleashing the power of image mode for RHEL"
    category: Red_Hat_Summit_2025
    keywords:
      - rhel
      - rhel9
      - lb1054
      - bootc
      - image mode
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
    reportingLabels:
      primaryBU: RHEL
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
