---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/lb1054.bootc.git
      type: git
      version: prakhar1985-patch-1

certbot_cert_manager_provider: letsencrypt
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
      - name: showroom_git_ref
        description: Select Showroom branch
        formLabel: Select Showroom branch
        openAPIV3Schema:
          type: string
          default: main
          enum:
            - main
            - rhel10
            - rhel-update
