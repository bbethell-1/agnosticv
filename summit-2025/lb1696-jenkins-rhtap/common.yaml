ocp4_workload_trusted_application_pipeline_gitlab_template_locations:
- group: rhdh
  project: tap-workshop-templates
  branch: main
  file: showcase-templates.yaml
  rules:
    allow: Template
  templates:
  - scaffolder-templates/quarkus-secure-jenkins-template/template.yaml
  - scaffolder-templates/quarkus-insecure-jenkins-template/template.yaml
  - scaffolder-templates/quarkus-secure-tekton-template/template.yaml
- group: rhdh
