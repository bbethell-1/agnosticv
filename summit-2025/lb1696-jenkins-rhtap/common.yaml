  branch: main
  file: org.yaml
  rules:
    allow: Group, User
  templates: []
- group: rhdh
  project: tap-workshop-templates
  branch: main
  file: catalogs.yaml
  rules:
    allow: Component, System, API, Resource, Location, Template
