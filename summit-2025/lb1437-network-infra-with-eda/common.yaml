---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/aap2-workshop-common.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: network

# ENV TYPE
env_type: "aap2-workshop-networking-automation"

ec2_xtra:
  juniper:
    size: c5.xlarge
    ami: "{{ juniper_ami | default(omit) }}"
    os: junos
    username: ec2-user
    filter: "junos-vsrx3-x86-64-22.3R2*byol*"
    volume:
      - device_name: /dev/sda1
        ebs:
          volume_type: io1
          iops: 1000
          volume_size: 40
          delete_on_termination: true

#ansible_bu_setup_workshop_ee_image:
#  - name: quay.io/acme_corp/workshop_ee
#    tag: 95de4ee8d66e8027ebe99bc8b2a29f7befc1f25c

controller_configuration_projects_async_retries: 36
controller_configuration_projects_async_delay: 5

__meta__:
  asset_uuid: 8B52AFDB-B426-4BFB-A6C1-5B5D95DA40C5
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1437: Self-Healing Network Infrastructure With Event-Driven Ansible"
    category: Red_Hat_Summit_2025
    multiuser: true
    keywords:
      - lb1437
      - aap2
      - ansible
      - automation
      - controller
      - eda
      - network
      - cisco
      - arista
      - juniper
      - networking
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    parameters:
      - name: network_type
        description: Select Network Type (Select none for Multivendor)
        formLabel: Network Type (Select none for Multivendor)
        required: false
        openAPIV3Schema:
          type: string
          default: cisco
          enum:
            - cisco
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 110
    reportingLabels:
      primaryBU: Automation
