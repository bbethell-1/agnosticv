# --- Catalog: Red Hat Summit 2025
# --- Catalog Item: Lab 2739: Hands-on Disaster Recovery of
#                             OpenShift containers and VMs with
#                             Trident Protect
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/runtime-unlimited.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-us.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: rosa-consolidated

# Temporary create an open environment so that NetApp can examine what they need
agnosticd_open_environment: true
sandbox_user_info_messages_enable: false
sandbox_enable_ui: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: false

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL95GOLD-latest

# ------------------------------------------------------
# Bastion user
# ------------------------------------------------------
bastion_user_name: rosa
bastion_user_enable_sudo: true
bastion_user_password: ""
bastion_user_password_length: 16

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ----------------------------------------------------------------------------
    Welcome to the Red Hat Summit 2025 lab 2739:
        Hands-on Disaster Recovery of
        OpenShift containers and VMs with Trident Protect
  ----------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# -------------------------------------------------------------------
# ROSA specific
# -------------------------------------------------------------------
rosa_cluster_name: "prod-{{ guid }}"

rosa_deploy_hcp: false

rosa_compute_replicas: 2

rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

rosa_version: default
rosa_version_base: "openshift-v4.16"

rosa_machine_cidr: "10.0.0.0/16"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_kubevirt
- ocp4_workload_lb2739
- ocp4_workload_showroom

# -------------------------------------------------------------------
# ocp4_workload_rosa_fsx
# -------------------------------------------------------------------
ocp4_workload_rosa_fsx_deploy_fsx: true

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false

ocp4_workload_kubevirt_enabled_nested_kvm: true
ocp4_workload_kubevirt_deploy_hyperconverged: true

# -------------------------------------------------------------------
# ocp4_workload_lb2739
# -------------------------------------------------------------------
ocp4_workload_lb2739_first_rosa_cidr: "{{ rosa_machine_cidr }}"
ocp4_workload_lb2739_second_rosa_name: "dr-{{ guid }}"
ocp4_workload_lb2739_second_rosa_cidr: "10.10.0.0/16"
ocp4_workload_lb2739_second_rosa_compute_replicas: 2
ocp4_workload_lb2739_second_rosa_version: "4.16.37"

ocp4_workload_lb2739_fsx_name1: PROD-FSXONTAP
ocp4_workload_lb2739_fsx_name2: DR-FSXONTAP

ocp4_workload_lb2739_policy_name1: ProdTridentIAMPolicy
ocp4_workload_lb2739_policy_name2: DRTridentIAMPolicy

# Passwords will be generated.
# If hardcoding: Passwords must be between 8 and 128 characters in length, must contain at least one English letter
#                and one number, and must not contain the word 'admin'.
ocp4_workload_lb2739_fsx_admin_password: ""
ocp4_workload_lb2739_svm_admin_password: ""

# Name of the S3 Bucket to be created
ocp4_workload_lb2739_s3_bucket_name: "bucket-{{ guid }}"

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-summit2025-lb2739-trident
ocp4_workload_showroom_content_git_repo_ref: main

