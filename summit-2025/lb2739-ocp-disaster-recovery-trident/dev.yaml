---
#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

env_type: rosa-consolidated

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

rosa_version: default
rosa_version_base: "openshift-v4.16"

# -------------------------------------------------------------------
# AWS machines
# -------------------------------------------------------------------

bastion_instance_type: "t3a.small"
bastion_instance_image: RHEL95GOLD-latest

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_rosa_fsx
- ocp4_workload_kubevirt

# -------------------------------------------------------------------
# ocp4_workload_rosa_fsx
# -------------------------------------------------------------------
ocp4_workload_rosa_fsx_deploy_fsx: true

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false

ocp4_workload_kubevirt_enabled_nested_kvm: true
ocp4_workload_kubevirt_deploy_hyperconverged: true


# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/showroom-summit2025-lb2739-trident
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
- "{{ bastion_user_name }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
