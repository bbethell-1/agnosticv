  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB1942: InstructLab, Docling, & Elyra - Auto generate knowledge files from multiple data formats - 6ztq9
    category: Red_Hat_Summit_2025
    multiuser: true
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    keywords:
      - summit
      - summit_2025
      - summit2025
      - lb1942
      - lab1942
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 20
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  secrets:
