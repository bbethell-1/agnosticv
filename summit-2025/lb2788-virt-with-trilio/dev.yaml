---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Remove use of catalogsources/snaphots in DEV
# -------------------------------------------------------------------
ocp4_workload_kubevirt_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_external_odf
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_kubevirt
  - ocp4_workload_minio
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_trilio_backup_restore_vms
  - ocp4_workload_showroom

master_instance_count: 3
worker_instance_count: "{{ [(num_users | int / 10) | round(0, 'ceil') | int, 3] | max }}"

ai_control_plane_cores: 16
ai_control_plane_memory: "{{ '64Gi' if master_instance_count | int == 1 else '32Gi' }}"

original_namespace: originalvms

ocp4_workload_trilio_backup_restore_vms_dr_user_namespace: "{{ original_namespace }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
# odf_channel: stable-4.16
ocp4_workload_external_odf_noobaa_custom_resources: true
ocp4_workload_external_odf_noobaa_memory_requests: 8Gi
ocp4_workload_external_odf_noobaa_memory_limits: 8Gi
ocp4_workload_external_odf_noobaa_cpu_requests: 6
ocp4_workload_external_odf_noobaa_cpu_limits: 6

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lb2788-trilio-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: "{{ ocp4_workload_user_base }}"
  common_password: "{{ common_password }}"
  vms:
    namespace: "{{ original_namespace }}"

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: judd-trilio-fix-rbac
    # scm_ref: judd-lb2788-trilio-multiuser
    # git_tag_prefix: virt-trilio
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        virt: "yes"
        purpose: prod
      quota:
        requests.storage: "4000Gi"
        limits.cpu: "512"
        requests.cpu: "512"
        limits.memory: "2000Gi"
        requests.memory: "2000Gi"
