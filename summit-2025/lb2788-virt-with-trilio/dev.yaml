---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Remove use of catalogsources/snaphots in DEV
# -------------------------------------------------------------------
ocp4_workload_kubevirt_use_catalog_snapshot: false

# software_to_deploy: openshift4_hcp_cnv
# hcp_worker_cores: 32
# hcp_worker_memory: "64Gi"


original_namespace: originalvms

ocp4_workload_trilio_backup_restore_vms_dr_user_namespace: "{{ original_namespace }}"

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lb2788-trilio-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: "{{ ocp4_workload_user_base }}"
  common_password: "{{ common_password }}"
  vms:
    namespace: "{{ original_namespace }}"

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        virt: "yes"
        purpose: prod
      quota:
        requests.storage: "4000Gi"
        limits.cpu: "512"
        requests.cpu: "512"
        limits.memory: "2000Gi"
        requests.memory: "2000Gi"
