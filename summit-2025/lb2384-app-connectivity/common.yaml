# -------------------------------------------------------------------
# --- Catalog Item: TAP Workshop
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# --- Student user
# -------------------------------------------------------------------
student_name: lab-user

# ------------------------------------------------------
# Workload: ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_stacked_terminals_enable: true

ocp4_workload_showroom_content_git_repo: https://github.com/app-connectivity-workshop/showroom.git
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Export userinfo variables to showroon
# -------------------------------------------------------------------
export_ocp_cluster_vars_to_showroom:
- bastion_public_hostname
- bastion_ssh_user_name
- bastion_ssh_password
- openshift_cluster_ingress_domain
- openshift_cluster_admin_password
- openshift_cluster_admin_username
- openshift_api_server_url
- openshift_cluster_console_url
- openshift_gitops_password
- openshift_gitops_user
- workshop_main_domain

export_rhel_vars_to_showroom:
- bastion_public_hostname
- bastion_ssh_user_name
- bastion_ssh_password

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: multi
env_type: lb2384-binder

