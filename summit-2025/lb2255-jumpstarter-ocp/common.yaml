# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true
ocp4_workload_machinesets_machineset_groups:
  - name: metal-arm
    role: metal-arm
    instance_type: "{{ metal_instance_type }}"
    autoscale: false
    total_replicas: "{{ metal_instance_count }}"
    total_replicas_min: 1
    total_replicas_max: 12
    machineConfigPool:
      setup: true
      maxPodsPerNode: 250
    taints:
      - key: metal
        value: "true"
        effect: NoSchedule
    aws_instance_ami_architecture: aarch64
  - name: worker-arm
    role: worker-arm
    instance_type: r8g.4xlarge
    autoscale: false
    total_replicas: "{{ arm_instance_count }}"
    total_replicas_min: 1
    total_replicas_max: 5
    machineConfigPool:
      setup: true
      maxPodsPerNode: 250
    taints:
      - key: architecture
        value: "arm"
        effect: NoSchedule
    aws_instance_ami_architecture: aarch64

