# -------------------------------------------------------------------
# --- Catalog Item: DevSecOps Validated Framework - Parallel
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL92GOLD-latest
rootfs_size_bastion: 50
# rootfs_size_rhel: 100
# # rhel_instance_image: RHEL94GOLD-latest
# # rhel_instance_type: "t4g.medium"
# # infra_images_arch: arm64

key_name: opentlc_admin_backdoor
region: "{{ aws_region }}"

# ------------------
# AWS INSTANCES
# ------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion }}"
    security_groups:
      - BastionSG
      - RhelSG
      - WebSG

# ------------------
# AWS SECURITY GROUPS
# ------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ContHTTPPorts
        description: "HTTP Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: RhelSG
    rules:
      - name: FromRhelSGtcp
        description: "Allow everything from HostSG rhels"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: RhelSG
        rule_type: Ingress

      - name: FromRhelSGudp
        description: "Allow everything from HostSG rhels"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: RhelSG
        rule_type: Ingress

      - name: FromBastionTCP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: BastionSG
        rule_type: Ingress

      - name: FromBastionUDP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: BastionSG
        rule_type: Ingress

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
