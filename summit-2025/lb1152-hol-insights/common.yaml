---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# --- Catalog: Red Hat Summit 2025
# --- Catalog Item: "LB1152: Red Hat Insights advisor in Red Hat Satellite: Bringing valuable insight on-premise"
# -------------------------------------------------------------------

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL95GOLD-latest
# bastion_instance_image: RHEL95GOLD-latest
satellite_instance_image: lb1152-satellite-6.17-20250407
node_instance_image: RHEL91GOLD-latest

default_instance_type: "t3a.large"
# bastion_instance_type: "t3a.large"
satellite_instance_type: r7a.2xlarge
# node_instance_type: "t3a.large"

default_rootfs_size: 50
# bastion_rootfs_size: 50
satellite_rootfs_size: 250
# node_rootfs_size: 50

# -------------------------------------------------------------------
# Security Groups
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: SatSG
    rules:
      - name: SatCustomPort
        description: "Sat custom port"
        from_port: 10090
        to_port: 10090
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Instances
# -------------------------------------------------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    dns_loadbalancer: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - WebSG
      - NodeSG

  - name: satellite
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    #image: "{{ satellite_instance_image | default(default_instance_image) }}"
    image:
      name: "{{ satellite_instance_image }}"
    flavor:
      ec2: "{{ satellite_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "satellites"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ satellite_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - SatSG
      - DefaultSG
      - WebSG
      - NodeSG

  - name: "node-{{ guid }}-"
    count: 2
    public_dns: false
    image: "{{ node_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ node_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/lb1152.hol.git
      type: git
      version: main

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - set-repositories
    - common
    - bastion-lite
  nodes:
    - set-repositories
    - common

software_workloads:
  all:
    - control-user
  satellites:
    - lb1152.hol.satellite_reconfigure
  nodes:
    - lb1152.hol.node_config

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible

# -------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------
# Role: lb1152.hol.satellite_reconfigure
# -------------------------------------------------
lb1152_hol_satellite_reconfigure_external_fqdn: "{{ groups['satellites'][0].split('.')[0] }}.{{ subdomain_base }}"
lb1152_hol_satellite_reconfigure_internal_fqdn: satellite.example.com
lb1152_hol_satellite_reconfigure_user_name: admin
lb1152_hol_satellite_reconfigure_user_password: "{{ common_password }}"
lb1152_hol_satellite_reconfigure_iop_image_path: "/home/ec2-user/iop-advisor-engine-rhel9-2.tar"
lb1152_hol_satellite_reconfigure_iop_image_stage_url: "registry.stage.redhat.io/satellite/iop-advisor-engine-rhel9:latest"
lb1152_hol_satellite_reconfigure_iop_image_id_rm: be0fd81aceb4
lb1152_hol_satellite_reconfigure_iop_image_url: "quay.io/rhpds/images-lab/iop-advisor-engine-rhel9:1.0.0"

# -------------------------------------------------
# Role: lb1152.hol.node_config
# -------------------------------------------------
lb1152_hol_node_config_sat_hostname: "satellite.example.com"
lb1152_hol_node_config_sat_org: Default_Organization
lb1152_hol_node_config_sat_activation_key: AK_RHEL9
lb1152_hol_node_config_insights_org: 13959588
lb1152_hol_node_config_insights_activation_key: AK_RHEL9

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/showroom-lb1152-insights-on-prem.git"
showroom_user: showroom
showroom_ui: default
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_tab_services:
  - tty1
  # - web1

showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_username: "{{ student_name }}"

# showroom_tab_web1_url: "https://{{ groups['satellites'][0].split('.')[0] }}.{{ subdomain_base }}"
# showroom_tab_web1_name: Satellite Server

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  workshop_satellite_url: "https://{{ lb1152_hol_satellite_reconfigure_external_fqdn }}"
  workshop_satellite_user_name: "{{ lb1152_hol_satellite_reconfigure_user_name }}"
  workshop_satellite_user_password: "{{ lb1152_hol_satellite_reconfigure_user_password }}"


aws_region: us-east-2
