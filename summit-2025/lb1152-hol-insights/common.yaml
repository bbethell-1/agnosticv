# -------------------------------------------------------------------
# --- Catalog: Red Hat Summit 2025
# --- Catalog Item: "LB1152: Red Hat Insights On-Premise - Hands on Lab for Insights' new Footprint"
# -------------------------------------------------------------------

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL94GOLD-latest
# bastion_instance_image: RHEL94GOLD-latest
satellite_instance_image: lb1152-satellite-6.17-20250327
node1_instance_image: RHEL91GOLD-latest
node2_instance_image: RHEL92GOLD-latest

default_instance_type: "t3a.large"
satellite_instance_type: r7a.2xlarge
# node_instance_type: "t3a.large"
# rhel9_instance_type: "t3a.large"

default_rootfs_size: 50
satellite_rootfs_size: 250

# -------------------------------------------------------------------
# Security Groups
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: SatSG
    rules:
      - name: SatCustomPort
        description: "Sat custom port"
        from_port: 10090
        to_port: 10090
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Instances
# -------------------------------------------------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    dns_loadbalancer: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - WebSG
      - NodeSG

  - name: satellite
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image:
      name: "{{ satellite_instance_image }}"
    flavor:
      ec2: "{{ satellite_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "satellites"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ satellite_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - SatSG
      - DefaultSG
      - WebSG
      - NodeSG

  - name: node1
    count: 1
    unique: true
    public_dns: false
    image: "{{ node1_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ node1_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ node1_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - DefaultSG
      - NodeSG

  - name: node2
    count: 1
    unique: true
    public_dns: false
    image: "{{ node2_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ node2_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ node2_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: satellite_reconfigure_ar
      src: https://github.com/opentraining-labs-customizations/satellite-reconfigure-ar.git
      version: main
      # version: 1.0.1

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - set-repositories
    - common
    - bastion-lite
    - control-user
  satellites:
    - satellite_reconfigure_ar

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible

# -------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------
# Role: satellite_reconfigure_ar
# -------------------------------------------------
pert_satellite_user_password: "{{ common_password }}"
pert_satellite_internal_fqdn: satellite.q7n6f.sandbox11.opentlc.com
dns_information: ""

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/showroom-lb1152-insights-on-prem.git"
showroom_user: showroom
showroom_ui: default
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_tab_services:
  # - web1
  - tty1

showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_username: "{{ student_name }}"

# showroom_tab_web1_url: "https://{{ showroom_host }}:8443/"
# showroom_tab_web1_name: Codeserver

