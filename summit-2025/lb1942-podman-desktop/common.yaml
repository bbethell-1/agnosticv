---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/hugging-face-ro-token.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: ansible-bu-workshop
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

software_workloads:
  bastions:
    - lb1942.instruct_docling_lab.bastion_role
    - novnc
    - rhel-graphical
    - podman_desktop
    - agnosticd.ai.setup_nvidia_cuda
    - agnosticd.ai.setup_instructlab

# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------

novnc_proxy_port: 443

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------

install_rhel_graphical: true

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------

setup_nvidia_cuda_nvidia_rhel_dnf_packages:
  - "@nvidia-driver:latest-dkms"
  - cuda-toolkit-12-4
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - cuda-cccl-12-4
  - libnccl-2.22.3-1+cuda12.4.x86_64

use_content_view: true
update_packages: true      # Do you want to run a full yum update

common_packages_el9:
  - at
  - ansible
  - bash-completion
  - bind-utils
  - git
  - podman
  - python3.11
  - python3.11-devel
  - python3.11-pip
  - tree
  - vim-enhanced
  - wget
  - zip
  - firefox
  - ansible

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/lb1942.instruct_docling_lab.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_instructlab
# -------------------------------------------------------------------

setup_instructlab_llama_cpp_python_version: "0.2.79"
setup_instructlab_git_ref: "v0.19.3"
setup_instructlab_user: "{{ student_name }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: developer
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Cloud Tags
# -------------------------------------------------------------------

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 100
rootfs_size_bastion: 1024
bastion_rootfs_size: 200

bastion_instance_image: RHEL94GOLD-latest

instances:
  - name: desktop
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(100)  }}"
    security_groups:
      - BastionSG
      - InstructLabSG
      - NOvncSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:
  - name: NOvncSG
    rules:
      - name: ClientNOVNCPort
        description: "Client NOVNC Public"
        from_port: 6080
        to_port: 6080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotChallangePort
        description: "Lets encrypt talks to 80"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotTLSPort
        description: "TLS"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: InstructLabSG
    rules:

      - name: InstructLabAPI
        description: "InstructLab API Port"
        from_port: 8000
        to_port: 8010 # lets open up a few ports for now
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: D65AB81E-BED5-4589-9ADA-F40458E46621
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  owners:
    maintainer:
      - email: jhurlock@redhat.com
        name: John Hurlocker
      - email: noconnor@redhat.com
        name: Noel O'Connor
    sme:
      - email: jhurlock@redhat.com
        name: John Hurlocker
      - email: noconnor@redhat.com
        name: Noel O'Connor
      - email: treddy@redhat.com
        name: Tyrell Reddy
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB1942: Podman Desktop AI
    category: Red_Hat_Summit_2025
    keywords:
      - instructlab
      - parasol
      - rhel
      - ai
      - nvidia
      - cuda
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
            - us-west-2
            - us-east-1
            - eu-central-1
            - ap-northeast-1
      - name: bastion_instance_type
        description: GPU Selection by Node Type
        formLabel: GPU Selection by Node Type
        openAPIV3Schema:
          type: string
          default: g6.4xlarge
          enum:
            - g6.xlarge
            - g6.4xlarge
            - g6.12xlarge
            - g5.xlarge
            - g5.4xlarge
            - g4dn.xlarge
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
