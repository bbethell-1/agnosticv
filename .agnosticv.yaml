---
# For any catalog item, consider those in same directory as related files:
related_files:
  - service-ready-message-template.html.j2
  - service-ready-message-template.html
  - start-complete-message-template.html.j2
  - stop-complete-message-template.html.j2
  - service-deleted-message-template.html.j2
  - info-message-template.adoc

# For any catalog item, consider those in same directory as related files:
related_files_v2:
  - file: service-ready-message-template.html.j2
    load_into: /__meta__/catalog/message_templates/service_ready
    content_key: template
    set:
      format: jinja2
      output_format: html

  - file: start-complete-message-template.html.j2
    load_into: /__meta__/catalog/message_templates/start_complete
    content_key: template
    set:
      format: jinja2
      output_format: html

  - file: stop-complete-message-template.html.j2
    load_into: /__meta__/catalog/message_templates/stop_complete
    content_key: template
    set:
      format: jinja2
      output_format: html

  - file: service-deleted-message-template.html.j2
    load_into: /__meta__/catalog/message_templates/service_deleted
    content_key: template
    set:
      format: jinja2
      output_format: html

  - file: info-message-template.adoc
    load_into: /__meta__/catalog/message_templates/info
    content_key: template
    set:
      format: asciidoc
      output_format: html
