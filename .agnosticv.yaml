---
# For any catalog item, consider those in same directory as related files:
related_files:
  - description.adoc
  - description.html
  - info-message-template.adoc
  - service-deleted-message-template.html.j2
  - service-ready-message-template.html
  - service-ready-message-template.html.j2
  - start-complete-message-template.html.j2
  - stop-complete-message-template.html.j2
  - user-message-template.adoc

# For any catalog item, consider those in same directory as related files:
related_files_v2:
  - file: description.adoc
    load_into: /__meta__/catalog/description
    content_key: content
    set:
      format: asciidoc

  - file: description.html
    load_into: /__meta__/catalog/description
    content_key: content
    set:
      format: html

  - file: info-message-template.adoc
    load_into: /__meta__/catalog/messageTemplates/info
    content_key: template
    set:
      templateFormat: asciidoc
      outputFormat: html

  - file: retirement-scheduled-message-template.html.j2
    load_into: /__meta__/catalog/messageTemplates/retirementScheduled
    content_key: template
    set:
      templateFormat: jinja2
      outputFormat: html

  - file: service-deleted-message-template.html.j2
    load_into: /__meta__/catalog/messageTemplates/serviceDeleted
    content_key: template
    set:
      templateFormat: jinja2
      outputFormat: html

  - file: service-ready-message-template.html.j2
    load_into: /__meta__/catalog/messageTemplates/serviceReady
    content_key: template
    set:
      templateFormat: jinja2
      outputFormat: html

  - file: start-complete-message-template.html.j2
    load_into: /__meta__/catalog/messageTemplates/startComplete
    content_key: template
    set:
      templateFormat: jinja2
      outputFormat: html

  - file: stop-complete-message-template.html.j2
    load_into: /__meta__/catalog/messageTemplates/stopComplete
    content_key: template
    set:
      templateFormat: jinja2
      outputFormat: html

  - file: user-message-template.adoc
    load_into: /__meta__/catalog/messageTemplates/user
    content_key: template
    set:
      templateFormat: asciidoc
      outputFormat: html
