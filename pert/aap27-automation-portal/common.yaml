---
# -------------------------------------------------------------------
# --- Catalog Item: What's New in AAP 2.7: Automation Portal, MCP & EE Builder
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/litemaas-master_api.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main

cloud_provider: none
config: openshift-workloads
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"
num_users: 1

# ===================================================================
# End Mandatory Variables
# ===================================================================

# -------------------------------------------------------------------
# OpenShift SNO cluster settings
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: false
worker_instance_count: 0

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2025_12_15

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: cnv_instances
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "1.3.2"
    - name: https://github.com/jeffcpullen/agnosticp
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
  - agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - jeffcpullen.agnosticp.agp_devspaces
  - jeffcpullen.agnosticp.agp_devspaces_samples
  - agnosticd.cloud_vm_workloads.agnosticv_userdata_import

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_num_users: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# Pre-installs the AAP operator and Controller + Hub instances
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_admin_password }}"
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.7
ocp4_workload_ansible_automation_platform_use_catalog_snapshot: false
ocp4_workload_ansible_automation_platform_deploy_wait_timeout: 2600
ocp4_workload_ansible_automation_platform_automatic_install_plan_approval: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
# Enable Hub (PAH), disable EDA and Lightspeed
ocp4_workload_ansible_automation_platform_disable_hub: false
ocp4_workload_ansible_automation_platform_disable_eda: true
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
# Manifest inject: controller API may not be listening immediately after CR reports Successful
# Default 3x5s=15s is too short — bump to 60x10s=10min
ocp4_workload_ansible_automation_platform_manifest_inject_retries: 60
ocp4_workload_ansible_automation_platform_manifest_inject_delay: 10

# -------------------------------------------------------------------
# Workload: rhpds.litellm_virtual_keys
# LiteLLM Virtual Keys for AI/ChatGPT Integration
# -------------------------------------------------------------------
# Convert model selection to actual model list
ocp4_workload_litellm_virtual_keys_models:
  - qwen3-235b
  - qwen3-14b

# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('7d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  bastion_public_hostname: "{{ bastion_public_hostname }}"
  bastion_ssh_user_name: "{{ bastion_ssh_user_name }}"
  bastion_ssh_password: "{{ bastion_ssh_password }}"
  bastion_ssh_port: "{{ bastion_ssh_port | default(22) }}"
  bastion_ssh_command: "ssh {{ bastion_ssh_user_name }}@{{ bastion_public_hostname }} -p {{ bastion_ssh_port | default(22) }}"
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_api_server_url: "{{ openshift_api_url }}"
  openshift_cluster_console_url: "{{ openshift_console_url | default('') }}"
  openshift_cluster_admin_password: "{{ common_admin_password }}"
  controller_url: "{{ ocp4_workload_ansible_automation_platform_url | default('') }}"
  controller_username: "admin"
  controller_password: "{{ common_admin_password }}"

# -------------------------------------------------------------------
# Workload: jeffcpullen.agnosticp.agp_devspaces
# -------------------------------------------------------------------
agp_devspaces_namespace: 'devspaces'
# Backwards compatibility with older versions of the devspaces operator (temporary 3.30.1 is released)
agp_devspaces_operator_catalog_name: 'olm-snapshot-redhat-catalog-20260831'
agp_devspaces_operator_catalog_image: 'quay.io/rhpds/olm_snapshot_redhat_catalog'
agp_devspaces_operator_catalog_image_tag: 'v4.21_2026_08_31'
agp_devspaces_operator_devspaces_starting_csv: 'devspacesoperator.v3.29.1'
agp_devspaces_operator_devworkspace_starting_csv: 'devworkspace-operator.v0.43.0'

## CheCluster Spec
agp_devspaces_che_cluster_spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    dashboard:
      logLevel: ERROR
    devWorkspace: {}
    devfileRegistry:
      disableInternalRegistry: true
    imagePuller:
      enable: false
      spec: {}
    metrics:
      enable: true
    pluginRegistry:
      openVSXURL: "https://open-vsx.org"
  containerRegistry: {}
  devEnvironments:
    startTimeoutSeconds: 1000
    security: {}
    secondsOfRunBeforeIdling: -1
    maxNumberOfWorkspacesPerUser: -1
    containerBuildConfiguration:
      openShiftSecurityContextConstraint: container-build
    containerRunConfiguration:
      containerSecurityContext:
        procMount: Unmasked
        capabilities:
          add:
            - SETGID
            - SETUID
        allowPrivilegeEscalation: true
      openShiftSecurityContextConstraint: container-run
    disableContainerBuildCapabilities: false
    disableContainerRunCapabilities: false
    ignoredUnrecoverableEvents:
      - FailedScheduling
    maxNumberOfRunningWorkspacesPerUser: 5
    defaultNamespace:
      autoProvision: true
      template: <username>-devspaces
    secondsOfInactivityBeforeIdling: 3600
    storage:
      pvcStrategy: per-workspace
  gitServices: {}
  networking:
    auth:
      gateway:
        kubeRbacProxy:
          logLevel: 0
        oAuthProxy:
          cookieExpireSeconds: 86400
        traefik:
          logLevel: INFO

# Custom nested podman SCC configuration
agp_devspaces_custom_nested_podman_scc:
  apiVersion: security.openshift.io/v1
  kind: SecurityContextConstraints
  metadata:
    name: nested-podman-scc
  priority: null
  allowPrivilegeEscalation: true
  allowedCapabilities:
    - SETUID
    - SETGID
  fsGroup:
    type: MustRunAs
    ranges:
      - min: 1000
        max: 65534
  runAsUser:
    type: MustRunAs
    uid: 1000
  seLinuxContext:
    type: MustRunAs
    seLinuxOptions:
      type: container_engine_t
  supplementalGroups:
    type: MustRunAs
    ranges:
      - min: 1000
        max: 65534
  userNamespaceLevel: RequirePodLevel
# Configure global workspace settings
agp_devspaces_default_workspace_config: false

# -------------------------------------------------------------------
# Workload: rhpds.manage_host.asset_injector
# Fix DNF database permissions for package installation
# -------------------------------------------------------------------
asset_injector_modules:
  - description: Remove DNF lock file if exists
    module: file
    state: absent
    path: /var/lib/dnf/lock

  - description: Fix DNF history database permissions
    module: file
    path: /var/lib/dnf
    state: directory
    recurse: yes
    mode: "0755"

  - description: Rebuild DNF cache to fix SQLite database
    module: shell
    cmd: dnf makecache --refresh
    ignore_errors: yes

# -------------------------------------------------------------------
# Workload: rhpds.manage_host.vscode_server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: false
vscode_server_bind_addr_ip: 0.0.0.0
vscode_server_bind_addr_port: 8080

vscode_server_version: "4.112.0"
vscode_server_rpm_url: >-
  https://github.com/coder/code-server/releases/download/v{{ vscode_server_version }}/code-server-{{ vscode_server_version }}-amd64.rpm

vscode_server_ansible_become: true
vscode_user_workspace_path: "/home/{{ ocp4_workload_authentication_htpasswd_admin_user }}"
vscode_auth_type: password
vscode_user_name: "{{ ocp4_workload_authentication_htpasswd_admin_user }}"
vscode_user_password: "{{ common_admin_password }}"
vscode_server_hostname: "vscode-{{ subdomain }}"
vscode_ansible_python_interpreter: /home/{{ ocp4_workload_authentication_htpasswd_admin_user }}/.venv/bin/python3

vscode_server_default_extensions: []
vscode_server_extension_urls: []

vscode_server_additional_settings: |
  "ansible.python.interpreterPath": "/home/{{ ocp4_workload_authentication_htpasswd_admin_user }}/.venv/bin/python3",
  "ansible.ansible.path": "/home/{{ ocp4_workload_authentication_htpasswd_admin_user }}/.venv/bin/ansible",
  "ansible.validation.enabled": true,
  "ansible.validation.lint.enabled": true,
  "ansible.lightspeed.enabled": true,
  "ansible.lightspeed.suggestions.enabled": true,
  "security.workspace.trust.enabled": false,
  "ansible.lightspeed.URL": "",
  "terminal.integrated.defaultProfile.linux": "bash",
  "editor.tabSize": 2,
  "editor.insertSpaces": true,
  "editor.detectIndentation": false,
  "[yaml]": {
    "editor.tabSize": 2,
    "editor.insertSpaces": true,
    "editor.detectIndentation": false
  },
  "claudeCode.disableLoginPrompt": true,
  "extensions.ignoreRecommendations": true,
  "python-envs.terminal.autoActivationType": "off",
  "files.exclude": {
    "**/.git": true,
    "**/.kube": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true,
    "**/.claude": true,
    "**/.mcp-auth": true,
    "**/.npm": true,
    "**/.nvm": true,
    "**/.venv": true
  }

# -------------------------------------------------------------------
# Workload: jeffcpullen.agnosticp.agp_devspaces_samples
