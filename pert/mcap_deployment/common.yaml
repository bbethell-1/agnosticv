---
#include /includes/catalog-icon-equinix.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service-equinix.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/equinix-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel-9-lab.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: just-a-bunch-of-nodes
# -------------------------------------------------------------------
##env_type: mcap_deployment
env_type: just-a-bunch-of-nodes
cloud_provider: equinix_metal

# -------------------------------------------------------------------
# Config: variables
# -------------------------------------------------------------------
hypervisor_count: 1
hypervisor_type: n3.xlarge.x86
hypervisor_os: rhel_9
clone_git_repo_ar_repo_url: https://github.com/opentraining-labs-customizations/mcap-deployment-files.git
clone_git_repo_ar_dest_dir: /root/mcap-deployment-files/

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
# Don't configure repos as this is a RHEL8 Linux
repo_method: satellite
install_common: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: get_mcap_deployment_files
      src: https://github.com/opentraining-labs-customizations/clone-git-repo-ar.git

common_packages_el9:
  - python
  - unzip
  - bash-completion
  - tmux
  - wget
  - git
  - vim-enhanced
  - at
  - ansible-core
  - gcc
  - lvm2
  - podman
  - libvirt
  - qemu-kvm
  - virt-manager
  - virt-install
  - libguestfs-tools
  - libguestfs-tools-c
  - cockpit
  - cockpit-machines

# Do install env key
install_student_user: true
student_name: lab-user

# Open Environment
agnosticd_open_environment: True
# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------
infra_workloads:
  - get_mcap_deployment_files

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6c6684e7-3ce1-4451-912d-05b73206a52d
  owners:
    maintainer:
      - name: Ashish Shah
        email: ashah@redhat.com

  anarchy:
    namespace: babylon-anarchy-equinix-metal
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP MCAP Deployment using Equinix baremetal
    category: Open_Environments
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - virtualization
      - baremetal
      - aio
      - equinix
      - cnv
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      Provider: RHDP
    parameters:
      - name: hypervisor_os
        description: Version of Hyperviser OS to Install
        formLabel: Hyperviser OS
        required: false
        openAPIV3Schema:
          type: string
          default: 'rhel_9'
        annotation: demo.redhat.com/hypervisor-os
        variable: hypervisor_os

  secrets:
    - namespace: gpte
      name: equinix-metal-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:hotfix-eqx-2024-04-02.2
      pull: missing
