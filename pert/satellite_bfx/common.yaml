# -------------------------------------------------------------------
__meta__:
  asset_uuid: 1362470b-7160-4635-98d2-2c7ad8776465
  owners:
    maintainer:
      - name: Ashish Shah
        email: ashah@redhat.com

  anarchy:
    namespace: babylon-anarchy-5
  catalog:
    reportingLabels:
      primaryBU: RHEL
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement Red Hat Satellite Troubleshooting Break-fix lab"
    category: Labs
    keywords:
      - satellite
      - troubleshooting
      - opentraining
    labels:
      Provider: Product_Technical_Learning
      Platform: RHEL
      TDP1: Server_Cloud_OS
    multiuser: false
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
