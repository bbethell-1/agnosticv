---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-satellite.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# Unset key name
key_name: ""

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
bastion_public_hostname: "bastion.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Role: satellite-reconfigure-ar and capsule-deploy-ar
# -------------------------------------------------------------------
pert_satellite_external_fqdn: "{{ groups['satellites'][0].split('.')[0] }}.{{ subdomain_base }}"
pert_satellite_user_name: admin
pert_satellite_user_password: "{{ common_password }}"
pert_satellite_internal_fqdn: satellite.sxff2.internal
pert_capsule_external_fqdn: "{{ groups['capsules'][0].split('.')[0] }}.{{ subdomain_base }}"
pert_capsule_user_name: admin
pert_capsule_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

  - description: Download satellite manifest
    type: http
    dest: /tmp/satellite-6.15-ptl-manifest.zip
    src: https://d18h2xbjo1t4w8.cloudfront.net/opentraining/satellite-6.15-ptl-manifest.zip
    url_username: "{{ s3_rhpds_private_username }}"
    url_password: "{{ s3_rhpds_private_password }}"
    owner: "{{ ansible_user }}"
    group: users
    mode: u=rw,g=r,o=r

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

rhel9_instance_image: RHEL94GOLD-latest
rhel9_instance_type: "t3a.large"
rootfs_size_rhel9: 200

satellite_instance_name: satellite
satellite_instance_image: pert-satellite-6.15-v2
satellite_instance_type: "r7a.2xlarge"
rootfs_size_satellite: 50

capsule_instance_name: capsule
capsule_instance_image: RHEL8GOLD-latest
capsule_instance_type: "r7a.2xlarge"
rootfs_size_capsule: 50

node_instance_type: "t3a.large"

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ rhel9_instance_image }}"
    flavor:
      ec2: "{{ rhel9_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel9 }}"
    volumes:
      - device_name: "/dev/xvdb"
        size: "20"
        type: gp3
    security_groups:
      - BastionSG

  - name: "{{ satellite_instance_name }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image:
      name: "{{ satellite_instance_image }}"
    flavor:
      ec2: "{{ satellite_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "satellites"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_satellite }}"
    security_groups:
      - WebSG
      - DefaultSG
      - NodeSG
      - SatSG

  - name: "{{ capsule_instance_name }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ capsule_instance_image }}"
    flavor:
      ec2: "{{ capsule_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "capsules"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_capsule }}"
    security_groups:
      - WebSG
      - DefaultSG
      - NodeSG
      - SatSG

  - name: "rhel9"
    count: 1
    public_dns: false
    image: RHEL94GOLD-latest
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - NodeSG

  - name: "rhel8"
    count: 1
    public_dns: false
    image: RHEL8GOLD-latest
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebCockpitPorts
        description: "Cockpit HTTP Public"
        from_port: 9090
        to_port: 9090
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: SatSG
    rules:
      - name: FromSatSCAP
        description: "Open OpenSCAP"
        from_port: 9090
        to_port: 9090
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: FromSatKA
        description: "Open Katello Agent"
        from_port: 5647
        to_port: 5647
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: FromSatMQTT
        description: "Open remote-execution MQTT"
        from_port: 883
        to_port: 883
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------

software_workloads:
  satellites:
    - asset_injector
    - reconfigure_satellite
  capsules:
    - deploy_capsule

post_software_workloads:
  bastions:
    - deploy_grading_script

satellite_bfx_configure: true

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
#repo_method: satellite
#use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_name: lab-user
student_password: "{{ common_password }}"

bastion_install_basic_packages: true
agd_bastion_packages:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc
  - ansible-core

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: reconfigure_satellite
      src: https://github.com/opentraining-labs-customizations/satellite-reconfigure-ar.git

    - name: deploy_capsule
      src: https://github.com/opentraining-labs-customizations/capsule-deploy-ar.git

    - name: deploy_grading_script
      src: https://github.com/opentraining-labs-customizations/satellite-bfx-ar.git
      version: v1.0.2

# -------------------------------------------------------------------
