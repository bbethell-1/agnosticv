---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: test

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - golang

# -------------------------------------------------------------------
# Customizations to packages and virtualenvs to enable kuberentes openshift
# -------------------------------------------------------------------
host_virtualenv_package_prereqs:
  - gcc
  - python3
  - python3-devel
  - python3-libselinux
  - python3-pip

host_virtualenv_requirements_override:
  - kubernetes==34.1.0
  - jmespath==1.0.1
  - openshift==0.13.2

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.4.0
    - name: amazon.aws
      version: 2.3.0
    - name: community.general
      version: 6.4.0
    - name: ansible.posix
      version: 1.5.1
    - name: ovirt.ovirt
      version: 3.1.1
    - name: awx.awx
      version: 21.1.0
    - name: containers.podman
      version: 1.16.3
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: main
  roles:
    - name: rhads-2025-customisation
      src: https://github.com/ysoni-redhat/rhads-2025-customisation.git

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_web_terminal
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
  - ocp4_workload_data_grid
  - ocp4_workload_quay_operator
  - ocp4_workload_kubevirt
  - ocp4_workload_kubernetes_image_puller
  - ocp4_workload_jenkins
  - ocp4_workload_openshift_gitops
  - ocp4_workload_openshift_devspaces
  - ocp4_workload_gitops_gitlab
  - ocp4_workload_gitops_vault
  - ocp4_workload_external_secrets
  - ocp4_workload_advanced_developer_suite
  - ocp4_workload_showroom

software_workloads_for_bastion:
  - rhads-2025-customisation

# -------------------------------------------------------------------
# Passthrough variables
# -------------------------------------------------------------------
ocp4_workload_showroom_passthrough_user_data: true
agnosticd_passthrough_user_data:
  openshift_cluster_ingress_domain: "{{ openshift_cluster_ingress_domain }}"
  openshift_console_url: "{{ openshift_console_url }}"
  openshift_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/YogiSoni-lazy/ShowRoomTest.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

__meta__:
  deployer:
    scm_ref: rhads-upgrade-1.9
