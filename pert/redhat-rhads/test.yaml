---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: test

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.4.0
    - name: amazon.aws
      version: 2.3.0
    - name: community.general
      version: 6.4.0
    - name: ansible.posix
      version: 1.5.1
    - name: ovirt.ovirt
      version: 3.1.1
    - name: awx.awx
      version: 21.1.0
    - name: containers.podman
      version: 1.16.3
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: main
  roles:
    - name: rhads-2025-customisation3
      src: https://github.com/ysoni-redhat/rhads-2025-customisation3.git

infra_workloads:
  - ocp4_workload_web_terminal
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
  - ocp4_workload_data_grid
  - ocp4_workload_quay_operator
  - ocp4_workload_kubevirt
  - ocp4_workload_kubernetes_image_puller
  - ocp4_workload_jenkins
  - ocp4_workload_openshift_gitops
  - ocp4_workload_openshift_devspaces
  - ocp4_workload_gitops_gitlab
  - ocp4_workload_gitops_vault
  - ocp4_workload_external_secrets
  - ocp4_workload_advanced_developer_suite
  - ocp4_workload_showroom

software_workloads_for_bastion:
  - rhads-2025-customisation3

# ------------------------------------------------
# ocp4_workload_advanced_developer_suite
# ------------------------------------------------
ocp4_workload_advanced_developer_suite_tssc_cli_repo: https://github.com/redhat-appstudio/tssc-cli
ocp4_workload_advanced_developer_suite_tssc_cli_revision: release-1.7

ocp4_workload_advanced_developer_suite_tssc_cli_gitlab_group: rhdh
ocp4_workload_advanced_developer_suite_gitlab_namespace: gitlab

ocp4_workload_advanced_developer_suite_jenkins_namespace: jenkins
ocp4_workload_advanced_developer_suite_jenkins_admin_user: admin
ocp4_workload_advanced_developer_suite_jenkins_admin_password: "{{ common_password }}"

ocp4_workload_advanced_developer_suite_pipelines_namespace: openshift-pipelines

ocp4_workload_advanced_developer_suite_user_base_name: user
ocp4_workload_advanced_developer_suite_user_password: "{{ common_password }}"
ocp4_workload_advanced_developer_suite_user_count: "{{ num_users }}"
ocp4_workload_advanced_developer_suite_admin_user: admin
ocp4_workload_advanced_developer_suite_admin_password: "{{ common_admin_password }}"
ocp4_workload_advanced_developer_suite_remove_kubeadmin: true

ocp4_workload_advanced_developer_suite_openshift_keycloak_client_id: idp-4-ocp
ocp4_workload_advanced_developer_suite_openshift_keycloak_client_secret: "{{ common_password }}"

ocp4_workload_advanced_developer_suite_dh_keycloak_client_id: rhdh
ocp4_workload_advanced_developer_suite_dh_keycloak_client_secret: "{{ common_password }}"
ocp4_workload_advanced_developer_suite_dh_dynamic_plugins_enable:
  - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-ocm
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-ocm-backend-dynamic
    disabled: false

ocp4_workload_advanced_developer_suite_dh_catalog_locations:
  repository: tssc-developer-hub-configuration
  branch: main
  group: rhdh
  file: all-locations.yaml

ocp4_workload_advanced_developer_suite_devspaces_namespace: openshift-devspaces

ocp4_workload_advanced_developer_suite_quay_namespace: quay-enterprise
ocp4_workload_advanced_developer_suite_quay_admin_user: quayadmin
ocp4_workload_advanced_developer_suite_quay_admin_password: "{{ common_password }}"

ocp4_workload_advanced_developer_suite_nginx_namespace: nginx

ocp4_workload_advanced_developer_suite_tssc_gitops_namespace: tssc-gitops

ocp4_workload_advanced_developer_suite_tssc_ci_namespace: tssc-app-ci

ocp4_workload_advanced_developer_suite_keycloak_namespace: tssc-keycloak

ocp4_workload_advanced_developer_suite_dh_namespace: tssc-dh

ocp4_workload_advanced_developer_suite_tssc_tpa_namespace: tssc-tpa

ocp4_workload_advanced_developer_suite_acs_namespace: tssc-acs
ocp4_workload_advanced_developer_suite_acs_admin_user: admin

ocp4_workload_advanced_developer_suite_disable_odf: true

__meta__:
  deployer:
    scm_ref: rhads-upgrade-1.10
