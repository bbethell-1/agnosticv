---
# -------------------------------------------------------------------
# --- Catalog Item: Product Enablement: Advanced Deployment of AAP 2.7
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main

cloud_provider: none
config: openshift-workloads
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

num_users: 1

# ===================================================================
# End Mandatory Variables
# ===================================================================

# -------------------------------------------------------------------
# Autoscaling cluster - extra worker capacity for 3 VMs + AAP operator
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: false
worker_instance_count: 1
worker_only: true
worker_drain_control_plane: false

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: cnv_instances
    - name: https://github.com/opentraining-labs-customizations/ocp.git
      type: git
      version: main
    - name: https://github.com/opentraining-labs-customizations/pert.git
      type: git
      version: v1.0.2

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
  - agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
  - agnosticd.core_workloads.ocp4_workload_openshift_virtualization
  - agnosticd.core_workloads.ocp4_workload_metallb
  - ocp.custom.create_namespace
  - ocp.custom.deploy_cnv_vm
  - pert.quickcourse.quickcourse_deployment
  - agnosticd.cloud_vm_workloads.agnosticv_userdata_import

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_num_users: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb (for VM LoadBalancer services)
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_ipaddresspool_name: vm-ip-pool
ocp4_workload_metallb_ipaddresspool_addresses:
  - "10.10.10.200-10.10.10.210"

ocp4_workload_metallb_enable_l2advertisement: true
ocp4_workload_metallb_l2advertisement_ipaddresspool:
  - vm-ip-pool
ocp4_workload_metallb_l2advertisement_interface:
  - br-ex

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# Pre-installs the AAP operator and a minimal Controller instance
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_admin_password }}"
ocp4_workload_ansible_automation_platform_channel: stable-2.7
ocp4_workload_ansible_automation_platform_use_catalog_snapshot: false
ocp4_workload_ansible_automation_platform_automatic_install_plan_approval: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
# Disable components not needed for the deployment lab
ocp4_workload_ansible_automation_platform_disable_hub: true
ocp4_workload_ansible_automation_platform_disable_eda: true
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
# Manifest inject: controller API may not be listening immediately after CR reports Successful
# Default 3x5s=15s is too short — bump to 60x10s=10min
ocp4_workload_ansible_automation_platform_manifest_inject_retries: 60
ocp4_workload_ansible_automation_platform_manifest_inject_delay: 10

# -------------------------------------------------------------------
# Workload: ocp.custom.create_namespace
# Create dedicated namespace for AAP lab VMs with proper RBAC
# -------------------------------------------------------------------
create_namespace_name: "aap"
create_namespace_display_name: "AAP Lab Environment"
create_namespace_description: "Namespace for Advanced AAP 2.7 lab VMs and resources"
create_namespace_grant_admin_to_sa: "{{ sandbox_openshift_namespace }}"
create_namespace_grant_admin_sa_name: "sandbox"

# -------------------------------------------------------------------
# Workload: ocp.custom.deploy_cnv_vm
# Deploy 3 VMs in the aap namespace:
#   aap-lab-execution   — AAP execution node (2 vCPU, 8Gi)
#   aap-lab-container   — AAP containerized install host (4 vCPU, 16Gi)
#   aap-lab-container-exe — AAP container execution node (2 vCPU, 8Gi)
# -------------------------------------------------------------------
deploy_cnv_vm_namespace: "aap"

deploy_cnv_vm_instances:
  - name: "aap-lab-execution"
    datasource_name: "rhel10"
    datasource_namespace: "openshift-virtualization-os-images"
    cores: 2
    memory: "8Gi"
    disk_size: "40Gi"
    cloud_init_user: "lab-user"
    cloud_init_password: "{{ common_admin_password }}"
    ports:
      - port: 22
        protocol: TCP
        targetPort: 22
        name: ssh

  - name: "aap-lab-container"
    datasource_name: "rhel10"
    datasource_namespace: "openshift-virtualization-os-images"
    cores: 4
    memory: "16Gi"
    disk_size: "60Gi"
    cloud_init_user: "lab-user"
    cloud_init_password: "{{ common_admin_password }}"
    ports:
      - port: 443
        protocol: TCP
        targetPort: 443
        name: https
      - port: 80
        protocol: TCP
        targetPort: 80
        name: http
      - port: 22
        protocol: TCP
        targetPort: 22
        name: ssh

  - name: "aap-lab-container-exe"
    datasource_name: "rhel10"
    datasource_namespace: "openshift-virtualization-os-images"
    cores: 2
    memory: "16Gi"
    disk_size: "40Gi"
    cloud_init_user: "lab-user"
    cloud_init_password: "{{ common_admin_password }}"
    ports:
      - port: 22
        protocol: TCP
        targetPort: 22
        name: ssh

_cloud_config: |
  #cloud-config
  user: lab-user
  password: "{{ common_admin_password }}"
  chpasswd:
    expire: false
  ssh_pwauth: true

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  bastion_public_hostname: "{{ bastion_public_hostname }}"
  bastion_ssh_user_name: "{{ bastion_ssh_user_name }}"
  bastion_ssh_password: "{{ bastion_ssh_password }}"
  bastion_ssh_port: "{{ bastion_ssh_port | default(22) }}"
  bastion_ssh_command: "ssh {{ bastion_ssh_user_name }}@{{ bastion_public_hostname }} -p {{ bastion_ssh_port | default(22) }}"
  execution_vm_name: "aap-lab-execution"
  container_vm_name: "aap-lab-container"
  container_exe_vm_name: "aap-lab-container-exe"
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_cnv_namespace: "aap"
  quickcourse_primary_view_url: "{{ quickcourse_primary_view_url }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_quickcourse
# -------------------------------------------------------------------
quickcourse_deployment_ocp: yes
quickcourse_git_repo: https://github.com/RedHatQuickCourses/advanced-deployment-aap25.git
quickcourse_git_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: a24d6963-267b-4a81-82bc-fff05a2b2023

  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  owners:
    maintainer:
      - name: Amrinder Singh
        email: amrsingh@redhat.com
    sme:
      - name: Amrinder Singh
        email: amrsingh@redhat.com
    instructions:
      - name: Amrinder Singh
        email: amrsingh@redhat.com

  catalog:
    reportingLabels:
      primaryBU: Automation
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Advanced Deployment of AAP 2.7"
    category: Labs
    keywords:
      - advanced-aap
      - ansible
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Product_Technical_Learning
    multiuser: false
    workshop_user_mode: single

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing

  components:
    - name: openshift-base
      display_name: OpenShift SNO Cluster
      item: agd_v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: sno
        host_ocp4_installer_version: "4.20"
        ocp4_fips_enable: false
      propagate_provision_data:
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: bastion_public_hostname
          var: bastion_public_hostname
        - name: bastion_ssh_user_name
          var: bastion_ssh_user_name
        - name: bastion_ssh_password
          var: bastion_ssh_password
        - name: bastion_ssh_port
          var: bastion_ssh_port
