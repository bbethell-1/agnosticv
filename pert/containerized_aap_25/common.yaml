---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml

#include /includes/secrets/demosat-rhel9-base-microshift.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel8-base
cloud_provider: ec2

# Unset key name
key_name: ""

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
bastion_public_hostname: "rhel9.{{ guid }}.{{ sandbox_zone }}"
# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
rhel9_instance_image: RHEL94GOLD-latest
rhel9_instance_type: "t3a.xlarge"
rootfs_size_rhel9: 200

security_groups:
  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ rhel9_instance_image }}"
    flavor:
      ec2: "{{ rhel9_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel9 }}"
    volumes:
      - device_name: "/dev/xvdb"
        size: "70"
        type: gp3
    security_groups:
      - WebSG

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el9:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 81458000-6fc3-441e-bcf8-18bdff1d25e8
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  owners:
    maintainer:
      - name: Amrinder Singh
        email: amrsingh@redhat.com
  catalog:
    reportingLabels:
      primaryBU: Automation
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Containerized AAP 2.5"
    category: Demos
    keywords:
      - aap
      - ansible
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Product_Technical_Learning
    multiuser: false
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
