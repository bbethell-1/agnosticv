---
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-us.yaml

#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop
cloud_provider: ec2

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL95GOLD-latest
bastion_instance_image: RHEL95GOLD-latest
default_rootfs_size: 50
default_instance_type: "t3a.large"

# -------------------------------------------------------------------
# Registry credentials created by Giuliano Quites for RH1 event.
# Do not use this for other labs.
# -------------------------------------------------------------------
lab20_registry_username: CHANGEME
lab20_registry_token: CHANGEME

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebAhttpsSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebControllerPorts
        description: "Open HTTPS Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: ServerSG
    rules:
      - name: Zabbix0
        description: "Zabbix port"
        from_port: 10050
        to_port: 10050
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: Zabbix1
        description: "Zabbix port"
        from_port: 10051
        to_port: 10051
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------
# Instances
# -------------------
instances:
  - name: "{{ bastion_instance_name | default('bastion') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,automationcontroller"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG
      - NodeSG
      - WebSG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image:
      name: "aap2.5-2024-11-06"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: 200
    security_groups:
      - NodeSG
      - WebSG

  - name: "node"
    count: 1
    public_dns: false
    image: "{{ node_image | default(default_instance_image)}}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - ServerSG
      - NodeSG

  - name: "server"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ server_image | default(default_instance_image)}}"
    flavor:
      ec2: "{{ server_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "centos_nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - NodeSG
      - ServerSG
      - WebSG

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user

software_workloads:
  controllers:
    - nginx_with_cert
  centos_nodes:
    - server_customization

post_software_workloads:
  nodes:
    - node1_customization
  bastions:
    - vscode-server

post_software_final_workloads:
  bastions:
    - showroom

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible

# -------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"
# control_user_ssh_config: ./files/rhel_ssh_config.j2


# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: true
vscode_use_automationcontroller_nginx: false
vscode_server_ansible_become: true
vscode_user_workspace_path: /home/rhel/workplace
vscode_server_nginx_https_port: 488
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
vscode_auth_type: none
vscode_user_name: "{{ student_name }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/RedHatQuickCourses/rh1-lab20-ansible.git
# showroom_ui: zero-touch
# showroom_ansible_runner_image: quay.io/mitsharm/ansible-runner-api
# showroom_ansible_runner_image_tag: 1.1.0
showroom_openssh_keypair: provisionkey
showroom_dnf_packages:
  - git
  - podman
  - python3-devel
  - systemd-container
  - unzip
  - ansible-core

showroom_pip_packages:
  - podman-compose==1.0.6

showroom_tab_services:
  - double_tty

showroom_tab_tty1_username: rhel
showroom_showroom_default_ssh_user: rhel
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_ttys_enable_tmux: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: server_customization
      src: https://github.com/opentraining-labs-customizations/rh1-lab20-eda-server-ar.git
      version: 1.0.1

    - name: node1_customization
      src: https://github.com/opentraining-labs-customizations/rh1-lab20-eda-node1-ar.git
      version: 1.0.1

# -------------------------------------------------------------------
# Certs Vars
# -------------------------------------------------------------------
nginx_with_cert_encrypt_mail: opentlc-admin@opentlc.com
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c7374923-c341-46e6-a540-af7b28246497
  owners:
    maintainer:
      - name: Ashish Shah
        email: ashah@redhat.com
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Event-Driven Ansible Troubleshooting"
    category: Labs
    keywords:
      - ansible
      - aap
      - eda
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Product_Technical_Learning
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
      pull: missing
