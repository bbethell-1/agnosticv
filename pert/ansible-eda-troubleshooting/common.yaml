---
#include /includes/catalog-icon-aap.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-4.yaml

#include /includes/secrets/ansible-tower-advanced-26.yaml
#include /includes/secrets/demosat-rhel-9-latest-and-aap25.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/parameters/enable-lets-encrypt.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: ec2
common_dnf_disablerepo: "ansible-developer-1.2-for-rhel-9-x86_64-rpms"
# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL96GOLD-latest
bastion_instance_image: RHEL96GOLD-latest
default_rootfs_size: 50
default_instance_type: "t3a.large"
controller_instance_type: "m5ad.2xlarge"
controller_instance_image: rhpds-aap2.6-ceh-20260209

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebAhttpsSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebControllerPorts
        description: "Open HTTPS Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: ServerSG
    rules:
      - name: Zabbix0
        description: "Zabbix port"
        from_port: 10050
        to_port: 10050
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: Zabbix1
        description: "Zabbix port"
        from_port: 10051
        to_port: 10051
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------
# Instances
# -------------------
instances:
  - name: "{{ bastion_instance_name | default('bastion') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,automationcontroller"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image:
      name: "{{ controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: 200
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "node"
    count: 1
    public_dns: false
    image: "{{ node_image | default(default_instance_image)}}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - ServerSG
      - NodeSG

  - name: "server"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ server_image | default(default_instance_image)}}"
    flavor:
      ec2: "{{ server_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "centos_nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - NodeSG
      - ServerSG
      - WebSG

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user

software_workloads:
  controllers:
    - nginx_with_cert
    - ansible_automation_platform_configuration
  centos_nodes:
    - server_customization

post_software_workloads:
  nodes:
    - node1_customization

post_software_final_workloads:

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible

# -------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"
# control_user_ssh_config: ./files/rhel_ssh_config.j2

# -------------------------------------------------------------------
# Workload: ansible_automation_platform_configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "https://{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "ansible123!"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: false
ansible_automation_platform_configuration_generate_ocp_token: false

controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"

aap_configuration_dispatcher_roles:
  - {role: controller_license, var: controller_license, tags: controller_license}
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}

controller_license:
  manifest_url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

gateway_settings:
  SESSION_COOKIE_AGE: 9000

aap_user_accounts:
  - username: "lab-user"
    is_superuser: true
    password: "{{ common_password }}"
    email: "lab-user@redhat.com"
    organizations: "Default"
    first_name: "lab"
    last_name: User

controller_credentials:
  - name: lab-credential
    description: lab-user credential
    organization: "Default"
    credential_type: Machine
    inputs:
      username: ec2-user
      ssh_key_data: "{{ ssh_privatekey }}"
      become_method: sudo
# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: server_customization
      src: https://github.com/opentraining-labs-customizations/rh1-lab20-eda-server-ar.git
      # version: 1.0.1

    - name: node1_customization
      src: https://github.com/opentraining-labs-customizations/rh1-lab20-eda-node1-ar.git
      # version: 1.0.1

# -------------------------------------------------------------------
# Certs Vars
# -------------------------------------------------------------------
nginx_with_cert_encrypt_mail: opentlc-admin@opentlc.com
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c7374923-c341-46e6-a540-af7b28246497
  owners:
    maintainer:
      - name: Ashish Shah
        email: ashah@redhat.com
      - name: Amrinder Singh
        email: amrsingh@redhat.com
  anarchy:
    namespace: babylon-anarchy-7
  catalog:
    reportingLabels:
      primaryBU: Automation
    multiuser: false
