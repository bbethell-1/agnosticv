---
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml


#include /includes/secrets/zerossl.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift_assisted_installer.yaml

# -----------------------------------------------------------------------
# Advance Red Hat Developer Hub
# -----------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: ocp4-cluster
#software_to_deploy: openshift4_hcp_cnv
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

# master_instance_count: 1
worker_instance_count: "{{ 0 if master_instance_count | int == 1 else [(num_users | int / 3) | round(0, 'ceil') | int, 2] | max }}"

ai_workers_cores: 8
ai_workers_memory: 16Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Instance launch Parameters default values
# -------------------------------------------------------------------
num_users: 1
master_instance_count: 1
ai_control_plane_cores: 24
ai_control_plane_memory: 64Gi
ocp4_installer_version: '4.18'

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
# Packages to install on all of the hosts deployed as part of the agnosticd config
# This invokes the "common" role
install_common: true

# To install extra packages (beyond what's in the common list of packages)
common_extra_packages:
- curl
- maven

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
# ocp4_installer_version: "4.18"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_external_odf
- ocp4_workload_openshift_gitops
- ocp4_workload_rhsso_authentication
- ocp4_workload_gitops_gitlab
- ocp4_workload_pipelines
- ocp4_workload_openshift_devspaces
- ocp4_workload_rhdh
#- ocp4_workload_rhacs
#- ocp4_workload_trusted_profile_analyzer
#- ocp4_workload_trusted_application_pipeline
#- ocp4_workload_quay_operator

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: user
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_03_03
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.11-opr-004
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_admin_create: true
ocp4_workload_rhsso_authentication_admin_username: admin
ocp4_workload_rhsso_authentication_admin_password: "{{ common_password }}"
ocp4_workload_rhsso_authentication_remove_kubeadmin: false
ocp4_workload_rhsso_authentication_user_count: "{{ num_users }}"
ocp4_workload_rhsso_authentication_user_name_base: user
ocp4_workload_rhsso_authentication_user_password: "{{ common_password }}"
ocp4_workload_rhsso_authentication_env_type: "{{ env_type }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: "release-2.12"
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhacm_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag }}"


# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub
# -------------------------------------------------------------------
#ocp4_workload_redhat_developer_hub_gitlab_root_password: "{{ ocp4_workload_gitops_gitlab_config_rootPassword }}"
#ocp4_workload_redhat_developer_hub_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
  #ocp4_workload_redhat_developer_hub_janus_bootstrap_repo_target_revision: main
  #ocp4_workload_redhat_developer_hub_admin_user: admin
  #ocp4_workload_redhat_developer_hub_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"

# -----------------------------------
# Quay Operator
# -----------------------------------
#ocp4_workload_quay_operator_namespace: quay-registry
#ocp4_workload_quay_operator_catalogsource_namespace: quay-registry
  #ocp4_workload_quay_operator_channel: stable-3.13
  #ocp4_workload_quay_operator_starting_csv: quay-operator.v3.13.4
  #ocp4_workload_quay_operator_use_catalog_snapshot: true
  #ocp4_workload_quay_operator_catalogsource_name: redhat-operators-snapshot-quay
  #ocp4_workload_quay_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
  #ocp4_workload_quay_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
  #ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.16
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# GitLab
# -------------------------------------------------------------------
#ocp4_workload_gitops_gitlab_gitops_type: argocd
#ocp4_workload_gitops_gitlab_config_email_display_name: Janus Admin
  #ocp4_workload_gitops_gitlab_config_email_reply_to: "noreply@redhat.com"
  #ocp4_workload_gitops_gitlab_config_smtp_enabled: "false"
  #ocp4_workload_gitops_gitlab_config_smtp_domain: "example.com"
  #ocp4_workload_gitops_gitlab_config_smtp_port: "587"
  #ocp4_workload_gitops_gitlab_config_smtp_user: "gitlab"
  #ocp4_workload_gitops_gitlab_config_smtp_password: "gitlab"
  #ocp4_workload_gitops_gitlab_config_ssh_port: "22"
  #ocp4_workload_gitops_gitlab_config_rootPassword: "{{ common_password }}"
  #ocp4_workload_gitops_gitlab_config_https: "true"
  #ocp4_workload_gitops_gitlab_config_root_email: "root@demo.redhat.com"
  #ocp4_workload_gitops_gitlab_config_keybase_db: "0123456789"
  #ocp4_workload_gitops_gitlab_config_keybase_otp: "0123456789"
  #ocp4_workload_gitops_gitlab_config_keybase_secret: "0123456789"
  #ocp4_workload_gitops_gitlab_db_user_name: gitlab
  #ocp4_workload_gitops_gitlab_db_password: passw0rd
  #ocp4_workload_gitops_gitlab_db_name: gitlab_production

# -------------------------------------------------------------------
# ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: "stable-{{ ocp4_installer_version }}"

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: true
ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: ac80d646-6847-4c9a-a3e7-b7ba2030d524
  owners:
    maintainer:
    - name: Yogita Soni
      email: ysoni@redhat.com
  anarchy:
    namespace: babylon-anarchy-4
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Advance Red Hat Developer Hub"
    category: Open_Environments
    multiuser: true
    keywords:
    - gitops
    - argocd
    - springboot
    - reactjs
    - keycloak
    - api
    - tekton
    - CI
    labels:
      Provider: Product_Technical_Learning
      Product: Red_Hat_Developer_Hub
      Product_Family: Red_Hat_Application_Services
