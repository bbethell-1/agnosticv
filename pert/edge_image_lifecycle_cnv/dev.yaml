---
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv06
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
      - name: bastion_instance_image
        description: RHEL OS Version
        formLabel: RHEL OS Version
        openAPIV3Schema:
          type: string
          default: rhel-9.3
          enum:
            - rhel-9.3
            - rhel-9.5
            - rhel-9.6
            - rhel-10.0
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    #scm_url: https://github.com/l3acon/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: always
