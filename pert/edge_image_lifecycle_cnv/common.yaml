---
#include /includes/catalog-icon-aap.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/enable-cert-manager.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ansible-tower-advanced-2.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/demosat-pert-edge.yaml

# -------------------------------------------------------------------
# Platformss
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
ocp4_installer_version: "4.16"
ai_cluster_version: "{{ ocp4_installer_version }}"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
ai_control_plane_cores: 16
ai_control_plane_memory: '64Gi'
bastion_instance_image: rhel-9.3

#----------------------------------------------------------------------
# Customised bastion Network
#----------------------------------------------------------------------
ai_attach_workers_networks:
  - default/flatnetwork

networks:
  - name: cluster

ai_install_use_network: "cluster{{ guid }}"
bastion_extra_networks:
  - "cluster"

bastion_userdata: |
  #cloud-config
  write_files:
    - path: /etc/sysctl.d/99-ip-forwarding.conf
      content: |
        net.ipv4.ip_forward=1

    - path: /etc/nftables/ruleset.nft
      content: |
        table inet nat {
          chain postrouting {
            type nat hook postrouting priority 100; policy accept;
            oifname "eth0" masquerade
          }
        }

        table inet filter {
          chain forward {
            type filter hook forward priority 0; policy drop;
            iifname "eth1" oifname "eth0" accept
            iifname "eth0" oifname "eth1" ct state related,established accept
          }
        }

    - path: /etc/systemd/system/nftables-restore.service
      content: |
        [Unit]
        Description=Restore nftables rules
        After=network.target

        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c 'while [ ! -x /usr/sbin/nft ]; do sleep 2; done; /usr/sbin/nft -f /etc/nftables/ruleset.nft'
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target

  runcmd:
    - sysctl --system
    - systemctl daemon-reload
    - systemctl enable --now nftables-restore.service

bastion_networkdata: |
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: yes
      eth1:
        dhcp4: no
        addresses:
          - 10.10.10.1/24
# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
project_tag: "{{ env_type }}-{{ guid }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
ssh_privatekey: "{{ lookup('file', hostvars.localhost.ssh_provision_key_path) }}"
ssh_publickey: "{{ hostvars.localhost.ssh_provision_pubkey_content }}"
aws_access_key_id: "{{ aws_credentials.aws_access_key_id }}"
aws_secret_access_key: "{{ aws_credentials.aws_secret_access_key }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
use_content_view: true

# -------------------------------------------------------------------
# Ansible Collections and Roles
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: amazon.aws
      version: 8.2.0
    - name: ansible.posix
      version: 1.6.0
    - name: ansible.utils
      version: 5.1.0
    - name: awx.awx
      version: 24.6.0
    - name: community.general
      version: 9.5.0
    - name: infra.controller_configuration
      version: 2.11.0
    - name: kubernetes.core
      version: 5.0.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.1
    - name: kubevirt.core
      version: 2.1.0
    - name: community.okd
      version: 4.0.0

# -------------------------------------------------------------------
# OCP Infra Workloads
# -------------------------------------------------------------------
student_workloads: []

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
  - ocp4_workload_ansible_automation_platform_25
  - ansible_automation_platform_configuration
  - automation_platform_bastion
  - ocp4_workload_gitea_operator
  - ocp4_workload_quay_operator
  - ocp4_workload_kubevirt

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') | int }}"
ocp4_workload_authentication_remove_kubeadmin: false

# --------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# --------------------------------------------------------------------
odf_channel: "stable-4.16"

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_cloud_provider: ec2
# ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform_25
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_disable_controller: false
ocp4_workload_ansible_automation_platform_disable_eda: false
ocp4_workload_ansible_automation_platform_disable_hub: false
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader

# -------------------------------------------------------------------
# Workload: ansible_automation_platform_configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "{{ aap_controller_web_url }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "{{ aap_controller_admin_password }}"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: true
ansible_automation_platform_configuration_generate_ocp_token: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.1

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.20.1"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: dev-admin
ocp4_workload_gitea_operator_admin_email: dev-admin@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: "{{ student_name }}"
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/redhat-gpte-devopsautomation/demo-event-driven-ansible.git
    name: event-driven-ansible
    private: false
  - repo: https://github.com/redhat-gpte-devopsautomation/eda-rulebooks.git
    name: eda-rulebooks
    private: false

# -------------------------------------------------------------------
# ocp4_workload_quay_operator
# -------------------------------------------------------------------
ocp4_workload_quay_operator_channel: stable-3.12
ocp4_workload_quay_operator_registry_namespace: quay
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false

# ------------------------
# Config values
# ------------------------
apd_bootstrap_scm_branch: main

# ------------------------
# AAP2.5 Dispatcher Role
# ------------------------
controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

aap_configuration_dispatcher_roles:
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_settings, var: controller_settings, tags: controller_settings}
  - {role: eda_decision_environments, var: eda_decision_environments, tags: eda_decision_environments}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_templates}
  - {role: controller_job_launch, var: controller_launch_jobs, tags: controller_job_launch}

gateway_settings:
  SESSION_COOKIE_AGE: 9000

controller_settings:
  - name: TOWER_URL_BASE
    value: "{{ ansible_automation_platform_configuration_host }}"


eda_decision_environments:
  - name: "Default Decision Environment"
    organization: Default
    image_url: "registry.redhat.io/ansible-automation-platform-25/de-supported-rhel8:latest"

controller_credentials:
  - name: Demo Credential
    credential_type: Machine
    update_secrets: true
    inputs:
      username: admin
      ssh_key_data: "{{ ssh_privatekey }}"
      password: "{{ common_password }}"

  - name: Controller Credential
    credential_type: Red Hat Ansible Automation Platform
    organization: Default
    inputs:
      host: "{{ ansible_automation_platform_configuration_host }}"
      username: "{{ ansible_automation_platform_configuration_username }}"
      password: "{{ ansible_automation_platform_configuration_password }}"

  - name: OpenShift Credential
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

  - name: AWS
    credential_type: Amazon Web Services
    organization: Default
    update_secrets: false
    inputs:
      username: "{{ aws_access_key_id }}"
      password: "{{ aws_secret_access_key }}"

controller_projects:
  - name: Demo Project
    organization: Default
    scm_type: git
    scm_url: https://github.com/ansible/product-demos-bootstrap.git
    scm_branch: "{{ apd_bootstrap_scm_branch }}"
    wait: true

controller_templates:
  - name: Demo Job Template
    job_type: run
    inventory: Demo Inventory
    project: Demo Project
    playbook: install_product_demos.yml
    credentials: Controller Credential
    extra_vars:
      apd_ee_image_version: '25'

controller_launch_jobs:
  - name: Demo Job Template
    wait: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 9F665853-D4CB-4508-AFCC-E3A65C175D11
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Edge Image and Device Lifecycle (CNV)"
    category: Demos
    multiuser: false
    keywords:
      - ansible
      - openshift
      - ocp
      - cnv
      - aap
      - demo
      - aap25
      - edge
      - device
    labels:
# To be updated later - I don't know what this actually is
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Product_Technical_Learning
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: always
  components:
    - name: aws_sandbox
      display_name: AWS Credentials
      item: sandboxes-gpte/SANDBOX_OPEN
      propagate_provision_data:
        - var: aws_credentials
