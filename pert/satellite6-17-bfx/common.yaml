---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Product Enablement Red Hat Satellite 6.17 Break-fix lab
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Subdomain configuration for CNV
# -------------------------------------------------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Satellite External FQDN
# -------------------------------------------------------------------
pert_satellite_external_fqdn: "{{ groups['satellites'][0].split('.')[0] }}.{{ subdomain_base }}"

# -------------------------------------------------------------------
# System Settings
# -------------------------------------------------------------------
bastion_cores: "{{ 64 if flavor_type == 'large' else 32 if flavor_type == 'medium' else 16 if flavor_type == 'small' else 16 }}"
bastion_memory: "{{ '64Gi' if flavor_type == 'large' else '32Gi' if flavor_type == 'medium' else '16Gi' if flavor_type == 'small' else '16Gi' }}"
node_cores: 2
node_memory: 4Gi
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

env_type: base-infra
cloud_provider: openshift_cnv

bastion_instance_image: rhel-9.6
rhel8_instance_image: rhel-8.10
bastion_rootfs_size: 200Gi
project_tag: "{{ env_type }}-{{ guid }}"
rhel_instance_image: rhel-9.6

install_student_user: true
student_name: lab-user
student_sudo: true
student_password: "{{ common_password }}"

common_install_basic_packages: false
install_bastion: false
config_user_preferred_python: false
ansible_user: cloud-user
openshift_cnv_legacy_routes: true
inventory_groups:
- satellites
- capsules
- bastions
- node1
- node2

# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
- git
- python3
- python3-pip
- tmux
- tree
- unzip
- vim-enhanced
- wget
- ansible
- ansible-core

requirements_content:
  collections:
  - name: https://github.com/opentraining-labs-customizations/satellite.breakfix.git
    type: git
    version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
post_software_workloads:
  satellites:
  - satellite.breakfix.satellite
  - satellite.breakfix.grade
  capsules:
  - satellite.breakfix.capsule

instances:
- name: bastion
  count: 1
  unique: true
  alt_name: bastion
  memory: "{{ bastion_memory }}"
  cores: "{{ bastion_cores }}"
  image_size: "{{ bastion_rootfs_size }}"
  image: "{{ bastion_instance_image }}"
  metadata:
  - AnsibleGroup: "bastions"
  - function: bastion
  - user: "{{ student_name }}"
  - project: "{{ project_tag }}"
  - ostype: linux
  - Purpose: "{{ purpose }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ guid }}"
  networks:
  - default
  disks:
  - metadata:
      name: "extradisk{{ guid }}"
    spec:
      source:
        blank: {}
      pvc:
        accessModes:
        - ReadWriteMany
        volumeMode: Block
        resources:
          requests:
            storage: "200Gi"

- name: "satellite"
  count: 1
  unique: true
  public_dns: true
  floating_ip: true
  image: pert-satellite-6-17-2025-12-01
  memory: 64Gi
  cores: 8
  image_size: 350Gi
  tags:
  - key: "AnsibleGroup"
    value: "satellites"
  - key: "ostype"
    value: "linux"
  networks:
  - default
  services:
  - name: satellite-fip
    type: LoadBalancer
    ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      name: satellite-http
    - port: 443
      protocol: TCP
      targetPort: 443
      name: satellite-https
  routes:
  - name: satellite-https
    host: satellite
    service: satellite-fip
    targetPort: 443
    tls: true

- name: "capsule"
  count: 1
  unique: true
  public_dns: true
  floating_ip: false
  image: "{{ rhel_instance_image }}"
  memory: 64Gi
  cores: 8
  image_size: 100Gi
  networks:
  - default
  tags:
  - key: "AnsibleGroup"
    value: "capsules"
  - key: "ostype"
    value: "linux"
  services:
  - name: capsule-fip
    type: LoadBalancer
    ports:
    - port: 9090
      protocol: TCP
      targetPort: 9090
      name: capsule-port

- name: "node1"
  count: 1
  unique: true
  public_dns: true
  floating_ip: false
  image: "{{ rhel8_instance_image }}"
  memory: "{{ node_memory }}"
  cores: "{{ node_cores }}"
  image_size: "{{ bastion_rootfs_size }}"
  tags:
  - key: "AnsibleGroup"
    value: "node1"
  - key: "ostype"
    value: "linux"
  networks:
  - default

- name: "node2"
  count: 1
  unique: true
  public_dns: true
  floating_ip: false
  image: "{{ bastion_instance_image }}"
  memory: "{{ node_memory }}"
  cores: "{{ node_cores }}"
  image_size: "{{ bastion_rootfs_size }}"
  tags:
  - key: "AnsibleGroup"
    value: "node2"
  - key: "ostype"
    value: "linux"
  networks:
  - default

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0a3951c8-9fb0-48c8-8f92-01219ac4496d
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: base-infra
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2600Gi"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Red Hat Satellite 6.17 Break-fix lab"
    category: Labs
    keywords:
    - satellite
    - opentraining
    - troubleshooting
    - rhel
    labels:
      Provider: Product_Technical_Learning
      Platform: RHEL
      TDP1: Server_Cloud_OS
    parameters:
    - name: flavor_type
      description: Choose the size of the deployment
      formLabel: Deployment Size
      required: true
      openAPIV3Schema:
        type: string
        default: small
        enum:
        - small
        - medium
        - large
    reportingLabels:
      primaryBU: RHEL
  owners:
    maintainer:
    - name: Yogita Soni
      email: ysoni@redhat.com
