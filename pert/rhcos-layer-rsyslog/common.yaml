---
# -------------------------------------------------------------------
# --- Catalog Placement: Red Workshops
# --- Catalog Item: "Product Enablement: Customize RHCOS to add rsyslog package"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml


#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18.9"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 6Gi

ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

master_instance_count: 1
worker_instance_count: 0

ai_attach_workers_networks:
- default/flatnetwork

bastion_extra_networks:
- default/flatnetwork

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_showroom

# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads: []

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18
ocp4_workload_external_odf_volume_binding_mode: Immediate

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_count: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.17
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false

ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# TODO: Convert to non-Showroom and rename
ocp4_workload_showroom_content_git_repo: https://github.com/RedHatQuickCourses/customise-rhcos-layer-rsyslog
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 29A506CC-0EFF-4BB4-B4CB-05D613866876
  anarchy:
    namespace: babylon-anarchy-6
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      limits.cpu: "128"
      requests.cpu: "128"
      limits.memory: "400Gi"
      requests.memory: "400Gi"
  catalog:
    display_name: "Product Enablement: Customize RHCOS to add rsyslog package"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    workshopLabUiRedirect: false
    workshopUiMaxInstances: 3
    keywords:
    - rhcos
    - coreos
    - rsyslog
    labels:
      Provider: Product_Technical_Learning
      Platform: OpenShift
      TDP1: Container_Management
    reportingLabels:
      primaryBU: Hybrid_Platforms
  owners:
    maintainer:
    - name: Sarvesh Pandit
      email: sapandit@redhat.com
    sme:
    - name: Zheng Wang
      email: zhengwan@redhat.com
    instructions:
    - name: Zheng Wang
      email: zhengwan@redhat.com
  tower:
    timeout: 18000
