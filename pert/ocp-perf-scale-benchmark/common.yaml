---
# -------------------------------------------------------------------
# --- Catalog Placement: Red Workshops
# --- Catalog Item: "Product Enablement: OpenShift Perf and Scale Benchmarking"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml


#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18.9"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 6Gi

ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

ai_workers_cores: 16
ai_workers_memory: 32Gi

ai_attach_workers_networks:
- default/flatnetwork

bastion_extra_networks:
- default/flatnetwork

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager

# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads: []

software_workloads_for_bastion:
- ocp_perf_benchmarking_lab

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18
ocp4_workload_external_odf_volume_binding_mode: Immediate

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_count: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.17
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------

requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: kubernetes.core
    version: 5.0.0
  roles:
  - name: ocp_perf_benchmarking_lab
    src: https://github.com/opentraining-labs-customizations/ocp-perf-benchmarking-lab
    version: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: B028AE0B-E40C-4FAD-8172-5581328612EE
  anarchy:
    namespace: babylon-anarchy-6
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      limits.cpu: "128"
      requests.cpu: "128"
      limits.memory: "400Gi"
      requests.memory: "400Gi"
  catalog:
    display_name: "Product Enablement: OpenShift Perf and Scale Benchmarking"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    workshopLabUiRedirect: false
    workshopUiMaxInstances: 3
    keywords:
    - openshift
    - ocp
    - performance
    - benchmarking
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Product_Technical_Learning
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms
  owners:
    maintainer:
    - name: Sarvesh Pandit
      email: sapandit@redhat.com
    sme:
    - name: Jose Castillo Lema
      email: jlema@redhat.com
    instructions:
    - name: Jose Castillo Lema
      email: jlema@redhat.com
  tower:
    timeout: 21600
