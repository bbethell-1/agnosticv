---
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml

# -------------------------------------------------------------------
# --- Catalog: OpenShift CNV
# --- Catalog Item: Product Enablement: Fast-Track Ansible Automation Platform Migration"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
env_type: multi-cloud-base-infra
cloud_provider: openshift_cnv
software_to_deploy: none

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
rhel_instance_image: rhel-9.5
rootfs_size_rhel: 50Gi
node_name: node
pv_size_node: 4Gi

openshift_cnv_legacy_routes: true

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    userdata: |
      #cloud-config
      fqdn: bastion.lab
      hostname: bastion
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion-https
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
    routes:
      - name: bastion-https
        host: bastion
        service: bastion-https
        targetPort: 443
        tls: true

  - name: gateway
    count: 1
    memory: "16G"
    cores: "4"
    image_size: "{{ rootfs_size_rhel }}"
    image: "{{ rhel_instance_image }}"
    userdata: |
      #cloud-config
      fqdn: gateway.lab
      hostname: gateway
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    metadata:
      - AnsibleGroup: "nodes"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    services:
      - name: gateway-fip
        type: LoadBalancer
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: gateway-http
          - port: 443
            protocol: TCP
            targetPort: 443
            name: gateway-https
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: gateway-http-alt
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: gateway-https-alt
          - port: 5432
            protocol: TCP
            targetPort: 5432
            name: gateway-db-alt

  - name: hub
    count: 1
    memory: "16G"
    cores: "4"
    image_size: "{{ rootfs_size_rhel }}"
    image: "{{ rhel_instance_image }}"
    userdata: |
      #cloud-config
      fqdn: hub.lab
      hostname: hub
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    metadata:
      - AnsibleGroup: "nodes"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    services:
      - name: hub-fip
        type: LoadBalancer
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: hub-http
          - port: 443
            protocol: TCP
            targetPort: 443
            name: hub-https
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: hub-http-alt
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: hub-https-alt
          - port: 5432
            protocol: TCP
            targetPort: 5432
            name: hub-db-alt

  - name: database
    count: 1
    memory: "16G"
    cores: "4"
    image_size: "{{ rootfs_size_rhel }}"
    image: "{{ rhel_instance_image }}"
    userdata: |
      #cloud-config
      fqdn: database.lab
      hostname: database
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    metadata:
      - AnsibleGroup: "nodes"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    services:
      - name: database-fip
        type: LoadBalancer
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: database-http
          - port: 443
            protocol: TCP
            targetPort: 443
            name: database-https
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: database-http-alt
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: database-https-alt
          - port: 5432
            protocol: TCP
            targetPort: 5432
            name: database-db-alt

  - name: controller
    count: 1
    memory: "16G"
    cores: "4"
    image_size: "{{ rootfs_size_rhel }}"
    image: "{{ rhel_instance_image }}"
    userdata: |
      #cloud-config
      fqdn: controller.lab
      hostname: controller
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    metadata:
      - AnsibleGroup: "nodes"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    services:
      - name: controller-fip
        type: LoadBalancer
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: controller-http
          - port: 443
            protocol: TCP
            targetPort: 443
            name: controller-https
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: controller-http-alt
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: controller-https-alt
          - port: 5432
            protocol: TCP
            targetPort: 5432
            name: controller-db-alt

  - name: container
    count: 1
    memory: "18G"
    cores: "4"
    image_size: "{{ rootfs_size_rhel }}"
    image: "{{ rhel_instance_image }}"
    userdata: |
      #cloud-config
      fqdn: container.lab
      hostname: container
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    metadata:
      - AnsibleGroup: "nodes"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    services:
      - name: eda-fip
        type: LoadBalancer
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: container-http
          - port: 443
            protocol: TCP
            targetPort: 443
            name: container-https
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: container-http-alt
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: container-https-alt
          - port: 5432
            protocol: TCP
            targetPort: 5432
            name: container-db-alt

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: ansible_automation_platform_installer
      src: https://github.com/opentraining-labs-customizations/ansible_automation_platform_installer.git

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - create_ssh_provision_key
  all:
    - set_env_authorized_key
    - set-repositories
    - bastion-student-user
  bastions:
    - common
    - bastion-base
    - user-create-ansible-service-account
    - asset_injector

software_workloads:
  bastions:
    - ansible_automation_platform_installer

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import

# -------------------------------------------------------------------
# Role: set_env_authorized_key
# -------------------------------------------------------------------
set_env_authorized_key: true
env_authorized_key: "{{ guid }}key"
ansible_ssh_private_key_file: ~/.ssh/{{ env_authorized_key }}.pem
ansible_service_account_user_ssh_config: ssh_config.j2

# -------------------------------------------------------------------
# Role: ansible_automation_platform_installer
# -------------------------------------------------------------------

ansible_automation_platform_installer_url: "https://d18h2xbjo1t4w8.cloudfront.net/aap2_assets/ansible-automation-platform-setup-bundle-2.4-14.2-x86_64.tar.gz"
installer_dir: "/opt/ansible-automation-platform-setup-bundle-2.4-14.2-x86_64"
username: "{{ s3_rhpds_private_username }}"
password: "{{ s3_rhpds_private_password }}"
automationcontroller_hosts:
  - controller.lab
automationhub_hosts:
  - hub.lab
database_hosts:
  - database.lab

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true


# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_name: lab-user
student_password: "{{ common_password }}"

agd_install_bastion_base: true
agd_install_common: true
agd_bastion_packages:
  - python3
  - ansible
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------
ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: eb2678e9-1caf-40a0-9751-12334b2dbcf3
  owners:
    maintainer:
      - name: Amrinder Singh
        email: amrsingh@redhat.com
    sme:
      - name: Amrinder Singh
        email: amrsingh@redhat.com
  anarchy:
    namespace: babylon-anarchy-3
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Fast-Track Ansible Automation Platform Migration"
    category: Labs
    keywords:
      - aap
      - enablement
      - migration
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Product_Technical_Learning
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: Automation
      assetGroup: PTL_Enablement
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2026-03-10
