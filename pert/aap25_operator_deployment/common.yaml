---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-automation-management.yaml
#include /includes/terms-of-service.yaml
#includes/access-restriction-rh1-2026-devs.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

# To be deleted
## include /includes/parameters/enable-cert-manager.yaml
## include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
## include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
## include /includes/secrets/openshift_assisted_installer.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Product Enablement: Ansible Automation Platform Operator Deployment
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# OpenShift Autoscaling cluster settings
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2025_12_15

num_users: 1
openshift_cnv_scale_cluster: true
# worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max }}"
worker_instance_count: 4

ai_workers_cores: 16
ai_workers_memory: 64Gi

common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_user_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Roles and Collections
# -------------------------------------------------------------------
tag: main
requirements_content:
  collections:
  - name: https://github.com/rhpds/jeffcpullen.agnosticp
    type: git
    version: main
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/cloud_vm_workloads.git
    type: git
    version: "cnv_instances"
  - name: https://github.com/rhpds/rhpds.manage_host.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# List of workloads to be deployed
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.cloud_vm_workloads.cnv_instances
- infra.aap_configuration.dispatch
- rhpds.manage_host.aap_api
- agnosticd.cloud_vm_workloads.agnosticv_userdata_import

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: "user"
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: false

# ---------------------------------------------------------
# ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.20
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0

ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.24.6"

ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_htpasswd_user_base }}1"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"

ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/jeffcpullen/devspaces-example
  name: 'devspaces-example'
  private: false

# -------------------------------------------------------------------
# ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_admin_password }}"
ocp4_workload_ansible_automation_platform_disable_controller: false
ocp4_workload_ansible_automation_platform_disable_eda: false
ocp4_workload_ansible_automation_platform_disable_hub: false
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.6
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader
ocp4_workload_ansible_automation_platform_catalog_snapshot_image_tag: "v4.20_2025_12_29"
ocp4_workload_ansible_automation_platform_hub_file_storage_file_class: ocs-external-storagecluster-cephfs
ocp4_workload_ansible_automation_platform_hub_file_storage_access_mode: ReadWriteMany

# --------------------------------------------------------------------
# ansible_automation_platform_configuration
# --------------------------------------------------------------------
ansible_automation_platform_configuration_host: "{{ lookup('agnosticd.core.agnosticd_user_data', 'aap_controller_web_url') }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "{{ lookup('agnosticd.core.agnosticd_user_data', 'aap_controller_admin_password') }}"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: true
ansible_automation_platform_configuration_generate_ocp_token: true

# --------------------------------------------------------------------
# ansible_automation_platform_configuration
# --------------------------------------------------------------------
openshift_bearer_token: "{{ openshift_cluster_admin_token  }}"
controller_dependency_check: false
aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

aap_configuration_dispatcher_roles:
- role: gateway_settings
  var: gateway_settings
  tags: gateway_settings
- role: controller_credentials
  var: controller_credentials
  tags: controller_credentials
- role: controller_inventories
  var: controller_inventories
  tags: controller_inventories

gateway_settings:
  SESSION_COOKIE_AGE: 9000

# -------------------------------------------------------------------
# Workload: rhpds.manage_host.aap_api
# -------------------------------------------------------------------
aap_api_controller_url: "{{ ansible_automation_platform_configuration_host }}"
aap_api_controller_username: "{{ ansible_automation_platform_configuration_username }}"
aap_api_controller_password: "{{ ansible_automation_platform_configuration_password }}"
aap_api_controller_verify_ssl: "{{ ansible_automation_platform_configuration_verify_ssl }}"

# AAP API endpoints configuration
aap_api_endpoints:
- name: "OpenShift Credential"
  endpoint: credentials
  description: "OpenShift API Bearer Token"
  organization: Default
  credential_type: OpenShift or Kubernetes API Bearer Token
  attributes:
    inputs:
      host: "{{ openshift_api_url }}"
      bearer_token: "{{ openshift_bearer_token }}"
      verify_ssl: true


# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  ssh_username: "{{ bastion_ansible_user }}"
  ssh_password: "{{ bastion_ansible_ssh_pass }}"
  ssh_address: "{{ bastion_ansible_host }}"
  ssh_port: "{{ bastion_ansible_port }}"
  ssh_command: >-
    ssh {{ bastion_ansible_user }}@{{ bastion_ansible_host }} -p {{ bastion_ansible_port }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e627d434-73f6-47d6-9493-b1d13429c79f
  owners:
    maintainer:
    - name: Amrinder Singh
      email: amrsingh@redhat.com
    sme:
    - name: Andrew Block
      email: ablock@redhat.com
    instructions:
    - name: Andrew Block
      email: ablock@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Ansible Automation Platform Operator Deployment"
    category: Labs
    multiuser: false
    keywords:
    - config_as_code
    - ocp
    - opentraining
    - ansible
    - aap
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Product_Technical_Learning
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  tower:
    timeout: 21600
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '4.20'
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: openshift_api_url
      var: openshift_api_url
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: openshift_cluster_ingress_domain
      var: openshift_cluster_ingress_domain
