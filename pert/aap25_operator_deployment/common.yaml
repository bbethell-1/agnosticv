---
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

student_name: lab-user
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0

# ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
# ocp4_workload_catalogsource_tag: v4.16_2024_07_15

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_type: "t3a.large"
rootfs_size_bastion: 50
bastion_instance_image: RHEL94GOLD-latest

# Control Plane
master_instance_type_family: m4

master_instance_type_size: 4xlarge

master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size }}"

worker_instance_type_family: >-
  {{ 'm6g' if ocp4_architecture_cluster is match('arm64')
  else 'm5a' if ocp4_architecture_cluster is match('x86_64')
  else 'm5a'
  }}

worker_instance_type: "{{ master_instance_type_family }}.4xlarge"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
## Uncomment below to add custom stuff
requirements_content:
  roles:
    - name: ocp_application_validation
      src: https://github.com/redhat-gpte-devopsautomation/ocp_application_validation.git
      version: v3.0.4
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# OpenShift Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager

# -------------------------------------------------------------------
# OpenShift variable
# -------------------------------------------------------------------
student_workloads: []
host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 2
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager_operator
# -------------------------------------------------------------------
ocp4_workload_cert_manager_operator_channel: stable-v1

sandbox_user_info_messages_enable: true

