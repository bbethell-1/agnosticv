---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: "Product Enablement: OpenShift Virtualization and Migration Lab"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml


#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18.9"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 6Gi

ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

worker_instance_count: 3
ai_workers_cores: 16
ai_workers_memory: 32Gi

ai_attach_workers_networks:
- default/flatnetwork

bastion_extra_networks:
- default/flatnetwork

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_nmstate
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_metallb
- ocp4_workload_virt_network_config
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18
ocp4_workload_external_odf_volume_binding_mode: Immediate

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
# ocp4_workload_authentication_htpasswd_user_base: user
# ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: 0
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.17
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_nmstate
# -------------------------------------------------------------------
# 2025/02/19: NMState Operator is missing from 4.18 catalog
ocp4_workload_nmstate_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.8
ocp4_workload_mtv_starting_csv: "mtv-operator.v2.8.5"

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: false
ocp4_workload_metallb_enable_l2advertisement: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: false
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false

ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_content_git_repo: https://github.com/RedHatQuickCourses/etx-virt_delivery
ocp4_workload_showroom_content_git_repo_ref: self-paced

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: BB35835F-D580-48C5-B223-19CA7C5C726E
  anarchy:
    namespace: babylon-anarchy-6
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      limits.cpu: "128"
      requests.cpu: "128"
      limits.memory: "400Gi"
      requests.memory: "400Gi"
  catalog:
    display_name: "Product Enablement: OpenShift Virtualization and Migration Lab"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    workshopLabUiRedirect: false
    workshopUiMaxInstances: 3
    keywords:
    - openshift
    - ocp
    - cnv
    - virtualization
    - enablement
    labels:
      Provider: Product_Technical_Learning
      Platform: OpenShift
      TDP1: Virtualization
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms
  owners:
    maintainer:
    - name: Sarvesh Pandit
      email: sapandit@redhat.com
    - name: Ashish Shah
      email: ashishks@redhat.com
    sme:
    - name: Alberto Gonzales Rodriguez
      email: josegonz@redhat.com
    instructions:
    - name: Julio Villarreal Pelegrino
      email: juvillar@redhat.com
    - name: Andrew Block
      email: ablock@redhat.com
    - name: Raffaele Spazzoli
      email: rspazzol@redhat.com
    - name: Sarvesh Pandit
      email: sapandit@redhat.com
  tower:
    timeout: 21600
