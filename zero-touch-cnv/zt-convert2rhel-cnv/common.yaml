---
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-RHEL

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
env_type: zero-touch-base-rhel
software_to_deploy: none
install_student_user: true

ansible_user: centos
remote_user: centos

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

agd_bastion_packages:
#- at
#- bash-completion
#- bind-utils
#- git
#- podman
#- buildah
- tmux
- vim-enhanced
- wget
#- httpd

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------

zero_touch_ingress_rules:
- ports:
  - protocol: TCP
    port: 443
  - protocol: TCP
    port: 80
  - protocol: TCP
    port: 8443
  from:
  - ipBlock:
      cidr: 0.0.0.0/0
zero_touch_egress_rules:
- ports:
  - protocol: TCP
    port: 8443
  - protocol: TCP
    port: 443

lock_bastion_security_group: true

bastion_hostname: centos
bastion_instance_image: centos-7.9.2009
bastion_instance_memory: 2G
bastion_instance_cores: 1
bastion_instance_image_size: 40G
bastion_instance_centos_iso: centos-7.9.2009-iso
bastion_instance_centos_size: 10Gi
bastion_instance_userdata: |
  #cloud-config
  runcmd:
  - mkdir /media/CentOS/
  - echo "/dev/vdb1 /media/CentOS/ iso9660 defaults 0 0" >> /etc/fstab
  - mount -a
  - cd /etc/yum.repos.d/
  - ls -1 | grep -v Media | xargs rm || true
  - sed -i 's/enabled=0/enabled=1/' CentOS-Media.repo


instances:
- name: "{{ bastion_hostname | default('bastion') }}"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: true
  floating_ip: false
  image: "{{ bastion_instance_image | default(bastion_default_image) }}"
  memory: "{{ bastion_instance_memory | default(bastion_default_memory) }}"
  cores: "{{ bastion_instance_cores | default(bastion_default_cores) }}"
  image_size: "{{ bastion_instance_image_size | default(bastion_default_image_size) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions,showroom"
  - key: "ostype"
    value: "linux"
  networks:
  - default
  disks:
  - metadata:
      name: "centosiso{{ guid }}"
    spec:
      source:
        pvc:
          name: "{{ bastion_instance_centos_iso }}"
          namespace: cnv-images
      pvc:
        accessModes:
        - ReadWriteMany
        volumeMode: Block
        resources:
          requests:
            storage: "{{ bastion_instance_centos_size }}"
  services: "{{ bastion_instance_service | default(bastion_default_service) }}"
  routes: "{{ bastion_instance_routes | default(bastion_default_routes) }}"
  userdata: "{{ bastion_instance_userdata }}"

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------

asset_injector_assets:
- description: Root SSH enabled
  type: lineinfile
  path: /etc/ssh/sshd_config
  regexp: '^PermitRootLogin'
  line: 'PermitRootLogin yes'
  backrefs: true

- description: Define Root Password for showroom SSH access
  type: user
  name: root
  state: present
  password: |-
    {{ ansible_service_account_user_password | d(generated_password) | default(common_password) | password_hash('sha512') }}

- description: Copy Showroom-tmux file from bastion to centos
  type: blockinfile
  path: /usr/local/bin/showroom-tmux
  mode: "755"
  marker: ""
  create: True
  owner: root
  state: present
  block: |-
    #!/usr/bin/bash

    # Added by showroom
    # Enables tty ssh sessions, eg wetty, to automatically run in a tmux session

    if command -v tmux >/dev/null 2>&1 && [ -z "$TMUX" ]; then
        # Check if the session exists, disregarding any error messages
        tmux has-session -t $1 2>/dev/null

        if [ $? != 0 ]; then
            # Create a new session if it doesn't exist
            tmux new-session -s $1 -n $1 -d
        fi

        # Attach to the session
        tmux attach-session -t $1
    else
        if [ -z "$TMUX" ]; then
            echo "tmux is not installed. Please install tmux to use this feature."
        fi
    fi

# -------------------------------------------------------------------
# Role: OCP4 showroom testing
# -------------------------------------------------------------------
showroom_deploy_shared_cluster_enable: False

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/rhel_zero_convert2rhel.git

ocp4_workload_showroom_content_git_ref: main
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_antora_playbook: zero-touch-site.yml

ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_image: docker.io/wettyoss/wetty:latest
ocp4_workload_showroom_wetty_ssh_bastion_login: true

bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"
centos_prefix: "{{ groups['centos'][0] | regex_replace('\\..*$') }}"

bastion_ssh_command: "ssh {{ ansible_service_account_user_name }}@{{ bastion_public_hostname }}"
bastion_ssh_user_name: "{{ ansible_service_account_user_name }}"
bastion_ssh_password: "{{ ansible_service_account_user_password }}"
bastion_public_hostname: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
ansible_service_account_user_name: root

showroom_git_repo: >-
  https://github.com/rhpds/rhel_zero_convert2rhel.git

showroom_ui: zero-touch

showroom_tab_services:
- tty1

showroom_tab_tty1_username: root

showroom_ttys_enable_tmux: True
showroom_ttys_tumx_scrolling: False

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_openssh_keypair: provisionkey
showroom_ssh_host: "centos.{{ guid }}.internal"
showroom_ssh_port: 22
showroom_host: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"

showroom_lab_users:
- root

showroom_user_password: "{{ common_password }}"

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"
