---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-RHEL

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
dns_support_state: True
zero_touch_cockpit_installed: False
# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ingress_rules:
  - ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 8080
      - protocol: TCP
        port: 8081
      - protocol: TCP
        port: 8443
    from:
      - ipBlock:
          cidr: 0.0.0.0/0

zero_touch_egress_rules:
  - ports:
      - protocol: TCP
        port: 8443
      - protocol: TCP
        port: 8080
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 8081
    to:
      - ipBlock:
          cidr: 0.0.0.0/0

use_content_view: true

agd_bastion_packages:
  - at
  - ansible-core
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: "t3a.medium"
rootfs_size_rhel9: 40
node_instance_image: RHEL94GOLD-latest
node_instance_type: "t3a.medium"
default_rootfs_size: 50

instances:
  - name: "{{ bastion_instance_name | default('rhel') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      openshift_cnv: "{{bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - ZeroRHELSG
      - BastionSG
      - NodeSG

  - name: "client"
    count: 1
    public_dns: false
    image: "{{ node_instance_image | default(default_instance_image) }}"
    flavor:
      openshift_cnv: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes,showroom"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - ZeroRHELSG
      - BastionSG
      - NodeSG

# ---------------------------------------------------------
# AWS EC2 Security Groups
# ---------------------------------------------------------
security_groups:
  - name: ZeroRHELSG
    rules:
      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: SSH
        description: "Ansible and SSH"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionOHTTPSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: ToNodeSGssh
        description: "Allow ssh to NodeSG"
        from_port: 22
        to_port: 22
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: ToNodeSGhttp
        description: "Allow HTTP to NodeSG"
        from_port: 80
        to_port: 80
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

zero_touch_lock_security_rules:
  - name: BastionSG
    rules_ingress:
      - ports:
          - 443
          - 8443
        proto: tcp
        cidr_ip: "0.0.0.0/0"
    rules_egress: []
  - name: NodeSG
    rules_ingress:
      - ports:
          - 80
          - 22
        proto: tcp
        group_name: NodeSG
    rules_egress:
      - ports:
          - 80
          - 22
        proto: tcp
        group_name: NodeSG
# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------

asset_injector_assets:
  - description: Create soe file
    type: blockinfile
    path: /home/rhel/soe.yml
    create: true
    marker: ""
    state: present
    block: |-
      ---
      - hosts: localhost
        become: yes
        vars:
          kernel_settings_sysctl:
            - name: vm.swappiness
              value: 20
            - name: vm.dirty_ratio
              value: 40
            - name: vm.dirty_expire_centisecs
              value: 500
            - name: vm.dirty_writeback_centisecs
              value: 100
            - name: kernel.sem
              value: "250 32000 100 128"
          tlog_scope_sssd: all
        roles:
          - role: rhel-system-roles.kernel_settings
          - role: rhel-system-roles.tlog
  - description: Add rhel user to passwordless sudo
    type: lineinfile
    path: /etc/sudoers
    create: true
    state: present
    line: |-
      "{{ zero_touch_rhel_user_user_name }}" ALL=(ALL) NOPASSWD: ALL


# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
### Showroom broken Testing other repo https://github.com/rhpds/rhel_zero_poc_managing_user_basics.git
showroom_git_repo: https://github.com/rhpds/rhel_zero_rhel_system_roles
showroom_ui: zero-touch

showroom_tab_services:
  - tty1
  - tty2

showroom_tab_tty1_username: rhel
showroom_tab_tty2_username: rhel

showroom_ttys_enable_tmux: true
showroom_ttys_tumx_scrolling: false

showroom_showroom_default_ssh_user: rhel
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - rhel

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 394560aa-a8f7-42f4-b70f-7d9303e4258d
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Build a Standard Operating Environment with RHEL System Roles
    category: Demos
    keywords:
      - rhel
      - rhel9
      - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
      assetGroup: ZEROTOUCH
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
