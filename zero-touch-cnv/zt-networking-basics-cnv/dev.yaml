purpose: development
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/rhel_zero_networking_basics.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: zero-touch-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_zero_touch_bundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.4/nookbag-v0.0.4.zip
ocp4_workload_showroom_zero_touch_ui_enabled: 'true'
ocp4_workload_showroom_chart_package_url: https://agonzalezrh.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.9
bastion_prefix: '{{ groups[''bastions''][0] | regex_replace(''\..*$'') }}'
ansible_service_account_user_name: rhel
ansible_service_account_user_password: '{{ common_password }}'
_showroom_user_data:
  bastion_ssh_command: ssh {{ ansible_service_account_user_name }}@{{ groups['bastions'][0]  }}
  bastion_ssh_user_name: '{{ ansible_service_account_user_name }}'
  bastion_ssh_password: '{{ ansible_service_account_user_password }}'
  bastion_public_hostname: '{{ bastion_prefix }}'
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: 'yes'
  deployer:
    scm_ref: zero-touch-base-rhel
  lifespan:
    default: 1d
    maximum: 2d
    relativeMaximum: 1d
  runtime:
    default: 6h
    maximum: 48h
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: zero-touch-base-rhel
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
