---
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-RHEL

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

use_content_view: true

agd_bastion_packages:
  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget
  - httpd

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

bastion_instance_image: rhel-9.4
bastion_instance_memory: 2G
bastion_instance_cores: 1
bastion_instance_image_size: 40G

zero_touch_ingress_rules:
  - ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 8443
    from:
      - ipBlock:
          cidr: 0.0.0.0/0
zero_touch_egress_rules:
  - ports:
      - protocol: TCP
        port: 8443
      - protocol: TCP
        port: 443

instances:
  - name: "{{ bastion_hostname | default('bastion') }}"
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: true
    floating_ip: false
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    memory: "{{ bastion_instance_memory | default('4G') }}"
    cores: "{{ bastion_instance_cores | default('1') }}"
    image_size: "{{ bastion_instance_image_size | default('40G') }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
    routes:
      - name: bastion-https
        host: bastion
        service: bastion
        targetPort: 443
        tls: true


# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------

asset_injector_assets:
  - description: Downgrade curl version
    type: command
    cmd: dnf downgrade curl -y

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
### Showroom broken Testing other repo https://github.com/rhpds/rhel_zero_poc_managing_user_basics.git
showroom_git_repo: https://github.com/rhpds/rhel_zero_installing_software_yum.git
showroom_ui: zero-touch

showroom_tab_services:
  - tty1

showroom_tab_tty1_username: root

showroom_ttys_enable_tmux: true
showroom_ttys_tumx_scrolling: false

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_ssh_port: 22
showroom_lab_users:
  - root

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 5f8f0542-e35d-4c7f-bfbb-8f9e6bffdb32
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Installing Software Using Package Managers [Admin 101] CNV
    category: Demos
    keywords:
      - rhel
      - rhel9
      - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
      assetGroup: ZEROTOUCH
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
