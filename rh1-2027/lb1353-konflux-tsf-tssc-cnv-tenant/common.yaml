---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/sandbox-api.yaml

config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: false
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# TenantCluster sandbox var remapping
# The sandbox provides sandbox_openshift_api_url and openshift_cluster_admin_token.
# namespaced_workloads roles expect these remapped variables.
# -------------------------------------------------------------------
openshift_api_url: "{{ sandbox_openshift_api_url }}"
cluster_admin_agnosticd_sa_token: "{{ openshift_cluster_admin_token }}"
num_users: 1
current_cluster_name: default
tag: main

platform: rhpds

bastion_instance_image: none
bastion_cores: 0
bastion_memory: 0
worker_instance_count: 0

common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: "v1.6.11"
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/konflux-tssc-lab.git#/automation/ansible
      type: git
      version: "{{ tag }}"

workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_authentication_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_gitlab
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_quay
  - konflux_tssc_lab.automation.ocp4_workload_konflux_tssc_tenant
  - agnosticd.showroom.ocp4_workload_showroom

remove_workloads: []

# Role konflux_tssc_lab.automation.ocp4_workload_konflux_tssc_tenant
ocp4_workload_konflux_tssc_tenant_user: "user-{{ guid }}"
ocp4_workload_konflux_tssc_tenant_namespace: "user-{{ guid }}-tenant"

# Tenant namespace configuration
# Creates two namespaces: user-{guid}-tenant and user-{guid}-managed
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"

ocp4_workload_tenant_namespace_suffixes:
  - suffix: tenant
    metadata:
      labels:
        konflux-tenant: "user-{{ guid }}"
        konflux-ci.dev/type: tenant
  - suffix: managed
    metadata:
      labels:
        konflux-managed: "user-{{ guid }}"

# Pass namespace names to authentication role for RBAC
ocp4_workload_tenant_namespace_name: "user-{{ guid }}-tenant"
ocp4_workload_tenant_namespace_additional_namespaces:
  - name: "user-{{ guid }}-managed"

# GitLab tenant configuration
ocp4_workload_tenant_gitlab_namespace: gitlab
ocp4_workload_tenant_gitlab_username: "user-{{ guid }}"
ocp4_workload_tenant_gitlab_password: "{{ common_password }}"

# Import repository into user's personal namespace
ocp4_workload_tenant_gitlab_user_repositories:
  - name: sample-component-golang
    url: https://github.com/konflux-ci/sample-component-golang.git
    visibility: private

# Add user to shared group
ocp4_workload_tenant_gitlab_user_groups:
  - name: tsf
    access_level: developer

# Quay tenant configuration
ocp4_workload_tenant_quay_namespace: quay-enterprise
ocp4_workload_tenant_quay_user: "user-{{ guid }}"
ocp4_workload_tenant_quay_user_password: "{{ common_password }}"

# Tenant authentication user configuration (HTPasswd for OpenShift login)
ocp4_workload_tenant_authentication_user_provider: htpasswd
ocp4_workload_tenant_authentication_user_username: "user-{{ guid }}"
ocp4_workload_tenant_authentication_user_password: "{{ common_password }}"
ocp4_workload_tenant_authentication_user_create_rbac: true

student_workloads: []

# Showroom configuration for lab guide
ocp4_workload_showroom_namespace: "user-{{ guid }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/konflux-tssc-lab.git
ocp4_workload_showroom_content_git_repo_ref: "{{ tag }}"
# Enable Wetty terminal with auto-SSH to bastion (pre-authenticated)
ocp4_workload_showroom_terminal_type: wetty

__meta__:
  asset_uuid: 1C9E5A3F-4B2D-48F7-A5C8-9D7E2F8B4C6A
  sandboxes:
    - kind: OcpSandbox
      cloud_selector:
        cloud: cnv-dedicated-shared
        lab: lb1353-konflux-tsf-tssc
        purpose: dev
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1353: Build, Sign, and Ship - Securing the Software Supply Chain with Konflux"
    category: Labs
    keywords:
      - konflux
      - tsf
      - tssc
      - rhtas
      - supply-chain
      - slsa
      - lab
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
  owners:
    maintainer:
      - email: treddy@redhat.com
        name: Tyrell Reddy
  tower:
    timeout: 7200
