---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: dev
__meta__:
  deployer:
    scm_ref: main
    scm_type: git
  sandboxes:
  - kind: OcpSandbox
    alias: cluster
    namespace_suffix: user
    cloud_selector:
      lab: lb1285-ai-agent-sec
      purpose: dev

# The GitOps repo to use for the DEV tenant
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/agentops-in-action-workshop.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-tenant
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"

# To enable showroom in dev mode #
ocp4_workload_showroom_enable_dev_mode: true
