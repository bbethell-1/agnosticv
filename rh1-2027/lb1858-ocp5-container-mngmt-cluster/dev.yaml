---

ocp4_workload_gitops_bootstrap_health_ignore: false
ocp4_workload_gitops_bootstrap_health_retries: 2

__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandbox_host:
    annotations:
      cloud: cnv-dedicated-shared
      lab: lb1858-ocp5-container-mngmt
      purpose: dev
    max_cpu_usage_percentage: 90
    max_memory_usage_percentage: 85
    max_placements: 30
