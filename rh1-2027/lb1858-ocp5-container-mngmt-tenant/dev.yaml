---
requirements_content:
  collections:
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"

ocp4_workload_showroom_antora_enable_dev_mode: true
ocp4_workload_gitops_bootstrap_health_ignore: false
ocp4_workload_gitops_bootstrap_health_retries: 2

ocp4_workload_showroom_runtime_automation_enable: false

__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main

  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb1858-ocp5-container-mngmt
      purpose: dev
