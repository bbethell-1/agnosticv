---
#include /includes/catalog-icon-openshift.yaml

#include /includes/sandbox-api.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# LB1858: Operating Applications on OpenShift 5 (Tenant)
#
# JIRA: RHDPCD-1227
# -------------------------------------------------------------------
cloud_provider: none
config: namespace
openshift_api_url: "{{ sandbox_openshift_api_url }}"
cluster_admin_agnosticd_sa_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Tags / revisions
# -------------------------------------------------------------------
tag: main
tag_showroom: v1.7.2
gitops_repo_revision: main
showroom_repo_revision: main

requirements_content:
  collections:
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom

ocp4_workload_username: "user-{{ guid }}"
ocp4_workload_user_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_username }}"

ocp4_workload_tenant_namespace_suffixes:
- suffix: demo

ocp4_workload_tenant_namespace_default_quota:
  requests.cpu: "2"
  limits.cpu: "4"
  requests.memory: 8Gi
  limits.memory: 12Gi
  requests.storage: 20Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 1Gi
  defaultRequest:
    cpu: 250m
    memory: 512Mi

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/openshift-5-container
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-tenant
ocp4_workload_gitops_bootstrap_application_project: tenants
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"

ocp4_workload_gitops_bootstrap_helm_values:
  username: "{{ ocp4_workload_username }}"
  gitea:
    adminPassword: "{{ ocp4_workload_user_password }}"
    password: "{{ ocp4_workload_user_password }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-5-container
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OCP Console
      url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
    - name: ArgoCD
      url: 'https://argocd-server-{{ ocp4_workload_username }}-demo.{{ openshift_cluster_ingress_domain }}'
    - name: Gitea
      url: 'https://gitea-{{ ocp4_workload_username }}-demo.{{ openshift_cluster_ingress_domain }}'

# -------------------------------------------------------------------
# Babylon metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 7639de18-b5a4-47c2-ae06-f0184b65c93a
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-08-05

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1858: Operating Applications on OpenShift 5 (Tenant)"
    category: Brand_Events
    workshop_user_mode: none
    workshopLabUiRedirect: true
    keywords:
    - rh1-2027
    - lb1858
    - openshift5
    - containers
    - gitops
    - platform-engineering
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    tenant_cluster:
      item: rh1-2027/lb1858-ocp5-container-mngmt-cluster
