---
# ===================================================================
# Catalog Item: OpenShift Ops Day Roadshow (RH1 2027)
#
# Single-user workshop deployed on a 3-node compact OCP cluster from
# a CNV pool (cloud_provider: none). The cluster comes pre-provisioned
# with ODF (external Ceph + NooBaa) via ocp5-cluster-cnv-pools.
#
# This config connects to the pool cluster and deploys workshop
# workloads on top. Workloads are built dynamically from module_enable_*
# catalog parameters — each module can be toggled independently.
#
# Key repos:
#   agnosticv (this file)              — catalog config, variables, parameters
#   deliver-openshift-ops-day          — custom Ansible roles (collection: deliver-openshift-ops-day.automation)
#   openshift-days-ops-showroom        — Antora lab instructions + inject-env-vars.sh
#   agnosticd/core_workloads           — upstream shared operator roles
#   agnosticd/ai_workloads             — upstream OLS role
#
# common.yaml is the base config, shared by both stages. dev.yaml only
# sets the development purpose/stage marker.
# ===================================================================

# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
# Supplies requester_email + catalog_item_name, which the LiteLLM virtual-keys
# workload uses to attribute the issued key (see _ols_workloads below).
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/ocp4_workload_ols_api_token.yaml
# Provides ocp4_pull_secret for KubeVirt cloud credentials (HCP cluster creation)
#include /includes/secrets/openshift_assisted_installer_icr.yaml
# Supplies litellm_url + litellm_master_key. The virtual-keys role asserts on
# both and cannot mint a key without them.
#include /includes/secrets/litemaas-master_api.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================

# Collection versions — all collections pinned to {{ tag }} use this.
tag: main

# Connects to a pre-existing OCP cluster from a CNV pool (no cloud provisioning).
# The cluster is provided via the openshift-base component (see __meta__.components).
cloud_provider: none
config: openshift-workloads
openshift_cnv_scale_cluster: true
ai_workers_cores: 32
ai_workers_memory: 64Gi
worker_instance_count: 1

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Single-user workshop — no student accounts, just the admin user
num_users: 0

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    # Tracking main until a release tag includes PR #84 (merged 2026-10-02)
    version: main

  # Custom Workshop Workloads for Ops Track (RH1 2027 - deliver-openshift-ops-day)
  - name: https://github.com/rhpds/deliver-openshift-ops-day.git#/automation/ansible
    type: git
    version: "{{ tag }}"

  # AI workloads (for OpenShift Lightspeed)
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # Agentic OLS MaaS key auto-provisioning
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main

# -------------------------------------------------------------------
# Showroom v1.7.2 runtime pins
#
# rh1-2027/account.yaml enables runtime automation globally and still
# overrides Wetty/runner to the older RH1 defaults. Pin the v1.7.2
# Showroom stack here so this item gets the matching chart, terminal
# images, Nookbag bundle, and runner implementation. The newer runner
# is substantially smaller than zt-runner:v2.4.2, avoiding the long
# first-pull timeout on compact CNV clusters.
# -------------------------------------------------------------------
ocp4_workload_showroom_deployer_chart_version: "2.2.*"
ocp4_workload_showroom_terminal_image: "quay.io/rhpds/openshift-showroom-terminal-ocp:4.20"
ocp4_workload_showroom_wetty_image: "quay.io/rhpds/wetty:v3.2.1"
ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip"
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zerotouch-automation:v1.3.3"
# This is a dedicated cluster per claim, not a shared tenant cluster, so use
# dedicated mode (cluster-admin ClusterRoleBinding) rather than tenant mode.
# Neither this file nor dev.yaml sets ocp4_workload_tenant_namespace_suffixes,
# so without this the runtime-automation ServiceAccount behind k8s_kubeconfig
# is granted no RBAC at all (see rhpds/showroom
# roles/ocp4_workload_showroom/tasks/setup_runtime_automation_identity.yaml),
# and qa-automation/healthcheck.yaml's cross-namespace checks (e.g. reading
# the openshift-gitops Application, or any module-specific check) fail with
# permission errors instead of reporting real module health.
ocp4_workload_showroom_runtime_automation_cluster_admin: true

# ACME ClusterIssuer for the optional Console HTTP/2 route certificate.
workshop_console_http2_cert_issuer_name: acme-bifrost-production-ddns

# -------------------------------------------------------------------
# Common Passwords
# Random per deployment, persisted to output_dir for consistency within a run.
# Used by authentication, RHACS, and other workloads.
# -------------------------------------------------------------------
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=10, chars=['ascii_letters', 'digits']) }}
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=16, chars=['ascii_letters', 'digits']) }}

# ============================================
# BASE WORKLOADS (Always deployed)
# ============================================
# Appends ocp4_workload_image_prefetch when agentic OLS is enabled, so the
# large lightspeed/RHOKP images in ocp4_workload_image_prefetch_images below
# start pulling as early as possible - this is the first workload group to
# run, giving the pull the whole rest of the deployment as lead time.
_base_workloads: >-
  {{
    (
      [
        'deliver_openshift_ops_day.automation.ocp4_workload_cluster_cleanup_preflight',
        'agnosticd.core_workloads.ocp4_workload_authentication',
        'agnosticd.showroom.ocp4_workload_ocp_console_embed',
        'agnosticd.showroom.ocp4_workload_showroom',
        'deliver_openshift_ops_day.automation.ocp4_workload_days_ops_track',
        'agnosticd.core_workloads.ocp4_workload_web_terminal',
        'agnosticd.core_workloads.ocp4_workload_pipelines'
      ] +
      (['deliver_openshift_ops_day.automation.ocp4_workload_image_prefetch']
        if (ocp5_workload_ols_enable_agentic | default(false) | bool) else [])
    )
  }}

# node_selector {} (all nodes): this item's CNV cluster is compact, with no
# node-role.kubernetes.io/worker label on any node until the dedicated
# worker added above schedules - a worker-only selector would otherwise
# match zero nodes and the DaemonSet would never schedule.
ocp4_workload_image_prefetch_node_selector: {}
ocp4_workload_image_prefetch_images:
- registry.redhat.io/offline-knowledge-portal/rhokp-rhel9@sha256:f46082f2dc2972582f3b85ed2a563b554d0aba3255ba2f00835e65f4929ae9a9
- registry.redhat.io/openshift-lightspeed/lightspeed-service-api-rhel9@sha256:5c6426ec827b469a10a093ded2e9551e5f28d698ff4073ab474bb7d95e1c1694
- registry.redhat.io/lightspeed-core/dataverse-exporter-rhel9@sha256:1c7ffaead23adfb1dc6bd3adfe75c80f284d6d31f13ca427d754703c78514cb2

# ============================================
# OPTIONAL WORKLOAD GROUPS
# ============================================

# Virtualization module workloads
# Includes ocp4_workload_virtualization_boot_image_trim right after the
# virtualization role. It only patches the HyperConverged CR that role
# already created (does not modify core_workloads at all) to disable the
# default golden-image DataImportCrons this workshop doesn't use — see
# ocp4_workload_virtualization_boot_image_trim_disabled_images below.
_virt_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_openshift_virtualization
- deliver_openshift_ops_day.automation.ocp4_workload_virtualization_boot_image_trim

# HCP module workloads — infrastructure needed for Hosted Control Planes
# Gated by module_enable_acm (HCP requires ACM). Includes KubeVirt,
# GitOps, MetalLB, and ACM itself. Deduped via unique if Virt also enabled.
_hcp_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_openshift_virtualization
- deliver_openshift_ops_day.automation.ocp4_workload_virtualization_boot_image_trim
- deliver_openshift_ops_day.automation.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_rhacm
- deliver_openshift_ops_day.automation.ocp4_workload_rhacm_cloud_credentials
- deliver_openshift_ops_day.automation.ocp4_workload_metallb
- deliver_openshift_ops_day.automation.ocp4_workload_hcp_kubevirt
- deliver_openshift_ops_day.automation.ocp4_workload_prepare_hcp

# ACM module workloads - adds multi-cluster observability, compliance, and pre-provisioned managed cluster
_acm_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_acm_multicluster_observability
- deliver_openshift_ops_day.automation.ocp4_days_workload_compliance_operator
- deliver_openshift_ops_day.automation.ocp4_workload_create_hcp_cluster

# GitOps module workloads
# Deploys ArgoCD operator. Deduped via unique if ACM also enabled.
_gitops_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_openshift_gitops

# Developer Hub module workloads (simplified - operator only)
_devhub_workloads:
- deliver_openshift_ops_day.automation.ocp4_days_workload_rhdh

# OpenShift Lightspeed module workloads
# Cleanup deletes the OLSConfig created by the upstream role so students
# create it manually in the lab module. Operator and secrets remain.
# When agentic OLS is enabled, rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# runs first to auto-mint a per-GUID MaaS key against the shared LiteLLM
# proxy (see ocp5_workload_ols_agentic_* vars below) - no one has to
# obtain or paste a key by hand.
_ols_workloads: >-
  {{
    (
      (['rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys']
        if (ocp5_workload_ols_enable_agentic | default(false) | bool) else []) +
      [
        'agnosticd.ai_workloads.ocp5_workload_ols',
        'deliver_openshift_ops_day.automation.ocp4_workload_ols_cleanup'
      ]
    )
  }}

# Model id for the auto-provisioned key above, forwarded to the shared
# LiteLLM proxy - same model agentic OLS expects.
ocp4_workload_litellm_virtual_keys_models:
- claude-sonnet-4-6

# Security module workloads (ACS + Compliance)
# After upstream RHACS installs, console_embed patches the Central route from
# passthrough → reencrypt so the IngressController can strip X-Frame-Options
# and Showroom can iframe the RHACS console tab.
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_workload_rhacs_console_embed
_security_workloads:
- agnosticd.core_workloads.ocp4_workload_rhacs
- deliver_openshift_ops_day.automation.ocp4_workload_rhacs_console_embed
- deliver_openshift_ops_day.automation.ocp4_days_workload_compliance_operator
- deliver_openshift_ops_day.automation.ocp4_days_workload_ztwim
- deliver_openshift_ops_day.automation.ocp4_days_workload_vault

# Cluster cleanup — disable unused OLM catalogs and prune stale images.
# Compact 3-node clusters with 100GB disks accumulate 60+ GB of stale images
# from OLM catalog refreshes. Runs twice: before ACS (prevent ephemeral storage
# evictions) and after (final cleanup). Two role names needed because the
# unique filter deduplicates.
_cleanup_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_cluster_cleanup

_cleanup_final_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_cluster_cleanup_final

# End-of-deployment comprehensive diagnostics
_diag_workloads:
- deliver_openshift_ops_day.automation.ocp4_workload_cluster_diagnostics

# ============================================
# BUILD WORKLOADS DYNAMICALLY
# Uses unique filter to deduplicate workloads that appear in multiple groups
# ============================================
workloads: >-
  {{
    (
      _base_workloads +
      (_virt_workloads if module_enable_virt | default(true) | bool else []) +
      (_hcp_workloads if module_enable_acm | default(true) | bool else []) +
      (_acm_workloads if module_enable_acm | default(true) | bool else []) +
      (_gitops_workloads if module_enable_gitops | default(true) | bool else []) +
      (_devhub_workloads if module_enable_devhub | default(true) | bool else []) +
      (_ols_workloads if module_enable_ols | default(true) | bool else []) +
      _cleanup_workloads +
      (_security_workloads if (module_enable_security | default(true) | bool or module_enable_ztwim | default(true) | bool or module_enable_vault | default(true) | bool) else []) +
      _cleanup_final_workloads +
      _diag_workloads
    ) | unique | list
  }}

# -------------------------------------------------------------------
# Remove workloads - runs on destroy to clean up external resources
# OLS creates Azure AD app registrations that must be deleted. Also
# revokes the auto-provisioned litellm_virtual_key when agentic OLS
# was enabled (see _ols_workloads above).
# -------------------------------------------------------------------
remove_workloads: >-
  {{
    (
      ['agnosticd.ai_workloads.ocp5_workload_ols'] +
      (['rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys']
        if (ocp5_workload_ols_enable_agentic | default(false) | bool) else [])
    )
  }}

# -------------------------------------------------------------------
# Showroom workshop content configuration
# https://github.com/rhpds/openshift-days-ops-showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/deliver-openshift-ops-day.git
ocp4_workload_showroom_content_git_repo_ref: "{{ tag }}"
ocp4_workload_showroom_antora_enable_dev_mode: "false"
ocp4_workload_showroom_user_is_admin: true

# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Pass module_enable_* catalog parameters to showroom as environment variables
# inject-env-vars.sh reads these and sets Antora asciidoc attributes for ifeval conditionals in nav.adoc
ocp4_workload_showroom_user_data:
  MODULE_ENABLE_INSTALL: "{{ module_enable_install | default(true) }}"
  MODULE_ENABLE_APPMGMT: "{{ module_enable_appmgmt | default(true) }}"
  MODULE_ENABLE_INGRESS: "{{ module_enable_ingress | default(true) }}"
  MODULE_ENABLE_NETSEC: "{{ module_enable_netsec | default(true) }}"
  MODULE_ENABLE_DEBUGGING: "{{ module_enable_debugging | default(true) }}"
  MODULE_ENABLE_GITOPS: "{{ module_enable_gitops | default(true) }}"
  MODULE_ENABLE_LDAP: "{{ module_enable_ldap | default(true) }}"
  MODULE_ENABLE_OIDC: "{{ module_enable_oidc | default(true) }}"
  MODULE_ENABLE_OBSERVABILITY: "{{ module_enable_observability | default(true) }}"
  MODULE_ENABLE_PERFORMANCE: "{{ module_enable_performance | default(true) }}"
  MODULE_ENABLE_VIRT: "{{ module_enable_virt | default(true) }}"
  MODULE_ENABLE_DEVHUB: "{{ module_enable_devhub | default(true) }}"
  MODULE_ENABLE_OLS: "{{ module_enable_ols | default(true) }}"
  MODULE_ENABLE_ACM: "{{ module_enable_acm | default(true) }}"
  MODULE_ENABLE_SECURITY: "{{ module_enable_security | default(true) }}"
  MODULE_ENABLE_ZTWIM: "{{ module_enable_ztwim | default(true) }}"
  MODULE_ENABLE_VAULT: "{{ module_enable_vault | default(true) }}"

# -------------------------------------------------------------------
# Catalog Snapshot Configuration (shared across operators)
# Catalog snapshots pin operator versions for reproducible installs.
# Without this, operators on 'stable'/'fast' channels can auto-upgrade
# between deployments, breaking the workshop if a new version changes
# defaults or introduces bugs.
#
# Base snapshot: v4.20_2026_03_16. Operators affected by OCP 5.0-rc catalog
# drift (pipelines, rhacm, rhacs, gitops, rhdh, ztwim) are pinned to the
# newer v4.22_2026_09_14 snapshot instead — see their individual workload
# sections below. Confirmed live via job_203103 (guid tzpk5-1) on 2026-09-16.
# Each role uses its OWN tag variable — the shared ocp4_workload_catalogsource_tag
# is NOT picked up by upstream roles. Must set per-role tags explicitly.
# Operators not in the snapshot (RHDH) are pinned by startingCSV instead.
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2026_03_16

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# Sets up htpasswd auth with a single admin user. Passwords are derived
# from the guid so they're deterministic but unique per deployment.
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_provider: htpasswd

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm (Core version)
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.17
ocp4_workload_rhacm_enable_wildcards: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_cloud_credentials
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_workload_rhacm_cloud_credentials
# Creates a KubeVirt provider credential in ACM so it can provision
# Hosted Control Plane clusters on the local CNV infrastructure.
# Also installs the hcp CLI for managing hosted clusters.
# -------------------------------------------------------------------
ocp4_workload_rhacm_cloud_credentials_kubevirt: true
ocp4_workload_rhacm_cloud_credentials_kubevirt_secret_name: kubevirt-secret
ocp4_workload_rhacm_cloud_credentials_install_hcp_cli: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs (upstream with resource overrides)
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: rhacs-4.11
ocp4_workload_rhacs_install_operator_namespace: rhacs-operator
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_central_admin_password: "{{ common_admin_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
# Use Immediate binding to avoid WaitForFirstConsumer PVC deadlock on multinode external Ceph
ocp4_workload_rhacs_central_storage_class: ocs-external-storagecluster-ceph-rbd-immediate
# Resource overrides for compact 3-node cluster
# RHACS upstream defaults total ~15 cores of requests across all components.
# These overrides reduce that to ~4 cores so everything fits on the workshop cluster.
# When _update is false (role default), no overrides are applied and the operator
# uses its own defaults. Setting _update to true activates the values below.

# Central - main RHACS API server and UI (upstream default: 1500m/4Gi request)
ocp4_workload_rhacs_central_resources_update: true
ocp4_workload_rhacs_central_requests_cpu: "500m"
ocp4_workload_rhacs_central_requests_memory: "2Gi"
ocp4_workload_rhacs_central_limits_cpu: "2"
ocp4_workload_rhacs_central_limits_memory: "4Gi"

# Central DB - PostgreSQL database for Central (upstream default: 4000m/8Gi request)
ocp4_workload_rhacs_central_db_resources_update: true
ocp4_workload_rhacs_central_db_requests_cpu: "500m"
ocp4_workload_rhacs_central_db_requests_memory: "2Gi"
ocp4_workload_rhacs_central_db_limits_cpu: "2"
ocp4_workload_rhacs_central_db_limits_memory: "4Gi"

# Scanner - legacy image scanner (upstream default: 1000m/1500Mi request)
ocp4_workload_rhacs_scanner_resources_update: true
ocp4_workload_rhacs_scanner_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_requests_memory: "512Mi"
ocp4_workload_rhacs_scanner_limits_cpu: "1"
ocp4_workload_rhacs_scanner_limits_memory: "2Gi"

# Scanner V4 - newer image scanner with indexer, matcher, and DB components
# Also reduces replicas from 3 (default) to 1 for the workshop
ocp4_workload_rhacs_scanner_v4_resources_update: true

# Scanner V4 Indexer - scans and indexes container images
ocp4_workload_rhacs_scanner_v4_indexer_replicas: 1
ocp4_workload_rhacs_scanner_v4_indexer_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_v4_indexer_requests_memory: "512Mi"
ocp4_workload_rhacs_scanner_v4_indexer_limits_cpu: "1"
ocp4_workload_rhacs_scanner_v4_indexer_limits_memory: "2Gi"

# Scanner V4 Matcher - matches vulnerabilities against indexed images
ocp4_workload_rhacs_scanner_v4_matcher_replicas: 1
ocp4_workload_rhacs_scanner_v4_matcher_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_v4_matcher_requests_memory: "512Mi"
ocp4_workload_rhacs_scanner_v4_matcher_limits_cpu: "1"
ocp4_workload_rhacs_scanner_v4_matcher_limits_memory: "2Gi"

# Scanner V4 DB - PostgreSQL for scanner vulnerability data
ocp4_workload_rhacs_scanner_v4_db_requests_cpu: "500m"
ocp4_workload_rhacs_scanner_v4_db_requests_memory: "1Gi"
ocp4_workload_rhacs_scanner_v4_db_limits_cpu: "1"
ocp4_workload_rhacs_scanner_v4_db_limits_memory: "2Gi"

# Sensor - deployed via SecuredCluster CR, monitors the cluster for security events
ocp4_workload_rhacs_sensor_resources_update: true
ocp4_workload_rhacs_sensor_requests_cpu: "500m"
ocp4_workload_rhacs_sensor_requests_memory: "1Gi"
ocp4_workload_rhacs_sensor_limits_cpu: "2"
ocp4_workload_rhacs_sensor_limits_memory: "4Gi"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops (ArgoCD)
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.21
# openshift-gitops-operator package is absent from the live redhat-operators
# catalog on OCP 5.0-rc clusters; use the pinned snapshot catalog instead.
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot
ocp4_workload_openshift_gitops_catalogsource_namespace: openshift-marketplace
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.22_2026_09_14
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[email,groups]'
# Reduce ArgoCD resources for compact cluster
# ArgoCD deploys 6 components, each with their own resource requirements.
# Upstream defaults are generous for production HA. These overrides reduce
# them to fit the workshop's 3-node cluster.

# Application Controller - reconciles ArgoCD Applications against the cluster
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "100m"
ocp4_workload_openshift_gitops_controller_requests_memory: "512Mi"
ocp4_workload_openshift_gitops_controller_limits_cpu: "1"
ocp4_workload_openshift_gitops_controller_limits_memory: "4Gi"
ocp4_workload_openshift_gitops_controller_app_sync: "180s"

# API Server - serves the ArgoCD UI and API
ocp4_workload_openshift_gitops_server_update: true
ocp4_workload_openshift_gitops_server_requests_cpu: "50m"
ocp4_workload_openshift_gitops_server_requests_memory: "128Mi"
ocp4_workload_openshift_gitops_server_limits_cpu: "500m"
ocp4_workload_openshift_gitops_server_limits_memory: "256Mi"

# Repo Server - clones git repos and generates manifests
ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: "100m"
ocp4_workload_openshift_gitops_repo_requests_memory: "256Mi"
ocp4_workload_openshift_gitops_repo_limits_cpu: "500m"
ocp4_workload_openshift_gitops_repo_limits_memory: "1Gi"

# Redis - in-memory cache for ArgoCD state
ocp4_workload_openshift_gitops_redis_update: true
ocp4_workload_openshift_gitops_redis_requests_cpu: "50m"
ocp4_workload_openshift_gitops_redis_requests_memory: "64Mi"
ocp4_workload_openshift_gitops_redis_limits_cpu: "500m"
ocp4_workload_openshift_gitops_redis_limits_memory: "256Mi"

# Dex - OIDC authentication provider for ArgoCD
ocp4_workload_openshift_gitops_dex_update: true
ocp4_workload_openshift_gitops_dex_requests_cpu: "50m"
ocp4_workload_openshift_gitops_dex_requests_memory: "64Mi"
ocp4_workload_openshift_gitops_dex_limits_cpu: "500m"
ocp4_workload_openshift_gitops_dex_limits_memory: "256Mi"

# ApplicationSet Controller - generates Applications from templates
ocp4_workload_openshift_gitops_applicationset_controller_update: true
ocp4_workload_openshift_gitops_applicationset_controller_requests_cpu: "50m"
ocp4_workload_openshift_gitops_applicationset_controller_requests_memory: "64Mi"
ocp4_workload_openshift_gitops_applicationset_controller_limits_cpu: "500m"
ocp4_workload_openshift_gitops_applicationset_controller_limits_memory: "256Mi"

# -------------------------------------------------------------------
# Workload: ocp4_days_workload_compliance_operator
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_days_workload_compliance_operator
# Installs the Compliance Operator for the security module.
# Students use it to scan the cluster against CIS/NIST profiles.
# -------------------------------------------------------------------
ocp4_days_workload_compliance_operator_channel: stable
ocp4_days_workload_compliance_operator_namespace: openshift-compliance
ocp4_days_workload_compliance_operator_use_catalog_snapshot: false
ocp4_days_workload_compliance_operator_automatic_install_plan_approval: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# Deploys KubeVirt/CNV operator and HyperConverged CR.
# Used by both the Virtualization module and HCP (KubeVirt provider).
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
# Pinned snapshot's kubevirt-plugin crashes ("Q is not a function") on OCP
# 5.0-rc; kubevirt-hyperconverged 4.22.9 is in the live catalog, use that.
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: v4.20_2026_03_16

# External OCS Ceph RBD (ai_local_storageclass) cannot complete
# VolumeSnapshot creation on CNV clusters — snapshots stay
# READYTOUSE=false indefinitely, leaving DataSources NotReady and the
# bootable volumes catalog empty. Switching to PVC format patches the
# StorageProfile to use dataImportCronSourceFormat=pvc instead.
ocp4_workload_openshift_virtualization_boot_sources_snapshot: false

# The Virtualization workshop module (11-virtualization.adoc) only ever
# boots a rhel9 VM. The other 5 HCO default golden images are each a full
# 30Gi PVC (forced by the pvc-format override above) that this cluster
# claim never uses. Leaves rhel9-image-cron untouched.
ocp4_workload_virtualization_boot_image_trim_disabled_images:
- centos-stream9-image-cron
- centos-stream10-image-cron
- fedora-image-cron
- rhel8-image-cron
- rhel10-image-cron

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb (Core version - CNV specific settings)
# Provides LoadBalancer service type on bare metal/CNV clusters.
# Required for HCP (Hosted Control Planes) ingress.
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
# No live-catalog equivalent on OCP 5.0-rc; stays pinned to the snapshot.
ocp4_workload_metallb_use_catalog_snapshot: true
ocp4_workload_metallb_catalog_snapshot_image_tag: v4.22_2026_09_14
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_ipaddresspool_name: ip-addresspool
# IP range from the CNV cluster's secondary network (br-ex)
ocp4_workload_metallb_ipaddresspool_addresses:
- "10.10.10.200-10.10.10.210"
# L2 mode advertises IPs via ARP on the br-ex bridge interface
ocp4_workload_metallb_enable_l2advertisement: true
ocp4_workload_metallb_l2advertisement_ipaddresspool:
- ip-addresspool
ocp4_workload_metallb_l2advertisement_interface:
- br-ex

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines (OpenShift Pipelines / Tekton)
# Installs the Pipelines operator and tkn CLI for CI/CD exercises.
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.24
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_install_tkn_cli: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# Provides an in-browser terminal in the OpenShift console (oc, kubectl, etc.)
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
# web-terminal 1.17.1 is in the live catalog on OCP 5.0-rc; same as virtualization above.
ocp4_workload_web_terminal_use_catalog_snapshot: false
ocp4_workload_web_terminal_catalogsource_setup: true
ocp4_workload_web_terminal_catalog_snapshot_image_tag: v4.20_2026_03_16


# -------------------------------------------------------------------
# Workload: ocp4_days_workload_rhdh (Simplified Developer Hub)
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_days_workload_rhdh
# Uses guest auth so students can access without additional identity config
# -------------------------------------------------------------------
ocp4_days_workload_rhdh_enable_guest_auth: true
ocp4_days_workload_rhdh_channel: fast
# rhdh package is absent from the live redhat-operators catalog on OCP
# 5.0-rc clusters entirely — only available via the pinned snapshot catalog.
# startingCSV ensures OLM installs v1.10.4, Manual approval prevents
# OLM from auto-upgrading to a newer version in the fast channel.
ocp4_days_workload_rhdh_use_catalog_snapshot: true
ocp4_days_workload_rhdh_starting_csv: "rhdh-operator.v1.10.4"
ocp4_days_workload_rhdh_catalogsource_name: redhat-operators-snapshot
ocp4_days_workload_rhdh_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_days_workload_rhdh_catalog_snapshot_image_tag: v4.22_2026_09_14
ocp4_days_workload_rhdh_automatic_install_plan_approval: false

# -------------------------------------------------------------------
# Workload: ocp5_workload_ols (replaces ocp4_workload_ols)
# https://github.com/rhpds/ai_workloads/tree/main/roles/ocp5_workload_ols
# Same Azure SP flow as the old ocp4_workload_ols role (ocp4_workload_ols_get_token:
# true), just renamed: provider: azure_sp + ocp5_workload_ols_azure_sp_*.
# Reuses the existing vaulted Azure credentials via aliased vars, no new
# secrets needed.
#
# Agentic OLS supports a MaaS backend (ai_workloads#36). The "Enable Agentic
# OpenShift Lightspeed" catalog toggle (ocp5_workload_ols_enable_agentic,
# see __meta__.catalog.parameters below) defaults off; when on,
# ocp5_workload_ols_agentic_provider switches to maas and
# ocp5_workload_ols_agentic_api_key picks up the litellm_virtual_key fact
# minted by _ols_workloads above. This combination is still untested
# end-to-end.
# https://github.com/rhpds/ai_workloads/tree/main/roles/ocp5_workload_ols
# https://github.com/rhpds/ai_workloads/pull/36
# -------------------------------------------------------------------
ocp5_workload_ols_use_catalog_snapshot: true
ocp5_workload_ols_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp5_workload_ols_catalog_snapshot_image_tag: v4.22_2026_09_14
ocp5_workload_ols_catalogsource_name: redhat-operators-snapshot
ocp5_workload_ols_channel: stable
ocp5_workload_ols_provider: azure_sp
ocp5_workload_ols_azure_sp_tenant_id: "{{ ocp4_workload_ols_azure_tenant_id }}"
ocp5_workload_ols_azure_sp_client_id: "{{ ocp4_workload_ols_main_client_id }}"
ocp5_workload_ols_azure_sp_client_secret: "{{ ocp4_workload_ols_main_client_secret }}"
ocp5_workload_ols_azure_sp_group_id: "{{ ocp4_workload_ols_azure_group_id }}"

ocp5_workload_ols_agentic_provider: >-
  {{ 'maas' if (ocp5_workload_ols_enable_agentic | default(false) | bool) else 'openai' }}

# default() only matters when agentic is off, since litellm_virtual_keys
# never ran and nothing downstream reads this var in that case.
ocp5_workload_ols_agentic_api_key: "{{ litellm_virtual_key | default('changeme') }}"

# -------------------------------------------------------------------
# Workload: ocp4_days_workload_ztwim (Zero Trust Workload Identity Manager)
# Package is absent from the live redhat-operators catalog on OCP 5.0-rc
# clusters, only available in the pinned snapshot catalog.
# NOTE: use the role-namespaced vars only; a bare install_operator_catalogsource_*
# is an extra-var and would silently override every role's catalogsource, not just ztwim's.
# -------------------------------------------------------------------
ocp4_days_workload_ztwim_use_catalog_snapshot: true
ocp4_days_workload_ztwim_catalogsource_name: redhat-operators-snapshot
ocp4_days_workload_ztwim_catalogsource_namespace: openshift-marketplace
ocp4_days_workload_ztwim_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_days_workload_ztwim_catalog_snapshot_image_tag: v4.22_2026_09_14

# -------------------------------------------------------------------
# Workload: ocp4_workload_acm_multicluster_observability
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_workload_acm_multicluster_observability
# Reduce ACM Multicluster Observability replicas and CPU requests.
# Default MCO deploys 2-3 replicas per Thanos component (~3100m total)
# but actual usage is ~135m. Compact mode reduces all to 1 replica
# with lower requests. All components remain functional (no HA).
# -------------------------------------------------------------------
ocp4_workload_acm_multicluster_observability_compact_resources: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_days_ops_track
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_workload_days_ops_track
# Reduce NooBaa resources at workload deploy time.
# Patches StorageCluster + BackingStore CRs on pool clusters that were
# provisioned with high NooBaa CPU defaults (~5500m).
# Also fixes BackingStore memory rejection (MCG 4.20+ requires >= 400Mi).
# -------------------------------------------------------------------
workshop_reduce_noobaa_resources: true

# -------------------------------------------------------------------
# Reduce Prometheus retention from 15d to 2d (~4 GiB memory savings)
# -------------------------------------------------------------------
workshop_reduce_prometheus_retention: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_prepare_hcp (vendored into deliver-openshift-ops-day,
# was rhpds.sovereign_cloud.ocp4_workload_prepare_hcp — see _hcp_workloads)
# Configures ACM policies, ManagedClusterSet, and GitOps integration
# needed before a Hosted Control Plane cluster can be provisioned.
# -------------------------------------------------------------------
ocp4_workload_prepare_hcp_policy_namespace: policies
ocp4_workload_prepare_hcp_clusterset_name: managed
ocp4_workload_prepare_hcp_gitops_operator_channel: gitops-1.19

# -------------------------------------------------------------------
# Workload: ocp4_workload_create_hcp_cluster
# https://github.com/rhpds/deliver-openshift-ops-day/tree/main/automation/ansible/roles/ocp4_workload_create_hcp_cluster
# Provisions a managed HCP cluster on the local KubeVirt infrastructure
# so the ACM module has a real multi-cluster environment to work with.
# -------------------------------------------------------------------
# Use Immediate binding to avoid WaitForFirstConsumer PVC deadlock on multinode external Ceph
ocp4_workload_create_hcp_cluster_etcd_storage_class: ocs-external-storagecluster-ceph-rbd-immediate

# Dedicated worker node, so system pods don't all land on the 3
# control-plane nodes (see dev.yaml history for the NodeNotReady
# incident this fixes). Must be a plain top-level var, not a
# __meta__.components[].parameter_values entry - the pool's
# common.yaml hardcodes worker_instance_count as a scalar, which
# replaces rather than merges with parameter_values overrides.

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e492c948-cf05-42e6-9b83-f19a7887eff0

  owners:
    maintainer:
    - name: Josh Newsome
      email: jnewsome@redhat.com
    - name: Jimmy Alvarez
      email: jialvare@redhat.com
    - name: Michael Foster
      email: mfoster@redhat.com
    - name: Diego Alvarez Ponce
      email: dialvare@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1543: Deliver The OpenShift Ops Day Roadshow"
    category: Workshops
    keywords:
    - rhacm
    - rhacs
    - operations
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Application_Developer

    parameters:
    # Getting Started
    - name: module_enable_install
      description: Include Installation & Verification module (content only)
      formGroup: Getting Started
      formLabel: Installation & Verification
      openAPIV3Schema:
        type: boolean
        default: true

    # Core Operations
    - name: module_enable_appmgmt
      description: Include Application Management Basics module (content only)
      formGroup: Core Operations
      formLabel: Application Management
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_ingress
      description: Include Ingress & Load Balancing module (content only)
      formGroup: Core Operations
      formLabel: Ingress & Load Balancing
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_netsec
      description: Include Network Security module (content only)
      formGroup: Core Operations
      formLabel: Network Security
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_debugging
      description: Include Debugging & Troubleshooting module (content only)
      formGroup: Core Operations
      formLabel: Debugging & Troubleshooting
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_gitops
      description: Deploy OpenShift GitOps (ArgoCD) for declarative cluster management
      formGroup: Core Operations
      formLabel: GitOps
      openAPIV3Schema:
        type: boolean
        default: true

    # Identity & Access
    - name: module_enable_ldap
      description: Include LDAP authentication module (content only)
      formGroup: Identity & Access
      formLabel: Identity - LDAP
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_oidc
      description: Include OIDC authentication module (content only)
      formGroup: Identity & Access
      formLabel: Identity - OIDC
      openAPIV3Schema:
        type: boolean
        default: true

    # Day 2 Operations
    - name: module_enable_observability
      description: Include Observability module - metrics, alerts, and logging (content only)
      formGroup: Day 2 Operations
      formLabel: Observability & Logging
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_performance
      description: Include Performance Tuning module (content only)
      formGroup: Day 2 Operations
      formLabel: Performance Tuning
      openAPIV3Schema:
        type: boolean
        default: true

    # Advanced Topics
    - name: module_enable_virt
      description: Deploy OpenShift Virtualization for VM management module
      formGroup: Advanced Topics
      formLabel: Virtualization
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_devhub
      description: Deploy Red Hat Developer Hub for platform engineering showcase
      formGroup: Advanced Topics
      formLabel: Developer Hub
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_ols
      description: Deploy OpenShift Lightspeed AI assistant
      formGroup: Advanced Topics
      formLabel: Lightspeed
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_acm
      description: Deploy ACM fleet management with pre-provisioned managed HCP cluster
      formGroup: Advanced Topics
      formLabel: ACM Multi-Cluster Management
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_security
      description: Deploy Advanced Cluster Security (ACS/RHACS)
      formGroup: Advanced Topics
      formLabel: Advanced Cluster Security
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_ztwim
      description: Include Zero Trust Workload Identity Manager module (content only, ACS workloads deployed if any security module enabled)
      formGroup: Advanced Topics
      formLabel: Zero Trust Workload Identity
      openAPIV3Schema:
        type: boolean
        default: true

    - name: module_enable_vault
      description: Include Secrets Management (Vault) module (content only, ACS workloads deployed if any security module enabled)
      formGroup: Advanced Topics
      formLabel: Secrets Management
      openAPIV3Schema:
        type: boolean
        default: true

    - name: ocp5_workload_ols_enable_agentic
      formLabel: Enable Agentic OpenShift Lightspeed
      formGroup: Agentic OpenShift Lightspeed
      description: >-
        Deploy the Agentic OpenShift Lightspeed component on top of classic
        OLS, backed by an auto-provisioned MaaS key (claude-sonnet-4-6). No
        key needs to be supplied manually.
      required: false
      openAPIV3Schema:
        type: boolean
        default: false

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true

  # Component-based deployment: CNV cluster
  components:
  - name: openshift-base
    display_name: OpenShift 5 Cluster (CNV)
    item: agd-v2/ocp5-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      # hostpath-csi is node-local; 3 simultaneous control plane VMs exhaust
      # available PVs on the CNV sandbox, causing VolumeBinding timeout. Ceph
      # RBD has no node-locality constraint and schedules all 3 VMs without
      # contention.
      ai_local_storageclass: ocs-storagecluster-ceph-rbd
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
