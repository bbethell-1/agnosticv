---
# Development overrides for testing unreleased changes
# Uses 'main' branches instead of pinned tags

purpose: development

# Override tag to use main branches for all collections
tag: main

# Override requirements_content: same collections as common.yaml, minus
# sovereign_cloud. ocp4_workload_prepare_hcp was vendored into
# deliver-openshift-ops-day (see _hcp_workloads override below) so it can
# be edited directly instead of pinned to a sovereign_cloud git hash.
# AgnosticV does not deep-merge lists, so the whole collections list must
# be redefined here rather than patched.
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.2
  - name: https://github.com/rhpds/deliver-openshift-ops-day.git#/automation/ansible
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# Showroom v1.7.2 runtime pins
#
# rh1-2027/account.yaml enables runtime automation globally and still
# overrides Wetty/runner to the older RH1 defaults.  Pin the v1.7.2
# Showroom stack here so this OCP 5 development item gets the matching
# chart, terminal images, Nookbag bundle, and runner implementation.
# The newer runner is substantially smaller than zt-runner:v2.4.2,
# avoiding the long first-pull timeout on compact CNV clusters.
# -------------------------------------------------------------------
ocp4_workload_showroom_deployer_chart_version: "2.2.*"
ocp4_workload_showroom_terminal_image: "quay.io/rhpds/openshift-showroom-terminal-ocp:4.20"
ocp4_workload_showroom_wetty_image: "quay.io/rhpds/wetty:v3.2.1"
ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip"
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zerotouch-automation:v1.3.3"

# Override _hcp_workloads: same list as common.yaml, but using the
# vendored ocp4_workload_prepare_hcp from deliver-openshift-ops-day
# instead of rhpds.sovereign_cloud (which is no longer in the
# collections list above). AgnosticV does not deep-merge lists, so the
# whole list must be redefined here rather than patched.
_hcp_workloads:
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_rhacm
- deliver_openshift_ops_day.automation.ocp4_workload_rhacm_cloud_credentials
- agnosticd.core_workloads.ocp4_workload_metallb
- deliver_openshift_ops_day.automation.ocp4_workload_hcp_kubevirt
- deliver_openshift_ops_day.automation.ocp4_workload_prepare_hcp

# External OCS Ceph RBD (ai_local_storageclass above) cannot complete
# VolumeSnapshot creation on CNV clusters — snapshots stay
# READYTOUSE=false indefinitely, leaving DataSources NotReady and the
# bootable volumes catalog empty. Switching to PVC format patches the
# StorageProfile to use dataImportCronSourceFormat=pvc instead.
# core_workloads main renamed this var (fixed a "shapshot" typo the role
# used to have), so it must match the current spelling or this silently
# no-ops and the role falls back to its snapshot-based default.
ocp4_workload_openshift_virtualization_boot_sources_snapshot: false

# -------------------------------------------------------------------
# ocp5_workload_ols (dev only) - replaces ocp4_workload_ols from
# common.yaml. Same Azure SP flow as the old role
# (ocp4_workload_ols_get_token: true), just renamed: provider: azure_sp
# + ocp5_workload_ols_azure_sp_*. Reuses the existing vaulted Azure
# credentials via aliased vars, no new secrets needed. Agentic OLS
# support exists in the new role but is left disabled here pending a
# real OpenAI API key.
# https://github.com/rhpds/ai_workloads/tree/main/roles/ocp5_workload_ols
# -------------------------------------------------------------------
_ols_workloads:
- agnosticd.ai_workloads.ocp5_workload_ols
- deliver_openshift_ops_day.automation.ocp4_workload_ols_cleanup

ocp5_workload_ols_use_catalog_snapshot: true
ocp5_workload_ols_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp5_workload_ols_catalog_snapshot_image_tag: v4.22_2026_09_14
ocp5_workload_ols_catalogsource_name: redhat-operators-snapshot-lightspeed
ocp5_workload_ols_channel: stable
ocp5_workload_ols_provider: azure_sp
ocp5_workload_ols_azure_sp_tenant_id: "{{ ocp4_workload_ols_azure_tenant_id }}"
ocp5_workload_ols_azure_sp_client_id: "{{ ocp4_workload_ols_main_client_id }}"
ocp5_workload_ols_azure_sp_client_secret: "{{ ocp4_workload_ols_main_client_secret }}"
ocp5_workload_ols_azure_sp_group_id: "{{ ocp4_workload_ols_azure_group_id }}"

# -------------------------------------------------------------------
# OCP 5.0 candidate catalog drift overrides (dev only)
# The live redhat-operators catalog on OCP 5.0-rc clusters has moved
# past the channels/packages common.yaml pins for prod (4.x) clusters:
#   - pipelines-1.20 channel no longer exists (live catalog now only
#     offers pipelines-1.22/1.23)
#   - openshift-gitops-operator package is absent from the live
#     catalog entirely (only in the pinned snapshot catalogs)
#   - advanced-cluster-management release-2.16 channel no longer
#     exists (live catalog now only offers release-2.17)
#   - rhdh package is absent from the live catalog entirely (only in
#     the pinned snapshot catalogs)
# Confirmed live via job_203103 (guid tzpk5-1) on 2026-09-16.
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.23
ocp4_workload_rhacm_acm_channel: release-2.17
ocp4_workload_rhacs_install_operator_channel: rhacs-4.11

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-lightspeed
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.22_2026_09_14

ocp4_days_workload_rhdh_use_catalog_snapshot: true
ocp4_days_workload_rhdh_starting_csv: "rhdh-operator.v1.10.4"
ocp4_days_workload_rhdh_catalogsource_name: redhat-operators-snapshot-lightspeed
ocp4_days_workload_rhdh_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_days_workload_rhdh_catalog_snapshot_image_tag: v4.22_2026_09_14

# openshift-zero-trust-workload-identity-manager package is also absent from
# the live catalog. This role only exposes a boolean (no per-role
# catalogsource name/image/tag vars like the others above), so it falls back
# to install_operator's own catalogsource_* vars. Safe as a global default:
# every other role above passes its own explicit catalogsource_* vars at
# include time, which take precedence over these.
ocp4_days_workload_ztwim_use_catalog_snapshot: true
install_operator_catalogsource_name: redhat-operators-snapshot-lightspeed
install_operator_catalogsource_namespace: openshift-marketplace
install_operator_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
install_operator_catalogsource_image_tag: v4.22_2026_09_14

# -------------------------------------------------------------------
# OCP 5.0 testing: override the cluster component for dev only.
# common.yaml still points at the OCP4 item for prod. AgnosticV does
# not deep-merge lists, so the whole components list must be
# redefined here rather than patched.
# -------------------------------------------------------------------
__meta__:
  components:
  - name: openshift-base
    display_name: OpenShift 5 Cluster (CNV)
    item: agd-v2/ocp5-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '5.0'
      # hostpath-csi is node-local; 3 simultaneous control plane VMs exhaust available
      # PVs on the CNV sandbox, causing VolumeBinding timeout. Ceph RBD has no
      # node-locality constraint and schedules all 3 VMs without contention.
      ai_local_storageclass: ocs-storagecluster-ceph-rbd
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
