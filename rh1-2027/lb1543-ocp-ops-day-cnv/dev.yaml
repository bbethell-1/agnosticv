---
# Development stage marker.
# All former dev-only overrides (OCP5 cluster item, collections,
# Showroom v1.7.2 pins, catalog-drift channel/snapshot pins,
# ocp5_workload_ols, vendored ocp4_workload_prepare_hcp, litellm
# includes) have been promoted into common.yaml, which is now the
# shared baseline for both stages.

purpose: development

# TEST: common.yaml sets worker_instance_count/ai_workers_* but is missing
# the flag that actually gates host_ocp4_assisted_scale. Verify an extra
# worker is provisioned on dev before fixing common.yaml for all stages.
openshift_cnv_scale_cluster: true

# TEST: openshift_assisted_installer_icr.yaml sets ocp4_pull_secret to the
# literal sentinel "use_ai_pull_secret_instead" (only meant to satisfy an
# assert in ocp4-cluster). As a catalog extra-var it overrides the role's
# own ocp4_pull_secret -> ocp4_ai_pull_secret mapping, so Assisted
# Installer gets fed that sentinel string instead of real pull-secret
# JSON. Restore the correct mapping here.
ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"
