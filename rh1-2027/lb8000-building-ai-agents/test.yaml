---
# -------------------------------------------------------------------
# Test overrides — lb8000 Building AI Agents
# Pins showroom content to `test` branch so CI validates unmerged
# content before promotion.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.7.2
    - name: https://github.com/rhpds/ai_workloads.git
      type: git
      version: main

# -------------------------------------------------------------------
# Showroom — point to test branch
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: test

# -------------------------------------------------------------------
# GitOps — keep on main
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
