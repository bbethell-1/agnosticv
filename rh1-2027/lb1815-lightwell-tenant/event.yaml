---
# -------------------------------------------------------------------
# Release tags
# -------------------------------------------------------------------
# rhpds/namespaced_workloads and rhpds/core_workloads (via common.yaml `{{ tag }}`)
tag: lb1815-lightwell-0.0.2

# Lists replace rather than merge, so the full list is repeated here to pin
# rhpds.litellm_virtual_keys to its own release instead of `{{ tag }}`.
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: 1.3.2
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.8.0

# rhpds/lightwell-workshop (bootstrap-tenant GitOps source and Showroom content)
ocp4_workload_gitops_bootstrap_repo_revision: lb1815-lightwell-0.0.2
ocp4_workload_showroom_content_git_repo_ref: lb1815-lightwell-0.0.2

__meta__:
  sandboxes:
    - kind: OcpSandbox
      no_namespace: true
      tenant_cluster:
        item: rh1-2027/lb1815-lightwell-cluster
  deployer:
    # rhpds/agnosticd-v2
    scm_ref: lb1815-lightwell-0.0.2
