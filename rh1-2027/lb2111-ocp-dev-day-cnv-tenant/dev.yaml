---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: dev
__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
    scm_type: git
  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb2111-ocp-dev-day
      purpose: dev
    tenant_cluster:
      item: rh1-2027/lb2111-ocp-dev-day-cnv-cluster

# -------------------------------------------------------------------
# Override requirements_content for dev
# - dev-day-roadshow pinned to dev branch; uses #/automation/ansible
#   fragment because galaxy.yml lives in that subdirectory, not root
#   (same pattern as lb2076/ocp5-virt-rh1)
# - Other collections stay on main via {{ tag }}
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.2

  - name: https://github.com/rhpds/dev-day-roadshow.git#/automation/ansible
    type: git
    version: dev

# The GitOps repo to use for the DEV tenant
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/dev-day-roadshow.git
ocp4_workload_gitops_bootstrap_repo_revision: dev
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"

# Showroom content from dev branch
ocp4_workload_showroom_content_git_repo_ref: dev
