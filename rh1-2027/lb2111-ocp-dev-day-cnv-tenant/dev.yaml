---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: dev
__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
    scm_type: git
  catalog:
    parameters:
    - name: automation_repo_url
      description: "Ansible automation collection repository URL (include #/subdirectory for monorepos)"
      formLabel: "Automation Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/dev-day-roadshow.git#/automation/ansible
    - name: automation_tag
      description: "Ansible automation collection tag/branch"
      formLabel: "Automation Collection Ref"
      openAPIV3Schema:
        type: string
        default: dev
    - name: ocp4_workload_gitops_bootstrap_repo_url
      description: "GitOps bootstrap repository URL (tenant charts)"
      formLabel: "Bootstrap Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/dev-day-roadshow.git
    - name: ocp4_workload_gitops_bootstrap_repo_revision
      description: "GitOps tenant charts tag/branch"
      formLabel: "Tenant Charts Ref"
      openAPIV3Schema:
        type: string
        default: dev
    - name: ocp4_workload_showroom_content_git_repo
      description: "Showroom content repository URL"
      formLabel: "Showroom Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/dev-day-roadshow.git
    - name: ocp4_workload_showroom_content_git_repo_ref
      description: "Showroom content tag/branch"
      formLabel: "Showroom Content Ref"
      openAPIV3Schema:
        type: string
        default: dev

# -------------------------------------------------------------------
# Override requirements_content for dev
# - dev-day-roadshow uses automation_repo_url + automation_tag params
#   so devs can point at their own forks/branches at order time
# - Other collections stay on main via {{ tag }}
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.2

  - name: "{{ automation_repo_url }}"
    type: git
    version: "{{ automation_tag }}"

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.3.2"

# -------------------------------------------------------------------
# Map cluster_admin_agnosticd_sa_token from OcpSandbox-injected var
# (common.yaml references this but OcpSandbox injects sandbox_openshift_api_key)
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ sandbox_openshift_api_key }}"

# The GitOps repo to use for the DEV tenant
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
