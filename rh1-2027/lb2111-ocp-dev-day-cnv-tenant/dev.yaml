---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: dev
__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
    scm_type: git
  sandboxes:
  - kind: OcpSandbox
    alias: cluster
    namespace_suffix: user
    cloud_selector:
      lab: lb2111-ocp-dev-day
      purpose: dev

# The GitOps repo to use for the DEV tenant
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/dev-day-roadshow.git
ocp4_workload_gitops_bootstrap_repo_revision: dev
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
