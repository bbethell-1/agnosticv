      Product_Family: Red_Hat_Ansible
      Brand_Event: Red_Hat_One_2027
    # This item only provisions shared infrastructure.
    # It would not be appropriate to order a workshop of this item.
    workshopUiDisabled: false
  owners:
    maintainer:
      - email: rgarciac@redhat.com
        name: Ricardo Garcia
    instructions:
      - name: Ryan Laroy
        email: laroy@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
      pull: missing
