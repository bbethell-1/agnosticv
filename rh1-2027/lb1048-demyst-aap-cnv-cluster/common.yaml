---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Demystifying AAP on OpenShift — Cluster Provisioner
# ---              RH1 2027
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud provider — toggle between AWS and CNV by commenting/uncommenting
# -------------------------------------------------------------------
# Workers: 4 per cluster → ~40 tenants per cluster (1 scenario namespace per tenant at a time).
# Measured: ~3,675m CPU / ~7.9 Gi per tenant.
# Scale out by adding more clusters for prod. Register each cluster with ~40 placements.

# ── CNV ───────────────────────────────────────────────────────────
openshift_cnv_scale_cluster: true
worker_instance_count: 4
ai_workers_cores: 48
ai_workers_memory: 192Gi
worker_only: true
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Collection version pinning — override tag in dev/event/prod yaml
# -------------------------------------------------------------------
tag: main

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.7.2

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_ocp_console_embed

# ODF is handled by the base cluster component (ocp4_workload_external_odf) — do not re-install here.
# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# ===================================================================
# Installs Keycloak/RHBK operator + realm — zero users at cluster provision time
# Users are created per-order by the user provisioner

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_num_users: 0          # no users — created per order
ocp4_workload_authentication_keycloak_channel: stable-v26.4

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_openshift_gitops
# ===================================================================
ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# ===================================================================
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/demystifying-aap-on-openshift-rh1-2027
ocp4_workload_gitops_bootstrap_repo_revision: "{{ tag }}"
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-infra
ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra
ocp4_workload_gitops_bootstrap_application_wait: false

# -------------------------------------------------------------------
# Metadata
# -------------------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-ansiblebu
  asset_uuid: 2d346c44-38d3-45dd-a51b-f190b669dda9
  sandbox_host:
    annotations:
      cloud: cnv-dedicated-shared
      lab: lb1048-demystifying-aap
    max_cpu_usage_percentage: 90
    max_memory_usage_percentage: 85
    max_placements: 15
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.20"
        ocp4_fips_enable: false
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_cluster_admin_token
          var: cluster_admin_agnosticd_sa_token
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Demystifying AAP on OpenShift — Cluster Provisioner"
    category: Brand_Events
    reportingLabels:
      primaryBU: Automation
    keywords:
      - rh1-2027
      - ansible-automation-platform
      - gitops
