---
# -------------------------------------------------------------------
# Poll faster (5s vs 10s) and more times — exits as soon as ready,
# no functional change, safe for prod.
ocp4_workload_mattermost_wait_retries: 60
ocp4_workload_mattermost_wait_delay: 5

