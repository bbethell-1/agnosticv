# -------------------------------------------------------------------
# Workshop: agnosticd.cloud_vm_workloads.cnv_instances
# -------------------------------------------------------------------
# ------------------------------------------------------
# Instances
# ------------------------------------------------------
node_instance_image: rhel-9.6
node_rootfs_size: 50Gi
node_extra_disk_size: 40Gi

# cnv_instances role requires sandbox_openshift_apps_domain for Route host construction;
# in openshift-workloads config this is not set by the cloud provider phase, so alias it.
sandbox_openshift_apps_domain: "{{ openshift_cluster_ingress_domain }}"

# Give LoadBalancer services up to 5 minutes to get an IP (30 × 10s)
openshift_cnv_retries: 30
openshift_cnv_delay: 10

cnv_instances:
  - name: "node1"
    count: 1
    unique: true
    image: "{{ node_instance_image }}"
    cores: 2
    memory: 4G
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    disks:
      - metadata:
          name: "INSTANCENAME-data1-{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ node_extra_disk_size }}"
    userdata: |
      # Prevent cloud-init from expanding root to fill the disk.
      # runcmd below resizes root to ~20GB, leaving ~30GB unpartitioned.
      growpart:
        mode: off
      resize_rootfs: false
      users:
        - default
        - name: "{{ bastion_ansible_user }}"
          plain_text_passwd: "{{ common_host_password }}"
          lock_passwd: false
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
      password: "{{ common_host_password }}"
      chpasswd:
        expire: false
      ssh_pwauth: true
      runcmd:
        # Fix backup GPT header (still points to original image end, not 50G disk end)
        - sgdisk -e /dev/vda
        # Resize vda4 (root /) to end at 21GiB from disk start.
        # vda4 start = sector 2510848; 21GiB = 44040192 sectors; size = 41529344 sectors.
        # --no-reread writes to disk without asking kernel to reread (safe on mounted root).
        - echo "2510848 41529344" | sfdisk --no-reread -N 4 /dev/vda
        # partx -u uses BLKPG_RESIZE_PARTITION ioctl — works on in-use/mounted partitions.
        - partx -u /dev/vda4
        - xfs_growfs /
    services:
      - name: node1-fip
        type: LoadBalancer
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22

  - name: "node2"
    count: 1
    unique: true
    image: "{{ node_instance_image }}"
    cores: 2
    memory: 4G
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    disks:
      - metadata:
          name: "INSTANCENAME-data1-{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ node_extra_disk_size }}"

    userdata: |
      growpart:
        mode: off
      resize_rootfs: false
      users:
        - default
        - name: "{{ bastion_ansible_user }}"
          plain_text_passwd: "{{ common_host_password }}"
          lock_passwd: false
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
      password: "{{ common_host_password }}"
      chpasswd:
        expire: false
      ssh_pwauth: true
      runcmd:
        # Fix backup GPT header (still points to original image end, not 50G disk end)
        - sgdisk -e /dev/vda
        # Resize vda4 (root /) to end at 21GiB from disk start.
        # vda4 start = sector 2510848; 21GiB = 44040192 sectors; size = 41529344 sectors.
        # --no-reread writes to disk without asking kernel to reread (safe on mounted root).
        - echo "2510848 41529344" | sfdisk --no-reread -N 4 /dev/vda
        # partx -u uses BLKPG_RESIZE_PARTITION ioctl — works on in-use/mounted partitions.
        - partx -u /dev/vda4
        - xfs_growfs /
    services:
      - name: node2-fip
        type: LoadBalancer
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22

  - name: "node3"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    cores: 2
    memory: 4G
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    disks:
      - metadata:
          name: "INSTANCENAME-data1-{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ node_extra_disk_size }}"
    userdata: |
      growpart:
        mode: off
      resize_rootfs: false
      users:
        - default
        - name: "{{ bastion_ansible_user }}"
          plain_text_passwd: "{{ common_host_password }}"
          lock_passwd: false
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
      password: "{{ common_host_password }}"
      chpasswd:
        expire: false
      ssh_pwauth: true
      runcmd:
        # Fix backup GPT header (still points to original image end, not 50G disk end)
        - sgdisk -e /dev/vda
        # Resize vda4 (root /) to end at 21GiB from disk start.
        # vda4 start = sector 2510848; 21GiB = 44040192 sectors; size = 41529344 sectors.
        # --no-reread writes to disk without asking kernel to reread (safe on mounted root).
        - echo "2510848 41529344" | sfdisk --no-reread -N 4 /dev/vda
        # partx -u uses BLKPG_RESIZE_PARTITION ioctl — works on in-use/mounted partitions.
        - partx -u /dev/vda4
        - xfs_growfs /
    services:
      - name: node3-fip
        type: LoadBalancer
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22

# -------------------------------------------------------------------
# Workshop:
# rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
# Build model list based on checkbox selections
ocp4_workload_litellm_virtual_keys_models:
  - "{{ list_of_litellm_virtual_keys_models }}"
# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('3d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload:
# agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_admin_password }}"
ocp4_workload_ansible_automation_platform_disable_controller: false
ocp4_workload_ansible_automation_platform_disable_eda: false
ocp4_workload_ansible_automation_platform_disable_hub: false
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
ocp4_workload_ansible_automation_platform_disable_mcp: false
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader
ocp4_workload_ansible_automation_platform_hub_file_storage_file_class: ocs-external-storagecluster-cephfs
ocp4_workload_ansible_automation_platform_hub_file_storage_access_mode: ReadWriteMany
ocp4_workload_ansible_automation_platform_automatic_install_plan_approval: true
ocp4_workload_ansible_automation_platform_use_catalog_snapshot: false
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.7

# --------------------------------------------------------------------
# Workload: infra.aap_configuration.dispatch
# --------------------------------------------------------------------
aap_hostname: "{{ lookup('agnosticd.core.agnosticd_user_data', 'aap_controller_web_url') }}"
aap_username: admin
aap_password: "{{ ocp4_workload_ansible_automation_platform_admin_password }}"
aap_validate_certs: false

ansible_async_dir: /tmp/.ansible_async
aap_configuration_async_timeout: 3600
aap_configuration_async_retries: 120
aap_configuration_async_delay: 30
controller_dependency_check: false

aap_configuration_dispatcher_roles:
  - { role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - { role: controller_credential_types, var: controller_credential_types, tags: controller_credential_types }
  - { role: controller_credentials, var: controller_credentials, tags: controller_credentials }
  - { role: controller_inventories, var: controller_inventories, tags: controller_inventories }
  - { role: controller_hosts, var: controller_hosts, tags: controller_hosts }
gateway_settings:
  SESSION_COOKIE_AGE: 9000


controller_credential_types:
  - name: AO webhooks
    description: AO webhooks
    kind: cloud
    inputs:
      fields:
        - id: client_id
          type: string
          label: Client ID
        - id: client_secret
          type: string
          label: Client Secret
          secret: true
        - id: base_url
          type: string
          label: AO Base URL
      required:
        - client_id
        - client_secret
    injectors:
      env:
        AO_BASE_URL: '{  { base_url }}'
        AO_CLIENT_ID: '{  { client_id }}'
        AO_CLIENT_SECRET: '{  { client_secret }}'
      extra_vars:
        ao_base_url: '{  { base_url }}'
        ao_client_id: '{  { client_id }}'
        ao_client_secret: '{  { client_secret }}'

controller_credentials:
  - name: "Workshop Credential"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "{{ bastion_ansible_user }}"
      password: "{{ bastion_ansible_ssh_pass }}"
    state: present

controller_inventories:
  - name: "Demo Inventory"
    organization: Default
    state: present
  - name: "Workshop Inventory"
    organization: Default
    state: present

controller_hosts:
  - name: "bastion"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
    variables:
      ansible_host: "{{ bastion_ansible_host }}"
      ansible_port: "{{ bastion_ansible_port }}"
      ansible_user: "{{ bastion_ansible_user }}"
      ansible_password: "{{ bastion_ansible_ssh_pass }}"
  - name: "node1"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
    variables:
      ansible_host: "{{ lookup('agnosticd.core.agnosticd_user_data', 'node1_external_ip') }}"
      ansible_user: "{{ bastion_ansible_user }}"
      ansible_password: "{{ bastion_ansible_ssh_pass }}"
  - name: "node2"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
    variables:
      ansible_host: "{{ lookup('agnosticd.core.agnosticd_user_data', 'node2_external_ip') }}"
      ansible_user: "{{ bastion_ansible_user }}"
      ansible_password: "{{ bastion_ansible_ssh_pass }}"
  - name: "node3"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
    variables:
      ansible_host: "{{ lookup('agnosticd.core.agnosticd_user_data', 'node3_external_ip') }}"
      ansible_user: "{{ bastion_ansible_user }}"
      ansible_password: "{{ bastion_ansible_ssh_pass }}"

# -------------------------------------------------------------------
# Workload:
# intro_ao_workshop.automation.ocp4_workload_automation_orchestrator
# -------------------------------------------------------------------
ocp4_workload_automation_orchestrator_aap_hostname: >-
  {{ lookup('agnosticd.core.agnosticd_user_data', 'aap_controller_web_url') }}
ocp4_workload_automation_orchestrator_additional_allowed_hosts:
  - "aap-mcp-aap.{{ openshift_cluster_ingress_domain }}"
  - "openflake-mcp-openflake-mcp.{{ openshift_cluster_ingress_domain }}"
  - "lightspeed-mcp-lightspeed-mcp.{{ openshift_cluster_ingress_domain }}"

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  ssh_username: "{{ bastion_ansible_user }}"
  ssh_password: "{{ bastion_ansible_ssh_pass }}"
  ssh_address: "{{ bastion_ansible_host }}"
  ssh_port: "{{ bastion_ansible_port }}"
  ssh_command: >-
    ssh {{ bastion_ansible_user }}@{{ bastion_ansible_host }} -p {{ bastion_ansible_port }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/intro-ao-workshop.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml

# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

