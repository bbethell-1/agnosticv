# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_api_key }}"

# Set num_users for autoscale
num_users: 1

# ===================================================================
# End Mandatory Variables
# ===================================================================

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: false
worker_instance_count: 0
ai_workers_cores: 32
ai_workers_memory: 128Gi

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    # Core OpenShift Workloads
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      # version: "{{ tag }}"
      version: "cnv_instances"
    # AI Workloads
    - name: https://github.com/rhpds/ai_workloads.git
      type: git
      version: "{{ tag }}"
    # MaaS
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "1.3.2"
    # Showroom
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.7.2
    # Ansible Automation
    - name: https://github.com/rhpds/intro-ao-workshop.git#/automation/ansible
      type: git
      version: main

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: "{{ bastion_ansible_ssh_pass }}"
common_host_password: "{{ bastion_ansible_ssh_pass }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_gitea_operator
  - intro_ao_workshop.automation.ocp4_workload_mattermost
  - intro_ao_workshop.automation.ocp4_workload_splunk
  - intro_ao_workshop.automation.ocp4_workload_openflake_mcp
  - intro_ao_workshop.automation.ocp4_workload_lightspeed_mcp_server
  - agnosticd.cloud_vm_workloads.cnv_instances
  - agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
  - intro_ao_workshop.automation.ocp4_workload_cnv_node_info
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - infra.aap_configuration.dispatch
  - intro_ao_workshop.automation.ocp4_workload_automation_orchestrator
  - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.showroom.ocp4_workload_showroom

