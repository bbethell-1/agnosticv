---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
# -------------------------------------------------------------------
# OCP 5.0 testing: override the cluster component for dev only.
# common.yaml still points at the OCP4 item for prod. AgnosticV does
# not deep-merge lists, so the whole components list must be
# redefined here rather than patched — including propagate_provision_data.
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
    scm_type: git
  components:
  - name: openshift-base
    display_name: OpenShift 5 Cluster (CNV Pools)
    item: agd-v2/ocp5-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '5.0'
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
  sandbox_host:
    annotations:
      cloud: cnv-dedicated-shared
      lab: lb2111-ocp-dev-day
      purpose: dev

ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.22_2026_08_03

ocp4_workload_openshift_gitops_channel: gitops-1.21
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_authentication_keycloak_channel: stable-v26.6
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Allows the DEV cluster to deploy even if the child apps fail to sync/healthy
ocp4_workload_dev_days_rdshw_wait_for_apps_ignore_errors: true

# The GitOps repo to use for the DEV cluster
ocp4_workload_dev_days_rdshw_gitops_repo: https://github.com/rhpds/dev-day-roadshow.git
ocp4_workload_dev_days_rdshw_gitops_repo_tag: dev
