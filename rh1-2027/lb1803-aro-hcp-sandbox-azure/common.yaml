---
#include /includes/catalog-icon-azure.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/sandbox-api.yaml

# -----------------------------------------------------------------
# --- Catalog: Red Hat One 2027
# --- Catalog Item: ARO HCP Sandbox Workshop
# -----------------------------------------------------------------

platform: RHPDS

env_type: open-environment-azure-subscription

agnosticd_open_environment: true

cloud_provider: azure

azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"
azure_user_data:
  azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
  azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
  azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"
  azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
  guid: "{{ guid }}"
  common_password: "{{ common_password }}"
agnosticd_passthrough_user_data: |
  {{ azure_user_data }}

# ------------------------------------------------------
# Azure Properties
# ------------------------------------------------------
azure_deploy_bastion: true

rhel_sku: "9_3"

common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven
  - postgresql
  - httpd-tools

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the ARO HCP Sandbox Workshop!
  ---------------------------------------------------------------------------

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: "https://github.com/rhpds/aro-hcp-sandbox-workshop#/automation/ansible"
      type: git
    - name: "https://github.com/rhpds/agnosticd-v2#/ansible/collections/ansible_collections/agnosticd/core"
      type: git
      version: main
    - name: "https://github.com/agnosticd/showroom.git"
      type: git
      version: v1.7.2

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# Workload roles
# -------------------------------------------------------------------
infra_workloads:
  - aro_hcp_sandbox_workshop.automation.aro_hcp_cluster
  - aro_hcp_sandbox_workshop.automation.aro_hcp_keycloak_auth
  - aro_hcp_sandbox_workshop.automation.setup_bastion
  - agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: aro_hcp_cluster
# -------------------------------------------------------------------
aro_hcp_cluster_np_vm_size: Standard_D4s_v6
aro_hcp_cluster_np_replicas: 2

# -------------------------------------------------------------------
# Workload: aro_hcp_keycloak_auth
# -------------------------------------------------------------------
aro_hcp_keycloak_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/aro-hcp-sandbox-workshop.git
ocp4_workload_showroom_content_git_ref: main
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: a66a9c4d-1ea6-4e78-bf82-56287987a2df
  sandboxes:
    - kind: AzureSandbox
      cloud_selector:
        purpose: production
      var: azure_sandbox
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com
    instructions:
      - name: Gaurav Midha
        email: gmidha@redhat.com
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1803 — ARO HCP Sandbox Workshop"
    category: Workshops
    keywords:
      - azure
      - aro
      - hcp
      - lb1803
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Microsoft_Azure_Red_Hat_OpenShift
      Provider: RHDP
      Brand_Event: Red_Hat_One_2027
    parameters: []
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
    scm_ref: main
