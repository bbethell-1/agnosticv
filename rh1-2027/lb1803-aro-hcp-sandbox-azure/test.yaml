---
# -------------------------------------------------------------------
# Showroom content — point at the test branch
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_ref: test

# -------------------------------------------------------------------
# Collections — pin aro-hcp-sandbox-workshop to test branch
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: "https://github.com/rhpds/aro-hcp-sandbox-workshop#/automation/ansible"
      type: git
      version: test
    - name: "https://github.com/rhpds/agnosticd-v2#/ansible/collections/ansible_collections/agnosticd/core"
      type: git
      version: main
    - name: "https://github.com/agnosticd/showroom.git"
      type: git
      version: v1.7.2

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
    - kind: AzureSandbox
      cloud_selector:
        purpose: production
      var: azure_sandbox
  deployer:
    scm_ref: development
