ocp4_workload_virt_roadshow_fvmw_vcenter_user_password: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          32366565636537643566623734366534363433306237613435323063363863383232343665623736
          3439656538636364356363613130363930623637396662300a636333646430323062653235306363
          36333037613136633263613531373535663563366435316366303131613961626533323162306332
          3865336531643334340a653361356632386465393135643732346366656364653133336239386236
