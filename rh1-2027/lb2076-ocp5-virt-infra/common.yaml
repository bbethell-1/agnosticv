# -------------------------------------------------------------------
# ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_multi_user
# -------------------------------------------------------------------
# CNV manages the virtualization console UI-settings ConfigMaps
# in the openshift-cnv namespace.
# The role still defaults to `default`, hence this override.
ocp4_workload_virt_roadshow_multi_user_configmap_namespace: openshift-cnv

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: true
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"
ocp4_workload_virt_network_config_bridge_type: linux-bridge
ocp4_workload_virt_network_config_bridge_name: br-flat

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp5-virt-rh1
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_terminal_type: ""

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b74340a3-5197-45ca-b1ca-38fa0ece658e
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    sme:
    - name: Alberto Gonzalez Rodriguez
      email: arodriguez@redhat.com
    instructions:
    - name: Alan Cowles
      email: acowles@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07

  catalog:
    display_name: "LB2076: OpenShift 5 Virtualization Lab"
    category: Brand_Events
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    workshopLabUiRedirect: true
    workshopUiMaxInstances: 4 #allows up to 80 users if not deployed via admins
    workshopUiEnabledByDefault: true
    parameters:
    - name: num_users
      description: >-
        This specifies the number of individual users to provision within EACH OpenShift cluster you deploy.
        Each cluster supports a maximum of 20 users.

        **Advisory**: If you have "Enable workshop use" toggled on, we strongly recommend
        setting this to 20 for optimal resource utilization.
      formLabel: 'OpenShift User Count (Workshop Recommended: 20)'
      openAPIV3Schema:
        type: integer
        default: 20
        minimum: 2
        maximum: 20
    keywords:
    - rh1-2027
    - lb2076
    - cnv
    - cnvocp
    - ocpcnv
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms

  components:
  - name: openshift
    display_name: OpenShift Cluster (CNV)
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.21"
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    # Required by openshift_cnv_scale_cluster (host_ocp4_assisted_scale)
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    # Host CNV cluster name + apps domain (exported by the pool because it
    # sets openshift_cnv_set_sandbox_provision_data: true). Needed by
    # fvmw_hostname (vcenter.apps.<cluster>.rhdp.net).
    - name: sandbox_openshift_cluster
      var: sandbox_openshift_cluster
    - name: sandbox_openshift_apps_domain
      var: sandbox_openshift_apps_domain

  tower:
    timeout: 21600
