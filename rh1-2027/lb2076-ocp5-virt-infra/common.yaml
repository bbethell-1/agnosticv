---
# ===================================================================
# Catalog Item: LB2076 - OpenShift 5 Virtualization Lab
#
# Migrated from AgnosticD v1 (self-installing OCP via assisted-installer
# with a flat `infra_workloads` list) to AgnosticD v2.
#
# The OpenShift cluster is now provided PRE-PROVISIONED from a CNV pool
# (agd-v2/ocp-cluster-cnv-pools, see __meta__.components). That pool
# already installs External ODF (Ceph + NooBaa) and cert-manager
# (with dynamic-dns + acme certs), so this config:
#   - sets cloud_provider: none and config: openshift-workloads
#   - connects to the pool cluster via `clusters:`
#   - scales workers with openshift_cnv_scale_cluster
#   - only deploys the workloads that sit ON TOP of the base cluster
#
# Dropped vs v1 (now provided by the pool):
#   - ocp4_workload_external_odf
#   - ocp4_workload_cert_manager
#   - the self-install bastion/networking, OcpSandbox/DNSSandbox/SSLSandbox
#
# Roles not (yet) available in AgnosticD v2 are carried in this project's
# own collection `ocp5_virt_rh1.automation` (repo rhpds/ocp5-virt-rh1,
# collection at automation/ansible):
#   - ocp4_workload_oadp_gitops
#   - ocp4_workload_virt_roadshow_vms
#   - ocp4_workload_virt_roadshow_fvmw
#   - ocp4_workload_virt_roadshow_multi_user
#
# NOTE:
#   * Operator versions are kept on LIVE channels with pinned starting_csv
#     (faithful port of the v1 CI). Switching to the shared catalog snapshot
#     (ocp4_workload_catalogsource_image/tag) is deferred: a snapshot tag would
#     first need to be verified to contain the pinned CSVs.
# ===================================================================

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml

#include /includes/sandbox-api.yaml
#include /includes/agd-v2-mapping.yaml

#include /includes/parameters/purpose.yaml

# Required by openshift_cnv_scale_cluster (host_ocp4_assisted_scale)
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# AgnosticD v2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_assisted_installer: v0.0.9
tag_showroom: v1.7.2
tag_ocp5_virt_rh1: main

# -------------------------------------------------------------------
# CNV Worker Nodes
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"

ai_workers_cores: 16
ai_workers_memory: '64Gi'

ai_attach_workers_networks:
- default/flatnetwork

# -------------------------------------------------------------------
# Collections & roles installed for this config
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Required by openshift_cnv_scale_cluster (host_ocp4_assisted_scale)
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: "{{ tag_assisted_installer }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"
  # This project's roles carried over from v1 (ocp5_virt_rh1.automation.*)
  # Collection lives in the automation/ansible subdirectory of the repo.
  - name: https://github.com/rhpds/ocp5-virt-rh1.git#/automation/ansible
    type: git
    version: "{{ tag_ocp5_virt_rh1 }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_mtv
- ocp5_virt_rh1.automation.ocp4_workload_oadp_gitops
- agnosticd.core_workloads.ocp4_workload_nmstate
- ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_vms
- ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_fvmw
- ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_multi_user
- agnosticd.core_workloads.ocp4_workload_virt_network_config
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
- ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_fvmw

# ===================================================================
# Workload variables
# ===================================================================

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: htpasswd
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: ""
ocp4_workload_authentication_user_basename: user
ocp4_workload_authentication_user_password: ""
ocp4_workload_authentication_num_users: "{{ num_users | default(1) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_update_route_tls: false
ocp4_workload_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
# Use PVCs for KubeVirt boot images (v1 var was misspelled "shapshot")
ocp4_workload_openshift_virtualization_boot_sources_snapshot: false
ocp4_workload_openshift_virtualization_automatic_install_plan_approval: false
ocp4_workload_openshift_virtualization_starting_csv: "kubevirt-hyperconverged-operator.v4.21.1"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.11
ocp4_workload_mtv_automatic_install_plan_approval: false
ocp4_workload_mtv_starting_csv: "mtv-operator.v2.11.4"
ocp4_workload_mtv_max_vm_inflight: "{{ [(num_users | int * 3) | int, 40] | min }}"
ocp4_workload_mtv_forklift_controller_container_limits_cpu: "{{ [(num_users | int * 100) | int, 1000] | max }}m"
ocp4_workload_mtv_forklift_controller_container_limits_memory: "{{ [(num_users | int * 400) | int, 2000] | max }}Mi"

# -------------------------------------------------------------------
# ocp5_virt_rh1.automation.ocp4_workload_oadp_gitops
# -------------------------------------------------------------------
ocp4_workload_oadp_gitops_channel: stable
ocp4_workload_oadp_gitops_use_catalog_snapshot: false

# Multi User
ocp4_workload_oadp_gitops_multi_user: true
ocp4_workload_oadp_gitops_num_users: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_oadp_gitops_user_base: "{{ ocp4_workload_authentication_user_basename }}"
ocp4_workload_oadp_gitops_namespace_base: oadp
ocp4_workload_oadp_gitops_configure_dpa: true
ocp4_workload_oadp_gitops_storage: odf
# External ODF (pool provides external Ceph): the StorageCluster is
# ocs-external-storagecluster, so the RBD snapshot class carries the
# "external" prefix (the role default ocs-storagecluster-... does not exist here).
ocp4_workload_oadp_gitops_volumesnapshotclass: ocs-external-storagecluster-rbdplugin-snapclass

# -------------------------------------------------------------------
# ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_vms
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vms_num_users: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_virt_roadshow_vms_base_namespace: vmimported-
ocp4_workload_virt_roadshow_vms_userbase: "{{ ocp4_workload_authentication_user_basename }}"
ocp4_workload_virt_roadshow_vms_start_vms: false
# When set to true (default) then the application made up from the VMs will not
# work until instructions are followed.
# When false the application will work out of the box without changes
ocp4_workload_virt_roadshow_vms_roadshow_setup: true
ocp4_workload_virt_roadshow_vms_imported_configure_svc_and_route: false

# -------------------------------------------------------------------
# ocp5_virt_rh1.automation.ocp4_workload_virt_roadshow_fvmw
# -------------------------------------------------------------------
fvmw_hostname: "vcenter.apps.{{ sandbox_openshift_cluster }}.rhdp.net"

ocp4_workload_virt_roadshow_fvmw_datastore: workload_share
ocp4_workload_virt_roadshow_fvmw_num_users: "{{ ocp4_workload_authentication_num_users }}"
