# -------------------------------------------------------------------
# --- Catalog Item: LB1898 - OpenShift Virtualization Troubleshooting (Tenant)
#
# JIRA: RHDPCD-1470
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: namespace
openshift_api_url: "{{ sandbox_openshift_api_url }}"
cluster_admin_agnosticd_sa_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_showroom: v1.7.2
ansible_repo_revision: main
showroom_repo_revision: main

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"
  - name: https://github.com/rhpds/openshift-4-virt-troubleshooting#/automation/ansible
    type: git
    version: "{{ ansible_repo_revision }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_quay
- openshift_4_virt_troubleshooting.automation.bootstrap_tenant
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_username: "user-{{ guid }}"
ocp4_workload_user_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

# Quota math (20 concurrent tenants on the -cluster item's 3x16vCPU/64Gi
# dedicated workers, minus cluster-wide operator overhead -- KubeVirt,
# OpenShift GitOps, cert-manager, NMState, Keycloak, external-ODF client):
#   ~41.6 vCPU / ~179Gi remain for tenants -> ~2 vCPU / ~9Gi each.
# requests are the even split; limits use a 2x CPU / 1.5x memory
# overcommit (CPU contention only throttles, memory contention OOM-kills,
# so memory stays more conservative). See conversation history for the
# full worked calculation.
ocp4_workload_tenant_namespace_default_quota:
  requests.cpu: "2"
  limits.cpu: "4"
  requests.memory: 8Gi
  limits.memory: 12Gi
  requests.storage: 20Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 3Gi
  defaultRequest:
    cpu: 250m
    memory: 512Mi

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_quay
# -------------------------------------------------------------------
ocp4_workload_tenant_quay_user: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_quay_user_password: "{{ ocp4_workload_user_password }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-4-virt-troubleshooting
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

# -------------------------------------------------------------------
# openshift_4_virt_troubleshooting.automation.bootstrap_tenant
# -------------------------------------------------------------------
bootstrap_tenant_username: "{{ ocp4_workload_username }}"

