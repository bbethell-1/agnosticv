---

ocp4_workload_gitops_bootstrap_health_retries: 2

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "10"
  requests.cpu: "6"
  limits.memory: 32Gi
  requests.memory: 16Gi
  requests.storage: 200Gi

__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: ansible_repo_revision
      description: Ansible Repository Revision
      formLabel: Ansible Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
