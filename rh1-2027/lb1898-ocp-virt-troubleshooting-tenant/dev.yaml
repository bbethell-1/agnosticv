---

ocp4_workload_gitops_bootstrap_health_retries: 2

__meta__:
  access_control:
    allow_groups:
    - rhpds-devs
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: ansible_repo_revision
      description: Ansible Repository Revision
      formLabel: Ansible Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb1898-ocp-virt-troubleshooting
      purpose: dev
