---
# ACME Bifrost to use sandbox-api SSLSandbox information
ocp4_workload_cert_manager_acme_bifrost_webhook_image: "quay.io/rhpds/acme-bifrost-webhook:v0.2.28"
ocp4_workload_cert_manager_cloud_provider: "ddns"
_ssl_sandbox_credentials: "{{ ssl_sandbox.credentials[0] }}"
ocp4_workload_cert_manager_acme_bifrost_ca_provider: "{{ _ssl_sandbox_credentials.main_provider }}"
ocp4_workload_cert_manager_acme_url: "{{ _ssl_sandbox_credentials.main_provider_url }}"
ocp4_workload_cert_manager_acme_bifrost_gateway_url: "{{ _ssl_sandbox_credentials.gateway }}"
ocp4_workload_cert_manager_provider: "acme-bifrost"
ocp4_workload_cert_manager_provider_fallback: "acme-bifrost"
ocp4_workload_cert_manager_acme_bifrost_ca_provider_fallback: "{{ _ssl_sandbox_credentials.fallback_provider }}"
ocp4_workload_cert_manager_acme_url_fallback: "{{ _ssl_sandbox_credentials.fallback_provider_url }}"
ocp4_workload_cert_manager_acme_bifrost_webhook_kid: "{{ _ssl_sandbox_credentials.kid }}"
ocp4_workload_cert_manager_acme_bifrost_webhook_secret: "{{ _ssl_sandbox_credentials.secret }}"
