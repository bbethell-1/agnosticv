# @owner: UNKNOWN - copied from rhpds/zt-ansiblebu-agnosticv's own
#   includes/secrets/ansiblebu_password.yaml (same file, same vault ID,
#   different repo); true owner is whoever maintains that repo's secrets
# @purpose: OS password for the "rhel" user baked into every Ansible BU
#   Zero Touch content repo's own CNV VM cloud-init userdata
#   (user: rhel / password: ansible123!) - not a dynamically-generated
#   secret, a fixed convention every real Ansible BU lab image already
#   bakes in at build time
# @impact: LOW - test/demo sandbox VMs only, no customer data, revocable
#   by rebuilding the lab images; publicly visible in plaintext anyway in
#   every Ansible BU content repo's own config/instances.yaml (e.g.
#   https://github.com/rhpds/zt-ans-bu-eda-netbox/blob/main/config/instances.yaml)
# @expiration: never
# @rotation: static convention baked into VM images at build time - rebuild
#   the affected lab image(s) with a new baked-in password; rotate the
#   vaulted copy in rhpds/zt-ansiblebu-agnosticv first (source of truth),
#   then re-copy the still-encrypted blob here
# @source: https://github.com/rhpds/zt-ansiblebu-agnosticv/blob/main/includes/secrets/ansiblebu_password.yaml
# @exposure: AgnosticD execution + rendered into _showroom_user_data for
#   the Nookbag/showroom UI (e.g. IronRDP tab, bastion SSH display) -
#   same exposure as v1's own usage of this same secret
ansiblebu_rhel_password: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          61353830623063383861373230643935323162373931643262653834636665626539313463646161
          3835313361343064613335613465666631373131306666310a356139643338613563333834376561
          38363938323731383163353532343663666164626164626466343162326463303531633265313435
          3162656566323034300a656434633931333833323137323866376233363930373335613363373534
          6231

