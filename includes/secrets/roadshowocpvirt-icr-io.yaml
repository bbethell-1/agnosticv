## this docker config allows access to IBM's container registry
# via the IBM Cloud API key associated with IBM service ID 'roadshow-ocpvirt-id'
# in https://cloud.ibm.com/iam/serviceids/ServiceId-fcb2935e-63e4-4777-a3b7-3396916ea6b9?tab=groups
# called 'roadshow-ocpvirt-key'
# Creds are in bitwarden
#
# use this with a secret as follows to access the icr.io registry read-only
# assigned to IBM Service ID: roadshow-ocpvirt-id
# assigned to IBM Service Key: roadshow-ocpvirt-key

# Example:
# ---
# apiVersion: v1
# data:
#   .dockerconfigjson: {{ roadshowocpvirt_icr_io_secret_dockercfg }}
# kind: Secret
# metadata:
#   name: roadshow-ocpvirt-id
# type: kubernetes.io/dockerconfigjson

# To create or get a VDDK image, indicate the registry and image here
# this role only checks the domain name of the registry to authenticate.
# It then pulls the image based on full value of ocp4_workload_virt_roadshow_vmware_vddk_registry
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"
# or for building the image locally, unreliable:
# ocp4_workload_virt_roadshow_vmware_vddk_registry: image-registry.openshift-image-registry.svc:5000/openshift/vddk:latest

