---
_dns_sandbox_credentials: "{{ dns_sandbox.credentials[0] }}"
cluster_dns_server: "{{ _dns_sandbox_credentials.server }}"
cluster_dns_zone: "{{ _dns_sandbox_credentials.zone }}"
ddns_key_name: "{{ _dns_sandbox_credentials.name }}"
ddns_key_secret: "{{ _dns_sandbox_credentials.secret }}"

# Unset route53 variables to avoid conflicts
base_domain: "{{ undef() }}"
route53_zone: "{{ undef() }}"
route53_aws_zone_id: "{{ undef() }}"
route53_aws_access_key_id: "{{ undef() }}"
route53_aws_secret_access_key: "{{ undef() }}"
