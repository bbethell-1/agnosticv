# Copy this block above EACH vault-encrypted variable in your secret file.
# All 7 fields are mandatory. See docs/2026-07-23-secret-documentation-design.md
#
# @owner: Your Name <your.email@redhat.com>
# @purpose: What this credential does (one line)
# @impact: HIGH|MEDIUM|LOW - what happens if this credential leaks
# @expiration: YYYY-MM-DD or "never"
# @rotation: How to rotate or renew this credential
# @source: URL or description of where this credential was created
# @exposure: Where the decrypted value ends up at runtime (e.g., "AgnosticD execution only", "OpenShift Secret in namespace")
#
# Impact levels:
#   HIGH   - production resources, customer data, broad external access
#   MEDIUM - dev/staging, internal-only, limited blast radius
#   LOW    - easily revokable, no customer data, test-only
#
# Any field can be set to UNKNOWN if you don't know the answer.
# This is better than guessing — it flags the field for future investigation.
#
# Example:
#
# @owner: Guillaume Core <gucore@redhat.com>, Alberto <alberto@redhat.com>
# @purpose: OAuth token for Quay.io org-admin API access
# @impact: HIGH - leaked token grants full org admin on quay.io/rhpds
# @expiration: 2027-01-15
# @rotation: Regenerate in quay.io org settings > Applications > rhpds-sandbox
# @source: https://quay.io/organization/rhpds?tab=applications
# @exposure: AgnosticD execution only, not persisted
# my_secret: !vault |
#   $ANSIBLE_VAULT;1.2;AES256;gpte-vault-0
#   ...
