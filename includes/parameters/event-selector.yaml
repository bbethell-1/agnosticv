---
__meta__:
  catalog:
    parameters:
      - name: platform
        description: Event Name
        formLabel: Event Name
        required: true
        openAPIV3Schema:
          type: string
          enum:
            - rhte-2023-na
            - rhte-2023-emea
            - rhte-2023-apac
            - rhte-2023-latam
      - name: purpose
        description: Purpose for this service.
        formLabel: Purpose
        required: true
        # Record purpose as an annotation
        annotation: pfe.redhat.com/purpose
        openAPIV3Schema:
          type: string
          enum:
            - Production - Event
            - Development - Event catalog item creation / maintenance
