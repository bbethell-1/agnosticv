---
__meta__:
  lifespan:
    default: 7d
    maximum: 14d
    relativeMaximum: 30d
  runtime:
    default: 5d
    maximum: 14d
  # Do not stop anything for event usage with deployer
  deployer:
    actions:
      stop:
        disable: true
  # Also do not stop anything for event usage with sandbox api
  sandbox_api:
    actions:
      stop:
        enable: false
      start:
        enable: true
