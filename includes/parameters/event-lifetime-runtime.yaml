---
__meta__:
  catalog:
    parameters:
      - name: event_usage
        description: >-
          Select "workshop" if deploying as a workshop for a scheduled lab at RH1.
        formLabel: Self-service or in-person workshop?
        openAPIV3Schema:
          type: string
          default: self-service
          enum:
            - self-service
            - workshop
  lifespan:
    default: 7d
    maximum: 14d
    relativeMaximum: 30d
  runtime:
    default: 5d
    maximum: 14d
  deployer:
    actions:
      stop:
        # This should let sandbox-api handle stopping
        disable: true
  # Auto stop instances using the sandbox API
  sandbox_api:
    actions:
      stop:
        enable: false
      start:
        enable: true
