---
__meta__:
  lifespan:
    default: 7d
    maximum: 14d
    relativeMaximum: 30d
  runtime:
    default: 5d
    maximum: 14d
  deployer:
    actions:
      stop:
        # This should let sandbox-api handle stopping
        disable: true
  # Auto stop instances using the sandbox API
  sandbox_api:
    actions:
      stop:
        enable: false
      start:
        enable: true
