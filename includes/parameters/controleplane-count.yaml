---
__meta__:
  catalog:
    parameters:
      - name: master_instance_count
        description: Control Plane Count
        formLabel: Control Plane Count
        required: true
        openAPIV3Schema:
          type: integer
          default: 1
          maximum: 3
        validation: >-
          master_instance_count == 1 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than one requires a valid SalesForceID.')
