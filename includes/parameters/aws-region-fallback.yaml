---
__meta__:
  catalog:
    parameters:
      - name: aws_region_from_param
        description: >-
          AWS Region to Provision Environment.
          'any' means it'll loop on all regions until there is capacity.
          Regions are: us-east-1, us-east-2, us-west-1, us-west-2, ca-central-1, eu-central-1, eu-north-1, eu-south-2, eu-west-3, eu-west-2, eu-west-1, ap-northeast-1, ap-northeast-2, ap-northeast-3, ap-south-1, ap-southeast-1, ap-southeast-2, ap-southeast-4, sa-east-1
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: any
          enum:
            - any
            - na
            - emea
            - apac


# Those are all the regions allowed for AWS sandboxes
aws_region_from_param_any:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - ca-central-1
  - eu-central-1
  - eu-north-1
  - eu-west-3
  - eu-west-2
  - eu-west-1
  - ap-northeast-1
  - ap-northeast-2
  - ap-northeast-3
  - ap-south-1
  - ap-southeast-1
  - ap-southeast-2
  - sa-east-1

aws_region_from_param_na:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - ca-central-1

aws_region_from_param_emea:
  - eu-central-1
  - eu-north-1
  - eu-west-3
  - eu-west-2
  - eu-west-1

aws_region_from_param_apac:
  - ap-northeast-1
  - ap-northeast-2
  - ap-northeast-3
  - ap-south-1
  - ap-southeast-1
  - ap-southeast-2

agnosticd_aws_capacity_reservation_regions: >-
  {{
  aws_region_from_param_na if aws_region_from_param == 'na' else
  aws_region_from_param_emea if aws_region_from_param == 'emea' else
  aws_region_from_param_apac if aws_region_from_param == 'apac' else
  aws_region_from_param_any
  }}

# Setting variables that should preserve user data for deletion
agnosticd_aws_capacity_reservation_enable: true
agnosticd_preserve_user_data: true
