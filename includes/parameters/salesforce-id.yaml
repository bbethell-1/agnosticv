---
__meta__:
  catalog:
    parameters:
      - name: salesforce_id
        description: Salesforce Opportunity ID, Campaign ID, or Partner Registration
        formLabel: Salesforce ID
        required: true
        annotation: pfe.redhat.com/salesforce-id
        validation: check_salesforce_id(salesforce_id)
        openAPIV3Schema:
          type: string
          formDisableCondition: >-
            user_count == 1 &&
            user_is_admin ||
            user_groups.includes('rhpds-devs') ||
            purpose.startsWith("Development - ") ||
            purpose.startsWith("Training - ")
            Error('Valid Salesforce ID required for all Customer Facing Events or User Count greater than 1')
