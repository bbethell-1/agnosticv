---
__meta__:
  catalog:
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: eu-west-1
          enum:
            - us-east-2
            - ap-southeast-1
            - eu-west-1
            - eu-west-3
        validation: >-
          aws_region_validation_override ||
          aws_region == 'ap-southeast-1' ||
          aws_region == 'eu-west-1' ||
          Error('There is currently an issue with certain services (S3) with AWS globally. As a workaround please try other regions "ap-southeast-1", "eu-west-1"')
      - name: aws_region_validation_override
        description: Override aws region validation failure.
        annotation: demo.redhat.com/aws_region_validation_override
        formGroup: Region validation override
        formLabel: Ignore validation failure
        formHideCondition: >-
          !(user_is_admin || user_groups.includes('rhpds-devs'))
        openAPIV3Schema:
          type: boolean
          default: false
