---
# LiteLLM User Metadata Parameters
# This include provides standardized user identification and catalog tracking
# for LiteLLM virtual keys workloads.
#
# Variables set:
# - requester_email: User's email address for key ownership tracking
# - catalog_item_name: Catalog item name for usage attribution
#
# Usage in catalog:
#   includes:
#     - includes/parameters/litellm_metadata.yaml
#
__meta__:
  catalog:
    requester_parameters:
      - name: requester_email
        value: >-
          {{ requester_identity.extra.email
           | default(resource_claim.metadata.annotations['babylon.gpte.redhat.com/requester-email'])
           | default(resource_claim.metadata.annotations['babylon.gpte.redhat.com/requester'] | replace('-', '@', 1))
           | default('')
          }}
      - name: catalog_item_name
        value: >-
          {{ resource_claim.metadata.labels['babylon.gpte.redhat.com/catalogItemName']
           | default('unknown')
          }}
