---
email: >-
  {{ requester_email |
   default(
     requester_username if '@' in requester_username else requester_username | replace('@', '-', 1),
     true
   )
  }}

agnosticv_meta:
  params_to_variables:
    email: requester_email

__meta__:
  catalog:
    requester_parameters:
    - name: requester_email
      value: "{{ requester_identity.extra.email | default('') }}"
