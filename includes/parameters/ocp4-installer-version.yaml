---
__meta__:
  catalog:
    parameters:
      - name: ocp4_installer_version
        description: |
          Version of OpenShift to Install. **Note for 4.18 & 4.19** Do not stop/hibernate the cluster for at least 48 hours after deployment.
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.20'
          enum:
            - '4.14'
            - '4.15'
            - '4.16'
            - '4.17'
            - '4.18'
            - '4.19'
            - '4.20'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version
