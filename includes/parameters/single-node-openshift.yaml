---
#
# User is asked for single node OpenShift, which configures the
# worker_instance_count.
#
master_instance_count: "{{ 1 if single_node_openshift | bool else 3 }}"
worker_instance_count: 0

__meta__:
  catalog:
    parameters:
    - name: single_node_openshift
      description: Single Node OpenShift
      formGroup: Single Node OpenShift
      formLabel: Enable
      openAPIV3Schema:
        type: boolean
        default: true
      validation: >-
        single_node_openshift ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('A valid SalesForceID is required to disable Single Node Openshift.')
