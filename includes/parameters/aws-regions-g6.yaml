---
__meta__:
  catalog:
    parameters:
      - name: aws_region
        description: >-
          Select the AWS Region for provisioning. Note: This demo requires g6
          instances. For best availability, please select us-east-1 or us-east-2.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-1
          enum:
            - us-east-1
            - us-west-2
            - us-east-2
            - eu-central-1
            - ap-northeast-1
