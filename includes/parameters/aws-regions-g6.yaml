---
__meta__:
  catalog:
    parameters:
      - name: aws_region_from_param
        description: >-
          AWS Region for G6 instance provisioning.
          Only regions with G6 (NVIDIA L4) availability are listed.
          Regions are: us-east-1, us-east-2, us-west-2, ca-central-1, eu-central-1, eu-north-1, eu-west-2, eu-west-3, ap-northeast-1, ap-northeast-2, ap-south-1, ap-southeast-2
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: na
          enum:
            - na
            - emea
            - apac

aws_region_from_param_na:
  - us-east-1
  - us-east-2
  - us-west-2
  - ca-central-1

aws_region_from_param_emea:
  - eu-central-1
  - eu-north-1
  - eu-west-2
  - eu-west-3

aws_region_from_param_apac:
  - ap-northeast-1
  - ap-northeast-2
  - ap-south-1
  - ap-southeast-2

agnosticd_aws_capacity_reservation_regions: >-
  {{
  aws_region_from_param_na if aws_region_from_param == 'na' else
  aws_region_from_param_emea if aws_region_from_param == 'emea' else
  aws_region_from_param_apac
  }}

agnosticd_aws_capacity_reservation_enable: true
agnosticd_preserve_user_data: true
