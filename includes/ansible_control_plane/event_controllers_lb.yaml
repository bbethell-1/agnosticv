---
__meta__:
  ansible_control_plane:
    type: controller
  ansible_controller_select_mode: random
  ansible_controllers:
  - hostname: event0.apps.ocpv-infra01.dal12.infra.demo.redhat.com
  - hostname: event1.apps.ocpv-infra02.wdc07.infra.demo.redhat.com
  tower:
    maximum_job_count: 250
    organization: RHPDS
  deployer:
    actions:
      provision:
        ansible_control_plane:
          instance_groups:
          - provision
      destroy:
        ansible_control_plane:
          instance_groups:
          - destroy
      start:
        ansible_control_plane:
          instance_groups:
          - start
      stop:
        ansible_control_plane:
          instance_groups:
          - stop
      status:
        ansible_control_plane:
          instance_groups:
          - status
