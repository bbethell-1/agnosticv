---
cloud_provider: ec2

# Set custom output dir used by provisioner
output_dir: "/runner/project/provisioner/{{ guid }}"

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: example.opentlc.com

# region where the nodes will live
ec2_region: "{{ aws_region }}"

# name prefix for all the VMs
ec2_name_prefix: "{{ guid }}"

# creates student_total of workbenches for the workshop
student_total: "{{ num_users }}"

# turn DNS on for control nodes, and set to type in valid_dns_type
dns_type: aws

# password for Ansible control node
admin_password: >-
  {{ lookup("ansible.builtin.password", "/tmp/admin_password chars=ascii_lowercase,digits length=8") }}

# automatically installs Tower to control node
controllerinstall: true

# SHA value of targeted AAP bundle setup files.
provided_sha_value: ea2843fae672274cb1b32447c9a54c627aa5bdf5577d9a6c7f957efe68be8c01

# Automation controller install setup command. Default: "./setup.sh -e gpgcheck=0" if undefined or empty
controller_install_command: './setup.sh -e gpgcheck=0'
# default vars for ec2 AMIs (ec2_info) are located in provisioner/roles/manage_ec2_instances/defaults/main/main.yml
# select ec2_info AMI vars can be overwritten via ec2_xtra vars, e.g.:
ec2_xtra:
  satellite:
    owners: 012345678910
    filter: Satellite*
    username: ec2-user
    os_type: linux
    size: r5b.2xlarge

# Registry name to download execution environments
ee_registry_name: registry.redhat.io

# List of execution environments to download during controller installation:
ee_images:
  - "{{ ee_registry_name }}/ansible-automation-platform-21/ee-29-rhel8:latest"
  - "{{ ee_registry_name }}/ee-supported-rhel8:latest"
  - "{{ ee_registry_name }}/ansible-automation-platform-21/ee-minimal-rhel8:latest"

# "Default execution environment" for controller
ee_default_image: "{{ ee_registry_name }}/ee-supported-rhel8:latest"

# Enable user.info output for RHPDS
rhpds_info_output: true

##########################
# Babylon meta variables #
##########################
__meta__:
  anarchy:
    namespace: babylon-anarchy-aap2-workshop
  aws_sandboxed: false
  tower:
    organization: RHPDS

  deployer:
    type: ansible-workshops
    scm_url: https://github.com/redhat-gpe/workshops.git
    actions:
      provision:
        entry_point: provisioner/provision_lab.yml
      destroy:
        entry_point: provisioner/teardown_lab.yml
      start:
        disable: true
      stop:
        disable: true
      status:
        disable: true
      update:
        disable: true
    execution_environment:
      name: aap2-workshop

  ansible_control_plane:
    type: controller
    secret: babylon-aap2-controller-on-azure

  secrets:
    - namespace: gpte
      name: aap2-workshop
