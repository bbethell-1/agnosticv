---
#include /includes/catalog-icon-rhibm.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/access-restriction-devs-only.yaml

cloud_provider: none
config: minimal

agnosticd_passthrough_user_data:
  ibmcloud_resource_group_name: "{{ ibmcloud_resource_group_name }}"
  ibmcloud_api_key: "{{ ibmcloud_api_key }}"

test_empty_config_passthrough_per_user_data: "{{ agnosticd_passthrough_user_data }}"
requirements_content:
  collections:
    - name: https://github.com/rhpds/ibm_workloads.git
      type: git
      version: ibm_instructlab_service

workloads:
  - rhpds.ibm_workloads.ibm_instructlab_service

remove_workloads:
  - rhpds.ibm_workloads.ibm_instructlab_service

__meta__:
  asset_uuid: 6502da16-3a9e-4ea9-ba4c-81f182710a74
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat AI Inference on IBM Cloud
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      Provider: RHDP
  deployer:
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: feature/minimal-config
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
