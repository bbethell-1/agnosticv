---
#include /includes/catalog-icon-rhibm.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/controlplane-count.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/account_assignment_api.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/parameters/num-users-salesforce.yaml

# The agnosticd config to use
env_type: ocp4-cluster
software_to_deploy: openshift4

ocp4_installer_version: "4.18"

worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
master_instance_type: bx2d-4x16

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_ec2_region: "us-east-2"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: true

__meta__:
  asset_uuid: c6b7463c-7eae-4071-ae48-634661e470f5
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM Resource Group OCP4
    category: Workshops
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Product: OpenShift
      Provider: RHDP
    parameters:
      - name: ibmcloud_region
        description: IBM Cloud Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-south
          enum:
            - au-syd
            - br-sao
            - ca-tor
            - eu-de
            - eu-gb
            - eu-es
            - jp-osa
            - jp-tok
            - us-east
            - us-south

      - name: worker_instance_type
        description: IBM Cloud Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: bx2d-4x16
          enum:
            - bx2-8x32
            - bx2d-4x16
            - bx3d-4x20
            - cx2-8x16
            - cx2d-4x8
            - cx3d-8x20
            - gx2-8x64x1v100
            - gx3-16x80x1l4
            - gx3d-160x1792x8h100
            - mx2-8x64
            - mx2d-4x32
            - mx3d-4x40
            - ox2-8x64
            - ux2d-2x56
            - vx2d-4x56

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
