---
#include /includes/sandbox-api.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
subdomain_base: "{{ guid }}.{{ cluster_dns_zone }}"
cluster_dns_zone: "{{ base_domain }}"

purpose: development
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager


ibmcloud_availability_zone: "{{ ibmcloud_region }}-3"

__meta__:
  deployer:
    scm_ref: ibmrg_ocp
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:temporary-pr-9024
      pull: missing
  sandboxes:
  - kind: IBMResourceGroupSandbox
    resourcegroup_suffix: ibmrg_ocp
    cloud_selector:
      purpose: dev
  - kind: DNSSandbox
    cloud_selector:
      purpose: "dev"
