---
#include /includes/sandbox-api.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
subdomain_base: "{{ guid }}.{{ cluster_dns_zone }}"
purpose: development
infra_workloads:
- ocp4_workload_authentication

__meta__:
  deployer:
    scm_ref: rhoic
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:temporary-pr-9024
      pull: missing
  sandboxes:
  - kind: IBMResourceGroupSandbox
    resourcegroup_suffix: rhoic
    cloud_selector:
      purpose: dev
