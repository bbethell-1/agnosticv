---
# Agnosticd variables
platform: babylon

env_type: test-empty-config
cloud_provider: osp
pause_destroy: true
pause_post_software: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: a97482d5-ec87-4560-8592-6fe3ef883981
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config OSP 2

    labels:
      Provider: RHDP

    parameters: []

  secrets:
    - name: empty-config-multiline
      namespace: gpte
