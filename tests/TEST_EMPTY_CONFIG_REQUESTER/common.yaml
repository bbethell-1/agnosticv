---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: 7468bbb8-b5a0-478b-9fc1-8a41f19bad7f
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Test empty config with requester
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters: []

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
