---
platform: babylon
env_type: test-empty-config
cloud_provider: test

agnosticv_meta:
  deploy_with: babylon

__meta__:
  catalog:
    display_name: Test empty config with requester
    namespace: gpte
    # Explicitly configure provision to wait for request creation
    provision_requires_request: true
    # Parameters to pass information about the requester as variables to tower jobs
    requester_parameters:
      - name: requester_name
        value: "{{ requester_user.metadata.name }}"
      - name: requester_email
        value: "{{ requester_identity.extra.email }}"
