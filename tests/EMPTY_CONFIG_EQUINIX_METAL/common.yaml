---
# Agnosticd variables
platform: babylon

env_type: test-empty-config
cloud_provider: equinix_metal

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: e9e5ac75-88f7-4b89-b944-4f3aa6497232
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config Equinix Metal

    labels:
      Provider: RHDP

    parameters: []

  deployer:
    virtualenv: equinix_metal-ansible2.9-python3.6-2021-07-02
  secrets:
    - namespace: gpte
      name: gpte

    - name: empty-config-multiline
      namespace: gpte

    - name: equinix-metal-gpte
      namespace: gpte
