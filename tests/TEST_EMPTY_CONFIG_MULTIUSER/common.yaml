---
cloud_provider: test
env_type: test-empty-config
platform: babylon

test_empty_config_multi_user: true

agnosticv_meta:
  deploy_with: babylon

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  secrets:
  - name: bookbag-deployer-shared-na46
    namespace: gpte

  catalog:
    description: >-
      This is the empty config.
      It tests the whole Babylon stack but deploys nothing.

    multiuser: true

    namespace: gpte

    parameters:
    - name: bookbag_deploy
      description: Deploy bookbag on OpenShift shared cluster.
      formLabel: Deploy bookbag
      openAPIV3Schema:
        type: boolean
        default: false

    - name: bookbag_git_repo
      description: Git repository for bookbag.
      formDisableCondition: bookbag_deploy !== true
      formLabel: Bookbag Git Repository
      openAPIV3Schema:
        type: string
        default: https://github.com/redhat-gpte-labs/bookbag-template.git
