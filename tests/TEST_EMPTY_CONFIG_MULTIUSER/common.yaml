---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config
test_empty_config_multi_user: true

__meta__:
  asset_uuid: dd7935df-d1df-4dc4-9e1c-c5054f5ab163
  owners:
    maintainer:
    - name: Johnathan Kupferer
      email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Multiuser Test Config
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}

    parameters:
    - name: test_empty_config_user_count
      description: User count to simulate
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
