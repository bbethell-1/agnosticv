---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/bookbag-shared-410.yaml

cloud_provider: test
env_type: test-empty-config
test_empty_config_multi_user: true

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: dd7935df-d1df-4dc4-9e1c-c5054f5ab163
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Multiuser Test Config
    labels:
      Provider: RHDP
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}

    parameters:
    - name: test_empty_config_user_count
      description: User count to simulate
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50

    - name: bookbag_deploy
      description: Deploy bookbag on OpenShift shared cluster.
      formLabel: Deploy bookbag
      openAPIV3Schema:
        type: boolean
        default: false

    - name: bookbag_git_repo
      description: Git repository for bookbag.
      formDisableCondition: bookbag_deploy !== true
      formLabel: Bookbag Git Repository
      openAPIV3Schema:
        type: string
        default: https://github.com/redhat-gpte-labs/bookbag-template.git
