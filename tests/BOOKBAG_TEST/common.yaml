---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/current_controller.yaml

cloud_provider: test
env_type: test-empty-config

bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-labs/bookbag-template.git

__meta__:
  asset_uuid: ef92a499-4024-4584-995d-7cc84c90e8e2
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Bookbag Test Config
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    messageTemplates:
      provisionFailed:
        disable: true
      provisionStarted:
        disable: true
      retirementScheduled:
        emailSubject: Your test experience environment is expiring soon
        timeIntervalBeforeRetirement: 1h
      serviceDeleted:
        emailSubject: Your test experience has ended
      serviceReady:
        emailSubject: Your test experience is ready to launch
      startComplete:
        disable: true
      startFailed:
        disable: true
      stopComplete:
        disable: true
      stopFailed:
        disable: true
      stopScheduled:
        disable: true
    parameters: []

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
