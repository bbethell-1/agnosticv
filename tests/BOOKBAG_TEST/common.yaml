---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config

bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-labs/bookbag-template.git

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Bookbag Test Config
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters: []

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
