# -------------------------------------------------------------------
# ZT AgnosticD v2 Migration - Phase 4 Test Catalog Item
# -------------------------------------------------------------------
# Thin per-lab leaf item, delegating all provisioning to the shared
# tests/zt-base-component base component (mirrors the production
# zt-rhelbu/zt-rhel-troubleshooting-1 -> zt-rhelbu/zt-rhel-bu-lab-developer-cnv
# pattern from zt-rhelbu-agnosticv). Validates `config: cloud-vms-base` +
# `cloud_provider: openshift_cnv` + the new `rhpds.zerotouch.*` roles
# against a real lab content repo (andrew-jones/zt-lab-andrew), reusing
# the same content/parameters as the existing v1 test item at
# zt-ansiblebu-agnosticv/zt-ansiblebu/zt-lab-andrew/common.yaml.
#
# See the migration proposal for full context:
# /home/andrew/src/proposals/zt-to-agd-v2/PROPOSAL-zerotouch-agd-v2-migration.md
#
# NOT a production catalog item - lives under tests/ deliberately, mirroring
# tests/zt-rhel-grading (an earlier, still-unmerged-to-BU-repos v2 migration
# POC for the same ZT platform).
#
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/catalog-icon-aap.yaml

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f9c8faa4-a229-4cf3-a933-992dbdbe7f02
  deployer:
    type: null
  catalog:
    display_name: "ZT AgnosticD v2 Migration Demo"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - zerotouch
      - agnosticd-v2
      - migration
      - test
    labels:
      Provider: RHDP
    parameters:
      - name: ocp4_workload_showroom_content_git_repo_ref
        description: Git branch/ref for the zt-lab-andrew content repo
        formLabel: Content git ref
        required: true
        openAPIV3Schema:
          type: string
          default: single-vm
  components:
    - name: zt-lab-developer-cnv
      display_name: zt lab developer cnv
      item: tests/zt-base-component
      parameter_values:
        # single-vm is the branch with node01 + the hello sidecar. origin/main
        # still has the older three-node layout and no containers - defaulting
        # to `main` would fetch that and look like the role failed to load lab
        # config.
        #
        # zt-lab-andrew single-vm tags node01 as `bastions` - matching the
        # standard `groups['bastions'][0]` convention (RHEL BU / cloud-vms-base
        # defaults), NOT Ansible BU's `groups['isolated'][0]` quirk.
        #
        # RESOLVED (was "KNOWN GAP"): zt-lab-andrew's instances.yaml declares no
        # `services:`/`routes:` for node01, but cloud_provider_openshift_cnv
        # exposes SSH for every VM by default regardless — confirmed live
        # against sandbox-nlkj2-ocp4-cluster: both a headless `node01`
        # ClusterIP Service and a `node01-ssh` NodePort Service (port 22) were
        # auto-created selecting `vm.cnv.io/name: node01`, neither named
        # anything the lab config declares. DNS resolution (both
        # `node01-ssh.<namespace>.svc.cluster.local` and the short name
        # `node01-ssh`) and an actual SSH login through that DNS name both
        # succeeded from the showroom pod. No `services:`/`routes:` addition
        # needed for SSH specifically.
        ocp4_workload_showroom_content_git_repo: https://github.com/andrew-jones/zt-lab-andrew.git
        ocp4_workload_showroom_content_git_repo_ref: single-vm
