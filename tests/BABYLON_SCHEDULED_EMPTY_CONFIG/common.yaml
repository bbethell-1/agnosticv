---
# Agnosticd variables
platform: babylon

env_type: test-empty-config
pause_destroy: true
pause_post_software: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 37d948fe-ff6e-4392-81cf-965b52b83b65
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Scheduled Empty Config

    labels:
      Provider: RHDP

    parameters: []

  scheduler:
    enable: true
  secrets:
    - name: empty-config-multiline
      namespace: gpte
