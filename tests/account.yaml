---
cloud_provider: none
output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}

##########################
# Babylon meta variables #
##########################

__meta__:
  # Dark Tower configuration
  tower:
    organization: gpte

  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    type: agnosticd

  # Enable GPTE reporting to the Provisions DB, for cost management
  secrets:
    - name: gpte-db
      namespace: gpte
      var: gpte_db
