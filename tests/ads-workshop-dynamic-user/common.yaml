---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# Agnosticd variables
env_type: ocp-workloads
cloud_provider: multi
software_to_deploy: none

# OCP workloads to deploy
ocp_workloads:
- ocp4_workload_dynamic_user_provisioning

# Dynamic User Provisioning Configuration
# The dynamic user will be created as user-{guid}
ocp4_workload_dynamic_user_provisioning_force_showroom_config: true

# OpenShift cluster connection details (will be overridden by component or dev.yaml)
openshift_api_key: ""
openshift_api_url: ""
openshift_api_ca_cert: ""

__meta__:
  asset_uuid: 50a950ff-5f10-4ef2-ae2d-d0f4b3c662f4
  owners:
    maintainer:
    - name: Tyrell Reddy
      email: treddy@redhat.com
    - name: Prakhar Srivastava
      email: psrivast@redhat.com
    sme:
    - name: Tyrell Reddy
      email: treddy@redhat.com
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: POC - ADS Workshop Dynamic User
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
