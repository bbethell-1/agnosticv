---
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml

platform: babylon
env_type: test-empty-config

fail_infra: false

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 1b51ad0c-44aa-4ed3-8ccc-798ee5e16323
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config OcpSandbox

    labels:
      Provider: RHDP

      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    parameters: []

  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: empty-config
      cloud_selector:
        cloud: cnv
        virt: "yes"

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2-rc.2
      pull: missing
