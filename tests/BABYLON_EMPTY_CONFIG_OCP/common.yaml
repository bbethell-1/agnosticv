---
#include /includes/sandbox-api.yaml

platform: babylon
env_type: test-empty-config

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 1b51ad0c-44aa-4ed3-8ccc-798ee5e16323
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config OcpSandbox

    labels:
      Provider: RHDP

    parameters: []

  secrets:
    - name: empty-config-multiline
      namespace: gpte

  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: empty-config
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
