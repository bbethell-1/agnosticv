---
# -------------------------------------------------------------------
# LiteMaaS Benchmark - Performance Testing & Load Validation
# -------------------------------------------------------------------
# INTERNAL USE ONLY - GPTE Admins & Platform Engineering Team
# Performance testing and capacity validation tool
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/litemaas-master_api.yaml

# -------------------------------------------------------------------
# Configuration
# -------------------------------------------------------------------
# Uses CNV pool (SNO 4.20) - no cloud provider needed
cloud_provider: none
config: namespace

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: main
    - name: "https://github.com/rhpds/rhpds.litemaas.git"
      type: git
      version: add-benchmark-role  # ← Use new branch until merged
    - name: kubernetes.core
      version: 2.3.1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - rhpds.litemaas.ocp4_workload_litemaas_benchmark

# -------------------------------------------------------------------
# Remove Workloads (cleanup on destroy)
# -------------------------------------------------------------------
remove_workloads:
  - rhpds.litemaas.ocp4_workload_litemaas_benchmark
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Virtual Keys Configuration
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models: >-
  {{
    (benchmark_model_granite_3_2_8b | default(true) | bool | ternary(['granite-3-2-8b-instruct'], [])) +
    (benchmark_model_granite_4_0_h_tiny | default(false) | bool | ternary(['granite-4-0-h-tiny'], [])) +
    (benchmark_model_llama_scout_17b | default(false) | bool | ternary(['llama-scout-17b'], [])) +
    (benchmark_model_codellama_7b_instruct | default(false) | bool | ternary(['codellama-7b-instruct'], [])) +
    (benchmark_model_qwen3_14b | default(false) | bool | ternary(['qwen3-14b'], [])) +
    (benchmark_model_deepseek_r1_distill_qwen_14b | default(false) | bool | ternary(['deepseek-r1-distill-qwen-14b'], [])) +
    (benchmark_model_llama_guard_3_1b | default(false) | bool | ternary(['Llama-Guard-3-1B'], [])) +
    (benchmark_model_microsoft_phi_4 | default(false) | bool | ternary(['microsoft-phi-4'], [])) +
    (benchmark_model_nomic_embed | default(false) | bool | ternary(['nomic-embed-text-v1-5'], []))
  }}

ocp4_workload_litellm_virtual_keys_duration: "{{ benchmark_key_duration | default('3d') }}"
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Benchmark Configuration
# -------------------------------------------------------------------
ocp4_workload_litemaas_benchmark_enabled: true
ocp4_workload_litemaas_benchmark_namespace: "{{ guid }}"
ocp4_workload_litemaas_benchmark_conversations: "{{ benchmark_conversations_count | default(20) }}"
ocp4_workload_litemaas_benchmark_turns: "{{ benchmark_turns_count | default(10) }}"
ocp4_workload_litemaas_benchmark_parallel_workers: "{{ benchmark_parallel | default(4) }}"
ocp4_workload_litemaas_benchmark_max_tokens: "{{ benchmark_max_tokens_count | default(500) }}"
ocp4_workload_litemaas_benchmark_min_delay: "{{ benchmark_min_delay_seconds | default(0.5) }}"
ocp4_workload_litemaas_benchmark_max_delay: "{{ benchmark_max_delay_seconds | default(2.0) }}"

# -------------------------------------------------------------------
# Metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c9d8e7f6-5a4b-3c2d-1e0f-9a8b7c6d5e4f
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing

  catalog:
    namespace: babylon-catalog-gpte
    display_name: "LiteMaaS Benchmark - Performance Testing"
    category: Demos
    multiuser: false
    keywords:
      - litemaas
      - benchmark
      - performance
      - ci
      - load-testing
      - ai
    labels:
      Product: Red_Hat_AI
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms

    parameters:
      # Models
      - name: benchmark_model_granite_3_2_8b
        formLabel: Granite 3.2 8B Instruct
        formGroup: Models to Benchmark
        description: IBM Granite 3.2 8B - General purpose
        openAPIV3Schema:
          type: boolean
          default: true

      - name: benchmark_model_granite_4_0_h_tiny
        formLabel: Granite 4.0 H Tiny
        formGroup: Models to Benchmark
        description: Compact with tool calling
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_llama_scout_17b
        formLabel: Llama 4 Scout 17B
        formGroup: Models to Benchmark
        description: Advanced function calling
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_codellama_7b_instruct
        formLabel: CodeLlama 7B Instruct
        formGroup: Models to Benchmark
        description: Code generation and completion
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_qwen3_14b
        formLabel: Qwen 3 14B
        formGroup: Models to Benchmark
        description: Large multilingual model
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_deepseek_r1_distill_qwen_14b
        formLabel: DeepSeek R1 Distill Qwen 14B
        formGroup: Models to Benchmark
        description: Reasoning-focused distilled model
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_llama_guard_3_1b
        formLabel: Llama Guard 3 1B
        formGroup: Models to Benchmark
        description: Safety and content moderation
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_microsoft_phi_4
        formLabel: Microsoft Phi-4
        formGroup: Models to Benchmark
        description: Small language model for reasoning
        openAPIV3Schema:
          type: boolean
          default: false

      - name: benchmark_model_nomic_embed
        formLabel: Nomic Embed v1.5
        formGroup: Models to Benchmark
        description: Text embeddings
        openAPIV3Schema:
          type: boolean
          default: false

      # Benchmark Config
      - name: benchmark_conversations_count
        description: Number of concurrent conversations (simulates concurrent users)
        formLabel: Concurrent Conversations
        formGroup: Load Configuration
        required: true
        openAPIV3Schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 200

      - name: benchmark_turns_count
        description: Conversation turns (follow-up questions)
        formLabel: Turns per Conversation
        formGroup: Load Configuration
        required: true
        openAPIV3Schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 50

      - name: benchmark_parallel
        description: Parallel workers (concurrency)
        formLabel: Parallel Workers
        formGroup: Load Configuration
        required: true
        openAPIV3Schema:
          type: integer
          default: 4
          minimum: 1
          maximum: 16

      - name: benchmark_max_tokens_count
        description: Max tokens per response
        formLabel: Max Tokens
        formGroup: Load Configuration
        required: true
        openAPIV3Schema:
          type: integer
          default: 500
          minimum: 50
          maximum: 2000

      - name: benchmark_min_delay_seconds
        description: Min delay between requests (seconds)
        formLabel: Min Request Delay
        formGroup: Request Timing
        required: true
        openAPIV3Schema:
          type: number
          default: 0.5
          minimum: 0.1
          maximum: 10.0

      - name: benchmark_max_delay_seconds
        description: Max delay between requests (seconds)
        formLabel: Max Request Delay
        formGroup: Request Timing
        required: true
        openAPIV3Schema:
          type: number
          default: 2.0
          minimum: 0.1
          maximum: 10.0

      - name: benchmark_key_duration
        description: Virtual key validity duration
        formLabel: Key Duration
        formGroup: Virtual Key Configuration
        required: true
        openAPIV3Schema:
          type: string
          default: '3d'
          enum:
            - '3d'
            - '7d'
            - '10d'
            - '30d'
