---
# -------------------------------------------------------------------
# LiteMaaS Benchmark - Performance Testing & Load Validation
# -------------------------------------------------------------------
# INTERNAL USE ONLY - GPTE Admins & Platform Engineering Team
# Performance testing and capacity validation tool
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/parameters/purpose.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking
#include /includes/parameters/litellm_metadata.yaml
#include /includes/secrets/litemaas-master_api.yaml

# -------------------------------------------------------------------
# Configuration
# -------------------------------------------------------------------
# Uses CNV pool (SNO 4.20) via components
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
    type: git
    version: main
  - name: "https://github.com/rhpds/rhpds.litemaas.git"
    type: git
    version: main
  - name: kubernetes.core
    version: 2.3.1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- rhpds.litemaas.ocp4_workload_litemaas_benchmark

# -------------------------------------------------------------------
# Remove Workloads (cleanup on destroy)
# -------------------------------------------------------------------
remove_workloads:
- rhpds.litemaas.ocp4_workload_litemaas_benchmark
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Virtual Keys Configuration
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models: >-
  {{
    (benchmark_model_granite_3_2_8b | default(true) | bool | ternary(['granite-3-2-8b-instruct'], [])) +
    (benchmark_model_granite_3_3_2b | default(false) | bool | ternary(['granite-3.3-2b-instruct'], [])) +
    (benchmark_model_granite_4_0_h_tiny | default(false) | bool | ternary(['granite-4-0-h-tiny'], [])) +
    (benchmark_model_llama_scout_17b | default(false) | bool | ternary(['llama-scout-17b'], [])) +
    (benchmark_model_llama_3_3_70b | default(false) | bool | ternary(['rh-llama-3.3-70B-instruct-quantized'], [])) +
    (benchmark_model_codellama_7b_instruct | default(false) | bool | ternary(['codellama-7b-instruct'], [])) +
    (benchmark_model_qwen3_14b | default(false) | bool | ternary(['qwen3-14b'], [])) +
    (benchmark_model_qwen3_235b | default(false) | bool | ternary(['qwen3-235b'], [])) +
    (benchmark_model_deepseek_r1_distill_qwen_14b | default(false) | bool | ternary(['deepseek-r1-distill-qwen-14b'], [])) +
    (benchmark_model_llama_guard_3_1b | default(false) | bool | ternary(['Llama-Guard-3-1B'], [])) +
    (benchmark_model_microsoft_phi_4 | default(false) | bool | ternary(['microsoft-phi-4'], [])) +
    (benchmark_model_minimax_m2 | default(false) | bool | ternary(['minimax-m2'], [])) +
    (benchmark_model_gpt_oss_120b | default(false) | bool | ternary(['gpt-oss-120b'], [])) +
    (benchmark_model_gpt_oss_20b | default(false) | bool | ternary(['gpt-oss-20b'], [])) +
    (benchmark_model_claude_opus_4_6 | default(false) | bool | ternary(['claude-opus-4-6'], [])) +
    (benchmark_model_claude_sonnet_4_6 | default(false) | bool | ternary(['claude-sonnet-4-6'], [])) +
    (benchmark_model_claude_3_5_haiku | default(false) | bool | ternary(['claude-3-5-haiku'], [])) +
    (benchmark_model_gemini_2_5_pro | default(false) | bool | ternary(['gemini-2.5-pro'], [])) +
    (benchmark_model_nomic_embed | default(false) | bool | ternary(['nomic-embed-text-v1-5'], []))
  }}

ocp4_workload_litellm_virtual_keys_duration: "{{ benchmark_key_duration | default('3d') }}"
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Benchmark Configuration
# -------------------------------------------------------------------
ocp4_workload_litemaas_benchmark_enabled: true
ocp4_workload_litemaas_benchmark_namespace: "{{ guid }}"
ocp4_workload_litemaas_benchmark_conversations: "{{ benchmark_conversations_count | default(20) }}"
ocp4_workload_litemaas_benchmark_turns: "{{ benchmark_turns_count | default(10) }}"
ocp4_workload_litemaas_benchmark_parallel_workers: "{{ benchmark_parallel | default(4) }}"
ocp4_workload_litemaas_benchmark_max_tokens: "{{ benchmark_max_tokens_count | default(100) }}"
ocp4_workload_litemaas_benchmark_min_delay: "{{ benchmark_min_delay_seconds | default(0.5) }}"
ocp4_workload_litemaas_benchmark_max_delay: "{{ benchmark_max_delay_seconds | default(2.0) }}"

# -------------------------------------------------------------------
# Metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c9d8e7f6-5a4b-3c2d-1e0f-9a8b7c6d5e4f
  owners:
    maintainer:
    - name: Prakhar Srivastava
      email: psrivast@redhat.com

  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "4.20"
      ocp4_fips_enable: false
    # Propagate agnosticd_user_info data set by this component to variables
    propagate_provision_data:
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: openshift_api_url
      var: openshift_api_url

  # Disable actions on chained config that are handled by base
  # EXCEPT destroy - needed to cleanup benchmark resources and virtual keys
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
    actions:
      destroy:
        disable: false  # Enable to cleanup benchmark and virtual keys
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  tower:
    timeout: 21600
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LiteMaaS Benchmark - Performance Testing"
    category: Demos
    multiuser: false
    keywords:
    - litemaas
    - benchmark
    - performance
    - ci
    - load-testing
    - ai
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP

    parameters:
      # Models
    - name: benchmark_model_granite_3_2_8b
      formLabel: Granite 3.2 8B Instruct (IBM)
      formGroup: Models to Benchmark
      description: IBM Granite 3.2 8B - General purpose
      openAPIV3Schema:
        type: boolean
        default: true

    - name: benchmark_model_granite_3_3_2b
      formLabel: Granite 3.3 2B Instruct (IBM)
      formGroup: Models to Benchmark
      description: IBM Granite 3.3 2B - Compact efficient model
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_granite_4_0_h_tiny
      formLabel: Granite 4.0 H Tiny (IBM)
      formGroup: Models to Benchmark
      description: Compact with tool calling
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_llama_scout_17b
      formLabel: Llama 4 Scout 17B (Meta)
      formGroup: Models to Benchmark
      description: Advanced function calling
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_llama_3_3_70b
      formLabel: Llama 3.3 70B Instruct Quantized (Meta)
      formGroup: Models to Benchmark
      description: Large quantized model for production
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_codellama_7b_instruct
      formLabel: CodeLlama 7B Instruct (Meta)
      formGroup: Models to Benchmark
      description: Code generation and completion
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_qwen3_14b
      formLabel: Qwen 3 14B (Alibaba)
      formGroup: Models to Benchmark
      description: Large multilingual model
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_qwen3_235b
      formLabel: Qwen 3 235B (Alibaba)
      formGroup: Models to Benchmark
      description: Large flagship model - highest capability
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_deepseek_r1_distill_qwen_14b
      formLabel: DeepSeek R1 Distill Qwen 14B (DeepSeek)
      formGroup: Models to Benchmark
      description: Reasoning-focused distilled model
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_llama_guard_3_1b
      formLabel: Llama Guard 3 1B (Meta)
      formGroup: Models to Benchmark
      description: Safety and content moderation
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_microsoft_phi_4
      formLabel: Microsoft Phi-4 (Microsoft)
      formGroup: Models to Benchmark
      description: Small language model for reasoning
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_minimax_m2
      formLabel: Minimax M2 (Minimax)
      formGroup: Models to Benchmark
      description: Chinese-English bilingual model
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_gpt_oss_120b
      formLabel: GPT-OSS 120B (Community)
      formGroup: Models to Benchmark
      description: Open-source GPT-scale model
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_gpt_oss_20b
      formLabel: GPT-OSS 20B (Community)
      formGroup: Models to Benchmark
      description: Open-source mid-size model
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_claude_opus_4_6
      formLabel: Claude Opus 4.6 (Anthropic)
      formGroup: Models to Benchmark
      description: Advanced reasoning and long context
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_claude_sonnet_4_6
      formLabel: Claude Sonnet 4.6 (Anthropic)
      formGroup: Models to Benchmark
      description: Balanced performance and speed
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_claude_3_5_haiku
      formLabel: Claude 3.5 Haiku (Anthropic)
      formGroup: Models to Benchmark
      description: Fast and lightweight
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_gemini_2_5_pro
      formLabel: Gemini 2.5 Pro (Google)
      formGroup: Models to Benchmark
      description: Multimodal AI with long context
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_model_nomic_embed
      formLabel: Nomic Embed v1.5 (Nomic AI)
      formGroup: Models to Benchmark
      description: Text embeddings
      openAPIV3Schema:
        type: boolean
        default: false

      # Benchmark Config - User-Friendly Parameters
    - name: benchmark_conversations_count
      description: |
          How many people per session?

          Enter the number of attendees for ONE session.
          Example: 60 people in each session → Enter 60

          Common sizes:
          • 120 people = Large event
          • 60-90 people = Typical workshop
          • 30 people = Small session
          • 10 people = Quick demo

          Minimum: 5 attendees required for meaningful benchmark results.
          If running multiple sessions, set "Number of Sessions" below.
      formLabel: "Attendees Per Session"
      formGroup: Workshop Configuration
      required: true
      openAPIV3Schema:
        type: integer
        default: 60
        minimum: 5
        maximum: 200

    - name: benchmark_sessions_count
      description: |
          How many sessions will run during the day?

          Examples:
          • 1 session = Standard single workshop
          • 3 sessions = Three separate 60-person sessions
          • 5 sessions = Maximum capacity test (full day)

          Note: Test runs once but validates capacity for your configuration.
      formLabel: "Number of Sessions Per Day"
      formGroup: Workshop Configuration
      required: true
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 5

    - name: benchmark_turns_count
      description: |
          How many times will each person ask the AI a question?

          Example: 90-min workshop where people ask ~10 questions → Enter 10

          Typical scenarios:
          • 90 minutes → Enter 10
          • 2 hours → Enter 15
          • 30 minutes → Enter 5

          Minimum: 5 questions required for meaningful benchmark results.
          Using LibreChat/MCP with tool calling?
          Check the box below - it automatically multiplies this by 3x.

          Test duration: ~10-15 min for 10 queries
      formLabel: "Questions Per Person"
      formGroup: Workshop Configuration
      required: true
      openAPIV3Schema:
        type: integer
        default: 10
        minimum: 5
        maximum: 50

    - name: benchmark_model_supports_mcp
      description: |
          Does your workshop use LibreChat/MCP with AI tool calling?

          ✓ Check this if:
          • Using LibreChat interface
          • AI can call tools/functions
          • Using Model Context Protocol (MCP)

          What happens:
          Automatically multiplies questions by 3x
          (tool calls create 2-3x more requests)

          Example: 10 questions becomes 30 test queries
      formLabel: "Workshop Uses Tool Calling (LibreChat/MCP)"
      formGroup: Workshop Configuration
      required: true
      openAPIV3Schema:
        type: boolean
        default: false

    - name: benchmark_parallel
      description: |
          How many people ask questions simultaneously during the test?

          AUTO-CALCULATED based on attendees:
          • 1-30 people   → 2 parallel workers
          • 31-60 people  → 4 parallel workers
          • 61-100 people → 8 parallel workers
          • 101+ people   → 16 parallel workers

          What this means:
          With 60 attendees and 4 parallel workers:
          • 4 people asking questions at the same time
          • When one finishes, the next person starts
          • Continues until all 60 have been tested

          Leave blank for auto-calculation (recommended).
          Only enter 1-16 if you need custom stress testing.
      formLabel: "Parallel Workers (optional)"
      formGroup: Advanced Settings (Optional)
      required: false
      openAPIV3Schema:
        type: integer
        minimum: 1
        maximum: 16

    - name: benchmark_max_tokens_count
      description: |
          How long should the AI's answers be?

          Default: 500 tokens (2-3 paragraphs)

          What is a token?
          • 1 token ≈ 1 word
          • 500 tokens = 2-3 paragraphs (typical answer length)

          Common settings:
          • 200-300 = Short answers (1 paragraph)
          • 500 = Standard answers (2-3 paragraphs) ← DEFAULT
          • 1000+ = Long explanations (full page)

          Leave blank to use default (500).
      formLabel: "Response Length (optional)"
      formGroup: Advanced Settings (Optional)
      required: false
      openAPIV3Schema:
        type: integer
        default: 500
        minimum: 50
        maximum: 2000

    - name: benchmark_min_delay_seconds
      description: |
          Minimum pause between questions (simulates real people thinking/typing).

          Default: 0.5 seconds

          What this does:
          Real people pause to read answers and type questions.
          The test randomly waits between MIN (0.5s) and MAX (2.0s).

          Leave blank to use default (0.5).
      formLabel: "Min Delay (optional)"
      formGroup: Advanced Settings (Optional)
      required: false
      openAPIV3Schema:
        type: number
        default: 0.5
        minimum: 0.1
        maximum: 10.0

    - name: benchmark_max_delay_seconds
      description: |
          Maximum pause between questions (simulates real people thinking/typing).

          Default: 2.0 seconds

          What this does:
          Test randomly waits between MIN (0.5s) and MAX (2.0s).
          Example: Q1 → wait 1.2s → Q2 → wait 0.8s → Q3

          Leave blank to use default (2.0).
      formLabel: "Max Delay (optional)"
      formGroup: Advanced Settings (Optional)
      required: false
      openAPIV3Schema:
        type: number
        default: 2.0
        minimum: 0.1
        maximum: 10.0

    - name: benchmark_key_duration
      description: Virtual key validity duration
      formLabel: Key Duration
      formGroup: Virtual Key Configuration
      required: true
      openAPIV3Schema:
        type: string
        default: '3d'
        enum:
        - '3d'
        - '7d'
        - '10d'
        - '30d'
