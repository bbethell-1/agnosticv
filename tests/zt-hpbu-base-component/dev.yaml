---
# Dev stage overrides
__meta__:
  deployer:
    scm_ref: main
  # __meta__.sandboxes is `overwrite` merge strategy (see .schemas/babylon.yaml),
  # so the full list from common.yaml must be repeated here even though only
  # cloud_selector.name changes. Matches tests/zt-rhelbu-base-component/dev.yaml's
  # own convention (pin a personal dev/test deploy to a specific dev cluster
  # instead of common.yaml's shared `purpose: prod` pool).
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpvdev01
        virt: "yes"
      quota:
        requests.storage: "100Gi"
