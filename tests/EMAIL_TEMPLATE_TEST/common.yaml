#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config

# These values are used for local testing but will be overridden by parameters
fail_infra: false
fail_post_infra: false
fail_pre_infra: false
fail_post_software: false
fail_pre_software: false
fail_software: false
test_empty_config_pause_post_software: true
test_empty_config_pause_post_software_seconds: 10

test_empty_config_passthrough_user_data:
  foo: bar

agnosticv_meta:
  deploy_with: babylon

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Email Template Test
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
