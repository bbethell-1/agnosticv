---
# Dev stage overrides
__meta__:
  deployer:
    scm_ref: main
  # __meta__.sandboxes is `overwrite` merge strategy (see .schemas/babylon.yaml),
  # so the full list from common.yaml must be repeated here even though only
  # cloud_selector.name changes. Matches tests/zt-rhelbu-base-component/dev.yaml's
  # own convention (pin a personal dev/test deploy to a specific dev cluster
  # instead of common.yaml's shared `purpose: prod` pool).
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpvdev01
        virt: "yes"
      # See common.yaml's quota comment - bumped to 300Gi after guid 4tjj5
      # (zt-ans-bu-roadshow01) hit the 200Gi ceiling: its 5 VMs alone sum to
      # exactly 200Gi, leaving no room for showroom's own internal PVCs.
      quota:
        requests.storage: "300Gi"
