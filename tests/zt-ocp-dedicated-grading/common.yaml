---
# Last updated: 2026-04-10 UTC — 2.1.6
# -------------------------------------------------------------------
# ZT Dedicated Grading — Bastion + OCP Lab POC
# -------------------------------------------------------------------
# Demonstrates 3 ZT grading patterns:
#   1. Ansible + kubernetes.core from runner (cluster-admin)
#   2. Bash scripts in showroom repo, run on bastion via ansible.builtin.script
#   3. Developer user tasks using oc --as developer on bastion
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml

config: openshift-workloads
cloud_provider: none

tag: main

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Collections
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.6
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "{{ tag }}"

# ===================================================================
# Workloads
# ===================================================================
workloads: >-
  {{
    [
      'agnosticd.core_workloads.ocp4_workload_authentication',
      'agnosticd.showroom.ocp4_workload_ocp_console_embed',
      'agnosticd.showroom.ocp4_workload_showroom',
      'rhpds.ftl.ocp4_workload_runtime_automation_k8s'
    ] +
    (
      ['rhpds.ftl.ocp4_runtime_automation_load_test']
      if run_e2e_load_test | default(false) | bool
      else []
    )
  }}

remove_workloads:
- agnosticd.showroom.ocp4_workload_showroom
- rhpds.ftl.ocp4_workload_runtime_automation_k8s

# ===================================================================
# Common password — shared by admin and developer for simplicity
# Published as {openshift_cluster_admin_password} and {openshift_cluster_account_password}
# ===================================================================
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

# ===================================================================
# ocp4_workload_authentication — admin + developer use same password
# ===================================================================
ocp4_workload_authentication_admin_password: "{{ common_password }}"
ocp4_workload_authentication_cluster_accounts:
- name: developer
ocp4_workload_authentication_cluster_account_password: "{{ common_password }}"
ocp4_workload_authentication_cluster_account_password_randomized: false

# ===================================================================
# ocp4_workload_showroom
# ===================================================================
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-zt-dedicated-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_wetty_image: "quay.io/rhpds/wetty:v3.0"
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"

# ===================================================================
# rhpds.ftl.ocp4_workload_runtime_automation_k8s
# Dedicated cluster — SA gets cluster-admin ClusterRoleBinding
# ===================================================================
ocp4_workload_runtime_automation_k8s_cluster_admin: true
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Babylon meta
# ===================================================================
__meta__:
  asset_uuid: 907e2bf8-56a8-4ac8-b259-6c9e8cf90b82
  owners:
    maintainer:
    - name: Prakhar Srivastava
      email: psrivast@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
      pull: missing
    actions:
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  catalog:
    display_name: "E2E Test Example — Dedicated OCP + Bastion"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - zerotouch
    - grading
    - dedicated
    - bastion
    labels:
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    multiuser: false
    workshopLabUiRedirect: true
    parameters:
    - name: run_e2e_load_test
      description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
      formLabel: "Run E2E Load Test"
      openAPIV3Schema:
        type: boolean
        default: false

  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "4.20"
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: openshift_api_url
      var: openshift_api_url
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  sandboxes:
  - kind: OcpSandbox
    alias: cluster
    cloud_selector:
      cloud: cnv-dedicated-shared
      purpose: dev
