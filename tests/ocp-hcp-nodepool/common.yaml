---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/terms-of-service.yaml

# Agnosticd variables
env_type: ocp-hcp-nodepool
cloud_provider: none
software_to_deploy: none

__meta__:
  asset_uuid: 4b3230da-3ead-4289-94f9-52f20621ead5

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: OpenShift HCP Nodepool Example
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters:
      - name: hcp_worker_cores
        description: OpenShift number of cores
        formLabel: OpenShift number of cores
        openAPIV3Schema:
          type: integer
          default: 4
        components:
          - name: openshift

      - name: hcp_worker_memory
        description: OpenShift worker memory size
        formLabel: OpenShift worker memory size
        openAPIV3Schema:
          type: string
          default: 8Gi
        components:
          - name: openshift

      - name: worker_instance_count
        description: OpenShift worker count
        formLabel: OpenShift worker count
        openAPIV3Schema:
          type: integer
          default: 2
        components:
          - name: openshift

  # Components to include in template and catalog item
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: openshift_cnv/OCPMULTI_HCP_CNV/dev
      # Propagate agnosticd_user_info data set by this component to variables.
      propagate_provision_data:
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_guid
          var: guid

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
