---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: none
env_type: test-empty-config

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Multi-Cloud Test
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: aws_region
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        required: true
        resourceIndexes:
          - 0
          - 1
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 100

  # Components to include in template and catalog item
  components:
    - name: aws-sandbox-a
      display_name: AWS OpenShift A
      item: sandboxes-gpte/SANDBOX_OCP49
    - name: aws-sandbox-b
      display_name: AWS OpenShift B
      item: sandboxes-gpte/SANDBOX_OCP49

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
