---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: none
env_type: test-empty-config

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Multi-Cloud Test
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws-sandbox-a
    display_name: AWS Sandbox A
    item: sandboxes-gpte/SANDBOX
  - name: aws-sandbox-b
    display_name: AWS Sandbox B
    item: sandboxes-gpte/SANDBOX

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
