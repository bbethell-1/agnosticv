---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: none
env_type: test-empty-config

__meta__:
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Multi-Cloud Test
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: aws_region
        description: AWS Region for sandboxes-gpte/SANDBOX_OPEN components
        formLabel: Region
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

  # Components to include in template and catalog item
  components:
    - name: aws-sandbox-a
      display_name: AWS Sandbox A
      item: sandboxes-gpte/SANDBOX_OPEN
    - name: aws-sandbox-b
      display_name: AWS Sandbox B
      item: sandboxes-gpte/SANDBOX_OPEN

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
