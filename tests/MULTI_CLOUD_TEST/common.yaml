---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: none
env_type: test-empty-config

__meta__:
  asset_uuid: e0091333-c306-4a4e-ae2b-84d73af39709
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Multi-Cloud Test
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters:
      - name: aws_region
        required: true
        resourceIndexes:
          - 0
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

  # Components to include in template and catalog item
  components:
    - name: aws-sandbox
      display_name: AWS Sandbox
      item: sandboxes-gpte/SANDBOX_OPEN
      propagate_provision_data:
        - var: aws_sandbox_provision_data
    - name: azure-sandbox
      display_name: Azure Sandbox
      item: azure_gpte/OPEN_ENVIRONMENT_AZURE_SUBSCRIPTION
      propagate_provision_data:
        - var: azure_sandbox_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
