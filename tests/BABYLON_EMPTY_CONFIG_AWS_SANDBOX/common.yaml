---
#include /includes/aws-sandbox-meta.yaml
# Agnosticd variables
platform: babylon

env_type: test-empty-config
cloud_provider: ec2

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 73526855-bdf4-477d-add0-e25e1609ca0e
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config AWS Sandbox

    labels:
      Provider: RHDP

    parameters: []

  secrets:
    - name: empty-config-multiline
      namespace: gpte
