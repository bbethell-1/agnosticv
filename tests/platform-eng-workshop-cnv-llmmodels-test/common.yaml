---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml


#include /includes/parameters/purpose.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/litemaas-master_api.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
config: namespace

# -------------------------------------------------------------------
# Collection Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: main

# -------------------------------------------------------------------
# Multi-User Configuration
# -------------------------------------------------------------------
# Virtual keys collection auto-detects multi-user mode from num_users parameter:
# - num_users: 1 → Single-user mode (key: virtkey-{guid})
# - num_users: 2-3 → Multi-user mode (keys: virtkey-{guid}-user1, user2, user3)
#
# No additional configuration needed!
#
# CI Lifecycle Features:
# - Keys auto-expire with catalog item runtime (no hardcoded durations)
# - Keys auto-extend when user clicks "Extend" in RHDP UI
# - Keys auto-cleanup when catalog item is destroyed
#
# Showroom Integration (multi-user):
# - User logs in as "user1" → sees {litellm_virtual_key} = user1's key
# - User logs in as "user2" → sees {litellm_virtual_key} = user2's key
# - Same variable name, personalized value per user!

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# LiteLLM Virtual Keys Configuration
# -------------------------------------------------------------------
# Build model list based on checkbox selections
ocp4_workload_litellm_virtual_keys_models: >-
  {{
    (litellm_model_granite_3_2_8b_instruct | default(true) | bool | ternary(['granite-3-2-8b-instruct'], [])) +
    (litellm_model_granite_4_0_h_tiny | default(false) | bool | ternary(['granite-4-0-h-tiny'], [])) +
    (litellm_model_llama_scout_17b | default(false) | bool | ternary(['llama-scout-17b'], [])) +
    (litellm_model_llama_3_2_1b_fp8 | default(false) | bool | ternary(['llama-3-2-1b-fp8'], [])) +
    (litellm_model_codellama_7b | default(false) | bool | ternary(['codellama-7b'], [])) +
    (litellm_model_codellama_7b_instruct | default(false) | bool | ternary(['codellama-7b-instruct'], [])) +
    (litellm_model_llama_guard | default(false) | bool | ternary(['meta-llama/Llama-Guard-3-1B'], [])) +
    (litellm_model_nomic_embed | default(false) | bool | ternary(['nomic-embed-text-v1-5'], []))
  }}

# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('3d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Babylon Metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0433c881-11c0-4161-8f9b-89eb98c9ac0d
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com
      - name: Ashok Jammula
        email: ajammula@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LiteMaaS Test - AI Model Keys"
    category: Workshops
    multiuser: true
    keywords:
      - litemaas
      - ai
      - models
      - multi-user
      - virtual-keys
    labels:
      Product: Red_Hat_AI
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms

    parameters:
      # User count parameter
      - name: num_users
        description: "Number of users: 1=single key (virtkey-{guid}), 2-3=multi-user keys (virtkey-{guid}-user1, user2, etc.)"
        formLabel: User Count
        formGroup: Multi-User Configuration
        required: true
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 3

      # Chat/Text Generation Models
      - name: litellm_model_granite_3_2_8b_instruct
        formLabel: Granite 3.2 8B Instruct
        formGroup: Chat & Text Models
        description: IBM Granite 3.2 8B - General purpose chat and text generation
        openAPIV3Schema:
          type: boolean
          default: true

      - name: litellm_model_granite_4_0_h_tiny
        formLabel: Granite 4.0 H Tiny
        formGroup: Chat & Text Models
        description: IBM Granite 4.0 H Tiny - Compact chat model for efficient inference with tool calling support
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_llama_scout_17b
        formLabel: Llama 4 Scout 17B (W4A16)
        formGroup: Chat & Text Models
        description: Meta Llama 4 Scout 17B - W4A16 quantized by Red Hat AI with 400k context window, advanced function calling, and MCP support. Excellent for tool use and agent workflows (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_llama_3_2_1b_fp8
        formLabel: Llama 3.2 1B FP8
        formGroup: Chat & Text Models
        description: Meta Llama 3.2 1B FP8 - Compact chat model optimized for efficient inference (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      # Code Models
      - name: litellm_model_codellama_7b
        formLabel: CodeLlama 7B
        formGroup: Code Models
        description: Meta CodeLlama 7B - Code completion (use /v1/completions endpoint)
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_codellama_7b_instruct
        formLabel: CodeLlama 7B Instruct
        formGroup: Code Models
        description: Meta CodeLlama 7B Instruct - Code chat with instructions (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      # Safety & Moderation Models
      - name: litellm_model_llama_guard
        formLabel: Llama Guard 3 1B
        formGroup: Safety & Moderation
        description: Meta Llama Guard 3 1B - Content safety classification (use /v1/completions endpoint)
        openAPIV3Schema:
          type: boolean
          default: false

      # Embedding Models
      - name: litellm_model_nomic_embed
        formLabel: Nomic Embed v1.5
        formGroup: Embedding Models
        description: Nomic Embed - Text embeddings (use /v1/embeddings endpoint)
        openAPIV3Schema:
          type: boolean
          default: false

      # Duration selection
      - name: litellm_duration
        description: |
          Select how long your virtual key will be valid.

          Options:
          - 3d: 3 days
          - 7d: 7 days
          - 10d: 10 days
          - 30d: 30 days
        formLabel: Key Duration
        required: true
        openAPIV3Schema:
          type: string
          default: '3d'
          enum:
            - '3d'
            - '7d'
            - '10d'
            - '30d'
