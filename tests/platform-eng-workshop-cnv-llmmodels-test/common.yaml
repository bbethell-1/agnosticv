---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/sandbox-api.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/litemaas-test.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
config: namespace

# -------------------------------------------------------------------
# Collection Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# LiteLLM Virtual Keys Configuration
# -------------------------------------------------------------------
# Convert model selection to actual model list
ocp4_workload_litellm_virtual_keys_models: >-
  {%- if litellm_models_selection | default('both') == 'granite' -%}
  ['openai/granite-3-2-8b-instruct']
  {%- elif litellm_models_selection == 'mistral' -%}
  ['openai/mistral-7b-instruct']
  {%- else -%}
  ['openai/granite-3-2-8b-instruct', 'openai/mistral-7b-instruct']
  {%- endif -%}

# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('30d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Babylon Metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0433c881-11c0-4161-8f9b-89eb98c9ac0d
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com
      - name: Ashok Jammula
        email: ajammula@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LiteMaaS Test - AI Model Keys"
    category: Workshops
    multiuser: false
    keywords:
      - litemaas
      - ai
      - models
    labels:
      Product: Red_Hat_AI
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms

    parameters:
      # Model selection (dropdown with predefined combinations)
      - name: litellm_models_selection
        description: |
          Select which AI models to access:
          - Granite Only: IBM Granite 3.2 8B model
          - Mistral Only: Mistral 7B model
          - Both Models: Granite + Mistral (recommended)
        formLabel: AI Models
        required: true
        openAPIV3Schema:
          type: string
          default: 'both'
          enum:
            - 'granite'
            - 'mistral'
            - 'both'

      # Duration selection
      - name: litellm_duration
        description: |
          Select how long your virtual key will be valid.

          Options:
          - 3d: 3 days
          - 7d: 7 days
          - 10d: 10 days
          - 30d: 30 days
        formLabel: Key Duration
        required: true
        openAPIV3Schema:
          type: string
          default: '30d'
          enum:
            - '3d'
            - '7d'
            - '10d'
            - '30d'
