# file doesn't exist in THIS repo's includes/secrets/ (it's
# zt-rhelbu-agnosticv-only), so inlined the same vaulted blob directly
# here instead of via #include, for local testing. Same gpte_vault_0 vault
# ID as every other secret in this file, so it decrypts the same way
# regardless of which repo the ciphertext originated in (matches
# tests/zt-ansiblebu-base-component's identical approach for
# ansiblebu_password.yaml, finding #5 in that file's own comment - that
# one was copied into its own includes/secrets/ file and #included;
# inlined directly here instead per request, for quicker iteration during
