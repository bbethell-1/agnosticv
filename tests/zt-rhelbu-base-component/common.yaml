---
# -------------------------------------------------------------------
# ZT AgnosticD v2 Migration - Phase 4 Base Component
# -------------------------------------------------------------------
# Shared base component for ZT AgnosticD v2 test/demo catalog items.
# Mirrors the production `zt-rhelbu/zt-rhel-bu-lab-developer-cnv` base
# component (zt-rhelbu-agnosticv repo): owns config/cloud_provider,
# collections, workload wiring, and Showroom deployment. Per-lab leaf
# items (e.g. tests/zt-rhelbu-agd-v2-demo) pull this in via a plain
# `#include /tests/zt-rhelbu-base-component/common.yaml` text-merge -
# NOT via `__meta__.components[].item:` (see GPTEINFRA-16059 below).
#
# GPTEINFRA-16059 (v1 production fix, ported here): sharing "one lab's
# own base config across its own scenarios" via
# `__meta__.components[].item:` makes the *referenced* base component the
# resource that actually carries job vars and executes the deploy -
# RHDP's reporting then attributes the run to that component's own
# (generic, shared-across-every-lab) display_name, never the ordering
# leaf's. Real production Ansible BU hit exactly this and fixed it by
# switching `zt-ans-bu-lab-developer-cnv(-poc)` from a
# `components[].item:` reference to a plain `#include`
# (rhpds/zt-ansiblebu-agnosticv PR #316/#317/#318, "This uses #include
# instead of components"). This base component and its three leaf demos
# (RHEL BU/HP BU/Ansible BU) originally used the same buggy
# `components[].item:` shape and have been converted to match the real
# fix.
#
# Renamed from tests/zt-base-component for naming consistency with
# tests/zt-ansiblebu-base-component and tests/zt-hpbu-base-component.
#
# This file's own __meta__ block below (catalog/deployer/sandboxes) is
# vestigial now that nothing references it via `components[].item:` -
# kept only because this repo's own validation
# (.tests/babylon_checks.py's check_component_catalog) requires any
# directory with stage files to carry complete catalog metadata, and
# because the repo-wide common.yaml defaults every item's
# __meta__.deployer.type to `agnosticd` unless overridden to null.
# Matches production zt-ans-bu-base-component, which keeps the same
# vestigial __meta__ for the same reason. It is inherited, then
# overridden field-by-field, by whichever leaf's own __meta__ appears
# after the #include line - nobody orders this component's own
# CatalogItem directly.
#
# See the migration proposal for full context:
# /home/andrew/src/proposals/zt-to-agd-v2/PROPOSAL-zerotouch-agd-v2-migration.md
#
# Satellite registration (GPTEINFRA-17763, guid `wqm56`, zt-webconsole-perf
# demo_scenario): this base component never registered its VM with
# Satellite, so it has no package repos. zt-webconsole-perf's own
# setup-rhel.sh does `dnf install -y --releasever=10 ... redhat-release`
# and `dnf install -y ... httpd` - with no repos available, that failed
# with rc=1 (empty stdout/stderr, since the script redirects its own
# output to a log file on the VM - Ansible's shell task only ever sees the
# non-zero rc), crash-looping the showroom pod's `setup` init container
# forever (Init:CrashLoopBackOff). Confirmed NOT a v1-vs-v2 pipeline gap:
# v1's real production base (zt-rhelbu-agnosticv/zt-rhelbu/
# zt-rhel-bu-lab-developer-cnv/common.yaml) includes a Satellite secret for
# the same reason (that repo's own zero-touch-library.yaml - not present
# in THIS repo's includes/secrets/, hence the different secret below).
# tests/zt-ansiblebu-base-component hit and documented the identical
# failure mode independently (its finding #12) and already fixed it;
# an earlier standalone RHEL BU diagnostic item (since folded into this
# base component and removed) already proved out this same wiring for
# RHEL BU specifically. Fixed here the same proven way: a secrets include
# (below) plus `host_satellite_repositories` in pre_software_workloads
# (below) - no agnosticd-v2 core changes needed, since
# includes/agd-v2-mapping.yaml (already included below) already bridges
# satellite_url/_org/_activationkey/set_repositories_satellite_ha to the
# host_satellite_repositories_* names agnosticd-v2's own role expects.
#
# demosat-rhel-7-8-9-10.yaml chosen over the narrower/point-release-pinned
# demosat-*.yaml files (e.g. the now-known-stale demosat-rhel-9-10.0-latest.yaml,
# whose content view is frozen to the RHEL 10.0 snapshot - found while
# diagnosing root SSH in a since-removed standalone diagnostic item)
# since this base component is generic across
# multiple RHEL BU demo_scenario content repos, not one pinned scenario -
# it's also the newest demosat-*.yaml in this repo (Dec 2025) and already
# used by a real production catalog item (openshift_cnv/
# automating-ripu-with-ansible), not a one-off.
#
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/secrets/demosat-rhel-7-8-9-10.yaml
#include /includes/secrets/litemaas-master_api.yaml

# registry_pull_token - v1's real production base
