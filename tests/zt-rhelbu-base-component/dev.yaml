---
# Dev stage overrides
__meta__:
  deployer:
    # Was pinned to fix/cloud-vms-base-instance-packages to live-test
    # rhpds/agnosticd-v2 PR #206 ("install instances[].packages in
    # cloud-vms-base software phase") ahead of merge. PR #206 merged to
    # main 2026-09-21 and the branch has since been deleted - back to
    # main, matching tests/zt-hpbu-base-component/dev.yaml and
    # tests/zt-ansiblebu-base-component/dev.yaml's identical explicit pin.
    scm_ref: main
  # __meta__.sandboxes is `overwrite` merge strategy (see .schemas/babylon.yaml),
  # so the full list from common.yaml must be repeated here even though only
  # cloud_selector.name changes. Pins this personal dev/test deploy to the
  # ocpvdev01 dev cluster instead of common.yaml's shared `purpose: prod` pool
  # (same convention as openshift_cnv/dil-camel3-cnv/dev.yaml and
  # openshift_cnv/CNV-BLANK/dev.yaml).
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpvdev01
        virt: "yes"
      quota:
        requests.storage: "750Gi"
