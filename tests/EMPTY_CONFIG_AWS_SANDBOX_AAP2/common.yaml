---
#include /includes/aws-sandbox-meta.yaml
# Agnosticd variables
platform: babylon

env_type: test-empty-config
cloud_provider: ec2

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  secrets:
    - name: empty-config-multiline
      namespace: gpte

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Empty Config AWS Sandbox AAP2

    labels:
      Provider: RHDP

    parameters: []
