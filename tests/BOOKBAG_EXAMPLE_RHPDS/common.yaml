---
#include /includes/secrets/bookbag-shared-410.yaml

# Agnosticd variables
platform: RHPDS

env_type: test-empty-config
cloud_provider: test

pause_destroy: true
pause_post_software: true

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/bookbag-template.git

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # Deploy with local. Babylon bookbag deployment uses a different pattern.
  deploy_with: local

  # Secrets for bookbag cluster access
  secrets:
    # Set vars:
    #  bookbag_openshift_api_url
    #  bookbag_openshift_api_token
    #  bookbag_openshift_api_ca_cert

    # Set vars:
    #  agnosticd_callback_token
    - guidgrabber-api

  # Use a specific virtualenv that has all the k8s modules
  virtualenv: aws-ansible-2.9

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 1b5d9462-41a2-4084-9a38-c00b1699046a
