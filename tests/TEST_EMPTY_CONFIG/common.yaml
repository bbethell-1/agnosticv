---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml

cloud_provider: test
env_type: test-empty-config

# These values are used for local testing but will be overridden by parameters
fail_infra: false
fail_post_infra: false
fail_pre_infra: false
fail_post_software: false
fail_pre_software: false
fail_software: false
test_empty_config_pause_post_software: true
test_empty_config_pause_post_software_seconds: 10

__meta__:
  asset_uuid: 0cff3662-870e-4f99-ae12-dc574e7a1032
  # OVERRIDE FOR TESTING
  ansible_controllers:
    - hostname: event0.apps.ocpv-infra01.dal12.infra.demo.redhat.com
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Test Config
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    workshopLabUiRedirect: true
    parameters:
      - name: fail_pre_infra
        description: Request failure in AgnosticD pre_infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD pre-infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_infra
        description: Request failure in AgnosticD infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_post_infra
        description: Request failure in AgnosticD post_infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD post-infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_pre_software
        description: Request failure in AgnosticD pre_software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD pre-software stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_software
        description: Request failure in AgnosticD software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD software stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_post_software
        description: Request failure in AgnosticD post_software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD post-software stage
        value: "false"
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_on_start
        description: Request failure in AgnosticD lifecycle.yml start
        formGroup: Request Failure
        formLabel: Fail in AgnosticD lifecycle start
        value: "false"
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_on_stop
        description: Request failure in AgnosticD lifecycle.yml stop
        formGroup: Request Failure
        formLabel: Fail in AgnosticD lifecycle stop
        value: "false"
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_infra_percentage
        description: Fail provisioning at specified percetage rate.
        formLabel: Fail Percentage
        openAPIV3Schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
      - name: fail_destroy
        description: Request failure in AgnosticD destroy_env.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD destroy
        openAPIV3Schema:
          type: boolean
          default: false
      - name: test_empty_config_pause_post_software
        description: Pause in post_software.yml to extend time until provision completion.
        formGroup: Provision Pause
        formLabel: Enable
        openAPIV3Schema:
          type: boolean
          default: false
      - name: test_empty_config_pause_post_software_seconds
        description: Seconds to pause in post_software.yml
        formDisableCondition: test_empty_config_pause_post_software !== true
        formLabel: Pause duration in post_software.yml
        openAPIV3Schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 3600
        validation: >-
          test_empty_config_pause_post_software_seconds < 60 ||
          check_salesforce_id(salesforce_id) ||
          Error('Pause duration must be less than a minute unless a valid Salesforce ID is provided.')
      - name: test_empty_config_host_count
        description: Number of hosts to simulate during provision.
        formLabel: Test host count
        openAPIV3Schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
      - name: test_empty_config_host_data_size
        description: Amount of test data to generate to create load on test host, in units of 1k blocks.
        formLabel: Test host data size
        formDisableCondition: test_empty_config_host_count < 1
        openAPIV3Schema:
          type: integer
          default: 102400
          minimum: 1
          maximum: 1073741824
    reportingLabels:
      reportingGroup: Test
      primaryBU: DEMO_Platform
      secondaryBU: The_Best_BU

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
