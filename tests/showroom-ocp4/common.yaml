---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml


# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ showroom_collection_version }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom_template_nookbag.git
# Enable both ocp-terminal (ttyd sandbox) and wetty (SSH to bastion)
ocp4_workload_showroom_terminal_type: both
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_image: "quay.io/rhpds/openshift-showroom-terminal-ocp:{{ host_ocp4_installer_version }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 72ba18d8-f53e-404e-b087-ab0b2dfc3fe9
  owners:
    maintainer:
    - name: Andrew Jones
      email: andrjone@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  catalog:
    display_name: "Showroom collection demo on OCP4"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - ocp
    - openshift
    - showroom
    labels:
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
    - name: cluster_size
      description: Size of cluster to install
      formLabel: OpenShift Cluster Size
      required: false
      openAPIV3Schema:
        type: string
        default: 'sno'
        enum:
        - 'multinode'
        - 'sno'
      components:
      - name: openshift
    - name: host_ocp4_installer_version
      description: Version of OpenShift to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.18'
        - '4.20'
        - '4.22'
    - name: showroom_collection_version
      description: Version of the showroom collection to use
      formLabel: Showroom Collection Version
      required: false
      openAPIV3Schema:
        type: string
        default: 'v1.6.12'
    - name: ocp4_workload_showroom_enable_dev_mode
      description: Enable Antora dev-mode extension (adds attribute pages and unlisted pages to nav)
      formLabel: Showroom Dev Mode
      required: false
      openAPIV3Schema:
        type: boolean
        default: true
    - name: ocp4_workload_showroom_content_git_repo
      description: Git repo URL for the showroom content
      formLabel: Showroom Git Repo
      required: false
      openAPIV3Schema:
        type: string
        default: 'https://github.com/rhpds/showroom-template.git'
    - name: showroom_mode
      description: Showroom mode - open (free navigation via TOC and next/prev links) or guided (sequential modules with next/solve/prev buttons)
      formLabel: Showroom Mode
      required: false
      openAPIV3Schema:
        type: string
        default: 'open'
        enum:
        - 'open'
        - 'guided'
    - name: ocp4_workload_showroom_content_git_repo_ref
      description: Git ref (branch, tag, or commit) for the showroom content repo
      formLabel: Showroom Git Ref
      required: false
      openAPIV3Schema:
        type: string
        default: "{{ showroom_mode }}-ocp"
    - name: ocp4_workload_showroom_content_ui_config
      description: Override ui-config.yml for the content container (JSON or YAML string, empty = use repo default)
      formLabel: Showroom UI Config Override
      required: false
      openAPIV3Schema:
        type: string
        default: ''
    - name: ocp4_workload_showroom_content_antora_ui_bundle_url
      description: Override the Antora UI bundle URL (empty = use the default from site.yml)
      formLabel: Antora UI Bundle URL
      required: false
      openAPIV3Schema:
        type: string
        default: ''
    - name: ocp4_workload_showroom_content_antora_navbar_logo
      description: Override the navbar logo (e.g. "summit" for Red Hat Summit branding; empty = use default)
      formLabel: Navbar Logo
      required: false
      openAPIV3Schema:
        type: string
        default: ''
    - name: ocp4_workload_showroom_runtime_automation_enable
      description: Deploy a runtime automation runner sidecar container
      formLabel: Runtime Automation
      required: false
      openAPIV3Schema:
        type: boolean
        default: true
    - name: ocp4_workload_showroom_zero_touch_bundle
      description: Override the nookbag UI bundle URL (empty = use role default)
      formLabel: Nookbag Bundle URL
      required: false
      openAPIV3Schema:
        type: string
        default: 'https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip'
    - name: ocp4_workload_showroom_deployer_chart_version
      description: Helm chart version for the showroom deployer
      formLabel: Showroom Chart Version
      required: false
      openAPIV3Schema:
        type: string
        default: '2.2.*'

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: "{{ cluster_size }}"
      host_ocp4_installer_version: "{{ host_ocp4_installer_version }}"
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_console_url
      var: openshift_console_url
    - name: openshift_cluster_ingress_domain
      var: openshift_cluster_ingress_domain
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  # Disable actions on chained config that are handled by base.
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
