---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# Agnosticd variables
cloud_provider: test
env_type: test-empty-config

__meta__:
  asset_uuid: 1cc58c3f-a8f5-43dd-af27-1dc4499b21bb
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Chained Test Config
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters: []

  # Components to include in template and catalog item
  components:
  - name: base
    display_name: Base Empty Config
    item: tests/TEST_EMPTY_CONFIG
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: random_string
      var: base_random_string

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
