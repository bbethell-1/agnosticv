---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/showroom-shared-cluster1.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config

showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/showroom_template_default
ocp4_workload_showroom_content_git_ref: showroom
ocp4_workload_showroom_content_only: true
showroom_ui: zero-touch
showroom_ui_zero_bundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip

__meta__:
  asset_uuid: e067c47c-31b6-4618-984a-5520a0a36141
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com
    instructions:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com


  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Showroom Test
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters: []

  deployer:
    actions:
      destroy:
        time_estimate: 5m
      provision:
        time_estimate: 5m
      start:
        time_estimate: 2m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 2m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
