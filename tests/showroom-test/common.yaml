---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/showroom-shared-cluster1.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config

showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/showroom-test
ocp4_workload_showroom_content_git_ref: main
ocp4_workload_showroom_content_only: true
# showroom_ui: zero-touch
# showroom_ui_zero_bundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip
ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_chart_package_url: https://agonzalezrh.github.io/showroom-deployer
ocp4_workload_showroom_content_image: ghcr.io/agonzalezrh/showroom-content:main
ocp4_workload_showroom_deployer_chart_version: "1.7.2"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

__meta__:
  asset_uuid: e067c47c-31b6-4618-984a-5520a0a36141
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com
    instructions:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com


  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Showroom Test
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    parameters: []

  deployer:
    scm_ref: zero-touch-base-rhel
    actions:
      destroy:
        time_estimate: 5m
      provision:
        time_estimate: 5m
      start:
        time_estimate: 2m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 2m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
