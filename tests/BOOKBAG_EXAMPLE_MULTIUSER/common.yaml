---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config
test_empty_config_multi_user: true

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: 1dc1dd19-b18b-44a6-a923-04c5248872d3
  anarchy:
    namespace: babylon-anarchy-test

  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-labs/bookbag-template.git
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true

    # Image to use for bookbag
    #image: quay.io/org/repo:tag

  catalog:
    display_name: Multiuser Bookbag Example
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP

    parameters:
    - name: test_empty_config_user_count
      description: User count to simulate
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50
