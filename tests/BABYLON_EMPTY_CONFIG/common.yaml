---
# Agnosticd variables
platform: babylon

env_type: test-empty-config

cloud_provider: test

pause_destroy: true
pause_post_software: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

  # Use a specific virtualenv that has all the k8s modules
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  secrets:
    - name: empty-config-multiline
      namespace: gpte

  catalog:
    namespace: gpte

    description: >-
      This is the empty config.
      It tests the whole Babylon stack but deploys nothing.

    parameters:
      - name: fail_pre_infra
        description: Set to true to have agnosticd fail in pre_infra.yml
        value: "false"
      - name: fail_infra
        description: Set to true to have agnosticd fail in infra.yml
        value: "false"
      - name: fail_post_infra
        description: Set to true to have agnosticd fail in post_infra.yml
        value: "false"
      - name: fail_pre_software
        description: Set to true to have agnosticd fail in pre_software.yml
        value: "false"
      - name: fail_software
        description: Set to true to have agnosticd fail in software.yml
        value: "false"
      - name: fail_post_software
        description: Set to true to have agnosticd fail in post_software.yml
        value: "false"
      - name: test_empty_config_pause_post_software
        description: Set to true to have agnosticd pause during post_software.yml
        value: "false"
      - name: test_empty_config_pause_post_software_seconds
        description: Set to numeric value to control duration of pause during post_software.yml
        value: "30"
