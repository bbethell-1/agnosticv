---
#include /includes/parameters/purpose.yaml
#include /includes/secrets/bookbag-shared-410.yaml

# Agnosticd variables
platform: babylon

env_type: test-empty-config

cloud_provider: test

pause_destroy: true
pause_post_software: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 5ff5cd98-7079-4692-84ca-e0250a4da6ee
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config
    labels:
      Provider: RHDP

    parameters:
      - name: region
        description: Empty config does not actually use region.
        formLabel: Region
        openAPIV3Schema:
          type: string
          default: NA
          enum:
            - APAC
            - EMEA
            - LATAM
            - NA
      - name: test_empty_config_multi_user
        description: Simulate multi-user environment
        formGroup: Simulate multi-user environment
        formLabel: Enable
        openAPIV3Schema:
          type: boolean
          default: false
      - name: bookbag_deploy
        description: Deploy bookbag on OpenShift shared cluster.
        formLabel: Deploy bookbag
        openAPIV3Schema:
          type: boolean
          default: false
      - name: bookbag_git_repo
        description: Git repository for bookbag.
        formDisableCondition: bookbag_deploy !== true
        formLabel: Bookbag Git Repository
        openAPIV3Schema:
          type: string
          default: https://github.com/redhat-gpte-labs/bookbag-template.git
      - name: example_regex_validated_var
        description: Example variable with regex validation. Must be lowercase alphanumeric.
        formLabel: Regex Validated Variable
        openAPIV3Schema:
          type: string
          default: ""
          pattern: ^[a-z0-9]*$
      - name: fail_pre_infra
        description: Request failure in AgnosticD pre_infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD pre-infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_infra
        description: Request failure in AgnosticD infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_post_infra
        description: Request failure in AgnosticD post_infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD post-infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_pre_software
        description: Request failure in AgnosticD pre_software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD pre-software stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_software
        description: Request failure in AgnosticD software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD software stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_post_software
        description: Request failure in AgnosticD post_software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD post-software stage
        value: "false"
        openAPIV3Schema:
          type: boolean
          default: false
      - name: test_empty_config_pause_post_software
        description: Pause in post_software.yml to extend time until provision completion.
        formGroup: Provision Pause
        formLabel: Enable
        openAPIV3Schema:
          type: boolean
          default: false
      - name: test_empty_config_pause_post_software_seconds
        description: Seconds to pause in post_software.yml
        formDisableCondition: test_empty_config_pause_post_software !== true
        formLabel: Pause duration in post_software.yml
        openAPIV3Schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 3600

  secrets:
    - name: empty-config-multiline
      namespace: gpte
