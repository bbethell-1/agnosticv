---
#include /includes/parameters/purpose.yaml

# Agnosticd variables
platform: babylon

env_type: test-empty-config

cloud_provider: test

pause_destroy: true
pause_post_software: true

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 5ff5cd98-7079-4692-84ca-e0250a4da6ee
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config
    labels:
      Provider: RHDP

      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    parameters:
      - name: region
        description: Empty config does not actually use region.
        formLabel: Region
        openAPIV3Schema:
          type: string
          default: NA
          enum:
            - APAC
            - EMEA
            - LATAM
            - NA
          x-display: radio
      - name: test_empty_config_multi_user
        description: Simulate multi-user environment
        formGroup: Simulate multi-user environment
        formLabel: Enable
        openAPIV3Schema:
          type: boolean
          default: false
      - name: example_regex_validated_var
        description: Example variable with regex validation. Must be lowercase alphanumeric.
        formLabel: Regex Validated Variable
        openAPIV3Schema:
          type: string
          default: ""
          pattern: ^[a-z0-9]*$
      - name: fail_pre_infra
        description: Request failure in AgnosticD pre_infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD pre-infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_infra
        description: Request failure in AgnosticD infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_post_infra
        description: Request failure in AgnosticD post_infra.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD post-infra stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_pre_software
        description: Request failure in AgnosticD pre_software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD pre-software stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_software
        description: Request failure in AgnosticD software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD software stage
        openAPIV3Schema:
          type: boolean
          default: false
      - name: fail_post_software
        description: Request failure in AgnosticD post_software.yml
        formGroup: Request Failure
        formLabel: Fail in AgnosticD post-software stage
        value: "false"
        openAPIV3Schema:
          type: boolean
          default: false
      - name: test_empty_config_pause_post_software
        description: Pause in post_software.yml to extend time until provision completion.
        formGroup: Provision Pause
        formLabel: Enable
        openAPIV3Schema:
          type: boolean
          default: false
      - name: test_empty_config_pause_post_software_seconds
        description: Seconds to pause in post_software.yml
        formDisableCondition: test_empty_config_pause_post_software !== true
        formLabel: Pause duration in post_software.yml
        openAPIV3Schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 3600

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
