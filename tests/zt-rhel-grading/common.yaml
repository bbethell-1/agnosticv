---
# Last updated: 2026-04-10 UTC — 2.1.6
# -------------------------------------------------------------------
# ZT RHEL Grading Example — POC Test Catalog Item
# Based on Mitesh Sharma's poc-rhel-zt-showroom (PR #25584)
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-rhel-9-latest-and-aap25.yaml
#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# Platform - AgnosticD v2
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ subdomain }}"
bastion_ssh_password: "{{ common_password }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + 'RM' }}"

# -------------------------------------------------------------------
# CNV-specific settings
# -------------------------------------------------------------------
openshift_cnv_legacy_routes: false
openshift_cnv_route_remove_x_frame_options_header: true

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
node_instance_image: rhel-9.6
node_hostname: node

instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: AnsibleGroup
        value: "bastions,showroom"
      - key: ostype
        value: linux
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
    routes:
      - name: bastion-80
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge

  - name: node
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 4G
    cores: 2
    image_size: 50Gi
    tags:
      - key: AnsibleGroup
        value: nodes
      - key: ostype
        value: linux
    networks:
      - default

# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.6
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - host_satellite_repositories
    - agnosticd.cloud_vm_workloads.control_user
  bastions:
    - host_common_packages

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions: >-
    {{
      [
        'agnosticd.showroom.vm_workload_showroom',
        'rhpds.ftl.vm_workload_runtime_automation'
      ] +
      (
        ['rhpds.ftl.vm_runtime_automation_load_test']
        if run_e2e_load_test | default(false) | bool
        else []
      )
    }}

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Workload: host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false
host_common_packages_extra:
  - python3
  - bash-completion
  - tmux
  - git
  - podman

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# Sets up lab-user with SSH key pair for key-based auth to nodes
# -------------------------------------------------------------------
env_authorized_key: "{{ guid }}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# Asset injector — SSH config on bastion and key copy to node
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Remove cloud-init SSH config
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Enable password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} ZT SSH settings"
    block: |
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd
    module: service
    name: sshd
    state: restarted

node_asset_injector_assets:
  - description: Copy SSH public key from bastion
    module: copy
    src: "/home/{{ student_name }}/.ssh/{{ guid }}key.pub"
    dest: /root/.ssh/
    remote_src: true
    mode: "u=r,g-rwx,o-rwx"

  - description: Copy SSH private key from bastion
    module: copy
    src: "/home/{{ student_name }}/.ssh/{{ guid }}key.pem"
    dest: /root/.ssh/
    remote_src: true
    mode: "u=r,g-rwx,o-rwx"

  - description: Create SSH config for key auth
    module: blockinfile
    path: /root/.ssh/config
    create: true
    state: present
    marker: "# {mark} ZT SSH config"
    block: |
      Host *
        User {{ student_name }}
        IdentityFile ~/.ssh/{{ guid }}key.pem
        StrictHostKeyChecking no

asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names
    else (node_asset_injector_assets if 'nodes' in group_names else [])
  }}

# -------------------------------------------------------------------
# Workload: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/rhel-zt-theme-test-showroom.git
showroom_git_ref: main
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "bastion-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"
showroom_tty_image: quay.io/rhpds/wetty
showroom_tty_image_tag: v3.0
showroom_tab_services:
  - single_terminal
  - second_terminal

showroom_antora_enable_dev_mode: "false"

# Runner always enabled for ZT Solve/Validate buttons
showroom_ansible_runner_api: true
showroom_ansible_runner_image: quay.io/rhpds/zt-runner
showroom_ansible_runner_image_tag: v2.4.2
showroom_ansible_runner_path: "/stream"
showroom_nookbag_sidecar_enable: false

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  bastion_public_hostname: "{{ bastion_public_hostname }}"
  guid: "{{ guid }}"
  bastion_ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  bastion_ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  bastion_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  bastion_ssh_user_name: "{{ student_name }}"
  bastion_ssh_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e2042a7f-e0e5-49e1-be4f-d46b7046f779
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com
      - name: Wolfgang Kulhanek
        email: wkulhane@redhat.com
      - name: Mitesh Sharma
        email: mitsharm@redhat.com
  # anarchy.namespace must NOT be set here — controlled at AgV top level
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
      pull: missing
  catalog:
    display_name: "E2E Test Example — RHEL VM + Bastion"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - zerotouch
      - grading
      - rhel
      - vm
    labels:
      Provider: RHDP
      Product: Red_Hat_Enterprise_Linux
    multiuser: false
    workshopLabUiRedirect: true
    parameters:
      - name: run_e2e_load_test
        description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
        formLabel: "Run E2E Load Test"
        openAPIV3Schema:
          type: boolean
          default: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "200Gi"
