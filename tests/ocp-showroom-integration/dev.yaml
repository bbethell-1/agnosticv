---
#include /includes/parameters/num-users-salesforce.yaml
purpose: development

#
# Zero Touch
#
ocp4_workload_showroom_content_git_repo: https://github.com/agonzalezrh/showroom-ocp.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer # W: missing document start "---"
ocp4_workload_showroom_deployer_chart_name: zerotouch

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"

ocp4_workload_showroom_automation_disable: true
ocp4_workload_showroom_use_sandbox_domain: false
ocp4_workload_showroom_deployer_chart_version: "1.9.10"
ocp4_workload_showroom_content_image: quay.io/rhpds/showroom-content:v1.2
ocp4_workload_showroom_cloud_image: quay.io/rhpds/showroom-cloud:v1
openshift_cnv_route_remove_x_frame_options_header: true
ocp4_workload_showroom_terminal_enable: true
ocp4_workload_showroom_content_only: true

_showroom_user_data:
  bastion_public_hostname: ""
  bastion_ssh_user_name: ""
  bastion_ssh_password: ""
  environment_variables:
    domain: "{{ openshift_route_default_domain }}"

__meta__:
  deployer:
    scm_ref: showroom-ocp-new-approach
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
