---
# Agnosticd variables
platform: babylon

env_type: test-empty-config
cloud_provider: ec2

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: d6ffb4a4-898a-4008-8a4f-c1ea39e32aed
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config AWS 2

    labels:
      Provider: RHDP

    parameters: []

  secrets:
    - namespace: gpte
      name: gpte

    - name: empty-config-multiline
      namespace: gpte
