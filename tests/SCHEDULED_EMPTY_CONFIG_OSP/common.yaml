---
# Agnosticd variables
platform: babylon

cloud_provider: osp

env_type: test-empty-config
pause_destroy: true
pause_post_software: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1
  virtualenv: openstack-ansible-2.9
  agnosticd_git_ref: test-empty-config-test-0.6
  scheduler:
    enable: true
    data:
      cloud_selector:
        type: osp
