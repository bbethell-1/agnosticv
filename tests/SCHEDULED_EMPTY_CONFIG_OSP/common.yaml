---
# Agnosticd variables
platform: babylon


cloud_provider: osp

output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}
env_type: test-empty-config

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1
  virtualenv: openstack-ansible-2.9
  scheduler:
    enable: true
    url: https://scheduler-scheduler-gpe-demo.apps.cluster-babydev.babydev.dev.open.redhat.com
    endpoint: /api/v1/schedule
    data:
      uuid: "{{ uuid }}"
      cloud_selector:
        type: osp
