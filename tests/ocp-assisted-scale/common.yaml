---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

# Agnosticd variables
env_type: ocp-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: true

__meta__:
  asset_uuid: 47f279ed-d70b-4e7e-9cbd-272c8f4ed94d
  owners:
    maintainer:
      - name: Alberto Gonzalez
        email: josegonz@redhat.com


  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: OpenShift Assisted Installer Scale example
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    parameters:
      - name: ai_workers_memory
        description: OpenShift worker memory size
        formLabel: OpenShift worker memory size
        openAPIV3Schema:
          type: string
          default: 8Gi

      - name: ai_workers_cores
        description: OpenShift cores count
        formLabel: OpenShift cores count
        openAPIV3Schema:
          type: integer
          default: 8

      - name: worker_instance_count
        description: OpenShift worker count
        formLabel: OpenShift worker count
        openAPIV3Schema:
          type: integer
          default: 2

      - name: cluster_size
        description: cluster size
        formLabel: cluster size
        openAPIV3Schema:
          type: string
          default: sno
          enum:
            - 'sno'
            - 'multinode'
        components:
          - name: all

      - name: host_ocp4_installer_version
        description: OpenShift version to install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.18'
          enum:
            - '4.18'
            - '4.19'
        components:
          - name: all

      - name: ocp4_fips_enable
        description: fips
        formLabel: fips
        required: false
        openAPIV3Schema:
          type: boolean
          default: false
        components:
          - name: all

  # Components to include in template and catalog item
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools/dev
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url
  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
