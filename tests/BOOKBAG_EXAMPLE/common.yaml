---
platform: babylon
env_type: test-empty-config
cloud_provider: test

agnosticv_meta:
  deploy_with: babylon

__meta__:
  anarchy:
    namespace: babylon-anarchy-test
  bookbag:
    git:
      repo: https://github.com/redhat-gpte-labs/bookbag-template.git
      #branch: main

    # Auth settings for bookbag, default is to allow all access to users that
    # know the URL.
    #auth:
    #  user: '*'
    #  password: ''

    # Specify namespace in which to deploy bookbag, may reference vars:
    #  * guid
    #  * user (ex: alice-example.com)
    # Invalid characters in namespace name (ex: '@', '.') will be replaced with '-'
    #namespace: bookbag-{{ user }}-{{ guid }}

    # Include OpenShift console tab
    #openshift_console: true

    # Role to be assigned to bookbag service account
    # Can be one of: basic-user, edit, admin
    #role: basic-user

    # Specify target cluster by secret name
    #target_cluster: shared-na46
  catalog:
    namespace: gpte
    parameters: []
