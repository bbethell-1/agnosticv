---
platform: babylon
env_type: test-empty-config
cloud_provider: test

agnosticv_meta:
  deploy_with: babylon

__meta__:
  anarchy:
    namespace: babylon-anarchy-test
  bookbag:
    # Auth settings for bookbag, default is to allow all access to users that
    # know the URL.
    #auth:
    #  user: '*'
    #  password: ''

    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-labs/bookbag-template.git
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true

    # Image to use for bookbag
    #image: quay.io/org/repo:tag
  catalog:
    multiuser: true
    namespace: gpte
    parameters:
    - name: test_empty_config_multi_user
      description: Simulate multi-user environment
      formGroup: Simulate multi-user environment
      formLabel: Enable
      openAPIV3Schema:
        type: boolean
        default: false
