---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: 0e7dfd86-685b-4e91-bd70-3c571f574c2e
  anarchy:
    namespace: babylon-anarchy-test

  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-labs/bookbag-template.git
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true

    # Image to use for bookbag
    #image: quay.io/org/repo:tag

  catalog:
    display_name: Bookbag Example
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters: []
