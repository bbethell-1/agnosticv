# Dev stage overrides - pulled in from the shared base component (pins
# this dev/test deploy to a specific deployer scm_ref and dev cluster
# quota) since this item now deploys directly instead of delegating via
# __meta__.components[].item: - see
# tests/zt-ansiblebu-base-component/common.yaml's header comment
# (GPTEINFRA-16059) for why. Under the old delegator shape this file only
# needed to exist (even empty) so the agnosticv CLI listed a "dev" stage;
# now it must actually carry the base's dev-stage __meta__ overrides, the
# same way production zt-ans-bu-lab-developer-cnv-poc/dev.yaml does
# (`#include recursive=false /zt-ansiblebu/zt-ans-bu-base-component/dev.yaml`),
# and the same way tests/zt-rhelbu-agd-v2-demo/dev.yaml now does.
#include recursive=false /tests/zt-ansiblebu-base-component/dev.yaml
