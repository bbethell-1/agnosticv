---
# Pin namespaced_workloads to the refactor branch for dev testing.
# The other collections continue to use {{ tag }} (main) from common.yaml.
requirements_content:
  collections:
  # Tenant roles (keycloak_user, namespace, gitops)
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: stencell-refactor-13-march

  # GitOps bootstrap (deploys all ArgoCD apps via app-of-apps pattern)
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.5.6

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
