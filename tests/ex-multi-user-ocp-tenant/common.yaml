---
# -------------------------------------------------------------------
# --- Example: Multi-User OpenShift Tenant CI
# -------------------------------------------------------------------
#include /includes/access-restriction-admins-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# config: namespace -- uses AgnosticD's namespace config which:
#   - Runs workloads on provision (software.yml)
#   - Runs workloads in REVERSE order on destroy (destroy_env.yml)
#   - Sets K8S_AUTH_* env vars for kubernetes.core modules
#   - Does NOT need remove_workloads (unlike openshift-workloads config)
config: namespace

# cloud_provider: none -- no cloud account needed, we use pre-provisioned
# OCP clusters provided by the Sandbox API
cloud_provider: none

# This is not currently required with 'namespace' config
# Leaving it for reference or in case we need to override
# the variable names with what is emitted from Sandbox API
# clusters:
# - default:
#     api_url: "{{ sandbox_openshift_api_url }}"
#     api_token: "{{ cluster_admin_agnosticd_sa_token }}"

# A password should be defined so that it can be passed to the various
# workloads for a consistent user experience
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main

requirements_content:
  collections:
  # Tenant roles (keycloak_user, namespace, gitops)
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  # GitOps bootstrap (deploys all ArgoCD apps via app-of-apps pattern)
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11


# ===================================================================
# List of workloads to be deployed
#
# The order matters:
#   1. tenant_keycloak_user     -- Create RHBK user on cluster provided by Sanbox API
#   2. tenant_namespace         -- Create a list of required namespaces
#   3. gitops_bootstrap         -- Bootstrap ArgoCD app-of-apps (deploys all tenant apps)
#   4. console_embed            -- OpenShift console iframe integration
#   5. showroom                 -- Lab/Demo UI
#
# ===================================================================
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# If you are deploying tenant workloads using GitOps, enable this
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom

# The AgnosticD 'namespace' config will automatically construct this list
# as a reverse of the 'workloads' list if it is not specificied here
remove_workloads:
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

# ===================================================================
# Variables for specific workloads
# ===================================================================

# ===================================================================
# Workload: ocp4_workload_tenant_keycloak_user
#
# Find all of the defaults here:
# https://github.com/rhpds/namespaced_workloads/tree/main/roles/ocp4_workload_tenant_keycloak_user

# Creates a single user on the cluster.
# Multiple users are not supported at this time.
#
# Both the tenant_namespace and tenant_openshift_gitops roles expect
# a standard username default (user-GUID). If you override this, you must
# set the variable for each of the namespace workloads to match.
## ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"

# ===================================================================
# Workload: ocp4_workload_tenant_namespace
#
# Find all of the defaults here:
# https://github.com/rhpds/namespaced_workloads/tree/main/roles/ocp4_workload_tenant_namespace
#
# Creates one or more namespaces in the format {username}-{suffix},
# e.g. user-GUID-myapp. If no suffixes are provided, a single namespace
# named after the user is created instead.
#
# A ClusterResourceQuota (CRQ) is created by default, scoped to the
# 'tenant: {username}' label that is applied to every namespace. This
# gives the user a shared resource pool across all their namespaces
# rather than fixed per-namespace caps.
#
# Override default_quota and default_limit_range here to size the pool
# for your workload. Set use_cluster_quota: false to use per-namespace
# ResourceQuota instead.
#
# Must match ocp4_workload_tenant_keycloak_username.
# ===================================================================
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"

# Use a ClusterResourceQuota scoped to the tenant label — gives the user
# a shared resource pool across all namespaces rather than per-namespace caps.
ocp4_workload_tenant_namespace_use_cluster_quota: true

# Namespaces to create.
# Leave empty for a single namespace = username.
ocp4_workload_tenant_namespace_suffixes:
- suffix: example1-lab
- suffix: example2-lab
- suffix: example3-lab

# Total resource pool shared across all tenant namespaces via CRQ.
# Adjust to match your workload's expected resource consumption.
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "8"
  requests.cpu: "4"
  limits.memory: 16Gi
  requests.memory: 8Gi
  requests.storage: 100Gi
  pods: "20"

# LimitRange applied to every namespace.
# Sets container defaults for pods that don't specify resource requests/limits.
#
# You don't need this if you set a limit range on each namespace, but it is
# safer to leave if you're not sure.
ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 250m
    memory: 128Mi

# ===================================================================
# Workload: ocp4_workload_gitops_bootstrap
#
# Deploys an ArgoCD bootstrap Application for each tenant pointing at
# tenant/bootstrap/ in the GitOps repo. ArgoCD manages all tenant apps
# from there (app-of-apps pattern).
#
# deployer.* values (domain, apiUrl, guid) are injected automatically
# by the role — never set them here.
# ===================================================================
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ci-template-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_repo_path: "tenant/bootstrap"
ocp4_workload_gitops_bootstrap_application_project: tenants

ocp4_workload_gitops_bootstrap_helm_values:
  # tenant.name and tenant.user.name are used by all three examples
  # to scope resource names and provision data labels to this user.
  tenant:
    name: "{{ guid }}"
    user:
      name: "{{ ocp4_workload_tenant_keycloak_username }}"

  # Example 1: Inline manifests — Deployment, Service, Route rendered directly
  # by the bootstrap chart. No sub-chart. Namespace must pre-exist.
  example1InlineResource:
    enabled: true
    namespace: "{{ ocp4_workload_tenant_keycloak_username }}-example1-lab"

  # Example 2: Helm sub-chart — bootstrap spawns a child ArgoCD Application
  # pointing at tenant/example2-helm-basic/.
  # git.targetRevision must match repo_revision above — the child app reads
  # from its own git source, independent of the bootstrap's revision.
  example2HelmBasic:
    enabled: true
    namespace: "{{ ocp4_workload_tenant_keycloak_username }}-example2-lab"

  # Example 3: Parameterized Helm sub-chart — same pattern as Example 2 but
  # every meaningful value is driven from the catalog into the child chart.
  labs:
    example3HelmParameterized:
      enabled: true
      namespace: "{{ ocp4_workload_tenant_keycloak_username }}-example3-lab"
      message: "Hello, {{ ocp4_workload_tenant_keycloak_username }}!"
      replicas: 1
      imageTag: "latest"

# ===================================================================
# Workload: ocp4_workload_showroom

# Find all of the defaults here:
# https://github.com/rhpds/showroom
#
# Find the documentation here:
# https://rhpds.github.io/showroom_template_nookbag/modules/index.html
#
# In the example below, openshift_cluster_ingress domain is provided
# by ocp4_workload_tenant_keycloak_user role in agnosticd_user_info
# ===================================================================
# These are required since the Showroom role doesn't natively know about
# them like the other namespace workloads
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
# Replace with your Showroom repo
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom_template_nookbag.git
ocp4_workload_showroom_terminal_type: ""
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: Terminal
    path: /wetty
    port: 443
  - name: OpenShift Console
    url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 975db98f-3f00-4938-8816-a54b8157745c
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com

  sandboxes:
  - kind: OcpSandbox
    cloud_selector:
      # cnv-dedicated-shared is used for clusters running on CNV
      # aws-dedicated-shared is used for clusters running on AWS
      cloud: cnv-dedicated-shared

      # Use the K:V that was provided when the cluster was
      # onboarded to Sandbox API
      lab: ex-multi-user-ocp

      # Set this to make sure you are placed in the apprpriate environment:
      # dev, test, event, prod
      # purpose: prod

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  catalog:
    display_name: "Example Multi-User OpenShift (Tenant)"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    workshopUiDisabled: false
    # Enabled this if you want the user to go straight to Showroom
    # Currently disabled to allow testing of info templates
    workshopLabUiRedirect: false
    multiuser: false
    keywords:
    - openshift
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    parameters: []

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    actions:
      # Disabled unless we have a way to start/stop tenant workloads
      start:
        disable: true
      stop:
        disable: true
