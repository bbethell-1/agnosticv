---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# Agnosticd variables
env_type: ocp-workloads
cloud_provider: none
software_to_deploy: none

target_host: localhost

__meta__:
  asset_uuid: d6e6b54b-d253-4f76-9761-d78e3690f7ba

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: OpenShift Workload Example
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters: []

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: sandboxes-gpte/SANDBOX_OCP
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
