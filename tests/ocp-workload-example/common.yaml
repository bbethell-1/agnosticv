---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# Agnosticd variables
env_type: ocp-workloads
cloud_provider: multi
software_to_deploy: none

infra_workloads:
- ocp4_workload_authentication

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_htpasswd_user_name: developer
ocp4_workload_authentication_admin_user: admin

__meta__:
  asset_uuid: d6e6b54b-d253-4f76-9761-d78e3690f7ba
  owners:
    maintainer:
    - name: Johnathan Kupferer
      email: jkupferer@redhat.com
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: OpenShift Workload Example
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    reportingLabels:
      primaryBU: RHDP
    parameters:
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.16'
        enum:
        - '4.14'
        - '4.15'
        - '4.16'
      # Parameter for openshift cluster
      components:
      - name: openshift

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: sandboxes-gpte/SANDBOX_OCP/prod
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
