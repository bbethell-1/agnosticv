---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config
test_empty_config_multi_user: true
test_empty_config_user_count: 1

__meta__:
  asset_uuid: d15a2151-3fe6-40d2-be72-bf98bc073574
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Single-User Test Config
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    reportingLabels:
      reportingGroup: Test
      primaryBU: RHDP
    workshop_user_mode: single

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
