---
# Agnosticd variables
# touched 2022-11-17
platform: babylon
env_type: test-empty-config
cloud_provider: ec2

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 1

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: dff5d655-3d73-4167-ab30-56d6a952c810
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Babylon Empty Config AWS

    labels:
      Provider: RHDP

    parameters: []

  secrets:
    - namespace: gpte
      name: gpte

    - name: empty-config-multiline
      namespace: gpte
