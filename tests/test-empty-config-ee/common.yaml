---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml

cloud_provider: test
env_type: test-empty-config
test_empty_config_multi_user: true
test_empty_config_user_count: 1

# Test chained config install collection
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9

__meta__:
  asset_uuid: ca10e9dc-2ede-4fcd-9baf-a4e64f90a4da
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: Execution Environment Test Config
    labels:
      Provider: RHDP
      Platform: RHDP
      TDP1: Other
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    reportingLabels:
      reportingGroup: Test
      primaryBU: RHDP
    workshop_user_mode: single

  deployer:
    actions:
      destroy:
        time_estimate: 2m
      provision:
        time_estimate: 2m
      start:
        time_estimate: 1m
      status:
        time_estimate: 1m
      stop:
        time_estimate: 1m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
      pull: missing
