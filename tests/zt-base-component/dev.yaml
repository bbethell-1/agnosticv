---
# Dev stage overrides
__meta__:
  deployer:
    scm_ref: main
  # __meta__.sandboxes is `overwrite` merge strategy (see .schemas/babylon.yaml),
  # so the full list from common.yaml must be repeated here even though only
  # cloud_selector.name changes. Pins this personal dev/test deploy to the
  # ocpvdev01 dev cluster instead of common.yaml's shared `purpose: prod` pool
  # (same convention as tests/zt-rhelbu-base-component/dev.yaml and
  # tests/zt-ansiblebu-base-component/dev.yaml).
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpvdev01
        virt: "yes"
      quota:
        requests.storage: "750Gi"
