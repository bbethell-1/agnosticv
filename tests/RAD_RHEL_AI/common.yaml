---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-6regions.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/access-restriction-rad-roadshow.yaml
# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
aws_region: us-east-2
# common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_password: openshift

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Post Software Workloads
# --------------------------------------------------------------------

software_workloads:
  all_omit_local:
    - novnc
    - rhel-graphical
    - podman_desktop
    - rad_setup_nvidia_cuda
    - rad_setup_instructlab
  localhost:
    - openshift_workloads

openshift_workloads:
  # Create OpenShift user
  - name: ocp4_workload_authentication_htpasswd_user
  # Deploy showroom
  - name: ocp4_workload_showroom

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rh-rad-ai-roadshow/dev-guides.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_git_ref: showroom
ocp4_workload_showroom_content_only: true

userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "rhdh_url": "https://backstage-backstage.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "rhdh_user": "user{{i}}",
    "rhdh_user_password": "{{ common_user_password }}",
    "gitlab_url": "https://gitlab-gitlab.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "gitlab_user": "user{{i}}",
    "gitlab_user_password": "{{ common_user_password }}",
    "usernum": "{{i}}",
    "cluster_id": ".apps.cluster-{{guid}}.{{guid}}{{ subdomain_base_suffix }}",
    "openshift_cluster_ingress_domain": ".apps.cluster-{{guid}}.{{guid}}{{ subdomain_base_suffix }}",
    "console_url": "https://console-openshift-console.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "devspaces_url": "https://devspaces.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "devspaces_user": "user{{i}}",
    "devspaces_user_password": "{{ common_user_password }}"
    },
  {% endfor %}
  }

ocp4_workload_authentication_htpasswd_user: openshift

setup_instructlab_git_ref: v0.19.3
# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------

novnc_proxy_port: 443

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------

install_rhel_graphical: true


use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - podman
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: instruct
student_password: "openshift"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 100
rootfs_size_bastion: 1024

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: g5.xlarge

instances:

  - name: rad-vm
    # count: "{{ num_users }}"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,radvms"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(100)  }}"
    security_groups:
      - BastionSG
      - HostSG
      - NOvncSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: NOvncSG
    rules:

      - name: ClientNOVNCPort
        description: "Client NOVNC Public"
        from_port: 6080
        to_port: 6080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotChallangePort
        description: "Lets encrypt talks to 80"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: CertBotTLSPort
        description: "TLS"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 48fa4f2e-6d7d-4b94-8265-1e4e87993e4e
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: RAD Roadshow - RHEL AI
    category: Labs
    keywords:
      - instructlab
      - parasol
      - rhel
      - ai
      - nvidia
      - cuda
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters:
      - name: openshift_api_url
        description: >-
          API URL for shared OpenShift cluster used for this workshop.
        formLabel: Shared OpenShift API URL
        openAPIV3Schema:
          type: string
      - name: openshift_api_key
        description: >-
          API key for shared OpenShift cluster used for this workshop.
        formLabel: Shared OpenShift API Key
        openAPIV3Schema:
          type: string
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
