---
purpose: development

# Test CI lifecycle integration for virtual keys
# Use the key-expiration-ci-lifecycle branch to test runtime-based expiration
# NOTE: Must include BOTH collections since YAML lists replace, not merge
requirements_content:
  collections:
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: key-expiration-ci-lifecycle  # Testing branch
  - name: https://github.com/prakhar1985/maas-rag-example.git
    type: git
    version: remove-litellm-validation

# Override duration to test CI runtime integration
# This should be ignored when agnosticd_user_info.runtime is set
ocp4_workload_litellm_virtual_keys_duration: "7d"

# Fix for destroy action - ensure virtual keys are cleaned up
current_cluster_name: default

# Simple format - let AgnosticD v2 handle cluster conversion
remove_workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# Test lifecycle hook for key extension
# Use FQCN format for Babylon compatibility
lifecycle_hooks:
  extend:
  - name: Extend LiteLLM Virtual Key
    playbook: rhpds.litellm_virtual_keys.extend_key

__meta__:
  deployer:
    scm_ref: main
