---
# Dev is the same as the common variables

# Overwrite Instance type and Image
# studentvm_instance_type: "2c2g30d"
# studentvm_instance_image: rhel-8.2
studentvm_instance_type: "t2.medium"
studentvm_rootfs_size: 100

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9
  idle_after_start: 10
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  agnosticd_git_ref: ocp4-studentvm-test-0.14

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: ocp4-studentvm-test-0.14
    type: agnosticd
  secrets:
    - name: satellite-rhel81
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: aws-gpte
      namespace: gpte
