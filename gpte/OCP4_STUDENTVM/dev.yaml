---
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml

# Dev is the same as the common variables

# Overwrite Instance type and Image
# studentvm_instance_type: "2c2g30d"
# studentvm_instance_image: rhel-8.2
studentvm_instance_type: "t2.medium"
studentvm_rootfs_size: 50
ocp_username: "{{ requester_username if requester_username is defined and requester_username | length else user }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
agnosticd_git_ref: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  #catalog:
    #namespace: babylon-catalog-dev
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
