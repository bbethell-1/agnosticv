---
platform: labs
env_type: studentvm

student_name: lab-user

# Latest stable OCP Releases (as of 2020/04/07)
ocp_client_41: "4.1.38"
ocp_client_42: "4.2.25"
ocp_client_43: "4.3.8"

## Satellite vars
repo_method: satellite
satellite_url: labsat.opentlc.com
satellite_org: Red_Hat_GPTE_Labs

# Set up FTL.
ftl_injector_tag: "v0.17.0"

# The student roles to deploy
studentvm_roles:
# Set up a Student User
- studentvm-user
# Customize the Student User with a Git Bash Prompt
- studentvm-bash-prompt
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm-ocp4
# Set up JDK and Maven
- studentvm-java-development

# Variables for role studentvm-user
studentvm_user_vars:
  # Install a user id "{{ student_name }}"
  user_name: "{{ student_name }}"
  # Use a password for the student user.
  # If false a key pair will be generated
  use_password: true
  # If no student_password is provided a randomly generated password will be used
  password: ""
  # This user will not have sudo access
  enable_sudo: false

# Variables for role studentvm-ocp4
studentvm_ocp4_vars:
  # Install for the current student
  user_name: "{{ student_name }}"
  oc_version: "{% if ocp_client_version is version_compare('4.3.0', '>=') %} {{ ocp_client_43}} {% elseif ocp_client_version is version_compare('4.2.0', '>=') and ocp_client_version is version_compare('4.3.0', '<') %} {{ ocp_client_42}} {% else %} {{ ocp_client_41 }} {% endif %}"

# Variables for role studentvm-bash-prompt
studentvm_bash_prompt_vars:
  # Install for the current student
  user_name: "{{ student_name }}"

# Variables for role studentvm-java-development
studentvm_java_development_vars:
  # Install JDK 8 (default is 11)
  jdk_package: "java-1.8.0-openjdk-devel"

# Deploy in a Ansible 2.9 Virtualenv
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    ocp_client_version: os_release
