---
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: studentvm
software_to_deploy: none

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Student roles to deploy
# -------------------------------------------------------------------
studentvm_roles:
# Set up a Student User
- studentvm_user
# Customize the Student User with a Git Bash Prompt
- studentvm_bash_prompt
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4
# Set up JDK and Maven
- studentvm_java_development

# -------------------------------------------------------------------
# student role: studentvm_user
# -------------------------------------------------------------------
# Install a user id "{{ student_name }}"
studentvm_user_name: "{{ student_name }}"
# Use a password for the student user.
# If false a key pair will be generated
studentvm_user_use_password: true
# If no student_password is provided a randomly generated password will be used
studentvm_user_password: ""
# This user will have sudo access
studentvm_user_enable_sudo: true

# -------------------------------------------------------------------
# Instance Details
# -------------------------------------------------------------------
studentvm_instance_type: "t3.medium"
studentvm_rootfs_size: 100
studentvm_instance_image: RHEL84GOLD-latest
key_name: "{{ env_authorized_key }}"

# -------------------------------------------------------------------
# student role: studentvm_ocp4
# -------------------------------------------------------------------
# Install for the current student
studentvm_ocp4_user_name: "{{ student_name }}"
studentvm_ocp4_oc_version: "{% if osrelease is version_compare('4.6.0', '>=') %}4.6{% elif osrelease is version_compare('4.5.0', '>=') and osrelease is version_compare('4.6.0', '<') %}4.5{% else %}4.4{% endif %}"
studentvm_ocp4_helm_version: '3.5.0'
studentvm_ocp4_odo_version: 'v2.0.4'
studentvm_ocp4_tkn_version: '0.15.0'
studentvm_ocp4_kn_version: '0.18.4'
studentvm_ocp4_opm_version: 'v1.16.1'
studentvm_ocp4_istioctl_version: '1.4.10'

# -------------------------------------------------------------------
# student role: studentvm_bash_prompt
# -------------------------------------------------------------------
# Install for the current student
studentvm_bash_prompt_user_name: "{{ student_name }}"

# -------------------------------------------------------------------
# student role: studentvm_java_development
# -------------------------------------------------------------------
# Install JDK 8 (default is 11)
studentvm_java_development_jdk_package: "java-1.8.0-openjdk-devel"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  access_control:
    allow_groups:
    - babylon-admins
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    display_name: OpenShift 4 Student VM
    category: Labs
    keywords:
    - lab
    - ocp4
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHPDS
      Product_Family: Red_Hat_Cloud
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: aws-gpte
    namespace: gpte
