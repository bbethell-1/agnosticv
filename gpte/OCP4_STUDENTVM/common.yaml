---
platform: labs
env_type: studentvm

student_name: lab-user

# Latest stable OCP Releases (as of 2020/04/28)
ocp_client_41: "4.1.41"
ocp_client_42: "4.2.29"
ocp_client_43: "4.3.13"
ocp_client_44: "4.4.0"

## Satellite vars
repo_method: satellite
satellite_url: labsat.opentlc.com
satellite_org: Red_Hat_GPTE_Labs

# Set up FTL.
ftl_injector_tag: "v0.17.0"

# The student roles to deploy
studentvm_roles:
# Set up a Student User
- studentvm_user
# Customize the Student User with a Git Bash Prompt
- studentvm_bash_prompt
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4
# Set up JDK and Maven
- studentvm_java_development

# Variables for role studentvm_user
# ---------------------------------
# Install a user id "{{ student_name }}"
studentvm_user_name: "{{ student_name }}"
# Use a password for the student user.
# If false a key pair will be generated
studentvm_user_use_password: true
# If no student_password is provided a randomly generated password will be used
studentvm_user_password: ""
# This user will not have sudo access
studentvm_user_enable_sudo: true

# Variables for role studentvm_ocp4
# ---------------------------------

# Install for the current student
studentvm_ocp4_user_name: "{{ student_name }}"
studentvm_ocp4_oc_version: "{% if osrelease is version_compare('4.4.0', '>=') %}{{ ocp_client_44}}{% elif osrelease is version_compare('4.3.0', '>=') and osrelease is version_compare('4.4.0', '<') %}{{ ocp_client_43}}{% elif osrelease is version_compare('4.2.0', '>=') and osrelease is version_compare('4.3.0', '<') %}{{ ocp_client_42}}{% else %}{{ ocp_client_41 }}{% endif %}"
studentvm_ocp4_odo_version: 'v1.1.2'
studentvm_ocp4_kn_version: 'v0.13.2'

# Variables for role studentvm-bash-prompt
# ----------------------------------------

# Install for the current student
studentvm_bash_prompt_user_name: "{{ student_name }}"

# Variables for role studentvm-java-development
# ----------------------------------------
# Install JDK 8 (default is 11)
studentvm_java_development_jdk_package: "java-1.8.0-openjdk-devel"

# Deploy in a Ansible 2.9 Virtualenv
agnosticv_meta:
  virtualenv: aws-ansible-2.9
