---
# Original Course: Red Hat Summit 2020 - T78321 - The Definitive Red Hat Enterprise Linux 8
# This is currently a Novello config, but temporarily being migrated to AWS
# AWS config creation date: February 11, 2021
# Owner: cdoerbec@redhat.com
# Platform

platform: RHPDS

# Config
env_type: ansible-multitier-rhel8

key_name: opentlc_admin_backdoor # Keyname must exist in AWS

# Satellite Vars:
use_content_view: true
satellite_activationkey: agd-training

bookbag_git_repo: https://gitlab.com/2020-summit-labs/definitive-rhel8-workshop-bookbag.git
ansible_user: ec2-user
remote_user: ec2-user

# Instance type
student_name: student
install_student_user: true

admin_user: opentlc-mgr

update_all_packages: true

agnosticv_meta:
  virtualenv: aws-ansible-2.9

  secrets:
    - bookbag-deployer-na4
    - guidgrabber-api
    - gpte-no-repos
    - labsat-secrets
