# Red Hat Summit 2020 - T3656Da (OCP3 Cluster) - Migrating applications from OCP/OCS 3 to OCP/OCS 4 a hands-on lab
purpose: development  ## This is a cost tag, please make sure it's correct.
cloudformation_retries: 0

#lets_encrypt_production: True
#install_lets_encrypt_certificates: true

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m5.xlarge
_infranode_instance_type: m5.4xlarge
infranode_instance_count: 0
_node_instance_type: m5.4xlarge
_node_instance_count: 2
_support_instance_type: m5.4xlarge

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_url: https://github.com/konveyor/agnosticd.git
