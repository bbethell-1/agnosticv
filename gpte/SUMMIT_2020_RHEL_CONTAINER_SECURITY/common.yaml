---
# Red Hat Summit 2020 - T0A529 - A Practical Introduction to Container Security
# course_id: RHS_2020_T0A529

# Platform
platform: RHPDS

# Config
env_type: rhel-container-security

#
# Satellite vars
#
repo_method: satellite
use_content_view: true
#satellite_url: labsat.opentlc.com
#satellite_org: Red_Hat_GPTE_Labs
#satellite_activationkey: rhel8-summit
#satellite_activationkey: rhel81

# Package install
#
# Run a full yum update and install packages

update_packages: true

# --- Generic Variables
cloudformation_retries: 10
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    username: student_name
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite secrets and vars
  - gpte
