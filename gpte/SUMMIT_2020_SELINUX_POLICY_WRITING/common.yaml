---
# Red Hat Summit 2020 - T25198 - SELinux Policy Writing Lab

env_type: selinux-policy
output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}

# subdomain_base_suffix is in account.yaml
# subdomain_base_suffix: .events.opentlc.com

repo_method: satellite
satellite_url: labsat.opentlc.com
satellite_activationkey: rhel8-summit
satellite_org: Red_Hat_GPTE_Labs
use_content_view: true

# Cloud specfic (AWS) settings.
cloud_provider: ec2                     # Which AgnosticD Cloud Provider to use
remote_user: ec2-user                   # Needed to workaround some bug.
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: r3dh4t1!
# email: gpte-devops-automation@redhat.com

# DANGER ZONE
#
# AWS Credentials. These are required (don't sync them to your fork!!)
# aws_access_key_id:
# aws_secret_access_key:
# Create a file e.g. agnosticd/ansible/my_secret_vars.yml and put all your keys etc into it.
#
update_packages: true
common_packages:
  - python3     # (removed for RHEL8 because python3 was installed in cloud_providers/ec2_infrastructure_deployment.yml)
  - unzip
  - bash-completion
  - tmux
  - wget
  - git
  - vim-enhanced
  - at
  - podman
  - buildah
  - skopeo

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  nuke_sandbox: false
  secrets:
  # OpenShift Pull Secret
    - ocp4_token
  # Satellite secrets and vars
    - gpte
  params_to_variables:
    username: student_name
