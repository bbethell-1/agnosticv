---
# Red Hat Summit 2020 - T25198 - SELinux Policy Writing Lab
purpose: development  ## This is a cost tag, please make sure it's correct.

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  deploy_with: babylon

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    git_tag_prefix: summit-2020-selinux-policy-writing-prod
  secrets:
    - namespace: gpte
      name: ocp4_token
    - namespace: gpte
      name: gpte
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: guidgrabber-api
