---
# Platform
platform: babylon
subdomain_base_suffix: .open.redhat.com
HostedZoneId: ZCRCH49OF7I9E
# Saving additional subdomain and its zone for emergency switch
#subdomain_base_suffix: .example.opentlc.com
#HostedZoneId: Z3IHLWJZOU9SRT

# For now, use a generic user for all deployment

owner: generic-babylon

# Config

env_type: ocp4-workshop
key_name: ocpkey
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.1.14"
run_janitor: false

# Repos
osrelease: 4.1.0
repo_version: '4.1'

# Generic Variables
install_ipa_client: false
repo_method: file
install_ftl: false

# Student User on Bastion
install_student_user: true

# OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift

# Default workloads are a YAML list
default_workloads:
  - ocp4-workload-project-request-template
  - ocp4-workload-opentlc-production
  - ocp-workload-terminal
  - ocp4-workload-enable-lets-encrypt-certificates

__meta__:
  secrets:
    - gpte-rw-aws-creds

  catalog:
    namespace: openshift

    description: >-
      OCP Workshop for GPTE DevOps and Automation team

    parameters:
      - name: ocp4_installer_version
        description: "Version of OpenShift Installer"
        value: 4.1.14

      - name: aws_region
        description: >-
          The AWS region you want to deploy the environment.
        value: us-east-1

      - name: worker_instance_count
        description: >-
          The number of workers
        value: 2

    tags:
      - babylon
      - ocp
      - ocp-workshop

  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    scm_ref: development
    type: agnosticd

  tower:
    oragnization: gpte
