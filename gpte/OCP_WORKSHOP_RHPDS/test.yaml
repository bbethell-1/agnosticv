---
purpose: TEST
lets_encrypt_production: true

run_ocp_diagnostics: false
cloudformation_retries: 0

osrelease: '3.11.272'
repo_version: '3.11'

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m4.4xlarge
infranode_instance_type: m4.4xlarge
node_instance_type: m4.4xlarge
support_instance_type: t2.medium

agnosticv_meta:
  deploy_with: babylon
  agnosticd_git_tag_prefix: ocp-workshop-rhpds-test

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    parameters:
    - name: node_instance_count
    - name: student_name
  deployer:
    virtualenv: aws-ansible-2.9
    git_tag_prefix: ocp-workshop-rhpds-test
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
