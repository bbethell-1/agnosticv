---
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Adv App Deploy ILT (Final Lab VM)
# --- ELT/ILT: ILT
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: studentvm
software_to_deploy: none

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
# Set up FTL.
install_ftl: true

# -------------------------------------------------------------------
# Student roles to deploy
# -------------------------------------------------------------------
studentvm_roles:
# Set up a Student User
- studentvm_user
# Customize the Student User with a Git Bash Prompt
- studentvm_bash_prompt
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4
# Set up JDK and Maven
- studentvm_java_development
# Set up Ansible
- studentvm_ansible

# -------------------------------------------------------------------
# student role: studentvm_user
# -------------------------------------------------------------------
# Install a user id "{{ student_name }}"
studentvm_user_name: "{{ student_name }}"
# Use a password for the student user.
# If false a key pair will be generated
studentvm_user_use_password: true
# If no student_password is provided a randomly generated password will be used
studentvm_user_password: ""
# This user will have sudo access
studentvm_user_enable_sudo: true

# -------------------------------------------------------------------
# student role: studentvm_ocp4
# -------------------------------------------------------------------
# Install for the current student
studentvm_ocp4_user_name: "{{ student_name }}"

studentvm_ocp4_oc_install: true
# '4.7' installs latest stable version for that release
studentvm_ocp4_oc_version: '4.6'

studentvm_ocp4_odo_install: false
# studentvm_ocp4_odo_version: 'v2.0.7'

studentvm_ocp4_helm_install: true
studentvm_ocp4_helm_version: '3.5.0'

studentvm_ocp4_tkn_install: true
studentvm_ocp4_tkn_version: '0.13.1'

studentvm_ocp4_kn_install: true
studentvm_ocp4_kn_version: '0.13.2'

studentvm_ocp4_opm_install: false
# studentvm_ocp4_opm_version: 'v1.16.1'

studentvm_ocp4_kam_install: false
# studentvm_ocp4_kam_version: v1.0.0

studentvm_ocp4_istioctl_install: false
# studentvm_ocp4_istioctl_version: '1.4.10'

studentvm_ocp4_kubeseal_install: false
# studentvm_ocp4_kubeseal_version: v0.15.0

studentvm_ocp4_kustomize_install: true
studentvm_ocp4_kustomize_version: v4.0.5

studentvm_ocp4_argocd_install: true
studentvm_ocp4_argocd_version: v2.0.1

studentvm_ocp4_s2i_install: false
# studentvm_ocp4_s2i_url: https://github.com/openshift/source-to-image/releases/download/v1.3.1/source-to-image-v1.3.1-a5a77147-linux-amd64.tar.gz

# -------------------------------------------------------------------
# student role: studentvm_bash_prompt
# -------------------------------------------------------------------
# Install for the current student
studentvm_bash_prompt_user_name: "{{ student_name }}"

# -------------------------------------------------------------------
# student role: studentvm_java_development
# -------------------------------------------------------------------
studentvm_java_development_jdk_install: true
studentvm_java_development_jdk_package: "java-11-openjdk-devel"
studentvm_java_development_maven_install: true
studentvm_java_development_maven_version: "3.6.3"
studentvm_java_development_mandrel_install: true
studentvm_java_development_mandrel_version: "21.0.0.0.Final"

# -------------------------------------------------------------------
# student role: studentvm_ansible
# -------------------------------------------------------------------
studentvm_ansible_ansible_install: true
studentvm_ansible_ansible_version: "2.10.7"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: daf17c48-dbfb-42bc-ad69-fa51197d2a7c
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: OpenShift 4 Adv App Deploy ILT (Final Lab VM)
    namespace: gpte
    parameters: []
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: aws-gpte
    namespace: gpte
