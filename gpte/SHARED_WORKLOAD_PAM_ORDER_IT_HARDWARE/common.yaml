---
#include /includes/parameters/purpose.yaml

# Catalog Item: RHPAM 7: Order IT Hardware Demo
# Catalog: Middleware Solution Demos
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp-workload-pam-order-it-hardware

# This workload must be run as opentlc-mgr because it has tasks
# requiring sudo.
ansible_user: opentlc-mgr
ansible_ssh_private_key_file: /home/opentlc-mgr/.ssh/opentlc_admin_backdoor.pem

# Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# AgnosticV Meta variables
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ocp_username
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: "RHPAM 7: Order IT Hardware Demo"
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords:
    - shared
    - aws
    labels:
      Product: Red_Hat_Process_Automation_Manager
      #OpenShift_Version: "3.11"
      Provider: Application_Services_BU
      Product_Family: Red_Hat_Application_Services
  lifespan:
    default: 2d
    maximum: 10d
    relativeMaximum: 10d
  runtime:
    default: 6h
    maximum: 48h
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite_ocp_on_osp_secret
    namespace: gpte
