---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/opentlc-mgr-private-key.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/requester_email.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp-workloads
cloud_provider: none

# -------------------------------------------------------------------
# Workload Vars
# -------------------------------------------------------------------
ocp_workload: ocp-workload-pam-order-it-hardware
ocp_username: "{{ requester_username | replace('@', '-') }}"
workload_shared_deployment: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: RHPAM 7 Order IT Hardware Demo
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords:
    - shared
    - aws
    - IT
    - it
    - pam
    - rhpam
    - rhpam7
    - pam7
    labels:
      Product: Red_Hat_Process_Automation_Manager
      #OpenShift_Version: "3.11"
      Provider: Application_Services_BU
      Product_Family: Red_Hat_Application_Services
  lifespan:
    default: 2d
    maximum: 10d
    relativeMaximum: 10d
  runtime:
    default: 6h
    maximum: 48h
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite_ocp_on_osp_secret
    namespace: gpte
