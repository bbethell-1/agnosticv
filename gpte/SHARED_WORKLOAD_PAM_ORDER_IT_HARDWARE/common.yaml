---
# Catalog Item: RHPAM 7: Order IT Hardware Demo
# Catalog: Middleware Solution Demos
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp-workload-pam-order-it-hardware

# This workload must be run as opentlc-mgr because it has tasks
# requiring sudo.
ansible_user: opentlc-mgr
ansible_ssh_private_key_file: /home/opentlc-mgr/.ssh/opentlc_admin_backdoor.pem

# Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username
