---
# Provision access to the Shared OpenShift Cluster on RHPDS
# Catalog Details in (dev | prod | test).yaml
# Tag Prefix: shared-rhpds-developer-env-44

# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_developer_environment

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username
