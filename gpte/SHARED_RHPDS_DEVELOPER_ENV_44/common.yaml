---
# Provision access to the Shared OpenShift Cluster on RHPDS
# Catalog Details in (dev | prod | test).yaml
# Tag Prefix: shared-rhpds-developer-env-44

# --- Platform
platform: rhpds

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access

# --- Workload parameters
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
ocp4_workload_shared_cluster_access_create_quota: true
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-rhpds-developer-env-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "5"
    limits.cpu: "10"
    requests.memory: 6Gi
    limits.memory: 20Gi
    pods: "20"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username
