---
# Catalog Item: OpenShift Disconnected HA Lab
# OPENTLC OpenShift Labs

platform: labs

env_type: ocp-ha-disconnected-lab
key_name: ocpkey

repo_method: file
repo_version: 3.11
software_to_deploy: openshift
osrelease: 3.11.129
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}

install_ipa_client: true
install_idm: htpasswd
install_nfs: true
install_lets_encrypt_certificates: false
install_ftl: false
ovs_plugin: networkpolicy
container_runtime: docker

bastion_instance_type: t2.large
master_instance_type: t2.large
infranode_instance_type: t2.xlarge
node_instance_type: t2.large
support_instance_type: t2.medium
isolated_instance_type: t2.large
node_instance_count: 2
infranode_instance_count: 2
master_instance_count: 3

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  ansible_additional_args: --skip-tags installing_openshift,get_openshift_credentials,openshift_nfs_config
  secrets:
  - ocpkey

