---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# -------------------------------------------------------------------
# --- Catalog Item: POC Ansible Windows workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
__image: RHEL84GOLD-latest
__instance_type: t2.medium
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: t3.medium

key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | d('unknown') }}"
#num_users: 5
aws_region: us-east-2
user_base: student

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
- name: WebSG
  rules:
  - name: HTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: HTTPSPorts
    description: "HTTP Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
- name: HostSG
  rules:
  - name: FromHostSG
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: -1
    from_group: HostSG
    rule_type: Ingress
- name: WinSG
  rules:
  - name: WinSGTCP
    description: "All TCP"
    from_port: 1
    to_port: 65535
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WinSGUdp
    description: "All UDP"
    from_port: 1
    to_port: 65535
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------
windows_password: 'jVMijRwLbI02gFCo2xkjlZ9lxEA7bm7zgg=='
__windows_instance_type: m5.2xlarge
__windows_instance_image: WIN2019
__windows_instance_image_id: ami-0bf9c6c2e7ac638a4

subdomain_base_suffix: "example.opentlc.com"
ocp4_base_domain: "{{ subdomain_base_suffix }}"

instances:
- name: bastion
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(__image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(__instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - BastionSG
  - WebSG
  - HostSG
- name: win
  count: "{{ windows_server_instance_count | default(num_users) }}"
  public_dns: true
  image:
    name: "Windows_Server-2016-English-Full-Base*"
  flavor:
    ec2: "{{ windows_server_instance_type | default(__windows_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "servers"
  - key: "ostype"
    value: "windows"
  security_groups:
  - DefaultSG
  - WinSG
  - HostSG
  UserData: |
       UserData:
              "Fn::Base64":
                 "Fn::Join":
                   - ""
                   - - "<powershell>\n"
                     - "$admin = [adsi]('WinNT://./administrator, user')\n"
                     - "$admin.PSBase.Invoke('SetPassword', '{{windows_password}}')\n"
                     - "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n"
                     - "$scriptPath=((New-Object System.Net.Webclient).DownloadString('https://raw.githubusercontent.com/ansible/ansible/devel/examples/scripts/ConfigureRemotingForAnsible.ps1'))\n"
                     - "Invoke-Command -ScriptBlock ([scriptblock]::Create($scriptPath)) -ArgumentList '-skipNetworkProfileCheck'\n"
                     - "</powershell>"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_1' }}"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 3
worker_instance_type: m5.4xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: "{{ user_base }}"
student_password: "{{ common_password }}"
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_authentication             # all segments
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_codeserver
- ocp4_workload_gitops_aap
- automation-controller-config

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: "{{ user_base }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v1.3.0

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.16.8"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: dev-admin
ocp4_workload_gitea_operator_admin_email: dev-admin@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/redhat-gpte-devopsautomation/workshop_project.git
  name: workshop_project
  private: false

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_codeserver
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_codeserver_name: codeserver
ocp4_workload_codeserver_workspace_name: ide
ocp4_workload_codeserver_password: "{{ common_password }}"
ocp4_workload_codeserver_pvc_size: 3Gi
ocp4_workload_codeserver_gitea_name: gitea
ocp4_workload_codeserver_gitea_namespace: gitea
ocp4_workload_codeserver_extensions:
- filename: auchenberg.vscode-browser-preview-0.7.2.vsix
  url: https://gpte-public.s3.amazonaws.com/vscode-plugins/auchenberg.vscode-browser-preview-0.7.2.vsix

ocp4_workload_codeserver_multi_user_install: true
ocp4_workload_codeserver_multi_user_num_users: "{{ num_users }}"
ocp4_workload_codeserver_multi_user_username_base: "{{ user_base }}"
ocp4_workload_codeserver_multi_user_namespace_base: workshop
ocp4_workload_codeserver_repos_user: "{{ user_base }}1"
ocp4_workload_codeserver_repos_password: "{{ common_password }}"
ocp4_workload_codeserver_repos:
- name: workshop_project
  # account: "{{ user_base }}1"
  branch: main
# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_aap
# -------------------------------------------------------------------
ocp4_workload_gitops_aap_install_controller: true
ocp4_workload_gitops_aap_install_hub: false
ocp4_workload_gitops_aap_enable_multiuser_controller: true
ocp4_workload_gitops_aap_multiuser_num_users: "{{ num_users }}"
ocp4_workload_gitops_aap_multiuser_username_base: "{{ user_base }}"
ocp4_workload_gitops_aap_multiuser_namespace_base: workshop

# -------------------------------------------------------------------
# Workload: automation-controller-config
# -------------------------------------------------------------------
automation_controller_upload_manifest: true
automationcontroller_manifest_url: https://gpte-public.s3.amazonaws.com/aap2-subscription/manifest_31_10_2022.zip

ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"
ssh_publickey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path_pub) }}"
account_user_access_key: "{{ aws_access_key_id }}"
account_user_secret_access_key: "{{ aws_secret_access_key }}"

automation_controller_config_multiple_controllers: true
automation_controller_config_multiple_controllers_dictionary: "{{ lookup('agnosticd_user_data','users')}}"

automation_controller_users:
- name: "{{ controller.key }}"
  password: "{{ common_password }}"
  email: "{{ controller.key }}@fake.com"
  superuser: true

automation_controller_credentials:
- name: "Workshop Credential"
  description: "Workshop Credential"
  organization: Default
  credential_type: Machine
  username: Administrator
  password: "{{ windows_password }}"
  become_method: runas
- name: "Controller Credential"
  description: "Controller Credential"
  organization: Default
  credential_type: "Red Hat Ansible Automation Platform"
  host: "{{ _automation_controller_config_controller_host }}"
  username: "{{ _automation_controller_config_controller_username }}"
  password: "{{ _automation_controller_config_controller_password }}"
- name: "Demo Credential"
  credential_type: Machine
  state: absent
- name: aws_readonly_cred
  credential_type: "Amazon Web Services"
  username: "{{ account_user_access_key }}"
  password: "{{ account_user_secret_access_key }}"

automation_controller_projects:
- name: "Demo Project"
  state: absent

automation_controller_inventories:
- name: "Demo Inventory"
  state: absent
- name: "Workshop Inventory"
  description: "Workshop Inventory"

automation_controller_inventory_groups:
- name: windows
  inventory: "Workshop Inventory"
  variables:
    ansible_connection: winrm
    ansible_port: 5986
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_transport: basic

automation_controller_inventory_sources:
- name: "win_ec2"
  inventory: "Workshop Inventory"
  credential: "aws_readonly_cred"
  source: ec2
  source_vars:
    hostnames:
    - tag:Name
    compose:
      ansible_host: public_ip_address
    include_filters:
    - tag:internaldns:
      - "win{{ controller.key.split()[0] | last }}.{{ guid }}.internal"
    groups:
      windows: tags.internaldns == 'win{{ controller.key.split()[0] | last }}.{{ guid }}.internal'

automation_controller_execution_environments:
- name: "windows workshop execution environment"
  image: quay.io/acme_corp/windows_ee:latest
  pull: missing

automation_controller_settings:
- name: AD_HOC_COMMANDS
  arguments:
  - 'command'
  - 'shell'
  - 'ping'
  - 'setup'
  - 'win_ping'
  - 'win_service'
  - 'win_updates'
  - 'win_group'
  - 'win_user'
  - 'win_shell'
  - 'win_feature'
  - 'win_reboot'
  - 'win_chocolatey'

automation_controller_jobtemplates:
- name: "Demo Job Template"
  state: absent

automation_controller_ad_hoc_commands:
- module_name: win_user
  module_args: >-
    name={{ controller.key }}
    password={{ common_password }}
    groups=Administrators
    state=present
  inventory: "Workshop Inventory"
  limit: "windows"
  execution_environment: "windows workshop execution environment"
  credential: "Workshop Credential"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: windows-ansible2.9-python2.7-2022-01-11
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: POC Ansible Windows Workshop
    category: Workshops
    keywords:
    - poc
    - win
    - aap2
    - ansible
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 1
        maximum: 50
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
  - name: gpte
    namespace: gpte
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: rhods-git-secret
    namespace: gpte
#   - name: output-dir-s3
#     namespace: gpte
