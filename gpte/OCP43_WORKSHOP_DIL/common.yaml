---
platform: RHPDS

env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.4.3"

repo_method: file

cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

install_student_user: true

install_idm: htpasswd
admin_user: admin
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift

infra_workloads:
  - ocp4-workload-enable-lets-encrypt-certificates
  - ocp4-workload-dil-streaming

osrelease: 4.4.0

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: worker_instance_count_cf
  nuke_sandbox: false
