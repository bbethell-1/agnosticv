---
# Platform
platform: RHPDS

# Config
env_type: ocp-workshop
software_to_deploy: openshift
install_openshiftapb: true
install_lets_encrypt_certificates: true
install_nexus: false
ovs_plugin: networkpolicy
enable_workshops_catalog: true
# ignore_self_provisioners: true
install_ipa_client: true

subdomain_base_suffix: .open.redhat.com
HostedZoneId: ZCRCH49OF7I9E

# Repos
repo_method: file

# OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
user_password: openshift

# Default workloads are a YAML list
default_workloads:
  - ocp-workload-integreatly

agnosticv_meta:
  params_to_variables:
    nodecount: node_instance_count
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
