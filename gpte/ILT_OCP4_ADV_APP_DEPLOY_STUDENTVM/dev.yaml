---
# Dev is the same as the common variables

# Overwrite Instance type and Image
# studentvm_instance_type: "2c2g30d"
# studentvm_instance_image: rhel-8.2
# Needs t2.large for 8GB of memory (for Mandrel native compilation)
studentvm_instance_type: "t2.large"
studentvm_rootfs_size: 200

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
agnosticd_git_ref: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
