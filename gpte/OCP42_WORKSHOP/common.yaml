---
# Platform
platform: labs

# These come from the account
# subdomain_base_suffix: .example.opentlc.com
# HostedZoneId: Z3IHLWJZOU9SRT

# Config
env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.2.13"
run_janitor: false

# Repos
osrelease: 4.1.0
repo_version: '4.1'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: true
# Student_name not set -> Requestor
# Password not set -> generate
# student_name: lab_user
# student_password: rhte2019

# OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_count: 200
user_password: r3dh4t1!

# Workload Variables
#_terminal_image: quay.io/gpte-devops-automation/clientvm-terminal:0.33

# Default workloads are a YAML list
default_workloads:
  - ocp4-workload-project-request-template
  - ocp4-workload-opentlc-production
  - ocp-workload-terminal
  - ocp4-workload-enable-lets-encrypt-certificates

# Infra and Student Workloads are comma separated strings
infra_workloads: ""

# Run Student Workload to give all students cluster-admin permissions
student_workloads: ""

agnosticv_meta:
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: nodecount_ignored
    letsencrypt: letsencrypt_ignored
    letsencrypt_production: letsencrypt_production_ignored
