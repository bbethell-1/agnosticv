---
purpose: development
cloudformation_retries: 0

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t3a.medium

# Workload Variables
install_lets_encrypt_certificates: false
_lets_encrypt_certificates_install_api: False

default_workloads:
  - ocp4-workload-project-request-template
  - ocp4-workload-opentlc-production
  - ocp4-workload-enable-lets-encrypt-certificates
  - ocp-workload-terminal

agnosticv_meta:
  idle_after_deploy: 2
  idle_after_start: 4
