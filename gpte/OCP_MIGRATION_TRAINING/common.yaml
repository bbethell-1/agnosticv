---
#include /includes/secrets/demosat-rhel81.yaml

platform: labs
env_type: ocp-workshop

software_to_deploy: openshift

repo_method: satellite

install_ipa_client: false
install_openshiftapb: false
install_nexus: false
install_lets_encrypt_certificates: false
lets_encrypt_production: false
install_metrics: true
install_logging: true
ovs_plugin: networkpolicy
enable_workshops_catalog: false

# --- This is a Lab Environment -> Install FTL (when I write FTL for Migration)
install_ftl: false

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password:
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
install_idm: htpasswd
admin_user: admin
# --- admin_password required, no defaults in agnosticd
admin_password: r3dh4t1!

run_ocp_diagnostics: false
cloudformation_retries: 0

osrelease: '3.11.272'
repo_version: '3.11'
# --- This is a Lab Environment -> install k8s ansible modules with virtualenv = FALSE
install_k8s_modules: false

# -- Probably best to put instance configs in prod.yaml
bastion_instance_type: t2.large
master_instance_type: m5.4xlarge
infranode_instance_type: m5.4xlarge
node_instance_type: m5.4xlarge
node_instance_count: 2
support_instance_type: m5.large
support_instance_public_dns: true
# -- m5 and t3 types require NVME
# nfs_device: /dev/nvme2n1

nfs_exports_config: "*(insecure,rw,no_root_squash,no_wdelay,sync)"
nfs_server_address: "support1.{{ guid }}{{ subdomain_base_suffix }}"
user_vols_size: 20Gi

mssql_cpu_requests: "0.5"
mssql_memory_requests: "2Gi"

# Don't need ocp-workload-migration-training - it's a NOOP
infra_workloads: "ocp-workload-parks-app,ocp-workload-sock-shop,ocp-workload-mssql,ocp-workload-mssql,ocp-workload-robot-shop,ocp-workload-rocket-chat,ocp-workload-mediawiki"

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    ocprelease: osrelease_ignore
    install_lets_encrypt_certificates: install_lets_encrypt_certificates_ignore
    letsencrypt_production: letsencrypt_production_ignore
  secrets:
  - satellite-rhel78-ocp311

__meta__:
  asset_uuid: 52ff1a6a-7cad-4463-baa3-6a6a7eb25047
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: OCP Migration Lab - OCP 3 Cluster
