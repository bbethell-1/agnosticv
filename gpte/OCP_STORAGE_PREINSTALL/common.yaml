---
# OpenShift Storage Lab
platform: labs

# Config
env_type: ocp-storage-cns
key_name: ocpkey

# HostedZoneIdcome from the account
# HostedZoneId: Z3IHLWJZOU9SRT
subdomain_base_suffix: .example.opentlc.com

# Repos
osrelease: 3.9.51
repo_method: file
repo_version: 3.9
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/3.9.51/
# own_repo_path is inherited from default account settings based on osrelease

# install_ipa_client and ipa_host_password passed from cloudforms
install_ipa_client: true
install_glusterfs: true
enable_glusterfs: false
install_idm: htpasswd
software_to_deploy: openshift

nfs_exports_config: "*(insecure,rw,no_root_squash,no_wdelay,sync)"

# AgnosticV Meta variables
agnosticv_meta:
  ansible_additional_args: --skip-tags overwrite_hosts_with_lab_hosts,preserve_complete_ansible_inventory
  secrets:
    - ocpkey
