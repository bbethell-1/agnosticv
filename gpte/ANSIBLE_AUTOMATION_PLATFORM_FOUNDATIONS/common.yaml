---
platform: labs
env_type: ansible-platform-foundations

# Environment-specific settings

## User settings
# --- student_name not set -> Requestor User ID is used as student_name
# --- student_password not set -> generate random password
install_student_user: true

# Deploy in a Ansible 2.9 Virtualenv
agnosticv_meta:
  virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - gpte-no-repos
    - satellite-rhel81-ha
    - ans-tower-lab_license
    - output-dir-s3
  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    username: student_name

repo_method: satellite
set_repositories_satellite_activationkey: aapf-labs

install_bastion: false
install_common: true
install_bastion_lite: true

# Default instance type
instance_type: "t2.medium"
tower_instance_type: "t2.xlarge"

# Default Image
image: RHEL8GOLD-latest

software_to_deploy: tower

tower_version: 3.7.1-1
tower_hostname: "tower1.{{ subdomain_base }}"

tower_user_accounts:
  - user: devops
    password: "{{ devops_password_tower }}"
    email: devops@example.com
    firstname: Devon
    lastname: Operations
    superuser: yes

tower_projects:
  - name: Webserver SCM
    description: Webserver Deployment Project
    organization: Default
    scm_url: https://github.com/wilson-walrus/ansible-automation-platform-labs.git
    scm_type: git
    state: present
    tower_host: "{{ tower_hostname }}"
    tower_username: admin
    tower_password: "{{ tower_admin_password }}"

tower_inventories:
  - name: Webserver Inventory
    description: Webserver Inventory
    organization: Default

tower_inventory_source:
  - name: Webserver Static
    description: Sourced from project
    inventory: Webserver Inventory
    source: scm
    source_project: Webserver SCM
    source_path: hosts-ec2
    update_on_launch: yes
    state: present

tower_credentials:
  - name: Webserver Private Key
    username: ec2-user
    description: Private key to connect to Webservers
    organization: Default
    type: ssh
    become_method: sudo
    state: present
    ssh_key_data: "{{ lookup('file', '{{ output_dir}}/{{ guid }}key') }}"

tower_job_templates:
  - name: Webserver Deploy
    description: Deploy Webservers
    inventory: Webserver Inventory
    credential: Webserver Private Key
    project: Webserver SCM
    playbook: main.yml
    become: yes
    ask_extra_vars: no

