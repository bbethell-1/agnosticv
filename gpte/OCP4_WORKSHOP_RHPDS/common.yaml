---
# Platform
platform: RHPDS
subdomain_base_suffix: .open.redhat.com
HostedZoneId: ZCRCH49OF7I9E
# Saving additional subdomain and its zone for emergency switch
#subdomain_base_suffix: .example.opentlc.com
#HostedZoneId: Z3IHLWJZOU9SRT

# Config
env_type: ocp4-workshop
key_name: ocpkey
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.1.24"
run_janitor: false

# Repos
osrelease: 4.1.0
repo_version: '4.1'

# Generic Variables
install_ipa_client: false
repo_method: file
install_ftl: false

# Student User on Bastion
install_student_user: true

# OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift

# Default workloads are a YAML list
default_workloads:
  - ocp4-workload-project-request-template
  - ocp4-workload-opentlc-production
  - ocp-workload-terminal
  - ocp4-workload-enable-lets-encrypt-certificates

# Tags to AWS Instances.
cloud_tags:
  #owner: wkulhane@redhat.com
  #course_name: OpenShift 4 Workshop
  platform: "{{ platform | d('unknown') }}"
  #purpose: OCP4 Workshop

agnosticv_meta:
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
