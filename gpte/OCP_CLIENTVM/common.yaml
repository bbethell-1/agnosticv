---
platform: labs
env_type: ocp-clientvm
software_to_deploy: none
clientvm_instance_image: RHEL77GOLD
clientvm_instance_type: t2.large
install_ftl: false
install_ipa_client: false
ocp4_cluster_show_default_user_info: true
install_student_user: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: fff81b32-50cc-4699-8044-de7c97af71b4
  catalog:
    namespace: gpte
    display_name: OCP Client VM
    category: Demos
    parameters:
      - name: student_name
      - name: cloud_tags
      - name: course_name
      - name: email
      - name: ipa_host_password
      - name: install_lets_encrypt_certificates
      - name: osrelease
      - name: platform
      - name: aws_region
  anarchy:
    namespace: babylon-anarchy-gpte
  tower:
    organization: gpte
  secrets:
    - name: gpte
      namespace: gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
