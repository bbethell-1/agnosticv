---
platform: labs
env_type: ocp-clientvm
software_to_deploy: none
clientvm_instance_image: RHEL77GOLD
clientvm_instance_type: t2.large
install_ftl: false
install_ipa_client: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
      - name: cloud_tags
      - name: course_name
      - name: email
      - name: ipa_host_password
      - name: install_lets_encrypt_certificates
      - name: osrelease
      - name: platform
      - name: aws_region
  anarchy:
    namespace: babylon-anarchy-gpte
  tower:
    organization: gpte
  secrets:
    - name: gpte
      namespace: gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
