---
platform: labs
env_type: ocp-clientvm
software_to_deploy: none
clientvm_instance_type: t2.large
install_ftl: true
install_ipa_client: true

# Tags to AWS Instances.
cloud_tags:
  platform: "{{ platform }}"
  env_type: "{{ env_type }}"
  guid: "{{ guid }}"
  course_name: "{{ course_name | d('OpenShift Client VM') }}"
  owner: "{{ student_name | d('unknown') }}"
  email: "{{ email | d('unknown') }}"
  purpose: "{{ purpose | d('ocpclientvm') }}"
