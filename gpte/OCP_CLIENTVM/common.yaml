---
platform: labs
env_type: ocp-clientvm
software_to_deploy: none
clientvm_instance_image: RHEL77GOLD
clientvm_instance_type: t2.large
install_ftl: false
install_ipa_client: true

__meta__:
  anarchy:
    namespace: gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
  # Dark Tower configuration
  tower:
    organization: gpte

  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    scm_ref: development
    type: agnosticd
