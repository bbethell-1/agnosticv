---
#include /includes/parameters/requester_email.yaml
# Catalog: SATELLITE TECH SALES DEMO
# Catalog Item:
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: persistent-satellite-demo
software_to_deploy: none

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------
# Platform
platform: labs

# -------------------------------------------------------------------
# Satellite Variables
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
persistent_satellite_users:
- name: "{{ requester_email }}"
  firstname: "Satellite Tech Sales"
  lastname: Demo
  mail: "{{ requester_email }}"
  description: "Satellie Techo Sales Demo User"
  admin: no
  user_password: "{{ common_password }}"
  default_location: "Default Location"
  default_organization: "Default Organization"
  auth_source: Internal
  locale: en
  roles:
  - Manager
  locations:
  - "Default Location"
  organizations:
  - "Default Organization"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: openstack-ansible-2.9
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
#  meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    virtualenv: openstack-ansible-2.9
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Satellite Tech Sales Demo
    category: Labs
    keywords:
    - satellite
    - demo
    - techsales
    - satellitetechsales
    - satellitetechsalesdemo
    labels:
      Product: Red_Hat_Satellite
      Provider: RHPDS
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
