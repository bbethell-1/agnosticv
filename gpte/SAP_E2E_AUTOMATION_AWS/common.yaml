---
#include /includes/ee-multicloud.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml

# Set to RHPDS or OPENTLC
platform: rhpds

env_type: sap-hana

common_install_basic_packages_retries: 0
install_student_user: true

sap_software_snapshot_name: sap-software-v1.0
sap_software_snapshot_owner_id: "719622469867"

bastion_instance_image: RHEL81GOLD
tower_instance_image: RHEL81GOLD
s4hana_instance_image: RHEL81GOLD
hana_instance_image: RHEL81GOLD

agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: student_name

####----- Specific and common requirements for the E2E Automation Workshop/Demo -----####
rootfs_size_bastion: 50
rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 200
sap_software_size: 100

#Ansible Tower Variables
tower_instance_count: 1

####----- Specific and common requirements for the E2E Automation Workshop/Demo -----####

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    display_name: SAP End to End Automation (AWS)
    category: Workshops
    parameters:
    - name: aws_region
    - name: student_name
    keywords:
    - workshop
    - sap
    - aws
    labels:
      Product: SAP
      Provider: GPTE
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
  - name: gpte
    namespace: gpte
  - name: sap-e2e-secret
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
