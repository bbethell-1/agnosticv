---
#include /includes/catalog-icon-sap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# Set to RHPDS or OPENTLC
platform: rhpds

env_type: sap-hana

common_install_basic_packages_retries: 0
install_student_user: true

sap_software_snapshot_name: sap-software-v1.0
sap_software_snapshot_owner_id: "719622469867"

bastion_instance_image: RHEL81GOLD
tower_instance_image: RHEL81GOLD
s4hana_instance_image: RHEL81GOLD
hana_instance_image: RHEL81GOLD

agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: student_name

####----- Specific and common requirements for the E2E Automation Workshop/Demo -----####
rootfs_size_bastion: 50
rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 200
sap_software_size: 100

#Ansible Tower Variables
tower_instance_count: 1

####----- Specific and common requirements for the E2E Automation Workshop/Demo -----####

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b8e53e26-f449-4aa8-a04d-c216b7a611ec
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SAP End to End Automation (AWS)
    category: Demos
    parameters: []
    keywords:
    - workshop
    - sap
    - aws
    labels:
      Product: Red_Hat_Enterprise_Linux_for_SAP_Applications
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Use_Case: Accelerate_Application_Development_And_Delivery
  deployer:
    type: agnosticd
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
  - name: gpte
    namespace: gpte
  - name: sap-e2e-secret
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
