---
cloudformation_retries: 0
clientvm_instance_type: t2.medium
clientvm_instance_image: RHEL81GOLD

## Satellite vars
repo_method: satellite
satellite_url: labsat.opentlc.com
satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: "rhel8-summit"

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # use development
  agnosticd_git_ref: development

  # This is a dev catalog item: idle the env right after deployment.
  idle_after_deploy: 12

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: local

  # Use a specific virtualenv that has all the k8s modules
  virtualenv: babylon

  babylon:
    kubeconfig: babydev.kubeconfig

##########################
# Babylon meta variables #
##########################
__meta__:

  # Those secrets live on the OpenShift Babylon cluster
  secrets:
    - name: gpte
      namespace: gpte

  catalog:
    # Namespace where the OpenShift template will be created
    # on the OpenShift Babylon cluster. You can ignore that, as
    # it is not used yet, Cloudforms stil being the frontend.
    namespace: gpte

    # All the variables that will be passed by Cloudforms must be
    # specified here If a variable is a parameter, it will not be
    # added to the Governor and the user will be able to change
    # its value in the Subject.
    parameters:
      - name: cloud_tags
      - name: course_name
      - name: email
      - name: ipa_host_password
      - name: install_lets_encrypt_certificates
      - name: osrelease
      - name: platform
      - name: aws_region
      - name: student_name
