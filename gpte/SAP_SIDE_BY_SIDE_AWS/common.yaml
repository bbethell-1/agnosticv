---
#include /includes/catalog-icon-sap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

platform: rhpds

cloud_provider: ec2
env_type: sap-integration
student_name: lab-user
common_install_basic_packages_retries: 0
install_student_user: true
bastion_instance_image: RHEL86GOLD-latest
set_repositories_rhel8_lock_release: 8.6

node_instance_image: RHEL8-latest

software_to_deploy: openshift4

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin

# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: t3mp0r4l
ocp4_workload_authentication_htpasswd_user_base: integration

# Create 1 student users
ocp4_workload_authentication_htpasswd_user_count: 1

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true
rh_internal: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: student_name
    nodecount: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 9f294273-ba15-4091-9c42-d9b9c0a8e217
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    category: Demos
    display_name: SAP Side-by-Side Integration - AWS
    keywords: []
    parameters: []
    labels:
      Product: Red_Hat_Enterprise_Linux_for_SAP_Applications
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Use_Case: Accelerate_Application_Development_And_Delivery
  deployer:
    type: agnosticd
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: gpte
      namespace: gpte
    - name: sap-side-by-side-secret
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
