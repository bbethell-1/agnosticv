---
# Red Hat Summit 2020 - T31437 - Pragmatic Approach to Debug Microservices Applications on Openshift
purpose: production ## This is a cost tag, please make sure it's correct.
cloudformation_retries: 1

# --- Use specific variable values for Production
target_host:
  ansible_host: bastion.na4.openshift.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem

lets_encrypt_production: true
install_lets_encrypt_certificates: true

clientvm_instance_type: t3a.xlarge
master_instance_type: m5.xlarge
worker_instance_type: m4.4xlarge


agnosticv_meta:
  idle_after_deploy: 10
  idle_after_start: 12
  deploy_with: babylon
  sandboxed: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: shared-summit-2020-debug-micro-ocp4-prod-0.7
