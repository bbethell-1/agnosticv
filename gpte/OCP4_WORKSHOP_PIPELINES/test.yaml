---
purpose: TEST
cloudformation_retries: 0

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL82GOLD

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  virtualenv: ansible2.9-python3.6-2021-01-22
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-workshop-pipelines-test
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel81
    namespace: gpte
