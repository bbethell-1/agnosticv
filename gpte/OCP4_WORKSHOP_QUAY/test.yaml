# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    git_tag_prefix: ocp-workshop-quay-test-0.6
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel81
    namespace: gpte
