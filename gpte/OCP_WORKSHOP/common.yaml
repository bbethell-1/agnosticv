---
platform: labs
env_type: ocp-workshop
key_name: ocpkey
repo_method: file
software_to_deploy: openshift
install_ipa_client: true
install_idm: htpasswd
install_openshiftapb: true
install_lets_encrypt_certificates: true
ovs_plugin: networkpolicy
enable_workshops_catalog: true

subdomain_base_suffix: .openshift.opentlc.com
HostedZoneId: Z186MFNM7DX4NF

# Tags to AWS Instances.
cloud_tags:
  platform: "{{ platform }}"
  env_type: "{{ env_type }}"
  guid: "{{ guid }}"
  course_name: "{{ course_name | d('OCP or Integreatly Workshop') }}"
  owner: "{{ student_name | d('unknown') }}"
  email: "{{ email | d('unknown') }}"
  purpose: "{{ purpose | d('ocpworkshop') }}"

agnosticv_meta:
  params_to_variables:
    nodecount: node_instance_count
