---
purpose: development
osrelease: 4.1.4
cloudformation_retries: 0

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m6a.xlarge
worker_instance_type: m6a.4xlarge
_infra_instance_type: m6a.4xlarge
_infra_node_replicas: 1

default_workloads:
  - ocp4-workload-enable-lets-encrypt-certificates
  - ocp-workload-terminal

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
