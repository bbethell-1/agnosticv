---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml

purpose: development
cloudformation_retries: 0

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 3
bastion_instance_type: t2.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: false
ocp4_workload_le_certificates_install_api: False

agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: OCS 4 Implementation on AWS
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: gpte
    namespace: gpte
