---
# Platform
platform: rhds-prod

# Config
env_type: ocp-gpu-single-node
HostedZoneId: Z186MFNM7DX4NF
subdomain_base_suffix: .openshift.opentlc.com
aws_region: us-east-1a
bastion_instance_type: t3.medium
master_instance_type: c5d.2xlarge
install_ipa_client: true
install_idm: htpasswd
repo_method: file
own_repo_path: http://sync.opentlc.com/repos/ocp/"{{ repo_version }}"
repo_version: 3.11.16
osrelease: "{{ repo_version }}"
software_to_deploy: openshift
user_vols: 500
install_lets_encrypt_certificates: false
run_ocp_diagnostics: false
cloudformation_retries: 2
ansible_additional_args: --skip-tags remove_self_provisioners,install_zabbix
