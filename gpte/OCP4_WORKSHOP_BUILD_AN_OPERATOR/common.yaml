---
platform: RHPDS

env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.4.8"

repo_method: file

cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

install_student_user: false

install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift

ignore_self_provisioners: true

run_janitor: false

# leave 4.1 even if we deploy 4.2
osrelease: 4.4.0

# OCP 4.2 greatness as in RHTE is commented, using version from 2019-10-01
# ocp4_installer_use_dev_preview: True

# ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp-dev-preview/4.2.0-0.nightly-2019-09-10-074025/openshift-install-linux-4.2.0-0.nightly-2019-09-10-074025.tar.gz

# ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp-dev-preview/4.2.0-0.nightly-2019-10-01-210901/openshift-install-linux-4.2.0-0.nightly-2019-10-01-210901.tar.gz

# ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp-dev-preview/4.2.0-0.nightly-2019-09-10-074025/openshift-client-linux-4.2.0-0.nightly-2019-09-10-074025.tar.gz

# ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp-dev-preview/4.2.0-0.nightly-2019-10-01-210901/openshift-client-linux-4.2.0-0.nightly-2019-10-01-210901.tar.gz

default_workloads:
  - ocp4-workload-project-request-template
  - ocp4-workload-opentlc-production
  - ocp4-workload-enable-lets-encrypt-certificates
  - ocp4-workload-build-an-operator-homeroomlab
  - ocp4-workload-osevg-workshop-tracker

# Terminal is breaking at the moment at project create
# Only from Admin Host - maybe an Ansible version issue
#  - ocp-workload-terminal

agnosticv_meta:
  virtualenv: ocp4-workshop
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
  nuke_sandbox: false
