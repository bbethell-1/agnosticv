---
purpose: rhpds-test
cloudformation_retries: 0

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-workshop-build-an-operator-test
# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    parameters:
    - name: student_name
    - name: aws_region
    - name: num_users
    - name: owner
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    git_tag_prefix: ocp4-workshop-build-an-operator-test
    type: agnosticd
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: rhte-ocp4
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
