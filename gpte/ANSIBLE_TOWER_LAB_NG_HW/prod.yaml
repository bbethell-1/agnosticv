---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: production
cloudformation_retries: 0

tower_credentials:
  - name: AWS Access Key
    username: "{{ readonly_aws_access_key }}"
    password: "{{ readonly_aws_secret_key }}"
    description: Readonly aws keys
    organization: Default
    type: aws
    state: present

agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8
  agnosticd_git_tag_prefix: ans-tower-lab-ng-prod
