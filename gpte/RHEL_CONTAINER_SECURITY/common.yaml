---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
# -------------------------------------------------------

# Red Hat Summit 2020 - T0A529 - A Practical Introduction to Container Security
# course_id: RHS_2020_T0A529

# Platform
platform: RHPDS

# Config
env_type: rhel-container-security

#
# Satellite vars
#
repo_method: satellite
use_content_view: true
#satellite_org: Red_Hat_GPTE_Labs
#satellite_activationkey: rhel8-summit
#satellite_activationkey: rhel81

# Package install
#
# Run a full yum update and install packages
bastion_instance_image: RHEL8-latest
node_instance_image: RHEL8-latest
update_packages: true

# --- Generic Variables
cloudformation_retries: 10
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true
# Email is required for deployment... but really shouldn't be.
email: devops@opentlc.com
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    nodecount: ignorecfme
    user: ignorecfme

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c2eb52df-61e0-41c9-8f5d-4458c5905d87
  access_control:
    view_only_groups:
    - system:authenticated
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: A Practical Introduction to Container Security 2020
    category: Demos
    parameters: []
    keywords:
    - Demos
    - Defend Yourself
    - RHEL
    - Security
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: gpte
    namespace: gpte
