---

#include /includes/catalog-icon-rhel.yaml

# Red Hat Summit 2020 - T0A529 - A Practical Introduction to Container Security
# course_id: RHS_2020_T0A529

# Platform
platform: RHPDS

# Config
env_type: rhel-container-security

#
# Satellite vars
#
repo_method: satellite
use_content_view: true
#satellite_url: labsat.opentlc.com
#satellite_org: Red_Hat_GPTE_Labs
#satellite_activationkey: rhel8-summit
#satellite_activationkey: rhel81

# Package install
#
# Run a full yum update and install packages

update_packages: true

# --- Generic Variables
cloudformation_retries: 10
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  deploy_with: babylon
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite secrets and vars
  - gpte
  params_to_variables:
    username: student_name
    nodecount: ignorecfme
    user: ignorecfme

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Defend Yourself with RHEL Security Tech
    category: Demos
    keywords:
    - Demos
    - Defend Yourself
    - RHEL
    - Security
    labels:
      Product: Red_Hat_Enterprise_Linux_Security
      Product_Family: Red_Hat_Enterprise_Linux
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: gpte
    namespace: gpte
