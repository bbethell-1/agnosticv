---
purpose: development

master_instance_type: c5d.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t2.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: false
ocp4_workload_le_certificates_install_api: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  params_to_variables:
    nodecount: ''
  idle_after_deploy: 4
  idle_after_start: 4
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: wdc
        purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: aws-ansible-2.9
    scm_url: https://github.com/davemeurer/agnosticd.git
    scm_ref: development
    scm_type: git
    type: agnosticd
