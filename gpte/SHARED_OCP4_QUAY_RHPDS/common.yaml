---
# --- Quay Shared Workload Deployment for RPDS
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: Quay 3 on OpenShift 4

# --- Platform
platform: rhpds

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_quay_operator

# This workload must be run as ec2-user (or cloud-user on OpenStack)
# because it has tasks requiring sudo.
ansible_user: ec2-user
#ansible_ssh_private_key_file: /home/opentlc-mgr/.ssh/opentlc_admin_backdoor.pem

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true


# -------------------------------------------------------------------
# OpenShift Pipelines
# -------------------------------------------------------------------
# --- Workload Configuration (new variables)
ocp4_workload_quay_operator_project: "quay-{{ guid }}"
ocp4_workload_quay_operator_use_catalog_snapshot: true
ocp4_workload_pipelines_channel: stable
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_starting_csv: redhat-openshift-pipelines.v1.5.1
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.8_2021_09_13


# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    user: ocp_username
  secrets:
  - quay_token

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
  secrets:
  - name: quay_token
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
