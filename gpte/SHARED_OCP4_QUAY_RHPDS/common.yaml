---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/opentlc-mgr-shared-ocp-410.yaml

# -------------------------------------------------------------------
# --- Quay Shared Workload Deployment for RPDS
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: Quay 3 on OpenShift 4
# -------------------------------------------------------------------

# --- Platform
platform: rhpds

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_quay_operator

# This workload must be run as ec2-user (or cloud-user on OpenStack)
# because it has tasks requiring sudo.
# --- Use specific variable values for Production

target_host:
  ansible_host: "{{ target_host_ansible_host }}"
  ansible_port: 22
  ansible_user: ec2-user
  ansible_ssh_private_key_content: "{{ target_host_ansible_ssh_private_key_content }}"

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# -----------------------------------
# Quay Operator
# -----------------------------------
ocp4_workload_quay_operator_project: "quay-{{ guid }}"
ocp4_workload_quay_operator_catalog_snapshot_image_tag: v4.12_2023_07_17

# --- AgnosticV Meta variables
agnosticv_meta:
  sandboxed: false
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f77d7192-1b34-4517-9c1c-6f7cfb3f2c9b
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Quay 3 on OpenShift 4
    category: Demos
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp410
    - shared
    - quay
    - quay3
    labels:
      Product: Red_Hat_Quay
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
  secrets:
  - name: gpte
    namespace: gpte
  - name: opentlc
    namespace: gpte
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials
  - name: quay_token
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
