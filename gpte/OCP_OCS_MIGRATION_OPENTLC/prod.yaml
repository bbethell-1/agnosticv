---
purpose: production ## This is a cost tag, please make sure it's correct.
cloudformation_retries: 10

#lets_encrypt_production: True
#install_lets_encrypt_certificates: true

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m4.xlarge
_infranode_instance_type: m4.4xlarge
_node_instance_type: m4.4xlarge
_node_instance_count: 2
_support_instance_type: m4.4xlarge

agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8
  agnosticd_git_tag_prefix: ocp-ocs-migration-prod
