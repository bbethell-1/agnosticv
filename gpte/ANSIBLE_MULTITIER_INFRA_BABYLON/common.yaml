---
platform: labs
env_type: ansible-multitier-infra
software_to_deploy: none

# Environment-specific settings
repo_method: file
repo_version: 3.7.0-4
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/tower

## User settings
# --- student_name not set -> Requestor User ID is used as student_name
# --- student_password not set -> generate random password
install_student_user: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  babylon:
    # This file lives in ~/secrets on the deploy host
    kubeconfig: babylon-prod.kubeconfig

  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

  # Use a specific virtualenv that has all the k8s modules
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  secrets:
    - namespace: gpte
      name: gpte

  catalog:
    namespace: gpte
    description: Ansible Advanced - Multi Tier
    # No parameter variables
    parameters: []
