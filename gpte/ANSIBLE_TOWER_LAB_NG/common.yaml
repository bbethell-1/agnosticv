---
platform: labs
env_type: ans-tower-lab-ng
software_to_deploy: none

# Environment-specific settings
repo_method: file
repo_version: 3.7.0-4
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/tower

## User settings
# --- student_name not set -> Requestor User ID is used as student_name
# --- student_password not set -> generate random password
install_student_user: true

# Deploy in a Ansible 2.9 Virtualenv
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  secrets:
  - ans-tower-lab_secrets
  - gpte
#  - ocp4_token
  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    username: student_name

