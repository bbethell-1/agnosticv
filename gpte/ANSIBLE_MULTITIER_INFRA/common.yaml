---
platform: labs
env_type: ansible-multitier-infra
software_to_deploy: none

# Environment-specific settings
repo_method: file
repo_version: 3.7.0-4
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/tower

## User settings
# --- student_name not set -> Requestor User ID is used as student_name
# --- student_password not set -> generate random password
install_student_user: true

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  # Instead of running ansible-playbook from the admin host,
  # tell ALL_agnosticv.sh to use babylon to deploy.
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: fb8ca80b-32af-432b-91e3-0c6e3abf5394
  anarchy:
    namespace: babylon-anarchy-gpte
  secrets:
  - namespace: gpte
    name: gpte

  catalog:
    display_name: Ansible Advanced NG-Multi Tier(Retired)
    namespace: gpte
    # No parameter variables
    parameters: []
