---
# --- Quay Shared Workload Deployment
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Quay 3 on OpenShift 4
# --- ELT: Quay Foundations

# --- Platform
platform: labs

# --- Config
env_type: ocp-workloads
workload: ocp4-workload-quay-operator

# --- Workload Configuration
_quay_project: "quay-{{ guid }}"
_quay_operator_image_tag: v1.0.1
_quay_image_tag: v3.0.4

# --- AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username
  secrets:
    - gpte
    - quay_token
