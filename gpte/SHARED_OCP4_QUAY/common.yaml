---
# --- Quay Shared Workload Deployment for Labs
# --- System: labs.opentlc.com
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Quay 3 on OpenShift 4
# --- ELT: Quay Foundations

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4-workload-quay-operator
# This workload must be run as ec2-user because it has tasks
# requiring sudo.
ansible_user: ec2-user
ansible_ssh_private_key_file: /home/opentlc-mgr/.ssh/opentlc_admin_backdoor.pem

# --- Workload Configuration
_quay_project: "quay-{{ guid }}"
_quay_operator_image_tag: v0.0.5
_quay_image_tag: v3.0.4

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username
  secrets:
    - quay_token
