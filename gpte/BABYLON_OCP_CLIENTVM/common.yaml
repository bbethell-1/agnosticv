---
#include /includes/ansible_control_plane/current_controller.yaml

platform: labs
env_type: ocp-clientvm
software_to_deploy: none
clientvm_instance_type: t2.large
install_ftl: false
install_ipa_client: true

agnosticv_meta:
  deploy_with: babylon
  babylon:
    kubeconfig: babydev.kubeconfig

__meta__:
  asset_uuid: 1400522b-e7bb-47bf-86fe-14af28fc0a33
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    display_name: OpenShift Client VM
    # Namespace where the OpenShift template will be created
    # on the OpenShift Babylon cluster. You can ignore that, as
    # it is not used yet, Cloudforms stil being the frontend.
    namespace: gpte

    # All the variables that will be passed by Cloudforms must be
    # specified here If a variable is a parameter, it will not be
    # added to the Governor and the user will be able to change
    # its value in the Subject.
    parameters:
      - name: cloud_tags
      - name: course_name
      - name: email
      - name: ipa_host_password
      - name: install_lets_encrypt_certificates
      - name: osrelease
      - name: platform
      - name: aws_region
      - name: student_name


  # Those secrets live on the OpenShift Babylon cluster
  secrets:
    - name: gpte
      namespace: gpte
