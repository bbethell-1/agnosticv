---
purpose: rhpds-test
cloudformation_retries: 0

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
_infra_node_instance_type: m5.4xlarge
_infra_node_replicas: 1
_infra_node_elasticsearch_nodes: false
_logging_use_dedicated_nodes: "infra"
_logging_elasticsearch_replicas: "{{ _infra_node_replicas }}"
install_lets_encrypt_certificates: true

agnosticv_meta:
  idle_after_deploy: 10
  idle_after_start: 12
  agnosticd_git_tag_prefix: ocp-getting-started-workshop-test
  virtualenv: aws-ansible-2.9
