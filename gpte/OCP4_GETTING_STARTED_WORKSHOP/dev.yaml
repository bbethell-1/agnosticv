---
purpose: development

# OpenShift Cluster to be used in the
# OCP 4 Starter Workshop on RHPDS
# Catalog: OpenShift Workshops
# Catalog Item: OpenShift 4 Starter Workshop

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

ocp4_installer_version: "4.4.19"

# AWS instances
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# --- Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Infra Workload Variables
# -------------------------------------------------------------------

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create 'num_users' student users
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('2') }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# Customize the cluster with Authentication and
# Let's Encrypt certificates for the Ingress Controllers
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp4_workload_opentlc_production
- ocp4_workload_project_request_template
- ocp4_workload_nexus_operator
- ocp4_workload_machinesets
- ocp4_workload_logging
- ocp-workload-etherpad
- ocp-workload-ocp-ops-view
- ocp-workload-gogs
- ocp-workload-gogs-load-repository
- ocp4-workload-homeroomlab-starter-guides
- ocp4-workload-osevg-workshop-tracker

# Do not run any student customization.
student_workloads: []

# Variables for new Nexus Operator Role
ocp4_workload_nexus_operator_project: labs
ocp4_workload_nexus_operator_image: quay.io/gpte-devops-automation/nexus-operator
ocp4_workload_nexus_operator_image_tag: v0.17.1
ocp4_workload_nexus_operator_nexus_image: registry.connect.redhat.com/sonatype/nexus-repository-manager
ocp4_workload_nexus_operator_nexus_image_tag: 3.26.1-ubi-2
ocp4_workload_nexus_operator_new_admin_password: admin123

ocp4_workload_nexus_operator_repos_maven_hosted_setup: true
ocp4_workload_nexus_operator_repos_maven_hosted:
- name: releases
  blob_store: default
  write_policy: allow_once # allow_once or allow
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
- name: maven-snapshots
  blob_store: default
  write_policy: allow # allow_once or allow
  strict_content_validation: true
  version_policy: snapshot # release, snapshot or mixed
  layout_policy: strict # strict or permissive

ocp4_workload_machinesets_machineset_groups:
- name: elasticsearch
  autoscale: false
  total_replicas: 1
  total_replicas_min: 1
  total_replicas_max: 1
  role: elasticsearch
  taints:
  - key: elasticsearch
    value: reserved
    effect: NoSchedule
  - key: elasticsearch
    value: reserved
    effect: NoExecute
  instance_type: "m5.4xlarge"

ocp4_workload_logging_node_role: "elasticsearch"
ocp4_workload_logging_elasticsearch_replicas: 1

#define project config vars to be used
etherpad_project: labs
gogs_project: labs
opsview_project: labs
project_name: labs
workshop_type: starter

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  idle_after_deploy: 4
  idle_after_start: 8
  params_to_variables:
    username: student_name
  nuke_sandbox: false
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite_ocp_on_osp_secret
