---
purpose: development

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type: c5a.xlarge
master_instance_count: 3
worker_instance_type: m5a.4xlarge
bastion_instance_type: t3a.medium

# Test for 4.6
ocp4_installer_version: "4.6.9"

# -------------------------------------------------------------------
# Override Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_opentlc_production
- ocp4_workload_project_request_template
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp4_workload_nexus_operator
- ocp-workload-etherpad
- ocp-workload-ocp-ops-view
- ocp-workload-gogs
- ocp-workload-gogs-load-repository
- ocp4-workload-homeroomlab-starter-guides
- ocp4-workload-osevg-workshop-tracker

# -------------------------------------------------------------------
# OpenShift Pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: ocp-4.6
ocp4_workload_pipelines_starting_csv: redhat-openshift-pipelines-operator.v1.2.2
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalogsource_name: redhat-operators-snapshot-pipelines
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.6_2021_01_12

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
ocp4_workload_logging_node_role: "elasticsearch"
ocp4_workload_logging_elasticsearch_replicas: 1
ocp4_workload_logging_use_catalog_snapshot: true
ocp4_workload_logging_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_logging_catalog_snapshot_image_tag: v4.6_2021_01_12

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 8
  agnosticd_git_repo: 'https://github.com/blues-man/agnosticd'
