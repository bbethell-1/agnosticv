---
platform: rhpds
env_type: ocp-workshop
software_to_deploy: openshift
run_ocp_diagnostics: false
cloudformation_retries: 0
subdomain_base_suffix: .example.opentlc.com
HostedZoneId: Z3IHLWJZOU9SRT
# repo_method defined in account.yaml
# repo_method: file
install_ipa_client: false
install_openshiftapb: false
install_nexus: false
install_metrics: false
install_logging: false
install_lets_encrypt_certificates: false
lets_encrypt_production: false
ovs_plugin: networkpolicy

# --- This is a Hackathon environment -> FTL is for student labs
install_ftl: false
# Event environment -> not workshop
enable_workshops_catalog: true

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password:
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
# --- admin_password required, no defaults in agnosticd
admin_password: r3dh4t1!

osrelease: '3.11.154'
repo_version: '3.11'
install_k8s_modules: true
support_instance_public_dns: true

#storage configs
nfs_exports_config: "*(insecure,rw,no_root_squash,no_wdelay,sync)"
nfs_server_address: "support1.{{ guid }}{{ subdomain_base_suffix }}"
install_glusterfs: true
glusterfs_image_tag: v3.11
mig_ocp_version: 3
mig_operator_repo_branch: "release-1.0"
mig_operator_version: "v1.0.0"
# -- m5 and t3 types require NVME
# nfs_device: /dev/nvme2n1
# nfs_size: 2000

infra_workloads: "ocp-workload-migration-training,ocp-workload-mssql,ocp-workload-sock-shop,ocp-workload-robot-shop,ocp-workload-parks-app"

agnosticv_meta:
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: dc8010a8-22e4-4630-b1d6-f7c4ae03a77c
