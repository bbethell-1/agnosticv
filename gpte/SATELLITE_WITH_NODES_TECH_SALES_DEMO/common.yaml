---
#include /includes/parameters/requester_email.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/catalog-icon-satellite.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#
# Catalog: Development
# Catalog Item: Satellite Tech Sales Demo
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: persistent-satellite-with-nodes
software_to_deploy: none

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------
# Platform
platform: RHPDS

# -------------------------------------------------------------------
# Infra Variables
# -------------------------------------------------------------------
aws_region: us-east-2

# -------------------------------------------------------------------
# Config Variables
# -------------------------------------------------------------------

repo_method: satellite
install_student_user: true
student_name: lab-user-{{ guid }}
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Satellite Variables
# -------------------------------------------------------------------
persistent_satellite_users:
- name: "{{ student_name }}"
  firstname: "Satellite With Nodes Tech Sales"
  lastname: Demo
  mail: "{{ requester_email }}"
  description: "Satellie Techo Sales Demo User"
  admin: no
  user_password: "{{ common_password }}"
  default_location: "Default Location"
  default_organization: "Default Organization"
  auth_source: Internal
  locale: en
  roles:
  - Viewer
  - Tech_Sales_Demo
  locations:
  - "Default Location"
  organizations:
  - "Default Organization"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
#  meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 244d2ea6-c705-4021-a4ab-6de29c0f01fe
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Satellite With Nodes Tech Sales Demo
    category: Demos
    keywords:
    - satellite
    - demo
    - techsales
    - satellitetechsales
    - satellitetechsalesdemo
    labels:
      Product: Red_Hat_Satellite
      Provider: RHDP
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
  access_control:
    allow_groups:
    - satellite-tech-sales
  secrets:
  - name: gpte
    namespace: gpte
  - name: persistent-satellite-demo
    namespace: gpte
  - name: satellite-rhel90-ha
    namespace: gpte
