---
cloud_provider: ec2
key_name: opentlc_admin_backdoor
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}
repo_method: file

subdomain_base_suffix: .example.opentlc.com
HostedZoneId: Z3IHLWJZOU9SRT

cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"

agnosticv_meta:
  secrets:
    - gpte
    - ocp4_token

  params_to_variables:
    hostedzoneid: HostedZoneId
    region: aws_region
    platform: platform
    course_id: course_name
    appversion: ig_version

__meta__:
  # Dark Tower configuration
  tower:
    organization: gpte

  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    type: agnosticd

  # Enable GPTE reporting to the Provisions DB, for cost management
  secrets:
    - name: gpte-db
      namespace: gpte
      var: gpte_db
