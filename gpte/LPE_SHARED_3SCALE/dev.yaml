---
purpose: development
target_host:
  ansible_host: bastion.dev4.openshift.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_repo: https://github.com/treddy08/agnosticd.git
  agnosticd_git_ref: lpe_3scale

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_url: https://github.com/treddy08/agnosticd.git
    scm_ref: lpe_3scale
