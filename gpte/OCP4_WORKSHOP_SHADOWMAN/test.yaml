---
purpose: TEST

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t2.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: true
ocp4_workload_le_certificates_install_api: true

agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-workshop-shadowman-test
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
    - name: student_name
  deployer:
    virtualenv: aws-ansible-2.9
    git_tag_prefix: ocp4-workshop-shadowman-test
  secrets:
  - namespace: gpte
    name: satellite-rhel81
