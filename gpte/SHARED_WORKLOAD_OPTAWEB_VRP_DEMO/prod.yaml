---
purpose: production

target_host:
  ansible_host: bastion.na4.openshift.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem

# AgnosticV Meta variables

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ocp_username
# Agnosticd_git_tag_prefix: shared-workload-optaweb-vrp-demo-prod
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
    - name: ocp_username
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    scm_ref: shared-workload-optaweb-vrp-demo-prod-0.1
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
