---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml

# Catalog Item: DM7 Optaweb VRP Demo
# Catalog: Middleware Solution Demos
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp-workload-optaweb-vrp

# AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: DM7 Optaweb VRP Demo
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords:
      - aws
      - shared
      - vrp
      - OPTAWEB
    labels:
      Product: Red_Hat_Decision_Manager
      #OpenShift_Version: "4.6"
      Provider: Application_Services_BU
      Product_Family: Red_Hat_Application_Services
  lifespan:
    default: 2d
    maximum: 10d
    relativeMaximum: 10d
  runtime:
    default: 6h
    maximum: 48h
