---
#include /includes/catalog-icon-3scale-api-management.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/ansible_control_plane/current_controller.yaml

platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_lpe_3scale
ocp_username: "{{ requester_username | replace('@', '-') }}"
ocp_user_needs_quota: true
subdomain_base_suffix: .openshift.opentlc.com
ansible_user: opentlc-mgr

# smtp
ocp4_workload_lpe_3scale_smtp_host: <changeme>
ocp4_workload_lpe_3scale_smtp_port: 587
ocp4_workload_lpe_3scale_smtp_authentication: plain
ocp4_workload_lpe_3scale_smtp_domain: <changeme>
ocp4_workload_lpe_3scale_smtp_userid: <changeme>
ocp4_workload_lpe_3scale_smtp_passwd: <changeme>
ocp4_workload_lpe_3scale_admin_email_user: "3scaleadmin" #i.e. string before @ in your email address
ocp4_workload_lpe_3scale_admin_email_domain: "redhat.com"

#3scale operator
ocp4_workload_lpe_3scale_operator_package_name: "3scale-operator"
ocp4_workload_lpe_3scale_current_csv: ""
ocp4_workload_3scale_lpe_current_channel: ""

#api cast
ocp4_workload_lpe_3scale_apicast_operator_package_name: "apicast-operator"
ocp4_workload_lpe_3scale_apicast_current_csv: ""
ocp4_workload_lpe_3scale_apicast_current_channel: ""

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b0957162-ace8-4539-9573-ff0bc0816c6a
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: LPE 3Scale API Management
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords:
    - LPE
    - 3Scale
    labels:
      Product: Red_Hat_3scale_API_Management
      Provider: RHDP
      Product_Family: Red_Hat_Application_Services
  secrets:
  - name: opentlc
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
