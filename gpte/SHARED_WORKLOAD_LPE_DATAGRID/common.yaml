---
#include /includes/catalog-icon-data-grid.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml

# Catalog Item: Datagrid
# Catalog: Latest Product Environments
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none
key_name: opentlc_admin_backdoor

# Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_lpe_datagrid
ocp_user_needs_quota: true
subdomain_base_suffix: .openshift.opentlc.com
ansible_user: opentlc-mgr
ocp_username: "{{ requester_username | replace('@', '-') }}"

# defaults file for ocp4_workload_lpe_datagrid
ocp4_workload_lpe_datagrid_channel: ""
ocp4_workload_lpe_datagrid_namespace: lpe-datagrid-{{ guid }}
ocp4_workload_lpe_datagrid_automatic_install_plan_approval: true
ocp4_workload_lpe_datagrid_starting_csv: ""
ocp4_workload_lpe_datagrid_wait_for_deploy: true

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ocp_username

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: Datagrid
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords:
      - aws
      - shared
      - datagrid
      - cache
    labels:
      Product: Red_Hat_Data_Grid
      Provider: Application_Services_BU
      Product_Family: Red_Hat_Application_Services
  lifespan:
    default: 2d
    maximum: 10d
    relativeMaximum: 2d
  runtime:
    default: 6h
    maximum: 48h
  secrets:
    - name: gpte
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
