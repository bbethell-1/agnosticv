---
purpose: rhpds-test
cloudformation_retries: 0

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL82GOLD

# Workload Variables
ocp4_workload_le_certificates_install_certificates: true
ocp4_workload_le_certificates_install_api: False

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    git_tag_prefix: ocp4-fsi-open-banking-sandbox-test
  secrets:
    - name: satellite-rhel81
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
