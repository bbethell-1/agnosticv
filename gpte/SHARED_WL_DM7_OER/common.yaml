---
# Catalog Item: DM7 OptaWeb Employee Rostering Demo
# Catalog: Middleware Solution Demos
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp-workload-optaweb-employee-rostering

target_host:
  ansible_host: bastion.na4.openshift.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem

# -------------------------------------------------------------------
# AgnosticV Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: ocp_username
    keywords: []
    labels:
      Provider: Application_Services_BU
      Product: Red_Hat_Decision_Manager
      Product_Family: Red_Hat_Application_Services
      OpenShift_Version: '4.6'
    display_name: DM7 OptaWeb Employee Rostering Demo
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
    - name: gpte
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
