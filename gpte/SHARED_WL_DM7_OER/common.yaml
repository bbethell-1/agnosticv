---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/opentlc-mgr-private-key.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp-workloads

# -------------------------------------------------------------------
# Workload Vars
# -------------------------------------------------------------------
ocp_workload: ocp-workload-optaweb-employee-rostering
ocp_username: "{{ requester_username | replace('@', '-') }}"
cloud_provider: none

# -------------------------------------------------------------------
# AgnosticV Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords: []
    labels:
      Provider: Application_Services_BU
      Product: Red_Hat_Decision_Manager
      Product_Family: Red_Hat_Application_Services
      #OpenShift_Version: '4.6'
    display_name: DM7 OptaWeb Employee Rostering Demo
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
    - name: gpte
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
