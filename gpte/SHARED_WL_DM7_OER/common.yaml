---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/requester_email.yaml

platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
env_type: ocp-workloads
ocp_workload: ocp-workload-optaweb-employee-rostering

ocp_username: "{{ requester_username | replace('@', '-') }}"

target_host_ansible_ssh_private_key_content: !vault |
  $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0

target_host:
  ansible_host: bastion.shared-na46.openshift.opentlc.com
  ansible_port: 22
  ansible_user: opentlc-mgr
  ansible_ssh_private_key_content: "{{ target_host_ansible_ssh_private_key_content }}"

# -------------------------------------------------------------------
# AgnosticV Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords: []
    labels:
      Provider: Application_Services_BU
      Product: Red_Hat_Decision_Manager
      Product_Family: Red_Hat_Application_Services
      #OpenShift_Version: '4.6'
    display_name: DM7 OptaWeb Employee Rostering Demo
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
    - name: gpte
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
