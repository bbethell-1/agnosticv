---
purpose: testing
cloudformation_retries: 0

master_instance_type: c5d.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t2.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: true
ocp4_workload_le_certificates_install_api: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: ocp4-er-demo-test-0.3
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: aws-ansible-2.9
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: ocp4-er-demo-test-0.3
    scm_type: git
    type: agnosticd
