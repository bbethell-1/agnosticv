---
# AWS Instances:
master_instance_type: m4.xlarge
master_instance_count: 3
worker_instance_type: m4.4xlarge
_infra_instance_type: m4.4xlarge
_infra_node_replicas: 1

install_lets_encrypt_certificates: false


agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    git_tag_prefix: ocp4-rhpam-offer-management-dmn-ai-demo-test
    virtualenv: ansible2.9-python3.6-2021-11-30
