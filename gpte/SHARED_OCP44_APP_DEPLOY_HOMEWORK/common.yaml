---
# Provision access to the Shared OpenShift Cluster on Labs
# for OpenShift 4 Advanced Application Deployment ILT Homework
# Catalog Details in (dev | prod).yaml
# Tag Prefix: shared-ocp44-app-deploy-homework

# --- Platform
platform: labs

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_app_deploy_homework

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# --- AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username
