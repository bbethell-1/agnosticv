---
# Catalog Item: 3Scale API Security with OIDC
# Catalog: Middleware Solution Demos
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none
key_name: opentlc_admin_backdoor

# Config
env_type: ocp-workloads
ocp_workload: ocp-workload-3scale-demo
ocp_user_needs_quota: true
subdomain_base_suffix: .openshift.opentlc.com
ansible_user: opentlc-mgr

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  virtualenv: aws-ansible-2.9

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: aws-ansible-2.9
  catalog:
    namespace: gpte
    parameters:
    - name: student_name
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
