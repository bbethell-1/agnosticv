---
purpose: development
target_host:
  ansible_host: bastion.dev4.openshift.opentlc.com
  ansible_port: 22
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem
ocp_apps_domain: apps.shared-dev4.dev4.openshift.opentlc.com

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_repo: https://github.com/RedHat-Middleware-Workshops/agnosticd.git
  agnosticd_git_ref: development-3scale-security-demo

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_url: https://github.com/RedHat-Middleware-Workshops/agnosticd.git
    scm_ref: development-3scale-security-demo
