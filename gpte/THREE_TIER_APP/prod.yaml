---
# Prod is the same as the common variables

# Overwrite Instance type and Image
# studentvm_instance_type: "2c2g30d"
# studentvm_instance_image: rhel-8.1

env_type: three-tier-app                # Name of config to deploy
cloud_provider: ec2
HostedZoneId: Z3IHLWJZOU9SRT            # You will need to change this
key_name: ocpkey                        # Keyname must exist in AWS

repo_version: 3.7.0-4
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/tower/

# Control user settings
control_user_name: devops
control_user_ssh_config: ./files/ssh_config.j2


#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  idle_after_deploy: 9
  idle_after_start: 10
  secrets:
  - gpte
  agnosticd_git_tag_prefix: three-tier-app-prod
