---
# Catalog Item: DM7 RealTime Event Decisioning
# Catalog: Middleware Solution Demos
# Platform
platform: rhpds

# Cloud Provider
cloud_provider: none

# Config
#env_type: ocp-workload-dm7-realtime-event-decisioning
#ocp_workload: ocp-workload-dm7-realtime-event-decisioning
env_type: ocp-workloads
ocp_workload: ocp-workload-dm7-realtime-event-decisioning
ocp_user_needs_quota: true
ocp_apps_domain: "apps.{{ guid | default(guid) }}{{ subdomain_base_suffix }}"
subdomain_base_suffix: .openshift.opentlc.com
ansible_user: opentlc-mgr
ansible_ssh_private_key_file: /home/opentlc-mgr/.ssh/opentlc_admin_backdoor.pem

# AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    user: ocp_username


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
  secrets:
  - name: opentlc
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials
