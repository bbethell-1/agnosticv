---
platform: labs
env_type: ocp-workshop

software_to_deploy: openshift

repo_method: file

install_ipa_client: false
install_idm: htpasswd
install_openshiftapb: false
insatll_nexus: false
install_lets_encrypt_certificates: false
install_metrics: false
install_logging: false
ovs_plugin: networkpolicy
enable_workshops_catalog: false

# --- This is a Lab Environment -> Install FTL
install_ftl: true

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab_user
# --- student_password not set -> generate random password
# student_password: rhte2019
# --- Student is allowed to sudo and switch to root
student_sudo: true

admin_user: admin
lets_encrypt_production: false
run_ocp_diagnostics: false
cloudformation_retries: 0

osrelease: '3.11.129'
repo_version: '3.11'
install_k8s_modules: true

bastion_instance_type: t2.large
master_instance_type: m4.4xlarge
infranode_instance_type: m4.4xlarge
node_instance_type: m4.4xlarge
node_instance_count: 2
support_instance_type: m4.large
support_instance_public_dns: true

nfs_exports_config: "*(insecure,rw,no_root_squash,no_wdelay,sync)"
nfs_server_address: "support1.{{ guid }}{{ subdomain_base_suffix }}"

mig_ocp_version: 3
mig_operator_repo_branch: "release-1.0"
mig_operator_version: "v1.0.0"

infra_workloads: "ocp-workload-migration,ocp-workload-mssql,ocp-workload-sock-shop,ocp-workload-robot-shop,ocp-workload-parks-app"

agnosticv_meta:
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    user: cloudforms_user
