---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/requester_email.yaml
# -------------------------------------------------------------
# Catalog Item: Datagrid
# Catalog: Latest Product Environments
# Platform
# -------------------------------------------------------------
platform: rhpds

# Cloud Provider
cloud_provider: none
key_name: opentlc_admin_backdoor

# Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_showroom
ocp4_workload_showroom_repo: "https://github.com/tonykay/showroom-pre-render-poc.git"

ocp_user_needs_quota: true
subdomain_base_suffix: .openshift.opentlc.com
ansible_user: opentlc-mgr
email: showroom@showroom.example.com
ocp_username: "{{ requester_email if requester_email is defined and requester_email | length else email }}"

# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    display_name: "Showroom Demo"
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords:
    - showroom
    - bookbag
    - shared
  lifespan:
    default: 2d
    maximum: 4d
    relativeMaximum: 2d
  runtime:
    default: 6h
    maximum: 48h
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: opentlc
    namespace: gpte
