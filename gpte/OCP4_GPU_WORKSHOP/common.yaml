---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-nvidia.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/controller.aap5ao6oghnkg6u4.ansiblecloud.redhat.com.yaml
# -------------------------------------------------------------------
# --- OCP4 NVIDIA GPU Workshop
# --- Catalog: Workshops
# --- Catalog Item: OCP4 NVIDIA GPU Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

platform: RHPDS

# --- These come from the account
subdomain_base_suffix: .openshift.opentlc.com
HostedZoneId: Z186MFNM7DX4NF
# --- force deploy to us-west-2
#aws_region: us-west-2

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create 200 users
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_project_request_template
  - ocp4_workload_opentlc_production
  - ocp4_workload_le_certificates
  - ocp-workload-terminal

# --- Student Workloads (YAML List)
student_workloads: []

agnosticv_meta:
  params_to_variables:
    nodecount: ''
    region: ''
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 84b8b96c-68e4-4482-b917-f9d06ae7e381
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: NVIDIA GPU Operator OCP4 Workshop
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Partner_EcoSystems_PnT
      #OpenShift_Version: '4.9'
    multiuser: true
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-west-2
          enum:
            - us-west-2
  secrets:
    - name: gpte
      namespace: gpte
    - name: satellite-rhel8-latest-ha
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
