---
#include /includes/parameters/controlplane-count.yaml
#include /includes/ansible_control_plane/controller.aap5ao6oghnkg6u4.ansiblecloud.redhat.com.yaml
purpose: development

master_instance_type: m5.4xlarge


worker_instance_type: p3.2xlarge
worker_instance_count: 2
bastion_instance_type: t3.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: false
ocp4_workload_le_certificates_install_api: false

# OpenShift Installer Version
ocp4_installer_version: "4.10"


# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    region: aws_region

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.15
      pull: missing
    scm_ref: development
