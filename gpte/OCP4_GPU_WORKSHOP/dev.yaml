---
purpose: development

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: p3.2xlarge
worker_instance_count: 2
bastion_instance_type: t3a.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: false
ocp4_workload_le_certificates_install_api: false

# OpenShift Installer Version
ocp4_installer_version: "4.9"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
#
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    nodecount: ''


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_url: https://github.com/vincepower/agnosticd.git
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
