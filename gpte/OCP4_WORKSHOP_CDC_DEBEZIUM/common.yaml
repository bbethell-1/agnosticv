---
#include /includes/parameters/enable-lets-encrypt.yaml
platform: RHPDS

# Config
env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student user on bastion
install_student_user: true
# Student_name not set -> Requestor
# Password not set -> generate

# OCP Authentication
install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift

# Infra and Student Workloads are yaml list
infra_workloads:
  - ocp4_workload_le_certificates
  - ocp4-workload-debezium-demo

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3.medium

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  secrets:
    - name: gpte
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
  catalog:
    display_name: Change Data Capture with Debezium
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
