---
purpose: testing

ocp4_installer_version: "4.6.1"

# Repos
osrelease: 4.6.0
repo_version: '4.6.0'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  catalog:
    namespace: gpte
  deployer:
    git_tag_prefix: ocp4-workshop-cdc-test
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
