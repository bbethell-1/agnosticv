---
# Red Hat Summit 2020 - T283DA - Implementing custom security content for automated security compliance to custom security policies
#course_id: RHS_2020_T283DA

# Platform
platform: RHPDS
env_type: rhel-custom-security-content

#output_dir: /tmp/workdir

#cloud_provider: ec2

# Satellite client variables
repo_method: satellite
satellite_activationkey: rhel8-summit
use_content_view: true

# admin user for infra workloads
admin_user: admin
student_user: lab-user
student_name: lab-user

software_to_deploy: none
install_ocp4: true
ocp4_installer_version: 4.3.1
osrelease: 4.3.0

default_workloads:
  - rhel-custom-security-content-verification

agnosticv_meta:
  virtualenv: aws-ansible-2.9
