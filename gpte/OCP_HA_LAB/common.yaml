---
platform: labs
env_type: ocp-ha-lab
key_name: ocpkey
repo_method: file
software_to_deploy: openshift
osrelease: 3.11.59
install_ipa_client: true
install_idm: htpasswd
cloud_provider: ec2

subdomain_base_suffix: .example.opentlc.com
HostedZoneId: Z3IHLWJZOU9SRT

bastion_instance_type: t2.xlarge
master_instance_type: t2.xlarge
infranode_instance_type: t2.xlarge
node_instance_type: t2.large
support_instance_type: t2.medium
node_instance_count: 3
infranode_instance_count: 2
master_instance_count: 3

install_nfs: true
install_glusterfs: false
glusterfs_image_tag: v3.10

agnosticv_meta:
  params_to_variables:
    nodecount: node_instance_count
