---
# Provision access to the Shared OpenShift 4.6 Cluster on RHPDS
# Catalog Details in (dev | prod | test).yaml
# Tag Prefix: shared-rhpds-developer-env-46

# --- Platform
platform: rhpds

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access

# --- Workload parameters
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
ocp4_workload_shared_cluster_access_create_quota: true
# yamllint disable-line rule:line-length
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-rhpds-developer-env-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "5"
    limits.cpu: "10"
    requests.memory: 6Gi
    limits.memory: 20Gi
    pods: "20"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi
# yamllint disable-line rule:line-length
# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

target_host:
  ansible_host: "{{ target_host_ansible_host }}"
  ansible_port: 22
  ansible_user: opentlc-mgr
  ansible_ssh_private_key_file: ~/.ssh/opentlc-mgr.pem

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4.6 Shared Environment
    category: Demos
    icon:
      alt: "Cloud Native"
      url: "https://gpte-public.s3.amazonaws.com/babylon-catalog/Cloud_Native.svg"
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp46
    - shared
    labels:
      #OpenShift_Version: "4.6"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: PFE
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: ocp_username
  secrets:
  - name: opentlc
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
