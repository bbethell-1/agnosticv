---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml

# -------------------------------------------------------------------
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: OpenShift 4.6 Shared Environment
# -------------------------------------------------------------------

# --- Platform
platform: rhpds

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access

# --- Workload parameters
ocp_username: "{{ requester_username | replace('@', '-') }}"
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
ocp4_workload_shared_cluster_access_create_quota: true
# yamllint disable-line rule:line-length
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-rhpds-developer-env-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "5"
    limits.cpu: "10"
    requests.memory: 6Gi
    limits.memory: 20Gi
    pods: "20"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 50Gi
# yamllint disable-line rule:line-length
# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

target_host:
  ansible_host: "{{ target_host_ansible_host }}"
  ansible_port: 22
  ansible_user: opentlc-mgr
  ansible_ssh_private_key_file: ~/.ssh/opentlc-mgr.pem

nodes: 3

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 77bab6a1-a4f6-4028-a9d2-df8123952837
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    display_name: OpenShift 4.6 Shared Environment
    category: Demos
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp46
    - shared
    - sharedenv
    labels:
      #OpenShift_Version: "4.6"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
  secrets:
  - name: opentlc
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
