---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml

# -------------------------------------------------------------------
# --- Provision access to the Shared OpenShift CNV Cluster on RHPDS
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: OpenShift Virtualization Shared Env
# -------------------------------------------------------------------

# --- Platform
platform: rhpds

# --- Cloud Provider
cloud_provider: none

# --- Config
env_type: ocp-workloads
ocp_workload: ocp4_workload_shared_cluster_access

# --- Workload parameters
ocp4_workload_shared_cluster_access_user_groups:
- OPENTLC-PROJECT-PROVISIONERS
ocp4_workload_shared_cluster_access_create_quota: true
# yamllint disable-line rule:line-length
ocp4_workload_shared_cluster_access_quota_name: "clusterquota-rhpds-developer-env-{{ guid }}"
ocp4_workload_shared_cluster_access_quota:
  hard:
    requests.cpu: "8"
    #limits.cpu: "24"
    requests.memory: 20Gi
    #limits.memory: 100Gi
    pods: "20"
    configmaps: "100"
    secrets: "150"
    services: "150"
    persistentvolumeclaims: "15"
    requests.storage: 100Gi
# yamllint disable-line rule:line-length
# --- Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

target_host:
  ansible_host: "{{ target_host_ansible_host }}"
  ansible_port: 22
  ansible_user: opentlc-mgr
  ansible_ssh_private_key_file: ~/.ssh/opentlc-mgr.pem

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ocp_username

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Virtualization Shared Env
    category: Demos
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp46
    - shared
    - virtualization
    - cnv
    labels:
      #OpenShift_Version: "4.6"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: PFE
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: nodes
      description: Number of Nodes
      openAPIV3Schema:
        default: 3
        type: integer
        minimum: 2
        maximum: 3
  secrets:
  - name: opentlc
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
