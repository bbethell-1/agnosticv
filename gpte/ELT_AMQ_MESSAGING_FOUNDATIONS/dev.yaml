---
# Dev is the same as the common variables

# Overwrite Instance type and Image
# studentvm_instance_type: "2c2g30d"
# studentvm_instance_image: rhel-8.1
studentvm_rootfs_size: 50

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name
  idle_after_deploy: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    #namespace: babylon-catalog-{{ stage | default('?') }}
    #display_name: OpenShift 4.10 Workshop
    #category: Workshops
    #keywords:
    #- workshop
    #- openshift
    #labels:
      #OpenShift_Version: "4.10"
      #Product: Red_Hat_OpenShift_Container_Platform
      #Product_Family: Red_Hat_Cloud
      #Provider: RHPDS
    parameters:
      - name: student_name
  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: satellite-rhel8-latest-ha
    - namespace: gpte
      name: gpte
