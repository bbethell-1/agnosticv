---
platform: labs
env_type: studentvm

student_name: lab-user

## Satellite vars
repo_method: satellite
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_org: Red_Hat_GPTE_Labs
# set_repositories_satellite_activationkey = <FROM_SECRET>

# Set up FTL.
# install_ftl: false

# The student roles to deploy
studentvm_roles:
# Set up a Student User
- studentvm_user
# Customize the Student User with a Git Bash Prompt
- studentvm_bash_prompt
# Set up JDK and Maven
- studentvm_java_development
# Set up the AMQ Tools
- studentvm_amq_foundations

# Variables for role studentvm_user
# ---------------------------------
# Install a user id "{{ student_name }}"
studentvm_user_name: "{{ student_name }}"
# Use a password for the student user.
# If false a key pair will be generated
studentvm_user_use_password: true
# If no student_password is provided a randomly generated password will be used
studentvm_user_password: ""
# This user will not have sudo access
studentvm_user_enable_sudo: true

# Variables for role studentvm-bash-prompt
# ----------------------------------------
# Install for the current student
studentvm_bash_prompt_user_name: "{{ student_name }}"

# Variables for role studentvm-java-development
# ---------------------------------------------
# Install JDK 8 (default is 11)
studentvm_java_development_jdk_package: "java-1.8.0-openjdk-devel"

# Special Security Group to override the default security group
# Opens port 8161 for the AMQ Console
security_groups:
- name: BastionSG
  rules:
  - name: MoshPublic
    description: "Public Mosh Access for bastions"
    from_port: 60000
    to_port: 61000
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: SSHPublic
    description: "Public Access for bastions"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: AMQPublic
    description: "Public AMQ Access for bastions"
    from_port: 8161
    to_port: 8161
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

agnosticv_meta:
  virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - gpte-amq-clientvm

