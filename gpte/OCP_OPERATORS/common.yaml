---
# OpenShift Operators Lab
# Platform
platform: labs

# These come from the account
subdomain_base_suffix: .example.opentlc.com
HostedZoneId: Z3IHLWJZOU9SRT

# Config
env_type: ocp-workshop
software_to_deploy: openshift

# Repos
osrelease: 3.11.129
repo_method: file
repo_version: 3.11
# own_repo_path: http://admin.na.shared.opentlc.com/repos/ocp/3.11.129/
# --- own_repo_path is inherited from default account settings based on osrelease

# --- Generic Variables
install_ipa_client: true
ipa_host_password: 4d365fb7
install_idm: htpasswd
run_ocp_diagnostics: false

# --- This is a Lab Environment
install_lets_encrypt_certificates: false
install_ftl: false

# --- OCP Authentication
opentlc_student: username
admin_user: opentlc-mgr

# AgnosticV Meta variables
agnosticv_meta:
  secrets:
    - redhat_registry_token
