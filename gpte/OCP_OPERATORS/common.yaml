---
# OpenShift Operators Lab
# Platform
platform: labs

# subdomain_base_suffix and HostedZoneIdcome from the account

# Config
env_type: ocp-workshop
software_to_deploy: openshift

# Repos
osrelease: 3.11.129
repo_method: file
repo_version: 3.11
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}

# install_ipa_client and ipa_host_password passed from cloudforms
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password:
# --- Student is allowed to sudo and switch to root
# student_sudo: true

# --- This is a Lab Environment
install_idm: htpasswd
run_ocp_diagnostics: false
install_lets_encrypt_certificates: false
install_ftl: false

# --- OCP Authentication
opentlc_student: username
admin_user: opentlc-mgr

# AgnosticV Meta variables
agnosticv_meta:
  secrets:
    - redhat_registry_token

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: dfa024cb-b594-4854-b0e1-8c3bba6a346f
