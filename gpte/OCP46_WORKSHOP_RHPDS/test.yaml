---
purpose: development

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t3a.medium

# Workload Variables
ocp4_workload_le_certificates_install_certificates: false
ocp4_workload_le_certificates_install_api: False

agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    nodecount: ''

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - namespace: gpte
      name: ocp4_token
    - namespace: gpte
      name: satellite-rhel81
    - namespace: gpte
      name: gpte
