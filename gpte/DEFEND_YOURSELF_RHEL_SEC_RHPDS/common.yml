---

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security

# Satellite client variables
repo_method: satellite
satellite_url: labsat.opentlc.com
satellite_activationkey: rhel8-summit
satellite_org: Red_Hat_GPTE_Labs
use_content_view: true

# Cloud settings:

key_name: id_rsa
bastion_instance_image: RHEL81
node_instance_image: RHEL81
remote_user: ec2-user

# This key pair will get injected into /root/.ssh on all hosts.
# ssh private key:
#
ansible_ssh_private_key_file: ~/.ssh/id_rsa

#
# Package install
#
# Run a full yum update and install packages
#
# update_packages: true
common_packages:
  # - python (removed for RHEL8 because python3 was installed in cloud_providers/ec2_infrastructure_deployment.yml)
  - unzip
  - bash-completion
  - tmux
  - wget
  - git
  - vim-enhanced
  - at
  - podman
  - buildah
  - skopeo

# admin user for infra workloads
admin_user: admin
#student_user: lab-user
student_name: ec2-user

software_to_deploy: none
install_ocp4: true
ocp4_installer_version: 4.3.1
osrelease: 4.3.0

#default_workloads:
#rhel-security-verification

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-custom-security-content.git

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  secrets:
    # OpenShift Pull Secret
    - ocp4_token
    # Satellite secrets and vars
    - gpte
    - bookbag-deployer-dev4
    - guidgrabber-api
#  params_to_variables:
#    user: ignore_user
