---

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security

# Satellite client variables
repo_method: satellite
satellite_url: labsat.opentlc.com
satellite_activationkey: rhel8-summit
satellite_org: Red_Hat_GPTE_Labs
use_content_view: true

# admin user for infra workloads
admin_user: admin
student_user: lab-user
student_name: lab-user

software_to_deploy: none
install_ocp4: true
ocp4_installer_version: 4.3.1
osrelease: 4.3.0

default_workloads:
  - rhel-security-verification

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-custom-security-content.git

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  secrets:
  # OpenShift Pull Secret
    - ocp4_token
  # Satellite secrets and vars
    - gpte
    - bookbag-deployer-dev4
    - guidgrabber-api
  params_to_variables:
    user: ignore_user
