---

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security

# Cloud settings:

key_name: id_rsa
bastion_instance_image: RHEL81NBDE
node_instance_image: RHEL81NBDE

# This key pair will get injected into /root/.ssh on all hosts.
# ssh private key:
#
ansible_ssh_private_key_file: ~/.ssh/id_rsa

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true
#
# Package install
#
# Run a full yum update and install packages
#
# update_packages: true

# admin user for infra workloads
admin_user: admin
#student_user: lab-user
student_name: ec2-user

software_to_deploy: none

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-security.git

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  ansible_additional_args: -vvv
  secrets:
    # Satellite secrets and vars
    - satellite-security-labs
    - bookbag-deployer-na4
    - guidgrabber-api
  params_to_variables:
    user: ignore_user
