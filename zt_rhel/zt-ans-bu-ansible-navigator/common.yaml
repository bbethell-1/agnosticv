---
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/demosat-rhel8-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: zero-touch-ansible-bu
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-ANSIBLE

# -------------------------------------------------------------------
# Enable or disable DNS availablity on the VPC after the deployment
# Enable lock_bastion_security_group
# -------------------------------------------------------------------
dns_support_state: true
lock_env_security_groups: true

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
bastion_instance_image: "zt-control-19-july-2024"
default_rootfs_size: 50
default_instance_type: "t3a.medium"

security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionOHTTPSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

instances:
  - name: "{{ bastion_instance_name | default('control') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image:
      name: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG

zero_touch_lock_security_rules:
  - name: BastionSG
    rules_ingress:
      - ports:
          - 443
          - 8443
        proto: tcp
        cidr_ip: "0.0.0.0/0"
    rules_egress: []

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
software_workloads:
  bastions:
    - vscode-server
post_software_final_workloads:
  bastions:
    - showroom

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
student_name: rhel
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
vscode_server_install_vscode: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
vscode_user_name: rhel
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true
  },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/zt-get-started-ansible-navigator.git
showroom_ui: zero-touch
showroom_ansible_runner_image: quay.io/mitsharm/ansible-runner-api
showroom_ansible_runner_image_tag: 1.1.0
showroom_openssh_keypair: provisionkey
showroom_dnf_packages:
  - git
  - podman
  - python3-devel
  - systemd-container
  - unzip

showroom_pip_packages:
  - podman-compose==1.0.6

showroom_tab_services: []
showroom_ansible_runner_api: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 89C9C509-480F-4179-A981-3F5DC167913F
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Get started ansible-navigator
    category: Workshops
    keywords:
      - ansible
      - zero-touch
    labels:
      Provider: RHDP
      Platform: RHEL
      TDP1: Server_Cloud_OS
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
      assetGroup: ZEROTOUCH
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
