---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2
software_to_deploy: none
install_student_user: True

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZEROTOUCH

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
update_packages: True
use_content_view: True

agd_bastion_packages:
- at
- bash-completion
- bind-utils
- git
- podman
- buildah
- tmux
- vim-enhanced
- wget
- httpd
- ansible-core

# -------------------------------------------------------------------
# Role: Common
# -------------------------------------------------------------------
common_packages_el9:
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- openldap-clients
- podman
- skopeo
- buildah
- tree
- jq
- libffi-devel
- firewalld
- nmap-ncat
- ansible-core

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------
# DNS available inside the environment?
dns_support_state: True

# Execute zero-touch-base-rhel "lock_bastion_security_group.yml"
lock_bastion_security_group: True

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
- 443
- 80
- 8443

zero_touch_egress_rules:
- ports:
  - 8443
  - 443
  proto: tcp
  cidr_ip: "0.0.0.0/0"
- ports: "0-65535"
  proto: tcp
  group_name: ZeroRHELSG

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: "t3a.medium"

rhelvm_instance_image: RHEL94GOLD-latest
rhelvm_instance_type: t3a.small

instances:
- name: controlnode
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: True
  floating_ip: True
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

- name: rhelvm
  count: 1
  unique: True
  public_dns: False
  dns_loadbalancer: False
  floating_ip: False
  image: "{{ rhelvm_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ rhelvm_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "rhelvms"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_rhelvm | default(50)  }}"
  security_groups:
  - ZeroRHELSG

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------
pre_software_asset_injector: True

asset_injector_assets:
- description: Root SSH enabled
  type: lineinfile
  path: /etc/ssh/sshd_config
  regexp: '^[#\\s]*PermitRootLogin'
  line: 'PermitRootLogin yes'
  backrefs: true

- description: Define Root Password for showroom SSH access
  type: user
  name: root
  state: present
  password: |-
    {{ ansible_service_account_user_password | d(generated_password) | default(common_password) | password_hash('sha512') }}

- description: Edit ansible.cfg file for root
  type: blockinfile
  state: present
  path: /etc/ansible/ansible.cfg
  block: |
    [defaults]
    ansible_ssh_user=root
    ansible_ssh_private_key_file=/root/.ssh/{{ guid }}key.pem
  insertafter: EOF

- description: Set ssh to pull correct key files
  type: blockinfile
  path: ~/.ssh/config
  state: present
  block: |
    Host *.internal
      User root
      IdentityFile ~/.ssh/{{ guid }}key.pem
      ForwardAgent yes
      StrictHostKeyChecking no
      ConnectTimeout 60
      ConnectionAttempts 10
      ControlMaster auto
      ControlPath /tmp/%h-%r
      ControlPersist 5m
  insertbefore: BOF
# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_dnf_packages:
- git
- podman
- python-devel
- systemd-container
- unzip
- ansible-core

showroom_git_repo: https://github.com/rhpds/rhel_zero_firewall_system_role.git
showroom_ui: zero-touch

showroom_tab_services:
- tty1
- tty2

showroom_tab_tty1_username: root
showroom_tab_tty2_username: root

showroom_single_ssh: False
showroom_multi_ssh: True

showroom_ssh_host: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
showroom_ssh_host_tty1: "controlnode.{{ guid }}.internal"
showroom_ssh_host_tty2: "rhelvm.{{ guid }}.internal"

showroom_ttys_enable_tmux: true
showroom_ttys_tumx_scrolling: false

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_openssh_keypair: provisionkey

showroom_lab_users:
- root

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 75b748b5-ddba-4ce0-8889-63e610d92fa2
  owners:
    maintainer:
    - name: Wilson Harris
      email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Configure firewalls with RHEL System Roles
    category: Demos
    keywords:
    - rhel
    - rhel9
    - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
