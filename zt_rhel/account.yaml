---
#include /includes/ansible_control_plane/prod_controllers_lb.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/lifetime-standard.yaml

platform: ZEROTOUCH

# Zero-touch items need to provision fast and should not need package update.
update_packages: false

__meta__:
  aws_sandboxed: true
  # Default lifespan to an hour.
  # Cannot be extended through the zero-touch interface.
  lifespan:
    default: 1h
    maximum: 2h
    relativeMaximum: 1h
# trigger integration sync
