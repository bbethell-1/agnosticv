---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZEROTOUCH

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
  - 443

use_content_view: true

agd_bastion_packages:
  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: "t3a.medium"
rootfs_size_rhel9: 40

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Create status.sh script
    type: blockinfile
    path: /srv/status.sh
    create: true
    mode: "0750"
    owner: root
    marker: ""
    state: present
    block: |
      #! /bin/bash
      echo -n "status.sh successfully executed by "
      whoami

  - description: Create tasks.txt file
    type: blockinfile
    path: /srv/tasks.txt
    create: true
    mode: "0750"
    owner: root
    marker: ""
    state: present
    block: |
      1. Finish this Permissions Lab
      2. Do the Networking Configuration Basics Lab
      3. Listen to the latest episode of RHEL Presents

  - description: Create proprietary directory
    type: file
    path: /srv/proprietary
    mode: "0640"
    group: root
    owner: root
    state: directory

  - description: Create contract01.txt file
    type: file
    path: /srv/proprietary/contract01.txt
    mode: "0775"
    group: root
    owner: root
    state: touch

  - description: Create contract02.txt file
    type: file
    path: /srv/proprietary/contract02.txt
    mode: "0775"
    group: root
    owner: root
    state: touch

  - description: Create contract03.txt file
    type: file
    path: /srv/proprietary/contract03.txt
    mode: "0775"
    group: root
    owner: root
    state: touch

  - description: Create contract04.txt file
    type: file
    path: /srv/proprietary/contract04.txt
    mode: "0775"
    group: root
    owner: root
    state: touch

  - description: Add group team
    type: group
    name: team
    state: present

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/rhel_zero_using_file_permissions.git
showroom_ui: zero-touch

showroom_tab_services:
  - tty1
  - tty2

showroom_tab_tty1_username: root
showroom_tab_tty2_username: rhel

showroom_ttys_enable_tmux: True
showroom_ttys_tumx_scrolling: False

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - root
  - rhel

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 6eb5f7dc-12ee-49f6-9025-e8067cf630df
  owners:
    maintainer:
      - name: Wilson Harris
        email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    reportingLabels:
      primaryBU: RHEL
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Using File Permissions [Admin 101]
    category: Demos
    keywords:
      - rhel
      - rhel9
      - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
