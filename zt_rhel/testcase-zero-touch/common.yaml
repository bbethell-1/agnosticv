---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel92.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
#platform: ZEROTOUCH
# bastion_public_hostname: "bastion.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Packages Config
# -------------------------------------------------------------------

use_content_view: true

agd_bastion_packages:

  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget


common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ rhel9_instance_image }}"
    flavor:
      ec2: "{{ rhel9_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel9 }}"
    volumes:
      - device_name: "/dev/xvdb"
        size: "20"
        type: gp3
    security_groups:
      - BastionSG
      - WebSG
      - ShowroomSG

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/rhpds/showroom_testcase.git

showroom_ui: zero-touch
showroom_ansible_runner_api: true
showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_lab_users:
  - "{{ showroom_showroom_default_ssh_user }}"
showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

zero_touch_rhel_user: false
zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 4B51109C-D305-4B05-A63D-87291CDD0FB1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: TestCase Zero Touch - a test CI for testing new features
    category: Labs
    keywords:
      - rhel
      - rhel9
      - zero_touch
      - test
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  access_control:
    allow_groups:
      - babylon-admins
      - babylon-devs
      - rhpds-devs

rhel9_instance_image: RHEL92GOLD-latest
rhel9_instance_type: "t3a.small"
rootfs_size_rhel9: 40
