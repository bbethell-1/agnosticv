---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-RHEL

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
  - 443

use_content_view: true

agd_bastion_packages:
  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget
  - mlocate

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: "t3a.medium"
rootfs_size_rhel9: 40

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Create quote.txt
    type: lineinfile
    path: /root/quote.txt
    create: true
    state: present
    line: |-
      Just thinking about everything I have been through, and how huge it all feels.
      The fact that it is just a small part of something larger

  - description: Start and Enable mlocate-updatedb.timer
    type: service
    name: mlocate-updatedb.timer
    state: started
    enabled: true

  - description: Create shell function in bashrc
    type: blockinfile
    path: /root/.bashrc
    create: true
    marker: ""
    state: present
    block: |-
      # Find Shell function to truncate /opt/showroom
      find() {
        local start_dir="$1"
        shift
        command find "$start_dir" "$@" -not -path "*/opt/showroom/*"
      }

  - description: Run updatedb
    type: command
    cmd: updatedb
# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/rhel_zero_helpful_commands.git
showroom_ui: zero-touch

showroom_tab_services:
  - tty1
  - tty2

showroom_tab_tty1_username: root
showroom_tab_tty2_username: rhel

showroom_ttys_enable_tmux: True
showroom_ttys_tumx_scrolling: False

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - root
  - rhel

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 334db79b-8a1e-49ad-9144-0b551f17a2e0
  owners:
    maintainer:
      - name: Wilson Harris
        email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Helpful Linux Commands [Admin 101]
    category: Demos
    keywords:
      - rhel
      - rhel9
      - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
      assetGroup: ZEROTOUCH
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
