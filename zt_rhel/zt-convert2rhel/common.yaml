---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: zero-touch-base-rhel
software_to_deploy: none
install_student_user: true

ansible_user: ec2-user
remote_user: ec2-user

# Use Mike Savage's Provided Centos7 image
# Preconfigured with archived centos repos and the `centos` init-user modified to `ec2-user`
infra_images_redhat_owner_id: "309956199498"
infra_images_owner_id: "809721187735"

infra_images_predefined:
  CENTOS79:
    owner: "{{ infra_images_owner_id }}"
    name: savage-minimal-centos-7.9-hvm-std01.x86_64-gp2
    architecture: x86_64
    aws_filters:
      is-public: false

  RHEL94GOLD-latest:
    owner: "{{ infra_images_redhat_owner_id }}"
    name: RHEL-9.4.*_HVM-*Access*
    architecture: x86_64
    aws_filters:
      is-public: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

agd_bastion_packages:
- at
- bash-completion
- bind-utils
- git
- podman
- buildah
- tmux
- vim-enhanced
- wget
- httpd

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------
dns_support_state: True

zero_touch_ports:
- 443
- 80
- 8443
- 22

zero_touch_egress_rules:
- ports:
  - 8443
  - 443
  - 22
  proto: tcp
  cidr_ip: "0.0.0.0/0"

lock_bastion_security_group: true

bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: t3a.small

centos_instance_image: CENTOS79
centos_instance_type: t3.medium

instances:
- name: bastion
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

- name: centos
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: false
  floating_ip: false
  image: "{{ centos_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ centos_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "centos"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

security_groups:
- name: ZeroRHELSG
  rules:
  - name: ShowroomHTTPS
    description: "Primary showroom endpoint - for reverse proxy"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: SSH
    description: "Ansible and SSH"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------

asset_injector_assets:
- description: Root SSH enabled
  type: lineinfile
  path: /etc/ssh/sshd_config
  regexp: '^PermitRootLogin'
  line: 'PermitRootLogin yes'
  backrefs: true

- description: Define Root Password for showroom SSH access
  type: user
  name: root
  state: present
  password: |-
    {{ ansible_service_account_user_password | d(generated_password) | default(common_password) | password_hash('sha512') }}

# -------------------------------------------------------------------
# Role: OCP4 showroom testing
# -------------------------------------------------------------------
showroom_deploy_shared_cluster_enable: False

ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/rhel_zero_convert2rhel.git

ocp4_workload_showroom_content_git_ref: main
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_antora_playbook: zero-touch-site.yml

ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_image: docker.io/wettyoss/wetty:latest
ocp4_workload_showroom_wetty_ssh_bastion_login: true

bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"
centos_prefix: "{{ groups['centos'][0] | regex_replace('\\..*$') }}"

bastion_ssh_command: "ssh {{ ansible_service_account_user_name }}@{{ bastion_public_hostname }}"
bastion_ssh_user_name: "{{ ansible_service_account_user_name }}"
bastion_ssh_password: "{{ ansible_service_account_user_password }}"
bastion_public_hostname: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
ansible_service_account_user_name: root

showroom_git_repo: >-
  https://github.com/rhpds/rhel_zero_convert2rhel.git

showroom_ui: zero-touch

showroom_tab_services:
- tty1

showroom_tab_tty1_username: root

showroom_ttys_enable_tmux: false

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: "{{ centos_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
showroom_host: host.containers.internal
showroom_lab_users:
- root

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: B341CD26-10CA-49D3-B9C3-9FB88DFE24E7
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Migrate to Red Hat Enterprise Linux from CentOS Linux
    category: Demos
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    keywords:
    - Convert
    - RHEL
    - CENTOS
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
  secrets:
  - name: gpte
    namespace: gpte
