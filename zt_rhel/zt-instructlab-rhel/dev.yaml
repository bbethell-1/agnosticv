purpose: development
instructlab_zt_setup: false
showroom_deploy: true
showroom_preffered_ansible_exec: /usr/bin/python3.11 /usr/bin/ansible-playbook
dns_support_state: true
lock_bastion_security_group: true
post_software_workloads:
  bastions:
  - zero_touch_lockdown
zero_touch_ports:
- 443
- 3128
- 22
zero_touch_egress_rules: []
infra_images_owner_id: '809721187735'
infra_images_predefined:
  RHEL95GOLD-latest:
    owner: '{{ infra_images_owner_id }}'
    name: zt-instructlab-rhel-03122025
    architecture: x86_64
    aws_filters:
      is-public: false
bastion_instance_image: RHEL95GOLD-latest
bastion_instance_type: g4dn.2xlarge
common_password: "{{\n  lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')\n}}"
asset_injector_assets:
- description: Remove 50-cloud-init.conf, ssh issue
  type: remove
  path: /etc/ssh/sshd_config.d/50-cloud-init.conf
- description: Remove 50-redhat.conf, ssh issue
  type: remove
  path: /etc/ssh/sshd_config.d/50-redhat.conf
- description: Update sshd_config for password auth
  type: blockinfile
  path: /etc/ssh/sshd_config
  state: present
  marker: '# {mark} Our custom SSH settings via Ansible'
  block: '# Our custom SSH settings via Ansible

    ChallengeResponseAuthentication no

    PasswordAuthentication yes

    UsePAM yes

    '
- description: Update qna file to point locally
  type: lineinfile
  path: /home/{{ student_name }}/files/instructlab_knowledge/qna.yaml
  regexp: ^\s*repo:\s*https://github.com/rhai-code/instructlab_knowledge
  line: '  repo: /home/{{ student_name }}/files/instructlab_knowledge/'
  backup: true
- description: Update qna file to latest commit
  type: lineinfile
  path: /home/{{ student_name }}/files/instructlab_knowledge/qna.yaml
  regexp: ^\s*commit:\s*[a-fA-F0-9]{40}
  line: '  commit: f6ecbf01a0f19f693ec81f5abd8fe0601eb206d8'
- description: Restart sshd to pick up new password support configuration
  type: service
  name: sshd
  state: restarted
__meta__:
  deployer:
    scm_ref: zt-instruct-rhel-2.0.3
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: zt-instruct-rhel-2.0.3
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
