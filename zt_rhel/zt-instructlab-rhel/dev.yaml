---
#include /includes/ee-multicloud-dev.yaml

# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------
instructlab_zt_setup: False

showroom_deploy: True
showroom_preffered_ansible_exec: "/usr/bin/python3.11 /usr/bin/ansible-playbook"
# DNS available inside the environment?
dns_support_state: True

# Execute zero-touch-base-rhel "lock_bastion_security_group.yml"
lock_bastion_security_group: True

# -------------------------------------------------------------------
# Post Software Workloads
# -------------------------------------------------------------------
post_software_workloads:
  bastions:
    - zero_touch_lockdown

# Locked Network Configuration AWS
zero_touch_ports:
  - 443
  - 3128
  - 22

zero_touch_egress_rules: []

## Instance Details
# Custom Image with instructlab pre-installed
infra_images_owner_id: "809721187735"

infra_images_predefined:
  RHEL95GOLD-latest:
    owner: "{{ infra_images_owner_id }}"
    name: zt-instructlab-rhel-03122025
    architecture: x86_64
    aws_filters:
      is-public: false

bastion_instance_image: RHEL95GOLD-latest
bastion_instance_type: g4dn.2xlarge

common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: zt-instruct-rhel-2.0.3
