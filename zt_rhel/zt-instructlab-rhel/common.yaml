# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_dnf_packages:
  - git
  - podman
  - python-devel
  - systemd-container
  - unzip

showroom_git_repo: "https://github.com/rhpds/showroom_instructlab_summit2024.git"
showroom_git_ref: project-zero
showroom_user: showroom
showroom_ui: zero-touch

showroom_ssh_host: host.docker.internal
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty

showroom_ttys_enable_tmux: True

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_preffered_ansible_exec: "/usr/bin/python3.11 /usr/bin/ansible-playbook"
# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: instruct
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

zero_touch_rhel_user_user_name: instruct
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 100
rootfs_size_bastion: 1024

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

infra_images_owner_id: "809721187735"

infra_images_predefined:
  RHEL95GOLD-latest:
    owner: "{{ infra_images_owner_id }}"
    name: zt-instructlab-rhel-03122025
    architecture: x86_64
    aws_filters:
      is-public: false

bastion_instance_image: RHEL95GOLD-latest
bastion_instance_type: g6.xlarge

instances:

  - name: instructlab
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(100)  }}"
    security_groups:
      - ZeroRHELSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: ZeroRHELSG
    rules:
      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: SSH
        description: "Ansible and SSH"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------

# DNS available inside the environment?
dns_support_state: True

# Execute zero-touch-base-rhel "lock_bastion_security_group.yml"
lock_bastion_security_group: True

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
  - 443

zero_touch_egress_rules: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 076856b0-7ae1-4dba-87dc-b6fa9e0a68d8
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Getting Started with InstructLab on RHEL (ZT)"
    category: Labs
    keywords:
      - instructlab
      - rhel
      - ai
      - nvidia
      - cuda
      - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
      assetGroup: ZEROTOUCH
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
