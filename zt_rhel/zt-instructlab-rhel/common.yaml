---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-instructlab.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-ai.yaml
#include /includes/secrets/hugging-face-ro-token.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: zero-touch-base-rhel
cloud_provider: ec2
aws_region: us-east-2
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}
software_to_deploy: none
install_student_user: True

# Code to pre-configure ilab found at:
# /agnosticd/ansible/configs/zero-touch-base-rhel/instructlab_setup.yml
# Save in case of new image build
instructlab_zt_setup: False

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: ZT-RHEL

# -------------------------------------------------------------------
# Post Software Workloads
# -------------------------------------------------------------------
## Save in case of new image build
# post_software_workloads:
#   bastions:
#     - agnosticd.ai.setup_nvidia_cuda
#     - agnosticd.ai.setup_instructlab
post_software_workloads:
  bastions:
    - zero_touch_lockdown
# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------
setup_nvidia_cuda_nvidia_rhel_dnf_packages:
  - "@nvidia-driver:open-dkms"
  - cuda-toolkit-12-4
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - cuda-cccl-12-4
  - libnccl-2.22.3-1+cuda12.4.x86_64

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_instructlab
# -------------------------------------------------------------------

setup_instructlab_llama_cpp_python_version: "0.2.79"
setup_instructlab_git_ref: "v0.19.3"

setup_instructlab_cuda_home: "/usr/local/cuda-12.4"
setup_instructlab_cuda_lib_path: "/usr/local/cuda-12.4/lib64:/usr/local/cuda-12.4/extras/CUPTI/lib64"

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

use_content_view: true
update_packages: False     # Do you want to run a full yum update

agd_bastion_packages:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - podman
  - tmux
  - vim-enhanced
  - wget
  - ansible

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Update qna file to point locally
    type: lineinfile
    path: "/home/{{ student_name }}/files/instructlab_knowledge/qna.yaml"
    regexp: '^\s*repo:\s*https://github.com/rhai-code/instructlab_knowledge'
    line: "  repo: /home/{{ student_name }}/files/instructlab_knowledge/"
    backup: yes

  - description: Update qna file to latest commit
    type: lineinfile
    path: "/home/{{ student_name }}/files/instructlab_knowledge/qna.yaml"
    regexp: '^\s*commit:\s*[a-fA-F0-9]{40}'
    line: '  commit: f6ecbf01a0f19f693ec81f5abd8fe0601eb206d8'

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

