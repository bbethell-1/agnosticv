---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Variables which needs to be reset or needs different value
# for the development
# -------------------------------------------------------------------
lock_env_security_groups: false


# For dev testing starts Here

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
# bastion_instance_image: "zt-automation-controller-16-aug-2024"
bastion_instance_image: "zt-control-19-july-2024"
node_instance_image: "zt-node-19-july-2024"
controller_instance_image: "aap2.5-2024-11-06"
# "t3a.medium"
# default_instance_image: "RHEL87GOLD-latest"
# bastion_instance_image: "RHEL94GOLD-latest"

default_instance_type: "t3.xlarge"
bastion_instance_type: "t3a.large"
controller_instance_type: "t3a.large"

default_rootfs_size: 100
controller_rootfs_size: 200

security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ContHTTPPorts
        description: "HTTP Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionOHTTPSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

instances:
  - name: "{{ bastion_instance_name | default('control') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image:
      name: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,automationcontroller"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG
      - NodeSG
      - WebSG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image:
      name: "{{ controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ controller_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - NodeSG
      - WebSG

  - name: "node"
    count: 3
    public_dns: false
    image:
      name: "{{ node_instance_image }}"
    flavor:
      ec2: "{{node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: 50
    security_groups:
      - NodeSG

zero_touch_lock_security_rules:
  - name: WebSG
    rules_ingress:
      - ports:
          - 443
          - 8443
        proto: tcp
        cidr_ip: "0.0.0.0/0"
    rules_egress:
      - ports:
          - 443
        proto: tcp
        cidr_ip: "0.0.0.0/0"
  - name: NodeSG
    rules_ingress:
      - ports:
          - 80
          - 22
        proto: tcp
        group_name: NodeSG
    rules_egress:
      - ports:
          - 80
          - 22
        proto: tcp
        group_name: NodeSG

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
software_workloads:
  bastions:
    # - zero_touch_asset_injector
    - vscode-server
  controllers:
    - set-repositories
    - nginx_with_cert
    - automation_platform_loader
post_software_final_workloads:
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ subdomain_base }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_use_automationcontroller_nginx: false
vscode_server_nginx_https_port: 8443
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vimrc*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true
  },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# Role: automation_platform_loader
# -------------------------------------------------------------------
automation_platform_loader_aap_version: 2.5
controller_dependency_check: false
configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "{{ groups['controllers'][0].split('.')[0] }}.{{ subdomain_base }}"
  controller_username: admin
  controller_password: 'R3dh4t1!'
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
  - role: license
    var: controller_license
    tags: license
  - role: credentials
    var: controller_credentials
    tags: credentials

controller_license:
  manifest_url: "{{ controller_manifest.url }}"

controller_credentials:
  - name: "lab-credentials"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "rhel"
      ssh_key_data: "{{ private_ssh_labkey }}"
    state: present


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.0
      pull: missing
