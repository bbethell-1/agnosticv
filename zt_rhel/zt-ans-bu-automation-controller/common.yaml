---
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/zt_ssh_labkey.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-ansible-bu
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-ANSIBLE

# -------------------------------------------------------------------
# Enable or disable DNS availablity on the VPC after the deployment
# Enable lock_bastion_security_group
# -------------------------------------------------------------------
dns_support_state: true
lock_env_security_groups: true

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
bastion_instance_image: "zt-automation-controller-16-aug-2024"
node_instance_image: "zt-node-19-july-2024"
default_rootfs_size: 100
default_instance_type: "t3.xlarge"
# "t3a.medium"

security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionOHTTPSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

instances:
  - name: "{{ bastion_instance_name | default('control') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image:
      name: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,automationcontroller"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG
      - NodeSG

  - name: "node"
    count: 3
    public_dns: false
    image:
      name: "{{ node_instance_image }}"
    flavor:
      ec2: "{{node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: 50
    security_groups:
      - NodeSG

zero_touch_lock_security_rules:
  - name: BastionSG
    rules_ingress:
      - ports:
          - 443
          - 8443
        proto: tcp
        cidr_ip: "0.0.0.0/0"
    rules_egress:
      - ports:
          - 443
        proto: tcp
        cidr_ip: "0.0.0.0/0"
  - name: NodeSG
    rules_ingress:
      - ports:
          - 80
          - 22
        proto: tcp
        group_name: NodeSG
    rules_egress:
      - ports:
          - 80
          - 22
        proto: tcp
        group_name: NodeSG

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
software_workloads:
  bastions:
    - zero_touch_asset_injector
    - automation_platform_loader
post_software_final_workloads:
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: automation_platform_loader
# -------------------------------------------------------------------
configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}:8443"
  controller_username: admin
  controller_password: 'ansible123!'
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
  - role: license
    var: controller_license
    tags: license
  - role: credentials
    var: controller_credentials
    tags: credentials

controller_license:
  manifest_url: "{{ controller_manifest.url }}"

controller_credentials:
  - name: "lab-credentials"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "rhel"
      ssh_key_data: "{{ private_ssh_labkey }}"
    state: present

# -------------------------------------------------------------------
# Role: zero_touch_asset_injector
# -------------------------------------------------------------------
zero_touch_asset_injector_automation_controller_issue_cert: true
zero_touch_asset_injector_automation_controller_password: "ansible123!"
zero_touch_asset_injector_automation_controller_nginx_https_port: 8443

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
student_name: rhel
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/zt-get-started-with-automation-controller.git
showroom_ui: zero-touch
showroom_ansible_runner_image: quay.io/mitsharm/ansible-runner-api
showroom_ansible_runner_image_tag: 1.1.0
showroom_openssh_keypair: provisionkey
showroom_dnf_packages:
  - git
  - podman
  - python3-devel
  - systemd-container
  - unzip

showroom_pip_packages:
  - podman-compose==1.0.6

showroom_tab_services:
  - tty1

showroom_tab_tty1_username: rhel
showroom_showroom_default_ssh_user: rhel
showroom_ttys_enable_tmux: false
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"
showroom_ansible_runner_api: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: AC215A06-199A-4A1B-92E1-98CB02FED85C
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Get started with Automation Controller
    category: Workshops
    keywords:
      - ansible
      - zero-touch
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: Automation
      assetGroup: ZEROTOUCH
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
