---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

zero_touch_ports:
  - 443
  - 22

zero_touch_egress_rules:
  - ports: "0-65535"
    proto: tcp
    group_name: ZeroRHELSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: zt-user-basics-1.0.3-hotfix
  lifespan:
    default: 1d
    maximum: 2d
    relativeMaximum: 1d
  runtime:
    default: 6h
    maximum: 48h
