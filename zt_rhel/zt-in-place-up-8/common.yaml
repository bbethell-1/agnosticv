---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-7-8-and-9-latest.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2
software_to_deploy: none
install_student_user: True

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZEROTOUCH

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
update_packages: True
use_content_view: True

agd_bastion_packages:
- at
- bash-completion
- bind-utils
- git
- podman
- buildah
- tmux
- vim-enhanced
- wget
- httpd

# -------------------------------------------------------------------
# Role: Common
# -------------------------------------------------------------------

common_packages:
- python
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- git
- vim-enhanced
- yum-utils
- httpd-tools
- dnf
- dnf-plugins-core

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------
# DNS available inside the environment?
dns_support_state: True

# Execute zero-touch-base-rhel "lock_bastion_security_group.yml"
lock_bastion_security_group: True

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
- 443
- 80
- 8443

zero_touch_egress_rules:
- ports:
  - 8443
  - 443
  proto: tcp
  cidr_ip: "0.0.0.0/0"
- ports: "0-65535"
  proto: tcp
  group_name: ZeroRHELSG

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: t3a.small

leapp_instance_image: RHEL79GOLD-latest
leapp_instance_type: t3.medium

instances:
- name: bastion
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: True
  floating_ip: True
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

- name: leapp
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: False
  floating_ip: False
  image: "{{ leapp_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ leapp_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "leapps"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

security_groups:
- name: ZeroRHELSG
  rules:
  - name: ShowroomHTTPS
    description: "Primary showroom endpoint - for reverse proxy"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: SSH
    description: "Ansible and SSH"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------

asset_injector_assets:
- description: Root SSH enabled
  type: lineinfile
  path: /etc/ssh/sshd_config
  regexp: '^[#\\s]*PermitRootLogin'
  line: 'PermitRootLogin yes'
  backrefs: true

- description: Define Root Password for showroom SSH access
  type: user
  name: root
  state: present
  password: |-
    {{ ansible_service_account_user_password | d(generated_password) | default(common_password) | password_hash('sha512') }}

- description: Copy Showroom-tmux file from bastion to showroom_ssh_host
  type: blockinfile
  path: /usr/local/bin/showroom-tmux
  mode: "755"
  marker: ""
  create: True
  owner: root
  state: present
  block: |-
    #!/usr/bin/bash

    # Added by showroom
    # Enables tty ssh sessions, eg wetty, to automatically run in a tmux session

    if command -v tmux >/dev/null 2>&1 && [ -z "$TMUX" ]; then
        # Check if the session exists, disregarding any error messages
        tmux has-session -t $1 2>/dev/null

        if [ $? != 0 ]; then
            # Create a new session if it doesn't exist
            tmux new-session -s $1 -n $1 -d
        fi

        # Attach to the session
        tmux attach-session -t $1
    else
        if [ -z "$TMUX" ]; then
            echo "tmux is not installed. Please install tmux to use this feature."
        fi
    fi

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/rhel_zero_in_place_upgrades.git
showroom_ui: zero-touch

showroom_tab_services:
- tty1

showroom_tab_tty1_username: root

showroom_ttys_enable_tmux: True
showroom_ttys_tumx_scrolling: False

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: True
showroom_ssh_method: sshkey
showroom_openssh_keypair: provisionkey

bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"
leapp_prefix: "{{ groups['leapps'][0] | regex_replace('\\..*$') }}"

showroom_ssh_host: "leapp.{{ guid }}.internal"
showroom_host: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
showroom_lab_users:
- root

showroom_user_password: "{{ common_password }}"

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

