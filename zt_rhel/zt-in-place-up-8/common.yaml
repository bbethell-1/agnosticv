  asset_uuid: 3e13359f-d9b1-435f-9597-8ca94b01df05
  owners:
    maintainer:
    - name: Wilson Harris
      email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    reportingLabels:
      primaryBU: RHEL
    namespace: babylon-catalog-{{ stage | default('?') }}
