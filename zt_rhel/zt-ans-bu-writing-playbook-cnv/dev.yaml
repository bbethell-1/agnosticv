---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
bastion_instance_image: "rhel-8.6"
node_instance_image: "rhel-8.6"
default_instance_memory: "2G"
default_instance_cores: 2
default_instance_rootfs: 20Gi

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: zt-ans-bu-writing-playbook-cnv
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
