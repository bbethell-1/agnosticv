---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

zero_touch_ports:
- 443
- 80
- 8443
- 9090
- 5647
- 883
- 22

zero_touch_egress_rules:
- ports:
  - 8443
  - 443
  - 22
  proto: tcp
  cidr_ip: "0.0.0.0/0"
- ports: "0-65535"
  proto: tcp
  group_name: ZeroRHELSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  lifespan:
    default: 1d
    maximum: 2d
    relativeMaximum: 1d
  runtime:
    default: 6h
    maximum: 48h
