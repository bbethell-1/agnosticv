---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

zero_touch_ports:
- 443
- 80
- 8443
- 9090
- 5647
- 883
- 22

zero_touch_egress_rules:
- ports:
  - 443
  - 80
  - 8443
  - 9090
  - 5647
  - 883
  - 22
  proto: tcp
  cidr_ip: "0.0.0.0/0"
- ports: "0-65535"
  proto: tcp
  group_name: ZeroRHELSG

# -------------------------------------------------------------------
# Vars for dev in case satellite needs to be re-built, do not remove
# -------------------------------------------------------------------

infra_images_redhat_owner_id: "309956199498"
infra_images_owner_id: "809721187735"

infra_images_predefined:
  RHEL8GOLD-latest:
    owner: "{{ infra_images_redhat_owner_id }}"
    name: RHEL-8.*_HVM-*Access*
    architecture: x86_64
    aws_filters:
      is-public: false

  RHEL94GOLD-latest:
    owner: "{{ infra_images_redhat_owner_id }}"
    name: RHEL-9.4.*_HVM-*Access*
    architecture: x86_64
    aws_filters:
      is-public: false

satellite_instance_image: RHEL8GOLD-latest

instances:
- name: bastion
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: True
  floating_ip: True
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

- name: satellite
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: True
  floating_ip: True
  image: "{{ satellite_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ satellite_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "rhel"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_satellite | default(50)  }}"
  security_groups:
  - ZeroRHELSG
  - SatSG

- name: rhel
  count: 2
  unique: False
  public_dns: False
  dns_loadbalancer: False
  floating_ip: False
  image: "{{ rhel_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ rhel_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_rhelvm | default(50)  }}"
  security_groups:
  - ZeroRHELSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  lifespan:
    default: 1d
    maximum: 2d
    relativeMaximum: 1d
  runtime:
    default: 6h
    maximum: 48h
