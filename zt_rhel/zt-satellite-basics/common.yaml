---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-satellite-rhel-8-9-latest.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2
software_to_deploy: none
install_student_user: True

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZEROTOUCH

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
update_packages: True
use_content_view: True

agd_bastion_packages:
- at
- bash-completion
- bind-utils
- git
- podman
- buildah
- tmux
- vim-enhanced
- wget
- httpd

# -------------------------------------------------------------------
# Role: Common
# -------------------------------------------------------------------

common_packages:
- python
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- git
- vim-enhanced
- yum-utils
- httpd-tools

# -------------------------------------------------
# Role: pre-software.yml satellite normalization
# -------------------------------------------------
zt_satellite_external_fqdn: "{{ groups['satellites'][0].split('.')[0] }}.{{ subdomain_base }}"
zt_satellite_internal_fqdn: satellite.example.com
zt_satellite_user_name: admin
zt_satellite_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Zero Touch Configuration
# -------------------------------------------------------------------
# DNS available inside the environment?
dns_support_state: True

# Execute zero-touch-base-rhel "lock_bastion_security_group.yml"
lock_bastion_security_group: True

# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
- 443
- 80
- 8443
- 9090
- 5647
- 883

zero_touch_egress_rules:
- ports:
  - 8443
  - 443
  - 80
  - 9090
  proto: tcp
  cidr_ip: "0.0.0.0/0"
- ports: "0-65535"
  proto: tcp
  group_name: ZeroRHELSG

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
infra_images_redhat_owner_id: "309956199498"
infra_images_owner_id: "809721187735"

infra_images_predefined:
  Satellite615:
    owner: "{{ infra_images_owner_id }}"
    name: zt-satellite-basics-9-23-2024
    architecture: x86_64
    aws_filters:
      is-public: false

  RHEL94GOLD-latest:
    owner: "{{ infra_images_redhat_owner_id }}"
    name: RHEL-9.4.*_HVM-*Access*
    architecture: x86_64
    aws_filters:
      is-public: false

bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: t3a.small

satellite_instance_image: Satellite615
satellite_instance_type: r7a.2xlarge
rootfs_size_satellite: 300

rhel_instance_image: RHEL94GOLD-latest
rhel_instance_type: t3a.small

instances:
- name: bastion
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: True
  floating_ip: True
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - ZeroRHELSG

- name: satellite
  count: 1
  unique: True
  public_dns: True
  dns_loadbalancer: True
  floating_ip: True
  image: "{{ satellite_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ satellite_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "satellites"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_satellite | default(50)  }}"
  security_groups:
  - ZeroRHELSG
  - SatSG

- name: rhel
  count: 2
  unique: False
  public_dns: False
  dns_loadbalancer: False
  floating_ip: False
  image: "{{ rhel_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ rhel_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_rhelvm | default(50)  }}"
  security_groups:
  - ZeroRHELSG

security_groups:
- name: ZeroRHELSG
  rules:
  - name: ShowroomHTTPS
    description: "Primary showroom endpoint - for reverse proxy"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: SSH
    description: "Ansible and SSH"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: SatSG
  rules:
  - name: FromSatSCAP
    description: "Open OpenSCAP"
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: FromSatKA
    description: "Open Katello Agent"
    from_port: 5647
    to_port: 5647
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: FromSatMQTT
    description: "Open remote-execution MQTT"
    from_port: 883
    to_port: 883
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------
asset_injector_assets:
- description: Root SSH enabled
  type: lineinfile
  path: /etc/ssh/sshd_config
  regexp: '^[#\\s]*PermitRootLogin'
  line: 'PermitRootLogin yes'
  backrefs: true

- description: Define Root Password for showroom SSH access
  type: user
  name: root
  state: present
  password: |-
    {{ ansible_service_account_user_password | d(generated_password) | default(common_password) | password_hash('sha512') }}

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_dnf_packages:
- git
- podman
- python-devel
- systemd-container
- unzip
- ansible-core

showroom_git_repo: https://github.com/rhpds/rhel_zero_satellite_basics.git
showroom_ui: zero-touch

showroom_tab_services:
- tty1

showroom_tab_tty1_username: root

showroom_ttys_enable_tmux: False
showroom_ttys_tumx_scrolling: False

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: True
showroom_ssh_method: sshkey
showroom_openssh_keypair: provisionkey

bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"
leapp_prefix: "{{ groups['leapps'][0] | regex_replace('\\..*$') }}"

showroom_ssh_host: "host.containers.internal"
showroom_host: "{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
showroom_lab_users:
- root

showroom_user_password: "{{ common_password }}"

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 4877873f-5750-486b-af70-75791c7a2f7b
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Satellite Basics
    category: Demos
    keywords:
    - satellite
    - rhel
    - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: False
    parameters: []
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
