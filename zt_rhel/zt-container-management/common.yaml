---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-zt.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: zero-touch-base-rhel
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: ZT-RHEL

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
dns_support_state: True
zero_touch_cockpit_installed: True
# Ports to be open for ingress / egress after server hardening from lock_bastion_security_group.yml in zero-touch-rhel config
zero_touch_ports:
  - 443
  - 80
  - 8080
  - 8443
  - 8081
  - 9090
  - 3000

zero_touch_egress_rules:
  - ports:
      - 8443
      - 8080
      - 443
      - 8081
      - 9090
      - 3000
    proto: tcp
    cidr_ip: "0.0.0.0/0"
use_content_view: true

agd_bastion_packages:
  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


bastion_instance_image: RHEL94GOLD-latest
bastion_instance_type: "t3a.medium"
rootfs_size_rhel9: 40

software_workloads:
  bastions:
    - ansible_bu_setup_workshop

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: asset-injector
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Add rhel user to passwordless sudo
    type: lineinfile
    path: /etc/sudoers
    create: true
    state: present
    line: |-
      "{{ zero_touch_rhel_user_user_name }}" ALL=(ALL) NOPASSWD: ALL

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
### Showroom broken Testing other repo https://github.com/rhpds/rhel_zero_poc_managing_user_basics.git
showroom_git_repo: https://github.com/rhpds/rhel_zero_container_management.git
showroom_ui: zero-touch

showroom_tab_services:
  - tty1

showroom_tab_tty1_username: root

showroom_ttys_enable_tmux: true
showroom_ttys_tumx_scrolling: false

#bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"

#showroom_tab_web1_url: "https://{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
#showroom_tab_web1_name: Grafana

#showroom_tab_web2_url: "https://{{ bastion_prefix }}.{{ guid }}{{ subdomain_base_suffix }}"
#showroom_tab_web2_name: Cockpit

showroom_showroom_default_ssh_user: root
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - root

showroom_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: zero_touch_rhel_user
# -------------------------------------------------------------------

student_name: rhel
student_password: "{{ common_password }}"

zero_touch_rhel_user_user_name: rhel
zero_touch_rhel_user_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 741264bc-9242-44b6-b136-fae5fbf43655
  owners:
    maintainer:
      - name: Wilson Harris
        email: wharris@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Running Containers
    category: Demos
    keywords:
      - rhel
      - rhel9
      - zero-touch
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHEL_BU
    multiuser: false
    parameters: []
    reportingLabels:
      assetGroup: ZEROTOUCH
      primaryBU: RHEL
  secrets: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
