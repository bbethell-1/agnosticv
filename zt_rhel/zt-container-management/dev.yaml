---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

instances:

  - name: "{{ bastion_hostname | default('rhel') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom,nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - ZeroRHELSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: zt-user-basics-1.0.3-hotfix
  lifespan:
    default: 1d
    maximum: 2d
    relativeMaximum: 1d
  runtime:
    default: 6h
    maximum: 48h
