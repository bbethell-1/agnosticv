---
# -------------------------------------------------------------------
# Dev CI overrides
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_egress_firewall: true
ocp4_workload_tenant_namespace_egress_allow_domains:
- pypi.org
- files.pythonhosted.org

# -------------------------------------------------------------------
# Babylon meta variables (dev overrides)
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main

  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: zt-ocp4-get-started
      purpose: dev
    tenant_cluster:
      item: zt-hp/zt-ocp4-get-started-cluster
