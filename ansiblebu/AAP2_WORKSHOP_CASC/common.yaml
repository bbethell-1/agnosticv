---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: configascode_cd

# ENV TYPE
# env_type: "aap2-workshop-{{ workshop_type }}"
env_type: "aap2-ansible-workshops"

# Force disable automation hub
automation_hub: false

# Force disable gitlab
add_gitlab: false

# ANSIBLE_REPO_PATH: "/root/agnosticd/ansible"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

pre_build: false
# provided_sha_value: 7456b98f2f50e0e1d4c93fb4e375fe8a9174f397a5b1c0950915224f7f020ec4

control_nodes: 2

ec2_xtra:
  juniper:
    size: c5.xlarge
    ami: "{{ juniper_ami | default(omit) }}"
    os: junos
    username: ec2-user
    #filter: "junos-vsrx3-x86-64-2.4R2-S1-byol*"
    filter: "junos-vsrx3-x86-64-22.3R2*byol*"
    volume:
    - device_name: /dev/sda1
      ebs:
        volume_type: io1
        iops: 1000
        volume_size: 40
        delete_on_termination: true
  attendance_host:
    owners: 309956199498
    size:
    - t3a.large
    - t3.large
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user

__meta__:
  asset_uuid: c8a5d5ab-1b17-4c6a-866a-fe60de5482b4
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Automation Controller configuration Continuous Deployment with CasC
    category: Workshops
    keywords:
    - AAP2
    - config-as-code
    - workshop
    - ansible
    - casc
    - aap2casc
    - CD
    - continuous-deployment
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
  secrets:
  - name: satellite-rhel8-latest-ha
    namespace: gpte
  - namespace: gpte
    name: ansible-tower-advanced-2
...
