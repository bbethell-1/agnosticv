---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: configascode_cd

# ENV TYPE
# env_type: "aap2-workshop-{{ workshop_type }}"
env_type: "aap2-ansible-workshops"

# Force disable automation hub
automation_hub: false

# Force disable gitlab
add_gitlab: false

# ANSIBLE_REPO_PATH: "/root/agnosticd/ansible"

pre_build: false

control_nodes: 2

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Automation Controller configuration Continuous Deployment with CasC
    category: Workshops
    keywords:
    - AAP2
    - config-as-code
    - workshop
    - ansible
    - casc
    - aap2casc
    - CD
    - continuous-deployment
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
  secrets:
  - name: satellite-rhel8-latest-ha
    namespace: gpte
...
