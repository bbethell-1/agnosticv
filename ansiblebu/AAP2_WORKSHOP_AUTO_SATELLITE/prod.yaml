---

purpose: production

# -------------------------------------------------------------------
# Workshop Vars
# -------------------------------------------------------------------
# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: example.opentlc.com

ec2_xtra:
  satellite:
    owners: 809721187735
    filter: "rhel8.9-satellite-6.14-2024-04-17"
    username: ec2-user
    os_type: linux
    size:
      - r5a.xlarge
      - r5.xlarge
      - r5b.xlarge
    disk_volume_type: gp3
    disk_space: 500
    disk_iops: 6000
    disk_throughput: 250
    architecture: x86_64
  centos78:
    owners: 719622469867
    filter: CentOS*7.8*x86_64
    username: centos
    os_type: linux
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    python_interpreter: '/usr/bin/python'
  rhel7:
    owners: 309956199498
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-7.9_HVM*'
    username: ec2-user
    python_interpreter: '/usr/bin/python'
  attendance_host:
    owners: 309956199498
    size:
      - t3a.medium
      - t3.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user
  control_type_pre_build:
    owners: 962147768365
    architecture: x86_64
    filter: 'automation_controller*'
    username: ec2-user
    size:
      - m5a.xlarge
      - m4.xlarge
    os_type: linux
    disk_volume_type: gp3
    disk_space: 40
    disk_iops: 3000
    disk_throughput: 125

auto_satellite_project_scm_url: 'https://github.com/redhat-partner-tech/automated-satellite.git'
auto_satellite_project_scm_branch: 'aap2-24'
auto_satellite_ee: "quay.io/acme_corp/auto_satellite_ee:latest"
controller_configuration_projects_async_retries: 50
controller_configuration_projects_async_delay: 5
auto_satellite_podman_update: true
auto_satellite_podman_update_version: 4.6

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    scm_ref: rhpds-workshops-aap2-prod
    credentials:
      - rhpds-aws-prod
