---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: auto_satellite

# ENV TYPE
env_type: "aap2-workshop-{{ workshop_type }}"

# workshop or demo
provision_mode: workshop

# select rhel7 or rhel8 client nodes
rhel: rhel7

# choice of centos7 nodes
# refer to https://wiki.centos.org/Cloud/AWS for available minor releases
# select centos7 client node version
centos7: centos78

# Enable AWS IAM integration with control node and workshop nodes
tower_node_aws_api_access: true

# IBM Community Grid - defaults to true if you don't tell the provisioner
ibm_community_grid: false

# default vars for ec2 AMIs (ec2_info) located in Ansible workshop provisioner
# https://github.com/ansible/workshops ...here:
# provisioner/roles/manage_ec2_instances/defaults/main/main.yml
# select ec2_info AMI vars can be overwritten (must include entire var stanza
# for a given resource) via 'ec2_xtra' vars, e.g.:
ec2_xtra:
  satellite:
    owners: 719622469867
    filter: AAP2_Smart_MGMT*
    username: ec2-user
    os_type: linux
    size:
      - r5a.xlarge
      - r5.xlarge
      - r5b.xlarge
    disk_volume_type: gp3
    disk_space: 500
    disk_iops: 6000
    disk_throughput: 250
    architecture: x86_64
  centos78:
    owners: 719622469867
    filter: CentOS*7.8*x86_64
    username: centos
    os_type: linux
    size: t3a.medium
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    python_interpreter: '/usr/bin/python'
pre_build_controller_ami:
  us-east-1: ami-09d31b51f98e21f19
  us-east-2: ami-04946da7990fb2a1c
  ap-southeast-1: ami-09d9971507052e964
  eu-central-1: ami-0f4d3580a7c4d1e37

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Platform 2 & Satellite Workshop
    category: Workshops
    keywords:
      - AAP2
      - satellite
      - workshop
      - ansible
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
