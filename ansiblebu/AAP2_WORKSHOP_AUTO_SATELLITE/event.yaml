---
purpose: event

# -------------------------------------------------------------------
# Workshop Vars
# -------------------------------------------------------------------
# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: example.opentlc.com
ec2_xtra:
  satellite:
    owners: 719622469867
    filter: AAP2_Smart_MGMT*
    username: ec2-user
    os_type: linux
    size: r5a.xlarge
    disk_volume_type: gp3
    disk_space: 500
    disk_iops: 6000
    disk_throughput: 250
    architecture: x86_64
  centos78:
    owners: 719622469867
    filter: CentOS*7.8*x86_64
    username: centos
    os_type: linux
    size: t3a.medium
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    python_interpreter: '/usr/bin/python'
  rhel7:
    owners: 309956199498
    size: t3a.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-7.9_HVM*'
    username: ec2-user
    python_interpreter: '/usr/bin/python'

auto_satellite_project_scm_url: 'https://github.com/redhat-partner-tech/automated-satellite.git'
auto_satellite_project_scm_branch: 'aap2-22'
auto_satellite_ee: "quay.io/s4v0/ee-automated-satellite-aap2:latest"

###########################
# Babylon meta variables #
###########################
__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    scm_ref: rhpds-workshops-aap2-prod
    credentials:
      - rhpds-aws-prod
