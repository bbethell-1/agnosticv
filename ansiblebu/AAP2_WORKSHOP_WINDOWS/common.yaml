---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: windows

# ENV TYPE
env_type: "aap2-workshop-{{ workshop_type }}"

instance_loc: ec2
doubleup: false     # creates 2 windows instances per student instead of default 1

# password for Ansible control node
windows_password: >-
  {{ lookup("ansible.builtin.password", "/tmp/windows_password chars=ascii_lowercase,digits length=8") }}

__meta__:
  asset_uuid: f2ad7d87-df02-4512-8081-1f9a79460924
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Platform 2 Windows Workshop
    category: Workshops
    keywords:
    - AAP2
    - windows
    - workshop
    - ansible
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
