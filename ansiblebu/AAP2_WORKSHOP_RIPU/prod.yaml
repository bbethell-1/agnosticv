---
purpose: production

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: example.opentlc.com

ripu_project_scm_url: 'https://github.com/redhat-partner-tech/leapp-project'
ripu_project_scm_branch: 'main'

ec2_xtra:
  rhel7:
    owners: 719622469867
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 30
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'rhel-7.9-lvm-std*.x86_64-gp2'
    username: ec2-user
    python_interpreter: '/usr/bin/python'
  rhel8:
    owners: 719622469867
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 32
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'rhel-8.8-lvm-std*.x86_64-gp2'
    username: ec2-user
  attendance_host:
    owners: 309956199498
    size:
      - t3a.large
      - t3.large
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user
  control_type_pre_build:
    owners: 962147768365
    architecture: x86_64
    filter: 'automation_controller*'
    username: ec2-user
    size:
      - m5a.xlarge
      - m4.xlarge
    os_type: linux
    disk_volume_type: gp3
    disk_space: 40
    disk_iops: 3000
    disk_throughput: 125

##########################
