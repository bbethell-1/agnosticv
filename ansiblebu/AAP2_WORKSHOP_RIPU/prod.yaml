---
purpose: production

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: example.opentlc.com

pre_build_controller_ami:
  us-east-1: ami-09d31b51f98e21f19
  us-east-2: ami-04946da7990fb2a1c
  ap-southeast-1: ami-09d9971507052e964
  eu-central-1: ami-0f4d3580a7c4d1e37

ec2_xtra:
  rhel7:
    owners: 309956199498
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-7.9_HVM-2021*Access*'
    username: ec2-user
    python_interpreter: '/usr/bin/python'
  rhel8:
    owners: 309956199498
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user
  juniper:
    size: c5.xlarge
    ami: "{{ juniper_ami | default(omit) }}"
    os: junos
    username: ec2-user
    #filter: "junos-vsrx3-x86-64-2.4R2-S1-byol*"
    filter: "junos-vsrx3-x86-64-22.3R2*byol*"
    volume:
      - device_name: /dev/sda1
        ebs:
          volume_type: io1
          iops: 1000
          volume_size: 40
          delete_on_termination: true
  attendance_host:
    owners: 309956199498
    size:
      - t3a.large
      - t3.large
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    scm_ref: rhpds-workshops-aap2-prod
    #scm_ref: main
    # Predefined AWS Credentials on the controller
    credentials:
      - rhpds-aws-prod
