---
purpose: development

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: devel.opentlc.com

pre_build_controller_ami:
  us-east-1: ami-09d31b51f98e21f19
  us-east-2: ami-04946da7990fb2a1c
  ap-southeast-1: ami-09d9971507052e964
  eu-central-1: ami-0f4d3580a7c4d1e37

ripu_project_scm_url: 'https://github.com/redhat-partner-tech/leapp-project'
ripu_project_scm_branch: 'dev01'

ec2_xtra:
  rhel7:
    owners: 124572886817
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 30
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'rhel-7.9-lvm-std*.x86_64-gp2'
    username: ec2-user
    python_interpreter: '/usr/bin/python'
  rhel8:
    owners: 124572886817
    size:
      - t3a.medium
      - t3.medium
      - t2.medium
    os_type: linux
    disk_volume_type: gp3
    disk_space: 30
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'rhel-8.8-lvm-std*.x86_64-gp2'
    username: ec2-user

##########################
# Babylon meta variables #
##########################
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-ansiblebu
  deployer:
    scm_ref: rhpds-workshops-aap2-dev
    #scm_ref: main
    # Predefined AWS Credentials on the controller
    credentials:
      - rhpds-aws-dev
