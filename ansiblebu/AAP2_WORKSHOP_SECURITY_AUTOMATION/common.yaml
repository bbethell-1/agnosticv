---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: security

# ENV TYPE
env_type: "aap2-workshop-{{ workshop_type }}"

# password for Ansible control node
windows_password: >-
  {{ lookup("ansible.builtin.password", "/tmp/" ~ guid ~ "-windows_password chars=ascii_letters,digits length=15") }}

security_console: 'qradar'

ec2_xtra:
  juniper:
    size: c5.xlarge
    ami: "{{ juniper_ami | default(omit) }}"
    os: junos
    username: ec2-user
    #filter: "junos-vsrx3-x86-64-2.4R2-S1-byol*"
    filter: "junos-vsrx3-x86-64-22.3R2*byol*"
    volume:
    - device_name: /dev/sda1
      ebs:
        volume_type: io1
        iops: 1000
        volume_size: 40
        delete_on_termination: true
  attendance_host:
    owners: 309956199498
    size:
    - t3a.large
    - t3.large
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user

__meta__:
  asset_uuid: eac456ca-7706-4634-bcf6-40b07c69d87d
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Ansible Automation Platform 2 Security Automation Workshop
    category: Workshops
    keywords:
    - AAP2
    - security-automation
    - workshop
    - ansible
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
