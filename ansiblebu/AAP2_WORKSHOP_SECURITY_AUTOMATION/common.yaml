---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: security

# ENV TYPE
env_type: "aap2-workshop-{{ workshop_type }}"

# password for Ansible control node
windows_password: >-
  {{ lookup("ansible.builtin.password", "/tmp/" ~ guid ~ "-windows_password chars=ascii_letters,digits length=15") }}

security_console: 'qradar'

__meta__:
  asset_uuid: eac456ca-7706-4634-bcf6-40b07c69d87d
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Ansible Automation Platform 2 Security Automation Workshop
    category: Workshops
    keywords:
    - AAP2
    - security-automation
    - workshop
    - ansible
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
