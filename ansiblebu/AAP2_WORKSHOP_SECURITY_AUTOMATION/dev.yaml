---
purpose: development

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: devel.opentlc.com

# Override qradar AMI owner only for dev acct
ec2_xtra:
  qradar:
    owners: 719622469867
    size: t2.2xlarge
    os_type: linux
    disk_volume_type: gp3
    disk_space: 300
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'AnsibleSecurity-QRadarCE*'
    username: ec2-user
    python_interpreter: '/usr/bin/python'

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:
    scm_ref: rhpds-workshops-aap2-dev
    #scm_ref: main
    # Predefined AWS Credentials on the controller
    credentials:
      - rhpds-aws-dev
