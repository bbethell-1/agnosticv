---
purpose: development

# Workshop Type
workshop_type: controller_migration_casc

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: devel.opentlc.com

##########################
# Babylon meta variables #
##########################

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    # scm_url: https://github.com/automationiberia/agnosticd.git
    # scm_ref: AAP2_WORKSHOP_MIGRATION_CASC
    scm_url: https://github.com/automationiberia/workshops.git
    scm_ref: aap2-controller-migration-casc
    actions:
      provision:
        entry_point: provisioner/provision_lab.yml
      destroy:
        entry_point: provisioner/teardown_lab.yml
      start:
        disable: true
      stop:
        disable: true
      status:
        disable: true
      update:
        disable: true
    execution_environment:
      name: aap2-workshop
    credentials:
      - rhpds-aws-dev
...
