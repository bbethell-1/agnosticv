---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# ENV TYPE
env_type: "aap2-workshop-networking-automation"

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Platform 2 Networking Automation Workshop
    category: Workshops
    labels:
      Provider: Ansible_BU
    parameters:
      - name: workshop_type
        description: Select workshop type.
        formLabel: Workshop Type
        required: true
        openAPIV3Schema:
          type: string
          enum:
            - networking_arista_tower_workshop
            - networking_cisco_tower_workshop
            - networking_juniper_tower_workshop
            - networking_multivendor_tower_workshop
