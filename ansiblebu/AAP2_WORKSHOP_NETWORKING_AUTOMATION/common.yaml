---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/aap2-workshop-common.yaml

# Deployment Platform
platform: rhpds

# Workshop Type
workshop_type: network

# ENV TYPE
env_type: "aap2-workshop-networking-automation"

ec2_xtra:
  juniper:
    size: c5.xlarge
    ami: "{{ juniper_ami | default(omit) }}"
    os: junos
    username: ec2-user
    #filter: "junos-vsrx3-x86-64-2.4R2-S1-byol*"
    filter: "junos-vsrx3-x86-64-22.3R2*byol*"
    volume:
      - device_name: /dev/sda1
        ebs:
          volume_type: io1
          iops: 1000
          volume_size: 40
          delete_on_termination: true
  attendance_host:
    owners: 309956199498
    size:
      - t3a.large
      - t3.large
    os_type: linux
    disk_volume_type: gp3
    disk_space: 10
    disk_iops: 3000
    disk_throughput: 125
    architecture: x86_64
    filter: 'RHEL-8*HVM-*Hourly*'
    username: ec2-user

__meta__:
  asset_uuid: dbeee484-12e4-44da-964a-d997154f6f66
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Platform 2 Networking Automation Workshop
    category: Workshops
    keywords:
      - aap2
      - ansible
      - cisco
      - arista
      - juniper
      - networking
      - automation
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    parameters:
      - name: network_type
        description: Select Network Type (Select none for Multivendor)
        formLabel: Network Type (Select none for Multivendor)
        required: false
        openAPIV3Schema:
          type: string
          enum:
            - arista
            - cisco
            - juniper
