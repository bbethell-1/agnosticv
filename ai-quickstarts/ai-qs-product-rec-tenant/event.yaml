---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/zerotouch-access-disable-limits.yaml
purpose: event

tag: ai-qs-product-rec-tenant-event-1.0.0

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"

    # LiteLLM Virtual Keys Collection
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"

    # AI Quickstart Collection (make-based deployment)
    - name: https://github.com/rhpds/ai_quickstarts.git
      type: git
      version: "{{ tag }}"

    # Showroom
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.9

__meta__:
  zerotouchAccess:
    lifespan: 45m
  sandboxes:
    - kind: OcpSandbox
      cloud_selector:
        cloud: cnv-dedicated-shared
        lab: ai-qs-product-rec
        purpose: events
  deployer:
    scm_ref: ai-qs-product-rec-tenant-event-1.0.0
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
