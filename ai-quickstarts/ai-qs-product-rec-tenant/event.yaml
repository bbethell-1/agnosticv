---
#include /includes/ansible_control_plane/event_controllers_lb.yaml

purpose: event

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/agnosticd/namespaced_workloads.git
      type: git
      version: main

    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main

    # LiteLLM Virtual Keys Collection
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: main

    # AI Quickstart Collection (make-based deployment)
    - name: https://github.com/agnosticd/ai_quickstarts.git
      type: git
      version: main

    # Showroom
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.9

__meta__:
  sandboxes:
    - kind: OcpSandbox
      cloud_selector:
        cloud: cnv-dedicated-shared
        lab: ai-qs-product-rec
        purpose: events
  deployer:
    scm_ref: ai-qs-product-rec-tenant-event-1.0.0
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
