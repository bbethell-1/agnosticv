  owners:
    maintainer:
      - name: Jonathan Kershaw
        email: jkershaw@redhat.com
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    display_name: 'AI Inference on Intel Xeon 6'
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - openshift
      - intel
      - xeon-6
      - cpu-inference
      - inference-optimization
