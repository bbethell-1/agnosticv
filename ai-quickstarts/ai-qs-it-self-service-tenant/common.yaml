---
# -------------------------------------------------------------------
# --- Catalog Item: AI Quickstart IT Self Service Tenant
# --- Per-tenant provisioning for the IT Self Service AI Quickstart.
# --- Deploys onto a shared base cluster (ai-qs-it-self-service-cluster)
# --- via the OpenShift Sandbox API. Workloads installed via Make.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/litemaas-master_api.yaml
### Hardcoded litellm metadata for summit
requester_email: summit-{{guid}}@demo.redhat.com
catalog_item_name: ai-quickstarts.ai-qs-it-self-service-tenant.event

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: namespace
cloud_provider: none

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"

    # LiteLLM Virtual Keys Collection
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"

    # AI Quickstart Collection (make-based deployment)
    - name: https://github.com/rhpds/ai_quickstarts.git
      type: git
      version: "{{ tag }}"

    # Showroom
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.11

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.ai_quickstarts.quickstart_deploy_via_make
  - agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Common
# ===================================================================
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# ===================================================================
# Workload: ocp4_workload_tenant_keycloak_user
# ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ===================================================================
# Workload: ocp4_workload_tenant_namespace
# ===================================================================
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
  - suffix: it-selfsvc

# Total resource pool shared across all tenant namespaces via CRQ.
# Adjust to match your workload's expected resource consumption.
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "12"
  requests.cpu: "12"
  limits.memory: 16Gi
  requests.memory: 16Gi
  requests.storage: 12Gi

# LimitRange applied to every namespace.
# Sets container defaults for pods that don't specify resource requests/limits.
ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "500m"
    memory: 1Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------

quickstart_llm_model: llama-scout-17b

ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
  - "{{ quickstart_llm_model }}"

# ===================================================================
# Workload: quickstart_deploy_via_make
# ===================================================================

#  NAMESPACE: "{{ quickstart_deploy_via_make_repo_url | basename }}-{{ guid }}"
quickstart_deploy_via_make_repo_url: https://github.com/rh-ai-quickstart/it-self-service-agent
quickstart_deploy_via_make_scm_ref: v0.0.13
quickstart_deploy_via_make_params:
  NAMESPACE: "user-{{ guid }}-it-selfsvc"
  INSTALL_MODE: "demo"
  LLM: "{{ quickstart_llm_model }}"
  LLM_ID: "{{ quickstart_llm_model }}"
  LLM_URL: "{{ litellm_api_endpoint }}/v1"
  LLM_API_TOKEN: "{{ litellm_virtual_key }}"
  LG_PROMPT_LAPTOP_REFRESH: "/app/agent-service/config/lg-prompts/lg-prompt-small-scout.yaml"
  EXTRA_HELM_ARGS: "--set requestManagement.integrationDispatcher.uvicornWorkers=1 --set requestManagement.requestManager.uvicornWorkers=2 --set requestManagement.agentService.uvicornWorkers=2"
#  LOG_LEVEL: "DEBUG"

quickstart_deploy_via_make_uninstall_params:
  NAMESPACE: "user-{{ guid }}-it-selfsvc"

# -------------------------------------------------------------------
# Workload: ocp4_workload_ocp_console_embed + ocp4_workload_showroom
#
# openshift_cluster_ingress_domain is discovered by the tenant
# keycloak_user role via cluster discovery.
# -------------------------------------------------------------------
# These are required since the Showroom role doesn't natively know about
# them like the other namespace workloads
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-ai-quickstart-it-self-service-agent
ocp4_workload_showroom_content_git_repo_ref: main

# Adding terminals. Links are configured in ui-config.yaml in the showroom repo.
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 60
  persist_url_state: true
  view_switcher:
    enabled: false
    default_mode: split
  tabs:
  - name: Webmail
    url: "https://test-email-server-ui-user-{{ guid }}-it-selfsvc.{{ openshift_cluster_ingress_domain }}"
  - name: Terminal
    path: /terminal
    port: 443

ocp4_workload_showroom_passthrough_user_data: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-quickstart-ai
  asset_uuid: f2970043-8ff1-40ea-ad56-dea46ce152ab
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com
      - name: Marcus Trujillo
        email: matrujil@redhat.com
      - name: Nate Stephany
        email: nstephany@redhat.com

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  catalog:
    display_name: "AI Quickstart IT Self Service"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - openshift
      - quickstart
      - ai
      - it-self-service
    labels:
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
