--- # -------------------------------------------------------------------
# --- Catalog Item: AI Quickstart PPE Compliance Monitor Tenant
# --- Per-tenant provisioning for the PPE Compliance Monitor quickstart.
# --- Deploys onto a shared base cluster (ai-qs-ppe-comp-cluster) via the
# --- OpenShift Sandbox API.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/access-restriction-quickstarts-ai.yaml
#include /includes/secrets/litemaas-master_api.yaml
### Hardcoded litellm metadata for summit
requester_email: summit-{{guid}}@demo.redhat.com
catalog_item_name: ai-quickstarts.ai-qs-ppe-comp-tenant.event

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: namespace
cloud_provider: none

# clusters:
#   - default:
#       api_url: "{{ sandbox_openshift_api_url }}"
#       api_token: "{{ cluster_admin_agnosticd_sa_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"

    # LiteLLM Virtual Keys Collection
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"

    # Showroom
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.8

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Common
# ===================================================================
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# ===================================================================
# Workload: ocp4_workload_tenant_keycloak_user
# ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ===================================================================
# Workload: ocp4_workload_tenant_namespace
# ===================================================================
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
  - suffix: ppe

# Total resource pool shared across all tenant namespaces via CRQ.
# Adjust to match your workload's expected resource consumption.
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "40"
  requests.cpu: "40"
  limits.memory: 64Gi
  requests.memory: 64Gi
  requests.storage: 100Gi

# LimitRange applied to every namespace.
# Sets container defaults for pods that don't specify resource requests/limits.
ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "4"
    memory: 8Gi
  defaultRequest:
    cpu: 500m
    memory: 512Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------

ai_quickstart_ppe_llm_model: llama-scout-17b

ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
  - "{{ ai_quickstart_ppe_llm_model }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
#
# Deploys a per-tenant ArgoCD bootstrap Application pointing to the
# PPE Compliance Monitor Helm chart. ArgoCD manages the PPE pipeline
# components.
# -------------------------------------------------------------------
# For reference: The `deployer` variables are defined by the gitops_boostrap workload
# deployer:
#   domain: "{{ lookup('agnosticd_user_data', 'openshift_cluster_ingress_domain') }}"
#   apiUrl: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
#   guid: "{{ guid }}"
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_repo_path: "tenant/bootstrap"
ocp4_workload_gitops_bootstrap_application_project: tenants
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rh-ai-quickstart/ppe-compliance-monitor.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_helm_values:
  tenant:
    name: "{{ guid }}"
    user:
      name: "{{ ocp4_workload_tenant_keycloak_username }}"
      password: "{{ common_password }}"
  ppe:
    namespace: "user-{{ guid }}-ppe"
    git:
      revision: main
    values:
      openai:
        apiToken: "{{ litellm_virtual_key }}"
        apiEndpoint: "{{ litellm_api_endpoint }}"
        model: "{{ ai_quickstart_ppe_llm_model }}"
      modelServing:
        runtimeType: openvino

# -------------------------------------------------------------------
# Workload: ocp4_workload_ocp_console_embed + ocp4_workload_showroom
#
# openshift_cluster_ingress_domain is discovered by the tenant
# keycloak_user role via cluster discovery.
# -------------------------------------------------------------------
# These are required since the Showroom role doesn't natively know about
# them like the other namespace workloads
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
# Replace with your Showroom repo
ocp4_workload_showroom_content_git_repo: https://github.com/rh-ai-quickstart/showroom-ai-quickstart-multimodal-monitor
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  - name: OpenShift AI
    url: "https://data-science-gateway.{{ openshift_cluster_ingress_domain }}"
# ocp4_workload_showroom_passthrough_user_data: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: eec2fa7f-f985-4ad6-a6ca-1e44b5863858
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com
      - name: Nate Stephany
        email: nstephany@redhat.com

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  catalog:
    display_name: "AI Quickstarts: PPE Compliance Monitor"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - openshift
      - quickstart
      - ai
      - ppe
      - compliance
      - computer-vision
    labels:
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []
    # Provision does call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
