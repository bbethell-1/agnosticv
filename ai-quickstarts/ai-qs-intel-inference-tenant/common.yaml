---
#include /includes/ansible_control_plane/current_controller.yaml
# -------------------------------------------------------------------
# --- Catalog Item: AI Quickstart Intel Inference Tenant
# --- Per-tenant provisioning for the Intel-Red Hat AI Inference Platform.
# --- Deploys gateway, frontend, and PostgreSQL onto a shared base
# --- cluster (ai-qs-intel-inference-cluster) via Helm.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/access-restriction-quickstarts-ai.yaml
#include /includes/secrets/litemaas-master_api.yaml
#include /includes/secrets/ai-quickstart-hugging-face-token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: namespace
cloud_provider: none

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.8

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Common
# ===================================================================
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# ===================================================================
# Workload: ocp4_workload_tenant_keycloak_user
# ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ===================================================================
# Workload: ocp4_workload_tenant_namespace
# ===================================================================
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
  - suffix: intel-inference

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "20"
  requests.cpu: "20"
  limits.memory: 32Gi
  requests.memory: 32Gi
  requests.storage: 50Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 2Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi

# ===================================================================
# Workload: ocp4_workload_litellm_virtual_keys
# ===================================================================
intel_inference_llm_models:
  - granite-2b-cpu
  - qwen3-14b
  - deepseek-r1-distill-qwen-14b
  - llama-scout-17b
  - llama-31-70b-cpu
  - granite-3-2-8b-instruct
  - nomic-embed-text-v1-5
  - phi3-mini-cpu

ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models: "{{ intel_inference_llm_models }}"

# ===================================================================
# Workload: ocp4_workload_gitops_bootstrap
# ===================================================================
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_repo_path: "helm"
ocp4_workload_gitops_bootstrap_application_project: tenants
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/red-hat-intel-partnership-demo.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_helm_values:
  namespace: "user-{{ guid }}-intel-inference"
  gateway:
    image: quay.io/redhat-gpte/intel-inference-gateway:latest
    replicas: 2
    rateLimitRpm: 85
    corsOrigins: ""
    localFallback: false
  frontend:
    image: quay.io/redhat-gpte/intel-inference-frontend:latest
    replicas: 1
  postgres:
    enabled: true
    password: "{{ common_password }}"
  litellm:
    apiKey: "{{ litellm_virtual_key }}"
    apiBase: "{{ litellm_url }}"

# ===================================================================
# Workload: ocp4_workload_showroom
# ===================================================================
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/red-hat-intel-partnership-demo
ocp4_workload_showroom_content_git_ref: main
ocp4_workload_showroom_content_antora_module: ROOT
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  - name: OpenShift AI
    url: "https://rhods-dashboard-redhat-ods-applications.{{ openshift_cluster_ingress_domain }}"
  - name: Intel Inference Frontend
    url: "https://frontend-user-{{ guid }}-intel-inference.{{ openshift_cluster_ingress_domain }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-quickstart-ai
      - email-domain.intel.com
  asset_uuid: 242ab20a-23fa-5156-aca0-985ee906d425
  owners:
    maintainer:
      - name: Jonathan Kershaw
        email: jkershaw@redhat.com
  catalog:
    display_name: "AI Quickstart Intel Inference Platform"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - openshift
      - quickstart
      - ai
      - intel
      - gaudi
      - xeon
      - inference
      - maas
    labels:
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
