---
# -------------------------------------------------------------------
# Dev overrides — relaxed for integration testing
# -------------------------------------------------------------------

ocp4_workload_gitops_bootstrap_health_ignore: true

ocp4_workload_gitops_bootstrap_helm_values:
  namespace: "user-{{ guid }}-intel-inference"
  gateway:
    image: quay.io/rh-ee-jkershaw/inference-gateway:latest
    replicas: 1
    rateLimitRpm: 0
    corsOrigins: "*"
    localFallback: true
  frontend:
    image: quay.io/rh-ee-jkershaw/inference-frontend:latest
    replicas: 1
  postgres:
    enabled: true
    storage: 1Gi
    password: "{{ common_password }}"
  litellm:
    apiKey: "{{ litellm_virtual_key }}"
    apiBase: "{{ litellm_url }}"

__meta__:
  deployer:
    scm_ref: main

  sandboxes:
    - kind: OcpSandbox
      cloud_selector:
        purpose: dev
        cloud: cnv-dedicated-shared
        lab: ai-qs-intel-inference
