---
# Implementing Multi-Layer Container and Kubernetes Security with OpenShift for Automated DevSecOps

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# --- Platform
platform: RHPDS

# Cloud settings:

bastion_instance_image: RHEL75GOLD

# OpenShift Installer Version
ocp4_installer_version: "4.5.4"

# --- These come from the account
# subdomain_base_suffix:
# HostedZoneId:

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
#satellite_url: "{{ set_repositories_satellite_url }}"
#satellite_org: "{{ set_repositories_satellite_org }}"
#satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
#ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
# number of users created in the cluster
ocp4_workload_authentication_htpasswd_user_count: 3
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# Create 1 dso user
ocp4_dso_user_count: 1

# Leave Self Provisioner but set up Image Pruning,
# Public Registry and Build Defaults
ocp4_workload_opentlc_production_remove_self_provisioner: false
ocp4_workload_opentlc_production_expose_registry_route: true
ocp4_workload_opentlc_production_enable_image_pruning: true
ocp4_workload_opentlc_production_set_build_defaults: true
ocp4_workload_opentlc_production_build_memory_limit: "3Gi"
ocp4_workload_opentlc_production_build_memory_request: "2Gi"
ocp4_workload_opentlc_production_build_cpu_limit: "1"
ocp4_workload_opentlc_production_build_cpu_request: "1"

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_opentlc_production
- ocp4_workload_dso

student_workloads: []

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://github.com/RedHatDemos/SecurityDemos/tree/master/2020Labs/OpenShiftSecurity/documentation/bookbag

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite secrets and vars
  # - satellite-security-labs
  - satellite-security-labs-rhel7-repos
  - bookbag-deployer-na4
  - guidgrabber-api
  params_to_variables:
    user: ignore_user
    username: student_name
    infra_workloads: infra_workloads
