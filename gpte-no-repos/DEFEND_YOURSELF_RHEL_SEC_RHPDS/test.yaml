    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  catalog:
    namespace: gpte
    parameters: []
  deployer:
    git_tag_prefix: defend-yourself-rhel-rhpds-test
    virtualenv: ansible2.9-python3.6-2021-01-22
  scheduler:
    enable: true
    data:
      cloud_preference:
        datacenter: dal
        purpose: production
      cloud_selector:
        type: osp
  secrets:
    - namespace: gpte
      name: satellite-security-labs
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: guidgrabber-api
