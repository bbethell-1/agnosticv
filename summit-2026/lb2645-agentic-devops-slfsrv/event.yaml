    display_name: "LB2645 Agentic DevOps (Self-Service)"
  # Self-service pool: no tenant_cluster binding — seats match a shared
  # self-service cluster by cloud_selector annotations. no_namespace because
  # the tenant workloads create their own namespaces.
  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb2645-agentic-self-service
      purpose: events
