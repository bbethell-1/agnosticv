---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/litellm_metadata.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/rhods_git.yaml
#include /includes/sandbox-api.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/litemaas-master_api.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Unifying DevSecOps: Secure, Standardized Application Delivery Across Containers and VMs
# -------------------------------------------------------------------

# Tag for collection versions (override in prod.yaml with specific release tag)
tag: main
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: true
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"
num_users: 1
current_cluster_name: default

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

worker_instance_count: 2

ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=8, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.ads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.build-secured-dev-workflows.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.11
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "1.0.0"
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - rhpds.build_secured_dev_workflows.bootstrap
  - rhpds.ads.ocp4_workload_external_secrets
  - agnosticd.core_workloads.ocp4_workload_authentication
  - rhpds.ads.ocp4_workload_kubernetes_image_puller
  - rhpds.build_secured_dev_workflows.openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_s4
  - agnosticd.core_workloads.ocp4_workload_quay_operator
  - agnosticd.core_workloads.ocp4_workload_pipelines
  - agnosticd.core_workloads.ocp4_workload_rhacs
  - agnosticd.core_workloads.ocp4_workload_gitlab
  - rhpds.ads.ocp4_workload_gitops_vault
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - rhpds.ads.ocp4_workload_openshift_devspaces
  - rhpds.build_secured_dev_workflows.trusted_profile_analyzer
  - rhpds.build_secured_dev_workflows.trusted_artifact_signer
  - rhpds.build_secured_dev_workflows.developer_hub
  - rhpds.build_secured_dev_workflows.lab_scripts
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.showroom.ocp4_workload_showroom
  - rhpds.ftl.ocp4_workload_runtime_automation_k8s
  - rhpds.build_secured_dev_workflows.rhads_validation

remove_workloads:
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Workload: rhpds.ftl.ocp4_workload_runtime_automation_k8s
# -------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: true

# -------------------------------------------------------------------
# Workload: rhpds.build_secured_dev_workflows.lab_scripts
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_lab_scripts_tpa_namespace: tssc-tpa
rhpds_build_secured_dev_workflows_lab_scripts_tas_namespace: tssc-tas
rhpds_build_secured_dev_workflows_lab_scripts_keycloak_namespace: tssc-keycloak
rhpds_build_secured_dev_workflows_lab_scripts_tpa_keycloak_realm: tpa
rhpds_build_secured_dev_workflows_lab_scripts_pipelines_namespace: openshift-pipelines
rhpds_build_secured_dev_workflows_lab_scripts_app_ci_namespace: tssc-app-ci
rhpds_build_secured_dev_workflows_lab_scripts_devspaces_namespace: openshift-devspaces
rhpds_build_secured_dev_workflows_lab_scripts_gitlab_namespace: gitlab
rhpds_build_secured_dev_workflows_lab_scripts_tpa_admin_username: "tpa-admin"
rhpds_build_secured_dev_workflows_lab_scripts_tpa_admin_password: "{{ common_password }}"
rhpds_build_secured_dev_workflows_lab_scripts_tpa_cli_client_secret: "{{ common_password }}"
rhpds_build_secured_dev_workflows_lab_scripts_developer_username: user1
rhpds_build_secured_dev_workflows_lab_scripts_developer_email: user1@demo.redhat.com
rhpds_build_secured_dev_workflows_lab_scripts_developer_firstname: User1
rhpds_build_secured_dev_workflows_lab_scripts_developer_lastname: Demo
rhpds_build_secured_dev_workflows_lab_scripts_developer_password: "{{ common_password }}"
rhpds_build_secured_dev_workflows_lab_scripts_acs_namespace: stackrox
rhpds_build_secured_dev_workflows_lab_scripts_gitlab_root_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models:
  - nomic-embed-text-v1-5
  - granite-3-2-8b-instruct
ocp4_workload_litellm_virtual_keys_duration: "5d"
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: rhpds.ads.ocp4_workload_external_secrets
# -------------------------------------------------------------------
ocp4_workload_external_secrets_helm_cli_version: v3.18.4
ocp4_workload_external_secrets_namespace: external-secrets
ocp4_workload_external_secrets_helm_repo: https://charts.external-secrets.io
ocp4_workload_external_secrets_helm_chart: external-secrets/external-secrets
ocp4_workload_external_secrets_helm_chart_version: 0.9.2
ocp4_workload_external_secrets_vault_namespace: vault

# -------------------------------------------------------------------
# Workload: rhpds.ads.ocp4_workload_gitops_vault
# -------------------------------------------------------------------
ocp4_workload_gitops_vault_gitops_repo: https://github.com/rhpds/agnosticg.git

# -------------------------------------------------------------------
# Workload: rhpds.build_secured_dev_workflows.openshift_gitops
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_openshfit_gitops_helm_cli_version: v3.18.4
rhpds_build_secured_dev_workflows_openshfit_gitops_infra_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
rhpds_build_secured_dev_workflows_openshfit_gitops_infra_bootstrap_repo_revision: main
rhpds_build_secured_dev_workflows_openshfit_gitops_argocd_password: "{{ common_password }}"
rhpds_build_secured_dev_workflows_openshift_gitops_num_users: "{{ num_users }}"

# -------------------------------------------------------------------
# Workload: rhpds.build_secured_dev_workflows.developer_hub
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_developer_hub_quay_namespace: quay-enterprise
rhpds_build_secured_dev_workflows_developer_hub_gitlab_namespace: gitlab
rhpds_build_secured_dev_workflows_developer_hub_namespace: backstage
rhpds_build_secured_dev_workflows_developer_hub_argocd_namespace: tssc-gitops
rhpds_build_secured_dev_workflows_developer_hub_keycloak_namespace: tssc-keycloak
rhpds_build_secured_dev_workflows_developer_hub_devspaces_namespace: openshift-devspaces
rhpds_build_secured_dev_workflows_developer_hub_tpa_namespace: tssc-tpa

rhpds_build_secured_dev_workflows_developer_hub_keycloak_client_id: developer-hub
rhpds_build_secured_dev_workflows_developer_hub_keycloak_client_secret: "{{ common_password }}"
rhpds_build_secured_dev_workflows_developer_hub_authentication_realm: sso

rhpds_build_secured_dev_workflows_developer_hub_quay_registry: quay.io
rhpds_build_secured_dev_workflows_developer_hub_quay_image: rhdh/rhdh-hub-rhel9
rhpds_build_secured_dev_workflows_developer_hub_quay_image_tag: "1.8-164"

rhpds_build_secured_dev_workflows_developer_hub_catalog_locations:
  - repository: build-secured-dev-workflows-idp-configuration
    revision: main
    group: rhdh
    file:
      - all-locations.yaml

rhpds_build_secured_dev_workflows_developer_hub_templating_files:
  - repository: build-secured-dev-workflows-idp-configuration
    revision: main
    group: rhdh
    file:
      - component-rhpds.yaml
  - repository: build-secured-dev-workflows-idp-gitops
    revision: main
    group: gitops
    file:
      - charts/backstage/backstage-values.yaml

rhpds_build_secured_dev_workflows_developer_hub_helm_chart_repo: https://charts.openshift.io
rhpds_build_secured_dev_workflows_developer_hub_helm_chart: redhat-developer-hub
rhpds_build_secured_dev_workflows_developer_hub_helm_chart_version: 1.7.1

rhpds_build_secured_dev_workflows_developer_hub_gitlab_user_base_name: user
rhpds_build_secured_dev_workflows_developer_hub_gitlab_user_password: "{{ common_password }}"
rhpds_build_secured_dev_workflows_developer_hub_user_base_name: user
rhpds_build_secured_dev_workflows_developer_hub_num_users: "{{ num_users }}"
rhpds_build_secured_dev_workflows_developer_hub_user_password: "{{ common_password }}"

rhpds_build_secured_dev_workflows_developer_hub_rhacs_namespace: stackrox
rhpds_build_secured_dev_workflows_developer_hub_rhacs_admin_user: admin
rhpds_build_secured_dev_workflows_developer_hub_rhacs_admin_password: "{{ common_password }}"

rhpds_build_secured_dev_workflows_developer_hub_argocd_user: admin
rhpds_build_secured_dev_workflows_developer_hub_argocd_password: "{{ common_password }}"

rhpds_build_secured_dev_workflows_developer_hub_gitlab_root_user: root
rhpds_build_secured_dev_workflows_developer_hub_gitlab_root_password: "{{ common_password }}"

rhpds_build_secured_dev_workflows_developer_hub_quay_admin_user: quayadmin
rhpds_build_secured_dev_workflows_developer_hub_quay_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.9"
ocp4_workload_rhacs_install_operator_starting_csv: ""
ocp4_workload_rhacs_automatic_install_plan_approval: true
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_enable_route_certs: true

# -------------------------------------------------------------------
# rhpds.build_secured_dev_workflows.trusted_profile_analyzer
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_namespace: tssc-tpa
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_channel: stable-v1.1
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_automatic_install_plan_approval: true
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_starting_csv: ""
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_use_catalog_source: false
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_namespace: keycloak
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_realm: tpa
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_admin_username: "tpa-admin"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_admin_password: "{{ common_password }}"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_cli_client_id: "cli"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_keycloak_cli_client_secret: "{{ common_password }}"
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_username_base: user
rhpds_build_secured_dev_workflows_trusted_profile_analyzer_num_users: "{{ num_users }}"

# -------------------------------------------------------------------
# rhpds.build_secured_dev_workflows.trusted_artifact_signer
# -------------------------------------------------------------------
rhpds_build_secured_dev_workflows_trusted_artifact_signer_namespace: tssc-tas
rhpds_build_secured_dev_workflows_trusted_artifact_signer_channel: stable-v1.3
rhpds_build_secured_dev_workflows_trusted_artifact_signer_automatic_install_plan_approval: true
rhpds_build_secured_dev_workflows_trusted_artifact_signer_starting_csv: ""
rhpds_build_secured_dev_workflows_trusted_artifact_signer_use_catalog_source: false
rhpds_build_secured_dev_workflows_trusted_artifact_signer_chains_realm: tas-chains
rhpds_build_secured_dev_workflows_trusted_artifact_signer_sso_realm: sso
rhpds_build_secured_dev_workflows_trusted_artifact_signer_client_id: trusted-artifact-signer
rhpds_build_secured_dev_workflows_trusted_artifact_signer_username_base: user
rhpds_build_secured_dev_workflows_trusted_artifact_signer_num_users: "{{ num_users }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_namespace: tssc-keycloak
ocp4_workload_authentication_keycloak_default_realm: sso
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_use_catalog_source: false

ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: true

ocp4_workload_authentication_enable_user_info_data: true
ocp4_workload_authentication_num_users: "{{ num_users }}"
ocp4_workload_authentication_user_name: user1
ocp4_workload_authentication_user_password: "{{ common_password }}"
ocp4_workload_authentication_keycloak_openshift_client_secret: "{{ common_password }}"

# ------------------------------------------------
# ocp4_workload_openshift_devspaces
# ------------------------------------------------
ocp4_workload_openshift_devspaces_catalogsource_setup: false
ocp4_workload_openshift_devspaces_channel: stable
ocp4_workload_openshift_devspaces_automatic_install_plan_approval: true
ocp4_workload_openshift_devspaces_startingcsv: ""
ocp4_workload_openshift_devspaces_namespace: openshift-devspaces

# -------------------------------------------------------------------
# ocp4_workload_kubernetes_image_puller
# -------------------------------------------------------------------
ocp4_workload_kubernetes_image_puller_node_selector: '{"node-role.kubernetes.io/worker": ""}'
ocp4_workload_kubernetes_image_puller_images:
  - quay.io/redhat-gpte/jenkins-inbound-agent:jdk21
  - maven:3.8.5-openjdk-17
  - docker.io/sonarsource/sonar-scanner-cli:10.0
  - quay.io/redhat-appstudio/syft:v0.94.0
  - registry.access.redhat.com/ubi9/python-311:9.5
  - quay.io/redhat-user-workloads/rhtap-integration-tenant/yq-container/yq:5f8db9e69e824d7859b61f97596c4f3f839d6c9e
  - quay.io/redhat-appstudio/buildah:v1.31.0@sha256:34f12c7b72ec2c28f1ded0c494b428df4791c909f1f174dd21b8ed6a57cf5ddb
  - registry.access.redhat.com/ubi8/ubi-minimal
  - quay.io/redhat-appstudio/appstudio-utils:5bd7d6cb0b17f9f2eab043a8ad16ba3d90551bc2@sha256:8c7fcf86af40c71aeb58e4279625c8308af5144e2f6b8e28b0ec7e795260e5f7
  - alpine/helm:3.11.1
  - registry.redhat.io/rhtas/gitsign-rhel9:1.1.0
  - registry.redhat.io/rhtas/cosign-rhel9:1.1.0
  - quay.io/devfile/universal-developer-image:ubi9-3764be6
ocp4_workload_kubernetes_image_puller_instance_namespace: default

# -----------------------------------
# S4 installation
# -----------------------------------
ocp4_workload_s4_namespace: s4
ocp4_workload_s4_buckets:
  - quay-registry
ocp4_workload_s4_access_key_id: s4admin
ocp4_workload_s4_secret_access_key: "{{ common_password }}"
ocp4_workload_s4_auth_enabled: true
ocp4_workload_s4_auth_username: s4admin
ocp4_workload_s4_auth_password: "{{ common_password }}"
ocp4_workload_s4_route_enabled: true
ocp4_workload_s4_s3_api_enabled: true
ocp4_workload_s4_storage_data_size: 20Gi
ocp4_workload_s4_wait_for_deployment: true

# ---------------------------------------------------------
# Workload: ocp4_workload_quay_operator
# ---------------------------------------------------------
ocp4_workload_quay_operator_namespace: quay-registry
ocp4_workload_quay_operator_catalogsource_namespace: quay-registry
ocp4_workload_quay_operator_channel: stable-3.17
ocp4_workload_quay_operator_starting_csv: ""
ocp4_workload_quay_operator_automatic_install_plan_approval: true
ocp4_workload_quay_operator_use_catalog_snapshot: false
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"
ocp4_workload_quay_operator_registry_quay_overrides: true
ocp4_workload_quay_operator_registry_quay_overrides_env: true
ocp4_workload_quay_operator_registry_quay_overrides_resources: true

#s4 configuration
ocp4_workload_quay_operator_s4_storage_enabled: true
ocp4_workload_quay_operator_s4_namespace: s4
ocp4_workload_quay_operator_s4_bucket_name: quay-registry
ocp4_workload_quay_operator_s4_access_key: s4admin
ocp4_workload_quay_operator_s4_secret_key: "{{ common_password }}"

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.16
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_automatic_install_plan_approval: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitlab_namespace: gitlab
ocp4_workload_gitlab_auth_mode: native
ocp4_workload_gitlab_root_password: "{{ common_password }}"

# Native integration
ocp4_workload_gitlab_user_base: user
ocp4_workload_gitlab_user_count: "{{ num_users | default(0) }}"
ocp4_workload_gitlab_user_password: "{{ common_password }}"

# Root repositories - groups owned by root user
ocp4_workload_gitlab_root_repositories:
  - group: rhdh
    path: rhdh
    visibility: public
    repositories:
      - name: build-secured-dev-workflows-idp-configuration
        url: https://github.com/rhpds/build-secured-dev-workflows-idp-configuration.git
        visibility: public
      - name: build-secured-dev-workflows-sample-pipelines
        url: https://github.com/rhpds/build-secured-dev-workflows-sample-pipelines.git
        visibility: public
  - group: gitops
    path: gitops
    visibility: public
    repositories:
      - name: build-secured-dev-workflows-idp-gitops
        url: https://github.com/rhpds/build-secured-dev-workflows-idp-gitops.git
        visibility: public

# User repositories - groups owned by users
ocp4_workload_gitlab_user_repositories:
  - group: development
    path: development
    visibility: public
    access_level: maintainer
    repositories: []

# User repositories - groups that users can access
# Users will be added to all groups matching ocp4_workload_gitlab_user_default_access_levels
ocp4_workload_gitlab_user_default_access_levels:
  - maintainer

# Storage configuration
ocp4_workload_gitlab_volume_size: 50Gi
ocp4_workload_gitlab_postgresql_volume_size: 20Gi

ocp4_workload_gitlab_runner_enabled: true

