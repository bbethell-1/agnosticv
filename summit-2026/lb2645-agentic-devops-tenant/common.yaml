# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
#
# Deploys a per-tenant ArgoCD bootstrap Application pointing to the
# RAG Helm chart. ArgoCD manages the RAG pipeline components.
# -------------------------------------------------------------------
# For reference: The `deployer` variables are defined by the gitops_boostrap workload
# deployer:
#   domain: "{{ lookup('agnosticd_user_data', 'openshift_cluster_ingress_domain') }}"
#   apiUrl: "{{ lookup('agnosticd_user_data', 'openshift_api_url') }}"
#   guid: "{{ guid }}"
# ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"
# ocp4_workload_gitops_bootstrap_repo_path: "tenant/bootstrap"
# ocp4_workload_gitops_bootstrap_application_project: tenants
# ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rh-ai-quickstart/RAG.git
# ocp4_workload_gitops_bootstrap_repo_revision: main

# ocp4_workload_gitops_bootstrap_helm_values:
#   tenant:
#     name: "{{ guid }}"
#     user:
#       name: "{{ ocp4_workload_tenant_keycloak_username }}"
#       password: "{{ common_password }}"
#   rag:
#     namespace: "user-{{ guid }}-rag"
#     git:
#       revision: dev
#     values:
#       llm-service:
#         enabled: false
#         secret:
#           hf_token: "{{ ai_quickstart_hugging_face_token }}"
#       llama-stack:
#         secrets:
#           TAVILY_SEARCH_API_KEY: "{{ ai_quickstart_tavily_search_key }}"
#       global:
#         models:
#           remotellm:
#             id: "{{ ai_quickstart_rag_llm_model }}"
#             url: "{{ litellm_api_endpoint }}"
#             apiToken: "{{ litellm_virtual_key }}"
#             enabled: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ocp_console_embed + ocp4_workload_showroom
#
# openshift_cluster_ingress_domain is discovered by the tenant
# keycloak_user role via cluster discovery.
# -------------------------------------------------------------------
# These are required since the Showroom role doesn't natively know about
# them like the other namespace workloads
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/agentic-aiops-showroom
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: Terminal
    path: /terminal
    port: 443
    secondary_name: Terminal 2
    secondary_path: /terminal/
    secondary_port: 443
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  - name: AAP
    url: "https://aap-aap.{{ openshift_cluster_ingress_domain }}"
  - name: Gitea
    url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
  - name: OpenShift AI
    url: "https://data-science-gateway.{{ openshift_cluster_ingress_domain }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 48935911-f75d-4072-a7a5-3f5fa5b0a008
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com
  sandboxes:
    - kind: OcpSandbox
      cloud_selector:
        purpose: dev # purpose is set per stage (dev.yaml, prod.yaml)
        cloud: cnv-dedicated-shared
        lab: lb2645-agentic

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  catalog:
    display_name: "LB2645 Agentic DevOps"
    category: Brand_Events
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - summit-2026
      - lb2645
      - agentic-devops
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-01
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
