---
# -------------------------------------------------------------------
# --- Catalog Item: LB2645 Agentic DevOps Tenant
# --- Per-tenant provisioning for the Summit LB2645 Agentic DevOps lab.
# --- Deploys onto a shared base cluster (lb2645-agentic-devops-cluster)
# --- via the OpenShift Sandbox API.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/litemaas-master_api.yaml
#include /includes/parameters/litellm_metadata.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: namespace
cloud_provider: none

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
    - name: https://github.com/agnosticd/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: aap2-scalars-to-vars

    # LiteLLM Virtual Keys Collection
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"

    # Showroom
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.0

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea_user
  - agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
  # - agnosticd.core_workloads.ocp4_workload_gitea_operator
  # - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Common
# ===================================================================
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# ===================================================================
# Workload: ocp4_workload_tenant_keycloak_user
# ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ===================================================================
# Workload: ocp4_workload_tenant_namespace
# ===================================================================
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
  - suffix: agentic

# Total resource pool shared across all tenant namespaces via CRQ.
# Adjust to match your workload's expected resource consumption.
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "40"
  requests.cpu: "40"
  limits.memory: 64Gi
  requests.memory: 64Gi
  requests.storage: 100Gi

# LimitRange applied to every namespace.
# Sets container defaults for pods that don't specify resource requests/limits.
ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------

agentic_llm_model: llama-scout-17b

ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
  - "{{ agentic_llm_model }}"
  - "minimax-m2"
  - "qwen3-235b"
  - "gpt-oss-120b"
  - "gpt-oss-20b"
  - "gemini-2.5-pro"


# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_gitea_user
# -------------------------------------------------------------------

# ocp4_workload_tenant_gitea_user_openshift_api_url: "{{ sandbox_api_url }}"
# ocp4_workload_tenant_gitea_user_openshift_api_token: "{{ sandbox_api_token }}"
#
ocp4_workload_tenant_gitea_user_namespace: gitea
ocp4_workload_tenant_gitea_user_name: gitea
ocp4_workload_tenant_gitea_user_username: "user-{{ guid }}"
ocp4_workload_tenant_gitea_user_password: "{{ common_password }}"

ocp4_workload_tenant_gitea_user_repositories:
  - repo: https://github.com/agnosticd/namespaced_workloads.git
    name: namespaced-dev
    private: false
  - repo: https://github.com/agnosticd/namespaced_workloads.git
    name: namespaced-private
    private: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_disable_controller: false
ocp4_workload_ansible_automation_platform_disable_eda: true
ocp4_workload_ansible_automation_platform_disable_hub: true
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.6
ocp4_workload_ansible_automation_platform_catalog_snapshot_image_tag: "v4.20_2025_12_29"
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader
ocp4_workload_ansible_automation_platform_hub_file_storage_file_class: ocs-external-storagecluster-cephfs
ocp4_workload_ansible_automation_platform_hub_file_storage_access_mode: ReadWriteMany

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
# ocp4_workload_gitea_operator_project: gitea
