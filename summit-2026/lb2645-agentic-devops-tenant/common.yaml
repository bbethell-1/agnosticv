---
# -------------------------------------------------------------------
# --- Catalog Item: LB2645 Agentic DevOps Tenant
# --- Per-tenant provisioning for the Summit LB2645 Agentic DevOps lab.
# --- Deploys onto the shared lb2645-agentic-devops-cluster
# --- via the OpenShift Sandbox API.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/litemaas-master_api.yaml
### Hardcoded litellm metadata for summit
requester_email: summit-{{guid}}@demo.redhat.com
catalog_item_name: summit-2026.lb2645-agentic-devops-tenant.event

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: namespace
cloud_provider: none

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    # deepagents-aiops — RHEL VM workloads
    - name: https://github.com/rhpds/deepagents-aiops.git
      type: git
      version: "{{ tag }}"

    # LiteLLM Virtual Keys Collection
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"

    # Showroom
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.11

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea_user
  - rhpds.deepagents_aiops.ocp4_workload_rhel_vm_tenant
  - rhpds.deepagents_aiops.ocp4_workload_aap2_tenant_config
  - rhpds.deepagents_aiops.ocp4_workload_kira_tenant
  - rhpds.deepagents_aiops.ocp4_workload_langfuse_tenant
  - rhpds.deepagents_aiops.ocp4_workload_rocketchat_tenant
  - rhpds.deepagents_aiops.ocp4_workload_mlflow_tenant
  - rhpds.deepagents_aiops.ocp4_workload_athena_tenant
  - agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Common
# ===================================================================
ocp4_workload_username: "user-{{ guid }}"

common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# ===================================================================
# Workload: ocp4_workload_tenant_keycloak_user
# ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ===================================================================
# Workload: ocp4_workload_tenant_namespace
# ===================================================================
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
  - suffix: agentic
  - suffix: rhel

# Total resource pool shared across all tenant namespaces via CRQ.
# Adjust to match your workload's expected resource consumption.
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "40"
  requests.cpu: "40"
  limits.memory: 80Gi
  requests.memory: 80Gi
  requests.storage: 100Gi

# LimitRange applied to every namespace.
# Sets container defaults for pods that don't specify resource requests/limits.
ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 25m
    memory: 256Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
  - "qwen3-235b"
  - "minimax-m2"
  - "gpt-oss-120b"
  - "gpt-oss-20b"
  - llama-scout-17b
  - "gemini-2.5-pro"
  - "claude-3-5-haiku"
  - "claude-opus-4-6"
  - "claude-sonnet-4-6"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_gitea_user
# -------------------------------------------------------------------
ocp4_workload_tenant_gitea_user_namespace: gitea
ocp4_workload_tenant_gitea_user_name: gitea
ocp4_workload_tenant_gitea_user_username: "user-{{ guid }}"
ocp4_workload_tenant_gitea_user_password: "{{ common_password }}"

ocp4_workload_tenant_gitea_user_repositories:
  - name: agentic-devops-plays
    repo: https://github.com/rhpds/agentic-aiops-plays.git
    private: false
  - name: agentic-devops-athena
    repo: https://github.com/rhpds/athena-aiops-deep-agent.git
    private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhel_vm_tenant
# -------------------------------------------------------------------
ocp4_workload_rhel_vm_tenant_vm_name: rhel
ocp4_workload_rhel_vm_tenant_vm_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-rhel"
ocp4_workload_rhel_vm_tenant_vm_datasource_name: rhel-base
ocp4_workload_rhel_vm_tenant_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_rhel_vm_tenant_vm_user: rhel
ocp4_workload_rhel_vm_tenant_vm_password: "{{ common_password }}"
ocp4_workload_rhel_vm_tenant_vm_disksize: 10Gi
ocp4_workload_rhel_vm_tenant_vm_instancetype: u1.small
ocp4_workload_rhel_vm_tenant_vm_runcmd:
  - "dnf config-manager --set-disabled rhel-10-for-x86_64-appstream-rpms"

# -------------------------------------------------------------------
# Workload: ocp4_workload_kira_tenant
# -------------------------------------------------------------------
ocp4_workload_kira_tenant_user_username: "user-{{ guid }}"
# Uncomment to pin versions and override role defaults:
# ocp4_workload_kira_tenant_helm_repo: https://github.com/tonykay/kira.git
# ocp4_workload_kira_tenant_helm_repo_ref: main
# ocp4_workload_kira_tenant_api_image: quay.io/rhpds/kira-api
# ocp4_workload_kira_tenant_api_tag: "0.7.0"
# ocp4_workload_kira_tenant_frontend_image: quay.io/rhpds/kira-frontend
# ocp4_workload_kira_tenant_frontend_tag: "0.7.0"
# ocp4_workload_kira_tenant_ttyd_image: quay.io/rhpds/kira-ttyd
# ocp4_workload_kira_tenant_ttyd_tag: "0.7.0"
# ocp4_workload_kira_tenant_postgres_tag: "16"
# ocp4_workload_kira_tenant_llm_model: "llama-scout-17b"

# -------------------------------------------------------------------
# Workload: ocp4_workload_aap2_tenant_config
# -------------------------------------------------------------------
ocp4_workload_aap2_tenant_config_username: "user-{{ guid }}"
ocp4_workload_aap2_tenant_config_user_password: "{{ common_password }}"
ocp4_workload_aap2_tenant_config_vm_password: "{{ common_password }}"
ocp4_workload_rocketchat_tenant_user_username: "user-{{ guid }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_langfuse_tenant
# -------------------------------------------------------------------
ocp4_workload_langfuse_tenant_helm_chart_version: "1.5.28"
ocp4_workload_langfuse_tenant_admin_email: "admin@example.com"
ocp4_workload_langfuse_tenant_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_mlflow_tenant
# -------------------------------------------------------------------
# Uses role defaults for tracking_uri, experiment_name, username, password.
# Admin credentials read from mlflow-admin-credentials Secret (cluster role).

# -------------------------------------------------------------------
# Workload: ocp4_workload_athena_tenant
# -------------------------------------------------------------------
# Credentials are discovered dynamically:
#   AAP2 admin: from aap-admin-credentials secret
#   Kira/RC URLs: from Route lookups in tenant namespace
#   MaaS: from litellm_api_endpoint / litellm_virtual_key
# LangFuse tracing — wired to the per-tenant LangFuse instance
ocp4_workload_athena_tenant_langfuse_secret_key: "sk-lf-{{ common_password }}"
ocp4_workload_athena_tenant_langfuse_public_key: "pk-lf-{{ common_password }}"
ocp4_workload_athena_tenant_langfuse_host: "http://langfuse-web.{{ ocp4_workload_username }}-agentic.svc.cluster.local:3000"
# MLflow tracing — wired to per-tenant MLflow experiment
ocp4_workload_athena_tenant_mlflow_tracking_uri: "http://mlflow.mlflow.svc.cluster.local"
ocp4_workload_athena_tenant_mlflow_experiment_name: "{{ ocp4_workload_username }}-agentic"
ocp4_workload_athena_tenant_mlflow_username: "user-{{ guid }}"
ocp4_workload_athena_tenant_mlflow_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
#
# openshift_cluster_ingress_domain is discovered by the tenant
# keycloak_user role via cluster discovery.
# kira tty experimental
# -------------------------------------------------------------------
# These are required since the Showroom role doesn't natively know about
# them like the other namespace workloads.
# The sandbox provides openshift_cluster_admin_token; namespaced_workloads
# roles expect cluster_admin_agnosticd_sa_token.
openshift_api_url: "{{ sandbox_openshift_api_url }}"
cluster_admin_agnosticd_sa_token: "{{ openshift_cluster_admin_token }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/agentic-aiops-showroom
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/agentic-ai-showroom-terminal:latest
ocp4_workload_showroom_content_antora_navbar_logo: summit
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: AAP2
    url: "https://aap-aap.{{ openshift_cluster_ingress_domain }}"
  - name: Kira
    url: "https://kira-frontend-{{ ocp4_workload_tenant_keycloak_username }}-agentic.{{ openshift_cluster_ingress_domain }}"
  - name: Terminal
    path: /terminal
    port: 443
  - name: RocketChat
    url: "https://rocketchat-{{ ocp4_workload_tenant_keycloak_username }}-agentic.{{ openshift_cluster_ingress_domain }}"
  - name: Gitea
    url: "https://gitea.{{ openshift_cluster_ingress_domain }}/user-{{ guid }}/agentic-devops-athena"
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  - name: OpenShift AI
    url: "https://data-science-gateway.{{ openshift_cluster_ingress_domain }}"
  - name: MLflow
    url: "https://mlflow-mlflow.{{ openshift_cluster_ingress_domain }}"
  - name: LangFuse
    url: "https://langfuse-{{ ocp4_workload_tenant_keycloak_username }}-agentic.{{ openshift_cluster_ingress_domain }}"

  #  - name: Terminal
  #   url: "https://kira-ttyd-{{ ocp4_workload_tenant_keycloak_username }}-agentic.{{ openshift_cluster_ingress_domain }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 48935911-f75d-4072-a7a5-3f5fa5b0a008
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com
  sandboxes:
    - kind: OcpSandbox
      no_namespace: true
      tenant_cluster:
        item: summit-2026/lb2645-agentic-devops-cluster

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  catalog:
    display_name: "LB2645 Agentic DevOps"
    category: Brand_Events
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - summit-2026
      - lb2645
      - agentic-devops
      - agentic
      - ai
      - deep-agents
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none
    # Per-user seats on the shared cluster are ordered through the Workshop UI,
    # which redirects each seat straight to its Showroom lab guide.
    multiuser: true
    workshopLabUiRedirect: true

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
