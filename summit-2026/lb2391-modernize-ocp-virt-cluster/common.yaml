---

# -------------------------------------------------------------------
# --- LB2391: Accelerating Infrastructure Modernization with OpenShift Virtualization (Cluster)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-virtualization.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# Required by host_ocp4_assisted_scale
#include /includes/secrets/ocp4_ai_offline_token.yaml

# Required by OLS
#include /includes/secrets/ocp4_workload_ols_api_token.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_assisted_installer: v0.0.9
tag_showroom: v1.6.9
gitops_repo_revision: v1.0.0

# -------------------------------------------------------------------
# Additional Collections & roles to be installed
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Required by host_ocp4_assisted_scale
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: "{{ tag_assisted_installer }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 12
ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_servicemesh3
- agnosticd.core_workloads.ocp4_workload_kiali
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_04_13

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_keycloak_default_realm: sso

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: true
ocp4_workload_openshift_virtualization_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_servicemesh3
# -------------------------------------------------------------------
ocp4_workload_servicemesh3_channel: stable
ocp4_workload_servicemesh3_use_catalog_snapshot: true
ocp4_workload_servicemesh3_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_servicemesh3_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_servicemesh3_istio_version: v1.27-latest

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_kiali
# -------------------------------------------------------------------
ocp4_workload_kiali_channel: stable
ocp4_workload_kiali_use_catalog_snapshot: true
ocp4_workload_kiali_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kiali_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# agnosticd.ai_workloads.ocp4_workload_ols
# -------------------------------------------------------------------
ocp4_workload_ols_get_token: true
ocp4_workload_ai_platform: azure
ocp4_workload_ols_llm_providers_models_name: gpt-5
ocp4_workload_ols_llm_deploymentname: gpt-5.1
ocp4_workload_ols_defaultmodel: gpt-5
ocp4_workload_ols_use_max_completion_tokens: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/modernize-ocp-virt-automation
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-infra
ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: 0
  devhub:
    channel: fast-1.8
    oauth:
      clientId: backstage
      clientSecret: client-secret-backstage-demo
    backendSecret: backend-secret-key-key-demo
  gitlab:
    image: quay.io/redhat-gpte/gitlab:17.4.1
    postgresqlImage: quay.io/redhat-gpte/gitlab-postgresql:14
    redisImage: redis:6.2.6
    rootPassword: "{{ common_admin_password }}"
    repos:
    - name: modernize-ocp-virt
      sourceUrl: https://github.com/rhpds/modernize-ocp-virt-workspace.git
      revision: v1.0.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: bce66817-8eb2-40b9-84c7-66a7b85dc966
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: Alan Cowles
      email: acowles@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2391: Accelerating Infrastructure Modernization with OpenShift Virtualization (Cluster)"
    category: Brand_Events
    keywords:
    - virtualization
    - service mesh
    - gitops
    - summit-2026
    - lb2391
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
      Platform: OpenShift
      TDP1: Virtualization
    reportingLabels:
      primaryBU: Hybrid_Platforms
    # This item only provisions shared infrastructure.
    # It would not be appropriate to order a workshop of this item.
    workshopUiDisabled: false

  # -----------------------------------------------------------------
  # Components / Cluster Pool
  # -----------------------------------------------------------------

  sandbox_host:
    annotations:
      cloud: cnv-dedicated-shared
      lab: lb2391-modernize-ocp-virt
    max_cpu_usage_percentage: 90
    max_memory_usage_percentage: 85
    max_placements: 12
    quota_required: false
    deployer_admin_sa_token_ttl: "1h"
    deployer_admin_sa_token_refresh_interval: "30m"
    deployer_admin_sa_token_target_var: cluster_admin_agnosticd_sa_token
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.21"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    # Required by host_ocp4_assisted_scale
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
