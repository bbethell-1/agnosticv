---
# -------------------------------------------------------------------
# --- Catalog Item: AI/ML Lifecycle at the Edge
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-rhde.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

# NOTE: Cluster-level secrets (satellite, DNS, TLS, assisted installer)
# are now handled by the ocp-cluster-cnv-pools component.
# Only include secrets needed directly by workloads in this CI.

# -------------------------------------------------------------------
# Mandatory variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

num_users: 0

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.8
  # AI/ML Lifecycle at the Edge automation (MicroShift workload)
  - name: https://github.com/rhpds/ai-lifecycle-edge-automation.git
    type: git
    version: "{{ tag }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- ai_ml_edge.workshop.ocp4_workload_microshift
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# ===================================================================
ocp4_workload_authentication_idm_type: keycloak

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_openshift_gitops
# ===================================================================
ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: false
ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# ===================================================================
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ai-lifecycle-edge-automation
ocp4_workload_gitops_bootstrap_repo_revision: "{{ tag }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  minioStorageSno:
    enabled: true
  vmConnectivity:
    enabled: true

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_openshift_virtualization
# ===================================================================
ocp4_workload_openshift_virtualization_channel: stable

# ===================================================================
# Workload: ai_ml_edge.workshop.ocp4_workload_microshift
# ===================================================================
# this should be set in openshift-workloads/post_infra.yml
ocp4_workload_microshift_bastion_user: "{{ bastion_ansible_user }}"
ocp4_workload_microshift_vm_namespace: microshift-001
ocp4_workload_microshift_vm_image: https://s3.us-east-1.amazonaws.com/rhdp-images/rhel96-microshift419.qcow2
ocp4_workload_microshift_disk_name: rhel96-microshift-mshiftdisk
ocp4_workload_microshift_s3_region: us-east-1

ocp4_workload_microshift_s3_access_key: !vault |
