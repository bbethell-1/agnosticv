---
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: 0
  workspace: ""
  allNodeNames: "{{ ocp4_workload_gitops_add_cluster_all_node_names | default('') }}"
  htpasswdAuth:
    enabled: true
    adminPassword: "{{ common_admin_password | default('') }}"

ocp4_workload_authentication_admin_password: "{{ common_admin_password | default('') }}"

requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "v1.6.8"

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "main"

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/demo_workloads.git
    type: git
    version: "main"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- rhpds.demo_workloads.ocp4_workload_gitops_add_cluster
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# - agnosticd.showroom.ocp4_workload_showroom


# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/infoscale-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.1.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 50
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OCP Console
      url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: multisno
