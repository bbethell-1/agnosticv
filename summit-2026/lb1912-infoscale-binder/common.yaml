---
# -------------------------------------------------------------------
# --- Catalog Item: "LB1912: Multi-Site Disaster Recovery for Healthcare
#                    Systems with InfoScale & OpenShift Virtualization"
# -------------------------------------------------------------------
#
#  This is the Binder Component.  The base is called twice, primary and secondary
#
# -------------------------------------------------------------------
# Description:  This multi-asset lab uses two SNO OpenShift Virtualization
# with added disk to demonstrate DR with Infoscale (nee Veritas)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- primary:
    api_url: "{{ primary_openshift_api_url }}"
    api_token: "{{ primary_openshift_api_key }}"
- secondary:
    api_url: "{{ secondary_openshift_api_url }}"
    api_token: "{{ secondary_openshift_api_key }}"

tag: main
num_users: "0"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
cluster_workloads:
- name: agnosticd.core_workloads.ocp4_workload_gitops_bootsrap
  clusters:
  - primary
  - secondary

ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/infoscale-automation.git
ocp4_workload_gitops_bootstrap_repo_revision: "main"
ocp4_workload_gitops_bootstrap_repo_path: "infra/bootstrap"
ocp4_workload_gitops_bootstrap_application_name: "infra-bootstrap"

ocp4_workload_gitops_bootstrap_helm_values:
  clusters: "{{ clusters }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: d2b0ecc1-dab0-451e-939e-51faeb72b152
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    # Disable actions on chained config that are handled by base.
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1912: Multi-Site Disaster Recovery for Healthcare Systems with InfoScale & OpenShift Virtualization - BINDER"
    category: Brand_Events
    keywords:
    - lb1912
    - summit-2026
    - openstack
    - infoscale
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Brand_Event: Red_Hat_Summit_2026
    workshopLabUiRedirect: true
    workshopUiDisabled: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
    num_users_parameter: num_users_param
    parameters: []

  components:
  - name: primary_openshift
    display_name: Primary OpenShift Cluster
    item: summit-2026/lb1912-infoscale-base
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: primary_openshift_api_ca_cert
    - name: openshift_api_url
      var: primary_openshift_api_url
    - name: openshift_cluster_admin_token
      var: primary_openshift_api_key
    - name: openshift_cluster_admin_token
      var: primary_openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: primary_bastion_ansible_host
    - name: bastion_ssh_user_name
      var: primary_bastion_ansible_user
    - name: bastion_ssh_password
      var: primary_bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: primary_bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: primary_sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: primary_sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: primary_sandbox_openshift_namespace

  - name: secondary_openshift
    display_name: secondary OpenShift Cluster
    item: summit-2026/lb1912-infoscale-base
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: secondary_openshift_api_ca_cert
    - name: openshift_api_url
      var: secondary_openshift_api_url
    - name: openshift_cluster_admin_token
      var: secondary_openshift_api_key
    - name: openshift_cluster_admin_token
      var: secondary_openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: secondary_bastion_ansible_host
    - name: bastion_ssh_user_name
      var: secondary_bastion_ansible_user
    - name: bastion_ssh_password
      var: secondary_bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: secondary_bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: secondary_sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: secondary_sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: secondary_sandbox_openshift_namespace
