---

# -------------------------------------------------------------------
# --- LB2391: Accelerating Infrastructure Modernization with OpenShift Virtualization
# -------------------------------------------------------------------
# --- This catalog item combines:
# ---   - Sandbox/namespace architecture (no cluster provisioning)
# ---   - Multi-user support with per-user namespaces
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-virtualization.yaml

#include /includes/sandbox-api.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# ===================================================================
# Top Variables
# ===================================================================
cloud_provider: none
config: namespace
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_showroom: v1.6.7
gitops_repo_revision: v1.0.0
showroom_repo_revision: v2.0.0

# ===================================================================
# Additional Collections & roles to be installed
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "{{ tag_showroom }}"

# ===================================================================
# Workloads
# ===================================================================
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_username: "user-{{ guid }}"
ocp4_workload_user_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_suffixes:
- suffix: vms
- suffix: travel-control-new
- suffix: travel-agency
- suffix: travel-control
- suffix: travel-portal

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "24"
  requests.cpu: "6"
  limits.memory: 56Gi
  requests.memory: 26Gi
  requests.storage: 400Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 4Gi
  defaultRequest:
    cpu: 250m
    memory: 1Gi

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/modernize-ocp-virt-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.1.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 50
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OCP Console
      url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
    - name: ArgoCD
      url: 'https://argocd-server-{{ ocp4_workload_username }}-travel-control-new.{{ openshift_cluster_ingress_domain }}'
    - name: Developer Hub
      url: 'https://backstage-developer-hub-rhdh.{{ openshift_cluster_ingress_domain }}'

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/modernize-ocp-virt-automation
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-tenant
ocp4_workload_gitops_bootstrap_application_project: tenants
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"

ocp4_workload_gitops_bootstrap_helm_values:
  username: "{{ ocp4_workload_username }}"
  password: "{{ ocp4_workload_user_password }}"
  namespaceSuffix: vms

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: 2c5dbf7c-6399-4491-a949-51c9f80db84a
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: Alan Cowles
      email: acowles@redhat.com
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2391: Accelerating Infrastructure Modernization with OpenShift Virtualization"
    category: Brand_Events
    multiuser: false
    workshopLabUiRedirect: true
    keywords:
    - virtualization
    - service mesh
    - gitops
    - summit-2026
    - lb2391
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    reportingLabels:
      primaryBU: Hybrid_Platforms

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandbox_api:
    actions:
      destroy:
        catch_all: false
