---
# -------------------------------------------------------------------
# Development environment overrides
# -------------------------------------------------------------------

purpose: development

# Enable Showroom dev mode for faster content iteration
ocp4_workload_showroom_antora_enable_dev_mode: "true"

__meta__:
  sandboxes:
  - kind: OcpSandbox
    alias: cluster
    namespace_suffix: user
    cloud_selector:
      lab: lb2010-rhads-ols-modernize
      purpose: dev
    quota:
      limits.cpu: "2"
      requests.cpu: "2"
      limits.memory: 4Gi
      requests.memory: 4Gi
      requests.storage: 10Gi
    limit_range:
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
