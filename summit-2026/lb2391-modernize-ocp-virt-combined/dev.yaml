---
# -------------------------------------------------------------------
# Development environment — single user, dev mode showroom
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml

purpose: development
num_users: 1

# Dev overrides — smaller cluster footprint
worker_instance_count: 3

# Enable Showroom dev mode for faster content iteration
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# NOTE: requirements_content in dev.yaml would REPLACE common.yaml's
# collections list entirely (YAML lists are not merged). Do NOT add
# requirements_content here unless you intentionally want to override
# the full collection set.

__meta__:
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
