---
# ===================================================================
# LB2391: Accelerating Infrastructure Modernization with OpenShift
# Virtualization (Combined)
#
# COMBINED catalog item — merges the separate cluster CI
# (lb2391-modernize-ocp-virt-cluster) and tenant CI
# (lb2391-modernize-ocp-virt-tenant) into a single order.
#
# HOW IT WORKS:
#   1. Component provisions an OCP 4.21 cluster from the CNV pool
#      (ocp-cluster-cnv-pools)
#   2. Cluster workloads run once (auth, GitOps, OCP Virt, ServiceMesh,
#      Kiali, OLS, console embed)
#   3. Bridge role (ocp4_workload_multi_tenant_loop) runs Phase 0
#      once (bootstrap-infra via tenant_cluster_workloads) then loops
#      tenant_workloads for each user (1..num_users)
#   4. After all users' workloads complete, bridge registers each
#      user with Babylon for workshop_user_mode: multi
#
# LIFECYCLE:
#   Stopgap until Babylon gets native cluster-tenant lifecycle
#   support from JK/Aleix. The bridge role remains useful regardless.
#
# JIRA: GPTEINFRA-16720
# ===================================================================

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-virtualization.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# Required by host_ocp4_assisted_scale
#include /includes/secrets/ocp4_ai_offline_token.yaml

# Required by OLS
#include /includes/secrets/ocp4_workload_ols_api_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
cloud_provider: none
config: openshift-workloads

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Number of tenant users to provision.
# Overridden in dev.yaml (1) and event.yaml.
num_users: 1

# Seconds to wait after cluster workloads complete before starting
# tenant provisioning. Gives async resources (ArgoCD syncs, operator
# CRDs, Keycloak realm, OCP Virt webhooks) time to settle.
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# WHY THIS IS NEEDED:
#   In the two-item pattern, tenant roles default to:
#     sandbox_openshift_api_url        → the infra/sandbox cluster
#     cluster_admin_agnosticd_sa_token → SA token from cluster-config
#
#   In the combined CI, the cluster comes from the component's
#   propagate_provision_data which provides openshift_api_url and
#   openshift_api_key. We override every tenant role to use these
#   instead of the sandbox defaults.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_showroom: v1.6.11
showroom_repo_revision: v2.0.0
gitops_repo_revision: v1.0.0

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 12
ai_workers_cores: 16
ai_workers_memory: 64Gi

# ===================================================================
# Collections (merged from cluster + tenant CIs, deduplicated)
# ===================================================================
requirements_content:
  collections:
  # Required by host_ocp4_assisted_scale
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: GPTEINFRA-16720-showroom-no-bastion-fix

  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "{{ tag_showroom }}"


# ===================================================================
# Cluster-level workloads (run once by openshift-workloads config)
#
# The bridge role sits at the END of this list. Everything above it
# runs once to set up shared cluster infrastructure. The bridge then
# runs Phase 0 (tenant_cluster_workloads) once, then loops
# tenant_workloads for each user.
#
# NOTE: ocp4_workload_gitops_bootstrap runs at BOTH cluster and tenant
# level with different vars (repo_path, application_name, helm_values).
# It cannot live in this list because top-level extra_vars can't be
# overridden per-phase. Instead:
#   - Phase 0: bootstrap-infra (tenant_cluster_workloads)
#   - Phase 1: bootstrap-tenant per user (tenant_workloads)
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_servicemesh3
- agnosticd.core_workloads.ocp4_workload_kiali
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Cluster workloads inside bridge (Phase 0, runs ONCE)
#
# gitops_bootstrap runs at BOTH cluster and tenant level with
# different vars for the same variable names (repo_path,
# application_name, helm_values). Can't define either set at the
# top level because they become extra_vars which nothing overrides.
# Phase 0 runs the cluster invocation inside the bridge via set_fact.
# ===================================================================
tenant_cluster_workloads:
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

tenant_cluster_workloads_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_path: bootstrap-infra
    ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra
    ocp4_workload_gitops_bootstrap_application_wait: false
    ocp4_workload_gitops_bootstrap_helm_values:
      user:
        count: 0
      devhub:
        channel: fast-1.8
        oauth:
          clientId: backstage
          clientSecret: client-secret-backstage-demo
        backendSecret: backend-secret-key-key-demo
      gitlab:
        image: quay.io/redhat-gpte/gitlab:17.4.1
        postgresqlImage: quay.io/redhat-gpte/gitlab-postgresql:14
        redisImage: redis:6.2.6
        rootPassword: "{{ common_admin_password }}"
        repos:
        - name: modernize-ocp-virt
          sourceUrl: https://github.com/rhpds/modernize-ocp-virt-workspace.git
          revision: v1.0.0

# ===================================================================
# Tenant workloads (run per user by the bridge role)
#
# Order matters:
#   1. keycloak_user — creates the user in Keycloak (sso realm)
#   2. tenant_namespace — creates user namespaces (vms, travel-*)
#   3. gitops_bootstrap — bootstrap-tenant per user
#   4. showroom — deploys lab UI into user's showroom namespace
#
# The bridge overrides ocp4_workload_tenant_keycloak_username and
# common_password per user. All vars below that reference these two
# roots cascade automatically via Jinja2 lazy evaluation.
# ===================================================================
tenant_workloads:
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# Per-workload var overrides for tenant gitops_bootstrap.
# Applied via set_fact before include_role (AAP rejects Jinja2 dicts
# in include_role vars:).
tenant_workload_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_path: bootstrap-tenant
    ocp4_workload_gitops_bootstrap_application_project: tenants
    ocp4_workload_gitops_bootstrap_application_name: >-
      bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}
    ocp4_workload_gitops_bootstrap_helm_values:
      username: "{{ ocp4_workload_tenant_keycloak_username }}"
      password: "{{ common_password }}"
      namespaceSuffix: vms

# ===================================================================
# Destroy
# Only EXTERNAL resources need explicit cleanup.
# Everything inside the OCP cluster dies when the cluster is destroyed.
# remove_workloads: bridge must run first (on destroy) to clean up
# per-user resources, then the component destroys the cluster.
# ===================================================================
tenant_remove_workloads: []

remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Per-user data reported to Babylon by the bridge role.
#
# The bridge always adds 'user' automatically.
# This dict adds lab-specific data — Jinja2 expressions are
# evaluated per user.
#
# lab_ui_url is what the portal uses for workshopLabUiRedirect
# and the Lab URL column in the workshop Users tab.
#
# password: set explicitly because the bridge auto-generates a
# per-user common_password but Keycloak was seeded with the top-level
# common_password. combine() in register_user.yml puts
# tenant_user_info_data last, so this wins.
# ===================================================================
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Cluster workload variables
# (derived from lb2391-modernize-ocp-virt-cluster/common.yaml)
# ===================================================================

# -------------------------------------------------------------------
# Common passwords
# -------------------------------------------------------------------
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}
common_admin_password: "{{ common_password }}"
common_admin_username: admin

# -------------------------------------------------------------------
# Catalog snapshot (OCP 4.21)
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_04_13

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_keycloak_default_realm: sso

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_update_resources: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: true
ocp4_workload_openshift_virtualization_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_servicemesh3
# -------------------------------------------------------------------
ocp4_workload_servicemesh3_channel: stable
ocp4_workload_servicemesh3_use_catalog_snapshot: true
ocp4_workload_servicemesh3_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_servicemesh3_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_servicemesh3_istio_version: v1.27-latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_kiali
# -------------------------------------------------------------------
ocp4_workload_kiali_channel: stable
ocp4_workload_kiali_use_catalog_snapshot: true
ocp4_workload_kiali_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kiali_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols (ai_workloads)
# NOTE: Runs once at cluster level. remove_workloads removes it on
# destroy because LLM tokens are external resources.
# -------------------------------------------------------------------
ocp4_workload_ols_get_token: true
ocp4_workload_ai_platform: azure
ocp4_workload_ols_llm_providers_models_name: gpt-5
ocp4_workload_ols_llm_deploymentname: gpt-5.1
ocp4_workload_ols_defaultmodel: gpt-5
ocp4_workload_ols_use_max_completion_tokens: true

# -------------------------------------------------------------------
# gitops_bootstrap — shared repo URL and revision (used by both
# tenant_cluster_workloads_vars and tenant_workload_vars)
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/modernize-ocp-virt-automation
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"

# ===================================================================
# Tenant workload variables
# (derived from lb2391-modernize-ocp-virt-tenant/common.yaml)
#
# All vars below reference ocp4_workload_tenant_keycloak_username
# or common_password. The bridge role overrides these two roots
# per user via include_role vars:. Everything else cascades
# automatically via Jinja2 lazy evaluation.
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_suffixes:
- suffix: vms
- suffix: travel-control-new
- suffix: travel-agency
- suffix: travel-control
- suffix: travel-portal

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "30"
  requests.cpu: "6"
  limits.memory: 60Gi
  requests.memory: 30Gi
  requests.storage: 500Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 4Gi
  defaultRequest:
    cpu: 250m
    memory: 1Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# Namespace pattern: {{ username }}-showroom (not showroom-{{ username }})
# Route becomes: showroom-user1-showroom.apps.domain (no double-showroom)
# -------------------------------------------------------------------
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/modernize-ocp-virt-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09
ocp4_workload_showroom_passthrough_user_data: true

ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 50
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: Terminal
      path: /terminal
      port: 443
    - name: OCP Console
      url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
    - name: ArgoCD
      url: 'https://argocd-server-{{ ocp4_workload_tenant_keycloak_username }}-travel-control-new.{{ openshift_cluster_ingress_domain }}'
    - name: Developer Hub
      url: 'https://backstage-developer-hub-rhdh.{{ openshift_cluster_ingress_domain }}'

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: a7f3c2e1-9b4d-4e8a-b1c5-3d6e8f0a2b4c
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    - name: Alan Cowles
      email: acowles@redhat.com
    sme:
    - name: Juliano Mohr
      email: juliano@redhat.com
    - name: Alan Cowles
      email: acowles@redhat.com
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
      pull: missing
  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB2391: Accelerating Infrastructure Modernization with OpenShift Virtualization (Combined)
    category: Brand_Events
    keywords:
    - summit-2026
    - lb2391
    - virtualization
    - service mesh
    - gitops
    - combined
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    parameters:
    - name: num_users
      description: "Number of tenant users to provision"
      formLabel: "Number of Users"
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 24
    reportingLabels:
      primaryBU: Hybrid_Platforms
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi

  components:
