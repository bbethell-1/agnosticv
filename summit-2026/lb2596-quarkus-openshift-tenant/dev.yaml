---

# tag: main
# tag_showroom: main

# ocp4_workload_showroom_deployer_chart_version: "^2.0.0"
# ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest

ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: tag_quarkus_openshift
      description: Tag/Branch for Quarkus OpenShift Repository
      formLabel: Tag/Branch for Quarkus OpenShift Repository
      required: true
      openAPIV3Schema:
        type: string
        default: main


  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb2596-quarkus-openshift
      purpose: dev
    tenant_cluster:
      item: summit-2026/lb2596-quarkus-openshift-cluster
