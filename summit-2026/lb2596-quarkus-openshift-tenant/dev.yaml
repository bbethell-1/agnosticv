---

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: main
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: main
  - name: https://github.com/rhpds/quarkus-on-openshift-automation.git
    type: git
    version: main

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"
ocp4_workload_showroom_deployer_chart_version: "^2.0.0"
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandboxes:
  - kind: OcpSandbox
    alias: cluster
    namespace_suffix: user
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb2596-quarkus-openshift
      purpose: dev
