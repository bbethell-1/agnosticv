---
# -------------------------------------------------------------------
# --- Catalog Item: LB2865: Container hardening:
#                           From zero to hero with Red Hat
#                           Hardened Images
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: "{{ tag }}"
config: namespace

# Sandbox API configuration sets:
# {{ sandbox_openshift_api_url }}"
# {{ cluster_admin_agnosticd_sa_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Namespaced Workloads
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  # Hummingbird Workshop Workloads
  - name: https://github.com/rhpds/hummingbird.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11

  # FTL — ZT runner SA + runtime automation grader
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "{{ tag }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads: >-
  {{
    [
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace',
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user',
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_rhacs',
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea_user',
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_quay',
      'rhpds.hummingbird.ocp4_workload_hummingbird_tenant',
      'agnosticd.showroom.ocp4_workload_showroom',
      'rhpds.ftl.ocp4_workload_runtime_automation_k8s'
    ] +
    (
      ['rhpds.ftl.ocp4_runtime_automation_load_test']
      if run_e2e_load_test | default(false) | bool
      else []
    )
  }}

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_username: "user-{{ guid }}"
ocp4_workload_user_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"

# ---------------------------------------------------------------------------
# Workload: agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# ---------------------------------------------------------------------------
# Quota for all namespaces except for the RHEL VM
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "4"
  requests.cpu: "4"
  limits.memory: 8Gi
  requests.memory: 8Gi
  requests.storage: 50Gi
  pods: 20

# List of namespaces
# RHEL VM namespace gets bigger quota
ocp4_workload_tenant_namespace_suffixes:
- suffix: hummingbird-builds
- suffix: hummingbird-production
- suffix: hummingbird-acs-lab
- suffix: rhel
  quota:
    limits.cpu: "8"
    requests.cpu: "8"
    limits.memory: 20Gi
    requests.memory: 20Gi
    requests.storage: 60Gi
    pods: 4

ocp4_workload_tenant_namespace_use_cluster_quota: false

# ---------------------------------------------------------------------------
# Workload: agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
# ---------------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_keycloak_realm: keycloak
ocp4_workload_tenant_keycloak_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"

# ---------------------------------------------------------------------------
# Workload: agnosticd.namespaced_workloads.ocp4_workload_tenant_rhacs
# ---------------------------------------------------------------------------
# RHACS Central namespace (where secrets and route live)
ocp4_workload_tenant_rhacs_central_namespace: stackrox
ocp4_workload_tenant_rhacs_username: "{{ ocp4_workload_username }}"
# ocp4_workload_tenant_rhacs_roles:
# - Analyst
# - APIToken creator
# - Continuous Integration

# Creating and managing policies needs Admin. There is no built in role to grant
# policies unfortunately.
ocp4_workload_tenant_rhacs_roles:
- Admin

# ---------------------------------------------------------------------------
# Workload: agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea_user
# ---------------------------------------------------------------------------
ocp4_workload_tenant_gitea_user_namespace: gitea
ocp4_workload_tenant_gitea_user_instance: gitea

ocp4_workload_tenant_gitea_user_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_gitea_user_password: "{{ ocp4_workload_user_password }}"

ocp4_workload_tenant_gitea_user_repositories: []

# ---------------------------------------------------------------------------
# Workload: agnosticd.namespaced_workloads.ocp4_workload_tenant_quay
# ---------------------------------------------------------------------------
ocp4_workload_tenant_quay_namespace: quay
ocp4_workload_tenant_quay_instance: quay
ocp4_workload_tenant_quay_user: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_quay_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_quay_pipeline_namespaces:
- "{{ ocp4_workload_username }}-hummingbird-builds"
- "{{ ocp4_workload_username }}-hummingbird-acs-lab"
# Not used - in hidden module
# - "{{ ocp4_workload_username }}-hummingbird-production"

# ---------------------------------------------------------------------------
# Workload: rhpds.hummingbird.ocp4_workload_hummingbird_tenant
# ---------------------------------------------------------------------------

# Settings for the RHEL VMs
ocp4_workload_hummingbird_tenant_vm_name: rhel
ocp4_workload_hummingbird_tenant_vm_namespace: "{{ ocp4_workload_username }}-rhel"
ocp4_workload_hummingbird_tenant_vm_datasource_name: hummingbird
ocp4_workload_hummingbird_tenant_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_hummingbird_tenant_vm_user: rhel
ocp4_workload_hummingbird_tenant_vm_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_hummingbird_tenant_vm_cpu_cores: 1
ocp4_workload_hummingbird_tenant_vm_cpu_sockets: 2
ocp4_workload_hummingbird_tenant_vm_cpu_threads: 2
ocp4_workload_hummingbird_tenant_vm_memory_guest: 8Gi
ocp4_workload_hummingbird_tenant_vm_disksize: 30Gi
ocp4_workload_hummingbird_tenant_vm_init_script_url: https://raw.githubusercontent.com/rhpds/hummingbird-showroom/refs/heads/main/scripts/setup-rhel.sh

# For AWS Only:
ocp4_workload_hummingbird_tenant_vm_storage_class_name: gp3-csi-immediate

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# ---------------------------------------------------------------------------
# Match namespace to the other namespace formats
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/hummingbird-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-04-07

ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# ---------------------------------------------------------------------------
# Workload: rhpds.ftl.ocp4_workload_runtime_automation_k8s
# ---------------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: false
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token }}"

# ---------------------------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------------------------
__meta__:
  asset_uuid: dfce3e7d-d4e8-4d93-8033-1b5cfa4d38e7
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Matt Micene
      email: mmicene@redhat.com
    - name: Tosin Akinosho
      email: takinosh@redhat.com
    instructions:
    - name: Matt Micene
      email: mmicene@redhat.com
    - name: Tosin Akinosho
      email: takinosh@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2865: Red Hat Hardened Images"
    category: Brand_Events
    keywords:
    - summit-2026
    - lb2865
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
      Platform: OpenShift
      TDP1: Container_Management
      TDP2: Server_Cloud_OS
    reportingLabels:
      primaryBU: RHEL
      secondaryBU: Hybrid_Platforms
    parameters:
    - name: run_e2e_load_test
      description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
      formLabel: "Run E2E Load Test"
      openAPIV3Schema:
        type: boolean
        default: false
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandbox_api:
    actions:
      destroy:
        catch_all: false

  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    tenant_cluster:
      item: summit-2026/lb2865-hummingbird-cnv-cluster
