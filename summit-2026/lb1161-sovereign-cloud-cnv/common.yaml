---
# -------------------------------------------------------------------
# --- Catalog: Brand Events
# --- Catalog Item: LB1161: Sovereign cloud management and security
#                           with Red Hat OpenShift Platform Plus
# -------------------------------------------------------------------
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
# Satellite credentials to subscribe the RHEL VM in the lab.
#include /includes/secrets/demosat-smt-lb1161-wolfgang.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Set num_users for autoscale
num_users: 1

# ===================================================================
# End Mandatory Variables
# ===================================================================

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 3
worker_only: true
worker_drain_control_plane: false
ai_workers_cores: 16
ai_workers_memory: 64Gi

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # AI Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"
  # Sovereign Cloud Workloads
  - name: https://github.com/rhpds/sovereign_cloud.git
    type: git
    version: "{{ tag }}"
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11
  # FTL E2E testing
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}

# These need to be set in the pooled base catalog item
# ai_service_network_cidr: "172.231.0.0/16"
# ai_cluster_network_cidr: "10.232.0.0/14"
# ai_network_mtu: 8900

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads: >-
  {{
    [
      'agnosticd.core_workloads.ocp4_workload_authentication',
      'agnosticd.core_workloads.ocp4_workload_openshift_virtualization',
      'agnosticd.core_workloads.ocp4_workload_metallb',
      'agnosticd.core_workloads.ocp4_workload_openshift_gitops',
      'agnosticd.core_workloads.ocp4_workload_pipelines',
      'agnosticd.core_workloads.ocp4_workload_s4',
      'agnosticd.core_workloads.ocp4_workload_rhacs',
      'agnosticd.core_workloads.ocp4_workload_rhacm',
      'agnosticd.core_workloads.ocp4_workload_quay_operator',
      'agnosticd.ai_workloads.ocp4_workload_openshift_ai',
      'rhpds.sovereign_cloud.ocp4_workload_register_sno',
      'rhpds.sovereign_cloud.ocp4_workload_prepare_hcp',
      'rhpds.sovereign_cloud.ocp4_workload_prepare_environment',
      'agnosticd.showroom.ocp4_workload_ocp_console_embed',
      'agnosticd.showroom.ocp4_workload_showroom',
      'rhpds.ftl.ocp4_workload_runtime_automation_k8s'
    ] +
    (
      ['rhpds.ftl.ocp4_runtime_automation_load_test']
      if run_e2e_load_test | default(false) | bool
      else []
    )
  }}

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false
ocp4_workload_openshift_virtualization_install_virtctl: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_ipaddresspool_name: ip-addresspool
ocp4_workload_metallb_ipaddresspool_addresses:
- "10.10.10.200-10.10.10.210"

# Configure L2Advertisement
ocp4_workload_metallb_enable_l2advertisement: true
ocp4_workload_metallb_l2advertisement_ipaddresspool:
- ip-addresspool
ocp4_workload_metallb_l2advertisement_interface:
- br-ex

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[email,groups]'

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.21
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_s4
# -------------------------------------------------------------------
ocp4_workload_s4_namespace: s4
ocp4_workload_s4_buckets:
- quay-registry
ocp4_workload_s4_access_key_id: s4admin
ocp4_workload_s4_secret_access_key: "{{ common_admin_password }}"
ocp4_workload_s4_auth_enabled: true
ocp4_workload_s4_auth_username: s4admin
ocp4_workload_s4_auth_password: "{{ common_admin_password }}"
ocp4_workload_s4_route_enabled: true
ocp4_workload_s4_s3_api_enabled: true
ocp4_workload_s4_storage_data_size: 500Gi
ocp4_workload_s4_wait_for_deployment: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: rhacs-4.10
ocp4_workload_rhacs_install_operator_namespace: rhacs-operator
ocp4_workload_rhacs_central_admin_password: "{{ common_admin_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_central_enable_console_plugin: true
ocp4_workload_rhacs_collector_config_enable: true
ocp4_workload_rhacs_enable_route_certs: true
ocp4_workload_rhacs_enable_vm_scanning: true
ocp4_workload_rhacs_install_roxctl: true
ocp4_workload_rhacs_enable_reencrypt_route: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.16
# Required for Catalog Items that will deploy hosted clusters to the local-cluster
# Enable Wildcards to allow access to HCP Hosted Clusters console, etc.
ocp4_workload_rhacm_enable_wildcards: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_quay_operator
# -------------------------------------------------------------------
ocp4_workload_quay_operator_channel: stable-3.16
ocp4_workload_quay_operator_registry_namespace: quay
ocp4_workload_quay_operator_registry_admin_password: "{{ common_admin_password }}"
ocp4_workload_quay_operator_registry_hostname: quay
ocp4_workload_quay_operator_registry_quay_overrides: true
ocp4_workload_quay_operator_registry_quay_overrides_env: true
ocp4_workload_quay_operator_registry_quay_overrides_resources: true
# ocp4_workload_quay_operator_registry_quay_cpu_request: 4
# ocp4_workload_quay_operator_registry_quay_cpu_limit: 6
# ocp4_workload_quay_operator_registry_quay_memory_request: 12Gi
# ocp4_workload_quay_operator_registry_quay_memory_limit: 12Gi

# s4 configuration
ocp4_workload_quay_operator_s4_storage_enabled: true
ocp4_workload_quay_operator_s4_namespace: s4
ocp4_workload_quay_operator_s4_bucket_name: quay-registry
ocp4_workload_quay_operator_s4_access_key: s4admin
ocp4_workload_quay_operator_s4_secret_key: "{{ common_admin_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable-3.3
ocp4_workload_openshift_ai_automatic_install_plan_approval: true

ocp4_workload_openshift_ai_deploy_dsc: true
ocp4_workload_openshift_ai_codeflare: Removed
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_kserve: Removed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_modelmeshserving: Managed
ocp4_workload_openshift_ai_ray: Removed
ocp4_workload_openshift_ai_trustyai: Removed
ocp4_workload_openshift_ai_trainingoperator: Removed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_feastoperator: Removed
ocp4_workload_openshift_ai_llamastackoperator: Removed

# -------------------------------------------------------------------
# Workload: ocp4_workload_register_sno
# -------------------------------------------------------------------
# RHACM Cluster
ocp4_workload_register_sno_rhacm_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_register_sno_rhacm_openshift_api_token: "{{ openshift_cluster_admin_token }}"

# AWS SNO Cluster to be imported
ocp4_workload_register_sno_aws_openshift_api_url: "{{ aws_sno_provision_data.openshift_api_url }}"
ocp4_workload_register_sno_aws_openshift_api_token: "{{ aws_sno_provision_data.openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_prepare_hcp
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_prepare_environment
# -------------------------------------------------------------------
ocp4_workload_prepare_environment_policy_namespace: policies
ocp4_workload_prepare_environment_clusterset_name: managed
ocp4_workload_prepare_environment_gitops_operator_channel: gitops-1.20

# Set up a VM for scanning
ocp4_workload_prepare_environment_vm_name: rhel-webserver
ocp4_workload_prepare_environment_vm_namespace: rhel-webserver
ocp4_workload_prepare_environment_vm_datasource_name: rhel10
ocp4_workload_prepare_environment_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_prepare_environment_vm_user: rhel
ocp4_workload_prepare_environment_vm_password: "{{ common_admin_password }}"
ocp4_workload_prepare_environment_vm_ssh_pwauth: true
ocp4_workload_prepare_environment_vm_disksize: 30Gi
ocp4_workload_prepare_environment_vm_cpu_cores: 1
ocp4_workload_prepare_environment_vm_cpu_sockets: 1
ocp4_workload_prepare_environment_vm_cpu_threads: 1
ocp4_workload_prepare_environment_vm_memory_guest: 2Gi
ocp4_workload_prepare_environment_vm_satellite_url: "{{ set_repositories_satellite_url }}"
ocp4_workload_prepare_environment_vm_satellite_org: "{{ set_repositories_satellite_org }}"
ocp4_workload_prepare_environment_vm_satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"
ocp4_workload_prepare_environment_vm_init_script_url: https://raw.githubusercontent.com/rhpds/sovereign-cloud-showroom/refs/heads/main/scripts/init-vm.sh

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/sovereign-cloud-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml

# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# ---------------------------------------------------------------------------
# Workload: rhpds.ftl.ocp4_workload_runtime_automation_k8s
# ---------------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0a3f8a81-9264-44ac-96ad-4a1ec42daf1f

  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Jimmy Alvarez
      email: jialvare@redhat.com
    - name: Michael Foster
      email: mfoster@redhat.com
    instructions:
    - name: Jimmy Alvarez
      email: jialvare@redhat.com
    - name: Michael Foster
      email: mfoster@redhat.com

  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    display_name: "LB1161: Sovereign cloud management and security with Red Hat OpenShift Platform Plus"
    category: Brand_Events
    namespace: babylon-catalog-{{ stage | default('?') }}
    reportingLabels:
      primaryBU: Hybrid_Platforms
    keywords:
    - summit-2026
    - lb1161
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    parameters:
    - name: aws_region
      description: AWS Region for SNO Cluster
      formLabel: AWS Region
      required: true
      openAPIV3Schema:
        type: string
        default: us-east-2
        enum:
        - us-east-2
      annotation: demo.redhat.com/aws-region
      variable: aws_region
      components:
      - name: aws_sno
    - name: run_e2e_load_test
      description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
      formLabel: "Run E2E Load Test"
      openAPIV3Schema:
        type: boolean
        default: false
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
      pull: missing

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "4.20"
      ocp4_fips_enable: false
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: bastion_ssh_command
      var: bastion_ssh_command
    # Needed for scaling cluster with workers
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
  - name: aws_sno
    display_name: AWS SNO Cluster
    item: summit-2026/lb1161-sovereign-cloud-sno-aws
    parameter_values:
      aws_region: us-east-2
    propagate_provision_data:
    - var: aws_sno_provision_data
