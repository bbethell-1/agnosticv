---
# -------------------------------------------------------------------
# DEVELOPMENT - lb1839-balance-virt-tenant
# -------------------------------------------------------------------
#
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    # Tenant roles (keycloak_user, namespace, gitea)
    - name: https://github.com/agnosticd/namespaced_workloads.git
      type: git
      version: main

    # GitOps bootstrap (drives all ArgoCD apps via app-of-apps)
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main

    # Showroom
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
  - agnosticd.showroom.ocp4_workload_showroom
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  #- agnosticd.core_workloads.ocp4_workload_gitea_operator
  #- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso
ocp4_workload_tenant_keycloak_user_password: "{{ common_user_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/balance-virt-automation.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ guid }}"
ocp4_workload_gitops_bootstrap_helm_values:
  tenant:
    name: "{{ guid }}"
    user:
      name: "{{ ocp4_workload_tenant_keycloak_username }}"

# don't wait for the gitops application to deploy.  This is for testing ONLY.
# must be true removed for prod.
ocp4_workload_gitops_bootstrap_application_wait: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
#
# openshift_cluster_ingress_domain is discovered by tenant_keycloak_user
# role via cluster ingress config lookup and exported as a fact.
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/balance-virt-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: OpenShift Console
    url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
#
# Dev Mode is overridden in dev.yaml
# Enable Showroom dev mode for faster content iteration
ocp4_workload_showroom_antora_enable_dev_mode: "true"

__meta__:
  sandboxes:
    - kind: OcpSandbox
      no_namespace: true
      cloud_selector:
        cloud: cnv-dedicated-shared
        lab: lb1839-balance-virt
        purpose: dev
