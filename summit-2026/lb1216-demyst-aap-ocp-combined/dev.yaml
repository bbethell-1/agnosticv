# -------------------------------------------------------------------
# dev.yaml — LB1216 Demystifying AAP on OCP (Combined)
# Overrides for development/testing. Kept minimal to match cluster CI
# dev pattern (purpose + scm_ref only) while adding num_users: 1
# and showroom dev mode.
# -------------------------------------------------------------------
purpose: development

num_users: 1

# Enable Showroom dev mode for faster content iteration during testing
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# Pin content repo to main for dev
ocp4_workload_showroom_content_git_repo_ref: runtime-automation

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
