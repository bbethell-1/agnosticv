# -------------------------------------------------------------------
# --- Catalog Item: Demystifying AAP on OCP — Cluster Provisioner
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
software_to_deploy: none
openshift_cnv_scale_cluster: true
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

# Fixed 5-worker cluster — sized for ODF + AAP operator + Keycloak + multi-tenant load
worker_instance_count: 5
ai_workers_cores: 32
ai_workers_memory: 128Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2025_10_23

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.8
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication
# ===================================================================
# New unified authentication role (replaces ocp4_workload_authentication_keycloak)
# Installs Keycloak/RHBK operator + realm — zero users at cluster provision time
# Users are created per-order by the user provisioner (Phase 4)

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_num_users: 0          # no users — created per order
ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_use_catalog_source: false
ocp4_workload_authentication_admin_password: "{{ common_password }}"

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_openshift_gitops
# ===================================================================
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'


