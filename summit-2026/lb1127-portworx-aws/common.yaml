---
# -------------------------------------------------------------------
# --- Catalog: Brand Events
# --- Catalog Item: LB1127: Unify VMs and Containers
#                           on OpenShift with Portworx
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-3.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: main
config: openshift-cluster
tag: main
# -------------------------------------------------------------------
# Bastion VM Settings
# -------------------------------------------------------------------
bastion_setup_student_user: true
bastion_student_user_name: lab-user

host_common_packages_update_all: false

bastion_instance_image: RHEL96GOLD-latest

# -------------------------------------------------------------------
# OpenShift Settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.20"
host_ocp4_installer_info_set_user_data_kubeadmin_password: true
openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

# -------------------------------------------------------------------
# Cluster sizing based on selected size (sno/multinode)
# -------------------------------------------------------------------
control_plane_instance_count: 1
control_plane_instance_type: m6a.2xlarge
control_plane_storage_type: io1

worker_instance_count: 3
worker_instance_type: m6a.2xlarge

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # Partner workloads (Pure Software)
  - name: https://github.com/rhpds/partner_workloads.git
    type: git
    version: "{{ tag }}"
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.9
  # FTL E2E testing
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads: >-
  {{
    [
      'agnosticd.core_workloads.ocp4_workload_cert_manager',
      'rhpds.partner_workloads.ocp4_workload_portworx',
      'agnosticd.core_workloads.ocp4_workload_authentication',
      'agnosticd.core_workloads.ocp4_workload_openshift_virtualization',
      'agnosticd.core_workloads.ocp4_workload_web_terminal',
      'agnosticd.showroom.ocp4_workload_ocp_console_embed',
      'agnosticd.showroom.ocp4_workload_showroom',
      'rhpds.ftl.ocp4_workload_runtime_automation_k8s'
    ] +
    (
      ['rhpds.ftl.ocp4_runtime_automation_load_test']
      if run_e2e_load_test | default(false) | bool
      else []
    )
  }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1

ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: false

# -------------------------------------------------------------------
# ocp4_workload_portworx
# -------------------------------------------------------------------
# Only predeploy for the Portworx lab for containerized workloads
ocp4_workload_portworx_install_operator: false
ocp4_workload_portworx_deploy_storagecluster: false

# The next section is only relevant if the operator and storagecluster are being installed
ocp4_workload_portworx_channel: stable

# Pin the version of the Portworx operator
ocp4_workload_portworx_automatic_installplan_approval: false
ocp4_workload_portworx_csv: portworx-operator.v25.6.1

ocp4_workload_portworx_storagecluster_storage_size: 500
ocp4_workload_portworx_update_default_storageclass: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_enabled_nested_kvm: true
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false
ocp4_workload_openshift_virtualization_deploy_hyperconverged: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-portworx-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml

ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# ---------------------------------------------------------------------------
# Workload: rhpds.ftl.ocp4_workload_runtime_automation_k8s
# ---------------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e59ced7a-79e6-47a7-95d9-0a8c60d3101e
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhanek@redhat.com
    instructions:
    - name: George James
      email: gjames@redhat.com
    - name: Eric Shanks
      email: eshanks@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-20
      pull: missing

  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1127: Unify VMs and Containers on OpenShift with Portworx"
    category: Brand_Events
    keywords:
    - summit-2026
    - lb1127
    - portworx
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    parameters:
    - name: run_e2e_load_test
      description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
      formLabel: "Run E2E Load Test"
      openAPIV3Schema:
        type: boolean
        default: false
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none
