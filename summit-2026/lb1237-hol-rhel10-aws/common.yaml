# -------------------------------------------------------------------
# --- Catalog: Summit 2026
# --- Catalog Item: LB1237 - The Definitive Red Hat Enterprise Linux 10 Hands-On Lab"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform - AgnosticD v2
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: aws
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=16, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main  # Override in prod.yaml with specific release tag

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements - AgnosticD v2
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.10
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/hol_rhel10_automation.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: RHEL97GOLD-latest
rhel_instance_image: RHEL-10.1-GOLD-latest
leapp_instance_image: RHEL97GOLD-latest
rootfs_size_bastion: 100
rootfs_size_rhel: 50
node_name: node
bastion_instance_type: t3a.2xlarge
node_instance_type: t3a.xlarge
leapp_instance_type: t3a.xlarge

security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion SSH"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BastionHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BastionHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow all TCP between nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow all UDP between nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: CockpitPorts
        description: "Cockpit Web Console"
        from_port: 9090
        to_port: 9090
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion }}"
    security_groups:
      - BastionSG
      - NodeSG
      - WebSG

  - name: "node1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    flavor:
      ec2: "{{ node_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel }}"
    security_groups:
      - NodeSG

  - name: "node2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    flavor:
      ec2: "{{ node_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel }}"
    security_groups:
      - NodeSG

  - name: "node3"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ rhel_instance_image }}"
    flavor:
      ec2: "{{ node_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel }}"
    security_groups:
      - NodeSG
      - WebSG

  - name: "leapp"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ leapp_instance_image }}"
    flavor:
      ec2: "{{ leapp_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel }}"
    security_groups:
      - NodeSG


# -------------------------------------------------------------------
# Infra Workloads - AgnosticD v2
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - host_satellite_repositories
    - agnosticd.cloud_vm_workloads.control_user
  bastions:
    - host_common_packages

software_workloads:
  all:
    - rhpds.manage_host.asset_injector
    - rhpds.hol_rhel10_automation.lab_setup

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions: >-
    {{
      [
        'agnosticd.showroom.vm_workload_showroom',
        'rhpds.ftl.vm_workload_runtime_automation'
      ] +
      (
        ['rhpds.ftl.vm_runtime_automation_load_test']
        if run_e2e_load_test | default(false) | bool
        else []
      )
    }}

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Workload: host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false
host_common_packages_extra:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

