---
#include /includes/zerotouch-access-disable-limits.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml

tag: lb1088-event-1.0.1

# -------------------------------------------------------------------
# Showroom defaults for event (overridable via catalog parameters)
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/SeanRickerd/code-red-breach-challenge-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 2.3.0
  - name: community.general
    version: 6.4.0
  - name: ansible.posix
    version: 1.5.1
  - name: awx.awx
    version: 21.1.0
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: lb1088-event-1.0.1
  - name: https://github.com/rhpds/code-red-breach-challenge-automation.git
    type: git
    version: lb1088-event-1.0.1
  - name: https://github.com/rhpds/rhpds.ads.git
    type: git
    version: "0a742e3d7f649ae0205d545f0a580a6ddcfc9152"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11
  - name: https://github.com/rhpds/cnv_workloads.git
    type: git
    version: "1e3c946d0d43a28a3499e46de72fa20a87298011"
# -------------------------------------------------------------------
# Pinned external container image — copied from personal namespace
# -------------------------------------------------------------------
code_red_breach_challenge_bootstrap_remote_ripper_image: "quay.io/rhpds/summit-2026-mthirion-hackerapp:2026-04-29"

__meta__:
  catalog:
    parameters:
    # Event seat default — common.yaml keeps default: 2 for small/dev orders.
    # Flow should still set Users explicitly; this avoids silent 2-seat event deploys.
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 15
        minimum: 2
        maximum: 65
    - name: ocp4_workload_showroom_content_git_repo
      description: Showroom git repo
      formLabel: Showroom git repo
      openAPIV3Schema:
        type: string
        default: 'https://github.com/SeanRickerd/code-red-breach-challenge-showroom.git'
    - name: ocp4_workload_showroom_content_git_repo_ref
      description: Showroom git branch or tag
      formLabel: Showroom git branch or tag
      openAPIV3Schema:
        type: string
        default: 'main'
  deployer:
    scm_ref: lb1088-event-1.0.1
