# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# OpenShift Autoscaling cluster settings
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: "{{ [(num_users | int / 10) | round(0, 'ceil') | int, 3] | max }}"
ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=8, chars=['ascii_letters', 'digits'])
  }}
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Collection version tag (override in prod.yaml with release tag)
# -------------------------------------------------------------------
tag: main

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 2.3.0
  - name: community.general
    version: 6.4.0
  - name: ansible.posix
    version: 1.5.1
  - name: awx.awx
    version: 21.1.0
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/code-red-breach-challenge-automation.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/rhpds.ads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11
  - name: https://github.com/rhpds/cnv_workloads.git
    type: git
    version: "{{ tag }}"

