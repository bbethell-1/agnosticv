# ------------------------------------------------------
# Instances
# ------------------------------------------------------
cnv_instances_passthrough_namespace: "default"
cnv_instances:
- name: "ripper"
  image: "rhel-9.6"
  memory: "8G"
  cores: 2
  image_size: "40Gi"
  tags:
  - key: "AnsibleGroup"
    value: "ripper-servers"
  interface_model: "virtio"
  networks:
  - default
  services:
  - name: hacker-app
    ports:
    - port: 5432
      protocol: TCP
      targetPort: 5432
      name: db
    type: LoadBalancer
  - name: ripper-ssh
    ports:
    - port: 22
      protocol: TCP
      targetPort: 22
      name: ssh
    type: NodePort

_cloud_config: |
  #cloud-config
  ssh_authorized_keys:
    - {{ cloud_user_ssh_public_key | trim }}
  runcmd:
    - curl -k https://{{ satellite_url }}/pub/katello-ca-consumer-latest.noarch.rpm -o /tmp/katello-ca.rpm
    - rpm -Uvh /tmp/katello-ca.rpm
    - subscription-manager register --org="{{ satellite_org }}" --activationkey="{{ satellite_activationkey }}" --serverurl=https://{{ satellite_url }} --baseurl=https://{{ satellite_url }}/pulp/repos

