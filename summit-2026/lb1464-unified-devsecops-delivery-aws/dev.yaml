---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_enable_reencrypt_route: true

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: add-rhacs-reencrypt-route-support
    - name: https://github.com/rhpds/rhpds.ads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.build-secured-dev-workflows.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.11
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "1.0.0"
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "{{ tag }}"

# Enable dev mode for showroom in development environment
ocp4_workload_showroom_antora_enable_dev_mode: "true"
