---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Smaller worker pool for cheap iteration (event/common default is 12)
# -------------------------------------------------------------------
ocp4_workload_machinesets_machineset_groups:
  - name: worker-standard
    role: worker
    instance_type: m5a.4xlarge
    total_replicas: "2"
    total_replicas_min: "2"
    total_replicas_max: "6"
    root_volume_size: "100"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_enable_reencrypt_route: true

# Enable dev mode for showroom in development environment
ocp4_workload_showroom_antora_enable_dev_mode: "true"
