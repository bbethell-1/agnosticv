purpose: event

ocp4_workload_showroom_antora_enable_dev_mode: "false"

ocp4_workload_openshift_ai_channel: stable-3.4

ocp4_workload_gitops_bootstrap_repo_revision: feat/nemo-model-switch

ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/agentops-in-prod-automation
llm_model: nvidia/nemotron-3-nano

__meta__:
  catalog:
    parameters:
    - name: showroom_language
      description: "Select the language for your lab instructions."
      formLabel: "Select your lab instruction language"
      required: false
      openAPIV3Schema:
        type: string
        default: english
        enum:
        - english
        - japanese
        - chinese
      variable: ocp4_workload_showroom_content_git_repo_ref
