---

# -------------------------------------------------------------------
# --- LB2236: Getting Started with Ansible Development Tools: From Workstation to Production (Tenant)
# -------------------------------------------------------------------
# --- This catalog item combines:
# ---   - Sandbox/namespace architecture (no cluster provisioning)
# ---   - Multi-user support with per-user namespaces
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/sandbox-api.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# ===================================================================
# Top Variables
# ===================================================================
cloud_provider: none
config: namespace
# Sandbox API configuration
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

# ===================================================================
# Additional Collections & roles to be installed
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    # TODO tag
    version: main
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.5.7

# ===================================================================
# Workloads
# ===================================================================
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# - agnosticd.namespaced_workloads.ocp4_workload_tenant_openshift_gitops
# - agnosticd.namespaced_workloads.ocp4_workload_tenant_devspaces
- agnosticd.showroom.ocp4_workload_showroom

# remove_workloads runs in the ORDER listed
remove_workloads:
- agnosticd.showroom.ocp4_workload_showroom
# - agnosticd.namespaced_workloads.ocp4_workload_tenant_devspaces
# - agnosticd.namespaced_workloads.ocp4_workload_tenant_openshift_gitops
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_username: "user-{{ guid }}"
ocp4_workload_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: keycloak

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# Format: {suffix}-{prefix}  e.g. mta-user-guid, devspaces-user-guid
# Each namespace gets its own quota.
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_prefix: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_username }}"

ocp4_workload_tenant_namespace_namespaces:
- suffix: devworkspace
  quota:
    limits.cpu: "1"
    requests.cpu: "1"
    limits.memory: 2Gi
    requests.memory: 2Gi
    requests.storage: 10Gi
  limit_range:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 50m, memory: 128Mi }

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_tenant_openshift_gitops_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_tenant_openshift_gitops_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token | trim }}"
ocp4_workload_tenant_openshift_gitops_user: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_openshift_gitops_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_openshift_gitops_user_project_prefix: "appproject"
ocp4_workload_tenant_openshift_gitops_user_cluster_resource_whitelist:
- group: ""
  kind: Namespace

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_devspaces
# -------------------------------------------------------------------
ocp4_workload_tenant_devspaces_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_devspaces_openshift_api_token: "{{ openshift_cluster_admin_token | trim }}"
ocp4_workload_tenant_devspaces_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_devspaces_namespace: "{{ ocp4_workload_username }}-devworkspace"
ocp4_workload_tenant_devspaces_devworkspace_name: "{{ ocp4_workload_username }}-workspace"
ocp4_workload_tenant_devspaces_devworkspace_devfile: >-
  http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest

ocp4_workload_tenant_devspaces_devworkspace_projects:
- name: modern-app-dev
  git_repo: kai-coolstore
  git_repo_base: http://gitea.{{ ocp4_workload_username }}-gitea.svc:3000
  git_revision: main
ocp4_workload_tenant_devspaces_devworkspace_components:
- name: tooling
  container:
    image: registry.redhat.io/devspaces/udi-rhel8:latest

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
showroom_repo_revision: v1.0.0
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ansible-dev-tools-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.0.11
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: 1c05d3d9-1d9f-4ceb-9deb-ca74c165d253
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: Leonardo Gallego
      email: lgallego@redhat.com
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2236: Getting Started with Ansible Development Tools: From Workstation to Production (Tenant)"
    category: Brand_Events
    keywords:
    - openshift
    - devspaces
    - ansible
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Brand_Event: Red_Hat_Summit_2026
    multiuser: false
    workshopLabUiRedirect: true
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Artificial_Intelligence

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    alias: cluster
    namespace_suffix: user
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: lb2236-ansible-dev-tools
      purpose: prod
    quota:
      limits.cpu: "2"
      requests.cpu: "2"
      limits.memory: 4Gi
      requests.memory: 4Gi
      requests.storage: 10Gi
    limit_range:
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
