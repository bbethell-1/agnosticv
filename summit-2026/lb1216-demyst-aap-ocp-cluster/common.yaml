      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Ansible
      Brand_Event: Red_Hat_Summit_2026
    # This item only provisions shared infrastructure.
    # It would not be appropriate to order a workshop of this item.
    workshopUiDisabled: false
  owners:
    maintainer:
      - email: rgarciac@redhat.com
        name: Ricardo Garcia
    instructions:
      - name: Ryan Laroy
        email: laroy@redhat.com
  deployer:
