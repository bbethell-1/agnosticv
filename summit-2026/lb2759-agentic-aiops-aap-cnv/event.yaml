# -------------------------------------------------------------------
# Pinned external git repo — mirror of ansible-tmm/aiops-summitlab
# -------------------------------------------------------------------
eda_repo_url: "https://github.com/rhpds/summit-2026-ansible-tmm-aiops-summitlab.git"

controller_projects:
  - name: "AI-EDA"
    description: "Project for AI EDA - mirrored from ansible-tmm/aiops-summitlab"
    organization: "Default"
    scm_type: "git"
    scm_url: "https://github.com/rhpds/summit-2026-ansible-tmm-aiops-summitlab.git"
    scm_branch: "1ae8c9f9641520ee642c0df8cc57b822d9b7c1f9"
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: false
    wait: true
  - name: "Lightspeed-Playbooks"
    description: "Project to check AI generated Lightspeed Playbooks"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ gitea_create_url }}/lab-user/lightspeed_playbooks.git"
    scm_clean: true
    scm_delete_on_update: false
    scm_update_on_launch: false
    scm_branch: "main"
    credential: "Gitea"
    wait: false
  - name: "Lightspeed-Playbooks-Network"
    description: "Network AIOps Lightspeed Playbooks from Gitea"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ gitea_create_url }}/lab-user/lightspeed_playbooks.git"
    scm_clean: true
    scm_delete_on_update: false
    scm_update_on_launch: true
    scm_branch: "main"
    credential: "Gitea"
    wait: false

eda_projects:
  - name: "ai-eda"
    description: "Event-driven Ansible rulebooks for AIOps"
    organization: Default
    url: "https://github.com/rhpds/summit-2026-ansible-tmm-aiops-summitlab.git"
    scm_branch: "1ae8c9f9641520ee642c0df8cc57b822d9b7c1f9"
    tls_validation: true

