---
# -------------------------------------------------------------------
# Dev overrides only - inherits everything from common.yaml
# Previous full dev config backed up to dev.yaml.bak
# -------------------------------------------------------------------
showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Babylon meta variables (dev sandbox + pinned deployer)
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: 2b90cb6d  # pin before PR #140 (isolated hosts SSH break)
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
