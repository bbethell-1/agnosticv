  - name: "node1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssh
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-80
    routes:
      - name: node-80
        host: node
        service: node
        targetPort: 80
        tls: false

  - name: "service1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ service_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ service_rootfs_size }}"
    networks:
      - default
      - kafka
    userdata: |
      #cloud-config
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: service1-fip
        type: LoadBalancer
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssh
          - port: 8065
            protocol: TCP
            targetPort: 8065
            name: service1-8065
          - port: 9092
            protocol: TCP
            targetPort: 9092
            name: service1-9092
          - port: 9093
            protocol: TCP
            targetPort: 9093
            name: service1-9093
    routes:
      - name: service-8065
        host: mattermost
        service: service1-fip
        targetPort: 8065
        tls: true
        tls_termination: edge

  # Cisco router instances with proper SSH key configuration
  - name: "cisco-rtr1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ cisco_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ cisco_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "network"
      - key: "ansible_network_os"
        value: "ios"
    networks:
      - default
    cdroms:
      - metadata:
          name: "cisco-rtr1-config"
        spec:
          source:
            pvc:
              name: "ans-bu-cisco-rhdp-config"
              namespace: cnv-images
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "20Mi"

  - name: "cisco-rtr2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ cisco_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ cisco_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "network"
      - key: "ansible_network_os"
        value: "ios"
    networks:
      - default
    cdroms:
      - metadata:
          name: "cisco-rtr2-config"
        spec:
          source:
            pvc:
              name: "ans-bu-cisco-rhdp-config"
              namespace: cnv-images
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "20Mi"

  # Windows Server with Active Directory
  - name: "windows"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ windows_instance_image }}"
    memory: 16G
    cores: 4
    image_size: "{{ windows_rootfs_size }}"
    interface_model: "e1000e"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "windows"
    networks:
      - default
    services:
      - name: windows
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssh
          - port: 5986
            protocol: TCP
            targetPort: 5986
            name: windows-winrm
          - port: 80
            protocol: TCP
            targetPort: 80
            name: windows-http
      - name: windows-rdp
        ports:
          - port: 3389
            protocol: TCP
            targetPort: 3389
            name: windows-rdp

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.5.6
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/hol_rhel10_automation.git
      type: git
      version: "{{ tag }}"
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/lb2961.ai_driven_aap.git
      type: git
      version: main
    - name: ansible.netcommon
      version: ">=6.0.0"
    - name: cisco.ios
      version: ">=5.0.0"
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: main
    - name: ansible.windows
      version: ">=2.0.0"
    - name: microsoft.ad
      version: ">=1.0.0"
    - name: community.windows
      version: ">=2.0.0"

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - host_satellite_repositories
  bastions:
    - host_common_packages
    - bastion
    - agnosticd.cloud_vm_workloads.control_user
    - rhpds.manage_host.asset_injector
    - lb2961.ai_driven_aap.controller_firewall
  servers:
    - lb2961.ai_driven_aap.mattermost
    - lb2961.ai_driven_aap.kafka

software_workloads:
  bastions:
    - rhpds.manage_host.vscode_server
    - rhpds.manage_host.gitea_vm_setup
    - lb2961.ai_driven_aap.splunk
  rhel9_nodes:
    - lb2961.ai_driven_aap.filebeat
  servers:
    - lb2961.ai_driven_aap.gitea_create

post_software_workloads:
  bastions:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
    - infra.aap_configuration.dispatch

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions:
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------------------------
# Pre-destroy workloads (cleanup before environment is destroyed)
# -------------------------------------------------------------------
pre_destroy_workloads:
  localhost:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Workload: host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false
host_common_packages_extra:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - nginx

# -------------------------------------------------------------------
# Workload: control_user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------
asset_injector_modules:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: lb2961.ai_driven_aap.controller_firewall
# -------------------------------------------------------------------
controller_firewall_hostname: controller
controller_firewall_user: rhel
controller_firewall_password: "{{ aap_image_admin_password }}"

# -------------------------------------------------------------------
# Role: rhel-firewalld (for controller/isolated group)
# -------------------------------------------------------------------
rhel_firewalld_open_ports:
  - 5000/tcp

# -------------------------------------------------------------------
# Workload: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: false
vscode_server_bind_addr_ip: 0.0.0.0
vscode_server_bind_addr_port: 8080

# -------------------------------------------------------------------
# Workload: gitea_vm_setup
# -------------------------------------------------------------------
gitea_http_listen: "0.0.0.0"
gitea_db_pasword: "{{ common_password }}"
gitea_create_url: "https://gitea-{{ subdomain_base }}"
gitea_create_password: "{{ common_password }}"

# -------------------------------------------------------------------
# LiteLLM Virtual Keys Configuration
# -------------------------------------------------------------------
# Convert model selection to actual model list
ocp4_workload_litellm_virtual_keys_models:
  - 'openai/granite-3-2-8b-instruct'

# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('7d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

