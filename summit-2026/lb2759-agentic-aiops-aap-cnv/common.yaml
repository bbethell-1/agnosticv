# Workload: agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  controller_url: "https://controller-{{ subdomain_base }}"
  controller_username: "{{ ansible_automation_platform_configuration_username }}"
  controller_password: "{{ ansible_automation_platform_configuration_password }}"
  eda_webhook_url: "https://eda-webhook-{{ subdomain_base }}"
  mattermost_url: "https://mattermost-{{ subdomain_base }}"
  mattermost_username: ansibleadmin@ansible.com
  mattermost_password: "{{ common_password }}"
  splunk_url: "https://splunk-{{ subdomain_base }}"
  splunk_username: "admin"
  splunk_password: "{{ common_password }}"
  gitea_url: "https://gitea-{{ subdomain_base }}"
  gitea_username: "{{ student_name }}"
  gitea_password: "{{ common_password }}"
  vscode_server_url: "https://vscode-{{ subdomain_base }}"
  vscode_server_password: "{{ common_password }}"
  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  windows_host: "windows.sandbox-{{ guid }}-ocp4-cluster.svc.cluster.local"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/agentic-aiops-aap-showroom.git
showroom_git_ref: main
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "showroom-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"
showroom_tab_services:
  - single_terminal
  - second_terminal

showroom_antora_enable_dev_mode: "false"
showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: '>_Terminal-01'
      path: /wetty
      port: 443
      secondary_name: '>_Terminal-02'
      secondary_path: /terminal2
      secondary_port: 443
    - name: '@Codeserver'
      url: "https://vscode-{{ subdomain }}"
    - name: AAP
      url: "https://controller-{{ subdomain }}"
    - name: Gitea
      url: "https://gitea-{{ subdomain }}"

