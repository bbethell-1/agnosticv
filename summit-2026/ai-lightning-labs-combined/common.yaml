---
# ===================================================================
# AI Lightning Labs - Combined (GPTEINFRA-17014)
#
# COMBINED catalog item — provisions a shared OCP cluster once,
# then runs all three lightning lab tenant workloads per user.
# Showroom content is driven by a PICKLIST (showroom_lab) at
# order time: fft | wordswarm | voice-agents.
#
# HOW IT WORKS:
#   1. Component provisions an OCP cluster from the CNV pool
#   2. Cluster workloads run once (Auth, GitOps, Bootstrap, Console)
#      gitops_bootstrap at cluster level uses cluster/infra/bootstrap path
#   3. Bridge role (ocp4_workload_multi_tenant_loop) loops
#      tenant_workloads for each user (1..num_users)
#   4. Per tenant: keycloak user, namespace, gitops bootstrap (tenant
#      path, overridden via tenant_workload_vars), showroom seed, showroom
#   5. Bridge registers each user with Babylon
#
# GITOPS_BOOTSTRAP CONFLICT RESOLUTION:
#   The same role runs at BOTH cluster and tenant level. YAML overwrites
#   duplicate keys — so tenant-level vars MUST go into tenant_workload_vars,
#   NOT as top-level vars. Top-level vars = cluster-level defaults.
#   tenant_workload_vars entries are applied via set_fact before include_role.
#
# PICKLIST: showroom_lab resolves ocp4_workload_showroom_content_git_repo
# via dict lookup at Jinja2 evaluation time. All three lab repos are
# defined in _showroom_repo_map below.
#
# JIRA: GPTEINFRA-17014
# ===================================================================

# -------------------------------------------------------------------
# This item is restricted to devs only.
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
cloud_provider: none
config: openshift-workloads

clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_api_key }}"

# Default — overridden by dev.yaml (1 for fast dev testing).
# Portal dropdown caps at maximum: 10 (cluster max_placements).
num_users: 1

# Seconds to wait after cluster workloads complete before starting
# tenant provisioning. Gives Keycloak realm and ArgoCD time to settle.
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# In the combined CI the cluster's admin token (from component
# propagate_provision_data) is used by every tenant role.
# Sandbox defaults (sandbox_openshift_api_url / SA token) are NOT
# appropriate here — the cluster comes from the agd-v2 component.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

# ocp4_workload_tenant_keycloak_user
ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ocp4_workload_tenant_namespace
ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# ===================================================================
# Cluster scaling (copied from ai-lightning-labs-cluster/common.yaml)
# dev.yaml uses defaults; event.yaml bumps workers to 6.
# ===================================================================
openshift_cnv_scale_cluster: true
worker_instance_count: 3
ai_workers_cores: 8
ai_workers_memory: 32Gi
ai_workers_root_disk_size: 300Gi

# ===================================================================
# Collections (union of cluster + tenant CIs, deduplicated)
# showroom pinned to v1.6.11 (cluster CI level, latest stable).
# Note: tenant CIs use v1.6.6 — combined CI upgrades to v1.6.11.
# Confirm with Mike Hepburn that ocp4_workload_showroom_user_data_seed
# API is unchanged between v1.6.6 and v1.6.11 before merging.
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9

    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/agnosticd/namespaced_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.11

# ===================================================================
# Cluster-level workloads (run once)
#
# Bridge role (ocp4_workload_multi_tenant_loop) is LAST.
# Everything above it runs once to set up shared cluster infra.
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Tenant workloads (run per user by bridge role)
#
# Order is critical:
#   1. keycloak user — creates user in Keycloak realm
#   2. namespace — creates OCP namespaces, quotas, limit ranges
#   3. gitops_bootstrap — deploys per-tenant ArgoCD application
#      (tenant path and app name via tenant_workload_vars below)
#   4. showroom_user_data_seed — seeds user/password into ConfigMap
#      BEFORE showroom creates the Antora content configmap
#   5. ocp4_workload_showroom — LAST (reads seed ConfigMap)
# ===================================================================
tenant_workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_showroom_user_data_seed
  - agnosticd.showroom.ocp4_workload_showroom

# No external resources to clean per user (no LiteMaaS keys).
tenant_remove_workloads: []

# Bridge handles destroy loop. Component tears down the cluster.
remove_workloads:
  - agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# tenant_workload_vars — per-role variable overrides for tenant loop
#
# CRITICAL: gitops_bootstrap appears at BOTH cluster and tenant level.
# Top-level vars set the cluster defaults (cluster/infra/bootstrap).
# These overrides replace those values ONLY during the tenant loop.
# Without this block, the cluster-level bootstrap would run with
# tenant paths and vice versa (YAML last-key-wins semantics).
# ===================================================================
tenant_workload_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ ocp4_workload_tenant_keycloak_username }}"
    ocp4_workload_gitops_bootstrap_application_project: tenants
    ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
    ocp4_workload_gitops_bootstrap_helm_values:
      tenant:
        name: "{{ guid }}"
        user:
          name: "{{ ocp4_workload_tenant_keycloak_username }}"
      openclaw:
        namespace: "{{ ocp4_workload_tenant_keycloak_username }}-openclaw"
      demo:
        namespace: "{{ ocp4_workload_tenant_keycloak_username }}-demo"

# ===================================================================
# Phase 0 — cluster-level workloads (run ONCE by bridge, before user loop)
#
# WHY tenant_cluster_workloads instead of workloads::
#   Any var defined at the AgnosticV top level becomes an AAP extra_var
#   (highest Ansible precedence). If gitops_bootstrap's application_name,
#   repo_path, or helm_values are extra_vars they CANNOT be overridden
#   by set_fact in tenant_workload_vars. Moving the role to Phase 0 and
#   defining ALL its conflicting vars here (in tenant_cluster_workloads_vars)
#   keeps them as dict entries, NOT extra_vars. set_fact CAN override role
#   defaults, so the per-user overrides in tenant_workload_vars work correctly.
# ===================================================================
tenant_cluster_workloads:
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

tenant_cluster_workloads_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ai-lightning-labs-automation
    ocp4_workload_gitops_bootstrap_repo_revision: main
    ocp4_workload_gitops_bootstrap_repo_path: cluster/infra/bootstrap
    ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra
    ocp4_workload_gitops_bootstrap_application_wait: false
    ocp4_workload_gitops_bootstrap_health_retries: 2
    ocp4_workload_gitops_bootstrap_helm_values:
      platform:
        enabled: true
      platformValues:
        rhaiMaaSTokenizer:
          stt_token: "{{ stt_token }}"
          maas_bearer: "{{ maas_bearer }}"

# ===================================================================
# Cluster workload variables
# (from ai-lightning-labs-cluster/common.yaml)
# ===================================================================
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=16, chars=['ascii_letters', 'digits']) }}
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_02_23

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_keycloak_default_realm: sso

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: latest
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: "[name,groups]"

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 250m
ocp4_workload_openshift_gitops_repo_requests_memory: 256Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 4Gi

ocp4_workload_openshift_gitops_controller_requests_cpu: 250m
ocp4_workload_openshift_gitops_controller_requests_memory: 1Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "2"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

# -------------------------------------------------------------------
