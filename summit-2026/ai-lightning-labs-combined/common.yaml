# ===================================================================
# Tenant workload variables
# (from all three tenant CIs — identical except showroom repo)
# ===================================================================
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
# DO NOT define ocp4_workload_tenant_keycloak_username here.
# Top-level vars become Babylon extra_vars (highest Ansible precedence).
# The bridge sets this per user (user1, user2...) via set_fact.
# Defining it here would lock ALL users to user-{{ guid }}.
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_suffixes:
  - suffix: openclaw
  - suffix: demo

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "8"
  requests.cpu: "4"
  limits.memory: 16Gi
  requests.memory: 8Gi
  requests.storage: 100Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 250m
    memory: 128Mi

# ===================================================================
# PICKLIST-driven Showroom selection
#
# showroom_lab is set by the Babylon order form PICKLIST parameter.
# extra_vars always win, so the default (fft) is overridden at order time.
# _showroom_repo_map resolves the repo URL via Jinja2 dict lookup.
# If the dict key is invalid, Ansible raises KeyError at runtime.
# Valid values: fft, wordswarm, voice-agents
# ===================================================================
showroom_lab: fft

_showroom_repo_map:
  fft: https://github.com/rhpds/ai-lightning-fft-agentic-lab-showroom.git
  wordswarm: https://github.com/rhpds/ai-lightning-wordswarm-showroom.git
  voice-agents: https://github.com/rhpds/ai-lightning-voice-agents-showroom.git

# -------------------------------------------------------------------
# ocp4_workload_showroom_user_data_seed
# Seeds user/password into a ConfigMap BEFORE showroom runs.
# Required so showroom renders {user} and {password} variables correctly.
# -------------------------------------------------------------------
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
# Required so showroom renders {user}/{password} vars from seed ConfigMap.
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: "{{ _showroom_repo_map[showroom_lab] }}"
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_terminal_type: none
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: RedHat AI Console
    url: 'https://rh-ai.{{ openshift_cluster_ingress_domain }}'

# -------------------------------------------------------------------
# Per-user portal data (registered by bridge after tenant loop)
# -------------------------------------------------------------------
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Babylon Meta Variables
# ===================================================================
__meta__:
  asset_uuid: 80e01900-1d81-484b-9060-55a8d86bd5a5
  owners:
    maintainer:
      - name: Mike Hepburn
        email: mhepburn@redhat.com
    instructions:
      - name: Mike Hepburn
        email: mhepburn@redhat.com

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing
    actions:
      status:
        disable: true
      update:
        disable: true

  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    reportingLabels:
      primaryBU: Artificial_Intelligence
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "AI Lightning Labs - Combined"
    category: Brand_Events
    keywords:
      - summit-2026
      - ai-lightning-labs
      - combined
      - fft
      - wordswarm
      - voice-agents
      - picklist
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: AI_BU
      Provider: RHDP
      Brand_Event: WeAreDevelopers_2026
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi
    parameters:
      - name: showroom_lab
        description: "Which lightning lab to deploy for all tenants"
        formLabel: "Lab"
        openAPIV3Schema:
          type: string
          default: fft
          enum:
            - fft
            - wordswarm
            - voice-agents
      - name: num_users
        description: "Number of tenant users to provision (max 10 — cluster supports up to 10 simultaneous placements)"
        formLabel: "Number of Users"
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 10

  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.21"
        ocp4_fips_enable: false
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_api_key
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace

  tower:
    timeout: 21600
