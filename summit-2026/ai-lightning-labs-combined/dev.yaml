---
# -------------------------------------------------------------------
# dev.yaml — Developer overrides for ai-lightning-labs-combined
#
# Purpose: keep dev provisioning fast and cheap.
# Set purpose=development so resource cost is tagged correctly.
#
# CRITICAL: requirements_content is NOT overridden here because
# common.yaml uses {{ tag }} which resolves to `main` in dev.
# If this file ever adds requirements_content it must include ALL
# collections from common.yaml (list replacement, not merge).
# -------------------------------------------------------------------
purpose: development

# 1 user in dev — fast, cheap, easy to debug.
# Override at order time if testing multi-user flow.
num_users: 1

# Default to FFT for dev testing. Operator can override manually.
showroom_lab: fft

tag: main

# Enable Antora live-reload for faster content iteration in dev.
ocp4_workload_showroom_antora_enable_dev_mode: "true"

__meta__:
  deployer:
    scm_ref: main
    scm_type: git
