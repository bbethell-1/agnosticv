---

# -------------------------------------------------------------------
# --- LB2236: Getting Started with Ansible Development Tools: From Workstation to Production (Cluster)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# Required by host_ocp4_assisted_scale
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# ===================================================================
# Additional Collections & roles to be installed
# ===================================================================
requirements_content:
  collections:
  # Required by host_ocp4_assisted_scale
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: 1.2.2
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.5.7

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 4
ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_devspaces
- agnosticd.showroom.ocp4_workload_ocp_console_embed

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_02_23

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_devspaces
# -------------------------------------------------------------------
ocp4_workload_devspaces_channel: stable
ocp4_workload_devspaces_catalogsource_setup: true
ocp4_workload_devspaces_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_devspaces_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 34605082-625c-4f0d-b8e4-98f2f12d73d8
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: Leonardo Gallego
      email: lgallego@redhat.com
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2236: Getting Started with Ansible Development Tools: From Workstation to Production (Cluster)"
    category: Brand_Events
    multiuser: false
    keywords:
    - openshift
    - devspaces
    - ansible
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Brand_Event: Red_Hat_Summit_2026
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Application_Developer

  # -----------------------------------------------------------------
  # Components / Cluster Pool
  # -----------------------------------------------------------------
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.21"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    # Required by host_ocp4_assisted_scale
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
