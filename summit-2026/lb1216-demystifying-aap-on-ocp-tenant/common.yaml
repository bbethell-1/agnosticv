---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/secrets/litemaas-master_api.yaml
#include /includes/parameters/litellm_metadata.yaml

# -------------------------------------------------------------------
# --- Catalog Item: LB1216 - Demystifying AAP on OCP (Tenant)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
config: namespace

# -------------------------------------------------------------------
# Collection version pinning — override tag in dev/event/prod yaml
# -------------------------------------------------------------------
tag: main

# ===================================================================
# Collections
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.6.6
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: main

# ===================================================================
# Workloads
# ===================================================================
workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom
- rhpds.ftl.ocp4_workload_runtime_automation_k8s

remove_workloads:
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

# ===================================================================
# Common
# ===================================================================
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# ===================================================================
# ocp4_workload_tenant_keycloak_user
# ===================================================================
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# ===================================================================
# ocp4_workload_tenant_namespace
# Namespace format: {username}-scenario-{n}
# e.g. user-abc12-scenario-1
# Each namespace hosts: AAP stack + ArgoCD Application + showroom (one scenario)
# ===================================================================
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_suffixes:
- suffix: "scenario-{{ scenario | default(1) }}"

# Per-namespace quota math (measured on a live cluster):
# Namespace-scoped AAP operator deploys 6 operator controllers with high limits:
#   aap-gateway-operator:            2500m CPU limit / 4128Mi memory limit
#   ansible-lightspeed-operator:     2500m CPU limit / 4128Mi memory limit
#   automation-controller-operator:  2500m CPU limit / 4128Mi memory limit
#   automation-hub-operator:         2500m CPU limit / 4128Mi memory limit
#   eda-server-operator:             2500m CPU limit / 4128Mi memory limit
#   resource-operator:               2000m CPU limit / 4128Mi memory limit
#   showroom:                        2200m CPU limit / ~4.3Gi memory limit
#   Total limits before AAP instance: ~17200m CPU / ~29Gi memory
#   AAP instance pods add several more GBs — 128Gi/64CPU limit is safe headroom
# Requests are much lower (~200m CPU / ~1Gi) — scheduler uses requests.
# requests.cpu governs actual cluster utilization (~27 tenants at 6 vCPU each).
# limits.cpu must be high enough to allow operator controllers to start.
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "64"
  requests.cpu: "6"
  limits.memory: 192Gi
  requests.memory: 80Gi
  requests.storage: 25Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi

# ===================================================================
# ocp4_workload_gitops_bootstrap
# ===================================================================
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/demystifying-aap-automation
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}-scenario-{{ scenario | default(1) }}"

# Wait for bootstrap Application to be Healthy before proceeding to Showroom.
# 60 retries × 30s = 30 min max wait — covers AAP operator reconciliation time.
ocp4_workload_gitops_bootstrap_application_wait: true
ocp4_workload_gitops_bootstrap_application_health_retries: 60

alia_token: "{{ litellm_master_key }}"

# -------------------------------------------------------------------------
# Helm values passed to the demystifying-aap-automation bootstrap chart.
# These are consumed by the Helm templates in tenant/aap-instance/ to:
#   - Name and namespace AAP resources per user
#   - Configure the AAP admin password and manifest license
#   - Register the OpenShift SA credential in AAP Controller so that
#     break/fix job templates can make Kubernetes API calls against the
#     user's own namespace (namespace-admin ServiceAccount, no cluster-admin)
#   - Provide ALIA/LiteMaaS config for Scenario 7
# -------------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_helm_values:
  tenant:
    username: "{{ ocp4_workload_tenant_keycloak_username }}"
    namespace: "{{ ocp4_workload_tenant_keycloak_username }}-scenario-{{ scenario | default(1) }}"
    password: "{{ common_password }}"
    domain: "{{ openshift_cluster_ingress_domain }}"
    apiUrl: "{{ sandbox_openshift_api_url }}"   # cluster API URL for the break SA credential
    scenario: "{{ scenario | default(1) }}"
  aap:
    hub:
      enabled: true
    manifest:
      url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"
  alia:
    token: "{{ alia_token }}"
    model: granite-3-2-8b-instruct
    url: https://litellm-prod.apps.maas.redhatworkshops.io/v1

# ===================================================================
# ocp4_workload_showroom
# ===================================================================
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-scenario-{{ scenario | default(1) }}"
ocp4_workload_showroom_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_showroom_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token | trim | regex_replace('^Bearer ', '') }}"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/demystifying-aap-on-ocp-showroom
ocp4_workload_showroom_content_git_repo_ref: runtime-automation
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
ocp4_workload_showroom_terminal_type: ""
# ===================================================================
# ocp4_workload_showroom_user_data_seed
# ocp4_workload_showroom_content_vars was removed in showroom v1.6.6.
# Custom vars must now be seeded via agnosticd_user_info before showroom deploys.
# ===================================================================
ocp4_workload_showroom_user_data_seed:
  scenario: "{{ scenario | default(1) }}"
  aap_url: "https://{{ ocp4_workload_tenant_keycloak_username }}-aap-{{ ocp4_workload_tenant_keycloak_username }}-scenario-{{ scenario | default(1) }}.{{ openshift_cluster_ingress_domain }}"
  console_url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  aap_admin_user: admin
  aap_admin_password: "{{ common_password }}"
  alia_token: "{{ alia_token }}"
  alia_model: granite-3-2-8b-instruct
  alia_url: https://litellm-prod.apps.maas.redhatworkshops.io/v1
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: OpenShift Console
    url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
  - name: Ansible Automation Platform
    url: 'https://{{ ocp4_workload_tenant_keycloak_username }}-aap-{{ ocp4_workload_tenant_keycloak_username }}-scenario-{{ scenario | default(1) }}.{{ openshift_cluster_ingress_domain }}'

# ===================================================================
# ocp4_workload_runtime_automation_k8s (ZT runner)
# ===================================================================
ocp4_workload_runtime_automation_k8s_cluster_admin: true
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token | trim | regex_replace('^Bearer ', '') }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: eb3f23b2-11c8-4ffd-b2c1-0375ba97c451
  owners:
    maintainer:
    - name: Ricardo Garcia
      email: rgarciac@redhat.com
    instructions:
    - name: Ryan Laroy
      email: laroy@redhat.com

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1216 - Demystifying AAP on OCP"
    category: Brand_Events
    multiuser: false
    workshopLabUiRedirect: true
    keywords:
    - lb1216
    - summit-2026
    - aap
    labels:
      Provider: RHDP
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Ansible
      Brand_Event: Red_Hat_Summit_2026
    reportingLabels:
      primaryBU: Automation
    parameters:
    - name: scenario
      description: "AAP troubleshooting scenario to deploy"
      formLabel: "Scenario"
      openAPIV3Schema:
        type: integer
        default: 1
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        x-enumNames:
        - "Scenario 1: Hub PVC issue"
        - "Scenario 2: Wrong admin password / Database service missing"
        - "Scenario 3: Wrong node-selector / High resource requests"
        - "Scenario 4: Job template with EE with wrong credentials"
        - "Scenario 5: Hub community sync limits / Hub sync storage issue"
        - "Scenario 6: ALIA troubleshooting wrong model"
