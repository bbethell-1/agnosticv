---
# ===================================================================
# LB2863: Unlocking OpenShift's Full Value - Using Application Platform
# Capabilities that Bring Real ROI for Your Apps (Combined)
#
# JIRA: GPTEINFRA-16720
#
# Merges cluster CI (lb2863-ocp-app-platform-roi-cluster) and tenant
# CI (lb2863-ocp-app-platform-roi-tenant) into a single catalog item
# using the ocp4_workload_multi_tenant_loop bridge role.
# ===================================================================

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/litemaas-master_api.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
cloud_provider: none
config: openshift-workloads

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Number of tenant users to provision.
num_users: 1

# Seconds to wait after cluster workloads before starting tenant provisioning.
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# In the combined CI the cluster's admin token comes from
# propagate_provision_data as openshift_api_key. Override every
# tenant role so they connect to the correct cluster.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_openshift_gitops_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_openshift_gitops_openshift_api_token: "{{ openshift_api_key }}"


# -------------------------------------------------------------------
# Autoscaling cluster (CNV)
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
ai_workers_cores: 32
ai_workers_memory: 64Gi
worker_instance_count: 4

# ===================================================================
# Collections (merged from cluster + tenant CIs, deduplicated)
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer for CNV scaling
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main

  # Namespaced Workloads
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "{{ tag }}"

  # Lab specific collection
  - name: https://github.com/App-Platform-ROI-Summit-Lab/agnosticd-role.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.8

# ===================================================================
# Cluster-level workloads (run once by openshift-workloads config)
#
# The bridge role (ocp4_workload_multi_tenant_loop) sits at the END.
# litellm runs at cluster level to create a shared cluster key;
# tenant invocations create per-user keys via tenant_workload_vars.
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- rhdp.workshop.ocp4_app_platform_roi
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

remove_workloads:
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Tenant workloads (run per user, Phase 1)
#
# Order:
#   1. keycloak_user          — creates user in Keycloak
#   2. tenant_openshift_gitops — per-user ArgoCD AppProject
#   3. litellm_virtual_keys   — creates per-user LLM key
#   4. gitops_bootstrap       — deploys per-user resources via ArgoCD
#   5. showroom               — deploys lab UI
# ===================================================================
tenant_workloads:
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_openshift_gitops
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# Per-workload var overrides for tenant invocations.
tenant_workload_vars:
  rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys:
    ocp4_workload_litellm_virtual_keys_alias_format: >-
      virtkey-{{ ocp4_workload_tenant_keycloak_username }}-{{ guid }}
    ocp4_workload_litellm_virtual_keys_enable_user_info_messages: false
    ocp4_workload_litellm_virtual_keys_enable_user_info_data: false
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
    ocp4_workload_gitops_bootstrap_helm_values:
      tenant:
        username: "{{ ocp4_workload_tenant_keycloak_username }}"
        password: "{{ common_password }}"
        domain: "{{ openshift_cluster_ingress_domain }}"
      gitlab:
        host: "gitlab-gitlab.{{ openshift_cluster_ingress_domain }}"
      cluster:
        subdomain: "{{ openshift_cluster_ingress_domain }}"
      registry:
        host: "quay.{{ openshift_cluster_ingress_domain }}"

# ===================================================================
# Tenant destroy — LiteMaaS virtual keys live outside cluster.
# ===================================================================
tenant_remove_workloads:
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.namespaced_workloads.ocp4_workload_tenant_openshift_gitops
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Per-user data for Babylon
# ===================================================================
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Cluster workload variables
# ===================================================================

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# Workload: ocp4_app_platform_roi
# -------------------------------------------------------------------
ocp4_app_platform_roi_noobaa_install: false
ocp4_app_platform_roi_gitops_repo_tag: main
ocp4_app_platform_roi_gitops_repo: https://github.com/App-Platform-ROI-Summit-Lab/helm-charts.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: 250m
ocp4_workload_openshift_gitops_controller_requests_memory: 1Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi
ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "4"
ocp4_workload_openshift_gitops_repo_limits_memory: 4Gi
ocp4_workload_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

  quay.redhat.com/QuayRegistry:
    health.lua: |
      local hs={ status = "Progressing", message = "Waiting for initialization" }
      found_status = false

      if obj.status ~= nil then
        found_status = true
        if obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do

            if condition.type == "Available" and condition.status ~= "True" then
              if condition.reason == "ComponentNotReady" then
                hs.status = "Progressing"
              else
                hs.status = "Degraded"
              end
              hs.message = condition.message or condition.reason
            end
            if condition.type == "Available" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "All instances are available"
            end
          end
        end
      end

      if not found_status then
        hs = { status = "Progressing", message = "Instance is waiting for initialization" }
      end

      return hs

# -------------------------------------------------------------------
# Workload: rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# Cluster-level: shared key, user_info enabled for portal.
# Tenant-level: per-user key, alias and user_info overridden via tenant_workload_vars.
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models:
- claude-opus-4-6
- qwen3-14b
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_multi_user: false
ocp4_workload_litellm_virtual_keys_user_count: 1
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: sso
ocp4_workload_authentication_keycloak_channel: stable-v26.4

# ===================================================================
# Tenant workload variables
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_tenant_openshift_gitops_user: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_openshift_gitops_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/App-Platform-ROI-Summit-Lab/helm-charts.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_gitops_bootstrap_health_retries: 10

ocp4_workload_gitops_bootstrap_helm_values:
  tenant:
    username: "{{ ocp4_workload_tenant_keycloak_username }}"
    password: "{{ common_password }}"
    domain: "{{ openshift_cluster_ingress_domain }}"
  gitlab:
    host: "gitlab-gitlab.{{ openshift_cluster_ingress_domain }}"
  cluster:
    subdomain: "{{ openshift_cluster_ingress_domain }}"
  registry:
    host: "quay.{{ openshift_cluster_ingress_domain }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-app-platform-roi-showroom.git
ocp4_workload_showroom_content_git_repo_ref: fix-combined-ci-user-variable
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_terminal_type: ""
# Pass user-data.yaml through to showroom so USER env var is populated
# Bridge Phase 2 writes per-user data; showroom reads it for env vars
ocp4_workload_showroom_passthrough_user_data: true
# Set USER env var in showroom content container for ${USER} substitution in ui-config.yml
ocp4_workload_showroom_user: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

