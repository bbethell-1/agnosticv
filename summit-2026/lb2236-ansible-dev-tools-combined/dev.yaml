---
# -------------------------------------------------------------------
# Development environment — single user, dev mode showroom
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml

purpose: development
num_users: 1

# Enable Showroom dev mode for faster content iteration
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# Extra retries for gitops_bootstrap health checks in dev environments
# where ArgoCD sync can be slow.
ocp4_workload_gitops_bootstrap_health_retries: 2

__meta__:
  deployer:
    scm_ref: main
    scm_type: git
  catalog:
    parameters:
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
