---
# ===================================================================
# LB2860: Private Model as a Service (Combined)
#
# JIRA: GPTEINFRA-16720
#
# Merges cluster CI (lb2860-private-maas-aws-cluster) and tenant
# CI (lb2860-private-maas-tenant) into a single catalog item
# using the ocp4_workload_multi_tenant_loop bridge role.
#
# CLUSTER:  AWS (cloud_provider: aws, openshift-cluster config).
#           Provisions a full OCP cluster with GPU machineset
#           (g6e.2xlarge), cert-manager, auth, GitOps, and bootstrap.
#
# TENANT:   Per-user namespaces (wksp, llamastack, showroom),
#           Keycloak user, gitops_bootstrap (tenant/bootstrap path),
#           Showroom, and FTL runtime automation.
#
# HOW IT WORKS:
#   1. Component provisions an AWS OCP cluster from ocp-cluster-aws-pools
#   2. Cluster workloads run once (machinesets, cert-manager, auth,
#      gitops, multi_tenant_loop bridge)
#   3. Bridge Phase 0: tenant_cluster_workloads runs gitops_bootstrap
#      (bootstrap path) once for the cluster
#   4. Bridge Phase 1 loops tenant_workloads for each user
#      (keycloak_user, tenant_namespace, gitops_bootstrap tenant path,
#      showroom, FTL)
#   5. Bridge Phase 2 registers each user with Babylon
#
# USERNAME PATTERN:
#   Bridge generates llmuser1, llmuser2, ... (tenant_user_prefix: llmuser)
#   Mirrors the two-item tenant CI's llmuser-{{ guid }} convention.
# ===================================================================

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
cloud_provider: none
config: openshift-workloads

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Number of tenant users to provision.
# Overridden in dev.yaml (1) and event.yaml.
num_users: 1

# Seconds to wait after cluster workloads complete before starting
# tenant provisioning. Gives async resources (ArgoCD syncs, operator
# CRDs, Keycloak realm) time to settle.
tenant_pre_loop_delay: 120

# Username prefix — bridge generates llmuser1, llmuser2, etc.
# Mirrors the two-item tenant CI's llmuser-{{ guid }} convention.
tenant_user_prefix: llmuser

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# WHY THIS IS NEEDED:
#   In the two-item pattern, tenant roles default to the sandbox
#   cluster SA token. In the combined CI, the cluster comes from the
#   component's propagate_provision_data (openshift_api_url and
#   openshift_api_key). We override every tenant role to use these
#   instead of the sandbox defaults.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# ===================================================================
# Collections (merged from cluster + tenant CIs, deduplicated)
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main

  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.6

# ===================================================================
# Cluster-level workloads (run once by openshift-workloads config)
#
# The bridge role sits at the END of this list. Everything above it
# runs once to set up shared cluster infrastructure (machinesets,
# TLS certs, Keycloak auth, GitOps operators). The bridge then runs
# Phase 0 (tenant_cluster_workloads) and loops tenant_workloads per
# user.
#
# NOTE: ocp4_workload_gitops_bootstrap for the cluster (bootstrap
# path) is NOT here - it is in tenant_cluster_workloads (Phase 0) to
# avoid extra_vars precedence conflict with the tenant invocation
# (tenant/bootstrap path) which uses the same variable names.
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_machinesets
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Cluster workloads inside bridge (Phase 0, runs ONCE)
#
# gitops_bootstrap runs at BOTH cluster and tenant level with
# different vars for the same variable names (repo_path,
# application_name, helm_values). Can't define either set at the
# top level because they become extra_vars that nothing overrides.
# Phase 0 runs the cluster invocation inside the bridge via set_fact.
# ===================================================================
tenant_cluster_workloads:
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

tenant_cluster_workloads_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_path: bootstrap
    ocp4_workload_gitops_bootstrap_application_name: bootstrap
    ocp4_workload_gitops_bootstrap_application_wait: false
    ocp4_workload_gitops_bootstrap_helm_values:
      bootstrap:
        targetRevision: "{{ ocp4_workload_gitops_bootstrap_repo_revision }}"
      slackMcpSecret:
        slackBotToken: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          62363230306465333938333130666363303938343561363165376135356236353133323932386161
          3233666266323737353762656564376239316238383830610a346537616639363636646637323134
          34373632323631653537653438663266303739343936646261666363363431366431316133376564
          6235313061656463630a663634383261306466326638633237623933306465333036656631326662
          39383434396236376261666161393036663764646238663661356437636238633961326166303034
          32356133616136396638363663323366336465366532303039353064316239633362616661636466
          646133316634366263373039356332303666
      rocketchat:
        adminPassword: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          38633136363330663133363137313665323865353037313664333536313336313963653635663431
          3134653361623662366632653232346534623433623434350a323064376363623231643434383933
          61653236613764383065663533336531376139316132306130653461313861313330396538356632
          3831316230316564350a653137373735333133313439643732376466323166623565383033656432
          6537

# ===================================================================
# Tenant workloads (run per user, Phase 1)
#
# Order matters:
#   1. keycloak_user - creates the user in Keycloak
#   2. tenant_namespace - creates user namespaces (wksp, llamastack,
#      showroom)
#   3. gitops_bootstrap - deploys tenant ArgoCD app (tenant/bootstrap)
#   4. showroom - deploys lab UI into showroom-{{ username }} namespace
#   5. runtime_automation_k8s - FTL runner SA (needs showroom namespace)
# ===================================================================
tenant_workloads:
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

# Per-workload var overrides for tenant gitops_bootstrap.
# Applied via set_fact before include_role (AAP rejects Jinja2 dicts
# in include_role vars:).
tenant_workload_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
    ocp4_workload_gitops_bootstrap_application_name: >-
      bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}
    ocp4_workload_gitops_bootstrap_application_project: tenants
    ocp4_workload_gitops_bootstrap_helm_values:
      tenant:
        username: "{{ ocp4_workload_tenant_keycloak_username }}"
        password: "{{ common_password }}"
        domain: "{{ openshift_cluster_ingress_domain }}"
      rocketchat:
        adminPassword: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          38633136363330663133363137313665323865353037313664333536313336313963653635663431
          3134653361623662366632653232346534623433623434350a323064376363623231643434383933
          61653236613764383065663533336531376139316132306130653461313861313330396538356632
          3831316230316564350a653137373735333133313439643732376466323166623565383033656432
          6537
        tenantPassword: "{{ common_password }}"

# ===================================================================
# Destroy
# ===================================================================
tenant_remove_workloads: []

# Bridge runs on destroy to loop tenant cleanup before cluster is
# destroyed. All tenant resources inside OCP die when the cluster
# component is destroyed by the pool.
remove_workloads:
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Per-user data reported to Babylon by the bridge role (Phase 2).
#
# lab_ui_url drives workshopLabUiRedirect and the Lab URL column.
# password is included so the portal displays it in the user table.
# Jinja2 expressions evaluate per user - ocp4_workload_tenant_keycloak_username
# resolves to the current user (llmuser1, llmuser2, ...).
#
# Showroom namespace: showroom-{{ username }}
# Route:  showroom-showroom-{{ username }}.apps.{{ domain }}
# ===================================================================
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-showroom-{{ ocp4_workload_tenant_keycloak_username }}.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-showroom-{{ ocp4_workload_tenant_keycloak_username }}.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Cluster workload variables
# (from lb2860-private-maas-aws-cluster/common.yaml)
# ===================================================================

# -------------------------------------------------------------------
# Common passwords
# -------------------------------------------------------------------
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_admin_username: admin

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# GPU machineset mirrors lb2860-private-maas-aws-cluster exactly.
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: true
gpu_instance_type_big: g6e.2xlarge

ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu-big
  role: worker-gpu
  instance_type: "{{ gpu_instance_type_big }}"
  autoscale: false
  total_replicas: "1"
  total_replicas_min: "1"
  total_replicas_max: "1"
  root_volume_size: "250"
  taints:
  - key: nvidia.com/gpu
    value: l40-gpu
    effect: NoSchedule

# cert_manager removed — Route53 creds not available in pool/components pattern.
# Pool clusters already have valid TLS certs from the provider.

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_user_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_update_resources: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap - shared repo URL/revision
# Path and app name are set per invocation via tenant_cluster_workloads_vars
# (bootstrap path) and tenant_workload_vars (tenant/bootstrap path).
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/private-maas-automation
ocp4_workload_gitops_bootstrap_repo_revision: feat/consolidated-deployment
ocp4_workload_gitops_bootstrap_health_retries: 2

# ===================================================================
# Tenant workload variables
# (from lb2860-private-maas-tenant/common.yaml, adapted for multi-user)
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# Realm: default (authentication workload default)
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# Namespace pattern: wksp-{{ username }}, llamastack-{{ username }},
# showroom-{{ username }} - matches the two-item tenant CI.
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_prefix: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_namespaces:
- "wksp-{{ ocp4_workload_tenant_keycloak_username }}"
- "llamastack-{{ ocp4_workload_tenant_keycloak_username }}"
- "showroom-{{ ocp4_workload_tenant_keycloak_username }}"

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "14"
  requests.cpu: "14"
  limits.memory: 30Gi
  requests.memory: 30Gi
  requests.storage: 100Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 250m
    memory: 1Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# Namespace: showroom-{{ username }}
# Route:     showroom-showroom-{{ username }}.apps.{{ domain }}
# -------------------------------------------------------------------
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

ocp4_workload_showroom_namespace: "showroom-{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/private-maas-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_namespace_display: "LB2860: Private Model as a Service"
ocp4_workload_showroom_content_only: true
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09
ocp4_workload_showroom_runtime_automation_enable: false
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
ocp4_workload_showroom_passthrough_user_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_runtime_automation_k8s (FTL)
# Uses the component-provided cluster token (not sandbox SA token).
# -------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: true
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ openshift_api_key }}"

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: 3d8f1a4b-2c7e-4d9a-b6f0-5e2c8a1d3f7b
  owners:
    maintainer:
    - name: Ritesh Shah
      email: rshah@redhat.com
    - name: Taylor Smith
      email: tsmith@redhat.com
    instructions:
    - name: Ritesh Shah
      email: rshah@redhat.com
    - name: Taylor Smith
      email: tsmith@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing
  sandbox_api:
    reservation: pgpu
  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2860: Private Model as a Service (Combined)"
    category: Brand_Events
    keywords:
    - lb2860
    - summit-2026
    - openshift ai
    - maas
    - private maas
    - combined
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
      Brand_Event: Red_Hat_Summit_2026
    parameters:
    - name: num_users
      description: "Number of tenant users to provision"
      formLabel: "Number of Users"
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 24
    reportingLabels:
      primaryBU: Artificial_Intelligence
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi

  components:
  - name: openshift
    display_name: OpenShift Cluster (AWS)
    item: agd-v2/ocp-cluster-aws-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: openshift_cluster_ingress_domain
      var: openshift_cluster_ingress_domain
    - name: aws_region
      var: aws_region

  tower:
    timeout: 21600
