---
# -------------------------------------------------------------------
# Development - lb2188-edge-manager-tenant
# -------------------------------------------------------------------

# sandbox_openshift_apps_domain is populated by the .. sandbox api
# I need this because prior namespace associated workloads set this up
# but I'm not using any. :D
openshift_cluster_ingress_domain: "{{ sandbox_openshift_apps_domain }}"

ocp4_workload_gitops_bootstrap_application_wait: false

worker_instance_count: "2" # 2 in development

workloads:
  #- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  #- agnosticd.core_workloads.ocp4_workload_gitea_operator
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_showroom

# The AgnosticD 'namespace' config will automatically construct this list
# as a reverse of the 'workloads' list if it is not specificied here
remove_workloads:
  - agnosticd.showroom.ocp4_workload_showroom
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  #- agnosticd.core_workloads.ocp4_workload_gitea_operator
  #- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  #- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

ocp4_workload_gitops_bootstrap_helm_values:
  tenant:
    name: "{{ guid }}"
    user:
      name: "user-{{ guid }}"
  guid: "{{ guid }}"

  user:
    count: "1" #placeholder as we improve gitops
    prefix: "user"

  satellite_url: demosat-ha.infra.demo.redhat.com
  set_repositories_satellite_url: "{{ satellite_url }}"
  set_repositories_satellite_hostname: "{{ satellite_url }}"
  satellite_org: Red_Hat_RHDP_Labs
  set_repositories_satellite_org: "{{ satellite_org }}"
  set_repositories_satellite_ha: true
  satellite_activationkey: "{{ satellite_activationkey }}"
  set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      no_namespace: true
      cloud_selector:
        cloud: cnv-dedicated-shared
        lab: lb2188-edge-manager
        purpose: dev
