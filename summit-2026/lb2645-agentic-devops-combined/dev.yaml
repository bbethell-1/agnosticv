---
# -------------------------------------------------------------------
# Development environment — single user, dev mode showroom
#
# CRITICAL: requirements_content here REPLACES (not merges) the list
# in common.yaml. Keep this in sync with common.yaml at all times.
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml

purpose: development
num_users: 1

# Enable Showroom dev mode for faster content iteration
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Collections — must mirror common.yaml exactly (YAML lists REPLACE)
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/deepagents-aiops.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11

__meta__:
  deployer:
    scm_ref: main
    scm_type: git
