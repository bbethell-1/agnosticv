---
# ===================================================================
# LB2645: Agentic DevOps (Combined)
#
# COMBINED catalog item — merges the separate cluster CI
# (lb2645-agentic-devops-cluster) and tenant CI
# (lb2645-agentic-devops-tenant) into a single order.
#
# HOW IT WORKS:
#   1. Component provisions an OCP cluster from the CNV pool
#   2. Cluster workloads run once (operators, RHOAI, AAP, CNV, etc.)
#   3. Bridge role (ocp4_workload_multi_tenant_loop) loops
#      tenant_workloads for each user (1..num_users)
#   4. After all users' workloads complete, bridge registers each
#      user with Babylon for workshop_user_mode: multi
#
# NOTE: gitops_bootstrap is commented out in the cluster CI and NOT
# included at either cluster or tenant level in this combined CI.
#
# JIRA: GPTEINFRA-16720
# ===================================================================

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-ai.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/litemaas-master_api.yaml

#include /includes/parameters/litellm_metadata.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
cloud_provider: none
config: openshift-workloads

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Number of tenant users to provision.
# Overridden in dev.yaml (1) and event.yaml (number of students).
num_users: 1

# Seconds to wait after cluster workloads complete before starting
# tenant provisioning. Gives async resources (operators, Keycloak
# realm, AAP controller) time to settle.
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# In the combined CI the cluster's own admin token is used by every
# tenant role. Sandbox defaults (sandbox_openshift_api_url / SA token)
# are NOT appropriate here — the cluster comes from the component's
# propagate_provision_data.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

# tenant_keycloak_user
ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"

# tenant_namespace
ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# tenant_gitea_user
ocp4_workload_tenant_gitea_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_gitea_user_openshift_api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 3
ai_workers_cores: 16
ai_workers_memory: 48Gi

worker_only: true

# ===================================================================
# Collections (merged from cluster + tenant CIs, deduplicated)
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main

  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # deepagents-aiops — RHEL VM, AAP2, Kira, LangFuse, RocketChat,
  # MLflow, Athena tenant/cluster workloads
  - name: https://github.com/rhpds/deepagents-aiops.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11

# ===================================================================
# Cluster-level workloads (run once by openshift-workloads config)
#
# The bridge role sits at the END of this list. Everything above it
# runs once to set up shared cluster infrastructure. The bridge then
# loops tenant_workloads for each user.
#
# NOTE: gitops_bootstrap is intentionally excluded — it is commented
# out in the cluster CI and there is no gitops_bootstrap at either
# level in this lab.
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- rhpds.deepagents_aiops.ocp4_workload_rhel_vm_infra
- rhpds.deepagents_aiops.ocp4_workload_mlflow_cluster
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Tenant workloads (run per user by the bridge role)
#
# The bridge sets ocp4_workload_tenant_keycloak_username and
# common_password per user. All vars below that reference these
# cascade automatically via Jinja2 lazy evaluation.
#
# Order: keycloak user first → namespaces → litellm → gitea →
#        VM → AAP → Kira → LangFuse → RocketChat → MLflow →
#        Athena → Showroom last
# ===================================================================
tenant_workloads:
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.namespaced_workloads.ocp4_workload_tenant_gitea_user
- rhpds.deepagents_aiops.ocp4_workload_rhel_vm_tenant
- rhpds.deepagents_aiops.ocp4_workload_aap2_tenant_config
- rhpds.deepagents_aiops.ocp4_workload_kira_tenant
- rhpds.deepagents_aiops.ocp4_workload_langfuse_tenant
- rhpds.deepagents_aiops.ocp4_workload_rocketchat_tenant
- rhpds.deepagents_aiops.ocp4_workload_mlflow_tenant
- rhpds.deepagents_aiops.ocp4_workload_athena_tenant

# ===================================================================
# Destroy
#
# Tenant resources that exist OUTSIDE the OCP cluster (LiteMaaS
# virtual keys) need explicit cleanup. Everything inside the cluster
# is destroyed when the component destroys the cluster.
# ===================================================================
tenant_remove_workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# Per-workload var overrides for roles with guid-based namespace defaults.
# Applied via set_fact before include_role — overrides role defaults (#2).
tenant_workload_vars:
  rhpds.deepagents_aiops.ocp4_workload_athena_tenant:
    ocp4_workload_athena_tenant_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-agentic"
  rhpds.deepagents_aiops.ocp4_workload_aap2_tenant_config:
    ocp4_workload_aap2_tenant_config_username: "{{ ocp4_workload_tenant_keycloak_username }}"
  rhpds.deepagents_aiops.ocp4_workload_mlflow_tenant:
    ocp4_workload_mlflow_tenant_username: "{{ ocp4_workload_tenant_keycloak_username }}"

# Bridge runs first on destroy — cleans up per-user external resources.
# Then the component destroys the OCP cluster (wipes everything else).
remove_workloads:
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Per-user data reported to Babylon by the bridge role.
#
# ocp4_workload_tenant_keycloak_username resolves to the current
# user's name (user1, user2, ...) per loop iteration.
# password is explicitly set so it reports common_password, not the
# bridge's auto-generated per-user password.
# ===================================================================
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Cluster workload variables
# (copied from lb2645-agentic-devops-cluster/common.yaml)
# ===================================================================

# -------------------------------------------------------------------
# Common Password — 16 chars to match cluster CI
# -------------------------------------------------------------------
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=16, chars=['ascii_letters', 'digits']) }}
common_admin_password: "{{ common_password }}"
common_admin_username: admin

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.3.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.5.2"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: "10.1"
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: gitea-admin
ocp4_workload_gitea_operator_admin_email: gitea-admin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password }}"

ocp4_workload_gitea_operator_create_users: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_admin_password }}"
ocp4_workload_ansible_automation_platform_save_admin_credentials: true
ocp4_workload_ansible_automation_platform_disable_controller: false
ocp4_workload_ansible_automation_platform_disable_eda: true
ocp4_workload_ansible_automation_platform_disable_hub: true
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.6
ocp4_workload_ansible_automation_platform_catalog_snapshot_image_tag: "v4.20_2025_12_29"
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader
ocp4_workload_ansible_automation_platform_hub_file_storage_file_class: ocs-external-storagecluster-cephfs
ocp4_workload_ansible_automation_platform_hub_file_storage_access_mode: ReadWriteMany
# Manifest inject: controller API may not be listening immediately after CR reports Successful
# Default 3x5s=15s is too short — bump to 60x10s=10min
ocp4_workload_ansible_automation_platform_manifest_inject_retries: 60
ocp4_workload_ansible_automation_platform_manifest_inject_delay: 10

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
