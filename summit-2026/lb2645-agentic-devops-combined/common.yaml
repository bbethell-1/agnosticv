# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable-3.4
ocp4_workload_openshift_ai_use_catalog_snapshot: false
ocp4_workload_openshift_ai_deploy_dsc: true
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_ray: Removed
ocp4_workload_openshift_ai_trustyai: Removed
ocp4_workload_openshift_ai_trainingoperator: Removed
ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_codeflare: Removed
ocp4_workload_openshift_ai_feastoperator: Removed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed

# ===================================================================
# Tenant workload variables
# (copied from lb2645-agentic-devops-tenant/common.yaml and adapted
# so all username references use ocp4_workload_tenant_keycloak_username
# which the bridge sets per user via set_fact)
# ===================================================================

# Map bare ocp4_workload_username to the bridge-set per-user keycloak username.
# deepagents_aiops roles reference ocp4_workload_username internally.
# Jinja2 lazy evaluation resolves this correctly after bridge set_fact.
ocp4_workload_username: "{{ ocp4_workload_tenant_keycloak_username }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
- suffix: agentic
- suffix: rhel

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "40"
  requests.cpu: "40"
  limits.memory: 80Gi
  requests.memory: 80Gi
  requests.storage: 100Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 25m
    memory: 256Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
#
# multi_user: false prevents auto-detection from num_users > 1 which
# would write per-user data to user-data.yaml triggering showroom's
# multi-user namespace path.
# alias_format includes username so per-user keys don't overwrite each
# other (all share the same guid in the combined CI).
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
- "qwen3-235b"
- "minimax-m2"
- "gpt-oss-120b"
- "gpt-oss-20b"
- "llama-scout-17b"
- "gemini-2.5-pro"
- "claude-3-5-haiku"
- "claude-opus-4-6"
- "claude-sonnet-4-6"
ocp4_workload_litellm_virtual_keys_multi_user: false
ocp4_workload_litellm_virtual_keys_user_count: 1
ocp4_workload_litellm_virtual_keys_alias_format: "virtkey-{{ ocp4_workload_tenant_keycloak_username }}-{{ guid }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_gitea_user
# -------------------------------------------------------------------
ocp4_workload_tenant_gitea_user_namespace: gitea
ocp4_workload_tenant_gitea_user_name: gitea
ocp4_workload_tenant_gitea_user_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_gitea_user_password: "{{ common_password }}"

ocp4_workload_tenant_gitea_user_repositories:
- name: agentic-devops-plays
  repo: https://github.com/rhpds/agentic-aiops-plays.git
  private: false
- name: agentic-devops-athena
  repo: https://github.com/rhpds/athena-aiops-deep-agent.git
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhel_vm_tenant
# -------------------------------------------------------------------
ocp4_workload_rhel_vm_tenant_vm_name: rhel
ocp4_workload_rhel_vm_tenant_vm_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-rhel"
ocp4_workload_rhel_vm_tenant_vm_datasource_name: rhel-base
ocp4_workload_rhel_vm_tenant_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_rhel_vm_tenant_vm_user: rhel
ocp4_workload_rhel_vm_tenant_vm_password: "{{ common_password }}"
ocp4_workload_rhel_vm_tenant_vm_disksize: 10Gi
ocp4_workload_rhel_vm_tenant_vm_instancetype: u1.small
ocp4_workload_rhel_vm_tenant_vm_runcmd:
- "dnf config-manager --set-disabled rhel-10-for-x86_64-appstream-rpms"

# -------------------------------------------------------------------
# Workload: ocp4_workload_aap2_tenant_config
# -------------------------------------------------------------------
ocp4_workload_aap2_tenant_config_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_aap2_tenant_config_user_password: "{{ common_password }}"
ocp4_workload_aap2_tenant_config_vm_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_kira_tenant
# -------------------------------------------------------------------
ocp4_workload_kira_tenant_user_username: "{{ ocp4_workload_tenant_keycloak_username }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rocketchat_tenant
# -------------------------------------------------------------------
ocp4_workload_rocketchat_tenant_user_username: "{{ ocp4_workload_tenant_keycloak_username }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_langfuse_tenant
# -------------------------------------------------------------------
ocp4_workload_langfuse_tenant_helm_chart_version: "1.5.28"
ocp4_workload_langfuse_tenant_admin_email: "admin@example.com"
ocp4_workload_langfuse_tenant_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_mlflow_tenant
# Admin credentials read from mlflow-admin-credentials Secret (cluster role).
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_athena_tenant
#
# Credentials discovered dynamically:
#   AAP2 admin: from aap-admin-credentials secret
#   Kira/RC URLs: from Route lookups in tenant namespace
#   MaaS: from litellm_api_endpoint / litellm_virtual_key
# LangFuse and MLflow tracing wired to per-tenant instances.
# -------------------------------------------------------------------
ocp4_workload_athena_tenant_langfuse_secret_key: "sk-lf-{{ common_password }}"
ocp4_workload_athena_tenant_langfuse_public_key: "pk-lf-{{ common_password }}"
ocp4_workload_athena_tenant_langfuse_host: "http://langfuse-web.{{ ocp4_workload_tenant_keycloak_username }}-agentic.svc.cluster.local:3000"
ocp4_workload_athena_tenant_mlflow_tracking_uri: "http://mlflow.mlflow.svc.cluster.local"
ocp4_workload_athena_tenant_mlflow_experiment_name: "{{ ocp4_workload_tenant_keycloak_username }}-agentic"
ocp4_workload_athena_tenant_mlflow_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_athena_tenant_mlflow_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# Showroom namespace: {{ username }}-showroom
# Route:             showroom-{{ username }}-showroom.{{ domain }}
# -------------------------------------------------------------------
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/agentic-aiops-showroom
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/agentic-ai-showroom-terminal:latest
ocp4_workload_showroom_content_antora_navbar_logo: summit
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 40
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: AAP2
    url: "https://aap-aap.{{ openshift_cluster_ingress_domain }}"
  - name: Kira
    url: "https://kira-frontend-{{ ocp4_workload_tenant_keycloak_username }}-agentic.{{ openshift_cluster_ingress_domain }}"
  - name: Terminal
    path: /terminal
    port: 443
  - name: RocketChat
    url: "https://rocketchat-{{ ocp4_workload_tenant_keycloak_username }}-agentic.{{ openshift_cluster_ingress_domain }}"
  - name: Gitea
    url: "https://gitea.{{ openshift_cluster_ingress_domain }}/{{ ocp4_workload_tenant_keycloak_username }}/agentic-devops-athena"
  - name: OpenShift Console
    url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
