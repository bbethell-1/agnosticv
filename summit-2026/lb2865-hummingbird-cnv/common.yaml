---
# -------------------------------------------------------------------
# --- Catalog Item: LB2865: Container hardening:
#                           From zero to hero with Red Hat
#                           Hardened Images
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
# cloud_provider_version: main
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
ai_workers_cores: 16
ai_workers_memory: 32Gi
# One additional worker for each 4 users
worker_instance_count: "{{ 1 + ((num_users | int / 4) | round(0, 'ceil') | int) }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"

  # Hummingbird Workshop Workloads
  - name: https://github.com/rhpds/hummingbird.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.6.0

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_rhacs
- agnosticd.core_workloads.ocp4_workload_quay_operator
- agnosticd.core_workloads.ocp4_workload_builds
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- rhpds.hummingbird.ocp4_workload_hummingbird
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads: []

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}
common_user_password: >-
  {{ lookup('password', output_dir ~ '/common_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"

ocp4_workload_authentication_num_users: "{{ num_users | int }}"
ocp4_workload_authentication_user_base: user
ocp4_workload_authentication_user_password: "{{ common_user_password }}"

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.19

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[email,groups]'

ocp4_workload_openshift_gitops_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.21
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_automatic_install_plan_approval: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: rhacs-4.10
ocp4_workload_rhacs_install_operator_namespace: rhacs-operator
ocp4_workload_rhacs_central_admin_password: "{{ common_admin_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_central_enable_console_plugin: true
ocp4_workload_rhacs_collector_config_enable: true
ocp4_workload_rhacs_enable_route_certs: true
ocp4_workload_rhacs_enable_vm_scanning: false
ocp4_workload_rhacs_install_roxctl: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_quay_operator
# -------------------------------------------------------------------
ocp4_workload_quay_operator_channel: stable-3.16
ocp4_workload_quay_operator_registry_namespace: quay
ocp4_workload_quay_operator_registry_admin_password: "{{ common_admin_password }}"
ocp4_workload_quay_operator_registry_hostname: quay

# -------------------------------------------------------------------
# Workload: ocp4_workload_builds
# -------------------------------------------------------------------
ocp4_workload_builds_channel: builds-1.7
ocp4_workload_builds_use_catalog_snapshot: false
ocp4_workload_builds_automatic_install_plan_approval: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.5"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
# ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
# ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: gitea-admin
ocp4_workload_gitea_operator_admin_email: gitea-admin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password}}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_user_base }}%d"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"

ocp4_workload_gitea_operator_migrate_repositories: false
ocp4_workload_gitea_operator_repositories_list: []
# - repo: https://github.com/rh-mad-workshop/modern-app-dev.git
#   name: modern-app-dev
#   branch: mta-lab
#   private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_hummingbird
# -------------------------------------------------------------------
ocp4_workload_hummingbird_num_users: "{{ ocp4_workload_authentication_num_users | int }}"
ocp4_workload_hummingbird_user_base: "{{ ocp4_workload_authentication_user_base }}"
ocp4_workload_hummingbird_user_password: "{{ common_user_password }}"

# Settings for the RHEL VMs
ocp4_workload_hummingbird_vm_name: rhel
ocp4_workload_hummingbird_vm_namespace_base: rhel
ocp4_workload_hummingbird_vm_datasource_name: hummingbird
ocp4_workload_hummingbird_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_hummingbird_vm_user: rhel
ocp4_workload_hummingbird_vm_password: "{{ common_user_password }}"
ocp4_workload_hummingbird_vm_disksize: 30Gi
ocp4_workload_hummingbird_vm_instancetype: u1.medium
ocp4_workload_hummingbird_vm_init_script_url: ""
# ocp4_workload_hummingbird_vm_init_script_url: https://raw.githubusercontent.com/rhpds/zero-cve-hummingbird-showroom/refs/heads/main/scripts/init-vm.sh

# VM Image for the RHEL VMs
# Location and credentials for the S3 bucket (s3-hummingbird-images user in AWS Infra Prod account)
ocp4_workload_hummingbird_datavolume_source: https://s3.us-east-1.amazonaws.com/rhdp-images/lb2865.qcow2
