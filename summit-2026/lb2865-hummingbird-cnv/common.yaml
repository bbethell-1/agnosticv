# Settings for the Builds section
ocp4_workload_hummingbird_namespace_base_list:
- hummingbird-builds
- hummingbird-production
- hummingbird-acs-lab
ocp4_workload_hummingbird_builds_quay_url: https://quay.{{ openshift_cluster_ingress_domain }}
ocp4_workload_hummingbird_builds_quay_admin: quayadmin
ocp4_workload_hummingbird_builds_quay_admin_password: "{{ common_admin_password }}"
ocp4_workload_hummingbird_builds_quay_user_password: "{{ common_user_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/hummingbird-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-20

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

