---

# tag: main
# tag_showroom: main

# ocp4_workload_authentication_keycloak_use_catalog_source: false
# ocp4_workload_pipelines_channel: latest
# ocp4_workload_pipelines_use_catalog_snapshot: false
# ocp4_workload_openshift_gitops_channel: latest
# ocp4_workload_openshift_gitops_use_catalog_snapshot: false
# ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_machineset_groups:

# Standard workers: m6a.4xlarge (16 vCPU / 64 GiB)
#   NOTE: 6 replicas for testing — production must be 12 to match
#   previous CNV sizing (12 x 16 cores / 64Gi per worker)
- name: worker-standard
  role: worker
  instance_type: m6a.4xlarge   # 16 vCPU / 64 GiB — OCP workloads
  total_replicas: "6"           # DEV: 6 for testing — PROD: bump to 12 (matches CNV sizing)
  total_replicas_min: "6"
  total_replicas_max: "12"
  root_volume_size: "100"

# Metal workers: m6a.metal (192 vCPU / 768 GiB) x2 — bare metal for OCP Virt
#   Tainted metal=reserved:NoSchedule so only VMs land here
#   Retries bumped to 60 (30 min) — m6a.metal boots in ~20-25 min
- name: worker-metal
  role: worker-metal
  instance_type: m6a.metal     # 192 vCPU / 768 GiB — bare metal, no hypervisor
  total_replicas: "2"
  total_replicas_min: "2"
  total_replicas_max: "2"
  root_volume_size: "200"
  machineConfigPool:
    setup: true
    maxPodsPerNode: 250         # 192 vCPU — allow more pods
  taints:
  - key: metal
    value: reserved
    effect: NoSchedule

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
