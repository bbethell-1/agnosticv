---

workloads:
# - agnosticd.core_workloads.ocp4_workload_authentication #already done in pool
# - agnosticd.core_workloads.ocp4_workload_openshift_gitops #already done in pool
- agnosticd.core_workloads.ocp4_workload_gitops_add_cluster
