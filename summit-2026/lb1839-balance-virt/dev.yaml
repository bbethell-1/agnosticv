#- agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

ai_control_plane_extra_disks:
- metadata:
    name: "first-extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "100Gi"
- metadata:
    name: "second-diskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "100Gi"
- metadata:
    name: "third-diskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "100Gi"
- metadata:
    name: "fourth-diskINSTANCENAME"
  spec:
    source:
      blank: {}
    storage:
      accessModes:
      - ReadWriteOnce
      volumeMode: Block
      storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        requests:
          storage: "100Gi"

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/balance-virt-automation.git
ocp4_workload_gitops_bootstrap_repo_revision: cross-cluster
ocp4_workload_gitops_bootstrap_repo_path: cluster/infra/bootstrap
ocp4_workload_gitops_bootstrap_application_health_retries: 150
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-infra"
ocp4_workload_gitops_bootstrap_helm_values:
  users:
    count: 1
  guid: "{{ guid }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
