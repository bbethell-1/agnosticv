---
# -------------------------------------------------------------------
# --- Catalog: Brand Events
# --- Catalog Item: LB2298: Modernizing Virtualization with
#                           Red Hat OpenShift Virtualization and
#                           IBM Fusion: A Hands-On Lab
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-3.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/ibm-fusion.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: aws
cloud_provider_version: main
config: openshift-cluster
tag: main
# -------------------------------------------------------------------
# Bastion VM Settings
# -------------------------------------------------------------------
bastion_setup_student_user: true
bastion_student_user_name: lab-user

host_common_packages_update_all: false

bastion_instance_image: RHEL96GOLD-latest

# -------------------------------------------------------------------
# OpenShift Settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.20"
host_ocp4_installer_info_set_user_data_kubeadmin_password: true
openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

# -------------------------------------------------------------------
# Cluster sizing
# -------------------------------------------------------------------
control_plane_instance_count: 3
control_plane_instance_type: m5a.2xlarge
control_plane_storage_type: io1

worker_instance_count: 3
worker_instance_type: m8i.4xlarge

# Override bastion instance definition to add two additional disks
instances:
- name: bastion
  count: 1
  unique: true
  public_dns: true
  image: "{{ bastion_instance_image }}"
  flavor:
    "ec2": "{{ bastion_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "Purpose"
    value: "{{ purpose }}"
  - key: "project"
    value: "{{ project_tag }}"
  - key: "user"
    value: "{{ bastion_student_user_name | default('not set') }}"
  rootfs_size: "{{ bastion_rootfs_size }}"
  security_groups:
  - BastionSG
  volumes:
  - name: /dev/sdb
    size: 250
  - name: /dev/sdc
    size: 250

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  # Partner workloads (IBM Software)
  - name: https://github.com/rhpds/partner_workloads.git
    type: git
    version: "{{ tag }}"
  # Showroom
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.5.7

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_cert_manager
- rhpds.partner_workloads.ocp4_workload_ibm_fusion
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1

ocp4_workload_cert_manager_aws_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_aws_region: "{{ aws_region }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ibm_fusion
# -------------------------------------------------------------------
ocp4_workload_ibm_fusion_catalog_source_tag: latest
ocp4_workload_ibm_fusion_update_default_storage_class: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_enabled_nested_kvm: true
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-virt-ibm-fusion-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: default-site.yml

ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

