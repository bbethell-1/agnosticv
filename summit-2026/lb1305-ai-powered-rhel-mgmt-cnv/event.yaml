---
#include /includes/zerotouch-access-disable-limits.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, e
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements - AgnosticD v2
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "5dd2c5cd61d0bf9645e2110bc82011afa1c26095"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "4274a86ac032d7309cfae9b243bdb3439a2a6b5f"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.10
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "66bb2793a37c06c6306a09196d39a093ac978768"
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "b466e697f4d420f31f336ddf9f92cfb94c29ce6d"
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "1.3.2"
    - name: https://github.com/rhpds/rhpds.rhel_management.git
      type: git
      version: "c984b381aacacbe234aee78b054b8ed3580e7794"

ocp4_workload_litellm_virtual_keys_models:
 # - 'minimax-m2'
  - 'claude-opus-4-6'

# -------------------------------------------------------------------
# Role: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/ai-powered-rhel-mgmt-showroom.git
showroom_git_ref: "cbe9ef2cb2000ab89ea13821f6c9e9a77312559e"
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "bastion-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"

showroom_terminal2_ssh_username: lab-user
showroom_terminal2_ssh_password: "{{ common_password }}"
showroom_terminal2_ssh_host: mcp-{{ guid }}
showroom_terminal2_ssh_port: 22
# showroom_tty_image: quay.io/rhpds/wetty
# showroom_tty_image_tag: v3.0

showroom_tab_services:
  - single_terminal
  - second_terminal

showroom_antora_enable_dev_mode: "false"

# Runner for ZT Solve/Validate buttons
showroom_ansible_runner_api: true
# showroom_ansible_runner_image: quay.io/rhpds/zt-runner
# showroom_ansible_runner_image_tag: v2.5.0
# showroom_ansible_runner_path: "/stream"
showroom_nookbag_sidecar_enable: false
showroom_runtime_automation_environment_variables:
  ANSIBLE_CONFIG: "/showroom/repo/runtime-automation/ansible.cfg"
  SSH_HOSTNAME: "{{ openshift_cnv_ssh_address }}"
  SSH_PORT: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  SSH_USER: "{{ student_name }}"
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: lb1305-event-1.0.0
