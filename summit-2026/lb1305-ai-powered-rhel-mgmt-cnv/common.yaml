# -------------------------------------------------------------------
# --- Catalog: Summit 2026
# --- Catalog Item: LB1305 - AI-Powered RHEL Management with MCP & Satellite
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform - AgnosticD v2
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{  subdomain }}"
bastion_ssh_password: "{{ common_password }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=16, chars=['ascii_letters', 'digits', '@#$-_^='])
  }}


# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.7
node_instance_image: rhel-10.1
mcp_instance_image: rhel-10.1
satellite_instance_image: satellite-server-rhdp-1-6-18-10-11-25

bastion_rootfs_size: 50Gi
node_rootfs_size: 50Gi
mcp_rootfs_size: 60Gi
satellite_rootfs_size: 540Gi

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
    routes:
      - name: bastion-80
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge

  - name: "satellite"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ satellite_instance_image }}"
    bootloader: efi
    memory: 32G
    cores: 8
    image_size: "{{ satellite_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "satellites"
      - key: "ostype"
        value: "linux"
    userdata: |
      #cloud-config
      fqdn: satellite.lab
      hostname: satellite
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    services:
      - name: satellite
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: satellite-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: satellite-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: satellite-443
    routes:
      - name: satellite-80
        host: satellite
        service: satellite
        targetPort: 80
        tls: false
      - name: satellite-443
        host: satellite
        service: satellite
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
