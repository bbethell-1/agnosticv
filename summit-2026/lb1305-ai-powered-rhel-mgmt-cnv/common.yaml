# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: F5854BFF-5EFF-4D9D-8DBA-B14E2A51477C
  owners:
    maintainer:
      - name: John Spinks
        email: jspinks@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1305 - AI-Powered RHEL Management with MCP & Satellite"
    workshopLabUiRedirect: true
    category: Brand_Events
    keywords:
      - summit-2026
      - lb1305
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
