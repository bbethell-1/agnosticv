# Runner for ZT Solve/Validate buttons
showroom_ansible_runner_api: true
# showroom_ansible_runner_image: quay.io/rhpds/zt-runner
# showroom_ansible_runner_image_tag: v2.5.0
# showroom_ansible_runner_path: "/stream"
showroom_nookbag_sidecar_enable: false
showroom_runtime_automation_environment_variables:
  ANSIBLE_CONFIG: "/showroom/repo/runtime-automation/ansible.cfg"
  SSH_HOSTNAME: "{{ openshift_cnv_ssh_address }}"
  SSH_PORT: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  SSH_USER: "{{ student_name }}"

# -------------------------------------------------------------------
# Role: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ subdomain }}"
  guid: "{{ guid }}"
  satellite_url: https://satellite-{{ subdomain_base }}
  satellite_username: admin
  satellite_password: "{{ common_password }}"
  satellite_internal_name: "{{ satellite_reconfigure_new_hostname }}"
  bastion_ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  bastion_ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  bastion_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  bastion_ssh_user_name: "{{ student_name }}"
  bastion_ssh_password: "{{ common_password }}"
  mcp_server_8080: https://mcp-{{ subdomain_base }}
  mcp_server_9090: https://mcp-server-{{ subdomain_base }}
  run_e2e_load_test: "{{ run_e2e_load_test }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f5854bff-5eff-4d9d-8dba-b14e2a51477c
  owners:
    maintainer:
      - name: John Spinks
        email: jspinks@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1305 - AI-Powered RHEL Management with MCP & Satellite"
    category: Brand_Events
    keywords:
      - summit-2026
      - lb1305
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
      Platform: RHEL
      TDP1: Server_Cloud_OS
    parameters:
      - name: run_e2e_load_test
        description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
        formLabel: "Run E2E Load Test"
        openAPIV3Schema:
          type: boolean
          default: false
    reportingLabels:
      primaryBU: RHEL
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
