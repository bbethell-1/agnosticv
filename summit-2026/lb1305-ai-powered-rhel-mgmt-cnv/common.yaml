  - name: "node"
    count: 4
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 2G
    cores: 2
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: node-22

  - name: "mcp"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ mcp_instance_image }}"
    memory: 2G
    cores: 2
    image_size: "{{ mcp_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: node-22

# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main  # Override in prod.yaml with specific release tag

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements - AgnosticD v2
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.0
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Infra Workloads - AgnosticD v2
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - host_satellite_repositories
    - agnosticd.cloud_vm_workloads.control_user
    - host_common_packages

software_workloads:
  all:
    - rhpds.manage_host.asset_injector

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions:
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Workload: host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false

bastion_host_packages:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  # - ansible

node_host_packages:
  - skopeo
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget

# Extra packages set dynamically based on group membership
host_common_packages_extra: >-
  {{
    bastion_host_packages
     if 'bastions' in group_names
      else
        node_host_packages if ('bastions' not in group_names and 'satellites' not in group_names)
          else
              []
  }}

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# Role: rhpds.manage_host.asset_injector
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted


# Set asset_injector_assets based on group membership
asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names
      else
        []
  }}

# -------------------------------------------------------------------
# Role: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/ai-powered-rhel-mgmt-showroom.git
showroom_git_ref: main
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "bastion-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"
showroom_tab_services:
  - single_terminal

showroom_antora_enable_dev_mode: "false"
showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: '>_Terminal-01'
      path: /wetty
      port: 443
    - name: 'Satellite'
      url: "https://satellite-{{ subdomain }}"

# -------------------------------------------------------------------
# Role: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{  subdomain }}"
  guid: "{{ guid }}"
  satellite_url: https://satellite-{{ subdomain_base }}
  satellite_username: admin
  satellite_password: bc31c9a6-9ff0-11ec-9587-00155d1b0702
  bastion_ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  bastion_ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  bastion_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  bastion_ssh_user_name: "{{ student_name }}"
  bastion_ssh_password: "{{ common_password }}"

