satellite_reconfigure_username: admin
satellite_reconfigure_new_admin_password: "{{ common_password }}"
satellite_reconfigure_org: "Acme Org"

# -------------------------------------------------------------------
# Workload: rhpds.rhel_management.insights_host
# -------------------------------------------------------------------
insights_host_org: 19209301
insights_host_activation_key: RHS-2026-lb1305

# -------------------------------------------------------------------
# Workload: rhpds.rhel_management.satellite_host
# -------------------------------------------------------------------
satellite_host_katello_ca_rpm: http://{{ satellite_reconfigure_new_hostname }}/pub/katello-ca-consumer-latest.noarch.rpm
satellite_host_org: "Acme_Org"
satellite_host_activation_key: satellite
satellite_host_verify_ssl: false
satellite_host_disable_gpg_check: true

