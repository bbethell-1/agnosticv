# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main  # Override in prod.yaml with specific release tag

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements - AgnosticD v2
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.6.4
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.rhel_management.git
      type: git
      version: main

# -------------------------------------------------------------------
# Infra Workloads - AgnosticD v2
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - host_satellite_repositories
    - host_common_packages
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  servers:
    - host_satellite_repositories
    - host_common_packages
  rhel10_nodes:
    - host_satellite_repositories
    - host_common_packages
  nodes:
    - host_satellite_repositories
    - host_common_packages

software_workloads:
  all:
    - agnosticd.cloud_vm_workloads.control_user
    - rhpds.manage_host.asset_injector

  satellites:
    - rhpds.rhel_management.satellite_reconfigure

  servers:
    - rhpds.rhel_management.satellite_host
    - rhpds.rhel_management.mcp_host

  rhel10_nodes:
    - rhpds.rhel_management.insights_host

  nodes:
    - rhpds.rhel_management.satellite_host

post_software_final_workloads:
  bastions:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------------------------
# Pre-destroy workloads AgnosticD v2
# -------------------------------------------------------------------
pre_destroy_workloads:
  localhost:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Workload: rhpds.rhel_management.satellite_reconfigure
