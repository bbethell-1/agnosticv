  - name: "rhel-1-{{ guid }}"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 2G
    cores: 2
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
