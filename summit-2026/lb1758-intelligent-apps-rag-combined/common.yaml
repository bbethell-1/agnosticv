---
# ===================================================================
# LB1758: Building Intelligent Apps with Python and RAG (Combined)
#
# JIRA: GPTEINFRA-16720
#
# Merges cluster CI (lb1758-intelligent-apps-rag-cluster) and tenant
# CI (lb1758-intelligent-apps-rag-tenant) into a single catalog item
# using the ocp4_workload_multi_tenant_loop bridge role.
# ===================================================================
#include /includes/ansible_control_plane/prod_controllers_lb.yaml
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift-ai.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/litemaas-master_api.yaml
#include /includes/parameters/litellm_metadata.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
cloud_provider: none
config: openshift-workloads

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

num_users: 1
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for tenant roles
# Tenant roles default to sandbox SA token. In the combined CI the
# cluster's own admin token is the SA token.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 10
ai_workers_cores: 16
ai_workers_memory: 32Gi

# ===================================================================
# Collections
# TODO: Change core_workloads to main/tag after bridge role PR merges
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main

  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.0.0"

  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12


  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: main

# ===================================================================
# Cluster-level workloads (run once by config)
#
# litellm runs here to create a cluster-level key whose user_info
# data (litellm_api_base_url, litellm_user1_virtual_key) is read by
# showroom_ai_assistant. It also runs per user in tenant_workloads
# to create per-user keys for gitops_bootstrap — tenant overrides
# (alias, user_info disable) are in tenant_workload_vars below.
#
# NOTE: gitops_bootstrap is NOT here — it runs at both cluster and
# tenant level with different vars. Moved to tenant_cluster_workloads
# (Phase 0) and tenant_workloads (Phase 1) to avoid extra_vars
# precedence conflict.
# ===================================================================
workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_authorino
- agnosticd.core_workloads.ocp4_workload_amq_streams
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.core_workloads.ocp4_workload_servicemesh2
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Cluster workloads inside bridge (Phase 0, runs ONCE)
#
# gitops_bootstrap runs at BOTH cluster and tenant level with
# different vars for the same variable names (repo_path,
# application_name, helm_values). Can't define either set at the
# top level because they become extra_vars which nothing overrides.
# Phase 0 runs the cluster invocation inside the bridge via set_fact.
# ===================================================================
tenant_cluster_workloads:
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap

tenant_cluster_workloads_vars:
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_path: bootstrap
    ocp4_workload_gitops_bootstrap_application_name: bootstrap
    ocp4_workload_gitops_bootstrap_application_wait: false
    ocp4_workload_gitops_bootstrap_helm_values:
      bootstrap:
        targetRevision: "{{ ocp4_workload_gitops_bootstrap_repo_revision }}"

# ===================================================================
# Tenant workloads (run per user, Phase 1)
#
# Order matters:
#   1. litellm — creates per-user key, sets litellm_virtual_key fact
#   2. keycloak_user — creates the user in Keycloak
#   3. tenant_namespace — creates user namespaces
#   4. gitops_bootstrap — consumes litellm_virtual_key from step 1
#   5. showroom — deploys lab UI into user's namespace
#   6. runtime_automation — FTL runner SA (needs showroom namespace)
# ===================================================================
tenant_workloads:
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- rhpds.ftl.ocp4_workload_runtime_automation_k8s

# Per-workload var overrides for tenant gitops_bootstrap.
# Applied via set_fact before include_role (AAP rejects Jinja2 dicts
# in include_role vars:).
tenant_workload_vars:
  rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys:
    ocp4_workload_litellm_virtual_keys_alias_format: >-
      virtkey-{{ ocp4_workload_tenant_keycloak_username }}-{{ guid }}
    ocp4_workload_litellm_virtual_keys_enable_user_info_messages: false
    ocp4_workload_litellm_virtual_keys_enable_user_info_data: false
  agnosticd.core_workloads.ocp4_workload_gitops_bootstrap:
    ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
    ocp4_workload_gitops_bootstrap_application_name: >-
      bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}
    ocp4_workload_gitops_bootstrap_helm_values:
      bootstrap:
        targetRevision: "{{ ocp4_workload_gitops_bootstrap_repo_revision }}"
      tenant:
        username: "{{ ocp4_workload_tenant_keycloak_username }}"
        domain: "{{ openshift_cluster_ingress_domain }}"
        litellmKey: "{{ litellm_virtual_key }}"

# ===================================================================
# Destroy
# ===================================================================
tenant_remove_workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

remove_workloads:
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# ===================================================================
# Per-user data for Babylon (Phase 2)
# Route pattern: showroom (route name) + user1-showroom (namespace)
# = showroom-user1-showroom.apps.domain
# ===================================================================
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  # Report common_password (not the bridge's auto-generated per-user password)
  # because Keycloak was created with ocp4_workload_tenant_keycloak_user_password
  # = common_password (top-level extra_var, can't be overridden by bridge set_fact).
  # combine() in register_user.yml puts tenant_user_info_data last, so this wins.
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Cluster workload variables
# ===================================================================

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}
common_admin_password: "{{ common_password }}"
common_admin_username: admin

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi
ocp4_workload_openshift_gitops_controller_requests_memory: 8Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# -------------------------------------------------------------------
# Workload: ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_serving: true
ocp4_workload_serverless_install_eventing: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_servicemesh2
# -------------------------------------------------------------------
ocp4_workload_servicemesh2_es: false
ocp4_workload_servicemesh2_jaeger: false
ocp4_workload_servicemesh2_kiali: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_automatic_install_plan_approval: false
ocp4_workload_openshift_ai_channel: fast-3.x
ocp4_workload_openshift_ai_starting_csv: "rhods-operator.3.2.0"
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_aipipelines: Managed
ocp4_workload_openshift_ai_modelmeshserving: Removed

# -------------------------------------------------------------------
# gitops_bootstrap — shared repo URL and revision
# Path and app name are set per invocation via tenant_*_vars
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lb1768-intelligent-apps-rag-automation
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_health_retries: 2

# ===================================================================
# Tenant workload variables
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_litellm_virtual_keys
#
# Runs TWICE: once at cluster level (workloads list) and once per
# user (tenant_workloads). Top-level vars apply to the cluster
# invocation — user_info enabled so showroom_ai_assistant can read
# litellm_api_base_url and litellm_user1_virtual_key from user-data.
#
# Tenant invocation overrides alias (per-user) and disables user_info
# via tenant_workload_vars above.
#
# multi_user: false prevents auto-detection from num_users > 1 which
# writes per-user data to user-data.yaml, triggering showroom's
# multi-user namespace path.
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
- nomic-embed-text-v1-5
- granite-4-0-h-tiny
- qwen3-14b
ocp4_workload_litellm_virtual_keys_multi_user: false
ocp4_workload_litellm_virtual_keys_user_count: 1
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_prefix: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

# Namespace pattern: {{ username }}-showroom (not showroom-{{ username }})
# Route becomes: showroom-user1-showroom (clean, no double-showroom)
ocp4_workload_tenant_namespace_namespaces:
- "{{ ocp4_workload_tenant_keycloak_username }}"
- "{{ ocp4_workload_tenant_keycloak_username }}-showroom"

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "4"
  requests.cpu: "4"
  limits.memory: 12Gi
  requests.memory: 12Gi
  requests.storage: 100Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 4Gi
  defaultRequest:
    cpu: 250m
    memory: 1Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_openshift_api_token: "{{ openshift_api_key }}"
ocp4_workload_showroom_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/intelligent-apps-python-rag-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ tag }}"
ocp4_workload_showroom_content_only: true
ocp4_workload_showroom_namespace_display: "LB1758: Building Intelligent Apps with Python and RAG"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
ocp4_workload_showroom_passthrough_user_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_runtime_automation_k8s (FTL)
# -------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: true
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ openshift_api_key }}"

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: eee34ae2-07bb-4d82-9939-2a69a9fb61fc
  owners:
    maintainer:
    - email: rshah@redhat.com
      name: Ritesh Shah
    - email: cnuland@redhat.com
      name: Christopher Nuland
    - email: cclyburn@redhat.com
      name: Cedric Clyburn
    - email: nvinto@redhat.com
      name: Natale Vinto
    sme:
    - email: cnuland@redhat.com
      name: Christopher Nuland
    - email: cclyburn@redhat.com
      name: Cedric Clyburn
    - email: nvinto@redhat.com
      name: Natale Vinto

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      LB1758: Building Intelligent Apps with RAG (Combined)
    category: Brand_Events
    keywords:
    - lb1758
    - summit-2026
    - openshift ai
    - RAG
    - pipeline
    - combined
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
      Platform: AI
      TDP1: AI_Platform
    parameters:
    - name: num_users
      description: "Number of tenant users to provision"
      formLabel: "Number of Users"
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 24
    reportingLabels:
      primaryBU: Artificial_Intelligence
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi

  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-virt-labs-pool
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # Needed for scaling cluster with workers
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace

  tower:
    timeout: 21600
