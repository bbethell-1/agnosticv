---
#include /includes/zerotouch-access-disable-limits.yaml
#include /includes/access-restriction-admins-only.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, e
# -------------------------------------------------------------------
purpose: event
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "db6a7ecd7870a6e08552c5d7fc6eed56160b8802"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.9

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/balance-virt-automation.git
ocp4_workload_gitops_bootstrap_repo_revision: "4d44050be84b656accc3be18152a3702df28cec5"
ocp4_workload_gitops_bootstrap_repo_path: cluster/infra/bootstrap
ocp4_workload_gitops_bootstrap_application_health_retries: 150
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-infra"
ocp4_workload_gitops_bootstrap_helm_values:
  users:
    count: 1
  guid: "{{ guid }}"

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/balance-virt-showroom.git
ocp4_workload_showroom_content_git_repo_ref: v1.0.1
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_antora_enable_dev_mode: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: lb1839-event-1.0.2
