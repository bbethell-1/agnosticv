---

# tag: main
# tag_showroom: v1.6.7
# tag_litellm: 1.3.1

# ocp4_workload_showroom_deployer_chart_version: "^2.0.0"
# ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
ocp4_workload_showroom_antora_enable_dev_mode: "true"

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  catalog:
    parameters:
    - name: showroom_repo_revision
      description: Showroom Repository Revision
      formLabel: Showroom Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: gitops_repo_revision
      description: GitOps Repository Revision
      formLabel: GitOps Repository Revision
      required: true
      openAPIV3Schema:
        type: string
        default: main

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: aws-dedicated-shared
      lab: lb2862-ai-app-dev
      purpose: dev
    tenant_cluster:
      item: summit-2026/lb2862-ai-app-dev-cluster
