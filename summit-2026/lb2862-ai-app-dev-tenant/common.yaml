---

# -------------------------------------------------------------------
# --- LB2862: AI App Development from Desktop to Production
# -------------------------------------------------------------------
# --- This catalog item combines:
# ---   - Sandbox/namespace architecture (no cluster provisioning)
# ---   - Multi-user support with per-user namespaces
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-virtualization.yaml

#include /includes/sandbox-api.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

# Required by litellm
#include /includes/secrets/litemaas-master_api.yaml
### Hardcoded litellm metadata for summit
requester_email: summit-{{guid}}@demo.redhat.com
catalog_item_name: summit-2026.lb2862-ai-app-dev-tenant.event

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: namespace
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_showroom: v1.6.9
tag_ftl: v5.5.0
tag_litellm: 1.3.1
gitops_repo_revision: v1.0.1
showroom_repo_revision: v1.0.2

# -------------------------------------------------------------------
# Additional Collections & roles to be installed
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "{{ tag_litellm }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: "{{ tag_showroom }}"
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "{{ tag_ftl }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads: >-
  {{
    [
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user',
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace',
      'rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys',
      'agnosticd.showroom.ocp4_workload_showroom',
      'agnosticd.core_workloads.ocp4_workload_gitops_bootstrap',
      'rhpds.ftl.ocp4_workload_runtime_automation_k8s'
    ] +
    (
      ['rhpds.ftl.ocp4_runtime_automation_load_test']
      if run_e2e_load_test | default(false) | bool
      else []
    )
  }}

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_username: "user-{{ guid }}"
ocp4_workload_user_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"
ocp4_workload_namespace_suffix: demo

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
# Two namespaces per student:
#   user-guid-demo  — OCP workloads (ArgoCD, apps, Showroom)
#   user-guid-vm    — RHEL VM + noVNC proxy (created by AgV)
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: false

ocp4_workload_tenant_namespace_suffixes:
- suffix: "{{ ocp4_workload_namespace_suffix }}"
  quota:
    limits.cpu: "22"
    requests.cpu: "6"
    limits.memory: 41Gi
    requests.memory: 26Gi
    requests.storage: 300Gi
  limit_range:
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 1Gi

- suffix: vm
  quota:
    limits.cpu: "10"
    requests.cpu: "5"
    limits.memory: 17Gi    # VM 8G + noVNC proxy ~256Mi
    requests.memory: 11Gi
    requests.storage: 40Gi
  limit_range:
    default:
      cpu: "4"
      memory: 16Gi         # must be >= VM memory for virt-launcher pod
    defaultRequest:
      cpu: 250m
      memory: 1Gi

# -------------------------------------------------------------------
# rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_multi_user: false
ocp4_workload_litellm_virtual_keys_user_count: 1
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
- qwen3-14b
- claude-opus-4-6

# -------------------------------------------------------------------
# agnosticd.showroom.ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ai-app-dev-showroom
ocp4_workload_showroom_content_git_repo_ref: "{{ showroom_repo_revision }}"

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 2.1.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09

# Podman Desktop tab points to the per-student noVNC Route (no SSO needed)
# Route is: novnc-{username}-vm.{ingress_domain}
# noVNC proxy (bootstrap-tenant novnc.yaml) tunnels VNC via oc port-forward
ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: OCP Console
      url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
    - name: Developer Hub
      url: 'https://backstage-developer-hub-rhdh.{{ openshift_cluster_ingress_domain }}'
    - name: Gitlab
      url: 'https://gitlab-gitlab.{{ openshift_cluster_ingress_domain }}'
    - name: ArgoCD
      url: 'https://argocd-server-{{ ocp4_workload_username }}-{{ ocp4_workload_namespace_suffix }}.{{ openshift_cluster_ingress_domain }}'

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ai-app-dev-automation
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-tenant
ocp4_workload_gitops_bootstrap_application_project: tenants
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-{{ guid }}"

ocp4_workload_gitops_bootstrap_helm_values:
  username: "{{ ocp4_workload_username }}"
  password: "{{ ocp4_workload_user_password }}"
  namespaceSuffix: "{{ ocp4_workload_namespace_suffix }}"
  gitea: ""
  llm:
    endpoint: "{{ lookup('agnosticd_user_data', 'litellm_api_base_url') }}"
    apiKey: "{{ lookup('agnosticd_user_data', 'litellm_virtual_key') }}"
    modelName: qwen3-14b

# -------------------------------------------------------------------
# rhpds.ftl.ocp4_workload_runtime_automation_k8s
# -------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: false

ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token }}"

ocp4_workload_runtime_automation_k8s_username: "{{ ocp4_workload_username }}"
ocp4_workload_runtime_automation_k8s_namespace_suffixes: "{{ ocp4_workload_tenant_namespace_suffixes }}"
ocp4_workload_runtime_automation_k8s_showroom_namespace: "{{ ocp4_workload_showroom_namespace }}"

# -------------------------------------------------------------------
# rhpds.ftl.ocp4_runtime_automation_load_test
# -------------------------------------------------------------------
zt_load_test_ocp_showroom_namespace: "{{ ocp4_workload_showroom_namespace }}"
zt_load_test_ocp_openshift_api_url: "{{ sandbox_openshift_api_url }}"
zt_load_test_ocp_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3bb9675d-47d7-4b89-82bc-8a4d15914c4e
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: James Falkner
      email: jfalkner@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2862: AI App Development from Desktop to Production"
    category: Brand_Events
    keywords:
    - podman
    - gitops
    - pipelines
    - summit-2026
    - lb2862
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
    parameters:
    - name: run_e2e_load_test
      description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
      formLabel: "Run E2E Load Test"
      openAPIV3Schema:
        type: boolean
        default: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
    workshopLabUiRedirect: true
    # Provision doesn't call `agnosticd_user_info` with `user` set and so does
    # not report `users` in `provision_data`. All data and messages are
    # assigned directly to the workshop seat.
    workshop_user_mode: none

  sandbox_api:
    actions:
      destroy:
        catch_all: false
