---
#include /includes/zerotouch-access-disable-limits.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: lb2131-event-1.0.0
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv09
        purpose: events
        virt: "yes"
      quota:
        limits.cpu: "640"
        requests.cpu: "640"
        limits.memory: "1000Gi"
        requests.memory: "1000Gi"
        requests.storage: "2000Gi"
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
