---
# -------------------------------------------------------------------
# --- Catalog Item: AI Lightning Labs - Cluster Provisioner
# -------------------------------------------------------------------
# Deploys a shared OpenShift cluster sized for N tenants.
# Registers with the OcpSandbox API so tenant CIs can target it.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml


#include /includes/secrets/ocp4_ai_offline_token.yaml

#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
num_users: 0

clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Additional Collections & Roles
# ===================================================================
tag: main
requirements_content:
  collections:
    # Assisted Installer — required for openshift_cnv_scale_cluster
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9

    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.11

# ===================================================================
# Cluster Sizing
# Autoscales CNV pool to add 3 workers on top of base cluster.
# Math: 3 workers = supports ~N tenant placements (adjust as needed).
# ===================================================================
openshift_cnv_scale_cluster: true
worker_instance_count: 3
ai_workers_cores: 8
ai_workers_memory: 32Gi
ai_workers_root_disk_size: 300Gi

# ===================================================================
# List of Workloads
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_ocp_console_embed

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: >-
  {{ lookup('password', output_dir ~ '/common_admin_password length=16 chars=ascii_letters,digits') }}
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_02_23

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_keycloak_default_realm: sso

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: latest
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: "[name,groups]"

# ArgoCD resource sizing — defaults are too low for multi-tenant cluster
ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 250m
ocp4_workload_openshift_gitops_repo_requests_memory: 256Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 4Gi

ocp4_workload_openshift_gitops_controller_requests_cpu: 250m
ocp4_workload_openshift_gitops_controller_requests_memory: 1Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "2"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ai-lightning-labs-automation
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: cluster/infra/bootstrap
ocp4_workload_gitops_bootstrap_application_name: bootstrap
ocp4_workload_gitops_bootstrap_health_retries: 2

