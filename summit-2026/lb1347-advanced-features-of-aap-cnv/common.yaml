---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/sandbox-api.yaml
#include /includes/secrets/demosat-rhel-9-latest-and-aap25.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/registry-redhat.yaml

# -------------------------------------------------------------------
# --- Catalog Item: LB1347 Advanced features of Ansible Automation Platform
#                   - Automation Controller
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ subdomain }}"
bastion_ssh_password: "{{ common_password }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=16, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# CNV-specific settings
# -------------------------------------------------------------------
openshift_cnv_legacy_routes: false
openshift_cnv_route_remove_x_frame_options_header: true

# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main  # Override in prod.yaml with specific release tag

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.10
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Instances to deploy
# -------------------------------------------------------------------
# ------------------------
# Instance Images
# ------------------------
bastion_instance_image: rhel-9.6
controller_instance_image: aap-2.6-2-ceh-20251103
node_instance_image: rhel-9.6
ssap_instance_image: ssap-11032026

ssap_rootfs_size: 50Gi
bastion_rootfs_size: 50Gi
controller_rootfs_size: 100Gi
node_rootfs_size: 50Gi

# ------------------------
# Instances (VMs)
# ------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ bastion_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 3000
            protocol: TCP
            targetPort: 3000
            name: bastion-3000
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
          - port: 8181
            protocol: TCP
            targetPort: 8181
            name: bastion-8181
    routes:
      - name: bastion-80
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge
      - name: bastion-3000
        host: gitea
        service: bastion
        targetPort: 3000
        tls: true
        tls_termination: edge
      - name: bastion-8080
        host: vscode
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge
      - name: bastion-8181
        host: opa
        service: bastion
        targetPort: 8181
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    userdata: |-
      #cloud-config
      user: rhel
      password: "{{ common_password }}"
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
