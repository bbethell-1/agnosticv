# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - agnosticd.cloud_vm_workloads.control_user
  bastions:
    - host_satellite_repositories
    - host_common_packages
  nodes:
    - host_satellite_repositories
    - host_common_packages

software_workloads:
  bastions:
    - rhpds.manage_host.vscode_server
    - rhpds.manage_host.gitea_vm_setup
    - rhpds.manage_host.aap_devel_tools
    - rhpds.manage_host.opa_setup
    - infra.aap_configuration.dispatch
  servers:
    - rhpds.manage_host.ssap_setup

post_software_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  all:
    - rhpds.manage_host.asset_injector

post_software_final_workloads:
  bastions: >-
    {{
      [
        'agnosticd.showroom.vm_workload_showroom',
        'rhpds.ftl.vm_workload_runtime_automation'
      ] +
      (
        ['rhpds.ftl.vm_runtime_automation_load_test']
        if run_e2e_load_test | default(false) | bool
        else []
      )
    }}

# -------------------------------------------------------------------
# Workload: rhpds.manage_host.opa_setup
# -------------------------------------------------------------------
opa_use_config_file: false

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Workload: host_common_packages
# -------------------------------------------------------------------
install_common_packages: true
host_common_packages_update_all: false
host_common_packages_extra:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - nginx

# -------------------------------------------------------------------
# Workload: control_user
# -------------------------------------------------------------------
env_authorized_key: "{{ guid }}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# Workload: bastion
# -------------------------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------------------------
# Workload: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: false
vscode_server_bind_addr_ip: 0.0.0.0
vscode_server_bind_addr_port: 8080

vscode_server_version: "4.95.3"
vscode_server_rpm_url: >-
  https://github.com/coder/code-server/releases/download/v{{ vscode_server_version }}/code-server-{{ vscode_server_version }}-amd64.rpm

vscode_server_ansible_become: true
vscode_user_workspace_path: "/home/{{ student_name }}"
vscode_auth_type: password
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_hostname: "vscode-{{ subdomain }}"
vscode_ansible_python_interpreter: /usr/bin/python3
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.kube": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true },
  "security.workspace.trust.enabled": false

# -------------------------------------------------------------------
# Workload: gitea_vm_setup
# -------------------------------------------------------------------
gitea_http_listen: "0.0.0.0"
gitea_db_password: "{{ common_password }}"
gitea_create_url: "https://gitea-{{ subdomain }}"
gitea_require_signin: false
gitea_vm_repos:
  - name: playbooks-adv-controller
    url: https://gitlab.com/ansible-labs-crew/playbooks-adv-controller-2025.git
  - name: shared-apache-role
    url: https://gitlab.com/ansible-labs-crew/shared-apache-role.git
  - name: playbooks-dev
    url: https://gitlab.com/ansible-labs-crew/playbooks-dev.git
  - name: playbooks-ops
    url: https://gitlab.com/ansible-labs-crew/playbooks-ops.git
  - name: opa-policy-enforcement
    url: https://gitlab.com/ansible-labs-crew/policy-enforcement.git
  - name: ssap-customtemplates
    url: https://gitlab.com/ansible-labs-crew/ssap-customtemplates.git

# -------------------------------------------------------------------
# Workload: ansible_automation_platform_configuration
# -------------------------------------------------------------------
aap_image_admin_password: !vault |
  $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
  32373239343436383338306534653935303666313835656336663537303765313731303463653934
  3436643364366331316465643465343034633539633330380a623937623535653434393931353437
  66353462343134626664323931396164363063636339333436653332653131343065393333373631
  3132353739633633330a396632613537343262666530393366626461343937623330656138373131
  3239
ansible_automation_platform_configuration_host: "https://controller-{{ subdomain }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "{{ aap_image_admin_password }}"
ansible_automation_platform_configuration_verify_ssl: false


controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

aap_configuration_dispatcher_roles:
  - {role: controller_license, var: controller_license, tags: controller_license}
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_settings, var: controller_settings, tags: controller_settings}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}

controller_license:
  manifest_url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

gateway_settings:
  SESSION_COOKIE_AGE: 9000

controller_settings:
  settings:
    OPA_HOST: bastion

aap_user_accounts:
  - username: "lab-user"
    is_superuser: true
    password: "{{ common_password }}"
    email: "lab-user@redhat.com"
    organizations: "Default"
    first_name: "lab"
    last_name: User

# -------------------------------------------------------------------
# Workload: aap_devel_tools
# -------------------------------------------------------------------
aap_devel_tools_users:
  - "{{ student_name }}"
aap_devel_tools_repos_enable: false
aap_devel_tools_packages:
  - ansible-lint
  - ansible-test
  - ansible-creator
  - ansible-navigator
  - ansible-builder

aap_devel_tools_ee_image: "controller-{{ subdomain }}/ee-supported-rhel9:latest"
aap_devel_tools_env_pass:
  - GUID
aap_devel_tools_env_set:
  CONTROLLER_HOST: "{{ ansible_automation_platform_configuration_host }}"
  CONTROLLER_USERNAME: "{{ student_name }}"
  CONTROLLER_PASSWORD: "{{ common_password }}"
  CONTROLLER_VERIFY_SSL: false

# -------------------------------------------------------------------
# Role: rhpds.manage_host.asset_injector
# -------------------------------------------------------------------
common_asset_injector_modules:
  - description: Remove insights-client package
    become: true
    module: dnf
    name: insights-client
    state: absent

  - description: Insert GUID in .bashrc
    module: lineinfile
    path: /home/{{ student_name }}/.bashrc
    create: true
    state: present
    insertafter: 'EOF'
    line: export GUID={{ guid }}

  - description: Create ansible group_vars directory
    module: file
    path: /etc/ansible/group_vars/
    state: directory

  - description: Create ansible all directory
    module: file
    path: /etc/ansible/group_vars/all
    state: directory

  - description: Save agnosticd_user_info
    module: lineinfile
    path: /etc/ansible/group_vars/all/agnosticd_user_data.yml
    create: true
    state: present
    insertafter: 'EOF'
    line: |
      ---
      {{ lookup ('agnosticd.core.agnosticd_user_data', '*' ) |  to_nice_yaml }}

  - description: Remove existing hosts
    module: file
    path: /etc/ansible/hosts
    state: absent

  - description: Create ansible inventory
    module: lineinfile
    path: /etc/ansible/hosts
    create: true
    state: present
    insertafter: 'EOF'
    line: |
      {% for group_name in groups %}
      {% if group_name == 'nodes' %}
      [{{ group_name }}]
      {% for host in groups[group_name] %}
      {{ host }} ansible_user={{ student_name }}
      {% endfor %}
      [all]
      {% for host in groups[group_name] %}
      {{ host }} ansible_user={{ student_name }}
      {% endfor %}
      {% endif %}
      {% endfor %}

asset_injector_modules: >-
  {{
    common_asset_injector_modules
    if 'bastions' in group_names
    else
      common_asset_injector_modules
        if 'nodes' in group_names
        else
          []
  }}

# -------------------------------------------------------------------
# Role: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/adv-feature-of-aap-showroom.git
showroom_git_ref: main
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "bastion-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"
showroom_antora_enable_dev_mode: false

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"
# showroom_tty_image: quay.io/rhpds/wetty
# showroom_tty_image_tag: v3.0
showroom_tab_services:
  - single_terminal

showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: '@Codeserver'
      url: "https://vscode-{{ subdomain }}"
    - name: '>_Terminal'
      path: /wetty
      port: 443
    - name: AAP
      url: "https://controller-{{ subdomain }}"
    - name: Gitea
      url: "https://gitea-{{ subdomain }}"
    - name: SSAP
      url: "https://ssap-portal-{{ subdomain }}"

# Runner for ZT Solve/Validate buttons
showroom_ansible_runner_api: true
# showroom_ansible_runner_image: quay.io/rhpds/zt-runner
# showroom_ansible_runner_image_tag: v2.4.2
# showroom_ansible_runner_path: "/stream"
showroom_nookbag_sidecar_enable: false
showroom_runtime_automation_environment_variables:
  ANSIBLE_CONFIG: "/showroom/repo/runtime-automation/ansible.cfg"
  SSH_HOSTNAME: "{{ openshift_cnv_ssh_address }}"
  SSH_PORT: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  SSH_USER: "{{ student_name }}"

# -------------------------------------------------------------------
# Role: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  automation_hub_hostname: "controller-{{ subdomain }}"
  bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ subdomain }}"
  bastion_ssh_password: "{{ common_password }}"
  common_password: "{{ common_password }}"

  controller_url: "https://controller-{{ subdomain }}"
  controller_username: "{{ student_name }}"
  controller_password: "{{ common_password }}"
  controller_admin_username: "admin"
  controller_admin_password: "{{ aap_image_admin_password }}"

  ssap_url: "https://ssap-portal-{{ subdomain }}"

  gitea_url: "https://gitea-{{ subdomain }}"
  gitea_username: "{{ student_name }}"
  gitea_password: "{{ common_password }}"

  vscode_server_url: "https://vscode-{{ subdomain }}"
  vscode_server_password: "{{ common_password }}"

  opa_web_url: "https://opa-{{ subdomain }}"

  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  run_e2e_load_test: "{{ run_e2e_load_test }}"

