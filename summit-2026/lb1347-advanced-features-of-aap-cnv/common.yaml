  - name: "node"
    count: 2
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"

  - name: "ssap"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ ssap_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ ssap_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: ssap
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssap-22
          - port: 443
            protocol: TCP
            targetPort: 443
            name: ssap-443
          - port: 7007
            protocol: TCP
            targetPort: 7007
            name: ssap-7007
    routes:
      - name: ssap-443
        host: ssap
        service: ssap
        targetPort: 443
        tls: true
