---
# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Showroom Development Mode
# -------------------------------------------------------------------
showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2000Gi"

# Should be moved to common.yaml after test
# -------------------------------------------------------------------
# Instances to deploy
# -------------------------------------------------------------------
# ------------------------
# Instance Images
# ------------------------
bastion_instance_image: rhel-9.6
controller_instance_image: aap-2.6-2-ceh-20251103
node_instance_image: rhel-9.6
ssap_instance_image: ssap-11032026

ssap_rootfs_size: 50Gi
bastion_rootfs_size: 50Gi
controller_rootfs_size: 100Gi
node_rootfs_size: 50Gi

# ------------------------
# Instances (VMs)
# ------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ bastion_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 3000
            protocol: TCP
            targetPort: 3000
            name: bastion-3000
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
    routes:
      - name: bastion-80
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge
      - name: bastion-3000
        host: gitea
        service: bastion
        targetPort: 3000
        tls: true
        tls_termination: edge
      - name: bastion-8080
        host: vscode
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
