  - name: "node"
    count: 2
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"

  - name: "ssap"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ ssap_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ ssap_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: ssap
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssap-22
          - port: 443
            protocol: TCP
            targetPort: 443
            name: ssap-443
          - port: 7007
            protocol: TCP
            targetPort: 7007
            name: ssap-7007
    routes:
      - name: ssap-443
        host: ssap
        service: ssap
        targetPort: 443
        tls: true
      - name: ssap-7007
        host: ssap-portal
        service: ssap
        targetPort: 7007
        tls: true
        tls_termination: passthrough

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - agnosticd.cloud_vm_workloads.control_user
  bastions:
    - host_satellite_repositories
    - host_common_packages
    - bastion
    - rhpds.manage_host.vscode_server
    - rhpds.manage_host.gitea_vm_setup
  nodes:
    - host_satellite_repositories
    - host_common_packages

software_workloads:
  bastions:
    - rhpds.manage_host.aap_devel_tools
    - infra.aap_configuration.dispatch

post_software_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  all:
    - rhpds.manage_host.asset_injector

post_software_final_workloads:
  bastions:
    - agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
# Role: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/adv-feature-of-aap-showroom.git
showroom_git_ref: main
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "bastion-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"
showroom_tab_services:
  - single_terminal

showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: '@Codeserver'
      url: "https://vscode-{{ subdomain }}"
    - name: '>_Terminal'
      path: /wetty
      port: 443
    - name: AAP
      url: "https://controller-{{ subdomain }}"
    - name: Gitea
      url: "https://gitea-{{ subdomain }}"

# -------------------------------------------------------------------
# Role: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  automation_hub_hostname: "controller-{{ subdomain }}"
  bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{  subdomain }}"
  bastion_ssh_password: "{{ common_password }}"
  common_password: "{{ common_password }}"

  controller_url: "https://controller-{{ subdomain }}"
  controller_username: "{{ student_name }}"
  controller_password: "{{ common_password }}"

  gitea_url: "https://gitea-{{ subdomain}}"
  gitea_username: "{{ student_name }}"
  gitea_password: "{{ common_password }}"

  vscode_server_url: "https://vscode-{{ subdomain }}"
  vscode_server_password: "{{ common_password }}"

  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
