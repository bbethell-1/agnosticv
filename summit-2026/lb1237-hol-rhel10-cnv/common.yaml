# -------------------------------------------------------------------
# Role: rhpds.manage_host.asset_injector
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted

node3_asset_injector_assets:
  - description: Setup cockpit for non ssl route
    module: blockinfile
    path: /etc/cockpit/cockpit.conf
    create: true
    state: present
    marker: "# {mark} Allow Unencrypted"
    block: |
      [WebService]
      AllowUnencrypted = true
      Origins = https://cockpit-{{ subdomain }}
      ProtocolHeader = X-Forwarded-Proto
      ForwardedForHeader = X-Forwarded-For

  - description: Reload systemctl
    module: command
    cmd: systemctl daemon-reload

  - description: Restart cockpit socket
    module: service
    name: cockpit.socket
    state: restarted

node1_asset_injector_assets:
  - description: Copy ssh public key
    module: copy
    src: "/home/{{ student_name }}/.ssh/{{ guid }}key.pub"
    dest: /root/.ssh/
    remote_src: true
    group: root
    owner: root
    mode: 'u=r,g-rwx,o-rwx'

  - description: Copy ssh private key
    module: copy
    src: "/home/{{ student_name }}/.ssh/{{ guid }}key.pem"
    dest: /root/.ssh/
    remote_src: true
    group: root
    owner: root
    mode: 'u=r,g-rwx,o-rwx'

  - description: Create ssh config
    module: blockinfile
    path: /root/.ssh/config
    create: true
    state: present
    marker: "# {mark} Allow Unencrypted"
    block: |
      Host *
        User {{ student_name }}
        IdentityFile ~/.ssh/{{ guid }}key.pem
        ForwardAgent yes
        StrictHostKeyChecking no
        ConnectTimeout 600
        ConnectionAttempts 10
        ControlMaster auto
        ControlPath /tmp/%h-%r
        ControlPersist 5m
    group: root
    owner: root
    mode: 'u=r,g-rwx,o-rwx'

# Set asset_injector_assets based on group membership
asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names
    else
      node3_asset_injector_assets
        if (inventory_hostname_short == 'node3')
        else
          node1_asset_injector_assets
            if (inventory_hostname_short == 'node1')
            else
              []
  }}

# -------------------------------------------------------------------
# Role: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/hol-rhel10-showroom.git
showroom_git_ref: main
showroom_user: showroom
showroom_tls_provider: none
showroom_host: "bastion-{{ subdomain }}"
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"

showroom_ssh_method: password
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_ssh_password: "{{ common_password }}"
# showroom_tty_image: quay.io/rhpds/wetty
# showroom_tty_image_tag: v3.0

showroom_tab_services:
  - single_terminal
  - second_terminal

showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
    - name: '>_Terminal-01'
      path: /wetty
      port: 443
      secondary_name: '>_Terminal-02'
      secondary_path: /terminal2/
      secondary_port: 443
    - name: 'Cockpit'
      url: "https://cockpit-{{ subdomain }}"

showroom_antora_enable_dev_mode: "false"

# Runner for ZT Solve/Validate buttons
showroom_ansible_runner_api: true
# showroom_ansible_runner_image: quay.io/rhpds/zt-runner
# showroom_ansible_runner_image_tag: v2.4.2
# showroom_ansible_runner_path: "/stream"
showroom_nookbag_sidecar_enable: false
showroom_runtime_automation_environment_variables:
  ANSIBLE_CONFIG: "/showroom/repo/runtime-automation/ansible.cfg"
  SSH_HOSTNAME: "{{ openshift_cnv_ssh_address }}"
  SSH_PORT: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  SSH_USER: "{{ student_name }}"

# -------------------------------------------------------------------
# Role: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{  subdomain }}"
  guid: "{{ guid }}"
  workshop_cockpit_url: "https://cockpit-{{ subdomain }}"
  workshop_cockpit_user_name: "{{ student_name }}"
  workshop_cockpit_user_password: "{{ common_password }}"
  bastion_ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  bastion_ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  bastion_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  bastion_ssh_user_name: "{{ student_name }}"
  bastion_ssh_password: "{{ common_password }}"
  run_e2e_load_test: "{{ run_e2e_load_test }}"

