# -------------------------------------------------------------------
# --- Catalog: Summit 2026
# --- Catalog Item: LB1237 - The Definitive Red Hat Enterprise Linux 10 Hands-On Lab"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform - AgnosticD v2
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{  subdomain }}"
bastion_ssh_password: "{{ common_password }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=16, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# CNV-specific settings
# -------------------------------------------------------------------
openshift_cnv_legacy_routes: false
openshift_cnv_route_remove_x_frame_options_header: true

# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main  # Override in prod.yaml with specific release tag

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements - AgnosticD v2
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.10
    - name: https://github.com/rhpds/rhpds-ftl.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/hol_rhel10_automation.git
      type: git
      version: "{{ tag }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.7
rhel_instance_image: rhel-10.1
leapp_instance_image: rhel-9.7
rootfs_size_rhel: 50Gi
node_name: node
pv_size_node: 4Gi

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 7500
            protocol: TCP
            targetPort: 7500
            name: bastion-7500
    routes:
      - name: bastion-80
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge

  - name: "node1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node1
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: node2-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node1-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: node1-443
          - port: 7500
            protocol: TCP
            targetPort: 7500
            name: node1-7500
    routes:
      - name: node1-443
        host: node1
        service: node1
        targetPort: 443
        tls: true
        tls_termination: edge
    disks:
      - metadata:
          name: "node1{{ guid }}1"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node1{{ guid }}2"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node1{{ guid }}3"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node1{{ guid }}4"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

  - name: "node2"
