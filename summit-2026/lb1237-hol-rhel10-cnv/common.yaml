      - name: Christoph Doerbeck
        email: cdoerbec@redhat.com
      - name: Gordon Keegan
        email: gkeegan@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1237 - Red Hat Enterprise Linux 10 Hands-On Lab"
    category: Brand_Events
    keywords:
      - summit-2026
      - lb1237
      - leapp
      - rhel10
    labels:
      Provider: RHDP
      Brand_Event: Red_Hat_Summit_2026
      Platform: RHEL
      TDP1: Server_Cloud_OS
