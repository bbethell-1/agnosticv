---
# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
# For development don't fail
ocp4_workload_gitops_bootstrap_application_health_required: false
ocp4_workload_gitops_bootstrap_application_sync_required: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main

  # -----------------------------------------------------------------
  # Sandbox API
  # -----------------------------------------------------------------
  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: aws-dedicated-shared
      lab: lb2211-fusion-ai
      purpose: dev
