instances:
  - name: bastion
    count: 1
    unique: true
    alt_name: bastion
    memory: "{{ bastion_memory }}"
    cores: "{{ bastion_cores }}"
    image_size: "{{ bastion_rootfs_size }}"
    image: "{{ bastion_instance_image }}"
    metadata:
      AnsibleGroup: bastions
      function: bastion
      user: "{{ bastion_student_user_name }}"
      project: "{{ project_tag }}"
      ostype: linux
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "instance_filter"
        value: "{{ project_tag }}"
    networks:
      - default
      - default/networkrhovmt

  - name: compute01
    count: 1
    unique: true
    memory: "{{ compute_memory }}"
    cores: "{{ compute_cores }}"
    image_size: "{{ compute_rootfs_size }}"
    image: "{{ compute_instance_image }}"
    metadata:
      AnsibleGroup: "isolated"
      user: "{{ bastion_student_user_name  }}"
      project: "{{ project_tag }}"
      ostype: linux
      Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ project_tag }}"
    networks:
      - default
      - ctlplane
      - internalapi
      - storage
      - tenant
      - external
      - default/networkrhovmt
  - name: nfsserver
    count: 1
    unique: true
    memory: "{{ nfsserver_memory }}"
    cores: "{{ nfsserver_cores }}"
    image_size: "{{ nfsserver_rootfs_size }}"
    image: "{{ nfsserver_instance_image }}"
    metadata:
      AnsibleGroup: "isolated"
      user: "{{ bastion_student_user_name }}"
      project: "{{ project_tag }}"
      ostype: linux
      Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ project_tag }}"
    networks:
      - default
      - storage

