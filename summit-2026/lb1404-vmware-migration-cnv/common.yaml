# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
# cloud_provider_version: 1.2.3
cloud_provider_version: fix/create-network-valid-json
config: openshift-cluster
project_tag: "{{ config }}-{{ guid }}"
purpose: production

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
    - name: https://github.com/agnosticd/cloud_provider_openshift_cnv.git
      type: git
      version: fix/create-network-valid-json
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: 1.1.0
    - name: https://github.com/agnosticd/osp-on-ocp.git
      type: git
      version: fix/replace-vmware-rest-modules
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: v1.3.7
    - name: https://github.com/ansible-collections/cloud.common.git
      type: git
      version: main

# -------------------------------------------------------------------
# OpenShift Settings
# -------------------------------------------------------------------
host_ocp4_installer_version: "4.18"
host_ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_deploy_installation_method: openshift_assisted

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

cluster_name: "cluster-{{ guid }}"
ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 8900

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_bastion: true
bastion_setup_student_user: true
bastion_student_user_name: lab-user

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi
bastion_rootfs_size: 30Gi

control_plane_instance_count: 3
control_plane_instance_type: m5a.2xlarge

worker_instance_count: 0
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

# No users -> admin showroom
ocp4_workload_authentication_num_users: 0

# nfs-server Configuration
nfsserver_instance_image: rhel-8.2
nfsserver_cores: 4
nfsserver_memory: 4G
nfsserver_rootfs_size: 30Gi

compute_instance_image: rhel-9.4
compute_cores: 16
compute_memory: 16G
compute_rootfs_size: 100Gi

compute_adoption_instance_image: rhel-9.2

ai_attach_masters_networks:
  - ctlplane
  - internalapi
  - storage
  - tenant
  - external
  - default/networkrhovmt

networks:
  - name: ctlplane
  - name: internalapi
  - name: storage
  - name: tenant
  - name: external

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.osp_on_ocp.ocp4_workload_rhoso_ipam4lab
  - agnosticd.core_workloads.ocp4_workload_external_odf
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_cert_manager
  - agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
  #- agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_web_terminal
  - agnosticd.core_workloads.ocp4_workload_openshift_virtualization
  - agnosticd.osp_on_ocp.ocp4_workload_virt_roadshow_vmware
  - agnosticd.osp_on_ocp.ocp4_workload_virt_roadshow_vms
  - agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
  - agnosticd.osp_on_ocp.ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
