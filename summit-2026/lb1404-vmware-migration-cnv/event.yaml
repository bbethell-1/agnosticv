---
#include /includes/zerotouch-access-disable-limits.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "true"
ocp4_workload_showroom_content_git_repo_ref: v1.0.0
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer collection — required by host-ocp4-assisted-installer role
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
    # Showroom collection — v1.6.6 adds runtime_automation_image/enable support
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.6
  # FTL collection — ZT runner SA + E2E grading
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "9b16efd51c6d1093e7f049d04355a4abd864cf10"
  # RHOSO workloads — rhpds fork with bastion-runner approach
  - name: https://github.com/rhpds/osp-on-ocp.git
    type: git
    version: "9494022eda44ff34c1361600277e28afa83bd92a"
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: lb1404-vmware-mig-1.0.0
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: ocpv01
      virt: "yes"
