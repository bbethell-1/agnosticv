# ===================================================================
# Tenant workload variables
# ===================================================================

# -------------------------------------------------------------------
# Shared tenant username + password roots
# The bridge role overrides ocp4_workload_username per user.
# All tenant vars below cascade from these two roots.
# -------------------------------------------------------------------
# ocp4_workload_username maps to bridge per-user keycloak username via lazy Jinja2 eval
ocp4_workload_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_user_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# ---------------------------------------------------------------------------
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "4"
  requests.cpu: "4"
  limits.memory: 8Gi
  requests.memory: 8Gi
  requests.storage: 50Gi
  pods: 20

ocp4_workload_tenant_namespace_suffixes:
- suffix: hummingbird-builds
- suffix: hummingbird-production
- suffix: hummingbird-acs-lab
- suffix: rhel
  quota:
    limits.cpu: "8"
    requests.cpu: "8"
    limits.memory: 20Gi
    requests.memory: 20Gi
    requests.storage: 60Gi
    pods: 4

ocp4_workload_tenant_namespace_use_cluster_quota: false

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# ---------------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_keycloak_realm: keycloak
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_tenant_rhacs
# ---------------------------------------------------------------------------
ocp4_workload_tenant_rhacs_central_namespace: stackrox
ocp4_workload_tenant_rhacs_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_rhacs_roles:
- Admin

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_tenant_gitea_user
# ---------------------------------------------------------------------------
ocp4_workload_tenant_gitea_user_namespace: gitea
ocp4_workload_tenant_gitea_user_instance: gitea
ocp4_workload_tenant_gitea_user_username: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_gitea_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_gitea_user_repositories: []

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_tenant_quay
# ---------------------------------------------------------------------------
ocp4_workload_tenant_quay_namespace: quay
ocp4_workload_tenant_quay_instance: quay
ocp4_workload_tenant_quay_user: "{{ ocp4_workload_username }}"
ocp4_workload_tenant_quay_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_quay_pipeline_namespaces:
- "{{ ocp4_workload_username }}-hummingbird-builds"
- "{{ ocp4_workload_username }}-hummingbird-acs-lab"

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_hummingbird_tenant
# ---------------------------------------------------------------------------
ocp4_workload_hummingbird_tenant_vm_name: rhel
ocp4_workload_hummingbird_tenant_vm_namespace: "{{ ocp4_workload_username }}-rhel"
ocp4_workload_hummingbird_tenant_vm_datasource_name: hummingbird
ocp4_workload_hummingbird_tenant_vm_datasource_namespace: openshift-virtualization-os-images
ocp4_workload_hummingbird_tenant_vm_user: rhel
ocp4_workload_hummingbird_tenant_vm_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_hummingbird_tenant_vm_cpu_cores: 1
ocp4_workload_hummingbird_tenant_vm_cpu_sockets: 2
ocp4_workload_hummingbird_tenant_vm_cpu_threads: 2
ocp4_workload_hummingbird_tenant_vm_memory_guest: 8Gi
ocp4_workload_hummingbird_tenant_vm_disksize: 30Gi
ocp4_workload_hummingbird_tenant_vm_init_script_url: https://raw.githubusercontent.com/rhpds/hummingbird-showroom/refs/heads/main/scripts/setup-rhel.sh

# For AWS Only:
ocp4_workload_hummingbird_tenant_vm_storage_class_name: gp3-csi-immediate

# ---------------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# ---------------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/hummingbird-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-04-07
ocp4_workload_showroom_runtime_automation_enable: false
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# ---------------------------------------------------------------------------
# Workload: rhpds.ftl.ocp4_workload_runtime_automation_k8s
# ---------------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: false
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ openshift_api_key }}"

# ===================================================================
# Babylon meta variables
# ===================================================================
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"

