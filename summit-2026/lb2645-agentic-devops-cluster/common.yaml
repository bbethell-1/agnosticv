---
# -------------------------------------------------------------------
# --- Catalog Item: LB2645 Agentic DevOps Sandbox API Cluster
# --- Sandbox API cluster for the LB2645 Agentic DevOps Summit Lab.
# --- Deploys OpenShift AI, GitOps, and Keycloak on top of
# --- an OpenShift cluster. Designed to be registered with the
# --- OpenShift Sandbox API.
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

#include /includes/parameters/purpose.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
num_users: 0

clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Cluster Sizing
# ===================================================================
openshift_cnv_scale_cluster: true

# Set this to the number of workers needed to support
# X placements by sandbox API
worker_instance_count: 3    # was 2
ai_workers_cores: 16        # was 8
ai_workers_memory: 48Gi     # was 16

worker_only: true
# worker_drain_control_plane: false

# -------------------------------------------------------------------
# Common Password - used by gitea admin
# -------------------------------------------------------------------

common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=16 chars=ascii_letters,digits')
  }}

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:
    # Assisted Installer Collection
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.9

    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/ai_workloads.git
      type: git
      version: "{{ tag }}"

    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: main

    # deepagents-aiops — RHEL VM workloads
    - name: https://github.com/rhpds/deepagents-aiops.git
      type: git
      version: "{{ tag }}"

    # Showroom
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.0

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - agnosticd.core_workloads.ocp4_workload_gitea_operator
  - agnosticd.ai_workloads.ocp4_workload_openshift_ai
  - agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
  - agnosticd.core_workloads.ocp4_workload_openshift_virtualization
  - rhpds.deepagents_aiops.ocp4_workload_rhel_vm_infra
  - rhpds.deepagents_aiops.ocp4_workload_mlflow_cluster
  - agnosticd.showroom.ocp4_workload_ocp_console_embed

# ===================================================================
# Workload: ocp4_workload_authentication
# ===================================================================
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------

ocp4_workload_gitea_operator_project: gitea
#ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_catalog_image_tag: v2.3.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
#ocp4_workload_gitea_operator_gitea_image_tag: "1.25.5"
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.5.2"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
# ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: "10.1"
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
# ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: gitea-admin
ocp4_workload_gitea_operator_admin_email: gitea-admin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password}}"

ocp4_workload_gitea_operator_create_users: false

# ===================================================================
# Workload: ocp4_workload_ansible_automation_platform
# ===================================================================
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_admin_password }}"
ocp4_workload_ansible_automation_platform_save_admin_credentials: true
ocp4_workload_ansible_automation_platform_disable_controller: false
ocp4_workload_ansible_automation_platform_disable_eda: true
ocp4_workload_ansible_automation_platform_disable_hub: true
ocp4_workload_ansible_automation_platform_disable_lightspeed: true
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.6
ocp4_workload_ansible_automation_platform_catalog_snapshot_image_tag: "v4.20_2025_12_29"
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader
ocp4_workload_ansible_automation_platform_hub_file_storage_file_class: ocs-external-storagecluster-cephfs
ocp4_workload_ansible_automation_platform_hub_file_storage_access_mode: ReadWriteMany
# Manifest inject: controller API may not be listening immediately after CR reports Successful
# Default 3x5s=15s is too short — bump to 60x10s=10min
ocp4_workload_ansible_automation_platform_manifest_inject_retries: 60
ocp4_workload_ansible_automation_platform_manifest_inject_delay: 10

# ===================================================================
# Workload: ocp4_workload_openshift_virtualization
# ===================================================================
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# ===================================================================
# Workload: ocp4_workload_rhel_vm_infra
# ===================================================================
