---
ocp4_workload_showroom_user_data_seed:
  user: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ common_password }}"
# ===================================================================
# LB2596: Quarkus on OpenShift (Combined)
#
# COMBINED catalog item — merges the separate cluster CI
# (lb2596-quarkus-openshift-cluster) and tenant CI
# (lb2596-quarkus-openshift-tenant) into a single order.
#
# HOW IT WORKS:
#   1. Component provisions an OCP 4.21 cluster from the CNV pool
#   2. Cluster workloads run once (auth, GitOps, DevSpaces,
#      console embed, bootstrap_cluster)
#   3. Bridge role (ocp4_workload_multi_tenant_loop) loops
#      tenant_workloads for each user (1..num_users)
#   4. After all users' workloads complete, bridge registers each
#      user with Babylon for workshop_user_mode: multi
#
# JIRA: GPTEINFRA-16720
# ===================================================================

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
tag: main
tag_showroom: v1.6.9
tag_quarkus_openshift: v1.0.0

cloud_provider: none
config: openshift-workloads

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# Number of tenant users to provision.
# Overridden in dev.yaml (1) and event.yaml.
num_users: 1

# Seconds to wait after cluster workloads complete before starting
# tenant provisioning. Gives async resources (ArgoCD syncs, operator
# CRDs, Keycloak realm) time to settle.
tenant_pre_loop_delay: 120

# -------------------------------------------------------------------
# Token/URL mapping for ALL tenant roles
#
# WHY THIS IS NEEDED:
#   In the two-item pattern, tenant roles default to:
#     sandbox_openshift_api_url        → the infra/sandbox cluster
#     cluster_admin_agnosticd_sa_token → SA token from cluster-config
#
#   In the combined CI, the cluster comes from the component's
#   propagate_provision_data which provides openshift_api_url and
#   openshift_api_key. We override every tenant role to use these
#   instead of the sandbox defaults.
# -------------------------------------------------------------------
cluster_admin_agnosticd_sa_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_keycloak_user_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_keycloak_user_openshift_api_token: "{{ openshift_api_key }}"

ocp4_workload_tenant_namespace_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster (from lb2596-quarkus-openshift-cluster)
# Tenant quota (requests.cpu: 16). 14×16c = 224 vCPU for 12 tenants.
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 14
ai_workers_cores: 16
ai_workers_memory: 64Gi

# ===================================================================
# Collections (merged from cluster + tenant CIs, deduplicated)
# ===================================================================
requirements_content:
  collections:
  # Required by host_ocp4_assisted_scale
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main

  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "{{ tag_showroom }}"

  - name: https://github.com/rhpds/quarkus-on-openshift-automation.git
    type: git
    version: "{{ tag_quarkus_openshift }}"

# ===================================================================
# Cluster-level workloads (run once by openshift-workloads config)
#
# The bridge role sits at the END of this list. Everything above it
# runs once to set up shared cluster infrastructure. The bridge then
# loops tenant_workloads for each user.
#
# NOTE: bootstrap_cluster and bootstrap_tenant are DIFFERENT roles
# (rhpds.quarkus_on_openshift namespace). No variable name conflicts.
# bootstrap_cluster runs here at cluster level; bootstrap_tenant runs
# per-user in tenant_workloads below.
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_devspaces
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- rhpds.quarkus_on_openshift.bootstrap_cluster
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Tenant workloads (run per user by the bridge role)
#
# Order matters:
#   1. keycloak_user — creates the user in Keycloak (sso realm)
#   2. tenant_namespace — creates user namespace (username-quarkus)
#   3. showroom — deploys lab UI into user's showroom namespace
#   4. bootstrap_tenant — Quarkus app setup per user
#   5. runtime_automation_k8s — FTL runner SA (needs showroom namespace)
#
# The bridge overrides ocp4_workload_tenant_keycloak_username and
# common_password per user. All vars below that reference these two
# roots cascade automatically via Jinja2 lazy evaluation.
# ===================================================================
tenant_workloads:
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- rhpds.quarkus_on_openshift.bootstrap_tenant

# Per-workload var overrides for tenant bootstrap_tenant.
# bootstrap_tenant needs per-user username resolved at tenant loop
# time — these vars reference ocp4_workload_tenant_keycloak_username
# which is set by the bridge per iteration.
tenant_workload_vars:
  rhpds.quarkus_on_openshift.bootstrap_tenant:
    quarkus_on_openshift_bootstrap_tenant_username: "{{ ocp4_workload_tenant_keycloak_username }}"
    quarkus_on_openshift_bootstrap_tenant_user_password: "{{ common_password }}"
    quarkus_on_openshift_bootstrap_tenant_namespaces:
    - "{{ ocp4_workload_tenant_keycloak_username }}-quarkus"

# ===================================================================
# Destroy
# ===================================================================
tenant_remove_workloads: []

# Bridge runs first on destroy, then component destroys the OCP cluster.
remove_workloads:
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Per-user data reported to Babylon by the bridge role.
#
# lab_ui_url is what the portal uses for workshopLabUiRedirect
# and the Lab URL column in the workshop Users tab.
# password is reported so facilitators can look up user credentials.
# Route pattern: showroom (route name) + user1-showroom (namespace)
# = showroom-user1-showroom.apps.domain
# ===================================================================
tenant_user_info_data:
  lab_ui_url: >-
    https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  password: "{{ common_password }}"

tenant_user_info_msg: >-
  Lab: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

# ===================================================================
# Cluster workload variables
# (from lb2596-quarkus-openshift-cluster/common.yaml)
# ===================================================================

common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}
common_admin_password: "{{ common_password }}"
common_admin_username: admin

# CatalogSource — pinned OLM snapshot for OCP 4.21
ocp4_workload_catalogsource_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.21_2026_04_13

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: true
ocp4_workload_authentication_keycloak_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authentication_keycloak_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authentication_keycloak_default_realm: sso

ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
# num_users: 0 — Keycloak users are created per-tenant by ocp4_workload_tenant_keycloak_user
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# Workload: ocp4_workload_devspaces
# -------------------------------------------------------------------
ocp4_workload_devspaces_channel: stable
ocp4_workload_devspaces_catalogsource_setup: true
ocp4_workload_devspaces_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_devspaces_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: rhpds.quarkus_on_openshift.bootstrap_cluster
# (no per-user vars — runs once at cluster level)
# -------------------------------------------------------------------
quarkus_on_openshift_bootstrap_cluster_myvar: "myvalue1"

# ===================================================================
# Tenant workload variables
# (from lb2596-quarkus-openshift-tenant/common.yaml)
#
# All vars below reference ocp4_workload_tenant_keycloak_username
# or common_password. The bridge role overrides these two roots
# per user via include_role vars:. Everything else cascades
# automatically via Jinja2 lazy evaluation.
# ===================================================================

# WHY ocp4_workload_tenant_keycloak_user_password is needed:
#   The role's default is "" (empty string). Without this mapping,
#   Keycloak returns "Empty password not allowed" (400).
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_suffixes:
- suffix: quarkus

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "20"
  requests.cpu: "16"
  limits.memory: 24Gi
  requests.memory: 16Gi
  requests.storage: 100Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 1Gi
  defaultRequest:
    cpu: 500m
    memory: 256Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# Namespace: {{ username }}-showroom
# Route:     showroom-user1-showroom.apps.domain
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/quarkus-openshift-showroom
ocp4_workload_showroom_content_git_repo_ref: v1.0.2

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-09
ocp4_workload_showroom_passthrough_user_data: true

# -------------------------------------------------------------------
# Workload: rhpds.ftl.ocp4_workload_runtime_automation_k8s (FTL)
#
# cluster_admin: false — tenant FTL SA scoped to user namespace only.
# Uses the cluster's API URL and token (from component propagation),
# not the sandbox defaults (which would point to the wrong cluster).
# -------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: false
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ openshift_api_key }}"
ocp4_workload_runtime_automation_k8s_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_runtime_automation_k8s_namespace_suffixes: "{{ ocp4_workload_tenant_namespace_suffixes }}"
ocp4_workload_runtime_automation_k8s_showroom_namespace: "{{ ocp4_workload_showroom_namespace }}"

# ===================================================================
# Babylon meta variables
# ===================================================================
__meta__:
  asset_uuid: 93db79bf-afd4-4d2f-9967-7cfda8b0cd48
  owners:
    maintainer:
    - name: Juliano Mohr
      email: juliano@redhat.com
    instructions:
    - name: Ryan Jarvinen
      email: rjarvine@ibm.com
    - name: Jaya Baskaran
      email: jaya.baskaran@ibm.com

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-04-10
      pull: missing

  catalog:
    supportLink: https://redhat.enterprise.slack.com/archives/C06QWD4A5TE
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB2596: Quarkus on OpenShift (Combined)"
    category: Brand_Events
    keywords:
    - summit-2026
    - lb2596
    - quarkus
    - openshift
    - combined
    labels:
      Brand_Event: Red_Hat_Summit_2026
      Product: Red_Hat_Runtimes
      Product_Family: Red_Hat_Application_Services
      Provider: RHDP
    parameters:
    - name: num_users
      description: "Number of tenant users to provision"
      formLabel: "Number of Users"
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 24
    reportingLabels:
      primaryBU: Application_Developer
      secondaryBU: Hybrid_Platforms
    workshopUiDisabled: false
    workshopLabUiRedirect: true
    workshop_user_mode: multi

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.21"
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
