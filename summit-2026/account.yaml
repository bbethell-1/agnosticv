---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# Showroom defaults for Summit 2026
# wetty:v3.0 required for send-to-terminal buttons (native postMessage support)
ocp4_workload_showroom_wetty_image: "quay.io/rhpds/wetty:v3.0"
# zt-runner for E2E solve/validate runtime automation — enabled globally for all Summit labs
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
# Summit navbar logo branding
ocp4_workload_showroom_content_antora_navbar_logo: "summit"
showroom_content_antora_navbar_logo: "summit"

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    # use new event sandbox for summit and for gpu please set manually in common/event.yaml pgpu-event
    #reservation: event
  sandbox_api:
    reservation: event
