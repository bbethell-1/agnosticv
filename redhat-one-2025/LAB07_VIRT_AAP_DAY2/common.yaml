# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f78ad359-10ce-4cb1-9dbc-fecac1a5c7f4
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
  sandbox_api:
