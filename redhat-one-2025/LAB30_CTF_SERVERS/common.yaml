---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# env_type: rhel8-base
env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# Unset key name
key_name: ""

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
bastion_public_hostname: "rhel9.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Workloads: showroom
# -------------------------------------------------------------------

showroom_git_repo: "https://github.com/redhat-gpte-devopsautomation/showroom-tap-workshop.git"
showroom_user: showroom
showroom_ui: default

showroom_tab_services:
  - double_tty

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_ttys_enable_tmux: true

showroom_dnf_packages:
  - git
  - podman
  - python3-devel
  - systemd-container
  - unzip
  - ansible-core

showroom_pip_packages:
  - podman-compose

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

rhel9_instance_image: RHEL94GOLD-latest
rhel9_instance_type: "t3a.large"
rootfs_size_rhel9: 200

ctfdashboard_instance_name: ctfdashboard
ctfdashboard_instance_image: RHEL8GOLD-latest
ctfdashboard_instance_type: "r7a.2xlarge"
rootfs_size_ctfdashboard: 50

server_image: RHEL92GOLD-latest
server_instance_type: "t3a.large"

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ rhel9_instance_image }}"
    flavor:
      ec2: "{{ rhel9_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel9 }}"
    volumes:
      - device_name: "/dev/xvdb"
        size: "20"
        type: gp3
    security_groups:
      - BastionSG
      - ShowroomSG

  - name: "{{ ctfdashboard_instance_name }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ ctfdashboard_instance_image }}"
    flavor:
      ec2: "{{ ctfdashboard_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "ctfdashboards"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_ctfdashboard }}"
    security_groups:
      - WebSG
      - DefaultSG
      - NodeSG

  - name: "server"
    count: 3
    public_dns: false
    image: "{{ server_image }}"
    flavor:
      ec2: "{{ server_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:
  - name: ShowroomSG
    rules:
      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebCockpitPorts
        description: "Cockpit HTTP Public"
        from_port: 9090
        to_port: 9090
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG servers"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG servers"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: lab-user
student_password: "{{ common_password }}"

bastion_install_basic_packages: true
# common_packages_el9:
agd_bastion_packages:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: d6d9ac17-0a21-4b51-bdfd-b3c8243fca62
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LAB 30: Servers for Red Hat One Capture The Flag Event"
    category: Red_Hat_One_2025
    keywords:
      - ctf
      - troubleshooting
      - lab19
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
