---
# -------------------------------------------------------------------
# --- Catalog: Red Hat One
# --- Catalog Item: "LAB16: Anatomy of must-gather (CNV)"
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/openshift-ocpv-configs.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/sandbox-api.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/parameters/enable-cert-manager.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# env_type: rhel8-base
env_type: base-infra
cloud_provider: openshift_cnv
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# Unset key name
key_name: ""

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
bastion_public_hostname: "rhel9.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------

ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
software_workloads:
  bastions:
    - rh1_2025_must_gather

must_gather_install_tools: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------

requirements_content:
  roles:
    - name: rh1_2025_must_gather
      src: https://github.com/opentraining-labs-customizations/rh1-2025-must-gather.git
      version: v1.0.1

# -------------------------------------------------------------------
# Workloads: showroom
# -------------------------------------------------------------------

# showroom_git_repo: "https://github.com/RedHatQuickCourses/test-showroom-rh12025.git"
showroom_user: showroom
showroom_ui: default

showroom_tab_services:
  - double_tty

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_ttys_enable_tmux: true

showroom_dnf_packages:
  - git
  - podman
  - python3-devel
  - systemd-container
  - unzip
  - ansible-core

showroom_pip_packages:
  - podman-compose

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_cloud_provider: ec2
# ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

rhel9_instance_image: RHEL94GOLD-latest
rootfs_size_rhel9: 200Gi

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel9_instance_image }}"
    memory: 8G
    cores: 2
    image_size: "{{ rootfs_size_rhel9 }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    services:
      - name: rhel9
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: rhel9-https
    routes:
      - name: rhel9-https
        host: rhel9
        service: rhel9
        targetPort: 443
        tls: true

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: lab-user
student_password: "{{ common_password }}"

bastion_install_basic_packages: true
# common_packages_el9:
agd_bastion_packages:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5454E258-82BC-4D3E-8B94-F482008EB1B5
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LAB16: Anatomy of must-gather (CNV)"
    category: Red_Hat_One_2025
    keywords:
      - rhel
      - rhel9
      - rh1
      - rh12025
      - rh1lab16
      - rh12025lab16
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
