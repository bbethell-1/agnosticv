---
# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: dev

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------

showroom_git_repo: https://github.com/RedHatQuickCourses/rh1-lab20-ansible.git

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

nginx_with_cert_encrypt_mail: opentlc-admin@opentlc.com
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: always
