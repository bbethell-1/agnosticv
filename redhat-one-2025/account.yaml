---
#include /includes/access-restriction-RH1-devs.yaml

cloud_provider: ec2
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}
repo_method: file
region: us-east-2

cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"

__meta__:
  # Sandbox settings must be configured in common.yaml
  aws_sandboxed: false
  secrets:
    # This secret contains the creds necessary to talk to pool of sandboxes (dynamoDB)
    # see readme in https://github.com/redhat-gpte-devopsautomation/babylon_aws_sandbox
    # to know what variables to set.
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
