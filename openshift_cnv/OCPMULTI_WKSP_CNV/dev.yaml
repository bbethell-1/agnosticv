---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

nfs_provisioner_nfs_server_hostname: "{{ openshift_cnv_nfs_server }}"
nfs_provisioner_server_directory: "{{ openshift_cnv_nfs_path }}"
bastion_instance_image: rhel-9.1
ai_storage_class: >-
  {{ 'ocs-storagecluster-ceph-rbd'
    if sandbox_openshift_cluster|default('') in ['ocpv03', 'ocpv04']
    else
    'ocs-external-storagecluster-ceph-rbd'
  }}
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
