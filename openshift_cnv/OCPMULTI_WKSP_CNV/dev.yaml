purpose: development
bastion_instance_image: rhel-9.1
ocp4_workload_external_odf_use_rados_namespace: true
ai_workers_cores: 8
local_registry_url: local-registry-quay-local-quay-registry.apps.ocpvdev01.dal13.infra.demo.redhat.com
local_registry_org_quay: quay_io
local_registry_org_registry_redhat_io: registry_redhat_io
local_registry_username: readonly
local_registry_password: SDS7TNO7R3B5TJPNINO82DBCW2IZ8SHK
local_registry_enabled: false
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv03
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpv08
        - ocpvdev01
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: cnv-quay
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    quota:
      limits.cpu: '128'
      requests.cpu: '128'
      limits.memory: 500Gi
      requests.memory: 500Gi
      requests.storage: 2000Gi
    cloud_selector:
      cloud: cnv
      name: '{{ job_vars.ocpv_cluster }}'
      virt: 'yes'
  deployer:
    scm_ref: cnv-quay
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
