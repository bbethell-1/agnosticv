# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpv08
            - ocpvdev01
#      - name: local_registry_enabled
#        description: Use Local Registry
#        formLabel: Local Registry
#        required: true
#        openAPIV3Schema:
#          type: boolean
#          default: false
#          enum:
#            - false
#            - true
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      quota:
        limits.cpu: "256"
        requests.cpu: "256"
        limits.memory: "1000Gi"
        requests.memory: "1000Gi"
        requests.storage: "2000Gi"
      cloud_selector:
        cloud: cnv
        #name: "{{ job_vars.ocpv_cluster }}"
        purpose: events
        virt: "yes"
  deployer:
    #scm_ref: radosnamespace
    scm_ref: acme-bifrost-fix
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
