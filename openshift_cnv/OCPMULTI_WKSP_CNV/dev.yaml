---
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

base_domain: "{{ undef() }}"
route53_zone: "{{ undef() }}"
route53_aws_zone_id: "{{ undef() }}"
route53_aws_access_key_id: "{{ undef() }}"
route53_aws_secret_access_key: "{{ undef() }}"
ocp4_workload_cert_manager_cloud_provider: "ddns"

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

ocp4_workload_external_odf_backingstore_custom_resources: true
ocp4_workload_external_odf_backingstore_cpu_limits: 1000m
ocp4_workload_external_odf_backingstore_cpu_requests: 800m
ocp4_workload_external_odf_backingstore_memory_limits: 4000Mi
ocp4_workload_external_odf_backingstore_memory_requests: 800Mi
ocp4_workload_external_odf_backingstore_storage_requests: 50Gi
ocp4_workload_external_odf_noobaa_custom_resources: true
ocp4_workload_external_odf_noobaa_memory_limits: 4Gi
ocp4_workload_external_odf_noobaa_memory_requests: 4Gi
ocp4_workload_external_odf_noobaa_cpu_limits: 3
ocp4_workload_external_odf_noobaa_cpu_requests: 3

bastion_instance_image: rhel-9.1

ocp4_workload_external_odf_use_rados_namespace: true
ai_workers_cores: 16

ai_workers_memory: 64Gi

#networks:
#  - name: external
#ai_attach_workers_networks:
#  - default/flatnetwork
#  - external

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpv08
            - ocpv09
            - ocpvdev01
#      - name: local_registry_enabled
#        description: Use Local Registry
#        formLabel: Local Registry
#        required: true
#        openAPIV3Schema:
#          type: boolean
#          default: false
#          enum:
#            - false
#            - true
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      quota:
        limits.cpu: "256"
        requests.cpu: "256"
        limits.memory: "1000Gi"
        requests.memory: "1000Gi"
        requests.storage: "2000Gi"
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        #purpose: events
        virt: "yes"
  deployer:
    #scm_ref: radosnamespace
    scm_ref: acme-bifrost-fix
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
