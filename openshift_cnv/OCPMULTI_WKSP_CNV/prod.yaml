---
# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: prod

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      limits.cpu: "256"
      requests.cpu: "256"
      limits.memory: "500Gi"
      requests.memory: "500Gi"
      requests.storage: "2000Gi"
  deployer:
    scm_ref: cnv-ocpmulti-wksp-1.1.0
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
