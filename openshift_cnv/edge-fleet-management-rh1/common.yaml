---
# This item is restricted to devs only!
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Device Edge Fleet Management with Red Hat Edge Manager (Tech Preview)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

# #include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#
#include /includes/access-restriction-devs-edge-bu.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

#include /includes/secrets/rh1-flightctl-lb8580.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# include this for pooled cluster
openshift_cnv_scale_cluster: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Nodes
# -------------------------------------------------------------------

worker_instance_count: "{{ [(num_users | int / 10) | round(0, 'ceil') | int, 1] | max }}"
ai_workers_memory: "126Gi"
ai_workers_cores: 64
ai_workers_sockets: 2
ai_workers_threads: 2

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: main
    # version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.3.9

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

num_users: 2

admin_username: "admin"
admin_password: >-
  {{
    lookup('password', output_dir ~ '/admin_password length=12 chars=ascii_letters,digits')
  }}

user_password: >-
  {{
    lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits')
  }}

# TODO: This is the old user password
# user_password: edgeLB2517

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
# Change this back to randomized password after Summit
# Added for ease of use with mobile devices
ocp4_workload_authentication_htpasswd_user_password: "{{ user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.2"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true
#
ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: rhemadmin
ocp4_workload_gitea_operator_admin_email: rhemadmin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ admin_password }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "4"
ocp4_workload_openshift_gitops_repo_limits_memory: 4Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/edge-fleet-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: rh1-2026
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

# ocp4_workload_gitops_bootstrap_repo_path: bootstrap # this is now set by the workload
ocp4_workload_gitops_bootstrap_application_name: bootstrap
# don't wait for the gitops application to deploy.  This is for testing ONLY.
# must be removed for prod.
ocp4_workload_gitops_bootstrap_application_wait: false

ocp4_workload_gitops_bootstrap_helm_values:
  gitea_admin_password: "{{ ocp4_workload_gitea_operator_admin_password }}"
  gitea_admin_username: "{{ ocp4_workload_gitea_operator_admin_user }}"
  guid: "{{ guid }}"
  user_password: "{{ user_password }}"
  admin_password: "{{ admin_password }}"
  user:
    count: "{{ num_users }}"
    prefix: "user"
  satellite_url: demosat-ha.infra.demo.redhat.com
  set_repositories_satellite_url: "{{ satellite_url }}"
  set_repositories_satellite_hostname: "{{ satellite_url }}"
  satellite_org: Red_Hat_RHDP_Labs
  set_repositories_satellite_org: "{{ satellite_org }}"
  set_repositories_satellite_ha: true
  satellite_activationkey: "{{ satellite_activationkey }}"
  set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"
  bastion_ssh_password: "{{ bastion_ssh_password }}"

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/edge-fleet-showroom.git
ocp4_workload_showroom_content_git_repo_ref: rh1-2026
ocp4_workload_showroom_content_antora_playbook: site.yml
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_second_terminal_tab_enable: true
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_deployer_chart_version: 2.0.3

agnosticd_passthrough_user_data:
  openshift_cluster_ingress_domain: "{{ openshift_cluster_ingress_domain | default(omit) }}"
  openshift_console_url: "{{ openshift_console_url  | default(omit) }}"
  openshift_user_password: "{{ common_password | default(omit) }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: a0198ffd-30fc-4ddc-a5c5-85abf31aa2af
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
  # add for pooled
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Red Hat Edge Manager Test Drive: Hands-on Fleet Management at the Edge (CNV)"
    workshopLabUiRedirect: true
    category: Brand_Events
    multiuser: true
    keywords:
    - rh1-2026
    - lb8580
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 60
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
    reportingLabels:
      primaryBU: Edge
      secondaryBU: Hybrid_Platforms
  owners:
    maintainer:
    - name: Judd Maltin
      email: judd@redhat.com
    sme:
    - name: Josh Swanson
      email: jswanson@redhat.com
    - name: Ken Osborn
      email: kosborn@redhat.com
    instructions:
    - name: Ken Osborn
      email: kosborn@redhat.com
  tower:
    timeout: 21600
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-virt-labs-pool
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '4.20'
      ocp4_fips_enable: false
    propagate_provision_data:
    # guest cluster credentials
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # ocpvN cluster credentials
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # propogate provision data for showroom
    - name: bastion_public_hostname
      var: bastion_public_hostname
    - name: bastion_ssh_user_name
      var: bastion_ssh_user_name
    - name: bastion_ssh_password
      var: bastion_ssh_password
    - name: bastion_ssh_port
      var: bastion_ssh_port
    - name: openshift_cluster_ingress_domain
      var: openshift_cluster_ingress_domain
