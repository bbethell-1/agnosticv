---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
#
# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: main
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: gitops_bootstrap-multi-tenant
  # Showroom
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: main

ocp4_workload_admin_username: "admin"
ocp4_workload_admin_password: "{{ admin_password }}"

ocp4_workload_user_password: "{{ user_password }}"
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: "user"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.25.2"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 5Gi
# ocp4_workload_gitea_operator_gitea_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel10/postgresql-16
ocp4_workload_gitea_operator_postgresql_image_tag: latest
ocp4_workload_gitea_operator_postgresql_volume_size: 5Gi
# ocp4_workload_gitea_operator_postgresql_volume_storage_class: ocs-external-storagecluster-cephfs
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: rhemadmin
ocp4_workload_gitea_operator_admin_email: rhemadmin@redhat.com
ocp4_workload_gitea_operator_admin_password: "{{ ocp4_workload_admin_password}}"

worker_instance_count: "{{ [(num_users | int / 10) | round(0, 'ceil') | int, 1] | max }}"

ocp4_workload_gitops_bootstrap_helm_values:
  gitea_admin_password: "{{ ocp4_workload_gitea_operator_admin_password }}"
  gitea_admin_username: "{{ ocp4_workload_gitea_operator_admin_user }}"
  guid: "{{ guid }}"
  user_password: "{{ user_password }}"
  admin_password: "{{ admin_password }}"
  user:
    count: "{{ num_users }}"
    prefix: "user"
  satellite_url: demosat-ha.infra.demo.redhat.com
  set_repositories_satellite_url: "{{ satellite_url }}"
  set_repositories_satellite_hostname: "{{ satellite_url }}"
  satellite_org: Red_Hat_RHDP_Labs
  set_repositories_satellite_org: "{{ satellite_org }}"
  set_repositories_satellite_ha: true
  satellite_activationkey: "{{ satellite_activationkey }}"
  set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"
  bastion_ssh_password: "{{ bastion_ssh_password }}"

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/edge-fleet-showroom.git
ocp4_workload_showroom_content_git_repo_ref: rh1-2026
ocp4_workload_showroom_content_antora_playbook: site.yml
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_deployer_chart_version: 2.0.4

__meta__:
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/dev
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '4.20'
      ocp4_fips_enable: false
      ols_enable: false
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    # guest cluster credentials
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # ocpvN cluster credentials
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # propogate provision data for showroom
    - name: bastion_public_hostname
      var: bastion_public_hostname
    - name: bastion_ssh_user_name
      var: bastion_ssh_user_name
    - name: bastion_ssh_password
      var: bastion_ssh_password
    - name: bastion_ssh_port
      var: bastion_ssh_port
