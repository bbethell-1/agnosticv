---
purpose: development

bastion_instance_image: bastion-5gran-ocp421
openshift_cnv_legacy_routes: true
bastion_cores: 96

bastion_memory: 256Gi
bastion_rootfs_size: 200Gi
project_tag: "{{ env_type }}-{{ guid }}"

common_update_packages: false

install_student_user: true
student_name: lab-user
student_sudo: true
student_password: "{{ common_password }}"

install_common: false
install_bastion: false
config_user_preferred_python: false

software_workloads:
  bastions:
  - ocp4_workload_5gran_deployments_lab

instances:
- name: bastion
  count: 1
  unique: true
  alt_name: bastion
  memory: "{{ bastion_memory }}"
  cores: "{{ bastion_cores }}"
  image_size: "{{ bastion_rootfs_size }}"
  image: "{{ bastion_instance_image }}"
  metadata:
  - AnsibleGroup: "bastions"
  - function: bastion
  - user: "{{ student_name }}"
  - project: "{{ project_tag }}"
  - ostype: linux
  - Purpose: "{{ purpose }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ guid }}"
  networks:
  - default
  services:
  - name: bastion
    ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      name: bastion-http
    - port: 443
      protocol: TCP
      targetPort: 443
      name: bastion-https
  routes:
  - name: bastion-http
    host: bastion
    service: bastion
    targetPort: 80
    tls: false
  - name: bastion-https
    host: bastion
    service: bastion
    targetPort: 443
    tls: true
  disks:
  - metadata:
      name: "extradisk{{ guid }}"
    spec:
      source:
        blank: {}
      pvc:
        accessModes:
        - ReadWriteMany
        volumeMode: Block
        resources:
          requests:
            storage: "1Ti"

inventory_groups: []

__meta__:
  deployer:
    scm_ref: development
    scm_url: https://github.com/RHsyseng/agnosticd
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv03
        - ocpv10
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpvdev01
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: "{{ job_vars.ocpv_cluster }}"
      virt: "yes"
    quota:
      requests.storage: "2600Gi"
