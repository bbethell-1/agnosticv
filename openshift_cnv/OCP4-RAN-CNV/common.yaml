---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

platform: RHPDS

bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

env_type: base-infra
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - bastions

node_name: node
pv_size_node: 4Gi

openshift_cnv_legacy_routes: true

bastion_instance_image: bastion-5gran-ocp420
bastion_cores: 96

bastion_memory: 256Gi
bastion_rootfs_size: 200Gi
project_tag: "{{ env_type }}-{{ guid }}"

install_student_user: true
student_name: lab-user
student_sudo: true
student_password: "{{ common_password }}"

install_common: false
install_bastion: false
config_user_preferred_python: false
common_update_packages: false

software_workloads:
  bastions:
    - ocp4_workload_5gran_deployments_lab

instances:
  - name: bastion
    count: 1
    unique: true
    alt_name: bastion
    memory: "{{ bastion_memory }}"
    cores: "{{ bastion_cores }}"
    image_size: "{{ bastion_rootfs_size }}"
    image: "{{ bastion_instance_image }}"
    metadata:
      - AnsibleGroup: "bastions"
      - function: bastion
      - user: "{{ student_name }}"
      - project: "{{ project_tag }}"
      - ostype: linux
      - Purpose: "{{ purpose }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ guid }}"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
    routes:
      - name: bastion-http
        host: bastion
        service: bastion
        targetPort: 80
        tls: false
      - name: bastion-https
        host: bastion
        service: bastion
        targetPort: 443
        tls: true
    disks:
      - metadata:
          name: "extradisk{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "1Ti"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_5gran_deployments_lab

pull_secret: "{{ ocp4_pull_secret }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.16
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 71fae99a-84d8-4b31-926b-341a0f8cff90
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "2600Gi"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "5G RAN RDS Deployments on OpenShift"
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ran
      - 5g
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters: []
    reportingLabels:
      primaryBU: Edge
      secondaryBU: Hybrid_Platforms
  tower:
    timeout: 18000  # 5 hours
  owners:
    maintainer:
      - name: Alberto Losada Grande
        email: alosadag@redhat.com
      - name: Mario Vazquez Cebrian
        email: mavazque@redhat.com
      - name: Billy Bethell
        email: bbethell@redhat.com
    sme:
      - name: Alberto Gonzales Rodriguez
        email: josegonz@redhat.com
    instructions:
      - name: Alberto Losada Grande
        email: alosadag@redhat.com
      - name: Mario Vazquez Cebrian
        email: mavazque@redhat.com
