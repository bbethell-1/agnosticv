---
#include /includes/access-restriction-aap-product-demos.yaml

# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

# --------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# --------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_version: 2.5

# --------------------------------------------------------------------
# Workload: ansible_automation_loader
# --------------------------------------------------------------------
automation_platform_loader_aap_version: 2.5

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    #scm_url: https://github.com/l3acon/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.0
      pull: always
