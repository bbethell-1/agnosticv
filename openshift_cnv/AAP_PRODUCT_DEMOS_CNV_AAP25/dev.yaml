---
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_url: https://github.com/l3acon/agnosticd.git
    scm_ref: aap25-updates
