---
#include /includes/catalog-icon-aap.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/event_controller.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/enable-cert-manager.yaml

#include /includes/secrets/demosat-rhel-9.3-ansible-2.4.yaml
#include /includes/secrets/ansible-tower-advanced-2.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/openshift-ocpv-configs.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# Platformss
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
ocp4_installer_version: "4.16"
ai_cluster_version: "{{ ocp4_installer_version }}"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
ai_control_plane_cores: 16
ai_control_plane_memory: '64Gi'
openshift_admin_user: kubeadmin
bastion_instance_image: rhel-9.3

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
project_tag: "{{ env_type }}-{{ guid }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
ssh_privatekey: "{{ lookup('file', hostvars.localhost.ssh_provision_key_path) }}"
ssh_publickey: "{{ hostvars.localhost.ssh_provision_pubkey_content }}"
bastion_student_show_user_info: true
create_ssh_provision_key_enable_user_info_data: true
host_ocp4_installer_set_user_data_kubeadmin_password: true
aws_access_key_id: "{{ aws_credentials.aws_access_key_id }}"
aws_secret_access_key: "{{ aws_credentials.aws_secret_access_key }}"


# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
use_content_view: true

# bastion node packages
common_extra_packages:
  - ansible-navigator
  - ansible-builder
  - ansible-lint
  - ansible-test

# -------------------------------------------------------------------
# Ansible Collections and Roles
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: amazon.aws
      version: 8.2.0
    - name: ansible.posix
      version: 1.6.0
    - name: ansible.utils
      version: 5.1.0
    - name: awx.awx
      version: 24.6.0
    - name: community.general
      version: 9.5.0
    - name: infra.controller_configuration
      version: 2.11.0
    - name: kubernetes.core
      version: 5.0.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.1
    - name: kubevirt.core
      version: 2.1.0
    - name: community.okd
      version: 4.0.0

# -------------------------------------------------------------------
# OCP Infra Workloads
# -------------------------------------------------------------------
student_workloads: []

infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
  - ocp4_workload_ansible_automation_platform
  - automation_platform_loader
  - automation_platform_bastion

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_cloud_provider: ec2
# ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false


# --------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform
# --------------------------------------------------------------------
controller_username: admin
ocp4_workload_ansible_automation_platform_version: 2.5
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_subscription_channel: "stable-2.5"
ocp4_workload_ansible_automation_platform_manifest:
  inject: true
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
  username: admin
  password: "{{ common_password }}"

# --------------------------------------------------------------------
# Workload: ansible_automation_loader
# --------------------------------------------------------------------
automation_platform_loader_aap_version: 2.5
automation_platform_loader_generate_ocp_token: true
automation_platform_loader_generate_ssh_keypair: false

apd_bootstrap_scm_branch: main

odf_channel: "{{ 'stable-4.14' if ocp4_installer_version == '4.15' else 'stable-4.15' if ocp4_installer_version == '4.16' else 'stable-' + ocp4_installer_version }}"

controller_dependency_check: false

controller_configuration_dispatcher_roles:
  - {role: settings, var: controller_settings, tags: settings}
  - {role: organizations, var: controller_organizations, tags: organizations}
  - {role: labels, var: controller_labels, tags: labels}
  - {role: users, var: controller_user_accounts, tags: users}
  - {role: teams, var: controller_teams, tags: teams}
  - {role: credential_types, var: controller_credential_types, tags: credential_types}
  - {role: credentials, var: controller_credentials, tags: credentials}
  - {role: credential_input_sources, var: controller_credential_input_sources, tags: credential_input_sources}
  - {role: notification_templates, var: controller_notifications, tags: notification_templates}
  - {role: projects, var: controller_projects, tags: projects}
  - {role: execution_environments, var: controller_execution_environments, tags: execution_environments}
  - {role: applications, var: controller_applications, tags: applications}
  - {role: inventories, var: controller_inventories, tags: inventories}
  - {role: instance_groups, var: controller_instance_groups, tags: instance_groups}
  - {role: project_update, var: controller_projects, tags: projects}
  - {role: inventory_sources, var: controller_inventory_sources, tags: inventory_sources}
  - {role: inventory_source_update, var: controller_inventory_sources, tags: inventory_sources}
  - {role: hosts, var: controller_hosts, tags: hosts}
  - {role: groups, var: controller_groups, tags: inventories}
  - {role: job_templates, var: controller_templates, tags: job_templates}
  - {role: workflow_job_templates, var: controller_workflows, tags: workflow_job_templates}
  - {role: schedules, var: controller_schedules, tags: schedules}
  - {role: roles, var: controller_roles, tags: roles}
  - {role: job_launch, var: controller_launch_jobs, tags: job_launch}
  - {role: workflow_launch, var: controller_workflow_launch_jobs, tags: workflow_launch}

controller_settings:
  - name: TOWER_URL_BASE
    value: "https://{{ automation_controller_hostname }}"

controller_credentials:
  - name: Demo Credential
    credential_type: Machine
    update_secrets: true
    inputs:
      username: admin
      ssh_key_data: "{{ ssh_privatekey }}"
      password: "{{ common_password }}"

  - name: Controller Credential
    credential_type: Red Hat Ansible Automation Platform
    organization: Default
    inputs:
      host: "https://{{ automation_controller_hostname }}"
      username: "{{ controller_username }}"
      password: "{{ ocp4_workload_ansible_automation_platform_admin_password }}"

  - name: OpenShift Credential
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

  - name: AWS
    credential_type: Amazon Web Services
    organization: Default
    update_secrets: false
    inputs:
      username: "{{ aws_access_key_id }}"
      password: "{{ aws_secret_access_key }}"

controller_projects:
  - name: Demo Project
    organization: Default
    scm_type: git
    scm_url: https://github.com/ansible/product-demos-bootstrap.git
    scm_branch: "{{ apd_bootstrap_scm_branch }}"
    wait: true

controller_templates:
  - name: Demo Job Template
    job_type: run
    inventory: Demo Inventory
    project: Demo Project
    playbook: install_product_demos.yml
    credentials: Controller Credential
    extra_vars:
      apd_ee_image_version: '25'

controller_launch_jobs:
  - name: Demo Job Template
    wait: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 21CD0CB5-BC6E-4AE6-A796-2948F34FDE28
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Ansible Product Demos (AAP 2.5)"
    category: Demos
    multiuser: false
    keywords:
      - ansible
      - openshift
      - ocp
      - cnv
      - aap
      - demo
      - aap25
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Automation
      Featured_Score: '80'
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.0
      pull: always
  components:
    - name: aws_sandbox
      display_name: AWS Credentials
      item: sandboxes-gpte/SANDBOX_OPEN
      propagate_provision_data:
        - var: aws_credentials
