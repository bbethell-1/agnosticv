---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/secrets/openshift_assisted_installer_icr.yaml
#include /includes/secrets/vmware-ibm-rs-clusters-access.yaml

ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"
hcp_controller_availability_policy: HighlyAvailable
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware variables
# -------------------------------------------------------------------

ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 60
        validation: >-
          num_users <= 2 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv03
          enum:
            - ocpv03
            - ocpv04
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        hcp: "yes"
        virt: "yes"
