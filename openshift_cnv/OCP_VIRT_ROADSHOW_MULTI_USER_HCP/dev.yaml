ocp4_pull_secret: '{{ ocp4_ai_pull_secret }}'
hcp_etcd_storage_class: hostpath-csi
hcp_disable_storage_class: true
purpose: development
ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: icr.io/rhdp/vddk:latest
ocp4_workload_mtv_use_patched_forkliftcontroller_image: false
ocp4_workload_mtv_forkliftcontroller_image_ref: ''
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_oadp_gitops
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware
- ocp4_workload_virt_roadshow_multi_user
- ocp4_workload_showroom
ocp4_workload_oadp_gitops_storage: odf
__meta__:
  deployer:
    scm_ref: hcp_disable_storage_class
  catalog:
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 60
      validation: num_users <= 2 || user_is_admin || user_groups.includes('rhpds-devs') || check_salesforce_id(salesforce_id) || Error('User count greater than TWO requires a valid SalesForceID')
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv03
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpvdev01
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: hcp_disable_storage_class
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: '{{ job_vars.ocpv_cluster }}'
      hcp: 'yes'
      virt: 'yes'
