---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/secrets/openshift_assisted_installer_icr.yaml
#include /includes/secrets/vmware-ibm-rs-clusters-access.yaml

ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"

hcp_etcd_storage_class: "hostpath-csi"
hcp_disable_storage_class: true

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware variables
# -------------------------------------------------------------------

ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"
ocp4_workload_mtv_use_patched_forkliftcontroller_image: false
ocp4_workload_mtv_forkliftcontroller_image_ref: ""

infra_workloads:
  #- ocp4_workload_authentication
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_gitops
  - ocp4_workload_web_terminal
  - ocp4_workload_kubevirt
  - ocp4_workload_mtv
  - ocp4_workload_oadp_gitops
  - ocp4_workload_virt_roadshow_vms
  - ocp4_workload_virt_roadshow_vmware
  - ocp4_workload_virt_roadshow_multi_user
  - ocp4_workload_showroom

ocp4_workload_oadp_gitops_storage: odf

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: hcp_disable_storage_class
  catalog:
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 60
        validation: >-
          num_users <= 2 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        hcp: "yes"
        virt: "yes"
