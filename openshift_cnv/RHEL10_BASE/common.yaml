---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: openshift_cnv
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-10.0

instances:
  - name: "rhel10"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
      # - name: nodehttp
      #   ports:
      #     - port: 80
      #       protocol: TCP
      #       targetPort: 80
      #       name: node-http
      - name: cockpit
        ports:
          - port: 9090
            protocol: TCP
            targetPort: 9090
            name: cockpit-https
    routes:
      - name: bastion-https
        host: bastion
        service: bastion
        targetPort: 443
        tls: true
      # - name: node-http
      #   host: rhel10
      #   service: nodehttp
      #   targetPort: 80
      #   tls: false
      - name: cockpit-https
        host: rhel10
        service: cockpit
        targetPort: 9090
        tls: true

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - bastion-lite
    - control-user

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:12] }}"

# -------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  ssh_command: "ssh {{ student_name }}@{{ openshift_cnv_ssh_address }} -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_password: "{{ common_password }}"
  ssh_username: "{{ student_name }}"
  cloud_provider: "{{ cloud_provider }}"
  guid: "{{ guid }}"
  subdomain_base: "{{ subdomain_base_suffix }}"
  subdomain: "{{ subdomain }}"
  cockpit_console_url: "https://rhel10.{{ subdomain }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8917E754-6975-4BE0-8491-8160B325CFE2
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: RHEL 10 Base
    category: Demos
    keywords:
      - rhel
      - rhel10
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-07
      pull: missing
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: msharma@redhat.com
