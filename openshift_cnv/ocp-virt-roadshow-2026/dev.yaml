# ping
# DEVELOPMENT - Experience OpenShift Virtualization Roadshow (2026)

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: "prod"
        virt: "yes"
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
        limits.memory: "800Gi"
        requests.memory: "800Gi"
