# EVENT - Experience OpenShift Virtualization Roadshow (2026)
---
#include /includes/ansible_control_plane/event_controllers_lb.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
ocp4_workload_kubevirt_automatic_install_plan_approval: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: cnv-virt-roadshow-multi-3.0.0 # 3 is major 2026 release
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
