# EVENT - Experience OpenShift Virtualization Roadshow (2026)
---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/access-restriction-admins-only.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
ocp4_workload_kubevirt_automatic_install_plan_approval: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    parameters:
      - name: ocp4_workload_showroom_content_git_repo
        description: Showroom git repo
        formLabel: Showroom git repo
        openAPIV3Schema:
          type: string
          default: 'https://github.com/rhpds/ocp-virt-roadshow-2026-showroom.git'
      - name: ocp4_workload_showroom_content_git_repo_ref
        description: Showroom git branch or tag
        formLabel: Showroom git branch or tag
        openAPIV3Schema:
          type: string
          default: 'main'
  deployer:
    scm_ref: cnv-virt-roadshow-multi-3.0.5 # 3 is major 2026 release
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
        name: ocpv09
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
