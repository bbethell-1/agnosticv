---
# COMMON: Experience OpenShift Virtualization Roadshow (2026)

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml

#include /includes/sandbox-api.yaml
#include /includes/enterprise-premium-sla.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/openshift_assisted_installer_icr.yaml
#include /includes/secrets/acme-bifrost.yaml
#include /includes/secrets/vmware-ibm-rs-clusters-access.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 6Gi

ai_control_plane_cores: >-
  {{ 16 if worker_instance_count|int <= 10
  else 32 if worker_instance_count|int <= 20
  else 64
  }}
ai_control_plane_memory: >-
  {{ '32Gi' if worker_instance_count|int <= 10
  else '64Gi' if worker_instance_count|int <= 20
  else '128Gi'
  }}
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"

ai_workers_cores: 16
# WK: Hardcoding memory - seems wrong to calculate both number of workers and then adjust the memory as well
ai_workers_memory: '64Gi'
# ai_workers_memory: >-
#  {{ '32Gi' if num_users|int <= 10
#  else '64Gi'
#  }}

ocp4_installer_version: "4.21.10"

ai_attach_workers_networks:
  - default/flatnetwork

networks:
  - name: cluster

ai_install_use_network: "cluster{{ guid }}"
bastion_extra_networks:
  - "cluster"

bastion_userdata: |
  #cloud-config
  write_files:
    - path: /etc/sysctl.d/99-ip-forwarding.conf
      content: |
        net.ipv4.ip_forward=1

    - path: /etc/nftables/ruleset.nft
      content: |
        table inet nat {
          chain postrouting {
            type nat hook postrouting priority 100; policy accept;
            oifname "eth0" masquerade
          }
        }

        table inet filter {
          chain forward {
            type filter hook forward priority 0; policy drop;
            iifname "eth1" oifname "eth0" accept
            iifname "eth0" oifname "eth1" ct state related,established accept
          }
        }

    - path: /etc/systemd/system/nftables-restore.service
      content: |
        [Unit]
        Description=Restore nftables rules
        After=network.target

        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c 'while [ ! -x /usr/sbin/nft ]; do sleep 2; done; /usr/sbin/nft -f /etc/nftables/ruleset.nft'
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target

  runcmd:
    - sysctl --system
    - systemctl daemon-reload
    - systemctl enable --now nftables-restore.service

bastion_networkdata: |
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: yes
      eth1:
        dhcp4: no
        addresses:
          - 10.10.10.1/24

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_gitops
  - ocp4_workload_web_terminal
  - ocp4_workload_kubevirt
  - ocp4_workload_mtv
  - ocp4_workload_oadp_gitops
  - ocp4_workload_nmstate
  - ocp4_workload_virt_roadshow_vms
  - ocp4_workload_virt_roadshow_vmware
  - ocp4_workload_virt_roadshow_multi_user
  - ocp4_workload_virt_network_config
  - ocp4_workload_showroom

# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads:
  - ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"

# -------------------------------------------------------------------
# ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: true
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"
ocp4_workload_virt_network_config_bridge_type: linux-bridge
ocp4_workload_virt_network_config_bridge_name: br-flat

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.21
ocp4_workload_external_odf_volume_binding_mode: Immediate

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/acme-bifrost.yaml

ocp4_workload_cert_manager_channel: stable-v1
#ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_update_route_tls: false
ocp4_workload_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false
ocp4_workload_kubevirt_starting_csv: "kubevirt-hyperconverged-operator.v4.21.1"

# -------------------------------------------------------------------
# Workload: ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.11
ocp4_workload_mtv_starting_csv: "mtv-operator.v2.11.4"
ocp4_workload_mtv_max_vm_inflight: "{{ [(num_users | int * 3) | int, 40] | min }}"
ocp4_workload_mtv_forklift_controller_container_limits_cpu: "{{ [(num_users | int * 100) | int, 1000] | max }}m"
ocp4_workload_mtv_forklift_controller_container_limits_memory: "{{ [(num_users | int * 400) | int, 2000] | max }}Mi"

# -------------------------------------------------------------------
# ocp4_workload_oadp_gitops
# -------------------------------------------------------------------
ocp4_workload_oadp_gitops_channel: stable
ocp4_workload_oadp_gitops_use_catalog_snapshot: false

# Multi User
ocp4_workload_oadp_gitops_multi_user: true
ocp4_workload_oadp_gitops_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_oadp_gitops_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_oadp_gitops_namespace_base: oadp
ocp4_workload_oadp_gitops_configure_dpa: true
ocp4_workload_oadp_gitops_storage: odf

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vms
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vms_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_virt_roadshow_vms_base_namespace: vmimported-
ocp4_workload_virt_roadshow_vms_userbase: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_virt_roadshow_vms_start_vms: false
# Roadshow Setup
# When set to true (default) then the application made up from the VMs will not
# work until instructions are followed.
# When false the application will work out of the box without changes
ocp4_workload_virt_roadshow_vms_roadshow_setup: true
ocp4_workload_virt_roadshow_vms_imported_configure_svc_and_route: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_roadshow_vmware
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vmware_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_virt_roadshow_vmware_enable_mtv: true
ocp4_workload_virt_roadshow_vmware_enable_cert_validation: false

# For multiple users
ocp4_workload_virt_roadshow_vmware_vcenter_folder_base: "ocpvirt-{{ guid }}-{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_virt_roadshow_vmware_vcenter_user_base: "ocpvirt-{{ guid }}-{{ ocp4_workload_authentication_htpasswd_user_base }}"

# User base for OCP Authentication (to assign vCenter users to OCP users in agnosticd_user_info)
ocp4_workload_virt_roadshow_auth_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

# MTV Namespace base to use for multi user.
# For single user the namespace is always `openshift-mtv`
ocp4_workload_virt_roadshow_vmware_mtv_namespace_base: "mtv-{{ ocp4_workload_virt_roadshow_auth_user_base }}"
ocp4_workload_virt_roadshow_vsphere_ignore_pip_check: false

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_multi_user
# -------------------------------------------------------------------
# In the future once bug https://issues.redhat.com/browse/CNV-38284 is in the product
# the namespace will need to change to openshift-cnv
ocp4_workload_virt_roadshow_multi_user_configmap_namespace: openshift-cnv

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-virt-roadshow-2026-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 99b6319c-7a39-4a24-b71a-e31476dd41ac
  owners:
    maintainer:
      - name: Wolfgang Kulhanek
        email: wkulhanek@redhat.com
    sme:
      - name: Alberto Gonzalez Rodriguez
        email: arodriguez@redhat.com
    instructions:
      - name: Wolfgang Kulhanek
        email: wkulhanek@redhat.com
      - name: Alan Cowles
        email: acowles@redhat.com

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
        limits.memory: "800Gi"
        requests.memory: "800Gi"
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox

  catalog:
    display_name: "Experience OpenShift Virtualization Roadshow (2026)"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    workshopLabUiRedirect: true
    workshopUiMaxInstances: 4 #allows up to 80 users if not deployed via admins
    workshopUiEnabledByDefault: true
    parameters:
      - name: num_users
        description: >-
          This specifies the number of individual users to provision within EACH OpenShift cluster you deploy.
          Each cluster supports a maximum of 20 users.

          **Advisory**: If you have "Enable workshop use" toggled on, we strongly recommend
          setting this to 20 for optimal resource utilization.
        # The label now specifies that the recommendation is for workshops
        formLabel: 'OpenShift User Count (Workshop Recommended: 20)'
        openAPIV3Schema:
          type: integer
          # Default to the recommended value for the most common use case
          default: 20
          minimum: 2
          maximum: 20
    keywords:
      - cnv
      - cnvocp
      - ocpcnv
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '91'
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms

  tower:
    timeout: 21600
