---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6

install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# OpenShift
# -------------------------------------------------------------------

worker_instance_count: 7

ocp4_installer_version: "4.18"

ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

ai_workers_cores: 16
ai_workers_memory: 64Gi

ai_machineconfigs:
- apiVersion: machineconfiguration.openshift.io/v1
  kind: MachineConfig
  metadata:
    labels:
      machineconfiguration.openshift.io/role: worker
    name: 99-openshift-machineconfig-worker-psi-karg
  spec:
    kernelArguments:
    - psi=1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
#- ocp4_workload_infra_nodes
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_kubevirt
- ocp4_workload_ansible_automation_platform_25
- ocp4_workload_gitea_operator
- ocp4_workload_codeserver
- ocp4_workload_gitops_bootstrap
- ocp4_workload_nmstate
- ocp4_workload_virt_network_config
- ansible_automation_platform_configuration
- ocp4_workload_showroom

ocp4_workload_infra_nodes_remove_worker_labels: false

odf_channel: stable-4.18
ocp4_workload_lvms_channel: stable-4.18

ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_kubevirt_use_catalog_snapshot: false

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
# FORKED: ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpte-devopsautomation/virt-aap-day2-showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-virt-advanced-ops-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_chart_package_url: https://agonzalezrh.github.io/showroom-deployer
ocp4_workload_showroom_content_image: ghcr.io/agonzalezrh/showroom-content:main
ocp4_workload_showroom_deployer_chart_version: "1.7.2"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"

# hcp_etcd_storage_class: "hostpath-csi"
# hcp_disable_storage_class: true

# -------------------------------------------------------------------
# ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: false
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"
ocp4_workload_virt_network_config_bridge_type: linux-bridge
ocp4_workload_virt_network_config_bridge_name: br-flat

ai_attach_workers_networks:
- default/flatnetwork

networks:
- name: cluster

ai_install_use_network: "cluster{{ guid }}"
bastion_extra_networks:
- "cluster"

bastion_userdata: |
  #cloud-config
  write_files:
  - path: /etc/sysctl.d/99-ip-forwarding.conf
    content: |
      net.ipv4.ip_forward=1

  - path: /etc/nftables/ruleset.nft
    content: |
      table inet nat {
        chain postrouting {
          type nat hook postrouting priority 100; policy accept;
          oifname "eth0" masquerade
        }
      }

      table inet filter {
        chain forward {
          type filter hook forward priority 0; policy drop;
          iifname "eth1" oifname "eth0" accept
          iifname "eth0" oifname "eth1" ct state related,established accept
        }
      }

  - path: /etc/systemd/system/nftables-restore.service
    content: |
      [Unit]
      Description=Restore nftables rules
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'while [ ! -x /usr/sbin/nft ]; do sleep 2; done; /usr/sbin/nft -f /etc/nftables/ruleset.nft'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  runcmd:
  - sysctl --system
  - systemctl daemon-reload
  - systemctl enable --now nftables-restore.service

bastion_networkdata: |
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: yes
      eth1:
        dhcp4: no
        addresses:
          - 10.10.10.1/24

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp-virt-advanced-ops-gitops.git
#ocp4_workload_gitops_bootstrap_repo_revision: v1.0.1 <-- This is summit2025 tag
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    #scm_ref: judd-ocp4-workload-infra-nodes
    scm_ref: development
  catalog:
    category: Workshops
  access_control:
    allow_groups:
    - rhpds-devs-virt
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2000Gi" # 4 * 20Gi:  ~ 80 Gi
      limits.cpu: "256" # 16 * 3 + 16 * 4 : ~  120 cores
      requests.cpu: "256"
      limits.memory: "1000Gi" # 48 * 4 + 16 * 3 : ~ 250 Gi
      requests.memory: "1000Gi"
