---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6

install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# OpenShift
# -------------------------------------------------------------------

ocp4_installer_version: "4.18"
ai_network_mtu: 9000
ai_workers_cores: 24
ai_workers_memory: 48Gi

ai_workers_extra_disks:
- metadata:
    name: "extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "20Gi"

odf_channel: stable-4.18
ocp4_workload_lvms_channel: stable-4.18

ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_kubevirt_use_catalog_snapshot: false
ocp4_workload_rhacm_use_catalog_snapshot: false

ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    category: Workshops
  access_control:
    allow_groups:
    - rhpds-devs-virt
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "4000Gi"
      limits.cpu: "512"
      requests.cpu: "512"
      limits.memory: "2000Gi"
      requests.memory: "2000Gi"
