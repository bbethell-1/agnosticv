---
#include /includes/ansible_control_plane/current_controller.yaml
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

#include /includes/access-restriction-admins-only.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: namespace

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: dfaf6102-5bd0-4263-8dda-dad6352fc5ec

  owners:
    maintainer:
      - name: Guillaume Core
        email: gucore@redhat.com
    sme:
      - name: Guillaume Core
        email: gucore@redhat.com

  # Do not run agnosticd at all
  deployer:
    actions:
      destroy:
        disable: true
      provision:
        disable: true
      stop:
        disable: true
      start:
        disable: true
      status:
        disable: true
      update:
        disable: true

  # Order from sandbox API.
  # TODO: this should be move as a default in the sandbox-api.yaml include
  sandbox_api:
    actions:
      start:
        enable: true
      stop:
        enable: true
      status:
        enable: true
      provision:
        enable: true
      destroy:
        enable: true

  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: namespace_suffix
        description: Namespace suffix ( sandbox-GUID-SUFFIX )
        formLabel: Namespace suffix
        openAPIV3Schema:
          type: string
          default: 'dev'
      - name: param_selector_virt
        description: Do you need OpenShift Virtualization?
        formLabel: OpenShift Virtualization
        openAPIV3Schema:
          type: string
          default: 'yes'
          enum:
            - 'yes'
            - 'no'
        sandboxCloudSelectors:
          - annotation: virt
            kind: OcpSandbox
    keywords:
      - openshift
      - sandbox
      - blank
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    display_name: Blank Namespace on CNV
    category: Open_Environments

  anarchy:
    namespace: babylon-anarchy-ocp-wksp
