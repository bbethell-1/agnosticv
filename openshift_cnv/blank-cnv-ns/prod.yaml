---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: "{{ job_vars.namespace_suffix | default('dev') }}"
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
        keycloak: "yes"
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
        limits.memory: "500Gi"
        requests.memory: "500Gi"
        requests.storage: 1000Gi
