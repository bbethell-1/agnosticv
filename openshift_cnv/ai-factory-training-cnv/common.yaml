# -------------------------------------------------------------------
# Catalog Item: AI Factory Training
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
tag: main
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # AI OpenShift Workloads
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"
  # OpenShift AI Workloads
  - name: https://github.com/rhpds/rhpds.openshift-ai.git
    type: git
    version: "{{ tag }}"
  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.3.1"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_authorino
- agnosticd.core_workloads.ocp4_workload_pipelines
- agnosticd.core_workloads.ocp4_workload_serverless
- agnosticd.core_workloads.ocp4_workload_metallb
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_automatic_install_plan_approval: true
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_enable_l2advertisement: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.2
# Generate admin
ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: ""
# Generate user
ocp4_workload_authentication_num_users: 1
ocp4_workload_authentication_user_basename: user
ocp4_workload_authentication_user_password: ""

ocp4_workload_authentication_keycloak_openshift_client_secret: ""
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_authorino
# -------------------------------------------------------------------
ocp4_workload_authorino_operator_channel: stable

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: latest

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable-3.3
ocp4_workload_openshift_ai_automatic_install_plan_approval: false

# DSC Configuration
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed

ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_modelregistry_namespace: rhoai-model-registries
ocp4_workload_openshift_ai_modelregistry_config:
  managementState: "{{ ocp4_workload_openshift_ai_modelregistry }}"
  registriesNamespace: "{{ ocp4_workload_openshift_ai_modelregistry_namespace }}"

ocp4_workload_openshift_ai_ray: Managed
ocp4_workload_openshift_ai_trustyai: Managed
ocp4_workload_openshift_ai_trainingoperator: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_feastoperator: Managed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed

# -------------------------------------------------------------------
# rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_dashboard_config_settings:
  disableTracking: false
  disableModelRegistry: false
  disableModelCatalog: false
  disableKServeMetrics: false
  genAiStudio: true
  modelAsService: true
  disableLMEval: false

ocp4_workload_openshift_ai_dashboard_config_notebook_controller:
  enabled: true
  pvcSize: 20Gi

ocp4_workload_openshift_ai_hardware_profile_gpu_identifiers:
- defaultCount: '1'
  displayName: CPU
  identifier: cpu
  maxCount: '8'
  minCount: 1
  resourceType: CPU
- defaultCount: 12Gi
  displayName: Memory
  identifier: memory
  maxCount: 16Gi
  minCount: 1Gi
  resourceType: Memory

# -------------------------------------------------------------------
# Workload: rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models:
- granite-4-0-h-tiny
- qwen3-14b
ocp4_workload_litellm_virtual_keys_duration: "3d"
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workloads to remove before sandbox is nuked
# make sure __meta__.sandbox_api.actions.destroy.catch_all is set to false
# -------------------------------------------------------------------
remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6525546f-d6be-49b2-a983-d7e87c19084e
  owners:
    maintainer:
    - name: Pablo Solar Vilariño
      email: psolarvi@redhat.com
    - name: Tyrell Reddy
      email: treddy@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "AI Factory Training (CNV)"
    category: Labs
    multiuser: false
    workshopLabUiRedirect: true
    keywords:
    - rhoai
    - llm
    - ptl
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
    reportingLabels:
      primaryBU: Artificial_Intelligence

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: '4.20'
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  sandbox_api:
    actions:
      destroy:
        # Allow the ocp4_workload_ols and litellm remove_workloads to run
        catch_all: false
      start:
        # override default to let sandbox-api start and stop
        enable: true
      stop:
        # override default to let sandbox-api start and stop
        enable: true

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-02-23
      pull: missing
    actions:
      start:
        # This is default setting
        disable: false
      stop:
        # This should let sandbox-api handle stopping
        disable: true
