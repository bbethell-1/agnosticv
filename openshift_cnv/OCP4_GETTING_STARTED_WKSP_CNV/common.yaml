---
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift-cnv-ocpv01-sa.yml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv


# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

ai_control_plane_cores: >-
  {{ 8 if worker_instance_count|int <= 10
  else 16 if worker_instance_count|int <= 20
  else 32
  }}
ai_control_plane_memory: >-
  {{ '16Gi' if worker_instance_count|int <= 10
  else '32Gi' if worker_instance_count|int <= 20
  else '64Gi'
  }}
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"

bastion_instance_image: rhel-9.1

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true


# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    infra_workloads: ''
    student_workloads: ''
  idle_after_deploy: 9999
  idle_after_start: 9999

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_opentlc_production
- ocp4_workload_project_request_template
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp-workload-etherpad
- ocp4_workload_nexus_operator
- ocp-workload-gogs
- ocp-workload-gogs-load-repository
- ocp4-workload-homeroomlab-starter-guides
- ocp4-workload-osevg-workshop-tracker

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.3-opr-002
ocp4_workload_rhsso_authentication_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_rhsso_authentication_catalogsource_tag: v4.13_2023_06_26
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_rhsso_authentication_admin_create: true
ocp4_workload_rhsso_authentication_admin_username: admin
ocp4_workload_rhsso_authentication_admin_password: "{{ common_password }}"

ocp4_workload_rhsso_authentication_user_count: "{{ num_users | default(0) }}"
ocp4_workload_rhsso_authentication_user_name_base: user
ocp4_workload_rhsso_authentication_user_password: "{{ common_password }}"


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 348b177e-7855-425a-a494-9235c1e17303
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 Getting Started Workshop Powered-by CNV
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_CNV
      Provider: RHDP
      Product_Family: Red_Hat_Openshift
      Featured_Score: '68'
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 1
        maximum: 20
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: ocp4-token
  - name: output-dir-s3
    namespace: gpte
  - name: ocp4_ai_offline_token
    namespace: gpte
  - name: dynamic-aws-dns
    namespace: gpte
