---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_cluster_version: "4.14"
student_password: "{{ common_password }}"
# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
studentvm_roles:
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
  - studentvm_ocp4

# Override desired version of the OpenShift CLI
studentvm_ocp4_oc_version: "4.14.6"
student_workloads: []
ocp_username: cluster-admin
infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_opentlc_production
  - ocp4_workload_project_request_template
  - ocp4_workload_le_certificates
  - ocp4_workload_pipelines
  - ocp-workload-etherpad
  - ocp4_workload_nexus_operator
  - ocp-workload-gogs
  - ocp-workload-gogs-load-repository
  - ocp4-workload-homeroomlab-starter-guides
  - ocp4-workload-osevg-workshop-tracker
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Legacy Roles
# -------------------------------------------------------------------
gogs_project: labs
etherpad_project: labs
project_name: labs
workshop_type: starter
# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"


ocp4_workload_showroom_content_git_repo_ref: showroom
ocp4_workload_showroom_content_git_repo: https://github.com/sebastienblanc/openshift-starter-guides.git

ocp4_workload_showroom_deployment_type: helm
#ocp4_workload_showroom_deployment_type: argocd

ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
#ocp4_workload_showroom_terminal_type: wetty
#ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.0.1"

ocp4_workload_homeroomlab_starter_guides_per_user_info_enable: false
homeroom_template_path: "https://raw.githubusercontent.com/rhpds/workshop-homeroom/develop/templates/production.json"
lab_branch: ocp-4.8
lab_repo: "https://github.com/treddy08/starter-guides"
repositories:
  - base: https://github.com/treddy08
    name: nationalparks
  - base: https://github.com/openshift-roadshow
    name: nationalparks-py
  - base: https://github.com/openshift-roadshow
    name: nationalparks-dotnet
  - base: https://github.com/openshift-roadshow
    name: nationalparks-js

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: agonzalez-getting-1
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
