---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_cluster_version: "4.13"

# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
studentvm_roles:
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
  - studentvm_ocp4

# Override desired version of the OpenShift CLI
studentvm_ocp4_oc_version: "4.13.19"
student_workloads: []
ocp_username: cluster-admin
infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_opentlc_production
  - ocp4_workload_project_request_template
  - ocp4_workload_le_certificates
  - ocp4_workload_pipelines
  - ocp-workload-etherpad
  - ocp4_workload_nexus_operator
  - ocp-workload-gogs
  - ocp-workload-gogs-load-repository
  - ocp4-workload-homeroomlab-starter-guides
  - ocp4-workload-osevg-workshop-tracker
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Legacy Roles
# -------------------------------------------------------------------
gogs_project: labs
etherpad_project: labs
project_name: labs
workshop_type: starter
# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/showroom-eda-and-chatops.git
showroom_git_ref: main
showroom_var_inject: true
showroom_ssh_method: sshkey
showroom_ssh_username: "{{ student_name }}"
showroom_default_ssh_user: "{{ student_name }}"
#showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
showroom_lab_users:
  - "{{ student_name }}"
ocp4_workload_homeroomlab_starter_guides_per_user_info_enable: false
homeroom_template_path: "https://raw.githubusercontent.com/rhpds/workshop-homeroom/develop/templates/production.json"
lab_branch: ocp-4.8
lab_repo: "https://github.com/treddy08/starter-guides"
repositories:
  - base: https://github.com/treddy08
    name: nationalparks
  - base: https://github.com/openshift-roadshow
    name: nationalparks-py
  - base: https://github.com/openshift-roadshow
    name: nationalparks-dotnet
  - base: https://github.com/openshift-roadshow
    name: nationalparks-js

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
