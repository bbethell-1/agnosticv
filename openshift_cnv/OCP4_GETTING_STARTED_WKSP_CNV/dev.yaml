---
#include /includes/secrets/openshift-sandbox-ocpvdev01-sa.yml
#include /includes/secrets/openshift-ocpv-configs.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_cluster_version: "4.14"
openshift_cnv_api_uri: https://api.ocpvdev01.dal10.infra.demo.redhat.com:6443

student_password: "{{ common_password }}"
# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
studentvm_roles:
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
  - studentvm_ocp4
# -------------------------------------------------------------------
# Legacy Roles
# -------------------------------------------------------------------
gogs_project: labs
etherpad_project: labs
project_name: labs
workshop_type: starter
# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"


ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-starter-guides.git

ocp4_workload_showroom_deployment_type: helm
#ocp4_workload_showroom_deployment_type: argocd

ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
ocp4_workload_showroom_ocpconsole: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.0.5"

ocp4_workload_homeroomlab_starter_guides_per_user_info_enable: false
homeroom_template_path: "https://raw.githubusercontent.com/rhpds/workshop-homeroom/develop/templates/production.json"
lab_branch: ocp-4.8
lab_repo: "https://github.com/treddy08/starter-guides"
repositories:
  - base: https://github.com/treddy08
    name: nationalparks
  - base: https://github.com/openshift-roadshow
    name: nationalparks-py
  - base: https://github.com/openshift-roadshow
    name: nationalparks-dotnet
  - base: https://github.com/openshift-roadshow
    name: nationalparks-js

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
