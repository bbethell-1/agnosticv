---

# -------------------------------------------------------------------
# Collections for this DEV environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: "{{ tag }}"
  # Provides workloads rhpds.workshop
  - name: https://github.com/rhpds/adv-app-platform-demo-automation
    type: git
    version: main
  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main
  # Showroom Collection
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "v1.5.2"

# -------------------------------------------------------------------
# Workload: ocp4_etx_app_platform
# -------------------------------------------------------------------
# Override Helm Chart branch/repo used for deployment in dev env
ocp4_etx_app_platform_gitops_repo: https://github.com/redhat-ads-tech/ocp-app-platform-demo-helm
ocp4_etx_app_platform_gitops_repo_tag: dev
ocp4_etx_app_platform_developer_hub_config_git_revision: dev

# override showroom gitops repo to use main branch for testing
ocp4_workload_showroom_content_git_repo_ref: main

# Allow provisioning to complete in DEV, even if argo has errors to allow debugging
ocp4_etx_app_platform_wait_for_apps_ignore_errors: true

# Enable catalog source pinnign for the app-of-apps operator installs
ocp4_etx_app_platform_catalog_source_enabled: true

# -------------------------------------------------------------------
# Workload: rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models:
- nomic-embed-text-v1-5
- qwen3-14b
- qwen3-235b
- gpt-oss-20b
- gpt-oss-120b

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
