purpose: development
bastion_instance_image: rhel-9.4
bastion_rootfs_size: 200Gi
project_tag: '{{ env_type }}-{{ guid }}'
install_student_user: true
student_name: lab-user
student_sudo: true
student_password: '{{ common_password }}'
install_common: false
install_bastion: false
config_user_preferred_python: false
instances:
- name: bastion
  count: 1
  unique: true
  alt_name: bastion
  memory: '{{ bastion_memory }}'
  cores: '{{ bastion_cores }}'
  image_size: '{{ bastion_rootfs_size }}'
  image: '{{ bastion_instance_image }}'
  metadata:
  - AnsibleGroup: bastions
  - function: bastion
  - user: '{{ student_name }}'
  - project: '{{ project_tag }}'
  - ostype: linux
  - Purpose: '{{ purpose }}'
  tags:
  - key: AnsibleGroup
    value: bastions
  - key: ostype
    value: linux
  - key: instance_filter
    value: '{{ env_type }}-{{ guid }}'
  networks:
  - default
  disks:
  - metadata:
      name: extradisk{{ guid }}
    spec:
      source:
        blank: {}
      pvc:
        accessModes:
        - ReadWriteMany
        volumeMode: Block
        resources:
          requests:
            storage: 200Gi
  services:
  - name: bastion-fip
    type: LoadBalancer
    ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      name: bastion-http
    - port: 443
      protocol: TCP
      targetPort: 443
      name: bastion-https
    - port: 8080
      protocol: TCP
      targetPort: 8080
      name: bastion-http-alt
inventory_groups: []
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpv08
        - ocpvdev01
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: '{{ job_vars.ocpv_cluster }}'
      virt: 'yes'
    quota:
      requests.storage: 2600Gi
