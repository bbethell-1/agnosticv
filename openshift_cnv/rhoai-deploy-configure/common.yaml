---
# -------------------------------------------------------------------
# Catalog Item: OpenShift AI: Deploy and Configure
# JIRA: GPTEINFRA-17934
# Author: Mike Hepburn (mhepburn@redhat.com)
# Maintainer: Prakhar Srivastava (psrivast@redhat.com)
#
# Each user gets their own SNO cluster with 1 worker node.
# CPU-only LLM deployments — no GPU required.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/access-restriction-devs-only.yaml
#include /includes/catalog-icon-openshift-ai.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# CNV Worker Nodes — 1 worker for AI workloads
# SNO base + 1 worker: 32 vCPU, 128GB RAM, 300GB disk
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 1
ai_workers_cores: 32
ai_workers_memory: 128Gi
ai_workers_root_disk_size: 300Gi

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main

# -------------------------------------------------------------------
# Additional Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.7.2
  - name: https://github.com/rhpds/rhpds.manage_host.git
    type: git
    version: "{{ tag }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- rhpds.manage_host.ocp4_workload_bastion_tools
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"
common_admin_username: admin

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# ocp4_workload_bastion_tools
# -------------------------------------------------------------------
ocp4_workload_bastion_tools_rpms:
- jq
- bash-completion

ocp4_workload_bastion_tools_binaries:
- description: Install helm
  url: https://rhdp-public.s3.us-east-1.amazonaws.com/binaries/helm/helm-v4.2.4-linux-amd64
  dest: /usr/local/bin/helm
  mode: "0755"

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.21
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# PH monorepo pattern: bootstrap lives at automation/gitops/bootstrap-infra/
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ph-deploy-configure-rhoai
ocp4_workload_gitops_bootstrap_repo_revision: "{{ tag }}"
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-infra
ocp4_workload_gitops_bootstrap_application_name: bootstrap-infra
ocp4_workload_gitops_bootstrap_helm_values:
  guid: "{{ guid }}"

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ph-deploy-configure-rhoai
ocp4_workload_showroom_content_git_repo_ref: "{{ tag }}"
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 514ad97c-2e18-48db-9586-99a336e6ea43
  owners:
    maintainer:
    - name: Prakhar Srivastava
      email: psrivast@redhat.com
    sme:
    - name: Mike Hepburn
      email: mhepburn@redhat.com
    instructions:
    - name: Mike Hepburn
      email: mhepburn@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-09-15
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Red Hat OpenShift AI: Deploy and Configure"
    category: Labs
    workshopLabUiRedirect: true
    multiuser: false
    keywords:
    - rhoai
    - openshift-ai
    - deploy
    - configure
    - vllm
    - cpu
    - llm-d
    - keda
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
