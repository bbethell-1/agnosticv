# -------------------------------------------------------------------
__meta__:
  asset_uuid: b18d7a42-2faa-454c-903b-c8cf850ccacd
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-06-27
      pull: missing
 # sandbox_api:
 #   actions:
 #     destroy:
 #       catch_all: false
 # sandboxes:
 # - kind: OcpSandbox
 #   namespace_suffix: ocp4-cluster
 #   cloud_selector:
 #     cloud: cnv
 #     purpose: prod
