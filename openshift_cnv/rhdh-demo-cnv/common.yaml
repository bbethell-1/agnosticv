ocp4_workload_redhat_developer_hub_orchestrator_workflows:
  repo: https://redhat-ads-tech.github.io/orchestrator-workflows
  chart:
    - name: greeting
      location: orchestrator-workflows/greeting
      customParameters: >-
        --set-string=persistence.postgresql.secretRef.name=backstage-postgresql-svcbind-postgres
        --set-string=persistence.postgresql.secretRef.userKey=username
        --set-string=persistence.postgresql.secretRef.passwordKey=password
        --set-string=persistence.postgresql.serviceRef.name=backstage-postgresql
        --set-string=persistence.postgresql.serviceRef.databaseName=sonataflow
        --set-string=persistence.postgresql.serviceRef.databaseSchema=greeting

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_infra_repo: https://redhat-developer.github.io/rhdh-chart
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_infra_version: 0.2.3
ocp4_workload_redhat_developer_hub_bootstrap_openshift_cluster_admin_token: "{{ openshift_cluster_admin_token }}"
ocp4_workload_redhat_developer_hub_bootstrap_openshift_api_url: >-
  {{
    (openshift_api_url if openshift_api_url.startswith('https://') else 'https://' + openshift_api_url)
    | regex_replace('(?<!:6443)$', ':6443')
  }}
ocp4_workload_redhat_developer_hub_bootstrap_cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 83250a42-9997-4424-8d8d-b9b56944265e
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Developer Hub Demo (CNV)
    category: Demos
    keywords:
      - Janus
      - project-janus
      - developer-hub
      - openshift
      - backstage
      - rhdh
    labels:
      Base_Component: 'True' #Required to show up in status page list of items
      Product: Red_Hat_Developer_Hub
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '81'
    reportingLabels:
      primaryBU: Application_Developer
      secondaryBU: Hybrid_Platforms
    parameters:
      - name: rhdh_version
        description: |
          Version: latest=1.10 stable=1.10-164
        formGroup: Developer Hub
        formLabel: Developer Hub Version
        required: false
        openAPIV3Schema:
          type: string
          default: stable
          enum:
            - stable
            - latest
        annotation: demo.redhat.com/rhdh-version
        variable: rhdh_version
        components:
          - name: openshift_base

  components:
    - name: openshift_base
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.20"
        ocp4_fips_enable: false
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
