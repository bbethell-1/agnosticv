---

ocp4_installer_version: "4.18"
odf_channel: stable-4.18
bastion_instance_image: rhel-9.6
ocp4_workload_openshift_gitops_channel: gitops-1.18


# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_rhoso_ipam4lab
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_ansible_automation_platform_25
- ocp4_workload_openshift_gitops
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware # will be needed when new version of lab is released
- ocp4_workload_showroom
# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads:
- ocp4_workload_virt_roadshow_vmware # will be needed when new version of lab is released

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# ocp4_workload_ansible_automation_platform_25
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader

ocp4_workload_ansible_automation_platform_use_catalog_snapshot: false
ocp4_workload_ansible_automation_platform_automatic_install_plan_approval: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: missing
    scm_ref: development
    scm_url: https://github.com/redhat-cop/agnosticd.git
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
