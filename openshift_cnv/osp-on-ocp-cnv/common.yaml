    [
      'ocp4_workload_rhoso_ipam4lab',
      'ocp4_workload_external_odf',
      'ocp4_workload_authentication',
      'ocp4_workload_cert_manager',
    ] +
    (['agnosticd.osp_on_ocp.ocp4_workload_rhoso_deployment'] if enable_rhoso_migration | default(false) | bool else []) +
    [
      'ocp4_workload_ansible_automation_platform_25',
      'ocp4_workload_openshift_gitops',
      'ocp4_workload_web_terminal',
      'ocp4_workload_kubevirt',
      'ocp4_workload_virt_roadshow_vms',
      'ocp4_workload_virt_roadshow_vmware',
    ] +
    (['agnosticd.osp_on_ocp.ocp4_workload_rhoso_migration_toolkit_aap_setup',
      'agnosticd.osp_on_ocp.ocp4_workload_rhoso_migration_scenarios'] if enable_rhoso_migration | default(false) | bool else []) +
    [
      'agnosticd.showroom.ocp4_workload_ocp_console_embed',
      'install-command-line-tools',
      'agnosticd.showroom.ocp4_workload_showroom',
    ]
