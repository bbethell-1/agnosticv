# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3
worker_instance_count: 0
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

# No users -> admin showroom
ocp4_workload_authentication_htpasswd_user_count: 0

# nfs-server Configuration
nfsserver_instance_image: rhel-8.2
nfsserver_cores: 4
nfsserver_memory: 4G
nfsserver_rootfs_size: 30Gi

compute_instance_image: rhel-9.4
compute_cores: 16
compute_memory: 16G
compute_rootfs_size: 100Gi

compute_adoption_instance_image: rhel-9.2

ai_attach_masters_networks:
- ctlplane
- internalapi
- storage
- tenant
- external
- default/networkrhovmt

networks:
- name: ctlplane
- name: internalapi
- name: storage
- name: tenant
- name: external

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: v1.6.6
  - name: https://github.com/rhpds/osp-on-ocp.git
    type: git
    version: v1.0.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
