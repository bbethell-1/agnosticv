---
# -------------------------------------------------------------------
# Development Environment Overrides
# -------------------------------------------------------------------

# Set purpose to development
purpose: development

# Override tag for development (use main branch for latest code)
tag: main

# Development deployer settings
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2600Gi"
        limits.cpu: '999'
        requests.cpu: '999'
        limits.memory: 400Gi
        requests.memory: 400Gi
