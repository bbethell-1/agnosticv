---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: dev
__meta__:
  deployer:
    scm_ref: main
    scm_type: git

  sandboxes:
  - kind: OcpSandbox
    no_namespace: true
    cloud_selector:
      cloud: cnv-dedicated-shared
      lab: ocp-dev-days-rdshw
      purpose: dev
    tenant_cluster:
      item: openshift_cnv/ocp-dev-days-rdshw-cluster

# The GitOps repo to use for the DEV tenant
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp-dev-days-rdshw-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: dev
ocp4_workload_gitops_bootstrap_repo_path: tenant/bootstrap
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
