# -------------------------------------------------------------------
# --- Catalog Item: Veeam Kasten Workshop
#
# --- MIGRATED TO AGNOSTICDv2 ---
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: main
  - name: https://github.com/rhpds/veeam-kasten-k10-workshop
    type: git
    version: main

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
ai_workers_cores: 16
ai_workers_memory: 64Gi
worker_instance_count: 3

# -------------------------------------------------------------------
# Misc Vars
# -------------------------------------------------------------------
num_users: 1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- veeam.workshop.ocp4_workload_kasten_k10_workshop
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
# Generate user password
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

ocp4_workload_authentication_htpasswd_remove_kubeadmin: true
ocp4_workload_authentication_htpasswd_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_kasten_k10_workshop vars set in kasten role
# https://github.com/rhpds/veeam-kasten-k10-workshop/blob/main/roles/ocp4_workload_kasten_k10_workshop/defaults/main.yml
# -------------------------------------------------------------------
# ocp4_workload_kasten_k10_channel: stable
# ocp4_workload_kasten_k10_subscription: k10-kasten-operator-rhmp

# Pin version of the operator
# ocp4_workload_kasten_k10_automatic_install_plan_approval: false
# ocp4_workload_kasten_k10_starting_csv: k10-kasten-operator-rhmp.v8.0.7

# Kasten Deployment Properties
# ocp4_workload_kasten_namespace: kasten-io

# ocp4_workload_kasten_k10_deploy_k10: true
# ocp4_workload_kasten_k10_setup_demo: true

# Annotate storage classes to support block mode
#   k10.kasten.io/sc-supports-block-mode-exports=true
# Set to empty array to not annotate any
#ocp4_workload_kasten_k10_storageclasses:
# - ocs-storagecluster-ceph-rbd-virtualization

# Annotate volumesnapshotclasses as backup targets
#   k10.kasten.io/is-snapshot-class=true
# Set to empty array to not annotate any
# ocp4_workload_kasten_k10_volumesnapshotclasses:
# - ocs-storagecluster-rbdplugin-snapclass
# - ocs-storagecluster-cephfsplugin-snapclass

# Common ObjectBucket properties
# ocp4_workload_kasten_k10_objectbucket_name: kastenbackups
# ocp4_workload_kasten_k10_objectbucket_storage_class: openshift-storage.noobaa.io

# Set up multiple (regular) users for K10
ocp4_workload_kasten_k10_multi_user: true

# Multi User
ocp4_workload_kasten_k10_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_kasten_k10_objectbucket_user_base: user
ocp4_workload_kasten_k10_objectbucket_namespace_base: "backuptarget-{{ ocp4_workload_kasten_k10_objectbucket_user_base }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/veeam-kasten-k10-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

