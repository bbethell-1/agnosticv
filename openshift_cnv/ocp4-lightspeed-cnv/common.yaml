# -------------------------------------------------------------------
# --- Catalog Item: Demo : OpenShift LightSpeed Demo
#
# --- MIGRATED TO AGNOSTICDv2 ---
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # AI Workloads (for OpenShift Lightspeed)
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: main
  # Lightspeed Demo Collection
  - name: https://github.com/rhpds/rhpds.openshift_lightspeed_demo.git
    type: git
    version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.ai_workloads.ocp4_workload_ols
- rhpds.openshift_lightspeed_demo.ocp4_workload_lightspeed_demo
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
# No bastion VM in this config (cloud_provider: none) - skip virtctl install
ocp4_workload_openshift_virtualization_install_virtctl: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
# Generate user password
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols (OpenShift Lightspeed)
# -------------------------------------------------------------------
# Use Azure AI as the backend for OpenShift Lightspeed
ocp4_workload_ai_platform: azure

# Automatically create and manage Azure AI tokens
ocp4_workload_ols_get_token: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_lightspeed_demo
# -------------------------------------------------------------------
# RHEL9 VM Configuration
ocp4_workload_lightspeed_demo_vm_namespace: lightspeed-demo
ocp4_workload_lightspeed_demo_vm_name: rhel9-demo
ocp4_workload_lightspeed_demo_vm_cpu_cores: 1
ocp4_workload_lightspeed_demo_vm_memory: 2Gi

# RAG Configuration
ocp4_workload_lightspeed_demo_enable_rag: true
ocp4_workload_lightspeed_demo_rag_image: 'quay.io/dialvare/acme-byok:latest'

# Broken Pod Configuration
ocp4_workload_lightspeed_demo_create_broken_pod: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/dialvare/showroom-openshift-lightspeed.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

# ===================================================================
# Workloads to remove on destroy
# ===================================================================
remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4a559296-e641-4411-9c55-87d6dca8796c
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    - name: Ritesh Shah
      email: rshah@redhat.com
    instructions:
    - name: Diego Alvarez
      email: dialvare@redhat.com

  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Artificial_Intelligence
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Lightspeed Demo (CNV)
    category: Demos
    workshopUiDisabled: true
    multiuser: false
    keywords:
    - openshift
    - ocp
    - lightspeed
    - ols
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: host_ocp4_installer_version
      description: Version of OpenShift to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.18'
        - '4.20'
      components:
      - name: openshift_base

  components:
  - name: openshift_base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false
