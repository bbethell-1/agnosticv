---
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_workload_ols_api_token.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Demo : OpenShift LightSpeed Demo
#
# --- MIGRATED TO AGNOSTICDv2 ---
# -------------------------------------------------------------------

# AgnosticDv2 variables
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
# Generate user password
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols
# -------------------------------------------------------------------
# Create a child app and SP for this lab environment
# It is removed when the environment is destroyed
ocp4_workload_ols_get_token: true
ocp4_workload_ai_platform: azure #openai, azure, watson, openshiftai

# Creates a broken pod that you can demo with
# Does not affect overall functionality of lab environment
ocp4_workload_ols_create_broken_pod: true

# Enable this for the demo exercise
ocp4_workload_ols_enable_rag: true
ocp4_workload_ols_rag_image: 'quay.io/dialvare/acme-byok:latest'

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/dialvare/showroom-openshift-lightspeed.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Workloads to remove before sandbox is nuked
# make sure __meta__.sandbox_api.actions.destroy.catch_all is set to false
# -------------------------------------------------------------------
remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4a559296-e641-4411-9c55-87d6dca8796c
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    - name: Ritesh Shah
      email: rshah@redhat.com
    instructions:
    - name: Diego Alvarez
      email: dialvare@redhat.com

  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Artificial_Intelligence
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Lightspeed Demo (CNV)
    category: Demos
    workshopUiDisabled: true
    multiuser: false
    keywords:
    - openshift
    - lightspeed
    - ocp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: host_ocp4_installer_version
      description: Version of OpenShift to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.18'
        enum:
        - '4.18'
        - '4.20.0'
      components:
      - name: openshift-base

  components:
  - name: openshift-base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: "{{ host_ocp4_installer_version }}"
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  sandbox_api:
    actions:
      destroy:
        # Allow the ocp4_workload_ols remove_workload to run
        catch_all: false

  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
