---
# ---- Testing ocp5_workload_ols (replaces ocp4_workload_ols, includes agentic OLS) ----
# Classic OLS is always on and always MaaS. Agentic OLS is the only catalog choice.

#include /includes/secrets/litemaas-master_api.yaml
#include /includes/parameters/litellm_metadata.yaml
#include /includes/secrets/ocp5_workload_ols.yaml

# -------------------------------------------------------------------
# Collections — later files replace requirements_content, so list all of them
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/rhpds.openshift_lightspeed_demo.git
    type: git
    version: main
  # - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
  #   type: git
  #   version: "1.3.2"

ocp4_workload_cluster_observability_operator_enable_monitoring_uiplugin: true
ocp4_workload_cluster_observability_operator_enable_perses_datasource: true

# LiteMaaS key first so OLS can consume litellm_virtual_key
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_cluster_observability_operator
# - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.ai_workloads.ocp5_workload_ols
- rhpds.openshift_lightspeed_demo.ocp4_workload_lightspeed_demo
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.core_workloads.ocp4_workload_showroom

remove_workloads:
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# LiteMaaS virtual key (classic OLS MaaS backend)
# -------------------------------------------------------------------
# ocp4_workload_litellm_virtual_keys_models:
# - claude-sonnet-4-6
# ocp4_workload_litellm_virtual_keys_duration: "7d"
# ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
# ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Classic OLS — MaaS only
# -------------------------------------------------------------------
# ocp5_workload_ols_provider is a catalog parameter:
#   maas | openai | azure_sp | azure_token
# URLs, models, operator install, and Keycloak RBAC all have role defaults
# (auth inherits from ocp4_workload_authentication). Only credentials that
# default to "changeme" need to be set here.
#
# azure_sp credentials come from includes/secrets/ocp5_workload_ols.yaml:
#   ocp5_workload_ols_azure_sp_tenant_id
#   ocp5_workload_ols_azure_sp_client_id
#   ocp5_workload_ols_azure_sp_client_secret
#   ocp5_workload_ols_azure_sp_group_id

ocp5_workload_ols_provider: azure_sp

#
# azure_token: ocp5_workload_ols_azure_api_token is already set by that include.
# Do not redefine it here — a later assignment would wipe the vaulted token.

# maas: token from the virtual key; model is what OLS actually calls.
# deployment_name is an OLSConfig field (Azure leftover). For MaaS it must
# be the same LiteLLM model id.
# ocp5_workload_ols_maas_api_token: "{{ lookup('agnosticd_user_data', 'litellm_virtual_key', default='') }}"
# ocp5_workload_ols_maas_model: claude-sonnet-4-6
# ocp5_workload_ols_maas_deployment_name: "{{ ocp5_workload_ols_maas_model }}"

# openai: user-provided catalog param (no shared OpenAI key in the include)
# ocp5_workload_ols_openai_api_key: "{{ ols_api_token }}"

# Temporarily pin 4.22 snapshots — lightspeed is not in redhat-operator-index:v5.0
# Role default image (quay.io/openshift-lightspeed/lightspeed-catalog:stable-v0.1.0) does not exist
ocp5_workload_ols_use_catalog_snapshot: true
ocp5_workload_ols_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp5_workload_ols_catalog_snapshot_image_tag: v4.22_2026_08_31
ocp5_workload_ols_catalogsource_name: redhat-operators-snapshot-lightspeed

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    parameters:
    # Remove this in common when merging - just set the var to 4.22 since that is
    # the only version that is supported for this demo
    - name: host_ocp4_installer_version
      description: Version of OpenShift to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.22'
        enum:
        - '4.22'
      components:
      - name: openshift_base

    - name: ocp5_workload_ols_enable_agentic
      formLabel: Enable Agentic OpenShift Lightspeed
      formGroup: Agentic OLS
      description: >-
        Deploy the Agentic OpenShift Lightspeed component on top of classic OLS.
        When enabled, you must provide an OpenAI API key below.
      required: false
      openAPIV3Schema:
        type: boolean
        default: false
      components:
      - name: current

    - name: ocp5_workload_ols_agentic_api_key
      formLabel: OpenAI API Key
      formGroup: Agentic OLS
      description: >-
        Your OpenAI API key (sk-...) for the Agentic OLS component.
        Required when Enable Agentic OpenShift Lightspeed is checked.
      required: false
      formHideCondition: ocp5_workload_ols_enable_agentic == false
      formRequireCondition: ocp5_workload_ols_enable_agentic == true
      openAPIV3Schema:
        type: string
        default: ""
      components:
      - name: current

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-08-05
      pull: missing
