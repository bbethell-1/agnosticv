---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Additional collections for dev environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main
  - name: https://github.com/agnosticd/ai_workloads.git
    type: git
    version: main
  # Lightspeed Demo Collection
  - name: https://github.com/rhpds/rhpds.openshift_lightspeed_demo.git
    type: git
    version: main

# -------------------------------------------------------------------
# Additional workloads for dev environment
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- rhpds.openshift_lightspeed_demo.ocp4_workload_rhel9_vm
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.core_workloads.ocp4_workload_web_terminal
- agnosticd.core_workloads.ocp4_workload_showroom

ocp4_workload_ols_get_token: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhel9_vm
# -------------------------------------------------------------------
ocp4_workload_rhel9_vm_namespace: lightspeed-demo
ocp4_workload_rhel9_vm_name: rhel9-demo
ocp4_workload_rhel9_vm_cpu_cores: 1
ocp4_workload_rhel9_vm_memory: 2Gi

# LLM provider variables (for Azure)
# Only enable these if you need to test with a different provider config
# ocp4_workload_ols_llm_providers_models_name: gpt-4o
# ocp4_workload_ols_llm_providers_provide_name: Azure
# ocp4_workload_ols_llm_providers_url: 'https://ols-test.openai.azure.com/'
# ocp4_workload_ols_llm_deploymentname: 4o-jun24 #this variable is required only for Azure
# ocp4_workload_ols_defaultmodel: gpt-4o

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
