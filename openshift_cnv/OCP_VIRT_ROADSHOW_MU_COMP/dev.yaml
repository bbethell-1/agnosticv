---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

create_ssh_provision_key_enable_user_info_data: true


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    # scm_ref: development
    scm_ref: development
  #  sandboxes:
  #  - kind: OcpSandbox
  #    namespace_suffix: ocp4-cluster
  #    cloud_selector:
  #      cloud: cnv
  #      # DEV CNV Cluster doesn't seem to work with storage... deploy to prod.
  #      #purpose: dev
  #      purpose: prod
  #      virt: "yes"
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv04
          enum:
            - ocpv01
            - ocpv02
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
