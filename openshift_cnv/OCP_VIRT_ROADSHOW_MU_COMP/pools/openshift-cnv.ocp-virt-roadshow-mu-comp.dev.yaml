---
#agnosticv catalog_item false
apiVersion: poolboy.gpte.redhat.com/v1
kind: ResourcePool
metadata:
  name: openshift-cnv.ocp-virt-roadshow-mu-comp.dev
  namespace: poolboy
spec:
  deleteUnhealthyResourceHandles: true
  lifespan:
    default: 7d
    maximum: '{% if resource_claim.annotations[''demo.redhat.com/open-environment'']
      | default(false) | bool %}365d{% else %}10d{% endif %}'
    relativeMaximum: '{% if resource_claim.annotations[''demo.redhat.com/open-environment'']
      | default(false) | bool %}365d{% else %}2d{% endif %}'
    unclaimed: 7d
  maxUnready: 2
  minAvailable: 1
  resources:
    - name: openshift-cnv.ocp-virt-roadshow-mu-comp.dev
      provider:
        apiVersion: poolboy.gpte.redhat.com/v1
        kind: ResourceProvider
        name: openshift-cnv.ocp-virt-roadshow-mu-comp.dev
        namespace: poolboy
      template:
        spec:
          vars:
            default_desired_state: started
            job_vars:
              num_users: 2
