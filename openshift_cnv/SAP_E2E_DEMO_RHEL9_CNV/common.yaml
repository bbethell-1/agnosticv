---
#include /includes/catalog-icon-sap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-e2e-secret-rhel9.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/tower-manifest-get.yml
#include /includes/sandbox-api.yaml

# Ansible Controller Secrets
#include /includes/secrets/ansible-tower-advanced-2.yaml
#include /includes/secrets/rhsm-api-offline-token.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml

# Set to RHPDS or OPENTLC
platform: rhpds
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

software_to_deploy: openshift4_assisted
env_type: sap-hana-rhel9
cloud_provider: openshift_cnv

# Satellite is used for RHEL repos
repo_method: satellite

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.16"

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# Update RHEL to the latest packages (and reboot)
update_packages: true

common_install_basic_packages_retries: 0
install_student_user: true

#sap_software_snapshot_name: sap-software-v1.0
#sap_software_snapshot_owner_id: "719622469867"

bastion_instance_image: rhel-9.6
tower_instance_image: rhel-9.6
s4hana_instance_image: rhel-9.2
hana_instance_image: rhel-9.2

student_name: lab-user

####----- Specific and common requirements for the E2E Automation Workshop/Demo -----####
rootfs_size_bastion: 50
rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 100
sap_software_size: 100
pv_size_hana: 100
pv_size_s4hana: 100

#Ansible Tower Variables
tower_instance_count: 1

####----- Specific and common requirements for the E2E Automation Workshop/Demo -----####

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 33C88DD1-F8FF-46D8-A183-6D1D80837994
  owners:
    maintainer:
    - name: Markus Koch
      email: mkoch@redhat.com
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    reportingLabels:
      primaryBU: RHEL
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SAP end2end demo for RHEL9 (CNV)
    category: Demos
    keywords:
    - workshop
    - sap
    parameters:
    - name: aap_suser
      description: please enter your S-USER credentials to download the SAP software, request here https://forms.gle/EHhBZS6oz3Q13JRX8
      formLabel: S-User
      required: true
      openAPIV3Schema:
        type: string
    - name: aap_spass
      description: please enter your S-USER credentials to download the SAP software
      formLabel: S-User Password
      required: true
    labels:
      Product: Red_Hat_Enterprise_Linux_for_SAP_Applications
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Use_Case: Accelerate_Application_Development_And_Delivery
  deployer:
    type: agnosticd
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
