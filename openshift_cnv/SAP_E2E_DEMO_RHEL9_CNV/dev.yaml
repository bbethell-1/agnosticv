---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 100
sap_software_size: 100
pv_size_hana: 100
pv_size_s4hana: 100
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
  deployer:
    scm_ref: development
    scm_url: https://github.com/redhat-sap/rhdp.sap_e2e
