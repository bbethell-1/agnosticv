bastion_asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Clone git repo
    become: true
    become_user: "{{ student_name }}"
    module: git
    src: https://github.com/rl-rh/rh1-aap-troubleshooting.git
    dest: /home/{{ student_name }}/rh1-aap-troubleshooting

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted

  - description: Create SSH config for lab-user to easily SSH to nodes
    module: copy
    dest: /home/{{ bastion_student_user_name }}/.ssh/config
    owner: "{{ bastion_student_user_name }}"
    group: "{{ bastion_student_user_name }}"
    mode: "0600"
    content: |
      # SSH config for easy access to nodes
      Host *
          User {{ student_name }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          IdentityFile ~/.ssh/{{ guid }}key.pem

  - description: Download oc client
    module: get_url
    src: "{{ openshift_client_download_url }}"
    dest: /tmp/
    owner: "{{ student_name }}"

  - description: Unarchive oc client
    module: unarchive
    src: /tmp/openshift-client-linux.tar.gz
    dest: /usr/bin
    remote_src: true

  - description: Openshift oc login
    become: true
    become_user: "{{ student_name }}"
    module: command
    cmd: "/usr/bin/oc login {{ openshift_api_url }} --token={{ openshift_cluster_admin_token }} --insecure-skip-tls-verify=true"

  - description: Download AAP manifest
    module: get_url
    src: "https://gpte-public.s3.us-east-1.amazonaws.com/aap/manifest_demystify_aap.zip"
    dest: /home/{{ student_name }}/
    owner: "{{ student_name }}"

  - description: Create ansible.cfg
    module: copy
    become: true
    become_user: "{{ student_name }}"
    dest: /home/{{ student_name }}/.ansible.cfg
    owner: "{{ student_name }}"
    content: |
      [galaxy]
      server_list = certified, validated, community_galaxy

      [galaxy_server.certified]
      url=https://console.redhat.com/api/automation-hub/content/published/
      auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      token={{ ansible_automation_platform_hub_token }}

      [galaxy_server.validated]
      url=https://console.redhat.com/api/automation-hub/content/validated/
      auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      token={{ ansible_automation_platform_hub_token }}

      [galaxy_server.community_galaxy]
      url=https://galaxy.ansible.com/

  - description: Install collections
    become: true
    become_user: "{{ student_name }}"
    module: command
    cmd: >-
      ansible-galaxy collection install
      ansible.controller
      ansible.platform
      ansible.hub
      ansible.eda
      kubernetes.core
      infra.aap_configuration
      infra.aap_configuration_extended
      community.general

  - description: Remove ansible.cfg
    module: file
    state: remove
    path: /home/{{ student_name }}/.ansible.cfg

  - description: Set python default to 3.11
    become: true
    module: shell
    cmd: >-
      sudo alternatives --install /usr/bin/python python /usr/bin/python3.9 10;
      sudo alternatives --install /usr/bin/python python /usr/bin/python3.11 20;
      sudo alternatives --set python /usr/bin/python3.11;
      python --version

  - description: Set python3 default to 3.11
    become: true
    module: shell
    cmd: >-
      sudo alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 10;
      sudo alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 20;
      sudo alternatives --set python3 /usr/bin/python3.11;
      python3 --version

asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names else
    []
  }}

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  ssh_public_hostname: "bastion-{{ subdomain_base }}"
  bastion_url: "https://bastion-{{ subdomain_base }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_cluster_admin_token: "{{ openshift_cluster_admin_token }}"
  openshift_console_url: "{{ openshift_console_url }}"
  openshift_kubeadmin_user: kubeadmin
  openshift_kubeadmin_password: "{{ openshift_kubeadmin_password }}"
  openshift_admin_user: admin
  openshift_admin_password: "{{ common_admin_password  }}"

# -------------------------------------------------------------------
# Workload: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/demystifying-aap-on-ocp-showroom.git
showroom_git_ref: main
showroom_tls_provider: none
showroom_host: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Pre-destroy workloads (cleanup before environment is destroyed)
# -------------------------------------------------------------------
pre_destroy_workloads:
  localhost:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5B4BF6F4-A6B9-4A3B-B36E-D5831B54827F
  owners:
    maintainer:
      - name: Ryan LaRoy
        email: rlaroy@redhat.com
      - name: Max Mitschke
        email: mmitschk@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Demystifying Ansible Automation Platform on OpenShift (CNV)"
    category: Brand_Events
    keywords:
      - troubleshooting
      - lb1024
      - rh1-2026
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
    reportingLabels:
      primaryBU: Automation
    multiuser: false
    parameters: []
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: sno
        host_ocp4_installer_version: '4.20'
        ocp4_fips_enable: false
      # Propagate agnosticd_user_info data set by this component to variables.
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_console_url
          var: openshift_console_url
        - name: openshift_kubeadmin_password
          var: openshift_kubeadmin_password
        - name: openshift_client_download_url
          var: openshift_client_download_url
        # Propagate bastion data for infra_add_bastion role
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
