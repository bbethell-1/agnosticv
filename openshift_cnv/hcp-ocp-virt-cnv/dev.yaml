---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

ocp4_installer_version: "4.19"
bastion_instance_image: rhel-9.6
odf_channel: stable-4.18
ocp4_workload_lvms_channel: stable-4.18
ai_workers_cores: 24

ocp4_workload_gitops_bootstrap_repo_revision: main

ocp4_workload_rhacm_acm_channel: release-2.14
#ocp4_workload_gitops_bootstrap_helm_values:

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"

ocp4_workload_showroom_content_git_repo_ref: replatform_cnv
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/hcp-ocp-virt-showroom.git

ocp4_workload_showroom_deployment_type: helm

ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: showroom
#ocp4_workload_showroom_terminal_type: wetty
#ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.3.4"

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_workers_memory: 48Gi

ai_workers_extra_disks:
- metadata:
    name: "extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "20Gi"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  # catalog:
  #   parameters:
  #     - name: ocpv_cluster
  #       description: OCPV cluster where to deploy
  #       formLabel: OCPV cluster
  #       required: true
  #       openAPIV3Schema:
  #         type: string
  #         default: ocpvdev01
  #         enum:
  #           - ocpv03
  #           - ocpv04
  #           - ocpv05
  #           - ocpv06
  #           - ocpv07
  #           - ocpvdev01
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
