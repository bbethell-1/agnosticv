---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

ocp4_workload_gitops_bootstrap_repo_revision: main

ocp4_workload_rhacm_acm_channel: release-2.14

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
                 Welcome to your Red Hat lab environment
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"
ocp4_workload_showroom_content_git_repo_ref: replatform_cnv
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/hcp-ocp-virt-showroom.git
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: false
#ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_chart_package_url: https://agonzalezrh.github.io/showroom-deployer
ocp4_workload_showroom_content_image: ghcr.io/agonzalezrh/showroom-content:main
ocp4_workload_showroom_deployer_chart_version: "1.7.2"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

ai_workers_extra_disks:
- metadata:
    name: "extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "20Gi"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: judd-workload-rhacm-bugfix
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
