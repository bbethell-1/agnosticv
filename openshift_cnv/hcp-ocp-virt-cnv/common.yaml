---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item:
#    Using Hosted Control Planes for OpenShift on OpenShift
# -------------------------------------------------------------------

# This catalog item is evolved from several HCP focussed labs.
# It replaces:
#
# 1. openshift-cnv/HOSTED_CONTROL_PLANES_OCPV_CNV - old ocp, no gui workshop
# 2. RH1_2025/LAB01_HCP_OCP_VIRT_GCP - replatform, expanded subjects
#
# This is a single-user per cluster workshop meant to highlight the
# features of HCP and exercise typical operational use cases that
# are particular to HCP or different from a standard OCP cluster.
#
# Showroom was updated to use the webapp.
#
# It's contains no bugs.
#
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml

#include /includes/sandbox-api.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift_assisted_installer_icr.yaml

#include /includes/parameters/cert-manager-vars.yaml

#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.19.11"
ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3
worker_instance_count: 3

# ai_control_plane_cores: 8
# Minimum control plane memory is 16Gi, anything below fails
# ai_control_plane_memory: 16Gi
# Try a compact cluster with just 3 bigger control plane
ai_control_plane_cores: 16
ai_control_plane_memory: 16Gi

ai_workers_cores: 24
# Lab needs 3x32Gi memory
ai_workers_memory: 64Gi
ai_workers_root_disk_size: 200Gi
# Larger root disks take longer to provision on Ceph; give worker VMs
# more time to reach Running (default in role is 120 = 20 min).
ai_workers_vm_ready_retries: 360

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"

ai_workers_extra_disks:
- metadata:
    name: "extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "50Gi"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_kubevirt
- ocp4_workload_rhacm
- ocp4_workload_rhacm_cloud_credentials
- ocp4_workload_acm_multicluster_observability
- ocp4_workload_metallb
- ocp4_workload_hcp_kubevirt
- ocp4_workload_lvms
- ocp4_workload_web_terminal
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
num_users: 1

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_cloud_credentials
# -------------------------------------------------------------------
ocp4_workload_rhacm_cloud_credentials_kubevirt: true
ocp4_workload_rhacm_cloud_credentials_kubevirt_secret_name: kubevirt-secret

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------

ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_lvms
# -------------------------------------------------------------------
ocp4_workload_lvms_channel: stable-4.18

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.14
# ocp4_workload_rhacm_acm_starting_csv: ""
ocp4_workload_rhacm_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_enable_ipaddresspool: true
ocp4_workload_metallb_enable_l2advertisement: true

# -------------------------------------------------------------------
# Prometheus Retention (cluster-monitoring-config)
# Prevents emptyDir Prometheus from filling worker root disks.
# -------------------------------------------------------------------
ocp4_workload_cluster_monitoring_retention: 3d
ocp4_workload_cluster_monitoring_retention_size: 40GB

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom"
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/hcp-ocp-virt-showroom.git
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: true
#ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_chart_package_url: https://agonzalezrh.github.io/showroom-deployer
ocp4_workload_showroom_content_image: ghcr.io/agonzalezrh/showroom-content:main
ocp4_workload_showroom_deployer_chart_version: "1.7.2"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8fb934b7-06b0-469b-9d59-a47c26c1c640
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Alberto Gonzalez Rodriguez
      email: arodriguez@redhat.com
    instructions:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Alberto Gonzalez Rodriguez
      email: arodriguez@redhat.com

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2500Gi
      requests.memory: 2500Gi
  catalog:
    display_name: Using Hosted Control Planes for OpenShift on OpenShift
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    keywords:
    - workshop
    - openshift
    - ocp
    - cnv
    - cnvocp
    - ocpcnv
    - hcp
    - hypershift
    - hostedcontrolplane
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Container_Management
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms
