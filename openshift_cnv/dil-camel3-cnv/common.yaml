  owners:
    maintainer:
      - name: Bruno Meseguer
        email: bmeseguer@redhat.com

  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
