---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false

  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
        limits.memory: "500Gi"
        requests.memory: "500Gi"
        requests.storage: "2000Gi"
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
  deployer:
    #scm_ref: radosnamespace
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
