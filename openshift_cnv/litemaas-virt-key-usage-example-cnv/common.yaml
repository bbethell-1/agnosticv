---
#include /includes/catalog-icon-rh-ai-2025.yaml

# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/litemaas-master_api.yaml
#include /includes/parameters/litellm_metadata.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
software_to_deploy: none
tag: main

# Cluster credentials — propagated from the SNO component via propagate_provision_data
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# Collection Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.5.6
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "{{ tag | default('main') }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.showroom.ocp4_workload_showroom

# Runs during destroy to delete the virtual key from LiteLLM
remove_workloads:
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Authentication — htpasswd admin user
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true
ocp4_workload_authentication_htpasswd_enable_user_info_data: true

# -------------------------------------------------------------------
# Showroom Configuration
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/litemaas-virt-key-usage-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# Terminal configuration — wetty SSH terminal to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# -------------------------------------------------------------------
# LiteLLM Virtual Keys Configuration
# -------------------------------------------------------------------
# Build model list based on checkbox selections
ocp4_workload_litellm_virtual_keys_models: >-
  {{
    (litellm_model_granite_3_2_8b_instruct | default(true) | bool | ternary(['granite-3-2-8b-instruct'], [])) +
    (litellm_model_granite_4_0_h_tiny | default(false) | bool | ternary(['granite-4-0-h-tiny'], [])) +
    (litellm_model_llama_scout_17b | default(false) | bool | ternary(['llama-scout-17b'], [])) +
    (litellm_model_deepseek_r1 | default(false) | bool | ternary(['deepseek-r1-distill-qwen-14b'], [])) +
    (litellm_model_microsoft_phi_4 | default(false) | bool | ternary(['microsoft-phi-4'], [])) +
    (litellm_model_qwen3_14b | default(false) | bool | ternary(['qwen3-14b'], [])) +
    (litellm_model_codellama_7b_instruct | default(false) | bool | ternary(['codellama-7b-instruct'], [])) +
    (litellm_model_llama_guard | default(false) | bool | ternary(['Llama-Guard-3-1B'], [])) +
    (litellm_model_nomic_embed | default(false) | bool | ternary(['nomic-embed-text-v1-5'], [])) +
    (litellm_model_minimax_m2 | default(false) | bool | ternary(['minimax-m2'], [])) +
    (litellm_model_qwen3_235b | default(false) | bool | ternary(['qwen3-235b'], [])) +
    (litellm_model_gpt_oss_120b_ext | default(false) | bool | ternary(['gpt-oss-120b'], [])) +
    (litellm_model_gpt_oss_20b | default(false) | bool | ternary(['gpt-oss-20b'], [])) +
    (litellm_model_gemini_25_pro | default(false) | bool | ternary(['gemini-2.5-pro'], [])) +
    (litellm_model_claude_sonnet_46 | default(false) | bool | ternary(['claude-sonnet-4-6'], [])) +
    (litellm_model_claude_opus_46 | default(false) | bool | ternary(['claude-opus-4-6'], [])) +
    (litellm_model_claude_sonnet_45 | default(false) | bool | ternary(['claude-sonnet-4-5'], [])) +
    (litellm_model_claude_haiku | default(false) | bool | ternary(['claude-3-5-haiku'], []))
  }}

# Enable Docling document conversion when checkbox is selected
# The role adds granite-docling-258m to the key's models list
# and outputs Docling endpoint info in user info messages
ocp4_workload_litellm_virtual_keys_include_docling: "{{ litellm_model_granite_docling | default(false) | bool }}"

# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('3d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Babylon Metadata
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6c275f57-c5d7-469d-ab74-2f806884c573
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com
      - name: Ashok Jammula
        email: ajammula@redhat.com

  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  components:
    - name: openshift-base
      display_name: OpenShift SNO Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: sno
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_api_key
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
        - name: openshift_console_url
          var: openshift_console_url

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LiteMaaS - Virtual Key Usage Examples"
    category: Demos
    multiuser: false
    keywords:
      - litemaas
      - ai
      - models
      - multi-user
      - virtual-keys
    labels:
      Product: Red_Hat_AI
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms

    parameters:
      # Chat/Text Generation Models
      - name: litellm_model_granite_3_2_8b_instruct
        formLabel: Granite 3.2 8B Instruct
        formGroup: Chat & Text Models
        description: IBM Granite 3.2 8B - General purpose chat and text generation
        openAPIV3Schema:
          type: boolean
          default: true

      - name: litellm_model_granite_4_0_h_tiny
        formLabel: Granite 4.0 H Tiny
        formGroup: Chat & Text Models
        description: IBM Granite 4.0 H Tiny - Compact chat model for efficient inference with tool calling support
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_llama_scout_17b
        formLabel: Llama 4 Scout 17B (W4A16)
        formGroup: Chat & Text Models
        description: Meta Llama 4 Scout 17B - W4A16 quantized by Red Hat AI with 400k context window, advanced function calling, and MCP support. Excellent for tool use and agent workflows (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_deepseek_r1
        formLabel: DeepSeek R1 Distill Qwen 14B
        formGroup: Chat & Text Models
        description: DeepSeek R1 Distill based on Qwen 14B - reasoning model with chain-of-thought capabilities, strong at math and logic (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_microsoft_phi_4
        formLabel: Microsoft Phi-4
        formGroup: Chat & Text Models
        description: Microsoft Phi-4 - compact but high-quality model with strong reasoning and coding capabilities (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_qwen3_14b
        formLabel: Qwen 3 14B
        formGroup: Chat & Text Models
        description: Alibaba Qwen 3 14B - multilingual chat model with strong reasoning (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      # Code Models
      - name: litellm_model_codellama_7b_instruct
        formLabel: CodeLlama 7B Instruct
        formGroup: Code Models
        description: Meta CodeLlama 7B Instruct - Code chat with instructions (use /v1/chat/completions)
        openAPIV3Schema:
          type: boolean
          default: false

      # Safety & Moderation Models
      - name: litellm_model_llama_guard
        formLabel: Llama Guard 3 1B
        formGroup: Safety & Moderation
        description: Meta Llama Guard 3 1B - Content safety classification (`Llama-Guard-3-1B`, use /v1/completions endpoint)
        openAPIV3Schema:
          type: boolean
          default: false

      # Embedding Models
      - name: litellm_model_nomic_embed
        formLabel: Nomic Embed v1.5
        formGroup: Embedding Models
        description: Nomic Embed - Text embeddings (use /v1/embeddings endpoint)
        openAPIV3Schema:
          type: boolean
          default: false

      # Document Conversion
      - name: litellm_model_granite_docling
        formLabel: Granite Docling 258M
        formGroup: Document Conversion
        description: |
          IBM Granite Docling 258M - Converts PDFs, DOCX, and other documents to clean
          Markdown or JSON. Uses the /docling/v1alpha/convert/source endpoint (not /v1/).
          Useful for testing RAG pipelines and document ingestion workflows.
        openAPIV3Schema:
          type: boolean
          default: false

      # External Models (Google Vertex AI) — backend-only, pay-per-token
      - name: litellm_model_minimax_m2
        formLabel: MiniMax M2 (Agentic)
        formGroup: External Models (Vertex AI)
        description: Fast agentic model, strong at multi-step tool use and coding. $0.30/$1.20 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_qwen3_235b
        formLabel: Qwen3 235B (Reasoning)
        formGroup: External Models (Vertex AI)
        description: Large multilingual MoE reasoning model. $0.22/$0.88 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_gpt_oss_120b_ext
        formLabel: GPT OSS 120B (Large)
        formGroup: External Models (Vertex AI)
        description: Large OSS model with function calling. $0.09/$0.36 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_gpt_oss_20b
        formLabel: GPT OSS 20B (Cost-effective)
        formGroup: External Models (Vertex AI)
        description: Lighter cost-effective option. $0.07/$0.25 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_gemini_25_pro
        formLabel: Gemini 2.5 Pro (Google)
        formGroup: External Models (Vertex AI)
        description: Google Gemini 2.5 Pro with 1M context window. Strong reasoning. Note — use max_tokens >= 1000 as it's a thinking model. $1.25/$10 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      # Claude Models (Anthropic via Vertex AI)
      - name: litellm_model_claude_sonnet_46
        formLabel: Claude Sonnet 4.6 (Anthropic)
        formGroup: External Models (Vertex AI)
        description: Anthropic Claude Sonnet 4.6 — strong reasoning and coding. $3/$15 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_claude_opus_46
        formLabel: Claude Opus 4.6 (Anthropic)
        formGroup: External Models (Vertex AI)
        description: Anthropic Claude Opus 4.6 — flagship model for complex tasks. $5/$25 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_claude_sonnet_45
        formLabel: Claude Sonnet 4.5 (Anthropic)
        formGroup: External Models (Vertex AI)
        description: Anthropic Claude Sonnet 4.5 — previous generation Sonnet. $3/$15 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      - name: litellm_model_claude_haiku
        formLabel: Claude 3.5 Haiku (Anthropic)
        formGroup: External Models (Vertex AI)
        description: Anthropic Claude 3.5 Haiku — fast and cost-effective. $1/$5 per 1M tokens.
        openAPIV3Schema:
          type: boolean
          default: false

      # Duration selection
      - name: litellm_duration
        description: |
          Select how long your virtual key will be valid.

          Options:
          - 3d: 3 days
          - 7d: 7 days
          - 10d: 10 days
          - 30d: 30 days
        formLabel: Key Duration
        required: true
        openAPIV3Schema:
          type: string
          default: '1d'
          enum:
            - '1d'
            - '3d'
