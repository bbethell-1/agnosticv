---
# Dev-only CI — order via Virtual CI in published/ when ready for prod
#include /includes/access-restriction-devs-only.yaml

#include /includes/catalog-icon-rhel.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-9-and-10.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/registry-redhat.yaml

# -------------------------------------------------------------------
# Catalog Item: Leapp-O-Matic: The One-Click Path to RHEL 10
# JIRA: GPTEINFRA-16373
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# CNV-specific settings
# -------------------------------------------------------------------
openshift_cnv_legacy_routes: false
openshift_cnv_route_remove_x_frame_options_header: true

# -------------------------------------------------------------------
# Collection Version Control
# -------------------------------------------------------------------
tag: main  # Override in prod.yaml with specific release tag

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "bastion-{{ subdomain }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user

# Give cloud-init runcmd (satellite register + python38 install) time to complete
# before the ping task exhausts its retries. 30 retries x 30s = 15 minutes max.
infra_generic_wait_for_linux_hosts_retries: 30
infra_generic_wait_for_linux_hosts_delay: 30

# -------------------------------------------------------------------
# Passwords
# -------------------------------------------------------------------
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.8
    # TODO: Add Amaya's leapp collection once moved to rhpds org (GPTEINFRA-16373)
    # - name: https://github.com/rhpds/rhpds.leapp_o_matic.git
    #   type: git
    #   version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - host_satellite_repositories
    - host_common_packages
    - bastion
  rhel9_nodes:
    - host_satellite_repositories

software_workloads:
  all:
    - agnosticd.cloud_vm_workloads.control_user
    - agnosticd.cloud_vm_workloads.asset_injector

post_software_workloads:
  bastions:
    - infra.aap_configuration.dispatch
    # TODO: add leapp-o-matic workload role when collection is available
    # - rhpds.leapp_o_matic.setup_leapp_demo

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions:
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.7
bastion_rootfs_size: 50Gi

# AAP 2.7 not yet available in CNV pool — using 2.6; update when 2.7 image ships
controller_instance_image: aap-2.6-2-ceh-20251103
controller_rootfs_size: 100Gi

rhel95_instance_image: rhel-9.5
rhel97_instance_image: rhel-9.7
rhel810_instance_image: rhel-8.10
node_rootfs_size: 30Gi

workshop_type: leapp-o-matic

# -------------------------------------------------------------------
# Instances
# -------------------------------------------------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ bastion_rootfs_size }}"
    metadata:
      ansible_python_interpreter: /usr/bin/python3
    tags:
      - key: AnsibleGroup
        value: "bastions,showroom"
      - key: ostype
        value: linux
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 7500
            protocol: TCP
            targetPort: 7500
            name: bastion-7500
    routes:
      - name: bastion-80
        host: bastion
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    userdata: |-
      #cloud-config
      user: rhel
      password: "{{ common_password }}"
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
    tags:
      - key: AnsibleGroup
        value: isolated
      - key: ostype
        value: linux
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
