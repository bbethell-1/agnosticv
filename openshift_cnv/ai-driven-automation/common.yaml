---
# AI-Driven Automation: all modules (Sections 1-6)
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/secrets/litemaas-master_api.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Hands-On AIOps: Building Self-Healing, Observability-Driven Automation with Ansible
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
env_type: multi-cloud-base-infra
cloud_provider: openshift_cnv
software_to_deploy: none

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=16, chars=['ascii_letters', 'digits', '_'])
  }}

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
tag: main

requirements_content:
  collections:
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/lb2961.ai_driven_aap.git
      type: git
      version: "{{ tag }}"
    - name: ansible.netcommon
      version: ">=6.0.0"
    - name: cisco.ios
      version: ">=5.0.0"
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "1.3.2"
    - name: ansible.windows
      version: ">=2.0.0"
    - name: microsoft.ad
      version: ">=1.0.0"
    - name: community.windows
      version: ">=2.0.0"
    - name: ansible.platform
      version: ">=2.0.0"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_rootfs_size: 50Gi

controller_instance_image: base-zero-aap-2.5-container-ce
controller_rootfs_size: 50Gi

node_instance_image: rhel-9.6
node_rootfs_size: 50Gi

service_instance_image: rhel-9.6
service_rootfs_size: 50Gi

cisco_instance_image: c8000v-rhdp-8g
cisco_rootfs_size: 10Gi

windows_instance_image: base-windows-ad-2022
windows_rootfs_size: 60Gi
windows_admin_user: Administrator
windows_admin_password: !vault |
  $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
  64653237326536663631626139363238643532336362313661393266653734366435373935623261
  6365316131346365326365323963666263356536373964660a343963646631343538373235623033
  63346131313762653636346439363464363963646161376337376430666434363031656161343134
  3965663661623435350a383436656463303062653232306239646433393162376333316161386631
  3830

networks:
  - name: default
  - name: kafka

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 12G
    cores: 6
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: showroom
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: showroom
      - name: bastion
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: showroom
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 3000
            protocol: TCP
            targetPort: 3000
            name: bastion-3000
          - port: 8000
            protocol: TCP
            targetPort: 8000
            name: bastion-8000
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
          - port: 5514
            protocol: TCP
            targetPort: 5514
            name: bastion-5514-tcp
          - port: 5514
            protocol: UDP
            targetPort: 5514
            name: bastion-5514-udp
          - port: 1514
            protocol: TCP
            targetPort: 1514
            name: bastion-1514-tcp
          - port: 1514
            protocol: UDP
            targetPort: 1514
            name: bastion-1514-udp
    routes:
      - name: showroom
        host: showroom
        service: showroom
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge
      - name: bastion-3000
        host: gitea
        service: bastion
        targetPort: 3000
        tls: true
        tls_termination: edge
      - name: bastion-8000
        host: splunk
        service: bastion
        targetPort: 8000
        tls: true
        tls_termination: edge
      - name: bastion-8080
        host: vscode
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
          - name: controller-8448
            port: 8448
            protocol: TCP
            targetPort: 8448
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
