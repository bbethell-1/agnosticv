  - name: "node1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-80
    routes:
      - name: node-80
        host: node
        service: node
        targetPort: 80
        tls: false

  - name: "node2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"

  - name: "node3"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"

  - name: "service1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ service_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ service_rootfs_size }}"
    networks:
      - default
      - kafka
    userdata: |
      #cloud-config
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: service1-fip
        type: LoadBalancer
        ports:
          - port: 8065
            protocol: TCP
            targetPort: 8065
            name: service1-8065
          - port: 9092
            protocol: TCP
            targetPort: 9092
            name: service1-9092
          - port: 9093
            protocol: TCP
            targetPort: 9093
            name: service1-9093
    routes:
      - name: service-8065
        host: mattermost
        service: service1-fip
        targetPort: 8065
        tls: true
        tls_termination: edge

  # Cisco router instances with proper SSH key configuration
  - name: "cisco-rtr1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ cisco_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ cisco_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "network"
      - key: "ansible_network_os"
        value: "ios"
    networks:
      - default
    cdroms:
      - metadata:
          name: "cisco-rtr1-config"
        spec:
          source:
            pvc:
              name: "ans-bu-cisco-rhdp-config"
              namespace: cnv-images
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "20Mi"

  - name: "cisco-rtr2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ cisco_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ cisco_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "network"
      - key: "ansible_network_os"
        value: "ios"
    networks:
      - default
    cdroms:
      - metadata:
          name: "cisco-rtr2-config"
        spec:
          source:
            pvc:
              name: "ans-bu-cisco-rhdp-config"
              namespace: cnv-images
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "20Mi"

  # Windows Server with Active Directory
  - name: "windows"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ windows_instance_image }}"
    memory: 16G
    cores: 4
    image_size: "{{ windows_rootfs_size }}"
    interface_model: "e1000e"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "windows"
    networks:
      - default
    services:
      - name: windows
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: windows-ssh
          - port: 5986
            protocol: TCP
            targetPort: 5986
            name: windows-winrm
          - port: 80
            protocol: TCP
            targetPort: 80
            name: windows-http
      - name: windows-rdp
        ports:
          - port: 3389
            protocol: TCP
            targetPort: 3389
            name: windows-rdp

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set_env_authorized_key
    - set-repositories
  bastions:
    - common
    - bastion-lite
    - control-user
    - asset_injector
    - lb2961.ai_driven_aap.controller_firewall
  rhel9_nodes:
    - control-user
    - asset_injector
  servers:
    - lb2961.ai_driven_aap.mattermost
    - lb2961.ai_driven_aap.kafka

software_workloads:
  bastions:
    - vscode-server
    - gitea_vm_setup
    - lb2961.ai_driven_aap.splunk
  rhel9_nodes:
    - lb2961.ai_driven_aap.fix_rhel_repos
    - lb2961.ai_driven_aap.filebeat
    - lb2961.ai_driven_aap.rhel_log_forwarding
  servers:
    - lb2961.ai_driven_aap.gitea_create

post_software_workloads:
  bastions:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
    - ansible_automation_platform_configuration
    - lb2961.ai_driven_aap.mcp_server
    - lb2961.ai_driven_aap.lightspeed_mcp_server
    - lb2961.ai_driven_aap.ansible_dev_env
    - lb2961.ai_driven_aap.code_server_ai_client

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Pre-destroy workloads (cleanup before environment is destroyed)
# -------------------------------------------------------------------
pre_destroy_workloads:
  localhost:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# -------------------------------------------------------------------
# Role: set_env_authorized_key
# -------------------------------------------------------------------
set_env_authorized_key: true
env_authorized_key: "{{ guid }}key"
ansible_ssh_private_key_file: ~/.ssh/{{ env_authorized_key }}.pem
ansible_service_account_user_ssh_config: ssh_config.j2

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - nginx
  - python-devel
  - socat
  - systemd-container
  - unzip

# -------------------------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------------------------
# Role: control-user
# -------------------------------------------------------------------
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"
control_user_enable_user_data: false

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: lb2961.ai_driven_aap.controller_firewall
# -------------------------------------------------------------------
controller_firewall_hostname: controller
controller_firewall_user: rhel
controller_firewall_password: "{{ aap_image_admin_password }}"

# -------------------------------------------------------------------
# Role: rhel-firewalld (for controller/isolated group)
# -------------------------------------------------------------------
rhel_firewalld_open_ports:
  - 5000/tcp

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true

vscode_server_version: "4.112.0"
vscode_server_rpm_url: >-
  https://github.com/coder/code-server/releases/download/v{{ vscode_server_version }}/code-server-{{ vscode_server_version }}-amd64.rpm

vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: false
vscode_server_bind_addr_ip: 0.0.0.0
vscode_server_bind_addr_port: 8080
vscode_server_ansible_become: true
vscode_user_workspace_path: "/home/{{ student_name }}"
vscode_auth_type: password
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_hostname: "vscode-{{ subdomain_base }}"
vscode_ansible_python_interpreter: /home/{{ student_name }}/.venv/bin/python3

vscode_server_default_extensions: []
vscode_server_extension_urls: []

vscode_server_additional_settings: |
  "ansible.python.interpreterPath": "/home/{{ student_name }}/.venv/bin/python3",
  "ansible.ansible.path": "/home/{{ student_name }}/.venv/bin/ansible",
  "ansible.validation.enabled": true,
  "ansible.validation.lint.enabled": true,
  "ansible.lightspeed.enabled": true,
  "ansible.lightspeed.suggestions.enabled": true,
  "security.workspace.trust.enabled": false,
  "ansible.lightspeed.URL": "",
  "terminal.integrated.defaultProfile.linux": "bash",
  "editor.tabSize": 2,
  "editor.insertSpaces": true,
  "editor.detectIndentation": false,
  "[yaml]": {
    "editor.tabSize": 2,
    "editor.insertSpaces": true,
    "editor.detectIndentation": false
  },
  "claudeCode.disableLoginPrompt": true,
  "extensions.ignoreRecommendations": true,
  "python-envs.terminal.autoActivationType": "off",
  "git.scanRepositories": ["/home/{{ student_name }}/lightspeed_playbooks"],
  "files.exclude": {
    "**/.git": true,
    "**/.kube": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true,
    "**/.claude": true,
    "**/.mcp-auth": true,
    "**/.npm": true,
    "**/.nvm": true,
    "**/.venv": true
  }

# -------------------------------------------------------------------
# Workload: gitea_vm_setup
# -------------------------------------------------------------------
gitea_http_listen: "0.0.0.0"
gitea_db_pasword: "{{ common_password }}"
gitea_create_url: "https://gitea-{{ subdomain_base }}"
gitea_create_password: "{{ common_password }}"

# -------------------------------------------------------------------
# LiteLLM Virtual Keys Configuration
# -------------------------------------------------------------------
# Convert model selection to actual model list
ocp4_workload_litellm_virtual_keys_models:
  - openai/granite-3-2-8b-instruct
  - claude-sonnet-4-6
  - gemini-2.5-pro

# Duration selected by user
ocp4_workload_litellm_virtual_keys_duration: "{{ litellm_duration | default('7d') }}"

# Enable user.info messages and data
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Role: ansible_automation_platform_configuration
# -------------------------------------------------------------------
