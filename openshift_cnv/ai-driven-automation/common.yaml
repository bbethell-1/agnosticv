# --------------------------------------
# EDA vars
# --------------------------------------
eda_decision_environment_name: "Kafka Decision Environment"
eda_decision_environment_image: "quay.io/nmartins/network_de"
eda_repo_url: "https://github.com/ansible-tmm/aiops-summitlab.git"

aap_configuration_dispatcher_roles:
  - {role: controller_license, var: controller_license, tags: controller_license}
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}
  - {role: controller_job_launch, var: controller_launch_jobs, tags: controller_job_launch}
  - {role: eda_projects, var: eda_projects, tags: eda_projects}
  - {role: eda_credentials, var: eda_credentials, tags: eda_credentials}
  - {role: eda_decision_environments, var: eda_decision_environments, tags: eda_decision_environments}
  - {role: lb2961.ai_driven_aap.eda_project_sync_wait, var: eda_projects, tags: eda_project_sync_wait}
  - {role: eda_rulebook_activations, var: eda_rulebook_activations, tags: eda_rulebook_activations}

controller_license:
  manifest_url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

gateway_settings:
  SESSION_COOKIE_AGE: 9000

aap_user_accounts:
  - username: "lab-user"
    is_superuser: true
    password: "{{ common_password }}"
    email: "lab-user@redhat.com"
    organizations: "Default"
    first_name: "lab"
    last_name: User

controller_execution_environments:
  - name: "Windows EE"
    image: "quay.io/nmartins/windows_ee_rs"
    pull: missing

controller_credentials:
  - name: lab-credential
    description: lab-user credential
    organization: "Default"
    credential_type: Machine
    inputs:
      username: cloud-user
      ssh_key_data: "{{ ssh_privatekey }}"
      become_method: sudo
  - name: "AAP"
    description: "Red Hat Ansible Automation Platform Credential"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ ansible_automation_platform_configuration_host }}"
      password: "{{ common_password }}"
      username: "{{ student_name }}"
      verify_ssl: false
  - name: "ansible-vault"
    description: "Ansible Vault Credentials"
    organization: "Default"
    credential_type: "Vault"
    inputs:
      vault_password: "{{ aap_ansible_vault_password }}"
  - name: "Gitea"
    description: "Gitea Credentials"
    organization: Default
    credential_type: "Source Control"
    inputs:
      username: "lab-user"
      password: "{{ common_password }}"
  # Network Credential for Cisco devices
  - name: "Network Credential"
    description: "Cisco Network Devices Credential"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: admin
      password: "{{ aap_image_admin_password }}"
      become_method: enable
  # Windows Credential
  - name: "Windows"
    description: "Windows Server Credential"
    organization: "Default"
    credential_type: Machine
    inputs:
      username: "{{ windows_admin_user }}"
      password: "{{ windows_admin_password }}"
  # Red Hat Lightspeed
  - name: "Red Hat Lightspeed"
    description: "Red Hat Lightspeed Credential"
    organization: "Default"
    credential_type: "Insights"
    inputs:
      username: "{{ rhel_lightspeed_user }}"
      password: "{{ rhel_lightspeed_password }}"

controller_inventories:
  - name: "lab-gateway-inventory"
    description: "Gateway Inventory lab"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present
  - name: "lab-inventory"
    description: "Inventory lab"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present
  - name: "service-inventory"
    description: "Service Inventory"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present
  - name: "gitea-inventory"
    description: "Gitea Inventory"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present
  # Network Inventory
  - name: "network-inventory"
    description: "Network Devices Inventory"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present
  - name: "aap-controller"
    description: "AAP Controller Inventory"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present
  # Windows Inventory
  - name: "windows-inventory"
    description: "Windows Server Inventory"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present

controller_hosts:
  - name: "bastion"
    inventory: "lab-gateway-inventory"
  - name: "{{ groups['rhel9_nodes'][0].split('.')[0] }}"
    inventory: "lab-inventory"
  - name: "{{ groups['rhel9_nodes'][1].split('.')[0] }}"
    inventory: "lab-inventory"
  - name: "{{ groups['rhel9_nodes'][2].split('.')[0] }}"
    inventory: "lab-inventory"
  - name: "{{ groups['servers'][0].split('.')[0] }}"
    inventory: "service-inventory"
  - name: "gitea"
    inventory: "gitea-inventory"
    variables:
      ansible_host: "bastion"
  - name: "controller"
    inventory: "aap-controller"
    variables:
      ansible_host: "controller.lab.sandbox-{{ guid }}-ocp4-cluster.svc.cluster.local"
      ansible_user: "rhel"
      ansible_password: "{{ common_password }}"
  # Network Hosts
  - name: "cisco-rtr1"
    inventory: "network-inventory"
    variables:
      ansible_host: "cisco-rtr1.lab.sandbox-{{ guid }}-ocp4-cluster.svc.cluster.local"
      ansible_network_os: cisco.ios.ios
      ansible_connection: ansible.netcommon.network_cli
  - name: "cisco-rtr2"
    inventory: "network-inventory"
    variables:
      ansible_host: "cisco-rtr2.lab.sandbox-{{ guid }}-ocp4-cluster.svc.cluster.local"
      ansible_network_os: cisco.ios.ios
      ansible_connection: ansible.netcommon.network_cli
  # Windows Host
  - name: "windows"
    inventory: "windows-inventory"
    variables:
      ansible_host: "windows.lab.sandbox-{{ guid }}-ocp4-cluster.svc.cluster.local"
      ansible_connection: psrp
      ansible_psrp_auth: negotiate
      ansible_psrp_cert_validation: ignore

controller_configuration_projects_async_retries: 60

# Give EDA project sync time to complete before creating rulebook activations
eda_configuration_rulebook_activations_async_delay: 30

controller_projects:
  - name: "AI-EDA"
    description: "Project for AI EDA - ansible-tmm repository"
    organization: "Default"
    scm_type: "git"
    scm_url: "https://github.com/ansible-tmm/aiops-summitlab.git"
    scm_branch: "feat/rhel-self-healing"
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: false
    wait: true
  - name: "Lightspeed-Playbooks"
    description: "Project to check AI generated Lightspeed Playbooks"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ gitea_create_url }}/lab-user/lightspeed_playbooks.git"
    scm_clean: true
    scm_delete_on_update: false
    scm_update_on_launch: false
    scm_branch: "main"
    credential: "Gitea"
    wait: false
  - name: "Lightspeed-Playbooks-Network"
    description: "Network AIOps Lightspeed Playbooks from Gitea"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ gitea_create_url }}/lab-user/lightspeed_playbooks.git"
    scm_clean: true
    scm_delete_on_update: false
    scm_update_on_launch: true
    scm_branch: "main"
    credential: "Gitea"
    wait: false

controller_templates:
  # Initialization job templates (must run before Lightspeed projects sync)
  - name: "Initialize Lightspeed Gitea Repository"
    description: "Create empty lightspeed-response-network.yml in Gitea"
    organization: "Default"
    job_type: "run"
    inventory: "gitea-inventory"
    project: "AI-EDA"
    playbook: "playbooks/initialize_gitea_lightspeed.yml"
    verbosity: 1
    extra_vars:
      gitea_url: "{{ gitea_create_url }}"
      gitea_password: "{{ common_password }}"
  - name: "Create Network AIOps Workflow"
    description: "Create Network AIOps Workflow with all nodes"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/create_network_aiops_workflow.yml"
    credentials:
      - "AAP"
    verbosity: 1
  # Demo job templates
  - name: "❌ Break Apache"
    description: "Job template to break Apache config"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/httpd_break.yml"
    credentials:
      - "lab-credential"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
    limit: "node1"
  - name: "Fix Node Repos"
    description: "Fix SSL verification for satellite CA vs CDN mismatch on nodes"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/fix_node_repos.yml"
    credentials:
      - "lab-credential"
    verbosity: 1
  - name: "✅ Restore Apache"
    description: "Job template to break Apache config"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/httpd_fix.yml"
    credentials:
      - "lab-credential"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
    limit: "node1"
  - name: "⚙️ Apache Service Status Check"
    description: "Job template to get httpd logs"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/systemd_check_status.yml"
    credentials:
      - "lab-credential"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
    limit: "node1"
  - name: "📣 Notify via Mattermost"
    description: "Job template to send mattermost message"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/mattermost_first_message.yml"
    credentials:
      - "Demo Credential"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
    extra_vars:
      mattermost_instance: "https://mattermost-{{ subdomain_base}}"
      mattermost_token: "{{ hostvars[groups['servers'][0]]['mattermost_incoming_token'] }}"
  - name: "🤖 RHEL AI: Analyze Incident"
    description: "Job template to get details from RHEL AI"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhelai_inference_survey.yml"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
    extra_vars:
      rhelai_url_proto: https
      rhelai_port: 443
      rhelai_server: "{{ litellm_api_endpoint | regex_replace('^https?://', '') }}"
      rhelai_model_name: "openai/granite-3-2-8b-instruct"
      rhelai_token: "{{ litellm_virtual_key }}"
  - name: "⚙️ Build Ansible Lightspeed Job Template"
    description: "Generate job template for Ansible Lightsoeed to generate playbook"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/aap_create_job_template.yml"
    credentials:
      - "AAP"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
  - name: "🧾 Commit Fix to Gitea"
    description: "Push the generated remediation playbook to Gitea"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/scm_pr.yml"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
    extra_vars:
      gitea_token: "{{ hostvars[groups['servers'][0]]['gitea_token_sha1'] }}"
      gitea_url: "{{ gitea_create_url }}"
  - name: "⚙️ Build HTTPD Remediation Template"
    description: "Generate job template to fix httpd"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/httpd_remediation_job_template.yml"
    credentials:
      - "AAP"
    ask_variables_on_launch: false
    survey_enabled: false
    verbosity: 1
  # Network Job Templates
  - name: "Network Router Setup"
    description: "Setup Cisco routers with OSPF configuration"
    organization: "Default"
    job_type: "run"
    inventory: "network-inventory"
    project: "AI-EDA"
    playbook: "playbooks/setup_routers.yml"
    credentials:
      - "Network Credential"
    verbosity: 1
    extra_vars:
      bastion_ip: "bastion.lab.sandbox-{{ guid }}-ocp4-cluster.svc.cluster.local"
  - name: "Network AIOps"
    description: "Generate OSPF remediation playbook using Lightspeed AI"
    organization: "Default"
    job_type: "run"
    inventory: "gitea-inventory"
    project: "AI-EDA"
    playbook: "playbooks/network_aiops.yml"
    credentials:
      - "ansible-vault"
    ask_variables_on_launch: true
    verbosity: 1
    extra_vars:
      gitea_url: "{{ gitea_create_url }}"
      gitea_password: "{{ common_password }}"
  # Windows Use Case Job Templates
  - name: "Setup Winlogbeat on Windows"
    description: "Install and configure Winlogbeat to forward Windows events to Kafka"
    organization: "Default"
    job_type: "run"
    inventory: "windows-inventory"
    project: "AI-EDA"
    playbook: "playbooks/windows_install_winlogbeat.yml"
    credentials:
      - "Windows"
    execution_environment: "Windows EE"
    verbosity: 1
    extra_vars:
      winlogbeat_kafka_brokers: "service1:9092"
      winlogbeat_kafka_topic: "windows-events"
  - name: "Simulate AD Account Creation"
    description: "Create a test local user account to trigger Event ID 4722"
    organization: "Default"
    job_type: "run"
    inventory: "windows-inventory"
    project: "AI-EDA"
    playbook: "playbooks/windows_create_ad_user.yml"
    credentials:
      - "Windows"
    execution_environment: "Windows EE"
    verbosity: 1
  - name: "Simulate Windows Firewall Toggle"
    description: "Toggle Windows Firewall to generate firewall events"
    organization: "Default"
    job_type: "run"
    inventory: "windows-inventory"
    project: "AI-EDA"
    playbook: "playbooks/windows_toggle_firewall.yml"
    credentials:
      - "Windows"
    execution_environment: "Windows EE"
    verbosity: 1
  - name: "Windows: Create Mattermost Ticket"
    description: "Create a Mattermost notification from Windows event data"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/windows_create_ticket.yml"
    ask_variables_on_launch: true
    verbosity: 1
    extra_vars:
      mattermost_instance: "https://mattermost-{{ subdomain_base }}"
      mattermost_token: "{{ hostvars[groups['servers'][0]]['mattermost_incoming_token'] }}"
  - name: "Windows AI: Analyze and Ticket"
    description: "Use AI to analyze a Windows event and create an enriched Mattermost ticket"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/windows_ai_analyze_and_ticket.yml"
    ask_variables_on_launch: true
    verbosity: 1
    extra_vars:
      rhelai_url_proto: https
      rhelai_port: 443
      rhelai_server: "{{ litellm_api_endpoint | regex_replace('^https?://', '') }}"
      rhelai_model_name: "openai/granite-3-2-8b-instruct"
      rhelai_token: "{{ litellm_virtual_key }}"
      mattermost_instance: "https://mattermost-{{ subdomain_base }}"
      mattermost_token: "{{ hostvars[groups['servers'][0]]['mattermost_incoming_token'] }}"
  # AI Agent: CrewAI incident response
  - name: "AI Agent: Incident Response"
    description: "Run CrewAI agent to triage, remediate, and report on an incident"
    organization: "Default"
    job_type: "run"
    inventory: "lab-gateway-inventory"
    project: "AI-EDA"
    playbook: "playbooks/run_ai_agent.yml"
    credentials:
      - "lab-credential"
    ask_variables_on_launch: true
    verbosity: 1
    limit: "bastion"
    become_enabled: true
    extra_vars:
      problem: "Apache web server is down on node1"
      mattermost_instance: "https://mattermost-{{ subdomain_base }}"
      mattermost_token: "{{ hostvars[groups['servers'][0]]['mattermost_incoming_token'] }}"
  # RHEL Self-Healing: Break scenarios
  - name: "Break Cron - Bad Syntax"
    description: "Insert invalid crontab entry to cause crond parse errors"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/break_cron_syntax.yml"
    credentials:
      - "lab-credential"
    verbosity: 1
    ask_limit_on_launch: true
  - name: "Break Cron - Invalid User"
    description: "Create crontab with nonexistent user causing crond ERROR every minute"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/break_cron_permissions.yml"
    credentials:
      - "lab-credential"
    verbosity: 1
    ask_limit_on_launch: true
  # RHEL Self-Healing: Fix scenarios (AI router selects one)
  - name: "Fix Cron - Syntax Error"
    description: "Remove invalid crontab entry from /etc/cron.d/broken-job and restart crond"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/fix_cron_syntax.yml"
    credentials:
      - "lab-credential"
    verbosity: 1
    ask_limit_on_launch: true
    ask_variables_on_launch: true
  - name: "Fix Cron - Invalid User"
    description: "Remove crontab with nonexistent user from /etc/cron.d/bad-user-job"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/fix_cron_permissions.yml"
    credentials:
      - "lab-credential"
    verbosity: 1
    ask_limit_on_launch: true
    ask_variables_on_launch: true
  # RHEL Self-Healing: AI router and dispatch
  - name: "AI Route Cron Remediation"
    description: "AI analyzes syslog alert and selects the correct cron fix template"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/ai_route_cron_remediation.yml"
    credentials:
      - "AAP"
    verbosity: 1
    ask_variables_on_launch: true
    extra_vars:
      llm_api_url: "{{ litellm_api_endpoint }}/chat/completions"
      llm_api_key: "{{ litellm_virtual_key }}"
      llm_model: "claude-sonnet-4-6"
      mattermost_instance: "https://mattermost-{{ subdomain_base }}"
      mattermost_token: "{{ hostvars[groups['servers'][0]]['mattermost_incoming_token'] }}"
  - name: "Dispatch Cron Remediation"
    description: "Execute the AI-selected cron remediation template"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/dispatch_cron_remediation.yml"
    ask_variables_on_launch: true
    credentials:
      - "AAP"
    verbosity: 1
  # RHEL Self-Healing: Mattermost and workflow
  - name: "Notify via Mattermost - RHEL"
    description: "Send RHEL service failure alert to Mattermost"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/mattermost_rhel_alert.yml"
    credentials:
      - "Demo Credential"
    verbosity: 1
    extra_vars:
      mattermost_instance: "https://mattermost-{{ subdomain_base }}"
      mattermost_token: "{{ hostvars[groups['servers'][0]]['mattermost_incoming_token'] }}"
      input_linux_service: "crond"
  - name: "Create RHEL Self-Healing Workflow"
    description: "Create the RHEL-Self-Healing workflow with Mattermost notification"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/create_rhel_workflow.yml"
    credentials:
      - "AAP"
    verbosity: 1
  - name: "Create Cron AIOps Workflow"
    description: "Create the AI-driven cron remediation workflow (router -> approval -> dispatch)"
    organization: "Default"
    job_type: "run"
    inventory: "Demo Inventory"
    project: "AI-EDA"
    playbook: "playbooks/create_cron_aiops_workflow.yml"
    credentials:
      - "AAP"
    verbosity: 1
  # Lightspeed registration
  - name: "Register with Red Hat Lightspeed"
    description: "Register RHEL nodes with Lightspeed and fix repos"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/register_lightspeed.yml"
    credentials:
      - "lab-credential"
    verbosity: 1
    extra_vars:
      scm_username: "{{ rhel_lightspeed_user }}"
      scm_password: "{{ rhel_lightspeed_password }}"
      authentication: basic
  # RHEL System Roles
  - name: "RHEL System Roles - Timesync"
    description: "Configure chrony NTP time synchronization"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_timesync.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
    survey_enabled: true
    survey_spec:
      name: "Timesync Configuration"
      description: "Configure NTP provider and servers"
      spec:
        - question_name: "NTP Provider"
          question_description: "NTP implementation to use"
          variable: "ntp_provider"
          type: "text"
          default: "chrony"
          required: true
          min: 0
          max: 128
        - question_name: "NTP Server 1 Hostname"
          question_description: "First NTP server hostname"
          variable: "ntp_server_1"
          type: "text"
          default: "0.pool.ntp.org"
          required: true
          min: 0
          max: 256
        - question_name: "NTP Server 1 - Pool"
          question_description: "Use as pool for server 1"
          variable: "ntp_server_1_pool"
          type: "multiplechoice"
          choices: "true\nfalse"
          default: "true"
          required: true
        - question_name: "NTP Server 1 - IBurst"
          question_description: "Enable iburst for server 1"
          variable: "ntp_server_1_iburst"
          type: "multiplechoice"
          choices: "true\nfalse"
          default: "true"
          required: true
        - question_name: "NTP Server 2 Hostname"
          question_description: "Second NTP server hostname"
          variable: "ntp_server_2"
          type: "text"
          default: "1.pool.ntp.org"
          required: true
          min: 0
          max: 256
        - question_name: "NTP Server 2 - Pool"
          question_description: "Use as pool for server 2"
          variable: "ntp_server_2_pool"
          type: "multiplechoice"
          choices: "true\nfalse"
          default: "true"
          required: true
        - question_name: "NTP Server 2 - IBurst"
          question_description: "Enable iburst for server 2"
          variable: "ntp_server_2_iburst"
          type: "multiplechoice"
          choices: "true\nfalse"
          default: "true"
          required: true
  - name: "RHEL System Roles - Firewall"
    description: "Configure firewalld with SSH and HTTP services"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_firewall.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
  - name: "RHEL System Roles - SELinux"
    description: "Set SELinux enforcing mode and configure booleans"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_selinux.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
  - name: "RHEL System Roles - Cockpit"
    description: "Install and enable the Cockpit web console"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_cockpit.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
  - name: "RHEL System Roles - Crypto Policies"
    description: "Set system-wide cryptographic policy"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_crypto_policies.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
  - name: "RHEL System Roles - SSHD"
    description: "Harden SSH server configuration"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_sshd.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
  - name: "RHEL System Roles - Logging"
    description: "Configure rsyslog local file logging"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_logging.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1
  - name: "RHEL System Roles - RHC Registration"
    description: "Register system with Red Hat using rhc"
    organization: "Default"
    job_type: "run"
    inventory: "lab-inventory"
    project: "AI-EDA"
    playbook: "playbooks/rhel_system_roles_rhc.yml"
    credentials:
      - "lab-credential"
    ask_limit_on_launch: true
    verbosity: 1

controller_launch_jobs:
  - name: "Initialize Lightspeed Gitea Repository"
  - name: "Register with Red Hat Lightspeed"
  - name: "Create Network AIOps Workflow"
  - name: "Setup Winlogbeat on Windows"
  - name: "Fix Node Repos"
  - name: "✅ Restore Apache"
  - name: "Create RHEL Self-Healing Workflow"
  - name: "Create Cron AIOps Workflow"

eda_projects:
  - name: "ai-eda"
    description: "Event-driven Ansible rulebooks for AIOps"
    organization: Default
    url: "{{ eda_repo_url }}"
    tls_validation: true

eda_credentials:
  - name: "AAP"
    description: "Red Hat Ansible Automation Platform Credential"
    organization: Default
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ ansible_automation_platform_configuration_host }}/api/controller"
      password: "{{ common_password }}"
      username: "{{ student_name }}"
      verify_ssl: false
  # EDA credential for gitea
  - name: "gitea"
    description: "Gitea Source Control Credential for EDA"
    organization: Default
    credential_type: "Source Control"
    inputs:
      username: "lab-user"
      password: "{{ common_password }}"

eda_decision_environments:
  - name: "{{ eda_decision_environment_name }}"
    description: "Decision Environment for AIOps"
    organization: Default
    image_url: "{{ eda_decision_environment_image }}"

eda_rulebook_activations:
  - name: "Web App"
    description: "Capture service errors"
    organization: Default
    project: "ai-eda"
    rulebook: "web_app.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: true
    eda_credentials: "AAP"
    state: present
  # EDA Rulebook Activation for OSPF
  - name: "OSPF Neighbor"
    description: "Detect and remediate OSPF neighbor issues via Splunk webhook"
    organization: Default
    project: "ai-eda"
    rulebook: "ospf.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: true
    eda_credentials: "AAP"
    state: present
  # EDA Rulebook Activation for Windows Events
  - name: "Windows Events"
    description: "Detect Windows security and firewall events via Kafka"
    organization: Default
    project: "ai-eda"
    rulebook: "windows_events.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: true
    eda_credentials: "AAP"
    state: present
  # EDA Rulebook Activation for AI Agent
  - name: "AI Agent"
    description: "Trigger AI agent on infrastructure events via Kafka"
    organization: Default
    project: "ai-eda"
    rulebook: "ai_agent.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: false
    eda_credentials: "AAP"
    state: disabled
  # EDA Rulebook Activation for RHEL Cron AIOps
  - name: "RHEL Cron AIOps"
    description: "Route cron failures through AI-driven remediation workflow"
    organization: Default
    project: "ai-eda"
    rulebook: "rhel_service.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: false
    eda_credentials: "AAP"
    state: disabled

