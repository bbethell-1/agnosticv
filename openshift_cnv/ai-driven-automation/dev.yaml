  - name: "node1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-80
    routes:
      - name: node-80
        host: node
        service: node
        targetPort: 80
        tls: false

  - name: "node2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node2
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node2-80
    routes:
      - name: node2-80
        host: node2
        service: node2
        targetPort: 80
        tls: false

  - name: "node3"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node3
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node3-80
    routes:
      - name: node3-80
        host: node3
        service: node3
        targetPort: 80
        tls: false

  - name: "service1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ service_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ service_rootfs_size }}"
    networks:
      - default
      - kafka
    userdata: |
      #cloud-config
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: service1-fip
        type: LoadBalancer
        ports:
          - port: 8065
            protocol: TCP
            targetPort: 8065
            name: service1-8065
          - port: 9092
            protocol: TCP
            targetPort: 9092
            name: service1-9092
          - port: 9093
            protocol: TCP
            targetPort: 9093
            name: service1-9093
    routes:
      - name: service-8065
        host: mattermost
        service: service1-fip
        targetPort: 8065
        tls: true
        tls_termination: edge

  - name: "cisco-rtr1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ cisco_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ cisco_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "network"
      - key: "ansible_network_os"
        value: "ios"
    networks:
      - default
    cdroms:
      - metadata:
          name: "cisco-rtr1-config"
        spec:
          source:
            pvc:
              name: "ans-bu-cisco-rhdp-config"
              namespace: cnv-images
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "20Mi"

  - name: "cisco-rtr2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ cisco_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ cisco_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "network"
      - key: "ansible_network_os"
        value: "ios"
    networks:
      - default
    cdroms:
      - metadata:
          name: "cisco-rtr2-config"
        spec:
          source:
            pvc:
              name: "ans-bu-cisco-rhdp-config"
              namespace: cnv-images
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "20Mi"

  - name: "windows"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ windows_instance_image }}"
    memory: 16G
    cores: 4
    image_size: "{{ windows_rootfs_size }}"
    interface_model: "e1000e"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "windows"
    networks:
      - default
    services:
      - name: windows
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssh
          - port: 5986
            protocol: TCP
            targetPort: 5986
            name: windows-winrm
          - port: 80
            protocol: TCP
            targetPort: 80
            name: windows-http
      - name: windows-rdp
        ports:
          - port: 3389
            protocol: TCP
            targetPort: 3389
            name: windows-rdp

# -------------------------------------------------------------------
# Collection
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/lb2961.ai_driven_aap.git
      type: git
      version: main
    - name: ansible.netcommon
      version: ">=6.0.0"
    - name: cisco.ios
      version: ">=5.0.0"
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "1.3.1"
    - name: ansible.windows
      version: ">=2.0.0"
    - name: microsoft.ad
      version: ">=1.0.0"
    - name: community.windows
      version: ">=2.0.0"
    - name: ansible.platform
      version: ">=2.0.0"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set_env_authorized_key
    - set-repositories
  bastions:
    - common
    - bastion-lite
    - control-user
    - asset_injector
    - lb2961.ai_driven_aap.controller_firewall
  rhel9_nodes:
    - control-user
    - asset_injector
  servers:
    - lb2961.ai_driven_aap.mattermost
    - lb2961.ai_driven_aap.kafka

software_workloads:
  bastions:
    - vscode-server
    - gitea_vm_setup
    - lb2961.ai_driven_aap.splunk
  rhel9_nodes:
    - lb2961.ai_driven_aap.fix_rhel_repos
    - lb2961.ai_driven_aap.filebeat
    - lb2961.ai_driven_aap.rhel_log_forwarding
  servers:
    - lb2961.ai_driven_aap.gitea_create

post_software_workloads:
  bastions:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
    - ansible_automation_platform_configuration
    - lb2961.ai_driven_aap.mcp_server
    - lb2961.ai_driven_aap.lightspeed_mcp_server
    - lb2961.ai_driven_aap.ansible_dev_env
    - lb2961.ai_driven_aap.code_server_ai_client

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Showroom variables: add node hostnames, IDE, and Insights for new modules
# -------------------------------------------------------------------
agnosticv_importdata:
  controller_url: "https://controller-{{ subdomain_base }}"
  controller_username: "{{ ansible_automation_platform_configuration_username }}"
  controller_password: "{{ ansible_automation_platform_configuration_password }}"
  eda_webhook_url: "https://eda-webhook-{{ subdomain_base }}"
  mattermost_url: "https://mattermost-{{ subdomain_base }}"
  mattermost_username: ansibleadmin@ansible.com
  mattermost_password: "{{ common_password }}"
  splunk_url: "https://splunk-{{ subdomain_base }}"
  splunk_username: "admin"
  splunk_password: "{{ common_password }}"
  gitea_url: "https://gitea-{{ subdomain_base }}"
  gitea_username: "{{ student_name }}"
  gitea_password: "{{ common_password }}"
  vscode_server_url: "https://vscode-{{ subdomain_base }}"
  vscode_server_password: "{{ common_password }}"
  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  rhel_node1: "{{ groups['rhel9_nodes'][0].split('.')[0] }}"
  rhel_node2: "{{ groups['rhel9_nodes'][1].split('.')[0] }}"
  rhel_node3: "{{ groups['rhel9_nodes'][2].split('.')[0] }}"
  ide_url: "https://vscode-{{ subdomain_base }}"
  ide_username: "{{ student_name }}"
  ide_password: "{{ common_password }}"
  insights_username: "{{ rhel_lightspeed_user }}"
  insights_password: "{{ rhel_lightspeed_password }}"
  windows_host: "windows"

