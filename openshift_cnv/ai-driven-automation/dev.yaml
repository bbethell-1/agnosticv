---
# -------------------------------------------------------------------
# Purpose: Dev/testing - full lab with all modules (1-5)
# Includes: Apache remediation, Splunk/OSPF, Windows, Lightspeed, Cron AIOps
# -------------------------------------------------------------------
purpose: dev

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
  deployer:
    scm_ref: development

# -------------------------------------------------------------------
# Full instances: bastion, controller, node1-3, service1, cisco-rtr1/2, windows
# -------------------------------------------------------------------
networks:
  - name: default
  - name: kafka

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 12G
    cores: 6
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: showroom
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: showroom
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: showroom
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 3000
            protocol: TCP
            targetPort: 3000
            name: bastion-3000
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
          - port: 8000
            protocol: TCP
            targetPort: 8000
            name: bastion-8000
          - port: 5514
            protocol: TCP
            targetPort: 5514
            name: bastion-5514-tcp
          - port: 5514
            protocol: UDP
            targetPort: 5514
            name: bastion-5514-udp
          - port: 1514
            protocol: TCP
            targetPort: 1514
            name: bastion-1514-tcp
          - port: 1514
            protocol: UDP
            targetPort: 1514
            name: bastion-1514-udp
    routes:
      - name: showroom
        host: showroom
        service: showroom
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge
      - name: bastion-3000
        host: gitea
        service: bastion
        targetPort: 3000
        tls: true
        tls_termination: edge
      - name: bastion-8000
        host: splunk
        service: bastion
        targetPort: 8000
        tls: true
        tls_termination: edge
      - name: bastion-8080
        host: vscode
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
          - name: controller-8448
            port: 8448
            protocol: TCP
            targetPort: 8448
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
