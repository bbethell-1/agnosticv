---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event
showroom_antora_enable_dev_mode: "false"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv09
        purpose: events
        virt: "yes"
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
  deployer:
    scm_ref: ai-driven-auto-1.0.0
