  - name: "node1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-80
    routes:
      - name: node-80
        host: node
        service: node
        targetPort: 80
        tls: false

  - name: "node2"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node2
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node2-80
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: node2-8080
    routes:
      - name: node2-80
        host: node2
        service: node2
        targetPort: 80
        tls: false

  - name: "node3"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"

  - name: "service1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ service_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ service_rootfs_size }}"
    networks:
      - default
      - kafka
    userdata: |
      #cloud-config
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: service1-fip
        type: LoadBalancer
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssh
          - port: 8065
            protocol: TCP
            targetPort: 8065
            name: service1-8065
          - port: 9092
            protocol: TCP
            targetPort: 9092
            name: service1-9092
          - port: 9093
            protocol: TCP
            targetPort: 9093
            name: service1-9093
    routes:
      - name: service-8065
        host: mattermost
        service: service1-fip
        targetPort: 8065
        tls: true
        tls_termination: edge

  - name: "windows"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ windows_instance_image }}"
    memory: 16G
    cores: 4
    image_size: "{{ windows_rootfs_size }}"
    interface_model: "e1000e"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
      - key: "ostype"
        value: "windows"
    networks:
      - default
    services:
      - name: windows
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: ssh
          - port: 5986
            protocol: TCP
            targetPort: 5986
            name: windows-winrm
          - port: 80
            protocol: TCP
            targetPort: 80
            name: windows-http
      - name: windows-rdp
        ports:
          - port: 3389
            protocol: TCP
            targetPort: 3389
            name: windows-rdp

# -------------------------------------------------------------------
# Collections: pin lb2961 to feat/instana-section only
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.6.10
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: "{{ tag }}"
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/lb2961.ai_driven_aap.git
      type: git
      version: feat/instana-section
    - name: ansible.netcommon
      version: ">=6.0.0"
    - name: cisco.ios
      version: ">=5.0.0"
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "1.3.2"
    - name: ansible.windows
      version: ">=2.0.0"
    - name: microsoft.ad
      version: ">=1.0.0"
    - name: community.windows
      version: ">=2.0.0"
    - name: ansible.platform
      version: ">=2.0.0"

# -------------------------------------------------------------------
# Software workloads: drop Splunk only, everything else from common
# -------------------------------------------------------------------
software_workloads:
  bastions:
    - rhpds.manage_host.vscode_server
    - rhpds.manage_host.gitea_vm_setup
  rhel9_nodes:
    - lb2961.ai_driven_aap.rhel_log_forwarding
    - lb2961.ai_driven_aap.filebeat
  servers:
    - lb2961.ai_driven_aap.gitea_create

# -------------------------------------------------------------------
# Post-software: add instana_agent in rhel9_nodes after dispatch
# -------------------------------------------------------------------
post_software_workloads:
  bastions:
    - infra.aap_configuration.dispatch
    - lb2961.ai_driven_aap.mcp_server
    - lb2961.ai_driven_aap.lightspeed_mcp_server
    - lb2961.ai_driven_aap.ansible_dev_env
    - lb2961.ai_driven_aap.code_server_ai_client
  rhel9_nodes:
    - lb2961.ai_driven_aap.instana_agent

# -------------------------------------------------------------------
# AAP: AI-EDA project on feat/instana-section (adds instana.yml)
# -------------------------------------------------------------------
controller_projects:
  - name: "AI-EDA"
    description: "Project for AI EDA - ansible-tmm repository"
    organization: "Default"
    scm_type: "git"
    scm_url: "https://github.com/ansible-tmm/aiops-summitlab.git"
    scm_branch: "feat/instana-section"
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: false
    wait: false
  - name: "Lightspeed-Playbooks-Network"
    description: "Network AIOps Lightspeed Playbooks from Gitea"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ gitea_create_url }}/lab-user/lightspeed_playbooks.git"
    scm_clean: true
    scm_delete_on_update: false
    scm_update_on_launch: true
    scm_branch: "main"
    credential: "Gitea"
    wait: false
  - name: "Lightspeed-Playbooks"
    description: "Project to check AI generated Lightspeed Playbooks"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ gitea_create_url }}/lab-user/lightspeed_playbooks.git"
    scm_clean: true
    scm_delete_on_update: false
    scm_update_on_launch: false
    scm_branch: "main"
    credential: "Gitea"
    wait: false

# -------------------------------------------------------------------
# EDA: AI-EDA on feat/instana-section, add Instana AIOps, drop OSPF/Cron
# -------------------------------------------------------------------
controller_url: "https://controller-{{ subdomain_base }}"

eda_projects:
  - name: "ai-eda"
    description: "Event-driven Ansible rulebooks for AIOps"
    organization: Default
    url: "{{ eda_repo_url }}"
    scm_branch: "feat/instana-section"
    tls_validation: true

eda_rulebook_activations:
  - name: "Web App"
    description: "Capture service errors"
    organization: Default
    project: "ai-eda"
    rulebook: "web_app.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: true
    eda_credentials: "AAP"
    state: present
  - name: "Windows Events"
    description: "Detect Windows security and firewall events via Kafka"
    organization: Default
    project: "ai-eda"
    rulebook: "windows_events.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: true
    eda_credentials: "AAP"
    state: present
  # Disabled at start: shares the httpd Kafka topic with "Web App".
  # Section 5 (module-09) has students disable Web App and enable this one.
  - name: "AI Agent"
    description: "AI Agent for incident response"
    organization: Default
    project: "ai-eda"
    rulebook: "ai_agent.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: false
    eda_credentials: "AAP"
    state: disabled
  - name: "Instana AIOps"
    description: "Listens for Instana Smart Alert webhooks and triggers AAP remediation"
    organization: Default
    project: "ai-eda"
    rulebook: "instana.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "always"
    enabled: true
    eda_credentials: "AAP"
    state: present

# -------------------------------------------------------------------
# Showroom: feat/instana-section branch with Instana modules
# -------------------------------------------------------------------
showroom_git_ref: feat/instana-section

