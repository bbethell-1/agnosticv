---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event
showroom_antora_enable_dev_mode: "false"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
    - kind: MaaSSandbox
      cloud_selector:
        purpose: production
      models: "openai/granite-3-2-8b-instruct,claude-sonnet-4-6-a70b,gemini-2.5-pro"
      var: maas_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: ocpv09
        purpose: events
        virt: "yes"
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
  deployer:
    scm_ref: ai-driven-auto-1.0.0

# ===================================================================
# Instana TechExchange overrides - MINIMAL changes only
# Keep everything from common.yaml, only change what needs changing:
# - instances: drop cisco-rtr1/2, add node2 port 8080
# - software: drop Splunk
# - post_software: add instana_agent
# - collections: lb2961 to feat/instana-section
# - eda: AI-EDA on feat/instana-section, add Instana activation, drop OSPF/Cron
# ===================================================================

# -------------------------------------------------------------------
# Instances: same as common.yaml EXCEPT drop cisco-rtr1/2, add node2 8080
# -------------------------------------------------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 12G
    cores: 6
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: showroom
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: showroom
      - name: bastion
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
            name: bastion-22
          - port: 80
            protocol: TCP
            targetPort: 80
            name: showroom
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 3000
            protocol: TCP
            targetPort: 3000
            name: bastion-3000
          - port: 8000
            protocol: TCP
            targetPort: 8000
            name: bastion-8000
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
          - port: 5514
            protocol: TCP
            targetPort: 5514
            name: bastion-5514-tcp
          - port: 5514
            protocol: UDP
            targetPort: 5514
            name: bastion-5514-udp
          - port: 1514
            protocol: TCP
            targetPort: 1514
            name: bastion-1514-tcp
          - port: 1514
            protocol: UDP
            targetPort: 1514
            name: bastion-1514-udp
    routes:
      - name: showroom
        host: showroom
        service: showroom
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: bastion-443
        service: bastion
        targetPort: 443
        tls: true
        tls_termination: edge
      - name: bastion-3000
        host: gitea
        service: bastion
        targetPort: 3000
        tls: true
        tls_termination: edge
      - name: bastion-8000
        host: splunk
        service: bastion
        targetPort: 8000
        tls: true
        tls_termination: edge
      - name: bastion-8080
        host: vscode
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
        - firewall-cmd --permanent --add-port=5000/tcp
        - firewall-cmd --reload
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
          - name: controller-8448
            port: 8448
            protocol: TCP
            targetPort: 8448
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
