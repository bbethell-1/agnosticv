---
#include /includes/ansible_control_plane/current_controller.yaml
# -------------------------------------------------------------------
# --- Catalog Item: "OpenShift Virtualization Bare Metal Lab"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/agd-v2-mapping.yaml

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: openshift-cluster

# Required to scale up the cluster
openshift_cnv_set_sandbox_provision_data: true

# Default cluster size for sandbox validation (overridden by catalog parameter)
cluster_size: "{{ cluster_size | default('sno') }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: bm-lab-8-jan

# -------------------------------------------------------------------
# Bastion VM settings
# -------------------------------------------------------------------

# Create a student user, password autogenerated
bastion_setup_student_user: true
bastion_student_user_name: lab-user

bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi

# -------------------------------------------------------------------
# OpenShift settings
# -------------------------------------------------------------------
cluster_name: "cluster-{{ guid }}"

host_ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
host_ocp4_installer_version: "4.20"
host_ocp4_deploy_installation_method: openshift_assisted

# Save kubeadmin password in user data - only necessary if
# no authentication is set up for the cluster
host_ocp4_installer_set_user_data_kubeadmin_password: false

openshift_cluster_admin_service_account_enable: true
openshift_cluster_ingress_controller_allow_wildcards: true

control_plane_instance_count: 3
ai_control_plane_cores: 16
ai_control_plane_memory: 32Gi

worker_instance_count: 3
ai_workers_cores: 8
ai_workers_memory: 96Gi

# -------------------------------------------------------------------
# OpenShift Networking
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

ai_attach_workers_networks:
- default/flatnetwork

bastion_extra_networks:
- default/flatnetwork

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
ai_network_mtu: 8900

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_external_odf
- agnosticd.core_workloads.ocp4_workload_authentication_keycloak
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_nmstate
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_metallb
- agnosticd.core_workloads.ocp4_workload_virt_network_config
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# - agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
ocp4_workload_external_odf_channel: stable-4.20
ocp4_workload_external_odf_operator_automatic_install_plan_approval: true
ocp4_workload_external_odf_operator_starting_csv: ""
ocp4_workload_external_odf_operator_use_catalog_snapshot: false
ocp4_workload_external_odf_backingstore_custom_resources: true
ocp4_workload_external_odf_backingstore_cpu_limits: 1000m
ocp4_workload_external_odf_backingstore_cpu_requests: 800m
ocp4_workload_external_odf_backingstore_memory_limits: 4000Mi
ocp4_workload_external_odf_backingstore_memory_requests: 800Mi
ocp4_workload_external_odf_backingstore_storage_requests: 50Gi
ocp4_workload_external_odf_noobaa_custom_resources: true
ocp4_workload_external_odf_noobaa_memory_limits: 2Gi
ocp4_workload_external_odf_noobaa_memory_requests: 2Gi
ocp4_workload_external_odf_noobaa_cpu_limits: 1
ocp4_workload_external_odf_noobaa_cpu_requests: 1

# ===================================================================
# Workload: agnosticd.core_workloads.ocp4_workload_authentication_keycloak
# ===================================================================
# Red Hat Build of Keycloak (RHBK) - User Authentication
# Creates Keycloak instance and manages user accounts

# Operator configuration
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false

ocp4_workload_authentication_keycloak_admin_create: true
ocp4_workload_authentication_keycloak_admin_username: admin
ocp4_workload_authentication_keycloak_admin_password: ''
ocp4_workload_authentication_keycloak_remove_kubeadmin: true

ocp4_workload_authentication_keycloak_num_users: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_keycloak_user_username_base: user
ocp4_workload_authentication_keycloak_user_password: ''

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
# ocp4_workload_authentication_htpasswd_user_base: user
# ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: 0
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_cloud_provider: aws

# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:
ocp4_workload_cert_manager_aws_region: us-east-2
ocp4_workload_cert_manager_aws_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_aws_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_nmstate
# -------------------------------------------------------------------
ocp4_workload_nmstate_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
# Use PVCs for KubeVirt boot images

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: false
ocp4_workload_metallb_enable_l2advertisement: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: false
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"

# -------------------------------------------------------------------
# Workload: agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: latest

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# Workload: agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/raffaelespazzoli/openshift-baremetal-lab.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: charts/bootstrap

ocp4_workload_gitops_bootstrap_application_wait: false

ocp4_workload_gitops_bootstrap_helm_values:
  # valid values are connected, disconnected, proxied
  environmentConnectivity: connected
  # valid values are simple, bonds
  environmentNetworking: simple
  # allowed values is 1 for now.
  numStudents: 1
  clusterBaseDomain: "cluster-{{ guid }}.dynamic.redhatworkshops.io"
  storageClassName: ocs-external-storagecluster-ceph-rbd

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
# ocp4_workload_showroom_name: showroom
# ocp4_workload_showroom_namespace: showroom
# ocp4_workload_showroom_content_only: false

# ocp4_workload_showroom_terminal_type: wetty
# ocp4_workload_showroom_wetty_ssh_bastion_login: true

# ocp4_workload_showroom_content_git_repo: https://github.com/RedHatQuickCourses/etx-virt_delivery
# ocp4_workload_showroom_content_git_repo_ref: self-paced

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: fff08e36-acc8-42af-afb9-20872151abc0
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-12-17
      pull: missing

  sandbox_api:
    actions:
      destroy:
        catch_all: false

  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
      limits.cpu: '999'
      requests.cpu: '999'
      limits.memory: 2000Gi
      requests.memory: 2000Gi

  catalog:
    display_name: "OpenShift Virtualization Bare Metal Lab"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    workshopLabUiRedirect: false
    workshopUiMaxInstances: 3
    keywords:
    - openshift
    - ocp
    - cnv
    - virtualization
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_OpenShift
      Provider: RHDP
    reportingLabels:
      assetGroup: Virtualization

  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    sme:
    - name: Raffaele Spazzoli
      email: rspazzol@redhat.com
