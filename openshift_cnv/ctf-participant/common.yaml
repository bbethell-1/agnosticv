    project: "{{ lab_base_aap_name }}-project"
    playbook: "challenge-aap-02/verify.yml"
    allow_simultaneous: true
    limit: server2
    credentials:
      - "CTF Participant Host"
  - name: "( {{ lab_base_aap_name }} ) AAP  - Verify Challenge 03"
    job_type: run
    inventory: "{{ lab_base_aap_name }}-inventory"
    project: "{{ lab_base_aap_name }}-project"
    playbook: "challenge-aap-03/verify.yml"
    allow_simultaneous: true
    limit: server2
    credentials:
      - "CTF Participant Host"
  - name: "( {{ lab_base_aap_name }} ) AAP  - Verify Challenge 04"
    job_type: run
    inventory: "{{ lab_base_aap_name }}-inventory"
    project: "{{ lab_base_aap_name }}-project"
    playbook: "challenge-aap-04/verify.yml"
    allow_simultaneous: true
    limit: server2
    credentials:
      - "CTF Participant Host"
  - name: "( {{ lab_base_aap_name }} ) AAP  - Verify Challenge 05"
    job_type: run
    inventory: "{{ lab_base_aap_name }}-inventory"
    project: "{{ lab_base_aap_name }}-project"
    playbook: "challenge-aap-05/verify.yml"
    allow_simultaneous: true
    limit: server2
