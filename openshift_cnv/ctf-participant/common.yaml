---
#include /includes/ansible_control_plane/current_controller.yaml
# -------------------------------------------------------------------
# --- Catalog: ctf-participant
# --- Catalog Item: CTF Participant
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#includes/access-restriction-rh1-2026-devs.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
# Auto-pass user email and catalog item name to LiteLLM for better tracking
#include /includes/parameters/litellm_metadata.yaml

#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# ------------------------
# Subdomain configuration
# ------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"

# ------------------------
# Bastion public hostname
# (dynamically built from inventory)
# ------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"

# ------------------------
# Common password
# (auto-generated from GUID)
# ------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# ------------------------
# User configuration
# ------------------------
ansible_user: cloud-user
remote_user: cloud-user

# -------------------------------------------------------------------
# Instances to deploy
# -------------------------------------------------------------------
# ------------------------
# Instance Images
# ------------------------
bastion_instance_image: rhel-9.6
node_instance_image: rhel-10.0

bastion_rootfs_size: 100Gi
node_rootfs_size: 50Gi

pv_size_node: 20Gi

# openshift_cnv_legacy_routes: false
# openshift_cnv_route_remove_x_frame_options_header: true

# ------------------------
# Instances (VMs)
# ------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ bastion_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
    routes:
      - name: bastion-443
        host: bastion
        service: bastion
        targetPort: 443
        tls: true

  - name: "server1"
    count: 1
    unique: false
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: server1-fip
        type: LoadBalancer
        ports:
          - port: 2222
            protocol: TCP
            targetPort: 22
            name: server1-22
      - name: server1
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: server1-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: server1-443
    routes:
      - name: server1-80
        host: server1
        service: server1
        targetPort: 80
        tls: true
        tls_termination: edge
    disks:
      - metadata:
          name: "server1{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

  - name: "server2"
    count: 1
    unique: false
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: server2-fip
        type: LoadBalancer
        ports:
          - port: 2222
            protocol: TCP
            targetPort: 22
            name: server2-22
      - name: server2
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: server2-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: server2-443
    routes:
      - name: server2-80
        host: server2
        service: server2
        targetPort: 80
        tls: true
        tls_termination: edge
    disks:
      - metadata:
          name: "server1{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "1.0.0"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - openshift_workload_deployer
  all:
    - host_satellite_repositories
    - host_common_packages
    - agnosticd.cloud_vm_workloads.control_user
    - rhpds.manage_host.asset_injector
  bastions:
    - bastion

software_workloads:
  bastions:
    - rhpds.manage_host.aap_api
    - infra.aap_configuration.dispatch

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import

# -------------------------------------------------------------------
# Workload: openshift_workload_deployer
# -------------------------------------------------------------------
ACTION: provision
openshift_workload_deployer_clusters:
  default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

openshift_workload_deployer_workloads:
  - name: agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
  - name: agnosticd.core_workloads.ocp4_workload_openshift_virtualization

# -------------------------------------------------------------------
# OCP Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
num_users: 1
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_user_password length=12 chars=ascii_letters,digits')
  }}

ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: "user"
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# OCP Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Call role host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false

bastion_host_packages:
  - ansible
  - at
  - bash-completion
  - bind-utils
  - buildah
  - curl
  - git
  - httpd-tools
  - nano
  - podman
  - python3.11
  - python3.11-devel
  - python3.11-pip
  - python3.11-kubernetes
  - python3
  - python3-pip
  - python3-kubernetes
  - tmux
  - tree
  - tar
  - unzip
  - vim-enhanced
  - wget

node_host_packages:
  - skopeo
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - curl
  - tar

# Extra packages set dynamically based on group membership
host_common_packages_extra: >-
  {{
      bastion_host_packages
    if 'bastions' in group_names
    else
      node_host_packages
  }}

# -------------------------------------------------------------------
# Workload: bastion
# -------------------------------------------------------------------
install_bastion: true
bastion_setup_student_user: true
bastion_student_user_name: lab-user
bastion_student_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# -------------------------------------------------------------------
env_authorized_key: "{{ guid }}key"
install_control_user: true
student_name: "{{ bastion_student_user_name }}"
student_password: "{{ bastion_student_user_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ bastion_student_user_password }}"
control_user_private_group: "{{ omit }}"
control_user_ssh_config: ./files/ssh_config.j2

# Disable control_user's user_data reporting (bastion role handles it)
control_user_enable_user_data: false

# -------------------------------------------------------------------
# Workload: rhpds.manage_host.asset_injector
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted

  - description: Create SSH config for lab-user to easily SSH to nodes
    module: copy
    dest: /home/{{ bastion_student_user_name }}/.ssh/config
    owner: "{{ bastion_student_user_name }}"
    group: "{{ bastion_student_user_name }}"
    mode: "0600"
    content: |
      # SSH config for easy access to nodes
      Host *
          User {{ student_name }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          IdentityFile ~/.ssh/{{ guid }}key.pem

  - description: Download virtclt cli
    module: get_url
    src: "{{ hostvars.localhost._ocp4_workload_openshift_virtualization_virtctl_url }}"
    dest: /tmp/virtctl.tar.gz
    owner: "{{ student_name }}"

  - description: Unarchive virtclt cli
    module: unarchive
    src: /tmp/virtctl.tar.gz
    dest: /usr/bin
    remote_src: true

  - description: Remove virtctl downloaded tar
    module: file
    state: remove
    path: /tmp/virtctl.tar.gz

  - description: Download oc client
    module: get_url
    src: "{{ openshift_client_download_url }}"
    dest: /tmp/openshift-client-linux.tar.gz
    owner: "{{ student_name }}"

  - description: Unarchive oc client
    module: unarchive
    src: /tmp/openshift-client-linux.tar.gz
    dest: /usr/bin
    remote_src: true

  - description: Remove oc downloaded tar
    module: file
    state: remove
    path: /tmp/openshift-client-linux.tar.gz

  - description: Openshift oc login
    become: true
    become_user: "{{ student_name }}"
    module: command
    cmd: "/usr/bin/oc login {{ openshift_api_url }} --token={{ openshift_cluster_admin_token }} --insecure-skip-tls-verify=true"

  - description: Install ansible-core
    become: true
    module: dnf
    name: ansible-core
    state: present

  - description: Install collections
    become: true
    become_user: "{{ student_name }}"
    module: command
    cmd: >-
      ansible-galaxy collection install
      ansible.posix
      community.general
      community.libvirt
      community.crypto
      community.okd
      kubernetes.core

  - description: Install python libs
    become: true
    become_user: "{{ student_name }}"
    module: command
    cmd: pip3.11 install passlib

  - description: Set python default to 3.11
    become: true
    module: shell
    cmd: >-
      sudo alternatives --install /usr/bin/python python /usr/bin/python3.9 10;
      sudo alternatives --install /usr/bin/python python /usr/bin/python3.11 20;
      sudo alternatives --set python /usr/bin/python3.11;
      python --version

  - description: Set python3 default to 3.11
    become: true
    module: shell
    cmd: >-
      sudo alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 10;
      sudo alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 20;
      sudo alternatives --set python3 /usr/bin/python3.11;
      python3 --version

# Set asset_injector_assets based on group membership
servers_asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted

  - description: Create SSH config for lab-user to easily SSH to nodes
    module: copy
    dest: /home/{{ bastion_student_user_name }}/.ssh/config
    owner: "{{ bastion_student_user_name }}"
    group: "{{ bastion_student_user_name }}"
    mode: "0600"
    content: |
      # SSH config for easy access to nodes
      Host *
          User {{ student_name }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          IdentityFile ~/.ssh/{{ guid }}key.pem

asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names
      else servers_asset_injector_assets
  }}

# -------------------------------------------------------------------
# Workload: rhpds.manage_host.aap_api
# -------------------------------------------------------------------
aap_api_controller_url: "https://controller-{{ ctf_leader_board_subdomain_base }}"
aap_api_controller_username: admin
aap_api_controller_password: ansible123!
aap_api_controller_verify_ssl: false

aap_api_job_launches:
  - name: Configure Gitea users and repos
    organization: Default
    wait: true
    extra_vars:
      teams:
        - name: "{{ lab_base_aap_name }}-user"
          password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: infra.aap_configuration.dispatch
# -------------------------------------------------------------------
cas_object_label: checking
controller_dependency_check: false
aap_hostname: "https://controller-{{ ctf_leader_board_subdomain_base }}"
aap_username: admin
aap_password: "ansible123!"
aap_validate_certs: false

aap_configuration_dispatcher_roles:
  - {role: gateway_organizations, var: aap_organizations, tags: gateway_organizations}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: gateway_role_user_assignments, var: gateway_role_user_assignments, tags: gateway_role_user_assignments}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}
  - {role: controller_job_launch, var: controller_launch_jobs, tags: controller_launch_jobs}

lab_base_aap_name: "Table-{{ guid }}"
ctf_aap_org_name: "{{ lab_base_aap_name }}-org"

aap_organizations:
  - name: "{{ ctf_aap_org_name }}"
    description: "Org for CTF people {{ ctf_aap_org_name }}"

aap_user_accounts:
  - username: "{{ lab_base_aap_name }}-user"
    is_superuser: false
    password: "{{ common_password }}"
    email: "{{ lab_base_aap_name }}-user@redhat.com"
    organizations: "{{ lab_base_aap_name }}-org"
    first_name: "{{ lab_base_aap_name }}"
    last_name: User

gateway_role_user_assignments:
  - role_definition: Organization Admin
    user: "{{ lab_base_aap_name }}-user"
    object_id: >-
      {{ query('ansible.platform.gateway_api', 'organizations',
          query_params={'name': ctf_aap_org_name },
          host=aap_hostname,
          username=aap_username,
          password=aap_password,
          verify_ssl=aap_validate_certs
          ) | map(attribute='id') | join(', ') | int
      }}

controller_credentials:
  - name: "{{ lab_base_aap_name }} OpenShift Credential"
    description: "OpenShift API Bearer Token"
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      bearer_token: "{{ openshift_cluster_admin_token }}"
      verify_ssl: true

  - name: "{{ lab_base_aap_name }} Repo Cred"
    description: "{{ lab_base_aap_name }} Repo Cred"
    organization: Default
    credential_type: Source Control
    inputs:
      username: "{{ lab_base_aap_name }}-user"
      password: "{{ common_password }}"

controller_inventories:
  - name: "{{ lab_base_aap_name }}-inventory"
    description: "Inventory {{ lab_base_aap_name }}"
    organization: "{{ lab_base_aap_name }}-org"
    prevent_instance_group_fallback: false
    state: present

controller_hosts:
  - name: server1
    inventory: "{{ lab_base_aap_name }}-inventory"
    variables:
      ansible_host: "{{ hostvars['server1']['external_ip'] }}"
      ansible_port: "2222"
      ansible_user: "{{ student_name }}"
      ansible_password: "{{ student_password }}"

  - name: server2
    inventory: "{{ lab_base_aap_name }}-inventory"
    variables:
      ansible_host: "{{ hostvars['server2']['external_ip'] }}"
      ansible_port: "2222"
      ansible_user: "{{ student_name }}"
      ansible_password: "{{ student_password }}"

  - name: "{{ lab_base_aap_name }}-server1"
    inventory: "CTF Participant All Table Host"
    variables:
      ansible_host: "{{ hostvars['server1']['external_ip'] }}"
      ansible_port: "2222"
      ansible_user: "{{ student_name }}"
      ansible_password: "{{ student_password }}"

  - name: "{{ lab_base_aap_name }}-server2"
    inventory: "CTF Participant All Table Host"
    variables:
      ansible_host: "{{ hostvars['server2']['external_ip'] }}"
      ansible_port: "2222"
      ansible_user: "{{ student_name }}"
      ansible_password: "{{ student_password }}"

controller_projects:
  - name: "{{ lab_base_aap_name }}-project"
    description: "{{ lab_base_aap_name }}-project"
    organization: "{{ lab_base_aap_name }}-org"
    credential: "Verification Repo Cred"
    scm_type: git
    scm_url: "https://gitea-{{ ctf_leader_board_subdomain_base }}/ctfadmin/ansible-ctf-verification.git"
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'

  - name: "{{ lab_base_aap_name }} RHO CTF 2026"
    description: "{{ lab_base_aap_name }} RHO CTF 2026"
    organization: "{{ lab_base_aap_name }}-org"
    credential: "{{ lab_base_aap_name }} Repo Cred"
    scm_type: git
    scm_url: "https://gitea-{{ ctf_leader_board_subdomain_base }}/{{ lab_base_aap_name }}-user/ansible-ctf-challenges.git"
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    scm_update_on_launch: true
    wait: true

controller_templates:
  - name: "( {{ lab_base_aap_name }} ) AAP  - Verify Challenge 01"
    job_type: run
    inventory: "{{ lab_base_aap_name }}-inventory"
    project: "{{ lab_base_aap_name }}-project"
    playbook: "challenge-aap-01/verify.yml"
    allow_simultaneous: true
    limit: server2
    credentials:
