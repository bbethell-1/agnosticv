# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 47AD9F83-9DDF-42F0-9451-8B43344A4F6B
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
    execution_environment:
      # image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB5072: CTF Participant"
    category: Red_Hat_One_2026
    keywords:
      - ctf
      - Participant
      - lb5072
      - '2026'
      - rh1
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools/prod
      parameter_values:
        cluster_size: sno
        host_ocp4_installer_version: '4.18'
      # Propagate agnosticd_user_info data set by this component to variables.
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_console_url
          var: openshift_console_url
        - name: openshift_kubeadmin_password
          var: openshift_kubeadmin_password
