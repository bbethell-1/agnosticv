agnosticv_importdata:
  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_cluster_admin_token: "{{ openshift_cluster_admin_token }}"
  openshift_console_url: "{{ openshift_console_url }}"
  openshift_kubeadmin_user: kubeadmin
  openshift_kubeadmin_password: "{{ openshift_kubeadmin_password }}"
  openshift_admin_user: admin
  openshift_admin_password: "{{ common_admin_password  }}"
  server1_enternal_ip: "{{ hostvars['server1']['external_ip'] }}"
  server2_enternal_ip: "{{ hostvars['server2']['external_ip'] }}"

