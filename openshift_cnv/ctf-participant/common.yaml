controller_launch_jobs:
  - name: "Prepare RHEL servers"
    wait: true
    inventory: "{{ lab_base_aap_name }}-inventory"
    limit: server1

  - name: "Prepare OpenShift Virt"
    wait: true
    inventory: "{{ lab_base_aap_name }}-inventory"
    credentials:
      - "{{ lab_base_aap_name }} OpenShift Credential"
      - "CTF Participant Host"
    extra_vars:
      openshift_api_url: "{{ openshift_api_url }}"
      openshift_username: admin
      openshift_password: "{{ common_admin_password }}"
      bastion_host: "{{ openshift_cnv_ssh_address }}"
      bastion_user: "{{ student_name }}"
      bastion_password: "{{ common_password }}"
      bastion_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
      credentials_dir: /tmp/ctf-credentials

  - name: "Prepare OpenShift"
    wait: true
    inventory: "{{ lab_base_aap_name }}-inventory"
    credentials:
      - "{{ lab_base_aap_name }} OpenShift Credential"
      - "CTF Participant Host"

  - name: "Prepare Ansible servers"
    wait: true
    inventory: "{{ lab_base_aap_name }}-inventory"
    limit: server2

