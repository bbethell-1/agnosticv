---
# -------------------------------------------------------------------
# --- Catalog: ctf-participant
# --- Catalog Item: CTF Participant
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#includes/access-restriction-rh1-2026-devs.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
# ------------------------
# Subdomain configuration
# ------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"

# ------------------------
# Bastion public hostname
# (dynamically built from inventory)
# ------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"

# ------------------------
# Common password
# (auto-generated from GUID)
# ------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# ------------------------
# User configuration
# ------------------------
ansible_user: cloud-user
remote_user: cloud-user

# -------------------------------------------------------------------
# Instances to deploy
# -------------------------------------------------------------------
# ------------------------
# Instance Images
# ------------------------
bastion_instance_image: rhel-9.6
node_instance_image: rhel-10.0

bastion_rootfs_size: 100Gi
node_rootfs_size: 50Gi

openshift_cnv_legacy_routes: true
openshift_cnv_route_remove_x_frame_options_header: true

# ------------------------
# Instances (VMs)
# ------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ bastion_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
    routes:
      - name: bastion-443
        host: bastion
        service: bastion
        targetPort: 443
        tls: true

  - name: "server"
    count: 2
    unique: false
    public_dns: false
    floating_ip: false
    image: "{{ node_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ node_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-80
    routes:
      - name: node-80
        host: node
        service: node
        targetPort: 80
        tls: false

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/core_workloads.git
      type: git
      version: main
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: main
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - openshift_workload_deployer
  all:
    - host_satellite_repositories
    - host_common_packages
    - agnosticd.cloud_vm_workloads.control_user
    - rhpds.manage_host.asset_injector
  bastions:
    - bastion

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import

# -------------------------------------------------------------------
# Workload: openshift_workload_deployer
# -------------------------------------------------------------------
clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

openshift_workloads:
  - name: agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
    clusters:
      - default

ACTION: provision
openshift_workload_deployer_workloads: "{{ openshift_workloads }}"
openshift_workload_deployer_clusters: "{{ clusters }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
num_users: 1
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_user_password length=12 chars=ascii_letters,digits')
  }}

ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: "user"
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Call role host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false

bastion_host_packages:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - python3.11-pip
  - python3.11-kubernetes

node_host_packages:
  - skopeo
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget

# Extra packages set dynamically based on group membership
host_common_packages_extra: >-
  {{
      bastion_host_packages
    if 'bastions' in group_names
    else
      node_host_packages
  }}

# -------------------------------------------------------------------
# Workload: bastion
# -------------------------------------------------------------------
install_bastion: true
bastion_setup_student_user: true
bastion_student_user_name: lab-user
bastion_student_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: "{{ bastion_student_user_name }}"
student_password: "{{ bastion_student_user_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ bastion_student_user_password }}"
control_user_private_group: "{{ omit }}"
control_user_ssh_config: ./files/ssh_config.j2

# Disable control_user's user_data reporting (bastion role handles it)
control_user_enable_user_data: false

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.asset_injector
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    module: file
    state: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    module: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    module: service
    name: sshd
    state: restarted

  - description: Create SSH config for lab-user to easily SSH to nodes
    module: copy
    dest: /home/{{ bastion_student_user_name }}/.ssh/config
    owner: "{{ bastion_student_user_name }}"
    group: "{{ bastion_student_user_name }}"
    mode: "0600"
    content: |
      # SSH config for easy access to nodes
      Host *
          User {{ student_name }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          IdentityFile ~/.ssh/{{ guid }}.pem

  - description: Download oc client
    module: get_url
    src: "{{ openshift_client_download_url }}"
    dest: /tmp/
    owner: "{{ student_name }}"

  - description: Unarchive oc client
    module: unarchive
    src: /tmp/openshift-client-linux.tar.gz
    dest: /usr/bin
    remote_src: true

  - description: Openshift oc login
    become: true
    become_user: "{{ student_name }}"
    module: command
    cmd: "/usr/bin/oc login {{ openshift_api_url }} --token={{ openshift_cluster_admin_token }} --insecure-skip-tls-verify=true"

# Set asset_injector_assets based on group membership
asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names else
    []
  }}

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  ssh_command: >-
    ssh {{ student_name }}@{{ openshift_cnv_ssh_address }}
    -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_cluster_admin_token: "{{ openshift_cluster_admin_token }}"
  openshift_console_url: "{{ openshift_console_url }}"
  openshift_kubeadmin_user: kubeadmin
  openshift_kubeadmin_password: "{{ openshift_kubeadmin_password }}"
  openshift_admin_user: admin
  openshift_admin_password: "{{ common_admin_password  }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 47AD9F83-9DDF-42F0-9451-8B43344A4F6B
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivast@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
    execution_environment:
      # image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "CTF Participant"
    category: Brand_Events
    keywords:
      - ctf
      - Participant
      - lb5072
      - '2026'
      - rh1
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
    multiuser: false
    parameters: []
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools/prod
      parameter_values:
        cluster_size: sno
        host_ocp4_installer_version: '4.20'
        ols_enable: true
        ocp4_fips_enable: false
      # Propagate agnosticd_user_info data set by this component to variables.
      propagate_provision_data:
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_console_url
          var: openshift_console_url
        - name: openshift_kubeadmin_password
          var: openshift_kubeadmin_password
        - name: openshift_client_download_url
          var: openshift_client_download_url
        # Propagate bastion data for infra_add_bastion role
        # - name: bastion_public_hostname
        #   var: bastion_ansible_host
        # - name: bastion_ssh_user_name
        #   var: bastion_ansible_user
        # - name: bastion_ssh_password
        #   var: bastion_ansible_ssh_pass
        # - name: bastion_ssh_port
        #   var: bastion_ansible_port
