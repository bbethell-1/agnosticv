---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/mfosterrox/openshift-security-roadshow
showroom_git_ref: main

__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
  deployer:
    scm_ref: development
    scm_type: git

# -------------------------------------------------------------------
# ocp4_workload_gitops_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_import_repos:
  - name: rhdh
    repo:
      - name: trusted-application-pipeline-templates
        url: https://github.com/redhat-gpe/trusted-application-pipeline-templates.git
  - name: summit-lab
    repo:
      - name: backstage-workshop
        url: https://github.com/redhat-gpte-devopsautomation/backstage-workshop.git
  - name: gitops
    repo:
      - name: janus-idp-gitops
        url: https://github.com/redhat-gpte-devopsautomation/janus-idp-gitops.git
