---

#include /includes/secrets/litemaas-master_api.yaml

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main

requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # Our own workshop collection
  - name: https://github.com/rhpds/platform-engineering-workshop.git
    type: git
    version: dev
  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main
  # Showroom Collection
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "v1.4.0"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- rhdp.workshop.ocp4_workload_platform_engineering_workshop
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_platform_engineering_workshop
# -------------------------------------------------------------------
# Override Helm Chart branch/repo used for deployment in dev env
ocp4_workload_platform_engineering_workshop_gitops_repo: https://github.com/redhat-pe-workshop/ocp-pe-wkshp-helm-infra.git
ocp4_workload_platform_engineering_workshop_gitops_repo_tag: dev
# If argo apps don't sync/healthy, ignore the errors and continue with the deployment (DEV ONLY)
ocp4_workload_platform_engineering_workshop_wait_for_apps_ignore_errors: true

# -------------------------------------------------------------------
# Workload: rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models:
- nomic-embed-text-v1-5
- qwen3-14b
ocp4_workload_litellm_virtual_keys_duration: "3d"
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: true
ocp4_workload_litellm_virtual_keys_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-pe-workshop/showroom-roadshow-v2.git
ocp4_workload_showroom_content_git_repo_ref: main
# This is a noop with the new showroom workload
ocp4_workload_showroom_content_only: false
