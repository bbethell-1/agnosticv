---

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
  catalog:
    parameters:
    - name: ocp4_workload_platform_engineering_workshop_automation_repo
      description: "Ansible automation collection repository URL"
      formLabel: "Automation Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/platform-engineering-workshop.git
    - name: automation_tag
      description: "Ansible automation collection tag/branch"
      formLabel: "Automation Collection Ref"
      openAPIV3Schema:
        type: string
        default: dev
    - name: ocp4_workload_platform_engineering_workshop_gitops_repo
      description: "GitOps repository URL (Helm infra charts)"
      formLabel: "GitOps Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/redhat-pe-workshop/ocp-pe-wkshp-helm-infra.git
    - name: ocp4_workload_platform_engineering_workshop_gitops_repo_tag
      description: "GitOps Helm charts tag/branch"
      formLabel: "GitOps Ref"
      openAPIV3Schema:
        type: string
        default: dev
    - name: ocp4_workload_showroom_content_git_repo
      description: "Showroom content repository URL"
      formLabel: "Showroom Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/redhat-pe-workshop/showroom-roadshow-v2.git
    - name: ocp4_workload_showroom_content_git_repo_ref
      description: "Showroom content tag/branch"
      formLabel: "Showroom Content Ref"
      openAPIV3Schema:
        type: string
        default: main

requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # Our own workshop collection
  - name: "{{ ocp4_workload_platform_engineering_workshop_automation_repo }}"
    type: git
    version: "{{ automation_tag }}"
  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main
  # Showroom Collection
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "v1.7.1"

# -------------------------------------------------------------------
# Dev-only overrides
# -------------------------------------------------------------------
ocp4_workload_platform_engineering_workshop_gitops_repo_tag: dev
ocp4_workload_platform_engineering_workshop_wait_for_apps_ignore_errors: true
