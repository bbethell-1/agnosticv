# -------------------------------------------------------------------
# --- Catalog Item: Platform Engineering Workshops
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp-workloads
software_to_deploy: none
openshift_cluster_admin_service_account_enable: true
project_tag: "{{ env_type }}-{{ guid }}"
num_users: 1

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: multi

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_09_15

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_platform_engineering_workshop
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_platform_engineering_workshop
# -------------------------------------------------------------------
ocp4_workload_platform_engineering_workshop_noobaa_install: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_deployer_chart_version: 1.1.0
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-pe-workshop/showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true
ocp4_workload_showroom_namespace: showroom

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 48AA0811-D792-4C82-9074-7840F09CFB5D
  owners:
    maintainer:
    - name: Jaya Baskaran
      email: jaya@redhat.com
    - name: Evan Shortiss
      email: eshortis@redhat.com
    - name: Bernard Tison
      email: btison@redhat.com
    instructions:
    - name: Jaya Baskaran
      email: jaya@redhat.com
    - name: Evan Shortiss
      email: eshortis@redhat.com
    - name: Bernard Tison
      email: btison@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Platform Engineering Workshop (CNV Pooled)"
    category: Workshops
    multiuser: false
    keywords:
    - openshift
    - ocp
    labels:
      Product: Red_Hat_Advanced_Developer_Suite
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
    # - name: cluster_size
    #   description: cluster size
    #   formLabel: cluster size
    #   openAPIV3Schema:
    #     type: string
    #     default: sno
    #     enum:
    #     - 'sno'
    #     - 'multinode'
    #   components:
    #   - name: all

    # - name: ocp4_installer_version
    #   description: OpenShift version to install
    #   formLabel: OpenShift Version
    #   required: false
    #   openAPIV3Schema:
    #     type: string
    #     default: '4.19'
    #     enum:
    #     - '4.18'
    #     - '4.19'
    #   components:
    #   - name: all

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: openshift_cnv/ocp-cnv-pools/prod
    parameter_values:
      # Automatic cluster size selection based on user count
      cluster_size: sno
      ocp4_installer_version: 4.19
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-09-30
      pull: missing
