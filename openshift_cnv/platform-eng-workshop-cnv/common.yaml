# -------------------------------------------------------------------
# --- Catalog Item: Platform Engineering Roadshows (CNV)
#
# --- MIGRATED TO AGNOSTICDv2 ---
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"
current_cluster_name: default

# -------------------------------------------------------------------
# Collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/platform-engineering-workshop.git
    type: git
    version: main

# openshift_cluster_admin_service_account_enable: true
num_users: 1

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- rhdp.workshop.ocp4_workload_platform_engineering_workshop
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
# Generate user password
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_platform_engineering_workshop
# -------------------------------------------------------------------
ocp4_workload_platform_engineering_workshop_noobaa_install: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-pe-workshop/showroom-new-nookbag.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 48AA0811-D792-4C82-9074-7840F09CFB5D
  owners:
    maintainer:
    - name: Jaya Baskaran
      email: jaya@redhat.com
    - name: Evan Shortiss
      email: eshortis@redhat.com
    - name: Bernard Tison
      email: btison@redhat.com
    instructions:
    - name: Jaya Baskaran
      email: jaya@redhat.com
    - name: Evan Shortiss
      email: eshortis@redhat.com
    - name: Bernard Tison
      email: btison@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte

  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Platform Engineering Roadshow (CNV)"
    category: Workshops
    multiuser: false
    keywords:
    - platform engineering
    - rhdh
    - developer hub
    - rh1-2026
    - lb1551
    labels:
      Product: Red_Hat_Advanced_Developer_Suite
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Brand_Event: Red_Hat_One_2026
    parameters:
    - name: host_ocp4_installer_version
      description: Version of OpenShift to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.18'
        - '4.20'
      components:
      - name: all

  components:
  - name: openshift_base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: multinode
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
