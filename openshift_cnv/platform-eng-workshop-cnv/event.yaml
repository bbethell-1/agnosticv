---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/access-restriction-summit-devs.yaml
#include /includes/parameters/event-lifetime-runtime.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Collections for this environment - pin to release tags
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # Workshop Ansible collection
  - name: https://github.com/rhpds/platform-engineering-workshop.git
    type: git
    version: v2.0.0
  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: main
  # Showroom Collection
  - name: https://github.com/agnosticd/showroom.git
    type: git
    version: "v1.7.1"

# -------------------------------------------------------------------
# Workload: ocp4_workload_platform_engineering_workshop
# -------------------------------------------------------------------
ocp4_workload_platform_engineering_workshop_gitops_repo_tag: v1.1.0
ocp4_workload_platform_engineering_workshop_wait_for_apps_ignore_errors: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: v1.0.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  components:
  - name: openshift_base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/event
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.20"
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
