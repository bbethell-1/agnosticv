---
#include /includes/secrets/rhel_pull_token.yaml
#include /includes/secrets/zero-touch-library.yaml
###
ocp4_workload_showroom_namespace_wait_ready: 900

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: zerotouch
ocp4_workload_showroom_deployer_chart_version: "1.9.18"
ocp4_workload_showroom_content_image: quay.io/rhpds/showroom-content:v1.3.0
ocp4_workload_showroom_cloud_image: quay.io/rhpds/showroom-cloud:v1.1.3
openshift_cnv_route_remove_x_frame_options_header: true
ocp4_workload_showroom_terminal_enable: true
ocp4_workload_showroom_use_sandbox_domain: true
ocp4_workload_showroom_wetty_image: quay.io/rhpds/wetty:v2.5
ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.2/nookbag-v0.2.2.zip"
ssh_provision_key_type: "ed25519"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: zt-rhelbu
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
