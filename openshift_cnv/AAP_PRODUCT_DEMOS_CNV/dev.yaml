---
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

ocp4_installer_version: "4.13"

ocp4_workload_ansible_automation_platform_manifest.username: admin
ocp4_workload_ansible_automation_platform_manifest.password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest.url: "{{ controller_manifest }}"

requirements_content:
  collections:
    - name: amazon.aws
      version: ">=8.2.0"
    - name: ansible.posix
      version: ">=1.6.0"
    - name: ansible.utils
      version: ">=5.1.0"
    - name: awx.awx
      version: ">=24.6.0"
    - name: community.general
      version: ">=9.5.0"
    - name: infra.controller_configuration
      version: ">=2.11.0"
    - name: kubernetes.core
      version: ">=5.0.0"
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.1
    - name: kubevirt.core
      version: ">=2.1.0"

project_scm_branch: main

controller_projects:
  - name: Demo Project
    organization: Default
    scm_type: git
    scm_url: https://github.com/RedHatGov/ansible-tower-samples
    scm_branch: "{{ project_scm_branch }}"
    wait: true

controller_templates:
  - name: Demo Job Template
    job_type: run
    inventory: Demo Inventory
    project: Demo Project
    playbook: install_product_demos.yml
    credentials: Controller Credential

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_ref: aap-product-demos-cnv-1.1.1
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    parameters:
      - name: ocp4_workload_ansible_automation_platform_subscription_channel
        description: AAP operator subscription channel
        formLabel: AAP operator subscription channel
        openAPIV3Schema:
          type: string
          default: stable-2.4
          enum:
            - stable-2.4
            - stable-2.5
