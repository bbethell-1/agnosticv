---
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

ocp4_installer_version: "4.13"

ocp4_workload_ansible_automation_platform_manifest.username: admin
ocp4_workload_ansible_automation_platform_manifest.password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest.url: "{{ controller_manifest }}"

# disable initial demo job template run
controller_launch_jobs: []

requirements_content:
  collections:
    - name: amazon.aws
      version: 8.2.0
    - name: ansible.posix
      version: 1.6.0
    - name: ansible.utils
      version: 5.1.0
    - name: awx.awx
      version: 24.6.0
    - name: community.general
      version: 9.5.0
    - name: infra.controller_configuration
      version: 2.11.0
    - name: kubernetes.core
      version: 5.0.0
    - name: https://github.com/rhpds/assisted_installer.git
      type: git
      version: v0.0.1
    - name: kubevirt.core
      version: 2.1.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_url: https://github.com/l3acon/agnosticd.git
    scm_ref: aap25-updates
    execution_environment:
      image: quay.io/ansible-product-demos/apd-ee-25:20241028
      pull: missing
  catalog:
    parameters:
      - name: ocp4_workload_ansible_automation_platform_subscription_channel
        description: AAP operator subscription channel
        formLabel: AAP operator subscription channel
        openAPIV3Schema:
          type: string
          default: stable-2.4
          enum:
            - stable-2.4
            - stable-2.5
