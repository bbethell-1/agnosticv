---
#include /includes/ee-multicloud-dev.yaml
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

ocp4_installer_version: "4.15"

ocp4_workload_ansible_automation_platform_manifest.username: admin
ocp4_workload_ansible_automation_platform_manifest.password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest.url: "{{ controller_manifest }}"

__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
  deployer:
    scm_ref: development
  components:
  - name: aws_sandbox
    display_name: AWS Credentials
    item: sandboxes-gpte/SANDBOX_OPEN
    propagate_provision_data:
    - var: aws_credentials
  - name: vmw_sandbox
    display_name: VMWare Credentials
    item: vmware-ibm/SANDBOX_VMWARE
    propagate_provision_data:
    - var: vmw_credentials
