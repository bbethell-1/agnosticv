---
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

ocp4_installer_version: "4.13"

ocp4_workload_ansible_automation_platform_manifest.username: admin
ocp4_workload_ansible_automation_platform_manifest.password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest.url: "{{ controller_manifest }}"

# disable initial demo job template run
controller_launch_jobs: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    parameters:
      - name: ocp4_workload_ansible_automation_platform_subscription_channel
        description: AAP operator subscription channel
        formLabel: AAP operator subscription channel
        openAPIV3Schema:
          type: string
          default: stable-2.4
          enum:
            - stable-2.4
            - stable-2.5
