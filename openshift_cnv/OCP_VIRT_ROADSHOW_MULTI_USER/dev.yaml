  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    annotations:
      test: "agonzalez"
    cloud_selector:
      cloud: cnv
      # name: "{{ job_vars.ocpv_cluster }}"
      purpose: "prod"
      virt: "yes"
    quota:
      limits.cpu: "128"
      requests.cpu: "128"
      limits.memory: "800Gi"
      requests.memory: "800Gi"
