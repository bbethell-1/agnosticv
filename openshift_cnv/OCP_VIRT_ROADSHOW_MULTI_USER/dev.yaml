purpose: dev
ocp4_workload_virt_roadshow_vms_imported_configure_svc_and_route: false
ocp4_installer_version: '4.18'
ocp4_workload_mtv_channel: release-v2.8
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_oadp_gitops
- ocp4_workload_nmstate
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware
- ocp4_workload_virt_roadshow_multi_user
- ocp4_workload_virt_network_config
- ocp4_workload_showroom
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_boot_sources_shapshot: false
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv03
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpv08
        - ocpvdev01
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    annotations:
      test: agonzalez
    cloud_selector:
      cloud: cnv
      name: '{{ job_vars.ocpv_cluster }}'
      virt: 'yes'
    quota:
      limits.cpu: '128'
      requests.cpu: '128'
      limits.memory: 400Gi
      requests.memory: 400Gi
