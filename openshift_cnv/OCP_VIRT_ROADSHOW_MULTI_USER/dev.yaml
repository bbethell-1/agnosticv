---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/secrets/openshift_assisted_installer_icr.yaml

ocp4_installer_version: "4.18"
odf_channel: stable-4.17
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_mtv_channel: release-v2.7
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_workers_cores: 16

ai_attach_workers_networks:
- default/flatnetwork

networks:
- name: cluster

ai_install_use_network: "cluster{{ guid }}"
bastion_extra_networks:
- "cluster"

infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_oadp_gitops
- ocp4_workload_nmstate
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware
- ocp4_workload_virt_roadshow_multi_user
- ocp4_workload_virt_network_config
- ocp4_workload_showroom

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"

# -------------------------------------------------------------------
# ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: true
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"
#ocp4_workload_virt_network_config_bridge_type: linux-bridge
#ocp4_workload_virt_network_config_bridge_name: br-flat

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: ocp4-cnv-network
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv03
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpvdev01
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: "{{ job_vars.ocpv_cluster }}"
      virt: "yes"
    quota:
      limits.cpu: "128"
      requests.cpu: "128"
      limits.memory: "400Gi"
      requests.memory: "400Gi"
