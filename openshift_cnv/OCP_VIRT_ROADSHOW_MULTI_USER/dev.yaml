---
purpose: dev

# ocp4_workload_virt_roadshow_vms_imported_configure_svc_and_route: false

ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false
ocp4_workload_oadp_gitops_channel: stable

ocp4_installer_version: "4.21.1"
odf_channel: stable-4.20

ocp4_workload_kubevirt_starting_csv: "kubevirt-hyperconverged-operator.v4.21.0"
ocp4_workload_mtv_channel: release-v2.10
ocp4_workload_mtv_starting_csv: "mtv-operator.v2.10.5"
ocp4_workload_cert_manager_channel: stable-v1

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  # catalog:
  #   parameters:
  #   - name: ocpv_cluster
