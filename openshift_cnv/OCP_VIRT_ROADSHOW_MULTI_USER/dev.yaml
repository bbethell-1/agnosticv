---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/secrets/openshift_assisted_installer_icr.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware variables
# -------------------------------------------------------------------

ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv04
          enum:
            - ocpv01
            - ocpv02
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        hcp: "no"
        virt: "yes"
