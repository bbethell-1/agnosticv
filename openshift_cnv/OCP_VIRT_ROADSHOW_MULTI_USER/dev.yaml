# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/secrets/ocp4_token_icr.yaml
ocp4_ai_pull_secret: "{{ ocp4_pull_secret }}"

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: vmware_new_approach
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      # DEV CNV Cluster doesn't seem to work with storage... deploy to prod.
      #purpose: dev
      purpose: prod
      virt: "yes"
