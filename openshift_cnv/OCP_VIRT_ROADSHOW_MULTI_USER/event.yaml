---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    parameters:
      - name: ocp4_workload_showroom_content_git_repo
        description: Showroom git repo
        formLabel: Showroom git repo
        openAPIV3Schema:
          type: string
          default: 'https://github.com/rhpds/openshift-virt-roadshow-cnv-multi-user'
      - name: ocp4_workload_showroom_content_git_repo_ref
        description: Showroom git branch or tag
        formLabel: Showroom git branch or tag
        openAPIV3Schema:
          type: string
          default: 'v1.0.1'
  deployer:
    scm_ref: cnv-virt-roadshow-multi-2.0.6
  sandboxes:
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
