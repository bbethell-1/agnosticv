#include /includes/secrets/vmware-ibm-rs00-access.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.16"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.3
bastion_cores: 2
bastion_memory: 6Gi

worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"

ai_control_plane_cores: >-
  {{ 8 if worker_instance_count|int <= 10
  else 16 if worker_instance_count|int <= 20
  else 32
  }}
ai_control_plane_memory: >-
  {{ '16Gi' if worker_instance_count|int <= 10
  else '32Gi' if worker_instance_count|int <= 20
  else '64Gi'
  }}

ai_workers_cores: 16
ai_workers_memory: "32Gi" # Maybe calculate later

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_external_odf
- ocp4-workload-nfs-provisioner
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_minio
- ocp4_workload_oadp_gitops
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware
- ocp4_workload_virt_roadshow_multi_user
- ocp4_workload_showroom

# Open questions:
# - Network.
#   E.g. https://github.com/redhat-cop/agnosticd/blob/move_virt_to_ibm/ansible/configs/experience-ocpvirt/files/configure_nodenetworkconfigurationpolicy.sh
# - AAP install and configuration (https://issues.redhat.com/browse/GPTEINFRA-9388)

# --- Workloads that have removal logic implemented that needs to be run (YAML List)
remove_workloads:
- ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.16

# -------------------------------------------------------------------
# Workload: ocp4-workload-nfs-provisioner
# -------------------------------------------------------------------
nfs_provisioner_nfs_server_hostname: "{{ openshift_cnv_nfs_server }}"
nfs_provisioner_server_directory: "{{ openshift_cnv_nfs_path }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_channel: stable-v1.14
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_cloud_provider: ec2
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
# Use PVCs for KubeVirt boot images
ocp4_workload_kubevirt_boot_sources_shapshot: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.13
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_update_route_tls: false
ocp4_workload_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

# -------------------------------------------------------------------
# Workload: ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.6

# necessary for multi-user:
ocp4_workload_mtv_max_vm_inflight: 20
ocp4_workload_mtv_forklift_controller_container_limits_cpu: "2000m"
ocp4_workload_mtv_forklift_controller_container_limits_memory: "8000Mi"

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: false
ocp4_workload_minio_root_user: minio-admin
ocp4_workload_minio_root_password: minio-password
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-07-16T23-46-41Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_multi_user: true
ocp4_workload_minio_bucket_base: s3-
ocp4_workload_minio_bucket_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_minio_bucket_userbase: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

# -------------------------------------------------------------------
# ocp4_workload_oadp_gitops
# -------------------------------------------------------------------
ocp4_workload_oadp_gitops_channel: stable-1.4
ocp4_workload_oadp_gitops_use_catalog_snapshot: false

# Multi User
ocp4_workload_oadp_gitops_multi_user: true
ocp4_workload_oadp_gitops_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_oadp_gitops_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_oadp_gitops_namespace_base: oadp
ocp4_workload_oadp_gitops_configure_dpa: true
ocp4_workload_oadp_gitops_storage: minio
ocp4_workload_oadp_gitops_storage_minio_user: minio-admin
ocp4_workload_oadp_gitops_storage_minio_password: minio-password
ocp4_workload_oadp_gitops_storage_minio_name: minio
ocp4_workload_oadp_gitops_storage_minio_namespace: minio
ocp4_workload_oadp_gitops_storage_minio_bucket_name_base: s3-

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vms
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vms_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_virt_roadshow_vms_base_namespace: vmimported-
ocp4_workload_virt_roadshow_vms_userbase: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_virt_roadshow_vms_start_vms: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_roadshow_vmware
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vmware_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_virt_roadshow_vmware_enable_mtv: true
ocp4_workload_virt_roadshow_vmware_enable_cert_validation: false

# For multiple users
ocp4_workload_virt_roadshow_vmware_vcenter_folder_base: "ocpvirt-{{ guid }}-{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_virt_roadshow_vmware_vcenter_user_base: "ocpvirt-{{ guid }}-{{ ocp4_workload_authentication_htpasswd_user_base }}"

# User base for OCP Authentication (to assign vCenter users to OCP users in agnosticd_user_info)
ocp4_workload_virt_roadshow_auth_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

# MTV Namespace base to use for multi user.
# For single user the namespace is always `openshift-mtv`
ocp4_workload_virt_roadshow_vmware_mtv_namespace_base: "mtv-{{ ocp4_workload_virt_roadshow_auth_user_base }}"
ocp4_workload_virt_roadshow_vsphere_ignore_pip_check: false

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_multi_user
# -------------------------------------------------------------------
# In the future once bug https://issues.redhat.com/browse/CNV-38284 is in the product
# the namespace will need to change to openshift-cnv
ocp4_workload_virt_roadshow_multi_user_configmap_namespace: default

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-virt-roadshow-cnv-multi-user
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3552c70c-2ffc-4dec-82be-045297c830c5
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-08-08
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  catalog:
    display_name: Experience OpenShift Virtualization Roadshow (CNV/Multi-User)
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    workshopLabUiRedirect: true
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 1
        maximum: 40
      validation: >-
        num_users <= 2 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than TWO requires a valid SalesForceID')
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp416
    - cnv
    - cnvocp
    - ocpcnv
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  tower:
    timeout: 21600
