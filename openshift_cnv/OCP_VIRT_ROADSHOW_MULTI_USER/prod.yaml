---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware variables
# -------------------------------------------------------------------

ocp4_workload_virt_roadshow_vmware_use_pool: true
ocp4_workload_virt_roadshow_vmware_vddk_registry: "icr.io/rhdp/vddk:latest"
ocp4_workload_kubevirt_automatic_install_plan_approval: false
ocp4_workload_kubevirt_starting_csv: kubevirt-hyperconverged-operator.v4.18.8

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: cnv-virt-roadshow-multi-2.0.6
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
