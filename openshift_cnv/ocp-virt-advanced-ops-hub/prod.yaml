---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: prod

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  deployer:
    scm_ref: ocp-virt-advanced-ops-1.0.5
