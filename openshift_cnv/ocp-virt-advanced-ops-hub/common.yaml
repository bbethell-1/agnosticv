# -------------------------------------------------------------------
# --- Catalog Item:
#            Experience OpenShift Virtualization:
#             Advanced Operations and Automation
#                     Shared RHACM Hub
# -------------------------------------------------------------------
#
# -------------------------------------------------------------------
# Overview
# -------------------------------------------------------------------
#
# This is an OpenShift Virt BU initiative.
#
# This is a multi-tenant shared RHACM hub that each participant will
# log in to in order to adopt and control their "production cluster"
# Production cluster:  ocp-virt-adv-ops/common.yaml
#
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3
worker_instance_count: 3

ai_control_plane_cores: 32
ai_control_plane_memory: 32Gi

ai_workers_cores: 24
# Lab needs 3x32Gi memory
ai_workers_memory: 48Gi

ai_service_network_cidr: "172.231.0.0/16"
ai_cluster_network_cidr: "10.232.0.0/14"
# ai_network_mtu: 8900

ai_workers_extra_disks:
- metadata:
    name: "extradiskINSTANCENAME"
  spec:
    source:
      blank: {}
    pvc:
      accessModes:
      - ReadWriteMany
      volumeMode: Block
      resources:
        requests:
          storage: "20Gi"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18.22"

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: user
ocp4_workload_multi_user: false

common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_user_password length=12 chars=ascii_letters,digits')
  }}

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_05_05

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
# required for ansible_automation_platform_configuration oc login
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
# ocp4_workload_cert_manager_starting_csv: cert-manager-operator.v1.15.0
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: "release-2.14"
#ocp4_workload_rhacm_acm_starting_csv: ""

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp-virt-advanced-ops-hub-gitops.git
#ocp4_workload_gitops_bootstrap_repo_revision: v1.0.1 <-- This is summit2025 tag
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
  applications:
    rhacm_config:
      enabled: true

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
# FORKED: ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpte-devopsautomation/virt-aap-day2-showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-virt-advanced-ops-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.2
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 20625d15-beab-4887-a99a-72642f56abe2
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Experience OpenShift Virtualization: Advanced Operations and Automation - Shared RHACM HUB"
    category: Workshops
    multiuser: true
    keywords:
    - day2
    - virt
    - aap
    - ocp
    - virtualization
    - ops
    - advanced
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    reportingLabels:
      assetGroup: Virtualization
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 1
        maximum: 40
  tower:
    timeout: 14400
  owners:
    maintainer:
    - name: Judd Maltin
      email: judd@redhat.com
    sme:
    - name: Judd Maltin
      email: judd@redhat.com
    - name: Alan Cowles
      email: acowles@redhat.com
    - name: Mark Schmitt
      email: mschmitt@redhat.com
    instructions:
    - name: Alan Cowles
      email: acowles@redhat.com
    - name: Mark Schmitt
      email: mschmitt@redhat.com
