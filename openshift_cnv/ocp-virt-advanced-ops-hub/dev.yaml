---
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/runtime-unlimited.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6

install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# OpenShift
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.22"

worker_instance_count: 3

ai_workers_cores: 24
ai_control_plane_memory: 48Gi

infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}
# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Development variables
# -------------------------------------------------------------------
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_rhacm_use_catalog_snapshot: false

ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_rhacm_acm_channel: "release-2.14"

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
  applications:
    rhacm_config:
      enabled: true

# # -------------------------------------------------------------------
# # Workload: ocp4_workload_rhacm_cloud_credentials
# # -------------------------------------------------------------------
# ocp4_workload_rhacm_cloud_credentials_kubevirt: true
# ocp4_workload_rhacm_cloud_credentials_install_hcp_cli: true
#
# ocp4_pull_secret: "{{ ocp4_ai_pull_secret }}"

# hcp_etcd_storage_class: "hostpath-csi"
# hcp_disable_storage_class: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  access_control:
    allow_groups:
    - rhpds-devs-virt
