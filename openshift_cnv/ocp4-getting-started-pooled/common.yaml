---
#include /includes/catalog-icon-openshift.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# Agnosticd variables
env_type: ocp-workloads
cloud_provider: multi
software_to_deploy: none

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_rhsso_authentication
- ocp4_workload_pipelines
- ocp4_workload_gitea_operator
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ (num_users | default('2')) | int }}"
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_07_01

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_use_catalog_source: true
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.11-opr-006

ocp4_workload_rhsso_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_rhsso_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_rhsso_authentication_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_rhsso_authentication_user_name_base: "{{ ocp4_workload_user_base}}"
ocp4_workload_rhsso_authentication_user_password: "{{ common_user_password }}"

# ---------------------------------------------------------
# ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.18.1
ocp4_workload_pipelines_install_tkn_cli: false

# -------------------------------------------------------------------
# ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_starting_csv: gitea-operator.v2.1.0

ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.23.8"
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel9/postgresql-13
ocp4_workload_gitea_operator_postgresql_image_tag: 9.6-1749632716

ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_user_count }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_user_base + '%d' }}"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/openshift-roadshow/nationalparks
  name: nationalparks
  private: false
- repo: https://github.com/openshift-roadshow/nationalparks-py
  name: nationalparks-py
  private: false
- repo: https://github.com/openshift-roadshow/nationalparks-dotnet
  name: nationalparks-dotnet
  private: false
- repo: https://github.com/openshift-roadshow/nationalparks-js
  name: nationalparks-js
  private: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_gitops_starting_csv: openshift-gitops-operator.v1.16.1

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_install_cli: false

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-getting-started-gitops
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ ocp4_workload_user_count }}"
    prefix: "{{ ocp4_workload_user_base }}"
  workspace:
    git:
      revision: v1.0.0

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp4-getting-started-showroom
ocp4_workload_showroom_content_git_repo_ref: v1.0.1
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2025-07-29

__meta__:
  asset_uuid: 11c60af8-1ae5-4e86-bb11-6614b4b0e86e
  owners:
    maintainer:
    - name: Prakhar Srivastava
      email: prakhar@redhat.com
    sme:
    - name: Prakhar Srivastava
      email: prakhar@redhat.com
  anarchy:
    namespace: babylon-anarchy-test

  catalog:
    display_name: "OCP Pool Test: Getting started"
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Provider: RHDP
    parameters:
    - name: cluster_size
      description: >-
        Cluster size configuration that determines the number of control plane and worker nodes.
        Small (default): 1 control plane, 0 workers (Single Node OpenShift).
        Medium: 3 control planes, 4 workers.
        Large: 3 control planes, 8 workers.
      formLabel: Cluster Size
      openAPIV3Schema:
        type: string
        default: small
        enum:
        - small
        - medium
        - large
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.19'
        enum:
        - '4.18'
        - '4.19'
      # Parameter for openshift cluster
      components:
      - name: openshift

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: openshift_cnv/ocp-cnv-pools/dev
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
