# ===================================================================
# Mandatory Variables
# ===================================================================
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# Autoscaling cluster
# -------------------------------------------------------------------
# Only scale for more than 3 users
openshift_cnv_scale_cluster: true
ai_workers_cores: 32
ai_workers_memory: 64Gi
worker_instance_count: 4

# -------------------------------------------------------------------
# Cluster network MTU
# -------------------------------------------------------------------
# These clusters run on jumbo-frame NICs (physical MTU 8900). Without an
# explicit setting, OVN-Kubernetes defaults to a 1400 pod MTU, which causes
# TCP PMTUD failure inside the Geneve tunnel: large transfers (Maven
# downloads, container image pulls) stall and DevSpaces / Tekton builds
# hang. Setting the cluster network MTU to 8900 lets OVN derive the correct
# 8800 pod MTU (8900 - 100 Geneve overhead). Ref: RH Solution 7136819.
ai_network_mtu: 8900

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main

requirements_content:
  collections:
  # Assisted Installer Collection
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9

  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "1.0.0"

  # Lab specific collection
  - name: https://github.com/rhpds/ocp-dev-days-rdshw-automation
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.8

  # FTL (for E2E testing)
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: "{{ tag }}"

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- rhpds.ocp_dev_days_rdshw.ocp4_workload_dev_days_rdshw_cluster_bootstrap

