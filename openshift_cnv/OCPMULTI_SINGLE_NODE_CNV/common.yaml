---
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

#include /includes/sandbox-api.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS


# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

#ocp4_installer_version: "4.15.0"

ocp4_installer_use_dev_preview: false
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------

ai_control_plane_cores: 16
ai_control_plane_memory: 64Gi
bastion_instance_image: rhel-9.1

# -------------------------------------------------------------------
# Number of VMs
# -------------------------------------------------------------------
master_instance_count: 1
worker_instance_count: 0

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: ""
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
# - ocp4_workload_le_certificates
  - ocp4_workload_cert_manager
  - ocp4_workload_external_odf

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
#odf_channel: "stable-4.15"
#odf_channel: "stable-{{ ocp4_installer_version }}" - to set just to same version as ocp installer

odf_channel: "{{ 'stable-4.14' if ocp4_installer_version == '4.15' else 'stable-4.15' if ocp4_installer_version == '4.16' else 'stable-' + ocp4_installer_version }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: ""
# Create 1 user
ocp4_workload_authentication_htpasswd_user_count: 5
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_cloud_provider: ec2
# ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false


# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3cf50933-ac2f-446f-9e59-53291a9740z9
  owners:
    maintainer:
      - name: Alberto Gonzalez Rodriguez
        email: josegonz@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Single Node Cluster
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - ocp4
      - ocp414
      - ocp415
      - cnv
      - cnvocp
      - ocpcnv
      - ocpsingle
      - ocp4single
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: ai_control_plane_cores
        description: OpenShift node cores
        formLabel: OpenShift node cores
        openAPIV3Schema:
          type: integer
          default: 16
          enum:
            - 16
            - 24
            - 32
      - name: ai_control_plane_memory
        description: OpenShift node memory size
        formLabel: OpenShift node memory size
        openAPIV3Schema:
          type: string
          default: 32Gi
          enum:
            - 32Gi
            - 64Gi
      - name: ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.18'
          enum:
            - '4.15'
            - '4.16'
            - '4.17'
            - '4.18'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version
