---
#include /includes/secrets/gcp-cert-mgr.yaml

ocp4_workload_cert_manager_provider_fallback: ""
ocp4_workload_cert_manager_acme_url_fallback: ""

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
infra_workloads:
  - ocp4_workload_authentication
# - ocp4_workload_le_certificates
#  - ocp4_workload_cert_manager
  - ocp4_workload_external_odf

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv10
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpv08
            - ocpvdev01
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
#    - kind: DNSSandbox
#      cloud_selector:
#        purpose: "dev"
