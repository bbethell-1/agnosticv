---
#include /includes/catalog-icon-project-dance.yaml

#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml

#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml
#include /includes/secrets/registry-redhat.yaml

# -------------------------------------------------------------------
# --- Catalog Item: ETX RHADS (Red Hat Advanced Developer Suite)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
env_type: multi-cloud-base-infra
cloud_provider: openshift_cnv
software_to_deploy: none

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user
student_name: lab-user

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
rhel_instance_image: rhel-10.0
rootfs_size_rhel: 50Gi
pv_size_node: 8Gi
openshift_cnv_legacy_routes: true
showroom_tls_provider: none
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-https
        host: "bastion"
        legacy: false
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: Edge
      - name: rhtpa-80
        host: rhtpa
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: rhtas-http
        host: rhtas
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: cli-server-http
        host: cli-server
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: fulcio-80
        host: fulcio
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: rekor-80
        host: rekor
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: rekor-search-80
        host: rekor-search
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: tsa-80
        host: tsa
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: tuf-80
        host: tuf
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
      - name: rhbk-80
        host: rhbk
        service: bastion
        targetPort: 80
        tls: false
        path: "/.well-known/"
  - name: "rhtas"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 8G
    cores: 2
    image_size: 10Gi
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: rhtas-443
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: rhtas-443
    routes:
      - name: rhtas-443
        host: rhtas
        service: rhtas-443
        targetPort: 443
        tls: true

      - name: cli-server
        host: cli-server
        service: rhtas-443
        targetPort: 443
        tls: true

      - name: fulcio-443
        host: fulcio
        service: rhtas-443
        targetPort: 443
        tls: true

      - name: rekor-443
        host: rekor
        service: rhtas-443
        targetPort: 443
        tls: true

      - name: rekor-search-443
        host: rekor-search
        service: rhtas-443
        targetPort: 443
        tls: true

      - name: tsa-443
        host: tsa
        service: rhtas-443
        targetPort: 443
        tls: true

      - name: tuf-443
        host: tuf
        service: rhtas-443
        targetPort: 443
        tls: true

  - name: "rhtpa"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 48G
    cores: 24
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: rhtpa-443
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: rhtpa-443
    routes:
      - name: rhtpa-443
        host: rhtpa
        service: rhtpa-443
        targetPort: 443
        tls: true

  - name: "utility"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 16G
    cores: 4
    image_size: 50Gi
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
    services:
      - name: utility-443
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: utility-443
      - name: utility-8080
        ports:
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: utility-8080
      - name: utility-8443
        ports:
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: utility-8443
      - name: utility-5432
        ports:
          - port: 5432
            protocol: TCP
            targetPort: 5432
            name: utility-5432
    routes:
      - name: utility-443
        host: utility
        service: utility-443
        targetPort: 443
        tls: true
      - name: utility-8080
        host: utility-alt
        service: utility-8080
        targetPort: 8080
        tls: false
      - name: rhbk-443
        host: rhbk
        service: utility-443
        targetPort: 443
        tls: true

# -------------------------------------------------------------------
# Common Packages for RHEL 10 nodes
# -------------------------------------------------------------------
common_packages_el10:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - golang
  - docker
  - kubectl
  - helm
  - oc

# -------------------------------------------------------------------
# Network Configuration
# -------------------------------------------------------------------
network_config:
  bastion_ports:
    - 22
    - 443
    - 80
  node_ports:
    - 443
    - 8080
    - 9090

# -------------------------------------------------------------------
# Storage Configuration
# -------------------------------------------------------------------
storage_config:
  default_storage_class: "{{ storage_class | default('local-storage') }}"
  persistent_volumes: true
  backup_enabled: true

# -------------------------------------------------------------------
# Security Configuration
# -------------------------------------------------------------------
security_config:
  tls_enabled: true
  certificate_authority: "{{ ca_cert | default('self-signed') }}"
  firewall_rules:
    - port: 443
      protocol: tcp
      source: "0.0.0.0/0"
    - port: 22
      protocol: tcp
      source: "0.0.0.0/0"

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/rhads.rhel.git
      type: git
      version: 1.0.0

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - create_ssh_provision_key
  all:
    - set_env_authorized_key
    - set-repositories
    - bastion-student-user
  bastions:
    - common
    - bastion-base
    - user-create-ansible-service-account
    - asset_injector
    - rhads.rhel.certbot
    - rhads.rhel.execution_environment

post_software_workloads:
  servers:
    - rhads.rhel.utility

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: rhads.rhel.certbot
# -------------------------------------------------------------------
rhads_rhel_certbot_certificates:
  -
    - rhtpa.{{ guid }}.{{ sandbox_openshift_apps_domain }}
  -
    - rhbk.{{ guid }}.{{ sandbox_openshift_apps_domain }}
  -
    - rhtas.{{ guid }}.{{ sandbox_openshift_apps_domain }}
    - cli-server.{{ guid }}.{{ sandbox_openshift_apps_domain }}
    - fulcio.{{ guid }}.{{ sandbox_openshift_apps_domain }}
    - rekor.{{ guid }}.{{ sandbox_openshift_apps_domain }}
    - rekor-search.{{ guid }}.{{ sandbox_openshift_apps_domain }}
    - tsa.{{ guid }}.{{ sandbox_openshift_apps_domain }}
    - tuf.{{ guid }}.{{ sandbox_openshift_apps_domain }}

# -------------------------------------------------------------------
# Role: rhads.rhel.utility
# -------------------------------------------------------------------
utility_rhbk_src_pem_cert: "/tmp/rhbk.{{ guid }}.{{ sandbox_openshift_apps_domain }}fullchain.pem"
utility_rhbk_src_pem_key: "/tmp/rhbk.{{ guid }}.{{ sandbox_openshift_apps_domain }}privkey.pem"
utility_base_hostname: "{{ guid }}.{{ sandbox_openshift_apps_domain }}"

utility_rhbk_admin_user: admin
utility_rhbk_admin_password: "{{ common_password }}"
utility_rhbk_setup_rhtas_user1_username: chris
utility_rhbk_setup_rhtas_user1_password: "{{ common_password }}"
utility_rhbk_setup_rhtas_user2_username: mary
utility_rhbk_setup_rhtas_user2_password: "{{ common_password }}"
utility_rhbk_setup_rhpta_password: "{{ common_password }}"
utility_rhbk_setup_rhpta_client_cli_secret: "{{ common_password }}"
utility_rhbk_setup_rhpta_client_testing_manager_secret: "{{ common_password }}"
utility_rhbk_setup_rhpta_client_testing_user_secret: "{{ common_password }}"
utility_rhbk_quadlet_postgresql_rhtas_password: "{{ common_password }}"
utility_rhbk_quadlet_postgresql_rhtas_admin_password: "{{ common_password }}"
utility_rhbk_quadlet_postgresql_rhtpa_admin_password: "{{ common_password }}"
utility_rhbk_quadlet_postgresql_rhbk_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: set_env_authorized_key
# -------------------------------------------------------------------
set_env_authorized_key: true
env_authorized_key: "{{ guid }}key"
ansible_ssh_private_key_file: ~/.ssh/{{ env_authorized_key }}.pem
ansible_service_account_user_ssh_config: ssh_config.j2

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_password: "{{ common_password }}"

agd_install_bastion_base: true
agd_install_common: true
agd_bastion_packages:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc
  - ansible
  - ansible-navigator

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------
ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: rhads.rhel.execution_environment
# -------------------------------------------------------------------
# rhads_rhel_execution_environment_image_name: "quay.io/agnosticd/ee-ubi9-aap2.5"
# rhads_rhel_execution_environment_image_tag: "2.1.0"
rhads_rhel_execution_environment_image_name: "quay.io/agnosticd/ee-multicloud-custom"
rhads_rhel_execution_environment_image_tag: "andrew.0.1"

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  base_hostname: "{{ utility_base_hostname }}"
  rhbk_admin_username: "{{ utility_rhbk_admin_user }}"
  rhbk_admin_password: "{{ utility_rhbk_admin_password }}"
  rhtas_user: "{{ utility_rhbk_admin_user }}"
  rhtas_user_password: "{{ utility_rhbk_admin_password }}"
  rhtas_user1_username: "{{ utility_rhbk_setup_rhtas_user1_username }}"
  rhtas_user1_password: "{{ utility_rhbk_setup_rhtas_user1_password }}"
  rhtas_user2_username: "{{ utility_rhbk_setup_rhtas_user2_username }}"
  rhtas_user2_password: "{{ utility_rhbk_setup_rhtas_user2_password }}"
  common_password: "{{ common_password }}"
  tpa_single_node_pg_admin: postgres
  tpa_single_node_pg_admin_passwd: "{{ common_password }}"
  tpa_single_node_pg_user: rhtpa
  tpa_single_node_pg_user_passwd: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
# showroom_git_repo: "https://github.com/rhpds/showroom-rhaiis-rhel-demo"
showroom_git_repo: "https://github.com/redhat-ads-tech/rhads-enablement-l3-rhel"
showroom_git_ref: main
showroom_user: showroom
showroom_ui: default
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_tab_services:
  - double_tty

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"
showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_host: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"
showroom_ssh_username: "{{ student_name }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 62db517a-87e0-4116-97f2-f7d63ae3f91d
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      # image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      # image: quay.io/agnosticd/ee-multicloud-custom:andrew.0.1
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: multi-cloud-base-infra
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Product Enablement: Red Hat Advanced Developer Suite on RHEL (TL3)"
    category: Labs
    multiuser: false
    keywords:
      - ads
      - rhads
    labels:
      Provider: RHDP
      Product: Red_Hat_Advanced_Developer_Suite
      Product_Family: Red_Hat_Application_Services
      Sales_Play: Accelerate_New_App_Dev
    reportingLabels:
      primaryBU: Hybrid_Platforms
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com
    sme:
      - name: Andrew Block
        email: ablock@redhat.com
    instructions:
      - name: Andrew Block
        email: ablock@redhat.com
