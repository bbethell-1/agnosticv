---

# -------------------------------------------------------------------
# --- Lightwell Software Supply Chain Security Workshop (CNV)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml

#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/access-restriction-devs-only.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

# -------------------------------------------------------------------
# CNV Worker Nodes
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 2
ai_workers_cores: 16
ai_workers_memory: 64Gi

# -------------------------------------------------------------------
# Tags / Revisions
# -------------------------------------------------------------------
tag: main
tag_assisted_installer: v0.0.9
# NOTE: Showroom is deployed from the gitops repo, so it will use the gitops repo revision
gitops_repo_revision: main

# -------------------------------------------------------------------
# Additional Collections & roles to be installed
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: "{{ tag_assisted_installer }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_ocp_console_embed

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.4
ocp4_workload_authentication_keycloak_use_catalog_source: false
ocp4_workload_authentication_keycloak_default_realm: sso
ocp4_workload_authentication_keycloak_namespace: keycloak
ocp4_workload_authentication_keycloak_host_prefix: "sso-{{ ocp4_workload_authentication_keycloak_namespace }}"

ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits') }}"
ocp4_workload_authentication_num_users: 0
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.21
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resource_tracking_method: annotation
ocp4_workload_openshift_gitops_applicationset_controller_update: true

# -------------------------------------------------------------------
# agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lightwell-tssc-workshop.git
ocp4_workload_gitops_bootstrap_repo_revision: "{{ gitops_repo_revision }}"
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-infra

ocp4_workload_gitops_bootstrap_helm_values:
  components:
    keycloak:
      enabled: true
    pipelines:
      enabled: true
    rhtas:
      enabled: true
    rhtpa:
      enabled: true
    rhacs:
      enabled: true
    gitea:
      enabled: true
    lightwellRepo:
      enabled: true
    rhdh:
      enabled: true
    springBootLwPoc:
      enabled: true
    fastapiLwPoc:
      enabled: true
    showroom:
      enabled: true
      content:
        antoraPlaybook: site.yml
        repoRef: "{{ gitops_repo_revision }}"
      terminal:
        labClusterAccess: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 46fb0d02-b90a-4a12-82b3-1a88f1e8c7d5
  owners:
    maintainer:
    - name: Diego Fuerte
      email: dtorresf@redhat.com
    - name: Tyrell Reddy
      email: treddy@redhat.com
    instructions:
    - name: Diego Fuerte
      email: dtorresf@redhat.com

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Lightwell Software Supply Chain Security Workshop (CNV)"
    category: Workshops
    keywords:
    - lightwell
    - supply-chain
    - security
    - tssc
    - sbom
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Application_Developer

  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: "4.21"
    propagate_provision_data:
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
