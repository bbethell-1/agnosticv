# -------------------------------------------------------------------
# --- Catalog Item: "Backup and Recovery of Red Hat OpenShift Virtualization VMs using Trilio"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

#-------------------------------------------------------------------
# Collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  - name: https://github.com/rhpds/trilio-workshop.git
    type: git
    version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_minio
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- trilio.workshop.ocp4_workload_trilio_backup_restore_vms
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
num_users: 1
user_password: >-
  {{
    lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits')
  }}
original_namespace: originalvms

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
# Generate user password
ocp4_workload_authentication_htpasswd_user_base: dr-admin
ocp4_workload_authentication_htpasswd_user_password: "{{ user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_trilio_backup_restore_vms
# -------------------------------------------------------------------
ocp4_workload_trilio_backup_restore_vms_namespace: trilio-system
ocp4_workload_trilio_backup_restore_vms_operator_channel: 5.0.x
ocp4_workload_trilio_backup_restore_vms_dr_user: "dr-admin1"
ocp4_workload_trilio_backup_restore_vms_dr_user_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_trilio_backup_restore_vms_dr_user_password: "{{ user_password }}"
ocp4_workload_trilio_backup_restore_vms_s3_accessKey: minio
ocp4_workload_trilio_backup_restore_vms_s3_secretKey: "{{ user_password }}"
ocp4_workload_trilio_backup_restore_vms_user_count: "{{ num_users }}"
ocp4_workload_trilio_backup_restore_vms_dr_user_namespace: "{{ original_namespace }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: true
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: "{{ user_password }}"
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-05-28T17-19-04Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
- trilio-storage
ocp4_workload_minio_bucket_multi_user: false
ocp4_workload_minio_bucket_num_users: "{{ num_users }}"
ocp4_workload_minio_bucket_userbase: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_htpasswd_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/lb2788-trilio-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
  user_password: "{{ user_password }}"
  vms:
    namespace: "{{ original_namespace }}"

# ------------------------------------------------------
# Workload: ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom_backup_recovery_ocp_virt_trilio.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.1
ocp4_workload_showroom_content_only: true

