# -------------------------------------------------------------------
# --- Catalog Item: Advanced Cluster Management Demo
#
# --- MIGRATED TO AGNOSTICDv2 ---
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: main
  # AI Workloads (for OpenShift Lightspeed)
  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: main
  # ACM Demo custom workloads
  - name: https://github.com/rhpds/acm_demo.git
    type: git
    version: main
  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_rhacm
- rhpds.acm_demo.ocp4_workload_bastion_packages
- rhpds.acm_demo.ocp4_workload_propagate_aws_creds
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_bastion_packages
# -------------------------------------------------------------------
bastion_packages:
- python3-pip

bastion_pip_packages:
- awscli
- boto3

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: ""
ocp4_workload_authentication_num_users: 0

ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_keycloak_default_realm: keycloak
ocp4_workload_authentication_keycloak_channel: stable-v26.6
ocp4_workload_authentication_keycloak_use_catalog_source: false

# -------------------------------------------------------------------
# ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.17
# This is required by the ocp4_workload_rhacm multiclusterhub.yaml.j2 template
master_instance_count: 1

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols (OpenShift Lightspeed)
# -------------------------------------------------------------------
# Use Azure AI as the backend for OpenShift Lightspeed
ocp4_workload_ai_platform: azure

# Automatically create and manage Azure AI tokens
ocp4_workload_ols_get_token: true

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-rhacm-demo.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: site.yml

# Enable Wetty and auto-SSH to bastion
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Dev Mode is overridden in dev.yaml
ocp4_workload_showroom_antora_enable_dev_mode: "false"

# ===================================================================
# Workloads to remove on destroy
# ===================================================================
remove_workloads:
- agnosticd.ai_workloads.ocp4_workload_ols

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: ff272c4a-4e0d-43a0-8564-d74ef0c61090
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    instructions:
    - name: Jimmy Alverez
      email: jalverez@redhat.com
    - name: Luiz Bernardo Levenhagen Alarcon da Fonseca
      email: llevenha@redhat.com

  catalog:
    display_name: "Advanced Cluster Management for Kubernetes Demo (CNV)"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - ocp
    - openshift
    - acm
    - rhacm
    labels:
      Featured_Score: '71'
      Product: Red_Hat_Advanced_Cluster_Management_for_Kubernetes
      Product_Family: Red_Hat_Cloud
      Provider: Hybrid_Platform_BU
    reportingLabels:
      primaryBU: Hybrid_Platforms

  components:
  - name: openshift_base
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/prod
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: '4.22'
      ocp4_fips_enable: false
    propagate_provision_data:
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: openshift_api_url
      var: openshift_api_url
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
  - name: aws
    display_name: AWS Open Environment
    item: sandboxes-gpte/SANDBOX_OPEN
    parameter_values:
      aws_region: us-east-2
    propagate_provision_data:
    - var: aws_provision_data

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      start:
        disable: false
      stop:
        disable: true

  sandbox_api:
    actions:
      destroy:
        # Allow remove_workloads to run before sandbox is destroyed
        catch_all: false
