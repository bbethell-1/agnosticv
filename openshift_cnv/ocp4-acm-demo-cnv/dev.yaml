---
# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_rhacm
- rhpds.acm_demo.ocp4_workload_bastion_packages
- rhpds.acm_demo.ocp4_workload_propagate_aws_creds
- agnosticd.ai_workloads.ocp4_workload_ols
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom
- rhpds.acm_demo.ocp4_workload_update_kubelet_config

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_antora_enable_dev_mode: "true"

# -------------------------------------------------------------------
# ocp4_workload_update_kubelet_config
# -------------------------------------------------------------------
# This role updates the Kubelet config on the cluster to set the pods per core and max pods
# It MUST be the last role to run - even after showroom etc. - because it will trigger
# a node reboot which would interfere with other workloads.

ocp4_workload_update_kubelet_config_name: control-plane-max-pods
ocp4_workload_update_kubelet_config_pods_per_core: 20
ocp4_workload_update_kubelet_config_max_pods: 500

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
