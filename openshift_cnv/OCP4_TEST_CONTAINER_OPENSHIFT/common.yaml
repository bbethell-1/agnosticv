---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/openshift-sandbox-ocpv01-sa.yml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_workload_test_containers.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/openshift-cnv-ocpv01-sa.yml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
ai_cluster_version: "{{ ocp4_installer_version }}"
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: '4.15'
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true


# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
ai_control_plane_cores: >-
  {{ 8 if worker_instance_count|int <= 10
  else 16 if worker_instance_count|int <= 20
  else 32
  }}
ai_control_plane_memory: >-
  {{ '16Gi' if worker_instance_count|int <= 10
  else '32Gi' if worker_instance_count|int <= 20
  else '64Gi'
  }}
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"

bastion_instance_image: rhel-9.1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_external_odf
  - ocp4_workload_pipelines
  - ocp4_workload_test_containers

# --- Student Workloads (YAML List)
student_workloads: []
# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.14
ocp4_workload_pipelines_tkn_version: 0.56.2
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
#odf_channel: "stable-4.14"
odf_channel: "{{ 'stable-4.14' if ocp4_installer_version == '4.15' else 'stable-' + ocp4_installer_version }}"

# -------------------------------------------------------------------
# Workload: ocp4-workload-nfs-provisioner
# -------------------------------------------------------------------
nfs_provisioner_nfs_server_hostname: "{{ openshift_cnv_nfs_server }}"
nfs_provisioner_server_directory: "{{ openshift_cnv_nfs_path }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 642FF4B7-8466-4EC0-8636-0F244DE531CF
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Testcontainers on OpenShift Demo Environment
    category: Demos
    keywords:
      - ocp
      - ocp415
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '95'
    parameters:
      - name: ai_control_plane_cores
        description: OpenShift node cores
        formLabel: OpenShift node cores
        openAPIV3Schema:
          type: integer
          default: 16
          enum:
            - 16
            - 24
            - 32
      - name: ai_control_plane_memory
        description: OpenShift node memory size
        formLabel: OpenShift node memory size
        openAPIV3Schema:
          type: string
          default: 32Gi
          enum:
            - 32Gi
            - 64Gi
            - 128Gi
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  secrets:
    - name: ocp4_ai_offline_token
      namespace: gpte
