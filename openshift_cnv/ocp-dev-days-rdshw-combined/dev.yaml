---
purpose: development

__meta__:
  deployer:
    scm_ref: main
    scm_type: git

# Allow dev cluster to continue even if ArgoCD apps fail to sync
ocp4_workload_dev_days_rdshw_wait_for_apps_ignore_errors: true

# Override to dev revision for gitops repo
ocp4_workload_dev_days_rdshw_gitops_repo_tag: pinned-images
ocp4_workload_gitops_bootstrap_repo_revision: pinned-images
ocp4_workload_dev_days_rdshw_gitops_repo: https://github.com/cgruver/ocp-dev-days-rdshw-gitops.git
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/cgruver/ocp-dev-days-rdshw-gitops.git

# Provision only 1 user for dev testing
num_users: 1

# Key duration for dev — long enough to cover a full test session
ocp4_workload_litellm_virtual_keys_duration: "7d"
