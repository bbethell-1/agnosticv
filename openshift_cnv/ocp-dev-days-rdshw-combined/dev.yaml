---
purpose: development

__meta__:
  deployer:
    scm_ref: main
    scm_type: git
  catalog:
    parameters:
    - name: ocp4_workload_dev_days_rdshw_automation_repo
      description: "Ansible automation collection repository URL"
      formLabel: "Automation Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/ocp-dev-days-rdshw-automation
    - name: automation_tag
      description: "Ansible automation collection tag/branch"
      formLabel: "Automation Collection Ref"
      openAPIV3Schema:
        type: string
        default: main
    - name: ocp4_workload_dev_days_rdshw_gitops_repo
      description: "GitOps repository URL (cluster charts)"
      formLabel: "GitOps Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/ocp-dev-days-rdshw-gitops.git
    - name: ocp4_workload_dev_days_rdshw_gitops_repo_tag
      description: "GitOps cluster charts tag/branch"
      formLabel: "Cluster Charts Ref"
      openAPIV3Schema:
        type: string
        default: dev
    - name: ocp4_workload_gitops_bootstrap_repo_url
      description: "GitOps bootstrap repository URL (tenant charts, usually same as above)"
      formLabel: "Bootstrap Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/ocp-dev-days-rdshw-gitops.git
    - name: ocp4_workload_gitops_bootstrap_repo_revision
      description: "GitOps tenant charts tag/branch"
      formLabel: "Tenant Charts Ref"
      openAPIV3Schema:
        type: string
        default: dev
    - name: ocp4_workload_showroom_content_git_repo
      description: "Showroom content repository URL"
      formLabel: "Showroom Repo URL"
      openAPIV3Schema:
        type: string
        default: https://github.com/rhpds/ocp-dev-days-rdshw-showroom.git
    - name: ocp4_workload_showroom_content_git_repo_ref
      description: "Showroom content tag/branch"
      formLabel: "Showroom Content Ref"
      openAPIV3Schema:
        type: string
        default: main

# Allow dev cluster to continue even if ArgoCD apps fail to sync
ocp4_workload_dev_days_rdshw_wait_for_apps_ignore_errors: true

# Provision only 1 user for dev testing
num_users: 1

# Key duration for dev — long enough to cover a full test session
ocp4_workload_litellm_virtual_keys_duration: "7d"
