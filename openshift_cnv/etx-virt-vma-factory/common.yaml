---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: RH1 Super Lab:
# ---     Virtualization VMA & Migration Factory
# -------------------------------------------------------------------
# This is a lab for Services to teach the Migration Factory at RH1 2026
#
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/access-restriction-rh1-2026-devs.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/sandbox-api.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/quay-openshift-virtualization-migration.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/terms-of-service.yaml

# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# -------------------------------------------------------------------
# OpenShift Nodes
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
ai_workers_memory: 32Gi
ai_workers_cores: 16
worker_instance_count: 3
num_users: 1
user_count: 1

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: 1.3.0
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.3.7
  roles:
  - name: rhpds.etx_virt_vma_factory
    src: https://github.com/rhpds/etx-virt-vma-factory-collection.git

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- rhpds.etx_virt_vma_factory
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.core_workloads.ocp4_workload_gitea_operator
- agnosticd.core_workloads.ocp4_workload_nmstate
- agnosticd.core_workloads.ocp4_workload_openshift_virtualization
- agnosticd.core_workloads.ocp4_workload_mtv
- agnosticd.core_workloads.ocp4_workload_metallb
- agnosticd.core_workloads.ocp4_workload_virt_network_config
- agnosticd.core_workloads.ocp4_workload_ansible_automation_platform
- agnosticd.showroom.ocp4_workload_showroom_ocp_integration
- agnosticd.showroom.ocp4_workload_showroom

# -------------------------------------------------------------------
# Common Vars
# -------------------------------------------------------------------
common_admin_password: >-
  {{
    lookup('password', output_dir ~ '/common_admin_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_user_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Workload: lab setup variables
# -------------------------------------------------------------------
openshift_virtualization_migration_robot_quay_repository: "quay.io/rhpds/openshift-virtualization-migration-ee-2.5:v9"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_nmstate
# -------------------------------------------------------------------
ocp4_workload_nmstate_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_virtualization
# -------------------------------------------------------------------
ocp4_workload_openshift_virtualization_channel: stable
ocp4_workload_openshift_virtualization_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.10

# -------------------------------------------------------------------
# Workload: ocp4_workload_metallb
# -------------------------------------------------------------------
ocp4_workload_metallb_channel: stable
ocp4_workload_metallb_enable_ipaddresspool: false
ocp4_workload_metallb_enable_l2advertisement: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_network_config
# -------------------------------------------------------------------
ocp4_workload_virt_network_config_multi_user: false
ocp4_workload_virt_network_config_networks: "{{ ai_attach_workers_networks | default([]) }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.18
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'
# ocp4_workload_authentication_admin_user
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
# g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/etx-virt-vma-factory-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: dev
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_application_health_retries: 150
# repo_path: bootstrap <- both infra and per-user
# repo_path: infra <- only infra
# repo_path: user <- only per-user

# 3scale requires RWX storage, so disable it for now.
ocp4_workload_gitops_bootstrap_helm_values:
  guid: "{{ guid }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0

ocp4_workload_gitea_operator_channel: stable
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.24.6"

ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_htpasswd_user_base }}1"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"

ocp4_workload_gitea_operator_migrate_repositories: false

# -------------------------------------------------------------------
# ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_operator_channel: stable-2.6

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/etx-virt-vma-factory-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_passthrough_user_data: true

agnosticd_passthrough_user_data:
  vcenter_url: "{{ vcenter_url }}"
  vcenter_user_name: "{{ vcenter_user_name }}"
  vcenter_password: "{{ vcenter_password }}"
  vcenter_subnet_cidr: "{{ vcenter_subnet_cidr }}"
  vcenter_vm_folder: "{{ vcenter_vm_folder }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: d112d50d-1b49-4be8-bcd4-b999c65669bd

  # Disable actions on chained config that are handled by base.
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Flavio Andrade
      email: fandrade@redhat.com
    instructions:
    - name: Andrew Harrison
      email: aharrison@redhat.com
    - name: Flavio Andrade
      email: fandrade@redhat.com
    - name: Scott Worthington
      email: scworthi@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-virt-labs-pool/dev
    parameter_values:
      cluster_size: sno
      host_ocp4_installer_version: '4.20'
      ocp4_fips_enable: false
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    # guest cluster credentials
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # ocpvN cluster credentials
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    # propogate provision data for showroom
    - name: bastion_public_hostname
      var: bastion_public_hostname
    - name: bastion_ssh_user_name
      var: bastion_ssh_user_name
    - name: bastion_ssh_password
      var: bastion_ssh_password
    - name: bastion_ssh_port
      var: bastion_ssh_port
  - name: vmwareopenenvironment
    display_name: VMware Open Environment
    item: vmware-ibm/sandbox-vmware/prod
    parameter_values: {}
    propagate_provision_data:
    - name: vcenter_password
      var: vcenter_password
    - name: vcenter_subnet_cidr
      var: vcenter_subnet_cidr
    - name: vcenter_url
      var: vcenter_url
    - name: vcenter_user_name
      var: vcenter_user_name
    - name: vcenter_vm_folder
      var: vcenter_vm_folder

  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB6618: OpenShift Virtualization Super Lab: Delivering the VMA and the Virtualization Migration Factory"
    category: Brand_Events
    keywords:
    - rh1-2026
    - lb6618
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
    multiuser: false
    workshopLabUiRedirect: true
    parameters: []

  # Disable actions on chained config that are handled by base.
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
