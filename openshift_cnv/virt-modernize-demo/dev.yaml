ocp4_installer_version: "4.19"

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_use_catalog_source: false
ocp4_workload_rhsso_authentication_starting_csv: ""

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_starting_csv: ""

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false
ocp4_workload_kubevirt_starting_csv: ""

# -------------------------------------------------------------------
# ocp4_workload_ossm
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_setup: false
ocp4_workload_ossm_kiali_startingcsv: ""
ocp4_workload_ossm_servicemesh_startingcsv: ""

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: latest
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_starting_csv: ""

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_revision: main

ocp4_workload_gitops_bootstrap_helm_values:
  workspace:
    git:
      revision: main

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: main

