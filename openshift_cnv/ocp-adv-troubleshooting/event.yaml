---
#include /includes/ansible_control_plane/controller-scheduler-event.yaml
#include /includes/access-restriction-summit-devs.yaml
#include /includes/parameters/event-lifetime-runtime.yaml

#-------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "rhel-9.6"
    memory: "14G"
    image_size: "200Gi"
    cores: 4
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-https
        host: "rhel9"
        legacy: false
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: Edge

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: ocp-adv-1.0.0
