---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/lifetime-standard.yaml

#include /includes/parameters/purpose.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl.yaml

# needed for rhpds.ocp_adv_troubleshooting workload
#include /includes/secrets/s3-rhpds-private-bucket.yaml

# This catalog item is an advancement on /pert/anatomy-must-gather
#
# It is one RHEL 9 VM in which the user logs in and dissects
# * ocp-must-gather output
# * ovs network database data
#
# It now uses AgnosticD-v2 for the deployment
# Everything it needs is part of base AgnosticD-v2
# It includes the rhpds.ocp_adv_troubleshooting role

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
config: cloud-vms-base
cloud_provider: openshift_cnv
common_password: >-
  {{
    lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
bastion_public_hostname: "rhel9.{{ guid }}.{{ subdomain_base_suffix }}"

# Subdomain configuration
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
#openshift_cnv_legacy_routes: true

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "rhel-9.6"
    memory: "8G"
    image_size: "200Gi"
    cores: 4
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-https
        host: "bastion"
        legacy: false
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: Edge

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: rhpds.ocp_adv_troubleshooting
      src: https://github.com/rhpds/ocp-adv-troubleshooting-collection.git
      #version: v1.0.5

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - host_satellite_repositories
    - host_common_packages

software_workloads:
  bastions:
    - bastion
    - rhpds.ocp_adv_troubleshooting

# -------------------------------------------------
# Set up Bastion
# -------------------------------------------------
bastion_student_user_password: "{{ common_password }}"
openshift_cnv_route_remove_x_frame_options_header: true

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_name: lab-user
student_password: "{{ common_password }}"

host_common_packages_extra: >-
  {{
    ['podman','tree','runc','openldap-clients']
  }}
#['podman', 'podman-docker', 'buildah', 'skopeo', 'git', 'vim', 'qemu-kvm', 'libvirt', 'virt-install', 'virt-manager', 'python3-libvirt', 'make', 'jq', 'cockpit']

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/ocp-adv-troubleshooting-showroom.git"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 94ed4a9c-6153-4ac1-9429-1a41d7e244b3
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
    instructions:
      - name: Judd Maltin
        email: jmaltin@redhat.com
      - name: Matt Robson
        email: mrobson@redhat.com
      - name: Morgan Peterman
        email: mpeterma@redhat.com
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1034: Beyond the Basics: Advanced OpenShift Troubleshooting Techniques"
    category: Workshops
    keywords:
      - openshift
      - troubleshooting
      - mustgather
      - ovn
      - lb1034
      - '2026'
      - rh1
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Brand_Event: Red_Hat_One_2026
    parameters: []
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      pull: missing
