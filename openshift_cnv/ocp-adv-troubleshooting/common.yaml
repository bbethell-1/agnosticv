#include /includes/secrets/demosat-rhel-9-10-latest.yaml

# needed for rhpds.ocp_adv_troubleshooting workload
#include /includes/secrets/s3-rhpds-private-bucket.yaml

#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# This catalog item is an advancement on /pert/anatomy-must-gather
#
# It is one RHEL 9 VM in which the user logs in and dissects
# * ocp-must-gather output
# * ovs network database data
#
# It now uses AgnosticD-v2 for the deployment
# Everything it needs is part of base AgnosticD-v2
# It includes the rhpds.ocp_adv_troubleshooting role

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

common_password: >-
  {{
    lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits')
  }}

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# Subdomain configuration
subdomain: "{{ sandbox_openshift_apps_domain }}"
showroom_host: "{{ bastion_public_hostname }}"

bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}.{{ subdomain }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
#openshift_cnv_legacy_routes: true

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "rhel-9.6"
    memory: "14G"
    image_size: "200Gi"
    cores: 4
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-https
        host: "rhel9"
        legacy: false
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: Edge

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: rhpds.ocp_adv_troubleshooting
      src: https://github.com/rhpds/ocp-adv-troubleshooting-collection.git
      #version: v1.0.5
  collections:
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.3.7

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - host_satellite_repositories
    - host_common_packages
    - bastion                            # bastion setup role so password SSH is enabled

software_workloads:
  bastions:
    - rhpds.ocp_adv_troubleshooting

# -------------------------------------------------------------------
# Run showroom setup role on bastion
# -------------------------------------------------------------------
post_software_final_workloads:
  bastions:
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------
# Set up Bastion
# -------------------------------------------------
# Used by the bastion role to create the user and enable password SSH
bastion_setup_student_user: true
# 'lab-user' is the default but can be overridden
bastion_student_user_name: lab-user
# Set password with value, otherwise it will be auto-generated
bastion_student_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_name: "{{ bastion_student_user_name }}"
student_password: "{{ common_password }}"

host_common_packages_extra: >-
  {{
    ['podman','tree','runc','openldap-clients']
  }}
#['podman', 'podman-docker', 'buildah', 'skopeo', 'git', 'vim', 'qemu-kvm', 'libvirt', 'virt-install', 'virt-manager', 'python3-libvirt', 'make', 'jq', 'cockpit']

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/ocp-adv-troubleshooting-showroom.git"
showroom_git_ref: main
# Setting TLS provider to none and tls_termination for bastion route to edge
showroom_tls_provider: none

showroom_tab_services:
  - "single_terminal"
  - "second_terminal"

showroom_ssh_method: password

showroom_ssh_host: "host.containers.internal"
showroom_ssh_username: "{{ bastion_student_user_name }}"
showroom_ssh_password: "{{ common_password }}"
showroom_ssh_port: 22

showroom_terminal2_ssh_host: "host.containers.internal"
showroom_terminal2_ssh_username: "{{ bastion_student_user_name }}"
showroom_terminal2_ssh_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 94ed4a9c-6153-4ac1-9429-1a41d7e244b3
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
    instructions:
      - name: Judd Maltin
        email: jmaltin@redhat.com
      - name: Matt Robson
        email: mrobson@redhat.com
      - name: Morgan Peterman
        email: mpeterma@redhat.com
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Beyond the Basics: Advanced OpenShift Troubleshooting Techniques (CNV)"
    category: Brand_Events
    keywords:
      - rh1-2026
      - lb1034
      - mustgather
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Brand_Event: Red_Hat_One_2026
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []
  sandboxes:
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-06-30
      pull: missing
