---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

instances:
  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "rhel-9.6"
    memory: "12G"
    image_size: "200Gi"
    cores: 4
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-https
        host: "rhel9"
        legacy: false
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: Edge

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  access_control:
    allow_groups:
      - rhpds-devs-judd
