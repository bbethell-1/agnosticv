# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development


ocp4_installer_version: "4.19.7"
ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients

odf_channel: "stable-4.18"
bastion_instance_image: "RHEL96GOLD-latest"
ocp4_workload_cert_manager_channel: "stable-v1.17"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
  deployer:
    scm_ref: development
