---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/controller-scheduler-event.yaml

# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: DNSSandbox
    annotations:
      prefix: cluster
    cloud_selector:
      provider: ddns
      domain: "dyn.redhatworkshops.io"
    var: dns_sandbox
  - kind: SSLSandbox
    cloud_selector:
      purpose: production
    var: ssl_sandbox
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
    quota:
      limits.cpu: "256"
      requests.cpu: "256"
      limits.memory: "2000Gi"
      requests.memory: "2000Gi"
      requests.storage: 2000Gi
  deployer:
    scm_ref: cnv-ocp4-workload-quarkus-workshop-0.2.7
