---
#include /includes/parameters/event-lifetime-runtime.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}

__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: event
      virt: "yes"
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    #scm_url: https://github.com/thoraxe/ansible_agnostic_deployer
    #scm_ref: summit-23-cockroach
    scm_ref: ocp4-cockroach-dbaas-amq-0.0.3
  secrets:
  - name: openshift_cnv_ocpv01
    namespace: gpte
