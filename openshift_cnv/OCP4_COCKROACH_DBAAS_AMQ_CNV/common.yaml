---
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/cockroach_dbaas_amq_lab_apikey.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

#include /includes/secrets/dynamic-aws-dns.yaml

#include /includes/sandbox-api.yaml
#include /includes/secrets/openshift-ocpv-configs.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS


# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
ocp4_installer_version: "4.14.2"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
cloud_provider: openshift_cnv
ai_cluster_version: "{{ ocp4_installer_version }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true


# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
ai_control_plane_cores: 8
ai_control_plane_memory: 32Gi
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"
ai_workers_cores: 16
ai_workers_memory: 64Gi

bastion_instance_image: rhel-9.1-y

# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
#odf_channel: "stable-4.15"
#odf_channel: "stable-{{ ocp4_installer_version }}" - to set just to same version as ocp installer

odf_channel: "stable-4.14"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_external_odf
- ocp4_workload_opentlc_production
# - ocp4_workload_le_certificates
- ocp4_workload_cert_manager
- ocp4_workload_gitea_operator
- ocp4_workload_dbaas_operator
- ocp4_workload_amq_streams
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_cockroach_dbaas_amq_lab
- bookbag

remove_workloads:
- ocp4_workload_cockroach_dbaas_amq_lab

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count | default(num_users) | default('2') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Values from /includes/secrets/dynamic-aws-dns.yaml
# cluster_dns_zone: dynamic.redhatworkshops.io
# route53_aws_zone_id:
# route53_aws_access_key_id:
# route53_aws_secret_access_key:

ocp4_workload_cert_manager_cloud_provider: ec2
# ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

### gitea
ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_password: openshift
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: "https://github.com/shettyjm/rhedalab.git"
  name: "cockroach-kafka-eda"
  private: false

### bookbag
bookbag_git_repo: https://github.com/OpenShiftDemos/cockroachdb-kafka-eda-lab

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 652e0342-22ac-4c19-83b9-3ad20e80090b
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Architect event-driven apps with OpenShift CockroachDB Kafka
    category: Workshops
    keywords:
    - workshop
    - openshift
    - kafka
    - eda
    - cockroach
    - summit2023
    - amq
    - ocp414
    - cnv
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
