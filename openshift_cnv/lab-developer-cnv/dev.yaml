---

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: lab-developer-cnv
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
    quota:
      requests.storage: "2000Gi"
  lifespan:
    default: 1d
    maximum: 2d
    relativeMaximum: 1d
  runtime:
    default: 3h
    maximum: 48h
