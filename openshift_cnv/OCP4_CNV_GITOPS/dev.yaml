---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-cnv-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: main
  threeScale:
    channel: threescale-2.13
    startingCSV: ""
  devspaces:
    startingCSV: ""
  rhoai:
    startingCSV: ""
    datasciencecluster:
      components:
        codeflare:
          managementState: Removed
        dashboard:
          managementState: Managed
        datasciencepipelines:
          managementState: Removed
        kserve:
          defaultDeploymentMode: RawDeployment
          rawDeploymentServiceConfig: Headed
          managementState: Managed
          serving:
            managementState: Removed
            name: knative-serving
        kueue:
          managementState: Removed
        modelmeshserving:
          managementState: Removed
        modelregistry:
          managementState: Removed
        ray:
          managementState: Removed
        workbenches:
          managementState: Managed
        trainingoperator:
          managementState: Removed
        trustyai:
          managementState: Removed
        feastoperator:
          managementState: Removed
        llamastackoperator:
          managementState: Removed
  rhsso:
    startingCSV: ""
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: ""
  compliance:
    startingCSV: ""
  showroom:
    content:
      repoUrl: https://github.com/rhpds/ocp4-cnv-gitops-showroom.git
      repoRef: main

ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
