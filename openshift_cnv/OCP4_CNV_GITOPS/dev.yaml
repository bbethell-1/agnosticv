---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_health_retries: 5
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: main
  threeScale:
    channel: threescale-2.13
    startingCSV: ""
  devspaces:
    startingCSV: ""
  rhoai:
    startingCSV: ""
    datasciencecluster:
      components:
        dashboard:
          managementState: Managed
        datasciencepipelines:
          managementState: Managed
        kserve:
          managementState: Managed
        kueue:
          managementState: Managed
        modelmeshserving:
          managementState: Managed
        ray:
          managementState: Managed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: ""
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: ""
  compliance:
    startingCSV: ""
  showroom:
    content:
      repoUrl: https://github.com/rhpds/ocp4-cnv-gitops-showroom.git
      repoRef: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
