purpose: development
ai_workers_cores: 16
ai_workers_memory: 32Gi
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_external_odf
- ocp4_workload_openshift_gitops
- ocp4_workload_serverless
- ocp4_workload_ossm
- ocp4_workload_gitops_bootstrap
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_use_catalog_snapshot: false
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false
ocp4_workload_ossm_catalogsource_setup: false
ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-cnv-gitops
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: main
  threeScale:
    channel: threescale-2.13
    startingCSV: ''
  devspaces:
    startingCSV: ''
  rhoai:
    startingCSV: ''
    datasciencecluster:
      components:
        dashboard:
          managementState: Managed
        datasciencepipelines:
          managementState: Managed
        kserve:
          managementState: Managed
        kueue:
          managementState: Managed
        modelmeshserving:
          managementState: Managed
        modelregistry:
          managementState: Managed
        ray:
          managementState: Managed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: ''
    admin:
      username: ssoadmin
      password: '{{ common_admin_password }}'
  webterminal:
    startingCSV: ''
  compliance:
    startingCSV: ''
  showroom:
    content:
      repoUrl: https://github.com/rhpds/ocp4-cnv-gitops-showroom.git
      repoRef: main
ocp4_workload_gitops_bootstrap_health_retries: 2
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
