---
#include /includes/catalog-icon-openshift.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# OpenShift GitOps Blank Environment
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_cores: 2
bastion_memory: 4Gi

# master_instance_count: 1
worker_instance_count: "{{ 0 if master_instance_count | int == 1 else [(num_users | int / 3) | round(0, 'ceil') | int, 2] | max }}"

# ai_control_plane_cores: 16
# ai_control_plane_memory: "{{ '64Gi' if master_instance_count | int == 1 else '32Gi' }}"

ai_workers_cores: 8
ai_workers_memory: 16Gi

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
# ocp4_installer_version: "4.19"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: user

common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: "stable-4.18"
# FIXME: use value below when 4.19 is supported
# odf_channel: "stable-{{ ocp4_installer_version }}"

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.17
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.17
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
# ocp4_workload_openshift_gitops_kustomize_plugin_env:
# - name: MY_VAR
#   value: myValue

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/ocp4-cnv-gitops
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.3
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

# 3scale requires RWX storage, so disable it for now.
ocp4_workload_gitops_bootstrap_helm_values:
  git:
    url: https://github.com/rhpds/ocp-cluster-addons
    revision: v1.3.0
  threeScale: ''
  devspaces:
    startingCSV: devspacesoperator.v3.21.0
  rhoai:
    startingCSV: rhods-operator.2.22.0
    datasciencecluster:
      components:
        dashboard:
          managementState: Managed
        datasciencepipelines:
          managementState: Managed
        kserve:
          managementState: Managed
        kueue:
          managementState: Managed
        modelmeshserving:
          managementState: Managed
        modelregistry:
          managementState: Managed
        ray:
          managementState: Managed
        workbenches:
          managementState: Managed
  rhsso:
    startingCSV: rhsso-operator.7.6.12-opr-001
    admin:
      username: ssoadmin
      password: "{{ common_admin_password }}"
  webterminal:
    startingCSV: web-terminal.v1.13.0
  compliance:
    startingCSV: compliance-operator.v1.6.2
  showroom:
    content:
      repoUrl: https://github.com/rhpds/ocp4-cnv-gitops-showroom.git
      repoRef: v1.0.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3153ac48-f909-4090-af4e-3b1bcb024963
  owners:
    maintainer:
    - name: Juliano Mohr
      email: jboeselm@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: prod
      virt: "yes"
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift GitOps Blank Environment
    category: Open_Environments
    multiuser: true
    keywords:
    - openshift
    - gitops
    - argocd
    - single-node
    - sno
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Featured_Score: '71'
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 25
    - name: master_instance_count
      description: OpenShift control plane node count
      formLabel: Control Plane Count
      required: false
      openAPIV3Schema:
        type: integer
        default: 1
        maximum: 3
        enum:
        - 1
        - 3
    - name: ai_control_plane_cores
      description: OpenShift control plane nodes cores
      formLabel: Control Plane Cores
      openAPIV3Schema:
        type: integer
        default: 24
        enum:
        - 16
        - 24
        - 32
    - name: ai_control_plane_memory
      description: OpenShift control plane nodes memory
      formLabel: Control Plane Memory
      openAPIV3Schema:
        type: string
        default: 64Gi
        enum:
        - 32Gi
        - 64Gi
        - 128Gi
    - name: ocp4_installer_version
      description: OpenShift version to install
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.19'
        enum:
        - '4.18'
        - '4.19'
      annotation: demo.redhat.com/ocp-version
      variable: ocp4_installer_version
