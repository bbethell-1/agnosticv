    display_name: NGINX Ingress Controller Workshop
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - ocp418
      - nginx
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
