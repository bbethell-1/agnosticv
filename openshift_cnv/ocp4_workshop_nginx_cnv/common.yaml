#include /includes/catalog-icon-nginx.yaml
#include /includes/terms-of-service.yaml

#include /includes/sandbox-api.yaml

#include /includes/parameters/enable-cert-manager.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml
#include /includes/parameters/num-users-salesforce.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/dynamic-aws-dns.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/nginx-quay.yaml
#include /includes/secrets/ocp4_workload_nginxplus_license.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_hcp_cnv
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.8"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Instances and Machine Count
# -------------------------------------------------------------------
hcp_control_plane_cores: >-
  {{ 8 if worker_instance_count|int <= 10
  else 16 if worker_instance_count|int <= 20
  else 32
  }}
hcp_control_plane_memory: >-
  {{ '16Gi' if worker_instance_count|int <= 10
  else '32Gi' if worker_instance_count|int <= 20
  else '64Gi'
  }}
worker_instance_count: 2

bastion_instance_image: rhel-9.5

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  # - ocp4_workload_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_nginxplus
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: true

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpst/nginx-rhdp-lab.git
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f5ca2a39-3ff8-4085-8a82-6cac0b8ceeb8
  owners:
    maintainer:
      - name: George James
        email: gjames@redhat.com
    instructions:
      - name: George James
        email: gjames@redhat.com

  anarchy:
