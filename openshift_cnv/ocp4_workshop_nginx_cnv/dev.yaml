---
# -------------------------------------------------------------------
# Purpose - Cost tag
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv06
          enum:
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      alias: A
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
      cloud_selector:
        cloud: cnv
        purpose: "prod"
        name: "ocpv06"
        virt: "yes"
        hcp: "no"
    - kind: OcpSandbox
      var: sandbox_hcp
      namespace_suffix: ocp4-cluster
      alias: B
      cloud_selector:
        purpose: "prod"
        hcp: "yes"
      cluster_condition: "child('A')"
