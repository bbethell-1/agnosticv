      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  owners:
    maintainer:
      - name: Christoph Doerbeck
        email: cdoerbec@redhat.com
      - name: Gordon Keegan
        email: gkeegan@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
