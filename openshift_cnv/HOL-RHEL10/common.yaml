# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  workshop_cockpit_url: "https://node3.{{ subdomain }}"
  workshop_cockpit_user_name: "{{ student_name }}"
  workshop_cockpit_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/showroom-lb1136-rhel-10-hol.git"
showroom_git_ref: development
showroom_user: showroom
showroom_ui: default
# showroom_ui_zero_bundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_tab_services:
  - double_tty

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"
showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"
showroom_host: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 16FE204B-06C9-4E6A-9EB9-4666BAA19BF5
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "The Definitive Red Hat Enterprise Linux 10 Hands-On Lab"
    workshopLabUiRedirect: true
    category: Labs
    keywords:
      - rhel
      - rhel10
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  deployer:
