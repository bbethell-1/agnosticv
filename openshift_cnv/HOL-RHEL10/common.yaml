---
#include /includes/catalog-icon-rhel.yaml

#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml
#include /includes/access-restriction-devs-only.yaml
# -------------------------------------------------------------------
# ZeroSSL is default for this workload - lb1136_rhel10_hol. So fallback may not possible
# -------------------------------------------------------------------
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml

#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml

# -------------------------------------------------------------------
# --- Catalog: OpenShift CNV
# --- Catalog Item: The Definitive Red Hat Enterprise Linux 10 Hands-On Lab"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
env_type: multi-cloud-base-infra
cloud_provider: openshift_cnv
software_to_deploy: none

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
rhel_instance_image: rhel-10.0
rootfs_size_rhel: 50Gi
node_name: node
pv_size_node: 4Gi
showroom_tls_provider: none

openshift_cnv_legacy_routes: true

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-http
    routes:
      - name: bastion-https
        host: "bastion"
        legacy: false
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: Edge

  - name: "{{ node_name }}"
    count: 2
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node-https
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: node-https
    routes:
      - name: node-https
        host: node
        service: node-https
        targetPort: 443
        tls: true
    disks:
      - metadata:
          name: "{{ node_name }}{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}1"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}2"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}3"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

  - name: "node3"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel10_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node3-http
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node3-http
      - name: node3-https
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: node3-https
      - name: node3-cockpit
        ports:
          - port: 9090
            protocol: TCP
            targetPort: 9090
            name: node3-cockpit
    routes:
      - name: node3-http
        host: node3
        service: node3-http
        targetPort: 80
        tls: false

      - name: node3-https
        host: node3-https
        service: node3-https
        targetPort: 443
        tls: true

      - name: node3-cockpit
        host: node3
        service: node3-cockpit
        targetPort: 9090
        tls: true
    disks:
      - metadata:
          name: "node3{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node3{{ guid }}1"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node3{{ guid }}2"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "node3{{ guid }}3"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

  - name: "leapp"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: leapp-https
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: leapp-https
    routes:
      - name: leapp-https
        host: leapp
        service: leapp-https
        targetPort: 443
        tls: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  roles:
    - name: lb1136_rhel10_hol
      src: https://github.com/rhpds/lb1136_rhel10_hol
      #version: v1.0.0

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set_env_authorized_key
    - set-repositories
    - bastion-student-user
  bastions:
    - common
    - bastion-base
    - user-create-ansible-service-account
    - asset_injector

software_workloads:
  all:
    - lb1136_rhel10_hol

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: set_env_authorized_key
# -------------------------------------------------------------------
set_env_authorized_key: true
env_authorized_key: "{{ guid }}key"
ansible_ssh_private_key_file: ~/.ssh/{{ env_authorized_key }}.pem
ansible_service_account_user_ssh_config: ssh_config.j2

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_name: lab-user
student_password: "{{ common_password }}"

agd_install_bastion_base: true
agd_install_common: true
agd_bastion_packages:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------
ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Role: lb1136_rhel10_hol
# -------------------------------------------------------------------
rhel10_hol_config: true
lb1136_rhel10_hol_lecertificate_for_node3: true
lb1136_rhel10_hol_use_rhsm_for_node2: true
