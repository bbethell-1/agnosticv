---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_workers_memory: 48Gi

ai_workers_extra_disks:
  - metadata:
      name: "extradiskINSTANCENAME"
    spec:
      source:
        blank: {}
      pvc:
        accessModes:
          - ReadWriteMany
        volumeMode: Block
        resources:
          requests:
            storage: "20Gi"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpvdev01
          enum:
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
