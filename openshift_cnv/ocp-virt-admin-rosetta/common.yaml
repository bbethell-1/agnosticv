---
# This catalog item was copied from /pert/ocp-virt-troubleshooting-cnv/common.yaml
#
# It creates an RHDP-owned ocp-virt troubleshooting prod catalog item.
#
# The workshop is a single tenant OCP Virt cluster running on CNV.
#
# RH1 2026 title that exists now will be changed back to "OpenShift Virtualization Troubleshooting Virtual Machines"
#    display_name: "LB1387: OpenShift Virtualization Capabilities: Applying the Rosetta Stone"
#
# Instructions will be forked and updated heavily by the RH1 team.
#
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# Agnosticdv2 variables
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/agnosticd/core_workloads.git
    type: git
    version: main

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
#ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
#ocp4_workload_catalogsource_tag: v4.19_2025_07_01

# # -------------------------------------------------------------------
# # Workload: ocp4_workload_bastion_packages
# # -------------------------------------------------------------------
# bastion_packages:
# - python3-pip
#
# bastion_pip_packages:
# - awscli
# - boto3
#
# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_htpasswd_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/acm-demo-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.4
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2025-07-29

__meta__:
  asset_uuid: 100034a2-9499-4a3d-8c05-44eb9a0b70ef
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    instructions:
    - name: Matt Robson
      email: mrobson@redhat.com
    - name: Matthew Secaur
      email: masecaur@redhat.com
    - name: Brandon Smitley
      email: bsmitley@redhat.com
    - name: Mickael Mayeras
      email: mmayeras@redhat.com
  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  # Components to include in template and catalog item
  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools/dev
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '4.20'
    # Propagate agnosticd_user_info data set by this component to variables.
    propagate_provision_data:
    # guest cluster credentials
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    # ocpvN cluster credentials
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    # Propagate bastion data for infra_add_bastion role
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port

  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "LB1387: OpenShift Virtualization Capabilities: Applying the Rosetta Stone"
    category: Brand_Events
    keywords:
    - openshift
    - ocp
    - virtualization
    - troubleshooting
    - rh12026
    labels:
      Product: Red_Hat_OpenShift_Virtualization
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Brand_Event: Red_Hat_One_2026
    multiuser: false
    workshopLabUiRedirect: true
    parameters: []

  # Disable actions on chained config that are handled by base.
  deployer:
    scm_url: https://github.com/agnosticd/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2025-10-09
      pull: missing
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
