    scm_url: "https://github.com/Red-Hat-CTF/rho-ctf-2026.git"
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'


controller_inventories:
  - name: "Demo Inventory"
    organization: Default
    state: absent

  - name: "CTF Leader Board CTFd Server"
    description: "Only the ctfdashboard hostname"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present

  - name: "CTF Leader Board All Host"
    description: "CTF Leader Board All Host"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present

  - name: "CTF Participant All Table Host"
    description: "CTF Participant All Table Host"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present


controller_hosts:
  - name: ctfdashboard
    inventory: "CTF Leader Board CTFd Server"

  - name: ctfdashboard
    inventory: "CTF Leader Board All Host"

  - name: misc
    inventory: "CTF Leader Board All Host"

  - name: audit
    inventory: "CTF Leader Board All Host"


controller_templates:
  - name: "Demo Job Template"
    organization: Default
    state: absent

  - name: "Deploy CTFd and Gitea"
    job_type: run
    inventory: "CTF Leader Board CTFd Server"
    project: "RHO CTF 2026"
    playbook: "setup/playbooks/complete-ctfd.yml"
    execution_environment: Default execution environment
    credentials:
      - "CTF Leader Board Host"
    extra_vars:
      gitea_root_url: "https://gitea-{{ subdomain_base }}"
      ctfd_admin_user: ctfadmin
      ctfd_admin_password: "{{ common_password }}"
      ctfd_admin_email: "admin@ctf.local"

  - name: "Configure Gitea users and repos"
    job_type: run
    inventory: "CTF Leader Board CTFd Server"
    project: "RHO CTF 2026"
    playbook: "setup/playbooks/configure-gitea-lite.yml"
    execution_environment: Default execution environment
    ask_variables_on_launch: true
    ask_extra_vars: true
    allow_simultaneous: true
    credentials:
      - "CTF Leader Board Host"
    extra_vars:
      gitea_admin_user: ctfadmin
      gitea_admin_password: "{{ common_password }}"
      gitea_root_url: "https://gitea-{{ subdomain_base }}"
      teams:
        - name: "<participant_aap_username>"
          password: "<participant_aap_password>"

  - name: "Prepare Ansible servers"
    job_type: run
    inventory: "CTF Participant All Table Host"
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    allow_simultaneous: true
    project: "RHO CTF 2026"
    playbook: "setup/playbooks/prepare-targets-lite.yml"
    execution_environment: Default execution environment
    credentials:
      - "CTF Participant Host"

  - name: "Prepare OpenShift Virt"
    job_type: run
    inventory: "CTF Participant All Table Host"
    project: "RHO CTF 2026"
    playbook: "setup/playbooks/prepare-ocpvirt.yml"
    execution_environment: Custom RHO EE
    ask_inventory_on_launch: true
    ask_variables_on_launch: true
    ask_extra_vars: true
    become_enabled: true
    allow_simultaneous: true
    ask_credential_on_launch: true
    credentials:
      - "CTF Participant Host"
    extra_vars:
      openshift_api_url: "<check_ctf_participant_env>"
      openshift_username: "<check_ctf_participant_env>"
      openshift_password: "<check_ctf_participant_env>"
      bastion_host: "<check_ctf_participant_env>"
      bastion_user: "<check_ctf_participant_env>"
      bastion_password: "<check_ctf_participant_env>"
      bastion_port: "<check_ctf_participant_env>"
      credentials_dir: /tmp/ctf-credentials

  - name: "Prepare RHEL servers"
    job_type: run
    inventory: "CTF Participant All Table Host"
    project: "RHO CTF 2026"
    playbook: "setup/playbooks/prepare-rhel-targets.yml"
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    allow_simultaneous: true
    credentials:
      - "CTF Participant Host"

  - name: "Prepare OpenShift"
    job_type: run
    inventory: "CTF Participant All Table Host"
    ask_inventory_on_launch: true
    project: "RHO CTF 2026"
    playbook: "setup/playbooks/prepare-ocp.yml"
    execution_environment: Custom RHO EE
    ask_variables_on_launch: true
    ask_extra_vars: true
    allow_simultaneous: true
    ask_credential_on_launch: true
    credentials:
      - "CTF Participant Host"


controller_launch_jobs:
  - name: "Deploy CTFd and Gitea"
    wait: true

