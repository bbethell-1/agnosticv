# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - host_satellite_repositories
    - host_common_packages
    - rhpds.ctf.infra
  bastions:
    - bastion
    - agnosticd.cloud_vm_workloads.control_user
    - agnosticd.cloud_vm_workloads.asset_injector
# post_software_workloads:
#   bastions:
#     - rhpds.ansible_automation_platform.configuration

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Call role host_common_packages
# -------------------------------------------------------------------
install_common_packages: false
host_common_packages_update_all: false

bastion_host_packages:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible

node_host_packages:
  - skopeo
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget

# Extra packages set dynamically based on group membership
host_common_packages_extra: >-
  {{
    bastion_host_packages
     if 'bastions' in group_names
      else
        node_host_packages if ('bastions' not in group_names and 'controllers' not in group_names)
          else
              []
  }}

# -------------------------------------------------------------------
# Workload: bastion
# -------------------------------------------------------------------
install_bastion: true
bastion_setup_student_user: true
bastion_student_user_name: lab-user
bastion_student_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: "{{ bastion_student_user_name }}"
student_password: "{{ bastion_student_user_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ bastion_student_user_password }}"
control_user_private_group: "{{ omit }}"
control_user_ssh_config: ./files/ssh_config.j2

# Disable control_user's user_data reporting (bastion role handles it)
control_user_enable_user_data: false

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.asset_injector
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Create SSH config for lab-user to easily SSH to nodes
    type: content
    dest: /home/{{ bastion_student_user_name }}/.ssh/config
    owner: "{{ bastion_student_user_name }}"
    group: "{{ bastion_student_user_name }}"
    mode: "0600"
    content: |
      # SSH config for easy access to nodes
      Host registry target
          User {{ ansible_user }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

# Set asset_injector_assets based on group membership
asset_injector_assets: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names else
    []
  }}

# -------------------------------------------------------------------
# Workload: rhpds.ansible_automation_platform.configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "https://controller.{{ subdomain }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "ansible123!"
ansible_automation_platform_configuration_verify_ssl: false
ansible_automation_platform_configuration_create_controller_token: false
ansible_automation_platform_configuration_generate_ocp_token: false

controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"


aap_configuration_dispatcher_roles:
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  # - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  # - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  # - {role: controller_projects, var: controller_projects, tags: controller_projects}
  # - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}
  # - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}

