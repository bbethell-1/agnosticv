    state: present

  - name: "Platform EE CTF"
    description: "Platform EE CTF"
    image: quay.io/mknittel/rh-ctf-platform:1.0.1
    pull: "missing"
    state: present


controller_projects:
  - name: "Demo Project"
    organization: Default
    state: absent

  - name: "RHO CTF 2026"
    description: "CTF Leader Board ctfd setup repo"
    organization: "Default"
    credential: "RHO CTF Repo Cred"
