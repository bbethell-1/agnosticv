  - name: "ctfdashboard"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ default_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "ctfdashboards"
      - key: "ostype"
        value: "linux"
    services:
      - name: ctfdashboard
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: ctfdashboard-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: ctfdashboard-443
          - port: 3000
            protocol: TCP
            targetPort: 3000
            name: ctfdashboard-3000
          - port: 8000
            protocol: TCP
            targetPort: 8000
            name: ctfdashboard-8000
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: ctfdashboard-8443
          - port: 8501
            protocol: TCP
            targetPort: 8501
            name: ctfdashboard-8501
    routes:
      - name: ctfdashboard-443
        host: ctfdashboard
        service: ctfdashboard
        targetPort: 443
        tls: true
      - name: ctfdashboard-3000
        host: gitea
        service: ctfdashboard
        targetPort: 3000
        tls: true
        tls_termination: edge
      - name: ctfdashboard-8000
        host: ctfd
        service: ctfdashboard
        targetPort: 8000
        tls: true
        tls_termination: edge

  - name: misc
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: false
    floating_ip: false
    image: "{{ default_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
