        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: misc-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: misc-443
    routes:
      - name: misc-443
        host: misc
        service: misc
        targetPort: 443
        tls: true

  - name: audit
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: false
    floating_ip: false
    image: "{{ default_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "audits"
      - key: "ostype"
        value: "linux"
    services:
