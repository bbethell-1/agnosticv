    organization: Default
    credential_type: Machine
    inputs:
      username: "lab-user"
      ssh_key_data: "{{ ctf_ssh_private_key }}"
      become_method: sudo

  - name: "CTF Leader Board Host"
    description: "Machine Credential with become_method for CTF Leader Board hosts"
    organization: Default
    credential_type: Machine
    inputs:
      username: "cloud-user"
      ssh_key_data: "{{ lookup('file', hostvars.localhost.ssh_provision_key_path) }}"
      become_method: sudo

  - name: "RHO CTF Repo Cred"
    description: "RHO CTF Repo Cred"
    organization: Default
