  - name: "ctfdashboard"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ default_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "ctfdashboards"
      - key: "ostype"
        value: "linux"
    services:
      - name: ctfdashboard
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: ctfdashboard-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: ctfdashboard-443
          - port: 8000
            protocol: TCP
            targetPort: 8000
            name: ctfdashboard-8000
          - port: 8443
            protocol: TCP
            targetPort: 8443
            name: ctfdashboard-8443
          - port: 8501
            protocol: TCP
            targetPort: 8501
            name: ctfdashboard-8501
    routes:
      - name: ctfdashboard-443
        host: ctfdashboard
        service: ctfdashboard
        targetPort: 443
        tls: true

  - name: misc
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: false
    floating_ip: false
    image: "{{ default_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "miscs"
      - key: "ostype"
        value: "linux"
    services:
      - name: misc
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: misc-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: misc-443
    routes:
      - name: misc-443
        host: misc
        service: misc
        targetPort: 443
        tls: true

  - name: audit
    count: 1
    unique: true
    public_dns: false
    dns_loadbalancer: false
    floating_ip: false
    image: "{{ default_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "audits"
      - key: "ostype"
        value: "linux"
    services:
      - name: audit
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: audit-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: audit-443
          - port: 514
            protocol: TCP
            targetPort: 514
            name: audit-514
          - port: 514
            protocol: UDP
            targetPort: 514
            name: audit-udp-514
    routes:
      - name: audit-443
        host: audit
        service: audit
        targetPort: 443
        tls: true

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ctf.git
      type: git
      version: main
  # roles:
  #   - name: rh1-lab30-ctf-participants-ar
  #     src: https://github.com/opentraining-labs-customizations/rh1-lab30-ctf-participants-ar.git
  #     version: 1.0.2
  #   - name: rh1-lab30-ctf-ocp-ar
  #     src: https://github.com/opentraining-labs-customizations/rh1-lab30-ctf-ocp-ar.git
