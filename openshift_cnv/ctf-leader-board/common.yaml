---
# -------------------------------------------------------------------
# --- Catalog: ctf-leader-board
# --- Catalog Item: CTF Leader Board
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#includes/access-restriction-rh1-2026-devs.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_2' }}"

# -------------------------------------------------------------------
# Instances to deploy
# -------------------------------------------------------------------
# ------------------------
# Instance Images
# ------------------------
bastion_instance_image: rhel-9.6
default_instance_image: rhel-10.0
controller_instance_image: aap-2.6-2-ceh-20251103

default_rootfs_size: 50Gi
controller_rootfs_size: 100Gi

# ------------------------
# Instances (VMs)
# ------------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ default_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
    routes:
      - name: bastion-443
        host: bastion
        service: bastion
        targetPort: 443
        tls: true

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 64G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
