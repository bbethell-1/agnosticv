# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/num-users-salesforce.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift-ocpv-configs.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
# Old IBM vCenter
# include /includes/secrets/vmware-ibm-access.yaml
# New IBM vCenter
#include /includes/secrets/vmware-ibm-rs00-access.yaml

# Move to prod.yaml once that's available
# #include /includes/secrets/openshift-sandbox-ocpv01-sa.yml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.15"
ocp4_installer_use_dev_preview: false
# ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/fast-4.16/openshift-install-linux.tar.gz
# ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/fast-4.16/openshift-client-linux.tar.gz

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.3

ai_control_plane_cores: 8
ai_control_plane_memory: 16Gi
worker_instance_count: 3
ai_workers_memory: 32Gi

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_external_odf
- ocp4-workload-nfs-provisioner
- ocp4_workload_authentication
#- ocp4_workload_le_certificates
- ocp4_workload_cert_manager
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_nmstate
- ocp4_workload_metallb
- ocp4_workload_minio
- ocp4_workload_oadp
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware
- ocp4_workload_ansible_automation_platform
- automation_platform_loader
# Other open questions:
# - Network.
#   E.g. https://github.com/redhat-cop/agnosticd/blob/move_virt_to_ibm/ansible/configs/experience-ocpvirt/files/configure_nodenetworkconfigurationpolicy.sh
# - AAP install and configuration (https://issues.redhat.com/browse/GPTEINFRA-9388)
- ocp4_workload_showroom

# --- Student Workloads (YAML List)
student_workloads: []

remove_workloads:
- ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# ocp4_workload_ansible_automation_platform
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
ocp4_workload_ansible_automation_platform_subscription_channel: "stable-2.4"
ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
  inject: true

