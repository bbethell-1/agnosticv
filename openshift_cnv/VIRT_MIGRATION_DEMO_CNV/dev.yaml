#vmware_host: "{{ hostvars['localhost']['vcenter_hostname'] }}"
#vmware_username: "{{ hostvars['localhost']['vcenter_student_username'] }}@{{ vcenter_domain }}"
#vmware_password: "{{ hostvars['localhost']['vcenter_student_password'] }}"
