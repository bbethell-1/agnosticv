---
# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

aap_auth:
  controller_host: "aap-aap.apps.cluster-{{ guid }}.{{ cluster_dns_zone }}"
  controller_username: admin
  controller_password: "{{ common_password }}"
  controller_verify_ssl: false

vmware_host: "{{ hostvars['localhost']['vcenter_hostname'] }}"
vmware_username: "{{ hostvars['localhost']['vcenter_student_username'] }}@{{ vcenter_domain }}"
vmware_password: "{{ hostvars['localhost']['vcenter_student_password'] }}"

#vmware_username: "{{ ocp4_workload_virt_roadshow_vmware_vcenter_user }}@{{ vcenter_domain }}"
#vmware_password: "{{ ocp4_workload_virt_roadshow_vmware_vcenter_user_password }}"
#vmware_host: "{{ vcenter_hostname }}"
#vmware_host: "{{ hostvars['localhost']['vcenter_hostname'] }}"
#vmware_username: "{{ hostvars['localhost']['vcenter_student_username'] }}@{{ vcenter_domain }}"
#vmware_password: "{{ hostvars['localhost']['vcenter_student_password'] }}"
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      # ocpv01dev is currently full, use prod
      purpose: prod
      virt: "yes"
  deployer:
    scm_ref: development
