---
#include /includes/catalog-icon-project-dance.yaml

#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml
#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/zerossl.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml
#include /includes/secrets/demosat-rhel-9-10.0-latest.yaml

# -------------------------------------------------------------------
# --- Catalog Item: ETX RHADS (Red Hat Advanced Developer Suite)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
env_type: multi-cloud-base-infra
cloud_provider: openshift_cnv
software_to_deploy: none

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user
student_name: lab-user

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
rhel_instance_image: rhel-10.0
rootfs_size_rhel: 50Gi
node_name: rhads-node
pv_size_node: 8Gi

openshift_cnv_legacy_routes: true

instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: 100Gi
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-https
    routes:
      - name: bastion-https
        host: bastion
        service: bastion
        targetPort: 443
        tls: true

  - name: "{{ node_name }}"
    count: 3
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel_instance_image }}"
    memory: 16G
    cores: 8
    image_size: "{{ rootfs_size_rhel }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhads_nodes"
      - key: "ostype"
        value: "linux"
    services:
      - name: node-http
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: node-http
      - name: node-https
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: node-https
    routes:
      - name: node-http
        host: node
        service: node-http
        targetPort: 80
        tls: false
      - name: node-https
        host: node
        service: node-https
        targetPort: 443
        tls: true
    disks:
      - metadata:
          name: "{{ node_name }}{{ guid }}"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}1"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"
      - metadata:
          name: "{{ node_name }}{{ guid }}2"
        spec:
          source:
            blank: {}
          pvc:
            accessModes:
              - ReadWriteMany
            volumeMode: Block
            resources:
              requests:
                storage: "{{ pv_size_node }}"

# -------------------------------------------------------------------
# Common Packages for RHEL 10 nodes
# -------------------------------------------------------------------
common_packages_el10:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - golang
  - docker
  - kubectl
  - helm
  - oc

# -------------------------------------------------------------------
# Network Configuration
# -------------------------------------------------------------------
network_config:
  bastion_ports:
    - 22
    - 443
    - 80
  node_ports:
    - 443
    - 8080
    - 9090

# -------------------------------------------------------------------
# Storage Configuration
# -------------------------------------------------------------------
storage_config:
  default_storage_class: "{{ storage_class | default('local-storage') }}"
  persistent_volumes: true
  backup_enabled: true

# -------------------------------------------------------------------
# Security Configuration
# -------------------------------------------------------------------
security_config:
  tls_enabled: true
  certificate_authority: "{{ ca_cert | default('self-signed') }}"
  firewall_rules:
    - port: 443
      protocol: tcp
      source: "0.0.0.0/0"
    - port: 22
      protocol: tcp
      source: "0.0.0.0/0"

# -------------------------------------------------------------------
# Infra workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - create_ssh_provision_key
  all:
    - set_env_authorized_key
    - set-repositories
    - bastion-student-user
  bastions:
    - common
    - bastion-base
    - user-create-ansible-service-account
    - asset_injector

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: set_env_authorized_key
# -------------------------------------------------------------------
set_env_authorized_key: true
env_authorized_key: "{{ guid }}key"
ansible_ssh_private_key_file: ~/.ssh/{{ env_authorized_key }}.pem
ansible_service_account_user_ssh_config: ssh_config.j2

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
student_password: "{{ common_password }}"

agd_install_bastion_base: true
agd_install_common: true
agd_bastion_packages:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree
  - runc

# -------------------------------------------------------------------
# Role: ansible_service_account
# -------------------------------------------------------------------
ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - description: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  workshop_cockpit_url: "https://rhads-node1.{{ subdomain }}"
  workshop_cockpit_user_name: "{{ student_name }}"
  workshop_cockpit_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: "https://github.com/rhpds/showroom-lb1136-rhel-10-hol.git"
showroom_git_ref: main
showroom_user: showroom
showroom_ui: default
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_tab_services:
  - double_tty

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"
showroom_ttys_enable_tmux: false
showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 9baa5d4e-4a79-4c9e-a18e-5222b51a635f
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: multi-cloud-base-infra
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "ETX RHADS"
    category: Labs
    multiuser: false
    keywords:
      - etx
      - rhel
      - rhel10
      - ads
      - rhads
    labels:
      Provider: RHDP
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Cloud
    reportingLabels:
      primaryBU: ETX
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com
    sme:
      - name: Andrew Block
        email: ablock@redhat.com
    instructions:
      - name: Andrew Block
        email: ablock@redhat.com
