---
purpose: development

bastion_memory: 256Gi
bastion_rootfs_size: 400Gi
project_tag: "{{ env_type }}-{{ guid }}"

install_student_user: true
student_name: lab-user
student_sudo: true
student_password: "{{ common_password }}"

install_common: false
install_bastion: false
config_user_preferred_python: false

software_workloads:
  bastions:
  - ocp4_workload_telco_hypershift_lab

inventory_groups: []

__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpvdev01
        enum:
        - ocpv03
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpvdev01
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      name: "{{ job_vars.ocpv_cluster }}"
      virt: "yes"
    quota:
      requests.storage: "2600Gi"
