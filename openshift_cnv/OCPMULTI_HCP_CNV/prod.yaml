---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production
hcp_cluster_version: "{{ ocp4_installer_version }}"

hcp_etcd_storage_class: "hostpath-csi"
#hcp_worker_autoscale: true
#hcp_worker_instance_min_count: 3
#hcp_worker_instance_max_count: 5
infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    parameters:
      - name: hcp_worker_memory
        description: OpenShift worker memory size
        formLabel: OpenShift worker memory size
        openAPIV3Schema:
          type: string
          default: 32Gi
          enum:
            - 32Gi
            - 64Gi
      - name: ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.17'
          enum:
            - '4.12'
            - '4.14'
            - '4.15'
            - '4.16'
            - '4.17'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      alias: "virtcluster"
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
      cloud_selector:
        cloud: cnv
        purpose: "prod"
        virt: "yes"
        hcp: "no"
    - kind: OcpSandbox
      var: sandbox_hcp
      namespace_suffix: ocp4-cluster
      alias: "hcpcluster"
      cluster_condition: child('virtcluster')
      cloud_selector:
        cloud: cnv
        hcp: "yes"
  deployer:
    scm_ref: vhcp
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-10-28
      pull: missing
