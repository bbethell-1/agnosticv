---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
hcp_cluster_version: "4.18.9"
odf_channel: "stable-4.18"

hcp_etcd_storage_class: "hostpath-csi"
hcp_worker_memory: 16Gi
worker_instance_count: 2
#hcp_worker_autoscale: true
#hcp_worker_instance_min_count: 3
#hcp_worker_instance_max_count: 5
infra_workloads:
  - ocp4_workload_external_odf
  - ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv07
          enum:
            - ocpv04
            - ocpv05
            - ocpv06
            - ocpv07
            - ocpvdev01
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      alias: A
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
      cloud_selector:
        cloud: cnv
        purpose: "prod"
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
        hcp: "no"
    - kind: OcpSandbox
      var: sandbox_hcp
      namespace_suffix: ocp4-cluster
      alias: B
      cloud_selector:
        purpose: "prod"
        hcp: "yes"
      cluster_condition: "child('A')"
  deployer:
    scm_ref: vhcp
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-10-28
      pull: missing
