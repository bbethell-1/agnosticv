---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_cluster_version: "4.15"

nfs_provisioner_nfs_server_hostname: "{{ openshift_cnv_nfs_server }}"
nfs_provisioner_server_directory: "{{ openshift_cnv_nfs_path }}"

#hcp_worker_autoscale: true
#hcp_worker_instance_min_count: 3
#hcp_worker_instance_max_count: 5

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenShift Container Platform Cluster using HCP on CNV
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - ocp4
      - ocp415
      - ocp414
      - cnv
      - cnvocp
      - ocpcnv
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '94'
    multiuser: true
    parameters:
      - name: hcp_worker_memory
        description: OpenShift worker memory size
        formLabel: OpenShift worker memory size
        openAPIV3Schema:
          type: string
          default: 8Gi

      - name: hcp_worker_cores
        description: OpenShift cores count
        formLabel: OpenShift cores count
        openAPIV3Schema:
          type: integer
          default: 8

      - name: worker_instance_count
        description: OpenShift worker count
        formLabel: OpenShift worker count
        openAPIV3Schema:
          type: integer
          default: 2

      - name: ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.16'
          enum:
            - '4.16'
            - '4.15'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version

  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
        hcp: "yes"
  deployer:
    scm_ref: ocp4hcpocpvirt
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
