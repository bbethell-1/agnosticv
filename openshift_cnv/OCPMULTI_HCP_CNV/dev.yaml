---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ai_cluster_version: "4.16"

hcp_etcd_storage_class: "hostpath-csi"
hcp_worker_memory: 8Gi
#hcp_worker_autoscale: true
#hcp_worker_instance_min_count: 3
#hcp_worker_instance_max_count: 5

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
      - name: ocpv_cluster
        description: OCPV cluster where to deploy
        formLabel: OCPV cluster
        required: true
        openAPIV3Schema:
          type: string
          default: ocpv04
          enum:
            - ocpv01
            - ocpv02
            - ocpv03
            - ocpv04
            - ocpv05
            - ocpvdev01

  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      quota:
        limits.cpu: "128"
        requests.cpu: "128"
      cloud_selector:
        cloud: cnv
        name: "{{ job_vars.ocpv_cluster }}"
        virt: "yes"
        hcp: "yes"

  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-10-28
      pull: missing
