purpose: development
hcp_cluster_version: 4.18.8
odf_channel: stable-4.18
hcp_etcd_storage_class: hostpath-csi
hcp_worker_memory: 16Gi
worker_instance_count: 2
infra_workloads:
- ocp4_workload_external_odf
- ocp4_workload_cert_manager
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    parameters:
    - name: ocpv_cluster
      description: OCPV cluster where to deploy
      formLabel: OCPV cluster
      required: true
      openAPIV3Schema:
        type: string
        default: ocpv07
        enum:
        - ocpv04
        - ocpv05
        - ocpv06
        - ocpv07
        - ocpvdev01
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: vhcp
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    alias: A
    quota:
      limits.cpu: '128'
      requests.cpu: '128'
    cloud_selector:
      cloud: cnv
      virt: 'yes'
      hcp: 'no'
  - kind: OcpSandbox
    var: sandbox_hcp
    namespace_suffix: ocp4-cluster
    alias: B
    cloud_selector:
      hcp: 'yes'
    cluster_condition: child('A')
  deployer:
    scm_ref: vhcp
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-10-28
      pull: missing
