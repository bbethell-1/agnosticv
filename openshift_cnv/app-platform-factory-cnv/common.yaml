---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Service Enablement: App Platform Software Factory
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
config: openshift-workloads
cloud_provider: none
clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_api_key }}"

num_users: 0
tag: main

# -------------------------------------------------------------------
# Pool sizing — 5 workers × 16 CPU × 30Gi per node
# -------------------------------------------------------------------
openshift_cnv_scale_cluster: true
worker_instance_count: 5
ai_workers_cores: 16
ai_workers_memory: 30Gi

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: https://github.com/rhpds/assisted_installer.git
    type: git
    version: v0.0.9
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.8
  # Lab automation collection — TBD once repo is created
  # - name: https://github.com/rhpds/etx-app-platform-automation
  #   type: git
  #   version: "{{ tag }}"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits'])
  }}

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
workloads:
- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom
# New workloads (Dev Spaces, Red Hat Developer Hub, GitLab CI) — TBD

remove_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_num_users: 0

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.20
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: 250m
ocp4_workload_openshift_gitops_controller_requests_memory: 1Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi
ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "4"
ocp4_workload_openshift_gitops_repo_limits_memory: 4Gi

# -------------------------------------------------------------------
# Lab GitOps repo
# -------------------------------------------------------------------
ocp4_workload_app_platform_gitops_repo: https://github.com/rhpds/service-enablement-app-platform-factory-gitops
ocp4_workload_app_platform_gitops_repo_ref: main

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# Creates the etx-bootstrap-infra ArgoCD Application which renders
# etx-infra-app/migrated-source/bootstrap (Helm chart). That chart
# self-spawns the platform layer (etx-control-plane) and all
# enabled operator workloads. deployer.domain/apiUrl/guid are
# injected automatically by the workload from cluster facts.
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: "{{ ocp4_workload_app_platform_gitops_repo }}"
ocp4_workload_gitops_bootstrap_repo_revision: "{{ ocp4_workload_app_platform_gitops_repo_ref }}"
ocp4_workload_gitops_bootstrap_application_name: etx-bootstrap-infra
ocp4_workload_gitops_bootstrap_repo_path: etx-infra-app/migrated-source/bootstrap
ocp4_workload_gitops_bootstrap_namespace: openshift-gitops
ocp4_workload_gitops_bootstrap_application_project: default

# Enable ETX operator workloads via Helm values (all disabled by default in the chart)
ocp4_workload_gitops_bootstrap_helm_values:
  keycloakOperator:
    enabled: true
  vaultSecretsOperator:
    enabled: true
  quayOperator:
    enabled: true
  platformValues:
    keycloakEtxLab:
      enabled: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rh-etx-app-platform/etx_app_showroom_content
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4766d61a-f933-4fdf-9ba3-9b8131c8fd2d
  anarchy:
    namespace: babylon-anarchy-0
  owners:
    maintainer:
    - name: Prakhar Srivastava
      email: psrivast@redhat.com
    - name: Mitesh Sharma
      email: mitsharm@redhat.com
