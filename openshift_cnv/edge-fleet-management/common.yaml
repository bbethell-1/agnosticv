---
# -------------------------------------------------------------------
# --- Catalog: Production
# --- Catalog Item: Device Edge Fleet Management with Red Hat Edge Manager (Tech Preview)
# --- Notes: Origin of this Workshop is Summit 2025
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

#include /includes/parameters/showroom-ocp-defaults.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift_assisted_installer_icr.yaml

#include /includes/secrets/dynamic-dns.yaml
#include /includes/secrets/acme-bifrost.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_assisted
cloud_provider: openshift_cnv

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18.8"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

master_instance_count: 3
worker_instance_count: "{{ 0 if master_instance_count | int == 1 else [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max }}"

ai_control_plane_cores: 16
ai_control_plane_memory: "{{ '64Gi' if master_instance_count | int == 1 else '32Gi' }}"

ai_workers_memory: 32Gi

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_external_odf
  - ocp4_workload_authentication
  - ocp4_workload_openshift_gitops
  - ocp4_workload_web_terminal
  - ocp4_workload_kubevirt
  - ocp4_workload_oadp_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
num_users: 2
admin_password: >-
  {{
    lookup('password', output_dir ~ '/admin_password length=12 chars=ascii_letters,digits')
  }}
# user_password: >-
#   {{
#     lookup('password', output_dir ~ '/user_password length=12 chars=ascii_letters,digits')
#   }}
# TODO: Change this back to randomized password
user_password: edgeLB2517

ocp4_workload_user_base: user
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_02_24
# -------------------------------------------------------------------
# Workload: ocp4_workload_external_odf
# -------------------------------------------------------------------
odf_channel: stable-4.18

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
# Change this back to randomized password after Summit
# Added for ease of use with mobile devices
ocp4_workload_authentication_htpasswd_user_password: "{{ user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kubevirt_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 8Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "4"
ocp4_workload_openshift_gitops_repo_limits_memory: 4Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: "[name,groups]"
ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
# ocp4_workload_openshift_gitops_kustomize_plugin_env:
# - name: MY_VAR
#   value: myValue

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_channel: stable
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_deploy_gitea_instance: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/edge-fleet-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

# 3scale requires RWX storage, so disable it for now.
ocp4_workload_gitops_bootstrap_helm_values:
  admin_password: "{{ admin_password }}"
  user:
    count: "{{ num_users }}"
    prefix: "{{ ocp4_workload_user_base }}"

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/edge-fleet-showroom
ocp4_workload_showroom_content_git_repo_ref: v1.1.0
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.2.1
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: a14c58c1-90c9-4842-8c70-322336f7ee2e
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
    - kind: DNSSandbox
      annotations:
        prefix: cluster
      cloud_selector:
        provider: ddns
        domain: "dyn.redhatworkshops.io"
      var: dns_sandbox
    - kind: SSLSandbox
      cloud_selector:
        purpose: production
      var: ssl_sandbox
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: prod
        virt: "yes"
      quota:
        requests.storage: "4000Gi"
        limits.cpu: "512"
        requests.cpu: "512"
        limits.memory: "1000Gi"
        requests.memory: "1000Gi"
  anarchy:
    namespace: babylon-anarchy-6
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Device Edge Fleet Management with Red Hat Edge Manager (Tech Preview)"
    workshopLabUiRedirect: true
    category: Workshops
    multiuser: true
    keywords:
      - openshift
      - ocp
      - opensfhit Virtualization
      - ocp edge
      - ocp cnv
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 122
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms
  owners:
    maintainer:
      - name: Judd Maltin
        email: judd@redhat.com
      - name: Amrinder Singh
        email: amrsingh@redhat.com
      - name: Sarvesh Pandit
        email: sapandit@redhat.com
    sme:
      - name: Josh Swanson
        email: jswanson@redhat.com
      - name: Ken Osborn
        email: kosborn@redhat.com
    instructions:
      - name: Ken Osborn
        email: kosborn@redhat.com
  tower:
    timeout: 21600
