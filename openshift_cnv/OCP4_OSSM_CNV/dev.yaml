# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
# ocp4_installer_version: "4.18"

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/redhat-gpte-devopsautomation/ossm-labs
ocp4_workload_gitops_bootstrap_repo_revision: helm
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap
ocp4_workload_gitops_bootstrap_health_retries: 5

ocp4_workload_gitops_bootstrap_helm_values:
  user: user1
  ossm:
    git:
      revision: helm
    values:
      myKey: myValue1

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
