controller_execution_environments:
  - name: "AWX EE"
    image: quay.io/ansible/awx-ee:24.3.0
    pull: missing

controller_projects:
  - name: "{{ project_name }}"
    organization: "{{ organization }}"
    scm_branch: virt-migration-demo-2.0.0
    scm_clean: 'false'
    scm_delete_on_update: 'false'
    scm_type: git
    scm_update_on_launch: 'true'
    scm_url: https://github.com/rhpds/ocp-virt.git

controller_inventories:
  - name: "OpenShift Virtualization Inventory"
    organization: "{{ organization }}"

controller_inventory_sources:
  - name: OpenShift Virtualization Source
    source: scm
    source_project: "{{ project_name }}"
    source_path: inventory.kubevirt.yml
    inventory: OpenShift Virtualization Inventory
    credential: "kubeconfig"
    execution_environment: "AWX EE"
    organization: "{{ organization }}"
    overwrite: true
    update_on_launch: true
    update_cache_timeout: 0
    wait: true

controller_templates:
  - name: 01 Migrate VMware VMs to OpenShift Virtualization
    job_type: run
    organization: "{{ organization }}"
    inventory: Demo Inventory
    project: "{{ project_name }}"
    playbook: playbook.yml
    credentials:
      - "kubeconfig"
      - "VMware Credentials"
    survey_enabled: true
    survey: >-
      {
        "name": "Basic Survey",
        "description": "Basic Survey",
        "spec": [
          {
            "question_description": "VMware Provider Name",
            "min": 0,
            "default": "vmware",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "provider_name",
            "question_name": "Name of your provider?",
            "type": "text"
          },
          {
            "question_description": "Migration Plan",
            "min": 0,
            "default": "migration-plan",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "plan_name",
            "question_name": "Name of your migration plan?",
            "type": "text"
          },
          {
            "question_description": "Storage Mapping",
            "min": 0,
            "default": "storagemap",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "storagemap_name",
            "question_name": "Name of your storage mapping?",
            "type": "text"
          },
          {
            "question_description": "Network Mapping",
            "min": 0,
            "default": "networkmap",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "networkmap_name",
            "question_name": "Name of your network mapping?",
            "type": "text"
          },
          {
            "question_description": "VM Names",
            "min": 0,
            "default": "",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "user_selected_vm_names",
            "question_name": "What are the names of the VMs to migrate?",
            "type": "textarea"
          }
        ]
      }
    extra_vars:
      vmware_host: "{{ vmware_host }}"
  - name: 02 Provision Linux VMs
    job_type: run
    organization: "{{ organization }}"
    inventory: OpenShift Virtualization Inventory
    project: "{{ project_name }}"
    playbook: provision_vms.yml
    credentials: "kubeconfig"
    survey: {}
    extra_vars:
      ssh_public_key: >-
        ssh-rsa  lab-user@hypervisor
      vm_password: "redhat"
  - name: 03 Add Repositories to RHEL VMs
    job_type: run
    organization: "{{ organization }}"
    inventory: OpenShift Virtualization Inventory
    project: "{{ project_name }}"
    playbook: add_repo.yml
    credentials: "Linux VMs SSH Access"
    limit: namespace_linuxvm
    survey_enabled: true
    survey: >-
      {
        "name": "Repo Survey",
        "description": "Repo Survey",
        "spec": [
          {
            "question_description": "Org ID",
            "min": 0,
            "default": "",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "org_id",
            "question_name": "What is your organization id?",
            "type": "text"
          },
          {
            "question_description": "Activation Key",
            "min": 0,
            "default": "",
            "max": 128,
            "required": true,
            "choices": "",
            "new_question": true,
            "variable": "key",
            "question_name": "What is your activation key?",
            "type": "text"
          }
        ]
      }
    extra_vars: {}
  - name: 04 Configure Lamp Stack Linux VMs
    job_type: run
    organization: "{{ organization }}"
    inventory: OpenShift Virtualization Inventory
    project: "{{ project_name }}"
    playbook: lamp_stack.yml
    limit: namespace_linuxvm
    credentials: "Linux VMs SSH Access"
    survey: {}
    extra_vars: {}
  - name: 05 Configure DevOps Users on Linux VMs
    job_type: run
    organization: "{{ organization }}"
    inventory: OpenShift Virtualization Inventory
    project: "{{ project_name }}"
    playbook: playbook_linuxvm.yml
    limit: namespace_linuxvm
    credentials: "Linux VMs SSH Access"
    survey: {}
    extra_vars: {}

