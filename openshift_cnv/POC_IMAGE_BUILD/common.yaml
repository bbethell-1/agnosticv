---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel8.6-ceph5.yaml
#include /includes/sandbox-api.yaml

# Set to RHPDS or OPENTLC
platform: rhpds

env_type: poc-image-builder
cloud_provider: openshift_cnv

install_student_user: true

lab_instance_image: rhel-8.6
student_name: lab-user

image_type: registry
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_content_antora_playbook: "{{ 'zero-touch-site.yml' if use_zero_touch_theme | bool == true else 'default-size.yml' }}"

ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.4/nookbag-v0.0.4.zip"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"

ocp4_workload_showroom_chart_package_url: "{{ 'https://agonzalezrh.github.io/showroom-deployer' if use_zero_touch_theme | bool == true else 'https://rhpds.github.io/showroom-deployer' }}"
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "{{ '1.4.1' if use_zero_touch_theme | bool == true else '1.3.3' }}"

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
bastion_prefix: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}"
ansible_service_account_user_name: "{{ student_name }}"
ansible_service_account_user_password: "{{ common_password }}"
_showroom_user_data:
  bastion_ssh_command: "ssh {{ ansible_service_account_user_name }}@{{ groups['bastions'][0]  }}"
  bastion_ssh_user_name: "{{ ansible_service_account_user_name }}"
  bastion_ssh_password: "{{ ansible_service_account_user_password }}"
  bastion_public_hostname: "{{ bastion_prefix }}"


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 94988d22-6bc5-4d9f-8e87-30f05c9cd22e
  owners:
    maintainer:
    - name: Alberto Gonzales Rodriguez
      email: josegonz@redhat.com
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: POC Image Builder
    category: Demos
    keywords:
    - ceph
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    parameters:
    - name: ocp4_workload_showroom_content_git_repo
      description: Showroom Link
      formLabel: Showroom
      required: true
      openAPIV3Schema:
        type: string
        default: https://github.com/agonzalezrh/showroom_tpl_zero_rhel

    - name: use_zero_touch_theme
      description: Use Zero Touch theme
      formLabel: Use Zero Touch theme
      openAPIV3Schema:
        default: true
        type: boolean

    - name: bastion_instance_image
      description: Image location to be used for the instance
      formLabel: Image url
      required: true
      openAPIV3Schema:
        type: string
        default: docker://quay.io/rhpds/poc-image-builder-cnv:centos-9-x86_64-mucloma
  deployer:
    type: agnosticd
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
