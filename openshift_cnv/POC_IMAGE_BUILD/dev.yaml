---
#include /includes/secrets/showroom-shared-cluster1.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty

instances:
- name: "{{ bastion_hostname | default('bastion') }}"
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  image_type: registry
  memory: 2G
  cores: 1
  image_size: 20Gi
  tags:
  - key: "AnsibleGroup"
    value: "bastions,showroom"
  - key: "ostype"
    value: "linux"
bastion_userdata: |
    #cloud-config
    write_files:
      - path: /root/config.yaml
        content: |
          - hosts: localhost
            gather_facts: false
            tasks:
            - name: Configure /etc/motd
              blockinfile:
                path: /etc/motd
                content: "welcome to the lab"

    runcmd:
      - yum install -y ansible
      - ansible-playbook /root/config.yaml

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
  deployer:
    scm_ref: poc-image-builder
