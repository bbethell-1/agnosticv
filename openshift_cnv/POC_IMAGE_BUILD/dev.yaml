---
#include /includes/secrets/showroom-shared-cluster1.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_terminal_type: wetty

instances:
- name: "{{ bastion_hostname | default('bastion') }}"
  count: 1
  unique: true
  public_dns: false
  dns_loadbalancer: true
  floating_ip: false
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  image_type: registry
  memory: 2G
  cores: 1
  image_size: 100Gi
  tags:
  - key: "AnsibleGroup"
    value: "bastions,showroom"
  - key: "ostype"
    value: "linux"
  networks:
  - default
  services:
  - name: bastion
    ports:
    - port: 443
      protocol: TCP
      targetPort: 443
      name: bastion-https
  routes:
  - name: bastion-https
    host: bastion
    service: bastion
    targetPort: 443
    tls: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    cloud_selector:
      cloud: cnv
      purpose: dev
      virt: "yes"
  deployer:
    scm_ref: poc-image-builder
