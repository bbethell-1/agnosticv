  - name: "{{ node1_instance_name | default('node1') }}"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel7_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ rhel7_rootfs_size }}"
    tags: "{{ instance_common_tags + instance_node1_tags }}"
    services:
      - name: rhel7
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: rhel7-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: rhel7-443
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: rhel7-8080
    routes:
      - name: rhel7-80
        host: rhel7
        service: rhel7
        targetPort: 80
        tls: false
      - name: rhel7-443
        host: rhel7
        service: rhel7
        targetPort: 443
        tls: true
      - name: rhel7-8080
        host: petapp-rhel7
        service: rhel7
        targetPort: 8080
        tls: false

  - name: "{{ node2_instance_name | default('node2') }}"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel8_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ rhel8_rootfs_size }}"
    tags: "{{ instance_common_tags + instance_node2_tags }}"
    services:
      - name: rhel8
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: rhel8-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: rhel8-443
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: rhel8-8080
    routes:
