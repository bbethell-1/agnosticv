        service: rhel9
        targetPort: 80
        tls: false
      - name: rhel9-443
        host: rhel9
        service: rhel9
        targetPort: 443
        tls: true
      - name: rhel9-8080
        host: petapp-rhel9
        service: rhel9
        targetPort: 8080
        tls: false

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ripu.git
      type: git
      version: main
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: main
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "1.3.1"

# -------------------------------------------------------------------
# Workloads: rhpds.ripu.pet_name_generator
# -------------------------------------------------------------------
# Define name pattern for pet_name_generator
pet_name_generator_separator: "{{ '789'[ansible_loop.index0] }}"
pet_name_generator_lookup: "{{ lookup('community.general.random_pet', separator=pet_name_generator_separator) }}"
pet_name_generator_enable: true
pet_name_generator_instances:
  - node1_instance_name
  - node2_instance_name
  - node3_instance_name

# -------------------------------------------------------------------
# Workloads: rhpds.ripu.cockpit and ansible_naviagtor
# -------------------------------------------------------------------
# Enables configuration of pet hostnames
node1_pet_name: "{{ groups['rhel7_nodes'][0].split('.')[0] }}"
node2_pet_name: "{{ groups['rhel8_nodes'][0].split('.')[0] }}"
node3_pet_name: "{{ groups['rhel9_nodes'][0].split('.')[0] }}"

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_infra_workloads:
  localhost:
    - rhpds.ripu.pet_name_generator

pre_software_workloads:
  all:
    - host_satellite_repositories
  bastions:
    - host_common_packages
    - bastion

software_workloads:
  all:
    - agnosticd.cloud_vm_workloads.control_user
    - agnosticd.cloud_vm_workloads.asset_injector

post_software_workloads:
  nodes:
    - rhpds.ripu.enable_upgrade_repos
  bastions:
    - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
    - infra.aap_configuration.dispatch
    - rhpds.ripu.mcp_server
    - rhpds.ripu.cockpit
    - rhpds.ripu.code_server
    - rhpds.ripu.ansible_navigator
    - rhpds.ripu.setup_workshop

# -------------------------------------------------------------------
# Workload: rhpds.ripu.enable_upgrade_repos
# -------------------------------------------------------------------
# Disable repos by default (0) to prevent conflicts with normal yum operations
# Leapp will enable them on-demand with --enablerepo flag
# Set to 1 if you want repos enabled and ready for immediate use
enable_upgrade_repos_state: 0
enable_upgrade_repos_verify_rhel10: true
enable_upgrade_repos_verify_retries: 3
enable_upgrade_repos_verify_delay: 10

post_software_final_workloads:
  localhost:
    - agnosticd.cloud_vm_workloads.agnosticv_userdata_import
  bastions:
    - agnosticd.showroom.vm_workload_showroom

# -------------------------------------------------------------------
# Workload: host_satellite_repositories
# -------------------------------------------------------------------
install_satellite_repositories: true

# -------------------------------------------------------------------
# Workload: host_common_packages
# -------------------------------------------------------------------
install_common_packages: true
host_common_packages_update_all: false

host_common_packages_extra:
  - at
  - buildah
  - podman
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - python3-pip
  - tree

# -------------------------------------------------------------------
# Workload: bastion
# -------------------------------------------------------------------
install_bastion: true
bastion_setup_student_user: true
bastion_student_user_name: lab-user
bastion_student_user_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.control_user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: "{{ bastion_student_user_name }}"
student_password: "{{ bastion_student_user_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ bastion_student_user_password }}"
control_user_private_group: "{{ omit }}"
control_user_ssh_config: ./files/ssh_config.j2

# Disable control_user's user_data reporting (bastion role handles it)
control_user_enable_user_data: false

# -------------------------------------------------------------------
# Workload: agnosticd.cloud_vm_workloads.asset_injector
# -------------------------------------------------------------------
asset_injector_assets:
  - description: Update sshd_config for password auth
    type: blockinfile
    path: /etc/ssh/sshd_config
    state: present
    marker: "# {mark} Our custom SSH settings via Ansible"
    block: |
      # Our custom SSH settings via Ansible
      ChallengeResponseAuthentication no
      PasswordAuthentication yes
      UsePAM yes

  - description: Restart sshd to pick up new password support configuration
    type: service
    name: sshd
    state: restarted

# -------------------------------------------------------------------
# Role: ansible_automation_platform_configuration
# -------------------------------------------------------------------
# ----------------------
# Additional Vars
# ----------------------
# ripu_project_scm_url: 'https://github.com/redhat-partner-tech/leapp-project'
ripu_project_scm_url: 'https://github.com/rhpds/leapp-project.git'
ripu_project_scm_branch: 'prod'

# ----------------------
# Controller vars
# ----------------------
controller_dependency_check: false
aap_hostname: "https://controller-{{ subdomain_base }}"
aap_username: admin
aap_password: "ansible123!"
aap_validate_certs: false

aap_configuration_dispatcher_roles:
  - {role: controller_license, var: controller_license, tags: controller_license}
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: controller_credential_types, var: controller_credential_types, tags: controller_credential_types}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_host_groups, var: controller_groups, tags: controller_groups}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}
  - {role: controller_job_launch, var: controller_launch_jobs, tags: controller_launch_jobs}

controller_license:
  manifest_url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

gateway_settings:
  SESSION_COOKIE_AGE: 9000

aap_user_accounts:
  - username: "lab-user"
    is_superuser: true
    password: "{{ common_password }}"
    email: "lab-user@redhat.com"
    organizations: "Default"
    first_name: "lab"
    last_name: User

controller_credential_types:
  - name: Splunk HEC Token
    description: Credential to send event data to a Splunk deployment
    kind: cloud
    inputs:
      fields:
        - type: string
          id: splunk_url
          label: Splunk URL
          help_text: URL of the Splunk HTTP Event Collector
        - type: string
          id: splunk_index
          label: Splunk Index
          help_text: Splunk index to which events will be collected
        - type: string
          id: splunk_hectoken
          label: Splunk HEC Token
          secret: true
          help_text: HTTP Event Collector tokens used for Splunk platform authentication
      required:
        - splunk_url
        - splunk_index
        - splunk_hectoken
    injectors:
      extra_vars:
        splunk_url: '{  { splunk_url }}'
        splunk_index: '{  { splunk_index }}'
        splunk_hectoken: '{  { splunk_hectoken }}'

controller_credentials:
  - name: "Controller Credential"
    organization: Default
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "controller-{{ subdomain_base }}"
      username: "lab-user"
      password: "{{ common_password }}"
  - name: "Workshop Credential"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "cloud-user"
      ssh_key_data: "{{ lookup('file', hostvars.localhost.ssh_provision_key_path) }}"
    state: present
  - name: "registry.redhat.io credential"
    organization: Default
    credential_type: "Container Registry"
    inputs:
      host: registry.redhat.io
      username: "{{ registry_credentials_username }}"
      password: "{{ registry_credentials_password }}"
      verify_ssl: true
    state: present
  - name: "Demo Credential"
    credential_type: "Machine"
    state: absent
  - name: "Splunk Credential"
    organization: Default
    credential_type: "Splunk HEC Token"
    description: "Credential to send event data to a Splunk deployment"
    inputs:
      splunk_url: "{{ splunk_url }}"
      splunk_index: "{{ splunk_index }}"
      splunk_hectoken: "{{ splunk_hectoken }}"
    state: "present"

controller_execution_environments:
  - name: "ripu workshop execution environment"
    image: "registry.redhat.io/ansible-automation-platform-23/ee-supported-rhel8:1.0.0-208"
    pull: missing
    credential: "registry.redhat.io credential"
    state: present

controller_configuration_projects_async_delay: 30
controller_projects:
  - name: Project Leapp
    organization: Default
    scm_update_on_launch: false
    scm_update_cache_timeout: 3600
    scm_type: git
    scm_url: "{{ ripu_project_scm_url }}"
    scm_branch: "{{ ripu_project_scm_branch }}"
    default_environment: "ripu workshop execution environment"
  - name: "Demo Project"
    organization: Default
    state: absent

controller_inventories:
  - name: "Workshop Inventory"
    organization: Default
    state: present
  - name: "Demo Inventory"
    organization: Default
    state: absent

controller_hosts:
  - name: "controller"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
    variables:
      ansible_user: rhel
      ansible_password: ansible123!
  - name: "{{ groups['rhel7_nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
  - name: "{{ groups['rhel8_nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
  - name: "{{ groups['rhel9_nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    enabled: true
    state: present

controller_groups:
  - name: control
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "controller"
  - name: web
    inventory: "Workshop Inventory"
    state: present
    hosts: "{{ groups['nodes'] | map('split', '.') | map('first') | list }}"
  - name: ALL_rhel
    inventory: "Workshop Inventory"
    description: All RHEL hosts in the workshop
    state: present
    hosts: "{{ groups['nodes'] | map('split', '.') | map('first') | list }}"
  - name: rhel7
    inventory: "Workshop Inventory"
    description: RHEL 7 hosts in the workshop
    state: present
    hosts:
      - "{{ groups['rhel7_nodes'][0].split('.')[0] }}"
  - name: rhel8
    inventory: "Workshop Inventory"
    description: RHEL 8 hosts in the workshop
    state: present
    hosts:
      - "{{ groups['rhel8_nodes'][0].split('.')[0] }}"
  - name: rhel9
    inventory: "Workshop Inventory"
    description: RHEL 9 hosts in the workshop
    state: present
    hosts:
      - "{{ groups['rhel9_nodes'][0].split('.')[0] }}"

controller_templates:
  - name: "Z / CaC / Controller"
    project: Project Leapp
    playbook: controller_cac.yml
    inventory: Workshop Inventory
    execution_environment: Default execution environment
    credentials:
      - Controller Credential
    extra_vars:
      controller_configuration_projects_async_retries: 60
      controller_configuration_projects_async_delay: 5
  - name: "Demo Job Template"
    organization: Default
    state: absent

controller_launch_jobs:
  - name: "Z / CaC / Controller"
    wait: true
  - name: "UTILITY / Extend partition and resize physical volume"
    wait: true
    extra_vars:
      rhel_inventory_group: ALL_rhel
  - name: "UTILITY / Extend logical volumes and filesystems"
    wait: true
    extra_vars:
      rhel_inventory_group: ALL_rhel
      filesystem_extend_volumes:
        - vg: vg00
          lv: root
          size: 5.5G
  - name: "Z / Ansible Leapp Lab initailization"
    wait: true

# -------------------------------------------------------------------
# Workload: agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  controller_url: "{{ aap_hostname }}"
  controller_username: "{{ student_name }}"
  controller_password: "{{ student_password }}"
  ssh_command: >-
    ssh -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
    {{ student_name }}@{{ openshift_cnv_ssh_address }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  cockpit_url: "https://cockpit-{{ subdomain_base }}"
  cockpit_username: "{{ student_name }}"
  cockpit_password: "{{ common_password }}"
  code_server_url: "https://code-server-{{ subdomain_base }}"
  code_server_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: agnosticd.showroom.vm_workload_showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/automating-ripu-with-ansible-showroom.git
showroom_git_ref: main
showroom_tls_provider: none
showroom_host: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"
showroom_ssh_method: password
showroom_tab_services:
  - single_terminal

showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ student_password }}"
showroom_ssh_host: "{{ openshift_cnv_ssh_address }}"
showroom_ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
showroom_ssh_username: "{{ student_name }}"

# -------------------------------------------------------------------
# LiteLLM virtual key: Configure available AI models
# -------------------------------------------------------------------
ocp4_workload_litellm_virtual_keys_models:
  - openai/granite-3-2-8b-instruct
  - claude-sonnet-4-6
  - gemini-2.5-pro

# -------------------------------------------------------------------
# Standalone MCP server container (runs on bastion, connects to controller)
# -------------------------------------------------------------------
mcp_server_enabled: true
mcp_server_aap_url: "{{ aap_hostname }}"

# Connect Claude Code to MCP server
code_server_mcp_server_url: "http://localhost:8448/mcp"
code_server_aap_gateway_host: "{{ aap_hostname }}"
code_server_aap_gateway_username: "{{ aap_username }}"
code_server_aap_gateway_password: "{{ aap_password }}"
code_server_aap_gateway_verify_ssl: "{{ aap_validate_certs }}"

# -------------------------------------------------------------------
# Code Server: Add Claude Code extension and settings
# -------------------------------------------------------------------
code_server_extension_urls:
  - https://open-vsx.org/api/Anthropic/claude-code/linux-x64/2.1.81/file/Anthropic.claude-code-2.1.81@linux-x64.vsix

# Enable AI proxy to strip unsupported anthropic-beta headers
code_server_install_ai_proxy: true
code_server_proxy_upstream_url: "{{ litellm_api_endpoint }}"
code_server_proxy_upstream_api_key: "{{ litellm_virtual_key }}"

# Enable Claude CLI for terminal usage (uses proxy)
code_server_install_claude_cli: true
code_server_claude_api_base_url: "http://127.0.0.1:4010"
code_server_claude_api_key: "{{ litellm_virtual_key }}"

# Set workspace directory for Code Server
code_server_user_workspace_path: "/home/{{ code_server_user_name }}/ipu-workshop"

code_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.kube": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true,
    "**/.claude": true,
    "**/.mcp-auth": true },
  "security.workspace.trust.enabled": false,
  "claudeCode.disableLoginPrompt": true,
  "extensions.ignoreRecommendations": true,
  "claudeCode.apiConfiguration": {
    "anthropic": {
      "baseURL": "http://127.0.0.1:4010",
      "apiKey": "{{ litellm_virtual_key }}"
    }
  }

