        host: rhel8
        service: rhel8
        targetPort: 80
        tls: false
      - name: rhel8-443
        host: rhel8
        service: rhel8
        targetPort: 443
        tls: true
      - name: rhel8-8080
        host: petapp-rhel8
        service: rhel8
        targetPort: 8080
        tls: false

  - name: "{{ node3_instance_name | default('node3') }}"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ rhel9_instance_image }}"
    memory: 4G
    cores: 2
    image_size: "{{ rhel9_rootfs_size }}"
    tags: "{{ instance_common_tags + instance_node3_tags }}"
    services:
      - name: rhel9
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: rhel9-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: rhel9-443
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: rhel9-8080
    routes:
