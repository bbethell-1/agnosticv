---
# This item is restricted to devs only.
# It should be ordered by regular users using the Virtual CI
# in the `published` directory.
#include /includes/access-restriction-devs-only.yaml
# Testing RIPU upgrade repos with RHEL 7, 8, 9, and 10
#include /includes/catalog-icon-rhel.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/sandbox-api.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/demosat-rhel-7-8-9-10.yaml
#include /includes/secrets/litemaas-master_api.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/secrets/credential_splunk.yaml
# -------------------------------------------------------------------
# --- Catalog Item: Automating RHEL In Place Upgrades with Ansible
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
cloud_provider: openshift_cnv
cloud_provider_version: main
config: cloud-vms-base

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}-{{ guid }}{{ subdomain_base_suffix }}"
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".{{ sandbox_openshift_apps_domain }}"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
subdomain: "{{ guid }}{{ subdomain_base_suffix }}"
ansible_user: cloud-user
remote_user: cloud-user
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_1' }}"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.6
bastion_rootfs_size: 100Gi

# controller_instance_image: base-zero-aap-2.5-container-ce
controller_instance_image: aap-2.6-2-ceh-20251103
controller_rootfs_size: 50Gi

rhel7_instance_image: rhel7-cloud-ci-kvm-2026-03-09-102025
rhel7_rootfs_size: 64Gi

rhel8_instance_image: rhel8-cloud-ci-kvm-2026-03-10-015120
rhel8_rootfs_size: 64Gi

rhel9_instance_image: rhel9-cloud-ci-kvm-2026-03-10-041629
rhel9_rootfs_size: 64Gi

workshop_type: ripu

# -----------------
# Instances tags
# -----------------
instance_common_tags:
  - { key: guid, value: "{{ guid }}" }
  - { key: ansible_workshops, value: "true" }
  - { key: Workshop, value: "{{ guid }}" }
  - { key: Workshop_type, value: "{{ workshop_type }}" }
  - { key: username, value: "cloud-user" }
  - { key: operating_system, value: "rhel" }
  - { key: "ostype", value: "linux" }

instance_node1_tags:
  - { key: Index, value: "1" }
  - { key: AnsibleGroup, value: "nodes,rhel7_nodes" }
  - { key: hostgroup, value: "rhel7_hosts" }
  - { key: color, value: "#d48a00"}
  - { key: Workshop_node1, value: "{{ guid }}-{{ node1_instance_name | default('node1') }}" }
  - { key: short_name, value: "{{ node1_instance_name | default('node1') }}" }
  - { key: os_major_version, value: "7" }
  - { key: ansible_python_interpreter, value: "/usr/libexec/platform-python" }

instance_node2_tags:
  - { key: Index, value: "2" }
  - { key: AnsibleGroup, value: "nodes,rhel8_nodes" }
  - { key: hostgroup, value: "rhel8_hosts" }
  - { key: color, value: "#bf00d4" }
  - { key: Workshop_node2, value: "{{ guid }}-{{ node2_instance_name | default('node2') }}" }
  - { key: short_name, value: "{{ node2_instance_name | default('node2') }}" }
  - { key: os_major_version, value: "8" }
  - { key: ansible_python_interpreter, value: "/usr/libexec/platform-python" }

instance_node3_tags:
  - { key: Index, value: "3" }
  - { key: AnsibleGroup, value: "nodes,rhel9_nodes" }
  - { key: hostgroup, value: "rhel9_hosts" }
  - { key: color, value: "#67d300" }
  - { key: Workshop_node3, value: "{{ guid }}-{{ node3_instance_name | default('node3') }}" }
  - { key: short_name, value: "{{ node3_instance_name | default('node3') }}" }
  - { key: os_major_version, value: "9" }

instance_bastion_tags:
  - { key: AnsibleGroup, value: "bastions,showroom" }
  - { key: Workshop_ansible_1, value: "ansible-1" }
  - { key: short_name, value: "ansible-1" }

# -----------------
# Instance
# -----------------
instances:
  - name: "ansible-1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ bastion_rootfs_size }}"
    tags: "{{ instance_common_tags + instance_bastion_tags }}"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
          - port: 9090
            protocol: TCP
            targetPort: 9090
            name: bastion-9090
    routes:
      - name: bastion-80
        host: ansible-1
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: ansible-1-443
        service: bastion
        targetPort: 443
        tls: true
      - name: bastion-8080
        host: code-server
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge
      - name: bastion-9090
        host: cockpit
        service: bastion
        targetPort: 9090
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
          -----BEGIN CERTIFICATE-----
          MIIF1jCCA76gAwIBAgIUASi34Lss1upPyAS1YsA8eZTJOFAwDQYJKoZIhvcNAQEL
