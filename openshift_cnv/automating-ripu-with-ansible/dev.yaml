---
ripu_project_scm_url: 'https://github.com/rhpds/leapp-project.git'
ripu_project_scm_branch: 'dev01'

# -------------------------------------------------------------------
# Role Variables
# -------------------------------------------------------------------
# pet_name_generator
pet_name_generator_separator: "{{ '789'[ansible_loop.index0] }}"
pet_name_generator_lookup: "{{ lookup('community.general.random_pet', separator=pet_name_generator_separator) }}"
pet_name_generator_enable: true
pet_name_generator_instances:
  - node1_instance_name
  - node2_instance_name
  - node3_instance_name

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_infra_workloads:
  localhost:
    - rhpds.ripu.pet_name_generator

# -----------------
# Instances tags
# -----------------
instance_common_tags:
  - { key: guid, value: "{{ guid }}" }
  - { key: ansible_workshops, value: "true" }
  - { key: Workshop, value: "{{ guid }}" }
  - { key: Workshop_type, value: "{{ workshop_type }}" }
  - { key: username, value: "cloud-user" }
  - { key: operating_system, value: "rhel" }
  - { key: "ostype", value: "linux" }

instance_node1_tags:
  - { key: Index, value: "1" }
  - { key: AnsibleGroup, value: "nodes" }
  - { key: hostgroup, value: "rhel7_hosts" }
  - { key: color, value: "#d48a00"}
  - { key: Workshop_node1, value: "{{ guid }}-{{ node1_instance_name | default('node1') }}" }
  - { key: short_name, value: "{{ node1_instance_name | default('node1') }}" }
  - { key: os_major_version, value: "7" }
  - { key: ansible_python_interpreter, value: "/usr/libexec/platform-python" }

instance_node2_tags:
  - { key: Index, value: "2" }
  - { key: AnsibleGroup, value: "nodes" }
  - { key: hostgroup, value: "rhel8_hosts" }
  - { key: color, value: "#bf00d4" }
  - { key: Workshop_node2, value: "{{ guid }}-{{ node2_instance_name | default('node2') }}" }
  - { key: short_name, value: "{{ node2_instance_name | default('node2') }}" }
  - { key: os_major_version, value: "8" }
  - { key: ansible_python_interpreter, value: "/usr/libexec/platform-python" }

instance_node3_tags:
  - { key: Index, value: "3" }
  - { key: AnsibleGroup, value: "nodes" }
  - { key: hostgroup, value: "rhel9_hosts" }
  - { key: color, value: "#67d300" }
  - { key: Workshop_node3, value: "{{ guid }}-{{ node3_instance_name | default('node3') }}" }
  - { key: short_name, value: "{{ node3_instance_name | default('node3') }}" }
  - { key: os_major_version, value: "9" }

instance_bastion_tags:
  - { key: AnsibleGroup, value: "bastions,showroom" }
  - { key: Workshop_ansible_1, value: "ansible-1" }
  - { key: short_name, value: "ansible-1" }

# -----------------
# Instance
# -----------------
instances:
  - name: "ansible-1"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ bastion_instance_image }}"
    memory: 8G
    cores: 4
    image_size: "{{ bastion_rootfs_size }}"
    tags: "{{ instance_common_tags + instance_bastion_tags }}"
    networks:
      - default
    services:
      - name: bastion
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: bastion-80
          - port: 443
            protocol: TCP
            targetPort: 443
            name: bastion-443
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: bastion-8080
          - port: 9090
            protocol: TCP
            targetPort: 9090
            name: bastion-9090
    routes:
      - name: bastion-80
        host: ansible-1
        service: bastion
        targetPort: 80
        tls: true
        tls_termination: edge
      - name: bastion-443
        host: ansible-1-443
        service: bastion
        targetPort: 443
        tls: true
      - name: bastion-8080
        host: code-server
        service: bastion
        targetPort: 8080
        tls: true
        tls_termination: edge
      - name: bastion-9090
        host: cockpit
        service: bastion
        targetPort: 9090
        tls: true
        tls_termination: edge

  - name: "controller"
    count: 1
    unique: true
    public_dns: false
    floating_ip: false
    image: "{{ controller_instance_image }}"
    memory: 32G
    cores: 8
    image_size: "{{ controller_rootfs_size }}"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      runcmd:
        - sed -i "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
        - systemctl reload sshd
    services:
      - name: controller
        ports:
          - name: controller-443
            port: 443
            protocol: TCP
            targetPort: 443
          - name: controller-5000
            port: 5000
            protocol: TCP
            targetPort: 5000
    routes:
      - name: controller-5000
        host: eda-webhook
        service: controller
        targetPort: 5000
        tls: true
        tls_termination: edge
      - name: controller-443
        host: controller
        service: controller
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        tls_destinationCACertificate: |
