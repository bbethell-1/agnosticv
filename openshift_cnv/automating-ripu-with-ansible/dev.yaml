---
ripu_project_scm_url: 'https://github.com/rhpds/leapp-project.git'
ripu_project_scm_branch: 'dev01'

rhel7_instance_image: rhel7-cloud-ci-kvm-2026-03-09-102025
rhel7_rootfs_size: 50Gi

rhel8_instance_image: rhel8-cloud-ci-kvm-2026-03-10-015120
rhel8_rootfs_size: 50Gi

rhel9_instance_image: rhel9-cloud-ci-kvm-2026-03-10-041629
rhel9_rootfs_size: 50Gi

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ripu.git
      type: git
      version: dev01
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: main

aap_configuration_dispatcher_roles:
  - {role: controller_license, var: controller_license, tags: controller_license}
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: controller_credential_types, var: controller_credential_types, tags: controller_credential_types}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}
  - {role: controller_host_groups, var: controller_groups, tags: controller_groups}
  - {role: controller_projects, var: controller_projects, tags: controller_projects}
  - {role: controller_job_templates, var: controller_templates, tags: controller_job_templates}

controller_credential_types:
  - name: Splunk HEC Token
    description: Credential to send event data to a Splunk deployment
    kind: cloud
    inputs:
      fields:
        - type: string
          id: splunk_url
          label: Splunk URL
          help_text: URL of the Splunk HTTP Event Collector
        - type: string
          id: splunk_index
          label: Splunk Index
          help_text: Splunk index to which events will be collected
        - type: string
          id: splunk_hectoken
          label: Splunk HEC Token
          secret: true
          help_text: HTTP Event Collector tokens used for Splunk platform authentication
      required:
        - splunk_url
        - splunk_index
        - splunk_hectoken
    injectors:
      extra_vars:
        splunk_url: !unsafe '{{ splunk_url }}'
        splunk_index: !unsafe '{{ splunk_index }}'
        splunk_hectoken: !unsafe '{{ splunk_hectoken }}'

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
