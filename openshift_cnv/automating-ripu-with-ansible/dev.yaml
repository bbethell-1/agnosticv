---
ripu_project_scm_url: 'https://github.com/rhpds/leapp-project.git'
ripu_project_scm_branch: 'dev01'

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ripu.git
      type: git
      version: dev01
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: main

controller_launch_jobs:
  - name: "Z / CaC / Controller"
    wait: true
  - name: "UTILITY / Extend partition and resize physical volume"
    wait: true
    extra_vars:
      rhel_inventory_group: ALL_rhel
  - name: "Z / Ansible Leapp Lab initailization"
    wait: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
