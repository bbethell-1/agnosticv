      - name: rhel9-8080
        host: petapp-rhel9
        service: rhel9
        targetPort: 8080
        tls: false

# -------------------------------------------------------------------
# Workloads: rhpds.ripu.cockpit and ansible_naviagtor
# -------------------------------------------------------------------
# Enables configuration of pet hostnames
node1_pet_name: "{{ groups['nodes'][0].split('.')[0] }}"
node2_pet_name: "{{ groups['nodes'][1].split('.')[0] }}"
node3_pet_name: "{{ groups['nodes'][2].split('.')[0] }}"

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/agnosticd/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ripu.git
      type: git
      version: dev01
    - name: https://github.com/agnosticd/showroom.git
      type: git
      version: main

controller_hosts:
  - name: "controller"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
    variables:
      ansible_user: rhel
      ansible_password: ansible123!
  - name: "{{ groups['nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
  - name: "{{ groups['nodes'][1].split('.')[0] }}"
    inventory: "Workshop Inventory"
    enabled: true
    state: present
  - name: "{{ groups['nodes'][2].split('.')[0] }}"
    inventory: "Workshop Inventory"
    enabled: true
    state: present

controller_groups:
  - name: control
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "controller"
  - name: web
    inventory: "Workshop Inventory"
    state: present
    hosts: "{{ groups['nodes'] | map('split', '.') | map('first') | list }}"
  - name: ALL_rhel
    inventory: "Workshop Inventory"
    description: All RHEL hosts in the workshop
    state: present
    hosts: "{{ groups['nodes'] | map('split', '.') | map('first') | list }}"
  - name: rhel7
    inventory: "Workshop Inventory"
    description: RHEL 7 hosts in the workshop
    state: present
    hosts:
      - "{{ groups['nodes'][0].split('.')[0] }}"
  - name: rhel8
    inventory: "Workshop Inventory"
    description: RHEL 8 hosts in the workshop
    state: present
    hosts:
      - "{{ groups['nodes'][1].split('.')[0] }}"
  - name: rhel9
    inventory: "Workshop Inventory"
    description: RHEL 9 hosts in the workshop
    state: present
    hosts:
      - "{{ groups['nodes'][2].split('.')[0] }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
