---
# -------------------------------------------------------------------
# Here's a dummy uuid
# -------------------------------------------------------------------
ripu_dev_uuid: decbeb46-e3c1-4ee1-a4c5-07825d59533d
ripu_project_scm_url: 'https://github.com/rhpds/leapp-project.git'
ripu_project_scm_branch: 'dev01'
showroom_git_repo: https://github.com/rhpds/automating-ripu-with-ansible-showroom.git
showroom_git_ref: dev

# -------------------------------------------------------------------
# Workload: agnosticv_userdata_import
# -------------------------------------------------------------------
agnosticv_importdata:
  controller_url: "{{ aap_hostname }}"
  controller_username: "{{ student_name }}"
  controller_password: "{{ student_password }}"
  ssh_command: >-
    ssh -p {{ hostvars[groups['bastions'][0]].bastion_ssh_port }}
    {{ student_name }}@{{ openshift_cnv_ssh_address }}
  ssh_hostname: "{{ openshift_cnv_ssh_address }}"
  ssh_port: "{{ hostvars[groups['bastions'][0]].bastion_ssh_port }}"
  ssh_username: "{{ student_name }}"
  ssh_password: "{{ common_password }}"
  cockpit_url: "https://cockpit-{{ subdomain_base }}"
  cockpit_username: "{{ student_name }}"
  cockpit_password: "{{ common_password }}"
  code_server_url: "https://code-server-{{ subdomain_base }}"
  code_server_password: "{{ common_password }}"
  rhel7_pet_app_server: "{{ node1_instance_name }}"
  rhel8_pet_app_server: "{{ node2_instance_name }}"
  rhel9_pet_app_server: "{{ node3_instance_name }}"

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/cloud_vm_workloads.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ansible_automation_platform.git
      type: git
      version: main
    - name: https://github.com/rhpds/rhpds.ripu.git
      type: git
      version: dev01
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: main
    - name: "https://github.com/rhpds/rhpds.litellm_virtual_keys.git"
      type: git
      version: "1.3.1"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: main
  sandboxes:
    - kind: OcpSandbox
      namespace_suffix: ocp4-cluster
      cloud_selector:
        cloud: cnv
        purpose: dev
        virt: "yes"
      quota:
        requests.storage: "2000Gi"
