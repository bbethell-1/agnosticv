---
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"
  guid: "{{ guid }}"
  uuid: "{{ uuid }}"
  purpose: "{{ purpose | d('unknown') }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: false
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: ibm-sandbox
