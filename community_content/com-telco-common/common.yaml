---
#include /includes/catalog-icon-openshift.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/zerossl.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/ocp4_ai_offline_token.yaml

# -------------------------------------------------------------------
# Telco Demos
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4_hcp_cnv
cloud_provider: openshift_cnv

num_users: 1

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# CNV Specific
# -------------------------------------------------------------------
bastion_instance_image: rhel-9.5
bastion_cores: 2
bastion_memory: 4Gi

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.8"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

hcp_control_plane_cores: >-
  {{ 8 if worker_instance_count|int <= 10
  else 16 if worker_instance_count|int <= 20
  else 32
  }}
hcp_control_plane_memory: >-
  {{ '16Gi' if worker_instance_count|int <= 10
  else '32Gi' if worker_instance_count|int <= 20
  else '64Gi'
  }}
worker_instance_count: 2

ocp4_network_type: OVNKubernetes

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_04_14

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
# - ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_base: user

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_ec2_region: us-east-2
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ route53_aws_access_key_id }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ route53_aws_secret_access_key }}"
ocp4_workload_cert_manager_ec2_hostedzoneid: "{{ route53_aws_zone_id }}"
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: true

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, admin, role:admin
  g, ssoadmin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rh-telco-tigers/rhpds-bootstrap
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  users: 1 # This is a placeholder value that does nothing for non-multi-user workloads

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c4bcddec-50f0-40f8-8576-9678f62e23de
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-02-14
      pull: missing
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  owners:
    maintainer:
    - name: Nate Stephany
      email: nstephan@redhat.com
    sme:
    - name: Srikanth Valluru
      email: svalluru@redhat.com
  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: ocp4-cluster
    alias: A
    quota:
      limits.cpu: "128"
      requests.cpu: "128"
    cloud_selector:
      cloud: cnv
      purpose: "prod"
      virt: "yes"
      hcp: "no"
  - kind: OcpSandbox
    var: sandbox_hcp
    namespace_suffix: ocp4-cluster
    alias: B
    cloud_selector:
      purpose: "prod"
      hcp: "yes"
    cluster_condition: "child('A')"
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Telco TBD
    category: Demos
    multiuser: false
    keywords:
    - openshift
    - gitops
    - argocd
    - telco
    labels:
      Provider: RH_Community
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      SLA: Community
