---
#include /includes/catalog-icon-rhde.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/Bidyut-github/Podman_Rootless-Workshop-Bookbag.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 82a32f38-5f79-468d-8eb4-123b07f59405
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/Bidyut-github/Podman_Rootless-Workshop-Bookbag
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Podman Rootless Container
    category: Demos
    labels:
      Product_Family: Red_Hat_Cloud
      Provider: RH_Community
      SLA: Community
    parameters: []
  # Components to include in template and catalog item
  components:
  - name: CONVERT-TO-RHEL
    display_name: Convert to RHEL
    item: enterprise/CONVERT_TO_RHEL
  deployer:
    type: null
