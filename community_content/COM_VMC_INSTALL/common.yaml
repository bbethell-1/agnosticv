__meta__:
  deployer:
    type: null
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: VMware Red Hat OpenShift Installation
    category: Demos
    keywords:
    - workshop
    - openshift
    - ocp
    - vmware
    - vsphere
    - vmc
    labels:
      Product_Family: Red_Hat_Cloud
      Provider: RH_Community
      Product: Red_Hat_OpenShift_Container_Platform
      SLA: Community
    multiuser: false
    parameters: []

  # Components to include in template and catalog item
  components:
  - name: sandbox
    display_name: VMware Red Hat OpenShift Installation
    item: vmc/SANDBOX_VMC
