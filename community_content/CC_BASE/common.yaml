---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Sandbox Credentials
# -------------------------------------------------------------------
sandbox_enable_ui: true
agnosticd_open_environment: true
sandbox_user_info_data_enable: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
host_ocp4_installer_set_user_data_kubeadmin_password: true

# Enable admin service account for automated management
openshift_cluster_admin_service_account_enable: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates

# -------------------------------------------------------------------
# Instance Details
# -------------------------------------------------------------------
worker_storage_type: "gp2"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    type: null
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Getting Started with Community Content
    category: Demos
    keywords:
    - community
    - content
    labels:
      Provider: RHDP
    multiuser: false
    parameters:
    - name: cloud_provider
      description: Cloud Provider for Base Environment
      formLabel: Cloud Provider
      required: true
      openAPIV3Schema:
        type: string
        default: ec2
        enum:
        - 'azure'
        - 'ec2'
        - 'equinix_metal'
        - 'gcp'
        - 'osp'
        - 'vmc'
    - name: software_to_deploy
      description: Do you need an OpenShift Cluster?
      formLabel: Install OpenShift?
      required: true
      openAPIV3Schema:
        type: string
        default: openshift4
        enum:
        - 'openshift4'
        - 'none'
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: true
      openAPIV3Schema:
        type: string
        default: '4.12'
        enum:
        - '4.10'
        - '4.11'
        - '4.12'
  components:
  - name: Base CI
    display_name: Base Environment
    item: if (cloud_provider = ec2 && software_to_deploy = none) {
            item = "sandboxes-gpte/SANDBOX_OPEN";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else if (cloud_provider = ec2 && software_to_deploy = openshift4) {
            item = "sandboxes-gpte/SANDBOX_OCP";
          } else {
            Error('Please open a ticket at (https://red.ht/RHPDS-Request) and we will schedule a meeting to discuss requirements. Thanks')
          }
