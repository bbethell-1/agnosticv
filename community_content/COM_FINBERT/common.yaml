---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/num-users-salesforce.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
ocp4_installer_version: "4.11"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type_family: dl1
master_instance_type_size: 24xlarge
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: "d1.24xlarge"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"
worker_storage_type: "nvme"
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: "t3.medium"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp-workload-terminal
- ocp4_workload_le_certificates
- ocp4_workload_workload_monitoring
- ocp4_workload_pipelines
- ocp4_workload_rhods_olm

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
# Create 100 users
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# ---------------------------------------------------------
# OpenShift Serverless
# ---------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_eventing: true
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_serverless_catalog_snapshot_image_tag: v4.10_2022_05_23

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_olm
# -------------------------------------------------------------------
become_override: false
ocp_username: opentlc-mgr
silent: false

ocp4_workload_rhods_olm_install_operator_name: "rhods-operator"
ocp4_workload_rhods_olm_channel_name: "rhods-operator"
ocp4_workload_rhods_olm_operator_subscription_channel: "beta"
ocp4_workload_rhods_olm_channel: "beta"

ocp4_workload_rhods_olm_odh_namespace: "redhat-ods-operator"
ocp4_workload_rhods_olm_applications_namespace: "redhat-ods-applications"
ocp4_workload_rhods_olm_monitoring_namespace: "redhat-ods-monitoring"

ocp4_workload_rhods_olm_namespace_list:
- "{{ ocp4_workload_rhods_olm_applications_namespace }}"
- "{{ ocp4_workload_rhods_olm_monitoring_namespace }}"
- "anonymous"
- "redhat-ods-operator"
- "rhods-notebooks"

ocp4_workload_rhods_olm_catalogsource_name: "addon-managed-odh-catalog"
ocp4_workload_rhods_olm_catalogsource_namespace: "{{ ocp4_workload_rhods_olm_odh_namespace }}"
ocp4_workload_rhods_olm_catalogsource_display_name: "Managed Open Data Hub Operator"
ocp4_workload_rhods_olm_catalog_snapshot_image: "quay.io/modh/qe-catalog-source"
ocp4_workload_rhods_olm_catalog_snapshot_image_tag: "v1180-9"
ocp4_workload_rhods_olm_starting_csv: ""

# used when you are conducting a workshop
# will cause user data to be output
ocp4_workload_rhods_olm_is_workshop: false
ocp4_workload_rhods_olm_workshop_num_users: 10
ocp4_workload_rhods_olm_workshop_username_base: "users"
ocp4_workload_rhods_olm_workshop_password: "openshift"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: FinBERT - AI/ML Natural Language Processing Demo with Intel Habana Gaudi and RHODS
    category: Demos
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      SLA: Community
      Featured_Score: '65'
    multiuser: false
    parameters: []
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel8-latest-ha
  - name: output-dir-s3
    namespace: gpte
