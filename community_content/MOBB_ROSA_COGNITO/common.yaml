---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/secrets/bookbag-shared-410.yaml


# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated
ocp4_installer_version: "4.13"

# Machine type for ROSA worker nodes for RHODS
rosa_machine_type: "m6a.4xlarge"

key_name: opentlc_admin_backdoor
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}
repo_method: file

agnosticd_open_environment: True
sandbox_user_info_messages_enable: False

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds
cloud_provider: ec2


bastion_instance_type: "t2.small"
bastion_instance_image: RHEL91GOLD-latest

# Extra packages to install
common_extra_packages:
- java-11-openjdk-devel
- tzdata-java
- maven

# Enable tektoncd-cli & github-cli
install_tektoncd_cli: true
install_github_cli: true
rosa_setup_cluster_admin_login: true

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
# bookbag_git_repo: https://github.com/grantomation/rosa-mobb-express.git
# bookbag_git_version: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    infra_workloads: ''
    student_workloads: ''
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------

infra_workloads:
- install-command-line-tools
- ocp4_workload_authentication_rosa
- ocp4_workload_opentlc_production
# - ocp4_workload_generate_kubeconfig

# -------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_rosa_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_rosa_user_password: Openshift_1
ocp4_workload_authentication_rosa_admin_password: Openshift_1

# -------------------------------------------------------------------
# OpenTLC Production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false
ocp4_workload_opentlc_production_expose_registry_route: false
ocp4_workload_opentlc_production_set_build_defaults: true


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 8cd85400-f969-401a-a04b-21ab8cf28388
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: hybrid_cloud_aws_azure-ansible2.9-python3.6-2022-07-06
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: MOBB ROSA Workshop - 4 hour (pre-deployed with cognito idp)
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Openshift
      Featured_Score: '68'
    parameters:
    - name: rosa_token
      description: The ROSA Token can be created or downloaded here https://console.redhat.com/openshift/token/rosa
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
    - name: bookbag_git_repo
      description: Git repository for bookbag.
      formLabel: Bookbag Git Repository
      required: false
      openAPIV3Schema:
        type: string
        default: "https://github.com/grantomation/rosa-mobb-express.git"
    - name: bookbag_git_version
      description: Git repository branch/version for bookbag.
      formLabel: Git repository version
      required: false
      openAPIV3Schema:
        type: string
        default: "main"
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 20
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
