---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/agnosticd_open_environment.yaml

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-ocp-wksp

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "MLOps Demo: Data Science & Edge Practice"
    category: Demos
    labels:
      Product_Family: Red_Hat_Cloud
      Provider: RH_Community
      SLA: Community
    parameters:
    - name: master_instance_count
      description: Control Plane Count
      formLabel: Control Plane Count
      required: true
      openAPIV3Schema:
        type: integer
        default: 3
        maximum: 3
        enum:
        - 1
        - 3
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formGroup: Features
      formLabel: OpenShift Version
      required: false
      openAPIV3Schema:
        type: string
        default: '4.12'
        enum:
        - '4.8'
        - '4.9'
        - '4.10'
        - '4.11'
        - '4.12'
        - '4.13'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version

  # Components to include in template and catalog item
  components:
  - name: ocp412-wksp
    display_name: "MLOps Demo: Data Science & Edge Practice"
    item: sandboxes-gpte/OCP412_WKSP

  # This catalog item only consists of components and does not describe
  # anything to provision.
  deployer:
    type: null
