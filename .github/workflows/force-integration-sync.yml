---
name: force-integration-sync

# Manual only, as this will discard any change from open PRs
on: workflow_dispatch

jobs:
  force-merge-into-integration:
    name: Merge master branch into integration
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge master branch into integration branch (Force)
        env:
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
          FORCE_SYNC: true
        run: ./.github/scripts/merge-master-to-integration.sh
        shell: bash

      - name: Remove integration label on all open PR
        env:
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
        run: |
          prs=$(gh pr list --state open --label integration --json number --jq '.[].number')
          for PR in $prs; do
            gh pr edit $PR --remove-label integration
            gh pr comment $PR --body "Integration branch was reset. Rerun the workflow or update the PR to add the change integration again."
            sleep 1
          done
