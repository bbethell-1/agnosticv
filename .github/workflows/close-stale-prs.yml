---
# https://docs.github.com/en/actions/managing-issues-and-pull-requests/closing-inactive-issues
name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  close-pr:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v5
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-issue-label: "stale"
          stale-issue-message: "This PR is stale because it has been open for 5 days with no activity."
          close-issue-message: "This PR was closed because it has been inactive for 5 days since being marked as stale."
          days-before-pr-stale: 5
          days-before-pr-close: 10
          repo-token: ${{ secrets.GITHUB_TOKEN }}
...
