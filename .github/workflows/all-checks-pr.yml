---
name: all-checks-pr

on:
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lfs-warning:
    name: Check size of files in commits
    runs-on: ubuntu-latest
    steps:
      - name: Get Repo Code
        id: get_repo_code
        uses: actions/checkout@v2

      - name: Run lfs-warning
        uses: rhpds/lfs-warning@v3.2
        with:
          token: ${{ secrets.RHPDS_BOT_REPO }} # Optional
          filesizelimit: '80000' # ~80KB

  static-checks:
    name: Static Checks Pull Request
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.x'

    steps:
      - name: Get Repository Code
        id: get_repo_code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4.5.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies

      - name: Install python dependencies
        run: pip install -r .tests/requirements.txt


      - name: Cache agnosticv CLI
        id: cache-agv
        uses: actions/cache@v3
        with:
          path: agnosticv
          key: linux-adm64-v0.8.1

      - if: steps.cache-agv.outputs.cache-hit != 'true'
        name: Install agnosticv CLI
        run: |-
          curl -o agnosticv -L https://github.com/redhat-cop/agnosticv/releases/download/v0.8.1/agnosticv_linux_amd64
          chmod +x agnosticv

      - name: Run yamllint
        run: yamllint -c .yamllint .

      - name: Run static-tests.sh
        env: # Or as an environment variable
          RHPDS_BOT_REPO: ${{ secrets.RHPDS_BOT_REPO }}
          PR: ${{ github.event.number }}
        run: ./.tests/static-tests.sh

  wait-for-agv:
    name: Wait for AgnosticV operator to report back in the PR
    runs-on: self-hosted
    needs:
      - static-checks
      - lfs-warning

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Wait for agnosticv-operator to report back
        env:
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
          PR: ${{ github.event.number }}
        run: |
          exit 0

  e2e-test:
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: false

    needs:
      - wait-for-agv

    uses: ./.github/workflows/e2e-pr.yml
    secrets: inherit
...
