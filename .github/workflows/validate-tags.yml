---
name: validate-promotion-tags
on:
  pull_request:
    branches: [master]
    paths:
      - 'agd_v2/*/prod.yaml'
      - 'agd_v2/*/event.yaml'
      - 'summit-2026/*/prod.yaml'
      - 'summit-2026/*/event.yaml'

jobs:
  validate-tags:
    name: Validate promotion tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Find changed files and validate
        env:
          GH_TOKEN: ${{ secrets.RHPDS_BOT_REPO }}
        run: |
          files=$(gh pr view ${{ github.event.number }} \
            --json files --jq '.files[].path' \
            | grep -E '^(agd_v2|summit-2026)/[^/]+/(prod|event)\.yaml$')
          [ -z "$files" ] && exit 0
          echo "$files" | xargs python scripts/agd-promote.py --validate-pr
