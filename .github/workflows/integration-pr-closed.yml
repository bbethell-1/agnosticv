---
name: integration-pr-closed
on:
  pull_request:
    types:
      - closed

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  revert-commits:
    name: Revert commits in the integration
    # this job will only run if the PR has been closed without being merged
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Revert from integration all commits from this PR
        env:
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
          PR: ${{ github.event.number }}
        run: |-
          set -o pipefail

          git config --local user.email "rhpds-bot@redhat.com"
          git config --local user.name "rhpds-bot"

          git checkout integration
          git pull

          git revert -m 1 \
          --no-edit \
          --no-commit  \
          $(git log --grep="Auto-merge #${PR} " --pretty=reference|cut -d' ' -f1) \
          |& tee -a /tmp/revert.log

          if [ $? != 0 ]; then
            # conflict?
            {
                echo "Cannot revert #${PR} commits:"
                echo
                echo '```'
                cat /tmp/revert.log
                echo '```'
            } > /tmp/comment.md

            gh pr comment ${PR} --body-file /tmp/comment.md
            exit 1
          fi

          if [ $(git diff --cached | wc -c) != 0 ]; then
            git commit -m "Auto-revert #${PR}"
            git push
          fi
