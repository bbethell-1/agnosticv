---
name: integration-sync

on:
  push:
    branches:
      - master

jobs:
  merge-into-integration:
    name: Merge master branch into integration
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge master branch into integration branch
        env:
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
        run: ./.github/scripts/merge-master-to-integration.sh
        shell: bash
