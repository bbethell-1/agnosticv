---
name: integration-sync

on:
  push:
    branches:
      - master

jobs:
  merge-into-integration:
    name: Merge master branch into integration
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge master branch into integration branch
        env:
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
        run: |-
          set -o pipefail

          git config --local user.email "rhpds-bot@redhat.com"
          git config --local user.name "rhpds-bot"

          git checkout integration
          git pull

          # Merge master (sync)

          git merge \
            --no-edit \
            --squash \
            -X theirs \
            "origin/master"

          if [ $(git diff --cached | wc -c) != 0 ]; then
            git commit -m "Auto-merge master into integration"
            git push
          fi
