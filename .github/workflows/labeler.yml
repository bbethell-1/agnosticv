---
name: labeler
on: pull_request

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v4.0.2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true

      - name: Auto approve when 'dev only' label is present
        run: |-
          if gh pr view "${PR_URL}" --json labels --jq '.labels[].name'| grep -qE -e '^dev only$' -e '^desc only$'; then
            gh pr review --approve "$PR_URL"
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
