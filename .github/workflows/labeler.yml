---
name: labeler
on: pull_request

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Get Repository Code
        uses: actions/checkout@v4

      - uses: actions/labeler@v5
        id: label-the-PR
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true

      - name: Auto approve when 'dev only', 'test only', or 'desc only' label is present
        if: >-
          contains(steps.label-the-PR.outputs.all-labels, 'dev only')
          || contains(steps.label-the-PR.outputs.all-labels, 'test only')
          || contains(steps.label-the-PR.outputs.all-labels, 'desc only')
        run: |-
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: "${{ secrets.RHPDS_BOT_REPO }}"
