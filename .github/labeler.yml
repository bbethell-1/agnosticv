---
"dev only":
- any:
  # dev is touched and a description update is fine
  - changed-files:
    - any-glob-to-all-files:
      - '*/**/dev.yaml'
      - '*/**/description.(html|adoc)'

"test only":
- any:
  # test is touched and a description update is fine
  - changed-files:
    - any-glob-to-all-files:
      - '*/**/test.yaml'
      - '*/**/description.(html|adoc)'

"desc only":
- any:
  - changed-files:
    - all-globs-to-all-files: '*/**/description.(html|adoc)'

"description":
- any:
  - changed-files:
    - any-glob-to-any-file:
      - '*/**/description.(html|adoc)'
