---
"dev only":
- changed-files:
  - all-globs-to-all-files:
    - '*/**/dev.yaml'

"test only":
- changed-files:
  - all-globs-to-all-files:
    - '*/**/test.yaml'

"desc only":
- any:
  - changed-files:
    - any-glob-to-all-files:
      - '*/**/description.html'
      - '*/**/description.adoc'

"description":
- any:
  - changed-files:
    - any-glob-to-any-file:
      - '*/**/description.adoc'
