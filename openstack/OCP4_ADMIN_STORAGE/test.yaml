---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload configuration
# -------------------------------------------------------------------
HOMEROOM_IMAGE: ocp4-prod

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  # Set tag prefix here for prod
  agnosticd_git_tag_prefix: ocp4-workload-workshop-admin-storage-test
  idle_after_deploy: 2
  idle_after_start: 4
  secrets:
  - openstack-pink

  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
