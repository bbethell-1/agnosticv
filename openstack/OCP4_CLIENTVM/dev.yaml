---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: development

# The domain that you want to add DNS entries to
osp_cluster_dns_zone: red.osp.opentlc.com

# Instance (Flavor) type
clientvm_instance_type: "2c2g30d"

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  secrets:
  - openstack-red-secret
#  agnosticd_git_tag_prefix: ocp4-clientvm-osp
ceph_cluster: "{{ osp_cluster_dns_zone.split('.')[0] }}"
