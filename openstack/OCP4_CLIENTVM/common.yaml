---
## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
platform: labs

# The name of the agnosticd config to deploy
env_type: ocp-clientvm

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Set the Student Password (usually via command line)
# student_password: secret

# Software Versions
# https://mirror.openshift.com/pub/openshift-v4/clients/ocp/
ocp_clientvm_oc_version: '4.3.1'
# https://mirror.openshift.com/pub/openshift-v4/clients/odo/
ocp_clientvm_odo_version: 'v1.1.0'
# https://mirror.openshift.com/pub/openshift-v4/clients/helm/
ocp_clientvm_helm_version: 'v3.0.0'
# https://github.com/tektoncd/cli/releases
ocp_clientvm_tkn_version: '0.8.0'

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
# Define the FTL Injector Tag
ftl_injector_tag: "v0.17.0"

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: True

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# The dynamic DNS server you will add entries to.
# NOTE: This is only applicable when {{ use_dynamic_dns}} is true
osp_cluster_dns_server: ddns01.opentlc.com

# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  virtualenv: openstack
