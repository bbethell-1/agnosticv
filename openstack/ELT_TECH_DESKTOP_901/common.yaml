---
#include /includes/parameters/requester_username.yaml
# Tech Desktop 901
# Catalog:
# Catalog Item:

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: tech-desktop-901
software_to_deploy: none

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# Platform
platform: labs

# On OpenStack do not use swift
osp_use_swift: false

# If  you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: True
install_ipa_client: false

# -------------------------------------------------------------------

# Common Password

# -------------------------------------------------------------------

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
# Install Student User
install_student_user: true
student_name: "{{ requester_username | regex_replace('@','-') }}"
student_password: "{{ common_password }}"
student_sudo: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
find_ip_query: openstack_servers[?name=='{{ _instance_name }}'].public_v4

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: openstack-ansible-2.9
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
#  meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    virtualenv: openstack-ansible-2.9
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Enterprise Linux 9 - Simple Desktop Application Management Using Flatpak
    category: Labs
    keywords:
    - labs
    - rhel
    - imagebuilder
    - rhelimagebuilder
    - rhel9
    - rhel9imagebuilder
    labels:
      #OpenShift_Version: "4.10"
      Product: Red_Hat_Enterprise_Linux_Server
      Provider: RHPDS
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
