---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: development

agnosticd_git_ref: development
agnosticd_git_repo: https://github.com/tonykay/ansible_agnostic_deployer.git

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

  agnosticd_git_ref: development
  agnosticd_git_repo: https://github.com/tonykay/ansible_agnostic_deployer.git
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
...
