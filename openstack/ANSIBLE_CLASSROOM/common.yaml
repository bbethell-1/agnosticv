---
#include /includes/ansible_control_plane/controller.aap5ao6oghnkg6u4.ansiblecloud.redhat.com.yaml

env_type: ansible-multitier-infra           # Name of config to deploy
cloud_provider: osp                         # Which AgnosticD Cloud Provider to use
platform: labs

virtualenv: openstack-ansible-2.9.12

agnosticv_meta:
  virtualenv: openstack-ansible-2.9.12
  secrets:
    - labsat-secrets
  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    username: student_name
    git_repo: container_service_resource_url

 # This repo data SHOULD migrate to a secret

 # This repo data SHOULD migrate to a secret

repo_method: satellite
satellite_url: labsat-ha.opentlc.com
satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: ansible-advanced-2.0
set_repositories_satellite_ha: true

software_to_deploy: none

install_vscode_server: false # RHEL 8 Support needed in AgnosticD role 2021-02-12

inventory_groups:
  - app_servers
  - load_balancers
  - database_servers

common_packages:
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - git
  - vim-enhanced
  - at
  - ansible
  - tree
  - python3

    #  - python3-pyparsing

# Default instance type

default_instance_type: 2c2g30d

# Default Image

default_image: rhel-8.3
control_instance_image: rhel-8.3
utility_instance_image: rhel-8.3


security_groups:

  - name: WebSG
    rules:
      - name: WebSGHTTPPort
        description: "Allow HTTP port"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebSGHTTPsPort
        description: "Allow HTTPs port"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: HostSGTCP
        description: "Allow everything from HostSG nodes"
        from_port: 1
        to_port: 65535
        protocol: tcp
        from_group: HostSG
        rule_type: Ingress

      - name: HostSGUDP
        description: "Allow everything from HostSG nodes"
        from_port: 1
        to_port: 65535
        protocol: udp
        from_group: HostSG
        rule_type: Ingress

  - name: ClassroomSG
    rules:
      - name: HostClassroomTerminal
        description: "Allow terminal from HostSG nodes"
        from_port: 10080
        to_port: 10080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress


# Environment Instances

instances:
  - name: "control"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image_id: "{{ control_instance_image | default(default_image) }}"
    flavor:
      osp: "{{ bastion_instance_type | default(default_instance_type) }}"
    security_groups:
      - BastionSG
      - WebSG
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"

  - name: utility
    count: 2
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image_id: "{{ utility_instance_image | default(default_image) }}"
    flavor:
      osp: "2c4g30d"
    security_groups:
      - BastionSG
      - WebSG
      - ClassroomSG
    tags:
      - key: "AnsibleGroup"
        value: "utility,podman"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"

  - name: "frontend"
    count: "{{ frontend_instance_count | default(1) }}"
    public_dns: true
    dns_loadbalancer: true
    image_id: "{{ frontend_instance_image | default(default_image) }}"
    flavor:
      osp: "{{ frontend_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "load_balancers"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - WebSG
      - HostSG

  - name: "app"
    count: "{{ app_instance_count | default(2) }}"
    public_dns: false
    image_id: "{{ app_instance_image | default(default_image) }}"
    flavor:
      osp: "{{ app_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "app_servers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    key_name: "{{key_name}}"
    security_groups:
      - DefaultSG
      - WebSG
      - HostSG

  - name: "appdb"
    count: "{{ appdb_instance_count | default(1) }}"
    public_dns: false
    image_id: "{{ appdb_instance_image | default(default_image) }}"
    flavor:
      osp: "{{ appdb_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "database_servers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    key_name: "{{key_name}}"
    security_groups:
      - DefaultSG
      - WebSG
      - HostSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 2ce6f354-0678-445e-9937-a9d540068732
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha
      pull: missing
