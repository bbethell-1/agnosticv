---
#include /includes/catalog-icon-sap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/ansible_control_plane/controller.aap5ao6oghnkg6u4.ansiblecloud.redhat.com.yaml

# Set to RHPDS or OPENTLC
platform: labs

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/sap-hana
env_type: sap-hana

common_install_basic_packages_retries: 0
install_student_user: true
osp_project_create: true

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

set_repositories_rhel8_lock_release: 8.4
set_repositories_satellite_ha: true

# OSP quotas
quota_num_volumes: -1
quota_volumes_gigs: -1
quota_num_instances: -1
quota_num_cores: -1
quota_memory: -1
quota_networks: -1
quota_subnets: -1
quota_routers: -1
quota_fip: -1
quota_sg: -1
quota_sg_rules: -1

####----- Specific and common requirements for the SAP HANA Scale-up -----####
repo_method: satellite

rootfs_size_bastion: 50
rootfs_size_hana: 100
sap_software_size: 100
hana_instance_count: 2
tower_instance_count: 0
s4hana_instance_count: 0
####----- Specific and common requirements for the SAP HANA Scale-up -----####
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5178727f-1aaa-42f8-a60b-937ff5af5421
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SAP HANA Scale Up
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux_for_SAP_Applications
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Use_Case: Platform_Simplification
    # No parameter variables
    parameters: []
  scheduler:
    enable: true
    data:
      cloud_preference:
        datacenter: dal
        purpose: production
      cloud_selector:
        type: osp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  secrets:
    - namespace: gpte
      name: novello-git-clone-key
    - namespace: gpte
      name: repos-cloudfront-ocp
    - namespace: gpte
      name: sap-secrets
    - namespace: gpte
      name: tower-manifest-get
