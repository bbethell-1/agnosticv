---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.11.36"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
      cloud_selector:
        type: osp
__meta__:
  deployer:
    scm_ref: osp-ee
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
      cloud_selector:
        type: osp
