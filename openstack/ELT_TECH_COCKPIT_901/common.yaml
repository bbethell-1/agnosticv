---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/ocp4_token.yaml
#include /enterprise/includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
#include /includes/secrets/opentlc-mgr-migration-host.yaml
#include /includes/secrets/demosat-rhel-9.0.yaml

# Tech cockpit 901
# Catalog: Support Labs
# Catalog Item: tech-cockpit-901

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: tech-cockpit-901
software_to_deploy: none
ssh_provision_key_name: "{{ env_authorized_key }}"
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# cloud-user password
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
cloud_user_password: "{{ common_password }}"
student_name: cloud-user

# Platform
platform: labs

# On OpenStack do not use swift
osp_use_swift: false

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: true

migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
#repo_method: satellite
satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: "{{ satellite_org }}"

satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: "{{ satellite_url }}"

set_repositories_satellite_ha: true

satellite_activationkey: rhel90
set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"


agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

find_ip_query: openstack_servers[?name=='{{ _instance_name }}'].public_v4

__meta__:
  asset_uuid: 0846f1f6-de95-4a81-83f2-55f88beb2085
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha.2
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Enterprise Linux 9 - Live Migrate VM using Red Hat Enterprise Linux web console
    category: Labs
    keywords:
    - labs
    - rhel
    - rhel9
    - rhel9livemigrate
    labels:
      #OpenShift_Version: "4.10"
      Product: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
  secrets:
  - name: repos-cloudfront-ocp
    namespace: gpte
  - name: ibm-cos-secrets
    namespace: gpte
  - name: novello_git_clone_key
    namespace: gpte
