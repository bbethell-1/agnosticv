---
purpose: test


#########################################
# Babylon meta variables
#########################################
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

########################################
# Mandatory vars #
########################################
migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem

output_dir: /tmp/workdir

common_install_basic_packages_retries: 0
repo_method: file
install_student_user: true

#########################################
# Babylon meta variables
#########################################

__meta__:
  scheduler:
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
    enable: true
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
  deployer:
    git_tag_prefix: EMEA-PARTNERS-idm-rhel8-pc19-lab-test
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: novello_git_clone_key
      namespace: gpte
    - name: ibm-cos-secrets
      namespace: gpte
    - name: repos-cloudfront-ocp
      namespace: gpte
