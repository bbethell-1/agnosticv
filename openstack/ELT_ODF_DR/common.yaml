---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: ODF Disaster Recovery Site 2
# --- ELT: Red Hat OpenShift Data Foundation Disaster Recovery Site 2
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster

# software deployment from software_playbooks
software_to_deploy: openshift4

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10.5"

# Get openshift Installer
ocp4_installer_root_url: "http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs
rhcos_image_name: rhcos-ocp48
quota_volumes_gigs: 6000
worker_storage_type: tripleo
worker_storage_size: 1024
quota_num_cores: 92
quota_memory: 418000 # in MB
quota_num_volumes: 30
quota_fip: 4
bastion_instance_image: rhel-8.4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
# Do not use SWIFT
osp_use_swift: false
install_ftl: false

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: 4c16g30d
worker_instance_type: 16c64g100d
worker_instance_count: 3

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp-workload-terminal
- ocp4_workload_le_certificates
- ocp4_workload_workload_monitoring

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: 20
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_admin_password: r3dh4t1!
ocp4_workload_authentication_remove_kubeadmin: true

#--------------------------------------------------------------------
# Workaround: ocp4_scsi_device_detection_workaround
# On OpenStack 16 device ids are not truncated to 20 characters.
# This MachineConfig adds a udev configuration to work around this issue.
# https://bugzilla.redhat.com/show_bug.cgi?id=1897603
#--------------------------------------------------------------------
ocp4_scsi_device_detection_workaround: true

# -------------------------------------------------------------------
# AgnosticV Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: f89e5fd5-b93b-4a7d-a97f-e8c6cccd7fd4
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ODF Disaster Recovery Site 2
    category: Labs
    keywords:
    - labs
    - openshift
    - ocp
    - ocp410
    - odf
    - odfdr
    - odfdrsite2
    labels:
      #OpenShift_Version: "4.10"
      Product: Red_Hat_OpenShift_Data_Foundation
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
  secrets:
  - name: ocs4-internal-imp
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
