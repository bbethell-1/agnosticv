---
# OpenShift Cluster to be used in the OCP 4 Application Deployment ILT
# Catalog: OPENTLC OpenShift 4 Labs
# Catalog Item: OpenShift 4 Advanced Application Deployment ILT

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier, it will be appended to all tags,
# files and anything that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# Platform
platform: labs

# Config
ocp4_installer_version: "4.4.6"

# The Pull Secret to pull OpenShift images. Get from try.openshift.com
ocp4_pull_secret: 'FROM_SECRET'

# On OpenStack do not use swift
osp_use_swift: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: FROM_SECRET
satellite_org: FROM_SECRET
satellite_activationkey: FROM_SECRET

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Student User on Bastion
install_student_user: true

# -------------------------------------------------------------------
# Infra Workload Variables
# -------------------------------------------------------------------

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: student
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: ocp4_student

# Create 5 student users
ocp4_workload_authentication_htpasswd_user_count: 25

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# Leave Self Provisioner but set up Image Pruning,
# Public Registry and Build Defaults
ocp4_workload_opentlc_production_remove_self_provisioner: false
ocp4_workload_opentlc_production_expose_registry_route: true
ocp4_workload_opentlc_production_enable_image_pruning: true
ocp4_workload_opentlc_production_set_build_defaults: true
ocp4_workload_opentlc_production_build_memory_limit: "3Gi"
ocp4_workload_opentlc_production_build_memory_request: "2Gi"
ocp4_workload_opentlc_production_build_cpu_limit: "1"
ocp4_workload_opentlc_production_build_cpu_request: "1"

# Customize the cluster with Authentication and
# Let's Encrypt certificates for the Ingress Controllers
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_serverless
- ocp4_workload_pipelines
- ocp4_workload_opentlc_production

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  # virtualenv: openstack-ansible-2.9
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite_ocp_on_osp_secret
