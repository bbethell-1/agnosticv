---
# --- OpenShift 4 Configuration Lab
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Configuration Lab (OpenStack)
# --- ELT: OpenShift 4 Configuration

# --- Platform
platform: labs

# --- Config
env_type: ocp4-cluster

# OpenShift Installer Version
ocp4_installer_version: "4.4.17"
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ satellite_org }}"
satellite_activationkey: "{{ satellite_ocp_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Do not use SWIFT
osp_use_swift: false

# --- Generic Variables
install_ipa_client: false

# --- This is a Lab Environment -> Install FTL
install_ftl: true

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
install_idm: none

# --- Infra Workloads (YAML List)
infra_workloads: []

# --- Student Workloads (YAML List)
student_workloads: []

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: openstack-ansible-2.9
  params_to_variables:
    nodecount: worker_instance_count_ignored
    username: student_name
    student_workloads: student_workloads
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81
