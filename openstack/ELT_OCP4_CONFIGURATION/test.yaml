---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: 4c16g30d
master_instance_count: 3
worker_instance_type: 4c8g30d
worker_instance_count: 2
bastion_instance_type: 2c2g30d

# -------------------------------------------------------------------
# Enable performance testing
# -------------------------------------------------------------------
test_deploy_results: true
test_deploy_image: quay.io/gpte-devops-automation/fio-osp-etcd:infinite
# test_deploy_runs: 30
prometheus_server: "169.56.43.199:9091"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t
ocp4_workload_authentication_htpasswd_add_default_users: false
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  # Set tag prefix here for prod
  agnosticd_git_tag_prefix: elt-ocp4-configuration-test
  idle_after_deploy: 9999
  idle_after_start: 9999
  secrets:
  - openstack-pink

  scheduler:
    enable: false
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
