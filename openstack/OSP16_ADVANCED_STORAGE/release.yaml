---
purpose: release

ctrl01_instance_image: osp-advanced-storage-ctrl01-dev-latest
compute01_instance_image: osp-advanced-storage-compute01-dev-latest
compute02_instance_image: osp-advanced-storage-compute02-dev-latest
undercloud_instance_image: osp-advanced-storage-undercloud-dev-latest
osp_upload_storage_to_ibmcloud_task: True
osp_upload_storage_to_ibmcloud_list:
  - type: "vms"
    items:
      - src: "ctrl01"
        dest: "ctrl01-v1.qcow2"
      - src: "compute01"
        dest: "compute01-v1.qcow2"
      - src: "compute02"
        dest: "compute02-v1.qcow2"
      - src: "undercloud"
        dest: "undercloud-v1.qcow2"


agnosticv_meta:
  agnosticd_git_ref: development
  ansible_additional_args: --skip-tags build,bastion_tasks
