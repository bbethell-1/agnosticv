---
## Catalog Directory: OPENTLC Cloud Infrastructure Labs
## Catalog Item: Smart Management Foundations Lab
## PoC: wharris@redhat.com
## Creation: February 10, 2021

# Set to RHPDS or OPENTLC
platform: labs

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: smart-management-foundations

output_dir: /tmp/workdir

common_install_basic_packages_retries: 0

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# -------------------------------------------------------------------
# Satellite Vars
# -------------------------------------------------------------------
image_project:
  - smart-management-dev-images

satellite_instance_image: smart-management-dev-images-satellite-04

migration_key_path: /var/lib/awx/.ssh/opentlc_admin_backdoor.pem

publicname: "satellite.{{ guid }}.{{osp_cluster_dns_zone}}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite
satellite_activationkey: TRSM-2020

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
install_ipa_client: false

# Student User on Bastion
install_student_user: true

# --- student_name not set -> Requestor User ID is used as student_name

student_name: student
lab_user: devops
# --- student_password not set -> generate random password
# student_password: r3dh4t1!

# --- Student Workloads (YAML List)

student_workloads: []

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  catalog:
    namespace: gpte
    # No parameter variables
    parameters: []
  secrets:
    - name: labsat-secrets
      namespace: gpte
    - name: ibm-cos-secrets
      namespace: gpte
    - name: satellite-manifest-get
      namespace: gpte
