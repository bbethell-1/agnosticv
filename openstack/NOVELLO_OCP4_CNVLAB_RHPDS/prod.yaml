---
purpose: production

# Use Let's Encrypt Prod certificates
ocp4_workload_le_certificates_install_certificates: true

master_instance_type: 8c16g30d

agnosticv_meta:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
  secrets:
    - repos-cloudfront-ocp
    - cnv-satellite
  idle_after_deploy: 9999
  idle_after_start: 9999
  agnosticd_git_tag_prefix: ocp4-cnvlab-rhpds-prod
