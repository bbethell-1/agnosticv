---
# --------------------------------------------------------------------
# Maintainers: August Simonelli, Rhys Oxenham, Ben Schmaus
# Date: Dec 4th 2020
# --------------------------------------------------------------------

env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

ocp4_installer_version: "4.6.4"
osp_use_swift: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# What we use in this environment to get the packages we need
repo_method: satellite

# RHCOS Image
rhcos_image_name: rhcos-ocp46

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

install_student_user: true
#student_name: lab-user

# -------------------------------------------------------------------
# This sets default user info
ocp4_cluster_show_default_user_info: true

## Lab's version of FTL Solver. This will install the whole lab "t" or not "f"
kni_auto_install: false

# -------------------------------------------------------------------
# OpenShift Cluster Customization
# -------------------------------------------------------------------

# Do not run any infrastructure customization.
# This will result in a default OpenShift 4 installation.
infra_workloads:
  - ocp4_workload_le_certificates
  - ocp4-workload-cnvlab

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

#agnosticv_meta:
#  params_to_variables:
#    username: student_name
#  virtualenv: openstack-ansible-2.9
#  secrets:
#    - ocp4_token

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: openstack-ansible-2.9
  catalog:
    namespace: gpte
  secrets:
    - name: cnv-satellite
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
