---
purpose: development

ocp4_installer_version: "4.6.4"

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# Use Let's Encrypt Prod certificates
ocp4_workload_le_certificates_install_certificates: false

# Looking to remove default user info as it is confusing
ocp4_cluster_show_default_user_info: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  params_to_variables:
    username: student_name
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
#  idle_after_deploy: 9999
#  idle_after_start: 9999
#  secrets:
#    - cnv-satellite
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: openstack-ansible-2.9
    scm_url: https://github.com/rdoxenham/agnosticd.git
    scm_ref: development
    scm_type: git
    type: agnosticd
  catalog:
    namespace: gpte
  secrets:
    - name: openstack-red
      namespace: gpte
    - name: cnv-satellite
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
