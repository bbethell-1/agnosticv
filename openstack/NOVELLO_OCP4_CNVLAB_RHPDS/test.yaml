---
purpose: testing

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# Remove default user info as it is confusing
#ocp4_cluster_show_default_user_info: false
ocp4_cluster_show_default_user_info: true

## Lab's built-in version of FTL Solver - This var set as true/false will install the whole lab or not.
kni_auto_install: true

master_instance_type: 8c16g30d

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  scheduler:
    data:
      cloud_preference:
        purpose: production
