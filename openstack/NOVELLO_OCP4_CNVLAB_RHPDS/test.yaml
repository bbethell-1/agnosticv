---
purpose: testing

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# Use Let's Encrypt Prod certificates
ocp4_workload_le_certificates_install_certificates: true

master_instance_type: 8c16g30d

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  idle_after_deploy: 9999
  idle_after_start: 9999
  secrets:
    - cnv-satellite
  agnosticd_git_tag_prefix: ocp4-cnvlab-rhpds-test
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: openstack-ansible-2.9
    scm_ref: development
    scm_type: git
    type: agnosticd
  catalog:
    namespace: gpte
  secrets:
    - name: openstack-orange
      namespace: gpte
