---
#include /includes/catalog-icon-rhel.yaml
# Tech Networking 901
# Catalog:
# Catalog Item:

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: tech-networking-901
software_to_deploy: none
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# cloud-user password
cloud_user_password: "r3dh4t1!"

# Platform
platform: labs

# On OpenStack do not use swift
osp_use_swift: false

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: True

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
satellite_activationkey: rhel-9.0
set_repositories_rhel9_lock_release: '9.0'

ssh_provision_key_name: "{{ env_authorized_key }}"
bastion_instance_image: pntae-rhel-9.0-original

find_ip_query: openstack_servers[?name=='{{ _instance_name }}'].public_v4

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
#  meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c0fd872e-5183-4b24-9b1d-d35c632ead0b
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    virtualenv: openstack-ansible-2.9
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Enterprise Linux 9 - NetworkManager KeyFile
    category: Labs
    keywords:
    - labs
    - rhel
    - NetworkManager
    - rhel9
    labels:
      #OpenShift_Version: "4.10"
      Product: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
  secrets:
  - name: satellite-rhel90-ha
    namespace: gpte
  - name: openstack-red-secret
    namespace: gpte
