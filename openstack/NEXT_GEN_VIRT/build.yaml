---
#include /includes/parameters/requester_username.yaml
purpose: build

provision_instance_image: "rhel-8.4"
master01_instance_image: "GLOBAL-empty"
master02_instance_image: "GLOBAL-empty"
master03_instance_image: "GLOBAL-empty"

worker01_instance_image: "GLOBAL-empty"
worker02_instance_image: "GLOBAL-empty"
worker03_instance_image: "GLOBAL-empty"

osp_copy_vm_disk_to_image_task: True
osp_copy_vm_disk_to_image_list:
  - src: "provision"
    dest: "next-gen-virt-provision-dev-latest"
  - src: "master01"
    dest: "next-gen-virt-master01-dev-latest"
  - src: "master02"
    dest: "next-gen-virt-master02-dev-latest"
  - src: "master03"
    dest: "next-gen-virt-master03-dev-latest"
  - src: "worker01"
    dest: "next-gen-virt-worker01-dev-latest"
  - src: "worker02"
    dest: "next-gen-virt-worker02-dev-latest"
  - src: "worker03"
    dest: "next-gen-virt-worker03-dev-latest"

__meta__:
  catalog:
    namespace: babylon-catalog-dev
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
