---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Hands On OpenShift Data Science
# --- ELT: Hands On with Red Hat OpenShift Data Science
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.9.15"

# -------------------------------------------------------------------
# software deployment from software_playbooks
# -------------------------------------------------------------------
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Get openshift Installer
# -------------------------------------------------------------------
ocp4_installer_root_url: "http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs
rhcos_image_name: rhcos-ocp48
quota_volumes_gigs: 6000
worker_storage_type: tripleo
worker_storage_size: 1024
quota_num_cores: 92
quota_memory: 418000 # in MB
quota_num_volumes: 30
quota_fip: 4
bastion_instance_image: rhel-8.4

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: 4c16g30d
worker_instance_type: 16c64g100d
worker_instance_count: 4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# Update RHEL to the latest packages (and reboot)
# -------------------------------------------------------------------
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true


# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

ssh_provision_key_name: "{{ env_authorized_key }}"
# Do not use SWIFT
osp_use_swift: false
install_ftl: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp-workload-terminal
- ocp4_workload_le_certificates
- ocp4_workload_workload_monitoring
- ocp4_workload_pipelines
- ocp4_workload_serverless
- ocp4_workload_rhods_olm

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: 20
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_admin_password: r3dh4t1!
ocp4_workload_authentication_remove_kubeadmin: true

#--------------------------------------------------------------------
# Workaround: ocp4_scsi_device_detection_workaround
# On OpenStack 16 device ids are not truncated to 20 characters.
# This MachineConfig adds a udev configuration to work around this issue.
# https://bugzilla.redhat.com/show_bug.cgi?id=1897603
#--------------------------------------------------------------------
ocp4_scsi_device_detection_workaround: true

# ---------------------------------------------------------
# OpenShift Serverless
# ---------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_eventing: true
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_serverless_catalog_snapshot_image_tag: v4.9_2022_01_10

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: stable
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.9_2022_01_10
ocp4_workload_pipelines_tkn_version: 0.21.0

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_olm
# -------------------------------------------------------------------
become_override: false
ocp_username: opentlc-mgr
silent: false

ocp4_workload_rhods_olm_install_operator_name: "rhods-operator"
ocp4_workload_rhods_olm_channel_name: "rhods-operator"
ocp4_workload_rhods_olm_operator_subscription_channel: "beta"
ocp4_workload_rhods_olm_channel: "beta"

ocp4_workload_rhods_olm_odh_namespace: "redhat-ods-operator"
ocp4_workload_rhods_olm_applications_namespace: "redhat-ods-applications"
ocp4_workload_rhods_olm_monitoring_namespace: "redhat-ods-monitoring"

ocp4_workload_rhods_olm_namespace_list:
- "{{ ocp4_workload_rhods_olm_applications_namespace }}"
- "{{ ocp4_workload_rhods_olm_monitoring_namespace }}"
- "anonymous"
- "redhat-ods-operator"
- "rhods-notebooks"

ocp4_workload_rhods_olm_catalogsource_name: "addon-managed-odh-catalog"
ocp4_workload_rhods_olm_catalogsource_namespace: "{{ ocp4_workload_rhods_olm_odh_namespace }}"
ocp4_workload_rhods_olm_catalogsource_display_name: "Managed Open Data Hub Operator"
ocp4_workload_rhods_olm_catalog_snapshot_image: "quay.io/modh/qe-catalog-source"
ocp4_workload_rhods_olm_catalog_snapshot_image_tag: "v1180-9"
ocp4_workload_rhods_olm_starting_csv: ""

# used when you are conducting a workshop
# will cause user data to be output
ocp4_workload_rhods_olm_is_workshop: false
ocp4_workload_rhods_olm_workshop_num_users: 10
ocp4_workload_rhods_olm_workshop_username_base: "users"
ocp4_workload_rhods_olm_workshop_password: "openshift"

# -------------------------------------------------------------------
# AgnosticV Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 1f1b4dde-d418-47ab-82ed-7ab8b7a08e90
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Hands On OpenShift Data Science
    category: Labs
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp49
    - ods
    - datascience
    - rhods
    labels:
      #OpenShift_Version: "4.9"
      Product: Red_Hat_OpenShift_Data_Science
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
  secrets:
  - name: ocs4-internal-imp
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: rhods-git-secret
    namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
