---
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
# master_instance_type: 4c16g30d
# master_instance_count: 3
# worker_instance_type: 8c16g30d
# worker_instance_count: 2
# bastion_instance_type: 2c2g30d

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
# OpenShift Installer version to use
ocp4_installer_version: "4.9.15"

#RedHat OpenShift Data Science Version
rhods_catalog_item: quay.io/modh/qe-catalog-source:v170-5

# Instance Types to be passed to OpenShift Installer
master_instance_type: 4c16g30d
worker_instance_type: 16c64g100d
worker_instance_count: 4

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Hands On OpenShift Data Science
    category: Labs
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp49
    - ods
    - datascience
    - rhods
    labels:
      #OpenShift_Version: "4.9"
      Product: Red_Hat_OpenShift_Data_Science
      Provider: PFE
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: student_name
  secrets:
  - name: ocs4-internal-imp
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: rhods-git-secret
    namespace: gpte
