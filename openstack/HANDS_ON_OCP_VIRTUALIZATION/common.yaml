---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
platform: OPENTLC

# The name of the agnosticd config to deploy
env_type: hands-on-with-openshift-virtualization
ssh_provision_key_name: "{{ env_authorized_key }}"

osp_migration_labconsole_apps_domain: apps.shared-na4.na4.openshift.opentlc.com

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This is the tag that will be pulled in from the FTL repo
#ftl_tag: TBD

# OSP quotas
quota_num_volumes: -1
quota_volumes_gigs: -1
quota_num_instances: -1
quota_num_cores: -1
quota_memory: -1
quota_networks: -1
quota_subnets: -1
quota_routers: -1
quota_fip: -1
quota_sg: -1
quota_sg_rules: -1

# What we use in this environment to get the packages we need
# repo_method: satellite
# satellite_url: satellite.opentlc.com
satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: "{{ satellite_org }}"

satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: "{{ satellite_url }}"

set_repositories_satellite_ha: true

satellite_activationkey: rhel84
set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

#provision_instance_image: ocp4-virtualization-provision-v471
ipmihost_instance_image: rhel-8.4-ospbmc-dev-latest

provision_instance_flavor: 4c16g100d
ipmihost_instance_flavor: GLOBAL-CPU_2_Memory_2048_Disk_100_flavor

master01_instance_flavor: GLOBAL-CPU_4_Memory_32765_Disk_60_flavor
master02_instance_flavor: GLOBAL-CPU_4_Memory_32765_Disk_60_flavor
master03_instance_flavor: GLOBAL-CPU_4_Memory_32765_Disk_60_flavor
worker01_instance_flavor: 16c64g100d
worker02_instance_flavor: 16c64g100d
worker03_instance_flavor: 16c64g100d

osp_copy_vm_disk_to_image_task: False
osp_copy_volume_to_image_task: False
osp_upload_storage_to_ibmcloud_task: False

osp_copy_vm_disk_to_image_list: []
osp_copy_volume_to_image_list: []
osp_upload_storage_to_ibmcloud_list: []


key_name: opentlc_admin_backdoor

ocp_version: "stable-4.10"

# Set this to true if you need to create a new project in OpenStack
# This should almost always be set to true for OpenShift installations
# If it is set to false, the {{ osp_project_name }} must already exist and
# should be able to run whatever you are deploying
osp_project_create: true

# The name of the project that will be created in OpenStack for the user
osp_project_name: "{{ guid }}-project"

# IBM Cloud store container
image_store: "{{ env_type }}"

migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 3c025be7-3285-4146-bb1c-5d011b179e02
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    display_name: Hands On With OpenShift Virtualization
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
  - name: ibm-cos-secrets
    namespace: gpte
  - name: novello_git_clone_key
    namespace: gpte
  - name: repos-cloudfront-ocp
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: satellite-rhel81
    namespace: gpte
