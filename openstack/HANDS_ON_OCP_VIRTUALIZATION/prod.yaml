---
purpose: production

ipmihost_instance_image: "hands-on-with-openshift-virtualization-rhel-8.4-ospbmc-v1"
provision_instance_image: "hands-on-with-openshift-virtualization-provision-v1"
master01_instance_image: "hands-on-with-openshift-virtualization-master01-v1"
master02_instance_image: "hands-on-with-openshift-virtualization-master02-v1"
master03_instance_image: "hands-on-with-openshift-virtualization-master03-v1"

worker01_instance_image: "hands-on-with-openshift-virtualization-worker01-v1"
worker02_instance_image: "hands-on-with-openshift-virtualization-worker02-v1"
worker03_instance_image: "hands-on-with-openshift-virtualization-worker03-v1"

ansible_ssh_private_key_file: "{{ output_dir }}/ssh_key.pem"
migration_key_path: "{{ ansible_ssh_private_key_file }}"

__meta__:
  catalog:
    namespace: babylon-catalog-prod
  deployer:
    scm_ref: osp-ee
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:pr-6963
      pull: missing
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
