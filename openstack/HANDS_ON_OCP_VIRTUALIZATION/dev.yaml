---
#include /includes/secrets/satellite-rhel84.yml
#include /includes/secrets/opentlc-mgr-migration-host.yaml
#include /includes/ansible_control_plane/current_controller.yaml

purpose: development

ansible_ssh_private_key_file: "{{ output_dir }}/ssh_key.pem"
migration_key_path: "{{ ansible_ssh_private_key_file }}"

provision_instance_image: "rhel-8.4"
master01_instance_image: "GLOBAL-empty"
master02_instance_image: "GLOBAL-empty"
master03_instance_image: "GLOBAL-empty"

worker01_instance_image: "GLOBAL-empty"
worker02_instance_image: "GLOBAL-empty"
worker03_instance_image: "GLOBAL-empty"

__meta__:
  catalog:
    namespace: babylon-catalog-dev
  deployer:
    scm_ref: osp_infra_dns_fix
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:pr-6963
      pull: missing
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
