---
purpose: release

provision_instance_image: "hands-on-with-openshift-virtualization-provision-dev-latest"
master01_instance_image: "hands-on-with-openshift-virtualization-master01-dev-latest"
master02_instance_image: "hands-on-with-openshift-virtualization-master02-dev-latest"
master03_instance_image: "hands-on-with-openshift-virtualization-master03-dev-latest"

worker01_instance_image: "hands-on-with-openshift-virtualization-worker01-dev-latest"
worker02_instance_image: "hands-on-with-openshift-virtualization-worker02-dev-latest"
worker03_instance_image: "hands-on-with-openshift-virtualization-worker03-dev-latest"

osp_upload_storage_to_ibmcloud_task: True
osp_upload_storage_to_ibmcloud_list:
  - type: "images"
    items:
      - src: "hands-on-with-openshift-virtualization-master01-dev-latest"
        dest: "master01-v1.qcow2"
      - src: "hands-on-with-openshift-virtualization-master02-dev-latest"
        dest: "master02-v1.qcow2"
      - src: "hands-on-with-openshift-virtualization-master03-dev-latest"
        dest: "master03-v1.qcow2"
      - src: "hands-on-with-openshift-virtualization-worker01-dev-latest"
        dest: "worker01-v1.qcow2"
      - src: "hands-on-with-openshift-virtualization-worker02-dev-latest"
        dest: "worker02-v1.qcow2"
      - src: "hands-on-with-openshift-virtualization-worker03-dev-latest"
        dest: "worker03-v1.qcow2"
      - src: "hands-on-with-openshift-virtualization-provision-dev-latest"
        dest: "provision-v1.qcow2"


__meta__:
  catalog:
    namespace: babylon-catalog-dev
  deployer:
    scm_ref: development
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
