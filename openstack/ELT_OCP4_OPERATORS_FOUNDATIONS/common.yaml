---
# --- OpenShift 4 Operators Foundations Lab
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Operators Foundations Lab (OpenStack)
# --- ELT: OpenShift 4 Operators Foundations

# --- Platform
platform: labs

# --- Config
env_type: ocp4-cluster

# OpenShift Installer Version
ocp4_installer_version: "4.3.5"
software_to_deploy: openshift4

# --- Repos
osrelease: 4.3.0
repo_version: '4.3'
repo_method: file
# --- own_repo_path is inherited from default account settings based on osrelease

# --- Generic Variables
install_ipa_client: false

# --- This is a Lab Environment -> Install FTL
install_ftl: true

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
ocp4_idm_install: htpasswd
ocp4_idm_admin_user: admin
ocp4_idm_htpasswd_user_base: user
ocp4_idm_htpasswd_user_count: 10
ocp4_idm_remove_kubeadmin: true

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4-workload-authentication

# --- Student Workloads (YAML List)
student_workloads: []

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: openstack
  params_to_variables:
    nodecount: worker_instance_count_ignored
    username: student_name
    student_workloads: student_workloads
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
