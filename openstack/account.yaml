---
## In here you will save account specific variables.
## If there are any other variables common to all lower level CIs (catalog items) , consider adding them in a common.yml that is in a higer level to all CIs affected.

# The type of cloud provider this will be deployed to
cloud_provider: osp

# This is an account that must exist in OpenStack.
# It is used to create projects, access, Heat templates
admin_user: opentlc-mgr

# This is the user that Ansible will use to connect to the nodes it is
# configuring from the admin/control host
ansible_user: cloud-user
remote_user: cloud-user

##Secret file must exist with appropriate name in the ansible admin host that executes the deployment.
agnosticv_meta:
  secrets:
    - openstack-lab-secret
