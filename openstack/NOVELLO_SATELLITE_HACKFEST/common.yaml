---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/opentlc-mgr-migration-host.yaml
#include /includes/ansible_control_plane/controller.aap5ao6oghnkg6u4.ansiblecloud.redhat.com.yaml

# Set to RHPDS or OPENTLC
platform: OPENTLC

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: satellite-hackfest

ansible_ssh_private_key_file: "{{ output_dir }}/ssh_key.pem"
migration_key_path: "{{ ansible_ssh_private_key_file }}"

output_dir: /tmp/workdir

common_install_basic_packages_retries: 0

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# -------------------------------------------------------------------
# Satellite Vars
# -------------------------------------------------------------------
image_project:
  - hackfest-images
satellite_instance_image: hackfest-images-satellite-611-10-22

#migration_key_path: /var/lib/awx/.ssh/opentlc_admin_backdoor.pem

publicname: "satellite.{{ guid }}.{{osp_cluster_dns_zone}}"

satellite_admin_password: r3dh4t1!

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

satellite_activationkey: 6.11-hackfest-2022
satellite_org: Red_Hat_GPTE_Labs

set_repositories_satellite_org: "{{ satellite_org }}"
set_repositories_satellite_ha: true
set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
install_ipa_client: false

# Student User on Bastion
install_student_user: true

# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user

lab_user: devops
# --- student_password not set -> generate random password
# student_password: r3dh4t1!

# --- Student Workloads (YAML List)

student_workloads: []

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  asset_uuid: 7ed62b9e-fa52-43ae-bee0-6aa03c70144d
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    display_name: Satellite Hackfest
    category: Labs
    labels:
      Product: Satellite
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    keywords:
      - Satellite
      - Hackfest
  scheduler:
    enable: true
    data:
      cloud_preference:
        datacenter: dal
        purpose: production
      cloud_selector:
        type: osp
  secrets:
    - name: novello-git-clone-key
      namespace: gpte
    - name: labsat-ha-secrets
      namespace: gpte
    - name: ibm-cos-secrets
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha.2
      pull: missing
