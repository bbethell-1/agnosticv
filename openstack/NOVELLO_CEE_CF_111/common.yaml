#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

---

# Set to RHPDS or OPENTLC
platform: labs

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: ocp4-cluster

# Cloud tags set explicitly from AgnosticV
cloud_tags:
  catalog_item: cee-cf-111
  platform: "{{ platform }}"

# What we use in this environment to get the packages we need
repo_method: satellite
satellite_url: labsat-ha.opentlc.com
update_packages: true
set_repositories_satellite_ha: true

software_to_deploy: openshift4

# This allows us to install on clusters without Swift
osp_use_swift: false

# OpenShift Installer Version
ocp4_installer_version: "4.6.18"

rhcos_image_name: rhcos-ocp46

master_instance_type: 8c16g30d

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_pntae
- infra_osp_bastion_on_openshift_network

# --- Student Workloads (YAML List)
student_workloads: []

# Workload Vars

# ocp4_workload_pntae vars
ocp4_workload_pntae_course_id: cee-cf-111

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: 625bbb1f-8210-4c1f-8dac-6075b5d7395c
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    display_name: CEE-CF-111
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81-ha
