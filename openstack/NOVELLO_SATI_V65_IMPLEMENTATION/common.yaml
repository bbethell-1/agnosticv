---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/opentlc-mgr-migration-host.yaml

# Set to RHPDS or OPENTLC
platform: OPENTLC

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: osp-migration

ansible_ssh_private_key_file: "{{ output_dir }}/ssh_key.pem"
migration_key_path: "{{ ansible_ssh_private_key_file }}"

common_install_basic_packages_retries: 0
repo_method: file
install_student_user: true
student_name: lab-user

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# Enter project name from https://github.com/redhat-gpe/novello-templates/tree/master/heat-templates
project: OPTLC-SATI_v6.5_Implementation-v0.1-bp

agnosticv_meta:

  virtualenv: openstack-ansible-2.9

  # Uncomment if you want to skip actions like waiting for SSH and other deployment steps
  # Step examples:
  # - Step 002 Post Infrastructure, Configuring Bastion Hosts
  # - wait_ssh: Step 001.3 Configure Linux Hosts and Wait for Connection
  #ansible_additional_args: --skip-tags wait_ssh,step002

  secrets:
    - novello_git_clone_key
    # Required by env_type osp-migration
    # ibm_api_key, ibm_bucket_name, ibm_endpoint, ibm_auth_endpoint, ibm_resource_id
    - ibm-cos-secrets

  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    user: student_name

__meta__:
  asset_uuid: c306154e-5808-405e-8d06-dea8029cd4c3
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    display_name: Satellite 6 Implementation Lab
    category: Labs
    keywords:
      - satellite
    labels:
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    tags:
      - babylon
  scheduler:
    enable: true
    data:
      cloud_preference:
        datacenter: dal
        purpose: production
      cloud_selector:
        type: osp
  secrets:
    - namespace: gpte
      name: novello-git-clone-key
    - namespace: gpte
      name: repos-cloudfront-ocp
    - name: ibm-cos-secrets
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:pr-6916
      pull: missing
