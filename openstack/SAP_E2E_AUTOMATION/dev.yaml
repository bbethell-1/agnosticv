---
purpose: development
heat_retries: 1

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    # Ignore parameters that cannot be known in advance to support pooling
    cloudtags: ''
    email: ''
    guid: guid
    ipapass: ''
    serviceid: ''
    user: ''
    uuid: uuid
  virtualenv: babylon

__meta__:
  catalog:
    namespace: gpte
    tags:
    - babylon
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  secrets:
  - namespace: gpte
    name: novello-git-clone-key
  - namespace: gpte
    name: sap-secrets
  - namespace: gpte
    name: ibm-cos-secrets
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
