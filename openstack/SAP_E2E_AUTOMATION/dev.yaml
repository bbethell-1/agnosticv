---
purpose: development
sap_extra_device: sdb
sap_software_device: sdb
heat_retries: 1

requirements_content:
  roles:
  - src: https://github.com/redhat-cop/infra-ansible.git
    name: infra-ansible
    version: v2.0.8

  - name: redhat_sap.sap_rhsm
    version: v1.1.2

  collections:
  - name: community.general
    version: ">=6.6.0"
  - name: ansible.posix
    version: 1.3.0
  - name: openstack.cloud
    version: 1.7.2
  - name: community.sap_operations
    version: 0.9.0

__meta__:
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha
      pull: missing
