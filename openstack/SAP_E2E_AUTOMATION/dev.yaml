---
#include /includes/secrets/opentlc-mgr-migration-host.yaml

ssh_provision_key_name: "{{ env_authorized_key }}"
key_name: opentlc_admin_backdoor
migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem

purpose: development
sap_extra_device: sdb
sap_software_device: sdb
heat_retries: 1

__meta__:
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
