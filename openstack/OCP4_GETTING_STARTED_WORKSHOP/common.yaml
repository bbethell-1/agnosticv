---
# -------------------------------------------------------------------
# --- Catalog: OpenShift Workshops
# --- Catalog Item: OCP4 - Getting Started Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.5.19"
rhcos_image_name: rhcos-ocp45

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# OSP Specific
# -------------------------------------------------------------------
osp_use_swift: false

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ipa_client: false
install_idm: none

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_opentlc_production
- ocp4_workload_project_request_template
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp4_workload_nexus_operator
- ocp4_workload_machinesets
- ocp4_workload_logging
- ocp-workload-etherpad
- ocp-workload-ocp-ops-view
- ocp-workload-gogs
- ocp-workload-gogs-load-repository
- ocp4-workload-homeroomlab-starter-guides
- ocp4-workload-osevg-workshop-tracker

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('2') }}"
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# OpenTLC Production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false
ocp4_workload_opentlc_production_expose_registry_route: false
ocp4_workload_opentlc_production_set_build_defaults: true

# -------------------------------------------------------------------
# OpenShift Pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: ocp-4.5
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator.v1.0.1
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalogsource_name: redhat-operators-snapshot-pipelines
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.5_2020_10_01

# -------------------------------------------------------------------
# Nexus Operator
# -------------------------------------------------------------------
ocp4_workload_nexus_operator_project: labs
ocp4_workload_nexus_operator_image: quay.io/gpte-devops-automation/nexus-operator
ocp4_workload_nexus_operator_image_tag: v0.17.1
ocp4_workload_nexus_operator_nexus_image: registry.connect.redhat.com/sonatype/nexus-repository-manager
ocp4_workload_nexus_operator_nexus_image_tag: 3.27.0-ubi-4
ocp4_workload_nexus_operator_new_admin_password: admin123

ocp4_workload_nexus_operator_repos_maven_hosted_setup: true
ocp4_workload_nexus_operator_repos_maven_hosted:
- name: releases
  blob_store: default
  write_policy: allow_once # allow_once or allow
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
- name: maven-snapshots
  blob_store: default
  write_policy: allow # allow_once or allow
  strict_content_validation: true
  version_policy: snapshot # release, snapshot or mixed
  layout_policy: strict # strict or permissive

# -------------------------------------------------------------------
# Machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_machineset_groups:
- name: elasticsearch
  autoscale: false
  total_replicas: 1
  total_replicas_min: 1
  total_replicas_max: 1
  role: elasticsearch
  taints:
  - key: elasticsearch
    value: reserved
    effect: NoSchedule
  - key: elasticsearch
    value: reserved
    effect: NoExecute
  instance_type: "8c32g100d"

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
ocp4_workload_logging_node_role: "elasticsearch"
ocp4_workload_logging_elasticsearch_replicas: 1
ocp4_workload_logging_use_catalog_snapshot: true
ocp4_workload_logging_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_logging_catalog_snapshot_image_tag: "v4.5_2020_10_01"

# -------------------------------------------------------------------
# Legacy Roles
# -------------------------------------------------------------------
etherpad_project: labs
gogs_project: labs
opsview_project: labs
project_name: labs
workshop_type: starter

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  virtualenv: openstack-ansible-2.9
  params_to_variables:
    username: student_name
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81
