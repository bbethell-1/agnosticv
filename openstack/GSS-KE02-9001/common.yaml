---

# Set to RHPDS or OPENTLC
platform: labs
email: ashishks@redhat.com

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: pntae-jabn

# What we use in this environment to get the packages we need

# This allows us to install on clusters without Swift
osp_use_swift: false

# Config-Specific Variables

node_instance_count: 1
___image: rhel-server-7.7-update-2
bastion_instance_image: "{{ ___image }}"
node_instance_image: "{{ ___image }}"
update_packages: false

# Environment Instances
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: false
    image: "{{ bastion_instance_image }}"
    flavor: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    volumes:
      - name: '/dev/sda1'
        size: 20
    security_groups:
      - BastionSG

  - name: "node"
    count: "{{node_instance_count}}"
    public_dns: false
    dns_loadbalancer: false
    image: "{{ node_instance_image }}"
    flavor: "{{ node_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    volumes:
      - name: '/dev/sda1'
        size: 1
    security_groups:
      - DefaultSG

coursecode: "gss-ke02-9001"
courseurl: "https://raw.githubusercontent.com/pntae-training/courses/master"
coursescript: "gss-ke02-9001.sh"

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

repo_method: satellite
satellite_url: labsat-ha.opentlc.com
satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: pntae_ha_rhel7
set_repositories_satellite_ha: true

# --- Student Workloads (YAML List)
student_workloads: []

agnosticv_meta:
  virtualenv: openstack-ansible-2.9
  secrets:
    - novello_git_clone_key
    - labsat-secrets
  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    user: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6fe81bc8-fd9a-4b96-bc8b-9bf3d1546b18
