---
#include /includes/catalog-icon-sap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: sap-smart

common_install_basic_packages_retries: 0
install_student_user: true
osp_project_create: true

# email is required by osp template
email: babylon@example.com

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# User for SSH access to hosts
student_name: lab-user

# OSP quotas
quota_num_volumes: -1
quota_volumes_gigs: -1
quota_num_instances: -1
quota_num_cores: -1
quota_memory: -1
quota_networks: -1
quota_subnets: -1
quota_routers: -1
quota_fip: -1
quota_sg: -1
quota_sg_rules: -1

rootfs_size_bastion: 50
rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 200
sap_software_size: 100

# Ansible Tower Variables
tower_instance_count: 1

####----- Specific and common requirements for the SAP Smart Management Workshop/Demo -----####
rh_internal: true
# Satellite Organization for nested satellite in lab environment
satellite_organization: SAPLab

# Override location of OC client URL
ansible_tower_oc_download_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/stable-4.9/openshift-client-linux.tar.gz

# This must match activation key content view
#set_repositories_rhel8_lock_release: '8.4'

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: 9b8d571f-1bfb-4d9b-881e-33bc80aba500
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SAP Smart Management
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux_for_SAP_Applications
      Provider: RHDP
      Product_Family: Red_Hat_Enterprise_Linux
      Use_Case: Platform_Simplification
    # No parameter variables
    parameters: []
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
  secrets:
  - namespace: gpte
    name: novello-git-clone-key
  - namespace: gpte
    name: sap-e2e-secret
  - namespace: gpte
    name: sap-smart-secrets
  - namespace: gpte
    name: satellite-manifest-get-sap
  - namespace: gpte
    name: dynamic-dns
  - namespace: gpte
    name: tower-manifest-get
