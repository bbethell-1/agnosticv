---

# Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: sap-smart

common_install_basic_packages_retries: 0
install_student_user: true
osp_project_create: true

# email is required by osp template
email: babylon@example.com

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# User for SSH access to hosts
student_name: lab-user

# OSP quotas
quota_num_volumes: -1
quota_volumes_gigs: -1
quota_num_instances: -1
quota_num_cores: -1
quota_memory: -1
quota_networks: -1
quota_subnets: -1
quota_routers: -1
quota_fip: -1
quota_sg: -1
quota_sg_rules: -1

####----- Specific and common requirements for the SAP Smart Management Workshop/Demo -----####
repo_method: satellite
satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: sap-smart
satellite_url: labsat.opentlc.com
use_content_view: true
rh_internal: true

rootfs_size_bastion: 50
rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 200
sap_software_size: 100

# Ansible Tower Variables
tower_instance_count: 1

# File is Valut encrypted: $ANSIBLE_VAULT;1.1;AES256;gpte_vault_0
sap_smart_satellite_manifest_url: "https://gpte-public.s3.amazonaws.com/sap-smart-management-satellite-manifest.zip.ansible-vaulted"

