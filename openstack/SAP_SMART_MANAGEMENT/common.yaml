---

# Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: sap-smart

common_install_basic_packages_retries: 0
install_student_user: true
osp_project_create: true

# email is required by osp template
email: babylon@example.com

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

# User for SSH access to hosts
student_name: lab-user

# OSP quotas
quota_num_volumes: -1
quota_volumes_gigs: -1
quota_num_instances: -1
quota_num_cores: -1
quota_memory: -1
quota_networks: -1
quota_subnets: -1
quota_routers: -1
quota_fip: -1
quota_sg: -1
quota_sg_rules: -1

####----- Specific and common requirements for the SAP Smart Management Workshop/Demo -----####
repo_method: satellite
manifest_file_path: /home/opentlc-mgr/mentenza/sat_manifest.zip
satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: sap-smart
satellite_url: labsat.opentlc.com
use_content_view: true
rh_internal: true

rootfs_size_bastion: 50
rootfs_size_hana: 100
rootfs_size_s4hana: 100
rootfs_size_tower: 200
sap_software_size: 100

# Ansible Tower Variables
tower_instance_count: 1

# This should be in a secret, not in AgnosticV...
tower_license: >
  {
    "company_name": "Red Hat",
    "contact_email": "mak@redhat.com",
    "contact_name": "Marcos Entenza",
    "hostname": "94f34b50afe84f66a3357aef41aa566c",
    "instance_count": 50,
    "license_date": 1614157350,
    "license_key": "43598d449f8bb0a8ad4b227a4910735e76b02182c49bded07ed74a1b9fd629b9",
    "license_type": "enterprise",
    "subscription_name": "Ansible Tower by Red Hat (50 Managed Nodes), RHT Internal",
    "trial": true
  }
####----- Specific and common requirements for the SAP Smart Management Workshop/Demo -----####

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    # Ignore parameters that cannot be known in advance to support pooling
    cloudtags: ''
    email: ''
    guid: guid
    ipapass: ''
    serviceid: ''
    user: ''
    uuid: uuid
  virtualenv: babylon

__meta__:
  catalog:
    namespace: gpte
    tags:
    - babylon
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
  secrets:
  - namespace: gpte
    name: novello-git-clone-key
  - namespace: gpte
    name: sap-smart-secrets
  - namespace: gpte
    name: satellite-rhel81
