---
# Deploy Red Hat Quay on RHEL proof of concept
# Catalog Item: Red Hat Quay on RHEL poc

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: quay-rhel-poc
software_to_deploy: none
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

student_name: cloud-user

# Platform
platform: labs

# On OpenStack do not use swift
osp_use_swift: false

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/quay-rhel-poc

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    username: student_name

find_ip_query: openstack_servers[?name=='{{ _instance_name }}'].public_v4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Quay - Deploy Red Hat Quay on RHEL for poc
    category: Labs
    keywords:
    - labs
    - rhel
    - quay
    - clairv4
    labels:
      Product: Red_Hat_Quay
      Provider: RHPDS
      Product_Family: Red_Hat_Cloud
    parameters: []
  secrets:
  - name: satellite-rhel8-latest-ha
    namespace: gpte
  - name: bookbag-deployer-shared-410
    namespace: gpte
