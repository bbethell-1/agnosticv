---
# --- Ansible Automation for publish, promote, patch process
# --- Catalog: Novello
# --- Catalog Item: Automated Patching with Ansible Tower and Satellite Demo
## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
platform: rhpds

# The name of the agnosticd config to deploy
env_type: smart-management

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# This is the tag that will be pulled in from the FTL repo
#ftl_tag: TBD

# By setting the ftl_injector_tag, you imply that you want to install FTL
# This tag specifies the version of the ftl-injector that will be deployed.
# It is different from the version of FTL.
# ftl_injector_tag: v0.17.0

install_ftl: false

# What we use in this environment to get the packages we need
repo_method: satellite

## Not sure exactly what we will use this for, but it will need to change for OpenStack
key_name: opentlc_admin_backdoor

# Set this to true if you need to create a new project in OpenStack
# This should almost always be set to true for OpenShift installations
# If it is set to false, the {{ osp_project_name }} must already exist and
# should be able to run whatever you are deploying
osp_project_create: true

# The name of the project that will be created in OpenStack for the user
osp_project_name: "{{ guid }}-project"

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  secrets:
    - ans-tower-lab_license
    - satellite_ocp_on_osp_secret

  virtualenv: openstack-ansible-2.9

##########################
# Babylon meta variables #
##########################
__meta__:
  deployer:

    virtualenv: openstack-ansible-2.9

  catalog:
    namespace: gpte

#### Tower variables ############
tower_version: "3.6.4-1"
software_to_deploy: tower
# tower install playbook from software directory
tower_infra_workloads:
  - tower-org-create
tower_organization:
  - name: gpte
###### satellite variables ###############
configure_satellite: True
satellite_version: 6.7
satellite_arguments:
  - --foreman-initial-organization "{{ org }}"
satellite_infra_workloads:
  - satellite-manage-organization
  - satellite-manage-manifest
org: gpte
org_label: gpte
org_description: "Global Partner Training and Enablement"

