---
# --- OpenShift 4 Configuration Lab
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Configuration Lab (OSP)
# --- ELT: OpenShift 4 Configuration

# --- Platform
platform: labs

# --- These come from the account
# subdomain_base_suffix: .example.opentlc.com
# HostedZoneId: Z3IHLWJZOU9SRT

# --- Config
env_type: ocp4-cluster

# --- Repos
osrelease: 4.3.0
repo_version: '4.3'
repo_method: file
# --- own_repo_path is inherited from default account settings secrets based on osrelease

# OpenShift Installer Version
ocp4_installer_version: "4.3.0"

# --- Generic Variables
install_ipa_client: false

# --- This is a Lab Environment -> Install FTL
install_ftl: true

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
ocp4_idm_install: none

# --- Infra Workloads (YAML List)
infra_workloads: []

# --- Student Workloads (YAML List)
student_workloads: []

# --- AgnosticV Meta variables
agnosticv_meta:
  params_to_variables:
    nodecount: worker_instance_count_ignored
    username: student_name
