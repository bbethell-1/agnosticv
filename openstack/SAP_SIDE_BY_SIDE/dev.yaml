---
purpose: development

sap_extra_device: sdb
sap_software_device: sdb

#########################################
# AgnosticV meta variables
#########################################
agnosticv_meta:
  agnosticd_git_ref: development
  virtualenv: openstack-ansible-2.9.12
  secrets:
    - openstack-red
    - repos-labsat-ocp-on-osp
    - sap-side-by-side-secret

heat_retries: 1

#########################################
# Babylon meta variables
#########################################
__meta__:
  deployer:
    scm_ref: development
  scheduler:
    enable: true
    data:
      cloud_selector:
        type: osp
      cloud_preference:
        purpose: development
  secrets:
    # Deploy to the RED cluster
    - name: openstack-red-secret
      namespace: gpte
    - name: repos-labsat-ocp-on-osp
      namespace: gpte
    - name: sap-side-by-side-secret
      namespace: gpte
