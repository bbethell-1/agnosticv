---
purpose: test
sap_extra_device: sdb
sap_software_device: sdb
heat_retries: 1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
  # Set tag prefix here for test
  agnosticd_git_tag_prefix: sap-side-by-side-test
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: gpte
  deployer:
    scm_ref: sap-side-by-side-test-0.10
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
  - name: sap-side-by-side-secret
    namespace: gpte
  - name: novello_git_clone_key
    namespace: gpte
  - name: gpte
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
