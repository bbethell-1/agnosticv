---

# Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/osp-migration
env_type: sap-integration

common_install_basic_packages_retries: 0
install_student_user: true
osp_project_create: true

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these
# Alternately, they can both be set to false.
use_dynamic_dns: true

cloud_provider: osp
#output_dir: /output

#guid: maki

osp_use_swift: false
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Infra Workload Variables
# -------------------------------------------------------------------

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: t3mp0r4l
ocp4_workload_authentication_htpasswd_user_base: integration
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: ocp_student

# Create 1 student users
ocp4_workload_authentication_htpasswd_user_count: 1

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

rootfs_size_hana: 100
rootfs_size_s4hana: 100
software_size: 100

#email: mak@redhat.com
rh_internal: true

pull_secret_token: ''

agnosticv_meta:

  virtualenv: openstack-ansible-2.9

  # Uncomment if you want to skip actions like waiting for SSH and other deployment steps
  # Step examples:
  # - Step 002 Post Infrastructure, Configuring Bastion Hosts
  # - wait_ssh: Step 001.3 Configure Linux Hosts and Wait for Connection
  # ansible_additional_args: --skip-tags wait_ssh,step002

  secrets:
    - novello_git_clone_key
    - sap-side-by-side-secret

  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    user: student_name

