# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 9344cbbe-da34-4ede-9953-b09dc58c708e
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SAP Side-by-Side Integration - OSP
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux_for_SAP_Applications
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Use_Case: Accelerate_Application_Development_And_Delivery
  scheduler:
    enable: true
    data:
      cloud_preference:
        datacenter: dal
        purpose: production
      cloud_selector:
        type: osp
  secrets:
    - name: novello_git_clone_key
      namespace: gpte
    - name: repos-cloudfront-ocp
      namespace: gpte
    - name: sap-side-by-side-secret
      namespace: gpte

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
