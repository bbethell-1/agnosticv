---
platform: rhpds
purpose: testing

# agnosticv_meta
agnosticv_meta:
  idle_after_deploy: 6
  idle_after_start: 6
  secrets:
    - openstack-orange

__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        purpose: production
  deployer:
    scm_ref: osp-infoblox-nios-test-0.5
    virtualenv: openstack-ansible-2.9
