---
platform: rhpds
purpose: development

# agnosticv_meta:
agnosticv_meta:
  agnosticd_git_ref: development
  idle_after_deploy: 2
  idle_after_start: 4
  secrets:
    - openstack-red
    - ans-tower-lab_license
    - ans-tower-lab_secrets
    - satellite-infoblox-secret
__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        purpose: development
  deployer:
    scm_url: https://github.com/redhat-gpst/agnosticd.git
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2020-11-30
