---
# Ansible Tower to be used in the
# Ansible Advanced ILT
# Catalog: Novello Testing
# Catalog Item: Novello Infoblox NIOS Lab

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: ansible-infoblox

software_to_deploy: tower
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# Platform
platform: rhpds

# On OpenStack do not use swift
osp_use_swift: false

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: True

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite
satellite_activationkey: ansible-advanced-2.0
set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

satellite_manifest_url: "https://www.opentlc.com/satellite/tower_manifest_2021.zip"

# Update RHEL to the latest packages (and reboot)
update_packages: true

#student user
student_name: lab-user

### VScoder server variables
vscode_user_name: "{{ control_user_name }}"
vscode_server_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}.{{ osp_cluster_dns_zone }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
    # No parameter variables
    parameters: []
  secrets:
    - name: satellite-manifest-get
      namespace: gpte
    - name: ans-tower-lab_license
      namespace: gpte
    - name: labsat-secrets
      namespace: gpte
