---
purpose: build

ctrl01_instance_image: GLOBAL-empty
ctrl02_instance_image: GLOBAL-empty
ctrl03_instance_image: GLOBAL-empty
compute01_instance_image: GLOBAL-empty
compute02_instance_image: GLOBAL-empty

osp_copy_vm_disk_to_image_task: True
osp_copy_vm_disk_to_image_list:
  - src: "ctrl01"
    dest: "osp16-ospan-ctrl01-dev-latest"
  - src: "ctrl02"
    dest: "osp16-ospan-ctrl02-dev-latest"
  - src: "ctrl03"
    dest: "osp16-ospan-ctrl03-dev-latest"
  - src: "compute01"
    dest: "osp16-ospan-compute01-dev-latest"
  - src: "compute02"
    dest: "osp16-ospan-compute02-dev-latest"
  - src: "undercloud"
    dest: "osp16-ospan-undercloud-dev-latest"

agnosticv_meta:
  agnosticd_git_ref: osp-images
  secrets:
    - openstack-dev-secret
