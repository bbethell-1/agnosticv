---
# Why is this config being deployed?
# Some valid: development, ilt, production, event
purpose: test  ## This is a cost tag, please make sure it's correct.

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# The domain that you want to add DNS entries to
# This should come from the openstack-<color>-secret
# osp_cluster_dns_zone: green.osp.opentlc.com

# The dynamic DNS server you will add entries to.
# This should come from the openstack-<color>-secret
# NOTE: This is only applicable when {{ use_dynamic_dns}} is true
# osp_cluster_dns_server: ddns01.opentlc.com

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: True

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# The default will be false and get certs from the Let's Encrypt staging server
# This will tell the role to get certs from the production server.
_certbot_production: True

# This will enable the installation of OCP4 disconnected
# It also requires test_pull_secret to be successful
test_deploy_enable: false
test_deploy_results: false

ceph_cluster: "{{ osp_cluster_dns_zone.split('.')[0] }}"

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  secrets:
  - openstack-green-secret

  idle_after_deploy: 8

  idle_after_start: 10

  agnosticd_git_tag_prefix: elt-ocp4-disconnected-test

  # babylon:
  # This file lives in ~/secrets on the deploy host
  # kubeconfig: babytest.kubeconfig

##########################
# Babylon meta variables #
##########################
__meta__:
  secrets:
  - namespace: gpte
    name: openstack-green-secret

  deployer:
    scm_ref: elt-ocp4-disconnected-test-0.1

  catalog:
    namespace: gpte

    description: >-
      OpenShift disconnected

    tags:
    - babylon
