---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# These will influence the bastion if it is being deployed
bastion_instance_type: 2c2g30d
bastion_instance_image: pntae-rhel-9.0-original

# These will influence the utility VM, which is primarily used for disconnected
# install, but can be used for anything really.
utilityvm_instance_type: 2c2g30d
utilityvm_instance_image: pntae-rhel-9.0-original

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  agnosticd_git_ref: development
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 Disconnected
    category: Labs
    keywords:
    - labs
    - ocp4
    - ocp4-disconnected
    - rhel9imagebuilder
    labels:
      Product: Red_Hat_Openshift_Platform
      Provider: RHPDS
      Product_Family: Red_Hat_Openshift_Platform
    parameters: []
  secrets:
  - name: satellite-rhel90-ha
    namespace: gpte
