---
# Red Hat Summit 2020 - T78321 - The Definitive Red Hat Enterprise Linux 8
# course_id: RHS_2020_T78321

# Platform
platform: RHPDS

# Config
env_type: rhel8lab

cloud_provider: osp
osp_auth_project_domain: default

output_dir: /tmp/workdir                # Writable working scratch directory

key_name: opentlc_admin_backdoor # Keyname must exist in AWS

# Satellite Vars:
satellite_url: labsat.opentlc.com
repo_method: satellite
use_content_view: true

rhel_repos:
  - rhel-8-for-x86_64-appstream-rpms
  - rhel-8-for-x86_64-baseos-rpms
  - ansible-2-for-rhel-8-x86_64-rpms


ansible_user: cloud-user
remote_user: cloud-user

# Instance type
workstation_instance_type: 2c4g30d
core_instance_type: 2c4g30d
node1_instance_type: 2c4g30d
node2_instance_type: 2c4g30d
node3_instance_type: 2c4g30d

___image: rhel-8.1  # red
# ___image: rhel-8.1-update-3  # standard

workstation_instance_image: "{{ ___image }}"
core_instance_image: "{{ ___image }}"
node1_instance_image: "{{ ___image }}"
node2_instance_image: "{{ ___image }}"
node3_instance_image: "{{ ___image }}"

student_name: student
install_student_user: true

admin_user: opentlc-mgr

update_all_packages: false

osp_project_create: true

instances:
  - name: workstation
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image_id: "{{ workstation_instance_image }}"
    flavor:
      ec2: "{{workstation_instance_type}}"
      osp: "{{workstation_instance_type}}"
      azure: Standard_A2_V2
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_workstation }}"
    security_groups:
      - BastionSG

  - name: "core"
    count: "{{core_instance_count}}"
    public_dns: false
    image_id: "{{ core_instance_image }}"
    flavor:
      ec2: "{{core_instance_type}}"
      osp: "{{core_instance_type}}"
      azure: "Standard_A2_V2"
    tags:
      - key: "AnsibleGroup"
        value: "cores"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    key_name: "{{key_name}}"
    security_groups:
      - DefaultSG

  - name: "node1"
    count: "{{node1_instance_count}}"
    public_dns: false
    image_id: "{{ node1_instance_image }}"
    flavor:
      ec2: "{{node1_instance_type}}"
      azure: "Standard_A2_V2"
      osp: "{{node1_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    key_name: "{{key_name}}"
    security_groups:
      - DefaultSG

  - name: "node2"
    count: "{{node2_instance_count}}"
    public_dns: false
    image_id: "{{ node2_instance_image }}"
    flavor:
      ec2: "{{node2_instance_type}}"
      azure: "Standard_A2_V2"
      osp: "{{node2_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    key_name: "{{key_name}}"
    security_groups:
      - DefaultSG

  - name: "node3"
    count: "{{node3_instance_count}}"
    public_dns: false
    image_id: "{{ node3_instance_image }}"
    flavor:
      ec2: "{{node3_instance_type}}"
      azure: "Standard_A2_V2"
      osp: "{{node3_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    key_name: "{{key_name}}"
    security_groups:
      - DefaultSG

agnosticv_meta:
  virtualenv: openstack-ansible-2.9

  secrets:
    - bookbag-deployer-rhpds4
    - guidgrabber-api
