---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    # Ignore parameters that cannot be known in advance to support pooling
    cloudtags: ''
    email: ''
    guid: guid
    ipapass: ''
    serviceid: ''
    user: ''
    uuid: uuid
  virtualenv: babylon
  secrets:
  - satellite-rhel81
  - ocp4-disconnected-osp-lab-pull-secret

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
    tags:
    - babylon
  deployer:
    virtualenv: openstack-ansible-2.9
    scm_ref: development
    type: agnosticd
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  secrets:
  - namespace: gpte
    name: satellite-rhel81
  - namespace: gpte
    name: ocp4-disconnected-osp-lab-pull-secret
  - namespace: gpte
    name: openstack-red
