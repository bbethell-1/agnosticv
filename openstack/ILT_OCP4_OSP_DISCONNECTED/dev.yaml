---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# These will influence the bastion if it is being deployed
bastion_instance_type: 2c2g30d
bastion_instance_image: pntae-rhel-9.0-original

# These will influence the utility VM, which is primarily used for disconnected
# install, but can be used for anything really.
utilityvm_instance_type: 2c2g30d
utilityvm_instance_image: pntae-rhel-9.0-original

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  secrets:
  - name: satellite-rhel90-ha
    namespace: gpte
  - name: ocp4-disconnected-osp-lab-pull-secret
    namespace: gpte
