---
# Why is this config being deployed?
# Some valid: development, ilt, production, event
purpose: development  ## This is a cost tag, please make sure it's correct.

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user


agnosticv_meta:
  secrets:
    - openstack-red-secret
  agnosticd_git_ref: development
