---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Test deploy
# -------------------------------------------------------------------

# This will enable the installation of OCP4 disconnected
# It also requires test_pull_secret to be successful
test_deploy_enable: false
test_deploy_results: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 10
  agnosticd_git_tag_prefix: ocp4-disconnected-osp-lab-test
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  secrets:
  - namespace: gpte
    name: openstack-test-secret

  deployer:
    scm_ref: ocp4-disconnected-osp-lab-test-0.3

  catalog:
    namespace: gpte

    description: >-
      OpenShift disconnected

    tags:
    - babylon
