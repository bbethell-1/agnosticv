---
platform: RHPDS
env_type: osp-migration

common_install_basic_packages_retries: 0
repo_method: file
install_student_user: true

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

agnosticv_meta:
  # The workstation VM from the template of this BP doesn't have
  # cloud-init installed.
  # The infra key created in the stack is not injected into authorized_keys,
  # so agnosticd cannot connect to the bastion / workstation.
  #
  # We want to just deploy the heat stack and skip the steps after that,
  # except the step003 and step005 which will just print the post-software
  # successful string that is expected by cloudforms.
  ansible_additional_args: --skip-tags wait_ssh,step002,step004

  virtualenv: openstack-ansible-2.9

  secrets:
    - novello_git_clone_key
    # Required by env_type osp-migration
    # ibm_api_key, ibm_bucket_name, ibm_endpoint, ibm_auth_endpoint, ibm_resource_id
    - ibm-cos-secrets

  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    user: student_name

    # Cloudforms passes the template to deploy
    novello-template: project
