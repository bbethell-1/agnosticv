    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
  deployer:
    #scm_ref: ocp4-odf4-sapdi3-wksp-prod
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: repos-cloudfront-ocp
      namespace: gpte
