# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    display_name: OCP4-ODF4-SAPDI3-WKSP
    namespace: gpte
    parameters:
