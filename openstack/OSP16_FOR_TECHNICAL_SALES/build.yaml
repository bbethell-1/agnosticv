---
purpose: build

ctrl01_instance_image: GLOBAL-empty
compute01_instance_image: GLOBAL-empty
compute02_instance_image: GLOBAL-empty

osp_copy_vm_disk_to_image_task: True
osp_copy_vm_disk_to_image_list:
  - src: "ctrl01"
    dest: "osp16-for-technical-sales-ctrl01-dev-latest"
  - src: "compute01"
    dest: "osp16-for-technical-sales-compute01-dev-latest"
  - src: "compute02"
    dest: "osp16-for-technical-sales-compute02-dev-latest"
  - src: "undercloud"
    dest: "osp16-for-technical-sales-undercloud-dev-latest"


agnosticv_meta:
  agnosticd_git_ref: development
  ansible_additional_args: --skip-tags bastion_tasks
