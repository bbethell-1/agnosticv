---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

purpose: development

ctrl01_instance_image: GLOBAL-empty
ctrl02_instance_image: GLOBAL-empty
ctrl03_instance_image: GLOBAL-empty
compute01_instance_image: GLOBAL-empty
compute02_instance_image: GLOBAL-empty

agnosticv_meta:
  deploy_with: babylon
  agnosticd_git_ref: development
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        purpose: development
  anarchy:
    namespace: babylon-anarchy-openstack
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    scm_ref: development
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenStack 16 Concepts and Architecture
    category: Labs
    keywords:
    - OpenStack
    labels:
      Provider: RHPDS
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters: []
  secrets:
  - namespace: gpte
    name: ibm-cos-secrets
