---
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Student VM
# --- ELT/ILT: Multiple
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: studentvm
software_to_deploy: none

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# OpenShift Versions (as of 2021/06/03)
# -------------------------------------------------------------------
ocp_client_44: "4.4.33"
ocp_client_45: "4.5.40"
ocp_client_46: "4.6.30"
ocp_client_47: "4.7.12"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
# Set up FTL.
# install_ftl: false

# -------------------------------------------------------------------
# Student roles to deploy
# -------------------------------------------------------------------
studentvm_roles:
# Set up a Student User
- studentvm_user
# Customize the Student User with a Git Bash Prompt
- studentvm_bash_prompt
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4
# Set up JDK and Maven
- studentvm_java_development

# -------------------------------------------------------------------
# student role: studentvm_user
# -------------------------------------------------------------------
# Install a user id "{{ student_name }}"
studentvm_user_name: "{{ student_name }}"
# Use a password for the student user.
# If false a key pair will be generated
studentvm_user_use_password: true
# If no student_password is provided a randomly generated password will be used
studentvm_user_password: ""
# This user will have sudo access
studentvm_user_enable_sudo: true

# -------------------------------------------------------------------
# student role: studentvm_ocp4
# -------------------------------------------------------------------
# Install for the current student
studentvm_ocp4_user_name: "{{ student_name }}"
studentvm_ocp4_oc_version: "{% if osrelease is version_compare('4.7.0', '>=') %}{{ ocp_client_47}}{% elif osrelease is version_compare('4.6.0', '>=') and osrelease is version_compare('4.7.0', '<') %}{{ ocp_client_46}}{% elif osrelease is version_compare('4.5.0', '>=') and osrelease is version_compare('4.6.0', '<') %}{{ ocp_client_45}}{% else %}{{ ocp_client_44 }}{% endif %}"
studentvm_ocp4_odo_version: 'v2.0.0'
studentvm_ocp4_kn_version: '0.16.1'
studentvm_ocp4_istioctl_version: '1.4.10'

# -------------------------------------------------------------------
# student role: studentvm_bash_prompt
# -------------------------------------------------------------------
# Install for the current student
studentvm_bash_prompt_user_name: "{{ student_name }}"

# -------------------------------------------------------------------
# student role: studentvm_java_development
# -------------------------------------------------------------------
# Install JDK 8 (default is 11)
studentvm_java_development_jdk_package: "java-1.8.0-openjdk-devel"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  virtualenv: openstack-ansible-2.9
  secrets:
  - satellite-rhel81-ha

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: addfc702-4f0f-4075-9e40-65e8876d12ec
  # Dark Tower configuration
  tower:
    organization: gpte

  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    type: agnosticd
