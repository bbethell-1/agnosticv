---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/satellite-rhel84.yml
#include /includes/secrets/opentlc-mgr-migration-host.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/access-restriction-devs-only.yaml

# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OCS 4 Implementation
# --- ELT: OpenShift Container Storage Implementation
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster

# software deployment from software_playbooks
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs
rhcos_image_name: rhcos-ocp48
quota_volumes_gigs: 6000
worker_storage_type: tripleo
worker_storage_size: 1024
quota_num_cores: 92
quota_memory: 418000 # in MB
quota_num_volumes: 25
quota_fip: 10


# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: 4c16g30d
worker_instance_type: 16c64g100d
worker_instance_count: 3

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.8.3"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# Do not use SWIFT
osp_use_swift: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp-workload-terminal
- ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: 50
ocp4_workload_authentication_admin_user: opentlc-mgr
ocp4_workload_authentication_admin_password: r3dh4t1!
ocp4_workload_authentication_remove_kubeadmin: true

#--------------------------------------------------------------------
# Workaround: ocp4_scsi_device_detection_workaround
# On OpenStack 16 device ids are not truncated to 20 characters.
# This MachineConfig adds a udev configuration to work around this issue.
# https://bugzilla.redhat.com/show_bug.cgi?id=1897603
#--------------------------------------------------------------------
ocp4_scsi_device_detection_workaround: true


# -------------------------------------------------------------------
# AgnosticV Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ''

__meta__:
  asset_uuid: 532687bd-2f15-4b56-8fad-bbdb3b43e93d
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    display_name: ODF 4 Implementation
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha
      pull: missing
  secrets:
  - name: ocs4-internal-imp
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
