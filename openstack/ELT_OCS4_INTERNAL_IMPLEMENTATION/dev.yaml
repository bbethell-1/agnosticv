---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
# master_instance_type: 4c16g30d
# master_instance_count: 3
# worker_instance_type: 8c16g30d
# worker_instance_count: 2
# bastion_instance_type: 2c2g30d

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
# OpenShift Installer version to use
ocp4_installer_version: "4.8.3"

# Instance Types to be passed to OpenShift Installer
master_instance_type: 4c16g30d
worker_instance_type: 16c64g100d
worker_instance_count: 3

agnosticv_meta:
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
  scheduler:
    enable: true
    data:
      cloud_selector:
        type: osp
      cloud_preference:
        purpose: development
        datacenter: dal
        region: na
  secrets:
  - name: ocs4-internal-imp
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
