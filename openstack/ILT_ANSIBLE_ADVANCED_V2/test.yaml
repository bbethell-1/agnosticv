---
purpose: test

# Image project to download image
image_project:
  - ansible-dev-images

# Control user settings for Role: control-user
control_user_name: devops
control_user_resource_dir_name: materials
control_user_ssh_config: ./files/ssh_config.j2
control_user_directories:
  - ".config/openstack"
control_user_copy_user_templates:
  - template: ./files/clouds.yaml.j2
    resource: clouds.yaml
    home: .config/openstack/clouds.yaml
control_user_copy_user_files:
  - file: ./files/subenv_heat_template.j2
    resource: subenv_heat_template.j2
  - file: ./files/subenv_default_vars.yml.j2
    resource: subenv_default_vars.yml

# Satellite login details
satellite_user_name: admin
satellite_user_password: "r3dh4t1!"

# VScoder server variables
vscode_user_name: "{{ control_user_name }}"
vscode_server_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}.{{ osp_cluster_dns_zone }}"

# agnosticv_meta:

agnosticv_meta:
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
  agnosticd_git_ref: aa-v2.0-initial
