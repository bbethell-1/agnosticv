---
platform: rhpds
purpose: development

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# Use Let's Encrypt Prod certificates
ocp4_workload_le_certificates_install_certificates: false

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        purpose: production
  deployer:
    scm_url: https://github.com/RHFieldProductManagement/agnosticd.git
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
