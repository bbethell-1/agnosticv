---
platform: rhpds
purpose: production

# How many times Heat will retry to deploy template if it fails
# Keep this low for development and a little higher for production
heat_retries: 0

# Minimize the number of times we try to install packages before failing
# Ten is the default
common_install_basic_packages_retries: 1

# Use Let's Encrypt Prod certificates
ocp4_workload_le_certificates_install_certificates: false

# Below master_instance_type was already
# master_instance_type: 8c16g30d

agnosticv_meta:
  idle_after_deploy: 10
  idle_after_start: 10

__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    scm_ref: ocp4-knilab-rhpds-prod-0.1
    type: agnosticd
