---
# THREE TIER APP
# Catalog: OpenTLC Automation
# Catalog Item: Ansible Advanced - THREE TIER APP

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: three-tier-app
software_to_deploy: none
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# Platform
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: file
repo_version: 3.7.3-1
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/tower/

# Update RHEL to the latest packages (and reboot)
update_packages: true

#student user
student_name: lab-user

# Control user settings
control_user_name: devops
control_user_resource_dir_name: materials
control_user_ssh_config: ./files/ssh_config.j2

agnosticv_meta:
  virtualenv: openstack-ansible-2.9
  params_to_variables:
    username: student_name

__meta__:
  secrets:
    - name: ans-tower-lab_license
      namespace: gpte
