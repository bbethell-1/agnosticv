---
purpose: test

ceph_cluster: '{{ osp_cluster_dns_zone.split(''.'')[0] }}'

##Heat vars
common_install_basic_packages_retries: 0
heat_retries: 0

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: summit-2020-hands-on-with-sat67-prod-0.3

  scheduler:
    enable: true
    url: https://scheduler-scheduler-gpe-demo.apps.cluster-babydev.babydev.dev.open.redhat.com
    endpoint: /api/v1/schedule
    data:
      uuid: "{{ uuid }}"
      cloud_preference:
        purpose: production
        datacenter: dal
