---
purpose: build

provision_instance_image: "rhel-8.4"
master01_instance_image: "GLOBAL-empty"
master02_instance_image: "GLOBAL-empty"
master03_instance_image: "GLOBAL-empty"

worker01_instance_image: "GLOBAL-empty"
worker02_instance_image: "GLOBAL-empty"
worker03_instance_image: "GLOBAL-empty"

osp_copy_vm_disk_to_image_task: True
osp_copy_vm_disk_to_image_list:
  - src: "provision"
    dest: "hands-on-with-openshift-virtualization-provision-dev-latest"
  - src: "master01"
    dest: "hands-on-with-openshift-virtualization-master01-dev-latest"
  - src: "master02"
    dest: "hands-on-with-openshift-virtualization-master02-dev-latest"
  - src: "master03"
    dest: "hands-on-with-openshift-virtualization-master03-dev-latest"
  - src: "worker01"
    dest: "hands-on-with-openshift-virtualization-worker01-dev-latest"
  - src: "worker02"
    dest: "hands-on-with-openshift-virtualization-worker02-dev-latest"
  - src: "worker03"
    dest: "hands-on-with-openshift-virtualization-worker03-dev-latest"

__meta__:
  catalog:
    namespace: babylon-catalog-dev
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
