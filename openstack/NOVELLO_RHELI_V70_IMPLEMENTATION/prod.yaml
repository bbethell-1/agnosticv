    scm_ref: OPTLC-RHELI_v7.0_Implementation-v1.16-bp-prod-0.5
  scheduler:
    enable: true
    data:
      cloud_selector:
        type: osp
      cloud_preference:
        purpose: production
        datacenter: dal
