---
purpose: release
repo_method: ""

undercloud_instance_image: rhel-8.4-osp162-undercloud-dev-latest

osp_upload_storage_to_ibmcloud_task: True
osp_upload_storage_to_ibmcloud_list:
  - type: "vms"
    items:
      - src: "undercloud"
        dest: "undercloud-v1.qcow2"

agnosticv_meta:
  agnosticd_git_ref: osp-images
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
