---
#include /includes/parameters/enable-lets-encrypt.yaml
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: labs

ocp4_installer_version: "4.5.13"
osp_use_swift: false

set_repositories_satellite_ha: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# What we use in this environment to get the packages we need
repo_method: satellite

# RHCOS Image
rhcos_image_name: rhcos-ocp45

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# OpenShift Cluster Customization
# -------------------------------------------------------------------

# Do not run any infrastructure customization.
# This will result in a default OpenShift 4 installation.
infra_workloads:
  - ocp4_workload_le_certificates
  - ocp4-workload-cnvlab

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

agnosticv_meta:
  virtualenv: openstack-ansible-2.9
  secrets:
    - ocp4_token

__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    display_name: Hands-On with OpenShift Virtualization
