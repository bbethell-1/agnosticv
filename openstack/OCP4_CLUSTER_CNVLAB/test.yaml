---
purpose: development

# Use Let's Encrypt Prod certificates
ocp4_workload_le_certificates_install_certificates: true

master_instance_type: 8c16g30d

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  secrets:
    - cnv-satellite
  agnosticd_git_tag_prefix: ocp4-cluster-cnvlab-test
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
