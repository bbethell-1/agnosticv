---
purpose: development

########################################
# Mandatory vars #
########################################
migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem

output_dir: /tmp/workdir

########################################
# Student user on bastion #
########################################
# --- student_name not set -> Requestor User ID is used as student_name
#student_name:
# --- student_password not set -> generate random password
student_password: openshift
# --- Student is allowed to sudo and switch to root
student_sudo: true

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
#  anarchy:
#    namespace: babylon-anarchy-openstack
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
      - name: email
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: novello_git_clone_key
      namespace: gpte
    - name: ibm-cos-secrets
      namespace: gpte
    #- name: repos-labsat-ocp-on-osp
