---
purpose: development
external_network: ee9d9e11-9f4b-4b78-8802-3d3e670ca0f0
# Red is dev cluster
osp_cluster_dns_zone: red.osp.opentlc.com
osp_cluster_dns_server: ddns01.opentlc.com

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  catalog:
    namespace: gpte
    # No parameter variables
    parameters: []
    tags:
    - babylon
  scheduler:
    enable: true
    data:
      cloud_preference:
      purpose: development
  secrets:
  - name: novello_git_clone_key
    namespace: gpte
  - name: ibm-cos-secrets
    namespace: gpte
  - name: repos-labsat-ocp-on-osp
