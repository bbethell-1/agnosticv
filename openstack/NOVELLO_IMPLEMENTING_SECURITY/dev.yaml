---
purpose: development
external_network: ee9d9e11-9f4b-4b78-8802-3d3e670ca0f0
# Red is dev cluster
osp_cluster_dns_zone: red.osp.opentlc.com
osp_cluster_dns_server: ddns01.opentlc.com

# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab_user
# --- student_password not set -> generate random password
student_password: openshift
# --- Student is allowed to sudo and switch to root
student_sudo: true

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  catalog:
    namespace: gpte
    # No parameter variables
    parameters:
      - name: student_name
      - name: email
  scheduler:
    enable: false
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: novello_git_clone_key
      namespace: gpte
    - name: ibm-cos-secrets
      namespace: gpte
 #   - name: repos-labsat-ocp-on-osp
