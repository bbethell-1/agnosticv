---
purpose: test

########################################
# Mandatory vars #
########################################
migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem

output_dir: /tmp/workdir

########################################
# Student user on bastion #
########################################
# --- student_name not set -> Requestor User ID is used as student_name
#student_name: lab-user
# --- student_password not set -> generate random password
student_password: openshift
# --- Student is allowed to sudo and switch to root
student_sudo: true

########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    # This should be overwritten based on the user ordering the catalog item
    # It will be used by the bastion-student-user role and created on the bastion
    username: student_name

##########################
# Babylon meta variables #
##########################

__meta__:
  scheduler:
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
  deployer:
    git_tag_prefix: PROD-SUMMIT-L1034-bp-test
