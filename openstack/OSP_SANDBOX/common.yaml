---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

env_type: osp-sandbox
cloud_provider: osp

platform: rhpds
install_student_user: true
install_ipa_client: false
repo_method: file
osrelease: 4.6.0
repo_version: '4.6.0'
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/{{osrelease}}
key_name: opentlc_admin_backdoor
osp_project_create: true
osp_project_name: "{{ guid }}-project"
use_dynamic_dns: true

agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon
  agnosticd_git_ref: development


# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenStack Developer's Sandbox
    category: Demos
    labels:
      Product: Red_Hat_OpenStack
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    keywords:
      - Convert
      - RHEL
      - CENTOS
  secrets:
    - namespace: gpte
      name: tower-manifest-get
    - namespace: gpte
      name: dynamic-dns
    - namespace: gpte
      name: satellite-rhel81-ha
    - name: repos-labsat-ocp-on-osp
      namespace: gpte
