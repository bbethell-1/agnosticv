---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/access-restriction-devs-only.yaml

env_type: osp-sandbox
cloud_provider: osp
platform: rhpds
install_student_user: true
install_ipa_client: false
key_name: opentlc_admin_backdoor
osp_project_create: true
osp_project_name: "{{ guid }}-project"
use_dynamic_dns: true
repo_method: satellite
update_packages: true
bastion_instance_image: rhel-8.1
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon
  agnosticd_git_ref: development
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: false
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenStack Developer's Sandbox
    category: Demos
    labels:
      Product: Red_Hat_OpenStack_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    keywords:
      - Convert
      - RHEL
      - CENTOS
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: tower-manifest-get
      namespace: gpte
    - name: dynamic-dns
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
