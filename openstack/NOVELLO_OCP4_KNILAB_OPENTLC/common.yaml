---
# -------------------------------------------------------------------
# --- Catalog: OPENTLC OpenShift 4 Labs
# --- Catalog Item: OCP4 Kubernetes Native Infrastructure
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------

platform: labs

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: kni-osp
software_to_deploy: none
osp_use_swift: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# What we use in this environment to get the packages we need
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

student_name: lab-user

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
# By setting the ftl_injector_tag, you imply that you want to install FTL
# This tag specifies the version of the ftl-injector that will be deployed.
# It is different from the version of FTL.
#ftl_injector_tag: v0.17.0

# Set this to true if you need to create a new project in OpenStack
# This should almost always be set to true for OpenShift installations
# If it is set to false, the {{ osp_project_name }} must already exist and
# should be able to run whatever you are deploying
osp_project_create: false

# The name of the project that will be created in OpenStack for the user
#osp_project_name: "{{ guid }}-project"

# -------------------------------------------------------------------
# Openstack variables
# -------------------------------------------------------------------

quota_num_instances: 20
quota_num_cores: 72
quota_memory: 209920 # in MB
quota_num_volumes: 25
quota_volumes_gigs: 1024
quota_subnets: 3
quota_routers: 3
quota_fip: 5
quota_sg: 10
quota_sg_rules: 100

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 2
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  secrets:
    - name: openstack-orange
      namespace: gpte
    - name: cnv-satellite
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
  deployer:
    virtualenv: openstack-ansible-2.9

  catalog:
    namespace: gpte
