---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: 4c16g30d
master_instance_count: 3
worker_instance_type: 4c8g30d
worker_instance_count: 2
bastion_instance_type: 2c2g30d

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  # Set tag prefix here for prod
  agnosticd_git_tag_prefix: elt-ocp4-mesh-prod
  idle_after_deploy: 4
  idle_after_start: 4
  secrets:
  - openstack-pink

  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
