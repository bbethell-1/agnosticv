---
purpose: build

ctrl01_instance_image: GLOBAL-empty
ctrl02_instance_image: GLOBAL-empty
ctrl03_instance_image: GLOBAL-empty
compute01_instance_image: GLOBAL-empty
compute02_instance_image: GLOBAL-empty

osp_copy_vm_disk_to_image_task: True
osp_copy_vm_disk_to_image_list:
  - src: "ctrl01"
    dest: "osp16-ospan-ml2ovs-ctrl01-dev-latest"
  - src: "ctrl02"
    dest: "osp16-ospan-ml2ovs-ctrl02-dev-latest"
  - src: "ctrl03"
    dest: "osp16-ospan-ml2ovs-ctrl03-dev-latest"
  - src: "compute01"
    dest: "osp16-ospan-ml2ovs-compute01-dev-latest"
  - src: "compute02"
    dest: "osp16-ospan-ml2ovs-compute02-dev-latest"
  - src: "undercloud"
    dest: "osp16-ospan-ml2ovs-undercloud-dev-latest"

agnosticv_meta:
  agnosticd_git_ref: osp-images
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
