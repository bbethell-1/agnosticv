---
purpose: release

ctrl01_instance_image: osp16-ospan-ml2ovs-ctrl01-dev-latest
ctrl02_instance_image: osp16-ospan-ml2ovs-ctrl02-dev-latest
ctrl03_instance_image: osp16-ospan-ml2ovs-ctrl03-dev-latest
compute01_instance_image: osp16-ospan-ml2ovs-compute01-dev-latest
compute02_instance_image: osp16-ospan-ml2ovs-compute02-dev-latest
undercloud_instance_image: osp16-ospan-ml2ovs-undercloud-dev-latest
osp_upload_storage_to_ibmcloud_task: True
osp_upload_storage_to_ibmcloud_list:
  - type: "vms"
    items:
      - src: "ctrl01"
        dest: "ctrl01-ml2ovs-v1.qcow2"
      - src: "ctrl02"
        dest: "ctrl02-ml2ovs-v1.qcow2"
      - src: "ctrl03"
        dest: "ctrl03-ml2ovs-v1.qcow2"
      - src: "compute01"
        dest: "compute01-ml2ovs-v1.qcow2"
      - src: "compute02"
        dest: "compute02-ml2ovs-v1.qcow2"
      - src: "undercloud"
        dest: "undercloud-ml2ovs-v1.qcow2"

agnosticv_meta:
  agnosticd_git_ref: osp-images
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
