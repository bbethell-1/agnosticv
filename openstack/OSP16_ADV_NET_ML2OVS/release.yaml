---
purpose: release

ctrl01_instance_image: osp16-concepts-architecture-ctrl01-dev-latest
ctrl02_instance_image: osp16-concepts-architecture-ctrl02-dev-latest
ctrl03_instance_image: osp16-concepts-architecture-ctrl03-dev-latest
compute01_instance_image: osp16-concepts-architecture-compute01-dev-latest
compute02_instance_image: osp16-concepts-architecture-compute02-dev-latest
undercloud_instance_image: osp16-concepts-architecture-undercloud-dev-latest
ipa_instance_image: osp16-concepts-architecture-ipa-dev-latest
osp_upload_storage_to_ibmcloud_task: True
osp_upload_storage_to_ibmcloud_list:
  - type: "vms"
    items:
      - src: "ctrl01"
        dest: "ctrl01-v1.qcow2"
      - src: "ctrl02"
        dest: "ctrl02-v1.qcow2"
      - src: "ctrl03"
        dest: "ctrl03-v1.qcow2"
      - src: "compute01"
        dest: "compute01-v1.qcow2"
      - src: "compute02"
        dest: "compute02-v1.qcow2"
      - src: "undercloud"
        dest: "undercloud-v1.qcow2"
      - src: "ipa"
        dest: "ipa-v1.qcow2"

agnosticv_meta:
  agnosticd_git_ref: osp-images
  secrets:
    - openstack-dev-secret
