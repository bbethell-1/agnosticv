---
#include /includes/parameters/enable-lets-encrypt.yaml
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Advanced App Deploy ILT (Cluster)
# --- ILT: OpenShift 4 Advanced Application Deployment (2021 Version)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: osp
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# OpenStack Project Quota
# -------------------------------------------------------------------
quota_num_cores: 122 # 8*3 (masters) + 16*6 (workers) + 2 (bastion)
quota_memory: 450000 # in MB, 16*3 (masters) + 64*6 (workers) + 2 (bastion) 434Gi
quota_num_volumes: 100
quota_volumes_gigs: 1500 # 100*3 (mastesr) + 100*6 (workers) + 30 (bastion) + 500 for User Volumes

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.9"
rhcos_image_name: rhcos-ocp49

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# Do not use SWIFT
osp_use_swift: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_serverless
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_sealed_secrets
- ocp4_workload_nexus_operator
- ocp4_workload_gitea_operator
- ocp4_workload_adv_app_deploy_ilt
- ocp4_workload_le_certificates

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 25
ocp4_workload_authentication_remove_kubeadmin: true

# ---------------------------------------------------------
# OpenShift Serverless
# ---------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_eventing: true
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_serverless_catalog_snapshot_image_tag: v4.9_2022_01_10

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: stable
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.9_2022_01_10
ocp4_workload_pipelines_tkn_version: 0.21.0

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.9_2022_01_10

ocp4_workload_openshift_gitops_install_workaround: false

# -------------------------------------------------------------------
# ocp4_workload_sealed_secrets
# -------------------------------------------------------------------
ocp4_workload_sealed_secrets_deploy_using_helm: true
ocp4_workload_sealed_secrets_namespace: sealed-secrets
ocp4_workload_sealed_secrets_helm_chart_version: 2.0.0
#ocp4_workload_sealed_secrets_version: v0.17.1
ocp4_workload_sealed_secrets_kubeseal_version: 0.17.1
ocp4_workload_sealed_secrets_deploy_admin_role: true

# ---------------------------------------------------------
# Nexus Operator
# ---------------------------------------------------------
ocp4_workload_nexus_operator_project: nexus
ocp4_workload_nexus_operator_project_display: "Nexus"
ocp4_workload_nexus_operator_name: nexus
ocp4_workload_nexus_operator_cpu_request: "4"
ocp4_workload_nexus_operator_cpu_limit: "4"
ocp4_workload_nexus_operator_ssl_route: true
ocp4_workload_nexus_operator_new_admin_password: "redhat"
ocp4_workload_nexus_operator_nexus_image_tag: "3.36.0-ubi-1"
ocp4_workload_nexus_operator_enable_anonymous: true
ocp4_workload_nexus_operator_repos_delete_default: true

ocp4_workload_nexus_operator_repos_maven_proxy_setup: true
ocp4_workload_nexus_operator_repos_maven_proxy:
- name: maven-central
  remote_url: https://repo1.maven.org/maven2/
  blob_store: default
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
# Do not use `redhat` in your repository name. Somehow that gets converted into *****
- name: rh-ga
  remote_url: https://maven.repository.redhat.com/ga/
  blob_store: default
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
- name: rh-earlyaccess
  remote_url: https://maven.repository.redhat.com/earlyaccess/
  blob_store: default
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
- name: jboss
  remote_url: https://repository.jboss.org/nexus/content/groups/public
  blob_store: default
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive

# Maven Hosted Repositories
ocp4_workload_nexus_operator_repos_maven_hosted_setup: true
ocp4_workload_nexus_operator_repos_maven_hosted:
- name: releases
  blob_store: default
  write_policy: allow # allow_once or allow
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
- name: snapshots
  blob_store: default
  write_policy: allow # allow_once or allow
  strict_content_validation: true
  version_policy: snapshot # release, snapshot or mixed
  layout_policy: strict # strict or permissive

# Maven Group
ocp4_workload_nexus_operator_repos_maven_group_setup: true
ocp4_workload_nexus_operator_repos_maven_group:
- name: maven-all-public
  blob_store: default
  strict_content_validation: true
  member_repos:
  - maven-central
  - rh-ga
  - jboss
  - rh-earlyaccess

# Docker Hosted Repositories
ocp4_workload_nexus_operator_repos_docker_hosted_setup: true
ocp4_workload_nexus_operator_repos_docker_hosted:
- name: registry
  http_port: 5000
  https_port: 5001
  v1_enabled: true
  blob_store: default
  strict_content_validation: true
  write_policy: allow # allow_once or allow

# Helm Hosted Repositories
ocp4_workload_nexus_operator_repos_helm_hosted_setup: true
ocp4_workload_nexus_operator_repos_helm_hosted:
- name: helm
  blob_store: default
  write_policy: allow # allow_once or allow
  strict_content_validation: true
  proprietaryComponents: true # true or false

# NPM Proxy Repositories
ocp4_workload_nexus_operator_repos_npm_proxy_setup: false

# NPM Group Repositories
ocp4_workload_nexus_operator_repos_npm_group_setup: false

# ---------------------------------------------------------
# Gitea Operator
# ---------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.15.9
ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 4Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true
ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_password: r3dh4t1!
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_gitea_operator_generate_user_format: user%d
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_migrate_repositories: true
ocp4_workload_gitea_repositories_list:
- repo: https://github.com/redhat-gpte-devopsautomation/coffee-shop-source.git
  name: coffee-shop-source
  private: true

# -------------------------------------------------------------------
# ocp4_workload_adv_app_deploy_ilt
# -------------------------------------------------------------------
ocp4_workload_adv_app_deploy_ilt_deploy_argocd_namespace_operator: true
ocp4_workload_adv_app_deploy_ilt_argocd_namespace_operator_channel: stable
ocp4_workload_adv_app_deploy_ilt_argocd_namespace_operator_automatic_install_plan_approval: true
ocp4_workload_adv_app_deploy_ilt_argocd_namespace_operator_starting_csv: ""
ocp4_workload_adv_app_deploy_ilt_argocd_namespace_operator_catalog_image: quay.io/gpte-devops-automation/argocd-namespace-catalog
ocp4_workload_adv_app_deploy_ilt_argocd_namespace_operator_catalog_image_tag: v1.0.0

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
#  virtualenv: openstack-ansible-2.9
  virtualenv: ansible2.9-python3.6-2021-11-30
  params_to_variables:
    nodecount: ''
    username: student_name
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81-ha
  # Dynamic DNS
  - dynamic-dns

__meta__:
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    display_name: OpenShift 4 Advanced App Deploy ILT (Cluster)
