---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/ocp4_token.yaml
#include /enterprise/includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/opentlc-mgr-migration-host.yaml
#include /includes/secrets/demosat-rhel-9.0.yaml

# -------------------------------------------------------------------
# CFME Details
# -------------------------------------------------------------------
# Tech Imagebuilder 901
# Catalog:
# Catalog Item:

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: tech-imagebuilder-901
software_to_deploy: none
platform: labs
ssh_provision_key_name: "{{ env_authorized_key }}"
migration_key_path: ~/.ssh/opentlc_admin_backdoor.pem
# -------------------------------------------------------------------
# OSP Variables
# -------------------------------------------------------------------
# On OpenStack do not use swift
osp_use_swift: false

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: true
install_ipa_client: false

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
# Install Student User
install_student_user: true
student_name: lab-user
student_password: "{{ common_password }}"
student_sudo: true


#extra

ssh_command: placeholder
service_display_name: placeholder
ssh_password: placeholder
stop_timedelta_humanized: placeholder
stop_timestamp: placeholder
retirement_timedelta_humanized: placeholder
retirement_timestamp: placeholder
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
find_ip_query: openstack_servers[?name=='{{ _instance_name }}'].public_v4
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
#  meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 14582796-cc90-4cce-80f9-6183b97ee7d6
  anarchy:
    namespace: babylon-anarchy-openstack
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat Enterprise Linux 9 - Using and Supporting Image Builder
    category: Labs
    keywords:
    - labs
    - rhel
    - imagebuilder
    - rhelimagebuilder
    - rhel9
    - rhel9imagebuilder
    labels:
      Product: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
  secrets:
  - name: satellite-rhel90-ha
    namespace: gpte
