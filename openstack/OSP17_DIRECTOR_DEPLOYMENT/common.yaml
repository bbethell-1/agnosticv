---
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/catalog-icon-red-hat-standard-logo.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/opentlc-mgr-migration-host.yaml
#include /includes/ansible_control_plane/current_controller.yaml


## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
platform: RHPDS

# The name of the agnosticd config to deploy
env_type: osp17-director-deployment

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# This is the tag that will be pulled in from the FTL repo
#ftl_tag: TBD

# What we use in this environment to get the packages we need
repo_method: satellite
# satellite_url: satellite.opentlc.com
undercloud_instance_image: pntae-rhel-9.0-original
workstation_instance_image: pntae-rhel-9.0-original
ipmihost_instance_image: rhel-9.0-osp170-ipmihost-dev-latest

workstation_instance_flavor: m1.small
undercloud_instance_flavor: 4c16g100d
ipmihost_instance_flavor: GLOBAL-CPU_2_Memory_2048_Disk_100_flavor

ctrl01_instance_flavor: GLOBAL-CPU_4_Memory_12288_Disk_50_flavor
ctrl02_instance_flavor: GLOBAL-CPU_4_Memory_12288_Disk_50_flavor
ctrl03_instance_flavor: GLOBAL-CPU_4_Memory_12288_Disk_50_flavor
compute01_instance_flavor: GLOBAL-CPU_4_Memory_12288_Disk_50_flavor
compute02_instance_flavor: GLOBAL-CPU_4_Memory_12288_Disk_50_flavor

osp_copy_vm_disk_to_image_task: False
osp_copy_volume_to_image_task: False
osp_upload_storage_to_ibmcloud_task: False

osp_copy_vm_disk_to_image_list: []
osp_copy_volume_to_image_list: []
osp_upload_storage_to_ibmcloud_list: []

# ansible_ssh_private_key_file: ~/.ssh/opentlc_admin_backdoor.pem
migration_key_path: "{{ ansible_ssh_private_key_file | default('') }}"

# Set this to true if you need to create a new project in OpenStack
# This should almost always be set to true for OpenShift installations
# If it is set to false, the {{ osp_project_name }} must already exist and
# should be able to run whatever you are deploying
osp_project_create: true

# The name of the project that will be created in OpenStack for the user
osp_project_name: "{{ guid }}-project"

# IBM Cloud store container
image_store: "{{ env_type }}"

# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - ibm-cos-secrets

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/bookbag-osp17-director-deployment

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 47890cb5-a80d-4ac4-aef0-a2371dff4e26
  anarchy:
    namespace: babylon-anarchy-openstack
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OSP17 Director Deployment
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha.2
      pull: missing
  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: satellite-rhel81-ha
    - namespace: gpte
      name: ibm-cos-secrets
