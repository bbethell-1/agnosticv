---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: test

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: 4c16g30d
worker_instance_type: 16c64g100d
worker_instance_count: 3

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.9.15"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_user_count: 20

# Changing default Cluster and Service Network CIDR.
ocp_cluster_cidr: 10.200.0.0/14
ocp_service_network: 172.31.0.0/16

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: odf-dr-implementation
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: production
        datacenter: dal

__meta__:
  deployer:
    git_tag_prefix: odf-dr-implementation
