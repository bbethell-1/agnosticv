---
# Platform
platform: SPP

# Config
env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.1.4"

# Repos
osrelease: 4.1.0
repo_version: '4.1'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

# Instance Types
bastion_instance_type: t2.medium
master_instance_count: 1
master_instance_type: m5.xlarge
worker_instance_count: 1
worker_instance_type: m5.xlarge

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: true
student_name: student
student_password: rhte2019

# OCP Authentication
install_idm: htpasswd
admin_user: admin
admin_password: rhte2019
user_password: rhte2019

# Workloads to deploy on the cluster
default_workloads:
- ocp4-workload-kube-federation
- ocp4-workload-openshift-pipelines

infra_workloads: {}
student_workloads: {}

# Tags to AWS Instances
cloud_tags:
- owner: wkulhane@redhat.com
- class: A0007
- shared: no
- reason: rhte2019

# Idle settings
idle_after_deploy: 26
idle_after_start: 8