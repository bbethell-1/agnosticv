---
# -------------------------------------------------------------------
# --- Catalog: Cutting Edge Workshops
# --- Catalog Item: CCN Roadshow for Dev Track - OCP 4.7
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.7.2

# Ability to use Let's Encrypt Certificates
install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4-workload-ccnrd-cuttingedge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Worker Instace Count
# -------------------------------------------------------------------

worker_instance_count: "{{ int((num_users / 3) + (num_users % 3 > 0)) }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: 200
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name
    course_module_list: module_type

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    type: agnosticd
  secrets:
  - name: satellite-rhel81
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
