---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: Modern App Dev Roadshow - Ops Track
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
ocp4_network_type: OVNKubernetes
ocp4_network_ovn_install_workaround: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
#update_packages: true

#-------------------------------------------------------------------
#VM configuration
#-------------------------------------------------------------------
master_instance_type: c6in.2xlarge
master_instance_count: 3
master_storage_type: gp3
master_storage_size: 250
worker_instance_type: m5a.4xlarge
worker_instance_count: 3
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD-latest
agnosticd_aws_capacity_reservation_enable: true
agnosticd_aws_capacity_reservation_single_zone: true
host_ocp4_installer_set_user_data_kubeadmin_password: true

#-------------------------------------------------------------------
#OpenShift Installer Version
#-------------------------------------------------------------------
ocp4_installer_version: "4.12.14"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Other variables
# -------------------------------------------------------------------

HOMEROOM_IMAGE: ocp4-dev

requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 2.3.0
  - name: community.general
    version: 6.4.0
  - name: ansible.posix
    version: 1.5.1
  - name: community.crypto
    version: 2.11.0

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4-workload-workshop-admin-storage
- studentvm_ocp4
- ocp4_workload_pipelines
- ocp4_workload_rhacs
- ocp4_workload_le_certificates
- ocp4_workload_rhacm
- ocp4_workload_rhacm_hypershift

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: cluster-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') }}"
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------

ocp4_workload_rhacm_use_catalog_snapshot: false
ocp4_workload_rhacm_acm_channel: "release-2.7"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_hypershift
# -------------------------------------------------------------------

# Install S3 Access workaround
ocp4_workload_rhacm_hypershift_s3_workaround: true

# Temporary use unreleased operators
ocp4_workload_rhacm_hypershift_hcp_operator_patch: true
ocp4_workload_rhacm_hypershift_hcp_registry: quay.io/rokejungrh
ocp4_workload_rhacm_hypershift_hcp_registry_image_tag: "0421"

ocp4_workload_rhacm_hypershift_deploy_clusters:
- name: development
  infra_id: "dev-{{ guid }}"
  ocp_release: 4.12.14
  region: us-west-2
  zones:
  - us-west-2a
  control_plane_availability: SingleReplica
  infra_availability: SingleReplica
  etcd_storage_class: gp3-csi
  nodepool_replicas: 1
  worker_instance_type: m5a.2xlarge
  root_volume_type: gp3
  root_volume_size: 120
  labels:
    rhdp_type: sandbox
    rhdp_usage: development
    guid: "{{ guid }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.9
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_catalogsource_name: redhat-operators-snapshot-pipelines
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh


# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_namespace: "rhacs-operator"
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: v4.12_2023_02_27
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: demo-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false
WORKSHOP_FILE: workshop-summit.yaml

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

