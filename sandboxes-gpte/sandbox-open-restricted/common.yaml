---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/aws-regions-standard.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: sandbox
agnosticd_open_environment: true
sandbox_user_info_messages_enable: true

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

sandbox_aws_admin_user_policy: "{{ sandbox_aws_admin_user_policy_options[sandbox_aws_admin_user_policy_type | default('zerotouch') ] }}"
sandbox_aws_admin_user_policy_options:
  zerotouch:
    Statement:
      - Sid: EC2DefaultAllow
        Effect: Allow
        Action:
          - 'ec2:*'
        Resource: '*'
      - Sid: S3Allow
        Effect: Allow
        Action:
          - 's3:*'
        Resource: '*'
      - Sid: KMSAllow
        Effect: Allow
        Action:
          - 'kms:Decrypt'
          - 'kms:GenerateDataKey'
          - 'kms:CreateGrant'
          - 'kms:DescribeKey'
          - 'kms:ReEncryptFrom'
          - 'kms:ReEncryptTo'
        Resource: '*'
      - Sid: LimitInstanceTypeRun
        Action:
          - 'ec2:RunInstances'
        Effect: Deny
        Resource: 'arn:aws:ec2:*:*:instance/*'
        Condition:
          StringNotEquals:
            'ec2:InstanceType':
              - t2.micro
              - t3.micro
              - t3a.medium
      - Sid: LimitInstanceTypeModify
        Action:
          - 'ec2:ModifyInstanceAttribute'
        Effect: Deny
        Resource: 'arn:aws:ec2:*:*:instance/*'
        Condition:
          StringNotEquals:
            'ec2:InstanceType':
              - t2.micro
              - t3.micro
              - t3a.medium
      - Sid: DisableMarketPlace
        Action:
          - 'aws-marketplace:*'
        Effect: Deny
        Resource: '*'

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e16dee36-bf5c-4a68-9b64-6f2590912304
  owners:
    maintainer:
      - name: Patrick Rutledge
        email: prutledg@redhat.com

  anarchy:
    namespace: babylon-anarchy-5

  deployer:
    actions:
      stop:
        disable: true
      start:
        disable: true
  sandbox_api:
    reservation: restricted
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment (Restricted)
    category: Open_Environments
    labels:
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters:
      - name: sandbox_aws_admin_user_policy_type
        formHideCondition: true == true
        description: >-
          Configure the admin user policy.
        openAPIV3Schema:
          type: string
          default: zerotouch
