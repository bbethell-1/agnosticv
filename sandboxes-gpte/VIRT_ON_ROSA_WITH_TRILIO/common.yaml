# -------------------------------------------------------------------
# ocp4_workload_rosa_machinepool
# -------------------------------------------------------------------
op4_workload_rosa_machinepool_replicas: 1
ocp4_workload_rosa_machinepool_instance_type: m5zn.metal

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.9-opr-002
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_admin_create: false

ocp4_workload_rhsso_authentication_user_count: "{{ num_users }}"
ocp4_workload_rhsso_authentication_user_name_base: dr-admin
ocp4_workload_rhsso_authentication_user_password: "{{ common_password }}"

ocp4_workload_rhsso_authentication_env_type: "{{ env_type }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.15
ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1200

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kubevirt_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_kubevirt_workload_tolerations:
- key: metal
  operator: Exists

# workaround because this var is expected by the role here:
# https://github.com/redhat-cop/agnosticd/blob/08a0964bf999a4aa42087fb8785cd29240851d27/ansible/roles_ocp_workloads/ocp4_workload_rhacm/templates/multiclusterhub.yaml.j2#L6
master_instance_count: 2

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: true
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: "{{ common_password }}"
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-05-28T17-19-04Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_base: trilio-storage
ocp4_workload_minio_bucket_multi_user: false

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpte-devopsautomation/showroom-virt-trilio
ocp4_workload_showroom_content_git_repo_ref: v1.0.0
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.2.1
ocp4_workload_showroom_content_only: true

