      Provider: RHDP
      Product: Red_Hat_OpenShift_Service_on_AWS
      Product_Family: Red_Hat_Cloud
    parameters: []
  runtime:
    default: 9999h
    maximum: 9999h
  tower:
    timeout: 14400
