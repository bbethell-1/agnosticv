      Product: Red_Hat_OpenShift_Service_on_AWS
      Product_Family: Red_Hat_Cloud
    reportingLabels:
      assetGroup: Virtualization
      primaryBU: Hybrid_Platforms
    parameters: []
  tower:
    timeout: 14400
