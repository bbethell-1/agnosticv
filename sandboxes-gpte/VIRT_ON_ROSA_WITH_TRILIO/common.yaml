# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4F6A3614-A477-4506-9C09-35015CCC0D91
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com
    instructions:
      - name: Alan Cowles
        email: acowles@redhat.com
      - name: Guil Barros
        email: gbarros@redhat.com

  anarchy:
