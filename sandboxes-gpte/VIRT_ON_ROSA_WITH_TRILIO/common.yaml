---
#include /includes/catalog-icon-automation-management.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/student-email.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/rosa_token.yaml
#include /includes/secrets/vmware-ibm-rs-clusters-access.yaml
#include /includes/secrets/trilio-license.yaml
#TODO: delete this variable when sandbox-api
vcenter_cluster: vcs-rs-00
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/catalog-icon-trilio.yaml

# -------------------------------------------------------------------
# --- Catalog Item: OpenShift Virtualization on ROSA Demo
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: rosa-consolidated
platform: rhpds

# -------------------------------------------------------------------
# Billing account for ROSA HCP
# -------------------------------------------------------------------
aws_billing_account_id: "017310218799"

# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
rosa_deploy: true
# rosa_deploy_hcp: true

# rosa_version: "4.16.4"
rosa_version: latest
rosa_version_base: openshift-v4.16
rosa_installer_version: latest

rosa_compute_replicas: 3
rosa_compute_machine_type: m6a.4xlarge

rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_type: t3a.small
bastion_instance_image: RHEL93GOLD-latest
bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
        Welcome to the Backup and Recovery of Red Hat OpenShift Virtualization VMs using Trilio Demo!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_rosa_machinepool
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_kubevirt
  - ocp4_workload_minio
  - ocp4_workload_virt_roadshow_vms
  - ocp4_workload_virt_roadshow_multi_user
  - ocp4_workload_trilio_backup_restore_vms
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vms_start_vms: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
num_users: 1
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2024_07_29

rosa_setup_cluster_admin_delete_after_workloads: true

# -------------------------------------------------------------------
# ocp4_workload_trilio_backup_restore_vms
# -------------------------------------------------------------------
ocp4_workload_trilio_backup_restore_vms_namespace: trilio-system
ocp4_workload_trilio_backup_restore_vms_operator_channel: 4.0.x
ocp4_workload_trilio_backup_restore_vms_dr_user: dr-admin1
ocp4_workload_trilio_backup_restore_vms_dr_user_password: "{{ common_password }}"
ocp4_workload_trilio_backup_restore_vms_s3_accessKey: minio
ocp4_workload_trilio_backup_restore_vms_s3_secretKey: "{{ common_password }}"

# -------------------------------------------------------------------
# ocp4_workload_rosa_machinepool
# -------------------------------------------------------------------
op4_workload_rosa_machinepool_replicas: 1
ocp4_workload_rosa_machinepool_instance_type: m5zn.metal

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.9-opr-002
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_admin_create: false

ocp4_workload_rhsso_authentication_user_count: "{{ num_users }}"
ocp4_workload_rhsso_authentication_user_name_base: dr-admin
ocp4_workload_rhsso_authentication_user_password: "{{ common_password }}"

ocp4_workload_rhsso_authentication_env_type: "{{ env_type }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.15
ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1200

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kubevirt_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_kubevirt_workload_tolerations:
  - key: metal
    operator: Exists

# workaround because this var is expected by the role here:
# https://github.com/redhat-cop/agnosticd/blob/08a0964bf999a4aa42087fb8785cd29240851d27/ansible/roles_ocp_workloads/ocp4_workload_rhacm/templates/multiclusterhub.yaml.j2#L6
master_instance_count: 2

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: true
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: "{{ common_password }}"
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-05-28T17-19-04Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
  - trilio-storage
ocp4_workload_minio_bucket_multi_user: false

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpe/showroom-virt-trilio.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.2.1
ocp4_workload_showroom_content_only: true

