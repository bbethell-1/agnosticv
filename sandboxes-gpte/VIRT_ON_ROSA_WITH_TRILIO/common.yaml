# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4F6A3614-A477-4506-9C09-35015CCC0D91
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
    actions:
      start:
        disable: true
      stop:
        disable: true
  sandbox_api:
    actions:
      start:
        enable: false
      stop:
        enable: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Backup and Recovery of Red Hat OpenShift Virtualization VMs using Trilio (ROSA)
    category: Demos
    keywords: []
