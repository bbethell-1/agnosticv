---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: "t2.small"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  params_to_variables:
    infra_workloads: ''
    student_workloads: ''
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999
  nuke_sandbox: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS with ROSA Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: rosa_token
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 6h
    maximum: 48h
  secrets:
  - namespace: gpte
    name: rosa-token
