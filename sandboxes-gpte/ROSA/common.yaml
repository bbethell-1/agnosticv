---
# -------------------------------------------------------------------
# --- Catalog Item: ROSA
# --- Catalog: OpenShift Workshops
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: "t2.small"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  params_to_variables:
    user: ignore_user
    username: student_name
    infra_workloads: infra_workloads
    region: aws_region
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999
  nuke_sandbox: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  secrets:
  - rosa-token
  #sandboxed: true
