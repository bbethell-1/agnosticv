---
# -------------------------------------------------------------------
# --- Catalog Item: ROSA
# --- Catalog: OpenShift Workshops
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: "t2.small"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  params_to_variables:
    username: student_name
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999
  nuke_sandbox: true

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
  secrets:
  - namespace: gpte
    name: rosa-token
  #sandboxed: true
