purpose: development
env_type: rosa-consolidated
rosa_deploy: true
rosa_deploy_hcp: true
rosa_setup_cluster_admin: false
rosa_installer_version: latest
rosa_version: latest-upgrade
rosa_version_base: openshift-v4.17
rosa_compute_machine_type: m6a.xlarge
aws_billing_account_id: 017310218799
bastion_instance_type: t3a.small
bastion_instance_image: RHEL95GOLD-latest
bastion_remove_insights_motd: true
bastion_custom_motd: "---------------------------------------------------------------------------\n\
  \        Welcome to the AWS ROSA Open Environment!\n---------------------------------------------------------------------------\n\
  \nBy continuing to use this service you agree to use this environment\nsolely for\
  \ the purposes of completing the steps in the lab guide.\n\nAny other use is a violation\
  \ of this service and appropriate action\nwill be taken. If you disagree with these\
  \ terms you must disconnect now.\n----------------------------------------------------------------------------"
agnosticd_open_environment: true
sandbox_user_info_messages_enable: false
repo_method: satellite
update_packages: true
print_agnosticd_user_info: false
__meta__:
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
    scm_ref: development
  catalog:
    multiuser: true
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference (branch/tag/commit)
      formLabel: AgnosticD SCM Reference
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: Git branch, tag, or commit hash for AgnosticD deployment
