---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

# ------------------------------------------------------
# Catalog Item Parameters
# ------------------------------------------------------
rosa_deploy: true
rosa_deploy_hcp: true
rosa_setup_cluster_admin: false

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
rosa_installer_version: latest

# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade

# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: openshift-v4.17
rosa_compute_machine_type: m6a.xlarge

#billing account for HCP
aws_billing_account_id: "017310218799"

bastion_instance_type: "t3a.small"
bastion_instance_image: RHEL98GOLD-latest

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the AWS ROSA Open Environment!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false

__meta__:
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
    scm_ref: development
  catalog:
    multiuser: true
    parameters: []
