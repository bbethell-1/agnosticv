---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

install_ftl: true
requirements_content:
  roles:
  - name: ftl-injector
    src: https://github.com/redhat-gpte-devopsautomation/ftl-injector
    version: v0.19.0
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx            # Prakhar, what does this support?
    version: 21.1.0
  - name: azure.azcollection # Needed for azure creds loading
    version: 1.12.0
  - name: azure.rm           # Needed for azure creds loading
    version: 0.0.6
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
    scm_type: git
