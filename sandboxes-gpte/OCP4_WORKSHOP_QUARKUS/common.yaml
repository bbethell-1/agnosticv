---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 Quarkus Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.20.10"
ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager
  - ocp4-workload-quarkus-workshop

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max }}"
bastion_instance_image: RHEL94GOLD-latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('3') }}"
ocp4_workload_authentication_remove_kubeadmin: true

# Workload: ocp4_workload_cert_manager
ocp4_workload_cert_manager_channel: "stable-v1.18"

# -------------------------------------------------------------------
# Workload: ocp4-workload-quarkus-workshop
# -------------------------------------------------------------------

workshop_content_git_tag: 'rhbq-3.27'
community_catalog_source_tag: 'v4.20_2026_01_12'
redhat_catalog_source_tag: 'v4.20_2026_01_12'
devspaces_images_list: >-
  quarkus-stack-3-27=quay.io/openshiftlabs/quarkus-workshop-stack:3.27.1;
  che-gateway=registry.redhat.io/devspaces/traefik-rhel9:3.25.0;
  che-code-injector=registry.redhat.io/devspaces/code-rhel9:3.25.0;
  project-clone=registry.redhat.io/devworkspace/devworkspace-project-clone-rhel9:0.38;

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3eb341f1-d6be-419c-b458-12341bab2b27
  owners:
    maintainer:
      - name: Daniel Oh
        email: doh@redhat.com
      - name: Ryan Jarvinen
        email: rjarvine@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: module_type
        description: Semicolon-seperated list of Modules to Enable
        formLabel: Module
        required: true
        openAPIV3Schema:
          default: m1;m2;m3
          type: string
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 100
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than one requires a valid SalesForceID.')
    keywords: []
    labels:
      Provider: Hybrid_Platform_BU
      Product: Red_Hat_Runtimes
      Product_Family: Red_Hat_Application_Services
      Use_Case: Accelerate_Application_Development_And_Delivery
    display_name: Quarkus on OpenShift workshop on AWS
    category: Workshops
    reportingLabels:
      primaryBU: Application_Developer
      secondaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
