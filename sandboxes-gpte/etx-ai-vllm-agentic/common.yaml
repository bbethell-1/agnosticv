# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: m5a.4xlarge
master_instance_count: 3
master_storage_type: io1
master_storage_size: 250

worker_instance_type: m5a.2xlarge
worker_instance_count: 3
worker_storage_type: gp3
worker_storage_size: 250

bastion_instance_type: g6.2xlarge
bastion_instance_image: RHEL96GOLD-latest
# bastion_instance_image: RHEL-10.0-GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.17"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# ------------------
# Bastion Instance
# ------------------
instances:
  - name: "bastion"
    count: 1
    unique: true
    public_dns: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: 100
    security_groups:
      - BastionSG

# ------------------
# Bastion Security Groups
# ------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: NoVNC
        description: "NoVNC Public"
        from_port: 6080
        to_port: 6080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Bastion Configs
# -------------------------------------------------------------------
# install_student_user: false
student_name: ec2-user
student_password: redhat123

common_packages:
  - python3.12
  - podman
  - buildah
  - git

rhel_firewalld_open_ports:
  - 6080/tcp

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_machinesets
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_gitops
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_authorino
  - ocp4_workload_openshift_ai
  # - ocp4_workload_gitops_bootstrap
  # - ocp4_workload_showroom

software_workloads_for_bastion:
  - agnosticd.ai.setup_nvidia_cuda
  - agnosticd.ai.setup_python_env
  - novnc
  - rhel-graphical
  - podman_desktop

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_06_23

# -------------------------------------------------------------------
# Common passwords
# -------------------------------------------------------------------

common_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}
common_user_password: openshift

# -------------------------------------------------------------------
# Workloads: agnosticd.ai.setup_nvidia_cuda
# -------------------------------------------------------------------

setup_nvidia_cuda_python_version: '3.12'
setup_nvidia_cuda_cuda_version: '12.8'
setup_nvidia_cuda_cuda_major_version: '12'
setup_nvidia_cuda_cuda_minor_version: '8'
setup_nvidia_cuda_nvidia_rhel_dnf_packages:

# We may be able to cut this down, TODO
  - "@nvidia-driver:latest-dkms"
  - "cuda-toolkit-{{ setup_nvidia_cuda_cuda_major_version }}-{{ setup_nvidia_cuda_cuda_minor_version }}"
  - nvidia-gds
  - libcudnn8
  - libcudnn8-devel
  - "cuda-cccl-{{ setup_nvidia_cuda_cuda_major_version }}-{{ setup_nvidia_cuda_cuda_minor_version }}"
  - "libnccl-2.26.2-1+cuda12.8.x86_64"        # Make sure you choosle the correct version...
  - nvidia-container-toolkit

# -------------------------------------------------------------------
# Workloads: setup_python_env_python_version
# -------------------------------------------------------------------

setup_python_env_python_version: "3.12"
setup_python_env_default_user: "{{ student_name }}"
setup_python_env_create_default_venv: true
setup_python_env_create_default_venv_name: venv

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: false

single_gpu_instance_type: g6.2xlarge

ocp4_workload_machinesets_machineset_groups:
  - name: single-gpu
    role: single-gpu
    instance_type: "{{ single_gpu_instance_type }}"
    autoscale: false
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: "{{ ocp4_workload_user_count }}"
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.16
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_starting_csv: cert-manager-operator.v1.16.0
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_gitops_starting_csv: openshift-gitops-operator.v1.16.1

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_update_resources: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# ------------------------------------------------
# ocp4_workload_nvidia_gpu_setup
# ------------------------------------------------
nvidia_gpu_operator_channel: v25.3
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v25.3.1

nfd_operator_use_catalog_snapshot: true
nfd_operator_channel: stable
nfd_operator_catalogsource_name: redhat-operators-snapshot-nfd
nfd_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
nfd_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
