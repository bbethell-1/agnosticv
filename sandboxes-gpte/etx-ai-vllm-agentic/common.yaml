# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: d58cf8a5-4d6c-4531-8be0-b04dbf36e8c8
  sandbox_api:
    reservation: pgpu
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
      pull: missing
  catalog:
    display_name: "ETX 2025: VLLM Optimization & Agentic AI"
    namespace: babylon-catalog-{{ stage | default('?') }}
    category: Labs
    multiuser: true
    keywords:
      - ai
      - etx
    labels:
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 30
  owners:
    maintainer:
      - name: Nate Stephany
        email: nate@redhat.com
    sme:
      - name: John Hurlocker
        email: jhurlock@redhat.com
    instructions:
      - name: John Hurlocker
        email: jhurlock@redhat.com
