---
purpose: development

# Workload Variables
ocp4_workload_le_certificates_install_certificates: false
ocp4_workload_le_certificates_install_api: False

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  params_to_variables:
    nodecount: ''
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  anarchy:
    namespace: babylon-anarchy-gpte
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
      - name: email
  scheduler:
    enable: true
    data:
      cloud_preference:
        purpose: development
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: satellite-rhel81
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
