---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-red-hat-standard-logo.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: multi-cloud-odf-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: The Multi Cloud GitOps with ODF Demo
    category: Workshops
    keywords:
    - odf
    - ocp
    labels:
#     Product:
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws_hub
    display_name: AWS RHACM Hub
    item: sandboxes-gpte/OCP4_MULTI_CLOUD_GITOPS_ODF
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: azure_dev
    display_name: Azure Dev Cluster
    item: sandboxes-gpte/OCP4_MULTI_CLOUD_ODF_AZURE
    propagate_provision_data:
    - var: azure_dev_a_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81-ha
  - name: output-dir-s3
    namespace: gpte
