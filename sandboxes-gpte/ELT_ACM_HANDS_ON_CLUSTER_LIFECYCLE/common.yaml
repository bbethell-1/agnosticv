---
# -------------------------------------------------------------------
# --- Catalog: Openshift 4 Labs
# --- Catalog Item: Advanced Cluster Management Hands On Cluster Lifecycle
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: OPENTLC

# -------------------------------------------------------------------
# Set OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.8.20"
ocp4_installer_root_url: "http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
cloudformation_retries: 0

master_instance_type: m5a.2xlarge
worker_instance_type: m5a.4xlarge
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_opentlc_production
- ocp4_workload_le_certificates
- ocp4_workload_rhacm

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_project: "open-cluster-management"
ocp4_workload_rhacm_acm_release: "release-2.3"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.3.1"
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.8_2021_11_15"
ocp4_workload_rhacm_use_catalog_snapshot: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name
    nodecount: ''
    user: ''
    region: aws_region

__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81
