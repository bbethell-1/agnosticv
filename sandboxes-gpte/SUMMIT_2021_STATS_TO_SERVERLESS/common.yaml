---
# -------------------------------------------------------------------
# --- Red Hat Summit 2021 - rhs2021-a0009
# --- From statistics to serverless: building intelligent applications on OpenShift (RESERVE)
# --- course_id: rhs2021-a0002
# --- Owners: Sophie Watson <sowatson@redhat.com>, Marius Bogoevici <mbogoevi@redhat.com>
# --- CPBU: datasvc
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD
bastion_instance_type: t3a.medium

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# Email is required for deployment... but really shouldn't be.
email: devops@example.com

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: 4.7.2

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_opentlc_production
  - ocp4_workload_le_certificates
  - ocp-workload-terminal
  - ocp4_workload_workload_monitoring
  - ocp4_workload_pipelines
  - ocp4_workload_serverless
  - ocp4_workload_open_data_hub_olm
  - ocp4_workload_ai_ml_workflows_workshop

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# Enable this if you want to create a user on the bastion
install_student_user: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create number of htpasswd users

ocp4_workload_authentication_htpasswd_user_count: 50
ocp4_workload_ai_ml_workflows_workshop_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_ai_ml_workflows_workshop_username_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_ai_ml_workflows_workshop_password: "{{ ocp4_workload_authentication_htpasswd_user_password }}"

# --- Student Workloads (YAML List)
#student_workloads:
#- ocp4_workload_ai_ml_workflows_workshop

# OpenTLC Production
ocp4_workload_opentlc_production_remove_self_provisioner: true
ocp4_workload_opentlc_production_expose_registry_route: false
ocp4_workload_opentlc_production_set_build_defaults: true

# Bookbag Setup
# ocp4_workload_bookbag_setup_project: "bookbag"
# ocp4_workload_bookbag_setup_project_display: "Bookbag RHTR2020 Stats to Serverless"
# ocp4_workload_bookbag_setup_git_repo: https://github.com/redhat-gpte-labs/stats-to-serverless-bookbag.git
# ocp4_workload_bookbag_setup_git_version: rhtr
# ocp4_workload_bookbag_setup_image_name: rhtr2020s2s

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
  secrets:
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
    - name: ocp4_token
      namespace: gpte

    # LDAP admin password to check user auth
    # bindPassword
    # kerberos_keytab
    # kerberos_user
    # ocp4_workload_authentication_ldap_bind_password
    # ocp4_workload_authentication_secrets
    - name: ipa-admin
      namespace: gpte

    # Satellite Configuration
    #  satellite_activationkey
    #  satellite_org
    #  satellite_url
    #  set_repositories_satellite_activationkey
    #  set_repositories_satellite_org
    #  set_repositories_satellite_url
    - name: satellite-rhel81
      namespace: gpte
