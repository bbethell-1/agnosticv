---
# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development
HOMEROOM_IMAGE: v3.3_2026_07_22

install_lets_encrypt_certificates: true

# --------------------------------------------------------------------
# OpenShift Installer Version
# Bumped from 4.16.9 (common.yaml) to pick up OCPBUGS-61920 fix:
# memoryTarget on redhat-operators CatalogSource increased from 30Mi
# to 50Mi, preventing gRPC DeadlineExceeded errors on fresh clusters.
# --------------------------------------------------------------------
ocp4_installer_version: "4.16.57"

master_instance_type: m5a.2xlarge
#master_instance_count: 1
#master_storage_type: io1
#master_storage_size: 250
worker_instance_type: m6a.8xlarge
#worker_instance_count: 2
#worker_storage_type: gp3
#worker_storage_size: 250

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: ocp4-acm-acs-ops-1.0.3
    virtualenv: ansible2.9-python3.6-2021-11-30
