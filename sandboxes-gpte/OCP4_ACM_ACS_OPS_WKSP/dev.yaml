---
platform: rhpds
purpose: development

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# Infra Workloads - Override common.yaml for dev environment
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_showroom
  - studentvm_ocp4
  - ocp4_workload_cert_manager

# -------------------------------------------------------------------
# Showroom workshop content configuration
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/jnewsome97/openshift-ops-workshops-showroom.git
ocp4_workload_showroom_content_git_repo_ref: appmod
ocp4_workload_showroom_user_is_admin: true

master_instance_type: m5a.2xlarge
#master_instance_count: 1
#master_storage_type: io1
#master_storage_size: 250
worker_instance_type: m6a.4xlarge
#worker_instance_count: 2
#worker_storage_type: gp3
#worker_storage_size: 250

#-------------------------------------------------------------------
#OpenShift Installer Version
#-------------------------------------------------------------------
ocp4_installer_version: "4.20.1"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.20_2025_10_23


# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.12
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalogsource_name: catalogsource-rhacm
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.20_2025_10_23"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_namespace: "rhacs-operator"
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.7"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: "v4.20_2025_10_23"
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"

# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-08-08
      pull: missing
