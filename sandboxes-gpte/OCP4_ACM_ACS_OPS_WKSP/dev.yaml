platform: rhpds
purpose: development
install_lets_encrypt_certificates: true
HOMEROOM_IMAGE: v2.6_2025_01_17
master_instance_type: m5a.2xlarge
worker_instance_type: m6a.4xlarge
ocp4_installer_version: 4.16.9
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_workload_pipelines_channel: pipelines-1.14
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.15_2024_04_22
ocp4_workload_rhacm_acm_channel: release-2.10
ocp4_workload_rhacm_use_catalog_snapshot: false
ocp4_workload_rhacm_catalogsource_name: catalogsource-rhacm
ocp4_workload_rhacm_catalog_source_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_rhacm_catalog_source_tag: v4.15_2024_04_08
ocp4_workload_rhacs_install_operator_namespace: rhacs-operator
ocp4_workload_rhacs_install_operator_channel: rhacs-4.5
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_install_operator_catalog_source_tag: v4.15_2024_04_08
ocp4_workload_rhacs_central_admin_password: '{{ common_password }}'
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
