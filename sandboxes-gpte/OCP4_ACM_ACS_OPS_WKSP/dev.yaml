---
platform: rhpds
purpose: development

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Infra Workloads - WITH MODULE SELECTION
# Uses list concatenation - workloads are actually skipped when disabled
# -------------------------------------------------------------------

# ============================================
# BASE WORKLOADS (Always deployed)
# ============================================
_base_workloads:
  # Phase 1: Foundation
  - ocp4_workload_cert_manager
  - ocp4_days_workload_openshift_data_foundation
  # Phase 2: Workshop Infrastructure
  - ocp4_workload_showroom
  - ocp4-workload-days-ops-track
  - studentvm_ocp4
  - ocp4_workload_web_terminal
  - ocp4_workload_kubernetes_image_puller
  # Phase 3: CI/CD & Security
  - ocp4_workload_pipelines
  - ocp4_workload_rhacs

# ============================================
# OPTIONAL WORKLOAD GROUPS
# ============================================

# Virtualization module workloads
_virt_workloads:
  - ocp4_workload_kubevirt

# ACM multi-cluster module workloads
_acm_workloads:
  - ocp4_days_workload_rhacm
  - ocp4_workload_rhacm_cloud_credentials
  - ocp4_workload_acm_multicluster_observability
  - ocp4_days_workload_metallb

# HCP requires BOTH ACM and Virt
_hcp_workloads:
  - ocp4_workload_hcp_kubevirt

# Backup module workloads
_backup_workloads:
  - ocp4_workload_oadp

# Developer Hub module workloads (simplified - operator only)
_devhub_workloads:
  - ocp4_days_workload_rhdh

# ============================================
# BUILD INFRA_WORKLOADS DYNAMICALLY
# ============================================
infra_workloads: >-
  {{
    _base_workloads +
    (_virt_workloads if module_enable_virt | default(true) | bool else []) +
    (_acm_workloads if module_enable_acm | default(true) | bool else []) +
    (_hcp_workloads if (module_enable_acm | default(true) | bool) and (module_enable_virt | default(true) | bool) else []) +
    (_backup_workloads if module_enable_backup | default(true) | bool else []) +
    (_devhub_workloads if module_enable_devhub | default(true) | bool else [])
  }}


# -------------------------------------------------------------------
# Showroom workshop content configuration
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/jnewsome97/openshift-ops-workshops-showroom.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_user_is_admin: true

# -------------------------------------------------------------------
# Instance sizing - increased for HCP + all workloads
# -------------------------------------------------------------------
master_instance_type: m5a.2xlarge
worker_instance_type: m5a.8xlarge   # 32 vCPU, 128GB RAM (no NVMe needed - using ODF)
worker_instance_count: 3            # ODF requires minimum 3 workers
worker_storage_type: gp3
worker_storage_size: 200            # Root disk only - ODF provisions its own storage

#-------------------------------------------------------------------
#OpenShift Installer Version
#-------------------------------------------------------------------
ocp4_installer_version: "4.20.1"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Catalog Snapshot Configuration (shared across operators)
# FIXED: Changed from corrupt v4.20_2025_12_29 to verified working v4.20_2026_01_12
# The Dec 29 snapshot caused ODF storagesystems CRD timeouts
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.20_2026_01_12

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
# Allow deployment to continue if certs fail - investigate on running cluster
ocp4_workload_cert_manager_ignore_errors: true

# -------------------------------------------------------------------
# Workload: ocp4_days_workload_rhacm (Days version with alert fixes)
# -------------------------------------------------------------------
ocp4_days_workload_rhacm_acm_channel: release-2.15
ocp4_days_workload_rhacm_use_catalog_snapshot: true
ocp4_days_workload_rhacm_catalogsource_name: catalogsource-rhacm
ocp4_days_workload_rhacm_catalog_source_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_days_workload_rhacm_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag }}"
# Enable wildcard routes for HCP console access
ocp4_days_workload_rhacm_enable_wildcards: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_cloud_credentials
# -------------------------------------------------------------------
ocp4_workload_rhacm_cloud_credentials_kubevirt: true
ocp4_workload_rhacm_cloud_credentials_kubevirt_secret_name: kubevirt-secret
# Install HCP CLI on bastion for creating hosted clusters
ocp4_workload_rhacm_cloud_credentials_install_hcp_cli: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_namespace: "rhacs-operator"
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.9"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_days_workload_openshift_data_foundation (Days version - OCP 4.20 fixes)
# -------------------------------------------------------------------
# CRITICAL: Required for CNV VM storage, OADP S3 backend, Loki persistent storage, and HCP
# SPECIAL CONFIGURATION: Uses LIVE catalog instead of snapshot
# Using stable-4.20 to match OCP 4.20.1
ocp4_days_workload_openshift_data_foundation_channel: stable-4.20  # Matches OCP 4.20
ocp4_days_workload_openshift_data_foundation_catalogsource_setup: false  # Use LIVE RedHat catalog (not snapshot)
# catalogsource_setup: false means use default redhat-operators catalog source
# This matches the working OPP deployment approach
ocp4_days_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_days_workload_openshift_data_foundation_old_default_storage_class_name: gp3-csi
# Explicitly set underlying storage class for Ceph OSDs
ocp4_days_workload_openshift_data_foundation_ceph_storage_class_name: gp3-csi
# Standard size across most workshops
ocp4_days_workload_openshift_data_foundation_ceph_storage_osd_size: 1500Gi
ocp4_days_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1200

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt (OpenShift Virtualization)
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalogsource_name: redhat-operators-snapshot-kubevirt
ocp4_workload_kubevirt_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kubevirt_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
# Deploy HyperConverged CR automatically
ocp4_workload_kubevirt_deploy_hyperconverged: true
# Install virtctl CLI tool
ocp4_workload_kubevirt_install_virtctl: true
# Enable nested KVM for AWS (allows VMs without metal nodes)
ocp4_workload_kubevirt_enabled_nested_kvm: true
# Use snapshots for boot sources (default, works with ODF/Ceph)
ocp4_workload_kubevirt_boot_sources_snapshot: true

# -------------------------------------------------------------------
# Workload: ocp4_days_workload_metallb (Days version - DNS fixes)
# -------------------------------------------------------------------
ocp4_days_workload_metallb_channel: stable
ocp4_days_workload_metallb_use_catalog_snapshot: true
ocp4_days_workload_metallb_catalogsource_name: redhat-operators-snapshot-metallb
ocp4_days_workload_metallb_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_days_workload_metallb_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_days_workload_metallb_enable_ipaddresspool: true
ocp4_days_workload_metallb_enable_l2advertisement: true

# -------------------------------------------------------------------
# LVMS - DISABLED (HCP uses ODF storage, not local storage)
# -------------------------------------------------------------------
# HCP etcd uses hcp_etcd_storage_class which defaults to ODF RBD
# LVMS is not required for this workshop
workshop_deploy_lvms: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_hcp_kubevirt (Hosted Control Planes)
# -------------------------------------------------------------------
# HCP on KubeVirt provider - enables creating hosted clusters on VMs
# Requires: ACM, KubeVirt, MetalLB (LVMS not needed - uses ODF)
# Uses ODF RBD storage for etcd (not local storage)
hcp_storage_class: ocs-storagecluster-ceph-rbd
hcp_etcd_storage_class: ocs-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# Workload: ocp4_workload_oadp (Backup/DR)
# -------------------------------------------------------------------
ocp4_workload_oadp_channel: stable
ocp4_workload_oadp_use_catalog_snapshot: true
ocp4_workload_oadp_catalogsource_name: redhat-operators-snapshot-oadp
ocp4_workload_oadp_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_oadp_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_oadp_automatic_install_plan_approval: true
# Storage configuration - uses ODF/OCS S3 backend
ocp4_workload_oadp_storage: ocs
# Don't auto-configure DPA - let workshop guide students through it
ocp4_workload_oadp_configure_dpa: false
ocp4_workload_oadp_multi_user: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines (OpenShift Pipelines / Tekton)
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: latest
ocp4_workload_pipelines_use_catalog_snapshot: false  # Use live catalog (snapshot only has v1.20.2)
ocp4_workload_pipelines_install_tkn_cli: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_use_catalog_snapshot: true
ocp4_workload_web_terminal_catalogsource_name: redhat-operators-snapshot-web-terminal
ocp4_workload_web_terminal_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_web_terminal_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubernetes_image_puller
# -------------------------------------------------------------------
ocp4_workload_kubernetes_image_puller_node_selector: '{"node-role.kubernetes.io/worker": ""}'
ocp4_workload_kubernetes_image_puller_images:
  - quay.io/devfile/universal-developer-image:ubi8-277c10c
ocp4_workload_kubernetes_image_puller_instance_namespace: default

# -------------------------------------------------------------------
# Workload: ocp4_days_workload_rhdh (Simplified Developer Hub)
# -------------------------------------------------------------------
# Uses RHDH Operator instead of complex Helm/ArgoCD/GitLab chain
# Deploys basic RHDH with guest auth for ops workshop showcase
ocp4_days_workload_rhdh_enable_guest_auth: true
ocp4_days_workload_rhdh_channel: fast

# -------------------------------------------------------------------
# Babylon meta variables - Use forked AgnosticD repo
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    scm_type: git
    scm_url: https://github.com/jnewsome97/agnosticd-ops-showroom.git
    type: agnosticd
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-08-08
      pull: missing

  catalog:
    parameters:
      - name: module_enable_virt
        description: Deploy OpenShift Virtualization for VM management module
        formGroup: Modules
        formLabel: Virtualization - OpenShift Virtualization with VMs
        openAPIV3Schema:
          type: boolean
          default: true

      - name: module_enable_backup
        description: Deploy OADP for backup and restore module
        formGroup: Modules
        formLabel: Backup & DR - OADP Backup and Restore
        openAPIV3Schema:
          type: boolean
          default: true

      - name: module_enable_acm
        description: Deploy ACM for multi-cluster management, HCP, and observability
        formGroup: Modules
        formLabel: Multi-Cluster - ACM, Hosted Control Planes, Observability
        openAPIV3Schema:
          type: boolean
          default: true

      - name: module_enable_devhub
        description: Deploy Red Hat Developer Hub for platform engineering showcase
        formGroup: Modules
        formLabel: Developer Hub - Red Hat Developer Hub
        openAPIV3Schema:
          type: boolean
          default: true
