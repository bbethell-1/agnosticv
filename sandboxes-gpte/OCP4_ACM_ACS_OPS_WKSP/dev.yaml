---
#include /includes/parameters/controleplane-count.yaml

platform: rhpds
purpose: development

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

ocp4_workload_rhacs_install_operator_namespace: "rhacs-operator"
ocp4_workload_rhacs_install_operator_channel: "rhacs-3.74"
#ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v3.68.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: v4.12_2023_02_27

ocp4_workload_rhacm_use_catalog_snapshot: false
ocp4_workload_rhacm_catalog_source_tag: v4.12_2023_02_27
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.7.0"
ocp4_workload_rhacm_acm_channel: "release-2.7"
ocp4_workload_rhacm_acm_release: "release-2.7"

ocp4_workload_pipelines_channel: pipelines-1.9
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.12_2023_02_27

# -------------------------------------------------------------------
# Other variables
# -------------------------------------------------------------------

HOMEROOM_IMAGE: ocp4-dev

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  runtime:
    default: 48h
    maximum: 48h
