---
platform: rhpds
purpose: development

install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: "4.9"

#ocp4_workload_rhacs_install_operator_namespace: "rhacs-operator"
#ocp4_workload_rhacs_install_operator_channel: "rhacs-3.72"
#ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v3.68.0"
#ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
#ocp4_workload_rhacs_install_operator_catalog_source_tag: "v4.9_2022_06_20"

# -------------------------------------------------------------------
# Other variables
# -------------------------------------------------------------------

HOMEROOM_IMAGE: ocp4-dev

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  runtime:
    default: 48h
    maximum: 48h
