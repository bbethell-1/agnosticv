purpose: development

# -------------------------------------------------------------------
# Set OpenShift Installer Version
# -------------------------------------------------------------------
# ocp4_installer_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/4.9.0/openshift-install-linux.tar.gz
# ocp4_client_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/4.9.0/openshift-client-linux.tar.gz
# ocp4_installer_use_dev_preview: true

# -------------------------------------------------------------------
# Number of VMs
