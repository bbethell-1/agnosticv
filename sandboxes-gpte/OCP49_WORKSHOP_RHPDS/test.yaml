---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: rhpds-test

# -------------------------------------------------------------------
# Number of VMs
# -------------------------------------------------------------------
master_instance_count: 3
worker_instance_count: "{{ [( user_count / 5) | round(0, 'ceil') | int, 2] | max }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count }}"
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    scm_ref: ocp4-workshop-49-rhpds-test-1.2
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Chaos on OpenShift
    category: Workshops
    icon:
      alt: "Cloud Native"
      url: "https://gpte-public.s3.amazonaws.com/babylon-catalog/Cloud_Native.svg"
    keywords:
      - workshop
      - openshift
      - chaos
    labels:
      OpenShift_Version: "4.9"
      Product: OpenShift
      Provider: BU1
    parameters:
      - name: user_count
        description: Number of users to provision for infrastructure deployment.
        openAPIV3Schema:
          default: 1
          type: integer
          minimum: 1
          maximum: 50
  secrets:
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
