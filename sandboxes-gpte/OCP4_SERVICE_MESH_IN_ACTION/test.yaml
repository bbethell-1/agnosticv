---
purpose: development
master_instance_type_family: m5
master_instance_type_size: >-
   {{ 'xlarge' if worker_instance_count|int <= 10
   else '2xlarge' if worker_instance_count|int <= 20
   else '4xlarge'
   }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size }}"
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ (num_users | int * 1.4) | int }}"
workshop_environment: develop

agnosticv_meta:
  # sandboxed: false
  idle_after_deploy: 4
  idle_after_start: 4
  deploy_with: babylon

__meta__:
  aws_sandboxed: true
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
      - name: num_users
  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: satellite-rhel81
