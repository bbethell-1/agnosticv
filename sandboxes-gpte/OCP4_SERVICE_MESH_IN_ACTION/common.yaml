---
# Catalog: Workshops
# Catalog Item: OCP4 - OpenShift Service Mesh in Action

# Platform
platform: labs

# These come from the account
# subdomain_base_suffix: .example.opentlc.com
# HostedZoneId: Z2ICRJUKETTHRV

# Config
env_type: ocp4-workshop
key_name: opentlc_admin_backdoor
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.3.1"
install_opentlc_integration: false
run_cloudtrail: false
run_janitor: false
smoke_tests: false

# Repos
osrelease: 4.3.0
repo_version: '4.3'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

# Generic Variables
install_ipa_client: false
install_lets_encrypt_certificates: false

# This is a Lab Environment -> Install FTL
install_ftl: false

# Student User on Bastion
install_student_user: true

# OCP Authentication
install_idm: htpasswd
admin_user: admin
admin_password: r3dh4t1!
# Users are user1..200
user_count: 200
user_password: openshift

# Default workloads are a YAML list
default_workloads: []

# Infra and Student Workloads are comma separated strings
infra_workloads:
  - ocp4-workload-istio-controlplane-infra
  - ocp4-workload-istio-controlplane-student
  - ocp4-workload-istio-tutorial-student
  - ocp4-workload-istio-workshop-homeroom

# Run Student Workload to give all students cluster-admin permissions
student_workloads: []

ansible_additional_args: --skip-tags remove_self_provisioners,install_zabbix

# AgnosticV Meta variables
agnosticv_meta:
  sandboxed: true
  secrets:
    - ocp4_token
  params_to_variables:
    nodecount: ''
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
  virtualenv: aws-ansible-2.9
