---
purpose: DEV

# Admin pw not printing so testing var 'true'
ocp4_workload_authentication_enable_user_info_messages: true

ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/sa-mw-dach/opentour-2022-hello.git
    name: hello
    private: false
  - repo: https://github.com/sa-mw-dach/opentour-2022-hello-gitops.git
    name: hello-gitops
    private: false

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rbo/agnosticd.git
    scm_ref: development
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/sa-mw-dach/opentour-2022-bookbag
          ref: development
