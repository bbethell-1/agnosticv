---
purpose: DEV

# Admin pw not printing so testing var 'true'
ocp4_workload_authentication_enable_user_info_messages: true

ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/sa-mw-dach/opentour-2022-hello.git
    name: hello
    private: false
  - repo: https://github.com/sa-mw-dach/opentour-2022-hello-gitops.git
    name: hello-gitops
    private: false

ocp4_workload_opentour_dach_2022_infra_repo_tag: "{{ (gitops_repo_tag | default('v1')) }}"

ocp4_workload_servicemesh_jaeger_starting_csv: "jaeger-operator.v1.38.0-2"
ocp4_workload_servicemesh_use_catalog_snapshot: true
ocp4_workload_servicemesh_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_servicemesh_catalog_snapshot_image_tag: v4.11_2022_10_24

# -------------------------------------------------------------------
# Bookbag
# -------------------------------------------------------------------
# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://github.com/sa-mw-dach/opentour-2022-bookbag
bookbag_git_version: development

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rbo/agnosticd.git
    scm_ref: development
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenTour 2022 DACH
    category: Workshops
    keywords:
      - workshop
      - ocp410
      - ocp
      - openshift
    labels:
      #OpenShift_Version: "4.8"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: Hybrid_Cloud_Experience_BU
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 100
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than three requires a valid SalesForceID.')
      - name: gitops_repo_tag
        description: >-
          Tag for OpenTour GitOps Repo https://github.com/sa-mw-dach/opentour-2022-gitops-infra.git
        formLabel: OpenTour GitOps Repo Tag
        required: true
        openAPIV3Schema:
          type: string
          default: v1
