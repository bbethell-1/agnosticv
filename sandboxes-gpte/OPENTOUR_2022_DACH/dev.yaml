---
#include /includes/parameters/controlplane-count.yaml
#include /includes/ee-multicloud-dev.yaml

purpose: DEV

# Admin pw not printing so testing var 'true'
ocp4_workload_authentication_enable_user_info_messages: true

# -------------------------------------------------------------------
# Bookbag
# -------------------------------------------------------------------
# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://github.com/sa-mw-dach/microservice-introduction-content.git
bookbag_git_version: "{{ (gitops_repo_tag | default('v1')) }}"

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_servicemesh
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_web_terminal
  - ocp4_workload_le_certificates
  - ocp4_workload_opentour_dach_2022
  - ocp4_workload_rhsso
  - bookbag

ocp4_installer_version: "4.13.8"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients


# ---------------------------------------------------------
# Authentication
# ---------------------------------------------------------
ocp4_workload_authentication_htpasswd_user_base: user
# How to forward password to gitea?
# ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_password: "cds!2023"

# ---------------------------------------------------------
# OpenTourm DACH 2022
# ---------------------------------------------------------
ocp4_workload_opentour_dach_2022_user_prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_opentour_dach_2022_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_opentour_dach_2022_infra_repo: "https://github.com/sa-mw-dach/microservice-introduction-gitops-infra.git"
ocp4_workload_opentour_dach_2022_infra_repo_tag: "{{ (gitops_repo_tag | default('v1')) }}"
# ocp4_workload_opentour_dach_2022_infra_repo_tag: "main"

# ---------------------------------------------------------
# Service Mesh Setup
# ---------------------------------------------------------
ocp4_workload_servicemesh_channel: "stable"
ocp4_workload_servicemesh_starting_csv: "servicemeshoperator.v2.4.0"
ocp4_workload_servicemesh_jaeger_channel: "stable"
ocp4_workload_servicemesh_jaeger_starting_csv: "jaeger-operator.v1.42.0-5-0.1687199951.p"
ocp4_workload_servicemesh_kiali_channel: "stable"
ocp4_workload_servicemesh_kiali_starting_csv: "kiali-operator.v1.65.6"
ocp4_workload_servicemesh_use_catalog_snapshot: true
ocp4_workload_servicemesh_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_servicemesh_catalog_snapshot_image_tag: v4.13_2023_07_17

# -------------------------------------------------------------------
# OpenShift Pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.11
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.11.0
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.13_2023_07_17


# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.9
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_starting_csv: "openshift-gitops-operator.v1.9.0"
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.13_2023_07_17
ocp4_workload_openshift_gitops_argo_cr_additional_values: |
  resourceTrackingMethod: annotation

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.20.0
ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

#ocp4_workload_gitea_operator_create_users: true
#ocp4_workload_gitea_operator_user_number: 1
#ocp4_workload_gitea_operator_generate_user_format: lab-user
#ocp4_workload_gitea_operator_user_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_authentication_htpasswd_user_count | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_htpasswd_user_base }}%d"
ocp4_workload_gitea_operator_user_password: "{{ ocp4_workload_authentication_htpasswd_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/sa-mw-dach/microservice-introduction-app-a.git
    name: app-a
    private: false
  - repo: https://github.com/sa-mw-dach/microservice-introduction-app-b.git
    name: app-b
    private: false
  - repo: https://github.com/sa-mw-dach/microservice-introduction-app-c.git
    name: app-c
    private: false
  - repo: https://github.com/sa-mw-dach/microservice-introduction-gitops.git
    name: gitops
    private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_use_catalog_snapshot: true
ocp4_workload_web_terminal_starting_csv: "web-terminal.v1.8.0"
ocp4_workload_web_terminal_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_web_terminal_catalog_snapshot_image_tag: v4.13_2023_07_31

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhsso
# -------------------------------------------------------------------
ocp4_workload_rhsso_starting_csv: "rhsso-operator.7.6.4-opr-003"
ocp4_workload_rhsso_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_rhsso_catalogsource_tag: v4.13_2023_07_31


# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rbo/agnosticd.git
    scm_ref: development
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
