---
purpose: DEV

ocp4_installer_version: "4.11"

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_servicemesh
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_le_certificates
  - ocp4_workload_opentour_dach_2022

ocp4_workload_opentour_dach_2022_user_prefix: opentour-
ocp4_workload_opentour_dach_2022_user_count: "{{ (num_users | default('1')) | int }}"

ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/sa-mw-dach/opentour-2022-hello.git
    name: hello
    private: false

ocp4_workload_pipelines_channel: pipelines-1.8
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.8.0
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.11_2022_09_19
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.11_2022_09_19
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh

# ---------------------------------------------------------
# Servicemesh Setup
# ---------------------------------------------------------
ocp4_workload_servicemesh_channel: "stable"
ocp4_workload_servicemesh_starting_csv: "servicemeshoperator.v2.2.2"

ocp4_workload_servicemesh_jaeger_channel: "stable"
ocp4_workload_servicemesh_jaeger_starting_csv: "jaeger-operator.v1.36.0-2"

ocp4_workload_servicemesh_kiali_channel: "stable"
ocp4_workload_servicemesh_kiali_starting_csv: "kiali-operator.v1.48.2"

ocp4_workload_servicemesh_use_catalog_snapshot: false
# ocp4_workload_servicemesh_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
# ocp4_workload_serverless_catalog_snapshot_image_tag: v4.11_2022_09_19

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/rbo/agnosticd.git
    scm_ref: development
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/sa-mw-dach/opentour-2022-bookbag
          ref: development
