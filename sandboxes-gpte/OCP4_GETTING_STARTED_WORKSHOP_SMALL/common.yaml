---
# OpenShift Cluster to be used in the
# OCP 4 Starter Workshop on RHPDS
# Catalog: OpenShift Workshops
# Catalog Item: OpenShift 4 Starter Workshop - SMALL

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
platform: RHPDS

env_type: ocp4-cluster
software_to_deploy: openshift4
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

ocp4_installer_version: "4.6.16"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Generic Variables
# -------------------------------------------------------------------
cloudformation_retries: 0
install_ipa_client: false

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_opentlc_production
- ocp4_workload_project_request_template
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp4_workload_nexus_operator
- ocp-workload-etherpad
- ocp-workload-gogs
- ocp-workload-gogs-load-repository
- ocp4-workload-homeroomlab-starter-guides
- ocp4-workload-osevg-workshop-tracker

# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
student_workloads: []

# ===================================================================
# Workload Variables
# ===================================================================

# -------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create 'num_users' student users
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('2') }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# OpenTLC Production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false
ocp4_workload_opentlc_production_expose_registry_route: false
ocp4_workload_opentlc_production_set_build_defaults: true

# -------------------------------------------------------------------
# OpenShift Pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: ocp-4.6
ocp4_workload_pipelines_starting_csv: redhat-openshift-pipelines-operator.v1.2.2
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalogsource_name: redhat-operators-snapshot-pipelines
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.6_2021_01_12

# -------------------------------------------------------------------
# Nexus Operator
# -------------------------------------------------------------------
ocp4_workload_nexus_operator_project: labs
ocp4_workload_nexus_operator_image: quay.io/gpte-devops-automation/nexus-operator
ocp4_workload_nexus_operator_image_tag: v0.17.1
ocp4_workload_nexus_operator_nexus_image: registry.connect.redhat.com/sonatype/nexus-repository-manager
ocp4_workload_nexus_operator_nexus_image_tag: 3.27.0-ubi-4
ocp4_workload_nexus_operator_new_admin_password: admin123

ocp4_workload_nexus_operator_repos_maven_hosted_setup: true
ocp4_workload_nexus_operator_repos_maven_hosted:
- name: releases
  blob_store: default
  write_policy: allow_once # allow_once or allow
  strict_content_validation: true
  version_policy: release # release, snapshot or mixed
  layout_policy: strict # strict or permissive
- name: maven-snapshots
  blob_store: default
  write_policy: allow # allow_once or allow
  strict_content_validation: true
  version_policy: snapshot # release, snapshot or mixed
  layout_policy: strict # strict or permissive

# -------------------------------------------------------------------
# Legacy Roles
# -------------------------------------------------------------------
etherpad_project: labs
gogs_project: labs
opsview_project: labs
project_name: labs
workshop_type: starter

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  sandboxed: true
  virtualenv: aws-ansible-2.9
  params_to_variables:
    username: student_name
  nuke_sandbox: false
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81
