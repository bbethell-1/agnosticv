---
# Red Hat Summit 2021
# A Practical Introduction to Container Security
# course_id: rhs2021-a0001
# CODENAME: RHEL8_SEC_WKSP
# Owners: Bob Kozdemba (bkozdemb@redhat.com), Dan Walsh

# Platform
platform: RHPDS

# Config
env_type: rhel-container-security

#
# Satellite vars
#
repo_method: satellite
use_content_view: true

# BookBag VARS
bookbag_git_repo: https://github.com/redhat-gpte-labs/practical-intro-to-container-security.git
bookbag_git_version: 2021
bookbag_namespace: bookbag

# Package install
#
# Run a full yum update and install packages

update_packages: true

# --- Generic Variables
cloudformation_retries: 10
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true

student_name: lab-user
# below var to set student_name to student_user per rhel-container-security config
student_user: "{{ student_name }}"

############################
# AgnosticV meta variables #
############################
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: email
#  bookbag:
#    imageBuild:
#      source:
#        type: Git
#        git:
          # FIXME - This should move to an org-managed GitHub repo
#          uri: https://github.com/redhat-gpte-labs/practical-intro-to-container-security.git
#          ref: "2021"
  secrets:
    - name: bookbag-deployer-na4
      namespace: gpte
    - name: guidgrabber-api
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: satellite-rhel8-latest
      namespace: gpte
