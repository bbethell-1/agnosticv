---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
env_type: rosa-consolidated

# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
studentvm_roles:
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4

# Override desired version of the OpenShift CLI
studentvm_ocp4_oc_version: "4.12.12"

student_workloads: []
ocp_username: cluster-admin

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0-alpha
      pull: missing
