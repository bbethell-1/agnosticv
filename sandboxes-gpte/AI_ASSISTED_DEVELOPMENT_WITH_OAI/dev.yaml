purpose: development
ocp4_installer_version: '4.17'
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_nvidia_gpu_setup
- ocp4_workload_authorino
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_serverless
- ocp4_workload_ossm
- ocp4_workload_gitea_operator
- ocp4_workload_openshift_ai
- ocp4_workload_le_certificates
- ocp4_workload_web_terminal
ocp4_workload_authorino_operator_name: authorino-operator
ocp4_workload_authorino_operator_namespace: openshift-operators
ocp4_workload_authorino_operator_channel: stable
ocp4_workload_authorino_operator_automatic_install_plan_approval: true
ocp4_workload_authorino_operator_starting_csv: ''
ocp4_workload_authorino_operator_wait_for_deploy: true
ocp4_workload_authorino_operator_use_catalog_snapshot: false
ocp4_workload_authorino_operator_catalogsource_name: ''
ocp4_workload_authorino_operator_catalog_snapshot_image: ''
ocp4_workload_authorino_operator_catalog_snapshot_image_tag: ''
ocp4_workload_openshift_ai_automatic_install_plan_approval: true
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
