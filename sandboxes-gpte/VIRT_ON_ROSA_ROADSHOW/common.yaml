---
# restrict access until ready for "broad consumption"
#include /includes/access-restriction-admins-only.yaml
#include /includes/catalog-icon-virtualization.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/rosa_token.yaml
#include /includes/secrets/vmware-ibm-rs00-access.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ee-multicloud-rosa.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated
platform: rhpds

# -------------------------------------------------------------------
# Billing account for ROSA HCP
# -------------------------------------------------------------------
aws_billing_account_id: "017310218799"

# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
rosa_deploy: true
# rosa_deploy_hcp: true

rosa_version: "4.15.19"
# rosa_version: latest
# rosa_version_base: openshift-v4.15
rosa_installer_version: "1.2.41"

rosa_compute_replicas: 3
rosa_compute_machine_type: m6a.2xlarge

rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_type: "t3a.small"
master_instance_count: 2
bastion_instance_image: RHEL93GOLD-latest
bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
                           Welcome to the
       Experience Red Hat OpenShift Virtualization Workshop (ROSA)
                              Roadshow!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

infra_workloads:
- ocp4_workload_rosa_machinepool
- ocp4_workload_authentication_rosa
- ocp4_workload_openshift_data_foundation
- ocp4_workload_kubevirt
- ocp4_workload_web_terminal
- ocp4_workload_mtv
- ocp4_workload_minio
- ocp4_workload_oadp
- ocp4_workload_virt_roadshow_vms
- ocp4_workload_virt_roadshow_vmware
- ocp4_workload_showroom

remove_workloads:
- ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: 1
ocp4_workload_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rosa_machinepool
# -------------------------------------------------------------------
ocp4_workload_rosa_machinepool_replicas: 2 # might need a formula later
ocp4_workload_rosa_machinepool_instance_type: m5zn.metal

# -------------------------------------------------------------------
# ocp4_workload_authentication_rosa
# -------------------------------------------------------------------
ocp4_workload_authentication_rosa_token: "{{ rosa_token }}"

ocp4_workload_authentication_rosa_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_rosa_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_rosa_user_password: "{{ ocp4_workload_user_password }}"

ocp4_workload_authentication_rosa_aws_access_key_id: "{{ lookup('env','AWS_ACCESS_KEY_ID') | default(aws_access_key_id, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_secret_access_key: "{{ lookup('env','AWS_SECRET_ACCESS_KEY') | default(aws_secret_access_key, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_region: "{{ lookup('env','AWS_DEFAULT_REGION') | default(aws_region, true) | mandatory }}"

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.15
ocp4_workload_openshift_data_foundation_catalogsource_setup: false
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_workload_tolerations:
- key: metal
  operator: Exists
ocp4_workload_kubevirt_use_catalog_snapshot: false
agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.6
ocp4_workload_mtv_max_vm_inflight: 2

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: false
ocp4_workload_minio_root_user: minio-admin
ocp4_workload_minio_root_password: minio-password
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-05-28T17-19-04Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name: ocs-storage
ocp4_workload_minio_bucket_multi_user: false

# -------------------------------------------------------------------
# ocp4_workload_oadp
# -------------------------------------------------------------------
ocp4_workload_oadp_channel: stable-1.4
ocp4_workload_oadp_use_catalog_snapshot: false

# Single User
ocp4_workload_oadp_multi_user: false
ocp4_workload_oadp_configure_dpa: true
ocp4_workload_oadp_storage: minio
ocp4_workload_oadp_storage_minio_user: minio-admin
ocp4_workload_oadp_storage_minio_password: minio-password
ocp4_workload_oadp_storage_minio_name: minio
ocp4_workload_oadp_storage_minio_namespace: minio
ocp4_workload_oadp_storage_minio_bucket_name: ocs-storage

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vms
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vms_start_vms: false
ocp4_workload_virt_roadshow_vms_num_users: 1
ocp4_workload_virt_roadshow_vms_namespace: vmimported
# Roadshow Setup
# When set to true (default) then the application made up from the VMs will not
# work until instructions are followed.
# When false the application will work out of the box without changes
ocp4_workload_virt_roadshow_vms_roadshow_setup: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_virt_roadshow_vmware
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vmware_num_users: 1
ocp4_workload_virt_roadshow_vmware_vcenter_folder: "ocpvirt-{{ guid }}"
ocp4_workload_virt_roadshow_vmware_enable_mtv: true
ocp4_workload_virt_roadshow_vmware_enable_cert_validation: false

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
#### IF YOU UPDATE THE CONTENT_GIT_REPO, PLEASE NOTIFY kodonnel@redhat.com and andharri@redhat.com
#### FROM SERVICES SO THEY CAN MIGRATE TO ANOTHER REPO WITH US
#### THEY ARE DOWNSTREAM
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-virt-roadshow-rosa
#### the following is the Equinix based roadshow repo:
# ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/openshift-virt-roadshow.git
####
ocp4_workload_showroom_content_only: true

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 49cece7b-da4e-4509-8a8b-9c704f78a06b
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Experience OpenShift Virtualization on ROSA Roadshow (ROSA)
    category: Workshops
    keywords:
    - rosa
    - virtualization
    - openshift-virtualization
    - roadshow
    - experience
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '68'
    parameters: []
  lifespan:
    default: 30h
    maximum: 30d
    relativeMaximum: 30d
  runtime:
    default: 9999h
    maximum: 9999h
  tower:
    timeout: 14400
