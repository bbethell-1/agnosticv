---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/ent-demo-ate.yaml

#    dontinclude /includes/secrets/satellite-rhel-8.6-and-9.0.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: base-rhel-infra
cloud_provider: ec2

aws_region: us-east-2

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    region: aws_region

sandbox_user_info_messages_enable: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
    # virtualenv: ansible2.9-python3.6-2021-11-30

__meta__:
  asset_uuid: d621faeb-751d-42eb-909c-0078ddb9c65e
  anarchy:
    namespace: babylon-anarchy-enterprise
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: WebAssembly OCI Workshop
    keywords:
      - wasm
      - oci
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '90'
    parameters: []
  secrets: []
  access_control:
    allow_groups:
      - babylon-admins
      - babylon-devs
      - rhpds-devs
      - rhpds-devs-octo-emerging-tech

repo_method: satellite
set_repositories_satellite_ha: true
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_activationkey: wasm-oci-rhel8-87htR

bookbag_git_repo: https://github.com/tonykay/wasm-oci-workshop.git
