---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# This first tag has to match the CloudForms provider deploying this CI.
# It may be passed by the provider, so please make sure you are not overwriting it with this definition.
# course_id: RHS_2020_T3656D-b
# -------------------------------------------------------------------

platform: rhpds
cloud_provider: ec2
# output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}
aws_region: us-east-2
smoke_tests: false

# -------------------------------------------------------------------
# For the environment to build, the pub key must be present in the AWS EC2 Region where the deploy will happen.
# ocpkey set in account.yaml and to be used instead of backdoor so presenters can connect if needed
# key_name: opentlc_admin_backdoor
# -------------------------------------------------------------------

# The below variable will be false for most non-training environments.
install_opentlc_integration: false
install_idm: htpasswd
install_ipa_client: false
install_ftl: false

install_student_user: true
student_name: lab-user
student_password: r3dh4t1!
# Set authentication passwords
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: 0


# AWS instance types
bastion_instance_image: RHEL84GOLD-latest
# _infra_node_instance_type: m5.4xlarge
clientvm_instance_type: t3.medium
clientvm_instance_count: 1
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 3

#Migration vars

# repo_version: 4.7  (not used in OCP 4.7)
# Watch out for trailing spaces, Travis is angry
software_to_deploy: openshift4
ocp4_installer_version: "4.12.12"
repo_method: satellite
env_type: ocp4-cluster
update_packages: true
install_ocp4: true

infra_workloads:
- ocp4_workload_authentication
- ocp4-workload-ocs-poc
- ocp4-workload-migration

# OCS deployment variables

ocs_operator_source: "redhat-operators"
ocs_operator_source_namespace: "openshift-marketplace"
ocs_namespace: openshift-storage
ocs_migstorage_namespace: openshift-storage
ocs_mcg_pv_pool_bucket_name: migstorage
ocs_migstorage: true
ocs_operator_workload_destroy: false
ocs_channel: stable-4.12

ocs_mcg_core_cpu: 200m
ocs_mcg_db_cpu: 200m
ocs_mcg_core_mem: 1Gi
ocs_ceph_mds_cpu: 200m
ocs_ceph_mon_cpu: 200m
ocs_ceph_mgr_cpu: 200m
ocs_ceph_osd_cpu: 200m

ocs_expected_crds:
- backingstores.noobaa.io
- bucketclasses.noobaa.io
- noobaas.noobaa.io
- objectbucketclaims.objectbucket.io
- objectbuckets.objectbucket.io

archive_dir: "{{ output_dir | dirname }}/archive"

agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b7b962d9-9c76-4371-8c6c-b9557d5f33bd
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Migration Toolkit for Containers (OCP4)
    category: Workshops
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp47
    labels:
      #OpenShift_Version: "4.7"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: Software_Engineering_OpenShift
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters: []
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
