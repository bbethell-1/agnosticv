---
## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
## course_id: RHS_2020_T3656D-b

platform: rhpds
env_type: ocp4-workshop
cloud_provider: ec2
# output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}
aws_region: us-east-2

repo_version: 4.3
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: 4.3.29
osrelease: 4.3.0
smoke_tests: false

## For the environment to build, the pub key must be present in the AWS EC2 Region where the deploy will happen.
# ocpkey set in account.yaml and to be used instead of backdoor so presenters can connect if needed
# key_name: opentlc_admin_backdoor

##The below variable will be false for most non-training environments.
install_opentlc_integration: false
install_idm: htpasswd
install_ipa_client: false
install_ftl: false

install_student_user: true
student_name: lab-user
student_password: r3dh4t1!
admin_user: admin
admin_password: r3dh4t1!

# AWS instance types
# _infra_node_instance_type: m5.4xlarge
clientvm_instance_type: t3.medium
clientvm_instance_count: 1
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 3

#Migration vars
ocs_namespace: openshift-storage
ocs_mcg_core_cpu: 0.1
ocs_mcg_db_cpu: 0.1
ocs_mcg_core_mem: 1Gi
ocs_mcg_pv_pool_bucket_name: migstorage
ocs_migstorage: true
ocs_migstorage_namespace: openshift-storage
ocs_operator_workload_destroy: false
ocs_release: v4.2.2
archive_dir: "{{ output_dir | dirname }}/archive"

#ocs_channel: stable-4.6

default_workloads:
  - ocp4-workload-project-request-template
  - ocp4-workload-ocs-poc
  - ocp4-workload-migration

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  secrets:
    - ocp4_token
  params_to_variables:
    nodecount: node_instance_count_ignore
