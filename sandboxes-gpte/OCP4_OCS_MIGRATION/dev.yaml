---
# Red Hat Summit 2020 - T3656D - Migrating applications from OCP/OCS 3 to OCP/OCS 4 a hands-on lab
purpose: development  ### This is a cost tag, please make sure it's correct.
cloudformation_retries: 0

#lets_encrypt_production: True
#install_lets_encrypt_certificates: true

agnosticv_meta:
  idle_after_deploy: 2
  idle_after_start: 4
  agnosticd_git_ref: mtc-development
  agnosticd_git_repo: https://github.com/pericnenad/agnosticd.git

__meta__:
  # Dark Tower configuration
  tower:
    organization: gpte

  deployer:
    scm_url: https://github.com/pericnenad/agnosticd.git
    scm_type: git
    scm_ref: mtc-development
    type: agnosticd

# repo_version: 4.7  (not used in OCP 4.7)
# Watch out for trailing spaces, Travis is angry
software_to_deploy: openshift4
ocp4_installer_version: "4.7.4"
repo_method: satellite
env_type: ocp4-cluster
update_packages: true

infra_workloads:
- ocp4_workload_authentication
- ocp4-workload-ocs-poc
- ocp4-workload-migration

# Enable authentication and set admin password (default admin user is admin)
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: student
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: 5

# OCS deployment variables
ocs_operator_source: "redhat-operators"
ocs_operator_source_namespace: "openshift-marketplace"
ocs_channel: stable-4.6
ocs_expected_crds:
- backingstores.noobaa.io
- bucketclasses.noobaa.io
- noobaas.noobaa.io
- objectbucketclaims.objectbucket.io
- objectbuckets.objectbucket.io
