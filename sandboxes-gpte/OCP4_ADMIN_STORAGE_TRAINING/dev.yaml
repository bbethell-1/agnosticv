---
purpose: development

# For Windows containers, we need to use OVNKUbernetes
ocp4_network_type: OVNKubernetes
# For 4.6 it is required to apply a workaround during the installation when using OVNKubernetes for Windows containers
ocp4_network_ovn_install_workaround: true

HOMEROOM_IMAGE: ocp4-dev
master_instance_type: m5.xlarge
worker_instance_type: m5.2xlarge
worker_instance_count: 3
_infra_instance_type: m5.4xlarge
_infra_node_replicas: 1

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
