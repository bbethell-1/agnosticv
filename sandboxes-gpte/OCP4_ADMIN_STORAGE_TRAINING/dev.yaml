---
# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 and Container Storage for Admins(S)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds
purpose: development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
HOMEROOM_IMAGE: ocp4-dev
master_instance_type: m5.xlarge
worker_instance_type: m5.large
worker_instance_count: 3
_infra_instance_type: m5.xlarge
_infra_node_replicas: 1

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
repo_method: satellite
ocp4_installer_version: 4.6.3
oc_client_version: 4.6.3
osrelease: 4.6.0

agnosticv_meta:
  secrets:
  # Satellite Configuration
  - satellite-rhel81
  idle_after_deploy: 4
  idle_after_start: 8
