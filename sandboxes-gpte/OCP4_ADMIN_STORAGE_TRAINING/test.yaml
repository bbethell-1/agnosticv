---
# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 and Container Storage for Admins(T)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds
purpose: test

# For Windows containers, we need to use OVNKUbernetes
# with hybrid overlay. We also need a newer env type.
env_type: ocp4-cluster
ocp4_network_type: OVNKubernetes
ocp4_network_ovn_install_workaround: true

ocp4_installer_version: "4.7.16"
software_to_deploy: openshift4

install_lets_encrypt_certificates: false

infra_workloads:
- ocp4-workload-workshop-admin-storage
- ocp4-workload-enable-lets-encrypt-certificates
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
HOMEROOM_IMAGE: ocp4-prod
master_instance_type: m5.xlarge
worker_instance_type: m5.2xlarge
worker_instance_count: 3
_infra_instance_type: m5.4xlarge
_infra_node_replicas: 1

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  sandboxed: true
  virtualenv: ansible2.9-python3.6-2021-01-22
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-workload-workshop-admin-storage-test
