---
purpose: rhpds-test

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 and Container Storage for Admins(T)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: ocp4-cluster
software_to_deploy: openshift4

HOMEROOM_IMAGE: ocp4-prod

master_instance_type: m4.xlarge
worker_instance_type: m5.2xlarge
worker_instance_count: 3
_infra_instance_type: m4.4xlarge
_infra_node_replicas: 1

# RHELGOLD is not available for sandboxes
bastion_instance_image: RHEL82

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.6.3
oc_client_version: 4.6.3
osrelease: 4.6.3

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4_workload_authentication
#- ocp4_workload_le_certificates
- ocp4-workload-workshop-admin-storage

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_password: r3dh4t1!
student_sudo: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
#ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
#ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
#ocp4_workload_authentication_htpasswd_user_count: 200
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  virtualenv: aws-ansible-2.9
  agnosticd_git_tag_prefix: ocp4-workload-workshop-admin-storage-test
  params_to_variables:
    nodecount: ignorecfme
    num_users: ignorecfme
    username: student_name
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81
  idle_after_deploy: 4
  idle_after_start: 8
