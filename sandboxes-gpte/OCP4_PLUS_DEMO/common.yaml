---
#include /includes/parameters/ocp4-fips-enable.yaml

# --- OpenShift 4 Plus Demo
# --- Catalog: OpenShift Workshop
# --- Catalog Item: OpenShift 4 Plus Demo

## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
platform: rhpds

## Mandatory Variable ##

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
bastion_instance_image: "RHEL84GOLD"
node_instance_image: "RHEL84GOLD"

# The name of the agnosticd config to deploy
env_type: ocp4-cluster

software_to_deploy: openshift4

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: false

# OpenShift Installer Version
ocp4_installer_version: "4.9.6"

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- studentvm_ocp4
- ocp4_workload_plus

# Use a catalog snapshot instead of whatever the latest is
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_acm_release: "release-2.3"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.3.1"
ocp4_workload_rhacm_catalog_source_tag: "v4.8_2021_08_09"

# --- Student Workloads (YAML List)
student_workloads: []

# Authentication
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 100
ocp4_workload_authentication_admin_user: opentlc-mgr
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    nodecount: ''
    user: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 Plus Demo
    category: Demos
    icon:
      alt: "Cloud Native"
      url: "https://gpte-public.s3.amazonaws.com/babylon-catalog/Cloud_Native.svg"
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp49
    labels:
      #OpenShift_Version: "4.9"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: PFE
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: student_name
    - name: aws_region
      description: Region
      openAPIV3Schema:
        type: string
        nullable: false
        default: us-east-2
    - name: user_count
      description: Number of users to provision for infrastructure deployment.
      openAPIV3Schema:
        default: 1
        type: integer
        minimum: 1
        maximum: 100
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81
