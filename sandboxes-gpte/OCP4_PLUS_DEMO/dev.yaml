---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: development

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 2
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL82GOLD

ocp4_installer_version: "4.9.6"

# Use a catalog snapshot instead of whatever the latest is
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_acm_release: "release-2.3"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.3.1"
ocp4_workload_rhacm_catalog_source_tag: "v4.8_2021_08_09"

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_url: https://github.com/giofontana/agnosticd.git
    scm_ref: ocp4-plus-demo
