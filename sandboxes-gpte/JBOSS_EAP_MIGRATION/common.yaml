---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/num-users-2-salesforce.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-3regions.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/controlplane-count.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/jboss-boss-httpinfo.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: 4.13.1
ocp4_installer_use_dev_preview: false

# ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/fast-4.13/openshift-install-linux.tar.gz
# ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/fast-4.13/openshift-client-linux.tar.gz

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type_family: c6in
master_instance_type_size: >-
  {{ '4xlarge' if master_instance_count|int <= 1
  else '2xlarge' if worker_instance_count|int <= 10
  else '4xlarge' if worker_instance_count|int <= 20
  else '8xlarge'
  }}
master_instance_type: '{{ master_instance_type_family }}.{{ master_instance_type_size
  }}'

master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}
worker_instance_type: m5a.4xlarge
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max
  }}"

worker_storage_type: gp3
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4-workload-eap8-workshop

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ''
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# user password
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('2')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Modules
# -------------------------------------------------------------------
ocp4_workload_eap8_workshop_guides_module_type: "{{ module_type }}"

ocp4_workload_eap8_workshop_guides_module_titles:
- name: m1
  title: "JBoss 7 to JBoss 8 Migration workshop "
  path: "/workshop/EAP8-lab/lab/intro"
- name: m2
  title: "JBoss 7 and JBoss 8 OpenShift workshop "
  path: "/workshop/EAP8-lab/lab/intro"

module_type: >-
  {{
    ";".join(
      (["m1"] if module_enable_m1 | default(false) | bool else []) +
      (["m2"] if module_enable_m2 | default(false) | bool else [])
    )
  }}

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4CA509EF-AA3C-48FD-BF86-AE14D263FB68
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: JBoss EAP 7 to JBoss EAP 8 migration workshop
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '67'
    multiuser: true
    parameters:
    - name: module_enable_m1
      description: Enable module m1
      formGroup: Modules
      formLabel: Module 1 -  Migration an application from JBoss EAP 7.4 to JBoss EAP 8
      openAPIV3Schema:
        type: boolean
        default: true
    - name: module_enable_m2
      description: Enable module m2
      formGroup: Modules
      formLabel: Module 2 -Deploy JBoss EAP 7.4 and JBoss EAP 8 applications on OpenShift
      openAPIV3Schema:
        type: boolean
        default: true
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel8-latest-ha
  - name: output-dir-s3
    namespace: gpte
