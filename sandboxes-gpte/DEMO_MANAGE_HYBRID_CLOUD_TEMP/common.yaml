---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

cloud_provider: none
env_type: hybrid-cloud

__meta__:
  anarchy:
    namespace: hybrid-cloud-demo

  catalog:
    display_name: Hybrid Cloud Demo
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: region
        required: true
        resourceIndexes:
          - 0
          - 1
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

  # Components to include in template and catalog item
  components:
    - name: aws-sandbox-a
      display_name: AWS OpenShift A
      item: sandboxes-gpte/SANDBOX_OCP49
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_aws_a_ca_cert
        - name: openshift_api_url
          var: openshift_aws_a_api_url
        - name: openshift_cluster_admin_token
          var: openshift_aws_a_token
        - name: openshift_console_url
          var: openshift_aws_a_console_url
    - name: azr-sandbox-b
      display_name: Azure OpenShift B
      item: azure_gpte/OPEN_ENVIRONMENT_AZURE_ARO4
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_azr_b_ca_cert
        - name: openshift_api_url
          var: openshift_azr_b_api_url
        - name: openshift_cluster_admin_token
          var: openshift_azr_b_token
        - name: openshift_console_url
          var: openshift_azr_b_console_url

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
