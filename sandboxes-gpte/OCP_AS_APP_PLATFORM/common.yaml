# -------------------------------------------------------------------
# --- Catalog: Red Hat One Lab
# --- Catalog Item: OpenShift as an Application Platform
# -------------------------------------------------------------------

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

__meta__:
  asset_uuid: 5d53e6cf-4c02-4312-87ec-1f4b48d6b1c4
  catalog:
    category: Red_Hat_One
    display_name: OpenShift as an Application Platform
    keywords:
    - openshift
    - ocp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
    - name: aws_region
      description: AWS Region to Provision Environment.
      formLabel: Region
      openAPIV3Schema:
        type: string
        default: us-east-2
        enum:
        - us-east-2
        - us-west-2
      required: true
      resourceIndexes:
      - 0
      - 1
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 100
      resourceIndexes:
      - 0
      - 1
      validation: >-
        num_users == 2 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than two requires a valid SalesForceID.')

  # Components to include in template and catalog item
  components:
  - name: main
    display_name: Main
    item: sandboxes-gpte/OCP_AS_APP_PLATFORM_MAIN
  - name: edge
    display_name: Edge
    item: sandboxes-gpte/OCP_AS_APP_PLATFORM_EDGE

  # This catalog item only consists of components and does not describe
  # anything to provision.
  deployer:
    type: null
