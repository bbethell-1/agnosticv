---
#include /includes/catalog-icon-openshift-data-science.yaml

#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-6.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# Private LLM as a Service
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6a.2xlarge
master_instance_count: 3

worker_instance_type: m6a.4xlarge
worker_instance_count: 3

bastion_instance_type: t2.small
bastion_instance_image: RHEL95GOLD-latest

gpu_instance_type: g6.2xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.19.3"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_machinesets
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_minio
  - ocp4_workload_s3_model_copy_to_minio
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_authorino
  - ocp4_workload_openshift_ai
  - ocp4_workload_web_terminal
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: 1
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.19_2025_07_01

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.18
ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 1500Gi
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

ocp4_workload_openshift_data_foundation_ceph_storage_system_deploy_timeout: 1500
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1500

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: false

ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    role: worker-gpu
    instance_type: "{{ gpu_instance_type }}"
    autoscale: false
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 1
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_use_catalog_source: true
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.11-opr-006

ocp4_workload_rhsso_authentication_admin_username: "{{ common_admin_username }}"
ocp4_workload_rhsso_authentication_admin_password: "{{ common_admin_password }}"
ocp4_workload_rhsso_authentication_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_rhsso_authentication_user_name_base: "{{ ocp4_workload_user_base}}"
ocp4_workload_rhsso_authentication_user_password: "{{ common_user_password }}"

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.16
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_starting_csv: cert-manager-operator.v1.16.0
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.18.1

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_gitops_starting_csv: openshift-gitops-operator.v1.16.1

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
  g, user1, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_nvidia_gpu_setup
# -------------------------------------------------------------------
nfd_operator_channel: stable
nfd_operator_operand_image: "registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.19.0"
nfd_operator_starting_csv: nfd.4.19.0-202507011209

nvidia_gpu_operator_channel: v25.3
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v25.3.1

# Operator not found in the this catalog snapshot.
# nfd_operator_use_catalog_snapshot: true
# nfd_operator_catalogsource_name: redhat-operators-snapshot-nfd
# nfd_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
# nfd_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Not implemented in the agd role.
# nvidia_gpu_operator_use_catalog_snapshot: true
# nvidia_gpu_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
# nvidia_gpu_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: ic-shared-minio
ocp4_workload_minio_port: 9000
ocp4_workload_minio_storage_size: "150Gi"
# ocp4_workload_minio_expose_route: false
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2025-02-28T09-55-16Z
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: minio123
# ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
  - llm-storage

# -------------------------------------------------------------------
# ocp4_workload_s3_model_copy_to_minio
