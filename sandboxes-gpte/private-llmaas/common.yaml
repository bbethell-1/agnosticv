# -------------------------------------------------------------------
# Private LLM as a Service
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6a.2xlarge
master_instance_count: 3

worker_instance_type: m6a.4xlarge
worker_instance_count: 3

bastion_instance_type: t2.small
bastion_instance_image: RHEL95GOLD-latest

gpu_instance_type_1: g6e.2xlarge
gpu_instance_type_2: g6.2xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_machinesets
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_minio
  - ocp4_workload_s3_model_copy_to_minio
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_authorino
  - ocp4_workload_openshift_ai
  - ocp4_workload_devspaces
  - ocp4_workload_web_terminal
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: 1
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ (guid[::-1][:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_username: admin

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_07_25

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
