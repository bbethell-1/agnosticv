# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e9bb5692-531d-11f0-9b97-dba9877a07c4
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
    actions:
      start:
        disable: true
      stop:
        disable: true
  sandbox_api:
    reservation: pgpu-event
    actions:
      start:
        enable: false
      stop:
        enable: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Private LLM as a Service - A Practical Introduction with OpenShift AI"
    category: Demos
    multiuser: false
    keywords: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
  tower:
    timeout: 21600
  owners:
    maintainer:
      - name: Ritesh Shah
        email: rshah@redhat.com
      - name: Juliano Mohr
        email: juliano@redhat.com
