---
# --- OpenShift 4 Migration
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OCP Migration Lab - OCP 4 Cluster
# --- ELT: OpenShift 4 Migration

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.6.3"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# This is a Lab Environment -> Install FTL
install_ftl: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_minio
- ocp4_workload_migration_training
- ocp4_workload_le_certificates

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: ocp_student
ocp4_workload_authentication_htpasswd_user_count: 10
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4-workload-minio
# -------------------------------------------------------------------
ocp4_workload_minio_access_key: "minio"
ocp4_workload_minio_secret_key: "minio123"

# -------------------------------------------------------------------
# ocp4_workload_migration_training
# -------------------------------------------------------------------
ocp4_workload_migration_training_install_mtc: false
# ocp4_workload_migration_training_channel: "release-v1.3"
# ocp4_workload_migration_training_automatic_install_plan_approval: true
# ocp4_workload_migration_training_starting_csv: ""
# ocp4_workload_migration_training_starting_csv: "mtc-operator.v1.3.1"
ocp4_workload_migration_training_disable_default_catalogs: true
ocp4_workload_migration_training_use_catalog_snapshot: true
ocp4_workload_migration_training_catalogsource_name: redhat-operators-snapshot-mtc
ocp4_workload_migration_training_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_migration_training_catalog_snapshot_image_tag: v4.6_2020_10_28

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  sandboxed: true
  nuke_sandbox: true
  params_to_variables:
    user: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: nodecount_ignored
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81
