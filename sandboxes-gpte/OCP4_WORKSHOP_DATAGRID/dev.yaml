---
env_type: ocp4-cluster

purpose: development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.7.2
# OCP Versions and repo
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

master_instance_type: m5.xlarge
worker_instance_type: m5.4xlarge
worker_instance_count: 3
_infra_instance_type: m5.4xlarge
_infra_node_replicas: 1

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  secrets:
    - satellite-rhel81
