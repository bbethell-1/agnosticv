---
purpose: development

# OCP Versions and repo
repo_method: file
own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/4.6.0
repo_version: 4.6.0
osrelease: 4.6.0
oc_client_version: 4.6.22
ocp4_installer_version: "4.6.22"

master_instance_type: m5.xlarge
worker_instance_type: m5.4xlarge
worker_instance_count: 3
_infra_instance_type: m5.4xlarge
_infra_node_replicas: 1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 8
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: rhte-tower
      namespace: gpte
