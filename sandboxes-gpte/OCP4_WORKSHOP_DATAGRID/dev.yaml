---
purpose: development

# OpenShift Installer Version
ocp4_installer_version: "4.6.18"

master_instance_type: m5.xlarge
worker_instance_type: m5.4xlarge
worker_instance_count: 3
_infra_instance_type: m5.4xlarge
_infra_node_replicas: 1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 8
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: rhte-tower
      namespace: gpte
