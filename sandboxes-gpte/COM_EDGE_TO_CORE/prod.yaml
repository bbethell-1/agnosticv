---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication             # all segments
- ocp4_workload_pipelines
- ocp4_workload_openshift_ai
- ocp4_workload_gitea_operator
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_web_terminal

# Workload variables #
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.12_2023_07_03

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_operator_group_name: "rhods-ods-operator"
ocp4_workload_openshift_ai_operator_name: "rhods-operator"
ocp4_workload_openshift_ai_namespace: "redhat-ods-operator"
ocp4_workload_openshift_ai_channel: "stable-2.8"
ocp4_workload_openshift_ai_catalogsource_setup: "False"
ocp4_workload_openshift_ai_installPlanApproval: "Automatic"
# Set automatic InstallPlan approval. If set to false it is also suggested
# to set the starting_csv to pin a specific version
install_openshift_ai_operator_automatic_install_plan_approval: "false"
ocp4_workload_openshift_ai_source: "redhat-operators"
ocp4_workload_openshift_ai_sourceNamespace: "openshift-marketplace"
ocp4_workload_openshift_ai_csv_nameprefix: "rhods-operator"
ocp4_workload_openshift_ai_startingCSV: "rhods-operator.2.8.4"
ocp4_workload_openshift_ai_install_csv_ignore_error: "false"
ocp4_workload_openshift_ai_namespace_list: "{{ ocp4_workload_openshift_ai_namespace }}"
ocp4_workload_openshift_ai_applications_namespace: "redhat-ods-applications"
ocp4_workload_openshift_ai_is_workshop: "false"
ocp4_workload_openshift_ai_workshop_num_users: 10
ocp4_workload_openshift_ai_workshop_username_base: "user"
ocp4_workload_openshift_ai_workshop_password: "openshift"
ocp4_workload_openshift_ai_codeflare: "Removed"
ocp4_workload_openshift_ai_dashboard: "Managed"
ocp4_workload_openshift_ai_datasciencepipelines: "Managed"
ocp4_workload_openshift_ai_kserve: "Managed"
ocp4_workload_openshift_ai_modelmeshserving: "Managed"
ocp4_workload_openshift_ai_ray: "Removed"
ocp4_workload_openshift_ai_trustyai: "Removed"
ocp4_workload_openshift_ai_workbenches: "Managed"

# Variable for ocp4_workload_object_detection_ai_ml_setup
rhods_username: "admin"
ocp4_workload_aiml_namespace: "{{ rhods_username }}-rhods-project"
ocp4_workload_gitea_aiml_user: lab-user
retail_rhods_project_gitea_password: b3BlbnNoaWZ0
retail_rhods_project_gitea_username: bGFiLXVzZXI=

# For ocp4_workload_aiml_edge_workshop
# Repo to clone for running the edge workload
ocp4_workload_aiml_edge_workshop_cluster_bootstrap_repo: "https://github.com/Enterprise-Neurosystem/cluster-bootstrap.git"
ocp4_workload_aiml_edge_workshop_cluster_bootstrap_repo_branch: main

# For ocp4_workload_le_certificates
# Install certificates for Ingress Controllers
ocp4_workload_le_certificates_install_certificates: true

# Install certificates for API Endpoint
ocp4_workload_le_certificates_install_api: true

# Option allow continue without certificates on failure
ocp4_workload_le_certificates_failure_is_fatal: true

# It takes about 4 minutes per API Server to
# restart with certificates (due to AWS
# Load Balancer). Therefore sleep
# 12 minutes by default to give the kube-apiserver
# cluster operator enough time to progress.
# Wait time may be extended if it's needed
ocp4_workload_le_certificates_wait_after_cert_setup: 12

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.10

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: ocp4-workshop-rhods-base-aws-1.0.2
