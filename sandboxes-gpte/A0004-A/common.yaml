---
# Platform
platform: SPP

# Config
env_type: ocp4-shared
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.1.4"

# Repos
osrelease: 4.1.0
repo_version: '4.1'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

# Instance Types
bastion_instance_type: t2.medium
master_instance_count: 1
master_instance_type: m5.xlarge
worker_instance_count: 1
worker_instance_type: m5.xlarge

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: true
student_name: student
student_password: rhte2019

# OCP Authentication
install_idm: htpasswd
admin_user: admin
admin_password: rhte2019
# Users are user1..200
user_password: rhte2019

# Workloads to deploy on the cluster
# Default workloads are a YAML list
default_workloads:
- ocp4-workload-rhte-kubefed-app-portability

# Infra and Student Workloads are comma separated strings
infra_workloads: ""
student_workloads: ""

# Tags to AWS Instances
cloud_tags:
- owner: mavazque@redhat.com
  course_name: RHTE 2019 A0004 - Hands on with Red Hat Multi-Cluster Federation: Application Portability
  platform: "{{ platform | d('unknown') }}"
  purpose: RHTE 2019
  shared: "No"

# Idle settings
idle_after_deploy: 26
idle_after_start: 8
