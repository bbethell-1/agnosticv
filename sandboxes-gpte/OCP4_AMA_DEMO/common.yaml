---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
# -------------------------------------------------------------------
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: OpenShift 4 App Modernization Demo
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest
master_instance_type: c5.metal
master_instance_count: 1
worker_instance_count: 0

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Customizations to packages and virtualenvs to enable ovirt.ovirt
# -------------------------------------------------------------------
# Add prereqs for ovirt-engine-sdk-python Python package
host_virtualenv_package_prereqs:
- gcc
- python3
- python3-devel
- python3-libselinux
- python3-pip
- libcurl-devel
- openssl-devel
- libxml2-devel

# Add required Python packages to virtualenv for ovirt.ovirt collection
host_virtualenv_requirements_override:
- ovirt-engine-sdk-python==4.5.0
- passlib==1.7.4

# Custom collections for this environment
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.8.0
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.8.0
  - name: ansible.posix
    version: 1.3.0
  - name: ovirt.ovirt
    version: 2.0.3

# -------------------------------------------------------------------
# Set up Security group on Bastion to allow inbound traffic for
# Let's Encrypt verification and VS Code
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPSPublic
    description: "HTTPS public for VSCode Server"
    from_port: 8443
    to_port: 8443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
# ocp4_cluster_show_access_user_info: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_kubevirt
- ocp4_workload_mtv
- ocp4_workload_mta
- ocp4_workload_mta_tackle
- ocp4_workload_ama_demo
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_vscode_bastion

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

# Remove Workloads when deleting the cluster
remove_workloads_bastion:
- ocp4_workload_ama_demo

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('2')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v1.3.0

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.16.8"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: lab-user
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/redhat-mw-demos/app-mod-projects
  name: app-mod-projects
  private: false

# ---------------------------------------------------------
# OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_05_30
# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_05_30

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalogsource_name: redhat-operators-snapshot-kubevirt
ocp4_workload_kubevirt_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_kubevirt_catalog_snapshot_image_tag: v4.10_2022_05_30

# -------------------------------------------------------------------
# ocp4_workload_mta
# -------------------------------------------------------------------
ocp4_workload_mta_install_operator: false
ocp4_workload_mta_print_access_information: true

# -------------------------------------------------------------------
# ocp4_workload_mta_tackle
# -------------------------------------------------------------------
ocp4_workload_mta_tackle_print_access_information: true
ocp4_workload_mta_tackle_namespace: tackle
ocp4_workload_mta_tackle_seed: true

# -------------------------------------------------------------------
# ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.3.0
ocp4_workload_mtv_use_catalog_snapshot: true
ocp4_workload_mtv_catalogsource_name: redhat-operators-snapshot-mtv
ocp4_workload_mtv_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_mtv_catalog_snapshot_image_tag: v4.10_2022_05_30

# -------------------------------------------------------------------
# ocp4_workload_ama_demo
# -------------------------------------------------------------------
ocp4_workload_ama_demo_rhev_user_password_validity: 14

ocp4_workload_ama_demo_oracle_vm_setup: true
ocp4_workload_ama_demo_oracle_vm_template: rhel85-empty
ocp4_workload_ama_demo_oracle_vm_name: "oracle-{{ guid }}"

ocp4_workload_ama_demo_oracle_dba_password: redhat
ocp4_workload_ama_demo_oracle_db_password: redhat

ocp4_workload_ama_demo_tomcat_vm_setup: true
ocp4_workload_ama_demo_tomcat_vm_template: rhel85-empty
ocp4_workload_ama_demo_tomcat_vm_name: "tomcat-{{ guid }}"

ocp4_workload_ama_demo_vm_user_name: lab-user
ocp4_workload_ama_demo_vm_user_password: r3dh4t1!

ocp4_workload_ama_demo_tomcat_repo_user: "{{ ocp4_workload_gitea_operator_generate_user_format }}"
ocp4_workload_ama_demo_tomcat_repo_user_password: "{{ ocp4_workload_gitea_operator_user_password }}"
ocp4_workload_ama_demo_tomcat_repo_name: app-mod-projects
ocp4_workload_ama_demo_tomcat_repo_branch: main

ocp4_workload_ama_demo_gitea_user: "{{ ocp4_workload_gitea_operator_generate_user_format }}"
ocp4_workload_ama_demo_gitea_user_password: "{{ ocp4_workload_gitea_operator_user_password }}"

# -------------------------------------------------------------------
# ocp4_workload_vscode_bastion
# -------------------------------------------------------------------
ocp4_workload_vscode_bastion_vscode_package_version: "4.4.0"
ocp4_workload_vscode_bastion_vscode_password: openshift
ocp4_workload_vscode_bastion_workspace_name: "AppModProjects"
ocp4_workload_vscode_bastion_vscode_repo_directories:
- "{{ ocp4_workload_vscode_bastion_home_directory }}/app-mod-projects"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Provider: RHPDS
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      #OpenShift_Version: '4.10'
    display_name: OpenShift 4 App Modernization Demo
    category: Demos
    multiuser: true
    parameters: []
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: output-dir-s3
