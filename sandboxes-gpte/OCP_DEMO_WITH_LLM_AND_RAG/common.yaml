# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO : Document Generation Demo with LLM and RAG
# -------------------------------------------------------------------
# Workshop with Document Generation Demo with LLM and RAG
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"
num_users: 1

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL94GOLD-latest

# # -------------------------------------------------------------------
# # Security group
# # -------------------------------------------------------------------
# security_groups:
