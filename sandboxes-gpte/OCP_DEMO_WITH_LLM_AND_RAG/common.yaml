#     from_port: 80
#     to_port: 80
#     protocol: tcp
#     cidr: "0.0.0.0/0"
#     rule_type: Ingress
#   - name: BasHTTPSPublic
#     description: "HTTPS public for VSCode Server"
#     from_port: 8443
#     to_port: 8443
#     protocol: tcp
#     cidr: "0.0.0.0/0"
#     rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 3
worker_instance_type: m5a.4xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: community.okd
      version: 2.3.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication           # all segments
  - ocp4_workload_cert_manager
  - ocp4_workload_ai_llm_rag_demo

# Workload variables #
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.15_2024_07_01

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
# Leave stable-v1. stable-v1.14 does not support OCP 4.13 (which is an option
# from the version dropdown)
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 65B9522D-353C-4791-A3E7-0A95A7E3FF27
  owners:
    maintainer:
      - name: Marcus Trujillo
        email: mtrujillo@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    workshopUiDisabled: true
    display_name: >-
      AI Document Generation Demo with LLM and RAG
    category: Demos
    keywords:
      - openshift
      - ocp
      - ods
      - datascience
      - rhods
      - object
      - detect
      - retail
      - openshiftai
      - ai
      - gpu
    multiuser: false
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-west-2
          enum:
            - us-east-1
            - us-west-2
      - name: ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.22'
          enum:
            - '4.20'
            - '4.21'
            - '4.22'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version
    labels:
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_Cloud
      Provider: RH_Community
      SLA: Community
    reportingLabels:
      primaryBU: Artificial_Intelligence
  sandbox_api:
    reservation: pgpu
  tower:
    timeout: 24000
