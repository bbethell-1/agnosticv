---
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Hands-On with OpenShift 4.9
# --- ELT: Hands-On with OpenShift 4.9
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Satellite Variables
# -------------------------------------------------------------------

satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: ocp-on-rhel
set_repositories_satellite_activationkey: ocp-on-rhel
satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_hostname: labsat-ha.opentlc.com
set_repositories_satellite_ha: true
use_content_view: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.9"
ocp4_installer_root_url: "http://mirror.openshift.com/pub/openshift-v4/clients"

# -------------------------------------------------------------------
# VM configuration (1 Node Cluster of m5.4xlarge)
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD
master_instance_type_family: m5
master_instance_type_size: 4xlarge
master_instance_count: 1
worker_instance_count: 0

# ocp4_installer_use_dev_preview: true
# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_rhel_worker
- ocp4_workload_pipelines
- ocp4_workload_gitea_operator
- ocp4_workload_le_certificates

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# pipelines
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_channel: stable


# Gitea Operator
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.15.10
ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: gitea-user
ocp4_workload_gitea_migrate_repositories: true
ocp4_workload_gitea_repositories_list:
- repo: https://github.com/redhat-gpte/pipelines-vote-api.git
  name: pipelines-vote-api
  private: false
- repo: https://github.com/redhat-gpte/pipelines-vote-ui.git
  name: pipelines-vote-ui
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 10
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: dev-rhel-worker
  agnosticd_git_repo: https://github.com/newgoliath/agnosticd.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: dev-rhel-worker
    scm_url: https://github.com/newgoliath/agnosticd.git
    scm_type: git
