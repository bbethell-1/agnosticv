---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
#ocp4_installer_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/candidate-4.9/openshift-install-linux.tar.gz
#ocp4_client_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/candidate-4.9/openshift-client-linux.tar.gz

# ocp4_installer_use_dev_preview: true
# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_rhel_worker
- ocp4_workload_pipelines

ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false

# pipelines
ocp4_workload_pipelines_channel: stable

satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: ocp-on-rhel
set_repositories_satellite_activationkey: ocp-on-rhel
satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_hostname: labsat-ha.opentlc.com
set_repositories_satellite_ha: true
use_content_view: true

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

  # deploy_with: babylon

  agnosticd_git_repo: https://github.com/newgoliath/agnosticd.git
  agnosticd_git_ref: dev-rhel-worker
  virtualenv: ansible2.9-python3.6-2021-11-30


  params_to_variables:
    nodecount: ''
    user: ''
    region: aws_region

__meta__:
  deployer:
    scm_ref: dev-rhel-worker
    scm_url: https://github.com/newgoliath/agnosticd.git
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-ocp-rhel
