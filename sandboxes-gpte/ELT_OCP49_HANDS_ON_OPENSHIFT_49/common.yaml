---
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Hands-On with OpenShift 4.9
# --- ELT: Hands-On with OpenShift 4.9
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.9"
ocp4_installer_root_url: "http://mirror.openshift.com/pub/openshift-v4/clients"

# ocp4_installer_use_dev_preview: true
# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_rhel_worker
- ocp4_workload_pipelines
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false

# pipelines
ocp4_workload_pipelines_channel: stable

satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: Red_Hat_GPTE_Labs
satellite_activationkey: ocp-on-rhel
set_repositories_satellite_activationkey: ocp-on-rhel
satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_hostname: labsat-ha.opentlc.com
set_repositories_satellite_ha: true
use_content_view: true

# -------------------------------------------------------------------
# VM configuration (1 Node Cluster of m5a.4xlarge)
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD
master_instance_type_family: m5a
master_instance_type_size: 4xlarge
master_instance_count: 1
worker_instance_count: 0

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false


# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 10
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
  secrets:
  - name: satellite-rhel81
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: satellite-ocp-rhel
    namespace: gpte
