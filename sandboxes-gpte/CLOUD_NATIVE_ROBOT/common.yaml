---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# Admin pw not printing so testing var 'true'
ocp4_workload_authentication_enable_user_info_messages: true

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
platform: RHPDS
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

#setting student user to true
install_student_user: true
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true
ocp4_cluster_show_access_user_info: true

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_machinesets
- ocp4_workload_openshift_data_foundation
- ocp4_workload_authentication
- ocp4_workload_pipelines
- ocp4_workload_openshift_ai
- ocp4_workload_openshift_gitops
- ocp4_workload_gitea_operator
- ocp4_workload_web_terminal
- ocp4_workload_le_certificates
- ocp4_workload_showroom

ocp4_workload_catalogsource_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_catalogsource_tag: v4.13_2023_11_20

ocp4_installer_version: 4.15.14
ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/multi/clients/ocp/4.15.14/amd64/openshift-install-linux.tar.gz
ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/multi/clients/ocp/4.15.14/amd64/openshift-client-linux.tar.gz
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
student_workloads: []

# ---------------------------------------------------------
# Authentication
# ---------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_add_default_users: false
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ''
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# user password
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) |
  int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -----------------------------------
# OpenShift Data Foundations Operator
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.15
ocp4_workload_openshift_data_foundation_catalogsource_setup: false
ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_ceph_storage_class_name: gp3-csi
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 500Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_operator_group_name: "rhods-ods-operator"
ocp4_workload_openshift_ai_operator_name: "rhods-operator"
ocp4_workload_openshift_ai_namespace: "redhat-ods-operator"
ocp4_workload_openshift_ai_channel: "stable"
ocp4_workload_openshift_ai_catalogsource_setup: "False"
ocp4_workload_openshift_ai_installPlanApproval: "Automatic"
# Set automatic InstallPlan approval. If set to false it is also suggested
# to set the starting_csv to pin a specific version
install_openshift_ai_operator_automatic_install_plan_approval: "false"
ocp4_workload_openshift_ai_source: "redhat-operators"
ocp4_workload_openshift_ai_sourceNamespace: "openshift-marketplace"
ocp4_workload_openshift_ai_csv_nameprefix: "rhods-operator"
ocp4_workload_openshift_ai_startingCSV: "rhods-operator.2.8.2"
ocp4_workload_openshift_ai_install_csv_ignore_error: "false"
ocp4_workload_openshift_ai_namespace_list:
- "{{ ocp4_workload_openshift_ai_namespace }}"
ocp4_workload_openshift_ai_applications_namespace: "redhat-ods-applications"
ocp4_workload_openshift_ai_is_workshop: "false"
ocp4_workload_openshift_ai_workshop_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_openshift_ai_workshop_username_base: "user"
ocp4_workload_openshift_ai_workshop_password: '{{ ocp4_workload_authentication_htpasswd_user_password }}'
ocp4_workload_openshift_ai_codeflare: "Removed"
ocp4_workload_openshift_ai_dashboard: "Managed"
ocp4_workload_openshift_ai_datasciencepipelines: "Managed"
ocp4_workload_openshift_ai_kserve: "Removed"
ocp4_workload_openshift_ai_modelmeshserving: "Managed"
ocp4_workload_openshift_ai_ray: "Removed"
ocp4_workload_openshift_ai_trustyai: "Removed"
ocp4_workload_openshift_ai_workbenches: "Managed"

# -------------------------------------------------------------------
# OpenShift Pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.14
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.14.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.12
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_starting_csv: openshift-gitops-operator.v1.12.2
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_gitops_argo_cr_additional_values: |
  resourceTrackingMethod: annotation
# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.22
ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

#ocp4_workload_gitea_operator_user_number: 1
#ocp4_workload_gitea_operator_generate_user_format: lab-user
#ocp4_workload_gitea_operator_user_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: '{{ ocp4_workload_authentication_htpasswd_user_count | int }}'
ocp4_workload_gitea_operator_generate_user_format: '{{ ocp4_workload_authentication_htpasswd_user_base }}%d'
ocp4_workload_gitea_operator_user_password: '{{ ocp4_workload_authentication_htpasswd_user_password }}'
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/cloud-native-robotz-hackathon/starter-app-python.git
  name: starter-app-python
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_use_catalog_snapshot: true
ocp4_workload_web_terminal_starting_csv: web-terminal.v1.10.0
ocp4_workload_web_terminal_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_web_terminal_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"


# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_git_repo: https://github.com/cloud-native-robotz-hackathon/lab-guide.git
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------

ocp4_workload_machinesets_wait_for_nodes: false

# Add a MachineSet for AWS Bare arm instances
ocp4_workload_machinesets_machineset_groups:
- name: arm
  role: arm
  instance_type: m7g.2xlarge
  #  openshift-install coreos print-stream-json | jq  -r -c '.architectures | keys '
  # ["aarch64","ppc64le","s390x","x86_64"]
  instance_ami_architecure: aarch64
  autoscale: false
  total_replicas: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
  total_replicas_min: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
  total_replicas_max: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
  # machineConfigPool:
  #   setup: true
  #   maxPodsPerNode: 250
  taints:
  - key: "kubernetes.io/arch"
    value: "arm"
    effect: NoSchedule
  # - name: worker-gpu
  #   autoscale: true
  #   total_replicas: 2
  #   total_replicas_min: 2
  #   total_replicas_max: 3
  #   role: worker-gpu
  #   taints:
  #     - key: nvidia.com/gpu
  #       value: true
  #       effect: NoSchedule
  #   instance_type: "g5.2xlarge"
  # Enable workload as well: ocp4_workload_nvidia_gpu_setup
      # nvidia_gpu_operator_namespace: nvidia-gpu-operator
      # nvidia_gpu_operator_channel: v23.6
      # nvidia_gpu_operator_automatic_install_plan_approval: true
      # nvidia_gpu_operator_starting_csv: gpu-operator-certified.v23.6.0
      # nvidia_gpu_operator_wait_for_deploy: true
      # nvidia_gpu_operator_use_catalog_snapshot: false
      # nvidia_gpu_operator_catalogsource_name: ""
      # nvidia_gpu_operator_catalog_snapshot_image: ""
      # nvidia_gpu_operator_catalog_snapshot_image_tag: ""

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type_family: m5d
master_instance_type_size: >-
  {{ 'xlarge' if worker_instance_count|int < 5
  else '2xlarge' if worker_instance_count|int < 10
  else '4xlarge' if worker_instance_count|int < 20
  else '8xlarge'
  }}
master_instance_type: '{{ master_instance_type_family }}.{{ master_instance_type_size
  }}'
master_instance_count: 3
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max
  }}"
worker_storage_type: gp2
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

ssh_authorized_keys:
# Instructor Key
- key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAOfl+764UFbDkkxpsQYjET7ZAWoVApSf4I64L1KImoc rbohne@redhat.com


# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  asset_uuid: 39f35fb6-5587-4798-a55c-f383c52bac52
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Cloud Native Robot Hackathon
    category: Workshops
    keywords:
    - ai
    - robot
    - multi-atch
    - openshift
    labels:
      #OpenShift_Version: "4.8"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: Hybrid_Cloud_Experience
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 3
        minimum: 3
        maximum: 100
      validation: >-
        num_users == 3 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than three requires a valid SalesForceID.')
    - name: gitops_repo_tag
      description: >-
        Tag for OpenTour GitOps Repo https://github.com/sa-mw-dach/opentour-2022-gitops-infra.git
      formLabel: OpenTour GitOps Repo Tag
      required: true
      openAPIV3Schema:
        type: string
        default: main
    - name: user_password
      description: >-
        Default user password for OpenShift, Gitea & co
      formLabel: User Password
      required: true
      openAPIV3Schema:
        type: string
        default: openshift
  secrets:
  - name: gpte
    namespace: gpte
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel8-latest-ha
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
