      - name: Robert Bohne
        email: rbohne@redhat.com
    instructions:
      - name: Robert Bohne
        email: rbohne@redhat.com
      - name: Daniel Brintzinger
        email: dbrintzinger@redhat.com

  anarchy:
    namespace: babylon-anarchy-2
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Cloud Native Robot Hackathon
    icon:
