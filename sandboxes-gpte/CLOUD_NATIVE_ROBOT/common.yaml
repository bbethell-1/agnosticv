    multiuser: true
    parameters:
      - name: num_users
        description: >-
          Number of teams to provision within the cluster.
        formLabel: Amount of Teams
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 50
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
