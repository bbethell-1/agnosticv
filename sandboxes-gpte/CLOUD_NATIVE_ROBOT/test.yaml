---
purpose: TEST

# Don't update bastion packages, save some time...
update_packages: true


ocp4_workload_catalogsource_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_catalogsource_tag: v4.20_2026_01_19
ocp4_workload_catalogsource_name: "redhat-operators-for-robots"

ocp4_installer_version: 4.20.8

ocp4_workload_openshift_data_foundation_channel: stable-4.20
ocp4_workload_pipelines_channel: pipelines-1.20
ocp4_workload_openshift_gitops_channel: gitops-1.19
nvidia_gpu_operator_channel: v25.10


ocp4_workload_cloud_native_robot_hubcontroller_username: "admin"
ocp4_workload_cloud_native_robot_hubcontroller_password: "oongooDoo1Eibi4Thi3ipech5JaeTaeW"

ocp4_workload_cloud_native_robot_hubcontroller_ru_enabled: "{{ update_auto_registration_repo }}"
ocp4_workload_cloud_native_robot_hubcontroller_ru_repo_url: "{{ update_auto_registration_repo_url }}"
ocp4_workload_cloud_native_robot_hubcontroller_ru_repo_token: "{{ update_auto_registration_repo_token }}"

ocp4_workload_gitea_operator_gitea_image_tag: 1.25

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-cloud-native-robot
  deployer:
    # scm_ref: cloud-native-robot-2.4.0
    git_tag_prefix: cloud-native-robot

  catalog:
    parameters:
      - name: gitops_repo_tag
        description: >-
          Decide which tag/version you want to use for the deployment. Affected repositories:
             * https://github.com/cloud-native-robotz-hackathon/infrastructure
             * https://github.com/cloud-native-robotz-hackathon/lab-guide
        formLabel: Cloud Native Robot Hackathon Version/Tag
        required: true
        openAPIV3Schema:
          type: string
          default: v3
      - name: gpu_node_count
        description: >-
          Number of GPU Worker nodes (aws instance type g5.xlarge )
          There is only one GPU per worker available.
        formLabel: GPU Worker Nodes (one GPU per Worker!)
        openAPIV3Schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 3
      - name: update_auto_registration_repo
        description: Update Auto Registration Repo?
        formGroup: Robot auto registration
        formLabel: Update Auto Registration Repo?
        openAPIV3Schema:
          type: boolean
          default: false
      - name: update_auto_registration_repo_url
        description: Git Repo to update Hub Controller URL
        formGroup: Robot auto registration
        formLabel: Git Repo
        openAPIV3Schema:
          type: string
          default: ""
      - name: update_auto_registration_repo_token
        description: Git Repo Token to update Hub Controller URL
        formGroup: Robot auto registration
        formLabel: Git Repo Token (RW
        openAPIV3Schema:
          type: string
          default: ""
