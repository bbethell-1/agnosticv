---
purpose: TEST

# Don't update bastion packages, save some time...
update_packages: true


# Add a MachineSet for AWS Bare arm instances
ocp4_workload_machinesets_machineset_groups:
  - name: arm
    role: arm
    instance_type: m7g.2xlarge
    root_volume_size: 250
  #  openshift-install coreos print-stream-json | jq  -r -c '.architectures | keys '
  # ["aarch64","ppc64le","s390x","x86_64"]
    aws_instance_ami_architecture: aarch64
    autoscale: false
    total_replicas: "{{ [(num_users | int / 40) | round(0, 'ceil') | int, 1] | max }}"
    total_replicas_min: "{{ [(num_users | int / 40) | round(0, 'ceil') | int, 1] | max }}"
    total_replicas_max: "{{ [(num_users | int / 40) | round(0, 'ceil') | int, 3] | max }}"
  # machineConfigPool:
  #   setup: true
  #   maxPodsPerNode: 250
    taints:
      - key: "kubernetes.io/arch"
        value: "arm"
        effect: NoSchedule

worker_instance_count: "{{ [(num_users | int / 5 ) | round(0, 'ceil') | int, 3] | max  }}"

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-cloud-native-robot
  deployer:
    # scm_ref: cloud-native-robot-2.4.0
    git_tag_prefix: cloud-native-robot

  catalog:
    parameters:
      - name: gitops_repo_tag
        description: >-
          Decide which tag/version you want to use for the deployment. Affected repositories:
             * https://github.com/cloud-native-robotz-hackathon/infrastructure
             * https://github.com/cloud-native-robotz-hackathon/lab-guide
        formLabel: Cloud Native Robot Hackathon Version/Tag
        required: true
        openAPIV3Schema:
          type: string
          default: open-tech-quest
