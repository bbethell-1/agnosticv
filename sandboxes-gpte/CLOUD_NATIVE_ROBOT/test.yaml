---
purpose: TEST

# Don't update bastion packages, save some time...
update_packages: true

infra_workloads:
  - ocp4_workload_machinesets
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_authentication
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_web_terminal
  - ocp4_workload_service_interconnect_operator_only
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_openshift_ai
  - ocp4_workload_disable_self_provisioner
  - ocp4_workload_expose_registry
  - ocp4_workload_devspaces
  - ocp4_workload_cert_manager
  - ocp4_workload_cloud_native_robot
  - ocp4_workload_showroom


# -------------------------------------------------------------------
# Workload: ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_install_eventing: false
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalogsource_name: "{{ ocp4_workload_catalogsource_name }}"
ocp4_workload_serverless_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_serverless_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload ocp4_workload_ossm - Service Mesh
# -------------------------------------------------------------------
ocp4_workload_ossm_use_catalog_snapshot: true
ocp4_workload_ossm_catalogsource_name: "{{ ocp4_workload_catalogsource_name }}"
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Elasticsearch
ocp4_workload_ossm_es: false

# Jaeger
ocp4_workload_ossm_jaeger: false

# Kiali
ocp4_workload_ossm_kiali: false

# Service Mesh
ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: ""

ocp4_workload_openshift_ai_kserve_config:
  managementState: "Managed"
  rawDeploymentServiceConfig: Headed

ocp4_workload_gitea_operator_admin_password: 'opent!c-mgr'
ocp4_workload_authentication_htpasswd_user_password: "{{ user_password | default('openshift') }}"
ocp4_workload_cloud_native_robot_user_password: "{{ ocp4_workload_authentication_htpasswd_user_password }}"

ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/cloud-native-robotz-hackathon/starter-app-python-test.git
    name: starter-app-python
    private: false
  - repo: https://github.com/cloud-native-robotz-hackathon/robot-gitops.git
    name: robot-gitops
    private: false
  - repo: https://github.com/cloud-native-robotz-hackathon/object-detection-notebooks-test.git
    name: object-detection-notebooks
    private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_limits_cpu: '4'
ocp4_workload_openshift_gitops_controller_limits_memory: '8Gi'
ocp4_workload_openshift_gitops_controller_app_sync: '1m'

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-cloud-native-robot
  deployer:
    scm_ref: cloud-native-robot-2.4.0
    # git_tag_prefix: cloud-native-robot

  catalog:
    parameters:
      - name: gitops_repo_tag
        description: >-
          Decide which tag/version you want to use for the deployment. Affected repositories:
             * https://github.com/cloud-native-robotz-hackathon/infrastructure
             * https://github.com/cloud-native-robotz-hackathon/lab-guide
        formLabel: Cloud Native Robot Hackathon Version/Tag
        required: true
        openAPIV3Schema:
          type: string
          default: development

      - name: num_users
        description: >-
          Number of teams to provision within the cluster.
        formLabel: Amount of Teams
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 12
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('Team count greater than three requires a valid SalesForceID.')

      - name: team_1_robot_name
        description: Robot of Team 1
        formGroup: Team-Robot Allocation
        formLabel: Team 1
        openAPIV3Schema:
          type: string
          default: gort
      - name: team_2_robot_name
        description: Robot of Team 2
        formGroup: Team-Robot Allocation
        formLabel: Team 2
        openAPIV3Schema:
          type: string
          default: t-1000
      - name: team_3_robot_name
        description: Robot of Team 3
        formGroup: Team-Robot Allocation
        formLabel: Team 3
        openAPIV3Schema:
          type: string
          default: marvin
      - name: team_4_robot_name
        description: Robot of Team 4
        formGroup: Team-Robot Allocation
        formLabel: Team 4
        openAPIV3Schema:
          type: string
          default: c3po
      - name: team_5_robot_name
        description: Robot of Team 5
        formGroup: Team-Robot Allocation
        formLabel: Team 5
        openAPIV3Schema:
          type: string
          default: r2d2
      - name: team_6_robot_name
        description: Robot of Team 6
        formGroup: Team-Robot Allocation
        formLabel: Team 6
        openAPIV3Schema:
          type: string
          default: marc13
      - name: team_7_robot_name
        description: Robot of Team 7
        formGroup: Team-Robot Allocation
        formLabel: Team 7
        openAPIV3Schema:
          type: string
          default: data
      - name: team_8_robot_name
        description: Robot of Team 8
        formGroup: Team-Robot Allocation
        formLabel: Team 8
        openAPIV3Schema:
          type: string
          default: terminator
      - name: team_9_robot_name
        description: Robot of Team 9
        formGroup: Team-Robot Allocation
        formLabel: Team 9
        openAPIV3Schema:
          type: string
          default: ultron

      - name: gpu_node_count
        description: >-
          Number of GPU Worker nodes (aws instance type g5.xlarge )
          There is only one GPU per worker available.
        formLabel: GPU Worker Nodes (one GPU per Worker!)
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 10
