---
#include /includes/ee-multicloud-dev.yaml
purpose: DEV

# Don't update bastion packages, save some time...
update_packages: true

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_machinesets
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_web_terminal
  - ocp4_workload_service_interconnect_operator_only
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_openshift_ai
  - ocp4_workload_disable_self_provisioner
  - ocp4_workload_expose_registry
  - ocp4_workload_devspaces
  - ocp4_workload_cert_manager
  - ocp4_workload_cloud_native_robot
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_use_catalog_source: true
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_starting_csv: ""

ocp4_workload_rhsso_authentication_admin_username: admin

ocp4_workload_rhsso_authentication_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_rhsso_authentication_user_name_base: "team-"
ocp4_workload_rhsso_authentication_user_password: "{{ user_password | default('openshift') }}"
ocp4_workload_rhsso_authentication_remove_kubeadmin: false

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-cloud-native-robot
  deployer:
    # scm_ref: cloud-native-robot-2.3.0
    # # scm_ref: cloud-native-robot-2.2.6
    # # git_tag_prefix: cloud-native-robot
    scm_url: https://github.com/cloud-native-robotz-hackathon/agnosticd.git
    scm_ref: development
