---
#include /includes/ee-multicloud-dev.yaml
purpose: DEV

# Don't update bastion packages, save some time...
update_packages: true

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-cloud-native-robot
  deployer:
    # scm_ref: cloud-native-robot-2.3.0
    # # scm_ref: cloud-native-robot-2.2.6
    # # git_tag_prefix: cloud-native-robot
    scm_url: https://github.com/cloud-native-robotz-hackathon/agnosticd.git
    scm_ref: development

  catalog:
    parameters:
      - name: gitops_repo_tag
        description: >-
          Decide which tag/version you want to use for the deployment. Affected repositories:
             * https://github.com/cloud-native-robotz-hackathon/infrastructure
             * https://github.com/cloud-native-robotz-hackathon/lab-guide
        formLabel: Cloud Native Robot Hackathon Version/Tag
        required: true
        openAPIV3Schema:
          type: string
          default: issue-184

      - name: num_users
        description: >-
          Number of teams to provision within the cluster.
        formLabel: Amount of Teams
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 12
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('Team count greater than three requires a valid SalesForceID.')

      - name: team_1_robot_name
        description: Robot of Team 1
        formGroup: Team-Robot Allocation
        formLabel: Team 1
        openAPIV3Schema:
          type: string
          default: gort
      - name: team_2_robot_name
        description: Robot of Team 2
        formGroup: Team-Robot Allocation
        formLabel: Team 2
        openAPIV3Schema:
          type: string
          default: t-1000
      - name: team_3_robot_name
        description: Robot of Team 3
        formGroup: Team-Robot Allocation
        formLabel: Team 3
        openAPIV3Schema:
          type: string
          default: marvin
      - name: team_4_robot_name
        description: Robot of Team 4
        formGroup: Team-Robot Allocation
        formLabel: Team 4
        openAPIV3Schema:
          type: string
          default: c3po
      - name: team_5_robot_name
        description: Robot of Team 5
        formGroup: Team-Robot Allocation
        formLabel: Team 5
        openAPIV3Schema:
          type: string
          default: r2d2
      - name: team_6_robot_name
        description: Robot of Team 6
        formGroup: Team-Robot Allocation
        formLabel: Team 6
        openAPIV3Schema:
          type: string
          default: marc13
      - name: team_7_robot_name
        description: Robot of Team 7
        formGroup: Team-Robot Allocation
        formLabel: Team 7
        openAPIV3Schema:
          type: string
          default: data
      - name: team_8_robot_name
        description: Robot of Team 8
        formGroup: Team-Robot Allocation
        formLabel: Team 8
        openAPIV3Schema:
          type: string
          default: terminator
      - name: team_9_robot_name
        description: Robot of Team 9
        formGroup: Team-Robot Allocation
        formLabel: Team 9
        openAPIV3Schema:
          type: string
          default: ultron

      - name: gitops_repo_tag
        description: >-
          Decide which tag/version you want to use for the deployment. Affected repositories:
             * https://github.com/cloud-native-robotz-hackathon/infrastructure
             * https://github.com/cloud-native-robotz-hackathon/lab-guide
        formLabel: Cloud Native Robot Hackathon Version/Tag
        required: true
        openAPIV3Schema:
          type: string
          default: development

      - name: gpu_node_count
        description: >-
          Number of GPU Worker nodes (aws instance type g5.xlarge )
          There is only one GPU per worker available.
        formLabel: GPU Worker Nodes (one GPU per Worker!)
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 10
