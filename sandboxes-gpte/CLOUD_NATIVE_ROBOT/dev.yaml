---
#include /includes/parameters/controlplane-count.yaml
#include /includes/ee-multicloud-dev.yaml

purpose: DEV

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# Don't update bastion packages, save some time...
update_packages: true

ocp4_workload_gitea_operator_gitea_image_tag: 1.22.0

infra_workloads:
- ocp4_workload_machinesets
- ocp4_workload_openshift_data_foundation
- ocp4_workload_authentication
- ocp4_workload_pipelines
- ocp4_workload_openshift_ai
- ocp4_workload_openshift_gitops
- ocp4_workload_gitea_operator
- ocp4_workload_web_terminal
- ocp4_workload_devspaces
- ocp4_workload_le_certificates
- ocp4_workload_showroom


# -------------------------------------------------------------------
# ocp4_workload_devspaces
# -------------------------------------------------------------------
ocp4_workload_devspaces_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_devspaces_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_devspaces_devworkspace: false
ocp4_workload_devspaces_user_base: "user"
ocp4_workload_devspaces_user_count: "{{ (num_users | default('1')) | int }}"

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------

__meta__:
  deployer:
    scm_url: https://github.com/cloud-native-robotz-hackathon/agnosticd.git
    scm_ref: development
