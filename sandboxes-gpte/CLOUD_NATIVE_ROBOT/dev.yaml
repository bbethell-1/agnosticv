---
#include /includes/ee-multicloud-dev.yaml
purpose: DEV

# Don't update bastion packages, save some time...
update_packages: true

ocp4_workload_catalogsource_tag: v4.19_2025_07_01
ocp4_installer_version: 4.19.1
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_openshift_gitops_channel: gitops-1.16
nvidia_gpu_operator_channel: v25.3

worker_instance_type: m5.8xlarge
master_instance_type_size: >-
  {{ '2xlarge' if worker_instance_count|int < 10
  else '4xlarge' if worker_instance_count|int < 20
  else '8xlarge'
  }}
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 5
  else 'gp2' }}

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
      - rhpds-devs-cloud-native-robot
  deployer:
    scm_ref: cloud-native-robot-2.2.8
    # scm_ref: cloud-native-robot-2.2.6
    # git_tag_prefix: cloud-native-robot
    # scm_url: https://github.com/cloud-native-robotz-hackathon/agnosticd.git
    # scm_ref: development

  catalog:
    parameters:
      - name: gitops_repo_tag
        description: >-
          Decide which tag/version you want to use for the deployment. Affected repositories:
             * https://github.com/cloud-native-robotz-hackathon/infrastructure
             * https://github.com/cloud-native-robotz-hackathon/lab-guide
        formLabel: Cloud Native Robot Hackathon Version/Tag
        required: true
        openAPIV3Schema:
          type: string
          default: issue-184
