purpose: DEV
update_packages: true
ocp4_workload_catalogsource_tag: v4.19_2025_07_01
ocp4_installer_version: 4.19.1
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_openshift_gitops_channel: gitops-1.16
nvidia_gpu_operator_channel: v25.3
__meta__:
  access_control:
    allow_groups:
    - rhpds-devs-cloud-native-robot
  deployer:
    scm_ref: cloud-native-robot-2.2.8
  catalog:
    parameters:
    - name: gitops_repo_tag
      description: "Decide which tag/version you want to use for the deployment. Affected repositories:\n   * https://github.com/cloud-native-robotz-hackathon/infrastructure\n   * https://github.com/cloud-native-robotz-hackathon/lab-guide"
      formLabel: Cloud Native Robot Hackathon Version/Tag
      required: true
      openAPIV3Schema:
        type: string
        default: issue-184
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: cloud-native-robot-2.2.8
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
