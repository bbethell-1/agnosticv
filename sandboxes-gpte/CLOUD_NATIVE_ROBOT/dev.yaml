---
#include /includes/parameters/controlplane-count.yaml
#include /includes/ee-multicloud-dev.yaml

purpose: DEV

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4


# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_machinesets
- ocp4_workload_authentication
# - ocp4_workload_servicemesh
# - ocp4_workload_pipelines
# - ocp4_workload_openshift_gitops
# - ocp4_workload_gitea_operator
- ocp4_workload_web_terminal
- ocp4_workload_le_certificates
# - ocp4_workload_opentour_dach_2022
# - bookbag

ocp4_installer_version: 4.15.14
ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/multi/clients/ocp/4.15.14/amd64/openshift-install-linux.tar.gz
ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/multi/clients/ocp/4.15.14/amd64/openshift-client-linux.tar.gz
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
# Add a MachineSet for AWS Bare arm instances
ocp4_workload_machinesets_machineset_groups:
- name: arm
  role: arm
  instance_type: m7g.2xlarge
  autoscale: false
  total_replicas: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
  total_replicas_min: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
  total_replicas_max: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
  # machineConfigPool:
  #   setup: true
  #   maxPodsPerNode: 250
  taints:
  - key: "kubernetes.io/arch"
    value: "arm"
    effect: NoSchedule


# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------

__meta__:
  deployer:
    scm_url: https://github.com/cloud-native-robotz-hackathon/agnosticd.git
    scm_ref: development
