---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_gitea_operator
- ocp4_workload_vote_app
- ocp4_workload_openshift_gitops_fix_argocd

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/juliaaano/vote-app-gitops.git
  name: vote-app-gitops
  private: false

# -------------------------------------------------------------------
# ocp4_workload_vote_app
# -------------------------------------------------------------------
ocp4_workload_vote_app_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_vote_app_user_prefix: "{{ ocp4_workload_user_base }}"

ocp4_workload_vote_app_gitea_user_password: "{{ ocp4_workload_gitea_operator_user_password }}"

ocp4_workload_vote_app_repo: vote-app-gitops
ocp4_workload_vote_app_revision: helm

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/juliaaano/agnosticd.git
    scm_ref: jmohr-voteapp
