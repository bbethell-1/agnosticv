---
#include /includes/parameters/event-lifetime-runtime.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_gitea_operator
- ocp4_workload_voteapp
- ocp4_workload_gitops_bootstrap
- ocp4_workload_openshift_gitops_fix_argocd

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_voteapp_my_var: myvar

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/blues-man/vote-app-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ ocp4_workload_user_count }}"
    prefix: "{{ ocp4_workload_user_base }}"
  argocd:
    git:
      url: http://gitea.gitea.svc:3000
      repo: vote-app-gitops
      revision: v1.0.0
      path: helm/argocd
    values:
      namespacePrefix: argocd-
      repos:
      - type: git
        name: vote-app-gitops
        password: "{{ common_user_password }}"
      - type: git
        name: pipelines-vote-api
        password: "{{ common_user_password }}"
  tekton:
    git:
      url: http://gitea.gitea.svc:3000
      repo: vote-app-gitops
      revision: v1.0.0
      path: helm/tekton
    values:
      namespacePrefix: tekton-
      app:
        namespacePrefix: vote-app-
        repo:
          source:
            name: pipelines-vote-api
            revision: master
            password: "{{ common_user_password }}"
  usertool:
    labAdminPassword: "{{ common_admin_password }}"
    labUserPassword: openshift
    labAccessToken: openshift
# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.2xlarge
master_instance_count: 3
master_storage_type: io1
master_storage_size: 250
worker_instance_type: m6a.8xlarge
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: ocp4-vote-app-1.0
  catalog:
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 40
        minimum: 2
        maximum: 50
