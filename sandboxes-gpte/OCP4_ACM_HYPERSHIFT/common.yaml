---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/aws-6regions.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# --- System: RHPDS
# --- Catalog: OpenShift Demos
# --- Catalog Item: Advanced Cluster Management with HyperShift
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Save ssh information to agnosticd_user_info
# -------------------------------------------------------------------
ocp4_cluster_show_access_user_info: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: m6a.2xlarge
master_instance_count: 3
master_storage_type: gp3
master_storage_size: 250
worker_instance_type: m6a.2xlarge
worker_instance_count: 3
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.13"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: ""
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Customizations to packages and virtualenvs to enable ovirt.ovirt
# -------------------------------------------------------------------
# Custom collections for this environment
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 6.1.0
  - name: community.general
    version: 7.1.0
  - name: ansible.posix
    version: 1.5.4
  - name: community.crypto
    version: 2.14.0

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_openshift_gitops
- ocp4_workload_rhacm
- ocp4_workload_rhacm_hypershift

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

# Remove Workloads when deleting the cluster
remove_workloads_bastion: []

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: 2
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.9

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.8

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_hypershift
# -------------------------------------------------------------------
# Clusters to deploy
ocp4_workload_rhacm_hypershift_deploy_clusters:
- name: development
  infra_id: "dev-{{ guid }}"
  ocp_release: 4.13.4
  region: us-west-2
  zones:
  - us-west-2a
  control_plane_availability: SingleReplica
  infra_availability: SingleReplica
  etcd_storage_class: gp3-csi
  nodepool_replicas: 1
  worker_instance_type: m5a.2xlarge
  root_volume_type: gp3
  root_volume_size: 120
  labels:
    rhdp_type: sandbox
    rhdp_usage: development
    guid: "{{ guid }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      #OpenShift_Version: '4.12'
    display_name: Red Hat Advanced Cluster Management with HyperShift
    category: Demos
    multiuser: false
  runtime:
    default: 8h
    maximum: 48h
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: output-dir-s3
