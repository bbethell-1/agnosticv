---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------

purpose: development

ocp4_installer_version: "4.12.14"
ocp4_workload_rhacm_hypershift_deploy_clusters:
- name: development
  infra_id: "dev-{{ guid }}"
  ocp_release: 4.12.14
  region: us-west-2
  zones:
  - us-west-2a
  control_plane_availability: SingleReplica
  infra_availability: SingleReplica
  etcd_storage_class: gp3-csi
  nodepool_replicas: 1
  worker_instance_type: m5a.2xlarge
  root_volume_type: gp3
  root_volume_size: 120
  labels:
    rhdp_type: sandbox
    rhdp_usage: development
    guid: "{{ guid }}"

ocp4_workload_rhacm_hypershift_hcp_operator_patch: true
ocp4_workload_rhacm_hypershift_hcp_registry: registry-proxy.engineering.redhat.com/rh-osbs
ocp4_workload_rhacm_hypershift_hcp_registry_image_tag: "0421"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
