---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 TL500 Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_tl500

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------
master_instance_type: m5a.xlarge
master_instance_count: 3
worker_instance_type: m5a.2xlarge
worker_instance_count: "{{ [(num_users | int / 12) | round(0, 'ceil') | int, 2] | max }}"
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: learner
# We dont need users here since we install IPA
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('5') }}"
ocp4_workload_authentication_remove_kubeadmin: true
install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: DevOps Culture and Practice Enablement
    category: Workshops
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp410
    - devops
    labels:
      #OpenShift_Version: "4.10"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: PFE
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 100
      validation: >-
        user_count == 1 ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
