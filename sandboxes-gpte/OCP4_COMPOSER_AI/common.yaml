#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-2.yaml


#include /includes/secrets/zerossl.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Composer AI
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.4xlarge
master_instance_count: 1
worker_instance_type: m6a.4xlarge
worker_instance_count: 2
bastion_instance_type: t2.small
bastion_instance_image: RHEL93GOLD-latest

gpu_instance_type: g5.2xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.16.19"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_machinesets
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_openshift_gitops
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.16_2024_11_04

# -------------------------------------------------------------------
# Common Admin Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.14
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: false

ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu
  role: worker-gpu
  instance_type: "{{ gpu_instance_type }}"
  autoscale: true
  total_replicas: 1
  total_replicas_min: 1
  total_replicas_max: 2
  taints:
  - key: nvidia.com/gpu
    value: true
    effect: NoSchedule

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.14

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_kustomize_plugin: true
# ocp4_workload_openshift_gitops_kustomize_plugin_image: quay.io/devfile/universal-developer-image:ubi8-latest
ocp4_workload_openshift_gitops_kustomize_plugin_env:
- name: TARGET_REVISION
  value: v0.2.3

ocp4_workload_openshift_gitops_resourceTrackingMethod: annotation

ocp4_workload_openshift_gitops_resource_customizations: |
  datasciencecluster.opendatahub.io/DataScienceCluster:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          msg = ""
          componentsDegraded = 0
          available = false
          progressing = false
          degraded = false
          for i, condition in pairs(obj.status.conditions) do
            if condition.type == "Available" and condition.status == "True" then
              available = true
            elseif condition.type == "Progressing" then
              if condition.status == "True" then
                progressing = true
                msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. " | " .. condition.reason .. " | " .. condition.message .. "\n"
              end
            elseif condition.type == "Degraded" then
              if condition.status == "True" then
                degraded = true
                msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. " | " .. condition.reason .. " | " .. condition.message .. "\n"
              end
            elseif condition.status == "False" then
              componentsDegraded = componentsDegraded + 1
              msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. " | " .. condition.reason .. " | " .. condition.message .. "\n"
            end
          end
          if available == true and componentsDegraded == 0 then
            health_status.status = "Healthy"
          elseif progressing == true then
            health_status.status = "Progressing"
          elseif degraded == true or componentsDegraded > 0 then
            health_status.status = "Degraded"
          else
            health_status.status = "Degraded"
          end
          health_status.message = msg
        else
          health_status.status = "Progressing"
          health_status.message = "DataScienceCluster is creating..."
        end
      else
        health_status.status = "Progressing"
        health_status.message = "DataScienceCluster is creating..."
      end
      return health_status
  datasciencepipelinesapplications.opendatahub.io/DataSciencePipelinesApplication:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          msg = ""
          progressing = false
          degraded = false
          for i, condition in pairs(obj.status.conditions) do
            if condition.status == "False" then
              progressing = true
              msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. " | " .. condition.reason .. " | " .. condition.message .. "\n"
            end
          end
          if progressing == false and degraded == false then
            health_status.status = "Healthy"
          elseif progressing == true then
            health_status.status = "Progressing"
          elseif degraded == false then
            -- there is no condition that can help to distinguish between a degraded and progressing object
            -- for now, we will just always keep the object as progressing and never set it to degraded
            health_status.status = "Degraded"
          end
          health_status.message = msg
        else
          health_status.status = "Progressing"
          health_status.message = "DataSciencePipelineApplication is creating..."
        end
      else
        health_status.status = "Progressing"
        health_status.message = "DataSciencePipelineApplication is creating..."
      end
      return health_status
  serving.kserve.io/InferenceService:
    health.lua: |
      local health_status = {}
      health_status.status = "Progressing"
      health_status.message = "Waiting for InferenceService to report status..."
      if obj.status ~= nil then
        local progressing = false
        local degraded = false
        local status_false = 0
        local status_unknown = 0
        local msg = ""
        if obj.status.modelStatus ~= nil then
          if obj.status.modelStatus.transitionStatus ~= "UpToDate" then
            if obj.status.modelStatus.transitionStatus == "InProgress" then
              progressing = true
            else
              degraded = true
            end
            msg = msg .. "0: transitionStatus | " .. obj.status.modelStatus.transitionStatus .. "\n"
          end
        end
        if obj.status.conditions ~= nil then
          for i, condition in pairs(obj.status.conditions) do
            if condition.status == "Unknown" then
              status_unknown = status_unknown + 1
            elseif condition.status == "False" then
              status_false = status_false + 1
            end
            if condition.status ~= "True" then
              msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status
              if condition.reason ~= nil and condition.reason ~= "" then
                msg = msg .. " | " .. condition.reason
              end
              if condition.message ~= nil and condition.message ~= "" then
                msg = msg .. " | " .. condition.message
              end
              msg = msg .. "\n"
            end
          end
          if progressing == false and degraded == false and status_unknown == 0 and status_false == 0 then
            health_status.status = "Healthy"
            msg = "InferenceService is healthy."
          elseif degraded == false and status_unknown > 0 then
            health_status.status = "Progressing"
          else
            health_status.status = "Degraded"
          end
          health_status.message = msg
        end
      end
      return health_status
  kubeflow.org/Notebook:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          msg = ""
          progressing = false
          degraded = false
          for i, condition in pairs(obj.status.conditions) do
            if condition.status == "False" then
              progressing = true
              msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. " | " .. condition.reason .. " | " .. condition.message .. "\n"
            end
          end
          if progressing == false and degraded == false then
            health_status.status = "Healthy"
          elseif progressing == true then
            health_status.status = "Progressing"
          elseif degraded == false then
            -- there is no condition that can help to distinguish between a degraded and progressing object
            -- for now, we will just always keep the object as progressing and never set it to degraded
            health_status.status = "Degraded"
          end
          health_status.message = msg
        else
          health_status.status = "Progressing"
          health_status.message = "Notebook is creating..."
        end
      else
        health_status.status = "Progressing"
        health_status.message = "Notebook is creating..."
      end
      return health_status

