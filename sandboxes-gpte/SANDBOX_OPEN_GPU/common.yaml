# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: sandbox
agnosticd_open_environment: True
sandbox_user_info_messages_enable: true

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 12584b1d-4610-4e87-b490-5733757201b7
  owners:
    maintainer:
      - name: Patrick Rutledge
        email: prutledge@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  deployer:
    actions:
      stop:
        disable: true
      start:
        disable: true
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
    reservation: pgpu
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment (Extra GPU Quota)
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
