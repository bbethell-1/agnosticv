ocp4_workload_openshift_gitops_resource_customizations: "operators.coreos.com/Subscription:\n  health.lua: |\n    health_status = {}\n    if obj.status ~= nil then\n      if obj.status.conditions ~= nil then\n        numDegraded = 0\n        numPending = 0\n        msg = \"\"\n        for i, condition in pairs(obj.status.conditions) do\n          msg = msg .. i .. \": \" .. condition.type .. \" | \" .. condition.status .. \"\\n\"\n          if condition.type == \"InstallPlanPending\" and condition.status == \"True\" then\n            numPending = numPending + 1\n          elseif (condition.type == \"InstallPlanMissing\" and condition.reason ~= \"ReferencedInstallPlanNotFound\") then\n            numDegraded = numDegraded + 1\n          elseif (condition.type == \"CatalogSourcesUnhealthy\" or condition.type == \"InstallPlanFailed\") and condition.status == \"True\" then\n            numDegraded = numDegraded + 1\n          end\n        end\n        if numDegraded == 0 and numPending == 0\
  \ then\n          health_status.status = \"Healthy\"\n          health_status.message = msg\n          return health_status\n        elseif numPending > 0 and numDegraded == 0 then\n          health_status.status = \"Progressing\"\n          health_status.message = \"An install plan for a subscription is pending installation\"\n          return health_status\n        else\n          health_status.status = \"Degraded\"\n          health_status.message = msg\n          return health_status\n        end\n      end\n    end\n    health_status.status = \"Progressing\"\n    health_status.message = \"An install plan for a subscription is pending installation\"\n    return health_status\n"
ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
