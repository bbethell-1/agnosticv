# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: Workshop with RHODS on OCP on AWS
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL96GOLD-latest

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPPublic
        description: "HTTP public for Let's Encrypt verification"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPSPublic
        description: "HTTPS public for VSCode Server"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.21"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m6a.2xlarge
worker_instance_count: 2
worker_instance_type: m6a.4xlarge

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# ------------------------------------------------------------------
# Show kubeadmin password
ocp4_cluster_show_access_user_info: true
install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: community.okd
      version: 2.3.0

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:12] }}"
common_user_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_machinesets
  - ocp4_workload_authentication           # all segments
  - ocp4_workload_cert_manager          # all segments
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_authorino
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  # - ocp4_workload_gitea_operator
  - ocp4_workload_openshift_ai
  - ocp4_workload_web_terminal

# -------------------------------------------------------------------
# ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_wait_for_nodes: false
gpu_instance_type: g6.xlarge

ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    role: worker-gpu
    instance_type: "{{ gpu_instance_type }}"
    autoscale: false
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 2
    root_volume_size: "250"
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count | default(num_users) | default('5') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: openshift-nfd
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: ""
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""
nfd_operator_operand_image: "registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.18"

# ------------------------------------------------
# NVIDIA GPU Operator
# ------------------------------------------------
