---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# Switch to rosa-consolidated
env_type: rosa-consolidated
bastion_instance_image: RHEL92GOLD-latest

# ------------------------------------------------------
# Bastion user
# ------------------------------------------------------
bastion_user_name: rosa
bastion_user_enable_sudo: true
bastion_user_password: ""
bastion_user_password_length: 16

rosa_installer_version: latest
rosa_deploy: true
rosa_deploy_hcp: false
rosa_setup_cluster_admin: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-rosa-mobb.git
bookbag_git_version: main

# 2023-08-14 Mon 04:28:27 PM

__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0-alpha
      pull: missing
  secrets:
  - namespace: gpte
    name: ocp4-token
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Workshop - Pre-Deploy
