---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/access-restriction-devs-only.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: t3a.small
bastion_instance_image: RHEL92GOLD-latest

# ------------------------------------------------------
# Bastion user
# ------------------------------------------------------
bastion_user_name: rosa
bastion_user_enable_sudo: true
bastion_user_password: ""
bastion_user_password_length: 16

# ------------------------------------------------------
# ROSA properties
# ------------------------------------------------------
rosa_installer_version: latest
rosa_deploy: true
rosa_deploy_hcp: false
rosa_setup_cluster_admin: false

# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
# rosa_version: latest-upgrade

# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
# rosa_version_base: "openshift-v4.14"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
install_common: true
update_packages: true

common_extra_packages:
- java-11-openjdk-devel
- tzdata-java
- maven

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-rosa-mobb.git
bookbag_git_version: main

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 7de15f50-71bb-42f3-a96b-04899074948b
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0-alpha
      pull: missing
    actions:
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Modern App Dev Roadshow - Cloud Architect Track for ROSA
    category: Workshops
    keywords:
    - MAD
    - mad
    - roadshow
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '68'
    parameters:
    - name: rosa_token
      description: To obtain a current ROSA token, please visit https://console.redhat.com/openshift/token
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
  - namespace: gpte
    name: ocp4-token
  - name: satellite-rhel-8-and-9-latest-ha
    namespace: gpte
