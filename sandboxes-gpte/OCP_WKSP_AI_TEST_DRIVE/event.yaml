---
#include /includes/parameters/event-selector.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/access-restriction-RH1-devs.yaml
#include /includes/ansible_control_plane/event_controller.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# showroom defaults override for dev
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rh-aiservices-bu/rhoai-rh1-testdrive.git

ocp4_workload_showroom_content_git_repo_ref: dev
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true
# The Machineset groups to set up
ocp4_workload_machinesets_machineset_groups:
# Infranodes: Must be named "infra"
- name: infra
  # Should this MachineSet be autoscaled?
  autoscale: false
  # Initial number of Machines
  total_replicas: 3
  # Autoscaler settings - minimum and maximum number of Machines
  total_replicas_min: 1
  total_replicas_max: 1
  # The role of the nodes (node-role.kubernetes.io/infra: "")
  role: infra
  # Set up a custom MachineConfigPool to adjust number of pods
  # When machineConfigPool.setup is true then
  # use standard worker machineconfigs and add the custom kubelet config
  # This is useful for large (metal) nodes
  # Possible future enhancement: fully custom machine configs
  machineConfigPool:
    setup: false
    maxPodsPerNode: 250
  # Taints to add to the nodes. Workloads running on these nodes must have matching tolerations
  # Specify an empty array for untainted nodes.
  taints:
  - key: infra
    value: reserved
    effect: NoSchedule
  - key: infra
    value: reserved
    effect: NoExecute
  instance_type: "m5a.2xlarge"


# -------------------------------------------------------------------
# ocp4_workload_oai_test_drive defaults override for dev
# -------------------------------------------------------------------
ocp4_workload_oai_test_drive_branch: dev

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
  deployer:
    scm_ref: osp-wksp-ai-test-drive-0.1
  sandbox_api:
    reservation: rh1-gpu
