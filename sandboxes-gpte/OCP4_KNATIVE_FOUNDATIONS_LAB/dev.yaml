---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Override OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.6.18"

# -------------------------------------------------------------------
# Override Repo Version
# ------------------------------------------------------------------
osrelease: 4.6.0
repo_version: '4.6.0'

cloudformation_retries: 0

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 2

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: gpte
    parameters:
    - name: student_name
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhte-ocp4
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
