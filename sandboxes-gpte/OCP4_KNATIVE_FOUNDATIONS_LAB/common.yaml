---
# --- OpenShift 4 KNative Foundations Lab
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 KNative Foundations Lab
# --- ELT: KNative Foundations

# --- Platform
platform: labs

# --- These come from the account
# subdomain_base_suffix: .example.opentlc.com
# HostedZoneId: Z3IHLWJZOU9SRT

# --- Config
env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.4.29"
# Turn off cluster shutdown prep steps (no longer necessary with 4.4.8+)
ocp4_enable_cluster_shutdown: false

run_janitor: false

# --- Repos
osrelease: 4.4.0
repo_version: '4.4'
repo_method: file
# --- own_repo_path is inherited from default account settings based on osrelease

# --- Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# --- This is a Lab Environment -> Install FTL
install_ftl: false

# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab_user
# --- student_password not set -> generate random password
# student_password: rhte2019
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
install_idm: htpasswd
admin_user: admin
admin_password: r3dh4t1!
# --- Users are user1..200
user_count: 200
user_password: r3dh4t1!

# --- Default workloads are a YAML list
default_workloads: []

# --- Infra and Student Workloads are comma separated strings
infra_workloads: ""

# --- Run Student Workload to give all students cluster-admin permissions
student_workloads: ""

# --- AgnosticV Meta variables
agnosticv_meta:
  sandboxed: true
  params_to_variables:
    nodecount: ''
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
  virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
  # OpenShift Pull Secret
  - ocp4_token

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    display_name: OpenShift 4 Serverless Foundations Lab
