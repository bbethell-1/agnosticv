---
#include /includes/ee-multicloud-dev.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: test

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_le_certificates
- ocp4_workload_openshift_gitops
- ocp4_workload_namespace_generator
- ocp4_workload_gitops_workshop
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type: c6in.2xlarge
bastion_instance_image: RHEL92GOLD-latest

ocp4_workload_openshift_gitops_channel: "gitops-1.13"

# -------------------------------------------------------------------
# Showroom Variables
# -------------------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_git_repo: https://github.com/OpenShiftDemos/openshift-gitops-workshop
# Default but gets overridden in environments
ocp4_workload_showroom_content_git_repo_ref: showroom
ocp4_workload_showroom_terminal_image: quay.io/openshiftdemos/rollouts-terminal-tooling:summit
ocp4_workload_showroom_terminal_type: showroom

# -------------------------------------------------------------------
# Passthrough variables
# -------------------------------------------------------------------
ocp4_workload_showroom_passthrough_user_data: true
agnosticd_passthrough_user_data:
  gitops_revision: "{{ ocp4_workload_showroom_content_git_repo_ref }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    git_tag_prefix: ocp4-argo-wksp
