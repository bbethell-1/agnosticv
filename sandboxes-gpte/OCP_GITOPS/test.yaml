---
#include /includes/ee-multicloud-dev.yaml
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: test

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

ocp4_workload_openshift_gitops_channel: "gitops-1.18"

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type: c6in.2xlarge

# -------------------------------------------------------------------
# Showroom Variables
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: v1.1.1

# ------------------------------------------------------------------
# Git revision to use for the deploying the workshop GitOps
# Applications. This enables the apps to be pinned to a specific
# branch or revision enabling development and promotion without
# impacting higher environments.
#
# AgonsticD for this workshop uses this variable.
# ------------------------------------------------------------------
gitops_revision: "{{ ocp4_workload_showroom_content_git_repo_ref }}"

# -------------------------------------------------------------------
# Passthrough variables
# -------------------------------------------------------------------
ocp4_workload_showroom_passthrough_user_data: true
agnosticd_passthrough_user_data:
  gitops_revision: "{{ gitops_revision }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    git_tag_prefix: ocp4-argo-wksp
