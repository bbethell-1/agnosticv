---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/demosat-rhel-9.1-lab.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/access-restriction.yaml
#include /includes/ansible_control_plane/aap2-prod-us-east-2.aap.infra.demo.redhat.com.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: podman-container-wksp
software_to_deploy: none

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- bookbag

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/Bidyut-github/Podman_Rootless-Workshop-Bookbag.git
bookbag_git_version: main


# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
set_repositories_rhel9_lock_release: '9.1'
# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: student
key_name: ""
install_student_user: true
student_name: student
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el9:
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- openldap-clients
- podman
- tree

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3135dd90-3138-499a-96dd-53daed9a6697
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Podman Rootless Container
    category: Demos
    keywords:
    - rhel
    - rhel9
    - podman
    - container
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: true
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
