---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/showroom-shared-cluster1.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/secrets/demosat-rhel-9.1-lab.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: podman-container-wksp
software_to_deploy: none

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_showroom

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/redhat-gpte-devopsautomation/podman-rootless-workshop-bookbag.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_stacked_terminals_enable: true
ocp4_workload_showroom_stacked_terminals_display_name: "Terminals"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"


# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
set_repositories_rhel9_lock_release: '9.1'
# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user
key_name: ""
install_student_user: true
student_name: student
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el9:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - tree

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3135dd90-3138-499a-96dd-53daed9a6627
  owners:
    maintainer:
      - name: Prakhar Srivastava
        email: psrivastava@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Podman Rootless Container
    category: Demos
    keywords:
      - rhel
      - rhel9
      - podman
      - container
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
      secondaryBU: Application_Developer
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
