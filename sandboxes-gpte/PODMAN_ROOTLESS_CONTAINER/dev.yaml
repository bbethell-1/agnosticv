---
#include /includes/ee-multicloud-dev.yaml

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
rhel9_instance_image: RHEL92GOLD-latest
rhel9_instance_type: "t3a.large"
rootfs_size_rhel9: 200

instances:
- name: "node1"
  count: 1
  unique: true
  public_dns: true
  floating_ip: true
  image: "{{ rhel9_instance_image }}"
  flavor:
    ec2: "{{ rhel9_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_rhel9 }}"
  volumes:
  - device_name: "/dev/xvdb"
    size: "20"
    type: gp3
  security_groups:
  - BastionSG

- name: bastion
  count: 1
  unique: true
  public_dns: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ bastion_rootfs_size_node | default(default_rootfs_size_node) }}"
  security_groups:
  - BastionSG

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
