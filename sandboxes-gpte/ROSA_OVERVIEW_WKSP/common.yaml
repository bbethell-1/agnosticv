---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

agnosticd_open_environment: True
sandbox_user_info_messages_enable: False

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: t2.small
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
#rosa_installer_version: "1.2.37"
# rosa_installer_version: latest
rosa_deploy: true
rosa_deploy_hcp: true

# rosa_version: "4.15.22"
# rosa_version: latest
rosa_version_base: "openshift-v4.16"
aws_billing_account_id: "017310218799"
rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true
rosa_compute_machine_type: m6a.8xlarge
rosa_compute_replicas: "{{ [(num_users | int / 50) | round(0, 'ceil') | int, 2] | max }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication_rosa
- ocp4_workload_opentlc_production
- ocp4_workload_project_request_template
  #- ocp4_workload_pipelines
  #- ocp-workload-etherpad
  #- ocp4_workload_nexus_operator
  #- ocp-workload-gogs
  #- ocp-workload-gogs-load-repository
  #- ocp4-workload-homeroomlab-starter-guides
  #- ocp4-workload-osevg-workshop-tracker


# -------------------------------------------------------------------
# ocp4_workload_authentication_rosa
# -------------------------------------------------------------------
ocp4_workload_authentication_rosa_user_count: "{{ (num_users | default('2')) | int }}"
ocp4_workload_authentication_rosa_user_base: user
#ocp4_workload_authentication_rosa_user_password: openshift
#ocp4_workload_authentication_rosa_admin_password: openshift
ocp4_workload_authentication_rosa_token: "{{ rosa_token }}"
ocp4_workload_authentication_rosa_aws_access_key_id: "{{ lookup('env','AWS_ACCESS_KEY_ID') | default(aws_access_key_id, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_secret_access_key: "{{ lookup('env','AWS_SECRET_ACCESS_KEY') | default(aws_secret_access_key, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_region: "{{ lookup('env','AWS_DEFAULT_REGION') | default(aws_region, true) | mandatory }}"

# -------------------------------------------------------------------
# OpenTLC Production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false
ocp4_workload_opentlc_production_expose_registry_route: false
ocp4_workload_opentlc_production_set_build_defaults: true

# -------------------------------------------------------------------
# Student Workloads ([] means no student workloads)
# -------------------------------------------------------------------
studentvm_roles:
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4

student_workloads: []
ocp_username: admin

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: ce62266d-506f-4121-a922-f92b1e1f35a8
  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: hybrid_cloud_aws_azure-ansible2.9-python3.6-2022-07-06
  sandbox_api:
    actions:
      start:
        enable: false
      stop:
        enable: false
  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Overview Workshop
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Openshift
      Featured_Score: '68'
    parameters:
    - name: rosa_token
      description: To obtain a current ROSA token, please visit https://console.redhat.com/openshift/token
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 1
        maximum: 420
