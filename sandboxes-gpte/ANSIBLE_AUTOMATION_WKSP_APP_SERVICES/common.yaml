---
## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.

platform: RHPDS


# The name of the agnosticd config to deploy
env_type: ansible-middleware-workshop

# Writable working scratch directory
output_dir: /tmp/workdir

cloud_provider: ec2
aws_region: us-east-1

repo_version: 3.7.0-4

# What we use in this environment to get the packages we need
repo_method: satellite
satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_url: "{{ satellite_url }}"
satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_org: "{{ satellite_org }}"
set_repositories_satellite_ha: true

satellite_activationkey: rhel81

set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

### control-user role variables
control_user_name: devops
control_user_ssh_config: ./files/ssh_config.j2

### VScoder server variables

vscode_server_hostname: "bastion.{{ subdomain_base }}"
vscode_user_name: "{{ control_user_name }}"
vscode_user_password: changme

vscode_server_extension_urls: https://gpte-public.s3.amazonaws.com/vscode-plugins/auchenberg.vscode-browser-preview-0.7.2.vsix

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  babylon:
    # This file lives in ~/secrets on the deploy host
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Provider: Application_Services_BU
      Product: Management_Automation_Workshops_Demos
      Product_Family: Red_Hat_Application_Services
    multiuser: true
    parameters: []
    display_name: Ansible Automation workshop for App services
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: satellite-rhel81-ha
      namespace: gpte
