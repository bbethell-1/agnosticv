---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

sandbox_enable_ui: true

# -------------------------------------------------------------------
# Set OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/candidate-4.10/openshift-install-linux.tar.gz
ocp4_client_url: http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients/ocp/candidate-4.10/openshift-client-linux.tar.gz
ocp4_installer_use_dev_preview: true

# -------------------------------------------------------------------
# Number of VMs
# -------------------------------------------------------------------
master_instance_count: 3
worker_instance_count: 2

agnosticd_aws_capacity_reservation_single_zone: false
agnosticd_aws_capacity_reservation_distinct: false
agnosticd_aws_capacity_reservations:
  # Bastion can have its own AZ
  az1:
  - instance_type: "{{ bastion_instance_type }}"
    instance_count: 1
    instance_platform: "{{ bastion_instance_platform }}"

  # Masters: all in one
  masters:
  - instance_type: "{{ master_instance_type }}"
    instance_count: 3
    instance_platform: Linux/UNIX

  # Workers: all in one
  workers:
  - instance_type: "{{ worker_instance_type }}"
    instance_count: "{{ worker_instance_count }}"
    instance_platform: Linux/UNIX

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
