---
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-3regions.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog Item: AWS Gameday
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: rosa-consolidated
platform: rhpds

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
bastion_instance_type: t2.small
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
# version is 'default' if not set
# rosa_version: latest
rosa_version: "4.12.41"
rosa_setup_cluster_admin_login: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication_rosa

# -------------------------------------------------------------------
# ocp4_workload_authentication_rosa
# -------------------------------------------------------------------
ocp4_workload_authentication_rosa_user_count: 1
ocp4_workload_authentication_rosa_user_name: awsdeveloper
ocp4_workload_authentication_rosa_user_password: hellorosa

ocp4_workload_authentication_rosa_token: "{{ rosa_token }}"

ocp4_workload_authentication_rosa_aws_access_key_id: "{{ lookup('env','AWS_ACCESS_KEY_ID') | default(aws_access_key_id, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_secret_access_key: "{{ lookup('env','AWS_SECRET_ACCESS_KEY') | default(aws_secret_access_key, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_region: "{{ lookup('env','AWS_DEFAULT_REGION') | default(aws_region, true) | mandatory }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 29f4cc36-3097-4ebe-9789-a4936efd87d1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS GameDay Powered-by ROSA
    category: Workshops
    keywords: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: rosa_token
      description: The ROSA Token can be created or downloaded here https://console.redhat.com/openshift/token/rosa
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
