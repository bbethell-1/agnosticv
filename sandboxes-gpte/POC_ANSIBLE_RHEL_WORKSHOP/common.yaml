      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 19.2.2
    - name: infra.controller_configuration
      version: 2.2.5

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
