---
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml
#include /includes/parameters/automation-hub-enable.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-rhel-workshop

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el8:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - python3-pip
  - tree

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 19.2.2
    - name: infra.controller_configuration
      version: 2.2.5
    - name: containers.podman
      version: 1.10.1

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
# use_content_view: true
# set_repositories_rhel8_lock_release: '8'

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"
ansible_navigator_ee_images:
  - registry.redhat.io/ansible-automation-platform-20-early-access/ee-supported-rhel8:2.0.0
  - registry.redhat.io/ansible-automation-platform-20-early-access/ee-minimal-rhel8:2.0.0
  - registry.redhat.io/ansible-automation-platform-20-early-access/ee-29-rhel8:2.0.0

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Workshop - Ansible for Red Hat Enterprise Linux
    category: Workshops
    keywords:
      - rhel
      - ansible
      - workshop
      - aap2
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters: []
  secrets:
    - name: satellite-rhel8-latest-ha
      namespace: gpte
    - name: ansible-tower-advanced-2
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
