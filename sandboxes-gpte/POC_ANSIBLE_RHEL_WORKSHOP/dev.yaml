purpose: dev
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    actions:
      stop:
        disable: false
  # Auto stop instances using the sandbox API
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
