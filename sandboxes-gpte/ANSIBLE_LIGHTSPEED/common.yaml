---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
#env_type: rhel9-workshop
env_type: ansible-lightspeed
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: RHEL91GOLD-latest
node_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# BookBag VARS
# -------------------------------------------------------------------
#bookbag_git_repo: https://github.com/xtophd/RHEL9-Workshop-Bookbag.git
#bookbag_git_version: Summit_2022

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user
key_name: ""
student_name: student
install_student_user: true
admin_user: opentlc-mgr

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Lightspeed
    category: Demos
    keywords:
      - rhel9
      - leap
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
  secrets:
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
