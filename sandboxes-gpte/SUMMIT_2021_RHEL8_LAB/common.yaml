---

#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml

# Red Hat Summit 2021 - rhs2021-a0001
# The Definitive Red Hat Enterprise Linux 8 Hands-On Lab
# course_id: rhs2021-osp0004
# Owners: christoph doerbeck (cdoerbec@redhat.com), karl abbott (kabbott@redhat.com), matt st.onge (mstonge@redhat.com), gordon keegan (gkeegan@redhat.com), eddie chen (echen@redhat.com)
# CPBU: saorg

platform: RHPDS

# Config
env_type: ansible-multitier-rhel8

software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite
use_content_view: true
satellite_activationkey: agd-training-2

update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: "RHEL84GOLD"
node_instance_image: "RHEL84GOLD"

# -------------------------------------------------------------------
# BookBag VARS
# -------------------------------------------------------------------
bookbag_git_repo: https://github.com/xtophd/RHEL8-Workshop-Bookbag.git
bookbag_git_version: Summit_2021

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user

# Instance type
student_name: student
install_student_user: true

admin_user: opentlc-mgr

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: The Definitive RHEL8 Hands-On Lab
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
    parameters: []
  secrets:
    - name: bookbag-deployer-shared-na46
      namespace: gpte
    - name: gpte-no-repos
      namespace: gpte
    - name: labsat-secrets
      namespace: gpte
