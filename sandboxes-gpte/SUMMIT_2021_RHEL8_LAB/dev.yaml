---
purpose: development

platform: RHPDS

subdomain_base_suffix: .open.redhat.com
HostedZoneId: ZCRCH49OF7I9E
# Saving additional subdomain and its zone for emergency switch
#subdomain_base_suffix: .example.opentlc.com
#HostedZoneId: Z3IHLWJZOU9SRT

# AWS machine vars
workstation_instance_image: "RHEL84GOLD"
node_instance_image: "RHEL84GOLD"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  virtualenv: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
  deployer:
# developer fork URL needed for dev deployment
    #scm_url: https://github.com/gmkeegan/agnosticd.git
    scm_url: https://github.com/xtophd/agnosticd.git
    #scm_url: https://github.com/redhat-cop/agnosticd/blob/development/ansible/configs/ansible-multitier-rhel8/
    #scm_ref: development
    scm_ref: rhel8-summit-2021
    virtualenv: ansible2.9-python3.6-2021-01-22
