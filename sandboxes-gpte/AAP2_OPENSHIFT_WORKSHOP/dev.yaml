---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
windows_password: "Pa$$w0rd123"
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
- name: WebSG
  rules:
  - name: HTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: HTTPSPorts
    description: "HTTP Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
- name: HostSG
  rules:
  - name: FromHostSG
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: -1
    from_group: HostSG
    rule_type: Ingress
- name: WinSG
  rules:
  - name: WinSGTcp
    description: "Public Access"
    from_port: 0
    to_port: 65535
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: HostSGUDP
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------
instances:
- name: bastion
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(__image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(__instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
  security_groups:
  - BastionSG
  - WebSG
  - HostSG
- name: "win"
  count: 5
  public_dns: true
  dns_loadbalancer: false
  image: WIN2019
  flavor:
    ec2: m5.xlarge
  tags:
  - key: "AnsibleGroup"
    value: "windows"
  - key: "ostype"
    value: "windows"
  security_groups:
  - DefaultSG
  - WinSG
  - HostSG
  UserData: |
     UserData:
            "Fn::Base64":
               "Fn::Join":
                 - ""
                 - - "<powershell>\n"
                   - "$admin = [adsi]('WinNT://./administrator, user')\n"
                   - "$admin.PSBase.Invoke('SetPassword', '{{ windows_password }}')\n"
                   - "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n"
                   - "$scriptPath=((New-Object System.Net.Webclient).DownloadString('https://raw.githubusercontent.com/ansible/ansible/devel/examples/scripts/ConfigureRemotingForAnsible.ps1'))\n"
                   - "Invoke-Command -ScriptBlock ([scriptblock]::Create($scriptPath)) -ArgumentList '-skipNetworkProfileCheck'\n"
                   - "</powershell>"


# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: rhte-v.1.0
    scm_type: git
