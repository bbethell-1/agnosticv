---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml

## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.

platform: RHPDS

# The name of the agnosticd config to deploy
env_type: ansible-middleware-workshop

repo_version: 3.7.0-4

# What we use in this environment to get the packages we need
repo_method: satellite
satellite_activationkey: rhel81

set_repositories_satellite_activationkey: "{{ satellite_activationkey }}"

### control-user role variables
control_user_name: devops
control_user_ssh_config: ./files/ssh_config.j2

### VScoder server variables

vscode_server_hostname: "bastion.{{ subdomain_base }}"
vscode_user_name: "{{ control_user_name }}"
vscode_user_password: changme
vscode_server_extension_urls:
  - https://gpte-public.s3.amazonaws.com/vscode-plugins/auchenberg.vscode-browser-preview-0.7.2.vsix

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################
agnosticv_meta:
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################
__meta__:
  asset_uuid: 2964cd68-31de-4d8e-b4e3-960036bd9d93
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - ansible
      - Ansible
      - Automation
      - eap
      - runtime
    labels:
      Provider: Application_Services_BU
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Application_Services
    multiuser: true
    parameters: []
    display_name: Red Hat Runtime Automation EAP
    category: Workshops
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
    - name: satellite-rhel81-ha
      namespace: gpte
