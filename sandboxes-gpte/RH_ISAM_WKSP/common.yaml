platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ansible-bu-workshop
student_name: student
ansible_service_account_user_name: "{{ student_name }}"
# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Instance Variable
# -------------------------------------------------------------------
bastion_instance_image: RHEL92GOLD-latest
bastion_instance_type: m5.8xlarge

satellite_instance_name: satellite
satellite_instance_image: rhel8.9-satellite-6.14-2024-06-26
satellite_instance_type: r7a.2xlarge

idm_instance_name: idm-1
idm_instance_image: ansible-bu-minimal-rhel-9.4-hvm-std02.x86_64-gp3
idm_instance_type: "{{ node_instance_type | default(default_instance_type) }}"

