security_groups:
- name: BastionSG
  rules:
  - name: BastionSSHPorts
    description: "Bastion ssh"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: WebSG
  rules:
  - name: WebHTTPSPorts
    description: "HTTPS Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WebHTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WebCockpitPorts
    description: "Cockpit HTTP Public"
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: PetAppSG
  rules:
  - name: PetAppPorts
    description: "Pet App HTTP Public"
    from_port: 8080
    to_port: 8080
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: NodeSG
  rules:
  - name: FromNodeSGtcp
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: tcp
    from_group: NodeSG
    rule_type: Ingress

  - name: FromNodeSGudp
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: udp
    from_group: NodeSG
    rule_type: Ingress

- name: SatSG
  rules:
  - name: IngressCapsuleDNSTCP
    description: "Incoming Satellite provisioning DNS tcp service (optional)"
    from_port: 53
    to_port: 53
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressCapsuleDNSUDP
    description: "Incoming Satellite provisioning DNS service over udp (optional)"
    from_port: 53
    to_port: 53
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressCapsuleDHCPUDP
    description: "Incoming Satellite provisioning DHCP service over udp (optional)"
    from_port: 67
    to_port: 67
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressCapsuleTFTPUDP
    description: "Incoming Satellite provisioning TFTP service over udp (optional)"
    from_port: 69
    to_port: 69
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressCapsuleSatelliteAPITCP
    description: "Incoming Satellite API and Content Services over HTTPS (required)"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressContentServicesHTTP
    description: "Incoming Content Services over HTTP (required)"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressREXPullTCP
    description: "Incoming Remote EXecution Pull over tcp - MQTT (optional)"
    from_port: 1883
    to_port: 1883
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressVirtualConsoleTCP
    description: "Incoming Virtual Console for clients over tcp (optional)"
    from_port: 5910
    to_port: 5930
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressProvisioningTemplatesTCP
    description: "Incoming provisioning template retrieval for client installers over tcp (optional)"
    from_port: 8000
    to_port: 8000
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressPuppetAgentTCP
    description: "Incoming puppet agent connection over tcp (optional)"
    from_port: 8140
    to_port: 8140
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressCapsuleAPI
    description: "Incoming Smart Proxy, SCAP and Discovery traffic (required)"
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: IdMSG
  rules:
  - name: IngressIdMPrimaryHTTPS
    description: "Incoming IdM API service over HTTPS (required)"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryHTTP
    description: "Incoming IdM API service over HTTP (required)"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryLDAPS
    description: "Incoming IdM LDAP Secure service over tcp (required)"
    from_port: 636
    to_port: 636
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryLDAP
    description: "Incoming IdM LDAP service over tcp (required)"
    from_port: 389
    to_port: 389
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryKerberosUDP
    description: "Incoming IdM kerberos request over udp (required)"
    from_port: 88
    to_port: 88
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryKerberosTCP
    description: "Incoming IdM kerberos large ticket request fallback over tcp (required)"
    from_port: 88
    to_port: 88
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryKerberosPasswordUDP
    description: "Incoming IdM kerberos password change request over udp (required)"
    from_port: 464
    to_port: 464
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryKerberosPasswordUDP
    description: "Incoming IdM kerberos password change request fallback over tcp (required)"
    from_port: 464
    to_port: 464
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryDNSTCP
    description: "Incoming IdM DNS service request over tcp (required)"
    from_port: 53
    to_port: 53
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: IngressIdMPrimaryDNSUDP
    description: "Incoming IdM DNS service request over udp (required)"
    from_port: 53
    to_port: 53
    protocol: udp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

base_instances:
- name: "{{ bastion_instance_name | default('autoctrl-1') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - BastionSG
  - WebSG
  - DefaultSG
  - NodeSG

- name: "{{ autohub_instance_name | default('autohub-1') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ autohub_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ autohub_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "autohubs"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - BastionSG
  - WebSG
  - DefaultSG
  - NodeSG

- name: "{{ satellite_instance_name }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image:
    name: "{{ satellite_instance_image }}"
  flavor:
    ec2: "{{ satellite_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "satellites"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: 500
  security_groups:
  - WebSG
  - DefaultSG
  - NodeSG
  - SatSG

- name: "{{ idm_instance_name }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image:
    name: "{{ idm_instance_image }}"
  flavor:
    ec2: "{{ idm_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "idms"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - WebSG
  - DefaultSG
  - NodeSG
  - IdMSG

- name: "node-"
  count: 2
  public_dns: false
  image:
    name: "ansible-bu-minimal-rhel-9.4-hvm-std02.x86_64-gp3"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - NodeSG

# -------------------------------------------------------------------
# Role: ansible_bu_aws_access_policy
# -------------------------------------------------------------------
ec2_instance_common_tags: &common_tags
  guid: "{{ guid }}"
  ansible-workshops: "true"
  Workshop: "{{ workshop_type }}"
  Workshop_type: "{{ workshop_type }}"
  Student: "autoctrl-1"

ansible_bu_aws_access_policy_ec2_instances_tags:
- name: autoctrl-1
  iamprofile: false
  tags:
    Workshop_ansible: "autoctrl-1"
    short_name: "autoctrl-1"
    username: "ec2-user"
    <<: *common_tags
- name: autohub-1
  iamprofile: false
  tags:
    Workshop_ansible: "autohub-1"
    short_name: "autohub-1"
    username: "ec2-user"
    <<: *common_tags
- name: idm-1
  iamprofile: false
  tags:
    Workshop_ansible: "idm-1"
    short_name: "idm-1"
    username: "ec2-user"
    <<: *common_tags
- name: satellite
  iamprofile: true
  tags:
    Workshop_satellite: "satellite"
    short_name: "satellite"
    username: "ec2-user"
    <<: *common_tags
- name: node-1
  iamprofile: true
  tags:
    Index: 1
    Workshop_node1: "node-1"
    short_name: "node-1"
    username: "ec2-user"
    <<: *common_tags
- name: node-2
  iamprofile: true
  tags:
    Index: 2
    Workshop_node2: "node-2"
    short_name: "node-2"
    username: "ec2-user"
    <<: *common_tags

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
  - ansible_bu_aws_access_policy
  bastions:
  - set-repositories
  - common
  - bastion-lite
  - control-user
  satellites:
  - ansible_bu_satellite

software_workloads:
  bastions:
  - ansible_bu_run_time_inventory
  - deploy_automationcontroller
  - aap_controller_cert_issue
  - vscode-server
  - automation_platform_loader
  - ansible_bu_setup_workshop

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
install_automationcontroller: true
deploy_automationcontroller_admin_password: "{{ common_password }}"
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"

# -------------------------------------------------------------------
# Role: automation_platform_loader
# -------------------------------------------------------------------
configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
  controller_username: admin
  controller_password: "{{ common_password }}"
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
- role: settings
  var: controller_settings
  tags: settings
- role: credential_types
  var: controller_credential_types
  tags: credential_types
- role: credentials
  var: controller_credentials
  tags: credentials
- role: execution_environments
  var: controller_execution_environments
  tags: execution_environments
- role: projects
  var: controller_projects
  tags: projects
- role: inventories
  var: controller_inventories
  tags: inventories
- role: hosts
  var: controller_hosts
  tags: hosts
- role: groups
  var: controller_groups
  tags: groups
- role: job_templates
  var: controller_templates
  tags: templates
- role: job_launch
  var: controller_launch_jobs
  tags: job_launch

controller_settings:
- name: AWX_COLLECTIONS_ENABLED
  value: true

# -------------------------------------------------------------------
# controller_credential_types variable value is defined in the agnosticd
# config due to Jinja templating issue
# https://github.com/redhat-cop/agnosticd/blob/development\
# /ansible/configs/ansible-bu-workshop/default_vars.yml
# -------------------------------------------------------------------

controller_credentials:
- name: "Inventory Credential"
  organization: Default
  credential_type: "Red Hat Satellite 6"
  inputs:
    host: "https://{{ ansible_bu_satellite_external_fqdn }}"
    username: "{{ ansible_bu_satellite_user_name }}"
    password: "{{ ansible_bu_satellite_user_password }}"
  state: present
- name: "Satellite Credential"
  organization: Default
  credential_type: "Satellite_Collection"
  inputs:
    host: "https://{{ ansible_bu_satellite_external_fqdn }}"
    username: "{{ ansible_bu_satellite_user_name }}"
    password: "{{ ansible_bu_satellite_user_password }}"
  state: present
- name: "Controller Credential"
  organization: Default
  credential_type: "Red Hat Ansible Automation Platform"
  inputs:
    host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
    username: "admin"
    password: "{{ common_password }}"
  state: present
- name: "Workshop Credential"
  organization: Default
  credential_type: "Machine"
  inputs:
    username: "ec2-user"
    ssh_key_data: "{{ lookup('file', hostvars.localhost.ssh_provision_key_path) }}"
  state: present
- name: "registry.redhat.io credential"
  organization: Default
  credential_type: "Container Registry"
  inputs:
    host: registry.redhat.io
    username: "{{ registry_credentials_username }}"
    password: "{{ registry_credentials_password }}"
    verify_ssl: true
  state: present
- name: "Demo Credential"
  credential_type: "Machine"
  state: absent

controller_execution_environments:
- name: "rh-isam workshop execution environment"
  image: "quay.io/acme_corp/rh-isam-ee:latest"
  pull: missing
  state: present
- name: "rh-isam controller iac execution environment"
  image: "quay.io/acme_corp/rh-isam-ee:latest"
  pull: missing
  state: present

controller_projects:
- name: "RH-ISAM Automation"
  scm_url: "https://github.com/heatmiser/rh-isam-workshop.git"
  organization: Default
  description: "RH-ISAM workshop project"
  scm_type: git
  scm_branch: dev
  default_environment: "rh-isam workshop execution environment"
  state: present
- name: "Demo Project"
  organization: Default
  state: absent

controller_inventories:
- name: "Workshop Inventory"
  organization: Default
  state: present
- name: "Demo Inventory"
  organization: Default
  state: absent

controller_hosts:
- name: "{{ groups['nodes'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
  variables:
    ansible_host: "{{ groups['nodes'][0] }}"
- name: "{{ groups['nodes'][1] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
  variables:
    ansible_host: "{{ groups['nodes'][1] }}"
- name: "{{ groups['bastions'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
- name: "{{ groups['autohubs'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
- name: "{{ groups['satellites'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present
- name: "{{ groups['idms'][0] }}"
  inventory: "Workshop Inventory"
  enabled: true
  state: present

controller_groups:
- name: rhel
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['nodes'][0] }}"
  - "{{ groups['nodes'][1] }}"
- name: rhel9
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['nodes'][0] }}"
  - "{{ groups['nodes'][1] }}"
- name: node
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['nodes'][0] }}"
  - "{{ groups['nodes'][1] }}"
- name: control
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['bastions'][0] }}"
- name: hub
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['autohubs'][0] }}"
- name: satellite
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['satellites'][0] }}"
- name: idm
  inventory: "Workshop Inventory"
  state: present
  hosts:
  - "{{ groups['idms'][0] }}"

controller_templates:
- name: "Z / CaC / Controller"
  description: "Z / CaC / Controller"
  project: "RH-ISAM Automation"
  playbook: setup_controller.yml
  inventory: "Workshop Inventory"
  execution_environment: "rh-isam controller iac execution environment"
  credentials:
  - Controller Credential
  extra_vars:
    controller_configuration_projects_async_retries: 60
    controller_configuration_projects_async_delay: 5
- name: "Z / CaC / Satellite"
  description: "Z / CaC / Satellite"
  job_type: run
  inventory: "Workshop Inventory"
  project: "RH-ISAM Automation"
  playbook: setup_satellite.yml
  execution_environment: "rh-isam controller iac execution environment"
  credentials:
  - "Satellite Credential"
  - "Workshop Credential"
  ask_variables_on_launch: true
  extra_vars:
    refresh_satellite_manifest: false
- name: "Demo Job Template"
  organization: Default
  state: absent

# Comment out, launch jobs now handled via AgnosticD here:
# https://github.com/redhat-cop/agnosticd/blob/7d1707ce1070a89f729eb89a616618a84660af1a/ansible/roles/ansible_bu_setup_workshop/tasks/auto_satellite.yml#L55-L120
# controller_launch_jobs:
# - name: "Z / CaC / Satellite"
ocp4_workload_cert_manager_channel: stable-v1
# -------------------------------------------------------------------
# Role: aap_controller_cert_issue
# -------------------------------------------------------------------
enable_letsencyrpt_cert: true
controller_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: false
vscode_server_ansible_become: true
vscode_use_automationcontroller_nginx: true
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
- https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
- https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
- https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

# -------------------------------------------------------------------
# Role: ansible_bu_setup_workshop
# -------------------------------------------------------------------
workshop_type: rh_isam
workshop_version: 1.0.18
ansible_bu_setup_workshop_exercise_src: rhdp_auto_satellite
ansible_bu_setup_workshop_exercise_dest: auto_satellite-workshop

ansible_bu_setup_workshop_ee_image:
- name: quay.io/s4v0/ee-automated-satellite-aap2
  tag: latest
- name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-29-rhel8
  tag: 2.0.0
- name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-supported-rhel8
  tag: 2.0.0
- name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-minimal-rhel8
  tag: 2.0.0

# -------------------------------------------------------------------
# Role: ansible_bu_satellite
# -------------------------------------------------------------------
ansible_bu_satellite_external_fqdn: "{{ groups['satellites'][0].split('.')[0] }}.{{ subdomain_base }}"
ansible_bu_satellite_user_name: admin
ansible_bu_satellite_user_password: "{{ common_password }}"

