purpose: dev
satellite_instance_name: satellite
satellite_instance_image: rhel8.9-satellite-6.15-2024-06-28
satellite_instance_type: r7a.2xlarge
controller_projects:
- name: RH-ISAM Automation
  scm_url: https://github.com/heatmiser/rh-isam-workshop.git
  organization: Default
  description: RH-ISAM workshop project
  scm_type: git
  scm_branch: dev
  default_environment: rh-isam workshop execution environment
  state: present
- name: Demo Project
  organization: Default
  state: absent
instances: '{{ base_instances }}'
aws_default_volume_type: gp3
aws_ebs_volume_iops: 6000
aws_ebs_volume_throughput: 600
agnosticd_aws_capacity_reservations_enable: true
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: always
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
