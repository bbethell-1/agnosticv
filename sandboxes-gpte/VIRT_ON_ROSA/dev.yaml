windows_vm_playbook: playbook_winvms.yml
linux_configure_vm_playbook: playbook_linuxvm.yml
win_configure_vm_playbook: playbook_winvms.yml
migration_playbook: playbook.yml
repo_playbook: add_repo.yml
winvm_namespace: namespace_winvm
linux_provision_vm_playbook: provision_vms.yml
ssh_public_key: >-
  "ssh-rsa  lab-user@hypervisor"
aap_job_template_repo_survey: >-
  {
    "name": "Repo Survey",
    "description": "Repo Survey",
    "spec": [
      {
        "question_description": "Org ID",
        "min": 0,
        "default": "",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "org_id",
        "question_name": "What is your organization id?",
        "type": "text"
      },
      {
        "question_description": "Activation Key",
        "min": 0,
        "default": "",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "key",
        "question_name": "What is your activation key?",
        "type": "text"
      }
    ]
  }
aap_job_template_basic_survey: >-
  {
    "name": "Basic Survey",
    "description": "Basic Survey",
    "spec": [
      {
        "question_description": "VMware Provider Name",
        "min": 0,
        "default": "vmware",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "provider_name",
        "question_name": "Name of your provider?",
        "type": "text"
      },
      {
        "question_description": "Migration Plan",
        "min": 0,
        "default": "migration-plan",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "plan_name",
        "question_name": "Name of your migration plan?",
        "type": "text"
      },
      {
        "question_description": "Storage Mapping",
        "min": 0,
        "default": "storagemap",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "storagemap_name",
        "question_name": "Name of your storage mapping?",
        "type": "text"
      },
      {
        "question_description": "Network Mapping",
        "min": 0,
        "default": "networkmap",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "networkmap_name",
        "question_name": "Name of your network mapping?",
        "type": "text"
      },
      {
        "question_description": "VM Names",
        "min": 0,
        "default": "",
        "max": 128,
        "required": true,
        "choices": "",
        "new_question": true,
        "variable": "user_selected_vm_names",
        "question_name": "What are the names of the VMs to migrate?",
        "type": "textarea"
      }
    ]
  }


configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "aap-aap.apps.cluster-{{ guid }}.{{ cluster_dns_zone }}"
  controller_username: admin
  controller_password: "{{ common_password }}"
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
- role: credential_types
  var: controller_credential_types
  tags: credential_types
- role: credentials
  var: controller_credentials
  tags: credentials
- role: execution_environments
  var: controller_execution_environments
  tags: execution_environments
- role: projects
  var: controller_projects
  tags: projects
- role: inventories
  var: controller_inventories
  tags: inventories
- role: inventory_sources
  var: controller_inventory_sources
  tags: inventory_sources
- role: job_templates
  var: controller_templates
  tags: templates

controller_projects:
- name: "{{ project_name }}"
  organization: "{{ organization }}"
  scm_branch: "{{ scm_branch }}"
  scm_clean: 'false'
  scm_delete_on_update: 'false'
  scm_type: "{{ scm_type }}"
  scm_update_on_launch: 'true'
  scm_url: "{{ scm_url }}"


controller_credentials:
- name: "Linux VMs SSH Access"
  credential_type: Machine
  organization: Default
  inputs:
    username: "{{ linux_vm_username }}"
    ssh_key_data: "{{ linux_vm_ssh_key }}"

- name: "kubeconfig"
  credential_type: "kubeconfig"
  organization: "Default"
  inputs:
    kube_config: "{{ kubeconfig }}"

- name: "VMware Credentials"
  credential_type: "VMware vCenter"
  organization: Default
  inputs:
    host: "{{ vmware_host }}"
    username: "{{ vmware_username }}"
    password: "{{ vmware_password }}"

controller_execution_environments:
- name: "AWX EE"
  image: "{{ awx_ee_image }}"
  pull: missing

controller_inventories:
- name: "OpenShift Virtualization Inventory"
  organization: "{{ organization }}"

controller_inventory_sources:
- name: OpenShift Virtualization Source
  source: scm
  source_project: "{{ project_name }}"
  source_path: inventory.kubevirt.yml
  inventory: OpenShift Virtualization Inventory
  credential: "kubeconfig"
  execution_environment: "AWX EE"
  organization: "{{ organization }}"
  overwrite: true
  update_on_launch: true
  update_cache_timeout: 0
  wait: true

controller_templates:
- name: 04 Configure Lamp Stack Linux VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ linux_vm_playbook }}"
  limit: namespace_linuxvm
  credentials: "Linux VMs SSH Access"
  survey: {}
  extra_vars: {}

- name: 02 Provision Linux VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ linux_provision_vm_playbook }}"
  credentials: "kubeconfig"
  survey: {}
  extra_vars:
    ssh_public_key: "{{ ssh_public_key }}"
    vm_password: "{{ linux_vm_password }}"

- name: 05 Configure DevOps Users on Linux VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ linux_configure_vm_playbook }}"
  limit: namespace_linuxvm
  credentials: "Linux VMs SSH Access"
  survey: {}
  extra_vars: {}

- name: 01 Migrate VMware VMs to OpenShift Virtualization
  job_type: run
  organization: "{{ organization }}"
  inventory: Demo Inventory
  project: "{{ project_name }}"
  playbook: "{{ migration_playbook }}"
  credentials:
  - "kubeconfig"
  - "VMware Credentials"
  survey_enabled: true
  survey: "{{ aap_job_template_basic_survey }}"
  extra_vars:
    vmware_host: "{{ vmware_host }}"

- name: 03 Add Repositories to RHEL VMs
  job_type: run
  organization: "{{ organization }}"
  inventory: OpenShift Virtualization Inventory
  project: "{{ project_name }}"
  playbook: "{{ repo_playbook }}"
  credentials: "Linux VMs SSH Access"
  limit: namespace_linuxvm
  survey_enabled: true
  survey: "{{ aap_job_template_repo_survey }}"
  extra_vars: {}

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: true

ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/virt-migration-demo
ocp4_workload_showroom_content_git_repo_ref: v2.0.0
ocp4_workload_showroom_content_antora_playbook: demo-site.yml
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.2.1"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
