---
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
cloud_provider: ec2

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
install_common: true
bastion_instance_image: RHEL93GOLD-latest

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Virtualization Migration Factory Demo!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
rosa_version: latest
rosa_version_base: openshift-v4.17
rosa_installer_version: latest
rosa_deploy_hcp: true
rosa_compute_machine_type: m6a.4xlarge

# -------------------------------------------------------------------
# Remove use of catalogsources/snaphots in DEV
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_catalogsource_setup: false
ocp4_workload_kubevirt_use_catalog_snapshot: false
ocp4_workload_mtv_use_catalog_snapshot: false
ocp4_workload_rhacm_use_catalog_snapshot: false

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_openshift_data_foundation_channel: stable-4.17
ocp4_workload_virt_roadshow_vmware_use_pool: true

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
