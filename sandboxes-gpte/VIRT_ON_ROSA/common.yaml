---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud-rosa.yaml

#include /includes/parameters/aws-region.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml

#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# ------------------------------------------------------
# Catalog Item Parameters
# ------------------------------------------------------

# Here for documentation. The following vars are being set by CI parameters
# rosa_deploy: false
# rosa_deploy_hcp: false
# rosa_setup_cluster_admin: false

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
rosa_installer_version: latest

# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade

# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: openshift-v4.15
rosa_compute_machine_type: m6a.xlarge

#billing account for HCP
aws_billing_account_id: "017310218799"

bastion_instance_type: "t3a.small"
bastion_instance_image: RHEL93GOLD-latest

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Red Hat OpenShift Service on AWS Workshop!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# -------------------------------------------------------------------
# Customizations to packages and virtualenvs to enable ovirt.ovirt
# -------------------------------------------------------------------
# Add prereqs for ovirt-engine-sdk-python Python package
host_virtualenv_package_prereqs:
- gcc
- python3
- python3-devel
- python3-libselinux
- python3-pip
- libcurl-devel
- openssl-devel
- libxml2-devel

# Add required Python packages to virtualenv for ovirt.ovirt collection
host_virtualenv_requirements_override:
- ovirt-engine-sdk-python==4.5.0
- passlib==1.7.4

# Custom collections for this environment
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 2.3.0
  - name: community.general
    version: 6.4.0
  - name: ansible.posix
    version: 1.5.1
  - name: ovirt.ovirt
    version: 3.1.1

# Extra packages to install
common_extra_packages:
- java-17-openjdk-devel
- tzdata-java
- maven

# Because this environment includes Bare Metal instances wait longer for
# CSRs to appear
ocp4_approve_certificate_signing_requests_initial_delay: 240
ocp4_approve_certificate_signing_requests_recheck_delay: 60

infra_workloads:
- ocp4_workload_openshift_data_foundation
- ocp4_workload_machinesets
- ocp4_workload_kubevirt
- ocp4_workload_rhsso_authentication

# -------------------------------------------------------------------
# Common Admin Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_data_foundations
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.14
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 1500Gi
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_old_default_storage_class_name: gp3-csi
ocp4_workload_openshift_data_foundation_tolerations:
- key: metal
  operator: Exists

ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: v4.14_2023_11_27

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: false

# Add a MachineSet for AWS Bare Metal instances
ocp4_workload_machinesets_machineset_groups:
- name: metal
  role: metal
  instance_type: c5n.metal
  root_volume_size: 250
  root_volume_type: io1
  root_volume_iops: 2000
  autoscale: false
  total_replicas: "{{ [(num_users | int / 25) | round(0, 'ceil') | int, 1] | max }}"
  # Autoscaler settings - minimum and maximum number of Machines
  total_replicas_min: 2
  total_replicas_max: 4
  # The role of the nodes (node-role.kubernetes.io/metal: "")
  machineConfigPool:
    setup: true
    maxPodsPerNode: 400
  taints:
  - key: metal
    value: "true"
    effect: NoSchedule

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhsso
# -------------------------------------------------------------------
ocp4_workload_rhsso_namespace: rhsso
# ---------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.3-opr-002
ocp4_workload_rhsso_authentication_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_rhsso_authentication_catalogsource_tag: v4.13_2023_06_26

ocp4_workload_rhsso_authentication_admin_create: true
ocp4_workload_rhsso_authentication_admin_username: admin
ocp4_workload_rhsso_authentication_admin_password: "{{ common_password }}"

ocp4_workload_rhsso_authentication_user_count: "{{ num_users | default(0) }}"
ocp4_workload_rhsso_authentication_user_name_base: user
ocp4_workload_rhsso_authentication_user_password: openshift

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_workload_tolerations:
- key: metal
  operator: Exists

ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalogsource_name: redhat-operators-snapshot-kubevirt
ocp4_workload_kubevirt_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_kubevirt_catalog_snapshot_image_tag: v4.14_2023_11_27

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false



# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6d011685-6a79-4b45-b953-ca7ee96c41a9
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Virtualisation on ROSA
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '68'
    parameters:
    - name: rosa_token
      description: The ROSA Token can be created or downloaded here https://console.redhat.com/openshift/token/rosa
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
    - name: rosa_deploy
      description: Deploy ROSA in the environment
      formLabel: Deploy ROSA
      openAPIV3Schema:
        type: boolean
        default: false
    - name: rosa_deploy_hcp
      description: Deploy ROSA using a Hosted Control Plane (only used if Deploy ROSA is checked)
      formLabel: Deploy ROSA using a Hosted Control Plane
      openAPIV3Schema:
        type: boolean
        default: false
    - name: rosa_setup_cluster_admin
      description: Set up cluster admin in ROSA (only used if Deploy ROSA is checked)
      formLabel: Set up cluster admin in ROSA
      openAPIV3Schema:
        type: boolean
        default: false
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
