---
#include /includes/catalog-icon-automation-management.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/student-email.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/rosa_token.yaml
#include /includes/secrets/vmware-ibm-rs-clusters-access.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

#TODO: there's no sandboxAPI in this config
vcenter_cluster: vcs-rs-01

# -------------------------------------------------------------------
# --- Catalog Item: OpenShift Virtualization on ROSA Demo (ROSA)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: rosa-consolidated
platform: rhpds

# -------------------------------------------------------------------
# Billing account for ROSA HCP
# -------------------------------------------------------------------
aws_billing_account_id: "017310218799"

# -------------------------------------------------------------------
# ROSA
# -------------------------------------------------------------------
rosa_deploy: true
rosa_deploy_hcp: true

# rosa_version: "4.16.4"
rosa_version_base: openshift-v4.17
rosa_version: latest
rosa_installer_version: "1.2.42"

rosa_compute_replicas: 3
rosa_compute_machine_type: m6a.4xlarge

rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
install_common: true
bastion_instance_image: RHEL93GOLD-latest


bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Virtualization Migration Factory Demo!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_rosa_machinepool
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_kubevirt
  - ocp4_workload_rhacm
  - ocp4_workload_acm_multicluster_observability
  - ocp4_workload_mtv
  - ocp4_workload_ansible_automation_platform_25
  - ocp4_workload_virt_roadshow_vms
  - ocp4_workload_virt_roadshow_vmware
  - ansible_automation_platform_configuration
  - ocp4_workload_showroom


remove_workloads:
  - ocp4_workload_virt_roadshow_vmware

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_count: 1
ocp4_workload_user_name: user
ocp4_workload_user_password: >-
  {{
    lookup('password', output_dir ~ '/common_password length=12 chars=ascii_letters,digits')
  }}

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.17_2025_07_07

# -------------------------------------------------------------------
# ocp4_workload_rosa_machinepool
# -------------------------------------------------------------------
ocp4_workload_rosa_machinepool_replicas: 1
ocp4_workload_rosa_machinepool_instance_types:
  - m5zn.metal
  - m5n.metal
  - m5.metal

# -------------------------------------------------------------------
# ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.17
ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1200

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: true
ocp4_workload_kubevirt_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_kubevirt_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_kubevirt_workload_tolerations:
  - key: metal
    operator: Exists

# -------------------------------------------------------------------
# ocp4_workload_mtv
# -------------------------------------------------------------------
ocp4_workload_mtv_channel: release-v2.7
ocp4_workload_mtv_use_catalog_snapshot: true
ocp4_workload_mtv_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_mtv_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_ansible_automation_platform_25
# -------------------------------------------------------------------
ocp4_workload_ansible_automation_platform_admin_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_ansible_automation_platform_inject_manifest: true
ocp4_workload_ansible_automation_platform_manifest:
  url: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip
ocp4_workload_ansible_automation_platform_create_eda_rolebinding: true
ocp4_workload_ansible_automation_platform_ocp_cluster_role: cluster-reader

# -------------------------------------------------------------------
# ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.11
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhacm_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag}}"

# workaround because this var is expected by the role here:
# https://github.com/redhat-cop/agnosticd/blob/08a0964bf999a4aa42087fb8785cd29240851d27/ansible/roles_ocp_workloads/ocp4_workload_rhacm/templates/multiclusterhub.yaml.j2#L6
master_instance_count: 2

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vms
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vms_num_users: "{{ ocp4_workload_user_count }}"
ocp4_workload_virt_roadshow_vms_namespace: vmimported
ocp4_workload_virt_roadshow_vms_start_vms: true
# Roadshow Setup
# When set to true (default) then the application made up from the VMs will not
# work until instructions are followed.
# When false the application will work out of the box without changes
ocp4_workload_virt_roadshow_vms_roadshow_setup: false

# -------------------------------------------------------------------
# ocp4_workload_virt_roadshow_vmware
# -------------------------------------------------------------------
ocp4_workload_virt_roadshow_vmware_num_users: "{{ ocp4_workload_user_count }}"
ocp4_workload_virt_roadshow_vmware_use_pool: true
# Not used when using VMware vm pool
# ocp4_workload_virt_roadshow_vmware_vcenter_folder: "ocpvirt-{{ guid }}"
ocp4_workload_virt_roadshow_vmware_enable_mtv: true
ocp4_workload_virt_roadshow_vmware_enable_cert_validation: false

# -------------------------------------------------------------------
# ansible_automation_platform_configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "{{ aap_controller_web_url }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "{{ aap_controller_admin_password }}"
ansible_automation_platform_configuration_create_controller_token: true

controller_dependency_check: false

# Roles and variables from here: https://github.com/redhat-cop/infra.aap_configuration
aap_configuration_dispatcher_roles:
  - role: controller_credential_types
    var: controller_credential_types
    tags: controller_credential_types
  - role: controller_credentials
    var: controller_credentials
    tags: controller_credentials
  - role: controller_execution_environments
    var: controller_execution_environments
    tags: controller_execution_environments
  - role: controller_projects
    var: controller_projects
    tags: controller_projects
  - role: controller_inventories
    var: controller_inventories
    tags: controller_inventories
  - role: controller_inventory_sources
    var: controller_inventory_sources
    tags: controller_inventory_sources
  - role: controller_job_templates
    var: controller_templates
    tags: controller_job_templates

# Common variables
vmware_host: "{{ hostvars['localhost']['vcenter_hostname'] }}"
project_name: OpenShift Virtualization Project
organization: Default

