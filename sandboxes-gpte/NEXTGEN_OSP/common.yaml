---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-3regions.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/demosat-nextgen-osp.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/catalog-icon-openstack.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
sandbox_enable_ui: true
sandbox_user_info_data_enable: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.13"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type: m5a.2xlarge
master_instance_count: 3
master_storage_type: io1
master_storage_size: 150

worker_instance_type: m5a.4xlarge
worker_instance_count: 3
worker_storage_type: gp3
worker_storage_size: 150

bastion_instance_type: t3a.medium
bastion_instance_image: RHEL92GOLD-latest
bastion_rootfs_size: 30

dataplane_instance_type: t3a.medium
dataplane_instance_image: RHEL92GOLD-latest
dataplane_rootfs_size: 150

# -------------------------------------------------------------------
# Instances
# -------------------------------------------------------------------
instances:
- name: "bastion"
  count: 1
  unique: true
  public_dns: true
  alt_name:
  - clientvm
  image: "{{ bastion_instance_image }}"
  flavor:
    "ec2": "{{ bastion_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions,clientvms"
  - key: "ostype"
    value: "linux"
  - key: "Purpose"
    value: "{{ purpose }}"
  - key: "project"
    value: "{{ project_tag }}"
  - key: "user"
    value: "{{ student_name }}"
  rootfs_size: "{{ bastion_rootfs_size }}"
  networks:
  - external
  - internalapi
  - storage
  - tenant
  - storageMgmt
  - ctlplane
  security_groups:
  - BastionSG

- name: "dataplane"
  count: 1
  unique: true
  public_dns: true
  image: "{{ dataplane_instance_image }}"
  flavor:
    "ec2": "{{ dataplane_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "dataplanes"
  - key: "ostype"
    value: "linux"
  - key: "Purpose"
    value: "{{ purpose }}"
  - key: "project"
    value: "{{ project_tag }}"
  - key: "user"
    value: "{{ student_name }}"
  rootfs_size: "{{ dataplane_rootfs_size }}"
  networks:
  - external
  - internalapi
  - storage
  - tenant
  - storageMgmt
  - ctlplane
  security_groups:
  - BastionSG

networks:
- name: external
  subnet_cidr: 10.0.0.0/24
  enable_dhcp: True
  shared: "false"
  gateway_ip: 10.0.0.1
  dns_nameservers: [8.8.8.8]
  create_router: True
  router_network: external
  allocation_start: 10.0.0.100
  allocation_end: 10.0.0.250

- name: ctlplane
  subnet_cidr: 192.168.122.0/24
  enable_dhcp: False
  shared: "false"
  gateway_ip: 10.20.0.1
  dns_nameservers: [8.8.8.8]
  create_router: False
  router_network: external
  allocation_start: 192.168.122.100
  allocation_end: 192.168.122.250

- name: internalapi
  shared: "false"
  subnet_cidr: 172.17.0.0/24
  enable_dhcp: False
  gateway_ip: 0.0.0.0
  dns_nameservers: []
  create_router: false
  allocation_start: 172.17.0.100
  allocation_end: 172.17.0.250

- name: storage
  shared: "false"
  subnet_cidr: 172.18.0.0/24
  enable_dhcp: False
  gateway_ip: 0.0.0.0
  dns_nameservers: []
  create_router: false
  allocation_start: 172.18.0.100
  allocation_end: 172.18.0.250

- name: tenant
  shared: "false"
  subnet_cidr: 172.19.0.0/24
  enable_dhcp: False
  gateway_ip: 0.0.0.0
  dns_nameservers: []
  create_router: false
  allocation_start: 172.19.0.100
  allocation_end: 172.19.0.250

- name: storageMgmt
  shared: "false"
  subnet_cidr: 172.20.0.0/24
  enable_dhcp: False
  gateway_ip: 0.0.0.0
  dns_nameservers: []
  create_router: false
  allocation_start: 172.20.0.100
  allocation_end: 172.20.0.250

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: 2
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 11567B0C-C70A-459F-9E82-041D8F095DA6
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Next Gen OpenStack Dev Preview Demo
    category: Demos
    keywords:
    - osp
    - next
    - gen
    labels:
      Product: Red_Hat_OpenStack_Platform
      Product_Family: Red_Hat_Cloud
    multiuser: false
    parameters: []
  secrets: []
