---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

bastion_instance_image: RHEL93GOLD-latest

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/showroom-rosa-ops-hoe.git
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
- "{{ bastion_user_name }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0-alpha
      pull: missing
  secrets:
  - namespace: gpte
    name: ocp4-token
