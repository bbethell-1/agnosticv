---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/rosa_token.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_rosa_fsx

ocp4_workload_rosa_fsx_deploy_fsx: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# AWS machines
# -------------------------------------------------------------------

bastion_instance_type: "t2.small"
bastion_instance_image: RHEL93GOLD-latest

ssh_authorized_keys:
# Instructor Key
  - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAOfl+764UFbDkkxpsQYjET7ZAWoVApSf4I64L1KImoc rbohne@redhat.com

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/redhat-gpst/rosa-fsx-lab-guide.git
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
  - "{{ bastion_user_name }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 4ae725cf-951d-45ac-ba35-ca3100704ce4
  owners:
    maintainer:
      - name: George James
        email: gjames@redhat.com
    instructions:
      - name: George James
        email: gjames@redhat.com
      - name: Robert Bohne
        email: rbohne@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
  sandbox_api:
    actions:
      start:
        enable: false
      stop:
        enable: false
      destroy:
        catch_all: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA FSx Workshop
    category: Open_Environments
    multiuser: false
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: rosa_token
        description: To obtain a current ROSA token, please visit https://console.redhat.com/openshift/token
        formLabel: ROSA Token (RECOMMENDED)
        required: false
        openAPIV3Schema:
          type: string
      - name: ocp4_workload_rosa_fsx_deploy_fsx
        description: >-
          Pre deploy FSx on ONTAP
        formLabel: Pre deploy FSx on ONTAP
        openAPIV3Schema:
          default: false
          type: boolean
    reportingLabels:
      primaryBU: Hybrid_Platforms
