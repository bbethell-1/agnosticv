---
#include /includes/parameters/showroom-ocp-defaults.yaml
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Showroom Variables overridden from common
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: development

# ------------------------------------------------------------------
# AgnosticV meta variables
# ------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# ------------------------------------------------------------------
# Git revision to use for the deploying the workshop GitOps
# Applications. This enables the apps to be pinned to a specific
# branch or revision enabling development and promotion without
# impacting higher environments.
#
# AgonsticD for this workshop uses this variable.
# ------------------------------------------------------------------
gitops_revision: development

# ------------------------------------------------------------------
# Babylon meta variables
# ------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
