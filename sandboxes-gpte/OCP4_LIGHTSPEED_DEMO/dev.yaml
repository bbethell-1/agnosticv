---
#include /includes/secrets/ocp4_workload_ols_api_token.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_02_24

# -------------------------------------------------------------------
# Workload: ocp4_workload_ols
# -------------------------------------------------------------------
ocp4_workload_ols_channel: alpha
ocp4_workload_ols_catalogsource_name: redhat-operators
ocp4_workload_ols_use_catalog_snapshot: true
ocp4_workload_ols_starting_csv: "lightspeed-operator.v0.3.2"

# OLS Config variables.
ocp4_workload_ols_api_version: ols.openshift.io/v1alpha1
ocp4_workload_ai_platform: azure #openai, azure, watson, openshiftai

ocp4_workload_ols_token: false

# Token to Access GPT Model for OpenShift LightSpeed
ocp4_workload_ols_api_token_secret: "{{ ocp4_workload_ols_api_token }}" #Coming from Vault

# LLM provider variables (for Azure)
ocp4_workload_ols_llm_providers_models_name: gpt-4o
ocp4_workload_ols_llm_providers_provide_name: Azure
ocp4_workload_ols_llm_providers_provide_type: azure_openai
ocp4_workload_ols_llm_providers_url: 'https://ols-test.openai.azure.com/'

ocp4_workload_ols_llm_deploymentname: 4o-jun24 #this variable is required only for Azure
ocp4_workload_ols_watson_projectid: projectid #Change this with Watson Project ID, only when using Watson Model.

# OLS Default Mode vars
ocp4_workload_ols_defaultmodel: gpt-4o
ocp4_workload_ols_defaultprovider: Azure
ocp4_workload_ols_loglevel: DEBUG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.18'
          enum:
            - '4.16'
            - '4.18'
  deployer:
    scm_ref: development
