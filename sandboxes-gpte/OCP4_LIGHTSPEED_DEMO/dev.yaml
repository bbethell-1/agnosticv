ocp4_workload_ai_platform: azure
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_ols_token: false
ocp4_workload_ols_api_token_secret: '{{ ocp4_workload_ols_api_token }}'
ocp4_workload_ols_llm_providers_models_name: gpt-4o
ocp4_workload_ols_llm_providers_provide_name: Azure
ocp4_workload_ols_llm_providers_provide_type: azure_openai
ocp4_workload_ols_llm_providers_url: https://ols-test.openai.azure.com/
ocp4_workload_ols_llm_deploymentname: 4o-jun24
ocp4_workload_ols_watson_projectid: projectid
ocp4_workload_ols_defaultmodel: gpt-4o
