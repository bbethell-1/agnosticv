---

# -------------------------------------------------------------------
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/aws-3regions.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.4xlarge
master_instance_count: 3
master_storage_type: io1
master_storage_size: 250
worker_instance_type: m6a.8xlarge
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 2] | max }}"
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t2.small
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.15.0"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Other (required for OCP 4.15)
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_gitea_operator
- ocp4_workload_summit_2024_cloud_native_camel
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Common Admin Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# -------------------------------------------------------------------
# Workload: ocp4_workload_le_certificates
# -------------------------------------------------------------------
ocp4_workload_le_certificates_install_api: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.5
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.21.7
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_ssl_route: true
ocp4_workload_gitea_operator_gitea_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_postgresql_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_webhook_allowed_hosts_list: 'external,private'
ocp4_workload_gitea_operator_webhook_skip_tls_verify: true
# install_operator_namespace: gitea-operator
# install_operator_catalogsource_namespace: gitea-operator
ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com

# PVC size for Gitea, empty storage class uses default storage class
ocp4_workload_gitea_operator_gitea_volume_size: 10Gi
ocp4_workload_gitea_operator_gitea_volume_storage_class: ''

# PVC size for PostgreSQL, empty storage class uses default storage class
ocp4_workload_gitea_operator_postgresql_volume_size: 10Gi
ocp4_workload_gitea_operator_postgresql_volume_storage_class: ''

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/redhat-na-ssa/workshop_camel_workspace
  name: workshop_camel_workspace
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-na-ssa/workshop_camel_showroom.git
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b4c736a9-5a12-4990-7303-3bf4649be420
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Cloud-Native Integration with Red Hat build of Apache Camel
    category: Workshops
    multiuser: true
    keywords: []
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 60
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Apache_Camel
      Product_Family: Red_Hat
  sandbox_api:
    reservation: 1000vcpu
