bastion_instance_type: t2.large

mig_operator_repo_branch: release-1.0
mig_ocp_version: '4'
_minio_access_key: "minio"
_minio_secret_key: "minio123"

default_workloads:
  - ocp4-workload-project-request-template
  - ocp-workload-migration

# Tags to AWS Instances. This is the Shared environment.
cloud_tags:
  owner: jmatthew@redhat.com
  course_name: OpenShift Cluster Application Migration (CAM) Lab - A0005-B
  platform: "{{ platform | d('unknown') }}"
  purpose: RHTE 2019
  shared: "Yes"

agnosticv_meta:
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    user: cloudforms_user
    nodecount: worker_instance_count_ignored
  secrets:
    - rhte-ocp4
    - rhte-a0005

  nuke_sandbox: false
