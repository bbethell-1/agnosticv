---
# purpose: production
cloudformation_retries: 0

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 2

lets_encrypt_production: True
install_lets_encrypt_certificates: true
_lets_encrypt_certificates_install_api: False

agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 10

__meta__:
  deployer:
    scm_ref: ocp4-mesh-prod-0.12
    virtualenv: ansible2.9-python3.6-2021-01-22
