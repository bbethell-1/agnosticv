---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: test

# -------------------------------------------------------------------
# Override OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.7.2"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  agnosticd_git_tag_prefix: shared-summit-2020-debug-micro-ocp4-test
  deploy_with: babylon
  sandboxed: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
      - name: num_users
      - name: email
  deployer:
    git_tag_prefix: shared-summit-2020-debug-micro-ocp4-test
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: rhte-ocp4
      namespace: gpte
    - name: rhte-tower
      namespace: gpte
