---
# Red Hat Summit 2020 - T31437 - Pragmatic Approach to Debug Microservices Applications on Openshift
# course_id: RHS_2020_T31437

platform: RHPDS
env_type: ocp4-workshop
cloud_provider: ec2
software_to_deploy: none

# admin user for infra workloads
#admin_user: admin
#admin_password: admin

osrelease: 4.6.0
ocp4_installer_version: 4.7.2

infra_workloads:
  - ocp4-workload-debugging-workshop
  - ocp4_workload_le_certificates
  - ocp4-workload-enable-lets-encrypt-certificates
  - ocp4_workload_authentication

ocp4_base_domain: "{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab_user
# --- student_password not set -> generate random password
# student_password: rhte2019
# --- Student is allowed to sudo and switch to root
student_sudo: true
#user_count: 60

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
#repo_method: satellite

# Update RHEL to the latest packages (and reboot)
#update_packages: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create number of htpasswd users
num_users: "{{ user_count }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"


# Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  params_to_variables:
    username: student_name
    infra_workloads: ''
    student_workloads: ''
  nuke_sandbox: true
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
      - name: email
      - name: infra_workloads
      - name: num_users
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: rhte-ocp4
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
    - name: aws-gpte
      namespace: gpte
