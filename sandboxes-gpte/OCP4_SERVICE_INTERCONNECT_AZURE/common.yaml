---
#include /includes/parameters/azure-region.yaml
#include /includes/catalog-icon-service-interconnect.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml

# -------------------------------------------------------------------
# --- Catalog: Openshift Demos
# --- Catalog Item: Service Interconnect Demo
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: azure

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.12.12"
ocp4_installer_use_dev_preview: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Student Workloads (YAML List)
# -------------------------------------------------------------------
student_workloads: []

# -------------------------------------------------------------------
# Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
install_idm: htpasswd

ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# -------------------------------------------------------------------
# Azure cloud specific vars
# -------------------------------------------------------------------

# Enable RHEL Gold Image
rhel_publisher: redhat
rhel_offer: rhel-byos
rhel_sku: rhel-lvm81-gen2
rhel_version: latest
rhel_plan_name: rhel-lvm81-gen2
rhel_plan_publisher: redhat
rhel_plan_product: rhel-byos

# OpenShift 4 (ocp4-cluster) specific vars
windows_vm_count: 0
cluster_dns_zone: azure.opentlc.com
ocp4_base_domain: azure.opentlc.com
basesuffix: .azure.opentlc.com

master_instance_type_family: "Standard"
master_instance_count: 1
master_instance_version: "v5"

worker_instance_count: 0

master_instance_type_size: >-
  {{ 'D8s' if worker_instance_count|int <= 10
  else 'D16s' if worker_instance_count|int <= 20
  else 'D64s'
  }}
master_instance_type: "{{ master_instance_type_family }}_{{ master_instance_type_size }}_{{ master_instance_version }}"

common_packages_el9: "{{ common_packages_el8 }}"

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-azure-gpte
  deployer:
    virtualenv: azure_open_envs-ansible2.9-python3.6-2022-01-10
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Service Interconnect Demo - Azure Cluster
    category: Demos
    keywords:
    - azure
    - ocp
    - ocp4
    - service-interconnect
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
    parameters: []
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: azure_ocp4_gpte
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: satellite-rhel-8-and-9-latest-ha
    namespace: gpte
