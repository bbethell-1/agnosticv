---
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
env_type: convert-to-rhel
software_to_deploy: none
install_student_user: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
ocp4_workload_bookbag_auth_username: "{{ ansible_service_account_user_name }}"
ocp4_workload_bookbag_auth_password: "{{ student_password }}"
ocp4_workload_bookbag_console_deploy: false
ocp4_workload_bookbag_namespace: "{{ env_type }}-{{ guid }}"
ocp4_workload_bookbag_name: "{{ env_type }}-{{ guid }}"
ocp4_workload_bookbag_git_url: https://github.com/redhat-gpte-devopsautomation/convert-to-rhel-bookbag.git
# bookbag_openshift_api_token: sha256~6OcxSHmCW5G0laOpzitn0Vhdqx7q0bfR2hS5_U4ogrk
# bookbag_openshift_api_url: https://api.cluster-rlr2q.rlr2q.sandbox2352.opentlc.com:6443

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
## Added custom email template
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: false
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Convert to RHEL
    category: Demos
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Linux
      Provider: RHPDS
    keywords:
      - Convert
      - RHEL
      - CENTOS
      - salesplay
      - SalesPlay
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  # bookbag:
    # Source to use to build bookbag image
    # imageBuild:
      # Required BuildConfig spec.source
      # source:
      #   type: Git
      #   git:
      #     uri: https://github.com/redhat-gpte-devopsautomation/convert-to-rhel-bookbag.git
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true
      # Image to use for bookbag
      #image: quay.io/org/repo:tag
  secrets:
    - name: gpte
      namespace: gpte
    - name: satellite-rhel8-latest-ha
      namespace: gpte
    - name: bookbag-deployer-shared-na46
      namespace: gpte
