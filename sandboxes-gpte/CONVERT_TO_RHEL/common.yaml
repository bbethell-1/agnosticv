---
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: convert-to-rhel
software_to_deploy: none
install_student_user: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Convert to RHEL Demo
    category: Demos
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Linux
      Provider: RHPDS
    keywords:
      - Convert
      - RHEL
      - CENTOS
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-devopsautomation/convert-to-rhel-bookbag.git
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true
      # Image to use for bookbag
      #image: quay.io/org/repo:tag
  secrets:
    - name: satellite-rhel8-latest-ha
      namespace: gpte
