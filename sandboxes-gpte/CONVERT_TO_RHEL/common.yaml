---
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: convert-to-rhel
software_to_deploy: none
install_student_user: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Convert to RHEL Demo
    category: Demos
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHPDS
    keywords:
      - AAP2
      - Ansible
      - Automation
      - Controller
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: satellite-rhel8-latest-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
