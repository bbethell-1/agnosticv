---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml

# -------------------------------------------------------------------
# --- Catalog: Openshift 4 Labs
# --- Catalog Item: Advanced Cluster Management Hands On Cluster Lifecycle
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Set OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.9.22"
ocp4_installer_root_url: "http://d3s3zqyaz8cp2d.cloudfront.net/pub/openshift-v4/clients"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
cloudformation_retries: 0

bastion_instance_image: RHEL84GOLD-latest
master_instance_type_family: m5
master_instance_type_size: 4xlarge

# -------------------------------------------------------------------
# Number of VMs
# -------------------------------------------------------------------
master_instance_count: 1
worker_instance_count: 0

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacm

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 2
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_rhacm_catalog_source_tag: v4.9_2022_03_07
ocp4_workload_rhacm_acm_channel: release-2.4

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name
    region: aws_region

__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    display_name: Advanced Cluster Management Hands on with RHACM - Cluster Lifecycle
    keywords:
    - labs
    - acm
    - ocp4
    - lifecycle
    category: Labs
    multiuser: true
  secrets:
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - name: output-dir-s3
    namespace: gpte
