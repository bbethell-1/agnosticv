    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    virtualenv: aws-ansible-2.9
    git_tag_prefix: sandbox-test
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
