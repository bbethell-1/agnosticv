---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-4.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# --- Catalog Item: TAP Workshop
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# --- Student user
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
# showroom_git_repo: https://github.com/burrsutter/rhtap-demo.git
showroom_git_repo: https://github.com/redhat-gpe/showroom-tap-workshop.git
showroom_git_ref: main

showroom_user_password: "{{ tap_qa_cluster_provision_data.bastion_ssh_password }}"
showroom_ssh_host: "{{ tap_qa_cluster_provision_data.bastion_public_hostname }}"
showroom_host: "{{ tap_qa_cluster_provision_data.bastion_public_hostname }}"
showroom_ssh_method: sshkey
showroom_ssh_username: lab-user
showroom_default_ssh_user: lab-user
showroom_lab_users:
- lab-user

showroom_tab_tty1_title: "TAP Development Cluster"
showroom_tab_tty1_username: "{{ tap_developer_cluster_provision_data.bastion_ssh_user_name }}"
showroom_tab_double_tty_top_username: "{{ tap_developer_cluster_provision_data.bastion_ssh_user_name }}"

showroom_tab_tty2_title: "TAP QA CLuster"
showroom_tab_tty2_username: "{{ tap_qa_cluster_provision_data.bastion_ssh_user_name }}"
showroom_tab_double_tty_bottom_username: "{{ tap_qa_cluster_provision_data.bastion_ssh_user_name }}"
showroom_tab_services:
- double_tty

# -------------------------------------------------------------------
# Export userinfo variables to showroon
# -------------------------------------------------------------------
export_tap_developer_cluster_vars_to_showroom:
- rhdh_id_provider
- rhdh_url
- rhdh_user
- rhdh_user_password
- bastion_public_hostname
- bastion_ssh_user_name
- bastion_ssh_password
- devspaces_url
- devspaces_user
- devspaces_user_password
- gitlab_user
- gitlab_user_password
- openshift_cluster_ingress_domain
- sonarqube_url
- sonarqube_username
- sonarqube_password

export_tap_qa_cluster_vars_to_showroom:
- acs_portal_password
- acs_portal_username
- acs_route
- api_url
- bastion_public_hostname
- bastion_ssh_user_name
- bastion_ssh_password
- openshift_cluster_admin_password
- openshift_cluster_admin_username
- web_console_url
- openshift_cluster_ingress_domain

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: multi
env_type: tap-workshop-binder

__meta__:
  asset_uuid: 1C0E09EE-8AC0-46F7-92D5-C7013661503B
  anarchy:
    namespace: babylon-anarchy-3
  catalog:
    workshopUiDisabled: true # this should never be ran as a workshop
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      Enhancing Developer Efficiency and Security with Trusted Application Pipeline
    category: Workshops
    keywords:
    - rhtap
    - rhdh
    - secure-supply-chain
    - tssc
    - tas
    - tpa
    - tap
    - trusted-secure-supply-chain
    - trusted-application-signer
    - trusted-application-pipeline
    - trsuted-profile-analyzer
    - rh1
    - rh12025
    - rh1lab8
    - rh12025lab8
    labels:
      Product: Red_Hat_Trusted_Application_Pipeline
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: always
  # -------------------------------------------------------------------
  # Components to include in template and catalog item
  # -------------------------------------------------------------------
  components:
  - name: tap_developer_cluster
    display_name: "A-Enhancing Developer Efficiency and Security with Trusted Application Pipeline"
    item: sandboxes-gpte/enhancing-developer-a
    propagate_provision_data:
    - var: tap_developer_cluster_provision_data
  - name: tap_qa_cluster
    display_name: "B-Enhancing Developer Efficiency and Security with Trusted Application Pipeline"
    item: sandboxes-gpte/enhancing-developer-b
    propagate_provision_data:
    - var: tap_qa_cluster_provision_data
