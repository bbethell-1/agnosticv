---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

__meta__:
  deployer:
    scm_ref: vp-ocaas
    scm_url: https://github.com/dminnear-rh/agnosticd.git
  catalog:
    parameters:
    - name: validated_pattern_param
      description: Pattern to deploy
      formLabel: Pattern
      required: true
      openAPIV3Schema:
        type: string
        default: Multicloud Gitops
        enum:
        - Multicloud Gitops
        - Retail
        - Medical Diagnosis
        - Industrial Edge
        - TravelOps
        - VP Operator ONLY
        - Omnicloud as a Service
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: true
      openAPIV3Schema:
        type: string
        default: '4.20'
        enum:
        - '4.18'
        - '4.19'
        - '4.20'
      annotation: demo.redhat.com/ocp-version
      variable: ocp4_installer_version
