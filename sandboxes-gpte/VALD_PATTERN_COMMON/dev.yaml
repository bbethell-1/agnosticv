---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

__meta__:
  catalog:
    parameters:
      - name: validated_pattern_param
        description: Pattern to deploy
        formLabel: Pattern
        required: true
        openAPIV3Schema:
          type: string
          default: Multicloud Gitops
          enum:
            - Multicloud Gitops
            - Retail
            - Medical Diagnosis
            - Industrial Edge
            - TravelOps
            - VP Operator ONLY
      - name: ocp4_installer_version
        description: Version of OpenShift to Install
        formLabel: OpenShift Version
        required: false
        openAPIV3Schema:
          type: string
          default: '4.20'
          enum:
            - '4.16'
            - '4.17'
            - '4.18'
            - '4.19'
            - '4.20'
        annotation: demo.redhat.com/ocp-version
        variable: ocp4_installer_version
  deployer:
    scm_ref: development
    scm_url: https://github.com/redhat-cop/agnosticd.git
