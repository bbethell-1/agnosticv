---
# -------------------------------------------------------------------
# --- Catalog: Validated Patterns
# --- Catalog Item: Validated Pattern Common
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-validated-pattern.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-5-ocp-multi.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml


#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
cloudformation_retries: 0

master_instance_type: m5.2xlarge
worker_instance_type: "{{ 'm5.2xlarge' if validated_pattern_param == 'Multicloud Gitops' else 'm5.4xlarge' }}"
bastion_instance_type: t3.medium
bastion_instance_image: RHEL94GOLD-latest

# -------------------------------------------------------------------
# Number of VMs
# worker_instance_count from Catalog Item
# -------------------------------------------------------------------
master_instance_count: 3
worker_instance_count: "{{ 4 if validated_pattern_param == 'Industrial Edge' else 3 }}"

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:16] }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_validated_pattern_deploy

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_validated_pattern_deploy
# -------------------------------------------------------------------

ocp4_workload_validated_pattern_deploy_display_name: "{{ validated_pattern_param }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 9F1CD5FC-1D56-48F7-BD99-8687F2E742EB
  owners:
    maintainer:
    - name: Akos Eros
      email: aeros@redhat.com

  anarchy:
    namespace: babylon-anarchy-3
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
    - name: validated_pattern_param
      description: Pattern to deploy
      formLabel: Pattern
      required: true
      openAPIV3Schema:
        type: string
        default: Multicloud Gitops
        enum:
        - Multicloud Gitops
        - Retail
        - Medical Diagnosis
        - Industrial Edge
        - TravelOps
        - VP Operator ONLY
        - Omnicloud as a Service
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: true
      openAPIV3Schema:
        type: string
        default: '4.21'
        enum:
        - '4.19'
        - '4.20'
        - '4.21'
      annotation: demo.redhat.com/ocp-version
      variable: ocp4_installer_version
    keywords:
    - demos
    - openshift
    - ocp
    - validated-pattern
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    display_name: Validated Pattern
    category: Demos
