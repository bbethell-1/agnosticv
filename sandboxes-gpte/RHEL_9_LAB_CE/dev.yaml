---
#include /includes/secrets/demosat-rhel-9-lab.yaml


purpose: dev

migration_key_path: "{{ ansible_ssh_private_key_file | default('') }}"
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel9-workshop
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: RHEL93GOLD-latest
node_instance_image: RHEL93GOLD-latest
leap_instance_image: RHEL86GOLD-latest
set_repositories_rhel8_lock_release: '8.6'
set_repositories_rhel9_lock_release: '9.3'

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/RHEL9-Workshop-Showroom.git
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_stacked_terminals_enable: true
ocp4_workload_showroom_stacked_terminals_display_name: "Terminals"
showroom_deploy_shared_cluster_enable: true

bastion_ssh_command: "ssh {{ ansible_service_account_user_name }}@{{ bastion_public_hostname }}"
bastion_ssh_user_name: "{{ student_name }}"
bastion_ssh_password: "{{ student_password }}"
bastion_public_hostname: "{{ groups['bastions'][0] | regex_replace('\\..*$') }}.{{ guid }}{{ subdomain_base_suffix }}"

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user
key_name: ""
student_name: student
install_student_user: true
admin_user: opentlc-mgr

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: af49bf47-fe6c-45e1-971b-3f6e51b5cdfd
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: The Definitive RHEL 9 Hands-On Lab v9.1
    category: Demos
    keywords:
      - rhel9
      - leap
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
      Featured_Score: '70'
    parameters: []
  deployer:
    scm_url: https://github.com/xtophd/agnosticd.git
    scm_ref: rhel93-workshop-2024
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
