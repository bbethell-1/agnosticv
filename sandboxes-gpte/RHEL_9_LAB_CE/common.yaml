---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/showroom-shared-cluster1.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel9-workshop
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: RHEL93GOLD-latest
node_instance_image: RHEL93GOLD-latest
leap_instance_image: RHEL86GOLD-latest
set_repositories_rhel8_lock_release: '8.6'
set_repositories_rhel9_lock_release: '9.3'

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/RHEL9-Workshop-Showroom.git
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_stacked_terminals_enable: true
ocp4_workload_showroom_stacked_terminals_display_name: "Terminals"
showroom_deploy_shared_cluster_enable: true

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user
key_name: ""
student_name: student
install_student_user: true
admin_user: opentlc-mgr

bastion_ssh_password: "{{ student_password }}"
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: af49bf47-fe6c-45e1-971b-3f6e51b5cdfd
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: The Definitive RHEL 9 Hands-On Lab v9.1
    category: Demos
    keywords:
      - rhel9
      - leap
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
      Featured_Score: '70'
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
