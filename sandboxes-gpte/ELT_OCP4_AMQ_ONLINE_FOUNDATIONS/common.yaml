---
# --- OpenShift 4 Operators Foundations Lab
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Operators Foundations Lab (OpenStack)
# --- ELT: OpenShift 4 Operators Foundations

# --- Platform
platform: labs

# --- Config
env_type: ocp4-cluster

# OpenShift Installer Version
ocp4_installer_version: "4.4.3"
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

run_janitor: false
cloudformation_retries: 0

# Satellite
use_content_view: true

# Update RHEL to the latest packages (and reboot)
update_packages: true

# --- Generic Variables
install_ipa_client: false

# --- This is a Lab Environment -> Install FTL
install_ftl: true

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: ocp_student

# Create 10 users
ocp4_workload_authentication_htpasswd_user_count: 10

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication

# --- Student Workloads (YAML List)
student_workloads: []

# --- AgnosticV Meta variables
agnosticv_meta:
  virtualenv: aws-ansible-2.9
  params_to_variables:
    nodecount: worker_instance_count_ignored
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
  secrets:
    # OpenShift Pull Secret
    - ocp4_token
    - gpte
