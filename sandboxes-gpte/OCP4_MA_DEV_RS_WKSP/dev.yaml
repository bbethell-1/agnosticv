ocp4_workload_openshift_data_foundation_old_default_storage_class_name: gp3-csi
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: v4.13_2023_06_26
ocp4_workload_gitea_operator_gitea_image_tag: "v2.0.1"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.13_2023_06_26
ocp4_workload_kubevirt_catalog_snapshot_image_tag: v4.13_2023_06_26
ocp4_workload_mta6_catalogsource_image_tag: v4.13_2023_09_11
ocp4_workload_mtv_catalog_snapshot_image_tag: v4.13_2023_06_26
ocp4_workload_codeserver_image_tag: v4.14.1-java11
ocp4_workload_codeserver_init_image_tag: v4.14.1
ocp4_workload_codeserver_storageclass: ocs-storagecluster-ceph-rbd

ocp4_workload_mta6_channel: stable-v6.2
ocp4_workload_mta6_seed_tag: release-0.2
