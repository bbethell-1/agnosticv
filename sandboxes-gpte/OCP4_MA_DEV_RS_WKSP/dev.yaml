ocp4_workload_rhacs_install_operator_catalog_source_tag: v4.12_2023_02_27

# -------------------------------------------------------------------
# Updates to include module 6 in deployment and menu
# -------------------------------------------------------------------
ocp4_workload_mad_roadshow_guides_module_type: "{{ module_type }}"
ocp4_workload_mad_roadshow_guides_module_titles:
- name: m1
  title: "Assessment and Analysis"
  path: "/{{ ocp4_workload_mad_roadshow_guides_repo_name_prefix }}-m1/main/1-introduction.html"
- name: m2
  title: "Refactor and Deployment"
  path: "/{{ ocp4_workload_mad_roadshow_guides_repo_name_prefix }}-m2/main/1-introduction.html"
- name: m3
  title: "Enable CI/CD Pipeline and GitOps"
  path: "/{{ ocp4_workload_mad_roadshow_guides_repo_name_prefix }}-m3/main/1-introduction.html"
- name: m4
  title: "Manage and Secure APIs"
  path: "/{{ ocp4_workload_mad_roadshow_guides_repo_name_prefix }}-m4/main/introduction.html"
- name: m5
  title: "Build Event-driven Architecture"
  path: "/{{ ocp4_workload_mad_roadshow_guides_repo_name_prefix }}-m5/main/introduction.html"
- name: m6
  title: "Create an Intelligent Application"
  path: "/{{ ocp4_workload_mad_roadshow_guides_repo_name_prefix }}-m6/main/1-introduction.html"

module_type: >-
  {{
    ";".join(
      (["m1"] if module_enable_m1 | default(false) | bool else []) +
      (["m2"] if module_enable_m2 | default(false) | bool else []) +
      (["m3"] if module_enable_m3 | default(false) | bool else []) +
      (["m4"] if module_enable_m4 | default(false) | bool else []) +
      (["m5"] if module_enable_m5 | default(false) | bool else []) +
      (["m6"] if module_enable_m6 | default(false) | bool else [])
    )
  }}


# -------------------------------------------------------------------

# Custom collections for this environment
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 2.3.0
  - name: community.general
    version: 6.4.0
  - name: ansible.posix
    version: 1.5.1
  - name: ovirt.ovirt
    version: 3.1.1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  params_to_variables:
    course_module_list: ocp4_workload_mad_roadshow_guides_module_type

__meta__:
  catalog:
    workshopUiDisabled: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    parameters:
    - name: module_enable_m1
      description: Enable module m1
      formGroup: Modules
      formLabel: Module 1 - Assessment and Analysis
      openAPIV3Schema:
        type: boolean
        default: true
    - name: module_enable_m2
      description: Enable module m2
      formGroup: Modules
      formLabel: Module 2 - Refactor and Deployment
      openAPIV3Schema:
        type: boolean
        default: true
    - name: module_enable_m3
      description: Enable module m3
      formGroup: Modules
      formLabel: Module 3 - Enable CI/CD Pipeline and GitOps
      openAPIV3Schema:
        type: boolean
        default: true
    - name: module_enable_m4
      description: Enable module m4
      formGroup: Modules
      formLabel: Module 4 - Manage and Secure APIs
      openAPIV3Schema:
        type: boolean
        default: true
    - name: module_enable_m5
      description: Enable module m5
      formGroup: Modules
      formLabel: Module 5 - Build Event-driven Architecture
      openAPIV3Schema:
        type: boolean
        default: true
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 40
      validation: >-
        num_users <= 2 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than TWO requires a valid SalesForceID')
    keywords: []
    labels:
      Provider: Hybrid_Platform_BU
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Featured_Score: '64'
    display_name: Modern App Dev Roadshow - Dev Track
    category: Demos
  deployer:
    scm_ref: development
