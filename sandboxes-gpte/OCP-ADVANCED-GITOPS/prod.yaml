---
# ------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# ------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# Showroom Variables
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: v1.0.3

# ------------------------------------------------------------------
# Git revision to use for the deploying the workshop GitOps
# Applications. This enables the apps to be pinned to a specific
# branch or revision enabling development and promotion without
# impacting higher environments.
#
# AgonsticD for this workshop uses this variable.
# ------------------------------------------------------------------
gitops_revision: "{{ ocp4_workload_showroom_content_git_repo_ref }}"

# -------------------------------------------------------------------
# Passthrough variables
# -------------------------------------------------------------------
ocp4_workload_showroom_passthrough_user_data: true
agnosticd_passthrough_user_data:
  gitops_revision: "{{ gitops_revision }}"

# ------------------------------------------------------------------
# Babylon meta variables
# ------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: advance-gitops-0.0.4
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
