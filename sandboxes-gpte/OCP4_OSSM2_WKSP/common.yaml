---
#include /includes/catalog-icon-service-mesh.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml

# --- OpenShift 4.x Workshop
# --- Catalog: Multi-Product Demo
# --- Catalog Item: OpenShift 4 OpenShift Service Mesh 2 Workshop
# --- CODENAME: OCP4_3SAM_OSSM_DEMO
# --- Demo Owners as of July 1, 2021: Jaeyoung Kang, Jason Dudash

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
ocp4_installer_version: "4.6.48"
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# Satellite vars
repo_method: satellite

# -------------------------------------------------------------------
# OpenShift Cluster Customization
# -------------------------------------------------------------------

# Do not run any infrastructure customization.
# This will result in a default OpenShift 4 installation.

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
# Activate the use of self-signed certificates
ocp4_workload_le_certificates_install_certificates: true
ocp4_workload_le_certificates_install_api: false

# Create HTPASSWD users
num_users: "{{ user_count }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_le_certificates
- ocp-workload-terminal
- ocp4_workload_servicemesh_workshop

# Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# agnosticv_meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  params_to_variables:
    nodecount: ''
    num_users: user_count
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 Service Mesh 2 Workshop
    category: Workshops
    keywords: []
    labels:
      #OpenShift_Version: "4.6"
      Product: Red_Hat_OpenShift_Service_Mesh
      Product_Family: Red_Hat_Cloud
      Provider: PFE
    parameters:
    - name: user_count
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 100
      validation: >-
        user_count == 1 ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - name: satellite-rhel81
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
