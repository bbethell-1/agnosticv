---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration (3 Node Cluster of only Masters)
# -------------------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.xlarge
worker_instance_count: 3
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL81GOLD

# -------------------------------------------------------------------
# Test deployments of this workshop on a newer OCP version
# -------------------------------------------------------------------
# OpenShift Installer Version
ocp4_installer_version: "4.6.25"

# Use a catalog snapshot instead of whatever the latest is
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_acm_release: "release-2.2"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.2.2"
ocp4_workload_rhacm_catalog_source_tag: "v4.6_2021_04_26"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
