---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: test
cloudformation_retries: 0

# -------------------------------------------------------------------
# VM configuration (3 Node Cluster of only Masters)
# -------------------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.xlarge
worker_instance_count: 3
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL81GOLD

# agnosticv_meta to deploy with babylon
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
# -------------------------------------------------------------------
# babylon meta for test
# -------------------------------------------------------------------
__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    scm_ref: ocp4-acm-aiedge-prod-0.1
  secrets:
  - namespace: gpte
    name: gpte
  - name: ocp4-token
    namespace: gpte
