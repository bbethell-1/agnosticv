# --------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: Hands-On with OpenShift 4.10
# --- ELT: Hands-On with OpenShift 4.10
# --------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
agnosticd_open_environment: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.13"
#ocp4_installer_root_url: "http://admin.na.shared.opentlc.com/pub/openshift-v4/aarch64/clients"

# ocp4_installer_use_dev_preview: true
# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates


# -------------------------------------------------------------------
# VM configuration (1 Node Cluster of c5n.metal)
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest
master_instance_type_family: c5n
master_instance_type_size: metal
master_instance_count: 1
worker_instance_count: 0

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 10
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: ceafc5a9-9981-4e1f-b7fe-391baec73cf0
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.15
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Power Monitoring Red Hat OpenShift 4.13
    category: Labs
    keywords:
    - lab
    - openshift
    - ocp
    - ocp413
    - kepler
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: satellite-ocp-rhel
    namespace: gpte
