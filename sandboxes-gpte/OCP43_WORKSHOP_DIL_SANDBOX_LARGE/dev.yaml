---
purpose: development

ocp4_installer_version: "4.6.18"
osrelease: 4.6.0

master_instance_type: "{{ 'm5.xlarge' if worker_instance_count|int <= 10 else 'm5.2xlarge' if worker_instance_count|int <= 20 else 'm5.4xlarge' }}"
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ (worker_instance_count_cf | int * 1.4) | int }}"
bastion_instance_type: t3.medium

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 6
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
