---
platform: RHPDS

env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.6.18"
osrelease: 4.6.0
repo_method: file

cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

install_student_user: true

install_idm: htpasswd
admin_user: admin
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift

infra_workloads:
  - ocp4_workload_le_certificates
  - ocp4-workload-dil-streaming

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    type: agnosticd
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: rhte-tower
      namespace: gpte
