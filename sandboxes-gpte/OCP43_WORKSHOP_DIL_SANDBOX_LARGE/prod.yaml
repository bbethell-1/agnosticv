---
purpose: production
cloudformation_retries: 0

ocp4_installer_version: "4.5.18"
osrelease: 4.5.0

master_instance_type: "{{ 'm5.xlarge' if worker_instance_count|int <= 10 else 'm5.2xlarge' if worker_instance_count|int <= 20 else 'm5.4xlarge' }}"
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ (worker_instance_count_cf | int * 1.4) | int }}"
bastion_instance_type: t3.medium

install_lets_encrypt_certificates: true

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  agnosticd_git_tag_prefix: ocp4-workshop-dil-prod
