---
purpose: development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
worker_instance_count: "{{ [(num_users_cf | int / 3) | round(0, 'ceil') | int, 3] | max }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users_cf | default('1')) | int }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: serverless-ml
    scm_url: https://github.com/theckang/agnosticd
