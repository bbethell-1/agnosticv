---
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-5-ocp-multi.yaml
#include /includes/parameters/enable-lets-encrypt.yaml


#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# Rock, Paper, Scissors! An AI-powered Interactive Game
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6a.4xlarge
master_instance_count: 3
master_storage_type: io1
master_storage_size: 250

worker_instance_type: m6a.8xlarge
worker_instance_count: "{{ [(num_users | int / 2.7) | round(0, 'ceil') | int, 4] | max }}"
worker_storage_type: gp3
worker_storage_size: 250

bastion_instance_type: t2.small
bastion_instance_image: RHEL95GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.1"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_openshift_gitops
  - ocp4_workload_pipelines
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_authorino
  - ocp4_workload_openshift_ai
  - ocp4_workload_gitea_operator
  - ocp4_workload_web_terminal
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_02_24

# -------------------------------------------------------------------
# Common passwords
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: true
ocp4_workload_cert_manager_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_cert_manager_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_cert_manager_starting_csv: cert-manager-operator.v1.15.0
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -----------------------------------
# ocp4_workload_openshift_data_foundation
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.17
ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_gitops_starting_csv: openshift-gitops-operator.v1.15.0-0.1738074324.p

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_update_resources: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# ---------------------------------------------------------
# ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.17

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.17.1

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_serverless_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_serverless_starting_csv: serverless-operator.v1.35.0

ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# ocp4_workload_ossm
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: elasticsearch-operator.v5.8.17

ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: jaeger-operator.v1.62.0-2

ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: kiali-operator.v1.89.9

ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: servicemeshoperator.v2.6.5

# ------------------------------------------------
# ocp4_workload_authorino
# ------------------------------------------------
ocp4_workload_authorino_operator_channel: tech-preview-v1
ocp4_workload_authorino_operator_use_catalog_snapshot: true
ocp4_workload_authorino_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authorino_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authorino_operator_catalogsource_name: redhat-operators-snapshot-authorino
ocp4_workload_authorino_operator_starting_csv: authorino-operator.v1.1.1

# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable
ocp4_workload_openshift_ai_use_catalog_snapshot: true
ocp4_workload_openshift_ai_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_ai_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_ai_starting_csv: rhods-operator.2.16.1

ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_modelregistry: Managed

# -------------------------------------------------------------------
# ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_starting_csv: gitea-operator.v2.1.0

ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.21.11"
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel9/postgresql-13
ocp4_workload_gitea_operator_postgresql_image_tag: 1-165

ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ ocp4_workload_user_count }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_htpasswd_user_base }}%d"
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_admin_password: "{{ common_admin_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/redhat-gpte-devopsautomation/rps-game-manifests.git
    name: rps-game-manifests
    private: false
  - repo: https://github.com/redhat-developer-demos/rps-game.git
    name: rps-game
    private: false

# -------------------------------------------------------------------
# ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_use_catalog_snapshot: true
ocp4_workload_web_terminal_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_web_terminal_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_web_terminal_starting_csv: web-terminal.v1.12.1

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/redhat-gpte-devopsautomation/rps-game-manifests.git
ocp4_workload_gitops_bootstrap_repo_revision: v1.0.1
ocp4_workload_gitops_bootstrap_repo_path: bootstrap/rhdp

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ ocp4_workload_user_count }}"
    prefix: "{{ ocp4_workload_user_base }}"
  argocd:
    git:
      url: https://github.com/redhat-gpte-devopsautomation/rps-game-manifests.git
      revision: v1.0.1
  workspace:
    git:
      url: https://github.com/redhat-gpte-devopsautomation/rps-game-manifests.git
      revision: v1.0.1

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-scholars/rps-ai-tutorial.git
ocp4_workload_showroom_content_git_repo_ref: kubecon-eu-2025
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: 1.3.3
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 725e14d2-ff6a-4e5d-a078-010ba0da071d
  anarchy:
    namespace: babylon-anarchy-5
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  catalog:
    reportingLabels:
      primaryBU: Artificial_Intelligence
    display_name: "Rock, Paper, Scissors! An AI-powered Interactive Game"
    namespace: babylon-catalog-{{ stage | default('?') }}
    category: Workshops
    multiuser: true
    keywords: []
    labels:
      Provider: Hybrid_Platform_BU
      Platform: AI
      TDP1: AI_Platform
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 50
