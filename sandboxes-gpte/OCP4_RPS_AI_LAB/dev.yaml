---
# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
# ocp4_installer_version: "4.18"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_health_retries: 5
ocp4_workload_gitops_bootstrap_repo_revision: main

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ ocp4_workload_user_count }}"
    prefix: "{{ ocp4_workload_user_base }}"
  argocd:
    git:
      url: https://github.com/redhat-gpte-devopsautomation/rps-game-manifests.git
      revision: main

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development


# TODO CHECK if api certs are needed
ocp4_workload_cert_manager_install_api_certificates: false
