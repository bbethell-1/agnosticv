---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Override OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.6.18"

# -------------------------------------------------------------------
# Override Repo Version
# ------------------------------------------------------------------
osrelease: 4.6.0
repo_version: '4.6.0'

cloudformation_retries: 0

# -------------------------------------------------------------------
# VM configuration (3 Node Cluster of only Masters)
# -------------------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.xlarge
worker_instance_count: 3
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL81GOLD

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhte-ocp4
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
