---
#include /includes/catalog-icon-amq.yaml
# -------------------------------------------------------------------
# --- Catalog: Application Services Workshop
# --- Catalog Item: DIL Streaming Event-driven Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------

master_instance_type: "{{ 'm5.xlarge' if worker_instance_count|int <= 10 else 'm5.2xlarge'\
  \ if worker_instance_count|int <= 20 else 'm5.4xlarge' }}"
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max\
  \ }}"
bastion_instance_type: t3.medium

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.6.18"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4-workload-dil-streaming

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------

install_student_user: true
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
num_users: "{{ user_count }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name
    num_users: user_count

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: aws_region
      - name: student_name
      - name: user_count
        description: Number of users to provision for infrastructure deployment.
        openAPIV3Schema:
          default: 1
          type: integer
          minimum: 1
          maximum: 50
    keywords: []
    labels:
      Provider: Application_Services_BU
      Product: Red_Hat_AMQ
      Product_Family: Red_Hat_Application_Services
      #OpenShift_Version: '4.6'
    display_name: DIL Streaming Event-driven Workshop
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: rhte-tower
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
