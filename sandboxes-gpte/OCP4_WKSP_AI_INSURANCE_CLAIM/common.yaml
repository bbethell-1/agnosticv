---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-nvidia.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/demosat-rhel-9-lab.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Workshop : Streamline insurance claims with Openshift AI
# -------------------------------------------------------------------
# Workshop - Streamline insurance claims with Openshift AI

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
#bastion_instance_image: RHEL84GOLD-latest
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPPublic
        description: "HTTP public for Let's Encrypt verification"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPSPublic
        description: "HTTPS public for VSCode Server"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.13.9"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 2
worker_instance_type: m5.2xlarge

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: community.okd
      version: 2.3.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication # all segments
  - ocp4_workload_machinesets
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_rhods_self_managed
  - ocp4_workload_web_terminal
  - ocp4_workload_le_certificates # all segments
  - ocp4_workload_showroom

# Workload variables #
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.12_2023_07_03

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: false

# Add a MachineSet for AWS Bare Metal instances
# To add another group of worker nodes - with autoscaling enabled add
# the following:
#
ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    autoscale: true
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 3
    role: worker-gpu
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule
    instance_type: "g5.2xlarge"

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: openshift-nfd
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: "nfd.4.12.0-202307182142"
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""

# ------------------------------------------------
# NVIDIA GPU Operator
# ------------------------------------------------
nvidia_gpu_operator_namespace: nvidia-gpu-operator
nvidia_gpu_operator_channel: v23.6
nvidia_gpu_operator_automatic_install_plan_approval: true
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v23.6.0
nvidia_gpu_operator_wait_for_deploy: true
nvidia_gpu_operator_use_catalog_snapshot: false
nvidia_gpu_operator_catalogsource_name: ""
nvidia_gpu_operator_catalog_snapshot_image: ""
nvidia_gpu_operator_catalog_snapshot_image_tag: ""

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_self_managed
# -------------------------------------------------------------------
ocp4_workload_rhods_self_managed_operator_group_name: "rhods-ods-operator"
ocp4_workload_rhods_self_managed_operator_name: "rhods-operator"
ocp4_workload_rhods_self_managed_namespace: "redhat-ods-operator"
ocp4_workload_rhods_self_managed_channel: "stable"
ocp4_workload_rhods_self_managed_catalogsource_setup: false
ocp4_workload_rhods_self_managed_installPlanApproval: "Automatic"
ocp4_workload_rhods_self_managed_source: "redhat-operators"
ocp4_workload_rhods_self_managed_sourceNamespace: "openshift-marketplace"
ocp4_workload_rhods_self_managed_csv_nameprefix: "rhods-operator"
ocp4_workload_rhods_self_managed_startingCSV: "rhods-operator.1.33.0"
ocp4_workload_rhods_self_managed_namespace_list:
  - "{{ ocp4_workload_rhods_self_managed_namespace }}"
ocp4_workload_rhods_self_managed_applications_namespace: "redhat-ods-applications"
ocp4_workload_rhods_self_managed_is_workshop: false
ocp4_workload_rhods_self_managed_workshop_num_users: "{{ num_users }}"
ocp4_workload_rhods_self_managed_workshop_username_base: "user"
ocp4_workload_rhods_self_managed_workshop_password: "{{ common_password }}"

# For ocp4_workload_le_certificates
# Install certificates for Ingress Controllers
ocp4_workload_le_certificates_install_certificates: true

# Install certificates for API Endpoint
ocp4_workload_le_certificates_install_api: true

# Option allow continue without certificates on failure
ocp4_workload_le_certificates_failure_is_fatal: true

# It takes about 4 minutes per API Server to
# restart with certificates (due to AWS
# Load Balancer). Therefore sleep
# 12 minutes by default to give the kube-apiserver
# cluster operator enough time to progress.
# Wait time may be extended if it's needed
ocp4_workload_le_certificates_wait_after_cert_setup: 12

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.10

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.12_2023_02_20

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
# showroom_deploy: true
# showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/showroom-insurance-claim-openshiftai.git
# showroom_git_ref: main
# showroom_var_inject: true
# showroom_ssh_method: sshkey
# showroom_ssh_username: "{{ student_name }}"
# showroom_default_ssh_user: "{{ student_name }}"
# showroom_ssh_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
# showroom_lab_users:
#   - "{{ student_name }}"
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/redhat-gpte-devopsautomation/showroom-insurance-claim-openshiftai.git

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.1
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.20.0
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true
ocp4_workload_gitea_operator_gitea_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_postgresql_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_webhook_allowed_hosts_list: 'external,private'
ocp4_workload_gitea_operator_webhook_skip_tls_verify: false
#install_operator_namespace: gitea-operator
#install_operator_catalogsource_namespace: gitea-operator
ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: lab-user
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/rh-aiservices-bu/insurance-claim-processing
    name: insurance-claim-processing
    private: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ""

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 1304e3f7-2ccd-234d-86f9-f56cccc30d3a
  access_control:
    allow_groups:
      - rhpds-devs
      - rhpds-devs-rh1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      Streamline insurance claims with Openshift AI
    category: Demos
    keywords:
      - workshop
      - openshift
      - ocp
      - ocp412
      - ods
      - datascience
      - rhods
      - object
      - detect
      - retail
    multiuser: true
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
      - name: worker_instance_count
        description: OpenShift Worker Node Instance Count
        formLabel: Worker Node Instance Count
        openAPIV3Schema:
          type: integer
          default: 2
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
      - name: worker_instance_type
        description: OpenShift Worker Node Instance Type
        formLabel: Worker Node Instance Type
        openAPIV3Schema:
          type: string
          default: m5.2xlarge
          enum:
            - m5.2xlarge
            - m5.4xlarge
    labels:
      Product: Red_Hat_OpenShift_Data_Science
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: rhods-git-secret
    #  - namespace: gpte
    #    name: satellite-rhel81-ha
    - namespace: gpte
      name: output-dir-s3
