---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-service-mesh.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 3

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.10.12

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_lpe_servicemesh

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1! (autogenerated when not specified)
ocp4_workload_authentication_htpasswd_user_base: user
# ocp4_workload_authentication_htpasswd_user_password: openshift (autogenerated when not specified)
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('3') }}"
ocp4_workload_authentication_remove_kubeadmin: true

# --------------------------------
# Red Hat OpenShift Service Mesh
# --------------------------------

# Installs a basic Service Mesh Control Plane
ocp4_workload_lpe_servicemesh_smcp_install: true
ocp4_workload_lpe_servicemesh_smcp_namespace: istio-system

# All operators defaults
ocp4_workload_lpe_servicemesh_channel: stable
ocp4_workload_lpe_servicemesh_starting_csv: ""
ocp4_workload_lpe_servicemesh_auto_approval: true
ocp4_workload_lpe_servicemesh_use_catalog_snapshot: false
ocp4_workload_lpe_servicemesh_catalogsource_name: redhat-operators-snapshot-servicemesh
ocp4_workload_lpe_servicemesh_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_lpe_servicemesh_catalog_snapshot_image_tag: "v4.10_2022_05_09"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    display_name: LPE Red Hat OpenShift Service Mesh
    keywords:
    - Red Hat OpenShift Service Mesh
    - OSSM
    - Service Mesh
    - Latest
    category: Workshops
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
