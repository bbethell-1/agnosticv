---
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/student-name.yaml
#include /includes/parameters/student-email.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: sandbox
agnosticd_open_environment: True

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  ansible_additional_args: --skip-tags create_ssh_config
  nuke_sandbox: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product: Red_Hat_OPEN_Environment
      Provider: RHPDS
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
      - name: sandbox_user_info_messages_enable
        description: Allow chain configs to control sandbox_user_info_messages_enable
        required: true
        formHideCondition: true == true
        openAPIV3Schema:
          type: boolean
          default: true
          enum:
            - true
            - false
  lifespan:
    default: 7d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
