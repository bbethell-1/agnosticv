---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/aws-regions-standard.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: sandbox
agnosticd_open_environment: true
sandbox_user_info_messages_enable: true

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0e2f3912-ee24-4708-b903-89faf74ba93d
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      stop:
        disable: true
      start:
        disable: true
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      Provider: RHDP
    parameters: []
