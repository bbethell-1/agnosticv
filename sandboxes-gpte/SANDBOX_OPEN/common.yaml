---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: sandbox
agnosticd_open_environment: True
sandbox_user_info_messages_enable: true

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  ansible_additional_args: --skip-tags create_ssh_config
  nuke_sandbox: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0e2f3912-ee24-4708-b903-89faf74ba93d
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      Provider: RHDP
    parameters: []
  lifespan:
    default: 7d
    maximum: 365d
    relativeMaximum: 365d
  runtime:
    default: 10h
    maximum: 365d
