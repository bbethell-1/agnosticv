---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/parameters/student-email.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/catalog-icon-aws.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: sandbox
# agnosticd_open_environment: True

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  ansible_additional_args: --skip-tags create_ssh_config
  nuke_sandbox: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product: Amazon_Web_Services
    parameters: []
  lifespan:
    default: 7d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
