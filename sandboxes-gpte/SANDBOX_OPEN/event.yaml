---
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/ansible_control_plane/event_controller.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  catalog:
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 100
      resourceIndexes:
      - 0
      - 1
      validation: >-
        num_users == 2 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than two requires a valid SalesForceID.')
  deployer:
    scm_ref: open-env-aws-blank-1.5
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
