---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud-rosa.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

agnosticd_open_environment: false
sandbox_user_info_messages_enable: false
aws_region: us-east-2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# instance types
bastion_instance_type: t3a.small

bastion_instance_image: RHEL92GOLD-latest
sandbox_enable_ui: false

repo_method: satellite
update_packages: true

# Extra packages to install
common_extra_packages:
- java-11-openjdk-devel
- tzdata-java
- maven

# ------------------------------------------------------
# Bastion user
# ------------------------------------------------------
bastion_user_name: rosa
bastion_user_enable_sudo: false
bastion_user_password: ""
bastion_user_password_length: 16

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
# Hardcode installer until `latest` is fixed
rosa_installer_version: "1.2.31"
rosa_deploy: true
rosa_deploy_hcp: false
# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade
# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: "openshift-v4.14"

# ROSA Cluster Settings
# If these are not specified the defaults are used
# If they are specified they have to be set to a supported value
# Default is m5.xlarge. m6a are a bit cheaper
rosa_compute_machine_type: m6a.xlarge

# Set up a cluster admin for ROSA
# And log in that cluster admin for {{ ansible_user }} on the bastion
rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

# Lock the security group for the bastion to allow SSH only from
# the bastion itself (and podman containers on it)
rosa_lock_bastion_security_group: true

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/showroom-rosa-ops-hoe.git
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
- "{{ bastion_user_name }}"

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_rosa_policies

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Workload: ocp4_workload_rosa_policies
# -------------------------------------------------------------------
ocp4_workload_rosa_policies_rhel_user_name: "{{ bastion_user_name }}"
ocp4_workload_rosa_policies_aws_user_name: rosa-student
ocp4_workload_rosa_policies_to_apply:
- rosa-student
- microsweeper
- cloudwatch

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3f499cac-d1e0-40eb-8b9d-b45aa7a4a439
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      provision:
        time_estimate: 50m
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Ops Hands-on Experience
    category: Labs
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '68'
    messageTemplates:
      provisionFailed:
        emailSubject: Your ROSA hands-on experience cluster request has failed
      provisionStarted:
        disable: true
      retirementScheduled:
        emailSubject: Your ROSA hands-on experience environment is expiring soon
        timeIntervalBeforeRetirement: 1h
      serviceDeleted:
        emailSubject: Your ROSA hands-on experience has ended
      serviceReady:
        emailSubject: Your ROSA hands-on experience is ready to access
      startComplete:
        disable: true
      startFailed:
        disable: true
      stopComplete:
        disable: true
      stopFailed:
        disable: true
      stopScheduled:
        disable: true
    multiuser: false
    parameters:
    - name: rosa_deploy_hcp
      description: Deploy ROSA using a Hosted Control Plane.
      formLabel: Hosted Control Plane
      required: true
      openAPIV3Schema:
        type: boolean
        default: false
    - name: rosa_version
      description: ROSA Version to install
      formLabel: Rosa Version
      openAPIV3Schema:
        type: string
        default: latest-upgrade
        enum:
        - default
        - latest
        - latest-upgrade
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
  sandbox_api:
    reservation: rosa
