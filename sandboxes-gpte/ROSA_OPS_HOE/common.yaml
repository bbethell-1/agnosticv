---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

agnosticd_open_environment: false
sandbox_user_info_messages_enable: false
sandbox_enable_ui: false

aws_region: us-east-2
#billing account for HCP
aws_billing_account_id: "017310218799"

# Save separate archive of access files from the output dir.
agnosticd_save_output_dir_access_archive: "{{ guid }}_{{ uuid }}.access.tar.gz"

# -------------------------------------------------------------------
# Bastion VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3a.small

bastion_instance_image: RHEL95GOLD-latest

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ----------------------------------------------------------------------------
    Welcome to the Red Hat OpenShift Service on AWS Ops Hands-on Experience!
  ----------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# ------------------------------------------------------
# Bastion user
# ------------------------------------------------------
bastion_user_name: rosa
bastion_user_enable_sudo: false
bastion_user_password: ""
bastion_user_password_length: 16

# ------------------------------------------------------
# Other vars
# ------------------------------------------------------
repo_method: satellite
update_packages: false

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
rosa_installer_version: "1.2.53"
rosa_deploy: true
rosa_deploy_hcp: true
# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade
# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: "openshift-v4.20"

# ROSA Cluster Settings
# If these are not specified the defaults are used
# If they are specified they have to be set to a supported value
# Default is m5.xlarge. m6a are a bit cheaper
rosa_compute_machine_type: m6a.xlarge

# Set up a cluster admin for ROSA
# And log in that cluster admin for {{ ansible_user }} on the bastion
rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true

# Lock the security group for the bastion to allow SSH only from
# the bastion itself (and podman containers on it)
rosa_lock_bastion_security_group: true

# Infra Bastion is allowed to connect
rosa_bastion_allowed_ssh_ips:
- 44.211.19.138

# Allow Showroom from everywhere
rosa_bastion_security_group_ingress_rules:
- ports:
  - 80
  - 443
  proto: tcp
  cidr_ip: "0.0.0.0/0"

# Allow communication with rosa
rosa_bastion_security_group_egress_rules:
- ports:
  - 443
  proto: tcp
  cidr_ip: "0.0.0.0/0"

# Lock the security group used for the Worker nodes
rosa_lock_cluster_security_group: true
rosa_cluster_security_group_egress_rules:
- ports:
  - 1-21
  - 23-65535
  proto: tcp
  cidr_ip: "0.0.0.0/0"
- ports:
  - 1-65535
  proto: udp
  cidr_ip: "0.0.0.0/0"

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/showroom-rosa-ops-hoe.git
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
- "{{ bastion_user_name }}"

# -------------------------------------------------------------------
# Workloads to deploy
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_cluster_admin_service_account
- ocp4_workload_rosa_policies

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# ROSA uses Let's Encrypt and so the CA cert is not useful
ocp4_workload_cluster_admin_service_account_report_ca_cert: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rosa_policies
# -------------------------------------------------------------------
ocp4_workload_rosa_policies_rhel_user_name: "{{ bastion_user_name }}"
ocp4_workload_rosa_policies_aws_user_name: rosa-student
ocp4_workload_rosa_policies_to_apply:
- name: rosa-student
  run_as_root: false
- name: microsweeper
  run_as_root: false
- name: cloudwatch
  run_as_root: false
- name: bastion-rbash
  run_as_root: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3f499cac-d1e0-40eb-8b9d-b45aa7a4a439
  owners:
    maintainer:
    - name: Wolfgang Kulhanek
      email: wkulhanek@redhat.com
    instructions:
    - name: Wolfgang Kulhanek
      email: wkulhanek@redhat.com
    - name: Harriet Lawrence
      email: hlawrence@redhat.com

  anarchy:
    namespace: babylon-anarchy-3
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-02-14
      pull: missing
    actions:
      provision:
        time_estimate: 50m
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Ops Hands-on Experience
    category: Labs
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    messageTemplates:
      provisionFailed:
        emailSubject: Your ROSA hands-on experience cluster request has failed
      provisionStarted:
        disable: true
      retirementScheduled:
        emailSubject: Your ROSA hands-on experience environment is expiring soon
        timeIntervalBeforeRetirement: 1h
      serviceDeleted:
        emailSubject: Your ROSA hands-on experience has ended
      serviceReady:
        emailSubject: Your ROSA hands-on experience is ready to access
      startComplete:
        disable: true
      startFailed:
        disable: true
      stopComplete:
        disable: true
      stopFailed:
        disable: true
      stopScheduled:
        disable: true
    multiuser: false
    parameters:
    - name: rosa_version
      description: ROSA Version to install
      formLabel: Rosa Version
      openAPIV3Schema:
        type: string
        default: latest-upgrade
        enum:
        - default
        - latest
        - latest-upgrade
    reportingLabels:
      primaryBU: Hybrid_Platforms
  sandbox_api:
    reservation: rosa
    actions:
      start:
        enable: false
      stop:
        enable: false
      destroy:
        catch_all: false
