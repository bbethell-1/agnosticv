---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
- "{{ bastion_user_name }}"
rosa_lock_bastion_security_group: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development

  catalog:
    parameters:
    - name: rosa_deploy_hcp
      description: Deploy ROSA using a Hosted Control Plane.
      formLabel: Hosted Control Plane
      required: false
      openAPIV3Schema:
        type: boolean
        default: true
    - name: rosa_version
      description: ROSA Version to install
      formLabel: Rosa Version
      openAPIV3Schema:
        type: string
        default: latest
        enum:
        - default
        - latest
  sandbox_api:
    reservation: rosa
