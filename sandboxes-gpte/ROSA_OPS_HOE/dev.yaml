showroom_ansible_runner_path: "/{{ guid }}/runner"

showroom_dnf_packages:
  - git
  - podman
  - python-devel
  - ansible-core
  - systemd-container
  - unzip

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
