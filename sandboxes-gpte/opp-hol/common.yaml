---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/babylon-anarchy-sandbox.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml

#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type: m6a.4xlarge
master_instance_count: 3
master_storage_type: gp3
master_storage_size: 250
worker_instance_type: m6a.4xlarge
worker_instance_count: 4
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL95GOLD-latest

agnosticd_aws_capacity_reservation_enable: true
agnosticd_aws_capacity_reservation_single_zone: true

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: demo-user
student_sudo: true
student_password: "{{ common_password }}"

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_03_24

host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_cert_manager
  - ocp4_workload_kubevirt
  - ocp4_workload_openshift_gitops
  - ocp4_workload_pipelines
  - ocp4_workload_rhacs
  - ocp4_workload_rhacm
  - ocp4_workload_rhacm_cloud_credentials
  - ocp4_workload_rhacm_hypershift
  - ocp4_workload_quay_operator
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_data_foundation
# -------------------------------------------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.18
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 500Gi
#ocp4_workload_openshift_data_foundation_update_default_storage_class: true
#ocp4_workload_openshift_data_foundation_old_default_storage_class_name: gp3-csi
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1200
ocp4_workload_openshift_data_foundation_ceph_storage_system_deploy_timeout: 1200

ocp4_workload_openshift_data_foundation_catalogsource_setup: false
ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_install_ingress_certificates: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_enabled_nested_kvm: true
ocp4_workload_kubevirt_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: false
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: rhacs-4.7
ocp4_workload_rhacs_install_operator_namespace: rhacs-operator
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: release-2.13

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_cloud_credentials
# -------------------------------------------------------------------
ocp4_workload_rhacm_cloud_credentials_kubevirt: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm_hypershift
# -------------------------------------------------------------------
ocp4_workocp4_workload_rhacm_hypershift_s3_bucket_region: "{{ aws_region }}"

ocp4_workload_rhacm_hypershift_deploy_clusters:
  - name: development
    infra_id: "dev-{{ guid }}"
    ocp_release: 4.18.4
    region: "{{ aws_region }}"
    zones:
      - "{{ aws_region }}a"
    control_plane_availability: SingleReplica
    infra_availability: SingleReplica
    etcd_storage_class: gp3-csi
    nodepool_replicas: 1
    worker_instance_type: m6a.2xlarge
    root_volume_type: gp3
    root_volume_size: 120
    labels:
      rhdp_type: sandbox
      rhdp_usage: development
      guid: "{{ guid }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_quay_operator
# -------------------------------------------------------------------
ocp4_workload_quay_operator_channel: stable-3.13
ocp4_workload_quay_operator_registry_namespace: quay
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/opp-gitops.git
ocp4_workload_gitops_bootstrap_repo_revision: v1.3.0
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_helm_values:
  compliance:
    repoURL: https://github.com/rhpds/ocp-cluster-addons.git
    path: compliance
    targetRevision: main
    namespace: openshift-compliance
    startingCSV: compliance-operator.v1.6.2
    channel: "stable"
    config:
      nodeSelector:
        node-role.kubernetes.io/worker: ""

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-opp.git
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: af51b623-5902-4ed4-96cf-af16e3ae4862
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    display_name: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
    category: Labs
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    keywords:
      - workshop
      - openshift
      - ocp
      - rhacm
      - rhacs
      - quay
      - admin
      - storage
      - ocpplus
      - opp
    parameters:
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-1
          enum:
            - us-east-1
            - us-east-2
            - ap-southeast-1
            - eu-central-1
    labels:
      Provider: Hybrid_Platform_BU
      Platform: OpenShift
      TDP1: Container_Management
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  owners:
    maintainer:
      - name: Judd Maltin
        email: judd@redhat.com
      - name: Wolfgang Kulhanek
        email: wkulhane@redhat.com
    sme:
      - name: Michael Foster
        email: mfoster@redhat.com
      - name: Jimmy Alvarez
        email: jialvare@redhat.com
      - name: Luiz Bernardo Levenhagen Alarcon da Fonseca
        email: llevenha@redhat.com
    instructions:
      - name: Michael Foster
        email: mfoster@redhat.com
      - name: Jimmy Alvarez
        email: jialvare@redhat.com
