---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml

# Red Hat Summit 2020 - T25198 - SELinux Policy Writing Lab

env_type: selinux-policy

output_dir: /tmp/output_dir/{{ env_type }}-{{ guid }}

# Email is required for deployment... but really shouldn't be.
email: devops@opentlc.com
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

install_student_user: true
student_name: demo-user
student_sudo: true

#repo_method: satellite
#satellite_url: labsat.opentlc.com
#satellite_activationkey: rhel8-summit
#satellite_org: Red_Hat_GPTE_Labs
#use_content_view: true
#
# Cloud specfic (AWS) settings.
cloud_provider: ec2                     # Which AgnosticD Cloud Provider to use
remote_user: ec2-user                   # Needed to workaround some bug.

bookbag_git_repo: https://gitlab.com/2020-summit-labs/selinux-policy-bookbag.git

#ssh_provision_key_name: "{{ env_authorized_key }}"
ssh_provision_key: "{{ env_authorized_key }}"

# DANGER ZONE
#
# AWS Credentials. These are required (don't sync them to your fork!!)
# aws_access_key_id:
# aws_secret_access_key:
# Create a file e.g. agnosticd/ansible/my_secret_vars.yml and put all your keys etc into it.
#
#update_packages: true
#common_packages:
#  - python3     # (removed for RHEL8 because python3 was installed in cloud_providers/ec2_infrastructure_deployment.yml)
#  - unzip
#  - bash-completion
#  - tmux
#  - wget
#  - git
#  - vim-enhanced
#  - at
#  - podman
#  - buildah
#  - skopeo
#
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SELinux Policy Writing
    category: Demos
    keywords:
      - Demos
      - Security
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: Linux_Engineering
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - namespace: gpte
      name: ocp4_token
    - namespace: gpte
      name: satellite-rhel81-ha
#    - namespace: gpte
#      name: output-dir-s3
    - namespace: gpte
      name: bookbag-deployer-na4
