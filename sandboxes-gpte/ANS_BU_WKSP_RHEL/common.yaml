---
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-rhel81.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: "RHEL87GOLD-latest"
default_rootfs_size: 50
default_instance_type: "t3a.medium"

security_groups:
  - name: BastionSG
    rules:
      - name: BastionHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromBastionTCP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: BastionSG
        rule_type: Ingress

      - name: FromBastionUDP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: BastionSG
        rule_type: Ingress

instances:
  - name: "{{ bastion_instance_name | default('ansible-1') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG
      - DefaultSG

  - name: "node"
    count: 3
    public_dns: false
    image: "{{ node_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Role: ansible_bu_aws_access_policy
# -------------------------------------------------------------------
ec2_instance_common_tags: &common_tags
  guid: "{{ guid }}"
  ansible-workshops: "true"
  Workshop: "{{ workshop_type }}"
  Workshop_type: "{{ workshop_type }}"
  Student: "ansible-1"
  Students: 1
  Info: "AWS_USERNAME that provisioned this"
  Linklight: "This was provisioned through the linklight provisioner"
  username: "ec2-user"
  operating_system: rhel

ansible_bu_aws_access_policy_ec2_instances_tags:
  - name: ansible-1
    iamprofile: false
    tags:
      Workshop_ansible: "ansible-1"
      short_name: "ansible-1"
      <<: *common_tags
  - name: node1
    iamprofile: true
    tags:
      Index: 1
      color: "#0039d4"
      Workshop_node1: "node1"
      short_name: "node1"
      os_major_version: 8
      <<: *common_tags
  - name: node2
    iamprofile: true
    tags:
      Index: 2
      color: "#bf00d4"
      Workshop_node2: "node2"
      short_name: "node2"
      os_major_version: 8
      <<: *common_tags
  - name: node3
    iamprofile: true
    tags:
      Index: 3
      color: "#67d300"
      Workshop_node3: "node3"
      short_name: "node3"
      os_major_version: 8
      <<: *common_tags

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - ansible_bu_aws_access_policy
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user

software_workloads:
  bastions:
    - ansible_bu_run_time_inventory
    - deploy_automationcontroller
    - aap_controller_cert_issue
    - vscode-server
    - automation_platform_loader
    - ansible_bu_setup_workshop

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
install_automationcontroller: true
deploy_automationcontroller_admin_password: "{{ common_password }}"
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"

# -------------------------------------------------------------------
# Role: automation_platform_loader
# -------------------------------------------------------------------
configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
  controller_username: admin
  controller_password: "{{ common_password }}"
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
  - role: credentials
    var: controller_credentials
    tags: credentials
  - role: inventories
    var: controller_inventories
    tags: inventories
  - role: hosts
    var: controller_hosts
    tags: hosts
  - role: groups
    var: controller_groups
    tags: hosts

controller_credentials:
  - name: "Workshop Credentials"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "ec2-user"
      ssh_key_data: "{{ lookup('file', hostvars.localhost.env_authorized_key_path) }}"
    state: present

controller_inventories:
  - name: "Workshop Inventory"
    organization: Default
    state: present

controller_hosts:
  - name: "{{ groups['nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][0] }}"
  - name: "{{ groups['nodes'][1].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][1] }}"
  - name: "{{ groups['nodes'][2].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][2] }}"
  - name: "{{ groups['bastions'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['bastions'][0] }}"

controller_groups:
  - name: web
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "{{ groups['nodes'][0].split('.')[0] }}"
      - "{{ groups['nodes'][1].split('.')[0] }}"
      - "{{ groups['nodes'][2].split('.')[0] }}"
  - name: control
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "{{ groups['bastions'][0].split('.')[0] }}"

# -------------------------------------------------------------------
# Role: aap_controller_cert_issue
# -------------------------------------------------------------------
enable_letsencyrpt_cert: true
controller_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: false
vscode_server_ansible_become: true
vscode_use_automationcontroller_nginx: true
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix


# -------------------------------------------------------------------
# Role: ansible_bu_setup_workshop
# -------------------------------------------------------------------
workshop_type: rhel_90
workshop_version: 1.0.18
ansible_bu_setup_workshop_exercise_src: ansible_rhel_90
ansible_bu_setup_workshop_exercise_dest: rhel-workshop

ansible_bu_setup_workshop_ee_image:
  - name: quay.io/acme_corp/rhel_90_ee
    tag: latest
  - name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-29-rhel8
    tag: 2.0.0
  - name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-supported-rhel8
    tag: 2.0.0
  - name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-minimal-rhel8
    tag: 2.0.0

# -------------------------------------------------------------------
# Test vars ends here
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 89d68ed6-e660-495c-8174-58d40628d47a
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  # Auto stop instances using the sandbox API
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Workshop - Ansible for Red Hat Enterprise Linux
    category: Workshops
    keywords:
      - rhel
      - ansible
      - workshop
      - aap2
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters: []
