---
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Advanced Day 2 Operations Lab
# --- ILT: OpenShift 4 Advanced Day 2 Operations (2021 Version)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD
master_instance_type: m5a.2xlarge
master_instance_count: 3
worker_instance_type: m5a.2xlarge
worker_instance_count: 3

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.8"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------

# Gitea Operator
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.15.4
ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: lab-user
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_migrate_repositories: true
ocp4_workload_gitea_repositories_list:
- repo: https://github.com/redhat-gpte-devopsautomation/cluster-configuration.git
  name: cluster-configuration
  private: true

# Adv Day 2 Ops ILT
ocp4_workload_adv_day2_ops_ilt_aws_key: "{{ sandbox_aws_access_key_id }}"
ocp4_workload_adv_day2_ops_ilt_aws_secret_key: "{{ sandbox_aws_secret_access_key }}"
ocp4_workload_adv_day2_ops_ilt_aws_domain: "{{ sandbox_zone }}"
ocp4_workload_adv_day2_ops_ilt_aws_hostedzoneid: "{{ sandbox_hosted_zone_id }}"
ocp4_workload_adv_day2_ops_ilt_aws_region: us-west-1
ocp4_workload_adv_day2_ops_ilt_managed_guid: "{{ guid }}-m"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_gitea_operator
- ocp4_workload_adv_day2_ops_ilt
- ocp4_workload_le_certificates

# Do not run any student customization.
# This will result in a default OpenShift 4 installation.
student_workloads: []

# Workloads that need to be explicitely removed upon cluster destroy
remove_workloads:
- ocp4_workload_adv_day2_ops_ilt

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name
    region: aws_region

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
    - name: student_name
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: gpte-no-repos
  - namespace: gpte
    name: satellite-rhel81
  - namespace: gpte
    name: ocp4-token
