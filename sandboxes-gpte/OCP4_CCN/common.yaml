---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml


# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD-latest

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.13"

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4-workload-ccnrd-stable

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Worker Instance Count
# -------------------------------------------------------------------
master_instance_type_family: m5
master_instance_type_size: >-
  {{ 'xlarge' if worker_instance_count|int <= 10
  else '2xlarge' if worker_instance_count|int <= 20
  else '4xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"
master_instance_count: 3
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: "m5.4xlarge"
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max\
  \ }}"
worker_storage_type: "gp2"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('3') | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

module_type: >-
  {{
    ";".join(
      (["m1"] if module_enable_m1 | default(false) | bool else []) +
      (["m2"] if module_enable_m2 | default(false) | bool else []) +
      (["m3"] if module_enable_m3 | default(false) | bool else []) +
      (["m4"] if module_enable_m4 | default(false) | bool else [])
    )
  }}

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    course_module_list: module_type

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: module_enable_m1
        description: Enable module m1
        formGroup: Modules
        formLabel: Module 1 - Optimizing Existing Applications
        openAPIV3Schema:
          type: boolean
          default: true
      - name: module_enable_m2
        description: Enable module m2
        formGroup: Modules
        formLabel: Module 2 - Debugging | Monitoring | Continuous Delivery
        openAPIV3Schema:
          type: boolean
          default: true
      - name: module_enable_m3
        description: Enable module m3
        formGroup: Modules
        formLabel: Module 3 - Control Cloud Native Apps with Service Mesh
        openAPIV3Schema:
          type: boolean
          default: true
      - name: module_enable_m4
        description: Enable module m4
        formGroup: Modules
        formLabel: Module 4 - Advanced Cloud-Native with Event-Driven Serverless
        openAPIV3Schema:
          type: boolean
          default: true
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 100
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than three requires a valid SalesForceID.')
    keywords: []
    labels:
      Provider: Hybrid_Platform_BU
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Use_Case: Accelerate_Application_Development_And_Delivery
    display_name: CCN Roadshow for Dev Track OCP 4
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  secrets:
    - name: satellite-rhel81-ha
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
