---
purpose: development
cloudformation_retries: 0

ocp4_installer_version: 4.10.3


# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    parameters:
    - name: module_type
      description: >-
        Semicolon-seperated list of Modules to Enable.
        For Example: m1;m2;m3;m4 or m1
      formLabel: Module
      required: true
      openAPIV3Schema:
        default: m1;m2;m3;m4
        type: string
      validation: >-
        module_type_validation_override ||
        ['m1', 'm2', 'm3', 'm4', 'm1;m2', 'm1;m2;m3', 'm1;m2;m3;m4', 'm1;m2;m4', 'm1;m3', 'm1;m3;m4', 'm1;m4', 'm2;m3', 'm2;m3;m4', 'm2;m4', 'm3;m4'].includes(module_type) ||
        Error('"Please see the tooltip for the correct format"')
    - name: module_type_validation_override
      description: Override Module Validation Failure
      annotation: demo.redhat.com/module_type_validation_override
      formGroup: Module validation override
      formLabel: Ignore validation failure
      formHideCondition: >-
        !(user_is_admin || user_groups.includes('rhpds-devs'))
      openAPIV3Schema:
        type: boolean
  deployer:
    scm_ref: development
