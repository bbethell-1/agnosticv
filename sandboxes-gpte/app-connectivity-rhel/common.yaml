  asset_uuid: C795BAC5-ED5E-42D4-A11F-DFFB8B649C5C
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: msharma@redhat.com

  anarchy:
    namespace: babylon-anarchy-4
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Application Connectivity Workshop : RHEL"
    category: Workshops
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    keywords:
      - app
      - connectivity
      - rhel
    reportingLabels:
      primaryBU: RHEL
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
