---
# Hands on data pipelines: automated X-Ray images analysis!
platform: RHPDS
purpose: development   ## This is a cost tag, please make sure it's correct.

ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_xray_pipeline_lab_user_count: "{{ (num_users | default('1')) | int }}"

# ---------------------------------------------------------
# OCP configuration
# ---------------------------------------------------------
master_instance_type: c5d.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 3

# AgnosticV / Babylon Metadata
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    num_users: num_users
    user: username
    region: aws_region

__meta__:
  aws_sandboxed: true
  deployer:
    scm_url: https://github.com/guimou/agnosticd.git
    scm_ref: guimou-xraydemo
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    display_name: OCP4 X-Ray Data Pipeline
    # Icon value should can be any product name, no spaces, for which we have
    # a product icon. Default will be generic icon.
    icon: openshift
    # Possible values: Labs, Workshops, Demos (plurals)
    category: Labs
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - lab
      - ocp4
      - openshift
      - openshift container storage
      - amq
    namespace: gpte
    description: >-
      This workshop will be used to deploy a workshop
      for deploying an OpenShift XRay Data Pipelines
    parameters:
      - name: aws_region
      - name: student_name
      - name: num_users
      - name: user_counts
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      OpenShift_Version: "4.7"
      Product: OpenShift
      Provider: GPTE
      #Event: Red_Hat_Summit
    # Indicate that this item provisions a multiuser environment
    multiuser: true

  secrets:
    # OpenShift Pull Secret
    # ocp4_pull_secret
    # ocp4_token
    - name: ocp4-token
      namespace: gpte

    # LDAP admin password to check user auth
    # bindPassword
    # kerberos_keytab
    # kerberos_user
    # ocp4_workload_authentication_ldap_bind_password
    # ocp4_workload_authentication_secrets
    - name: ipa-admin
      namespace: gpte

    # Satellite Configuration
    - name: satellite-rhel81
      namespace: gpte
