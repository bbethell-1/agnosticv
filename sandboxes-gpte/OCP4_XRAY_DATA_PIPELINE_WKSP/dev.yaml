---
#include /includes/ee-multicloud-dev.yaml
purpose: development   ## This is a cost tag, please make sure it's correct.

ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_xray_pipeline_lab_user_count: "{{ (num_users | default('1')) | int }}"

# ---------------------------------------------------------
# OCP configuration
# ---------------------------------------------------------
master_instance_type: c5d.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 3

# ---------------------------------------------------------
# Common override for update development
# ---------------------------------------------------------

# OpenShift Installer Version
ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_url: https://github.com/guimou/agnosticd.git
    scm_ref: guimou-xraydemo
    virtualenv: ansible2.9-python3.6-2021-11-30
