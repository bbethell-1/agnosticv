---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# ---------------------------------------------------------
# Red Hat Summit 2021
# Hands on data pipelines: automated X-Ray images analysis!
# course_id: rhs2021-a0006
# CPBU: datasvc
# ---------------------------------------------------------

platform: RHPDS
#course_id: RHTR_2020_XRAY_DATA_PIPELINE

# NEEDS to have aws region decided and declared here
aws_region: us-east-2

# Email is required for deployment... but really shouldn't be.
email: gmoutier@redhat.com

# The name of the agnosticd config to deploy
env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: t3.medium

# OpenShift Installer Version
ocp4_installer_version: "4.10"

# Enable this if you want to create a user on the bastion
install_student_user: false

# What we use in this environment to get the packages we need
repo_method: satellite

# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_opentlc_production
  - ocp4_workload_openshift_container_storage
  - ocp4_workload_amq_streams
  - ocp4_workload_serverless
  - ocp4_workload_bookbag_setup
  - ocp4_workload_xray_pipeline_lab
  - ocp4_workload_le_certificates

# ---------------------------------------------------------
# Authentication
# ---------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: xraylab-
ocp4_workload_authentication_htpasswd_user_password: xraylab
ocp4_workload_authentication_htpasswd_add_default_users: false
# Admin
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_remove_kubeadmin: true

# ---------------------------------------------------------
# OpenTLC Production
# ---------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: true
ocp4_workload_opentlc_production_expose_registry_route: false
ocp4_workload_opentlc_production_set_build_defaults: true

# ---------------------------------------------------------
# OpenShift Data Foundation (OCS)
# ---------------------------------------------------------
# Operator
ocp4_workload_openshift_container_storage_ocs_catalogsource_setup: true
ocp4_workload_openshift_container_storage_ocs_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_container_storage_ocs_catalogsource_image_tag: v4.10_2022_08_29
ocp4_workload_openshift_container_storage_ocs_channel: stable-4.10
ocp4_workload_openshift_container_storage_starting_csv: ""
ocp4_workload_openshift_container_storage_ocs_expected_crds:
  - backingstores.noobaa.io
  - bucketclasses.noobaa.io
  - noobaas.noobaa.io
  - objectbucketclaims.objectbucket.io
  - storagesystems.odf.openshift.io

# Cluster deployment parameters
ocp4_workload_openshift_container_storage_ocs_install_rgw: true
ocp4_workload_openshift_container_storage_ocs_install_toolbox: true
ocp4_workload_openshift_container_storage_ocs_ceph_storage_class_name: gp2
ocp4_workload_openshift_container_storage_ocs_ceph_storage_osd_size: 512gi
ocp4_workload_openshift_container_storage_ocs_operator_workload_destroy: >
  "{{ False if (ACTION=='create' or ACTION=='provision') else True }}"

# ---------------------------------------------------------
# AMQ Streams Operator Setup
# ---------------------------------------------------------
ocp4_workload_amq_streams_wait_for_deploy: true
ocp4_workload_amq_streams_use_catalog_snapshot: true
ocp4_workload_amq_streams_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_amq_streams_catalog_snapshot_image_tag: v4.10_2022_08_29
ocp4_workload_amq_streams_channel: stable
ocp4_workload_amq_streams_starting_csv: ""

# ---------------------------------------------------------
# Serverless Setup
# ---------------------------------------------------------
ocp4_workload_serverless_install_eventing: true
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_serverless_catalog_snapshot_image_tag: v4.10_2022_08_29
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_starting_csv: ""

# ---------------------------------------------------------
# XRay Lab Bookbag image Setup
# ---------------------------------------------------------
ocp4_workload_bookbag_setup_project: "bookbag"
ocp4_workload_bookbag_setup_project_display: "Bookbag XRay Lab"
ocp4_workload_bookbag_setup_git_repo: https://github.com/rh-aiservices-bu/xraylab-bookbag.git
ocp4_workload_bookbag_setup_git_version: main
ocp4_workload_bookbag_setup_image_name: xraylab-bookbag

# ---------------------------------------------------------
# XRay Lab components to install
# ---------------------------------------------------------
ocp4_workload_xray_pipeline_lab_install_odh_operator: true
ocp4_workload_xray_pipeline_lab_install_odh: true
ocp4_workload_xray_pipeline_lab_install_kafkasource: true

# ---------------------------------------------------------
# XRay Lab community catalog snapshot
# ---------------------------------------------------------
ocp4_workload_xray_pipeline_lab_catalogsource_setup: true
ocp4_workload_xray_pipeline_lab_catalogsource_name: community-operators-snapshot-xraylab
ocp4_workload_xray_pipeline_lab_catalogsource_namespace: openshift-marketplace
ocp4_workload_xray_pipeline_lab_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_community_catalog
ocp4_workload_xray_pipeline_lab_catalogsource_image_tag: v4.10_2022_08_29

# ---------------------------------------------------------
# XRay Lab Open Data Hub Operator Setup
# ---------------------------------------------------------
ocp4_workload_xray_pipeline_lab_odh_operator_name: opendatahub-operator
ocp4_workload_xray_pipeline_lab_odh_channel: stable
ocp4_workload_xray_pipeline_lab_odh_automatic_install_plan_approval: true
ocp4_workload_xray_pipeline_lab_odh_install_operator_starting_csv: ""

# ---------------------------------------------------------
# XRay Lab Open Data Hub Setup
# ---------------------------------------------------------
ocp4_workload_xray_pipeline_lab_odh_version: v1.2

# ---------------------------------------------------------
# XRay Lab per user parameters
# ---------------------------------------------------------
ocp4_workload_xray_pipeline_lab_user_base: xraylab-
ocp4_workload_xray_pipeline_lab_grafana_operator_name: grafana-operator
ocp4_workload_xray_pipeline_lab_grafana_channel: v4
ocp4_workload_xray_pipeline_lab_grafana_automatic_install_plan_approval: true
ocp4_workload_xray_pipeline_lab_grafana_install_operator_starting_csv: ""


# AgnosticV / Babylon Metadata
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: username

__meta__:
  asset_uuid: b2108849-247c-4dab-b5bf-b20b593551a4
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    display_name: OCP4 XRay Data Pipeline Workshop
    category: Workshops
    keywords:
      - lab
      - ocp4
      - openshift
      - openshift container storage
      - amq
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Hybrid_Cloud_Experience
    multiuser: true
  owners:
    - email: gmoutier@redhat.com
      name: Guillaume Moutier
    - email: kbader@redhat.com
      name: Kyle Bader
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: ipa-admin
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
