purpose: TEST

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
#master_instance_type: m5.xlarge
#master_instance_count: 3
#worker_instance_type: m5.4xlarge
#bastion_instance_type: t3a.medium
#bastion_instance_image: RHEL82GOLD

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  deploy_with: babylon
  agnosticd_git_tag_prefix: ocp4-getting-started-workshop-test

##########################
# Babylon meta variables #
##########################

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
  deployer:
    git_tag_prefix: ocp4-getting-started-workshop-test
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - name: satellite-rhel81
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
