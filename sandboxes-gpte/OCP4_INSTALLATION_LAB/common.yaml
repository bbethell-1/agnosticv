---
# OpenShift 4 Installation Lab
# Platform
platform: labs

# These should come from the account. Agnosticd to Agnosticv. As of now keeping them.
HostedZoneId: Z2SZ029ULMBODH
subdomain_base_suffix: .sandbox1254.opentlc.com

# Config
env_type: ocp4-ha-lab
software_to_deploy: none

# Repos
repo_method: file
repo_version: 4.1
osrelease: 4.1.0
# own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/4.1.0/
# own_repo_path is inherited from default account settings based on osrelease

# This is a Lab Environment
install_opentlc_integration: false
install_ocp4: false
install_ftl: true

# Student User on Bastion
install_student_user: true

# AgnosticV Meta variables
agnosticv_meta:
  secrets:
    - ocp4_token
