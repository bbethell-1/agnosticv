---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 6
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
    parameters:
    - name: ocp_username
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhte-ocp4
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
