---
purpose: development

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 5) | round | int, 3] | max }}"
bastion_instance_type: t3a.medium

# OpenShift Installer Version
ocp4_installer_version: "4.6.25"

# Workload Variables
ocp4_workload_le_certificates_install_certificates: true
ocp4_workload_le_certificates_install_api: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    scm_url: https://github.com/rh-mlops-workshop/agnosticd.git
    scm_ref: releases/mlops_ocp_4_6
