---
#include /enterprise/includes/aws-sandbox-meta.yaml
#include /enterprise/includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml

# -------------------------------------------------------------------
# --- Catalog Item: TAP Workshop
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: tap-workshop-binder

__meta__:
  asset_uuid: 23D6607C-E298-49E7-981D-3FA179829A4A
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    display_name: Red Hat Trusted Application Pipeline - Workshop
    category: Workshops
    keywords:
    - TAP
    - openshift
    labels:
      Product: Red_Hat_Openshift_Platform_Plus
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

# -------------------------------------------------------------------
# Components to include in template and catalog item
# -------------------------------------------------------------------
  components:
  - name: tap_developer_cluster
    display_name: TAP DEVELOPER CLUSTER
    item: sandboxes-gpte/TAP_DEVELOPER_CLUSTER
    propagate_provision_data:
    - var: tap_developer_cluster_provision_data

  - name: tap_qa_cluster
    display_name: TAP QA CLUSTER
    item: sandboxes-gpte/TAP_QA_CLUSTER
    propagate_provision_data:
    - var: tap_qa_cluster_provision_data


# Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      status:
        disable: true
      update:
        disable: true
