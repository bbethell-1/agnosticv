---
# -------------------------------------------------------------------
# Includes
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/terms-of-service.yaml
#include /includes/ee-multicloud-rosa.yaml
#include /includes/runtime-unlimited.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-rosa-region.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml

#include /includes/secrets/demosat-rhel-9-10-latest.yaml
#include /includes/secrets/zerossl.yaml

#include /includes/secrets/rosa_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# ------------------------------------------------------
# Catalog Item Parameters
# ------------------------------------------------------
rosa_deploy: true
rosa_deploy_hcp: true
rosa_setup_cluster_admin: false

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
rosa_installer_version: latest

# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade

# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: openshift-v4.18
rosa_compute_machine_type: m6a.xlarge

#billing account for HCP
aws_billing_account_id: "017310218799"

bastion_instance_type: "t3a.small"
bastion_instance_image: RHEL96GOLD-latest

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the Red Hat OpenShift Service on AWS Workshop!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# Extra packages to install
common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/showroom-rosa-workshop.git
showroom_git_ref: main
showroom_var_inject: true

showroom_ssh_method: sshkey
showroom_ssh_username: "{{ bastion_user_name }}"
showroom_default_ssh_user: "{{ bastion_user_name }}"
showroom_ssh_host: "bastion.{{ subdomain_base }}"
showroom_lab_users:
  - "{{ bastion_user_name }}"

showroom_dnf_packages:
  - git
  - podman
  - python-devel
  - systemd-container
  - unzip
  - ansible-core

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e9a963d8-964e-4928-887e-94221df791c2
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com
    instructions:
      - name: Judd Maltin
        email: jmaltin@redhat.com
      - name: Wolfgang Kulhanek
        email: wkulhanek@redhat.com

  anarchy:
    namespace: babylon-anarchy-2
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
  sandbox_api:
    actions:
      start:
        enable: false
      stop:
        enable: false
      destroy:
        catch_all: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Workshop
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '71'
    parameters:
      - name: rosa_setup_cluster_admin
        description: Set up cluster admin in ROSA (useful for testing)
        formLabel: Set up cluster admin in ROSA
        openAPIV3Schema:
          type: boolean
          default: false
    reportingLabels:
      primaryBU: Hybrid_Platforms
    workshop_user_mode: none
