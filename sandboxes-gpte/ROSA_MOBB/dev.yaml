---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Bookbag
# -------------------------------------------------------------------

  #bookbag_git_repo: https://github.com/rh-mobb/bookbag-rosa-mobb.git
  #bookbag_git_version: summit_updates

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

__meta__:
  deployer:
    scm_ref: development
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - name: bookbag_git_repo
      description: Git repository for bookbag.
      formLabel: Bookbag Git Repository
      required: false
      openAPIV3Schema:
        type: string
        default: "https://github.com/rh-mobb/bookbag-rosa-mobb.git"
    - name: bookbag_git_version
      description: scm ref for bookbag git repo
      formLabel: Workshop Format
      required: false
      openAPIV3Schema:
        type: string
        default: "full_day"
        enum:
        - full_day
        - half_day
