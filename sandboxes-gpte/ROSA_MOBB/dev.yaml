---
#include /includes/ee-multicloud-dev.yaml
#include /includes/parameters/aws-region.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

common_extra_packages:
- java-17-openjdk-devel
- tzdata-java
- maven

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
# Pre-deploy ROSA
rosa_deploy: true
# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade
# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: "openshift-v4.13"
rosa_setup_cluster_admin: false
rosa_compute_machine_type: m6a.xlarge

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy: true
showroom_git_repo: https://github.com/rhpds/bookbag-rosa-mobb.git
showroom_git_ref: showroom

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

__meta__:
  deployer:
    scm_ref: development
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - name: bookbag_git_repo
      description: Git repository for bookbag.
      formLabel: Bookbag Git Repository
      required: false
      openAPIV3Schema:
        type: string
        default: https://github.com/rh-mobb/bookbag-rosa-mobb.git
    - name: bookbag_git_version
      description: scm ref for bookbag git repo
      formLabel: Workshop Format
      required: false
      openAPIV3Schema:
        type: string
        default: summit_updates
        enum:
        - showroom
        - full_day
        - half_day
        - summit_updates
        - main
