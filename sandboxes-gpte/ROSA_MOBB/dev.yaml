---
#include /includes/ee-multicloud-dev.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/secrets/showroom-shared-410.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# ------------------------------------------------------
# Catalog Item Parameters
# ------------------------------------------------------

# Pre-deploy ROSA from Catalog item parameter
# rosa_deploy: true

# Deploy using Hosted Control Plane
# rosa_deploy_hcp: true

# Set up Cluster Admin from Catalog Item Parameter
# rosa_setup_cluster_admin: false

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade

# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: openshift-v4.15
rosa_compute_machine_type: m6a.xlarge

#billing account for HCP
aws_billing_account_id: "017310218799"

rosa_installer_version: latest

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: false

# --------------------------------------------------------------------
# Showroom
# --------------------------------------------------------------------
showroom_deploy: false
# showroom_git_repo: https://github.com/rhpds/showroom-rosa-workshop.git
# showroom_git_ref: main
# showroom_var_inject: true

# showroom_ssh_method: sshkey
# showroom_ssh_username: "{{ bastion_user_name }}"
# showroom_default_ssh_user: "{{ bastion_user_name }}"
# showroom_ssh_host: "bastion.{{ subdomain_base }}"
# showroom_lab_users:
# - "{{ bastion_user_name }}"

# ------------------------------------------------------
# Infra Workloads to deploy
# ------------------------------------------------------
infra_workloads:
- ocp4_workload_showroom

# ------------------------------------------------------
# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom

ocp4_workload_showroom_content_git_repo_ref: showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-rosa-workshop.git

ocp4_workload_showroom_deployment_type: helm
#ocp4_workload_showroom_deployment_type: argocd

ocp4_workload_showroom_content_only: false
#ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "1.1.0"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

__meta__:
  deployer:
    scm_ref: development
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters:
    - name: rosa_deploy
      description: Deploy ROSA in the environment
      formLabel: Deploy ROSA
      openAPIV3Schema:
        type: boolean
      required: true
    - name: rosa_deploy_hcp
      description: Deploy ROSA using a Hosted Control Plane (only if Deploy ROSA is checked)
      formLabel: Deploy ROSA using a Hosted Control Plane (only if Deploy ROSA is checked)
      openAPIV3Schema:
        type: boolean
    - name: rosa_setup_cluster_admin
      description: Set up cluster admin in ROSA (only if Deploy ROSA is checked)
      formLabel: Set up cluster admin in ROSA (only if Deploy ROSA is checked)
      openAPIV3Schema:
        type: boolean
