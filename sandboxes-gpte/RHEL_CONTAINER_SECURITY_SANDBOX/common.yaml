# -------------------------------------------------------

# Red Hat Summit 2023 - LB1460 - A Practical Introduction to Container Security

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel-container-security

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
bastion_instance_image: RHEL91GOLD-latest
node_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# BookBag VARS
# -------------------------------------------------------------------
bookbag_git_repo: https://github.com/redhat-gpte-labs/practical-intro-to-container-security.git
bookbag_git_version: '2023'

# --- Generic Variables
cloudformation_retries: 10
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true
# Email is required for deployment... but really shouldn't be.
email: devops@opentlc.com

#--------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: e3a46dd2-839b-42dc-9970-654897aa55f6
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: A Practical Introduction to Container Security
    category: Demos
    keywords:
      - Demos
      - Defend Yourself
      - RHEL
      - Security
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
  secrets:
    - name: ocp4_token
      namespace: gpte
    - name: gpte
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
