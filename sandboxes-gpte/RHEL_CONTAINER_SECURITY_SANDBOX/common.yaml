# -------------------------------------------------------

# Red Hat Summit 2023 - LB1460 - A Practical Introduction to Container Security

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel-container-security

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
bastion_instance_image: RHEL91GOLD-latest
node_instance_image: RHEL91GOLD-latest

student_name: lab-user

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rhpds/practical-intro-to-container-security.git
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_stacked_terminals_enable: true
ocp4_workload_showroom_stacked_terminals_display_name: "Terminals"
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true
showroom_deploy_shared_cluster_enable: true

# --- Generic Variables
cloudformation_retries: 10
install_ipa_client: false

# --- Student User on Bastion
install_student_user: true
# Email is required for deployment... but really shouldn't be.
email: devops@opentlc.com

