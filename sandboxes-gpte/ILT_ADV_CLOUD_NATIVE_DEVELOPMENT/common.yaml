---
# --- OpenShift 4.6 Advanced Cloud Native Development with Red Hat OpenShift
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4.6 Adv Cloud Native Development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# Platform
platform: labs

# OpenShift Installer Version
ocp4_installer_version: "4.6.30"

# --- These come from the account
# subdomain_base_suffix:
# HostedZoneId:

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: 12ra3d439h4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: r3dh4t1!

# Create 20 users
ocp4_workload_authentication_htpasswd_user_count: 20

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_serverless
- ocp4_workload_amq_streams
- ocp4_workload_cnd_apicurio_registry_operator
- ocp4_workload_cnd_tracing_jaeger
- ocp4_workload_cnd_monitoring_prometheus
- ocp4_workload_cnd_monitoring_grafana
- ocp4_workload_data_grid
- ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

# ---------------------------------------------------------
# OpenShift Serverless
# ---------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_install_eventing: true
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_serverless_catalog_snapshot_image_tag: v4.6_2021_06_01


# ---------------------------------------------------------
# OpenShift AMQ Streams
# ---------------------------------------------------------
ocp4_workload_amq_streams_channel: stable
ocp4_workload_amq_streams_use_catalog_snapshot: true
ocp4_workload_amq_streams_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_amq_streams_catalog_snapshot_image_tag: v4.6_2021_06_01


# ---------------------------------------------------------
# Apicurio Registry per student namespace
# ---------------------------------------------------------
ocp4_workload_cnd_apicurio_registry_operator_channel: alpha
ocp4_workload_cnd_apicurio_registry_operator_namespace: "-schema-registry"
ocp4_workload_cnd_apicurio_registry_operator_use_catalog_snapshot: true
ocp4_workload_cnd_apicurio_registry_operator_catalogsource_name: community-operators-snapshot-apicurio-registry
ocp4_workload_cnd_apicurio_registry_operator_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_community_catalog
ocp4_workload_cnd_apicurio_registry_operator_catalog_snapshot_image_tag: "v4.6_2021_06_01"

# ---------------------------------------------------------
# Jaeger per student namespace
# ---------------------------------------------------------
ocp4_workload_cnd_tracing_jaeger_channel: stable
ocp4_workload_cnd_tracing_jaeger_use_catalog_snapshot: true
ocp4_workload_cnd_tracing_jaeger_namespace: "openshift-operators"
ocp4_workload_cnd_tracing_jaeger_catalogsource_name: redhat-operators-snapshot-tracing-jaeger
ocp4_workload_cnd_tracing_jaeger_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_cnd_tracing_jaeger_catalog_snapshot_image_tag: "v4.6_2021_06_01"


# ---------------------------------------------------------
# Monitoring Prometheus per student for monitoring namespace
# ---------------------------------------------------------
ocp4_workload_cnd_monitoring_prometheus_operator_channel: beta
ocp4_workload_cnd_monitoring_prometheus_use_catalog_snapshot: true
ocp4_workload_cnd_monitoring_prometheus_catalogsource_name: community-operators-snapshot-monitoring-prometheus
ocp4_workload_cnd_monitoring_prometheus_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_community_catalog
ocp4_workload_cnd_monitoring_prometheus_catalog_snapshot_image_tag: "v4.6_2021_06_01"

# ---------------------------------------------------------
# Monitoring Grafana per student for monitoring namespace
# ---------------------------------------------------------
ocp4_workload_cnd_monitoring_grafana_operator_channel: alpha
ocp4_workload_cnd_monitoring_grafana_use_catalog_snapshot: true
ocp4_workload_cnd_monitoring_grafana_catalogsource_name: community-operators-snapshot-monitoring-grafana
ocp4_workload_cnd_monitoring_grafana_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_community_catalog
ocp4_workload_cnd_monitoring_grafana_catalog_snapshot_image_tag: "v4.6_2021_06_01"


# ---------------------------------------------------------
# Data Grid
# ---------------------------------------------------------
ocp4_workload_data_grid_channel: 8.1.x
ocp4_workload_data_grid_use_catalog_snapshot: true
ocp4_workload_data_grid_automatic_install_plan_approval: true
ocp4_workload_data_grid_catalogsource_name: redhat-operators-snapshot-data-grid
ocp4_workload_data_grid_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_data_grid_catalog_snapshot_image_tag: v4.6_2021_06_01

# --- AgnosticV Meta variables
agnosticv_meta:
  sandboxed: true
  virtualenv: aws-ansible-2.9
  params_to_variables:
    username: student_name
    nodecount: ''
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81
