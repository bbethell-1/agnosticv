---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/parameters/ocp4-installer-version.yaml
#include /includes/parameters/controlplane-count.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Sandbox Credentials
# -------------------------------------------------------------------
sandbox_enable_ui: true
agnosticd_open_environment: true
sandbox_user_info_data_enable: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
host_ocp4_installer_set_user_data_kubeadmin_password: true
openshift_cluster_admin_service_account_enable: true
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager

# -------------------------------------------------------------------
# Authentication configuration if enabled by parameter
# -------------------------------------------------------------------
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_htpasswd_user_name: developer
ocp4_workload_authentication_admin_user: admin
# Do not developer user as multi-user data
ocp4_workload_authentication_enable_user_info_data: false

# -------------------------------------------------------------------
# Instance Details
# -------------------------------------------------------------------
worker_storage_type: "gp2"
bastion_instance_image: RHEL94GOLD-latest

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c34691a5-55e4-4e62-a166-7a6368e028b4
  owners:
    maintainer:
      - name: Johnathan Kupferer
        email: jkupferer@redhat.com

  anarchy:
    namespace: babylon-anarchy-4
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS with OpenShift Open Environment
    category: Open_Environments
    keywords:
      - aws
      - ocp
      - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: false
    parameters:
      - name: ocp4_workload_authentication_enable
        description: >-
          Configure authentication with admin and developer users.
        formGroup: Features
        formLabel: Configure Authentication
        openAPIV3Schema:
          type: boolean
          default: false

      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.xlarge
          enum:
            - m6a.xlarge
            - m6a.2xlarge
            - m6a.4xlarge

      - name: worker_instance_count
        description: OpenShift compute worker instance count
        formHideCondition: master_instance_count == 1
        formLabel: Compute Instance Count
        openAPIV3Schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 12

      - name: worker_instance_type
        description: OpenShift compute worker instance type
        formHideCondition: master_instance_count == 1
        formLabel: Compute Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.4xlarge
          enum:
            - m6a.xlarge
            - m6a.2xlarge
            - m6a.4xlarge
    reportingLabels:
      primaryBU: Hybrid_Platforms
