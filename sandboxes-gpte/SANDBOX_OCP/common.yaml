---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Set OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: '4.10'

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
openshift_cluster_admin_service_account_enable: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates

# -------------------------------------------------------------------
# Instance Details
# -------------------------------------------------------------------
master_instance_type: "m5.xlarge"
master_storage_type: "gp2"
worker_instance_type: "m5.4xlarge"
worker_instance_count: "3"
worker_storage_type: "gp2"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  access_control:
    allow_groups:
    - redhat-ansible-eda
    - babylon-admins
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS with OpenShift
    category: Open_Environments
    keywords:
    - aws
    - ocp
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    multiuser: false
    parameters:
    - name: ocp4_installer_version
      description: Version of OpenShift to Install
      formLabel: OpenShift Version
      required: true
      openAPIV3Schema:
        type: string
        default: '4.10'
        enum:
        - '4.8'
        - '4.9'
        - '4.10'
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel8-ha-latest
  - namespace: gpte
    name: output-dir-s3
