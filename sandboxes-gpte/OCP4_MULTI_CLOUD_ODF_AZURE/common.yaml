---
#include /includes/parameters/azure-region2.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/azure_opentlc.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: azure
bastion_instance_image: RHEL84GOLD-latest

remote_user: azure
ansible_user: azure

# Azure cloud specific vars
# sp, tenant, sub, password are in the secret below
# azure_region is passed by the UI form
#az_dnszone_resource_group: gpte-infra
# rhel_sku: 7-LVM
windows_vm_count: 0
cluster_dns_zone: azure.opentlc.com
ocp4_base_domain: azure.opentlc.com
basesuffix: .azure.opentlc.com

install_idm: htpasswd

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Bastion and Student Info
# -------------------------------------------------------------------

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: dev-admin

# student_password not set -> generate random password
student_password: "{{ common_password }}"

# Student is allowed to sudo and switch to root
student_sudo: true

# Student Workloads (YAML List)
student_workloads: []

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.9"

# -------------------------------------------------------------------
# OpenShift Instance Types
# -------------------------------------------------------------------

master_instance_type: Standard_D16s_v3
worker_instance_type: Standard_D16s_v3
master_instance_count: 3
worker_instance_count: 3
worker_storage_type: "Standard_LRS"
worker_storage_size: 1024

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: azure.azcollection # Needed for azure creds loading
    version: 1.12.0
  - name: azure.rm           # Needed for azure creds loading
    version: 0.0.6

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
install_lets_encrypt_certificates: false

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name
    # infra_workloads: infra_workloads
    # aro_compute_count: worker_instance_count

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------
__meta__:
  asset_uuid: 8f06cb59-21b5-461e-af36-9c65ed748f5a
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Azure Development Cluster
    category: Demos
    keywords:
    - multi-cloud-demo
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
  access_control:
    allow_groups:
    - rhpds-devs
  secrets:
  - name: satellite-rhel8-latest-ha
    namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.16
      pull: missing
