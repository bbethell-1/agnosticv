---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL82GOLD

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: development
  agnosticd_git_repo: 'https://github.com/blues-man/agnosticd'

__meta__:
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    scm_url: https://github.com/blues-man/agnosticd
