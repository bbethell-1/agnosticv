---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL82GOLD

# Overriding common.yaml variable for testing purposes
ocp4_installer_version: '4.8'
ocp4_workload_pipelines_channel: stable
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_starting_csv: redhat-openshift-pipelines.v1.5.1
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.8_2021_09_13

#########################################
# Meta variables for admin host scripts #
# ALL_agnosticv.sh                      #
#########################################

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: development
  agnosticd_git_repo: 'https://github.com/blues-man/agnosticd'

__meta__:
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    scm_url: https://github.com/blues-man/agnosticd
