purpose: development
gogs_project: labs
etherpad_project: labs
project_name: labs
workshop_type: starter
homeroom_template_path: https://raw.githubusercontent.com/treddy08/workshop-homeroom/develop/templates/production.json
lab_branch: ocp-4.8
lab_repo: https://github.com/treddy08/starter-guides
repositories:
- base: https://github.com/treddy08
  name: nationalparks
- base: https://github.com/openshift-roadshow
  name: nationalparks-py
- base: https://github.com/openshift-roadshow
  name: nationalparks-dotnet
- base: https://github.com/openshift-roadshow
  name: nationalparks-js
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
