---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# ---------------------------------------------------------
# AWS Instance Sizes
# ---------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL82GOLD

# ---------------------------------------------------------
# AgnosticV Metadata
# ---------------------------------------------------------
#agnosticv_meta:
#  idle_after_deploy: 6
#  idle_after_start: 6
#  agnosticd_git_tag_prefix: ocp4-getting-started-workshop-prod

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  deploy_with: babylon

##########################
# Babylon meta variables #
##########################

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: gpte
    parameters:
      - name: student_name
      - name: aws_region
  deployer:
    git_tag_prefix: ocp4-getting-started-workshop-prod
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
    - namespace: gpte
      name: satellite-rhel81
    - namespace: gpte
      name: ocp4_token
