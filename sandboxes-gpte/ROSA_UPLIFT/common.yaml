# -------------------------------------------------------------------
# ocp4_workload_rosa_machinepool
# -------------------------------------------------------------------
# MINIMUM 3 nodes to support ODF
# best guess on number of metal nodes: 15 users per metal node
# 2 x winweb @ 1Gi
# 1 x database @ 2Gi
# 1 x migrated VM @ 2Gi
# ----
# 7 Gi.
# m5zn.metal has 192 Gi RAM
# Let's say 10Gi per user, to be "safe".  We can have 19 users, theoretically, per m5zn.metal
# Problem is, it's storage.  I need a better storage solution
ocp4_workload_rosa_machinepool_replicas: "{{ [(num_users | default(1) | int / 7) | round(0, 'ceil') | int, 3] | max }}"

# kind of baremetal instance to use with this lab.
# Other metal instance types that support fast disk IO
# - i3.metal
# - i3en.metal
# - i4i.metal
ocp4_workload_rosa_machinepool_instance_types: # AgD code cannot actually deploy different metal instance types
- "{{ metal_instance_type }}"

