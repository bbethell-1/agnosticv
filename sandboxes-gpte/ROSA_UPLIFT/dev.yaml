---
# -------------------------------------------------------------------
# --- Catalog:
# --- Catalog Item:
#       OpenShift Virtualization with ROSA: Uplift and Shift
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/newgoliath/rosa_uplift.git
ocp4_workload_gitops_bootstrap_repo_revision: dev
ocp4_workload_gitops_bootstrap_repo_path: bootstrap
ocp4_workload_gitops_bootstrap_application_health_retries: 360 # 30 minutes
ocp4_workload_gitops_bootstrap_helm_values:
  content:
    repoUrl: https://github.com/rhpds/showroom_rosa_uplift.git
    repoRef: main
  workloads:
    repoUrl: https://github.com/newgoliath/rosa_uplift.git
    repoRef: "{{ ocp4_workload_gitops_bootstrap_repo_revision }}"
  user:
    count: "{{ ocp4_workload_user_count }}"
    base: "{{ ocp4_workload_user_base }}"
    mode: "workshop"
  istio_cp_namespace: istio-system
  cloud: rosa

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
