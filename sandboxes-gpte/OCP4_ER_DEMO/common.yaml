---
# --- OpenShift 4.x Demos
# --- Catalog: Demos
# --- Catalog Item: ER OpenShift 4.x Demo

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# OpenShift Installer Version
ocp4_installer_version: "4.6.4"

# --- These come from the account
# subdomain_base_suffix:
# HostedZoneId:

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# OpenShift Cluster Customization
# -------------------------------------------------------------------

# Do not run any infrastructure customization.
# This will result in a default OpenShift 4 installation.

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create 200 users
ocp4_workload_authentication_htpasswd_user_count: 200

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_project_request_template
  - ocp4_workload_opentlc_production
  - ocp4_workload_le_certificates
  - ocp-workload-terminal
  - ocp4_workload_emergency_response

# --- Student Workloads (YAML List)
student_workloads: []

agnosticv_meta:
#  virtualenv: aws-ansible-2.9
#  params_to_variables:
#    username: student_name
#  nuke_sandbox: false
  secrets:
  # OpenShift Pull Secret
  # - ocp4_token
  # Satellite Configuration
#  - satellite-ocp-on-osp-secret

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  deployer:
    virtualenv: aws-ansible-2.9
  catalog:
    namespace: gpte
  secrets:
    - name: gpte
      namespace: gpte
    - name: satellite-ocp-on-osp-secret
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
