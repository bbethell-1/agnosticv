---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/num-users-salesforce.yaml
# -------------------------------------------------------------------
# --- OpenShift 4.x Demos
# --- Catalog: Demos
# --- Catalog Item: ER OpenShift 4.x Demo
# --- Doc Link https://www.erdemo.io/gettingstarted/
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.9.0"

# --- These come from the account
# subdomain_base_suffix:
# HostedZoneId:

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

set_repositories_satellite_ha: true
satellite_url: labsat-ha.opentlc.com

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false

# Student User on Bastion
install_student_user: true
bastion_instance_image: RHEL84GOLD-latest
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# OpenShift Cluster Customization
# -------------------------------------------------------------------

# Do not run any infrastructure customization.
# This will result in a default OpenShift 4 installation.

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create 200 users
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

ocp4_workload_le_certificates_install_api: false

# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_project_request_template
  - ocp4_workload_opentlc_production
  #- ocp4_workload_le_certificates
  #- ocp-workload-terminal
  - ocp4_workload_emergency_response

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Worker Instance Count
# -------------------------------------------------------------------
master_instance_type_family: m5
master_instance_type_size: >-
  {{ 'xlarge' if worker_instance_count|int <= 10
  else '2xlarge' if worker_instance_count|int <= 20
  else '4xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"
master_instance_count: 3
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: "m5.4xlarge"
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max\
  \ }}"
worker_storage_type: "gp2"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  params_to_variables:
    course_module_list: ocp4_workload_emergency_response_mapbox_token
    username: student_name
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 64f0111f-b689-45ff-8246-c97d8dc832a3
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Cloud_Services_BU
      Use_Case: Accelerate_Application_Development_And_Delivery
    parameters:
      - name: ocp4_workload_emergency_response_mapbox_token
        description: Created Mapbox Token
        formLabel: Mapbox Token
        required: true
        openAPIV3Schema:
          type: string
    display_name: Emergency Response Demo
    category: Demos
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: satellite-rhel81-ha
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
