---
#include /includes/catalog-icon-aws.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/access-restriction-devs-only.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-4.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Catalog Item: ocp4-cluster
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2
student_name: lab-user
student_password: "{{ common_password }}"
aws_region: us-east-2

# -------------------------------------------------------------------
# OpenShift variable
# -------------------------------------------------------------------
ocp4_installer_version: "4.17"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_type: m6a.4xlarge
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL94GOLD-latest

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_app_connectivity_workshop

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_install_ingress_certificates: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "openshift"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: D6D066EE-C707-4935-B62E-F06BABFF1059
  anarchy:
    namespace: babylon-anarchy-3
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Application Connectivity Workshop : AWS"
    category: Workshops
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: App_Developer_BU
      Product_Family: Red_Hat_Cloud
      Base_Component: 'False'
    keywords:
    - app
    - connectivity
    - openshift
    - ocp
    - service-interconnect
    - connectivity link
    - service mesh
    - aws
    reportingLabels:
      primaryBU: RHEL
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
