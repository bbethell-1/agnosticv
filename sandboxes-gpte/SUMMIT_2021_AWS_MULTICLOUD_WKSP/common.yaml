#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
# -------------------------------------------------------------------
# --- Red Hat Summit 2021
# --- Multi-cloud Application Integration
# --- course_id: rhs2021-multi0001
# --- CPBU: appsvc
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD-latest
bastion_instance_type: t3.medium

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4-workload-dil-serverless

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

# Enable this if you want to create a user on the bastion
install_student_user: false

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Disable default agnosticd_user_info for ocp4_workload_authentication
ocp4_workload_authentication_enable_user_info_data: false
ocp4_workload_authentication_enable_user_info_messages: false
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# Machine size and count depend upon the number of users
worker_instance_type: m5.4xlarge
# Scale workers for 3 users per node with a minimum of 3 nodes
worker_instance_count: "{{ [( num_users / 3) | round(0, 'ceil') | int, 3] | max }}"
master_instance_type: m5.2xlarge
master_instance_count: 3

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region
    console_hostname: ocp4_workload_dil_serverless_azure_console_hostname
    route_domain: ocp4_workload_dil_serverless_azure_route_domain

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4ac0f918-72f0-4b83-ba87-a793b8f94401
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Multi-Cloud Workshop - AWS
    category: Workshops
    multiuser: true
    parameters:
      - name: ocp4_workload_dil_serverless_azure_console_hostname
        description: Azure Console hostname from Multi-Cloud Workshop - Azure
        formLabel: Azure Console Hostname
        required: true
        openAPIV3Schema:
          type: string
      - name: ocp4_workload_dil_serverless_azure_route_domain
        description: Azure Route Domain from Multi-Cloud Workshop - Azure
        formLabel: Azure Route Domain
        required: true
        openAPIV3Schema:
          type: string
    keywords:
      - workshop
      - cloud
      - aws
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: Cloud_Services_BU
      Product_Family: Red_Hat_Cloud
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  owners:
    - email: eshortis@redhat.com
      name: Evan Shortiss
    - email: hguerrer@redhat.com
      name: Hugo Guerrero
    - email: btison@redhat.com
      name: Bernard Tison
  secrets:
    - name: ocp4_token
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
