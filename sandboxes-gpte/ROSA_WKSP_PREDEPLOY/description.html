This environment is geared towards delivering a half-day ROSA workshop.

Deploys:
<ol>
  <li>A RHEL bastion with ROSA utils/creds</li>
  <li>ROSA OCP Cluster</li>
  <li>Bookbag "An interactive learning environment" with ROSA Labs customized for each user.</li>
</ol>
