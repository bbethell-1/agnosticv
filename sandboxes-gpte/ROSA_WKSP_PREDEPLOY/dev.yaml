---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rh-mobb/bookbag-rosa-mobb.git
bookbag_git_version: main

# 2023-08-14 Mon 04:28:27 PM

__meta__:
  deployer:
    scm_ref: judd-rosa-testing
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0-alpha
      pull: missing
  secrets:
  - namespace: gpte
    name: ocp4-token
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Workshop - Pre-Deploy
