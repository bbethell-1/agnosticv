---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-rosa-mobb.git
bookbag_git_version: summit_updates

__meta__:
  deployer:
    scm_ref: rosa-demo-1.6.0
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
  - namespace: gpte
    name: ocp4-token
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-content-mobb
  catalog:
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: ROSA Workshop - Pre-Deploy
