---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/bookbag-shared-410.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa

agnosticd_open_environment: True
sandbox_user_info_messages_enable: False

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: "t2.small"
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
install_common: true
update_packages: true

common_extra_packages:
- java-11-openjdk-devel
- tzdata-java
- maven

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-rosa-mobb.git
bookbag_git_version: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    infra_workloads: ''
    student_workloads: ''
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: c1bc13a4-516b-4417-af96-0c55c78478ce
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
    actions:
      start:
        disable: true
      stop:
        disable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Modern App Dev Roadshow - Cloud Architect Track for ROSA
    category: Workshops
    keywords:
    - mobb
    - MAD
    - mad
    - roadshow
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '68'
    parameters:
    - name: rosa_token
      description: To obtain a current ROSA token, please visit https://console.redhat.com/openshift/token
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
  - namespace: gpte
    name: ocp4-token
  - name: satellite-rhel-8-and-9-latest-ha
    namespace: gpte
