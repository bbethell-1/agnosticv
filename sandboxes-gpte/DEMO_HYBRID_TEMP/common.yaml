---
# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO Manage Hybrid Cloud
# --- DEMO: Manage Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

cloud_provider: none
env_type: hybrid-cloud-binder
# get ssh key to add host if we need bastion access
# really should add proper ssh keys BEFORE deployment

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte

  catalog:
    display_name: Hybrid Cloud Demo - Parallel
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: aws-region
        required: true
        resourceIndexes:
          - 0
        formHideCondition: true == true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2

  # Components to include in template and catalog item
  components:
    - name: aws-sandbox-a
      display_name: AWS OpenShift A
      item: sandboxes-gpte/SANDBOX_OCP49
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_aws_a_ca_cert
        - name: openshift_api_url
          var: openshift_aws_a_api_url
        - name: openshift_cluster_admin_token
          var: openshift_aws_a_token
        - name: openshift_console_url
          var: openshift_aws_a_console_url
    - name: azr-sandbox-a
      display_name: Azurw OpenShift a
      item: azure_gpte/OPEN_ENVIRONMENT_AZURE_ARO4
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_azr_a_ca_cert
        - name: openshift_api_url
          var: openshift_azr_a_api_url
        - name: openshift_cluster_admin_token
          var: openshift_azr_a_token
        - name: openshift_console_url
          var: openshift_azr_a_console_url

  # Disable actions on chained config that are handled by base.
  deployer:
    entry_points:
      destroy: null
      start: null
      status: null
      stop: null
      update: null
      # deploy: null
