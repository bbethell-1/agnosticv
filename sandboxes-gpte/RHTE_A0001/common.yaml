---
platform: SPP

env_type: rhte-ans-tower
software_to_deploy: tower
tower_instance_count: 2
support_instance_count: 1
worker_instance_count: 1              # Set 0 to not to provision worker(isolated) nodes.
root_filesystem_size: 20



cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

install_student_user: true
student_name: lab-user
student_password: r3dh4t1!


###Tower workload

default_workloads:
  - sandbox-creds-copy 
  - tower-license-injector
  - cleanup-tower-default
  - tower-settings-update
  - tower-pip-packages
  - tower-user-create
  - tower-org-create
  - tower-credential-create
  - tower-project-create
  - tower-inventory-create
  - tower-job-template-create
  - tower-babylon-job-runner


#####Tower Related variables 
tower_admin_password: 'changeme'
tower_version: "3.5.0-1" 
repo_version: "{{tower_version}}"
key_name: opentlc_admin_backdoor
tower_user_accounts:                                      #Define users you want to create. Set superuser: yes to make user system wide System Administrator
  - user: babylon
    password: changeme
    email: babylon@example.com
    firstname: Baby
    lastname: Lon
    superuser: yes
  - user: babylon-viewer
    password: changeme
    email: babylon1@example.com
    firstname: Babylon
    lastname: Viewer

tower_organization:
  - name: rhte

target_regions:
  - name: emea
  - name: na

tower_credentials:
  - name:                   babylon-tower-credential
    username:               babylon
    password:               changeme
    description:            Babylon Tower Credential
    organization:           rhte
    type:                   tower
    state:                  present
    host:                   localhost
### tower project roles
tower_projects:
  - name: dark-tower-dev
    description: "dark tower dev project"
    organization: "rhte"
    scm_url: "https://github.com/redhat-gpte-devopsautomation/dark-tower.git"
    #scm_type: 
    #scm_credential: 
    scm_branch:  dev
    scm_update_on_launch: true

tower_inventories:
  - name: empty-inventory-emea
    description: emea
    organization: rhte
    instance_group: emea
  - name: empty-inventory-na
    description: na
    organization: rhte
    instance_group: na
  - name: empty-inventory
    description: "Empty inventory"
    organization: rhte
    # instance_group: ""
    

# Tower settings
tower_setting_params:
  AWX_PROOT_BASE_PATH: "/tmp"
  AWX_PROOT_SHOW_PATHS: "'/var/lib/awx/projects/', '/tmp'"

# List of virtual environment which will be created
# restart of tower service is required
# ansible-tower-service restart
# https://docs.ansible.com/ansible-tower/latest/html/userguide/security.html
tower_virtual_environment:
  - /var/lib/awx/venv/ansible
  - /var/lib/awx/venv/test1

# Path of Virtual Env for update
tower_update_venv: /var/lib/awx/venv/ansible

# Pip packages with version which needs to be updated for venv
pip_requirements:
  - boto==2.49.0
  - boto3==1.9.200
  - awscli==1.16.210
  - ansible-tower-cli==3.3.6


tower_job_templates:
  - name: job-runner-dev
    description: "dark tower job runner dev"
    job_type: run
    #vault_credential: 
    project: dark-tower-dev
    playbook: job-runner.yml
    inventory: empty-inventory
    become: yes


agnosticv_meta:
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    user: cloudforms_user

  nuke_sandbox: true


own_repo_path: http://d3s3zqyaz8cp2d.cloudfront.net/repos/tower
