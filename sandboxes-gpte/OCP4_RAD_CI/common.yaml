---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /enterprise/includes/lifetime-standard.yaml
#include /includes/enterprise-premium-sla.yaml
#include /enterprise/includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/credential_quay.yaml
#include /enterprise/includes/secrets/ent-demo-ate.yaml

# TODO: this fails on AgD role related issue using un-FQCN command tasks, see AAP2 logs
# #include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# --- System: RHDP
# --- Catalog: Workshops
# --- Catalog Item: RAD Roadshow - Enterprise Developer (Binder)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: multi
env_type: binder-rad-roadshow

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds
common_user_password: openshift

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 8122D717-CF5B-41CA-8CF8-06BB4213EE19
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    display_name: RAD Roadshow - Enterprise Developer (Binder)
    namespace: babylon-catalog-{{ stage | default('?') }}
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - development
      - rad
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: App_Developer_BU
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 40
        validation: >-
          num_users <= 2 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
  tower:
    timeout: 14400
  secrets:
    - namespace: gpte
      name: rhev_dev_credentials
    - name: rhods-git-secret
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing

  components:

    - name: rad_rhoai
      display_name: RAD Roadshow - Enterprise Developer
      item: sandboxes-gpte/OCP4_RAD_EA_RS_WKSP
      propagate_provision_data:
        - var: rad_rhoai_data


    - name: ad_rhelai
      display_name: RAD AI Developer VM
      item: rhdp/RAD_AI_DEVELOPER_VM
      propagate_provision_data:
        - var: rad_rhelai_data

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_deployer_chart_version: 1.3.1
ocp4_workload_showroom_content_git_repo: >-
   https://github.com/rh-rad-ai-roadshow/dev-guides.git
ocp4_workload_showroom_content_only: true
ocp4_workload_showroom_namespace: showroom

userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "rhdh_url": "https://backstage-backstage.apps.cluster-{{ guid }}.{{ guid }}{{ subdomain_base_suffix }}",
    "rhdh_user": "user{{i}}",
    "rhdh_user_password": "{{ common_user_password }}",
    "gitlab_url": "https://gitlab-gitlab.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "gitlab_user": "user{{i}}",
    "gitlab_user_password": "{{ common_user_password }}",
    "usernum": "{{i}}",
    "cluster_id": ".apps.cluster-{{guid}}.{{guid}}{{ subdomain_base_suffix }}",
    "openshift_cluster_ingress_domain": ".apps.cluster-{{guid}}.{{guid}}{{ subdomain_base_suffix }}",
    "console_url": "https://console-openshift-console.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "devspaces_url": "https://devspaces.apps.cluster-{{ guid }}.{{guid}}{{ subdomain_base_suffix }}",
    "devspaces_user": "user{{i}}",
    "devspaces_user_password": "{{ common_user_password }}"
    },
  {% endfor %}
  }

agnosticd_passthrough_user_data: |
  {{ {}
   | combine( {
     "users": userdata })
  }}
