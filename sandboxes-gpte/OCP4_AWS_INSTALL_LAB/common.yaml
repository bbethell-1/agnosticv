---
# OpenShift 4 AWS Install VM
# Platform
platform: labs

# subdomain_base_suffix and HostedZoneIdcome from the account

# Config
env_type: ocp4-ha-lab
software_to_deploy: none

# Repos
osrelease: 4.1.0
repo_method: file
repo_version: 4.1
# own_repo_path is inherited from default account settings based on osrelease

# This is a Lab Environment
install_ftl: false
install_opentlc_integration: false
install_ocp4: false

# Student User on Bastion
install_student_user: true

# AgnosticV Meta variables
agnosticv_meta:
  secrets:
    - ocp4_token
  virtualenv: aws-ansible-2.9
