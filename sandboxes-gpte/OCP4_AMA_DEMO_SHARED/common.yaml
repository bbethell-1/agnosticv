# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Provider: RHPDS
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      #OpenShift_Version: '4.10'
    display_name: OpenShift 4 App Modernization Demo (Shared Environment)
    category: Demos
    multiuser: true
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 40
      # validation: >-
      #   num_users == 2 ||
      #   user_is_admin ||
      #   user_groups.includes('rhpds-devs') ||
      #   check_salesforce_id(salesforce_id) ||
      #   Error('User count greater than one requires a valid SalesForceID.')
  runtime:
    default: 8h
    maximum: 48h
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: output-dir-s3
  - namespace: gpte
    name: rhev_dev_credentials
