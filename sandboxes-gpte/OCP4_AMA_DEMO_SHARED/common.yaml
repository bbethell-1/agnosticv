ocp4_workload_ama_demo_shared_vm_user_name: lab-user
ocp4_workload_ama_demo_shared_vm_user_password: r3dh4t1!

ocp4_workload_ama_demo_shared_tomcat_repo_user: "{{ ocp4_workload_gitea_operator_generate_user_format }}1"
