    organization: Default
    project: "ai-eda"
    rulebook: "web_app.yml"
    decision_environment: "{{ eda_decision_environment_name }}"
    restart_policy: "on-failure"
    enabled: true
    eda_credentials: "AAP"
    state: present

# -------------------------------------------------------------------
# Workload: lb2961.ai_driven_aap.rhelai_model_serve
# -------------------------------------------------------------------
rhelai_model_serve_model_name: "granite-8b-lab-v1"
rhelai_model_serve_api_token: "{{ common_password }}"
rhelai_model_serve_rh_registry_user: "{{ registry_credentials_username }}"
rhelai_model_serve_rh_registry_password: "{{ registry_credentials_password }}"
rhelai_model_serve_instance_type: "{{ rhelai_instance_type }}"

# -------------------------------------------------------------------
# Workload: lb2961.ai_driven_aap.mattermost
# -------------------------------------------------------------------
mattermost_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/showroom-ai-driven-ansible-automation.git
showroom_user: showroom
showroom_ui: default

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty
  - web1

showroom_ttys_enable_tmux: false

showroom_lab_users:
  - "{{ student_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_tab_web1_url: "https://{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
showroom_tab_web1_name: "AAP"

