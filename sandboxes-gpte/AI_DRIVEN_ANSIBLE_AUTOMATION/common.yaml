# -------------------------------------------------------------------
# --- Catalog Item: Introduction to AI-Driven Ansible Automation
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: ec2

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
aws_ami_region_mapping:
  us-east-2:
    RHELAI10: ami-0be2f5c0ca770a10f
    RHELAI12: ami-0cb37f2a376f6e2c6
    RHELAI13: ami-00265ae24e6468147  # New AMI also Really 1.3.1
  us-east-1:
    RHELAI13: ami-05dc5d703f2600daf
  us-west-1:
    RHELAI13: ami-00963c6bcda96ee28
  us-west-2:
    RHELAI13: ami-02af9afa320f2f523
  eu-central-1:
    RHELAI13: ami-08f6874b7dfaad967
  ap-northeast-1:
    RHELAI13: ami-0f99d895aa44cdc94

default_instance_image: RHEL95GOLD-latest
controller_instance_image: aap-2.5-10.1-x86_64-20250304
rhelai_instance_image: RHELAI13

default_instance_type: "t3a.large"
controller_instance_type: "m5ad.2xlarge"
rhelai_instance_type: g6.2xlarge
windows_instance_type: m5.2xlarge

default_rootfs_size: 50
controller_rootfs_size: 200
rhelai_rootfs_size: 1024

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: GiteaHTTPSPorts
        description: "Gitea HTTPS Public"
        from_port: 488
        to_port: 488
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebAhttpsSPorts
        description: "Open HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebControllerPorts
        description: "Open HTTPS Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: KafkaPorts
        description: "Open Kafka Public"
        from_port: 9092
        to_port: 9092
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: ServiceSG
    rules:
      - name: MattermostPort
        description: "Port for Mattermost"
        from_port: 8065
        to_port: 8065
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: LLMSG
    rules:
      - name: LLMAPI
        description: "LLM API Port"
        from_port: 8000
        to_port: 8000
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WinSG
    rules:
      - name: WinSGTCP
        description: "All TCP"
        from_port: 1
        to_port: 65535
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WinSGUdp
        description: "All UDP"
        from_port: 1
        to_port: 65535
        protocol: udp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
# -------------------
# Instances
# -------------------
instances:
  - name: "{{ bastion_instance_name | default('bastion') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - WebSG
      - NodeSG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    image:
      name: "{{ controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ controller_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - NodeSG
      - WebSG

  - name: "rhelai"
    count: 1
    unique: true
    public_dns: true
    image: "{{ rhelai_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ rhelai_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhelai_nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhelai_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - DefaultSG
      - LLMSG
      - NodeSG

  - name: "node"
    count: 1
    public_dns: true
    image: "{{ node_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ node_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "service"
    count: 1
    public_dns: true
    image: "{{ service_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ service_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "servers"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ service_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - ServiceSG
      - WebSG

  - name: win
    count: 1
    public_dns: false
    image:
      name: "Windows_Server-2016-English-Full-Base*"
    flavor:
      ec2: "{{ windows_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "windows"
      - key: "ostype"
        value: "windows"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - WinSG
      - NodeSG
    UserData: |
        UserData:
                "Fn::Base64":
                  "Fn::Join":
                    - ""
                    - - "<powershell>\n"
                      - "$admin = [adsi]('WinNT://./administrator, user')\n"
                      - "$admin.PSBase.Invoke('SetPassword', '{{windows_password}}')\n"
                      - "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n"
                      - "$scriptPath=((New-Object System.Net.Webclient).DownloadString('https://gpte-public.s3.amazonaws.com/CI+Assets/Ansible+Windows+Workshop/ConfigureRemotingForAnsible.ps1'))\n"
                      - "Invoke-Command -ScriptBlock ([scriptblock]::Create($scriptPath)) -ArgumentList '-skipNetworkProfileCheck'\n"
                      - "Enable-WSManCredSSP -Role 'Server' -Force"
                      - "</powershell>"

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/lb2961.ai_driven_aap.git
      type: git
      version: main


# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - set-repositories
    - common
  controllers:
    - set-repositories
  # servicenode
  servers:
    - set-repositories
    - lb2961.ai_driven_aap.mattermost
    - lb2961.ai_driven_aap.kafka
  rhel9_nodes:
    - set-repositories

software_workloads:
  bastions:
    - bastion-lite
    - control-user
    # Not needed for this lab
    # - vscode-server
    - nginx_with_cert
    - lb2961.ai_driven_aap.nginx_gitea_prep
    - gitea_vm_setup
  controllers:
    - nginx_with_cert
  #ai server
  rhelai_nodes:
    - lb2961.ai_driven_aap.rhelai_model_serve
  # nodes being automated
  rhel9_nodes:
    - lb2961.ai_driven_aap.filebeat
  servers:
    - lb2961.ai_driven_aap.gitea_create

post_software_workloads:
  controllers:
    - ansible_automation_platform_configuration

post_software_final_workloads:
  bastions:
    - showroom

