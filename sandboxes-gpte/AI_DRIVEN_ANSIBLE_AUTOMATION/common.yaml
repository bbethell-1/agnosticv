    inventory: "lab-inventory"
    variables:
      ansible_host: "node1.example.com"
  - name: "{{ groups['servers'][0].split('.')[0] }}"
    inventory: "service-inventory"
    variables:
      ansible_host: "service1.example.com"
  - name: "gitea"
