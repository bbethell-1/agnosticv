---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: "RHEL94GOLD-latest"
bastion_instance_image: "RHEL94GOLD-latest"
controller_instance_image: "aap2.5-2024-11-06"

default_instance_type: "t3a.medium"
bastion_instance_type: "t3a.large"
controller_instance_type: "t3a.large"

default_rootfs_size: 50
bastion_rootfs_size: 100
controller_rootfs_size: 200
certbot_cert_manager_provider: zerossl

# Workshop Type
#workshop_type: network

# ENV TYPE
#env_type: "aap2-workshop-networking-automation"

# ------------------
# AWS SECURITY GROUPS
# ------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ContHTTPPorts
        description: "HTTP Public"
        from_port: 8501
        to_port: 8501
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

      - name: FromBastionTCP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: BastionSG
        rule_type: Ingress

      - name: FromBastionUDP
        description: "Allow everything from Bastion"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: BastionSG
        rule_type: Ingress

# ------------------
# AWS INSTANCES
# ------------------
instances:
  - name: "{{ bastion_instance_name | default('ansible-1') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - WebSG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image:
      name: "{{ controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ controller_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "node"
    count: 3
    public_dns: false
    image: "{{ node_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ node_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Role: ansible_bu_aws_access_policy
# -------------------------------------------------------------------
ec2_instance_common_tags: &common_tags
  guid: "{{ guid }}"
  ansible-workshops: "true"
  Workshop: "{{ workshop_type }}"
  Workshop_type: "{{ workshop_type }}"
  Student: "ansible-1"
  Students: 1
  Info: "AWS_USERNAME that provisioned this"
  Linklight: "This was provisioned through the linklight provisioner"
  username: "ec2-user"
  operating_system: rhel

ansible_bu_aws_access_policy_ec2_instances_tags:
  - name: ansible-1
    iamprofile: false
    tags:
      Workshop_ansible: "ansible-1"
      short_name: "ansible-1"
      <<: *common_tags
  - name: node1
    iamprofile: true
    tags:
      Index: 1
      color: "#0039d4"
      Workshop_node1: "node1"
      short_name: "node1"
      os_major_version: 8
      <<: *common_tags
  - name: node2
    iamprofile: true
    tags:
      Index: 2
      color: "#bf00d4"
      Workshop_node2: "node2"
      short_name: "node2"
      os_major_version: 8
      <<: *common_tags
  - name: node3
    iamprofile: true
    tags:
      Index: 3
      color: "#67d300"
      Workshop_node3: "node3"
      short_name: "node3"
      os_major_version: 8
      <<: *common_tags
  - name: controller
    iamprofile: false
    tags:
      Workshop_ansible: "controller"
      short_name: "controller"
      <<: *common_tags

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  localhost:
    - ansible_bu_aws_access_policy
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user

software_workloads:
  bastions:
    - vscode-server
    - ansible_bu_setup_workshop
  controllers:
    - nginx_with_cert
    - automation_platform_loader

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------
# Role: common
# -------------------------------------------------
common_packages_el9:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - openldap-clients
  - podman
  - skopeo
  - buildah
  - tree
  - jq
  - libffi-devel
  - ansible
  - ansible-navigator
  - ansible-lint

# -------------------------------------------------
# Role: nginx_with_cert
# -------------------------------------------------
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ subdomain_base }}"

# -------------------------------------------------------------------
# Role: automation_platform_loader
# -------------------------------------------------------------------
automation_platform_loader_aap_version: 2.5

# Important Boolean
controller_dependency_check: false

configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "{{ groups['controllers'][0].split('.')[0] }}.{{ subdomain_base }}"
  controller_username: admin
  controller_password: "R3dh4t1!"
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
  - role: credentials
    var: controller_credentials
    tags: credentials
  - role: inventories
    var: controller_inventories
    tags: inventories
  - role: hosts
    var: controller_hosts
    tags: hosts
  - role: groups
    var: controller_groups
    tags: hosts

controller_credentials:
  - name: "Workshop Credentials"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "ec2-user"
      ssh_key_data: "{{ lookup('file', hostvars.localhost.env_authorized_key_path) }}"
    state: present

controller_inventories:
  - name: "Workshop Inventory"
    organization: Default
    state: present

controller_hosts:
  - name: "{{ groups['nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][0] }}"
  - name: "{{ groups['nodes'][1].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][1] }}"
  - name: "{{ groups['nodes'][2].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][2] }}"
  - name: "{{ groups['bastions'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['controllers'][0] }}"

controller_groups:
  - name: web
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "{{ groups['nodes'][0].split('.')[0] }}"
      - "{{ groups['nodes'][1].split('.')[0] }}"
      - "{{ groups['nodes'][2].split('.')[0] }}"
  - name: control
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "{{ groups['bastions'][0].split('.')[0] }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_use_automationcontroller_nginx: false
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

# -------------------------------------------------------------------
# Role: ansible_bu_setup_workshop
# -------------------------------------------------------------------
workshop_type: rhel
workshop_version: 1.0.18
ansible_bu_setup_workshop_exercise_src: ansible_rhel
ansible_bu_setup_workshop_exercise_dest: rhel-workshop
ansible_bu_setup_workshop_enable_offline_aap_repo: false
ansible_bu_setup_workshop_aap_packages: []

ansible_bu_setup_workshop_ee_image:
  - name: registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8
    tag: latest
  - name: quay.io/acme_corp/rhel_90_ee
    tag: latest
  - name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel8
    tag: latest

ansible_bu_setup_workshop_code_server_additional_settings: |
  "security.workspace.trust.enabled": false


ec2_xtra:
  juniper:
    size: c5.xlarge
    ami: "{{ juniper_ami | default(omit) }}"
    os: junos
    username: ec2-user
    filter: "junos-vsrx3-x86-64-24*byol*"
    volume:
      - device_name: /dev/sda1
        ebs:
          volume_type: io1
          iops: 1000
          volume_size: 40
          delete_on_termination: true

#ansible_bu_setup_workshop_ee_image:
#  - name: quay.io/acme_corp/workshop_ee
#    tag: 95de4ee8d66e8027ebe99bc8b2a29f7befc1f25c

controller_configuration_projects_async_retries: 36
controller_configuration_projects_async_delay: 5

__meta__:
  asset_uuid: dbeee484-12e4-44da-964a-d997154f6f67
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.0
      pull: missing
  # Auto stop instances using the sandbox API
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Networking Automation Workshop (AWS)
    category: Workshops
    keywords:
      - aap2
      - ansible
      - arista
      - cisco
      - juniper
      - networking
      - automation
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    parameters:
      - name: network_type
        description: Select Network Type (Select none for Multivendor)
        formLabel: Network Type (Select none for Multivendor)
        required: false
        openAPIV3Schema:
          type: string
          default: multivendor
          enum:
            - cisco
            - juniper
            - arista
            - multivendor
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 100
    reportingLabels:
      primaryBU: Automation
      secondaryBU: RHEL
