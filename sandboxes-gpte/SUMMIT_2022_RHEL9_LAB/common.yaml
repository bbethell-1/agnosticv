---
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: EVENTS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-multitier-rhel8
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
satellite_activationkey: agd-training-2
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: RHEL9GOLD-latest
node_instance_image: RHEL9GOLD-latest

# -------------------------------------------------------------------
# BookBag VARS
# -------------------------------------------------------------------
bookbag_git_repo: https://github.com/xtophd/RHEL8-Workshop-Bookbag.git
bookbag_git_version: Summit_2021

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user

student_name: student
install_student_user: true
admin_user: opentlc-mgr

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-dev
    display_name: The Definitive Red Hat Enterprise Linux 9 Hands-On Lab
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
    parameters: []
  secrets:
    - name: bookbag-deployer-shared-na46
      namespace: gpte
    - name: gpte-no-repos
      namespace: gpte
    - name: labsat-secrets
      namespace: gpte
    - name: satellite-rhel90-ha
      namespace: gpte
