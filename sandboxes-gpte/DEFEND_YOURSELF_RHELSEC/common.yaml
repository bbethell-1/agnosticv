---
#include /includes/catalog-icon-rhel.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/bookbag-shared-410.yaml

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

bastion_instance_type: t3.medium
node_instance_type: t3.medium

# admin user for infra workloads
admin_user: admin
student_name: ec2-user
#student_name: lab-user
software_to_deploy: none

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-security.git

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: 9dec6fcc-b154-4e50-a474-176e693640c7
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Defend Yourself with RHEL Security
    category: Workshops
    keywords:
    - workshop
    - openshift
    parameters: []
  secrets:
  - namespace: gpte
    name: satellite-security-labs
  - namespace: gpte
    name: guidgrabber-api
  - namespace: gpte
    name: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
