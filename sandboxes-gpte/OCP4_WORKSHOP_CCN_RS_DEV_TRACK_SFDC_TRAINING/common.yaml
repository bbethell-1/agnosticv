---
platform: RHPDS

env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: "4.4.8"
# Turn off cluster shutdown prep steps (no longer necessary with 4.4.8+)
ocp4_enable_cluster_shutdown: false

repo_method: file

cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

install_student_user: true

install_idm: htpasswd
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_password: r3dh4t1!

run_janitor: false

osrelease: 4.4.0

infra_workloads:
  - ocp4_workload_le_certificates
  - ocp4-workload-ccnrd

# Probably not needed "old" agnosticD configs here
# ansible_additional_args: --skip-tags remove_self_provisioners,install_zabbix

agnosticv_meta:
  params_to_variables:
    username: student_name
    course_module_list: module_type
  nuke_sandbox: false
