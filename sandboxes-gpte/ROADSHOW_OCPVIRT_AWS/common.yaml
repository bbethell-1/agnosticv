---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/satellite-rhel9.1-lab.yaml

platform: RHPDS
env_type: roadshow-ocpvirt
hypervisor_type: m6gd.metal
hypervisor_os: RHEL91GOLD-latest
hypervisor_count: 1
aio_import_url: "http://s3.us-east.cloud-object-storage.appdomain.cloud/mig2ocpvirt"
build_lab: false
aws_region: us-east-2

# to change how instances are named
# (default is '%d')
#infra_dns_num_format: '-%02d'
#equinix_metal_instance_numerotation: '-%02d'

# Don't configure repos as this is a centos
repo_method: none

# Do install env key
set_env_authorized_key: false
install_student_user: true
student_name: lab-user

install_common: false

install_bastion: false

# -------------------------------------------------------------------
# OCP AIO VARS
# -------------------------------------------------------------------

# Set whether you want to deploy a disconnected registry
ocp4_aio_deploy_disconnected: false

# Set whether you want to deploy guacamole for console
ocp4_aio_deploy_guacamole: true

# Set whether you want a compact deployment (3 node cluster)
ocp4_aio_deploy_compact: false

# Select granular deployment options
# NOTE: OCP Plus will force acm, acs, ocp on.
#       deploy_ocs will force 3 workers on non-compact
ocp4_aio_deploy_ocp: true
ocp4_aio_deploy_ocp_plus: false
ocp4_aio_deploy_cnv: false
ocp4_aio_deploy_ocs: true
ocp4_aio_deploy_acm: false
ocp4_aio_deploy_acs: false
ocp4_aio_deploy_ods: false
ocp4_aio_deploy_nfs: false
ocp4_aio_deploy_sno: false
ocp4_aio_deploy_ipi: true
ocp4_aio_deploy_cnvlab: true
ocp4_aio_use_ddns: true

# Set bigger VMs for equinix hosts
ocp4_aio_deploy_big_vms: true

# Select OpenShift version for base cluster
ocp4_aio_ocp_version: 4.11.20

# Select number of workers for base cluster (1-3, for 0 use deploy_compact)
ocp4_aio_ocp_workers: 3

# Select deployment type (ipi or sno)
ocp4_aio_deploy_type: ipi

# Deploy extra SNO nodes for AI
extra_sno_nodes: false

ocp4_aio_rhcos_iso_url: https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/latest/rhcos-live.x86_64.iso

pull_secret: "{{ ocp4_pull_secret }}"

# Meta variables

agnosticv_meta:
  deploy_with: babylon
  secrets:
    - equinix-metal-gpte
    - ocp4_token
    - dynamic-dns

__meta__:
  asset_uuid: a415c887-cc86-4a93-9474-3035c2d23f1f
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    actions:
      start:
        disable: true
      stop:
        disable: true

  sandbox_api:
    actions:
      start:
        enable: false
      stop:
        enable: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Virtualization Roadshow on AWS
    category: Demos
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - workshop
      - openshift
      - virtualization
      - cnv
      - roadshow
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      #OpenShift_Version: "4.9"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: preinstall_operators
        description: Preinstall Operators (OCP-V, MTV, nmstate)
        formLabel: Preinstall operators
        openAPIV3Schema:
          type: boolean
          default: true

  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: mig2ocpvirt-secret
  runtime:
    default: 999d
    maximum: 999d
