---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
# -------------------------------------------------------------------
# --- Catalog Item: DevOps Roadshows
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: >-
  {{ 'c6in.2xlarge' if num_users | int < 10 else 'c6in.4xlarge' }}
master_instance_count: 3
master_storage_type: >-
    {{ 'io1' if worker_instance_count|int >= 10 else 'gp2' }}
master_storage_size: 250
worker_instance_type: m6a.4xlarge
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 5] | max }}"
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t2.small
bastion_instance_image: RHEL93GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
# ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_devops_roadshow
- ocp4_workload_showroom

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Common Admin Password
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# -------------------------------------------------------------------
# Workload: ocp4_workload_le_certificates
# -------------------------------------------------------------------
ocp4_workload_le_certificates_install_api: false

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_git_repo: https://github.com/AdvancedDevSecOpsWorkshop/workshop.git
# Default but gets overridden in environments
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_terminal_image: quay.io/openshiftdemos/devops-roadshow-terminal-tooling:latest
ocp4_workload_showroom_terminal_type: showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# ------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# ------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0590bb9c-a2a2-4b63-afd5-b5c51f55378c
  owners:
    maintainer:
    - name: Gerald Nunn
      email: gnunn@redhat.com
    instructions:
    - name: Gerald Nunn
      email: gnunn@redhat.com
    - name: Jaafar Chraibi
      email: jchraibi@redhat.com
    - name: Valentina Sosa
      email: vsosa@redhat.com

  anarchy:
    namespace: babylon-anarchy-4
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift DevSecOps Roadshow
    category: Workshops
    multiuser: true
    workshopLabUiRedirect: true
    keywords:
    - workshop
    - openshift
    - devops
    - devsecops
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 5
        minimum: 5
        maximum: 50
