# AgnosticV meta variables
# ------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# ------------------------------------------------------------------
# Babylon meta variables
# ------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
