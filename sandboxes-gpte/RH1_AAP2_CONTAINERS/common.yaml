---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------
#

env_type: base-infra
cloud_provider: ec2

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Instance Config
# --------------------------------------------------------------------

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: "https://github.com/rhpds/showroom_rh1_aap2_containerized"

showroom_ui: default
  # showroom_ansible_runner_api: true # TODO: leave for now as placeholder
showroom_showroom_default_ssh_user: "{{ student_name }}"
  # showroom_enable_root_ssh: false # TODO: leave for now as placeholder
showroom_lab_users:
  - "{{ student_name }}"
showroom_ssh_method: sshkey
# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: devops
student_password: "{{ common_password }}"
ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# ------------------------------------------------------------------
# Instance Config
# ------------------------------------------------------------------

rootfs_size_rhel9: 200

__instance_type: t3a.small

bastion_instance_type: t3a.xlarge              # Runs AAP2 Containerized, needs 16GB etc
frontend_instance_type: "{{ __instance_type }}"
app_instance_type: "{{ __instance_type }}"
appdb_instance_type: "{{ __instance_type }}"

__instance_image: RHEL93GOLD-latest

bastion_instance_image: "{{ __instance_image }}"
frontend_instance_image: "{{ __instance_image }}"
app_instance_image: "{{ __instance_image }}"
appdb_instance_image: "{{ __instance_image }}"

instances:

  - name: bastion   # TODO: Move name to control
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - WebSG # For code server
      - ShowroomSG

  - name: frontend
    count: 1
    public_dns: true
    dns_loadbalancer: false
    image: "{{ frontend_instance_image }}"
    flavor:
      ec2: "{{ frontend_instance_type  }}"
    tags:
      - key: "AnsibleGroup"
        value: "load_balancers"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - FrontendSG
      - HostSG

  - name: app
    count: "{{ app_instance_count | default(2) }}"
    public_dns: false
    image: "{{ app_instance_image }}"
    flavor:
      ec2: "{{ app_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "app_servers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - HostSG

  - name: appdb
    count: 1
    public_dns: false
    image: "{{ appdb_instance_image }}"
    flavor:
      ec2: "{{ appdb_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "database_servers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - HostSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: FrontendSG
    rules:

      - name: FrontHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:

      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:

      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: ShowroomExposed
        description: "Showroom views or exposed services, up to 26 of them"
        from_port: 8500
        to_port: 8525
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: A5D00916-788F-4CE2-9DA9-AB1CF5DABF00
  access_control:
    allow_groups:
      - rhpds-devs
      - rhpds-devs-rh1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Containerized Ansible Automation Platform 2"
    category: Red_Hat_One
    keywords:
      - ansible
      - aap2
      - rh1
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  secrets:
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
