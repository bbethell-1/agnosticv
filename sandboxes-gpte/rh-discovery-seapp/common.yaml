---
#include /includes/catalog-icon-rhel.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-2.yaml

#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml
#include /includes/secrets/demosat-rhel-7-8-and-9-latest.yaml
#include /includes/secrets/registry-redhat.yaml
#include /includes/secrets/openshift_assisted_installer.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Red Hat Discovery SEAPP
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: ec2

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL96GOLD-latest
controller_instance_image: aap-2.5-10.1-x86_64-20250304
satellite_instance_image: lb1152-satellite-6.17-20250407
rhel10_instance_image: RHEL-10.0-GOLD-latest
rhel9_instance_image: RHEL96GOLD-latest
rhel8_instance_image: RHEL87GOLD-latest
rhel7_instance_image: RHEL79GOLD-latest

default_instance_type: "t3a.large"
controller_instance_type: "m5ad.2xlarge"
satellite_instance_type: "r7a.2xlarge"

default_rootfs_size: 50
controller_rootfs_size: 200
satellite_rootfs_size: 250

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: AapSG
    rules:
      - name: WebAAPHTTPSPorts
        description: "Web AAP HTTPS Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: DiscoverySG
    rules:
      - name: DisHTTPSPorts
        description: "Discovery HTTPS Public"
        from_port: 9443
        to_port: 9443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------
# Instances
# -------------------
instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG
      - DiscoverySG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    image:
      name: "{{ controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ controller_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - NodeSG
      - WebSG
      - AapSG

  - name: "satellite"
    count: 1
    unique: true
    public_dns: true
    # image: "{{ satellite_instance_image | default(default_instance_image) }}"
    image:
      name: "{{ satellite_instance_image }}"
    flavor:
      ec2: "{{ satellite_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "satellites"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ satellite_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    image: "{{ rhel9_instance_image }}"
    flavor:
      ec2: "{{ rhel9_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes,nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhel9_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG

  - name: "rhel8"
    count: 1
    unique: true
    public_dns: false
    image: "{{ rhel8_instance_image }}"
    flavor:
      ec2: "{{ rhel8_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel8_nodes,nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhel8_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG

  - name: "rhel7"
    count: 1
    unique: true
    public_dns: false
    image: "{{ rhel7_instance_image }}"
    flavor:
      ec2: "{{ rhel7_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel7_nodes,nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhel7_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/rh_discovery.seapp.git
      type: git
      version: manifest-fix

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - set-repositories
    - common
    - bastion-lite
  controllers:
    - set-repositories
  nodes:
    - set-repositories

software_workloads:
  all:
    - control-user
  bastions:
    - rh_discovery.seapp.discovery
  controllers:
    - nginx_with_cert
  satellites:
    - rh_discovery.seapp.satellite

post_software_workloads:
  controllers:
    - ansible_automation_platform_configuration
  nodes:
    - rh_discovery.seapp.node

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_1' }}"
windows_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - bash-completion
  - bind-utils
  - buildah
  - git
  - httpd-tools
  - nano
  - podman
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget
  - ansible
  - discovery-installer

# -------------------------------------------------------------------
# Role: bastion-lite
# -------------------------------------------------------------------
install_bastion_lite: true

# -------------------------------------------------------------------
# Role: control-user
# -------------------------------------------------------------------
env_authorized_key: "{{guid}}key"
install_control_user: true
student_name: lab-user
student_password: "{{ common_password }}"
control_user_name: "{{ student_name }}"
control_user_password: "{{ common_password }}"
control_user_private_group: "{{ omit }}"

# -------------------------------------------------------------------
# Workload: nginx_with_cert
# -------------------------------------------------------------------
nginx_with_cert_encrypt_mail: opentlc-admin@opentlc.com
nginx_with_cert_hostname: "{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"

# -------------------------------------------------
# Role: rh_discovery.seapp.satellite
# -------------------------------------------------
rh_discovery_seapp_satellite_user_password: "{{ common_password }}"

# Auto-recovery for expired manifests (manifest-fix branch)
# TODO: Update to Satellite 6.17 manifest URL when available (ask Mitesh)
# Currently using 6.15 manifest for testing - may need version update
rh_discovery_seapp_satellite_manifest_url: "https://d18h2xbjo1t4w8.cloudfront.net/opentraining/satellite-6.15-ptl-manifest.zip"
rh_discovery_seapp_satellite_manifest_url_username: "{{ s3_rhpds_private_username }}"
rh_discovery_seapp_satellite_manifest_url_password: "{{ s3_rhpds_private_password }}"

# Optional: Enable fire-and-forget repository sync after manifest replacement
# Uncomment to test repo sync feature (adds ~30+ min async background task)
# rh_discovery_seapp_satellite_sync_repos: true

# -------------------------------------------------
# Role: rh_discovery.seapp.node
# -------------------------------------------------
rh_discovery_seapp_node_satellite_activation_key: AK_RHEL9

# -------------------------------------------------------------------
# Role: ansible_automation_platform_configuration
# -------------------------------------------------------------------
ansible_automation_platform_configuration_host: "https://{{ groups['controllers'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
ansible_automation_platform_configuration_username: admin
ansible_automation_platform_configuration_password: "R3dh4t1!"
ansible_automation_platform_configuration_verify_ssl: true
ansible_automation_platform_configuration_create_controller_token: false
ansible_automation_platform_configuration_generate_ocp_token: false

controller_dependency_check: false

aap_hostname: "{{ ansible_automation_platform_configuration_host }}"
aap_username: "{{ ansible_automation_platform_configuration_username }}"
aap_password: "{{ ansible_automation_platform_configuration_password }}"
aap_validate_certs: "{{ ansible_automation_platform_configuration_verify_ssl }}"

ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"

aap_configuration_dispatcher_roles:
  - {role: controller_license, var: controller_license, tags: controller_license}
  - {role: gateway_settings, var: gateway_settings, tags: gateway_settings}
  - {role: gateway_users, var: aap_user_accounts, tags: gateway_users}
  - {role: controller_credentials, var: controller_credentials, tags: controller_credentials}
  - {role: controller_inventories, var: controller_inventories, tags: controller_inventories}
  - {role: controller_hosts, var: controller_hosts, tags: controller_hosts}

controller_license:
  manifest_url: "https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip"

gateway_settings:
  SESSION_COOKIE_AGE: 9000

aap_user_accounts:
  - username: "lab-user"
    is_superuser: true
    password: "{{ common_password }}"
    email: "lab-user@redhat.com"
    organizations: "Default"
    first_name: "lab"
    last_name: User

controller_credentials:
  - name: lab-credential
    description: lab-user credential
    organization: "Default"
    credential_type: Machine
    inputs:
      username: ec2-user
      ssh_key_data: "{{ ssh_privatekey }}"
      become_method: sudo

controller_inventories:
  - name: "lab-inventory"
    description: "Inventory lab"
    organization: "Default"
    prevent_instance_group_fallback: false
    state: present

controller_hosts:
  - name: "{{ groups['rhel9_nodes'][0].split('.')[0] }}"
    inventory: "lab-inventory"
    variables:
      ansible_host: "rhel9.example.com"
  - name: "{{ groups['rhel8_nodes'][0].split('.')[0] }}"
    inventory: "lab-inventory"
    variables:
      ansible_host: "rhel8.example.com"
  - name: "{{ groups['rhel7_nodes'][0].split('.')[0] }}"
    inventory: "lab-inventory"
    variables:
      ansible_host: "rhel7.example.com"

# -------------------------------------------------------------------
# Role: agnosticv-userdata-import
# -------------------------------------------------------------------
agnosticv_importdata:
  guid: "{{ guid }}"
  satellite_url: "https://satellite.{{ guid }}{{ subdomain_base_suffix }}"
  satellite_username: "admin"
  satellite_password: "{{ common_password }}"
  # satellite_password: "on7zAsVAaaQZLoUp"
  sno_provision_data: "{{ sno_provision_data | default(omit) }}"
  single_node_openshift: "{{ single_node_openshift }}"


# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/rhpds/showroom-rh-discovery-seaap.git
showroom_user: showroom
showroom_ui: default
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_lab_users:
  - "{{ student_name }}"
showroom_tab_services: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: AF48CBBF-C01E-4CE4-9096-4F046C6B4F54
  anarchy:
    namespace: babylon-anarchy-4
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    display_name: "Red Hat Discovery for SEAPP"
    category: Demos
    keywords:
      - seapp
      - discovery
    labels:
      Provider: RH_Community
    parameters:
      - name: single_node_openshift
        formLabel: Single Node OpenShift
        formGroup: Additional Components
        openAPIV3Schema:
          default: true
          type: boolean
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-ubi9-aap2.5:1.0.1
      pull: missing
  components:
    - name: openshift
      display_name: OpenShift Cluster
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: sno
        host_ocp4_installer_version: '4.20'
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_api_key
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: bastion_public_hostname
          var: bastion_ansible_host
        - name: bastion_ssh_user_name
          var: bastion_ansible_user
        - name: bastion_ssh_password
          var: bastion_ansible_ssh_pass
        - name: bastion_ssh_port
          var: bastion_ansible_port
        - name: sandbox_openshift_api_key
          var: sandbox_openshift_api_key
        - name: sandbox_openshift_api_url
          var: sandbox_openshift_api_url
        - name: sandbox_openshift_namespace
          var: sandbox_openshift_namespace
        - name: aap_controller_admin_password
          var: aap_controller_admin_password
        - name: aap_controller_admin_user
          var: aap_controller_admin_user
        - name: aap_controller_web_url
          var: aap_controller_web_url
  owners:
    maintainer:
      - name: Lorenzo Micozzi
        email: lmicozzi@redhat.com
    sme:
      - name: Mitesh Sharma
        email: msharma@redhat.com
