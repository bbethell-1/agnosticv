---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Upgrade OCP override vars
# -------------------------------------------------------------------
ocp4_installer_version: "4.13.4"
ocp4_workload_catalogsource_tag: v4.13_2023_06_26
ocp4_workload_ossm_es_startingcsv: elasticsearch-operator.v5.7.2
ocp4_workload_ossm_jaeger_startingcsv: jaeger-operator.v1.42.0-5-0.1687199951.p
ocp4_workload_ossm_kiali_startingcsv: kiali-operator.v1.65.6
ocp4_workload_ossm_servicemesh_startingcsv: servicemeshoperator.v2.4.0
ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.3-opr-002

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/redhat-gpte-devopsautomation/ossm-labs
ocp4_workload_gitops_bootstrap_repo_revision: helm
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: user
  ossm:
    values:
      myKey: myValue1
  usertool:
    labAdminPassword: "{{ common_admin_password }}"
    labUserPassword: "{{ common_user_password }}"
    labAccessToken: "{{ common_user_password }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/juliaaano/agnosticd.git
    scm_ref: development
