---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.4xlarge
master_instance_count: 1
worker_instance_type: m6a.4xlarge
worker_instance_count: 1
bastion_instance_type: t2.small
bastion_instance_image: RHEL91GOLD-latest

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.14.10"

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.14_2024_02_12

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.11

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.5
ocp4_workload_gitea_operator_starting_csv: gitea-operator.v2.0.5

ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.21.3"
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel9/postgresql-13
ocp4_workload_gitea_operator_postgresql_image_tag: 1-165

ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: user1
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/redhat-gpte-devopsautomation/ossm-labs
  name: ossm-labs
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_ossm
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: elasticsearch-operator.v5.8.3

ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: jaeger-operator.v1.51.0-1

ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: kiali-operator.v1.65.11

ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: servicemeshoperator.v2.4.5

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhsso
# -------------------------------------------------------------------
ocp4_workload_rhsso_namespace: rhsso
ocp4_workload_rhsso_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_channel: stable
ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.6-opr-004
ocp4_workload_rhsso_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/redhat-gpte-devopsautomation/ossm-labs
ocp4_workload_gitops_bootstrap_repo_revision: helm
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: user
  ossm:
    values:
      myKey: myValue1
  usertool:
    labAdminPassword: "{{ common_admin_password }}"
    labUserPassword: "{{ common_user_password }}"
    labAccessToken: "{{ common_user_password }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/juliaaano/agnosticd.git
    scm_ref: development
