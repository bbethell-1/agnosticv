---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workload: ocp4_workload_codeserver
# -------------------------------------------------------------------
ocp4_workload_codeserver_image: quay.io/skoussou/codeserver
ocp4_workload_codeserver_image_tag: latest

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: user
  ossm:
    values:
      myKey: myValue1
  usertool:
    labAdminPassword: "{{ common_admin_password }}"
    labUserPassword: "{{ common_user_password }}"
    labAccessToken: "{{ common_user_password }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/skoussou/agnosticd.git
    scm_ref: development
