---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_cert_manager_operator
- ocp4_workload_openshift_gitops
- ocp4_workload_gitea_operator
- ocp4_workload_codeserver
- ocp4_workload_ossm
- ocp4_workload_rhsso
- ocp4_workload_showroom
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload: ocp4_workload_codeserver
# TODO Remove workload if showroom terminal can be used
# -------------------------------------------------------------------
ocp4_workload_codeserver_image: quay.io/gpte-devops-automation/codeserver
ocp4_workload_codeserver_image_tag: v4.14.0-java11
ocp4_workload_codeserver_init_image: quay.io/gpte-devops-automation/codeserver-init
ocp4_workload_codeserver_init_image_tag: v4.14.0
ocp4_workload_codeserver_gitea_name: "{{ ocp4_workload_gitea_operator_gitea_hostname }}"
ocp4_workload_codeserver_gitea_namespace: "{{ ocp4_workload_gitea_operator_project }}"
ocp4_workload_codeserver_multi_user_install: false
ocp4_workload_codeserver_multi_user_num_users: 1
ocp4_workload_codeserver_multi_user_username_base: user
ocp4_workload_codeserver_repos_user: user1
ocp4_workload_codeserver_password: "{{ common_user_password }}"
ocp4_workload_codeserver_repos_password: "{{ common_user_password }}"
ocp4_workload_codeserver_repos:
- name: ossm-labs
  account: user1
  branch: main
# -------------------------------------------------------------------
# Workload: ocp4_workload_ossm
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: elasticsearch-operator.v5.8.4

ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: jaeger-operator.v1.53.0-4

ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: kiali-operator.v1.73.4

ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: servicemeshoperator.v2.5.0

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhsso
# -------------------------------------------------------------------
ocp4_workload_rhsso_namespace: rhsso
ocp4_workload_rhsso_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_channel: stable
ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.7-opr-001
ocp4_workload_rhsso_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager_operator
# -------------------------------------------------------------------
ocp4_workload_cert_manager_operator_channel: stable-v1
ocp4_workload_cert_manager_operator_channel_csv: cert-manager-operator.v1.13.0

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/skoussou/ossm-labs
  name: ossm-labs
  private: false

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/skoussou/ossm-showroom
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/skoussou/ossm-labs
ocp4_workload_gitops_bootstrap_repo_revision: helm
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user: user1
  ossm:
    values:
      myKey: myValue1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/skoussou/agnosticd.git
    scm_ref: development
