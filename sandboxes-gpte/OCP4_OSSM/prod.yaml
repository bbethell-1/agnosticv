---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.4xlarge

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/redhat-gpte-devopsautomation/ossm-labs
ocp4_workload_gitops_bootstrap_repo_revision: helm-v1.0.1
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: user
  ossm:
    git:
      revision: helm-v1.0.1
    values:
      myKey: myValue1
  usertool:
    labAdminPassword: "{{ common_admin_password }}"
    labUserPassword: "{{ common_user_password }}"
    labAccessToken: "{{ common_user_password }}"
  guides:
    repoRevision: v1.0.1
    image: ghcr.io/redhat-gpte-devopsautomation/ossm-labs-guides:v1.0.1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: ocp4-ossm-1.0
