---
#include /includes/parameters/event-selector.yaml
#include /includes/parameters/event-lifetime-runtime.yaml
#include /includes/access-restriction-devs-only.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: c6in.4xlarge

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_revision: helm-v1.0.0

ocp4_workload_gitops_bootstrap_helm_values:
  user:
    count: "{{ num_users }}"
    prefix: user
  ossm:
    git:
      revision: helm-v1.0.0
    values:
      myKey: myValue1
  usertool:
    labAdminPassword: "{{ common_admin_password }}"
    labUserPassword: "{{ common_user_password }}"
    labAccessToken: "{{ common_user_password }}"
  guides:
    repoRevision: v1.0.0
    image: ghcr.io/skoussou/summit-ossm-labs-guides:v1.0.0

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 8

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    scm_ref: ocp4-ossm-1.0
  catalog:
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 40
        minimum: 2
        maximum: 50
