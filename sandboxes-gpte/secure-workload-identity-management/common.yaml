# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-consolidated

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# ------------------------------------------------------
# Catalog Item Parameters
# ------------------------------------------------------
rosa_deploy: true
rosa_deploy_hcp: true
rosa_setup_cluster_admin: true

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
rosa_installer_version: latest
rosa_version: latest-upgrade
rosa_version_base: openshift-v4.19
rosa_setup_cluster_admin_login: true
rosa_compute_machine_type: "{{ compute_instance_type }}"

#billing account for HCP
aws_billing_account_id: "017310218799"

bastion_instance_type: "t3a.small"
bastion_instance_image: RHEL96GOLD-latest

bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to Defense in Depth: Advanced Security for Container Workloads on ROSA
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# Extra packages to install
common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
print_agnosticd_user_info: false

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
student_name: rosa

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_rosa_machinepool
  - ocp4_workload_openshift_gitops
  - ocp4_workload_rhacs
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# ocp4_workload_rosa_machinepool
# -------------------------------------------------------------------
ocp4_workload_rosa_machinepool_replicas: 1
ocp4_workload_rosa_machinepool_instance_types:
  - "{{ compute_instance_type }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.9"
ocp4_workload_rhacs_install_operator_starting_csv: ""
ocp4_workload_rhacs_automatic_install_plan_approval: true
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_enable_route_certs: true

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.15
ocp4_workload_openshift_gitops_setup_cluster_admin: true

ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/secure-workload-identity-management-showroom.git
