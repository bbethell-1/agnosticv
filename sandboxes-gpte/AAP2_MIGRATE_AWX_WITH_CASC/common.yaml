---
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml
#include /includes/parameters/automation-hub-enable.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: controller_migration_casc

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_1' }}"

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------
windows_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el9:
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - at
  - python3-pip
  - gcc
  - ansible

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
# use_content_view: true
# set_repositories_rhel8_lock_release: '8'

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
vscode_server_ansible_become: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 23af08a4-7a70-4208-a589-7583f348267e
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Migration AWX/Tower to AAP using CaC
    category: Workshops
    keywords:
      - ansible
      - workshop
      - awx
      - tower
      - aap2
      - migration
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters: []
  secrets:
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
    - name: ansible-tower-advanced-2
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
