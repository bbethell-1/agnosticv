---
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/demosat-rhel-9.3-ansible-2.4.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/ansible_control_plane/current_controller.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: controller-migration-casc

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_1' }}"

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------
tower_admin_user: "admin"
tower_admin_password: "{{ common_password }}"
automationcontroller_admin_password: '{{ tower_admin_password }}'

aap_devel_tools_repos_enable: true
aap_devel_tools_install: true
aap_devel_tools_repos:
  - ansible-automation-platform-2.4-for-rhel-9-x86_64-rpms

root_filesystem_size: 20

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el9:
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - at
  - python3-pip
  - gcc
  - ansible

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
# use_content_view: true
# set_repositories_rhel8_lock_release: '8'

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"
tower_license_manifest: "{{ controller_manifest }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 23af08a4-7a70-4208-a589-7583f348267e
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Migration AWX/Tower to AAP using CaC
    category: Workshops
    keywords:
      - ansible
      - workshop
      - awx
      - tower
      - aap2
      - migration
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters: []
  secrets:
    - name: ansible-tower-advanced-2
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: aap2-workshop
      namespace: gpte
