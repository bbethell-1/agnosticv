---
purpose: development

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: devel.opentlc.com

#include /includes/parameters/num-users-salesforce.yaml

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------
tower_admin_user: "admin"
tower_admin_password: "{{ common_password }}"
automationcontroller_admin_password: '{{ tower_admin_password }}'

aap_devel_tools_repos_enable: true
aap_devel_tools_install: true
aap_devel_tools_repos:
  - ansible-automation-platform-2.4-for-rhel-9-x86_64-rpms

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: true

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/automationiberia/agnosticd.git
    scm_ref: controller_migration_casc_dev
...
