---
purpose: development

# Sets the Route53 DNS zone to use for Amazon Web Services
workshop_dns_zone: devel.opentlc.com

# ---------------------------------------------------------
# Babylon meta variables
# ---------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/automationiberia/agnosticd.git
    scm_ref: controller_migration_casc_dev
  catalog:
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the environment.
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 100
        validation: >-
          num_users == 1 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than one requires a valid SalesForceID.')
...
