---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/openshift_release_version.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: studentvm
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Instance Details
# -------------------------------------------------------------------
studentvm_instance_type: "t3.medium"
studentvm_rootfs_size: 100
studentvm_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Student roles to deploy
# -------------------------------------------------------------------
studentvm_roles:
- studentvm_user
- studentvm_bash_prompt
- studentvm_ocp4
- studentvm_java_development

# -------------------------------------------------------------------
# student role: studentvm_user
# -------------------------------------------------------------------
studentvm_user_name: "{{ student_name }}"
studentvm_user_use_password: true
studentvm_user_enable_sudo: true
studentvm_user_password: ""

# -------------------------------------------------------------------
# student role: studentvm_ocp4
# -------------------------------------------------------------------
studentvm_ocp4_user_name: "{{ student_name }}"
studentvm_ocp4_oc_version: "{% if osrelease is version_compare('4.10.0', '>=') %}4.10{% elif osrelease is version_compare('4.6.0', '>=') %}4.6{% elif osrelease is version_compare('4.5.0', '>=') %}4.5{% else %}4.4{% endif %}"
studentvm_ocp4_helm_version: '3.5.0'
studentvm_ocp4_odo_version: 'v2.0.4'
studentvm_ocp4_tkn_version: '0.15.0'
studentvm_ocp4_kn_version: '0.18.4'
studentvm_ocp4_opm_version: 'v1.16.1'
studentvm_ocp4_istioctl_version: '1.4.10'
ocp4_installer_odo_url: https://developers.redhat.com/content-gateway/file/pub/openshift-v4/clients

# -------------------------------------------------------------------
# student role: studentvm_bash_prompt
# -------------------------------------------------------------------
studentvm_bash_prompt_user_name: "{{ student_name }}"

# -------------------------------------------------------------------
# student role: studentvm_java_development
# -------------------------------------------------------------------
studentvm_java_development_jdk_package: "java-1.8.0-openjdk-devel"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: d843fd04-90df-4699-9825-73e3ac73a055
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 Student VM
    parameters: []
    category: Labs
    keywords:
    - lab
    - ocp4
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
  secrets:
  - name: satellite-rhel86-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: aws-gpte
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
