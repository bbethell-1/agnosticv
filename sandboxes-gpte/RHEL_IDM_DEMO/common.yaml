---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml
#include /includes/parameters/open-environment-annotation.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# Config
env_type: ansible-multitier-rhel8

software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite
use_content_view: true
satellite_activationkey: agd-training-2
set_repositories_satellite_ha: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
# AWS machine vars
workstation_instance_image: "RHEL84GOLD-latest"
node_instance_image: "RHEL84GOLD-latest"

requirements_content:
  collections:
  - name: amazon.aws
    version: 2.2.0

# -------------------------------------------------------------------
# BookBag VARS
# -------------------------------------------------------------------
#bookbag_git_repo: https://github.com/xtophd/RHEL8-Workshop-Bookbag.git
#bookbag_git_version: Summit_2021

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user

# Instance type
student_name: student
install_student_user: true

admin_user: opentlc-mgr

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 1A4464F6-9BC5-454B-9A7B-F5A0BF0899D3
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: RHEL IDM Demo
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
    parameters: []
  owners:
  - email: msawyer@redhat.com
    name: Matt Sawyer
  secrets:
  - name: gpte-no-repos
    namespace: gpte
  - name: labsat-ha-secrets
    namespace: gpte
