---
# Platform
platform: rhpds
env_type: ocp4-workshop
# These come from the account
# subdomain_base_suffix: .example.opentlc.com
# HostedZoneId: Z3IHLWJZOU9SRT
# Config
install_ocp4: true
ocp4_installer_version: "4.3.1"
run_janitor: false

# Repos
osrelease: 4.1.0
repo_version: '4.1'
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease
# -- Instances : probably best to put these in prod.yaml
master_instance_type: m5.4xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 3
bastion_instance_type: t2.large

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_openshiftapb: false
install_nexus: false
install_lets_encrypt_certificates: false
install_metrics: false
install_logging: false
enable_workshops_catalog: false
lets_encrypt_production: false
run_ocp_diagnostics: false

# --- This is not a Lab Environment -> Install FTL
install_ftl: false
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password:
# --- Student is allowed to sudo and switch to root
student_sudo: true
# --- OCP Authentication
install_idm: htpasswd
admin_user: admin
# --- admin_password required, no defaults in agnosticd
admin_password: r3dh4t1!

# Default workloads are a YAML list
default_workloads:
  - ocp4-workload-minio
  - ocp4-workload-migration-training
# --- Infra and Student Workloads are comma separated strings

_minio_access_key: "minio"
_minio_secret_key: "minio123"

agnosticv_meta:
  sandboxed: true
  params_to_variables:
    user: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ''
  nuke_sandbox: true
  virtualenv: aws-ansible-2.9

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 156ec08e-6a1e-4049-928a-ebad5adeb157
