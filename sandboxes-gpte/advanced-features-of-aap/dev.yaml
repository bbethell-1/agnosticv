---
#include /includes/secrets/letsencrypt_with_zerossl_fallback.yaml

# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: dev

default_instance_image: RHEL96GOLD-latest

controller_instance_image: rhpds-aap2.6-ceh-20260209
ansible_automation_platform_configuration_password: "ansible123!"

# -------------------------------------------------------------------
# Ansible Module, Collections, and Roles Requirements
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: l3d.git
      version: 1.1.10
    - name: https://github.com/rhpds/rhpds.manage_host.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user
    - vscode-server
    - gitea_vm_setup

software_workloads:
  bastions:
    - aap_devel_tools
  controllers:
    - nginx_with_cert
    - ansible_automation_platform_configuration

post_software_workloads:
  all:
    - rhpds.manage_host.asset_injector

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
  bastions:
    - showroom

# -------------------------------------------------------------------
# Role: asset_injector
# -------------------------------------------------------------------
bastion_asset_injector_assets:
  - description: Remove IPv4 port 80 default_server
    module: lineinfile
    path: /etc/nginx/nginx.conf
    state: absent
    regexp: '^\s*listen\s+80\s+default_server;'

  - description: Remove IPv6 port 80 default_server
    module: lineinfile
    path: /etc/nginx/nginx.conf
    state: absent
    regexp: '^\s*listen\s+\[::\]:80\s+default_server;'

  - description: Restart nginx
    module: service
    name: nginx
    state: restarted

nodes_asset_injector_assets:
  - description: Remove insights-client package
    become: true
    module: dnf
    name: insights-client
    state: absent

  - description: Create ansible group_vars directory
    module: file
    path: /etc/ansible/group_vars/
    state: directory

  - description: Create ansible all directory
    module: file
    path: /etc/ansible/group_vars/all
    state: directory

  - description: Create user data file
    module: file
    path: /etc/ansible/group_vars/all/agnosticd_user_data.yml
    state: touch

  - description: Save agnosticd_user_info
    module: lineinfile
    path: /etc/ansible/group_vars/all/agnosticd_user_data.yml
    state: present
    insertafter: 'EOF'
    line: |
      ---
      {{ lookup ('agnosticd_user_data', '*' ) |  to_nice_yaml }}

asset_injector_modules: >-
  {{
    bastion_asset_injector_assets
    if 'bastions' in group_names
      else nodes_asset_injector_assets
        if 'nodes' in group_names
          else []
  }}


# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://gitlab.com/ansible-labs-crew/showroom-lb1706-advance-feature-of-aap.git
showroom_git_ref: main
# showroom_acme_zerossl_acme_challenge: https
showroom_user: showroom
showroom_ui: default
showroom_tls_provider: zerossl
showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey
showroom_ttys_enable_tmux: false
showroom_tab_services:
  - web1
  - web2
  - single_terminal

showroom_lab_users:
  - "{{ student_name }}"

showroom_ssh_username: "{{ student_name }}"

showroom_tab_web1_url: "https://{{ showroom_host }}:8443/"
showroom_tab_web1_name: Codeserver

showroom_tab_web2_url: "{{ aap_hostname }}"
showroom_tab_web2_name: AAP

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
