---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
env_type: three-tier-app
install_ftl: false
ftl_use_python3: false
# -------------------------------------------------
# AWS Network settings
# -------------------------------------------------
subdomain_base_short: "{{ guid }}"
subdomain_base_suffix: ".example.opentlc.com"
subdomain_base: "{{ subdomain_base_short }}{{ subdomain_base_suffix }}"
aws_dns_zone_private: "example.com."
aws_dns_zone_private_chomped: "example.com"

# -------------------------------------------------
# AWS EC2 Environment Sizing
# -------------------------------------------------
default_instance_type: "t3a.medium"
default_instance_image: "RHEL91GOLD-latest"
default_rootfs_size_node: 30

# -------------------------------------------------
# AWS EC2 Security Groups
# -------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: ClientSSHPort
        description: "Client SSH Public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: PaymentPort
        description: "Payment Pod Public"
        from_port: 8080
        to_port: 8080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: DatabasePort
        description: "Database Pod Public"
        from_port: 5432
        to_port: 5432
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------
# AWS EC2 Instances
# -------------------------------------------------
instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size_node | default(default_rootfs_size_node) }}"
    security_groups:
      - BastionSG

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: ansible.utils
    version: 2.7.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: apac-service-interconnect-patch-6
