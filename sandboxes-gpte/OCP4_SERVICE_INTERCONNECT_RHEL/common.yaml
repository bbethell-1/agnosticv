---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-service-interconnect.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/satellite-rhel9.1-lab.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: just-bastion
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: RHEL91GOLD-latest
node_instance_image: RHEL91GOLD-latest
leap_instance_image: RHEL86GOLD-latest
set_repositories_rhel8_lock_release: '8.6'
set_repositories_rhel9_lock_release: '9.1'

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user
key_name: ""
install_student_user: true
student_name: lab-user
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# AWS EC2 Security Groups
# -------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: ClientSSHPort
        description: "Client SSH Public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: PaymentPort
        description: "Payment Pod Public"
        from_port: 8080
        to_port: 8080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: DatabasePort
        description: "Database Pod Public"
        from_port: 5432
        to_port: 5432
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 15824d03-fae9-48f3-8c14-55a7fb218f43
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Service Interconnect - RHEL 9
    category: Demos
    keywords:
      - rhel9
      - service-interconnect
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
      Featured_Score: '70'
    parameters: []
  secrets:
    - name: output-dir-s3
      namespace: gpte
