---
#include /includes/catalog-icon-service-interconnect.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel8-base

# Unset key name
key_name: ""

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
rhel8_instance_image: RHEL87GOLD-latest
rhel8_instance_type: "t3a.large"
rootfs_size_rhel8: 200

instances:
- name: "rhel8"
  count: 1
  unique: true
  public_dns: true
  floating_ip: true
  image: "{{ rhel8_instance_image }}"
  flavor:
    ec2: "{{ rhel8_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  rootfs_size: "{{ rootfs_size_rhel8 }}"
  volumes:
  - device_name: "/dev/xvdb"
    size: "20"
    type: gp3
  security_groups:
  - BastionSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Service Interconnect - RHEL
    category: Demos
    keywords:
    - rhel
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: true
    parameters: []
  secrets:
  - name: satellite-rhel8-base-microshift-ha
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
