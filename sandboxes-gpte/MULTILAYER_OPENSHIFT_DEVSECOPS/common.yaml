---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-name.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
platform: RHPDS
env_type: ocp4-cluster
ocp4_installer_version: "4.7"
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
# Satellite is used for RHEL repos
repo_method: satellite
# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# OCP Authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('2') }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Worklods
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_dso

student_workloads: []

# -------------------------------------------------------------------
# Bookbag
# -------------------------------------------------------------------
# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://github.com/RedHatDemos/SecurityDemos/tree/master/2021Labs/OpenShiftSecurity/documentation/bookbag

# -------------------------------------------------------------------
# Agnosticv Meta
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Security with OCP for DevSecOps
    category: Demos
    keywords:
      - ocp47
      - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
      -name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 25
      validation: >-
        num_users == 1 ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: satellite-rhel81-ha
    - namespace: gpte
      name: satellite-security-ocp4-dso-pull-secret
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: guidgrabber-api
