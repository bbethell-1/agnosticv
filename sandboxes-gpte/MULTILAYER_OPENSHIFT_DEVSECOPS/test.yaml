---
# Implementing Multi-Layer Container and Kubernetes Security with OpenShift for Automated DevSecOps

purpose: testing      ## This is a cost tag, please make sure it's correct.
cloudformation_retries: 0

agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  virtualenv: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    infra_workloads: infra_workloads
    region: aws_region
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    git_tag_prefix: multilayer-openshift-devsecops-test
    virtualenv: ansible2.9-python3.6-2021-01-22
  aws_sandboxed: true
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
  secrets:
    - namespace: gpte
      name: ocp4-token
    - namespace: gpte
      name: satellite-rhel81
    - namespace: gpte
      name: satellite-security-ocp4-dso-pull-secret
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: guidgrabber-api
