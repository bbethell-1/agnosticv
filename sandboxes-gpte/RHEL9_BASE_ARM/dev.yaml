purpose: development
security_groups:
- name: WebSG
  rules:
  - name: WebHTTPSPorts
    description: HTTPS Public
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
  - name: WebHTTPPorts
    description: HTTP Public
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
  - name: WebHTTPPorts
    description: HTTP Public
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
  - name: WebCockpitPorts
    description: Cockpit HTTP Public
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: 0.0.0.0/0
    rule_type: Ingress
__meta__:
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
