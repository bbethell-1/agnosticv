---
purpose: development
cloudformation_retries: 0

## Setting install_ftl: false as worksaround for broken DEV https://github.com/redhat-cop/agnosticd/pull/1072

install_ftl: false

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
_infra_instance_type: m4.4xlarge
_infra_node_replicas: 1

# Workload Variables
install_lets_encrypt_certificates: false

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
