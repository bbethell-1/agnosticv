---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Number of VMs
# -------------------------------------------------------------------
master_instance_count: 3
worker_instance_count: 2
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users_cf | default('1')) | int }}"


# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_url: https://github.com/davemeurer/agnosticd.git
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
