---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: rhpds-prod

# -------------------------------------------------------------------
# Number of VMs
# worker_instance_count from Catalog Item
# -------------------------------------------------------------------
master_instance_count: 3

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 6
  idle_after_start: 6
  deploy_with: babylon
  params_to_variables:
    nodecount: ''
    user: ''
    region: aws_region
__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    git_tag_prefix: ocp4-workshop-snyk-rhpds-prod
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81
