---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-3regions.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/dynamic-aws-dns.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-9-arm-latest.yaml
#include /includes/parameters/controlplane-count.yaml
#include /includes/parameters/ocp4-installer-version.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/arm64/clients
ocp4_installer_use_dev_preview: false

# ARM Specific, host-ocp4-installer does not currently render these URLs correctly
ocp4_client_url: "{{ ocp4_installer_root_url }}/ocp/stable-{{ ocp4_installer_version }}/openshift-client-linux.tar.gz"
ocp4_installer_url: "{{ ocp4_installer_root_url }}/ocp/stable-{{ ocp4_installer_version }}/openshift-install-linux.tar.gz"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# AWS Specific for ARM
# -------------------------------------------------------------------
bastion_instance_type: "t4g.medium"
master_instance_type_family: m6g
master_instance_type_size: >-
  {{ '4xlarge' if master_instance_count|int <= 1
  else '2xlarge' if worker_instance_count|int <= 10
  else '4xlarge' if worker_instance_count|int <= 20
  else '8xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"

master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}
worker_instance_type: "m6g.4xlarge"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"

worker_storage_type: gp3
bastion_instance_image: RHEL94GOLD-latest

ocp4_architecture_cluster: arm64

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_channel: stable-v1.14
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: a509ec00-6c04-4a2a-9fa4-678aef4139df
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenShift Container Platform Cluster on ARM (AWS)
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '94'
    multiuser: true
    parameters: []
