---
#include /includes/catalog-icon-aap.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel81.yaml

# -------------------------------------------------------------------
# --- Catalog Item: RHTE 2023 GitOps Ansible Automation Platform 2
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variable
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
__image: RHEL84GOLD-latest
__instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: t3a.medium

key_name: opentlc_admin_backdoor
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

num_users: 1
user_base: devops

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------

security_groups:

  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------

instances:

  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - WebSG
      - HostSG

  - name: frontend
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    image: "{{ frontend_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ frontend_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "load_balancers"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - WebSG
      - HostSG

  - name: "app"
    count: "{{ app_instance_count | default(2) }}"
    public_dns: false
    image: "{{ app_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ app_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "app_servers"
      - key: "ostype"
        value: "linux"
    security_groups:
      - BastionSG
      - DefaultSG
      - WebSG
      - HostSG

  - name: database01
    count: 1
    unique: true
    public_dns: false
    image: "{{ database_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ database_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "database_servers"
      - key: "ostype"
        value: "rhel"
    security_groups:
      - DefaultSG
      - HostSG
      - BastionSG

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"
master_instance_count: 3
master_instance_type: m5a.4xlarge
worker_instance_count: 2
worker_instance_type: m5a.2xlarge
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: "{{ user_base }}1"
student_password: "{{ common_password }}"
student_sudo: true

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
sandbox_student_user: true
sandbox_user_info_messages_enable: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: ansible.utils
      version: 2.6.1

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_le_certificates
  - ocp4_workload_authentication
  - ocp4_workload_gitea_operator
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
  - ocp4_workload_codeserver
  - ocp4_workload_gitops_aap
  - automation-controller-config
  - ocp4_workload_rhacs
  - ocp4_workload_rhacs_secured_cluster
  - ocp4_workload_tekton_execution_environment
  - ocp4_workload_bookbag_setup
  - ocp4_workload_bookbag_user

ocp4_workload_bookbag_setup_git_repo: https://github.com/redhat-gpte-devopsautomation/rhte-2023-gitops-aap2.git
ocp4_workload_bookbag_setup_git_version: main
ocp4_workload_bookbag_setup_project: bookbag-base-rhte-{{ guid }}
ocp4_workload_bookbag_user_image_namespace: bookbag-base-rhte-{{ guid }}
ocp4_workload_bookbag_user_project: bookbag-rhte-{{ guid }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: "{{ user_base }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.1

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.20.1"
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true

ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: dev-admin
ocp4_workload_gitea_operator_admin_email: dev-admin@opentlc.com
ocp4_workload_gitea_operator_admin_password: "{{ common_password }}"

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: devops1
ocp4_workload_gitea_operator_user_password: "{{ common_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:

  - name: aap2-gitops
    repo: https://github.com/redhat-gpte-devopsautomation/aap2-gitops.git
    private: false

  - name: ee-pipeline
    repo: 'https://github.com/redhat-gpte-devopsautomation/multitier-execution-environment.git'
    private: false

  - name: ee-automated-pipeline
    repo: 'https://github.com/redhat-gpte-devopsautomation/multitier-execution-environment.git'
    private: false

  - name: multitier-aap
    repo: 'https://github.com/tonykay/multi-tier-app-deployer'
    private: false

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog    # yamllint disable rule:line-length
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_codeserver
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_codeserver_name: codeserver
ocp4_workload_codeserver_workspace_name: ide
ocp4_workload_codeserver_password: "{{ common_password }}"
ocp4_workload_codeserver_pvc_size: 3Gi
ocp4_workload_codeserver_gitea_name: gitea
ocp4_workload_codeserver_gitea_namespace: gitea
ocp4_workload_codeserver_extensions:
  - filename: auchenberg.vscode-browser-preview-0.7.2.vsix
    url: https://gpte-public.s3.amazonaws.com/vscode-plugins/auchenberg.vscode-browser-preview-0.7.2.vsix

# Repositories to set up in codeserver
ocp4_workload_codeserver_repos_user: "{{ user_base }}1"
ocp4_workload_codeserver_repos_password: "{{ common_password }}"
ocp4_workload_codeserver_repos:

  - account: '{{ user_base }}1'
    branch: main
    name: aap2-gitops

  - account: '{{ user_base }}1'
    branch: main
    name: ee-pipeline

  - account: '{{ user_base }}1'
    branch: main
    name: ee-automated-pipeline

  - account: '{{ user_base }}1'
    branch: main
    name: multitier-aap

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_aap
# -------------------------------------------------------------------
ocp4_workload_gitops_aap_install_controller: true
ocp4_workload_gitops_aap_install_hub: true
ocp4_workload_gitops_aap_repo: "{{ _ocp4_workload_gitea_operator_gitea_route }}/{{ user_base }}1/aap2-gitops"
automation_hub_admin_password:
# -------------------------------------------------------------------
# Workload: automation-controller-config
# -------------------------------------------------------------------
automation_controller_upload_manifest: true
automationcontroller_manifest_url: https://gpte-public.s3.amazonaws.com/aap2-subscription/manifest_31_10_2022.zip

ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"
ssh_publickey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path_pub) }}"
account_user_access_key: "{{ aws_access_key_id }}"
account_user_secret_access_key: "{{ aws_secret_access_key }}"

automation_controller_credentials:

  - name: "Demo Credential"
    credential_type: Machine
    organization: ''
    state: absent

  - name: Multitier Nodes
    description: Multitier Nodes
    credential_type: Machine
    username: ec2-user
    ssh_key_data: "{{ ssh_privatekey }}"

  - name: aws_credentials
    description: aws_credentials
    credential_type: "Amazon Web Services"
    username: "{{ account_user_access_key }}"
    password: "{{ account_user_secret_access_key }}"

  - name: hub_registry_credentials
    description: Hub Registry credentials
    credential_type: "Container Registry"
    host: "{{ automation_hub_hostname }}"
    username: "admin"
    password: "{{ automation_hub_admin_password }}"
    verify_ssl: false

automation_controller_users:

  - name: "{{ user_base }}1"
    password: "{{ common_password }}"
    superuser: true

automation_controller_projects:

  - name: "Demo Project"
    state: absent

  - name: "multitier-aap"
    description: "Multi Tier Application"
    scm_type: git
    scm_url: "{{ _ocp4_workload_gitea_operator_gitea_route }}/{{ user_base }}1/multitier-aap"
    allow_override: true

automation_controller_inventories:

  - name: "Demo Inventory"
    state: absent

  - name: "multitier-app-dynamic-inventory"
    description: "Multi Tier App inventory"

automation_controller_inventory_sources:

  - name: "aws_source"
    description: "aws dynamic inventory"
    inventory: "multitier-app-dynamic-inventory"
    credential: "aws_credentials"
    source: ec2
    source_vars:
      keyed_groups:
        - prefix: tag
          key: tags

automation_controller_inventory_groups:

  - name: tag_AnsibleGroup_load_balancers
    description: Frontend tag
    inventory: "multitier-app-dynamic-inventory"

  - name: tag_AnsibleGroup_app_servers
    description: application servers tag
    inventory: "multitier-app-dynamic-inventory"

  - name: tag_AnsibleGroup_database_servers
    description: database servers tag
    inventory: "multitier-app-dynamic-inventory"

  - name: load_balancers
    description: Frontend load balancer
    inventory: "multitier-app-dynamic-inventory"
    children:
      - tag_AnsibleGroup_load_balancers

  - name: app_servers
    description: application servers
    inventory: "multitier-app-dynamic-inventory"
    children:
      - tag_AnsibleGroup_app_servers

  - name: database_servers
    description: database servers
    inventory: "multitier-app-dynamic-inventory"
    children:
      - tag_AnsibleGroup_database_servers

automation_controller_jobtemplates:

  - name: "Demo Job Template"
    state: absent

  - name: "multitier-app-deployer"
    description: "multitier application deployer"
    inventory: "multitier-app-dynamic-inventory"
    project: multitier-aap
    playbook: "deploy-app.yml"
    credentials:
      - "Multitier Nodes"

  - name: "multitier-app-teardown"
    description: "multitier application teardown"
    inventory: "multitier-app-dynamic-inventory"
    project: multitier-aap
    playbook: "teardown-app.yml"
    credentials:
      - "Multitier Nodes"

  - name: "multitier-app-smoketest"
    description: "multitier application smoketest"
    inventory: "multitier-app-dynamic-inventory"
    project: multitier-aap
    playbook: "smoke-test-app.yml"
    credentials:
      - "Multitier Nodes"

  - name: "multitier-app-deploy-verification"
    description: "multitier application with local postgres requirements"
    inventory: "multitier-app-dynamic-inventory"
    project: multitier-aap
    playbook: "deploy-app.yml"
    scm_branch: postrgres-requirements-included
    credentials:
      - "Multitier Nodes"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------

ocp4_workload_rhacs_install_operator_channel: "rhacs-3.69"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v3.69.1"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: "v4.10_2022_04_04"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tekton_execution_environment
# -------------------------------------------------------------------
ocp4_workload_tekton_ee_namespace: ansible-ee-pipeline
ocp4_workload_tekton_ee_event_listener_token: "{{ common_password }}"
ocp4_workload_tekton_ee_automation_controller_job_template: "multitier-app-deployer"
ocp4_workload_tekton_ee_automation_controller_registry_credential: "hub_registry_credentials"
ocp4_workload_tekton_ee_internal_registry_sa: registry-admin
ocp4_workload_tekton_ee_centeral_stackrox_username: admin
ocp4_workload_tekton_ee_centeral_stackrox_password: "{{ ocp4_workload_rhacs_central_admin_password }}"
ocp4_workload_tekton_ee_centeral_stackrox_inform_only_policies:
  - Fixable Severity at least Important

ocp4_workload_tekton_ansible_execution_environments:
  - pipeline_name: p1
    pipeline_dir: section1
    type: gitea
    webhook: false
    git_params:
      api_url: "{{ _ocp4_workload_gitea_operator_gitea_route }}/api/v1"
      url: "{{ _ocp4_workload_gitea_operator_gitea_route }}"
      repository: "{{ user_base }}1/ee-pipeline"
      branch: main
      username: "{{ user_base }}1"
      password: "{{ common_password }}"
    ee_params:
      name: ee-pipeline
      tag: 1.0.0

  - pipeline_name: p2
    pipeline_dir: section2
    type: gitea
    webhook: true
    git_params:
      api_url: "{{ _ocp4_workload_gitea_operator_gitea_route }}/api/v1"
      url: "{{ _ocp4_workload_gitea_operator_gitea_route }}"
      repository: "{{ user_base }}1/ee-automated-pipeline"
      branch: main
      username: "{{ user_base }}1"
      password: "{{ common_password }}"
    ee_params:
      name: ee-automated-pipeline
      tag: 1.0.0

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: e3b2c56b-47e3-4f84-83a3-114f9a584a07
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: RHTE23 GITOPS AAP2
    category: Workshops
    keywords:
      - rhte
      - rhte2023
      - rhte23
      - gitops
      - aap2
    parameters: []
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP

  secrets:
    - name: rhods-git-secret
      namespace: gpte
