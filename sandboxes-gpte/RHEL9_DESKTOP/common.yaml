---
#include /includes/catalog-icon-aap.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS
#
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-lightspeed
software_to_deploy: none
default_instance_image: RHEL91GOLD-latest
default_instance_name: rhel9
student_name: student
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Config: ansible-lightspeed
# -------------------------------------------------------------------
ansible_lightspeed_setup_demo_repo: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# Generate Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
software_workloads_for_bastion:
  - novnc
  - ms_vscode_server
  - rhel-graphical
  - podman_desktop

# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------
novnc_proxy_port: 443

# -------------------------------------------------------------------
# Workloads: ms_vscode_server
# -------------------------------------------------------------------
ms_vscode_server_enable_autostart: false

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------
install_rhel_graphical: true

# -------------------------------------------------------------------
# Workloads: podman_desktop
# -------------------------------------------------------------------
podman_desktop_content_repository: https://github.com/linuxnerds/rhel9_podman_desktop.git

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 6cd0e791-cbb8-48c4-acf8-d7ecae457f19
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: RHEL9 Desktop
    category: Demos
    keywords:
      - rhel9
      - desktop
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    parameters: []
  secrets:
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
