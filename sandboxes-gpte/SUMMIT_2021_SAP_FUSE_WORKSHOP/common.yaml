# Set to RHPDS or OPENTLC
platform: RHPDS

cloud_provider: ec2

env_type: sap-integration

master_instance_type: m5a.2xlarge
master_instance_count: 3
worker_instance_type: m5a.4xlarge
worker_instance_count: 3
bastion_instance_type: t3a.medium

common_install_basic_packages_retries: 0
install_student_user: true

bastion_instance_image: RHEL81GOLD

software_to_deploy: openshift4

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin

# agnosticd_user_info controls
ocp4_workload_authentication_enable_user_info_messages: false
ocp4_workload_authentication_enable_user_info_data: false

# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: t3mp0r4l
ocp4_workload_authentication_htpasswd_user_base: integration

# Create 1 student users
ocp4_workload_authentication_htpasswd_user_count: 1

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true
rh_internal: true

user: student_name

############################
# AgnosticV meta variables #
############################
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon

########################################################
# Babylon meta variables
########################################################
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
      - name: num_users
        openAPIV3Schema:
          description: Number of users to provision within the environment.
          default: 1
          type: integer
          minimum: 1
          maximum: 100
  secrets:
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
    - name: rhte-ocp4
      namespace: gpte
    - name: rhte-tower
      namespace: gpte
    - name: sap-side-by-side-secret
      namespace: gpte
