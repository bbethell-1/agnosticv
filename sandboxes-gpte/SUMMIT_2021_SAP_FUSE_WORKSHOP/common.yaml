---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-automation-management.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
# -------------------------------------------------------------------
# Red Hat Summit 2021
# SAP Digital Platform in a Cloud-Native and Hybrid era
# -------------------------------------------------------------------

# Set to RHPDS or OPENTLC
platform: RHPDS

cloud_provider: ec2

env_type: sap-integration

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [( num_users / 3) | round(0, 'ceil') | int, 3] | max }}"

common_install_basic_packages_retries: 0
install_student_user: true

bastion_instance_type: t3.medium
bastion_instance_image: RHEL81GOLD

software_to_deploy: openshift4

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin

# agnosticd_user_info controls
ocp4_workload_authentication_enable_user_info_messages: false
ocp4_workload_authentication_enable_user_info_data: false

# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: t3mp0r4l
ocp4_workload_authentication_htpasswd_user_base: integration

# Create 1 student users
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true
rh_internal: true

user: student_name

# Custom collections for this environment
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.8.0
  - name: ansible.posix
    version: 1.3.0

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo:

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: SAP Digital Platform in a Cloud-Native and Hybrid era
    category: Workshops
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    parameters: []
  owners:
  - email: rgarciac@redhat.com
    name: Ricardo Garcia Cavero
  - email: gdiren@redhat.com
    name: Gokhan Diren
  - email: tejones@redhat.com
    name: Ted Jones
  secrets:
  - name: bookbag-deployer-na4
    namespace: gpte
  - name: sap-side-by-side-secret
    namespace: gpte
