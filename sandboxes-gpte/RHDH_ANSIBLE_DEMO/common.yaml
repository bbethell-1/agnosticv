# -------------------------------------------------------------------
# Workload: student_workloads
# -------------------------------------------------------------------
student_workloads: []

userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "rhdh_url": "https://backstage-backstage.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "rhdh_user": "user{{i}}",
    "rhdh_user_password": "{{ common_password }}",
    "gitlab_url": "https://gitlab-gitlab.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "gitlab_user": "user{{i}}",
    "gitlab_user_password": "{{ common_password }}",
    "devspaces_url": "https://devspaces.apps.cluster-{{ guid }}{{ subdomain_base_suffix }}",
    "devspaces_user": "user{{i}}",
    "devspaces_user_password": "{{ common_password }}"
    },
  {% endfor %}
  }

agnosticd_passthrough_user_data: |
  {{ {}
   | combine( {
     "users": userdata })
  }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 05B30401-B1C5-4A25-9196-4328B0F0396C
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com

  anarchy:
    namespace: babylon-anarchy-4
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    workshopUiDisabled: true
    display_name: Ansible plug-ins for Red Hat Developer Hub Demo
    category: Demos
    keywords:
      - Janus
      - project-janus
      - developer-hub
      - gitops
      - openshift
      - backstage
      - ansible
      - automation
      - automation development
    parameters:
      - name: rhdh_version
        description: Version of Developer Hub
        formGroup: Features
        formLabel: Developer Hub Version
        required: false
        openAPIV3Schema:
          type: string
          default: stable
          enum:
            - stable
            - latest
        annotation: demo.redhat.com/rhdh-version
        variable: rhdh_version
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 5
        validation: >-
          num_users <= 2 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
    labels:
      Provider: Ansible_BU
      Platform: OpenShift
      TDP1: Application_Platform
      TDP2: Automation
    reportingLabels:
      primaryBU: Hybrid_Platforms
      secondaryBU: Automation
  tower:
    timeout: 14400
