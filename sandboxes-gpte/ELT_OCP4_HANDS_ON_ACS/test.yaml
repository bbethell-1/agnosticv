---
# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: test

install_lets_encrypt_certificates: true

ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

ocp4_workload_rhacs_install_operator_namespace: "rhacs-operator"
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_install_operator_catalog_source_tag: v4.12_2023_02_27

ocp4_workload_pipelines_channel: pipelines-1.9
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.12_2023_02_27

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/hands_on_rhacs

infra_workloads:
- ocp4_workload_authentication
- studentvm_ocp4
- ocp4_workload_pipelines
- ocp4_workload_rhacs
- ocp4_workload_hands_on_rhacs
- bookbag
- ocp4_workload_le_certificates

# --------------------------------------------------------------------
# AgnosticV meta variables
# --------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# --------------------------------------------------------------------
# Babylon meta variables
# --------------------------------------------------------------------

__meta__:
  deployer:
    git_tag_prefix: elt-ocp4-hands-on-rhacs
    type: agnosticd
    virtualenv: ansible2.9-python3.6-2021-11-30
