---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: prod
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}

# -------------------------------------------------------------------
# Infra machinesets group definition
infra_machineset_group:
- name: infra
  autoscale: false
  total_replicas: 3
  total_replicas_min: 3
  total_replicas_max: 3
  role: infra
  taints:
  - key: infra
    value: reserved
    effect: NoSchedule
  - key: infra
    value: reserved
    effect: NoExecute
  instance_type: "m5.4xlarge"

ocp4_workload_machinesets_machineset_groups: |-
  {{ infra_machineset_group if num_users|int >= 15 else [] }}
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    #        scm_ref: ocp4-mod-cn-1.0.0
    scm_ref: aws-ec2-fix-1.0.0
