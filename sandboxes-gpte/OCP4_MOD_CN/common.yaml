---
# touch 1
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/access-restriction-summit2023-devs.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_use_dev_preview: false
# ocp4_installer_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/fast-4.12/openshift-install-linux.tar.gz
# ocp4_client_url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/fast-4.12/openshift-client-linux.tar.gz

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: false

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type_family: c6in
master_instance_type_size: '8xlarge'
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"

master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}
worker_instance_type: 'm5.8xlarge'
worker_instance_count: "{{ [(num_users | int / 4) | round(0, 'ceil') | int, 3] | max\
  \ }}"

worker_storage_type: gp3
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_machinesets
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_performance_monitoring
- bookbag

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true

# Infranodes: Must be named "infra"
ocp4_workload_machinesets_machineset_groups:
- name: infra
  autoscale: false
  total_replicas: 3
  total_replicas_min: 3
  total_replicas_max: 3
  role: infra
  taints:
  - key: infra
    value: reserved
    effect: NoSchedule
  - key: infra
    value: reserved
    effect: NoExecute
  instance_type: "m5.4xlarge"

# -------------------------------------------------------------------
# Bookbag variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-na-ssa/performance_monitoring_bookbag.git
bookbag_git_version: main
bookbag_namespace: bookbag

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
common_admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: "{{ (guid[:5] | reverse | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Modern Cloud-native Java runtimes performance monitoring on Red Hat Openshift
    category: Workshops
    keywords:
    - workshop
    - openshift
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    parameters: []
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel8-latest-ha
  - name: output-dir-s3
    namespace: gpte
