purpose: development
master_storage_type: '{{ ''io1'' if worker_instance_count|int >= 10 else ''gp3'' }}'
infra_machineset_group:
- name: infra
  autoscale: false
  total_replicas: 3
  total_replicas_min: 3
  total_replicas_max: 3
  role: infra
  taints:
  - key: infra
    value: reserved
    effect: NoSchedule
  - key: infra
    value: reserved
    effect: NoExecute
  instance_type: m5.4xlarge
ocp4_workload_machinesets_machineset_groups: '{{ infra_machineset_group if num_users|int >= 15 else [] }}'
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
