---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ec2_copy_vm_disk_to_image_list:
  - src: bastion
    dest: ocp412-agonzalez-bastion
    stack: "{{env_type}}-{{guid }}"
  - src: master01
    dest: ocp412-agonzalez-master01
    stack: "ocp-controlplane-{{ guid }}"
  - src: master02
    dest: ocp412-agonzalez-master02
    stack: "ocp-controlplane-{{ guid }}"
  - src: master03
    dest: ocp412-agonzalez-master03
    stack: "ocp-controlplane-{{ guid }}"
  - src: worker01
    dest: ocp412-agonzalez-worker01
    stack: "ocp-worker-{{ guid }}"
  - src: worker02
    dest: ocp412-agonzalez-worker02
    stack: "ocp-worker-{{ guid }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: ec2-images
