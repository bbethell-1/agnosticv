---
#include /includes/catalog-icon-aap.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/secrets/demosat-rhel-9.3-ansible-2.4.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/aap2-workshop.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: controller-migration-casc

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] + '_1' }}"

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

tower_admin_user: "admin"
tower_admin_password: "{{ common_password }}"
automationcontroller_admin_password: '{{ tower_admin_password }}'

aap_devel_tools_repos_enable: true
aap_devel_tools_install: true
aap_devel_tools_repos:
- ansible-automation-platform-2.4-for-rhel-9-x86_64-rpms

root_filesystem_size: 20

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------
common_packages_el9:
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- at
- python3-pip
- gcc
- ansible

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------
repo_method: satellite
# use_content_view: true
# set_repositories_rhel8_lock_release: '8'

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"
tower_license_manifest: "{{ controller_manifest }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_install_nginx: false
vscode_use_automationcontroller_nginx: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 23af08a4-7a70-4208-a589-7583f348267e
  owners:
    maintainer:
    - name: Ivan Aragon?s Muniesa
      email: imuniesa@redhat.com
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Migration AWX/Tower to AAP using CaC
    category: Workshops
    keywords:
    - ansible
    - workshop
    - awx
    - tower
    - aap2
    - migration
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    multiuser: false
    parameters:
    - name: num_users
      description: >-
         Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 1
      validation: >-
        num_users == 1 ||
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
    reportingLabels:
      primaryBU: Automation
