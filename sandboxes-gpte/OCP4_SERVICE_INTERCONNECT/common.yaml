---
#include /includes/catalog-icon-service-interconnect.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# --- Catalog Item
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
ansible_connection: ssh
ansible_ssh_private_key_file: "~/.ssh/opentlc_admin_backdoor.pem"
migration_key_path: "{{ ansible_ssh_private_key_file }}"
ansible_user: "ec2-user"
remote_user: "ec2-user"
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: service-interconnect-binder

__meta__:
  asset_uuid: 4af54c44-9801-40a6-a6c8-8b1d6e0a69b1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    workshopUiDisabled: true
    display_name: Introduction to Red Hat Service Interconnect
    category: Demos
    keywords:
    - service-interconnect
    - skupper
    labels:
      Base_Component: 'True'
      Product_Family: Red_Hat_Application_Services
      Provider: RHDP
      Use_Case: Accelerate_Application_Development_And_Delivery
      Featured_Score: '10'
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws_a
    display_name: Service Interconnect - AWS Cluster A
    item: sandboxes-gpte/OCP4_SERVICE_INTERCONNECT_AWS
    propagate_provision_data:
    - var: aws_a_provision_data
  - name: azure_a
    display_name: Service Interconnect - Azure Cluster A
    item: sandboxes-gpte/OCP4_SERVICE_INTERCONNECT_AWS_B
    propagate_provision_data:
    - var: azure_a_provision_data
  - name: rhel_a
    display_name: Service Interconnect - RHEL
    item: sandboxes-gpte/OCP4_SERVICE_INTERCONNECT_RHEL
    propagate_provision_data:
    - var: rhel_a_provision_data

  # Disable actions on chained config that are handled by base.

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1-alpha.2
      pull: missing
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
