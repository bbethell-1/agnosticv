---
#include /includes/catalog-icon-service-interconnect.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Open Hybrid Cloud
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: service-interconnect-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    workshopUiDisabled: true
    display_name: Intro to Service Interconnect
    category: Demos
    keywords:
    - service-interconnect
    - skupper
    labels:
#     Product:
      Base_Component: 'True'
      Product_Family: Red_Hat_Application_Services
      Provider: RHDP
      Use_Case: Accelerate_Application_Development_And_Delivery
      Featured_Score: '10'
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws_a
    display_name: Service Interconnect - AWS Cluster A
    item: sandboxes-gpte/OCP4_SERVICE_INTERCONNECT_AWS
    propagate_provision_data:
    - var: aws_a_provision_data
  - name: azure_a
    display_name: Service Interconnect - Azure Cluster A
    item: azure_gpte/OCP4_SERVICE_INTERCONNECT_AZURE
    propagate_provision_data:
    - var: azure_a_provision_data
  - name: rhel_a
    display_name: Service Interconnect - RHEL
    item: sandboxes-gpte/OCP4_SERVICE_INTERCONNECT_RHEL
    propagate_provision_data:
    - var: rhel_a_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
