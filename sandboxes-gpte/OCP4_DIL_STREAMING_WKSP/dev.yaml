---
#include /includes/ee-multicloud-dev.yaml
purpose: development

ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.12.12"
ocp4_installer_use_dev_preview: false

master_instance_type: m5.xlarge
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t3.medium

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:latest
      pull: missing
    scm_url: https://github.com/RedHat-Middleware-Workshops/agnosticd.git
    scm_ref: development-dil-streaming
