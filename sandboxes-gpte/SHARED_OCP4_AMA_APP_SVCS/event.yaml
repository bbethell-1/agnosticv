---
#include /includes/parameters/event-lifetime-runtime.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
ocp4_installer_version: "4.11.36"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_project_request_template
- ocp4_workload_opentlc_production
- ocp4_workload_le_certificates
- ocp4_workload_openshift_gitops
- ocp4_workload_ama_demo_app_services_shared
- ocp4_workload_amq_streams
- ocp4_workload_camelk_operator
- ocp4_workload_solution_pattern_cdc


# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_setup_cluster_admin: true

ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_06_27

# -------------------------------------------------------------------
# ocp4_workload_ama_demo_app_services_shared
# -------------------------------------------------------------------
ocp4_workload_ama_demo_app_services_shared_lab_setup: true
ocp4_workload_ama_demo_app_services_shared_bookbag: true
ocp4_workload_ama_demo_app_services_shared_bookbag_application_repo_tag: rhte
ocp4_workload_ama_demo_app_services_shared_user_count: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_ama_demo_app_services_shared_user_prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

ocp4_workload_ama_demo_app_services_shared_namespace_prefix: globex-

# -------------------------------------------------------------------
# ocp4_workload_amq_streams
# -------------------------------------------------------------------
ocp4_workload_amq_streams_channel: stable

ocp4_workload_amq_streams_use_catalog_snapshot: false
ocp4_workload_amq_streams_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_amq_streams_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_amq_streams_catalog_snapshot_image_tag: v4.11_2023_01_09

# -------------------------------------------------------------------
# ocp4_workload_camelk_operator
# -------------------------------------------------------------------
ocp4_workload_camelk_operator_channel: ""

ocp4_workload_camelk_operator_use_catalog_snapshot: false
ocp4_workload_camelk_operator_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_camelk_operator_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_camelk_operator_catalog_snapshot_image_tag: v4.11_2023_01_09

# ------------------------------------------------------------------
# Solution Pattern CDC Lab Deployment
# ------------------------------------------------------------------
ocp4_workload_solution_pattern_cdc_user_count: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_solution_pattern_cdc_user_prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

ocp4_workload_solution_pattern_cdc_kafka_cluster_replicas: 2
ocp4_workload_solution_pattern_cdc_kafka_zookeeper_replicas: 3
ocp4_workload_solution_pattern_cdc_kafka_topic_replication_factor: 2

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    scm_url: https://github.com/btison/agnosticd.git
#    scm_ref: rhte2023
    scm_ref: aws-ec2-fix-1.0.0
