---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/bookbag-shared-410.yaml

# -------------------------------------------------------------------
# Implementing custom security content for automated security compliance to custom security policies
# -------------------------------------------------------------------

# Platform
platform: RHPDS
env_type: rhel-custom-security-content

# sizing
bastion_instance_type: t3.small

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite client variables
repo_method: satellite
#satellite_activationkey: rhel8-summit
#satellite_org: Red_Hat_GPTE_Labs
#use_content_view: true

bastion_instance_image: RHEL8-latest
node_instance_image: RHEL8-latest

remote_user: ec2-user

# admin user for infra workloads
admin_user: admin
student_user: lab-user
student_name: lab-user
email: user@example.com

software_to_deploy: none

default_workloads:
  - rhel-custom-security-content-verification

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-custom-security-content.git

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Implementing Custom Security Content
    category: Demos
    keywords:
      - Implementing
      - Security
      - Content
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: Linux_Engineering
    multiuser: true
    parameters: []
  owners:
    - email: ggasparb@redhat.com
      name: Gabriel Becker
    - email: matyc@redhat.com
      name: Matej Tyc
    - email: rjeffman@redhat.com
      name: Rafael Jeffman
  secrets:
    - name: guidgrabber-api
      namespace: gpte
    - name: satellite-rhel8-latest-ha
      namespace: gpte
