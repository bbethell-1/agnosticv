# -------------------------------------------------------------------
# Implementing custom security content for automated security compliance to custom security policies
# -------------------------------------------------------------------

# Platform
platform: RHPDS
env_type: rhel-custom-security-content

# sizing
bastion_instance_type: t3.small

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite client variables
repo_method: satellite
#satellite_activationkey: rhel8-summit
#satellite_org: Red_Hat_GPTE_Labs
#use_content_view: true

bastion_instance_image: RHEL84GOLD-latest
node_instance_image: RHEL84GOLD-latest

remote_user: ec2-user

# admin user for infra workloads
admin_user: admin
student_user: lab-user
student_name: lab-user
email: user@example.com

software_to_deploy: none

default_workloads:
  - rhel-custom-security-content-verification

ocp4_workload_showroom_content_git_repo: >-
  https://gitlab.com/2020-summit-labs/rhel-custom-security-content.git

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 915bc51b-eb2c-4437-904d-8414919a06db
  owners:
    maintainer:
      - name: Gabriel Becker
        email: gbecker@redhat.com
    instructions:
      - name: Gabriel Becker
        email: gbecker@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: always
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Implementing Custom Security Content
    category: Demos
    keywords:
      - Implementing
      - Security
      - Content
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: Linux_Engineering
    multiuser: true
    parameters: []
