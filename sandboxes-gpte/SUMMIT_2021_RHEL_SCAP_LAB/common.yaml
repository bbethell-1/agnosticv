---
# Implementing custom security content for automated security compliance to custom security policies
# Owners: Gabriel Becker ggasparb@redhat.com, Matej Tyc matyc@redhat.com, Rafael Jeffman (rjeffman@redhat.com)

# Platform
platform: RHPDS
env_type: rhel-custom-security-content

# sizing
bastion_instance_type: t3a.small

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite client variables
repo_method: satellite
#satellite_url: labsat.opentlc.com
#satellite_activationkey: rhel8-summit
#satellite_org: Red_Hat_GPTE_Labs
#use_content_view: true

bastion_instance_image: RHEL81

remote_user: ec2-user

# admin user for infra workloads
admin_user: admin
student_user: lab-user
student_name: lab-user

software_to_deploy: none
#install_ocp4: true
#ocp4_installer_version: 4.3.1
#osrelease: 4.3.0

default_workloads:
  - rhel-custom-security-content-verification

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-custom-security-content.git


############################
# AgnosticV meta variables #
############################
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
   # display_name: Implementing custom security content for automated security compliance to custom security policies
    # Icon value should can be any product name, no spaces, for which we have
    # a product icon. Default will be generic icon.
   # icon: rhel
    # Possible values: Labs, Workshops, Demos (plurals)
   # category: Labs
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
   # keywords:
    # - workshop
    # - ansible
    # - openscap
    # - rhel
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
   # labels:
    # RHEL_Version: "8.3"
    # Product: RHEL
    # Provider: GPTE
    namespace: gpte
    parameters:
      - name: aws_region
      - name: email
  secrets:
    - name: guidgrabber-api
      namespace: gpte
    - name: bookbag-deployer-na4
      namespace: gpte
    - name: satellite-ocp-on-osp-secret
      namespace: gpte
