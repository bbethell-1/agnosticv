---
#include /includes/catalog-icon-openshift.yaml

# -------------------------------------------------------------------
# Details
# -------------------------------------------------------------------
# OCP4 Workshop - Build an Operator
# Owners: Natale Vinto(nvinto@redhat.com)
# CPBU: saorg

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
platform: RHPDS

env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: 4.6.12

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# OCP Authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
ocp4_workload_authentication_admin_user_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
num_users: "{{ user_count }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# OPENTLC Production Customizations
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# LE Certificates
# -------------------------------------------------------------------
install_lets_encrypt_certificates: true

# -------------------------------------------------------------------
# Instance Details
# -------------------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [( num_users / 9) | round(0, 'ceil') | int, 3] | max }}"

# -------------------------------------------------------------------
# Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4-workload-project-request-template
  - ocp4-workload-opentlc-production
  - ocp4_workload_le_certificates
  - ocp4-workload-build-an-operator-homeroomlab
  - ocp4-workload-osevg-workshop-tracker

# -------------------------------------------------------------------
# Student Workloads (YAML List)
# -------------------------------------------------------------------
student_workloads: []

# -------------------------------------------------------------------
# Agnostiv_Meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 Workshop - Build an Operator
    category: Workshops
    keywords: []
    labels:
      #OpenShift_Version: "4.6"
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: aws_region
      - name: student_name
      - name: user_count
        description: Number of users to provision for infrastructure deployment.
        openAPIV3Schema:
          default: 1
          type: integer
          minimum: 1
          maximum: 50
  secrets:
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
    - name: ocp4_token
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
