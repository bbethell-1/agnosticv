---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: production

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhods_self_managed
#- ocp4_workload_gitea_operator
- ocp4_workload_amq_streams
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
#- ocp4_workload_aiml_edge_workshop
#- bookbag

# -------------------------------------------------------------------
# Bookbag variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/bookbag-edge.git
bookbag_git_version: main
bookbag_namespace: bookbag

# For ocp4_workload_aiml_edge_workshop
# Repo to clone for running the edge workload
ocp4_workload_aiml_edge_workshop_cluster_bootstrap_repo: "https://github.com/Enterprise-Neurosystem/cluster-bootstrap.git"
ocp4_workload_aiml_edge_workshop_cluster_bootstrap_repo_branch: main

# For ocp4_workload_le_certificates
# Install certificates for Ingress Controllers
ocp4_workload_le_certificates_install_certificates: true

# Install certificates for API Endpoint
ocp4_workload_le_certificates_install_api: false

# Option allow continue without certificates on failure
ocp4_workload_le_certificates_failure_is_fatal: true

# It takes about 4 minutes per API Server to
# restart with certificates (due to AWS
# Load Balancer). Therefore sleep
# 12 minutes by default to give the kube-apiserver
# cluster operator enough time to progress.
# Wait time may be extended if it's needed
ocp4_workload_le_certificates_wait_after_cert_setup: 12

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: ocp4_workshop_rhods_base_aws-0.1
  lifespan:
    default: 2d
    maximum: 10d
    relativeMaximum: 4d
  runtime:
    default: 6h
    maximum: 48h
