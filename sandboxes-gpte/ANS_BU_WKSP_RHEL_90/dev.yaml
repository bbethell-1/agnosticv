---
#include /includes/secrets/ansible-tower-advanced-26.yaml
#include /includes/secrets/ansible-for-rhel-workshop.yaml
# -------------------------------------------------------------------
# Purpose
# -------------------------------------------------------------------
purpose: dev

default_instance_image: "RHEL96GOLD-latest"
deploy_automationcontroller_redis_mode: "standalone"
default_instance_type: "t3a.2xlarge"
node_instance_type: "t3a.medium"
# -------------------------------------------------------------------
# Role: ansible_bu_aws_access_policy
# -------------------------------------------------------------------

ec2_instance_common_tags: &common_tags
  guid: "{{ guid }}"
  ansible-workshops: "true"
  Workshop: "{{ workshop_type }}"
  Workshop_type: "{{ workshop_type }}"
  Student: "ansible-1"
  Students: 1
  Info: "AWS_USERNAME that provisioned this"
  Linklight: "This was provisioned through the linklight provisioner"
  username: "ec2-user"
  operating_system: rhel

ansible_bu_aws_access_policy_ec2_instances_tags:
  - name: ansible-1
    iamprofile: false
    tags:
      Workshop_ansible: "ansible-1"
      short_name: "ansible-1"
      <<: *common_tags
  - name: node1
    iamprofile: true
    tags:
      Index: 1
      color: "#d48a00"
      Workshop_node1: "node1"
      short_name: "node1"
      os_major_version: 9
      <<: *common_tags
  - name: node2
    iamprofile: true
    tags:
      Index: 2
      color: "#0039d4"
      Workshop_node2: "node2"
      short_name: "node2"
      os_major_version: 9
      <<: *common_tags
  - name: node3
    iamprofile: true
    tags:
      Index: 3
      color: "#bf00d4"
      Workshop_node3: "node3"
      short_name: "node3"
      os_major_version: 9
      <<: *common_tags

common_packages_el9:
  - python3
  - unzip
  - bash-completion
  - tmux
  - bind-utils
  - wget
  - nano
  - git
  - vim-enhanced
  - httpd-tools
  - python3-pip
  - tree

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: 7583b03
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: always
