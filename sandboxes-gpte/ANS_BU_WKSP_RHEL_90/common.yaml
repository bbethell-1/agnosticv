---
#include /includes/catalog-icon-aap.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/satellite-rhel8-latest-ha.yaml
#include /includes/parameters/automation-hub-enable.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
software_workloads_for_bastion:
  - ansible_bu_run_time_inventory
  - deploy_automationcontroller
  - automation_platform_loader
  - aap_controller_cert_issue
  - vscode-server
  - ansible_bu_setup_workshop

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true

# -------------------------------------------------------------------
# Role: deploy_automationcontroller
# -------------------------------------------------------------------
install_automationcontroller: true
deploy_automationcontroller_admin_password: "{{ common_password }}"
deploy_automationcontroller_installer_url: "{{ controller_bundle_installer.url }}"
deploy_automationcontroller_manifest_url: "{{ controller_manifest.url }}"

# -------------------------------------------------------------------
# Role: automation_platform_loader
# -------------------------------------------------------------------
configure_automationcontroller: true
controller_configuration_job_templates_secure_logging: false
controller_configuration_credentials_secure_logging: false

aap_auth:
  controller_host: "{{ groups['bastions'][0].split('.')[0] }}.{{ subdomain_base }}"
  controller_username: admin
  controller_password: "{{ common_password }}"
  controller_verify_ssl: false

controller_configuration_dispatcher_roles:
  - role: settings
    var: controller_settings
    tags: settings
  - role: credentials
    var: controller_credentials
    tags: credentials
  - role: projects
    var: controller_projects
    tags: projects
  - role: inventories
    var: controller_inventories
    tags: inventories
  - role: hosts
    var: controller_hosts
    tags: hosts
  - role: groups
    var: controller_groups
    tags: groups
  - role: execution_environments
    var: controller_execution_environments
    tags: execution_environments
  - role: job_templates
    var: controller_templates
    tags: templates

controller_settings:
  - name: AWX_COLLECTIONS_ENABLED
    value: false

controller_credentials:
  - name: "Workshop Credential"
    organization: Default
    credential_type: "Machine"
    inputs:
      username: "ec2-user"
      ssh_key_data: "{{ lookup('file', hostvars.localhost.env_authorized_key_path) }}"
    state: present
  - name: "registry.redhat.io credential"
    organization: Default
    credential_type: "Container Registry"
    inputs:
      host: registry.redhat.io
      username: "seanc@redhat.com"
      password: "vi0hX86518UEfWhlx%E"
      verify_ssl: true
    state: present
  - name: "Demo Credential"
    credential_type: "Machine"
    state: absent

controller_projects:
  - name: "Ansible official demo project"
    scm_url: "https://github.com/RedHatGov/product-demos"
    organization: Default
    description: "prescriptive demos from Red Hat"
    scm_type: git
    scm_branch: movin_on_up
    state: present
  - name: "Demo Project"
    scm_url: "https://github.com/RedHatGov/product-demos"
    organization: Default
    state: absent

controller_inventories:
  - name: "Workshop Inventory"
    organization: Default
    state: present
  - name: "Demo Inventory"
    organization: Default
    state: absent

controller_hosts:
  - name: "{{ groups['nodes'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][0] }}"
  - name: "{{ groups['nodes'][1].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][1] }}"
  - name: "{{ groups['nodes'][2].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['nodes'][2] }}"
  - name: "{{ groups['bastions'][0].split('.')[0] }}"
    inventory: "Workshop Inventory"
    state: present
    variables:
      ansible_host: "{{ groups['bastions'][0] }}"
  # - name: "localhost"
  #   state: absent

controller_groups:
  - name: web
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "{{ groups['nodes'][0].split('.')[0] }}"
      - "{{ groups['nodes'][1].split('.')[0] }}"
      - "{{ groups['nodes'][2].split('.')[0] }}"
  - name: control
    inventory: "Workshop Inventory"
    state: present
    hosts:
      - "{{ groups['bastions'][0].split('.')[0] }}"

controller_execution_environments:
  - name: "rhel_90 workshop execution environment"
    image: "quay.io/acme_corp/rhel_90_ee:latest"
    pull: missing
    state: present

automation_controller_job_template_survey_sec: >-
  { "name": "Hardening survey", "description": "Configure firewall, time, SSH and PCI baseline","spec":
    [
      { "question_name": "Enter host to configure","type": "text","variable": "_hosts","required": false },"required": false,"choices": [ "Yes","No"] },
      { "question_name": "Configure Time?","type": "multiplechoice","variable": "harden_time","required": false,"choices": [ "Yes","No"] },"choices": [ "Yes", "No"] },
      { "question_name": "PCI Baseline?","type": "multiplechoice","variable": "harden_pci","required": false,"choices": [ "Yes", "No" ] }
    ]
  }

controller_templates:
  - name: "SECURITY / Hardening"
    description: "hardening for Linux servers"
    job_type: run
    inventory: Workshop Inventory
    execution_environment: rhel_90 workshop execution environment
    project: Ansible official demo project
    playbook: playbooks/security/hardening.yml
    credentials:
      - Workshop Credential
    survey_enabled: true
    survey: "{{ automation_controller_job_template_survey_sec }}"



# -------------------------------------------------------------------
# Role: aap_controller_cert_issue
# -------------------------------------------------------------------
enable_letsencyrpt_cert: true
controller_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
install_vscode_server: true
vscode_server_install_nginx: false
vscode_server_ansible_become: true
vscode_use_automationcontroller_nginx: true
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix


# -------------------------------------------------------------------
# Role: ansible_bu_setup_workshop
# -------------------------------------------------------------------
workshop_type: rhel_90
workshop_version: 1.0.18
ansible_bu_setup_workshop_exercise_src: ansible_rhel_90
ansible_bu_setup_workshop_exercise_dest: rhel-workshop

ansible_bu_setup_workshop_ee_image:
  - name: quay.io/acme_corp/rhel_90_ee
    tag: latest
  - name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-29-rhel8
    tag: 2.0.0
  - name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-supported-rhel8
    tag: 2.0.0
  - name: registry.redhat.io/ansible-automation-platform-20-early-access/ee-minimal-rhel8
    tag: 2.0.0

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3498a737-467f-406e-b74b-6f2c5ce4823a
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Workshop - Ansible for Red Hat Enterprise Linux (90 mins)
    category: Workshops
    keywords:
      - rhel
      - rhel90
      - ansible
      - workshop
      - aap2
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters: []
  secrets:
    - name: satellite-rhel8-latest-ha
      namespace: gpte
    - name: ansible-tower-advanced-2
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
