# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 0F34CC0F-61DE-46FE-B77B-E42D2839CC6F
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
