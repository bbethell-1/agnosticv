---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/secrets/bookbag-shared-410.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL86GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite
update_packages: true

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)

requirements_content:
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: kubernetes.core
      version: 2.3.1

bastion_student_show_user_info: true  # This var enables ssh bastion user_info data to be set early before bookbag

infra_workloads:

  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - ocp4_workload_cert_manager_operator
  - ocp4_workload_cert_utils_operator
  - automation_platform_loader
  - automation_platform_bastion
  - bookbag

# automation_platform_loader vars

openshift_admin_user: kubeadmin
automation_platform_loader_generate_ocp_token: true

# workload ocp4_workload_ansible_automation_platform vars

ocp4_workload_ansible_automation_platform_admin_password: "{{ common_password }}"

# workload bookbag vars

bookbag_git_repo: https://github.com/rlopez133/bookbag

# --- Student Workloads (YAML List)
student_workloads: []

host_ocp4_installer_set_user_data_kubeadmin_password: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Platform 2 EDA on OpenShift
    category: Demos
    multiuser: false
    keywords:
      - eda
      - ansible
      - openshift
      - ocp
      - summit
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:

      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.2xlarge
          enum:
            - m6a.4xlarge
            - m6a.2xlarge

  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27

  secrets:

    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager

    - namespace: gpte
      name: ocp4-token

    - namespace: gpte
      name: satellite-rhel86-ha

    - namespace: gpte
      name: output-dir-s3

    - namespace: gpte
      name: ansible-tower-advanced-2

# -------------------------------------------------------------------

controller_configuration_dispatcher_roles:

  - role: credentials
    var: controller_credentials
    tags: credentials

  - role: projects
    var: controller_projects
    tags: projects

  - role: job_templates
    var: controller_templates
    tags: job_templates

controller_credentials:

  - name: OpenShift Credentials
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

controller_configuration_projects_async_retries: 90

controller_projects:

  - name: EDA-OpenShift
    organization: Default
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    scm_type: git
    scm_update_on_launch: 'yes'
    scm_url: https://github.com/rlopez133/demos.git

controller_templates:

  - name: EDA-OpenShift-Exercise1
    job_type: run
    inventory: Demo Inventory
    project: EDA-OpenShift
    playbook: eda_ocp/exercise_1/pvc_snapshot_playbook.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: EDA-OpenShift-Exercise2
    job_type: run
    inventory: Demo Inventory
    project: EDA-OpenShift
    playbook: eda_ocp/exercise_2/openshift_cert_playbook.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}

  - name: EDA-OpenShift-Exercise3
    job_type: run
    inventory: Demo Inventory
    project: EDA-OpenShift
    playbook: eda_ocp/exercise_3/namespace_playbook.yml
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credentials
    survey: {}
