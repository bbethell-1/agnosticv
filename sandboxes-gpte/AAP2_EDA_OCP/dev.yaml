---
#include /includes/parameters/event-selector.yaml

# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: event
platform: EVENTS

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)

infra_workloads:

  - ocp4_workload_le_certificates
  - ocp4_workload_ansible_automation_platform
  - automation_platform_loader
  - bookbag

# automation_platform_loader vars

automation_platform_loader_generate_ocp_token: true

requirements_content:
  collections:
    - name: amazon.aws
      version: 2.2.0
    - name: ansible.posix
      version: 1.3.0
    - name: ansible.utils
      version: 2.7.0
    - name: awx.awx
      version: 21.4.0
    - name: community.general
      version: 4.6.1
    - name: infra.controller_configuration
      version: 2.2.5
    - name: kubernetes.core
      version: 2.3.1

    # - name: openstack.cloud
    #   version: 1.7.2


# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-events
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2022-07-27
  aws_sandboxed: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Platform 2 EDA on OpenShift
    category: Demos
    multiuser: false
    keywords:
      - eda
      - ansible
      - openshift
      - ocp
      - summit
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters:

      - name: master_instance_type
        description: OpenShift compute master instance type
        formLabel: Control Plane Instance Type
        openAPIV3Schema:
          type: string
          default: m6a.4xlarge
          enum:
            - m6a.4xlarge
            - m6a.2xlarge
            - c6a.2xlarge
            # - m6a.xlarge


  secrets:

    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager

    - namespace: gpte
      name: ocp4-token

    - namespace: gpte
      name: satellite-rhel86-ha

  access_control:
    allow_groups:

      - babylon-admins
      - babylon-devs
      - rhpds-devs-summit-2023

controller_configuration_dispatcher_roles:

  - role: credentials
    var: controller_credentials
    tags: credentials

  - role: projects
    var: controller_projects
    tags: projects

  - role: job_templates
    var: controller_templates
    tags: job_templates

controller_credentials:

  - name: OpenShift Credentials
    description: Credentials for OpenShift
    organization: Default
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      verify_ssl: true
      bearer_token: "{{ openshift_bearer_token }}"

controller_projects:

  - name: EDA-OpenShift
    organization: Default
    scm_branch: main
    scm_clean: 'no'
    scm_delete_on_update: 'no'
    scm_type: git
    scm_update_on_launch: 'yes'
    scm_url: https://github.com/rlopez133/demos.git

controller_templates:

  - name: EDA-OpenShift-Exercise1
    job_type: run
    inventory: Demo Inventory
    project: EDA-OpenShift
    playbook: eda_ocp/exercise_1/pvc_snapshot_playbook.yml
    credentials:
      - OpenShift Credentials
    survey: {}
    extra_vars:
      event: !unsafe "{{ event }}"

  - name: EDA-OpenShift-Exercise2
    job_type: run
    inventory: Demo Inventory
    project: EDA-OpenShift
    playbook: eda_ocp/exercise_2/openshift_cert_playbook.yml
    credentials:
      - OpenShift Credentials
    survey: {}
    extra_vars:
      event: !unsafe "{{ event }}"
