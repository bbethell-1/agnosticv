---
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: containerize-app-demo
software_to_deploy: none
install_student_user: true
bastion_instance_image: RHEL9GOLD-latest
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Containerize Your App Demo
    category: Demos
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHPDS
    keywords:
      - Containers
      - Buildah
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  secrets:
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
