---
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
#  Mandatory Variables
# -------------------------------------------------------------------
env_type: containerize-app-demo
software_to_deploy: none
install_student_user: true
# bastion_instance_image: RHEL9GOLD-latest
bastion_instance_image: RHEL90GOLD
# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
## Added custom email template
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: false
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Containerize Your App Demo
    category: Demos
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHPDS
    keywords:
      - Containers
      - Buildah
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  bookbag:
    # Source to use to build bookbag image
    imageBuild:
      # Required BuildConfig spec.source
      source:
        type: Git
        git:
          uri: https://github.com/redhat-gpte-devopsautomation/containerize-app-demo-bookbag.git
      # Optional BuildConfig spec.strategy
      #strategy:
      #  type: Docker
      #  dockerStrategy:
      #    dockerfilePath: Dockerfile
      #    forcePull: true
      # Image to use for bookbag
      #image: quay.io/org/repo:tag
  secrets:
    - name: gpte
      namespace: gpte
    # - name: satellite-rhel-8-and-9-latest-ha
    #   namespace: gpte
    - name: satellite-rhel90-ha
      namespace: gpte
