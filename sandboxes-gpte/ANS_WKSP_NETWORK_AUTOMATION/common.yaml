---
#include /includes/catalog-icon-aap.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml

#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml

#include /includes/secrets/demosat-ansible-wksp-network-auto.yaml
#include /includes/secrets/ansible-tower-advanced-24.yaml
#include /includes/secrets/registry-redhat.yaml


# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-bu-workshop

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
# default_instance_image: "RHEL87GOLD-latest"
# bastion_instance_image: RHEL92GOLD-latest
bastion_instance_image: RHEL94GOLD-latest
default_rootfs_size: 50
default_instance_type: "c5.4xlarge"

security_groups:
  - name: BastionSG
    rules:
      - name: BastionHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPSsPorts
        description: "HTTPSs Public"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress


instances:
  - name: "{{ bastion_instance_name | default('ansible') }}"
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ default_rootfs_size }}"
    security_groups:
      - BastionSG
      - DefaultSG

# -------------------------------------------------------------------
# Config Pre/Software/Post Workloads
# -------------------------------------------------------------------
pre_software_workloads:
  all:
    - set-repositories
    - common
  bastions:
    - bastion-lite
    - control-user

software_workloads:
  bastions:
    - vscode-server
    - containerlab
    - showroom

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------
# Role: set-repositories
# -------------------------------------------------
repo_method: satellite
use_content_view: true


# -------------------------------------------------
# Role: common
# -------------------------------------------------
install_common: true
common_packages_el9:
  - at
  - ansible-core
  - ansible-test
  - bind-utils
  - bash-completion
  - curl
  - git
  - httpd-tools
  - nano
  - podman
  - podman-docker
  - python3
  - python3-pip
  - tmux
  - tree
  - unzip
  - vim-enhanced
  - wget

# -------------------------------------------------
# Role: control-user
# -------------------------------------------------
student_name: student

# -------------------------------------------------------------------
# Role: vscode-server
# -------------------------------------------------------------------
vscode_server_install_vscode: true
vscode_server_install_nginx: true
vscode_server_ansible_become: true
vscode_server_nginx_https_port: 8443
vscode_server_hostname: "{{ groups['bastions'][0].split('.')[0] }}.{{ guid }}.{{ sandbox_zone }}"
vscode_auth_type: password
vscode_user_name: "{{ student_name }}"
vscode_user_password: "{{ common_password }}"
vscode_user_workspace_path: "/home/{{ student_name }}"
vscode_server_default_extensions: []
vscode_server_extension_urls:
  - https://github.com/ansible/workshops/raw/devel/files/bierner.markdown-preview-github-styles-0.1.6.vsix
  - https://github.com/ansible/workshops/raw/devel/files/hnw.vscode-auto-open-markdown-preview-0.0.4.vsix
  - https://github.com/ansible/workshops/raw/devel/files/redhat.ansible-0.4.5.vsix

vscode_server_additional_settings: |
  "files.exclude": {
    "**/.git": true,
    "**/.bash*": true,
    "**/.vim*": true,
    "**/.ssh": true,
    "**/.vscode": true,
    "**/.local": true,
    "**/.config": true,
    "**/.ansible": true,
    "**/.cache": true
  },
  "security.workspace.trust.enabled": false

# -------------------------------------------------
# Role: containerlab
# -------------------------------------------------
containerlab_lab_username: "{{ student_name }}"
containerlab_arista_ceos_image_tar_url: https://gpte-public.s3.amazonaws.com/advance-ansible-network-automation/cEOS64-lab-4.32.0F.tar.tar
containerlab_ansible_collections_tar_url: https://gpte-public.s3.amazonaws.com/advance-ansible-network-automation/collections.tar.gz

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/redhat-gpte-devopsautomation/zt-advanced-ansible-network-automation.git
showroom_ui: zero-touch
showroom_ansible_runner_image: quay.io/mitsharm/ansible-runner-api
showroom_ansible_runner_image_tag: 1.1.0
showroom_openssh_keypair: provisionkey
showroom_dnf_packages:
  - git
  - podman
  - python3-devel
  - systemd-container
  - unzip

showroom_pip_packages:
  - podman-compose==1.0.6

showroom_tab_services:
  - tty1

showroom_tab_tty1_username: "{{ student_name }}"
showroom_showroom_default_ssh_user: "{{ student_name }}"
showroom_ttys_enable_tmux: false
showroom_enable_root_ssh: true
showroom_ssh_method: sshkey
showroom_ssh_host: host.containers.internal
showroom_lab_users:
  - "{{ student_name }}"
showroom_user_password: "{{ common_password }}"
showroom_ansible_runner_api: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5268DF6C-E6D2-4DAC-8249-CA51985B3142
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: mitsharm@redhat.com

  anarchy:
    namespace: babylon-anarchy-2
  catalog:
    reportingLabels:
      primaryBU: Automation
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Advanced Ansible Network Automation
    category: Workshops
    keywords:
      - ansible
      - workshop
      - network
      - automation
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: RHDP
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
