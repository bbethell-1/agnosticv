---
purpose: development

__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:showroom-test-01
      pull: missing

showroom_git_tag: main
nookbag_git_repo: https://github.com/aleixhub/hello-world-lab.git
showroom_nookbag: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.3/nookbag-v0.0.3.zip
showroom_version: HEAD
showroom_name: nookbag_base
antora_dir: antora

showroom_modules:
  - name: index
    validation_script: ./validation-index.sh
  - name: module-1
  - name: module-2
  - name: module-3
  - name: EXTRA-MODULE/index

showroom_services:
  - name: double_terminal
    port: 8001
    secondary_port: 8002
    path: /wetty
    secondary_path: /wetty
  - name: codeserver
    port: 8003
  - name: docs
    url: https://docs.ansible.com/
