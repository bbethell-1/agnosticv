---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml

# -------------------------------------------------------------------
# Red Hat Summit 2020 - T3656Da (OCP3 Cluster) - Migrating applications from OCP/OCS 3 to OCP/OCS 4 a hands-on lab
# course_id: RHS_2020_T3656Da
# -------------------------------------------------------------------
platform: rhpds
env_type: ocp-workshop
cloud_provider: ec2

repo_method: file

infra_workloads: "ocp-workload-migration,ocp-workload-parks-app,ocp-workload-sock-shop,ocp-workload-mssql,ocp-workload-mssql,ocp-workload-robot-shop,ocp-workload-file-uploader,ocp-workload-rocket-chat,ocp-workload-mediawiki"

software_to_deploy: openshift
osrelease: '3.11.161'
repo_version: '3.11'

# Workshop Configuration
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

bastion_instance_image: RHEL84GOLD-latest

install_ipa_client: false
install_openshiftapb: false
install_nexus: false
install_metrics: false
install_logging: false
install_lets_encrypt_certificates: false
lets_encrypt_production: false
ovs_plugin: networkpolicy
install_ftl: false
support_instance_public_dns: false

# --- OCP Authentication
install_idm: htpasswd
admin_user: admin
# --- admin_password required, no defaults in agnosticd
admin_password: r3dh4t1!

#storage configs
nfs_exports_config: "*(insecure,rw,no_root_squash,no_wdelay,sync)"
# use default internal
#nfs_server_address: "support1.{{ guid }}{{ subdomain_base_suffix }}"
archive_dir: "{{ output_dir | dirname }}/archive"
nfs_size: 200
glusterfs_device_size: 200
install_glusterfs: true
glusterfs_image_tag: v3.11
mssql_cpu_requests: "0.5"
mssql_memory_requests: "2Gi"
mig_ocp_version: 3
mig_operator_repo_branch: "release-1.0"
mig_operator_version: "v1.0.0"

agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    ocprelease: ''
  idle_after_deploy: 2
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b69f3f8e-7fcc-42fe-9344-61a5eb89d3dd
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Migration Toolkit for Containers (OCP3)
    category: Workshops
    # No parameter variables
    parameters: []
    keywords:
    - workshop
    - openshift
    - ocp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Software_Engineering_Openshift
  secrets:
  - name: gpte-ocp-registry
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
