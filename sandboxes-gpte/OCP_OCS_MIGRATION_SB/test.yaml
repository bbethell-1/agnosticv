---
# Red Hat Summit 2020 - T3656Da (OCP3 Cluster) - Migrating applications from OCP/OCS 3 to OCP/OCS 4 a hands-on lab
purpose: TEST  ## This is a cost tag, please make sure it's correct.
cloudformation_retries: 0

#lets_encrypt_production: True
#install_lets_encrypt_certificates: true

bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"
master_instance_type: m4.xlarge
_infranode_instance_type: m4.4xlarge
_node_instance_type: m4.4xlarge
_node_instance_count: 2
_support_instance_type: m4.4xlarge

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon
  idle_after_deploy: 2
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp-ocs-migration-test

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: ocp-ocs-migration-test-0.8
    type: agnosticd
  secrets:
  - name: gpte-ocp-registry
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
