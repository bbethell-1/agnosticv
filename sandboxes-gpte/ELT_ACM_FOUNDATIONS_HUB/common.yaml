---
# --- OpenShift 4 Advanced Cluster Manager Foundations Lab
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 ACM Foundations Lab - Hub
# --- ELT: OpenShift 4 Advanced Cluster Manager Foundations

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
install_student_user: true
ocp4_installer_version: "4.5.4"
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
satellite_url: labsat.opentlc.com


# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacm

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_acm_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.5_2020_09_25"

# -------------------------------------------------------------------
# --- Student Workloads (YAML List)
# -------------------------------------------------------------------
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type_family: m5
master_instance_type_size: >-
  {{ 'xlarge' if worker_instance_count|int <= 10
  else '2xlarge' if worker_instance_count|int <= 20
  else '4xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: "m5.4xlarge"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"
worker_storage_type: "gp2"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
    - name: student_name
    - name: num_users
  secrets:
  - name: ocp4_token
    namespace: gpte
  - name: satellite-rhel81-ha
    namespace: gpte
