---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
ocp4_installer_version: "4.14.13"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
    scm_type: git

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.3"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v4.3.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_project_dance
# -------------------------------------------------------------------
ocp4_workload_project_dance_docker_username: quayadmin
ocp4_workload_project_dance_docker_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------

ocp4_workload_rhacm_acm_channel: "release-2.6"
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalogsource_name: catalogsource-rhacm
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.12_2023_02_20"

# -----------------------------------
# Quay Operator
# -----------------------------------
ocp4_workload_quay_operator_namespace: quay-registry
ocp4_workload_quay_operator_catalogsource_namespace: quay-registry
ocp4_workload_quay_operator_channel: stable-3.8
ocp4_workload_quay_operator_starting_csv: quay-operator.v3.8.10
ocp4_workload_quay_operator_use_catalog_snapshot: true
ocp4_workload_quay_operator_catalogsource_name: redhat-operators-snapshot-quay
ocp4_workload_quay_operator_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_quay_operator_catalog_snapshot_image_tag: v4.12_2023_07_17
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# -----------------------------------
# OpenShift Data Foundations Operator
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.14
ocp4_workload_openshift_data_foundation_catalogsource_setup: false
#ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
#ocp4_workload_openshift_data_foundation_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
#ocp4_workload_openshift_data_foundation_catalogsource_image_tag: v4.12_2023_02_20

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.14
ocp4_workload_pipelines_tkn_version: 0.41.0
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false
#ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
#ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.13_2023_11_20

# -------------------------------------------------------------------
# GitLab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_type: argocd
ocp4_workload_gitops_gitlab_config_email_display_name: Janus Admin
ocp4_workload_gitops_gitlab_config_email_reply_to: "noreply@redhat.com"
ocp4_workload_gitops_gitlab_config_smtp_enabled: "false"
ocp4_workload_gitops_gitlab_config_smtp_domain: "example.com"
ocp4_workload_gitops_gitlab_config_smtp_port: "587"
ocp4_workload_gitops_gitlab_config_smtp_user: "gitlab"
ocp4_workload_gitops_gitlab_config_smtp_password: "gitlab"
ocp4_workload_gitops_gitlab_config_ssh_port: "22"
ocp4_workload_gitops_gitlab_config_rootPassword: "{{ common_password }}"
ocp4_workload_gitops_gitlab_config_https: "true"
ocp4_workload_gitops_gitlab_config_root_email: "root@opentlc.com"
ocp4_workload_gitops_gitlab_config_keybase_db: "0123456789"
ocp4_workload_gitops_gitlab_config_keybase_otp: "0123456789"
ocp4_workload_gitops_gitlab_config_keybase_secret: "0123456789"

ocp4_workload_gitops_gitlab_db_user_name: gitlab
ocp4_workload_gitops_gitlab_db_password: passw0rd
ocp4_workload_gitops_gitlab_db_name: gitlab_production


ocp4_workload_gitops_gitlab_users_count: "{{ num_users | default(1) }}"
ocp4_workload_gitops_gitlab_users_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub
# -------------------------------------------------------------------

ocp4_workload_redhat_developer_hub_gitlab_root_password: "{{ ocp4_workload_gitops_gitlab_config_rootPassword }}"
ocp4_workload_redhat_developer_hub_janus_bootstrap_repo_target_revision: main
ocp4_workload_redhat_developer_hub_backstage_gitlab_user_create: "{{ ocp4_workload_gitops_gitlab_user_create }}"
ocp4_workload_redhat_developer_hub_backstage_gitlab_user_username: "{{ ocp4_workload_gitops_gitlab_user_username | default(omit) }}"
ocp4_workload_redhat_developer_hub_backstage_gitlab_user_password: "{{ ocp4_workload_gitops_gitlab_user_password }}"
ocp4_workload_redhat_developer_hub_admin_user: admin
ocp4_workload_redhat_developer_hub_admin_password: "{{ common_password }}"
ocp4_workload_redhat_developer_hub_gitlab_template_locations:
- group: rhdh
  project: project-dance-templates
  branch: main
  file: showcase-templates.yaml
  rules:
    allow: Template
  templates:
  - scaffolder-templates/quarkus-stssc-template/template.yaml
- group: rhdh
  project: project-dance-templates
  branch: main
  file: org.yaml
  rules:
    allow: Group, User
  templates: []
- group: rhdh
  project: project-dance-templates
  branch: main
  file: catalogs.yaml
  rules:
    allow: Component, System, API, Resource, Location, Template
  templates: []
- group: summit-lab
  project: backstage-workshop
  branch: master
  file: showcase-templates.yaml
  rules:
    allow: Template
  templates:
  - scaffolder-templates/poi-map/template.yaml
  - scaffolder-templates/poi-gateway/template.yaml
  - scaffolder-templates/poi-backend/template.yaml

ocp4_workload_redhat_developer_hub_backstage_image: quay.io/rhdh/rhdh-hub-rhel9:1.0

ocp4_workload_redhat_developer_hub_users_count: "{{ num_users | default(1) }}"
ocp4_workload_redhat_developer_hub_users_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_backstage_helm_chart_repo: https://redhat-developer.github.io/rhdh-chart
ocp4_workload_redhat_developer_hub_backstage_helm_chart: backstage
ocp4_workload_redhat_developer_hub_backstage_image_registry: quay.io
ocp4_workload_redhat_developer_hub_backstage_image_repository: rhdh/rhdh-hub-rhel9
ocp4_workload_redhat_developer_hub_backstage_image_tag: "{{ '1.1' if rhdh_version == 'latest' else '1.1-79' }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_gitops_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_repo: https://github.com/treddy08/agnosticg.git
ocp4_workload_gitops_gitlab_import_repos:
- name: rhdh
  repo:
  - name: project-dance-templates
    url: https://github.com/treddy08/project-dance-templates.git
- name: summit-lab
  repo:
  - name: backstage-workshop
    url: https://github.com/treddy08/backstage-workshop.git
- name: gitops
  repo:
  - name: janus-idp-gitops
    url: https://github.com/treddy08/janus-idp-gitops.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_janus_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git
ocp4_workload_redhat_developer_hub_backstage_helm_chart_version: 2.10.3

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/treddy08/janus-idp-bootstrap.git
