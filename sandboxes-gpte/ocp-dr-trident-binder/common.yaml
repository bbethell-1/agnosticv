---
#include /includes/ansible_control_plane/current_controller.yaml
# -------------------------------------------------------------------
# --- Catalog: Demo Platform
# --- Catalog Item: Hands-on Disaster Recovery of
#                   OpenShift containers and VMs with
#                   Trident Protect
# -------------------------------------------------------------------

# Background:
# * Migrated from the lab 2739: Hands-on Disaster Recovery of
#   OpenShift containers and VMs with Trident Protect

# * Temporary until we can migrate to IBM Cloud.
# * Changes:
#   * Use ROSA HCP cluster, now supported by Trident
#   * This is the binder which installs Trident and sets up lab

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-virtualization.yaml
# #include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml

#include /includes/parameters/aws-region-fallback.yaml


# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: trident-binder
config: trident-binder

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

ocp_dr_trident_s3_bucket_name: "bucket-{{ guid }}"

# -------------------------------------------------------------------
# ocp4_workload_dr_trident
# -------------------------------------------------------------------
ocp_dr_trident_starting_csv: "trident-operator.v25.6.1"
ocp_dr_trident_product_version: "25.6.1"
ocp_dr_trident_cli_version: "25.06.0"
ocp_dr_trident_helm_chart_version: "100.2602.0"

ocp_dr_trident_one_rosa_cidr: "10.0.0.0/16"
ocp_dr_trident_two_rosa_cidr: "10.10.0.0/16"

ocp_dr_trident_fsx_name1: PROD-FSXONTAP
ocp_dr_trident_fsx_name2: DR-FSXONTAP

ocp_dr_trident_policy_name1: ProdTridentIAMPolicy
ocp_dr_trident_policy_name2: DRTridentIAMPolicy

# Passwords will be generated.
# If hardcoding: Passwords must be between 8 and 128 characters in length, must contain at least one English letter
#                and one number, and must not contain the word 'admin'.
ocp_dr_trident_fsx_admin_password: ""
ocp_dr_trident_svm_admin_password: ""

# -------------------------------------------------------------------
# ocp4_workload_showroom - deployed from Binder, not here
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/ocp-dr-trident-showroom
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_only: false

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_version: "1.3.4"
ocp4_workload_showroom_content_image: quay.io/rhpds/showroom-content:v1.2
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_antora_playbook: default-site.yml
ocp4_workload_showroom_wetty_ssh_bastion_login: "true"
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 85396d08-f1d5-4a9b-a966-fe31701bcb94
  deployer:
    # Disable actions on chained config that are handled by base.
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
      update:
        disable: true
      provision:
        time_estimate: 100m
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-09-10
      pull: missing
  catalog:
    display_name: "NetApp Trident protect: Hands-on Disaster Recovery of OpenShift Containers and VMs"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: false
    workshopLabUiRedirect: true
    keywords:
    - demo
    - openshift
    - ocp
    - rosa
    - trident
    - netapp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []

  # Components to include in template and catalog item
  components:

  - name: ocp_dr_trident_base_one
    display_name: OCP Trident One
    item: sandboxes-gpte/ocp-dr-trident-base
    propagate_provision_data:
    - var: trident_one
    parameter_values:
      rosa_cluster_name_prefix: "prod-"
      rosa_machine_cidr: "10.0.0.0/16"
      rosa_version: "default"

  - name: ocp_dr_trident_base_two
    display_name: OCP Trident Two
    item: sandboxes-gpte/ocp-dr-trident-base
    propagate_provision_data:
    - var: trident_two
    parameter_values:
      rosa_cluster_name_prefix: "dr-"
      rosa_machine_cidr: "10.10.0.0/16"
      rosa_version: "default"

  owners:
    maintainer:
    - name: Judd Maltin
      email: jmaltin@redhat.com
    - name: Wolfgang Kulhanek
      email: wkulhane@redhat.com
    sme:
    - name: Luis Rico (Netapp)
      email: luis.rico@netapp.com
    - name: Yves Weisser (Netapp)
      email: luis.rico@netapp.com
    - name: Hendrik Land (Netapp)
      email: luis.rico@netapp.com
    instructions:
