purpose: development
update_packages: false
ocp4_installer_version: '4.18'
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL95GOLD-latest
master_instance_count: 3
master_instance_type: m6a.2xlarge
worker_instance_count: 3
worker_instance_type: m6a.4xlarge
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_portworx
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_showroom
ocp4_workload_portworx_install_operator: '{{ deploy_container_showroom | bool }}'
ocp4_workload_portworx_deploy_storagecluster: '{{ deploy_container_showroom | bool }}'
ocp4_workload_portworx_channel: stable
ocp4_workload_portworx_installplan: Manual
ocp4_workload_portworx_csv: portworx-operator.v24.1.3
ocp4_workload_portworx_storagecluster_storage_size: 500
ocp4_workload_portworx_update_default_storageclass: true
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false
ocp4_workload_kubevirt_enabled_nested_kvm: true
ocp4_workload_kubevirt_deploy_hyperconverged: false
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_content_git_repo: '{% if deploy_virt_showroom | bool %} https://github.com/PureStorage-OpenConnect/pxe-osv-rhdp-lab {% else %} https://github.com/PureStorage-OpenConnect/pxe-rhdp-lab.git {% endif %}'
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: default-site.yml
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-07
      pull: missing
  catalog:
    parameters:
    - name: deploy_virt_showroom
      formGroup: Type of Environment
      formLabel: Deploy for Portworx with Virtualization
      description: This deploys the environment to demonstrate Portworx with virtualized workloads
      openAPIV3Schema:
        type: boolean
        default: true
    - name: deploy_container_showroom
      formGroup: Type of Environment
      formLabel: Deploy for Portworx with Containers
      description: This deploys the environment to demonstrate Portworx with containerized workloads
      openAPIV3Schema:
        type: boolean
        default: false
      validation: (deploy_container_showroom == true && deploy_virt_showroom == false) || (deploy_container_showroom == false && deploy_virt_showroom == true) || Error('Exactly one type of environment must be selected.')
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
