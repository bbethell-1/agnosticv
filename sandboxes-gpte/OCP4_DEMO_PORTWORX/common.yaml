---
# -------------------------------------------------------------------
# --- Catalog: Red Workshops
# --- Catalog Item: Portworx Labs for OpenShift
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml


#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.18"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: false

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL96GOLD-latest

master_instance_count: 3
master_instance_type: m6a.2xlarge

worker_instance_count: 3
worker_instance_type: m6a.4xlarge

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_portworx
- ocp4_workload_web_terminal
- ocp4_workload_kubevirt
- ocp4_workload_showroom

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Create 1 user
ocp4_workload_authentication_htpasswd_user_count: 1
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false
ocp4_workload_cert_manager_ignore_errors: true

# -------------------------------------------------------------------
# ocp4_workload_portworx
# -------------------------------------------------------------------
# Only predeploy for the Portworx lab for containerized workloads
ocp4_workload_portworx_install_operator: "{{ environment_type == 'Containers' }}"
ocp4_workload_portworx_deploy_storagecluster: "{{ environment_type == 'Containers' }}"

# The next section is only relevant if the operator and storagecluster are being installed
ocp4_workload_portworx_channel: stable

# Pin the version of the Portworx operator
ocp4_workload_portworx_installplan: Manual
ocp4_workload_portworx_csv: portworx-operator.v25.3.1

ocp4_workload_portworx_storagecluster_storage_size: 500
ocp4_workload_portworx_update_default_storageclass: true

# -------------------------------------------------------------------
# ocp4_workload_kubevirt
# -------------------------------------------------------------------
ocp4_workload_kubevirt_channel: stable
ocp4_workload_kubevirt_use_catalog_snapshot: false
ocp4_workload_kubevirt_enabled_nested_kvm: true
ocp4_workload_kubevirt_deploy_hyperconverged: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_web_terminal
# -------------------------------------------------------------------
ocp4_workload_web_terminal_channel: fast
ocp4_workload_web_terminal_catalogsource_setup: false
ocp4_workload_web_terminal_configure: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

# Repo from CI parameter
ocp4_workload_showroom_content_git_repo: >-
  {% if environment_type == 'Virtualization' %}
  https://github.com/PureStorage-OpenConnect/pxe-osv-rhdp-lab
  {% else %}
  https://github.com/PureStorage-OpenConnect/pxe-rhdp-lab.git
  {% endif %}
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_antora_playbook: default-site.yml

