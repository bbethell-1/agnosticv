common_packages_el9:
- at
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- python3-pip
- tree

security_groups:
- name: BastionSG
  rules:
  - name: BastionSSHPorts
    description: "Bastion ssh"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: WebSG
  rules:
  - name: WebHTTPSPorts
    description: "HTTPS Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WebHTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: WebCockpitPorts
    description: "Cockpit HTTP Public"
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: PetAppSG
  rules:
  - name: PetAppPorts
    description: "Pet App HTTP Public"
    from_port: 8080
    to_port: 8080
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

- name: NodeSG
  rules:
  - name: FromNodeSGtcp
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: tcp
    from_group: NodeSG
    rule_type: Ingress

  - name: FromNodeSGudp
    description: "Allow everything from HostSG nodes"
    from_port: 0
    to_port: 65535
    protocol: udp
    from_group: NodeSG
    rule_type: Ingress

- name: SatSG
  rules:
  - name: FromSatSCAP
    description: "Open OpenSCAP"
    from_port: 9090
    to_port: 9090
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: FromSatKA
    description: "Open Katello Agent"
    from_port: 5647
    to_port: 5647
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

  - name: FromSatMQTT
    description: "Open remote-execution MQTT"
    from_port: 883
    to_port: 883
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

base_instances:
- name: "{{ bastion_instance_name | default('ansible-1') }}"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image: "{{ bastion_instance_image | default(default_instance_image) }}"
  flavor:
    ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - BastionSG
  - WebSG
  - DefaultSG
  - NodeSG

- name: "satellite"
  count: 1
  unique: true
  public_dns: true
  dns_loadbalancer: true
  floating_ip: true
  image:
    name: "rhel8.9-satellite-6.14-2024-04-17"
  flavor:
    ec2: "r7a.2xlarge"
  tags:
  - key: "AnsibleGroup"
    value: "satellites"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: 250
  security_groups:
  - WebSG
  - DefaultSG
  - NodeSG
  - SatSG

- name: "node"
  count: 3
  public_dns: false
  image:
    name: "ansible-bu-minimal-rhel-7.9-hvm-std01.x86_64-gp2"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "nodes"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: "{{ default_rootfs_size }}"
  security_groups:
  - DefaultSG
  - NodeSG

- name: "node4"
  count: 1
  unique: true
  public_dns: false
  image: "CENTOS79"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "centos_nodes"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: 10
  security_groups:
  - DefaultSG
  - NodeSG
  UserData: |
    {% filter indent(width=6) %}
    UserData:
      "Fn::Base64":
          "Fn::Join":
            - ""
            - - "#cloud-config\n"
              - "users:\n"
              - "  - default\n"
              - "  - name: ec2-user\n"
              - "    lock_passwd: true\n"
              - "    gecos: Cloud User\n"
              - "    groups: [adm, systemd-journal]\n"
              - "    sudo: ['ALL=(ALL) NOPASSWD:ALL']\n"
              - "    shell: /bin/bash\n"
              - "    ssh-authorized-keys:\n"
              - "    ssh_authorized_keys:\n"
              - "      - {{ hostvars.localhost.ssh_provision_pubkey_content | default('') }}\n"
    {% endfilter %}

- name: "node5"
  count: 1
  unique: true
  public_dns: false
  image: "CENTOS79"
  flavor:
    ec2: "{{ node_instance_type | default(default_instance_type) }}"
  tags:
  - key: "AnsibleGroup"
    value: "centos_nodes"
  - key: "ostype"
    value: "linux"
  - key: "instance_filter"
    value: "{{ env_type }}-{{ email }}"
  rootfs_size: 10
  security_groups:
  - DefaultSG
  - NodeSG
  UserData: |
    {% filter indent(width=6) %}
    UserData:
      "Fn::Base64":
          "Fn::Join":
            - ""
            - - "#cloud-config\n"
              - "users:\n"
              - "  - default\n"
              - "  - name: ec2-user\n"
              - "    lock_passwd: true\n"
              - "    gecos: Cloud User\n"
              - "    groups: [adm, systemd-journal]\n"
              - "    sudo: ['ALL=(ALL) NOPASSWD:ALL']\n"
              - "    shell: /bin/bash\n"
              - "    ssh-authorized-keys:\n"
              - "    ssh_authorized_keys:\n"
              - "      - {{ hostvars.localhost.ssh_provision_pubkey_content | default('') }}\n"
    {% endfilter %}

- name: "node6"
  count: 1
