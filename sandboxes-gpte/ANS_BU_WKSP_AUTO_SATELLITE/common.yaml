              - "  - name: ec2-user\n"
              - "    lock_passwd: true\n"
              - "    gecos: Cloud User\n"
              - "    groups: [adm, systemd-journal]\n"
              - "    sudo: ['ALL=(ALL) NOPASSWD:ALL']\n"
              - "    shell: /bin/bash\n"
