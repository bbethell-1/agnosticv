purpose: dev
satellite_instance_name: satellite
satellite_instance_image: Satellite 6.15 2025-02-05-162620
satellite_instance_type: r7a.2xlarge
controller_projects:
- name: Automated Management
  scm_url: https://github.com/redhat-partner-tech/automated-satellite.git
  organization: Default
  description: prescriptive demos from Red Hat
  scm_type: git
  scm_branch: aap2-rhdp-dev
  default_environment: auto_satellite workshop execution environment
  state: present
- name: Fact Scan
  scm_url: https://github.com/ansible/awx-facts-playbooks.git
  organization: Default
  description: prescriptive demos from Red Hat
  scm_type: git
  scm_branch: master
  state: present
- name: Demo Project
  organization: Default
  state: absent
centos_instances:
- name: node4
  count: 1
  unique: true
  public_dns: false
  image:
    name: savage-minimal-centos-7.9-hvm-std01.x86_64-gp2
  flavor:
    ec2: '{{ centos_instance_type | default(default_instance_type) }}'
  tags:
  - key: AnsibleGroup
    value: centos_nodes
  - key: ostype
    value: linux
  - key: instance_filter
    value: '{{ env_type }}-{{ email }}'
  rootfs_size: 50
  security_groups:
  - DefaultSG
  - NodeSG
  UserData: "{% filter indent(width=6) %}\nUserData:\n  \"Fn::Base64\":\n      \"Fn::Join\":\n        - \"\"\n        - - \"#cloud-config\\n\"\n          - \"users:\\n\"\n          - \"  - default\\n\"\n          - \"  - name: ec2-user\\n\"\n          - \"    lock_passwd: true\\n\"\n          - \"    gecos: Cloud User\\n\"\n          - \"    groups: [adm, systemd-journal]\\n\"\n          - \"    sudo: ['ALL=(ALL) NOPASSWD:ALL']\\n\"\n          - \"    shell: /bin/bash\\n\"\n          - \"    ssh-authorized-keys:\\n\"\n          - \"    ssh_authorized_keys:\\n\"\n          - \"      - {{ hostvars.localhost.ssh_provision_pubkey_content | default('') }}\\n\"\n{% endfilter %}\n"
