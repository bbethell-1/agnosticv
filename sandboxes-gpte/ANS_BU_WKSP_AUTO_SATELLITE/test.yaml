instances: >-
  {{ base_instances + (centos_instances if el_rebuild_distribution == 'centos' else oracle_instances) }}

controller_hosts: >-
  {{ controller_hosts__with_centos if el_rebuild_distribution == 'centos' else controller_hosts__with_oracle }}

controller_groups: >-
  {{ controller_groups__with_centos if el_rebuild_distribution == 'centos' else controller_groups__with_oracle }}

aws_default_volume_type: gp3
aws_ebs_volume_iops: 6000
aws_ebs_volume_throughput: 600

# Enable ODCR
agnosticd_aws_capacity_reservations_enable: true

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    git_tag_prefix: auto-satellite
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: always
  catalog:
    parameters:
    - name: el_rebuild_distribution
      description: Rebuilder Enterprise Linux distribution
      formLabel: EL Rebuild Distribution
      openAPIV3Schema:
        type: string
        default: centos
        enum:
        - centos
        - oracle
...
