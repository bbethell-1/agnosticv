# -------------------------------------------------------------------
# Workloads: Pre/Software/Post
# -------------------------------------------------------------------
pre_software_workloads:
  bastions:
    - set-repositories
    - common
    - bastion-lite
  controllers:
    - set-repositories
  rhel9_nodes:
    - set-repositories
  rhel8_nodes:
    - set-repositories
  rhel7_nodes:
    - set-repositories

software_workloads:
  all:
    - control-user
  controllers:
    - nginx_with_cert
  # satellites:
  #   - lb1152.hol.satellite_reconfigure

post_software_workloads:
  controllers:
    - ansible_automation_platform_configuration

post_software_final_workloads:
  localhost:
    - agnosticv-userdata-import
