# -------------------------------------------------------------------
# --- Catalog Item: Red Hat Discovery SEAPP
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: multi-cloud-base-infra
cloud_provider: ec2

# -------------------------------------------------------------------
# Instance Variables
# -------------------------------------------------------------------
default_instance_image: RHEL96GOLD-latest
controller_instance_image: aap-2.5-10.1-x86_64-20250304
satellite_instance_image: lb1152-satellite-6.17-20250407
rhel10_instance_image: RHEL-10.0-GOLD-latest
rhel9_instance_image: RHEL96GOLD-latest
rhel8_instance_image: RHEL87GOLD-latest
rhel7_instance_image: RHEL79GOLD-latest

default_instance_type: "t3a.large"
controller_instance_type: "m5ad.2xlarge"
satellite_instance_type: r7a.2xlarge

default_rootfs_size: 50
controller_rootfs_size: 200
satellite_rootfs_size: 250

# -------------------
# Security Groups
# -------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BastionSSHPorts
        description: "Bastion ssh"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: WebHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: WebHTTPSPorts
        description: "HTTPS Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: NodeSG
    rules:
      - name: FromNodeSGtcp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: tcp
        from_group: NodeSG
        rule_type: Ingress
      - name: FromNodeSGudp
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: udp
        from_group: NodeSG
        rule_type: Ingress

  - name: DiscoverySG
    rules:
      - name: DisHTTPSPorts
        description: "Discovery HTTPS Public"
        from_port: 9443
        to_port: 9443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------
# Instances
# -------------------
instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ bastion_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - WebSG
      - NodeSG
      - DiscoverySG

  - name: "controller"
    count: 1
    unique: true
    public_dns: true
    image:
      name: "{{ controller_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ controller_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "controllers"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ controller_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - NodeSG
      - WebSG

  - name: "satellite"
    count: 1
    unique: true
    public_dns: true
    # image: "{{ satellite_instance_image | default(default_instance_image) }}"
    image:
      name: "{{ satellite_instance_image }}"
    flavor:
      ec2: "{{ satellite_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "satellites"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ satellite_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "rhel9"
    count: 1
    unique: true
    public_dns: false
    image: "{{ rhel9_instance_image }}"
    flavor:
      ec2: "{{ rhel9_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel9_nodes,nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhel9_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "rhel8"
    count: 1
    unique: true
    public_dns: false
    image: "{{ rhel8_instance_image }}"
    flavor:
      ec2: "{{ rhel8_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel8_nodes,nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhel8_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

  - name: "rhel7"
    count: 1
    unique: true
    public_dns: false
    image: "{{ rhel7_instance_image }}"
    flavor:
      ec2: "{{ rhel7_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "rhel7_nodes,nodes"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rhel7_rootfs_size | default(default_rootfs_size) }}"
    security_groups:
      - BastionSG
      - DefaultSG
      - NodeSG
      - WebSG

