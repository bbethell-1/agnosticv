bookbag_git_version: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: development
  virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - satellite-rhel90-ha
    - bookbag-deployer-shared-410
