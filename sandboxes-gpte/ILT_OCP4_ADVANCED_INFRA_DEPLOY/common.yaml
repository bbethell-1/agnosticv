---
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Advanced Infrastructure Deployment Lab
# --- ILT: OpenShift 4 Advanced Infrastructure Deployment
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-ha-lab
software_to_deploy: none

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
cloudformation_retries: 0

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Set up a UtilityVM and other resources for the ILT
# -------------------------------------------------------------------
install_utilityvm: true
install_student_resources: true
install_certificates: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: true

# -------------------------------------------------------------------
# AWS Instance sizes
# -------------------------------------------------------------------
bastion_instance_type: t3a.medium
utilityvm_instance_type: t3a.small

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: true
  nuke_sandbox: true
  virtualenv: aws-ansible-2.9
  secrets:
  - satellite-rhel81
