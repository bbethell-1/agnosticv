---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Infra Workloads
# -------------------------------------------------------------------
infra_workloads:
  - bookbag

# -------------------------------------------------------------------
# Bookbag
# -------------------------------------------------------------------
# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/bookbag-elt-ocp4-disconnected.git
bookbag_git_version: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ilt-ocp4-advanced-infra-deploy-aws
  sandboxed: true
  nuke_sandbox: true
  virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - satellite-rhel90-ha
