---
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2

aws_region: us-east-2

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: true

requirements_content:
  collections:
    - name: amazon.aws
      version: 4.0.0
    - name: community.general
      version: 4.8.1
    - name: containers.podman
      version: 1.10.1

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
# AgnosticV Metadata
# Set VirtualEnv to run this config in


agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    region: aws_region

sandbox_user_info_messages_enable: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-enterprise
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27

  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Showroom UI/UX PoC
    keywords:
      - showroom
      - poc
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      # Featured_Score: '90'
    parameters: []
  secrets:
    - name: ent-demo-ate
      namespace: gpte
  access_control:
    allow_groups:
      - babylon-admins
      - babylon-devs
      - rhpds-devs

repo_method: satellite
set_repositories_satellite_ha: true
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_activationkey: wasm-oci-rhel8-87htR

common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

student_name: devops
student_password: "{{ common_password }}"
vscode_user_password: "{{ common_password }}"
ansible_service_account_user_name: devops
ansible_service_account_user_password: "{{ common_password }}"

showroom_git_repo: https://github.com/tonykay/showroom-poc-2023-06.git

common_packages_el8:

  - at
  - bash-completion
  - bind-utils
  - python3.9
  - python3-devel
  - tree
  - unzip
  - vim-enhanced
  - wget

agd_bastion_packages:

  - ansible
  - at
  - bash-completion
  - bind-utils
  - gcc
  - git
  - httpd-tools
  - neovim
  - jq
  - python3.9
  - python3-devel
  - tree
  - tmux
  - unzip
  - vim-enhanced
  - wget
  - zsh

instances:

  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(default_instance_image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(default_instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - ShowroomSG
      - WebSG

security_groups:

  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:

      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:

      - name: ShowroomMain
        description: "Showroom main ports"
        from_port: 8000
        to_port: 8080
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
