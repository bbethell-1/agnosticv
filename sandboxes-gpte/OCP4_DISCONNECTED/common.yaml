---
#include /includes/catalog-icon-openshift.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region2.yaml
#include /includes/secrets/showroom-shared-410.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-disconnected

# Disable creating SSH key and bastion inventory (like skip-tags)
create_ssh_config: false

workshop_cloudformation_tag: rhdp-prod

# ansible/roles-infra/infra-aws-open-environment/tasks/main.yaml
agnosticd_open_environment: true
# ansible/roles-infra/infra-aws-open-environment/tasks/print_user_info.yaml
sandbox_user_info_messages_enable: false

# -------------------------------------------------------------------
# Showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/naps-product-sa/ocp4-disconnected-workshop.git
ocp4_workload_showroom_content_git_repo_ref: rhdp-prod
showroom_deploy_shared_cluster_enable: true
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_novnc_enable: true
ocp4_workload_showroom_deployer_chart_version: "1.1.1"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: a888e0c8-2ad9-4f37-9b24-ee162c2016b9
  sandbox_api:
    actions:
      stop:
        enable: true
      start:
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift Disconnected Workshop
    category: Demos
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RH_Community
      SLA: Community
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
