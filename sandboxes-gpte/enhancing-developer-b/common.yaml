---
# -------------------------------------------------------------------
# AgnosticV Includes
# -------------------------------------------------------------------
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-4.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/access-restriction-devs-only.yaml
#include /includes/secrets/zerossl.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
student_user: lab-user

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Bastion configuration
# -------------------------------------------------------------------
instances:
- name: "qa"
  count: 1
  unique: true
  public_dns: true
  alt_name:
  - clientvm
  image: "{{ bastion_instance_image }}"
  flavor:
    "ec2": "{{ bastion_instance_type }}"
  tags:
  - key: "AnsibleGroup"
    value: "bastions,clientvms"
  - key: "ostype"
    value: "linux"
  - key: "Purpose"
    value: "{{ purpose }}"
  - key: "project"
    value: "{{ project_tag }}"
  - key: "user"
    value: "{{ student_name }}"
  rootfs_size: "{{ bastion_rootfs_size }}"
  security_groups:
  - BastionSG
bastion_public_dns: “qa.{{ subdomain_base }}.”
bastion_public_dns_chomped: “qa.{{ subdomain_base }}”

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: HTTPPorts
    description: "HTTP Public"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: HTTPSPorts
    description: "HTTP Public"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Set OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.4.0
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: ansible.utils
    version: 2.7.0

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
cloudformation_retries: 0
cloud_provider: ec2
master_instance_type: m5a.4xlarge
master_instance_count: 1
worker_instance_count: 0
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL94GOLD-latest

# -------------------------------------------------------------------
# Role: create_ssh_provision_key
# -------------------------------------------------------------------
create_ssh_provision_key_enable_user_info_data: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true
student_password: "{{ common_password }}"
# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_cert_manager
- ocp4_workload_authentication
- ocp4_workload_rhacs

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: customer
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
# Create 1 user
ocp4_workload_authentication_htpasswd_user_count: 1
# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.7"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v4.7.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"
ocp4_workload_rhacs_enable_route_certs: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4c6616ae-996f-4e05-892d-e038e3d85d31
  anarchy:
    namespace: babylon-anarchy-3
  catalog:
    reportingLabels:
      primaryBU: Hybrid_Platforms
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      B-Enhancing Developer Efficiency and Security with Trusted Application Pipeline
    category: Workshops
    keywords:
    - rh1
    - rh12025
    - rh1lab8
    - rh12025lab8
    parameters: []
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Application_Platform
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
