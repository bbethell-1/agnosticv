# -------------------------------------------------------------------
# ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/burrsutter/rhtap-demo.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  sandboxed: false
  idle_after_deploy: 9999
  idle_after_start: 9999
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: BE203D03-26B8-476F-AF66-E69A866183E5
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: TAP DEVELOPER CLUSTER
    category: Workshops
    keywords:
    - Janus
    - project-janus
    - developer-hub
    - gitops
    - openshift
    - backstage
    parameters: []
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhods-git-secret
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
  - name: redhat-gpte-devhub-pull-secret
    namespace: gpte

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
