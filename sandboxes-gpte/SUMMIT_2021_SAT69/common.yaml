---
# Hands on with Red Hat Satellite 6.9

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-automation-management.yaml
#include /includes/parameters/open-environment-annotation.yaml

platform: RHPDS
env_type: satellite-vm

# Email is required for deployment... but really shouldn't be.
email: devops@example.com

cloud_provider: osp
osp_auth_project_domain: default

output_dir: /tmp/workdir                # Writable working scratch directory

install_satellite: true
configure_satellite: true
satellite_version: 6.9

use_content_view: false

# Fix for repo_method being picked up from account.yaml - bigger issue?

repo_method: satellite
bastion_repo_method: satellite

update_packages: true

rhel7_repo_path: "http://d3s3zqyaz8cp2d.cloudfront.net/repos/ocp/common"
# not used
#satellite_repo_path: "http://d3s3zqyaz8cp2d.cloudfront.net/repos/satellite"

#satellite_repos:
#  - Summit-2020_Summit-Contents_Satellite_Maintenance_Next_RHEL7
#  - Summit-2020_Summit-Contents_Satellite_6_7_RHEL7
#  - Summit-2020_Summit-Contents_Satellite_Tools_6_7_RHEL7_x86_64

satellite_host_repo_method: satellite

satellite_host_repo_registration:
  org: "{{ satellite_org }}"
  activationkey: "{{ satellite_activationkey }}"
  url: "{{ satellite_url }}"

# Satellite configuration

satellite_admin: admin
satellite_admin_password: admin

satellite_manifest:
  type: url
  url: https://www.opentlc.com/summit-protected/manifest_SatLab-Summit2020_20200323T173420Z.zip
  username: summit
  password: summit2020

cdn_repository_url: http://d3s3zqyaz8cp2d.cloudfront.net/cdn

org: "Red Hat"
org_label: Red_Hat
org_description: "Red Hat on Summit 2020"

satellite_enable_rex_on_satellite_host: yes
satellite_settings:
  - name: content_disconnected
    value: True

satellite_hosts:
  - name: skylab
  - name: aqua

satellite_hosts_register_key: 'rhel-8_ak'

capsule_instance_count: 1

satellite_libvirt_network:
  name: SummitProvisioning
  domain: summit.example.org
  network: '192.168.122.0'
  gateway: '192.168.122.1'
  netmask: '255.255.255.0'
  range_from: '192.168.122.2'
  range_to: '192.168.122.254'

lifecycle_environment_path:
  - name: "Development"
    label: "dev"
    description: "Development Environment"
    prior_env: "Library"
  - name: "Staging"
    label: "staging"
    description: "Quality Environment"
    prior_env: "Development"
  - name: "Production"
    label: "production"
    description: "Production Environment"
    prior_env: "Staging"

subscription_name: "Employee SKU"
########## Activation Key #####################
satellite_content:
  - name: "RHEL 8"
    activation_key: "rhel-8_ak"
    content_view: "RHEL 8 Content"
    life_cycle: "Staging"
    repos:
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - BaseOS (RPMs)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8'
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - AppStream (RPMs)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8'
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - BaseOS (Kickstart)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8.4'
        download_policy: 'immediate'
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - AppStream (Kickstart)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8.4'
        download_policy: 'immediate'

  - name: "RHEL8-Incremental-Update"
    content_view: "RHEL8-Incremental-Update"
    life_cycle: "Library"
    repos:
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - BaseOS (RPMs)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8'
        sync: no
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - AppStream (RPMs)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8'
        sync: no
    filters:
      - name: 'Exclude Errata after 2019-09-01'
        start_date: '2019-09-01'
        type: 'erratum'
        inclusion: False
      - name: 'Exclude glib*'
        type: 'rpm'
        inclusion: False
        rule_name: 'glib*'

  - name: "Test-View"
    content_view: "Test-View"
    life_cycle: "Library"
    repos:
      - name: 'Red Hat Enterprise Linux 8 for x86_64 - BaseOS (Kickstart)'
        product: 'Red Hat Enterprise Linux for x86_64'
        releasever: '8.4'
        sync: no

satellite_compute_profiles:
  - name: "Default"
    compute_resource: 'LibvirtLocal'
    nics_attributes:
      "0":
        type: network
        network: default
        model: virtio
    volume_attributes:
      "0":
        pool_name: default
        capacity: 10G
        format_type: raw


satellite_hostgroups:
  - name: "rhel-8"
    root_pass: summit2020
    operatingsystem: 'RedHat 8.4'
    lifecycle_environment: Staging
    content_view: 'RHEL 8 Content'
    kickstart_repository: 'Red Hat Enterprise Linux 8 for x86_64 - BaseOS Kickstart 8.4'
    ptable: 'Kickstart default'
    pxe_loader: 'PXELinux BIOS'
    compute_resource: 'LibvirtLocal'
    compute_profile: 'Default'
    domain: 'summit.example.org'
    subnet: 'SummitProvisioning'

satellite_roles:
  - name: Template Manager
    description: Role to allow template management
    filters:
      - permissions:
          - lock_report_templates
          - generate_report_templates
          - edit_report_templates
          - destroy_report_templates
          - create_report_templates
          - view_report_templates

satellite_users:
  - name: summit-admin
    description: 'User with template management permissions'
    firstname: Summit
    lastname: Admin
    mail: 'admin@summit.example.com'
    admin: yes
    password: summit2020
  - name: template_user
    description: 'User with template management permissions'
    firstname: Template
    lastname: User
    mail: 'template@user.com'
    password: changeme
    roles:
      - Viewer
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
    display_name: Hands on with Red Hat Satellite 6.9
    # Possible values: Labs, Workshops, Demos (plurals)
    category: Labs
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - workshop
      - satellite
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      #Satellite_Version: "6.9"
      Product: Satellite
      Provider: GPTE
    tags:
      - babylon
  owners:
    - email: orabin@redhat.com
      name: Ori Rabin
    - email: evgeni@redhat.com
      name: Evgeni Golov
    - email: jlenz@redhat.com
      name: Jeremy Lenz
    - email: ymakias@redhat.com
      name: Yifat Fani Makias
    - email: chiggins@redhat.com
      name: Cole Higgins
  secrets:
    - name: satellite-manifest-get
      namespace: gpte
