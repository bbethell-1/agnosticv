---
# Red Hat Summit 2020 - T31437 - Pragmatic Approach to Debug Microservices Applications on Openshift
# course_id: RHS_2020_T31437

platform: RHDPS
env_type: ocp4-workshop
cloud_provider: ec2

# admin user for infra workloads
admin_user: admin
admin_password: admin

osrelease: 4.3.0
ocp4_installer_version: 4.3.13

default_workloads:
  - ocp4-workload-enable-lets-encrypt-certificates
  - ocp4-workload-logging

infra_workloads:
  - ocp4-workload-debugging-workshop

# Setup lab-user for lab owner SSH access to bastion
install_student_user: true
student_sudo: true
student_name: lab-user

# Lab user access to OpenShift cluster
install_idm: htpasswd
user_password: openshift
user_count: 60

# Workshop Configuration
#workshop_openshift_user_name: userXX
#workshop_openshift_user_password: 'openshift'
#workshop_openshift_admin_password: 'r3dh4t!'
#workshop_operator_namespace: workshop-infra
#workshop_source_giturl: https://github.com/mcouliba/debugging-workshop
#workshop_source_gitbranch: "3.1"
#workshop_argocd_enabled: true
#workshop_argocd_operatorhub_channel: alpha
#workshop_argocd_operatorhub_csv: argocd-operator.v0.0.4
#workshop_bookbag_enabled: true
#workshop_bookbag_image_name: quay.io/mcouliba/debugging-workshop-bookbag
#workshop_bookbag_image_tag: "3.1"
#workshop_crw_enabled: true
#workshop_crw_operatorhub_channel: latest
#workshop_crw_operatorhub_csv: crwoperator.v2.1.0
#workshop_crw_oauth_enabled: false
#workshop_etherpad_enabled: true
#workshop_gogs_enabled: false
#workshop_gogs_image_name: quay.io/gpte-devops-automation/gogs-operator
#workshop_gogs_image_tag: v0.12
#workshop_nexus_enabled: true
#workshop_pipeline_enabled: false
#workshop_pipeline_operatorhub_channel: dev-preview
#workshop_pipeline_operatorhub_csv: openshift-pipelines-operator.v0.8.2
#workshop_project_enabled: true
#workshop_project_devname: dev-project
#workshop_project_stagingname: staging-project
#workshop_servicemesh_enabled: true
#workshop_servicemesh_operatorhub_channel: "1.0"
#workshop_servicemesh_operatorhub_csv: servicemeshoperator.v1.0.9
#workshop_istioworkspace_enabled: true
#workshop_istioworkspace_image_name: quay.io/maistra/istio-workspace
#workshop_istioworkspace_image_tag: v0.0.3
#workshop_workshopper_enabled: false

# Ensure the workload prints the correct statements for CloudForms to realize it finished
workload_shared_deployment: true

agnosticv_meta:
  params_to_variables:
    nodecount: ignorecfme
    num_users: ignorecfme
    username: student_name
    infra_workloads: infra_workloads
    student_workloads: student_workloads
  nuke_sandbox: true
