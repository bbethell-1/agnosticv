---
# Red Hat Summit 2023 - T0A529 - A Practical Introduction to Container Security
purpose: dev
#osrelease: 4.3.0

#node_instance_count: 2

#bastion_instance_image: RHEL91GOLD-latest
#set_repositories_rhel9_lock_release: '9.1'


__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: A Practical Introduction to Container Security
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    scm_ref: summit-2023
    scm_url: https://github.com/kincl/agnosticd.git
  secrets:
    - name: ocp4_token
      namespace: gpte
    - name: gpte
      namespace: gpte
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
