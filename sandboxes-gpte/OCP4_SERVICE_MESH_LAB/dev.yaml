---
purpose: development
cloudformation_retries: 0

# --- Config
ocp4_installer_version: 4.5.4
ocp4_enable_cluster_shutdown: false

# --- Repos
osrelease: 4.5.0
repo_version: '4.5.0'
# --- own_repo_path is inherited from default account settings based on osrelease

master_instance_type: m4.xlarge
master_instance_count: 3
worker_instance_type: m4.2xlarge
worker_instance_count: 2

agnosticv_meta:
  idle_after_deploy: 2
  idle_after_start: 4
