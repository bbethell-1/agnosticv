---
# purpose: production
cloudformation_retries: 0

# --- Config
ocp4_installer_version: 4.3.3
ocp4_enable_cluster_shutdown: true

# --- Repos
osrelease: 4.3.0
repo_version: '4.3'

master_instance_type: m5.xlarge
master_instance_count: 1
worker_instance_type: m5.2xlarge
worker_instance_count: 2

lets_encrypt_production: True
install_lets_encrypt_certificates: true
_lets_encrypt_certificates_install_api: False

agnosticv_meta:
  idle_after_deploy: 8
  idle_after_start: 10
  agnosticd_git_tag_prefix: ocp4-mesh-prod
