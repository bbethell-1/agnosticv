---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-cloud-native.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml

# -------------------------------------------------------------------
# Red Hat Summit 2021
# Building AI / ML Models leveraging Red Hat OpenShift Data Science
# course_id: rhs2021-a0008
# -------------------------------------------------------------------

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

run_janitor: false

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 4) | round(0, 'ceil') | int, 4] | max\
  \ }}"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# OpenShift version
ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_opentlc_production
- ocp4_workload_le_certificates
- ocp4_workload_project_request_template
- ocp-workload-terminal
- ocp4_workload_rhods_self_managed

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_olm
# -------------------------------------------------------------------
become_override: false
ocp_username: opentlc-mgr
silent: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_self_managed
# -------------------------------------------------------------------
ocp4_workload_rhods_self_managed_operator_group_name: "rhods-ods-operator"
ocp4_workload_rhods_self_managed_operator_name: "rhods-operator"
ocp4_workload_rhods_self_managed_namespace: "redhat-ods-operator"
ocp4_workload_rhods_self_managed_channel: "stable"
ocp4_workload_rhods_self_managed_catalogsource_setup: false
ocp4_workload_rhods_self_managed_installPlanApproval: "Automatic"
ocp4_workload_rhods_self_managed_source: "redhat-operators"
ocp4_workload_rhods_self_managed_sourceNamespace: "openshift-marketplace"
ocp4_workload_rhods_self_managed_csv_nameprefix: "rhods-operator"
ocp4_workload_rhods_self_managed_startingCSV: "rhods-operator.1.28.1"
ocp4_workload_rhods_self_managed_namespace_list:
- "{{ ocp4_workload_rhods_self_managed_namespace }}"
ocp4_workload_rhods_self_managed_applications_namespace: "redhat-ods-applications"
ocp4_workload_rhods_self_managed_is_workshop: false
ocp4_workload_rhods_self_managed_workshop_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_rhods_self_managed_workshop_username_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_rhods_self_managed_workshop_password: "{{ ocp4_workload_authentication_htpasswd_user_password }}"


# used when you are conducting a workshop
# will cause user data to be output
#ocp4_workload_rhods_olm_is_workshop: false
#ocp4_workload_rhods_olm_workshop_num_users: 10
#ocp4_workload_rhods_olm_workshop_username_base: "users"
#ocp4_workload_rhods_olm_workshop_password: "openshift"

# Workload variables #
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.12_2023_07_03


# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------

# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create number of htpasswd users
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('2')) | int }}"


# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# make the RHODS role output user data
ocp4_workload_rhods_olm_is_workshop: true
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

# OpenShift Data Science git repo version.
rhods_git_repo_version: 0.1
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: bed83364-d885-4cca-902c-8af0548a5fe6
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Machine Learning Workflows on RHODS
    category: Workshops
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp49
    labels:
      #OpenShift_Version: "4.7"
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Hybrid_Platform_BU
    multiuser: true
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        default: 2
        type: integer
        minimum: 2
        maximum: 100
      validation: >-
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        num_users == 2 ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
  owners:
  - email: ejacobs@redhat.com
    name: Erik Jacobs ejacobs@redhat.com
  - email: sophie@redhat.com
    name: Sophie Watson
  secrets:
  - namespace: gpte
    name: ocp4_token
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: rhods-git-secret
  - name: output-dir-s3
    namespace: gpte
