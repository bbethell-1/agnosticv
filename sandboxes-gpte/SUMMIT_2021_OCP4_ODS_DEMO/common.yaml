---
# Red Hat Summit 2021
# Building AI / ML Models leveraging Red Hat OpenShift Data Science
# course_id: rhs2021-a0008
# Owners: Erik Jacobs ejacobs@redhat.com, Sophie Watson sophie@redhat.com

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# Email is required for deployment... but really shouldn't be.
email: devops@example.com

# NEEDS to have aws region decided and declared here
aws_region: us-east-2

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

# --- These come from the account
# subdomain_base_suffix:
# HostedZoneId:

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: false

# OpenShift version
ocp4_installer_version: "4.7.16"

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create number of htpasswd users
ocp4_workload_authentication_htpasswd_user_count: 200
ocp4_workload_rhods_olm_workshop_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_rhods_olm_workshop_username_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_rhods_olm_workshop_password: "{{ ocp4_workload_authentication_htpasswd_user_password }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# base64 encoded pull secret
ocp4_workload_rhods_olm_pull_secret: ewogICJhdXRocyI6IHsKICAgICJxdWF5LmlvIjogewogICAgICAiYXV0aCI6ICJiVzlrYUN0cFpHaGZZMngxYzNSbGNsOXBiV0ZuWlY5d2RXeHNaWEk2TUZVelJVODFVRk5JTVZOWlVqVkZPRmxDUWxJMFVGQkRTVU5LTlZGTE5GWk5SVGhOUmtoWVUwdFNNVXRRVGsxVFMxUXdWa2hJUVVvMFRFWkxVelpFVGc9PSIsCiAgICAgICJlbWFpbCI6ICIiCiAgICB9CiAgfQp9

# make the RHODS role output user data
ocp4_workload_rhods_olm_is_workshop: true

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_opentlc_production
  - ocp4_workload_le_certificates
  - ocp-workload-terminal
  - ocp4_workload_workload_monitoring
  - ocp4_workload_rhods_olm

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  catalog:
    namespace: gpte
# ---------------------------------------------------------------------------------------------------  #
# Below vars commented out are for the Summit2021 OCP UI and may be needed after CloudForms decommish  #
# ---------------------------------------------------------------------------------------------------  #
    #display_name: Machine learning workflows on RHODS
    # Icon value should can be any product name, no spaces, for which we have
    # a product icon. Default will be generic icon.
    #icon: openshift
    # Possible values: Labs, Workshops, Demos (plurals)
    #category: Labs
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    #keywords:
    #  - workshop
    #  - ocp4
    #  - openshift
    #  - openshift data science
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    #labels:
      #OpenShift_Version: "4.7"
      #Product: OpenShift
      #Provider: GPTE
      #Event: Red_Hat_Summit
    #multiuser: true
  secrets:
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
    - name: ocp4_token
      namespace: gpte
    - name: satellite-rhel81
      namespace: gpte
