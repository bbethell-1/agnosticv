---
# Red Hat Summit 2021
# Building AI / ML Models leveraging Red Hat OpenShift Data Science
# course_id: rhs2021-a0008
# Owners: Erik Jacobs ejacobs@redhat.com, Sophie Watson sophie@redhat.com

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

run_janitor: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# OpenShift version
ocp4_installer_version: "4.7.16"

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create number of htpasswd users
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"
ocp4_workload_rhods_olm_workshop_num_users: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
ocp4_workload_rhods_olm_workshop_username_base: "{{ ocp4_workload_authentication_htpasswd_user_base }}"
ocp4_workload_rhods_olm_workshop_password: "{{ ocp4_workload_authentication_htpasswd_user_password }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# base64 encoded pull secret
ocp4_workload_rhods_olm_pull_secret: ewogICJhdXRocyI6IHsKICAgICJxdWF5LmlvIjogewogICAgICAiYXV0aCI6ICJiVzlrYUN0cFpHaGZZMngxYzNSbGNsOXBiV0ZuWlY5d2RXeHNaWEk2TUZVelJVODFVRk5JTVZOWlVqVkZPRmxDUWxJMFVGQkRTVU5LTlZGTE5GWk5SVGhOUmtoWVUwdFNNVXRRVGsxVFMxUXdWa2hJUVVvMFRFWkxVelpFVGc9PSIsCiAgICAgICJlbWFpbCI6ICIiCiAgICB9CiAgfQp9

# make the RHODS role output user data
ocp4_workload_rhods_olm_is_workshop: true

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_opentlc_production
  - ocp4_workload_le_certificates
  - ocp-workload-terminal
  - ocp4_workload_workload_monitoring
  - ocp4_workload_rhods_olm

# Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

############################
# AgnosticV meta variables #
############################
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
      - name: aws_region
      - name: student_name
      - name: num_users
        openAPIV3Schema:
          description: Number of users to provision within the environment.
          default: 1
          type: integer
          minimum: 1
          maximum: 100
  secrets:
    - namespace: gpte
      name: ocp4_token
    - namespace: gpte
      name: satellite-rhel81
