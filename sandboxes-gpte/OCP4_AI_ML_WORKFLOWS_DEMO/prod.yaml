---
purpose: rhpds-prod
cloudformation_retries: 0

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 4

install_lets_encrypt_certificates: true

# Create htpasswd users
ocp4_workload_authentication_htpasswd_user_count: "{{ user_count }}"

# -------------------------------------------------------------------
# agnosticv_meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 10
  idle_after_start: 10
  deploy_with: babylon
  params_to_variables:
    nodecount: ''
    num_users: user_count
  agnosticd_git_tag_prefix: ocp4-ai-ml-workflows-prod

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    parameters:
      - name: num_users
  deployer:
    scm_ref: ocp4-ai-ml-workflows-prod-1.1
