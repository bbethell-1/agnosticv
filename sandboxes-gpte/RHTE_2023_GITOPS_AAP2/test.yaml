---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: development

requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.3.1
    - name: openstack.cloud
      version: 1.7.2
    - name: amazon.aws
      version: 2.2.0
    - name: community.general
      version: 4.6.1
    - name: ansible.posix
      version: 1.3.0
    - name: awx.awx
      version: 21.1.0
    - name: ansible.utils
      version: 2.6.1

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------

platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------

cloud_provider: ec2
__image: RHEL84GOLD-latest
__instance_type: t3a.medium
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: t3a.medium

key_name: opentlc_admin_backdoor
cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

# num_users: 1
user_base: devops

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------

security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

# -------------------------------------------------------------------
# Instances vars
# -------------------------------------------------------------------

instances:
  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ bastion_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,load_balancers"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - WebSG
      - HostSG

  - name: "app-0"
    count: "{{ app_instance_count | default(2) }}"
    public_dns: true
    image: "{{ app_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ app_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "app_servers"
      - key: "ostype"
        value: "linux"
    security_groups:
      - DefaultSG
      - WebSG
      - HostSG

  - name: database-01
    count: 1
    unique: true
    public_dns: true
    image: "{{ db_instance_image | default(__image) }}"
    flavor:
      ec2: "{{ db_instance_type | default(__instance_type) }}"
    tags:
      - key: "AnsibleGroup"
        value: "database_servers"
      - key: "ostype"
        value: "rhel"
    security_groups:
      - DefaultSG
      - HostSG
      - BastionSG

# -------------------------------------------------------------------
# Workload: ocp4_workload_tekton_execution_environment
# -------------------------------------------------------------------
ocp4_workload_tekton_ee_automation_controller_job_template: "multitier-app-deployer"
ocp4_workload_tekton_ee_automation_controller_registry_credential: "hub_registry_credentials"

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.10"
master_instance_count: 1
master_instance_type: m5.8xlarge
worker_instance_count: 0
# worker_instance_type: m5.4xlarge
ocp4_base_domain: "{{ sandbox_zone }}"
