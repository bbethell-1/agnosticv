---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: development

# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"
master_instance_count: 1
master_instance_type: m5a.2xlarge
worker_instance_count: 1
worker_instance_type: m5a.2xlarge
ocp4_base_domain: "{{ sandbox_zone }}"

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
