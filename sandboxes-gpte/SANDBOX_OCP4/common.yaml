---
platform: rhpds

# The name of the agnosticd config to deploy
env_type: ocp4-ha-lab

# What we use in this environment to get the packages we need
repo_method: satellite
satellite_url: labsat.opentlc.com

software_to_deploy: openshift4

# OpenShift Installer Version
ocp4_installer_version: "4.7.20"

# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  nuke_sandbox: true
  deploy_with: babylon
  secrets:
  - ocp4_token
  - satellite-rhel81

__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81
