---
platform: rhpds

# The name of the agnosticd config to deploy
env_type: ocp4-cluster

software_to_deploy: openshift4

osrelease: 4.6
# OpenShift Installer Version
ocp4_installer_version: "4.7"

# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  nuke_sandbox: true
  deploy_with: babylon
  secrets:
  - ocp4_token

__meta__:
  aws_sandboxed: true
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
  secrets:
  - namespace: gpte
    name: ocp4-token
