---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

__meta__:
  deployer:
    scm_ref: development
    scm_type: git

# -------------------------------------------------------------------
# Workload: infra_workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_rhacm
  - ocp4_workload_minio
  - ocp4_workload_redhat_developer_hub_bootstrap
  - ocp4_workload_trusted_artifact_signer
  - ocp4_workload_pipelines
  - ocp4_workload_gitops_gitlab
  - ocp4_workload_sonarqube
  - ocp4_workload_rhacs
  - ocp4_workload_trusted_application_pipeline
  - ocp4_workload_trusted_profile_analyzer

# -------------------------------------------------------------------
# Workload: showroom
# -------------------------------------------------------------------
showroom_git_repo: https://github.com/mfosterrox/openshift-security-roadshow
showroom_git_ref: main

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_enable_route_certs: false
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.7"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v4.7.2"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_quay_operator
# -------------------------------------------------------------------
ocp4_workload_quay_operator_channel: stable-3.14
ocp4_workload_quay_operator_starting_csv: quay-operator.v3.14.0
ocp4_workload_quay_operator_use_catalog_snapshot: false

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_gitops_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_import_repos:
  - name: rhdh
    repo:
      - name: trusted-application-pipeline-templates
        url: https://github.com/redhat-gpte-devopsautomation/trusted-application-pipeline-templates.git
  - name: summit-lab
    repo:
      - name: backstage-workshop
        url: https://github.com/redhat-gpte-devopsautomation/backstage-workshop.git
  - name: gitops
    repo:
      - name: janus-idp-gitops
        url: https://github.com/redhat-gpte-devopsautomation/janus-idp-gitops.git
