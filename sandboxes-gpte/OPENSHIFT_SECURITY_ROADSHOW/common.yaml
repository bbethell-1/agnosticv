---
#include /enterprise/includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-project-dance.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/rhods-git-secret.yml
#include /includes/secrets/ocp4_token.yaml

# -------------------------------------------------------------------
# --- Catalog Item: DevSecOps Validated Framework - Parallel
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"
num_users: 1

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Cloud Provider
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: m5.8xlarge
bastion_instance_image: RHEL92GOLD-latest

key_name: opentlc_admin_backdoor
region: us-east-2
cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"
aws_region: us-east-2

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPPublic
        description: "HTTP public for Let's Encrypt verification"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPSPublic
        description: "HTTPS public for Let's Encrypt verification"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_03_03

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m5.4xlarge
worker_instance_count: 3
worker_instance_type: m5.8xlarge

# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.4.0
    - name: amazon.aws
      version: 2.3.0
    - name: community.general
      version: 6.4.0
    - name: ansible.posix
      version: 1.5.1
    - name: ovirt.ovirt
      version: 3.1.1
    - name: awx.awx
      version: 21.1.0
    - name: ansible.utils
      version: 2.7.0

# -------------------------------------------------------------------
# Workload: infra_workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_rhsso_authentication
  - ocp4_workload_openshift_data_foundation
  - ocp4_workload_rhacm
  - ocp4_workload_minio
  - ocp4_workload_redhat_developer_hub_bootstrap
  - ocp4_workload_trusted_artifact_signer
  - ocp4_workload_pipelines
  - ocp4_workload_gitops_gitlab
  - ocp4_workload_sonarqube
  - ocp4_workload_rhacs
  - ocp4_workload_trusted_application_pipeline
  - ocp4_workload_trusted_profile_analyzer

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.11-opr-004
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_rhsso_authentication_admin_create: true
ocp4_workload_rhsso_authentication_admin_username: admin
ocp4_workload_rhsso_authentication_admin_password: "{{ common_password }}"
ocp4_workload_rhsso_authentication_remove_kubeadmin: false

ocp4_workload_rhsso_authentication_user_count: "{{ num_users }}"
ocp4_workload_rhsso_authentication_user_name_base: user
ocp4_workload_rhsso_authentication_user_password: "{{ common_password }}"

ocp4_workload_rhsso_authentication_env_type: "{{ env_type }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_minio
# -------------------------------------------------------------------
ocp4_workload_minio_project: ic-shared-minio
ocp4_workload_minio_storage_size: 256Gi
ocp4_workload_minio_modern_deployment: true
ocp4_workload_minio_expose_route: true
ocp4_workload_minio_root_user: minio
ocp4_workload_minio_root_password: "{{ common_password }}"
ocp4_workload_minio_image: quay.io/minio/minio
ocp4_workload_minio_image_tag: RELEASE.2024-05-28T17-19-04Z
ocp4_workload_minio_bucket_setup: true
ocp4_workload_minio_bucket_name:
  - backstage-bucket
ocp4_workload_minio_bucket_multi_user: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_trusted_artifact_signer
# -------------------------------------------------------------------
ocp4_workload_trusted_artifact_signer_rhsso_namespace: rhsso

ocp4_workload_trusted_artifact_signer_rhtas_namespace: openshift-operators
ocp4_workload_trusted_artifact_signer_rhtas_target_namespaces: openshift-operators
ocp4_workload_trusted_artifact_signer_rhtas_channel: stable-v1.1
ocp4_workload_trusted_artifact_signer_rhtas_starting_csv: rhtas-operator.v1.1.1
ocp4_workload_trusted_artifact_signer_rhtas_use_catalog_source: true
ocp4_workload_trusted_artifact_signer_rhtas_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_trusted_artifact_signer_rhtas_catalogsource_image_tag: v4.17_2025_03_03
ocp4_workload_trusted_artifact_signer_rhtas_automatic_install_plan_approval: true
ocp4_workload_trusted_artifact_signer_rhtas_config:
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_enable_route_certs: true
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.8"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v4.8.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: false
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"
ocp4_workload_rhacs_enable_central_scanner_v4: true
ocp4_workload_rhacs_collector_config_enable: true
ocp4_workload_rhacs_collector_config_expternal_ips_enable: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------
ocp4_workload_rhacm_acm_channel: "release-2.12"
ocp4_workload_rhacm_use_catalog_snapshot: true
ocp4_workload_rhacm_catalog_source_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhacm_catalog_source_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -----------------------------------
# Quay Operator
# -----------------------------------
ocp4_workload_quay_operator_channel: stable-3.14
ocp4_workload_quay_operator_starting_csv: quay-operator.v3.14.0
ocp4_workload_quay_operator_use_catalog_snapshot: false
ocp4_workload_quay_operator_namespace: quay-registry
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# -----------------------------------
# OpenShift Data Foundations Operator
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.17
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 1500Gi
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_old_default_storage_class_name: gp3-csi

ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.16
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# GitLab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_type: argocd
ocp4_workload_gitops_gitlab_config_email_display_name: Janus Admin
ocp4_workload_gitops_gitlab_config_email_reply_to: "noreply@redhat.com"
ocp4_workload_gitops_gitlab_config_smtp_enabled: "false"
ocp4_workload_gitops_gitlab_config_smtp_domain: "example.com"
ocp4_workload_gitops_gitlab_config_smtp_port: "587"
ocp4_workload_gitops_gitlab_config_smtp_user: "gitlab"
ocp4_workload_gitops_gitlab_config_smtp_password: "gitlab"
ocp4_workload_gitops_gitlab_config_ssh_port: "22"
ocp4_workload_gitops_gitlab_config_rootPassword: "{{ common_password }}"
ocp4_workload_gitops_gitlab_config_https: "true"
ocp4_workload_gitops_gitlab_config_root_email: "root@demo.redhat.com"
