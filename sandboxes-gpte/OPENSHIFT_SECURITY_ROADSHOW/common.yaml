ocp4_workload_trusted_application_pipeline_backstage_gitlab_user_password: "{{ ocp4_workload_gitops_gitlab_user_password }}"
ocp4_workload_trusted_application_pipeline_admin_user: admin
ocp4_workload_trusted_application_pipeline_admin_password: "{{ common_password }}"
ocp4_workload_trusted_application_pipeline_gitlab_template_locations:
  - group: rhdh
    project: trusted-application-pipeline-templates
    branch: main
    file: showcase-templates.yaml
    rules:
      allow: Template
    templates:
      - scaffolder-templates/quarkus-stssc-template/template.yaml
  - group: rhdh
    project: trusted-application-pipeline-templates
    branch: main
    file: org.yaml
    rules:
      allow: Group, User
    templates: []
  - group: rhdh
    project: trusted-application-pipeline-templates
    branch: main
    file: catalogs.yaml
    rules:
      allow: Component, System, API, Resource, Location, Template
    templates: []
  - group: summit-lab
    project: backstage-workshop
    branch: master
    file: showcase-templates.yaml
    rules:
      allow: Template
    templates:
      - scaffolder-templates/poi-map/template.yaml
      - scaffolder-templates/poi-gateway/template.yaml
      - scaffolder-templates/poi-backend/template.yaml

