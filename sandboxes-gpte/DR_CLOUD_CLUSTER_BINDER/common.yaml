---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-red-hat-standard-logo.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/opentlc-mgr-migration-host.yaml

# -------------------------------------------------------------------
# Catalog Item: APAC 2022 - SUMMIT - Open Hybrid Clouds
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: odf-dr-binder

migration_key_path: "{{ ansible_ssh_private_key_file | default('') }}"

__meta__:
  asset_uuid: e5edc461-6c58-4f83-8d56-86a660f73f07
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    display_name: Achieve Business Continuity with Red Hat OpenShift Container Platform
    category: Demos
    keywords:
    - openshift-disaster-recovery
    - disaster-recovery
    - dr
    - odf
    - openshift-dr
    - business continuity
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Base_Component: 'True'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP

  # Components to include in template and catalog item
  components:
  - name: aws-hub
    display_name: Red Hat OpenShift Disaster Recovery Hub Cluster (ACM)
    item: sandboxes-gpte/DR_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_a_provision_data
  - name: aws-primary
    display_name: Red Hat OpenShift Disaster Recovery Primary Cluster
    item: sandboxes-gpte/DR_OCP4_CLUSTER_PRIMARY
    propagate_provision_data:
    - var: aws_primary_a_provision_data
  - name: aws-secondary
    display_name: Red Hat OpenShift Disaster Recovery Secondary Cluster
    item: sandboxes-gpte/DR_OCP4_CLUSTER_SECONDARY
    propagate_provision_data:
    - var: aws_secondary_a_provision_data

  # Disable actions on chained config that are handled by base.
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: always
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
