---
#include /includes/ee-multicloud-dev.yaml
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/juliaaano/coolstore-deploy
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: helm/bootstrap

ocp4_workload_gitops_bootstrap_helm_values:
  coolstoreOffice:
    source:
      repoURL: https://github.com/juliaaano/coolstore-deploy
    destination:
      namespace: coolstore-office
  coolstoreShop:
    source:
      repoURL: https://github.com/juliaaano/coolstore-deploy
    destination:
      namespace: coolstore-shop

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_url: https://github.com/juliaaano/agnosticd.git
    scm_ref: development
