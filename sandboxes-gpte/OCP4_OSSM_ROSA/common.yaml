---
#include /includes/catalog-icon-service-mesh.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-3regions.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
# -------------------------------------------------------------------
# --- Catalog Item: Heading to Production with Red Hat OSSM ROSA
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Top level vars
# -------------------------------------------------------------------
env_type: rosa

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false
host_ocp4_installer_set_user_data_kubeadmin_password: true

platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t2.small
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_openshift_gitops
- ocp4_workload_gitea_operator
- ocp4_workload_codeserver
- ocp4_workload_ossm
- ocp4_workload_rhsso
- ocp4_workload_gitops_bootstrap

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.13_2023_06_26
common_user_password: openshift

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.9

ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

# ocp4_workload_openshift_gitops_controller_update: true
# ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
# ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
# ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
# ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

# ocp4_workload_openshift_gitops_repo_update: true
# ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
# ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
# ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
# ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, cluster-admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_catalog_image: quay.io/gpte-devops-automation/gitea-catalog
ocp4_workload_gitea_operator_catalog_image_tag: v1.3.0
ocp4_workload_gitea_operator_starting_csv: gitea-operator.v1.3.0

ocp4_workload_gitea_operator_gitea_image: quay.io/gpte-devops-automation/gitea
ocp4_workload_gitea_operator_gitea_image_tag: "1.19.3"
ocp4_workload_gitea_operator_postgresql_image: registry.redhat.io/rhel8/postgresql-13
ocp4_workload_gitea_operator_postgresql_image_tag: 1-130

ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ num_users }}"
ocp4_workload_gitea_operator_generate_user_format: user%d
ocp4_workload_gitea_operator_user_password: "{{ common_user_password }}"
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/redhat-gpte-devopsautomation/ossm-labs
  name: ossm-labs
  private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_codeserver
# -------------------------------------------------------------------
ocp4_workload_codeserver_image: quay.io/gpte-devops-automation/codeserver
ocp4_workload_codeserver_image_tag: v4.14.0-java11
ocp4_workload_codeserver_init_image: quay.io/gpte-devops-automation/codeserver-init
ocp4_workload_codeserver_init_image_tag: v4.14.0

ocp4_workload_codeserver_gitea_name: "{{ ocp4_workload_gitea_operator_gitea_hostname }}"
ocp4_workload_codeserver_gitea_namespace: "{{ ocp4_workload_gitea_operator_project }}"

ocp4_workload_codeserver_multi_user_install: true
ocp4_workload_codeserver_multi_user_num_users: "{{ num_users }}"
ocp4_workload_codeserver_multi_user_username_base: user

ocp4_workload_codeserver_password: "{{ common_user_password }}"

# Repositories to set up in codeserver
ocp4_workload_codeserver_repos_password: "{{ common_user_password }}"
ocp4_workload_codeserver_repos:
- name: ossm-labs
  account: ""
  branch: main

# -------------------------------------------------------------------
# Workload: ocp4_workload_ossm
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: elasticsearch-operator.v5.7.2

ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: jaeger-operator.v1.42.0-5-0.1687199951.p

ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: kiali-operator.v1.65.6

ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: servicemeshoperator.v2.4.0

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhsso
# -------------------------------------------------------------------
ocp4_workload_rhsso_namespace: rhsso
ocp4_workload_rhsso_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_channel: stable
ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.3-opr-002
ocp4_workload_rhsso_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    rosa_token: rosa_token

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 78baad4b-1986-412c-823d-67c6b657f7c9
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: hybrid_cloud_aws_azure-ansible2.9-python3.6-2022-07-06
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Heading to Production with Red Hat Openshift Service Mesh Powered-by ROSA
    category: Workshops
    keywords:
    - workshop
    - openshift
    workshopUiDisabled: true
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the environment.
      formLabel: User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
        maximum: 2
    - name: rosa_token
      description: The ROSA Token can be created or downloaded here https://console.redhat.com/openshift/token/rosa
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
  runtime:
    default: 8h
    maximum: 48h
  secrets:
  - namespace: gpte
    name: rosa-token
