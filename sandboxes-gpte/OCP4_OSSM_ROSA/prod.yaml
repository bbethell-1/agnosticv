    count: "{{ num_users }}"
    prefix: user
  ossm:
    git:
      revision: helm-v1.0.3
    values:
      myKey: myValue1
  usertool:
    labAdminPassword: "r3dh4t1!"
    labUserPassword: "{{ common_user_password }}"
    labAccessToken: "{{ common_user_password }}"
  guides:
    repoRevision: v1.0.1
    image: ghcr.io/redhat-gpte-devopsautomation/ossm-labs-guides:v1.0.1
  labUsers:
    ocpSecret: htpasswd-secret

