---
# Red Hat Summit 2021
# Bring Chaos on OpenShift to make your applications more reliable
# course_id: rhs2021-a00013
# Owners: Madou Coulibaly (madou@redhat.com), Didier Wojciechowski (dwojciec@redhat.com)
# CPBU: saorg

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

# guid is the deployment unique identifier,
# it will be appended to all tags, files and anything
# that identifies this environment from another "just like it"
# It comes from Cloud Forms
# guid: defaultguid

platform: RHPDS

# Email is required for deployment... but really shouldn't be.
email: devops@example.com

run_janitor: false

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.7.13

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: false

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create 50 users
num_users: "{{ user_count }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users }}"

# Remove the standard kubeadmin user
ocp4_workload_authentication_remove_kubeadmin: true

# OPENTLC Production Customizations
ocp4_workload_opentlc_production_remove_self_provisioner: false

# Bookbag setup
bookbag_git_repo: https://github.com/redhat-gpte-labs/chaos-on-openshift-bookbag.git
bookbag_git_version: main
bookbag_namespace: bookbag

# Instance Details
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [( num_users / 9) | round(0, 'ceil') | int, 3] | max }}"

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4-workload-chaos-engineering-workshop
  - bookbag

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  params_to_variables:
    num_users: user_count
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  aws_sandboxed: true
  catalog:
    display_name: Chaos on OpenShift
    # Possible values: Labs, Workshops, Demos (plurals)
    category: Workshops
    icon:
      alt: "Cloud Native"
      url: "https://gpte-public.s3.amazonaws.com/babylon-catalog/Cloud_Native.svg"
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
      - workshop
      - openshift
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      OpenShift_Version: "4.7"
      Product: OpenShift
    parameters:
      - name: aws_region
      - name: student_name
      - name: user_count
        openAPIV3Schema:
          description: >-
            Number of users to provision for infrastructure deployment.
          default: 55
          type: integer
          minimum: 1
          maximum: 100
  secrets:
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
    - name: ocp4_token
      namespace: gpte
    - name: satellite-rhel81-ha
      namespace: gpte
