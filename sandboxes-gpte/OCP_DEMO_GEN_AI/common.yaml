# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication # all segments
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_data_foundation
#  - ocp4_workload_machinesets
#  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_authorino
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
#  - ocp4_workload_gitea_operator
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_openshift_ai
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom
  - ocp4_workload_web_terminal

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_admin_password }}"
ocp4_workload_authentication_htpasswd_user_base: "{{ ocp4_workload_user_base }}"
ocp4_workload_authentication_htpasswd_user_password: "{{ common_user_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ ocp4_workload_user_count }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_authentication_enable_user_info_data: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_ec2_region: "{{ aws_region }}"
ocp4_workload_cert_manager_ec2_access_key_id: "{{ hostvars.localhost.route53user_access_key }}"
ocp4_workload_cert_manager_ec2_secret_access_key: "{{ hostvars.localhost.route53user_secret_access_key }}"
ocp4_workload_cert_manager_channel: stable-v1.15
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -----------------------------------
# OpenShift Data Foundations Operator
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.18
ocp4_workload_openshift_data_foundation_catalogsource_setup: true
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 1500Gi
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

ocp4_workload_openshift_data_foundation_ceph_storage_system_deploy_timeout: 1500
ocp4_workload_openshift_data_foundation_ceph_storage_cluster_deploy_timeout: 1500
# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true

# Add a MachineSet for AWS Bare Metal instances
# To add another group of worker nodes - with autoscaling enabled add
# the following:
#
ocp4_workload_machinesets_machineset_groups:
  - name: worker-gpu
    autoscale: true
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 2
    role: worker-gpu
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule
    instance_type: "{{ gpu_instance_type }}"
    root_volume_size: "2000"

#------------------------------------------------
# ocp4_workload_nvidia_gpu_setup variables
# ------------------------------------------------
ocp4_workload_nvidia_gpu_setup_create_dashboard: true

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: openshift-nfd
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: ""
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""
nfd_operator_operand_image: "registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.18"

# ------------------------------------------------
# NVIDIA GPU Operator
# ------------------------------------------------
nvidia_gpu_operator_namespace: nvidia-gpu-operator
nvidia_gpu_operator_channel: v24.9
nvidia_gpu_operator_automatic_install_plan_approval: true
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v24.6.2
nvidia_gpu_operator_wait_for_deploy: true
nvidia_gpu_operator_use_catalog_snapshot: false
nvidia_gpu_operator_catalogsource_name: ""
nvidia_gpu_operator_catalog_snapshot_image: ""
nvidia_gpu_operator_catalog_snapshot_image_tag: ""

# ------------------------------------------------
# ocp4_workload_authorino
# ------------------------------------------------
ocp4_workload_authorino_operator_channel: stable
ocp4_workload_authorino_operator_use_catalog_snapshot: true
ocp4_workload_authorino_operator_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_authorino_operator_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_authorino_operator_catalogsource_name: redhat-operators-snapshot-authorino
ocp4_workload_authorino_operator_starting_csv: authorino-operator.v1.2.2

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.18.1

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.16
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_gitops_starting_csv: openshift-gitops-operator.v1.16.2

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
# Application Controller
ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: 250m
ocp4_workload_openshift_gitops_controller_requests_memory: 2Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "2"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ common_admin_username }}, role:admin
  g, user1, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_use_catalog_snapshot: true
ocp4_workload_serverless_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_serverless_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_serverless_starting_csv: serverless-operator.v1.36.0

ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# Workload ocp4_workload_ossm - Service Mesh
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Elasticsearch
ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: ""

# Jaeger
ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: ""

# Kiali
ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: ""

# Service Mesh
ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: ""

ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.12-opr-001
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.12-opr-001

# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: stable
ocp4_workload_openshift_ai_use_catalog_snapshot: true
ocp4_workload_openshift_ai_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_ai_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_ai_starting_csv: rhods-operator.2.22.0

ocp4_workload_openshift_ai_kserve: Managed

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/ritzshah/llm-rag-deployment.git
# ocp4_workload_gitops_bootstrap_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-helm-chart
ocp4_workload_gitops_bootstrap_repo_revision: update-token-v1

ocp4_workload_gitops_bootstrap_helm_values:
# Bootstrap ApplicationSet configuration for ArgoCD
# Gradio UI Configuration (shared between bootstrap and bootstrap-rag)
  gradioEnv:
    BEARER_TOKEN: "{{ granite_bearerToken }}"
  gradioRagEnv:
    BEARER_TOKEN: "{{ granite_bearerToken }}"
ocp4_workload_gitops_bootstrap_health_retries: 2

# -------------------------------------------------------------------
# ocp4_workload_argocd_bootstrap variables #
# -------------------------------------------------------------------
ocp4_workload_argocd_bootstrap_repo_list:
  - repo: https://github.com/ritzshah/llm-rag-deployment.git
    branch: update-token-v1
    bootstrap_path: bootstrap/applicationset/applicationset-bootstrap.yaml
  - repo: https://github.com/ritzshah/llm-rag-deployment.git
    branch: update-token-v1
    bootstrap_path: bootstrap-rag/applicationset/applicationset-bootstrap.yaml

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: >-
