# -------------------------------------------------------------------
# --- Catalog Item: Demo : Generative AI with Red Hat Openshift AI
# -------------------------------------------------------------------
# Demop - Generative AI with Red Hat Openshift AI

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
cloud_provider: ec2
bastion_instance_type: t3a.medium
#bastion_instance_image: RHEL84GOLD-latest
bastion_instance_image: RHEL94GOLD-latest

# Workload variables #
ocp4_workload_user_base: user
#ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_user_count: 1
ocp4_workload_multi_user: "{{ true if num_users | int > 1 else false }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.18_2025_07_25

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_admin_password: "{{ common_password }}"
common_user_password: "{{ common_password }}"
common_admin_username: admin

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
  - name: BastionSG
    rules:
      - name: BasSSHPublic
        description: "SSH public"
        from_port: 22
        to_port: 22
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPPublic
        description: "HTTP public for Let's Encrypt verification"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress
      - name: BasHTTPSPublic
        description: "HTTPS public for VSCode Server"
        from_port: 8443
        to_port: 8443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.18.24"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m6a.4xlarge
master_storage_type: io1
master_storage_size: 250
worker_instance_count: 4
worker_instance_type: m6a.8xlarge
worker_storage_type: gp3
worker_storage_size: 1500

rootfs_size_bastion: 2048

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
# ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Customizations to packages and virtualenvs to enable ovirt.ovirt
# -------------------------------------------------------------------
# Add prereqs for ovirt-engine-sdk-python Python package
host_virtualenv_package_prereqs:
  - gcc
  - python3
  - python3-devel
  - python3-libselinux
  - python3-pip
  - libcurl-devel
  - openssl-devel
  - libxml2-devel

# Add required Python packages to virtualenv for ovirt.ovirt collection
host_virtualenv_requirements_override:
  - ovirt-engine-sdk-python==4.5.0
  - passlib==1.7.4

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true
install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: kubernetes.core
      version: 2.4.0
    - name: amazon.aws
      version: 2.3.0
    - name: community.general
      version: 6.4.0
    - name: ansible.posix
      version: 1.5.1
    - name: ovirt.ovirt
      version: 3.1.1
    - name: awx.awx
      version: 21.1.0
    - name: https://github.com/rhpds/lb1942.instruct_docling_lab.git
      type: git
      version: main

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

ocp4_network_type: OVNKubernetes

