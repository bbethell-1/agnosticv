---
#include /includes/access-restriction-rhdp-rhoai-group.yaml
# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication # all segments
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_data_foundation
#  - ocp4_workload_machinesets
#  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_authorino
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
#  - ocp4_workload_gitea_operator
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_openshift_ai
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom
  - ocp4_workload_web_terminal

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/ritzshah/llm-rag-deployment.git
# ocp4_workload_gitops_bootstrap_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_path: helm-chart-new/unified-bootstrap-chart
ocp4_workload_gitops_bootstrap_repo_revision: update-token-v1

ocp4_workload_gitops_bootstrap_helm_values:
# Bootstrap ApplicationSet configuration for ArgoCD
# Gradio UI Configuration (shared between bootstrap and bootstrap-rag)
  gradio:
  # Application configuration
    config:
      bearerToken: "{{ granite_bearerToken }}"
      inferenceServerUrl: "https://granite-8b-code-instruct-maas-apicast-production.apps.llmaas.llmaas.redhatworkshops.io:443/v1/completions"
      modelName: "granite-8b-code-instruct-128k"
      dbConnectionString: "postgresql+psycopg://vectordb:vectordb@postgresql-service.ic-shared-llm.svc.cluster.local:5432/vectordb"
      dbCollectionName: "documents_test"
      maxNewTokens: "512"
ocp4_workload_gitops_bootstrap_health_retries: 2
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    scm_url: https://github.com/redhat-cop/agnosticd.git
