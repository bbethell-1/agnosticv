---
#include /includes/access-restriction-rhdp-rhoai-group.yaml
# --------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# --------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication # all segments
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_data_foundation
#  - ocp4_workload_machinesets
#  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_authorino
  - ocp4_workload_pipelines
  - ocp4_workload_openshift_gitops
#  - ocp4_workload_gitea_operator
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_openshift_ai
  - ocp4_workload_gitops_bootstrap
  - ocp4_workload_showroom
  - ocp4_workload_web_terminal

# -------------------------------------------------------------------
# ocp4_workload_gitops_bootstrap
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/ritzshah/llm-rag-deployment.git
# ocp4_workload_gitops_bootstrap_repo_revision: v1.0.0
ocp4_workload_gitops_bootstrap_repo_path: bootstrap-helm-chart
ocp4_workload_gitops_bootstrap_repo_revision: update-token-v1

ocp4_workload_gitops_bootstrap_helm_values:
# Bootstrap ApplicationSet configuration for ArgoCD
# Gradio UI Configuration (shared between bootstrap and bootstrap-rag)
  gradio:
  # Application configuration
    BEARER_TOKEN: 65fc80b0d55be557b1365687ddb771d6 #notsecret
    DB_COLLECTION_NAME: documents_test
    DB_CONNECTION_STRING: postgresql+psycopg://vectordb:vectordb@postgresql-service.ic-shared-llm.svc.cluster.local:5432/vectordb
    ENABLE_DEBUG_UI: 'False'
    INFERENCE_SERVER_URL: https://granite-8b-code-instruct-maas-apicast-production.apps.llmaas.llmaas.redhatworkshops.io:443/v1/completions
    MAX_NEW_TOKENS: '512'
  gradioRagEnv:
    BEARER_TOKEN: "{{ granite_bearerToken }}"
    DB_COLLECTION_NAME: documents_test
    DB_CONNECTION_STRING: postgresql+psycopg://vectordb:vectordb@postgresql-service.ic-shared-llm.svc.cluster.local:5432/vectordb
    ENABLE_DEBUG_UI: 'False'
    INFERENCE_SERVER_URL: https://granite-8b-code-instruct-maas-apicast-production.apps.llmaas.llmaas.redhatworkshops.io:443/v1/completions
    MAX_NEW_TOKENS: '512'
ocp4_workload_gitops_bootstrap_health_retries: 2
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    scm_url: https://github.com/redhat-cop/agnosticd.git
