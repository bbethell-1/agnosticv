#include /includes/catalog-icon-openshift-data-science.yaml

#include /includes/terms-of-service.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/lifetime-standard.yaml

#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-6.yaml

#include /includes/ansible_control_plane/current_controller.yaml

#include /includes/secrets/zerossl_with_letsencrypt_fallback.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# Catalog Item: Red Hat OpenShift AI 3.0 (AWS)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: ec2
env_type: ocp4-cluster
software_to_deploy: openshift4
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: "{{ gpu_instance_type }}"
master_instance_count: 1
master_storage_type: io1
master_storage_size: 1500

worker_instance_type: m6a.4xlarge
worker_instance_count: 0
worker_storage_type: gp3
worker_storage_size: 1500

bastion_instance_type: t2.small
bastion_instance_image: RHEL95GOLD-latest

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.20.0"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rhpds/rhpds.openshift-ai.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_cert_manager
  # - ocp4_workload_rhsso_authentication
  - ocp4_workload_authentication
  - ocp4_workload_nvidia_gpu_setup
  - ocp4_workload_authorino
  - ocp4_workload_pipelines
  - ocp4_workload_serverless
  - ocp4_workload_openshift_ai
  - rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
  # - rhpds.openshift_ai.ocp4_workload_openshift_ai_model_deployment

# -------------------------------------------------------------------
# ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1.18
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_starting_csv: cert-manager-operator.v1.18.0
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication
# -------------------------------------------------------------------
# ocp4_workload_rhsso_authentication_namespace: rhsso
# ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
# ocp4_workload_rhsso_authentication_channel: stable
# ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.12-opr-004
# ocp4_workload_rhsso_authentication_use_catalog_source: false
# # User
# ocp4_workload_rhsso_authentication_user_count: 1
# ocp4_workload_rhsso_authentication_env_type: "{{ env_type }}"

# ocp4_workload_rhsso_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_enable_user_info_data: false

# -------------------------------------------------------------------
# ocp4_workload_nvidia_gpu_setup
# -------------------------------------------------------------------
nfd_operator_channel: stable
nfd_operator_operand_image: "registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.19.0"
nfd_operator_starting_csv: nfd.4.20.0-202510221121
nfd_operator_use_catalog_snapshot: false

# Not implemented in the agd role.
nvidia_gpu_operator_use_catalog_snapshot: false
nvidia_gpu_operator_channel: v25.10
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v25.10.0

# -------------------------------------------------------------------
# ocp4_workload_authorino
# -------------------------------------------------------------------
ocp4_workload_authorino_operator_channel: stable
ocp4_workload_authorino_operator_use_catalog_snapshot: false
# ocp4_workload_authorino_operator_catalogsource_name: redhat-operators-snapshot-authorino
# ocp4_workload_authorino_operator_starting_csv: authorino-operator.v1.2.4

# -------------------------------------------------------------------
# ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.18
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_starting_csv: openshift-pipelines-operator-rh.v1.18.1

# -------------------------------------------------------------------
# ocp4_workload_serverless
# -------------------------------------------------------------------
ocp4_workload_serverless_channel: stable-1.36
ocp4_workload_serverless_use_catalog_snapshot: false
ocp4_workload_serverless_starting_csv: serverless-operator.v1.36.1

ocp4_workload_serverless_install_serving: false
ocp4_workload_serverless_install_eventing: false

# -------------------------------------------------------------------
# ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: fast-3.x
ocp4_workload_openshift_ai_use_catalog_snapshot: false
ocp4_workload_openshift_ai_automatic_install_plan_approval: true
ocp4_workload_openshift_ai_starting_csv: rhods-operator.3.0.0
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_kserve: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed
ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_modelregistries_namespace: rhoai-model-registries
ocp4_workload_openshift_ai_ray: Managed
ocp4_workload_openshift_ai_trustyai: Managed
ocp4_workload_openshift_ai_trainingoperator: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_feastoperator: Managed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed
ocp4_workload_openshift_ai_modelregistry_config:
  managementState: "{{ ocp4_workload_openshift_ai_modelregistry }}"
  registriesNamespace: "{{ ocp4_workload_openshift_ai_modelregistries_namespace }}"
ocp4_workload_openshift_ai_aipipelines_config:
  managementState: "{{ ocp4_workload_openshift_ai_aipipelines }}"
ocp4_workload_openshift_ai_kserve_config:
  managementState: "{{ ocp4_workload_openshift_ai_kserve }}"
ocp4_workload_openshift_ai_feastoperator_config:
  managementState: "{{ ocp4_workload_openshift_ai_feastoperator }}"
ocp4_workload_openshift_ai_llamastackoperator_config:
  managementState: "{{ ocp4_workload_openshift_ai_llamastackoperator }}"
ocp4_workload_openshift_ai_kueue_config:
  managementState: "{{ ocp4_workload_openshift_ai_kueue }}"
ocp4_workload_openshift_ai_ray_config:
  managementState: "{{ ocp4_workload_openshift_ai_ray }}"
ocp4_workload_openshift_ai_trainingoperator_config:
  managementState: "{{ ocp4_workload_openshift_ai_trainingoperator }}"
ocp4_workload_openshift_ai_trustyai_config:
  managementState: "{{ ocp4_workload_openshift_ai_trustyai }}"
ocp4_workload_openshift_ai_workbenches_config:
  managementState: "{{ ocp4_workload_openshift_ai_workbenches }}"

# -------------------------------------------------------------------
# rhpds.openshift_ai.ocp4_workload_openshift_ai_dashboard_config
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_dashboard_config_settings:
  disableTracking: false
  disableModelRegistry: false
  disableModelCatalog: false
  disableKServeMetrics: false
  genAiStudio: true
  modelAsService: true
  disableLMEval: false

ocp4_workload_openshift_ai_dashboard_config_notebook_controller:
  enabled: true
  pvcSize: 20Gi

ocp4_workload_openshift_ai_hardware_profile_gpu_identifiers:
  - defaultCount: '1'
    displayName: CPU
    identifier: cpu
    maxCount: '8'
    minCount: 1
    resourceType: CPU
  - defaultCount: 12Gi
    displayName: Memory
    identifier: memory
    maxCount: 16Gi
    minCount: 1Gi
    resourceType: Memory
  - defaultCount: 1
    displayName: GPU
    identifier: nvidia.com/gpu
    maxCount: 4
    minCount: 1
    resourceType: Accelerator

# -------------------------------------------------------------------
# rhpds.openshift_ai.ocp4_workload_openshift_ai_model_deployment
# -------------------------------------------------------------------
# ocp4_workload_openshift_ai_model_deployment_namespace: ai-bu-shared

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 5b4aa05f-6e88-4755-a5bd-392ecb333c94
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2025-04-14
    actions:
      start:
        # This is default setting
        disable: false
      stop:
        # This should let sandbox-api handle stopping
        disable: true
  sandbox_api:
    reservation: pgpu
    actions:
      start:
        # override default to let sandbox-api start and stop
        enable: true
      stop:
        # override default to let sandbox-api start and stop
        enable: true
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Red Hat Openshift AI 3.0 (AWS)"
    category: Demos
    multiuser: false
    keywords:
      - openshift ai
      - rhoai
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
    parameters:
      - name: gpu_instance_type
        description: Choose GPU instance type
        formLabel: GPU Instance Type
        required: true
        openAPIV3Schema:
          type: string
          default: g6.12xlarge
          enum:
            - g6.4xlarge
            - g6.8xlarge
            - g6.12xlarge
  tower:
    timeout: 21600
  owners:
    maintainer:
      - name: Tyrell Reddy
        email: treddy@redhat.com
