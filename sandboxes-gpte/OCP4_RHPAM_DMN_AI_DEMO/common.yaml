---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml

# Platform
platform: RHPDS

##### CONFIGS ####
#######################
env_type: ocp4-cluster
software_to_deploy: openshift4

# OpenShift Installer Version
ocp4_installer_version: 4.5.4

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: '{{ set_repositories_satellite_url }}'
satellite_org: '{{ set_repositories_satellite_org }}'
satellite_activationkey: '{{ set_repositories_satellite_activationkey }}'

# Update RHEL to the latest packages (and reboot)
update_packages: true

# --- Generic Variables
cloudformation_retries: 0
install_ipa_client: false
ignore_self_provisioners: true
install_ftl: false

# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp-workload-pam7-cc-dispute-dmn-pmml

# --- OCP Authentication
# Authentication (HT Passwd)
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: ocp_admin
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: ocp_student
admin_user: opentlc-mgr
admin_password: r3dh4t1!
# Users are user1..200
user_password: openshift
user_count: "{{ num_users }}"

## AWS instance types and deff ##
bastion_instance_image: RHEL81GOLD

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t2.medium

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: aws-ansible-2.9
  idle_after_deploy: 4
  idle_after_start: 8
  params_to_variables:
    nodecount: ''
    student_workloads: student_workloads
    infra_workloads: infra_workloads
  secrets:
  # OpenShift Pull Secret
    - ocp4_token
  # Satellite Configuration
    - satellite_ocp_on_osp_secret

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    display_name: "RHPAM 7: CC Dispute - DMN AI (PMML) Demo"
    category: Demos
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    keywords: []
    labels:
      Product: Red_Hat_Process_Automation_Manager
      #OpenShift_Version: "4.5"
      Provider: Application_Services_BU
      Product_Family: Red_Hat_Application_Services
  lifespan:
    default: 2d
    maximum: 10d
    relativeMaximum: 10d
  runtime:
    default: 6h
    maximum: 48h
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    type: agnosticd
  secrets:
    - name: ocp4-token
      namespace: gpte
    - name: satellite_ocp_on_osp_secret
      namespace: gpte
