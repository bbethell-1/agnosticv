---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: test

# -------------------------------------------------------------------
# Override OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.6.18"
cloudformation_retries: 0

# -------------------------------------------------------------------
# VM configuration (3 Node Cluster of only Masters)
# -------------------------------------------------------------------
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 3
bastion_instance_type: t2.medium
bastion_instance_image: RHEL81GOLD

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-rhpam-dmn-ai-demo-test
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: ocp4-rhpam-dmn-ai-demo-test-0.7
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite_ocp_on_osp_secret
    namespace: gpte
