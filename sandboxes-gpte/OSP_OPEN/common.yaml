---
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/demosat-rhel81.yaml

env_type: osp-sandbox
cloud_provider: osp
platform: rhpds
install_student_user: true
install_ipa_client: false
key_name: opentlc_admin_backdoor
osp_project_create: true
osp_project_name: "{{ guid }}-p"
use_dynamic_dns: true
repo_method: satellite
update_packages: true
bastion_instance_image: rhel-8.1

agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: eabfe7f0-9122-49a6-89e6-412ace37bda8
  scheduler:
    enable: true
    url: https://agnostics.apps.open.redhat.com
    endpoint: /api/v1/schedule
    data:
      uuid: "{{ uuid }}"
      cloud_selector:
        type: osp
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - rhpds-devs
      - babylon-admins
  aws_sandboxed: false
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenStack Open Environment
    category: Open_Environments
    labels:
      Product: Red_Hat_OpenStack_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    keywords:
      - OpenStack
      - RHEL
      - Open
  secrets:
    - name: tower-manifest-get
      namespace: gpte
    - name: dynamic-dns
      namespace: gpte
    - name: openstack-osp01-prod-dal10-ibm
      namespace: gpte
