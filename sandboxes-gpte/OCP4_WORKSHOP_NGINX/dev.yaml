purpose: development
ocp4_installer_version: '4.16'
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true
ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpst/nginx-rhdp-lab.git
ocp4_workload_showroom_content_git_repo_ref: main
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_cert_manager
- ocp4_workload_nginxplus
- ocp4_workload_showroom
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-10-28
      pull: missing
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
