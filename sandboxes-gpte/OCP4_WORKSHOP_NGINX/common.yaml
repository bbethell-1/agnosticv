#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/zerossl.yaml
#include /includes/catalog-icon-nginx.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel81.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/nginx-quay.yaml
#include /includes/secrets/ocp4_workload_nginxplus_license.yaml
#include /includes/parameters/showroom-ocp-defaults.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"

# Showroom
# ------------------------------------------------------
ocp4_workload_showroom_name: showroom
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_terminal_type: wetty
ocp4_workload_showroom_wetty_ssh_bastion_login: true

ocp4_workload_showroom_content_git_repo: https://github.com/redhat-gpst/nginx-rhdp-lab.git
ocp4_workload_showroom_content_git_repo_ref: main

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager
  - ocp4_workload_nginxplus
  - ocp4_workload_showroom

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 3] | max }}"
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_cert_manager_channel: stable-v1

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 03c81b3f-8aa4-4639-bd77-c84f95f25cd1
  owners:
    maintainer:
      - name: George James
        email: gjames@redhat.com
    instructions:
      - name: George James
        email: gjames@redhat.com

  anarchy:
    namespace: babylon-anarchy-3
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 NGINX Ingress Controller Workshop
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - ocp410
      - nginx
    labels:
      #OpenShift_Version: "4.10"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
