---
# -------------------------------------------------------------------
# --- Catalog: Multi-Product Demos
# --- Catalog Item: OpenShift 4 Advanced Cluster Security 3
# --- DEMO: RHACS Demo
# -------------------------------------------------------------------

platform: rhpds
purpose: development


# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  deployer:
    scm_ref: development
    scm_url: https://github.com/newgoliath/agnosticd.git
    scm_type: git
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
    - name: aws_region
    - name: student_name
  multiuser: true
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
