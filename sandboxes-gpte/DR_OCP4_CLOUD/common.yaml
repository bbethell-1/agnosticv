---
# touch for email: 2022-09-07 Wed 09:12:34 AM
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml

# -------------------------------------------------------------------
# Catalog Item: APAC 2022 SUMMIT Open Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: summit-hybrid-cloud-binder

__meta__:
  anarchy:
    namespace: babylon-anarchy-enterprise
  catalog:
    display_name: Red Hat OpenShift Disaster Recovery with ODF Demo
    category: Demos
    keywords:
    - disaster-recovery
    - odf
    - openshift-dr
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS

  # Components to include in template and catalog item
  components:
  - name: aws_hub_a
    display_name: Red Hat OpenShift Disaster Recovery with ODF Hub Cluster (ACM)
    item: sandboxes-gpte/DR_OCP4_ACM_HUB
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_primary_a
    display_name: Red Hat OpenShift Disaster Recovery with ODF Primary Cluster
    item: sandboxes-gpte/DR_OCP4_CLUSTER_PRIMARY
    propagate_provision_data:
    - var: aws_dev_a_provision_data
  - name: aws_secondary_a
    display_name: Red Hat OpenShift Disaster Recovery with ODF Secondary Cluster
    item: sandboxes-gpte/DR_OCP4_CLUSTER_SECONDARY
    propagate_provision_data:
    - var: aws_dc_a_provision_data

  access_control:
    allow_groups:
    - babylon-admins
    - babylon-devs

  # Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
