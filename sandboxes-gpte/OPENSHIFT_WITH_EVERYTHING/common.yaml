---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 3

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.10.12

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_lpe_datagrid
- ocp4_workload_lpe_3scale
- ocp4_workload_lpe_fuse
- ocp4_workload_lpe_amq_streams
- ocp4_workload_lpe_amq_broker
- ocp4_workload_lpe_amq_online
- ocp4_workload_lpe_servicemesh

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1! (autogenerated when not specified)
ocp4_workload_authentication_htpasswd_user_base: user
# ocp4_workload_authentication_htpasswd_user_password: openshift (autogenerated when not specified)
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('3') }}"
ocp4_workload_authentication_remove_kubeadmin: true

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_06_06

# --------------------------------
# Red Hat Data grid
# --------------------------------

# defaults file for ocp4_workload_lpe_datagrid
ocp4_workload_lpe_datagrid_channel: ""
ocp4_workload_lpe_datagrid_namespace: lpe-datagrid-{{ guid }}
ocp4_workload_lpe_datagrid_automatic_install_plan_approval: true
ocp4_workload_lpe_datagrid_starting_csv: ""
ocp4_workload_lpe_datagrid_wait_for_deploy: true

# --------------------------------
# Red Hat Integration - Camel k
# --------------------------------
become_override: false
# defaults file for ocp4_workload_lpe_fuse
ocp4_workload_lpe_fuse_camelk_project: lpe-fuse-camelk-{{ guid }}
ocp4_workload_lpe_fuse_camelk_integration: hello-camel-k
ocp4_workload_lpe_fuse_camelk_operator_package_name: red-hat-camel-k
ocp4_workload_lpe_fuse_camelk_operator_current_channel: ""
# ocp4_workload_lpe_fuse_camelk_current_channel: "1.6.x"
ocp4_workload_lpe_fuse_camelk_operator_current_csv: ""
# ocp4_workload_lpe_fuse_camelk_current_csv: "red-hat-camel-k-operator.v1.6.3"
#ocp4_workload_lpe_fuse_camelk_runtime: ""
ocp4_workload_lpe_fuse_camelk_runtime: 1.9.0.fuse-800042-redhat-00001

# ----------------------------------
# Red Hat Integration - Fuse console
# ----------------------------------

ocp4_workload_lpe_fuse_console_operator_package_name: fuse-console
ocp4_workload_lpe_fuse_console_operator_current_channel: ""
# ocp4_workload_lpe_fuse_console_current_channel: "7.10.x"
ocp4_workload_lpe_fuse_console_operator_current_csv: ""
# ocp4_workload_lpe_fuse_console_current_csv: "fuse-console.v7.10.2"

# ------------------------------------
# Red Hat Integration - Fuse Apicurito
# ------------------------------------

ocp4_workload_lpe_fuse_apicurito_operator_package_name: fuse-apicurito
ocp4_workload_lpe_fuse_apicurito_operator_current_channel: ""
# ocp4_workload_lpe_fuse_apicurito_current_channel: "7.10.x"
ocp4_workload_lpe_fuse_apicurito_operator_current_csv: ""
# ocp4_workload_lpe_fuse_apicurito_current_csv: "fuse-apicurito.v7.10.2"

# ----------------------------------
# Red Hat Integration - Fuse online
# ----------------------------------

ocp4_workload_lpe_fuse_online_operator_package_name: fuse-online
ocp4_workload_lpe_fuse_online_operator_current_channel: ""
# ocp4_workload_lpe_fuse_online_current_channel: "7.10.x"
ocp4_workload_lpe_fuse_online_operator_current_csv: ""
# ocp4_workload_lpe_fuse_online_current_csv: "fuse-online.v7.10.2"

ocp4_workload_lpe_fuse_project: lpe-fuse-{{ guid }}

# --------------------------------
# Red Hat Integration - AMQ Online
# --------------------------------

# Variable to configure AMQ Online operator
ocp4_workload_lpe_amq_online_channel: ""
ocp4_workload_lpe_amq_online_namespace: lpe-amq-online-{{ guid }}
ocp4_workload_lpe_amq_online_automatic_install_plan_approval: true
ocp4_workload_lpe_amq_online_starting_csv: ""
ocp4_workload_lpe_amq_online_wait_for_deploy: true

# Variable to configure AMQ Online
ocp4_workload_lpe_amq_online_space_name: "myspace"
ocp4_workload_lpe_amq_online_authservice_type: "none"
ocp4_workload_lpe_amq_online_authservice_name: "none-authservice"
ocp4_workload_lpe_amq_online_standard_infra_config_name: "default"
ocp4_workload_lpe_amq_online_address_plan_name: "standard-small-queue"
ocp4_workload_lpe_amq_online_address_plan_type: "queue"
ocp4_workload_lpe_amq_online_address_space_plan_name: "standard-small"
ocp4_workload_lpe_amq_online_address_space_plan_type: "standard"
ocp4_workload_lpe_amq_online_address_space_name: "myspace"
ocp4_workload_lpe_amq_online_address_space_type: "standard"
ocp4_workload_lpe_amq_online_address_name: "myqueue"
ocp4_workload_lpe_amq_online_address_type: "queue"
ocp4_workload_lpe_amq_online_messaging_user_name: "app"

# --------------------------------
# Red Hat Integration - AMQ Streams
# --------------------------------

# Variable to configure AMQ Streams operator
ocp4_workload_lpe_amq_streams_channel: ""
ocp4_workload_lpe_amq_streams_namespace: lpe-amq-streams-{{ guid }}
ocp4_workload_lpe_amq_streams_automatic_install_plan_approval: true
ocp4_workload_lpe_amq_streams_starting_csv: ""
ocp4_workload_lpe_amq_streams_wait_for_deploy: true

# Variable to configure AMQ Streams
ocp4_workload_lpe_amq_streams_cluster_name: "my-cluster"
ocp4_workload_lpe_amq_streams_topic_name: "my-topic"
ocp4_workload_lpe_amq_streams_topic_user: "my-user"

# --------------------------------
# Red Hat Integration - AMQ Broker
# --------------------------------

# Variable to configure AMQ Broker operator
ocp4_workload_lpe_amq_broker_channel: ""
ocp4_workload_lpe_amq_broker_namespace: lpe-amq-broker-{{ guid }}
ocp4_workload_lpe_amq_broker_automatic_install_plan_approval: true
ocp4_workload_lpe_amq_broker_starting_csv: ""
ocp4_workload_lpe_amq_broker_wait_for_deploy: true

# Variable to configure AMQ Broker
ocp4_workload_lpe_amq_broker_cluster_name: "my-cluster"
ocp4_workload_lpe_amq_broker_app_name: "myapp"
ocp4_workload_lpe_amq_broker_address_name: "myaddress"
ocp4_workload_lpe_amq_broker_queue_name: "myqueue"

# --------------------------------
# Red Hat OpenShift Service Mesh
# --------------------------------

# Installs a basic Service Mesh Control Plane
ocp4_workload_lpe_servicemesh_smcp_install: true
ocp4_workload_lpe_servicemesh_smcp_namespace: istio-system

# All operators defaults
ocp4_workload_lpe_servicemesh_channel: stable
ocp4_workload_lpe_servicemesh_starting_csv: ""
ocp4_workload_lpe_servicemesh_auto_approval: true
ocp4_workload_lpe_servicemesh_use_catalog_snapshot: false
ocp4_workload_lpe_servicemesh_catalogsource_name: redhat-operators-snapshot-servicemesh
ocp4_workload_lpe_servicemesh_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_lpe_servicemesh_catalog_snapshot_image_tag: "v4.10_2022_05_09"

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters: []
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    display_name: The Openshift with everything
    keywords:
    - Red Hat OpenShift
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
