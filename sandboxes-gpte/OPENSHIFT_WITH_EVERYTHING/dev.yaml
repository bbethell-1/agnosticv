---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Dedicated config derived from ocp4-cluster for isolationand
# -------------------------------------------------------------------
env_type: hybrid-cloud
# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: azure.azcollection
    version: 1.12.0
  - name: azure.rm
    version: 0.0.6

infra_workloads:
- ocp4_workload_rosa_cli                   # segment 1
- ocp4_workload_eksctl                     # segment 1
- ocp4_workload_le_certificates            # all segments
- ocp4_workload_authentication             # all segments
- ocp4_workload_lpe_automation_controller
- automation-controller-config
- ocp4_workload_rhacm
- ocp4_workload_rhacm_appsubs              # segment 1
- ocp4_workload_aws_info
- ocp4_workload_rhacm_cloud_credentials
#- ocp4_workload_rhacm_aws_cluster
#- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
#- ocp4_workload_mta
#- ocp4_workload_mta_tackle
#- ocp4_workload_rhods_olm
#- ocp4_workload_vscode_bastion
#- ocp4_workload_big_demo
#- ocp4_workload_object_detection_ai_ml_setup
- ocp4_workload_lpe_datagrid
- ocp4_workload_lpe_fuse
- ocp4_workload_lpe_amq_streams
- ocp4_workload_lpe_amq_broker
- ocp4_workload_lpe_amq_online
- ocp4_workload_lpe_servicemesh

ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.5.0"
ocp4_workload_rhacm_acm_channel: "release-2.5"
ocp4_workload_rhacm_acm_release: "release-2.5"

# -------------------------------------------------------------------
# ocp4_workload_acm_cloud_credentials
# -------------------------------------------------------------------
set_azr_acm_secret: true

# -------------------------------------------------------------------
# ocp4_workload_rosa_cli
# -------------------------------------------------------------------
rosa_token: "{{ gpte_rosa_token }}"
# -------------------------------------------------------------------
# automation-controller-config
# -------------------------------------------------------------------
automation_controller_credentials:
- name: hmi_nodes
  description: hmi nodes
  credential_type: Machine
  username: ec2-user
  ssh_key_data: "{{ ssh_privatekey }}"
- name: aws_credentials
  description: aws_credentials
  credential_type: "Amazon Web Services"
  username: "{{ account_user_access_key }}"
  password: "{{ account_user_secret_access_key }}"

automation_controller_projects:
- name: "edge-hmi-demo"
  description: "Edge HMI Demo"
  scm_type: git
  scm_url: https://github.com/linuxnerds/edge-hmi-demo.git

automation_controller_inventories:
- name: "hmi-dynamic-inventory"
  description: "HMI host inventory"
- name: hmi-smart-inventory
  description: HMI smart
  kind: smart
  host_filter: groups__name__icontains=tag_AnsibleGroup_hmi_nodes

automation_controller_inventory_sources:
- name: "aws_source"
  description: "aws dynamic inventory"
  inventory: "hmi-dynamic-inventory"
  credential: "aws_credentials"
  source: ec2
  source_vars:
    keyed_groups:
    - prefix: tag
      key: tags

automation_controller_jobtemplates:
- name: "1. Create HMI VM with survey for hostname"
  description: "Create HMI VM with survey for hostname"
  inventory: "Demo Inventory"
  project: edge-hmi-demo
  playbook: "ansible/provision_host_playbook.yml"
  credentials:
  - "aws_credentials"
  survey_enabled: true
  survey_spec:
    name: HMI survey
    description: HMI node survey
    spec:
    - type: text
      question_name: "Enter AWS Region"
      question_description: "Aws Region for HMI nodes"
      variable: aws_region
      required: false
      default: "us-east-2"
    - type: textarea
      question_name: "Enter HMI Nodes Hostname"
      question_description: "Aws Region for HMI nodes"
      variable: hmi_nodes
      required: false
      default: node1
- name: "2. Configure Podman to run Inductive Automation Ignition"
  description: "Configure Podman to run Inductive Automation Ignition"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/podman_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
  survey_enabled: true
  survey_spec:
    name: Podman survey
    description: Podman survey
    spec:
    - type: text
      question_name: "Enter Quay Username"
      question_description: "Quay username for podman"
      variable: podman_username
      required: false
    - type: password
      question_name: "Enter Quay Password"
      question_description: "Quay password for podman"
      variable: podman_password
      required: false
- name: "3. Deploy Kiosk Mode to HMI Devices"
  description: "Deploy Kiosk Mode to HMI Devices"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/kiosk_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
  survey_enabled: true
  survey_spec:
    name: Kiosk survey
    description: Kiosk survey
    spec:
    - type: text
      question_name: "Enter RHSM Username"
      question_description: "RHSM Username"
      variable: rhsm_username
      required: false
    - type: password
      question_name: "Enter RHSM Password"
      question_description: "RHSM password"
      variable: rhsm_password
      required: false
- name: "4. OS Hardening"
  description: "OS Hardening"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/hardening_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
- name: "5. Validate Security on HMI Devices(scheduled to report to Splunk)"
  description: "Validate Security on HMI Devices(scheduled to report to Splunk)"
  inventory: hmi-smart-inventory
  project: edge-hmi-demo
  playbook: "ansible/security_playbook.yml"
  become_enabled: true
  credentials:
  - "hmi_nodes"
automation_controller_job_workflow_templates: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_acm_aws_cluster
# -------------------------------------------------------------------
acm_aws_clusters:
- managed_cluster_name: cluster-a
  managed_cluster_region: us-west-1
  managed_cluster_label: cluster-a
- managed_cluster_name: cluster-b
  managed_cluster_region: us-west-2
  managed_cluster_label: cluster-b

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
