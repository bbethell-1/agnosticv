# -------------------------------------------------------------------
# --- Catalog Item: Demo : Generative AI with Red Hat Openshift AI
# -------------------------------------------------------------------
# Demop - Red Hat Developer Hub meets Red Hat Openshift AI

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
#bastion_instance_image: RHEL84GOLD-latest
bastion_instance_image: RHEL91GOLD-latest

# Workload variables #
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_multi_user: "{{ true if num_users | int > 1 else false }}"

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.13_2023_11_20

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
common_user_password: openshift

# ------------------------------------------------------------------
# Bastion workloads
# ------------------------------------------------------------------
software_workloads_for_bastion:
- novnc
- ms_vscode_server
- rhel-graphical

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPSPublic
    description: "HTTPS public for Let's Encrypt verification"
    from_port: 443
    to_port: 443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.13.9"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m5a.4xlarge
worker_instance_count: 3
worker_instance_type: m5a.8xlarge
openshift_machineset_aws_zones:
- "{{ instance_zone_a }}"
- "{{ instance_zone_b }}"
- "{{ instance_zone_c }}"

instance_zone_a: us-east-2a
instance_zone_b: us-east-2b
instance_zone_c: us-east-2c

gpu_instance_type: g5.2xlarge


# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: "{{ common_password }}"
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

install_ftl: false

ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: community.okd
    version: 2.3.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_le_certificates # all segments
- ocp4_workload_openshift_data_foundation
- ocp4_workload_machinesets
- ocp4_workload_nvidia_gpu_setup
- ocp4_workload_rhacm
- ocp4_workload_redhat_developer_hub_bootstrap
- ocp4_workload_trusted_artifact_signer
- ocp4_workload_pipelines
- ocp4_workload_gitops_gitlab
- ocp4_workload_sonarqube
- ocp4_workload_rhacs
- ocp4_workload_trusted_application_pipeline
- ocp4_workload_trusted_profile_analyzer
- ocp4_workload_serverless
- ocp4_workload_ossm
- ocp4_workload_openshift_ai
- ocp4_workload_web_terminal
- ocp4_workload_showroom
- ocp4_workload_oai_lab_gen_ai
- bastion_gitsign

# -------------------------------------------------------------------
# Workloads: novnc
# -------------------------------------------------------------------
novnc_proxy_port: 443

# -------------------------------------------------------------------
# Workloads: ms_vscode_server
# -------------------------------------------------------------------
ms_vscode_server_enable_autostart: false

# -------------------------------------------------------------------
# Workloads: rhel-graphical
# -------------------------------------------------------------------
install_rhel_graphical: true

# -------------------------------------------------------------------
# Workloads: bastion-gitsign
# -------------------------------------------------------------------
bastion_gitsign_rpm_url: https://github.com/sigstore/gitsign/releases/download/v0.7.1/gitsign_0.7.1_linux_amd64.rpm
bastion_gitsign_user_email: user1@opentlc.com
bastion_gitsign_user_name: user1
bastion_gitsign_fulcio_prefix: fulcio
bastion_gitsign_issuer_prefix: keycloak-keycloak-system
bastion_gitsign_rekor_prefix: rekor
bastion_gitsign_client_id: sigstore
bastion_gitsign_issuer_suffix: /auth/realms/sigstore

# -------------------------------------------------------------------
# Workload: ocp4_workload_trusted_artifact_signer
# -------------------------------------------------------------------
ocp4_workload_trusted_artifact_signer_install_repo_name: sigstore-ocp
ocp4_workload_trusted_artifact_signer_install_repo_branch: release-1.0.gamma
ocp4_workload_trusted_artifact_signer_install_repo_url: https://github.com/securesign/sigstore-ocp.git

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacs
# -------------------------------------------------------------------
ocp4_workload_rhacs_install_operator_channel: "rhacs-4.2"
ocp4_workload_rhacs_install_operator_starting_csv: "rhacs-operator.v4.2.0"
ocp4_workload_rhacs_install_operator_use_catalog_snapshot: true
ocp4_workload_rhacs_central_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhacm
# -------------------------------------------------------------------

ocp4_workload_rhacm_acm_channel: "release-2.7"
ocp4_workload_rhacm_use_catalog_snapshot: false
ocp4_workload_rhacm_catalogsource_name: redhat-operators

# -----------------------------------
# Quay Operator
# -----------------------------------
ocp4_workload_quay_operator_namespace: quay-registry
ocp4_workload_quay_operator_catalogsource_namespace: quay-registry
ocp4_workload_quay_operator_channel: stable-3.8
ocp4_workload_quay_operator_starting_csv: quay-operator.v3.8.10
ocp4_workload_quay_operator_use_catalog_snapshot: true
ocp4_workload_quay_operator_catalogsource_name: redhat-operators-snapshot-quay
ocp4_workload_quay_operator_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_quay_operator_catalog_snapshot_image_tag: v4.12_2023_07_17
ocp4_workload_quay_operator_registry_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# GitLab
# -------------------------------------------------------------------
ocp4_workload_gitops_gitlab_gitops_type: argocd
ocp4_workload_gitops_gitlab_config_email_display_name: Janus Admin
ocp4_workload_gitops_gitlab_config_email_reply_to: "noreply@redhat.com"
ocp4_workload_gitops_gitlab_config_smtp_enabled: "false"
ocp4_workload_gitops_gitlab_config_smtp_domain: "example.com"
ocp4_workload_gitops_gitlab_config_smtp_port: "587"
ocp4_workload_gitops_gitlab_config_smtp_user: "gitlab"
ocp4_workload_gitops_gitlab_config_smtp_password: "gitlab"
ocp4_workload_gitops_gitlab_config_ssh_port: "22"
ocp4_workload_gitops_gitlab_config_rootPassword: "{{ common_password }}"
ocp4_workload_gitops_gitlab_config_https: "true"
ocp4_workload_gitops_gitlab_config_root_email: "root@opentlc.com"
ocp4_workload_gitops_gitlab_config_keybase_db: "0123456789"
ocp4_workload_gitops_gitlab_config_keybase_otp: "0123456789"
ocp4_workload_gitops_gitlab_config_keybase_secret: "0123456789"

ocp4_workload_gitops_gitlab_db_user_name: gitlab
ocp4_workload_gitops_gitlab_db_password: passw0rd
ocp4_workload_gitops_gitlab_db_name: gitlab_production

ocp4_workload_gitops_gitlab_gitops_repo: https://github.com/redhat-gpte-devopsautomation/agnosticg.git

ocp4_workload_gitops_gitlab_import_repos:
- name: rhdh
  repo:
  - name: genai-llm-rag
    url: https://github.com/redhat-gpte-devopsautomation/llm-rag-rhdh-deployment.git
  - name: genai-software-templates
    url: https://github.com/redhat-gpe/genai-software-templates.git
- name: gitops
  repo:
  - name: janus-idp-gitops
    url: https://github.com/redhat-gpte-devopsautomation/janus-idp-gitops.git

ocp4_workload_gitops_gitlab_users_count: "{{ num_users | default(1) }}"
ocp4_workload_gitops_gitlab_users_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_trusted_application_pipeline
# -------------------------------------------------------------------
ocp4_workload_trusted_application_pipeline_gitlab_root_password: "{{ ocp4_workload_gitops_gitlab_config_rootPassword }}"
ocp4_workload_trusted_application_pipeline_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
ocp4_workload_trusted_application_pipeline_janus_bootstrap_repo_target_revision: main
ocp4_workload_trusted_application_pipeline_backstage_gitlab_user_create: "{{ ocp4_workload_gitops_gitlab_user_create }}"
ocp4_workload_trusted_application_pipeline_backstage_gitlab_user_username: "{{ ocp4_workload_gitops_gitlab_user_username | default(omit) }}"
ocp4_workload_trusted_application_pipeline_backstage_gitlab_user_password: "{{ ocp4_workload_gitops_gitlab_user_password }}"
ocp4_workload_trusted_application_pipeline_admin_user: admin
ocp4_workload_trusted_application_pipeline_admin_password: "{{ common_password }}"
ocp4_workload_trusted_application_pipeline_gitlab_template_locations:
- group: rhdh
  project: genai-software-templates
  branch: main
  file: showcase-templates.yaml
  rules:
    allow: Template
  templates:
  - scaffolder-templates/quarkus-stssc-template/template.yaml
- group: rhdh
  project: genai-software-templates
  branch: main
  file: org.yaml
  rules:
    allow: Group, User
  templates: []
- group: rhdh
  project: genai-software-templates
  branch: main
  file: catalogs.yaml
  rules:
    allow: Component, System, API, Resource, Location, Template
  templates: []

ocp4_workload_trusted_application_pipeline_backstage_image: quay.io/rhdh/rhdh-hub-rhel9:1.0

ocp4_workload_trusted_application_pipeline_users_count: "{{ num_users | default(1) }}"
ocp4_workload_trusted_application_pipeline_users_password: "{{ common_password }}"

ocp4_workload_trusted_application_pipeline_backstage_helm_chart_repo: https://redhat-developer.github.io/rhdh-chart
ocp4_workload_trusted_application_pipeline_backstage_helm_chart: backstage
ocp4_workload_trusted_application_pipeline_backstage_helm_chart_version: 2.15.0
ocp4_workload_trusted_application_pipeline_backstage_image_registry: quay.io
ocp4_workload_trusted_application_pipeline_backstage_image_repository: rhdh/rhdh-hub-rhel9
ocp4_workload_trusted_application_pipeline_backstage_image_tag: '1.1-97'
ocp4_workload_trusted_application_pipeline_docker_username: quayadmin
ocp4_workload_trusted_application_pipeline_docker_password: "{{ common_password }}"
ocp4_workload_trusted_application_pipeline_workshop_enabled: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git

# Workload: ocp4_workload_trusted_profile_analyzer
# -------------------------------------------------------------------
ocp4_workload_trusted_profile_analyzer_install_repo_name: trustification
ocp4_workload_trusted_profile_analyzer_install_repo_branch: demo-redhat-com-v1.0
ocp4_workload_trusted_profile_analyzer_install_repo_url: https://github.com/redhat-gpte-devopsautomation/trustification.git

ocp4_workload_trusted_profile_analyzer_admin_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_machinesets
# -------------------------------------------------------------------
ocp4_workload_machinesets_disable_default_machinesets: false
ocp4_workload_machinesets_wait_for_nodes: true

# Add a MachineSet for AWS Bare Metal instances
# To add another group of worker nodes - with autoscaling enabled add
# the following:
#
ocp4_workload_machinesets_machineset_groups:
- name: worker-gpu
  autoscale: true
  total_replicas: 2
  total_replicas_min: 2
  total_replicas_max: 3
  role: worker-gpu
  taints:
  - key: nvidia.com/gpu
    value: true
    effect: NoSchedule
  instance_type: "{{ gpu_instance_type }}"

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: openshift-nfd
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: "nfd.4.12.0-202307182142"
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""

# ------------------------------------------------
# NVIDIA GPU Operator
# ------------------------------------------------
nvidia_gpu_operator_namespace: nvidia-gpu-operator
nvidia_gpu_operator_channel: v23.6
nvidia_gpu_operator_automatic_install_plan_approval: true
nvidia_gpu_operator_starting_csv: gpu-operator-certified.v23.6.0
nvidia_gpu_operator_wait_for_deploy: true
nvidia_gpu_operator_use_catalog_snapshot: false
nvidia_gpu_operator_catalogsource_name: ""
nvidia_gpu_operator_catalog_snapshot_image: ""
nvidia_gpu_operator_catalog_snapshot_image_tag: ""

# -----------------------------------
# OpenShift Data Foundations Operator
# -----------------------------------
ocp4_workload_openshift_data_foundation_channel: stable-4.13
ocp4_workload_openshift_data_foundation_catalogsource_setup: false
ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_ceph_storage_class_name: gp3-csi
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 500Gi

# Install Ceph Toolbox
ocp4_workload_openshift_data_foundation_install_toolbox: false

# --------------------------------
# Storage Classes
# --------------------------------
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# Workload ocp4_workload_ossm - Service Mesh
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Elasticsearch
ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: ""

# Jaeger
ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: ""

# Kiali
ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: ""

# Service Mesh
ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: ""

ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.3-opr-002

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_automatic_install_plan_approval: false
ocp4_workload_openshift_ai_starting_csv: "rhods-operator.2.6.0"

# For ocp4_workload_le_certificates
# Install certificates for Ingress Controllers
ocp4_workload_le_certificates_install_certificates: true

# Install certificates for API Endpoint
ocp4_workload_le_certificates_install_api: true

# Option allow continue without certificates on failure
ocp4_workload_le_certificates_failure_is_fatal: true

# It takes about 4 minutes per API Server to
# restart with certificates (due to AWS
# Load Balancer). Therefore sleep
# 12 minutes by default to give the kube-apiserver
# cluster operator enough time to progress.
# Wait time may be extended if it's needed
ocp4_workload_le_certificates_wait_after_cert_setup: 12

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.11

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Role: ocp4_workload_oai_lab_gen_ai
# -------------------------------------------------------------------
ocp4_workload_oai_lab_gen_ai_repo_url: https://github.com/redhat-gpte-devopsautomation/llm-rag-rhdh-deployment.git

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/ritzshah/llm-rag-deployment.git

