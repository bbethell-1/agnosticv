student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ""

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 4403AA1C-37F4-4AEE-90D6-7D861BF666A9
  access_control:
    allow_groups:
    - rhpds-devs
    - rhpds-devs-rh1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      Red Hat Developer Hub meets Red Hat Openshift AI
    category: Red_Hat_One
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp413
    - ods
    - datascience
    - rhods
    - openshiftai
    - aiml
    - ocpai
    - ai
    - gpu
    - generativeai
    - rhai
    - rhoai
    - rhdh
    multiuser: true
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 1
        minimum: 1

    labels:
      Product: Red_Hat_OpenShift_Data_Science
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
  - namespace: gpte
    name: rhods-git-secret
  - namespace: gpte
    name: redhat-gpte-devhub-pull-secret
