ocp4_workload_openshift_data_foundation_catalogsource_name: redhat-operators-snapshot-odf
ocp4_workload_openshift_data_foundation_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_openshift_data_foundation_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_openshift_data_foundation_ceph_storage_class_name: gp3-csi
ocp4_workload_openshift_data_foundation_ceph_storage_osd_size: 500Gi

# Install Ceph Toolbox
ocp4_workload_openshift_data_foundation_install_toolbox: false

# --------------------------------
# Storage Classes
# --------------------------------
ocp4_workload_openshift_data_foundation_update_default_storage_class: true
ocp4_workload_openshift_data_foundation_new_default_storage_class_name: ocs-storagecluster-ceph-rbd

# -------------------------------------------------------------------
# Workload ocp4_workload_ossm - Service Mesh
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_ossm_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

# Elasticsearch
ocp4_workload_ossm_es_channel: stable
ocp4_workload_ossm_es_startingcsv: ""

# Jaeger
ocp4_workload_ossm_jaeger_channel: stable
ocp4_workload_ossm_jaeger_startingcsv: ""

# Kiali
ocp4_workload_ossm_kiali_channel: stable
ocp4_workload_ossm_kiali_startingcsv: ""

# Service Mesh
ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: ""

ocp4_workload_rhsso_starting_csv: rhsso-operator.7.6.3-opr-002

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_automatic_install_plan_approval: false
ocp4_workload_openshift_ai_starting_csv: "rhods-operator.2.6.0"

# For ocp4_workload_le_certificates
# Install certificates for Ingress Controllers
ocp4_workload_le_certificates_install_certificates: true

# Install certificates for API Endpoint
ocp4_workload_le_certificates_install_api: true

# Option allow continue without certificates on failure
ocp4_workload_le_certificates_failure_is_fatal: true

# It takes about 4 minutes per API Server to
# restart with certificates (due to AWS
# Load Balancer). Therefore sleep
# 12 minutes by default to give the kube-apiserver
# cluster operator enough time to progress.
# Wait time may be extended if it's needed
ocp4_workload_le_certificates_wait_after_cert_setup: 12

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.11

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# -------------------------------------------------------------------
# Role: ocp4_workload_oai_lab_gen_ai
# -------------------------------------------------------------------
ocp4_workload_oai_lab_gen_ai_repo_url: https://github.com/redhat-gpte-devopsautomation/llm-rag-rhdh-deployment.git

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------

ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/ritzshah/llm-rag-deployment.git

# --- Student Workloads (YAML List)
student_workloads: []

