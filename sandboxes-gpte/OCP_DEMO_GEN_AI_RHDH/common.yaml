ocp4_workload_trusted_artifact_signer_rhtas_catalogsource_image_tag: "{{ ocp4_workload_catalogsource_tag }}"
ocp4_workload_trusted_artifact_signer_rhtas_automatic_install_plan_approval: true
ocp4_workload_trusted_artifact_signer_rhtas_config:
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi

