purpose: development
ocp4_workload_showroom_content_git_repo: https://github.com/rh-aiservices-bu/insurance-claim-processing.git
ocp4_workload_showroom_content_git_repo_ref: dev
ocp4_workload_showroom_content_only: true
ocp4_workload_oai_lab_insurance_claim_branch: dev
ocp4_workload_gitops_gitlab_import_repos:
- name: rhdh
  repo:
  - name: genai-llm-rag
    url: https://github.com/redhat-gpte-devopsautomation/llm-rag-rhdh-deployment.git
  - name: genai-software-templates
    url: https://github.com/redhat-gpe/genai-software-templates.git
- name: gitops
  repo:
  - name: janus-idp-gitops
    url: https://github.com/redhat-gpte-devopsautomation/janus-idp-gitops.git
__meta__:
  deployer:
    scm_ref: development
    scm_url: https://github.com/redhat-cop/agnosticd.git
  catalog:
    parameters:
    - name: scm_ref
      description: AgnosticD SCM Reference - Supports branches, tags, commits, and forks
      formLabel: AgnosticD SCM Reference (Branch/Tag/Commit/Fork)
      required: false
      openAPIV3Schema:
        type: string
        default: development
        description: 'Git reference for AgnosticD deployment. Supports:

          • Branches: "development", "main", "feature-branch"

          • Tags: "v1.0.0", "release-2024.1"

          • Commits: "abc123def456" (full or short hash)

          • Forks: "https://github.com/yourfork/agnosticd.git#branch"

          • Custom repos: "https://gitlab.com/custom/agnosticd.git#main"'
        examples:
        - development
        - main
        - feature-aws-improvements
        - v2024.1.0
        - abc123def456
        - https://github.com/yourfork/agnosticd.git#feature-branch
        - https://gitlab.com/custom/agnosticd.git#main
        pattern: ^(https?://[^\s]+#[^\s]+|[a-zA-Z0-9._/-]+)$
