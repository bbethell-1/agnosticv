---
# Red Hat Summit Connect 2022
# Ansible Tower for Advanced Users
# Owners: Eric Lavarde elavarde@redhat.com, Goetz Rieger grieger@redhat.com, Christian Jung cjung@redhat.com, Ismail Dhaoui idhaoui@redhat.com
# CPBU: ansiblebu

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: EVENTS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
aws_region: us-east-2
env_type: ansible-automation-platform
software_to_deploy: none

# -------------------------------------------------------------------
# Lab Guide
# -------------------------------------------------------------------
lab_ui_url: https://ansible-labs-crew.github.io/ansible-controller-advanced/
#bookbag_git_repo:

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: t2.medium
tower_instance_count: 3
tower_expected_instances: 3
tower_instance_type: "t2.medium"
pgdb_instance_count: 1
subdomain_base_suffix: .example.opentlc.com
root_filesystem_size: 20
key_name: ""
vscode_server_hostname: "bastion.{{ guid }}{{ subdomain_base_suffix }}"
vscode_user_name: lab-user
pah_instance_count: 1

# Pulled from an OCP secret
tower_license_manifest:
  type: url
  url: "{{ controller_manifest.url }}"

automationcontroller_installer:
  url: "{{ controller_bundle_installer.url }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - babylon-admins
      - rhpds-devs
    view_only_groups:
      - identity-provider.summit
  aws_sandboxed: true
  catalog:
    parameters: []
    namespace: babylon-catalog-dev
    display_name: Ansible Automation Controller Advanced
    category: Workshops
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    keywords:
      - AAP2
      - Ansible
      - Automation
      - Controller
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: satellite-automation-controller-adv-ha
    - namespace: gpte
      name: ansible-tower-advanced
    - name: output-dir-s3
      namespace: gpte
