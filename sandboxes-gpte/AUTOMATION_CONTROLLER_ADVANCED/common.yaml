---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-automation-platform
software_to_deploy: none

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: false
set_repositories_satellite_ha: true
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_activationkey: rhel-9.1-ansible-2.3
# -------------------------------------------------------------------
# Lab Guide
# -------------------------------------------------------------------
lab_ui_url: https://ansible-labs-crew.gitlab.io/ansible-controller-advanced

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL91GOLD-latest
set_repositories_rhel9_lock_release: '9.1'
tower_instance_count: 3
exec_instance_count: 1
tower_expected_instances: 4  # including execution nodes!
pgdb_instance_count: 1
subdomain_base_suffix: .example.opentlc.com
root_filesystem_size: 20
key_name: ""
vscode_server_hostname: "bastion.{{ guid }}{{ subdomain_base_suffix }}"
vscode_user_name: lab-user
pah_instance_count: 1

# Pulled from an OCP secret
tower_license_manifest:
  type: url
  url: "{{ controller_manifest.url }}"

automationcontroller_installer:
  url: "{{ controller_bundle_installer.url }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Ansible Automation Controller for Advanced Users
    category: Workshops
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    keywords:
      - AAP2
      - Ansible
      - Automation
      - Controller
  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: auto-controller-adv
    - namespace: gpte
      name: ansible-tower-advanced-2
    - name: output-dir-s3
      namespace: gpte
