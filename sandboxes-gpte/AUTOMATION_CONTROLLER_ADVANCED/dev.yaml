---
#include /includes/access-restriction-summit2023-devs.yaml
purpose: development

bastion_instance_image: RHEL91GOLD-latest
set_repositories_rhel9_lock_release: '9.1'

repo_method: satellite
use_content_view: false
set_repositories_satellite_ha: true
set_repositories_satellite_url: labsat-ha.opentlc.com
set_repositories_satellite_org: Red_Hat_GPTE_Labs
set_repositories_satellite_activationkey: rhel-9.1-ansible-2.3

__meta__:
  deployer:
    scm_url: https://github.com/ansible-labs-crew/agnosticd.git
    scm_ref: summit2023
    scm_type: git
    type: agnosticd
    virtualenv: ansible2.9-python3.6-2022-07-27
  secrets:
    - namespace: gpte
      name: bookbag-deployer-na4
    - namespace: gpte
      name: auto-controller-adv
    - namespace: gpte
      name: ansible-tower-advanced-2
    - name: output-dir-s3
      namespace: gpte
