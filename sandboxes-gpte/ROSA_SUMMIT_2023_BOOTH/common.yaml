---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rosa-manual

agnosticd_open_environment: True
sandbox_user_info_messages_enable: False

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

bastion_instance_type: "t2.small"
bastion_instance_image: RHEL84GOLD-latest

common_packages_el8:
- python3
- unzip
- bash-completion
- tmux
- bind-utils
- wget
- nano
- git
- vim-enhanced
- httpd-tools
- podman
- skopeo
- buildah
- tree
- jq
- java-17-openjdk
- maven

infra_workloads:
- bookbag

# --- Student Workloads (YAML List)
student_workloads: []

host_ocp4_installer_set_user_data_kubeadmin_password: true

# ------------------------------------------------------
# Bookbag
# ------------------------------------------------------
deploy_bookbag: true
bookbag_git_repo: https://github.com/rhpds/bookbag-rosa-summit2023-booth.git
bookbag_git_version: main

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    infra_workloads: ''
    student_workloads: ''
    rosa_token: rosa_token
  idle_after_deploy: 9999
  idle_after_start: 9999

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: d2426b44-9f55-4d0b-91d9-7237962013a3
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Summit 2023 - ROSA - Booth Demo
    category: Open_Environments
    keywords: []
    labels:
      Product: Red_Hat_OpenShift_Service_on_AWS
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
      Featured_Score: '68'
    parameters:
    - name: rosa_token
      description: The ROSA Token can be created or downloaded here https://console.redhat.com/openshift/token/rosa
      formLabel: ROSA Token (RECOMMENDED)
      required: false
      openAPIV3Schema:
        type: string
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
  secrets:
  - namespace: gpte
    name: rosa-token
