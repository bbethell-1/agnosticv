ocp4_workload_redhat_developer_hub_minio_namespace: ic-shared-minio
ocp4_workload_redhat_developer_hub_minio_username: minio
ocp4_workload_redhat_developer_hub_minio_password: "{{ common_password }}"
ocp4_workload_redhat_developer_hub_minio_bucket_name: backstage-bucket

# -------------------------------------------------------------------
# Workload: ocp4_workload_redhat_developer_hub_bootstrap
# -------------------------------------------------------------------
ocp4_workload_redhat_developer_hub_bootstrap_janus_bootstrap_repo: https://github.com/redhat-gpte-devopsautomation/janus-idp-bootstrap.git
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_channel: alpha
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_catalog_setup: true
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_catalog_image: quay.io/orchestrator/orchestrator-operator-catalog
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_catalog_image_tag: v1.4.0
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_serverless_enabled: true
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_serverless_name: logic-operator-rhel8
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_serverless_starting_csv: logic-operator-rhel8.v1.35.0
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_helm_chart: https://github.com/rhdhorchestrator/orchestrator-helm-chart.git
ocp4_workload_redhat_developer_hub_bootstrap_orchestrator_workflows:
  repo: https://rhdhorchestrator.io/serverless-workflows-config
  chart:
    - name: greeting
      location: orchestrator-workflows/greeting

# --- Student Workloads (YAML List)
student_workloads: []

userdata: >-
  {
  {% for i in range(1,num_users + 1) %}
  "user{{i}}": {
    "rhdh_url": "https://backstage-backstage.apps.cluster-{{ guid }}.{{ guid }}{{ subdomain_base_suffix }}",
    "rhdh_user": "user{{i}}",
    "rhdh_user_password": "{{ common_password }}",
    "gitlab_url": "https://gitlab-gitlab.apps.cluster-{{ guid }}.{{ guid }}{{ subdomain_base_suffix }}",
    "gitlab_user": "user{{i}}",
    "gitlab_user_password": "{{ common_password }}",
    "devspaces_url": "https://devspaces.apps.cluster-{{ guid }}.{{ guid }}{{ subdomain_base_suffix }}",
    "devspaces_user": "user{{i}}",
    "devspaces_user_password": "{{ common_password }}"
    },
  {% endfor %}
  }

agnosticd_passthrough_user_data: |
  {{ {}
   | combine( {
     "users": userdata })
  }}

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 9A328C7B-76C0-4EFF-9A85-1F2EBA9293D4
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: msharma@redhat.com

  anarchy:
    namespace: babylon-anarchy-4
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    display_name: Red Hat Developer Hub Multi-user Workshop
    category: Workshops
    keywords:
      - Janus
      - project-janus
      - developer-hub
      - gitops
      - openshift
      - backstage
    parameters:
      - name: rhdh_version
        description: Version of Developer Hub
        formGroup: Features
        formLabel: Developer Hub Version
        required: false
        openAPIV3Schema:
          type: string
          default: stable
          enum:
            - stable
            - latest
        annotation: demo.redhat.com/rhdh-version
        variable: rhdh_version
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 200
        validation: >-
          num_users <= 2 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
    labels:
      Base_Component: 'False'
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
      Featured_Score: '71'
    reportingLabels:
      primaryBU: Application_Developer
      secondaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: missing
