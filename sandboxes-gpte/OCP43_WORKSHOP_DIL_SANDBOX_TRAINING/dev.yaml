---
purpose: development

ocp4_installer_version: "4.6.18"
osrelease: 4.5.0

master_instance_type: m5a.xlarge
master_instance_count: 3
worker_instance_type: m5a.4xlarge
worker_instance_count: 2
bastion_instance_type: t3a.medium

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 6
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: aws-ansible-2.9
    scm_ref: development
    type: agnosticd
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: rhte-tower
    namespace: gpte
