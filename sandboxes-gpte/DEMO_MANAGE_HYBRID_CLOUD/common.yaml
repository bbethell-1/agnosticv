---
# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO Manage Hybrid Cloud
# --- DEMO: Manage Hybrid Cloud
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL82GOLD-latest
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 3

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

install_ftl: false

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacm
- ocp4_workload_aws_info
- ocp4_workload_acm_cloud_credentials

# Common variables for ocp4_workload_acm_cloud_credentials role
ssh_privatekey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path) }}"
ssh_publickey: "{{ lookup('file',hostvars.localhost.env_authorized_key_path_pub) }}"

# AWS variables for ocp4_workload_acm_cloud_credentials role
set_aws_acm_secret: true
account_user_access_key: "{{ aws_access_key_id }}"
account_user_secret_access_key: "{{ aws_secret_access_key }}"

# Azure variables for ocp4_workload_acm_cloud_credentials role
# requester_email: "{{ email }}"
set_azr_acm_secret: true
project_tag: "{{ env_type }}-{{ guid }}"
az_function_get: "https://{{az_function_hostname}}/api/get/"
az_pool_id: "01"
azure_root_dns_zone: azure.redhatworkshops.io
azure_dns_resource_group: openenv-{{ guid }}
az_root_dns_zone: "{{ azure_root_dns_zone }}"
az_resource_group_name: "{{ azure_dns_resource_group }}"
az_service_principal:
  clientId: "{{ azapp.applications[0].app_id }}"
  clientSecret: "{{ azpass }}"
  subscriptionId: "{{ assignedsubscription.subscriptions[0].subscription_id }}"
  tenantId: "{{ azure_tenant }}"

# # Use a catalog snapshot instead of whatever the latest is
# ocp4_workload_rhacm_use_catalog_snapshot: true
# ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_acm_redhat_catalog"
# ocp4_workload_rhacm_catalog_source_tag: "v4.5_2020_09_25"

# --- Student Workloads (YAML List)
student_workloads: []

# Authentication
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_remove_kubeadmin: true
requester_email: "{{ email }}"
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  virtualenv: babylon
  params_to_variables:
    username: student_name
    region: aws_region

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
    - name: student_name
  secrets:
  - namespace: gpte
    name: gpte-sandbox
    var: aws_sandbox_manager
  - namespace: gpte
    name: satellite-rhel81
  - namespace: gpte
    name: ocp4-token
  - name: azure_redhat0
    namespace: gpte
