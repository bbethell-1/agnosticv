---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0


host_virtualenv_requirements:
- requirements_k8s.txt
- requirements_{{ cloud_provider }}.txt
- requirements_azure_demo.txt

ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.4.4"
ocp4_workload_rhacm_acm_release: "release-2.4"

set_azr_acm_secret: true
az_function_get: "https://{{az_function_hostname}}/api/get/"
az_pool_id: "01"
azure_root_dns_zone: azure.redhatworkshops.io
azure_dns_resource_group: openenv-{{ guid }}
az_root_dns_zone: "{{ azure_root_dns_zone }}"
az_resource_group_name: "{{ azure_dns_resource_group }}"
az_service_principal:
  clientId: "{{ azapp.applications[0].app_id }}"
  clientSecret: "{{ azpass }}"
  subscriptionId: "{{ assignedsubscription.subscriptions[0].subscription_id }}"
  tenantId: "{{ azure_tenant }}"
automation_controller_upload_manifest: true
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
