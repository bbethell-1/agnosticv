---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0


# host_virtualenv_requirements:
# - requirements_k8s.txt
# - requirements_{{ cloud_provider }}.txt
# - requirements_azure_demo.txt

ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.4.4"
ocp4_workload_rhacm_acm_release: "release-2.4"

set_azr_acm_secret: false
az_function_get: "https://{{az_function_hostname}}/api/get/"
az_pool_id: "01"
azure_root_dns_zone: azure.redhatworkshops.io
azure_dns_resource_group: openenv-{{ guid }}
az_root_dns_zone: "{{ azure_root_dns_zone }}"
az_resource_group_name: "{{ azure_dns_resource_group }}"
az_service_principal:
  clientId: "{{ azapp.applications[0].app_id }}"
  clientSecret: "{{ azpass }}"
  subscriptionId: "{{ assignedsubscription.subscriptions[0].subscription_id }}"
  tenantId: "{{ azure_tenant }}"

# -------------------------------------------------------------------
# ocp4_workload_lpe_automation_contoller
# -------------------------------------------------------------------
automation_controller_credentials:
- name: hmi_nodes
  description: hmi nodes
  credential_type: Machine
  username: ec2-user
  ssh_key_data: "{{ ssh_privatekey }}"
- name: aws_credentials
  description: aws_credentials
  credential_type: "Amazon Web Services"
  username: "{{ account_user_access_key }}"
  password: "{{ account_user_secret_access_key }}"

automation_controller_projects:
- name: "edge-hmi-demo"
  description: "Edge HMI Demo"
  scm_type: git
  scm_url: https://github.com/linuxnerds/edge-hmi-demo.git

automation_controller_inventories:
- name: "hmi-inventory"
  description: "HMI host inventory"

automation_controller_inventory_sources:
- name: "aws_source"
  description: "aws dynamic inventory"
  inventory: "hmi-inventory"
  credential: "aws_credentials"
  source: ec2
  # host_filter:

automation_controller_jobtemplates:
- name: "1. Create HMI VM with survey for hostname"
  description: "Create HMI VM with survey for hostname"
  inventory: hmi-inventory
  project: edge-hmi-demo
  playbook: "ansible/provision_host_playbook.yml"
  become_enabled: true
  credentials:
  - "aws_credentials"
- name: "2. Configure Podman to run Inductive Automation Ignition"
  description: "Configure Podman to run Inductive Automation Ignition"
  inventory: hmi-inventory
  project: edge-hmi-demo
  playbook: "ansible/podman_playbook.yml"
  become_enabled: true
  limit: hmi_nodes
  credentials:
  - "hmi_nodes"
- name: "3. Deploy Kiosk Mode to HMI Devices"
  description: "Deploy Kiosk Mode to HMI Devices"
  inventory: hmi-inventory
  project: edge-hmi-demo
  playbook: "ansible/kiosk_playbook.yml"
  become_enabled: true
  limit: hmi_nodes
  credentials:
  - "hmi_nodes"
- name: "OS Hardening"
  description: "OS Hardening"
  inventory: hmi-inventory
  project: edge-hmi-demo
  playbook: "ansible/hardening_playbook.yml"
  become_enabled: true
  limit: hmi_nodes
  credentials:
  - "hmi_nodes"
- name: "5. Validate Security on HMI Devices(scheduled to report to Splunk)"
  description: "Validate Security on HMI Devices(scheduled to report to Splunk)"
  inventory: hmi-inventory
  project: edge-hmi-demo
  playbook: "ansible/security_playbook.yml"
  become_enabled: true
  limit: hmi_nodes
  credentials:
  - "hmi_nodes"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  deployer:
    scm_ref: development
