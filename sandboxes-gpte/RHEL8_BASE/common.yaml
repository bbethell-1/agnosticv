---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/secrets/demosat-rhel8-base-microshift.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel8-base

# Unset key name
key_name: ""

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------
rhel8_instance_image: RHEL87GOLD-latest
rhel8_instance_type: "t3a.large"
rootfs_size_rhel8: 200

instances:
  - name: "rhel8"
    count: 1
    unique: true
    public_dns: true
    floating_ip: true
    image: "{{ rhel8_instance_image }}"
    flavor:
      ec2: "{{ rhel8_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_rhel8 }}"
    volumes:
      - device_name: "/dev/xvdb"
        size: "20"
        type: gp3
    security_groups:
      - BastionSG

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 2c04ad6c-1f4a-4f78-8fbd-6192af0532a7
  owners:
    maintainer:
      - name: Mitesh Sharma
        email: msharma@redhat.com

  anarchy:
    namespace: babylon-anarchy-7
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: RHEL 8 Base
    category: Demos
    keywords:
      - rhel
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: RHEL
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
