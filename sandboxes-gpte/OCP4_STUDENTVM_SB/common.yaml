---
# -------------------------------------------------------------------
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 Student VM
# --- ELT/ILT: Multiple
# -------------------------------------------------------------------

#include /includes/catalog-icon-cloud-native.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: studentvm
software_to_deploy: none

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
student_name: lab-user

# -------------------------------------------------------------------
# Student roles to deploy
# -------------------------------------------------------------------
studentvm_roles:
# Set up a Student User
- studentvm_user
# Customize the Student User with a Git Bash Prompt
- studentvm_bash_prompt
# Set up the OpenShift 4 CLI tools (oc, odo, helm, tkn, kn, ...)
- studentvm_ocp4
# Set up JDK and Maven
- studentvm_java_development

# -------------------------------------------------------------------
# student role: studentvm_user
# -------------------------------------------------------------------
# Install a user id "{{ student_name }}"
studentvm_user_name: "{{ student_name }}"
# Use a password for the student user.
# If false a key pair will be generated
studentvm_user_use_password: true
# If no student_password is provided a randomly generated password will be used
studentvm_user_password: ""
# This user will have sudo access
studentvm_user_enable_sudo: true

# -------------------------------------------------------------------
# student role: studentvm_ocp4
# -------------------------------------------------------------------
# Install for the current student
studentvm_ocp4_user_name: "{{ student_name }}"
studentvm_ocp4_oc_version: "{% if osrelease is version_compare('4.6.0', '>=') %}4.6{% elif osrelease is version_compare('4.5.0', '>=') and osrelease is version_compare('4.6.0', '<') %}4.5{% else %}4.4{% endif %}"
studentvm_ocp4_helm_version: '3.5.0'
studentvm_ocp4_odo_version: 'v2.0.4'
studentvm_ocp4_tkn_version: '0.15.0'
studentvm_ocp4_kn_version: '0.18.4'
studentvm_ocp4_opm_version: 'v1.16.1'
studentvm_ocp4_istioctl_version: '1.4.10'

# -------------------------------------------------------------------
# student role: studentvm_bash_prompt
# -------------------------------------------------------------------
# Install for the current student
studentvm_bash_prompt_user_name: "{{ student_name }}"

# -------------------------------------------------------------------
# student role: studentvm_java_development
# -------------------------------------------------------------------
# Install JDK 8 (default is 11)
studentvm_java_development_jdk_package: "java-1.8.0-openjdk-devel"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  aws_sandboxed: true
  catalog:
    # Only "gpte" for namespace for now
    namespace: gpte
    parameters:
    - name: osrelease
    - name: aws_region
    display_name: OpenShift 4 Student VM
    # Possible values: Labs, Workshops, Demos (plurals)
    category: Labs
    # Keywords are used to match search items.
    # Strings in name and labels already match keyword searches.
    # Searches are not case-sensitive.
    keywords:
    - lab
    - ocp4
    - openshift
    # Labels populate search filters.
    # Spaces need to be represented as underscores.
    # Label keys and values need to adhere to kubernetes standards:
    # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set
    #  * must be 63 characters or less
    #  * must begin and end with an alphanumeric character ([a-z0-9A-Z]),
    #  * can only contain dashes (-), underscores (_), dots (.), and alphanumerics between.
    labels:
      OpenShift_Version: "4.7"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: PFE
      Product_Family: Red_Hat_Cloud
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
  - name: aws-gpte
    namespace: gpte
