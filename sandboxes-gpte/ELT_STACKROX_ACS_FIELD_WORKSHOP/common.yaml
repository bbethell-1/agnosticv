---
#include /includes/aws-sandbox-meta.yaml
# --- OpenShift 4 Advanced Cluster Security Field Workshop
# --- Catalog: OpenShift 4 Labs
# --- Catalog Item: OpenShift 4 ACS Field Workshop - Hub
# --- ELT: OpenShift 4 Advanced Cluster Security Field Workshop

## This first tag has to match the CloudForms provider deploying this CI.
## It may be passed by the provider, so please make sure you are not overwriting it with this definition.
platform: labs

# The name of the agnosticd config to deploy
env_type: ocp4-cluster

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# What we use in this environment to get the packages we need
repo_method: satellite
software_to_deploy: openshift4

# OpenShift Installer Version
ocp4_installer_version: "4.6.22"

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_opentlc_production

# --- Student Workloads (YAML List)
student_workloads: []

# Authentication
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_remove_kubeadmin: true

# AgnosticV Metadata
# Set VirtualEnv to run this config in
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    nodecount: ''
    user: student_name_ignore_cf

__meta__:
  asset_uuid: 6eb42d38-1955-4a4d-80b5-6b533cfd46aa
  anarchy:
    namespace: babylon-anarchy-ocp-labs
  catalog:
    display_name: Advanced Cluster Security Field Workshop
    namespace: gpte
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - namespace: gpte
    name: gpte
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel8-latest-ha
