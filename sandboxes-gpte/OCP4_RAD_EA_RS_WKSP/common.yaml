# Service Mesh
ocp4_workload_ossm_servicemesh_channel: stable
ocp4_workload_ossm_servicemesh_startingcsv: ""

# ------------------------------------------------------------------
# Workload: ocp4_workload_rhsso
# -------------------------------------------------------------------
ocp4_workload_rhsso_namespace: rhsso
# ---------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

ocp4_workload_rhsso_authentication_namespace: rhsso
ocp4_workload_rhsso_authentication_target_namespaces: ["rhsso"]
ocp4_workload_rhsso_authentication_channel: stable
ocp4_workload_rhsso_authentication_starting_csv: rhsso-operator.7.6.9-opr-001
ocp4_workload_rhsso_authentication_catalogsource_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_rhsso_authentication_catalogsource_tag: "{{ ocp4_workload_catalogsource_tag }}"

ocp4_workload_rhsso_authentication_admin_create: true
ocp4_workload_rhsso_authentication_admin_username: admin
ocp4_workload_rhsso_authentication_admin_password: "{{ common_password }}"

ocp4_workload_rhsso_authentication_user_count: "{{ num_users | default(0) }}"
ocp4_workload_rhsso_authentication_user_name_base: user
ocp4_workload_rhsso_authentication_user_password: openshift

# -------------------------------------------------------------------
# ocp4_workload_openshift_gitops_fix_argocd
# -------------------------------------------------------------------
# Sleep 10 minutes before attempting to fix argocd dex pods
ocp4_workload_openshift_gitops_fix_argocd_delay: "10"
ocp4_workload_openshift_gitops_fix_argocd_create_namespace: false
#ocp4_workload_openshift_gitops_fix_argocd_namespace: openshift-gitops

# -------------------------------------------------------------------
# ocp4_workload_argocd_bootstrap variables
# -------------------------------------------------------------------
ocp4_workload_argocd_bootstrap_repo_list:
  - repo: https://github.com/redhat-gpte-devopsautomation/rad-model-deployment.git
    branch: dev
    bootstrap_path: bootstrap/applicationset/applicationset-bootstrap.yaml

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_deployer_chart_version: 1.3.1
ocp4_workload_showroom_content_git_repo: >-
   https://github.com/rh-rad-ai-roadshow/dev-guides.git
ocp4_workload_showroom_content_only: true
ocp4_workload_showroom_namespace: showroom

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon Meta Variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: F811B2C7-FBF5-4D37-AF89-01C302F06625
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    workshopUiDisabled: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    multiuser: true
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 40
        validation: >-
          num_users <= 2 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
    keywords:
      - workshop
      - openshift
      - ocp
      - development
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Hybrid_Platform_BU
    display_name: RAD Roadshow - Enteprise Developer
    category: Workshops
  runtime:
    default: 8h
    maximum: 48h
  tower:
    timeout: 14400
  secrets:
    - namespace: gpte
      name: rhev_dev_credentials
    - name: rhods-git-secret
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
