# -------------------------------------------------------------------
# --- System: RHDP
# --- Catalog: Demos
# --- Catalog Item: RAD Roadshow - Enteprise Developer
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: ec2

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: m5a.2xlarge
master_instance_count: 3
master_storage_type: io1
master_storage_size: 250
worker_instance_type: m6a.8xlarge
worker_instance_count: "{{ [(num_users | int / 3.0) | round(0, 'ceil') | int, 3] | max }}"
worker_storage_type: gp3
worker_storage_size: 250
bastion_instance_type: t3a.medium
bastion_instance_image: RHEL93GOLD-latest

openshift_machineset_aws_zones:
  - "{{ instance_zone_a }}"
  - "{{ instance_zone_b }}"
  - "{{ instance_zone_c }}"

instance_zone_a: us-east-2a
instance_zone_b: us-east-2b
instance_zone_c: us-east-2c

gpu_instance_type: g5.2xlarge

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
