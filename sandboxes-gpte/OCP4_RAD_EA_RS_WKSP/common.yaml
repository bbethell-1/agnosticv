    autoscale: true
    total_replicas: 5
    total_replicas_min: 5
    total_replicas_max: 5
    role: worker-gpu
    taints:
      - key: nvidia.com/gpu
        value: true
        effect: NoSchedule
    instance_type: "{{ gpu_instance_type }}"

