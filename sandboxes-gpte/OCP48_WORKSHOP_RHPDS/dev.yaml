---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# Number of VMs
# -------------------------------------------------------------------
master_instance_count: 3
worker_instance_count: 2

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

  deploy_with: babylon

  params_to_variables:
    nodecount: ''
    user: ''
    region: aws_region

__meta__:
  aws_sandboxed: true
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel81
