---

platform: rhpds
purpose: development

#master_instance_type_size: 4xlarge

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    scm_ref: development
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhacs
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_amq_streams
- ocp4_workload_codeserver
- ocp4_workload_blackhat_secured_container_pipelines

ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/redhat-gpte-devopsautomation/globex-ui.git
  name: globex-ui
  private: false
- repo: https://github.com/treddy08/secured-supply-chain-black-hat.git
  name: secured-supply-chain-black-hat
  private: false

ocp4_workload_codeserver_repos:
- name: globex-ui
  account: dev-user
  branch: main

ocp4_workload_amq_streams_channel: stable
ocp4_workload_amq_streams_use_catalog_snapshot: true
ocp4_workload_amq_streams_starting_csv: amqstreams.v2.3.0-1
ocp4_workload_amq_streams_catalogsource_name: redhat-operators-snapshot-amqstreams
ocp4_workload_amq_streams_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_amq_streams_catalog_snapshot_image_tag: v4.12_2023_02_27

requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: ansible.utils
    version: 2.7.0
