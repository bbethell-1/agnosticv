# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OpenShift 4.6 Windows
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------

ansible_user: ec2-user
remote_user: ec2-user

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------

platform: rhpds

# -------------------------------------------------------------------
# OpenShift Version Configuration
# -------------------------------------------------------------------

ocp4_installer_version: "4.19.19"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_network_type: OVNKubernetes
# For 4.6 it is required to apply a workaround during the installation when using OVNKubernetes
ocp4_network_ovn_install_workaround: true

# -------------------------------------------------------------------
#  AgnosticD playbook variables
# -------------------------------------------------------------------

ocp4_workload_windows_node_doc_image_tag: prod
bastion_instance_image: RHEL94GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
# student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------

master_instance_type_family: c6i
master_instance_type_size: >-
  {{ '4xlarge' if master_instance_count|int <= 1
  else '2xlarge' if worker_instance_count|int <= 10
  else '4xlarge' if worker_instance_count|int <= 20
  else '8xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size }}"

master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}
worker_instance_type: "m5a.4xlarge"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_windows_node
  - studentvm_ocp4
  - ocp4_workload_le_certificates

student_workloads: []

# -------------------------------------------------------------------
# Student VM / CLI Tools Configuration
# -------------------------------------------------------------------

studentvm_ocp4_oc_install: true
studentvm_ocp4_oc_version: "4.19"
studentvm_ocp4_yq_install: true
studentvm_ocp4_helm_install: true
studentvm_ocp4_tkn_install: true
studentvm_ocp4_s2i_install: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------

ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_windows_node
# -------------------------------------------------------------------

ocp4_workload_windows_node_windows_ami_filter: "Windows_Server-2019-English-Full-ContainersLatest-2023.02.15-RHDP"
ocp4_workload_windows_node_windows_ami_owner: "719622469867"

