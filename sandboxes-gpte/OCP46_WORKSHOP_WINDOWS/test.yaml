# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 2
bastion_instance_type: t2.medium
bastion_instance_image: RHEL82GOLD

# -------------------------------------------------------------------
#  AgnosticD playbook variables
# -------------------------------------------------------------------
ocp4_workload_windows_node_doc_image_tag: test
ocp4_installer_version: 4.8.11

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  sandboxed: false
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp-workshop-46-windows-test

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
    - name: student_name
  deployer:
    virtualenv: aws-ansible-2.9
    git_tag_prefix: ocp-workshop-46-windows-test
  secrets:
  - namespace: gpte
    name: ocp4_token
  - namespace: gpte
    name: satellite-rhel81
