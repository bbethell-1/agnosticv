---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: WORKSHOP AIML - Object Detect Retail
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPSPublic
    description: "HTTPS public for VSCode Server"
    from_port: 8443
    to_port: 8443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.10"
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 2
worker_instance_type: m5.4xlarge

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------

install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- ocp4_workload_rhods_olm
- ocp4_workload_gitea_operator
- ocp4_workload_pipelines
- ocp4_workload_openshift_gitops
- ocp4_workload_retail_aiml_workshop

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_htpasswd_admin_password: "{{ student_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_lpe_automation_controller
# -------------------------------------------------------------------
automation_controller_project: "ac-{{ guid }}"
automation_controller_admin_secret: "ac-{{ guid }}-secret"
automation_controller_admin_password: "{{ student_password }}"
automation_controller_upload_manifest: true
automationcontroller_manifest_url: https://www.opentlc.com/ansible-automation-platform-2-assets/automationcontroller_manifest.zip

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.0.1
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.20.0
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_gitea_volume_size: 2Gi
ocp4_workload_gitea_operator_postgresql_volume_size: 2Gi
ocp4_workload_gitea_operator_ssl_route: true
ocp4_workload_gitea_operator_gitea_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_postgresql_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_webhook_allowed_hosts_list: 'external,private'
ocp4_workload_gitea_operator_webhook_skip_tls_verify: false
install_operator_namespace: gitea-operator
install_operator_catalogsource_namespace: gitea-operator
ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_user: opentlc-mgr
ocp4_workload_gitea_operator_admin_email: opentlc-mgr@opentlc.com
ocp4_workload_gitea_operator_admin_password: openshift

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: 1
ocp4_workload_gitea_operator_generate_user_format: lab-user
ocp4_workload_gitea_operator_user_password: openshift
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
- repo: https://github.com/globex-retail/gitops.git
  name: gitops
  private: false
- repo: https://github.com/rh-aiservices-bu/arc-model
  name: arc-model
  private: false
- repo: https://github.com/ritzshah/retail-dev-gitops
  name: retail-dev-gitops
  private: false
- repo: https://github.com/ritzshah/retail-prod-gitops
  name: retail-prod-gitops
  private: false

# ---------------------------------------------------------
# Workload: OpenShift Pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.7
ocp4_workload_pipelines_tkn_version: 0.23.1
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_pipelines_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: stable
ocp4_workload_openshift_gitops_pipelines_csv_prefix: openshift-pipelines-operator-rh
ocp4_workload_openshift_gitops_use_catalog_snapshot: true
ocp4_workload_openshift_gitops_catalogsource_name: redhat-operators-snapshot-gitops
ocp4_workload_openshift_gitops_catalog_snapshot_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_openshift_gitops_catalog_snapshot_image_tag: v4.10_2022_06_06

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_olm
# -------------------------------------------------------------------
ocp4_workload_rhods_olm_install_operator_name: "rhods-operator"
ocp4_workload_rhods_olm_channel_name: "rhods-operator"
ocp4_workload_rhods_olm_operator_subscription_channel: "beta"
ocp4_workload_rhods_olm_channel: "beta"

ocp4_workload_rhods_olm_odh_namespace: "redhat-ods-operator"
ocp4_workload_rhods_olm_applications_namespace: "redhat-ods-applications"
ocp4_workload_rhods_olm_monitoring_namespace: "redhat-ods-monitoring"

ocp4_workload_rhods_olm_namespace_list:
- "{{ ocp4_workload_rhods_olm_applications_namespace }}"
- "{{ ocp4_workload_rhods_olm_monitoring_namespace }}"
- "anonymous"
- "redhat-ods-operator"
- "rhods-notebooks"

ocp4_workload_rhods_olm_catalogsource_name: "addon-managed-odh-catalog"
ocp4_workload_rhods_olm_catalogsource_namespace: "{{ ocp4_workload_rhods_olm_odh_namespace }}"
ocp4_workload_rhods_olm_catalogsource_display_name: "Managed Open Data Hub Operator"

ocp4_workload_rhods_olm_catalog_snapshot_image: "quay.io/modh/qe-catalog-source"
ocp4_workload_rhods_olm_catalog_snapshot_image_tag: "v1180-9"
ocp4_workload_rhods_olm_starting_csv: ""

# used when you are conducting a workshop
# will cause user data to be output
ocp4_workload_rhods_olm_is_workshop: false
ocp4_workload_rhods_olm_workshop_num_users: 10
ocp4_workload_rhods_olm_workshop_username_base: "user"
ocp4_workload_rhods_olm_workshop_password: "openshift"

# Variable for ocp4_workload_object_detection_ai_ml_setup
rhods_username: "admin"
ocp4_workload_aiml_namespace: "{{ rhods_username }}-rhods-project"
ocp4_workload_gitea_aiml_user: lab-user
retail_rhods_project_gitea_password: b3BlbnNoaWZ0
retail_rhods_project_gitea_username: bGFiLXVzZXI=

# ------------------------------------------------
# GitOps Deployment
# ------------------------------------------------
ocp4_workload_aiml_demo_gitops_setup: true
ocp4_workload_aiml_home_directory: "/home/ec2-user"

#Gitea user for aiml gitea route
# Webhook Secret
ocp4_workload_big_demo_gitea_webhook_secret: ""
# Length of generated secret if secret is empty
ocp4_workload_big_demo_gitea_webhook_secret_length: 12
# Gitea repository
ocp4_workload_big_demo_gitea_repo_object_detection: arc-model
ocp4_workload_big_demo_gitea_repo_object_detection_branch: main
# Base gitea route will be determined dynamically based on project and instance
ocp4_workload_big_demo_gitea_project: gitea
ocp4_workload_big_demo_gitea_instance: gitea
ocp4_workload_big_demo_gitea_user: "{{ ocp4_workload_gitea_operator_generate_user_format }}"
ocp4_workload_big_demo_gitea_user_password: "{{ ocp4_workload_gitea_operator_user_password }}"

#Gitea repo mapping to variables
ocp4_workload_gitea_repo_gitops: gitops
ocp4_workload_gitea_repo_gitops_branch: main
ocp4_workload_gitea_repo_arc_model: arc-model
ocp4_workload_gitea_repo_arc_model_branch: main
ocp4_workload_gitea_repo_retail_dev_gitops: retail-dev-gitops
ocp4_workload_gitea_repo_retail_dev_gitops_branch: main
ocp4_workload_gitea_repo_retail_prod_gitops: retail-prod-gitops
ocp4_workload_gitea_repo_retail_prod_gitops_branch: main

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 62d0031a-acb7-4576-8d19-d9163a523834
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      MLOps with Red Hat OpenShift Data Science: Retail Coupon App Workshop
    category: Demos
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp410
    - ods
    - datascience
    - rhods
    - object
    - detect
    - retail
    parameters: []
    labels:
      Product: Red_Hat_OpenShift_Data_Science
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: rhods-git-secret
