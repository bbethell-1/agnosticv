#--------------------------------------------------------------------
# Deploy Red Hat Quay on RHEL proof of concept
# Catalog Item: Red Hat Quay on RHEL poc
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: quay-rhel-poc
software_to_deploy: none
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

student_name: cloud-user
cloud_provider: ec2

# Platform
platform: labs

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: true

# -------------------------------------------------------------------
# Bookbag Variables
# -------------------------------------------------------------------
bookbag_deploy: true
bookbag_git_repo: https://github.com/redhat-gpte-devopsautomation/quay-rhel-poc

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: bec9fd69-1656-4dc4-8207-c872fb46ad3a
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Deploy Red Hat Quay on RHEL POC
    category: Labs
    keywords:
    - labs
    - rhel
    - quay
    - clairv4
    labels:
      Product: Red_Hat_Quay
      Provider: RHDP
      Product_Family: Red_Hat_Cloud
    parameters: []
