#--------------------------------------------------------------------
# Deploy Red Hat Quay on RHEL proof of concept
# Catalog Item: Red Hat Quay on RHEL poc
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: quay-rhel-poc
software_to_deploy: none
# -------------------------------------------------------------------
# End Mandatory Variables
# -------------------------------------------------------------------

student_name: cloud-user
cloud_provider: ec2

# Platform
platform: RHPDS

# If you want DNS entries to be created automatically, choose one of these.
# Alternately, they can both be set to false.
use_dynamic_dns: true

# This requires DDNS or other DNS solution configured
# If enabled, it will add DNS entries for the API and Ingress FIPs
openshift_fip_dns: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_showroom

# ------------------------------------------------------
# ocp4_workload_showroom
# ------------------------------------------------------
ocp4_workload_showroom_content_only: false
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/redhat-gpte-devopsautomation/quay-rhel-poc.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_stacked_terminals_enable: true
ocp4_workload_showroom_stacked_terminals_display_name: "Terminals"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: bec9fd69-1656-4dc4-8207-c872fb46ad3a
  owners:
    maintainer:
    - name: Niladri Roy
      email: nroy@redhat.com

  anarchy:
    namespace: babylon-anarchy-2
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Deploy Red Hat Quay on RHEL POC
    category: Labs
    keywords:
    - labs
    - rhel
    - quay
    - clairv4
    labels:
      Provider: RHDP
      Platform: OpenShift
      TDP1: Container_Management
    parameters: []
    reportingLabels:
      primaryBU: Hybrid_Platforms
    workshop_user_mode: none
