---
# Red Hat Summit 2020 - T3656Da (OCP3 Cluster) - Migrating applications from OCP/OCS 3 to OCP/OCS 4 a hands-on lab
purpose: production ## This is a cost tag, please make sure it's correct.
cloudformation_retries: 10

#lets_encrypt_production: True
#install_lets_encrypt_certificates: true

# Bastion should be deployed on Master, so commenting this line out.
# bastion_instance_type: "{{ 't2.large' if node_instance_count|int <= 10 else 't2.xlarge' }}"

master_instance_type: m5.xlarge
_infranode_instance_type: m5.4xlarge
_node_instance_type: m5.4xlarge
_node_instance_count: 1
_support_instance_type: m5.4xlarge

# To use default internal, comment-out below
nfs_server_address: "support1.{{ guid }}{{ subdomain_base_suffix }}"
support_instance_public_dns: true

instances:
  - name: "master"
    count: "{{master_instance_count}}"
    public_dns: true
    dns_loadbalancer: true
    flavor:
      ec2: "{{master_instance_type}}"
      azure: "{{master_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "masters,bastions"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_master }}"
    volumes:
      - name: docker_device
        device_name: "{{docker_device}}"
        volume_size: "{{master_docker_size|default(docker_size)|default('20')}}"
        volume_type: gp2
        purpose: docker
        lun: 0

  - name: "node"
    count: "{{node_instance_count}}"
    public_dns: false
    dns_loadbalancer: false
    flavor:
      ec2: "{{node_instance_type}}"
      azure: "{{node_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_node }}"
    volumes:
      - name: docker_device
        device_name: "{{docker_device}}"
        volume_size: "{{node_docker_size|d(docker_size)|d('100')}}"
        volume_type: gp2
        purpose: docker
        lun: 0

  - name: "infranode"
    count: "{{infranode_instance_count}}"
    public_dns: true
    dns_loadbalancer: true
    flavor:
      ec2: "{{infranode_instance_type}}"
      azure: "{{infranode_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "infranodes"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_infranode }}"
    volumes:
      - name: docker_device
        device_name: "{{docker_device}}"
        volume_size: "{{infranode_docker_size|d(docker_size)|d('50')}}"
        volume_type: gp2
        purpose: docker
        lun: 0

  - name: "support"
    count: "{{support_instance_count}}"
    public_dns: '{{ support_instance_public_dns }}'
    dns_loadbalancer: false
    flavor:
      ec2: "{{support_instance_type}}"
      azure: "{{support_instance_type}}"
    tags:
      - key: "AnsibleGroup"
        value: "{{ 'support,glusterfs,nodes' if install_glusterfs|bool else 'support' }}"
      - key: "ostype"
        value: "linux"
    rootfs_size: "{{ rootfs_size_support }}"
    volumes:
      - name: docker_device
        device_name: "{{ docker_device }}"
        volume_size: "{{support_docker_size|d(docker_size)|d('50')}}"
        volume_type: gp2
        purpose: docker
      - name: glusterfs_device_name
        enable: "{{ install_glusterfs | bool }}"
        device_name: "{{glusterfs_device_name}}"
        volume_size: "{{glusterfs_device_size}}"
        volume_type: gp2
        purpose: glusterfs
      - name: nfs_device
        enable: "{{ install_nfs | bool }}"
        device_name: "{{nfs_pvs}}"
        volume_size: "{{nfs_size}}"
        volume_type: "{{ nfs_volume_type | default('gp2') }}"
        purpose: nfs


agnosticv_meta:
  idle_after_deploy: 10
  idle_after_start: 10

__meta__:
  deployer:
    scm_ref: ocp-ocs-migration-opentlc-prod-0.2
    type: agnosticd
