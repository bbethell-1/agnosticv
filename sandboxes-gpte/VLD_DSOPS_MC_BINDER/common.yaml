---
#include /includes/catalog-icon-red-hat-standard-logo.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml

# -------------------------------------------------------------------
# --- Catalog Item: Multi Cluster DevSecOps Validated Pattern
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
cloud_provider: none
env_type: devsecops-vld-framework-binder

##Install Secured Cluster
hybrid_cloud_binder_install_secured_cluster: true

### Enable Bigdemo and AI/ML roles
hybrid_cloud_binder_setup_coolstore: false


### Multi cluster DevSecOps Pipeline
multicluster_devsecops_validated_pattern: true

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    display_name: Multi Cluster DevSecOps
    category: Demos
    keywords:
    - Multi-cluster-DevSecOps
    - devsecops
    - openshift
    - validated-pattern
    labels:
      Product: Red_Hat_Openshift_Platform_Plus
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    parameters: []
    namespace: babylon-catalog-{{ stage | default('?') }}

  # Components to include in template and catalog item
  components:
  - name: aws_hub_cluster
    display_name: Multi-cluster DevSecOps OCP4 Hub Cluster
    item: sandboxes-gpte/VLD_DSOPS_MC_OCP4_HUB_CLUSTER
    propagate_provision_data:
    - var: aws_hub_provision_data
  - name: aws_dev_cluster
    display_name: Multi-cluster DevSecOps OCP4 Dev Cluster
    item: sandboxes-gpte/VLD_DSOPS_MC_OCP4_DEV_CLUSTER
    propagate_provision_data:
    - var: aws_dev_cluster_provision_data
  - name: aws_prod_cluster
    display_name: Multi-cluster DevSecOps OCP4 Prod Cluster
    item: sandboxes-gpte/VLD_DSOPS_MC_OCP4_PROD_CLUSTER
    propagate_provision_data:
    - var: aws_prod_cluster_provision_data


# Disable actions on chained config that are handled by base.
  deployer:
    actions:
      destroy:
        disable: true
      #start:
      #  disable: true
      status:
        disable: true
      #stop:
      #  disable: true
      update:
        disable: true
