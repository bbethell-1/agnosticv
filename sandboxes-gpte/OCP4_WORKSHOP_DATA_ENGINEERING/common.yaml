---
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-name.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
# -------------------------------------------------------------------

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------
master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 4) | round(0, 'ceil') | int, 4] | max\
  \ }}"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Satellite
satellite_url: "{{ set_repositories_satellite_url }}"
satellite_org: "{{ set_repositories_satellite_org }}"
satellite_activationkey: "{{ set_repositories_satellite_activationkey }}"

# Update RHEL to the latest packages (and reboot)
update_packages: true

# Generic Vars
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false
run_janitor: false

install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------

ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift

# Create number of htpasswd users
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
- ocp4-workload-ocs-poc
- ocp4_workload_open_data_hub_olm
- ocp4-workload-rhte-analytics_data_ocp_workshop

ansible_additional_args: --skip-tags remove_self_provisioners,install_zabbix

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 Workshop Data Engineering
    category: Workshops
    keywords:
    - workshop
    - openshift
    - ocp
    - data
    - engineering
    labels:
      #OpenShift_Version: "4.7"
      Product: Red_Hat_OpenShift_Container_Platform
      Provider: Hybrid_Platform_BU
      Product_Family: Red_Hat_Cloud
    multiuser: true
    parameters:
    - name: num_users
      description: Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        default: 1
        type: integer
        minimum: 1
        maximum: 100
      validation: >-
        user_is_admin ||
        user_groups.includes('rhpds-devs') ||
        num_users == 2 ||
        check_salesforce_id(salesforce_id) ||
        Error('User count greater than one requires a valid SalesForceID.')
  deployer:
    scm_ref: development
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
