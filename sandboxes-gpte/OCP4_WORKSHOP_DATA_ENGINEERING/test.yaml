---
purpose: rhpds-development
cloudformation_retries: 0

master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 3
bastion_instance_type: t3a.medium

install_lets_encrypt_certificates: true

agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-workshop-data-engineering-test

__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
    git_tag_prefix: ocp4-workshop-data-engineering-test
