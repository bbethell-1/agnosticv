---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel81.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: 3scale Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: "4.10"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4_workload_3scale_workshop

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: cluster-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') }}"
ocp4_workload_authentication_remove_kubeadmin: true
# Always return users even with user count 1
ocp4_workload_authentication_enable_user_info_data: true
# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --- Student Workloads (YAML List)
student_workloads: []

# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
#sandbox_student_user: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false
install_lets_encrypt_certificates: true
# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 7e42370a-b526-45b6-a4a1-7be0dd2b45e8
  owners:
    maintainer:
      - name: Guilherme Camposo
        email: gcamposo@redhat.com

  anarchy:
    namespace: babylon-anarchy-0
  catalog:
    workshopUiDisabled: true
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: 3scale Workshop
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - 3scale
    labels:
      Product: Red_Hat_3scale_API_Management
      Product_Family: Red_Hat_Application_Services
      Provider: North_America_Office_of_Technology
      Use_case: Accelerate_Application_Development_and_Delivery
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 50
        validation: >-
          num_users == 1 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than TWO requires a valid SalesForceID')
    reportingLabels:
      primaryBU: Application_Developer
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.1
      pull: always
