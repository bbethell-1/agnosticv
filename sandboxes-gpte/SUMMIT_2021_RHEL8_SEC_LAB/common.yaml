---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/bookbag-shared-410.yaml

# Defend yourself with RHEL security technologies

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
#update_packages: true

# admin user for infra workloads
admin_user: admin
user: ignore_user
student_name: ec2-user

# Email is required for deployment... but really shouldn't be.
email: devops@opentlc.com

software_to_deploy: none

bastion_instance_type: t3.medium
node_instance_type: t3.medium

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-security.git

############################
# AgnosticV meta variables #
############################
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: d424450c-8766-4c4b-940d-00851e93fa54
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Defend Yourself with RHEL Security
    category: Demos
    keywords:
    - Demos
    - Defend Yourself
    - RHEL
    - Security
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
    parameters: []
  owners:
  - email: lkerner@redhat.com
    name: Lucy Kerner
  - email: lvrabec@redhat.com
    name: Lukas Vrabec
  - email: alexander@redhat.com
    name: Alex Jacocks
  - email: ggasparb@redhat.com
    name: Gabriel Becker
  - email: mhaicman@redhat.com
    name: Marek Haicman
  secrets:
  - name: guidgrabber-api
    namespace: gpte
  - name: gpte-no-repos
    namespace: gpte
  - name: satellite-rhel81-ha
    namespace: gpte
