---

#include /includes/catalog-icon-rhel.yaml

# Defend yourself with RHEL security technologies
# Owners: Lucy Kerner; lkerner@redhat.com, Lukas Vrabec: lvrabec@redhat.com ; Alex Jacocks:alexander@redhat.com; Gabriel Becker: ggasparb@redhat.com; Marek Haicman: mhaicman@redhat.com

# Platform Set to RHPDS or OPENTLC
platform: RHPDS

# https://github.com/redhat-cop/agnosticd/tree/development/ansible/configs/rhel-security
env_type: rhel-security

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

# Satellite is used for RHEL repos
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
#update_packages: true

# admin user for infra workloads
admin_user: admin
user: ignore_user
student_name: ec2-user
#student_name: lab-user
software_to_deploy: none

bastion_instance_type: t3a.medium
node_instance_type: t3a.medium

# Repository must have a build-template.yaml and deploy-template.yaml
bookbag_git_repo: https://gitlab.com/2020-summit-labs/rhel-security.git

############################
# AgnosticV meta variables #
############################
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Defend Yourself with RHEL Security
    category: Demos
    keywords:
    - Demos
    - Defend Yourself
    - RHEL
    - Security
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
    parameters:
    - name: aws_region
    - name: email
  secrets:
  - name: bookbag-deployer-na4
    namespace: gpte
  - name: guidgrabber-api
    namespace: gpte
  - name: gpte-no-repos
    namespace: gpte
  - name: satellite-security-labs
    namespace: gpte
