---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-rhel.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/secrets/bookbag-shared-410.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/lifetime-standard.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml
#include /includes/secrets/satellite-rhel9.1-lab.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml
#include /includes/ee-multicloud.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: rhel9-workshop
software_to_deploy: none
#env_type: rosa

agnosticd_open_environment: True
sandbox_user_info_messages_enable: False

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
use_content_view: true
update_all_packages: true

# -------------------------------------------------------------------
# AWS machine vars
# -------------------------------------------------------------------
workstation_instance_image: RHEL91GOLD-latest
node_instance_image: RHEL91GOLD-latest
leap_instance_image: RHEL86GOLD-latest
set_repositories_rhel8_lock_release: '8.6'
set_repositories_rhel9_lock_release: '9.1'

# -------------------------------------------------------------------
# BookBag VARS
# -------------------------------------------------------------------
bookbag_git_repo: https://github.com/xtophd/RHEL9-Workshop-Bookbag.git
bookbag_git_version: Summit_2023

# -------------------------------------------------------------------
# AWS user VARS
# -------------------------------------------------------------------
ansible_user: ec2-user
remote_user: ec2-user
key_name: ""
student_name: student
install_student_user: true
admin_user: opentlc-mgr

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon
  params_to_variables:
    user: ignore_user
    username: student_name
    region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 75cffcf2-d431-4305-859d-128be09fc6a3
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    multiuser: false
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: App Migration with RHSI
    category: Demos
    keywords:
      - rhel9
      - leap
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: TME_And_Industries_BU
      Featured_Score: '70'
    parameters: []
  secrets:
    - name: output-dir-s3
      namespace: gpte
    - namespace: gpte
      name: rosa-token
    - namespace: gpte
      name: ocp4-token
