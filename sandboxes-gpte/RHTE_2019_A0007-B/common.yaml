---
# Platform
platform: RHPDS

# Config
env_type: ocp4-workshop
software_to_deploy: none
install_ocp4: true
ocp4_installer_version: 4.3.0

# Repos
osrelease: 4.3.0
repo_version: 4.3
repo_method: file
# own_repo_path is inherited from default account settings based on osrelease

# Instance Types
bastion_instance_type: t2.medium
master_instance_count: 1
master_instance_type: m5.2xlarge
worker_instance_count: 2
worker_instance_type: m5.large

# Generic Variables
cloudformation_retries: 0
install_ipa_client: false
install_ftl: false

# Student User on Bastion
install_student_user: true
student_name: lab-user
student_password: rhte2019

# OCP Authentication
install_idm: htpasswd
admin_user: admin
admin_password: rhte2019
# Users are user1..200
user_password: rhte2019

# Workloads to deploy on the cluster
# Parameters for workloads
#_terminal_image: quay.io/gpte-devops-automation/clientvm-terminal:0.33

# Default workloads are a YAML list
default_workloads: []

# Infra and Student Workloads are comma separated strings
infra_workloads: ""
student_workloads: ""

# Override command line parameters
agnosticv_meta:
  sandboxed: true
  params_to_variables:
    user: cloudforms_user
    nodecount: ''

  nuke_sandbox: false
  virtualenv: aws-ansible-2.9

  # Idle settings
#  idle_after_deploy: 26
#  idle_after_start: 8
