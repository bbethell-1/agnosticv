---
# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: Hands-On with RHACS 3.68
# --- ELT: Hands-On with RHACS 3.68
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: labs

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# VM configuration (1 Node Cluster of m5a.4xlarge)
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD
master_instance_type_family: m5a
master_instance_type_size: 4xlarge
master_instance_count: 1
worker_instance_count: 0

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: "4.9"

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4_workload_authentication
- ocp4_workload_le_certificates
- studentvm_ocp4
- ocp4_workload_pipelines
- ocp4_workload_stackrox_central
- ocp4_workload_stackrox_sensor

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
# ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 5
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_pipelines
# -------------------------------------------------------------------
ocp4_workload_pipelines_csv_nameprefix: openshift-pipelines-operator-rh
ocp4_workload_pipelines_use_catalog_snapshot: false
ocp4_workload_pipelines_channel: stable

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
install_ftl: false

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  # What's this for?
  #  babylon:
  #    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  #params_to_variables:
  #  nodecount: ''
  #  region: aws_region

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: gpte
    parameters:
    - name: aws_region
    - name: student_name
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: ocp4_token
    namespace: gpte
