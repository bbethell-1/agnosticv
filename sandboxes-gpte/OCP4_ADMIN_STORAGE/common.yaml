---
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/student-name.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 and Container Storage for Admins(T)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------

platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------

env_type: ocp4-cluster
software_to_deploy: openshift4
install_ipa_client: false
install_student_user: true
student_name: lab-user
student_password: r3dh4t1!
admin_user: admin
admin_password: r3dh4t1!
ocp4_network_type: OVNKubernetes
ocp4_network_ovn_install_workaround: true

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------

repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.9"

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
  - ocp4-workload-workshop-admin-storage
  - ocp4-workload-enable-lets-encrypt-certificates

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  params_to_variables:
    nodecount: ''
    num_users: ''
    user: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  aws_sandboxed: true
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OCP4 and Container Storage for Admins
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
      - ocp49
    labels:
      #OpenShift_Version: "4.9"
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
    parameters:
      - name: num_users
        description: >-
         Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 100
        validation: >-
         num_users == 1 ||
         check_salesforce_id(salesforce_id) ||
         Error('User count greater than one requires a valid SalesForceID.')
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
  secrets:
    - name: satellite-rhel81
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - namespace: gpte
      name: gpte-sandbox
      var: aws_sandbox_manager
