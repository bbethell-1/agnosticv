# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 and Container Storage for Admins(T)
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
install_ipa_client: false
install_student_user: true
student_name: lab-user
student_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
admin_user: admin
admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
ocp4_network_type: OVNKubernetes
ocp4_network_ovn_install_workaround: true

# Workshop content requires AWS credentials even when not ordered as Open Environment
agnosticd_open_environment: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.12"

# -----------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4-workload-workshop-admin-storage
  - ocp4-workload-enable-lets-encrypt-certificates

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c8f0efd7-c7e0-4425-8512-353753edf836
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenShift Container Platform 4 for Admins
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Hybrid_Platform_BU
    multiuser: false
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
