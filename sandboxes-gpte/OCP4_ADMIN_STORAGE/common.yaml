---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8.6.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/parameters/cert-manager-vars.yaml
#include /includes/parameters/enable-cert-manager.yaml
#include /includes/secrets/zerossl.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshop
# --- Catalog Item: OCP4 and Container Storage for Admins(T)
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
install_ipa_client: false
install_student_user: true
student_name: lab-user
student_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
admin_user: admin
admin_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
ocp4_network_type: OVNKubernetes
ocp4_network_ovn_install_workaround: true

bastion_instance_image: RHEL93GOLD-latest
# Workshop content requires AWS credentials even when not ordered as Open Environment
agnosticd_open_environment: true

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.16.9"

# -----------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4-workload-workshop-admin-storage
  - ocp4_workload_cert_manager

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: c8f0efd7-c7e0-4425-8512-353753edf836
  owners:
    maintainer:
      - name: Josh Newsome
        email: jnewsome@redhat.com

  anarchy:
    namespace: babylon-anarchy-6
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Red Hat OpenShift Container Platform 4 for Admins
    category: Workshops
    keywords:
      - workshop
      - openshift
      - ocp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Hybrid_Platform_BU
    multiuser: false
    parameters: []
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:2024-08-08
      pull: missing
