---
purpose: production
# AWS Instances:
HOMEROOM_IMAGE: ocp4-prod
custom_image_stage: PROD
master_instance_type: m5.xlarge
worker_instance_type: m5.2xlarge
worker_instance_count: 3

# Disable ODCR and use default behavior of the ocp4 installer
agnosticd_aws_capacity_reservation_enable: false

ocp4_installer_version: "4.9"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 36
  idle_after_start: 36

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: gpte
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    type: agnosticd
    scm_ref: ocp4-workload-workshop-admin-storage-prod-0.22
