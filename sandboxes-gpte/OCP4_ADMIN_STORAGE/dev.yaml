---
#include /includes/access-restriction-devs-only.yaml

purpose: development

# -------------------------------------------------------------------
# Workload Variables
# -------------------------------------------------------------------
ocp4_workload_le_certificates_install_api: false

ocp4_installer_version: "4.14.20"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

bookbag_git_repo: https://github.com/OpenShiftDemos/openshift-ops-workshops.git
bookbag_git_version: ocp4-dev

infra_workloads:
  - ocp4-workload-workshop-admin-storage
  - ocp4-workload-enable-lets-encrypt-certificates
  - bookbag


# Disable ODCR and use default behavior of the ocp4 installer
agnosticd_aws_capacity_reservation_enable: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    #scm_url: https://github.com/OpenShiftDemos/openshift-ops-workshops
    scm_ref: development
