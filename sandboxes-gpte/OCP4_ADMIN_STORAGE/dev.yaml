purpose: development

# -------------------------------------------------------------------
# Workload Variables
# -------------------------------------------------------------------

ocp4_installer_version: "4.16"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients

HOMEROOM_IMAGE: v2.1_2024_08_27

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4-workload-workshop-admin-storage
  - ocp4_workload_cert_manager


# Disable ODCR and use default behavior of the ocp4 installer
agnosticd_aws_capacity_reservation_enable: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    #scm_url: https://github.com/OpenShiftDemos/openshift-ops-workshops
    scm_ref: development
