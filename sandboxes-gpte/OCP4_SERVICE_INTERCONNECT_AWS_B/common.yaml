---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-service-interconnect.yaml
#include /includes/lifetime-standard.yaml
# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# Changing AWS to be displayed as Azure
# Just for Cooking Show Analogy
cluster_name: "azure-{{ guid }}"

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
ocp4_installer_version: "4.12.12"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_type: m5.2xlarge
master_instance_count: 1
worker_instance_count: 0
bastion_instance_image: RHEL86GOLD-latest
student_name: lab-user
student_password: "{{ common_password }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_le_certificates
- ocp4_workload_authentication
- ocp4_workload_service_interconnect

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password: "openshift"
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_service_interconnect
# -------------------------------------------------------------------
service_interconnect_application: azure

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 3c9096ad-3bdf-48ee-9e1b-cb31a6591bfe
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Service Interconnect - AWS_B One Node OCP
    category: Demos
    multiuser: false
    keywords:
    - openshift
    - ocp
    - service-interconnect
    labels:
      Product: Red_Hat_Service_Interconnect
      Provider: RHDP
      Product_Family: Red_Hat_Application_Services
      Base_Component: 'False'
    parameters: []

  deployer:
    virtualenv: ansible2.9-python3.6-2022-07-27
  secrets:
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: satellite-rhel86-ha
  - namespace: gpte
    name: output-dir-s3
