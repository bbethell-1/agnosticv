---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/s3-rhpds-private-bucket.yaml

# ---------------------------------------------------------------------
# Mandatory Variables
# ---------------------------------------------------------------------

env_type: base-infra
cloud_provider: ec2
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# --------------------------------------------------------------------
# Platform
# --------------------------------------------------------------------

platform: RHPDS

# --------------------------------------------------------------------
# Repos and packages
# --------------------------------------------------------------------

use_content_view: true
update_packages: true      # Do you want to run a full yum update

agd_bastion_packages:

  - at
  - bash-completion
  - bind-utils
  - git
  - podman
  - buildah
  - tmux
  - vim-enhanced
  - wget

# -------------------------------------------------------------------
# Role: set-repositories
# -------------------------------------------------------------------

repo_method: satellite

# -------------------------------------------------------------------
# asset_injector_assets
# -------------------------------------------------------------------

asset_injector_assets:

  - name: Multi Tier App multi-tier-app-deployer
    src: https://github.com/tonykay/multi-tier-app-deployer.git
    dest: "/home/devops/multi-tier-app-deployer"
    type: git
    scm_ref: main
    owner: devops

  - name: AAP2 Manifest
    type: http
    dest: /home/devops/manifest_31_10_2022.zip
    src: https://d18h2xbjo1t4w8.cloudfront.net/aap2_assets/manifest_31_10_2022.zip
    url_username: "{{ s3_rhpds_private_username }}"
    url_password: "{{ s3_rhpds_private_password }}"
    owner: devops
    group: users
    mode: u=rw,g=r,o=r

  - name: AAP2 x86 Installer
    type: http
    dest: /home/devops/ansible-automation-platform-containerized-setup-bundle-2.4-1-x86_64.tar.gz
    src: >-
      https://d18h2xbjo1t4w8.cloudfront.net/aap2_assets/ansible-automation-platform-containerized-setup-bundle-2.4-1-x86_64.tar.gz
    url_username: "{{ s3_rhpds_private_username }}"
    url_password: "{{ s3_rhpds_private_password }}"
    owner: devops
    group: users
    mode: u=rw,g=r,o=r

  - name: Make ssh config
    type: 'template'
    src: ./files/ssh_config.j2
    dest: /home/devops/ssh-config
    owner: devops
    group: users
    mode: "u=r,g-rwx,o-rwx"

  - name: Multi-tier app inventory
    type: template
    src: ./files/hosts_template.j2
    dest: /home/devops/multi-tier-inventory
    owner: devops
    group: users
    mode: u=rw,g=r,o=r

  - name: Remove 50-cloud-init.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

  - name: Remove 50-redhat.conf, ssh issue
    type: remove
    path: /etc/ssh/sshd_config.d/50-redhat.conf

# -------------------------------------------------------------------
# inventory_groups (optional but nice to have)
# -------------------------------------------------------------------

inventory_groups:
  - app_frontend
  - app_backend

# -------------------------------------------------------------------
# Role: showroom
# -------------------------------------------------------------------

showroom_git_repo: "https://github.com/rhpds/showroom_rh1_aap2_containerized"
showroom_user: showroom
showroom_ui: rh1

showroom_user_password: "{{ common_password }}"
showroom_ssh_method: sshkey

showroom_tab_services:
  - double_tty
  - web1

showroom_ttys_enable_tmux: true

showroom_lab_users:
  - "{{ ansible_service_account_user_name }}"

showroom_tab_double_tty_top_username: "{{ student_name }}"
showroom_tab_double_tty_bottom_username: "{{ student_name }}"

showroom_tab_web1_url: https://docs.ansible.com
showroom_tab_web1_name: Ansible Docs

# -------------------------------------------------------------------
# Role: common
# -------------------------------------------------------------------

student_name: devops
student_password: "{{ common_password }}"

ansible_service_account_user_password: "{{ common_password }}"
ansible_service_account_user_preferred_python: "3.9"

# -------------------------------------------------------------------
# Instance Config
# -------------------------------------------------------------------

rootfs_size_rhel9: 50

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | default('unknown') }}"

default_instance_type: t3a.medium
default_instance_image: RHEL93GOLD-latest

bastion_instance_type: "{{ default_instance_type }}"
bastion_instance_image: "{{ default_instance_image }}"

aap2_rootfs_size: 200
aap2_instance_type: t3a.xlarge  # Runs AAP2 Containerized, needs 16GB etc
aap2_instance_image: "{{ default_instance_image }}"

aap2_database_instance_type: "{{ default_instance_type }}"
aap2_database_instance_image: "{{ default_instance_image }}"

  # -------------------------------------------------------------------
  # Multi-Tier App Instance Config
  # -------------------------------------------------------------------

app_frontend_instance_type: "{{ default_instance_type }}"
app_frontend_instance_image: "{{ default_instance_image }}"

app_backend_instance_type: "{{ default_instance_type }}"
app_backend_instance_image: "{{ default_instance_image }}"

instances:

  - name: bastion
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ bastion_instance_image }}"
    flavor:
      ec2: "{{ bastion_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "bastions,showroom"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_bastion | default(50)  }}"
    security_groups:
      - BastionSG
      - ShowroomSG

  - name: aap2
    count: 1
    unique: true
    public_dns: true
    dns_loadbalancer: true
    floating_ip: true
    image: "{{ aap2_instance_image }}"
    flavor:
      ec2: "{{ aap2_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "aap2"
      - key: "ostype"
        value: "linux"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    rootfs_size: "{{ rootfs_size_controller | default(50)  }}"
    security_groups:
      - BastionSG
      - AAP2SG

  - name: aap2-database
    count: 1
    unique: true
    public_dns: false
    image: "{{ aap2_database_instance_image }}"
    flavor:
      ec2: "{{ aap2_database_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "aap2_database"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - HostSG

  - name: app-frontend
    # TODO: 1 or more? Validate count: "{{ app_instance_count | default(2) }}"
    count: 1
    unique: true
    public_dns: false
    image: "{{ app_frontend_instance_image }}"
    flavor:
      ec2: "{{ app_frontend_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "app_frontend"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - HostSG

  - name: app-backend
    count: 1
    unique: true
    public_dns: false
    image: "{{ app_backend_instance_image }}"
    flavor:
      ec2: "{{ app_backend_instance_type }}"
    tags:
      - key: "AnsibleGroup"
        value: "app_backend"
      - key: "ostype"
        value: "rhel"
      - key: "instance_filter"
        value: "{{ env_type }}-{{ email }}"
    security_groups:
      - DefaultSG
      - HostSG

# -------------------------------------------------------------------
# Security Group Config
# -------------------------------------------------------------------

security_groups:

  - name: FrontendSG
    rules:
      - name: FrontHTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: WebSG
    rules:
      - name: HTTPPorts
        description: "HTTP Public"
        from_port: 80
        to_port: 80
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: HTTPSPorts
        description: "HTTP Public"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: HostSG
    rules:
      - name: FromHostSG
        description: "Allow everything from HostSG nodes"
        from_port: 0
        to_port: 65535
        protocol: -1
        from_group: HostSG
        rule_type: Ingress

  - name: ShowroomSG
    rules:
      - name: ShowroomHTTPS
        description: "Primary showroom endpoint - for reverse proxy"
        from_port: 443
        to_port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

  - name: AAP2SG
    rules:

      - name: AAP2HTTP
        description: "AAP2 HTTP endpoints for Controller, Hub, EDA"
        from_port: 80
        to_port: 83
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

      - name: AAP2HTTPS
        description: "AAP2 HTTPS endpoints for Controller, Hub, EDA"
        from_port: 443
        to_port: 446
        protocol: tcp
        cidr: "0.0.0.0/0"
        rule_type: Ingress

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: A5D00916-788F-4CE2-9DA9-AB1CF5DABF00
  access_control:
    allow_groups:
      - rhpds-devs
      - rhpds-devs-rh1
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Containerized Ansible Automation Platform 2"
    category: Red_Hat_One
    keywords:
      - ansible
      - aap2
      - rh1
    labels:
      Product: Red_Hat_Enterprise_Linux
      Product_Family: Red_Hat_Enterprise_Linux
      Provider: RHDP
    multiuser: false
    parameters: []
  secrets:
    - name: satellite-rhel-8-and-9-latest-ha
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
