---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-aap.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ansible-automation-platform
software_to_deploy: openshift4
ocp4_installer_version: "4.11"

lab_ui_url: empty

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_image: RHEL84GOLD-latest
bastion_instance_type: t2.medium
tower_instance_count: 3
tower_expected_instances: 3
tower_instance_type: "t2.medium"
pgdb_instance_count: 1
subdomain_base_suffix: .example.opentlc.com
root_filesystem_size: 20
key_name: ""
vscode_server_hostname: "bastion.{{ guid }}{{ subdomain_base_suffix }}"
vscode_user_name: lab-user
pah_instance_count: 1

# Pulled from an OCP secret
tower_license_manifest:
  type: url
  url: "{{ controller_manifest.url }}"

automationcontroller_installer:
  url: "{{ controller_bundle_installer.url }}"

# -------------------------------------------------------------------
# AWS Specific
# -------------------------------------------------------------------
master_instance_type_family: m5
master_instance_type_size: >-
  {{ 'xlarge' if worker_instance_count|int <= 10
  else '2xlarge' if worker_instance_count|int <= 20
  else '4xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"

master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: "m5.4xlarge"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"

worker_storage_type: gp3

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_project_request_template
  - ocp4_workload_opentlc_production
  - ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_opentlc_production
# -------------------------------------------------------------------
ocp4_workload_opentlc_production_remove_self_provisioner: false

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  access_control:
    allow_groups:
      - redhat-ansible-eda
      - babylon-admins
  aws_sandboxed: true
  catalog:
    multiuser: false
    parameters:
      - name: num_users
        description: >-
          Number of Attendees
        formLabel: User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 100
          formHideCondition: true == true
      - name: aws_region
        description: AWS Region to Provision Environment.
        formLabel: Region
        required: true
        openAPIV3Schema:
          type: string
          default: us-east-2
          enum:
            - us-east-2
            - ap-southeast-1
            - eu-central-1
            - eu-west-1
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Event Driven Ansible
    category: Demos
    labels:
      Product: Red_Hat_Ansible_Automation_Platform
      Product_Family: Red_Hat_Automation
      Provider: Ansible_BU
    keywords:
      - AAP2
      - Ansible
      - Automation
      - Controller
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: satellite-automation-controller-adv-ha
      namespace: gpte
    - name: ansible-tower-advanced
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
    - name: ocp4-token
      namespace: gpte
