---
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/aws-regions-standard.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml

#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/rosa_token.yaml
#include /includes/secrets/ocp4_token.yaml

#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-aws.yaml
#include /includes/terms-of-service.yaml
#include /includes/runtime-unlimited.yaml
#include /includes/access-restriction-cloud-ssa.yaml

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
platform: rhpds

env_type: rosa-consolidated

agnosticd_open_environment: true
sandbox_user_info_messages_enable: false
agnosticd_collect_forensics: false

bastion_instance_type: "t3a.small"
bastion_instance_image: RHEL96GOLD-latest
bastion_remove_insights_motd: true
bastion_custom_motd: |-
  ---------------------------------------------------------------------------
          Welcome to the AI Workshop on ROSA lab environment!
  ---------------------------------------------------------------------------

  By continuing to use this service you agree to use this environment
  solely for the purposes of completing the steps in the lab guide.

  Any other use is a violation of this service and appropriate action
  will be taken. If you disagree with these terms you must disconnect now.
  ----------------------------------------------------------------------------

# ------------------------------------------------------
# ROSA
# ------------------------------------------------------
rosa_deploy: true
rosa_deploy_hcp: true
rosa_setup_cluster_admin: true
rosa_setup_cluster_admin_login: true
rosa_installer_version: latest
# ROSA Version can be "default", "latest", "latest-upgrade", or semantic version
# Value controlled by catalog parameter below.
rosa_version: latest-upgrade
# Make sure to set the base to a version that actually has an upgrade available
# Check with `rosa list versions -o json` and make sure there is one with available_upgrades set
rosa_version_base: openshift-v4.20
rosa_compute_machine_type: m6a.4xlarge
rosa_compute_replicas: "{{ [((num_users | int * 0.3) | round(0, 'ceil') | int) + 4, 5] | max }}"
rosa_compute_worker_disk_size: 512Gi
# billing account for HCP
aws_billing_account_id: "017310218799"

# ------------------------------------------------------
# Workload variables
# ------------------------------------------------------
ocp4_workload_user_base: user
ocp4_workload_user_count: "{{ num_users }}"
ocp4_workload_multi_user: "{{ true if num_users | int > 1 else false }}"

# -------------------------------------------------------------------
# Bastion
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true
common_extra_packages:
  - java-17-openjdk-devel
  - tzdata-java
  - maven
  - postgresql
  - httpd-tools

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
    - name: https://github.com/rh-mobb/ai-on-rosa-workshop-ansible.git
      type: git
      version: main

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------

infra_workloads:
  - ocp4_workload_authentication_rosa
  - ocp4_workload_pipelines
  - ocp4_workload_serverless
  - ocp4_workload_ossm
  - ocp4_workload_openshift_gitops
  - ocp4_workload_gitea_operator
  - ocp4_workload_openshift_ai
  - ocp4_workload_web_terminal
  - ocp4_workload_showroom
  - ocp4_workload_oai_lab_insurance_claim
  - rosa_parasol.workshop.ocp4_workload_rosa_parasol_bedrock

# -------------------------------------------------------------------
# ocp4_workload_authentication_rosa
# -------------------------------------------------------------------
ocp4_workload_authentication_rosa_user_count: "{{ num_users }}"
ocp4_workload_authentication_rosa_user_base: user
ocp4_workload_authentication_rosa_user_password: ""
ocp4_workload_authentication_rosa_admin_user: admin
ocp4_workload_authentication_rosa_admin_password: ""
ocp4_workload_authentication_rosa_token: "{{ rosa_token }}"
ocp4_workload_authentication_rosa_aws_access_key_id: "{{ lookup('env','AWS_ACCESS_KEY_ID') | default(aws_access_key_id, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_secret_access_key: "{{ lookup('env','AWS_SECRET_ACCESS_KEY') | default(aws_secret_access_key, true) | mandatory }}"
ocp4_workload_authentication_rosa_aws_region: "{{ aws_region }}"

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.17
ocp4_workload_pipelines_use_catalog_snapshot: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_serverless
# -------------------------------------------------------------------

ocp4_workload_serverless_channel: stable
ocp4_workload_serverless_use_catalog_snapshot: false
ocp4_workload_serverless_install_eventing: false
ocp4_workload_serverless_install_serving: false

# -------------------------------------------------------------------
# Workload ocp4_workload_ossm - Service Mesh
# -------------------------------------------------------------------
ocp4_workload_ossm_catalogsource_setup: false
ocp4_workload_ossm_servicemesh_channel: stable

# Elasticsearch
ocp4_workload_ossm_es: false
# Jaeger
ocp4_workload_ossm_jaeger: false
# Kiali
ocp4_workload_ossm_kiali: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_gitops
# -------------------------------------------------------------------
ocp4_workload_openshift_gitops_channel: gitops-1.17
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_resources: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_controller_update: true
ocp4_workload_openshift_gitops_controller_requests_cpu: "2"
ocp4_workload_openshift_gitops_controller_requests_memory: 4Gi
ocp4_workload_openshift_gitops_controller_limits_cpu: "4"
ocp4_workload_openshift_gitops_controller_limits_memory: 4Gi

ocp4_workload_openshift_gitops_repo_update: true
ocp4_workload_openshift_gitops_repo_requests_cpu: 500m
ocp4_workload_openshift_gitops_repo_requests_memory: 512Mi
ocp4_workload_openshift_gitops_repo_limits_cpu: "2"
ocp4_workload_openshift_gitops_repo_limits_memory: 2Gi

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, {{ ocp4_workload_authentication_rosa_admin_user }}, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_ignore_differences: |
  resourceIdentifiers:
  - group: jaegertracing.io
    kind: Jaeger
    customization:
      jsonPointers:
      - /spec/strategy
  - group: apps
    kind: Deployment
    customization:
      jqPathExpressions:
      - .spec.template.spec.containers[] | select(.name == "redis")

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitea_operator
# -------------------------------------------------------------------
ocp4_workload_gitea_operator_project: gitea
ocp4_workload_gitea_operator_catalog_image_tag: v2.1.0
ocp4_workload_gitea_operator_starting_csv: gitea-operator.v2.1.0
ocp4_workload_gitea_operator_catalog_image: quay.io/rhpds/gitea-catalog

ocp4_workload_gitea_operator_deploy_gitea_instance: true
ocp4_workload_gitea_operator_gitea_image: quay.io/rhpds/gitea
ocp4_workload_gitea_operator_gitea_image_tag: 1.21.11
ocp4_workload_gitea_operator_name: gitea
ocp4_workload_gitea_operator_gitea_hostname: gitea
ocp4_workload_gitea_operator_ssl_route: true
ocp4_workload_gitea_operator_gitea_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_postgresql_image_pull_policy: IfNotPresent
ocp4_workload_gitea_operator_webhook_allowed_hosts_list: 'external,private'
ocp4_workload_gitea_operator_webhook_skip_tls_verify: false
#install_operator_namespace: gitea-operator
#install_operator_catalogsource_namespace: gitea-operator
ocp4_workload_gitea_operator_disable_registration: false
ocp4_workload_gitea_operator_enable_captcha: false
ocp4_workload_gitea_operator_allow_create_organization: true
ocp4_workload_gitea_operator_register_email_confirm: false
ocp4_workload_gitea_operator_enable_notify_email: false
ocp4_workload_gitea_operator_mailer_enabled: false

ocp4_workload_gitea_operator_create_admin: true
ocp4_workload_gitea_operator_admin_password: ""

# PVC size for Gitea, empty storage class uses default storage class
ocp4_workload_gitea_operator_gitea_volume_size: 10Gi
ocp4_workload_gitea_operator_gitea_volume_storage_class: ''

# PVC size for PostgreSQL, empty storage class uses default storage class
ocp4_workload_gitea_operator_postgresql_volume_size: 10Gi
ocp4_workload_gitea_operator_postgresql_volume_storage_class: ''

ocp4_workload_gitea_operator_create_users: true
ocp4_workload_gitea_operator_user_number: "{{ num_users | int }}"
ocp4_workload_gitea_operator_generate_user_format: "{{ ocp4_workload_authentication_rosa_user_base }}%d"
ocp4_workload_gitea_operator_user_password: ""
ocp4_workload_gitea_operator_migrate_repositories: true
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/paulczar/parasol-insurance.git
    name: parasol-insurance
    private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_openshift_ai
# -------------------------------------------------------------------
ocp4_workload_openshift_ai_channel: "stable-2.19"
ocp4_workload_openshift_ai_catalogsource_setup: false
ocp4_workload_openshift_ai_kserve: "Managed"

# -------------------------------------------------------------------
# Role: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_content_git_repo: >-
  https://github.com/rh-mobb/ai-on-rosa-workshop
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_content_only: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_oai_lab_insurance_claim
# -------------------------------------------------------------------
ocp4_workload_oai_lab_insurance_claim_repo_url: https://github.com/rh-mobb/ai-on-rosa-workshop
ocp4_workload_oai_lab_insurance_claim_branch: main

# ------------------------------------------------------
# agnosticd_user_info Messages
# ------------------------------------------------------
# print_agnosticd_user_info: false

__meta__:
  asset_uuid: e14316d2-d76f-4a7f-97a3-51dccd101ec3
  owners:
    maintainer:
      - name: Wolfgang Kulhanek
        email: wkulhane@redhat.com
    sme:
      - name: Philipp Bergsmann
        email: pbergsma@redhat.com
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    reservation: bedrock
    actions:
      start:
        enable: false
      stop:
        enable: false
      destroy:
        catch_all: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Parasol Insurance AI Workshop on ROSA (AWS)
    category: Labs
    keywords:
      - rosa
      - parasol
      - rhoai
      - insurance-claim
    multiuser: true
    workshopLabUiRedirect: true
    labels:
      Provider: RHDP
      Platform: AI
      TDP1: AI_Platform
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
          maximum: 30
    reportingLabels:
      primaryBU: Artificial_Intelligence
