__meta__:
  asset_uuid: e14316d2-d76f-4a7f-97a3-51dccd101ec3
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    actions:
      start:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  sandbox_api:
    actions:
      start:
        enable: false
      stop:
        enable: false
      destroy:
        catch_all: false
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: Parasol Insurance AI Workshop on ROSA
    category: Labs
    keywords:
      - openshift ai
      - rosa
    labels:
      Product: Red_Hat_OpenShift_AI
      Provider: RHDP
      Product_Family: Red_Hat_AI
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 2
          minimum: 2
    reportingLabels:
      primaryBU: Artificial_Intelligence
      secondaryBU: Hybrid_Platforms
