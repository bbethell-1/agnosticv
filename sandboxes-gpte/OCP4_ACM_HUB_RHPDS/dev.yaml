---
# Why is this config being deployed?
# This is a cost tag, please make sure it's correct.
# Some valid: development, ilt, production, event
purpose: development

master_instance_type: m5a.2xlarge
master_instance_count: 1
worker_instance_type: m5a.4xlarge
worker_instance_count: 2
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD

update_packages: false

# OpenShift Installer Version
ocp4_installer_version: "4.11.28"

ocp4_workload_rhacm_use_catalog_snapshot: false
ocp4_workload_rhacm_catalog_source_image: "quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog"
ocp4_workload_rhacm_catalog_source_tag: "v4.11_2023_02_27"
ocp4_workload_rhacm_acm_csv: "advanced-cluster-management.v2.7"
ocp4_workload_rhacm_acm_channel: "release-2.7"
ocp4_workload_rhacm_acm_release: "release-2.7"

__meta__:
  deployer:
    scm_ref: development

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
