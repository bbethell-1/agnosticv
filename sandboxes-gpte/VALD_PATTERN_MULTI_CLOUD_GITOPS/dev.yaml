---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development
# Overriding variables for development
ocp4_workload_gitea_operator_repositories_list:
  - repo: https://github.com/hybrid-cloud-patterns/multicloud-gitops.git
    name: multicloud-gitops
    private: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_validated_pattern
# -------------------------------------------------------------------
ocp4_workload_validated_pattern_name: multicloud-gitops
ocp4_workload_validated_pattern_display_name: MultiCloud Gitops
ocp4_workload_validated_pattern_repository_name: multicloud-gitops
ocp4_workload_validated_pattern_repository_tag: "main"
ocp4_workload_validated_pattern_s3_bucket_create: false
ocp4_workload_validated_pattern_s3_bucket_region: "{{ aws_region }}"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: development
  agnosticd_git_repo: https://github.com/claudiol/agnosticd.git

__meta__:
  deployer:
    scm_ref: development
    scm_url: https://github.com/claudiol/agnosticd.git
