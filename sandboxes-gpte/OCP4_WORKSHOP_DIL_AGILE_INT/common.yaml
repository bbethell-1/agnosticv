---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/open-environment-annotation.yaml

# -------------------------------------------------------------------
# --- Catalog: Workshops
# --- Catalog Item: OCP4 DIL Agile Integration Workshop
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
bastion_instance_image: RHEL82GOLD-latest

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_use_dev_preview: false
ocp4_installer_version: 4.9.22

# -------------------------------------------------------------------
# Worker Instance Count
# -------------------------------------------------------------------
master_instance_type_family: m5
master_instance_type_size: >-
  {{ 'xlarge' if worker_instance_count|int <= 10
  else '2xlarge' if worker_instance_count|int <= 20
  else '4xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"
master_instance_count: 3
master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp2' }}
worker_instance_type: "m5.4xlarge"
worker_instance_count: "{{ [(num_users | int / 3) | round(0, 'ceil') | int, 5] | max\
  \ }}"
worker_storage_type: "gp2"

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_le_certificates
  - ocp4-workload-dil-agile-integration

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# --- Student User on Bastion
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: opentlc-mgr
ocp4_workload_authentication_htpasswd_admin_password: r3dh4t1!
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('3')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true
ocp4_workload_dil_agile_integration_num_users: 2

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  params_to_variables:
    username: student_name
    nodecount: worker_instance_count
  deploy_with: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-ocp-wksp
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords: []
    labels:
      Provider: Cloud_Services_BU
      Product: Red_Hat_Fuse_Online
      Product_Family: Red_Hat_Application_Services
      #OpenShift_Version: '4.6'
    multiuser: true
    parameters:
      - name: num_users
        description: >-
          Number of users to provision within the cluster.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 3
          minimum: 3
          maximum: 100
        validation: >-
          num_users == 3 ||
          user_is_admin ||
          user_groups.includes('rhpds-devs') ||
          check_salesforce_id(salesforce_id) ||
          Error('User count greater than one requires a valid SalesForceID.')
    display_name: DIL Agile Integration
    category: Workshops
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
    - name: satellite-rhel81-ha
      namespace: gpte
    - name: ocp4_token
      namespace: gpte
    - name: output-dir-s3
      namespace: gpte
