---
platform: rhpds
purpose: development
cloudformation_retries: 0

master_instance_type: c5d.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 4

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: wdc
        purpose: development
  deployer:
    scm_url: https://github.com/satyaj/agnosticd.git
    scm_type: git
    scm_ref: development
    type: agnosticd
