---
platform: rhpds
purpose: production

master_instance_type: c5d.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: 4

agnosticv_meta:
  idle_after_deploy: 9
  idle_after_start: 9

__meta__:
  scheduler:
    enable: true
    data:
      # Clusters having those labels will be picked first.
      cloud_preference:
        datacenter: dal
        purpose: production
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    type: agnosticd
    scm_ref: ocp4-dil-agile-prod-0.1
