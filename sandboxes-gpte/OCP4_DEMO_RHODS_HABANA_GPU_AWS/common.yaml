---
#include /includes/aws-sandbox-meta.yaml
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-nvidia.yaml
#include /includes/catalog-icon-openshift-data-science.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/agnosticd_save_output_dir_s3.yaml

# -------------------------------------------------------------------
# --- Catalog: Development
# --- Catalog Item: DEMO : RHODS on OCP on AWS with NVIDIA GPUs
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
project_tag: "{{ env_type }}-{{ guid }}"
agnosticd_aws_capacity_reservation_enable: false

# -------------------------------------------------------------------
# Enable if the item is being deployed to a sandbox account
# and you want credentials provided to the user
# -------------------------------------------------------------------
sandbox_student_user: true

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds

# -------------------------------------------------------------------
# VM configuration
# -------------------------------------------------------------------
bastion_instance_type: t3.medium
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Security group
# -------------------------------------------------------------------
security_groups:
- name: BastionSG
  rules:
  - name: BasSSHPublic
    description: "SSH public"
    from_port: 22
    to_port: 22
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPPublic
    description: "HTTP public for Let's Encrypt verification"
    from_port: 80
    to_port: 80
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress
  - name: BasHTTPSPublic
    description: "HTTPS public for VSCode Server"
    from_port: 8443
    to_port: 8443
    protocol: tcp
    cidr: "0.0.0.0/0"
    rule_type: Ingress

# -------------------------------------------------------------------
# OpenShift Installer Version
# -------------------------------------------------------------------
ocp4_installer_version: "4.12.15"
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
master_instance_count: 3
master_instance_type: m5.2xlarge
worker_instance_count: 1
worker_instance_type: dl1.24xlarge

# -------------------------------------------------------------------
# OpenShift Base Domain (use cluster-{{ guid }}.sandboxXXX.opentlc.com
# instead of cluster-{{ guid }}.{{ guid }}.sandboxXXX.opentlc.com
# -------------------------------------------------------------------
ocp4_base_domain: "{{ sandbox_zone }}"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: lab-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------

# ocp4_network_type: OVNKubernetes

# Show kubeadmin password
ocp4_cluster_show_access_user_info: true

install_ftl: false

# -------------------------------------------------------------------
# Custom collections for this environment
# -------------------------------------------------------------------
requirements_content:
  collections:
  - name: kubernetes.core
    version: 2.3.1
  - name: openstack.cloud
    version: 1.7.2
  - name: amazon.aws
    version: 2.2.0
  - name: community.general
    version: 4.6.1
  - name: ansible.posix
    version: 1.3.0
  - name: awx.awx
    version: 21.1.0
  - name: community.okd
    version: 2.3.0

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
infra_workloads:
- ocp4_workload_authentication             # all segments
- ocp4_workload_habana_gaudi_gpu_setup
- ocp4_workload_pipelines
- ocp4_workload_gitea_operator
- ocp4_workload_rhods_self_managed
- ocp4_workload_web_terminal
- ocp4_workload_habana_post_rhods_setup
- ocp4_workload_le_certificates            # all segments

# Workload variables #
ocp4_workload_catalogsource_image: quay.io/gpte-devops-automation/olm_snapshot_redhat_catalog
ocp4_workload_catalogsource_tag: v4.12_2023_07_03

# ------------------------------------------------
# Kernel Module Management Operator
# ------------------------------------------------
kmm_operator_namespace: "openshift-kmm"
kmm_operator_channel: "stable"
kmm_operator_automatic_install_plan_approval: true
kmm_operator_starting_csv: "kernel-module-management.v1.1.1"
kmm_operator_wait_for_deploy: true
kmm_operator_use_catalog_snapshot: false
kmm_operator_catalogsource_name: ""
kmm_operator_catalog_snapshot_image: ""
kmm_operator_catalog_snapshot_image_tag: ""
kmm_ignition_version: "3.2.0"

# ------------------------------------------------
# Node Feature Discovery Operator
# ------------------------------------------------
nfd_operator_namespace: "openshift-nfd"
nfd_operator_channel: "stable"
nfd_operator_automatic_install_plan_approval: true
nfd_operator_starting_csv: "nfd.4.12.0-202307182142"
nfd_operator_wait_for_deploy: true
nfd_operator_use_catalog_snapshot: false
nfd_operator_catalogsource_name: ""
nfd_operator_catalog_snapshot_image: ""
nfd_operator_catalog_snapshot_image_tag: ""

# ------------------------------------------------
# Habana Gaudi Operator
# ------------------------------------------------
habana_gaudi_operator_namespace: "habana-ai-operator"
habana_gaudi_operator_channel: "stable"
habana_gaudi_operator_automatic_install_plan_approval: true
#habana_gaudi_operator_starting_csv: gpu-operator-certified.v23.6.0
habana_gaudi_operator_wait_for_deploy: true
habana_gaudi_operator_use_catalog_snapshot: false
habana_gaudi_operator_catalogsource_name: ""
habana_gaudi_operator_catalog_snapshot_image: ""
habana_gaudi_operator_catalog_snapshot_image_tag: ""
habana_gaudi_image_version: "1.10.0"
habana_gaudi_deviceplugin_version: "1.10.0"
habana_gaudi_driver_version: "1.10.0-494"
habana_gaudi_runtime_version: "1.10.0-494"
habana_gaudi_nodemetrics_version: "1.10.0-494"

# -------------------------------------------------------------------
# Workload: ocp4_workload_rhods_self_managed
# -------------------------------------------------------------------
ocp4_workload_rhods_self_managed_operator_group_name: "rhods-ods-operator"
ocp4_workload_rhods_self_managed_operator_name: "rhods-operator"
ocp4_workload_rhods_self_managed_namespace: "redhat-ods-operator"
ocp4_workload_rhods_self_managed_channel: "stable"
ocp4_workload_rhods_self_managed_catalogsource_setup: false
ocp4_workload_rhods_self_managed_installPlanApproval: "Automatic"
ocp4_workload_rhods_self_managed_source: "redhat-operators"
ocp4_workload_rhods_self_managed_sourceNamespace: "openshift-marketplace"
ocp4_workload_rhods_self_managed_csv_nameprefix: "rhods-operator"
ocp4_workload_rhods_self_managed_startingCSV: "rhods-operator.1.33.0"
ocp4_workload_rhods_self_managed_namespace_list:
- "{{ ocp4_workload_rhods_self_managed_namespace }}"
ocp4_workload_rhods_self_managed_applications_namespace: "redhat-ods-applications"
ocp4_workload_rhods_self_managed_is_workshop: false
ocp4_workload_rhods_self_managed_workshop_num_users: 25
ocp4_workload_rhods_self_managed_workshop_username_base: "user"
ocp4_workload_rhods_self_managed_workshop_password: "{{ student_password }}"

# Variable for ocp4_workload_object_detection_ai_ml_setup
rhods_username: "admin"
ocp4_workload_aiml_namespace: "{{ rhods_username }}-rhods-project"
ocp4_workload_gitea_aiml_user: lab-user
retail_rhods_project_gitea_password: b3BlbnNoaWZ0
retail_rhods_project_gitea_username: bGFiLXVzZXI=

# For ocp4_workload_aiml_edge_workshop
# Repo to clone for running the edge workload
ocp4_workload_aiml_edge_workshop_cluster_bootstrap_repo: "https://github.com/Enterprise-Neurosystem/cluster-bootstrap.git"
ocp4_workload_aiml_edge_workshop_cluster_bootstrap_repo_branch: main

# For ocp4_workload_le_certificates
# Install certificates for Ingress Controllers
ocp4_workload_le_certificates_install_certificates: true

# Install certificates for API Endpoint
ocp4_workload_le_certificates_install_api: true

# Option allow continue without certificates on failure
ocp4_workload_le_certificates_failure_is_fatal: true

# It takes about 4 minutes per API Server to
# restart with certificates (due to AWS
# Load Balancer). Therefore sleep
# 12 minutes by default to give the kube-apiserver
# cluster operator enough time to progress.
# Wait time may be extended if it's needed
ocp4_workload_le_certificates_wait_after_cert_setup: 12

# ---------------------------------------------------------
# Workload: ocp4_workload_pipelines
# ---------------------------------------------------------
ocp4_workload_pipelines_channel: pipelines-1.10

ocp4_workload_pipelines_use_catalog_snapshot: true
ocp4_workload_pipelines_catalog_snapshot_image: "{{ ocp4_workload_catalogsource_image }}"
ocp4_workload_pipelines_catalog_snapshot_image_tag: "{{ ocp4_workload_catalogsource_tag }}"

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    nodecount: ''

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 1304e3f7-9cdc-43ca-86f9-f56cccc30d3a
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: >-
      RHODS on OCP on AWS with Habana Intel Gaudi Accelerators
    category: Demos
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp412
    - ods
    - datascience
    - rhods
    - object
    - detect
    - retail
    multiuser: false
    parameters:
    - name: num_users
      description: >-
        Number of users to provision within the cluster.
      formLabel: OpenShift User Count
      openAPIV3Schema:
        type: integer
        default: 2
        minimum: 2
    - name: aws_region
      description: AWS Region to Provision Environment.
      formLabel: Region
      openAPIV3Schema:
        default: us-east-1
        type: string
        enum:
        - us-east-1
        - us-west-2
    labels:
      Product: Red_Hat_OpenShift_Data_Science
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
  secrets:
  - namespace: gpte
    name: satellite-rhel81-ha
  - namespace: gpte
    name: ocp4-token
  - namespace: gpte
    name: rhods-git-secret
