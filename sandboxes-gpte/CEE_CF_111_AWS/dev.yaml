---
# -------------------------------------------------------------------
# Purpose - Cost tag. One of development, ilt, production, event
# -------------------------------------------------------------------
purpose: development

# -------------------------------------------------------------------
# VM configuration (3 Node Cluster of only Masters)
# -------------------------------------------------------------------
master_instance_type: m5.xlarge
master_instance_count: 3
worker_instance_type: m5.2xlarge
worker_instance_count: 0
bastion_instance_type: t3.medium
bastion_instance_image: RHEL82GOLD-latest


update_packages: false
# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------
agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_ref: development
  secrets:
  # OpenShift Pull Secret
  - ocp4_token
  # Satellite Configuration
  - satellite-rhel81-ha
  - gpte
  - output-dir-s3
