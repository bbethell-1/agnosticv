---
#include /includes/aws-sandbox-meta.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/aws-region.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/ansible_control_plane/controller.aap5nack2i7p6mie.ansiblecloud.redhat.com.yaml

# ------------------------------------------------------------------
# RHPDS > Openshift Workshop > APIs For Data Protection (OADP)
# ------------------------------------------------------------------

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: rhpds
#smoke_tests: false

# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
ocp4_installer_version: "4.8"

# -------------------------------------------------------------------
# Machine Count
# -------------------------------------------------------------------

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"
bastion_instance_image: RHEL84GOLD-latest

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
# --- Student User on Bastion
install_student_user: true
# --- student_name not set -> Requestor User ID is used as student_name
student_name: demo-user
# --- student_password not set -> generate random password
# student_password: r3dh4t1!
# --- Student is allowed to sudo and switch to root
student_sudo: true

# --- Student Workloads (YAML List)
student_workloads: []

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: cluster-mgr
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_admin_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_base: user
# When no password specified it is generated
ocp4_workload_authentication_htpasswd_user_password: "{{ common_password }}"
ocp4_workload_authentication_htpasswd_user_count: "{{ num_users | default('1') }}"
#ocp4_workload_authentication_remove_kubeadmin: false

# -------------------------------------------------------------------
# Common Password
# -------------------------------------------------------------------
common_password: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"

# -------------------------------------------------------------------
# Other Variables
# -------------------------------------------------------------------
##The below variable will be false for most non-training environments.
#install_opentlc_integration: false
#install_ipa_client: false
install_ftl: false

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite

# Update RHEL to the latest packages (and reboot)
update_packages: true

# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
# -------------------------------------------------------------------

infra_workloads:
- ocp4_workload_authentication
- ocp4-workload-ocs-poc
- ocp4-workload-oadp

# -------------------------------------------------------------------
# OCS deployment variables
# -------------------------------------------------------------------

ocs_operator_source: "redhat-operators"
ocs_operator_source_namespace: "openshift-marketplace"
ocs_namespace: openshift-storage
ocs_migstorage_namespace: openshift-storage
ocs_mcg_pv_pool_bucket_name: migstorage
ocs_migstorage: true
ocs_operator_workload_destroy: false
ocs_channel: stable-4.8

ocs_mcg_core_cpu: 200m
ocs_mcg_db_cpu: 200m
ocs_mcg_core_mem: 1Gi
ocs_ceph_mds_cpu: 200m
ocs_ceph_mon_cpu: 200m
ocs_ceph_mgr_cpu: 200m
ocs_ceph_osd_cpu: 200m

ocs_expected_crds:
- backingstores.noobaa.io
- bucketclasses.noobaa.io
- noobaas.noobaa.io
- objectbucketclaims.objectbucket.io
- objectbuckets.objectbucket.io

archive_dir: "{{ output_dir | dirname }}/archive"

# -------------------------------------------------------------------
# AgnosticV meta variables
# -------------------------------------------------------------------

agnosticv_meta:
  sandboxed: false
  deploy_with: babylon
  params_to_variables:
    username: student_name

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift APIs For Data Protection
    category: Workshops
    keywords:
    - workshop
    - openshift
    - ocp
    - ocp48
    labels:
      #OpenShift_Version: "4.8"
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: Software_Engineering_OpenShift
    multiuser: true
    parameters: []
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
  secrets:
  - name: ocp4-token
    namespace: gpte
  - name: satellite-rhel81-ha
    namespace: gpte
  - name: output-dir-s3
    namespace: gpte
