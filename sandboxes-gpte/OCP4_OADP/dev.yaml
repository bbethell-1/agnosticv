---
purpose: development
cloudformation_retries: 0

infra_workloads:
- ocp4_workload_authentication
- ocp4-workload-ocs-poc
- ocp4-workload-oadp

# --------------------------------------------------------------------
# AWS Specific
# --------------------------------------------------------------------
master_instance_type_family: c6in
master_instance_type_size: >-
  {{ '2xlarge' if worker_instance_count|int <= 10
  else '4xlarge' if worker_instance_count|int <= 20
  else '8xlarge'
  }}
master_instance_type: "{{ master_instance_type_family }}.{{ master_instance_type_size\
  \ }}"

master_storage_type: >-
  {{ 'io1' if worker_instance_count|int >= 10
  else 'gp3' }}
worker_instance_type: "m5a.4xlarge"
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max\
  \ }}"
# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------

ocp4_installer_version: "4.11.36"
ocs_channel: stable-4.8

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

#Adding Meta Data

__meta__:
  deployer:
    scm_url: https://github.com/migtools/agnosticd.git
    scm_ref: development
