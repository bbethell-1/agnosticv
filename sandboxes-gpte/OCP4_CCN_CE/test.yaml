---
purpose: rhpds-test
cloudformation_retries: 0

ocp4_installer_version: 4.10.3

master_instance_type: m5.2xlarge
master_instance_count: 3
worker_instance_type: m5.4xlarge

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
      - name: module_type
        description: Semicolon-seperated list of Modules to Enable
        formLabel: Module
        required: true
        openAPIV3Schema:
          default: m1;m2;m3;m4
          type: string
  deployer:
    git_tag_prefix: ocp48-ccn-test
    type: agnosticd
    virtualenv: ansible2.9-python3.6-2021-11-30
