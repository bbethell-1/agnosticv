---
agnosticv_meta:
  agnosticd_git_repo: https://github.com/redhat-cop/agnosticd

  #params_to_variables:
  #  <bash-parameter/argument>: <ansible-var>

  params_to_variables:
    guid: guid
    email: email
    basesuffix: subdomain_base_suffix
    ocprelease: osrelease
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    letsencrypt: install_lets_encrypt_certificates
    letsencrypt_production: lets_encrypt_production
    nodecount: worker_instance_count
    num_users: num_users
    cloudtags: cloud_tags
    ipapass: ipa_host_password
    user: student_name
    course: course_name
    serviceid: serviceid
    uuid: uuid
    callbackurl: agnosticd_callback_url

  scheduler:
    # Scheduling with AgnosticS is disable by default and should be enabled per catalog item
    enable: false
    # The AgnosticS Production scheduler
    url: https://agnostics-agnostics.apps.ocp-us-east-1.infra.open.redhat.com
    # The endpoint for scheduling a deployment
    endpoint: /api/v1/schedule
    # Always add the UUID of the deployment to the requests to the scheduler
    data:
      uuid: "{{ uuid }}"
      annotations:
        guid: "{{ guid }}"
        env_type: "{{ env_type }}"
        email: "{{ email | default('') }}"
        student_name: "{{ student_name | default('') }}"
        purpose: "{{ purpose | default('') }}"
