---
#include /includes/ssh-access.yaml

agnosticv_meta:
  agnosticd_git_repo: https://github.com/redhat-cop/agnosticd

  #params_to_variables:
  #  <bash-parameter/argument>: <ansible-var>

  params_to_variables:
    guid: guid
    email: email
    basesuffix: subdomain_base_suffix
    ocprelease: osrelease
    infra_workloads: infra_workloads
    student_workloads: student_workloads
    letsencrypt: install_lets_encrypt_certificates
    letsencrypt_production: lets_encrypt_production
    nodecount: worker_instance_count
    num_users: num_users
    cloudtags: cloud_tags
    ipapass: ipa_host_password
    user: student_name
    course: course_name
    serviceid: serviceid
    uuid: uuid
    callbackurl: agnosticd_callback_url
    ocp4_fips_enable: ocp4_fips_enable

  scheduler:
    # Scheduling with AgnosticS is disable by default and should be enabled per catalog item until they all use it.
    enable: false
    # The AgnosticS Production scheduler
    url: https://agnostics.apps.open.redhat.com

    # The endpoint for scheduling a deployment
    endpoint: /api/v1/schedule
    # Always add the UUID of the deployment to the requests to the scheduler
    data:
      uuid: "{{ uuid }}"
      annotations:
        guid: "{{ guid }}"
        env_type: "{{ env_type }}"
        email: "{{ email | default('') }}"
        student_name: "{{ student_name | default('') }}"
        purpose: "{{ purpose | default('') }}"

__meta__:
  deployer:
    scm_type: git
    scm_url: https://github.com/redhat-cop/agnosticd.git
    type: agnosticd

  scheduler:
    # Scheduling with AgnosticS is disable by default and should be enabled per catalog item until they all use it.
    enable: false
    # Always add the UUID of the deployment to the requests to the scheduler
    data:
      uuid: "{{ uuid }}"
      annotations:
        guid: "{{ guid }}"
        env_type: "{{ env_type }}"
        email: "{{ email | default('') }}"
        student_name: "{{ student_name | default('') }}"
        purpose: "{{ purpose | default('') }}"

  # Include scheduler secrets for url, username, password
  secrets:
  - name: agnostics-api-mgr-access
    var: agnostics_mgr_access
  - name: gpte-db
    namespace: gpte
    var: gpte_db
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials

  tower:
    organization: gpte

# gucore 2020-12-08
# SWARM, disable FTL, incident pyvenv not working
install_ftl: false
#ftl_injector_tag: ''
