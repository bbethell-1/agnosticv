---
#include /includes/ssh-access.yaml

ocp4_installer_root_url: https://mirror.openshift.com/pub/openshift-v4/clients

__meta__:
  # Default assign anarchy namespaces by asset uuid.
  # Eventually this should move to an override so that each cluster determines how to distribute its anarchy load
  # rather than being configured in this repository.
  anarchy:
    namespace: babylon-anarchy-{{ (asset_uuid | uuid2int) % 8 }}

  deployer:
    scm_type: git
    scm_url: https://github.com/redhat-cop/agnosticd.git
    type: agnosticd

  scheduler:
    # Scheduling with AgnosticS is disable by default and should be enabled per catalog item until they all use it.
    enable: false
    # Always add the UUID of the deployment to the requests to the scheduler
    data:
      uuid: "{{ uuid }}"
      annotations:
        guid: "{{ guid }}"
        env_type: "{{ env_type }}"
        purpose: "{{ purpose | default('') }}"

  # Include scheduler secrets for url, username, password
  secrets:
  - name: agnostics-api-mgr-access
    var: agnostics_mgr_access
  - name: gpte-db
    namespace: gpte
    var: gpte_db
  - name: gpte-vault-0
    namespace: gpte
    var: vault_credentials

  tower:
    organization: gpte

# gucore 2020-12-08
# SWARM, disable FTL, incident pyvenv not working
install_ftl: false
#ftl_injector_tag: ''
