---
#include /includes/catalog-icon-rhibm.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/open-environment-annotation-hidden.yaml
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/secrets/account_assignment_api.yaml

# The agnosticd config to use
env_type: sandbox

agnosticd_open_environment: True

student_name: "{{ requester_username if requester_username is defined and requester_username | length else user }}"

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: d891cc61-1506-4acf-a5a0-e515c758ecbd
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM Public Cloud Blank Open Environment
    category: Open_Environments
    keywords: []
    labels:
      Product_Family: Red_Hat_Cloud
#     Product:
      Provider: RHDP
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 999h
    maximum: 999h

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.0
      pull: missing
