---
cloud_provider: ibm
region: us-south

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | d('unknown') }}"
  purpose: "{{ purpose | d('unknown') }}"

# Babylon
__meta__:
  # Enable GPTE reporting to the Provisions DB, for cost management
  secrets:
    - name: gpte-db
      namespace: gpte
      var: gpte_db
  tower:
    organization: gpte
