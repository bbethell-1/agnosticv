---
cloud_provider: ibm
region: us-south

cloud_tags:
  env_type: "{{ env_type }}"
  platform: "{{ platform | d('unknown') }}"
  purpose: "{{ purpose | d('unknown') }}"

__meta__:
  secrets:
    # This secret contains the creds necessary to talk to pool of sandboxes (dynamoDB)
    # see readme in https://github.com/redhat-gpte-devopsautomation/babylon_aws_sandbox
    # to know what variables to set.
    - namespace: gpte
      name: ibm-sandbox
