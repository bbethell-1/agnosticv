---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-instructlab.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml
#include /includes/secrets/ibm-instructlab.yaml
#include /includes/parameters/student-email.yaml

cloud_provider: none
env_type: minimal

agnosticd_passthrough_user_data:
  ibm_console_url: https://cloud.ibm.com/authorize/a7793fc96f8340ebb72a63a8238f2e61

# set timeout for 6 hours - Taylor Smith request for ETX 2025-01-16

ibm_saml_login_timeout: 21600

requirements_content:
  collections:

    - name: ibm.cloudcollection
      version: 1.51.0

# --------------------------------------------------------------------
# Infra Workloads
# --------------------------------------------------------------------

infra_workloads:
  - hosts: localhost
    name: agnosticd.ibm.ibm_instructlab_service

# --------------------------------------------------------------------
# Destroy Workloads
# --------------------------------------------------------------------

destroy_workloads:
  localhost:

    - agnosticd.ibm.ibm_instructlab_service

__meta__:
  access_control:
    allow_groups:
      - instructlab-demo-poc-group
  lifespan:
    default: 99d
    maximum: 180d
    relativeMaximum: 99d
  runtime:
    default: 9999h
    maximum: 9999h
  anarchy:
    namespace: babylon-anarchy-gpte

  asset_uuid: 79fe177f-0d4f-4082-aee9-15ad4da39eae
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com


  catalog:
    display_name: Red Hat AI InstructLab Service (IBM)
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - ibm
      - instructlab
      - ai
      - rhai
      - ilab
    labels:
      Provider: RHDP
    parameters: []

  deployer:
    actions:
      destroy:
        disable: false
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:temporary-pr-8997
      pull: missing
