---
#include /includes/ansible_control_plane/current_controller.yaml
#include /includes/catalog-icon-instructlab.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/terms-of-service.yaml

cloud_provider: none
env_type: test-empty-config

agnosticd_passthrough_user_data:
  ibm_console_url: https://cloud.ibm.com/authorize/a7793fc96f8340ebb72a63a8238f2e61

__meta__:
  access_control:
    allow_groups:
      - instructlab-demo-poc-group

  anarchy:
    namespace: babylon-anarchy-gpte

  asset_uuid: 79fe177f-0d4f-4082-aee9-15ad4da39eae

  catalog:
    display_name: Red Hat AI InstructLab Service (IBM)
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
      - ibm
      - instructlab
      - ai
      - rhai
      - ilab
    labels:
      Provider: RHDP
    parameters: []

  deployer:
    actions:
      destroy:
        disable: true
      start:
        disable: true
      status:
        disable: true
      stop:
        disable: true
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
  owners:
    maintainer:
      - name: Tony Kay
        email: ankay@redhat.com
    sme:
      - name: Tony Kay
        email: ankay@redhat.com
      - name: Grant Shipley
        email: gshipley@redhat.com
      - name: Taylor Smith
        email: tasmith@redhat.com
    stakeholder:
      - name: Grant Shipley
        email: gshipley@redhat.com
    instructions:
      - name: Grant Shipley
        email: gshipley@redhat.com
