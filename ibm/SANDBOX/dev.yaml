---
purpose: development

# Enable UI access to IBM Cloud
sandbox_enable_ui: true

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4

__meta__:
  access_control:
    view_only_groups:
      - identity-provider.summit
      - identity-provider.sso
      - babylon-admins
      - babylon-devs
      - babylon-summit-devs
  deployer:
    scm_ref: development
    scm_url: 'https://github.com/stencell/agnosticd.git'
