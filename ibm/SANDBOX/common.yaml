---
# The agnosticd config to use
env_type: sandbox

agnosticv_meta:
  secrets:
  - account_assignment_api
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: gpte
    parameters:
    - name: student_name
    - name: email
  secrets:
  - namespace: gpte
    name: account-assignment-api
