---
# The agnosticd config to use
env_type: sandbox

agnosticv_meta:
  secrets:
  - account_assignment_api
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: AWS Blank Open Environment
    category: Workshops
    icon:
      alt: "Cloud Native"
      url: "https://gpte-public.s3.amazonaws.com/babylon-catalog/Cloud_Native.svg"
    keywords:
    - aws
    - sandbox
    - empty
    - cloud
    labels:
      #OpenShift_Version: "4.9"
      Product: Amazon_Web_Services
      #Product_Family: Red_Hat_Cloud
    parameters:
    - name: student_name
    - name: email
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
  - namespace: gpte
    name: account-assignment-api
