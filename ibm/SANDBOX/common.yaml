---
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml

# The agnosticd config to use
env_type: sandbox

agnosticv_meta:
  secrets:
  - account_assignment_api
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM Public Cloud Blank Open Environment
    category: OPEN_Environments
    keywords: []
    labels:
      Product: IBM_Public_Cloud
    parameters:
    - name: student_name
    - name: email
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 999h
    maximum: 999h
  secrets:
  - namespace: gpte
    name: account-assignment-api
