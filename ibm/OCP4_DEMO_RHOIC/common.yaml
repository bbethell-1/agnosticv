---
#include /includes/catalog-icon-rhibm.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/secrets/account_assignment_api.yaml

# The agnosticd config to use
env_type: ibm-rhoic

agnosticd_open_environment: true

email: "{{ requester_email }}"
student_name: "{{ requester_username }}"

rhoic_openshift_version_parameter: "4.15"
rhoic_openshift_version_major: >-
  {{ rhoic_openshift_version_parameter.split('.')[0] }}
rhoic_openshift_version_minor: >-
  {{ rhoic_openshift_version_parameter.split('.')[1] }}

__meta__:
  asset_uuid: fdf0ee45-ff2b-46a6-b509-8c26eb131303
  owners:
    maintainer:
      - name: Judd Maltin
        email: jmaltin@redhat.com

  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM with RHOIC Open Environment
    category: Open_Environments
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_on_IBM_Cloud
      Provider: RHDP
    parameters:
      - name: rhoic_openshift_version_parameter
        description: OpenShift Version
        formLabel: OpenShift Version
        openAPIV3Schema:
          type: string
          default: "4.15"
          enum:
            - "4.12"
            - "4.13"
            - "4.14"
            - "4.15"

    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.1.2
      pull: missing
