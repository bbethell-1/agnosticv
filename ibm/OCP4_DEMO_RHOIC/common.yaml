---
#include /includes/catalog-icon-rhibm.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/ansible_control_plane/current_controller.yaml


# The agnosticd config to use
env_type: ibm-rhoic

agnosticd_open_environment: True

email: "{{ requester_email }}"
student_name: "{{ requester_username }}"

agnosticv_meta:
  deploy_with: babylon

__meta__:
  asset_uuid: fdf0ee45-ff2b-46a6-b509-8c26eb131303
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM with RHOIC Open Environment
    category: Open_Environments
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_on_IBM_Cloud
      Provider: RHDP
    parameters: []
  secrets:
  - namespace: gpte
    name: account-assignment-api

  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:v0.0.17
      pull: missing
