---
#include /includes/catalog-icon-aws.yaml
#include /includes/access-restriction.yaml

# The agnosticd config to use
env_type: ibm-rhoic

agnosticv_meta:
  secrets:
  - account_assignment_api
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

__meta__:
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM Public Cloud + OCP
    category: Open_Environments
    parameters:
    - name: student_name
    - name: email
  secrets:
  - namespace: gpte
    name: account-assignment-api
