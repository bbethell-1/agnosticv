---
#include /includes/catalog-icon-rhibm.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/requester_email.yaml
#include /includes/parameters/requester_username.yaml

# The agnosticd config to use
env_type: ibm-rhoic

agnosticd_open_environment: True

email: "{{ requester_email }}"
student_name: "{{ requester_username }}"

agnosticv_meta:
  secrets:
  - account_assignment_api
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

__meta__:
  anarchy:
    namespace: anarchy-operator
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: IBM with RHOIC Open Environment
    category: Open_Environments
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OpenShift_on_IBM_Cloud
      Provider: RHPDS
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-01-22
  secrets:
  - namespace: gpte
    name: account-assignment-api
