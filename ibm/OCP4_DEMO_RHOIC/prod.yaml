---
purpose: production

# Enable UI access to IBM Cloud
sandbox_enable_ui: true

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999

__meta__:
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    parameters:
    - name: email
  deployer:
    scm_url: https://github.com/redhat-cop/agnosticd.git
    scm_type: git
    scm_ref: ocp4-demo-rhoic-prod-1.2
    type: agnosticd
