---
#include /includes/catalog-icon-gcp.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/student-email.yaml
#include /includes/parameters/requester_username.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/lifetime-standard.yaml
# -------------------------------------------------------------------
# --- Catalog: Red Hat Open Environments
# --- Catalog Item: GCP Blank Open Environment
# -------------------------------------------------------------------

platform: RHPDS

env_type: open-environment-gcp

agnosticd_open_environment: True

cloud_provider: gcp

agnosticv_meta:
  secrets:
  - gcp
  idle_after_deploy: 9999
  idle_after_start: 9999
  babylon:
    kubeconfig: babylon-prod.kubeconfig
  deploy_with: babylon
  virtualenv: babylon

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  anarchy:
    namespace: babylon-anarchy-sandboxes-gpte
  deployer:
    virtualenv: gcp_open_envs-ansible2.9-python3.6-2022-04-11
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: GCP Blank Open Environment
    category: Open_Environments
    keywords:
    - workshop
    - gcp
    - open
    - openenv
    - gcpopen
    labels:
      Product_Family: Red_Hat_Cloud
      Product: Red_Hat_OPEN_Environments
      Provider: PFE
  secrets:
  - name: gcp
    namespace: gpte
