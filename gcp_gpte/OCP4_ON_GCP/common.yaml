---
#include /includes/parameters/enable-lets-encrypt.yaml
#include /includes/catalog-icon-gcp.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/lifetime-standard.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/gcp-region.yaml

platform: RHPDS

env_type: ocp4-cluster

# Enable this if you want to create a user on the bastion
# Mutually exclusive with {{ install_ipa_client }}
install_student_user: true

# This should be overwritten based on the user ordering the catalog item
# It will be used by the bastion-student-user role and created on the bastion
student_name: lab-user

# Enable this if you want to use IPA for user authentication.
# Mutually exclusive with {{ install_student_user }}
install_ipa_client: false

# FTL is used for grading and solving. It will pull in the external ftl-injector role.
# This might be enabled when we have solvers to run or graders for ILT
install_ftl: false

# What we use in this environment to get the packages we need
repo_method: satellite

software_to_deploy: openshift4

# Google Cloud Platform specific vars
# account, auth_type, credentials, and project id are all passed by a secret
# output_dir also needs to be passed in by RHPDS or destroy has a bug
cloud_provider: gcp
remote_user: gcpuser
ansible_user: gcpuser

# OpenShift 4 (ocp4-cluster) specific vars
cluster_dns_zone: gcp.redhatworkshops.io
ocp4_base_domain: "{{ cluster_dns_zone }}"

# Authentication
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_password: openshift
ocp4_workload_authentication_htpasswd_user_count: 50
ocp4_workload_authentication_admin_user: admin
ocp4_workload_authentication_remove_kubeadmin: false

# Use Let's Encrypt Prod certificates
# After the role is updated this can be enabled
lets_encrypt_production: false

# --- Infra Workloads (YAML List)
infra_workloads:
- ocp4_workload_authentication
# - ocp4_workload_le_certificates

# --- Student Workloads (YAML List)
student_workloads: []

agnosticv_meta:
  deploy_with: babylon
  virtualenv: babylon
  # ansible_additional_args: -vvv
  params_to_variables:
    username: student_name
  secrets:
  - ocp4_token
  - satellite-rhel8-latest-ha
  idle_after_deploy: 9999
  idle_after_start: 9999

__meta__:
  anarchy:
    namespace: babylon-anarchy-gcp-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 on Google Cloud Platform
    category: Workshops
    keywords:
    - workshop
    - openshift
    - google
    - gcp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    multiuser: true
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
  secrets:
  - namespace: gpte
    name: ocp4_token
  - namespace: gpte
    name: satellite-rhel8-latest-ha
  - namespace: gpte
    name: output-dir-s3
  - namespace: gpte
    name: gpte_gcp
  lifespan:
    default: 2d
    maximum: 999d
    relativeMaximum: 7d
  runtime:
    default: 9999h
    maximum: 9999h
