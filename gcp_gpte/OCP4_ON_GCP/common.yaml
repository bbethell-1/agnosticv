# -------------------------------------------------------------------
# AgnosticV includes
# -------------------------------------------------------------------

#include /includes/catalog-icon-gcp.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/parameters/num-users-salesforce.yaml
#include /includes/parameters/gcp-region.yaml
#include /includes/parameters/ocp4-fips-enable.yaml
#include /includes/parameters/open-environment-annotation.yaml
#include /includes/parameters/agnosticd_open_environment.yaml
#include /includes/parameters/student-email.yaml
#include /includes/secrets/gpte-gcp.yaml
#include /includes/secrets/ocp4_token.yaml
#include /includes/secrets/demosat-rhel-8-and-9-latest.yaml
#include /includes/secrets/zerossl.yaml
# -------------------------------------------------------------------
# Mandatory Variables
# -------------------------------------------------------------------
env_type: ocp4-cluster
software_to_deploy: openshift4
cloud_provider: gcp

# -------------------------------------------------------------------
# Platform
# -------------------------------------------------------------------
platform: RHPDS

# -------------------------------------------------------------------
# OpenShift Version
# -------------------------------------------------------------------
ocp4_installer_root_url: http://mirror.openshift.com/pub/openshift-v4/clients
ocp4_installer_version: "4.20"

# -------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------
repo_method: satellite
update_packages: true

# -------------------------------------------------------------------
# Default Networking Stack
# -------------------------------------------------------------------
ocp4_network_type: OVNKubernetes

# -------------------------------------------------------------------
# Student User on Bastion
# -------------------------------------------------------------------
install_student_user: true
student_name: lab-user
student_sudo: true

# -------------------------------------------------------------------
# GCP Specific
# -------------------------------------------------------------------
# Google Cloud Platform specific vars
cluster_dns_zone: "{{ guid }}.gcp.redhatworkshops.io"
ocp4_base_domain: "{{ cluster_dns_zone }}"
gcp_credentials: "{{ gcp_credentials_raw }}"

# Bastion Image
gcp_rhel_image_family: rhel-9

master_instance_type_family: n2-standard
master_instance_type_size: >-
  {{ '8' if worker_instance_count|int <= 10
  else '16' if worker_instance_count|int <= 20
  else '32'
  }}
master_instance_type: "{{ master_instance_type_family }}-{{ master_instance_type_size }}"

worker_instance_type: n2-standard-4
worker_instance_count: "{{ [(num_users | int / 5) | round(0, 'ceil') | int, 3] | max }}"

# -------------------------------------------------------------------
# Workloads
# -------------------------------------------------------------------
# --- Infra Workloads (YAML List)
infra_workloads:
  - ocp4_workload_authentication
  - ocp4_workload_cert_manager

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication
# -------------------------------------------------------------------
ocp4_workload_authentication_idm_type: htpasswd
ocp4_workload_authentication_admin_user: admin
# Generate admin password
ocp4_workload_authentication_htpasswd_admin_password: ""
ocp4_workload_authentication_htpasswd_admin_password_length: 16
ocp4_workload_authentication_htpasswd_user_base: user
# Generate user password
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_user_password: ""
ocp4_workload_authentication_htpasswd_user_password_length: 16
ocp4_workload_authentication_htpasswd_user_count: "{{ (num_users | default('1')) | int }}"
ocp4_workload_authentication_remove_kubeadmin: true

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_cloud_provider: "{{ cloud_provider}}"

ocp4_workload_cert_manager_gcp_project_id: "{{ gcp_project_id }}"
ocp4_workload_cert_manager_gcp_credentials: "{{ gcp_credentials }}"

ocp4_workload_cert_manager_channel: stable-v1.18
ocp4_workload_cert_manager_use_catalog_snapshot: false
ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

ocp4_workload_cert_manager_ignore_errors: true

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: 69aafe50-509f-480a-b4e7-ccb46fd6fc1d
  owners:
    maintainer:
      - name: Wolfgang Kulhanek
        email: wkulhanek@redhat.com

  anarchy:
    namespace: babylon-anarchy-gcp-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 on Google Cloud Platform
    category: Workshops
    keywords:
      - workshop
      - openshift
      - google
      - gcp
    labels:
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    multiuser: true
    parameters: []
    reportingLabels:
      primaryBU: Hybrid_Platforms
  deployer:
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
