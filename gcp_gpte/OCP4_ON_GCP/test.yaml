---
purpose: rhpds-test

install_lets_encrypt_certificates: false

# OpenShift Installer Version
ocp4_installer_version: "4.7.1"

agnosticv_meta:
  idle_after_deploy: 4
  idle_after_start: 4
  agnosticd_git_tag_prefix: ocp4-on-gcp-test
  virtualenv: babylon
  deploy_with: babylon
  params_to_variables:
    username: student_name
  secrets:
  - gpte_gcp
  - ocp4_token
  - gpte
__meta__:
  catalog:
    namespace: gpte
    parameters:
    - name: student_name
  deployer:
    virtualenv: gcp-ansible-2.9
    git_tag_prefix: ocp4-on-gcp-test
  secrets:
  - namespace: gpte
    name: gpte_gcp
  - namespace: gpte
    name: gpte
  - namespace: gpte
    name: ocp4_token
