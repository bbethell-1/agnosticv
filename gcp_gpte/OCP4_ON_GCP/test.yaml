---
#include /includes/catalog-icon-gcp.yaml
#include /includes/parameters/salesforce-id.yaml
#include /includes/parameters/purpose.yaml
#include /includes/terms-of-service.yaml
#include /includes/parameters/lifetime-standard.yaml
#include /includes/parameters/num-users-salesforce.yaml

purpose: rhpds-test

install_lets_encrypt_certificates: false

# OpenShift Installer Version
ocp4_installer_version: "4.9"

agnosticv_meta:
  idle_after_deploy: 9999
  idle_after_start: 9999
  agnosticd_git_tag_prefix: ocp4-on-gcp-test
  virtualenv: babylon
  deploy_with: babylon
  secrets:
  - gpte_gcp
  - ocp4_token
  - satellite-rhel8-latest-ha
  babylon:
    kubeconfig: babylon-prod.kubeconfig

__meta__:
  anarchy:
    namespace: babylon-anarchy-gcp-gpte
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: OpenShift 4 on Google Cloud Platform
    category: Workshops
    keywords:
    - workshop
    - openshift
    - google
    - gcp
    labels:
      ##OpenShift_Version: "4.10"
      Product: Red_Hat_OpenShift_Container_Platform
      Product_Family: Red_Hat_Cloud
      Provider: RHPDS
    multiuser: true
    parameters: []
  deployer:
    virtualenv: ansible2.9-python3.6-2021-11-30
    git_tag_prefix: ocp4-on-gcp-test
  secrets:
  - namespace: gpte
    name: gpte_gcp
  - namespace: gpte
    name: ocp4_token
  - namespace: gpte
    name: satellite-rhel8-latest-ha
