---
cloud_provider: gcp

cloud_tags:
  env_type: "{{ env_type }}"
  #guid: "{{ guid }}"
  #course_name: "{{ course_name | d('unknown') }}"
  platform: "{{ platform | d('unknown') }}"
  #purpose: "{{ purpose | d('unknown') }}"

agnosticv_meta:
  secrets:
    - gpte_gcp
  params_to_variables:
    hostedzoneid: HostedZoneId
    region: gcp_region
    platform: platform
    course_id: course_name
    appversion: ig_version
